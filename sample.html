怎么退回：复核意见写进同一份文档的批注，修改后重新走一遍，不口头放行。\n\n■ 四、留痕与问责\n1. 留痕：每次分析的脱敏前后样本存 `产品部/AI使用记录/YYYY-MM`，保留 6 个月。\n2. 回滚：发现对外材料含未脱敏信息，2 小时内下架并同步渠道；24 小时内出书面说明。\n3. 问责：直接操作人为第一责任人，复核人为第二责任人；owner：产品部负责人。\n4. 复核节奏：每月抽查 5 份记录，抽查结果进部门月度复盘。", "rubric": ["禁止清单精确到字段名（手机号/收货地址/订单号/支付流水/供货价），不写「敏感数据」这种笼统词", "允许清单 ≥3 条，每条写清适用场景与产出用途，能让人照着用而不用再问", "复核动作写明「谁复核、看什么、不通过怎么退回」，不是一个「需审核」就完事", "有留痕与回滚：记录存哪、存多久、错误输出多久内撤回，且写明 owner"]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "业务 VP 质疑「AI 会不会让团队失控」", "video": {"dur": "3.2min", "script": ["向上汇报 AI 提效，最怕答不出「出了事怎么办」", "向上沟通三件套（结论 / 依据 / 边界）", "VP 的三个真实担忧：数据、质量、人"]}, "ppt": {"method": "向上沟通三件套（结论 / 依据 / 边界）", "case": "VP 的三个真实担忧：数据、质量、人", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "objective": "能在 VP 三轮追问下用「结论—依据—边界」答出风险兜底，不回避也不空谈", "transfer": "把陪练里被追问最狠的那个问题，写进汇报材料第 2 页的「风险与兜底」", "vslides": [{"t": "陪练说明：VP 只问三件事", "n": "接下来是向上沟通的陪练，对手是业务 VP。他关心三件事：省多少钱、出了事谁负责、团队会不会废掉。技术细节他不听，你讲得越细他越怀疑。回答的基本结构是结论、依据、边界：先给一句能记住的结论，再给可核算的依据，最后主动划出你不承诺的部分。尤其注意最后一条——主动说「这件事我不敢保证零风险，但我保证有拦截点和留痕」，比拍胸脯说「绝对没问题」可信得多，因为 VP 见过太多拍胸脯的项目。他真正在测的不是你对 AI 有多懂，而是你有没有想过失败的样子：出错的概率有多大、错了能多快发现、发现后怎么收场。这三个问题答得清楚，他反而更愿意给你空间。还有一点要提前想好：他不会只问一次，第二遍通常会换个问法追问同一件事，看你是不是背稿。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">向上沟通三件套</tspan></text><g data-k=\"结论一句话\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">结论一句话</tspan></text></g><g data-k=\"依据可核算\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">依据可核算</tspan></text></g><g data-k=\"边界主动划\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">边界主动划</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 64.34}, {"t": "他会问什么：四个高频问题", "n": "四个高频问题。第一，提效一年省多少人力，这个数怎么算出来的？第二，AI 出了错客户投诉到你那，我找谁，流程哪一步能拦住？第三，团队会不会变懒，新人还学不学基本功？第四，下个月真出事，你这套规范能证明我们尽到管理责任吗？第一问的坑是拍脑袋报大数，正确做法是给可核算口径：三个人每周各花三小时写周报，压到四十分钟，一年折多少工时，然后说明这是估算、试点后会实测。第三问要给出动作而不是态度。第二问的正确答法是直接报拦截点：文案过广告法词表由法务拦、口径类结论由数据合规拦、对外材料由部门负责人签字拦，三道里任意一道都能在客户看到之前把错误截下来。第三问要诚实：新人确实容易跳过基本功，所以规范里要写死一条——先用自己手写一版，再拿 AI 产出对照，差异写进复盘。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"省多少人力、口径怎么算\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">省多少人力、口径怎么算</tspan></text></g><g data-k=\"出错时谁负责、哪一步能拦\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">出错时谁负责、哪一步能拦</tspan></text></g><g data-k=\"团队会不会变懒、怎么防\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">团队会不会变懒、怎么防</tspan></text></g><g data-k=\"出事后能不能证明尽责\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">出事后能不能证明尽责</tspan></text></g></svg>", "d": 70.87}, {"t": "通过标准：不吹、不躲、可落地", "n": "放行标准：数字有口径、拦截点具体、责任到岗、留痕拿得出。四项里最容易失分的是「责任人」——回答「我会负责」是无效答案，VP 要的是流程上的名字：文案谁签、数据谁核、对外材料谁批。也不要为了过关承诺「零风险」，那会让整份方案失去可信度。你的目标不是说服 VP 相信 AI 万能，而是让他相信：这件事有人管、有流程拦、出了事查得到。做到这三点，预算和试点空间自然会给。最后一句话很关键：把你的承诺缩到能兑现的范围——不承诺不出错，只承诺错误在部门内被发现、在客户之前被拦住。这句话比任何技术方案都更能让 VP 签字。走到这一步，你已经把「要不要用 AI」的讨论，变成了「怎么管着用」的讨论，性质完全不同。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"提效口径可核算\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">提效口径可核算</tspan></text></g><g data-k=\"拦截点写清谁看什么\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">拦截点写清谁看什么</tspan></text></g><g data-k=\"责任落到岗位\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任落到岗位</tspan></text></g><g data-k=\"不承诺零风险但承诺可追溯\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不承诺零风险但承诺可追溯</tspan></text></g></svg>", "d": 57.0}], "deliverable": {"type": "skill", "name": "部门 AI 使用规范草稿", "rubric": ["口径可核算", "拦截点清楚", "责任可落地"], "acceptance": "四个问题都能用「结论—依据—边界」回答：给得出可核算的口径、说得出拦截点、拿得出规范与留痕"}, "spar": {"role": "业务 VP", "persona": "关心结果与风险，不关心技术细节；对「提效」这两个字天然怀疑，会反复要数字", "mustAsk": ["你说的提效，一年能省多少人力？这个数怎么算出来的？", "AI 出了错，客户投诉到我这，我找谁？流程上哪一步能拦住？", "团队会不会变懒？新人还学不学基本功？", "如果下个月出事，你这套规范能证明我们尽到了管理责任吗？"]}, "exemplar": "（VP 问：你说的提效，一年能省多少人力，这个数怎么算出来的）\n\n结论：按当前 3 人试点算，一年约省 240 个工时，折 0.15 个人力——数字不大，但每个数都能复算。\n依据：周报从 3 小时压到 40 分钟，3 人 × 48 周 = 省 96 小时；差评归因从 5 小时压到 1 小时，同口径 = 省 192 小时。两个数都是试点实测，不是我拍的。\n边界：这两个数只在试点范围成立，扩到全组要重测；另外我不敢承诺不出错，我能承诺的是三道拦截——文案过法务词表、口径过数据复核、对外材料我签字，错误在到客户之前能被截下来。", "task": "把《部门 AI 使用规范草稿》拿到「业务 VP」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《部门 AI 使用规范草稿》。现在要让它通过「业务 VP」这一关。\n【对手的立场】关心结果与风险，不关心技术细节；对「提效」这两个字天然怀疑，会反复要数字。\n【他一定会追问】「你说的提效，一年能省多少人力？这个数怎么算出来的？」 / 「AI 出了错，客户投诉到我这，我找谁？流程上哪一步能拦住？」 / 「团队会不会变懒？新人还学不学基本功？」\n【场景】你说「业务 VP 质疑「AI 会不会让团队失控」」，对方立刻回一句：你说的提效，一年能省多少人力？这个数怎么算出来的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["提效数字有口径（几人×几小时×几周，折成人力），并说明这是估算还是实测", "能指出至少两个具体拦截点（谁在流程哪一步看什么），不是「我们会加强审核」", "回答「团队变懒」时给出可执行动作（如新人必须先手写一遍再对照 AI 产出）", "能说明规范 + 留痕如何证明管理尽责，且不夸大（不承诺「零风险」）"]}]}, {"id": "M3", "title": "M3 AI 辅助 PRD 与产品定义", "dims": ["content", "prompt", "data"], "units": [{"id": "M3U1", "tier": "basic", "step": "understand", "title": "一句话需求 → 结构化 PRD", "video": {"dur": "3.2min", "script": ["老板的一句话，不能直接当需求；结构化才防返工", "PRD 骨架图（背景 / 目标 / 范围 / 指标）", "「提升详情页转化」从一句话到一页 PRD"]}, "ppt": {"method": "PRD 骨架图（背景 / 目标 / 范围 / 指标）", "case": "「提升详情页转化」从一句话到一页 PRD", "demo": "PRD 骨架对照卡：每节回答一个问题"}, "objective": "能判断一句话需求缺哪几项信息，并补成目标 / 范围 / 指标都可衡量的需求描述", "transfer": "把手头最近一条口头需求按五节骨架重写，发给提需求的人确认一次再开工", "vslides": [{"t": "开场：一句话不是需求", "n": "老板走过来说，详情页转化不行，改一下吧。这句话听起来是需求，其实只是一个方向。它至少藏着五个没定的问题：改哪个类目的详情页、现在的转化到底是多少、差是相对同行还是相对上个月、具体改哪一块、多久要看到变化。这五个问题里任何一个没定，研发就只能靠猜，猜错就返工。拆完别自己闷着改，拿着这五个问题回去跟提需求的人对一次。十分钟能省两周——返工几乎都发生在没对过的地方。PRD 的价值不在于写得长，而在于把这句话里的「未定」一条条钉死。判断一份 PRD 合不合格，有个很实用的标准：研发能不能在完全不问你、也不开会的情况下开工？能，就是合格的 PRD；不能，那就是一份会议纪要。见过最典型的一份：三行字写了「优化详情页、提升转化」，研发做了两周，交付时老板说「我说的不是这个页面」——两周的成本，全花在三个字没界定上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">从话到需求</tspan></text><g data-k=\"一句话需求\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">一句话需求</tspan></text></g><g data-k=\"拆成五个未定\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">拆成五个未定</tspan></text></g><g data-k=\"逐条钉死\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">逐条钉死</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.69}, {"t": "五节各回答一个问题", "n": "PRD 拆五节，每节只回答一个问题。背景回答「为什么现在做」，要有触发事件，比如大促后详情页跳出率升了三个点。目标回答「怎么算成功」，必须是数字加观察窗口，比如支付转化从 1.8% 提到 2.2%，看两周。范围回答「做哪些、不做哪些」，含与不含两栏都要写。方案回答「具体怎么做」，细到改哪一屏、加哪个字段、字段从哪取。验收与埋点回答「怎么证明它成了」，写成别人能照着测的步骤。这五节里，最容易被糊弄的是目标和范围，也是研发最爱挑的两处。顺便说一句背景怎么写：很多人写成行业趋势，其实只需要一个触发事件——哪个指标在什么时候变了、变了多少、谁先发现。有触发事件，评审会才不会变成「这个需求有必要做吗」的辩论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">PRD 六节</tspan></text><g data-k=\"背景：为什么现在\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">背景：为什么现在</tspan></text></g><g data-k=\"目标：怎么算成\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">目标：怎么算成</tspan></text></g><g data-k=\"范围：做与不做\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">范围：做与不做</tspan></text></g><g data-k=\"方案：具体怎么改\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">方案：具体怎么改</tspan></text></g><g data-k=\"验收：怎么证明\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">验收：怎么证明</tspan></text></g><g data-k=\"埋点：怎么归因\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">埋点：怎么归因</tspan></text></g></svg>", "d": 64.68}, {"t": "踩坑：范围不清的代价", "n": "最常见的事故是范围蔓延。PRD 里写「优化搜索体验」，研发做了输入框，测试提了联想词，运营又要求加类目导航，最后上线三周、改了五个地方，转化没动，谁也说不清是哪个改动起的作用。这类项目的复盘通常只有一句话：无法归因。所以范围一定要写成两栏，含与不含并列，且「不含」要具体到功能名，比如「不改排序策略、不动类目导航」。还有一个更隐蔽的坑：目标写成「提升用户体验」——这种目标永远不会失败，也永远不会通过，等于没目标。检查范围也不必写很长，一个小动作就够：数一下「不含」里有几个具体功能名，少于三条，基本可以判定这次范围一定会蔓延。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">范围不清</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">代价</tspan></text><g data-k=\"写「优化搜索体验」 范围自己会长大\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">写「优化搜索体验」</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">范围自己会长大</tspan></text></g><g data-k=\"上线三周改五处，说不清哪处有效\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">上线三周改五处，说不清</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">哪处有效</tspan></text></g></svg>", "d": 53.57}], "deliverable": {"type": "skill", "name": "PRD 骨架", "rubric": ["目标可衡量", "范围清晰", "验收可测"], "acceptance": "给一句模糊需求，能展开成含目标与指标的 PRD 骨架，且范围「不含」写得具体"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】PRD 骨架图（背景 / 目标 / 范围 / 指标）\n【为什么重要】老板的一句话，不能直接当需求；结构化才防返工\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["目标写成可衡量的指标式（含现状值、目标值、观察窗口），不写「提升转化」这类方向词", "范围分「含」与「不含」两栏，每栏至少 3 条，且「不含」不是「其他都含」这样的废话", "方案部分写到页面与字段级：改哪一屏、加哪个字段、字段取值从哪来", "验收与埋点能交给第三方照着测：前置条件、操作步骤、预期结果三件齐全"]}, {"id": "M3U2", "tier": "basic", "step": "demo", "title": "用 AI 生成商品详情页结构", "video": {"dur": "3.1min", "script": ["详情页不是堆卖点，是设计信任与决策路径", "要点 → AI 生成结构 → 评审清单", "「优选生活馆」详情页信息架构草稿"]}, "ppt": {"method": "要点 → AI 生成结构 → 评审清单", "case": "「优选生活馆」详情页信息架构草稿", "demo": "WorkBuddy 内跑一遍详情页结构提示词"}, "objective": "能用卖点与画像跑出详情页信息架构，并按评审清单指出 AI 结构里 3 处不合适的地方", "transfer": "下一个详情页改版先让 AI 出结构，自己只改「信任模块」和「决策辅助」两屏", "vslides": [{"t": "演示准备：卖点 + 用户画像", "n": "演示开始。材料是两份：一份卖点清单，一份目标用户画像，都做过脱敏，不含订单与个人信息。先看卖点清单里有什么：材质、工艺、规格、服务承诺。再看画像：二十八到三十八岁、有娃家庭、价格敏感但对材质更敏感。这两份材料决定了详情页的骨架——卖点决定「能说什么」，画像决定「先说哪句」。很多人一上来就让 AI「写一版详情页文案」，这是错的：先要结构，再要文案，结构错了文案越漂亮越浪费。补一个判断依据：这个类目的详情页跳出中位数在首屏后三秒，也就是说用户平均只看一到两屏就决定走不走，所以首屏放错东西，后面写得再好也没人看。这次演示按四步走：先看材料、再要结构、然后过评审清单、最后交付给设计。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"卖点清单：材质/工艺/规格/服务\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">卖点清单：材质/工艺/规格/服务</tspan></text></g><g data-k=\"用户画像：有娃家庭、材质敏感\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">用户画像：有娃家庭、材质敏感</tspan></text></g><g data-k=\"前提：已脱敏，不含订单与身份\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">前提：已脱敏，不含订单与身份</tspan></text></g></svg>", "d": 64.78}, {"t": "跑结构：从卖点到架构", "n": "提示词要求 AI 输出三件事：首屏放什么、信任模块放什么、决策辅助放什么，并且每一屏要写清它回答用户的哪个疑问。这个「疑问」字段是关键——它把详情页从「罗列卖点」变成「回答问题」。下面是真跑出来的结果，注意它的结构是对的：首屏解决「是不是我要的」，信任模块解决「凭什么信你」，决策辅助解决「选哪个规格」。这三段正好对应转化的三个心理台阶，缺哪一段，用户就在哪一段流失。AI 在这里的作用是「逼你把台阶铺全」，它最擅长把一屏要回答的问题列清楚；它做不到的是知道你有没有检测报告、有没有真实差评案例——这两样只能人来补。还有个细节值得注意：它把信任模块拆成材质工艺、真实使用、销量服务三块，这个拆法比笼统写「增强信任感」有用得多，因为每一块都能落到具体素材上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三段心理台阶</tspan></text><g data-k=\"首屏：是不是我要的\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">首屏：是不是我</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">要的</tspan></text></g><g data-k=\"信任：凭什么信你\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">信任：凭什么信</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">你</tspan></text></g><g data-k=\"决策：选哪个\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">决策：选哪个</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.52}, {"t": "结果怎么用：评审清单", "n": "拿到结构后不要直接交给设计，先过一遍四问清单：有没有哪一屏没有对应疑问？有没有功效表述没有检测依据？有没有该说清的时效和库存被漏掉？差评里出现的问题有没有被正面回应？这四问里，第二问和第四问最容易出事：功效表述涉及广告法与平台规则，差评回避会让用户在下单前一秒放弃。看右边这份人工修正记录，四处修改都是在这四问里发现的——AI 出结构，人补合规与诚意。最后交代一句交付方式：给设计的是这份结构说明加疑问对照，不是一篇文案。文案越早写，越容易被结构绑死。交付时附上那张疑问对照表，设计的返工率会明显下降，因为她们不用猜你这一屏想解决什么。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每屏都对得上一个疑问\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每屏都对得上一个疑问</tspan></text></g><g data-k=\"功效表述有检测依据\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">功效表述有检测依据</tspan></text></g><g data-k=\"时效与库存写清楚\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">时效与库存写清楚</tspan></text></g><g data-k=\"差评问题正面回应\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">差评问题正面回应</tspan></text></g></svg>", "d": 56.71}], "deliverable": {"type": "skill", "name": "PRD 骨架", "rubric": ["结构完整", "疑问对齐", "人工修正"], "acceptance": "能产出《PRD 骨架》并通过本单元评分要点"}, "demo": {"ref": "■ 详情页信息架构（类目：家居日用 · 目标用户：28–38 岁有娃家庭）\n\n■ 首屏（0–1 屏）：回答「这是不是我要的」\n · 主图：场景图优先于白底图（有娃家庭更看使用场景）\n · 标题：品类词 + 核心材质 + 关键规格（如「纯棉 四件套 1.8m 床」）\n · 首屏利益点 3 条，按用户疑问排序：会不会起球 / 好洗吗 / 有味道吗\n · 价格与到手价并列，避免用户自己算\n\n■ 信任模块（2–3 屏）：回答「我凭什么信你」\n · 材质与工艺：成分、克重、检测口径（执行标准号）\n · 真实使用：买家实拍（含差评里被提到的问题如何改进）\n · 销量与服务：近 30 天销量区间、退货政策、发货时效\n\n■ 决策辅助（4–5 屏）：回答「选哪个尺寸/版本」\n · 规格对照表：尺寸、适配床型、适用季节\n · 常见问题 5 条（起球、缩水、掉色、异味、退换）\n · 搭配推荐：同风格枕套/被芯，降低决策成本\n\n■ 收尾：回答「现在买划算吗」\n · 活动规则拆解：到手价算法、赠品、保价期\n · 库存与时效提示：现货/预售、预计到达\n\n■ 每屏对应的用户疑问清单\n首屏：这是我要的吗 / 到手多少钱　信任：质量靠得住吗 / 别人买了怎么说\n决策：我该选哪个规格　收尾：现在买值不值\n\n⚠ 需人工确认：卖点清单里「抗菌」若无法提供检测报告，首屏不得出现该表述。", "fix": ["删掉 AI 自己补的「转化可提升 20%–30%」——详情页结构改进的收益必须靠实验测，写进方案里就是给自己挖坑。", "把「抗菌」这类功效表述单独挑出来标红：没有检测报告就不能上首屏，这是详情页最高频的合规事故，AI 不会替你把关。", "把「买家实拍」具体化为「含差评问题的改进说明」——只放好评是自嗨，主动回应差评才是信任。", "给每屏补上对应的用户疑问，形成「疑问—模块」对照——这样评审时能直接检查有没有未被回答的疑问。"], "judge": "判断依据：有没有编造收益数字；有没有把功效表述标出来；每屏是否对应明确疑问；有没有区分「现货/预售」这类会引发客诉的信息", "sheet": {"situ": "你要给一款家居日用四件套改详情页。手上有 8 条店铺评价（只保留内容，已脱敏），每条都藏着一个用户在下单前会问的问题。你要先把这些问题整理出来，再让 AI 排信息架构。", "ask": "① 逐条判断：这条评价在问什么、属于哪一类疑问、该放到详情页哪一屏；② 用整理好的字段请 AI 生成信息架构；③ 自己改一版——AI 排的顺序一定有不对的地方，找出至少两处。", "gen": "请基于以上整理，生成这款四件套详情页的信息架构：首屏放什么、信任模块放什么、决策辅助放什么，\n每一屏要对应回答哪几条用户疑问。疑问分类只按我整理出来的类别，不要自己新增类别，也不要去猜出现次数。", "mats": [{"id": "R01", "src": "评价 · 已购", "text": "洗了三次就起球，客服说正常磨损，我不太能接受。"}, {"id": "R02", "src": "评价 · 已购", "text": "1.8m 床买的 2.0m 四件套，被套偏大，铺上去全是褶。"}, {"id": "R03", "src": "评价 · 未购咨询转评价", "text": "想问问深色款第一次洗会不会掉色，能不能和浅色一起洗。"}, {"id": "R04", "src": "评价 · 已购", "text": "打开有一股浆洗的味道，晾了两天才散，家里有小孩有点担心。"}, {"id": "R05", "src": "评价 · 已购", "text": "价格比隔壁贵 40 块，但看评价说这个厚一些，收到确实厚，值。"}, {"id": "R06", "src": "评价 · 未购", "text": "想知道支数是多少，页面只写「高支高密」，看不出差别在哪。"}, {"id": "R07", "src": "评价 · 已购", "text": "少了两个枕套，联系售后第二天就补发了，态度不错。"}, {"id": "R08", "src": "评价 · 已购", "text": "铺上以后尺寸刚好，床单也不会往下滑，这点比之前买的强。"}], "cols": [{"k": "ask", "name": "这条在问什么", "hint": "归到一类疑问", "type": "chips", "w": 3, "tags": ["会不会起球", "尺寸对不对", "会不会掉色", "有没有味道", "值不值这个价", "参数够不够", "售后怎么处理"]}, {"k": "screen", "name": "该放哪一屏", "hint": "详情页三屏", "type": "chips", "w": 3, "tags": ["首屏", "信任模块", "决策辅助"]}, {"k": "sent", "name": "情感", "hint": "负 / 中 / 正", "type": "chips", "w": 1, "tags": ["负", "中", "正"]}, {"k": "quote", "name": "一句原话（照抄）", "hint": "照抄连续一段，至少 6 个字", "type": "text", "w": 2, "tags": []}], "key": {"R01": {"ask": "会不会起球", "screen": "信任模块", "sent": "负"}, "R02": {"ask": "尺寸对不对", "screen": "首屏", "sent": "负"}, "R03": {"ask": "会不会掉色", "screen": "信任模块", "sent": "中"}, "R04": {"ask": "有没有味道", "screen": "信任模块", "sent": "负"}, "R05": {"ask": "值不值这个价", "screen": "决策辅助", "sent": "正"}, "R06": {"ask": "参数够不够", "screen": "首屏", "sent": "中"}, "R07": {"ask": "售后怎么处理", "screen": "决策辅助", "sent": "正"}, "R08": {"ask": "尺寸对不对", "screen": "首屏", "sent": "正"}}, "refsheet": "R01｜会不会起球｜信任模块｜负｜「洗了三次就起球」\nR02｜尺寸对不对｜首屏｜负｜「被套偏大，铺上去全是褶」\nR03｜会不会掉色｜信任模块｜中｜「第一次洗会不会掉色」\nR04｜有没有味道｜信任模块｜负｜「打开有一股浆洗的味道」\nR05｜值不值这个价｜决策辅助｜正｜「价格比隔壁贵 40 块，但确实厚」\nR06｜参数够不够｜首屏｜中｜「想知道支数是多少」\nR07｜售后怎么处理｜决策辅助｜正｜「联系售后第二天就补发」\nR08｜尺寸对不对｜首屏｜正｜「铺上以后尺寸刚好」\n\n分布上看一眼就有结论：8 条里有 3 条落在「信任模块」（起球 / 掉色 / 味道），\n2 条落在「首屏」（尺寸 / 参数），2 条落在「决策辅助」（价格 / 售后）。\n这和大多数人凭直觉排的「首屏堆卖点、后面随便放」正好相反——\n用户下单前最不放心的，是「会不会坏」，不是「有多好看」。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」的核心卖点与目标用户（已脱敏）：\n[粘贴卖点清单+用户画像]\n请生成详情页的信息架构：首屏放什么、信任模块放什么、决策辅助放什么，并给出每屏要回答的用户疑问。"}, "task": "在 WorkBuddy 里把「要点 → AI 生成结构 → 评审清单」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】要点 → AI 生成结构 → 评审清单\n【参考案例】「优选生活馆」详情页信息架构草稿\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」的核心卖点与目标用户（已脱敏）：\n[粘贴卖点清单+用户画像]\n请生成详情页的信息架构：首屏放什么、信任模块放什么、决策辅助放什么，并给出每屏要回答的用户疑问。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M3U3", "tier": "basic", "step": "todo", "title": "产出《商品搜索改版 PRD》", "video": {"dur": "3.1min", "script": ["PRD 不写成文档，研发就只能靠猜", "PRD 模板（背景/目标/范围/指标/验收）", "「优选生活馆」搜索改版 PRD 样例（含埋点）"]}, "ppt": {"method": "PRD 模板（背景/目标/范围/指标/验收）", "case": "「优选生活馆」搜索改版 PRD 样例（含埋点）", "demo": "PRD 填写操作指引（先写目标再写范围）"}, "objective": "能产出含可衡量目标、范围边界、验收标准与护栏指标的完整 PRD", "transfer": "PRD 发出去前自查三件事：目标有没有数字、范围有没有「不做」、验收有没有人签字", "vslides": [{"t": "任务说明：PRD 是契约", "n": "这一节要写的是一份能直接开工的 PRD。它不是给老板看的汇报材料，而是你和研发之间的契约：写清了，后面三周不用反复开会；写不清，后面三周天天开会。判断标准还是那一条，研发能不能拿着它不问你一句就开工。搜索改版这个题目选得比较狠，因为它天然牵扯排序、召回、兜底三块，最容易范围蔓延——正好用来练「把边界钉死」这件事。写之前先想清楚一件事：这次改版的目的到底是「让用户搜得到」，还是「让搜到的更想买」？这两个目标对应完全不同的范围。给一个参照：电商站内搜索通常占 UV 三成上下，而无结果率每降一个点，搜索支付转化往往能跟着动一点几个点，所以搜索改版是少数「改对一处、全站受益」的地方，值得把 PRD 写扎实。下面这份范例按七节写，你可以照着自己的项目删减，但目标、范围、验收三段不能省。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 背景与目标（含口径）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 背景与目标（含口径）</tspan></text></g><g data-k=\"② 范围含/不含\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 范围含/不含</tspan></text></g><g data-k=\"③ 方案到字段级\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 方案到字段级</tspan></text></g><g data-k=\"④ 埋点与验收\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 埋点与验收</tspan></text></g><g data-k=\"⑤ 风险与回滚\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 风险与回滚</tspan></text></g></svg>", "d": 69.19}, {"t": "先写目标：可衡量是底线", "n": "目标必须写成三段式：指标、现状值、目标值，再加一个观察窗口。比如搜索无结果率从 9.2% 降到 5% 以下，看上线后 14 天。光有数字还不够，一定要写口径：无结果率是按请求算还是按会话算、同会话重复搜索算不算、大促算不算。同一个指标不同口径能差出一倍，这就是后面数据负责人要挑战你的地方。另外必须写一条护栏指标：这次改版不能让支付转化掉下去。没有护栏的实验和方案，出事时你连「该不该回滚」都判断不了。口径要落到一句话：无结果率等于返回结果数为零的搜索请求数除以搜索请求总数，按会话去重、同会话同词只计一次、大促三天剔除。口径和护栏一起写，回滚才不会变成吵架。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">目标三段式 + 窗口</tspan></text><g data-k=\"指标\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">指标</tspan></text></g><g data-k=\"现状值\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">现状值</tspan></text></g><g data-k=\"目标值\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">目标值</tspan></text></g><g data-k=\"观察窗口\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">观察窗口</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 60.79}, {"t": "范围与验收：把边界钉死", "n": "范围写两栏，含与不含。含的部分写到页面与字段，不含的部分要具体到功能名——「不改排序策略」是一句有效的话，「其他不变」等于没写。验收部分最容易糊弄，很多 PRD 写到「功能正常」就结束了。合格的验收是别人能照着测：前置条件、操作步骤、预期结果，而且必须覆盖异常态，比如接口超时、搜不到结果、字段缺失。搜索类改版尤其要测异常态，因为线上最常见的客诉不是「搜得不准」，而是「点了没反应」和「一片空白」。还有一条别漏：回滚开关和责任人要写进 PRD，写在风险那一节，否则真出事的时候，第一件事是拉群找谁能关。验收这一步写不出具体步骤，通常说明方案还没想清楚。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"目标带口径与护栏\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">目标带口径与护栏</tspan></text></g><g data-k=\"不含具体到功能名\"><g><circle cx=\"30\" cy=\"80\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 80 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"84.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不含具体到功能名</tspan></text></g><g data-k=\"方案到字段与接口\"><g><circle cx=\"30\" cy=\"108\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 108 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"113.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">方案到字段与接口</tspan></text></g><g data-k=\"验收覆盖异常态\"><g><circle cx=\"30\" cy=\"137\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 137 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"141.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">验收覆盖异常态</tspan></text></g><g data-k=\"回滚开关与责任人\"><g><circle cx=\"30\" cy=\"165\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 165 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"170.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">回滚开关与责任人</tspan></text></g></svg>", "d": 53.86}], "deliverable": {"type": "skill", "name": "商品搜索改版 PRD", "rubric": ["目标可衡量", "范围清晰", "埋点到事件", "验收可复现"], "acceptance": "一份研发能直接开工的 PRD：目标可衡量、范围含不含清晰、埋点到事件级、验收可第三方复现"}, "practice": {"steps": ["写背景与目标：目标必须是「指标 + 现状值 + 目标值 + 观察窗口」", "写范围：含与不含并列，不含要具体到功能名", "写方案：输入框、联想词、无结果兜底各自改什么，字段从哪来", "写埋点与验收：三层埋点事件名 + 可照着测的验收步骤", "写风险与回滚：列出最可能出问题的两处与降级方案"], "exemplar": "【商品搜索改版 PRD v0.3】产品：产品经理（优选生活馆）　研发：搜索组　评审：数据/运营/合规\n\n■ 一、背景（为什么现在做）\n近 30 天搜索 UV 占比 34%，搜索支付转化 2.6%，低于类目导购的 3.1%。\n10/15 起客服工单中「搜不到」类占比升至 18%，集中在错别字与规格词（如「1.8m 床」）。\n\n■ 二、目标（怎么算成功）\n1. 搜索无结果率：现 9.2% → 目标 ≤5.0%，观察窗口 上线后 14 天（去掉大促 3 天）\n2. 联想词点击率：现 21% → 目标 ≥28%（同窗口）\n3. 护栏指标：搜索支付转化不得低于 2.4%（若跌破即回滚）\n口径：无结果率 = 返回结果数为 0 的搜索请求数 ÷ 搜索请求总数，按「会话」去重，同会话多次同词只计一次。\n\n■ 三、范围\n含：① 输入框支持错别字纠错提示；② 联想词按「品类+规格」重构；③ 无结果页加类目导航兜底。\n不含：① 不动排序策略与召回逻辑；② 不改搜索权重；③ 不做语音搜索；④ 不改搜索结果页布局。\n\n■ 四、方案（改什么、字段从哪来）\n1. 纠错提示：取 query 改写候选（依赖搜索中台接口 /suggest_fix），命中则首行提示「您是不是想找：××」。\n2. 联想词：按「品类词 + 规格词 + 场景词」三类召回，每类最多 3 条，规格词来源于商品属性表。\n3. 无结果兜底：先给「相近类目」3 个入口，再给「热门同类」6 个商品，均取自动销榜。\n异常态：联想接口超时 300ms → 不展示联想，不阻塞搜索；兜底页无数据 → 展示客服入口。\n\n■ 五、埋点（三层）\n曝光层：search_suggest_view（属性：query、条数、来源）\n交互层：search_suggest_click（query、点击位次、词类型）、search_fix_click（原词、改后词）\n结果层：search_result_empty（query、兜底类型）、search_pay（query、是否经联想点击）\n对应指标：无结果率←result_empty；联想点击率←suggest_click/suggest_view；归因←search_pay.是否经联想\n\n■ 六、验收\n前置：预发环境，商品库与线上一致。\n步骤：① 输入「1.8m 床」→ 预期首行出现纠错/规格提示；② 输入乱码「asdfgh」→ 预期出现类目兜底且无空白页；\n③ 断开联想接口 → 预期搜索仍可用，无阻塞；④ 点击联想词 → 预期上报 suggest_click 且位次正确。\n预期结果不达标即打回，不进入灰度。\n\n■ 七、风险与回滚\n风险1：纠错提示误纠（如品牌名被改）→ 品牌词白名单，命中白名单不纠错。\n风险2：兜底类目推荐把用户带离搜索 → 埋点观察 3 天，兜底点击后支付转化低于 2.0% 则下线兜底。\n回滚：配置开关 search_revamp_v3，10 分钟内可全量关闭，责任人：产品经理 + 搜索组值班。"}, "task": "产出《商品搜索改版 PRD》：写背景与目标：目标必须是「指标 + 现状值 + 目标值 + 观察窗口」；写范围：含与不含并列，不含要具体到功能名；写方案：输入框、联想词、无结果兜底各自改什么，字段从哪来；写埋点与验收：三层埋点事件名 + 可照着测的验收步骤；写风险与回滚：列出最可能出问题的两处与降级方案", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M3 AI 辅助 PRD 与产品定义」模块，你要交付的是《商品搜索改版 PRD》。\n【场景】业务侧这周的诉求是：PRD 不写成文档，研发就只能靠猜。参考做法：「优选生活馆」搜索改版 PRD 样例（含埋点）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（PRD 模板（背景/目标/范围/指标/验收）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《商品搜索改版 PRD》填写模板】\n\n■ 1. 写背景与目标：目标必须是「指标 + 现状值 + 目标值 + 观察窗口」\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写范围：含与不含并列，不含要具体到功能名\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写方案：输入框、联想词、无结果兜底各自改什么，字段从哪来\n   ‣ 提示：按「结论 → 依据 → 行动」三段写。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 写埋点与验收：三层埋点事件名 + 可照着测的验收步骤\n   ‣ 提示：写成「前置条件 + 操作步骤 + 预期结果」，可被第三方照着测。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写风险与回滚：列出最可能出问题的两处与降级方案\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【商品搜索改版 PRD v0.3】产品：产品经理（优选生活馆）　研发：搜索组　评审：数据/运营/合规\n\n■ 一、背景（为什么现在做）\n近 30 天搜索 UV 占比 34%，搜索支付转化 2.6%，低于类目导购的 3.1%。\n10/15 起客服工单中「搜不到」类占比升至 18%，集中在错别字与规格词（如「1.8m 床」）。\n\n■ 二、目标（怎么算成功）\n1. 搜索无结果率：现 9.2% → 目标 ≤5.0%，观察窗口 上线后 14 天（去掉大促 3 天）\n2. 联想词点击率：现 21% → 目标 ≥28%（同窗口）\n3. 护栏指标：搜索支付转化不得低于 2.4%（若跌破即回滚）\n口径：无结果率 = 返回结果数为 0 的搜索请求数 ÷ 搜索请求总数，按「会话」去重，同会话多次同词只计一次。\n\n■ 三、范围\n含：① 输入框支持错别字纠错提示；② 联想词按「品类+规格」重构；③ 无结果页加类目导航兜底。\n不含：① 不动排序策略与召回逻辑；② 不改搜索权重；③ 不做语音搜索；④ 不改搜索结果页布局。\n\n■ 四、方案（改什么、字段从哪来）\n1. 纠错提示：取 query 改写候选（依赖搜索中台接口 /suggest_fix），命中则首行提示「您是不是想找：××」。\n2. 联想词：按「品类词 + 规格词 + 场景词」三类召回，每类最多 3 条，规格词来源于商品属性表。\n3. 无结果兜底：先给「相近类目」3 个入口，再给「热门同类」6 个商品，均取自动销榜。\n异常态：联想接口超时 300ms → 不展示联想，不阻塞搜索；兜底页无数据 → 展示客服入口。\n\n■ 五、埋点（三层）\n曝光层：search_suggest_view（属性：query、条数、来源）\n交互层：search_suggest_click（query、点击位次、词类型）、search_fix_click（原词、改后词）\n结果层：search_result_empty（query、兜底类型）、search_pay（query、是否经联想点击）\n对应指标：无结果率←result_empty；联想点击率←suggest_click/suggest_view；归因←search_pay.是否经联想\n\n■ 六、验收\n前置：预发环境，商品库与线上一致。\n步骤：① 输入「1.8m 床」→ 预期首行出现纠错/规格提示；② 输入乱码「asdfgh」→ 预期出现类目兜底且无空白页；\n③ 断开联想接口 → 预期搜索仍可用，无阻塞；④ 点击联想词 → 预期上报 suggest_click 且位次正确。\n预期结果不达标即打回，不进入灰度。\n\n■ 七、风险与回滚\n风险1：纠错提示误纠（如品牌名被改）→ 品牌词白名单，命中白名单不纠错。\n风险2：兜底类目推荐把用户带离搜索 → 埋点观察 3 天，兜底点击后支付转化低于 2.0% 则下线兜底。\n回滚：配置开关 search_revamp_v3，10 分钟内可全量关闭，责任人：产品经理 + 搜索组值班。", "rubric": ["目标含现状值、目标值、观察窗口三个要素，缺一按未写完计", "范围「不含」列出至少 3 条具体功能名（如不改排序、不合并类目），不写「其他不变」", "埋点写到事件名 + 触发时机 + 关键属性，且与指标一一对应", "验收写成「前置条件 + 操作步骤 + 预期结果」，并覆盖至少一个异常态（无结果/超时）"]}, {"id": "M3U4", "tier": "basic", "step": "spar", "title": "研发负责人挑战你的 PRD", "video": {"dur": "3.0min", "script": ["研发负责人最会挑模糊，答不上来 PRD 就打回重写", "PRD 答辩清单（目标 / 范围 / 验收）", "典型反驳 vs 你的回应（目标不可测 / 范围蔓延）"]}, "ppt": {"method": "PRD 答辩清单（目标 / 范围 / 验收）", "case": "典型反驳 vs 你的回应（目标不可测 / 范围蔓延）", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "objective": "能在研发负责人追问下明确答出范围边界、工期依赖与降级方案", "transfer": "下次需求评审前，把「这次不做什么」单独列一页，开会第一页就讲", "vslides": [{"t": "陪练说明：他挑的是清晰度", "n": "接下来是 PRD 答辩，对手是研发负责人。他不关心你的方案有多聪明，只关心两件事：这个需求到底要做到哪一步，以及做完怎么算完。他挑的从来不是技术难度，而是模糊处——凡是「优化」「提升」「尽快」这种词，他都会停下来问一句具体是什么。你的回答要有一个原则：能当场给结论的当场给，给不了的明确说「我今天下班前补给你」，最忌讳含糊其辞。含糊一次，后面的排期他就会自己加缓冲，你的项目周期就被动延长了。他的算法很朴素：需求越不清楚，风险溢价越高，估点就越保守——所以把话说清，等于替自己省时间。他的时间比你的贵，问题都短，短到你来不及绕。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他只看三件事</tspan></text><g data-k=\"目标可测\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">目标可测</tspan></text></g><g data-k=\"边界清晰\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">边界清晰</tspan></text></g><g data-k=\"异常态有预期\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">异常态有预期</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 52.66}, {"t": "他会问什么：四个高频问题", "n": "四个高频问题。第一，这个目标怎么验收，两周后谁看哪个数、多少算成？第二，「不含」具体指什么，做的时候会不会顺手带出来？第三，验收步骤和预期写了吗，异常态怎么测？第四，联想接口依赖谁，超时了页面怎么办？第一问考你有没有想清口径，第二问考你会不会被「顺手」拖成范围蔓延，第三问考你的测试意识，第四问考你的依赖管理。四问里第二问最危险，因为研发常常一句「顺手就做了」，然后工期超两周。第四问的答法要给出三件事：依赖谁、什么时候给、如果没给就降级成什么样子（比如联想接口不通就先只上纠错）。第一问也一样，照四样报：谁看、看哪个数、阈值多少、什么时候看。四样报全，这一问就不再追。这四个问题背后其实是同一个问题：你有没有把「不确定」提前处理掉。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"验收看哪个数、多少算成\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">验收看哪个数、多少算成</tspan></text></g><g data-k=\"不含的具体指什么\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不含的具体指什么</tspan></text></g><g data-k=\"异常态怎么测\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">异常态怎么测</tspan></text></g><g data-k=\"外部依赖与超时处理\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">外部依赖与超时处理</tspan></text></g></svg>", "d": 66.26}, {"t": "通过标准：不返工、不加塞、不返工", "n": "放行标准：他能凭你的回答直接排期，不需要再问第三遍。具体看四条：验收有看板有阈值、范围不含写得下笔、异常态有明确预期、依赖有时间和降级方案。答不上来时，正确姿势不是编，而是给出补齐时间并写进会议纪要——研发负责人对「不知道但会给」的容忍度，远高于对「好像可以」的容忍度。这一关过了，你的 PRD 基本不会被退回重写，工期也守得住。答辩结束后别急着散会：当场把四条结论写成三行纪要发到群里，让他在群里回一个「确认」，这比会后补文档有效得多。顺带说一句：他愿意跟你吵口径，说明他打算认真做这个需求，这对你是好事。另外，答辩前把 PRD 打印出来带一支笔，他挑到哪一句你就写在旁边，会后照着改——比会后凭记忆改靠谱得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"验收有看板有阈值\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">验收有看板有阈值</tspan></text></g><g data-k=\"不含写得下笔\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不含写得下笔</tspan></text></g><g data-k=\"异常态有预期\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">异常态有预期</tspan></text></g><g data-k=\"依赖有时间与降级\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">依赖有时间与降级</tspan></text></g></svg>", "d": 63.82}], "deliverable": {"type": "skill", "name": "商品搜索改版 PRD", "rubric": ["口径清楚", "边界不含糊", "降级方案"], "acceptance": "四问都能给出可执行答案：验收口径、范围边界、异常态预期、外部依赖与降级"}, "spar": {"role": "研发负责人", "persona": "务实、只认可测目标与清晰边界，最讨厌「先做出来再优化」", "mustAsk": ["这个目标怎么验收？两周后谁看哪个数、看多少算成？", "范围里的「不含」具体指什么？做的时候会不会顺手带出来？", "验收标准的步骤和预期写了吗？异常态怎么测？", "联想的接口依赖谁的？超时了页面怎么办？"]}, "exemplar": "（研发问：这个目标怎么验收，两周后谁看哪个数、多少算成）\n\n结论：看两个数，上线后 14 天——搜索无结果率 ≤5.0%（现 9.2%）、联想词点击率 ≥28%（现 21%）；护栏是搜索支付转化不得低于 2.4%，跌破就回滚。\n依据：无结果率 = 返回结果数为 0 的请求数 ÷ 搜索请求总数，按会话去重、同会话同词只计一次、剔除大促 3 天；数据源是搜索体验日报，数据同学每周一同步。\n边界：排序与召回不在这次范围，改完这两项不会动排序效果；如果 14 天样本不够，我接受延长到 21 天，但不缩减观察期——缩了就等于没做。", "task": "把《商品搜索改版 PRD》拿到「研发负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《商品搜索改版 PRD》。现在要让它通过「研发负责人」这一关。\n【对手的立场】务实、只认可测目标与清晰边界，最讨厌「先做出来再优化」。\n【他一定会追问】「这个目标怎么验收？两周后谁看哪个数、看多少算成？」 / 「范围里的「不含」具体指什么？做的时候会不会顺手带出来？」 / 「验收标准的步骤和预期写了吗？异常态怎么测？」\n【场景】你说「研发负责人挑战你的 PRD」，对方立刻回一句：这个目标怎么验收？两周后谁看哪个数、看多少算成？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["验收问题能报出具体看板与判断阈值，不说「看数据表现」", "对「顺手带出来」的追问，能明确说「这次不做，进下个需求池」并给出理由", "异常态能说出具体降级行为（不展示/兜底/阻塞或不阻塞），不是「正常处理」", "依赖项能说清对方是谁、什么时候给、没给的话怎么排期"]}, {"id": "M3U5", "tier": "adv", "step": "understand", "title": "多角色评审与埋点设计", "video": {"dur": "3.3min", "script": ["改版上线却说不清效果，多半是埋点没设计", "评审清单（产品/研发/运营/数据）+ 埋点分层", "某改版因埋点缺失无法归因的复盘"]}, "ppt": {"method": "评审清单（产品/研发/运营/数据）+ 埋点分层", "case": "某改版因埋点缺失无法归因的复盘", "demo": "埋点分层卡（曝光/交互/结果）"}, "objective": "能列出改版所需的三层埋点（曝光 / 点击 / 结果），并指出哪一层最容易漏、为什么", "transfer": "给手上正在做的改版补一张埋点设计表，上线前让数据同学在上面签字", "vslides": [{"t": "开场：埋点是改版的账本", "n": "改版上线之后，团队一定会在两周后的复盘会上问一个问题：这次改版到底有没有用？如果埋点没设计好，这个问题的答案通常是沉默。埋点不是技术细节，它是你这次改版的账本——没有账本，你既证明不了成绩，也发现不了问题。判断一份埋点设计够不够，看它能不能回答三个问题：用户有没有看到、有没有动手、最后有没有成交。这三个问题正好对应三层埋点：曝光、交互、结果。只埋交互不埋曝光，你算不出转化率；只埋结果不埋曝光，你不知道是哪一步掉的。还有一点要纠正：很多人把埋点当成开发阶段的技术活，实际上它是产品定义的一部分——你在设计功能时就得决定「这件事要能被衡量」。这一节学完，你要能自己列出一张三层的埋点表。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三层埋点 = 三个问题</tspan></text><g data-k=\"曝光\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">曝光</tspan></text></g><g data-k=\"交互\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">交互</tspan></text></g><g data-k=\"结果\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">结果</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 60.53}, {"t": "三层怎么列", "n": "第一层曝光：模块被展示时上报，属性带坑位标识、页面、排序位置。第二层交互：用户点击、输入、滑动时上报，属性带点击位次、词类型、来源。第三层结果：加购、支付、退货时上报，属性带是否经该模块触达——这一条是归因的关键。举个搜索改版的例子：曝光是 suggest_view，交互是 suggest_click，结果是 pay 事件里带一个「是否经联想点击」的布尔属性。三层齐了，你才能算出联想词的点击率、点击后的支付转化、以及这次改版带来的净增量。缺任何一层，链路就断在那里。命名上有个硬要求：用「模块_动作」的格式，比如 search_suggest_click，不要用「点击1」「事件A」这种名字——三个月后回来看，没人知道点击1 是什么，埋点就白埋了。三层不必一次埋全，但归因字段必须有——它是你唯一能把结果追回动作的线索。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">埋点三层 + 属性</tspan></text><g data-k=\"曝光：模块被看到\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">曝光：模块被看到</tspan></text></g><g data-k=\"交互：用户动手了\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">交互：用户动手了</tspan></text></g><g data-k=\"结果：成交或退货\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">结果：成交或退货</tspan></text></g><g data-k=\"属性：坑位/位次/来源\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"153.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">属性：坑位/位次</tspan><tspan x=\"72.7\" dy=\"14.950000000000001\">/来源</tspan></text></g><g data-k=\"指标：点击率/转化率\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"153.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">指标：点击率/转</tspan><tspan x=\"200.0\" dy=\"14.950000000000001\">化率</tspan></text></g><g data-k=\"归因：是否经该模块\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"153.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">归因：是否经该模</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\">块</tspan></text></g></svg>", "d": 74.5}, {"t": "踩坑：事后补埋点", "n": "最常见的坑是上线之后再补埋点。补不了的，因为用户已经走完一轮了，历史数据永远缺这一块，你只能等下一个周期。更麻烦的是口径不一致：产品说支付率按订单算，数据说按用户算，两边差两个点，复盘会上先吵一小时口径，最后谁也没说服谁。所以埋点必须在 PRD 里定死三件事：事件名、触发时机、属性字段，并且写明每个指标的计算公式。还有一个小细节容易被忽略：埋点也要有 owner 和验收步骤，否则上线时发现漏埋，又是一周。验收方法很简单：预发环境点一遍，去后台看有没有落表、属性对不对，五分鐘能做完，但九成团队没做。所以埋点这件事的正确做法是写进 PRD 的验收项，和别人一起验收，而不是交给开发自行确认。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">事后补埋点</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">代价</tspan></text><g data-k=\"上线后再说 数据回头补不了\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">上线后再说</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">数据回头补不了</tspan></text></g><g data-k=\"历史缺口 + 口径打架 = 无法归因\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">历史缺口 + 口径打架 =</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">无法归因</tspan></text></g></svg>", "d": 62.09}], "deliverable": {"type": "doc", "name": "埋点设计表", "rubric": ["三层齐全", "口径对应", "归因链路"], "acceptance": "给一个改版点，能列出曝光/交互/结果三层埋点与对应指标，并说明归因链路"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】评审清单（产品/研发/运营/数据）+ 埋点分层\n【为什么重要】改版上线却说不清效果，多半是埋点没设计\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["曝光/交互/结果三层各有事件，事件名符合命名规范（模块_动作），不用「点击1」这类名字", "每个事件写了触发时机与关键属性，属性里至少含 query 或坑位标识这类归因字段", "每个指标能指回具体事件与计算公式，形成「事件→指标→决策」的链路", "至少指出一处「埋点缺失会导致什么判断不了」，说明为什么现在必须埋"]}, {"id": "M3U6", "tier": "adv", "step": "demo", "title": "用 AI 跑通推荐位配置方案", "video": {"dur": "3.2min", "script": ["推荐位不是越多越好，是场景对不对", "场景 → AI 配置草案 → 人工修正", "「优选生活馆」首页推荐位 A/B 配置草案"]}, "ppt": {"method": "场景 → AI 配置草案 → 人工修正", "case": "「优选生活馆」首页推荐位 A/B 配置草案", "demo": "WorkBuddy 内跑一遍推荐位提示词"}, "objective": "能用 AI 跑出推荐位配置草案，并依据场景条件做出「什么时候不放」的人工修正", "transfer": "把「不展示条件」（重复推荐 / 库存不足 / 新客首单）写进配置表，作为评审必查项", "vslides": [{"t": "演示准备：内部配置非隐私", "n": "这次演示的材料是内部的推荐位清单和候选策略：四个坑位、各自的商品池、可用的召回逻辑。这些是配置信息，不含用户隐私，所以可以直接喂给 AI——这也是判断能不能用 AI 的一个现成例子：配置、规则、清单这类材料可以，用户行为明细和身份信息不行。演示前先说清目标：不是让 AI 设计一套完美推荐，而是让它把四个坑位的策略、展示条件、需要埋的交互摊开成一张表，再由人挑一个变量去做实验。演示前也要说清约束：首页坑位是稀缺资源，运营要排期、供应链要备货、库存不足还不能推，所以配置方案不只是「放什么」，更是「什么时候不放」。首页改版最容易踩的坑不是策略错，而是改了没通知运营，上线当天和大促撞车。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"坑位清单：首屏/中屏×2/底屏\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">坑位清单：首屏/中屏×2/底屏</tspan></text></g><g data-k=\"候选策略：大促/个性化/凑单/复购\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">候选策略：大促/个性化/凑单/复购</tspan></text></g><g data-k=\"材料级别：内部配置，可直接使用\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">材料级别：内部配置，可直接使用</tspan></text></g></svg>", "d": 58.18}, {"t": "跑配置：从列表到方案", "n": "提示词给了三条约束：按「首屏抓眼球、中屏促转化、底屏拉复购」的逻辑分配，给出展示条件，标出需埋点的交互。注意「展示条件」这个要求，它逼着 AI 去想你什么时候不该展示——推荐位真正的功夫都在这里。看真跑出来的结果：每个坑位都有策略、展示条件、埋点三行，最后还主动建议先验证单一变量。这份产出可以直接当讨论稿用，但绝对不能直接上线，原因在下一步。先看它做得对的地方：每个坑位都给了展示条件，比如「购物车金额距门槛 30 元内才展示凑单」——这类条件是人最想不到、但最影响体验的部分。它甚至还主动提出「先验证单一变量」，这一步很多人自己都想不到。不过它写的库存安全线是空值，这个数只能供应链给，AI 不可能知道，所以别指望它填。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三行一张表</tspan></text><g data-k=\"坑位 + 策略\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">坑位 + 策略</tspan></text></g><g data-k=\"展示条件\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">展示条件</tspan></text></g><g data-k=\"埋点交互\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">埋点交互</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 63.79}, {"t": "结果怎么用：人工修正边界", "n": "四处修正里，最重要的第一处：把「四个坑位一起上」改成「先验证坑位三一个变量」。这是推荐位改版最常见的浪费——同时改四处，数据涨了不知道谁带来的，跌了也不知道该关哪个。第二处补展示条件，因为真正的坑在「不该展示的时候展示了」，比如库存不够还推、刚退货还提醒回购。第三处把行业均值标出来待校准，第四处补合规确认项。AI 擅长把结构铺开，不擅长替你对后果负责。这份表接下来要去三个地方：运营确认坑位排期、供应链确认库存安全线、数据确认埋点能不能接。三个都回话之后，才轮到你决定先动哪个变量。建议在表格最后加一列「谁确认、什么时候确认」，把口头对齐变成书面确认。最后一件事：实验周期别拍脑袋。四个坑位日均曝光量够的话，一周能看出差异；不够就只测一个坑位，别硬跑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"只改一个变量\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只改一个变量</tspan></text></g><g data-k=\"每个坑位有展示条件\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每个坑位有展示条件</tspan></text></g><g data-k=\"行业均值待校准\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">行业均值待校准</tspan></text></g><g data-k=\"个性化推荐的合规点已识别\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">个性化推荐的合规点已识别</tspan></text></g></svg>", "d": 70.32}], "deliverable": {"type": "doc", "name": "埋点设计表", "rubric": ["场景对齐", "约束完整", "单变量"], "acceptance": "能产出《埋点设计表》并通过本单元评分要点"}, "demo": {"ref": "■ 首页推荐位配置草案（4 个坑位 · 内部配置，不含用户隐私）\n\n■ 坑位 1 · 首屏 Banner 下第一推荐位（抓眼球）\n · 策略：大促主推款 / 新品首发，取运营提报池，按「库存深度 ≥ 安全线」过滤\n · 展示条件：仅当用户无明确品类偏好时展示通用池；有偏好时展示偏好品类内 Top3\n · 需埋点交互：曝光（含坑位号、商品 ID、排序位）、点击、点击后 30 分钟内加购\n\n■ 坑位 2 · 中屏「猜你喜欢」首排（促转化）\n · 策略：基于近 30 天浏览/加购的行为相似召回，冷启动用户回落到热销榜\n · 展示条件：登录用户走个性化；未登录走类目热销，避免隐私依赖\n · 需埋点交互：曝光、滑动深度、点击、加购、支付（带是否经该坑位）\n\n■ 坑位 3 · 中屏「凑单专区」（促客单）\n · 策略：按当前购物车内商品的互补品类召回，凑单门槛显示「还差 X 元」\n · 展示条件：购物车非空且金额距门槛 ≤30 元时展示\n · 需埋点交互：门槛提示曝光、凑单商品点击、凑单后客单变化\n\n■ 坑位 4 · 底屏「回购提醒」（拉复购）\n · 策略：按品类消耗周期推算，如日化 30 天、纸品 45 天，到期前 3 天展示\n · 展示条件：仅对近 90 天有购买且未退货用户展示\n · 需埋点交互：提醒曝光、复购点击、复购支付\n\n■ 建议先验证的单一变量\n坑位 3「凑单专区」从无到有（其余三坑位保持不变），灰度 10% 流量，观察客单价与支付转化。\n\n⚠ 需人工确认：\n1. 消耗周期（30/45 天）需用自家复购数据校准，本草案为行业常见值；\n2. 库存安全线取值需供应链确认，不得由运营单方设定；\n3. 未登录用户的行为召回涉及设备标识，需合规确认是否可用。", "fix": ["把「四个坑位一起上」改成「先验证坑位 3 一个变量」——同时改四处，即使数据涨了也不知道是谁的功劳，这是推荐位改版最常见的浪费。", "给每个坑位补了展示条件（库存安全线、购物车金额、90 天未退货），因为推荐位真正的坑不在策略，在于「什么时候不该展示」。", "把行业常见值（30/45 天消耗周期）单独标出来要自家数据校准——写进方案里的行业均值，最后都会变成拍脑袋的依据。", "补了「未登录用户用设备标识」的合规确认项——个性化推荐最容易在这一点上越线，且往往没人意识到。"], "judge": "判断依据：是否只改一个变量；每个坑位有没有展示条件；行业均值是否标注待校准；有没有识别出个性化推荐的合规点", "sheet": {"situ": "首页要改推荐位。运营给了你 8 个真实出现过的场景，你要先判断每个场景下「这个推荐位到底该不该出」，再把能出的交给 AI 排策略。判断错一个，用户就会看到他已经买过的东西，或者一个根本买不到的东西。", "ask": "① 逐条判断：这是哪类用户场景、该不该给它出推荐位、该放在哪；② 把「该出」的交给 AI 排配置草案；③ 自己补上 AI 一定漏掉的那条——什么情况下不能出。", "gen": "请基于以上判断，给出首页 4 个推荐位的策略与展示条件（哪些场景出、哪些不出），\n并标注每个坑位要埋的交互点。最后单独列一段「一定不能出推荐位的条件清单」。\n不要给没有依据的转化率提升预估。", "mats": [{"id": "R01", "src": "场景 · 埋点回流", "text": "新客首单完成，停留在支付成功页，30 秒内返回首页。"}, {"id": "R02", "src": "场景 · 埋点回流", "text": "老客刚买完同款四件套 3 天，再次进入首页，浏览同类目。"}, {"id": "R03", "src": "场景 · 库存看板", "text": "主推款 A 库存仅剩 12 件，低于安全线（50 件），仍在首页首屏推荐位。"}, {"id": "R04", "src": "场景 · 埋点回流", "text": "用户连续 5 次滑动跳过中屏「猜你喜欢」，直接滑到底部。"}, {"id": "R05", "src": "场景 · 运营提报", "text": "大促预热期，主推款已确认 11/1 开卖，当前处在预售锁定期。"}, {"id": "R06", "src": "场景 · 埋点回流", "text": "用户把三件商品加入购物车后离开，48 小时未支付，未领券。"}, {"id": "R07", "src": "场景 · 埋点回流", "text": "用户刚退款成功（尺码问题），退款完成 5 分钟内回到首页。"}, {"id": "R08", "src": "场景 · 运营提报", "text": "静默期（大促后第 2 周），无新品、无活动、库存充足。"}], "cols": [{"k": "scene", "name": "场景类型", "hint": "这是哪类用户状态", "type": "chips", "w": 3, "tags": ["新客首单", "老客复购", "犹豫未付", "退款售后", "库存异常", "大促预售", "静默期"]}, {"k": "push", "name": "该不该出推荐位", "hint": "先判这个", "type": "chips", "w": 3, "tags": ["该出", "不该出"]}, {"k": "slot", "name": "放在哪", "hint": "该出的才填", "type": "chips", "w": 2, "tags": ["首屏", "猜你喜欢", "凑单专区", "底屏复购", "都不放"]}, {"k": "quote", "name": "一句依据（照抄场景里的事实）", "hint": "照抄场景原文里能支撑你判断的那一句", "type": "text", "w": 2, "tags": []}], "key": {"R01": {"scene": "新客首单", "push": "该出", "slot": "首屏"}, "R02": {"scene": "老客复购", "push": "不该出", "slot": "都不放"}, "R03": {"scene": "库存异常", "push": "不该出", "slot": "都不放"}, "R04": {"scene": "犹豫未付", "push": "不该出", "slot": "都不放"}, "R05": {"scene": "大促预售", "push": "该出", "slot": "首屏"}, "R06": {"scene": "犹豫未付", "push": "该出", "slot": "凑单专区"}, "R07": {"scene": "退款售后", "push": "不该出", "slot": "都不放"}, "R08": {"scene": "静默期", "push": "该出", "slot": "底屏复购"}}, "refsheet": "R01｜新客首单｜该出｜首屏｜「停留在支付成功页，30 秒内返回首页」\nR02｜老客复购｜不该出｜都不放｜「刚买完同款 3 天」——再推同款是浪费坑位\nR03｜库存异常｜不该出｜都不放｜「库存仅剩 12 件，低于安全线」\nR04｜犹豫未付｜不该出｜都不放｜「连续 5 次滑动跳过」——继续推只会加速离开\nR05｜大促预售｜该出｜首屏｜「已确认 11/1 开卖，当前处在预售锁定期」\nR06｜犹豫未付｜该出｜凑单专区｜「加购三件未支付，未领券」——缺的是凑单理由\nR07｜退款售后｜不该出｜都不放｜「刚退款成功，5 分钟内回首页」——这时候推销是负体验\nR08｜静默期｜该出｜底屏复购｜「无新品、无活动、库存充足」——只能做复购唤醒\n\n最容易被判错的两条：\n· R04 用户连跳 5 次，很多人会判「该出、换个策略试试」——实际正确答案是不放，\n 继续占坑位只会把最后一个坑也丢掉。\n· R06 同样是「没付钱」，但加购未付且没领券，缺的是凑单理由，所以该出、放凑单专区；\n 而 R04 是明确在跳过，两类完全不同，不能都归成「犹豫」。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」首页的可用的推荐位与候选策略（均为内部配置，不含用户隐私）：\n[粘贴推荐位列表+策略]\n请基于「首屏抓眼球、中屏促转化、底屏拉复购」的逻辑，给出每个推荐位的策略与展示条件，并标注需埋点的交互。"}, "task": "在 WorkBuddy 里把「场景 → AI 配置草案 → 人工修正」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】场景 → AI 配置草案 → 人工修正\n【参考案例】「优选生活馆」首页推荐位 A/B 配置草案\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」首页的可用的推荐位与候选策略（均为内部配置，不含用户隐私）：\n[粘贴推荐位列表+策略]\n请基于「首屏抓眼球、中屏促转化、底屏拉复购」的逻辑，给出每个推荐位的策略与展示条件，并标注需埋点的交互。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M3U7", "tier": "adv", "step": "todo", "title": "产出《A/B 实验方案》", "video": {"dur": "3.0min", "script": ["不上实验就全量，是拿收入赌直觉", "实验模板（假设 / 变量 / 样本 / 指标 / 终判）", "「优选生活馆」详情页 A/B 方案样例"]}, "ppt": {"method": "实验模板（假设 / 变量 / 样本 / 指标 / 终判）", "case": "「优选生活馆」详情页 A/B 方案样例", "demo": "方案填写操作指引（先写假设再写变量）"}, "objective": "能产出含可证伪假设、单一变量、样本测算、终判规则与护栏指标的实验方案", "transfer": "实验上线前把终判规则和回滚条件发给数据负责人确认，他没回就不开", "vslides": [{"t": "任务说明：实验是护栏", "n": "这一节写 A/B 实验方案。先说清为什么值得写：不上实验就全量，本质是拿收入赌直觉，而且赌赢了你也不知道为什么赢。实验方案的价值不在「做实验」这三个字，而在于它逼你事先把话说死：改什么、预期动多少、多少算成、多少算败。写方案的时候有一个心态要调整：你不是在证明自己对了，你是在花钱买一个可信的答案。所以方案里最该认真写的部分，不是假设，是终判规则和护栏指标。也顺便算一下成本：一次实验动辄两周、占掉一半流量，这个代价比写方案的时间高两个数量级，值得多花两小时把话说死。下面这份范例的题目很小，只是详情页加一个咨询入口，但五节都齐全，可以当模板套。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 可证伪的假设\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 可证伪的假设</tspan></text></g><g data-k=\"② 单变量与对照\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 单变量与对照</tspan></text></g><g data-k=\"③ 样本量与周期\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 样本量与周期</tspan></text></g><g data-k=\"④ 指标与终判\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 指标与终判</tspan></text></g><g data-k=\"⑤ 风险与终止\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 风险与终止</tspan></text></g></svg>", "d": 55.94}, {"t": "先写假设：可证伪是前提", "n": "假设必须四要素齐全：改什么、预期哪个指标动、动多少、依据是什么。比如「详情页首屏下方加实时咨询入口，支付转化从 1.80% 提到 1.94%，依据是工单里有 12% 是问不了才走」。四要素里最常缺的是「依据」和「动多少」，缺了这两个，实验做完你没法判断成败，只能说「好像好一点」。还要写明「多少算不成立」，比如提升小于 3% 就视为假设不成立。一个永远成立的假设不是假设，是口号。依据从哪来？三个现成来源：客服工单的归类统计、自己的问卷、竞品公开页面的做法。不要去引用行业报告里的提升幅度，那些数字换一个类目就失效。注意范例里「相对 +8%」这种写法：绝对值和相对值混用，是实验沟通里最常见的事故。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">假设四要素</tspan></text><g data-k=\"改什么\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">改什么</tspan></text></g><g data-k=\"哪个指标动\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">哪个指标</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">动</tspan></text></g><g data-k=\"动多少\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">动多少</tspan></text></g><g data-k=\"依据是什么\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">依据是什</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">么</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 61.61}, {"t": "变量与终判：守住单一", "n": "变量只允许一个：新增咨询入口就是新增入口，位置、文案、样式一起定了可以算一个变量，但同时改价格展示就变成了两个。对照组要写清「其余保持一致」的手段：同时段、同流量池、避开大促峰值、同素材版本。样本量给粗算就够，但要写出依据：基线转化乘最小可检测效应，反推每组需要多少转化样本，再折算成天数。终判规则必须事先写死，包括最尴尬的情况——p 值落在 0.05 到 0.10 之间怎么办。事先没写，事后就一定有人主张「再跑一周看看」。最后是护栏与终止：护栏破线就停，不看好不好看；出现集中客诉也停，不等显著性。这两条写进方案，等于给实验装了安全气囊。最后提醒一句：实验期间别做别的改版，否则结论一定被污染，白跑两周。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"单一变量，其余一致\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">单一变量，其余一致</tspan></text></g><g data-k=\"样本量有估算依据\"><g><circle cx=\"30\" cy=\"80\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 80 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"84.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">样本量有估算依据</tspan></text></g><g data-k=\"终判规则事先写死\"><g><circle cx=\"30\" cy=\"108\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 108 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"113.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">终判规则事先写死</tspan></text></g><g data-k=\"护栏破线即停\"><g><circle cx=\"30\" cy=\"137\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 137 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"141.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">护栏破线即停</tspan></text></g><g data-k=\"边缘显著的处理写明\"><g><circle cx=\"30\" cy=\"165\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 165 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"170.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">边缘显著的处理写明</tspan></text></g></svg>", "d": 63.6}], "deliverable": {"type": "skill", "name": "A/B 实验方案", "rubric": ["假设可证伪", "单变量", "终判前置"], "acceptance": "一份能直接开的实验方案：假设可证伪、单变量、样本量有依据、终判规则事先写死不事后改"}, "practice": {"steps": ["写可证伪的假设：改什么、预期哪个指标动、动多少、为什么", "定义单一变量与对照组，说明其余保持一致的手段", "算样本量与实验周期，写清分流比例与最小可检测效应", "定核心指标、护栏指标与终判规则（含边缘显著时怎么办）", "写风险与提前终止条件，指定决策人与复盘时间"], "exemplar": "【详情页实时咨询入口 · A/B 实验方案 v1.0】负责人：产品　决策人：产品负责人 + 数据负责人\n\n■ 一、假设（可证伪）\n在详情页首屏下方新增「实时咨询」入口，预计支付转化从 1.80% 提升至 ≥1.94%（相对 +8%）。\n依据：近 30 天客服工单中「想问但没问」类占比 12%；同类入口在友商页面的公开表述显示为主推位；\n另据我们自己的问卷（n=312），「担心尺寸不合适」是未下单首因。\n若 14 天后转化提升 <3%（相对），视为假设不成立。\n\n■ 二、变量与对照\n变量：仅新增咨询入口（位置、文案、图标样式）。\n对照组：原页面，无任何改动。\n保持一致：同一时段、同一流量池、同一活动节奏（避开 11/1–11/3 大促峰值）、同一素材版本。\n不做：不同时改价格展示、不同时改推荐位、不同时改客服话术。\n\n■ 三、分流与样本\n分流：50/50，按用户 ID 哈希，同一用户在整个实验期内固定分组。\n基线：支付转化 1.80%，日均详情页 UV 约 12 万。\n最小可检测效应：相对 +8%（即 1.94%）。按双侧 α=0.05、power=80% 粗算，每组约需 4.2 万转化样本；\n按日均 UV 与 1.8% 转化率折算，预计需 14 天；实验周期定为 14 天（不足则延长至 21 天，不缩短）。\n\n■ 四、指标\n核心指标：支付转化率 = 支付成功订单数 ÷ 详情页 UV（按用户去重，同用户当日多单计 1）。\n过程指标：咨询入口点击率、咨询会话发起率、咨询后 24h 支付率。\n护栏指标：① 客服平均响应时长不得 >180s；② 退货率不得高于基线 +0.5pt；③ 页面首屏加载不得劣化 >200ms。\n护栏任一破线 → 立即暂停实验，不等显著性。\n\n■ 五、终判规则（开实验前写死，不事后调整）\n1. 核心指标 p<0.05 且方向为正 → 放量至 100%，观察一周护栏。\n2. p<0.05 但方向为负 → 下线。\n3. 0.05≤p<0.10 → 不宣布结论，延长实验 7 天；仍不显著则判为「无差异」，按成本决定是否保留。\n4. p≥0.10 → 判为无差异，结论写入复盘，不再重复同类实验。\n\n■ 六、风险与终止\n风险1：咨询量激增导致响应超时 → 提前与客服确认可承接量，超阈值自动降级为「留言」。\n风险2：入口本身吸引低意向用户，拉低转化 → 以过程指标（咨询后支付率）判断，低于 8% 则下线。\n提前终止条件：护栏破线、或实验期出现客诉集中（>5 例同类投诉）。\n复盘时间：实验结束后第 3 个工作日，输出「结论 + 是否放量 + 沉淀的固定做法」。"}, "task": "产出《A/B 实验方案》：写可证伪的假设：改什么、预期哪个指标动、动多少、为什么；定义单一变量与对照组，说明其余保持一致的手段；算样本量与实验周期，写清分流比例与最小可检测效应；定核心指标、护栏指标与终判规则（含边缘显著时怎么办）；写风险与提前终止条件，指定决策人与复盘时间", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M3 AI 辅助 PRD 与产品定义」模块，你要交付的是《A/B 实验方案》。\n【场景】业务侧这周的诉求是：不上实验就全量，是拿收入赌直觉。参考做法：「优选生活馆」详情页 A/B 方案样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（实验模板（假设 / 变量 / 样本 / 指标 / 终判）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《A/B 实验方案》填写模板】\n\n■ 1. 写可证伪的假设：改什么、预期哪个指标动、动多少、为什么\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 定义单一变量与对照组，说明其余保持一致的手段\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 算样本量与实验周期，写清分流比例与最小可检测效应\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 定核心指标、护栏指标与终判规则（含边缘显著时怎么办）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写风险与提前终止条件，指定决策人与复盘时间\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【详情页实时咨询入口 · A/B 实验方案 v1.0】负责人：产品　决策人：产品负责人 + 数据负责人\n\n■ 一、假设（可证伪）\n在详情页首屏下方新增「实时咨询」入口，预计支付转化从 1.80% 提升至 ≥1.94%（相对 +8%）。\n依据：近 30 天客服工单中「想问但没问」类占比 12%；同类入口在友商页面的公开表述显示为主推位；\n另据我们自己的问卷（n=312），「担心尺寸不合适」是未下单首因。\n若 14 天后转化提升 <3%（相对），视为假设不成立。\n\n■ 二、变量与对照\n变量：仅新增咨询入口（位置、文案、图标样式）。\n对照组：原页面，无任何改动。\n保持一致：同一时段、同一流量池、同一活动节奏（避开 11/1–11/3 大促峰值）、同一素材版本。\n不做：不同时改价格展示、不同时改推荐位、不同时改客服话术。\n\n■ 三、分流与样本\n分流：50/50，按用户 ID 哈希，同一用户在整个实验期内固定分组。\n基线：支付转化 1.80%，日均详情页 UV 约 12 万。\n最小可检测效应：相对 +8%（即 1.94%）。按双侧 α=0.05、power=80% 粗算，每组约需 4.2 万转化样本；\n按日均 UV 与 1.8% 转化率折算，预计需 14 天；实验周期定为 14 天（不足则延长至 21 天，不缩短）。\n\n■ 四、指标\n核心指标：支付转化率 = 支付成功订单数 ÷ 详情页 UV（按用户去重，同用户当日多单计 1）。\n过程指标：咨询入口点击率、咨询会话发起率、咨询后 24h 支付率。\n护栏指标：① 客服平均响应时长不得 >180s；② 退货率不得高于基线 +0.5pt；③ 页面首屏加载不得劣化 >200ms。\n护栏任一破线 → 立即暂停实验，不等显著性。\n\n■ 五、终判规则（开实验前写死，不事后调整）\n1. 核心指标 p<0.05 且方向为正 → 放量至 100%，观察一周护栏。\n2. p<0.05 但方向为负 → 下线。\n3. 0.05≤p<0.10 → 不宣布结论，延长实验 7 天；仍不显著则判为「无差异」，按成本决定是否保留。\n4. p≥0.10 → 判为无差异，结论写入复盘，不再重复同类实验。\n\n■ 六、风险与终止\n风险1：咨询量激增导致响应超时 → 提前与客服确认可承接量，超阈值自动降级为「留言」。\n风险2：入口本身吸引低意向用户，拉低转化 → 以过程指标（咨询后支付率）判断，低于 8% 则下线。\n提前终止条件：护栏破线、或实验期出现客诉集中（>5 例同类投诉）。\n复盘时间：实验结束后第 3 个工作日，输出「结论 + 是否放量 + 沉淀的固定做法」。", "rubric": ["假设含「改什么 + 哪个指标 + 预期幅度 + 依据」，四要素缺一不可", "明确单一变量与对照组，并写清如何保证其他条件一致（时间、流量、活动）", "给出样本量或周期的估算依据（哪怕是粗算：基线转化 × 最小可检测效应）", "终判规则在开实验前写死，含护栏指标破线即停、以及 p 值在 0.05–0.1 时如何处理"]}, {"id": "M3U8", "tier": "adv", "step": "spar", "title": "数据负责人挑战指标口径", "video": {"dur": "3.1min", "script": ["数据负责人捍卫口径，答不上来指标就不可信", "口径答辩清单（定义 / 归因 / 冲突）", "典型反驳 vs 你的回应（口径不一 / 归因错配）"]}, "ppt": {"method": "口径答辩清单（定义 / 归因 / 冲突）", "case": "典型反驳 vs 你的回应（口径不一 / 归因错配）", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "objective": "能在数据负责人追问下说清指标定义、归因口径与冲突处理，换个人也算出同一个数", "transfer": "把自己负责的核心指标写一段口径定义（分子 / 分母 / 去重 / 剔除），存进团队指标字典", "vslides": [{"t": "陪练说明：他挑的是口径", "n": "最后一关是数据负责人。他和其他评审不一样，他不在乎你的方案漂不漂亮，只在乎你的数字能不能复现——换一个人按你的口径重算，能不能得到同一个数。他会一直往下追：支付率的分母是 UV 还是会话、同一个人一天下两单算几单、退款算不算。这些追问不是刁难，因为口径不同能差出一倍，实验结论就会完全反过来。你要做的准备很具体：把每个指标写成一句话定义加一个公式。举个差多少的例子：同一个「支付率」，分母用 UV 和用会话能差一到两个点，用订单算出来的数更好看但会掩盖问题，三个数放在一张表里，结论可以完全相反。准备三样东西去答辩：一句话定义、一个公式、一个已知答案的例子，这三样能顶住大部分追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">口径三问</tspan></text><g data-k=\"定义写到分母\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">定义写到分母</tspan></text></g><g data-k=\"去重粒度\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">去重粒度</tspan></text></g><g data-k=\"可复现\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可复现</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 57.96}, {"t": "他会问什么：四个高频问题", "n": "四个高频问题。第一，支付率的定义和去重口径是什么，分母是 UV 还是会话？第二，两组用户质量不同怎么处理，分流是随机还是按 ID 哈希？第三，指标冲突时以哪个为准，转化涨了但退货率也涨了怎么判？第四，p 等于 0.06 你打算怎么办，事先写了没有？第二问考你懂不懂分流：按 ID 哈希固定分组，才能保证同一个人不横跨两组；还要能说出怎么验证基线一致，比如先跑一周 AA 测试看两组差异。第四问考的是你有没有在开实验前把话说死。第三问的答法要有优先级而不是和稀泥：通常护栏优先——转化涨了但退货率破线，先停实验再分析，因为退货是滞后指标，等它涨上来往往已经放量了。这几问指向同一件事：你的数字能不能被别人重算出来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"分子分母与去重粒度\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">分子分母与去重粒度</tspan></text></g><g data-k=\"分流方式与基线验证\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">分流方式与基线验证</tspan></text></g><g data-k=\"指标冲突的优先级\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">指标冲突的优先级</tspan></text></g><g data-k=\"边缘显著的预案\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">边缘显著的预案</tspan></text></g></svg>", "d": 63.77}, {"t": "通过标准：换个人也算得出同一个数", "n": "放行标准只有一句：换一个人按你的口径重算，得到同一个数。四条具体要求：口径写到分母与去重粒度、分流方式可验证、冲突有优先级、边缘显著有事先预案。答辩时有个技巧很有用：主动给出一个「已知答案的例子」，比如「上周全站支付率 1.79%，用我这个口径算出来也是 1.79%」，这一句话比讲十分钟定义都管用。答不上来的地方照样不要编，说清什么时候补、补什么。这一关的实际价值很高：口径过了，你的实验结论才能进决策会，而不只是「我们试了一下，感觉还行」。收尾还有个动作：把这次定下的口径写进团队的指标字典，一条一行，谁改谁留痕。散在各人文档里的口径，三个月后又要吵一遍。这一关过了，你的方案才算具备「可被审计」的资格。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"口径到分母与去重\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">口径到分母与去重</tspan></text></g><g data-k=\"分流可验证基线\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">分流可验证基线</tspan></text></g><g data-k=\"冲突有优先级\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">冲突有优先级</tspan></text></g><g data-k=\"边缘显著事先写死\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">边缘显著事先写死</tspan></text></g></svg>", "d": 61.82}], "deliverable": {"type": "skill", "name": "A/B 实验方案", "rubric": ["口径到分母", "分流可验证", "冲突有优先级"], "acceptance": "四问都能给出可复现的答案：口径到分母、分流可验证、冲突有优先级、边缘显著有预案"}, "spar": {"role": "数据负责人", "persona": "严谨、死磕口径与归因，会追问到分母怎么取", "mustAsk": ["支付率的定义和去重口径是什么？分母是 UV 还是会话？", "两组用户本身质量不同怎么处理？分流是随机还是按 ID 哈希？", "指标冲突时以哪个为准？转化涨了但退货率也涨了怎么判？", "p=0.06 你打算怎么办？事先写了没有？"]}, "exemplar": "（数据负责人问：支付率的定义和去重口径是什么，分母是 UV 还是会话）\n\n结论：支付率 = 支付成功订单数 ÷ 详情页 UV，UV 按用户去重，同一用户当天多单只计 1 单。\n依据：选用户粒度是因为这次改的是页面，同一个用户看两次不该被算成两次；上周全站用这个口径算出 1.79%，与财务口径差异在 0.02pt 内，你可以直接复算。\n边界：如果团队标准是会话粒度，我改，但必须在开实验前定下来，中途换口径等于重跑；另外 p 落在 0.05 到 0.10 之间，我按方案延长 7 天，不宣布结论。", "task": "把《A/B 实验方案》拿到「数据负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《A/B 实验方案》。现在要让它通过「数据负责人」这一关。\n【对手的立场】严谨、死磕口径与归因，会追问到分母怎么取。\n【他一定会追问】「支付率的定义和去重口径是什么？分母是 UV 还是会话？」 / 「两组用户本身质量不同怎么处理？分流是随机还是按 ID 哈希？」 / 「指标冲突时以哪个为准？转化涨了但退货率也涨了怎么判？」\n【场景】你说「数据负责人挑战指标口径」，对方立刻回一句：支付率的定义和去重口径是什么？分母是 UV 还是会话？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["说清分子分母与去重粒度（用户/会话/订单），并说明为何选这个粒度", "能说明分流方式与如何验证两组基线一致（如 AA 测试、基线转化对比）", "指标冲突时给出优先级与理由（通常以护栏优先，或净 GMV 优先）", "对边缘显著给出事先约定的处理，而不是「再看一周」这种事后主张"]}]}]};
