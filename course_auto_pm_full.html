xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 锁定价格带</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 选 3 款成交重叠最高的竞品</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 拉差异表</tspan></text></svg>"}, {"t": "第二步：配置与价格差异表", "n": "把三款竞品的已知配置拉成一张表，只列影响成交的项：续航、智驾能力、座舱屏、座椅功能、充电速度、终端优惠。每一项都要标来源和时点。优惠这类信息变动最快，必须写明是哪个月的口径，否则一个月后这张表就不能用了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">配置差异维度</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">续航</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">智驾</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">座舱屏</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">座椅</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">补能</tspan></text></g><g><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">终端优惠</tspan></text></g></svg>"}, {"t": "第三步：从差异到结论", "n": "最后一步是把差异翻译成产品动作。不要写「竞品配置更强」这种话，要写清楚：哪几项是我们年款可以补的，补的成本多少，不补会丢多少订单。结论必须落到可执行的具体项上，这份简报才对得起前面花的功夫。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项结论落到具体配置动作</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给出成本或订单影响估算</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">标注数据来源与时点</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "细分市场情报简报", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《细分市场情报简报》并通过本单元评分要点"}, "practice": {"steps": ["锁定你的价格带与 3 款直接竞品", "拉出配置与价格差异表", "写 3 个发现 + 1 条产品建议 + 待确认"], "exemplar": "价格带：20–25 万纯电 SUV｜竞品：A/B/C 发现：三款均在改款中加后排屏；A 的智驾包降价 8000 元 建议：星河 L7 年款把后排屏纳入标配，智驾包维持选装以保毛利"}, "task": "产出《细分市场情报简报》：锁定你的价格带与 3 款直接竞品；拉出配置与价格差异表；写 3 个发现 + 1 条产品建议 + 待确认", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M1 整车产品规划与市场洞察」模块，你要交付的是《细分市场情报简报》。\n【场景】业务侧这周的诉求是：把方法落到你自己负责的那个价格带上，才算真的学会。参考做法：20 万级纯电 SUV 细分市场情报简报样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（细分市场情报简报模板（价格带 / 配置 / 竞品 / 结论）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《细分市场情报简报》填写模板】\n\n■ 1. 锁定你的价格带与 3 款直接竞品\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 拉出配置与价格差异表\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写 3 个发现 + 1 条产品建议 + 待确认\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   价格带：20–25 万纯电 SUV｜竞品：A/B/C 发现：三款均在改款中加后排屏；A 的智驾包降价 8000 元 建议：星河 L7 年款把后排屏纳入标配，智驾包维持选装以保毛利", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M1U4", "tier": "basic", "step": "spar", "title": "产品规划总监挑简报漏洞", "video": {"dur": "8min", "script": ["总监挑的不是错别字，是你结论底下那层依据是否站得住", "简报质询清单（样本 / 口径 / 时点）", "被问倒的简报 vs 站得住的简报"]}, "ppt": {"method": "简报质询清单（样本 / 口径 / 时点）", "case": "被问倒的简报 vs 站得住的简报", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：总监的三问", "n": "进入陪练，对手是产品规划总监。他不会夸你简报做得漂亮，只会追三个东西：口径、样本、时点。任何一个答不上来，他就会把你的结论打回。所以上场前，先把简报里每个数字的出处写在一旁，随问随答。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">总监的追问框架</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">口径</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">样本</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">时点</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：这个数哪来的", "n": "第一个高频问题是「这个数字哪个口径」。销量有上险量、批发量、终端交付量三种，优惠有官方指导价和终端成交价两回事。你必须在简报里就写清用的是哪一种。第二个问题是样本：几家店、几座城市。第三个是时点：上个月还是上周。三问答全，简报就站得住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">口径：上险量 / 批发 / 交付</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">样本：店数与城市数</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">时点：数据截止日期</tspan></text></svg>"}, {"t": "通过标准：承认不确定也算过关", "n": "有一个反直觉的点：承认不确定反而更容易过关。如果你说这个优惠数字只有一家店的单点反馈、样本不足，并说明下周补三个城市的样本，总监通常会放行。硬把不确定说成确定，一旦被戳破，整份简报的可信度都没了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每个数字答得出口径</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">样本不足时主动说明补证计划</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不把推测写成结论</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "细分市场情报简报", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《细分市场情报简报》并通过本单元评分要点"}, "spar": {"role": "产品规划总监", "persona": "只认数字与口径，会追到样本来源为止", "mustAsk": ["这个数字是哪个口径、哪个时点的？", "样本覆盖了几座城市、多少家店？", "如果终端优惠下个月变了，你的结论还成立吗？"]}, "task": "把《细分市场情报简报》拿到「产品规划总监」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《细分市场情报简报》。现在要让它通过「产品规划总监」这一关。\n【对手的立场】只认数字与口径，会追到样本来源为止。\n【他一定会追问】「这个数字是哪个口径、哪个时点的？」 / 「样本覆盖了几座城市、多少家店？」 / 「如果终端优惠下个月变了，你的结论还成立吗？」\n【场景】你说「产品规划总监挑简报漏洞」，对方立刻回一句：这个数字是哪个口径、哪个时点的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M1U5", "tier": "adv", "step": "understand", "title": "竞品车型监控框架与告警设计", "video": {"dur": "8min", "script": ["监控的价值不在看得全，而在变得时候你能第一时间知道", "竞品监控四维度（配置 / 价格 / 渠道 / 口碑）+ 告警阈值卡", "三款竞品一年内的改款节奏复盘"]}, "ppt": {"method": "竞品监控四维度（配置 / 价格 / 渠道 / 口碑）+ 告警阈值卡", "case": "三款竞品一年内的改款节奏复盘", "demo": "监控表模板（车型 / 维度 / 时点 / 来源）"}, "vslides": [{"t": "四维度监控框架", "n": "竞品监控拆成四个维度。配置维度看改款加了什么、砍了什么；价格维度看指导价调整与终端优惠；渠道维度看门店扩张与促销政策；口碑维度看社区舆情的高频抱怨点。四个维度合起来，才是一张完整的竞品画像，只盯配置会漏掉真正的成交因素。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">竞品监控四维度</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">配置</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">价格</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">渠道</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">口碑</tspan></text></g></svg>"}, {"t": "告警不是越多越好", "n": "设告警最容易犯的错是越多越好。结果一周几十条告警，两周后没人再看了。正确做法是每个维度只留一条最关键的指标，配上阈值和观察窗口。比如终端优惠降幅超过百分之五、且持续两周以上才告警。阈值加窗口，能把偶发抖动过滤掉。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">告警三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">定阈值</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">定观察窗口</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">留一条最关键指</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">标</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "从告警到动作：谁来处理", "n": "告警发出去只是开始。每条告警要绑定一个动作和一个责任人：配置变了由产品做差异分析，价格变了由销售出应对话术，口碑出现集中抱怨由质量与售后跟进。没有责任人的告警很快就会变成噪音，这一点比阈值设计更重要。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条告警绑定责任人</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">绑定第一动作</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每月复盘告警有效率</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "竞品车型监控表", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出含配置/价格/渠道/口碑四维度的监控表，并为每维设阈值与观察窗口"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】竞品监控四维度（配置 / 价格 / 渠道 / 口碑）+ 告警阈值卡\n【为什么重要】监控的价值不在看得全，而在变得时候你能第一时间知道\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M1U6", "tier": "adv", "step": "demo", "title": "监控 3 款竞品动向", "video": {"dur": "8min", "script": ["把框架跑通一遍，比看十遍框架图有用", "三车型 × 四维度监控演示（WorkBuddy 汇总）", "一次季度竞品扫描的完整过程"]}, "ppt": {"method": "三车型 × 四维度监控演示（WorkBuddy 汇总）", "case": "一次季度竞品扫描的完整过程", "demo": "WorkBuddy 汇总四维度信息并生成监控表"}, "vslides": [{"t": "演示准备：三款竞品一个季度", "n": "演示素材是三款直接竞品近一个季度的公开信息：改款公告、终端报价、门店动态和社区热帖。信息很杂，来源也杂，我们目标是用一次提示词把它整理成一张可追踪的监控表。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：3 款竞品 × 1 季度</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">配置/价格/渠道/口碑</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：一张监控表</tspan></text></g></svg>"}, {"t": "跑提示词：按车型 × 维度成表", "n": "把片段贴进 WorkBuddy，让它按车型乘维度生成表格，每格填变化内容、时点和来源类型。关键设计在这里：要求它额外给出三条需要人工核验的条目。AI 会诚实标出自己不确定的地方，这三条就是你要回查的重点。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">车型 × 维度监控表</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">配置</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">价格</tspan></text></g><g class=\"hl\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">渠道</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">口碑</tspan></text></g></svg>"}, {"t": "人工收口：补上销售侧的真实情况", "n": "表出来之后还有一步：把销售侧的真实情况补进去。公开信息看不到的是终端实际成交价和库存压力，这些只有销售同事知道。补完这一列，这张表才从「信息汇总」升级成「决策依据」。演示的意义就在这最后一步。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">公开信息已按维度成表</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不确定条目已标出</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">补入终端真实成交与库存</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "竞品车型监控表", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《竞品车型监控表》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是 3 款竞品近一个季度在配置、价格、渠道、口碑四个维度上的公开信息片段：\n[粘贴]\n请按「车型 × 维度」生成监控表，每格填：变化内容 / 时点 / 来源类型。并在表下给出 3 条需要我人工核验的条目，不要给出定价建议。"}, "task": "在 WorkBuddy 里把「三车型 × 四维度监控演示（WorkBuddy 汇总）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三车型 × 四维度监控演示（WorkBuddy 汇总）\n【参考案例】一次季度竞品扫描的完整过程\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是 3 款竞品近一个季度在配置、价格、渠道、口碑四个维度上的公开信息片段：\n[粘贴]\n请按「车型 × 维度」生成监控表，每格填：变化内容 / 时点 / 来源类型。并在表下给出 3 条需要我人工核验的条目，不要给出定价建议。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M1U7", "tier": "adv", "step": "todo", "title": "产出竞品监控月报模板", "video": {"dur": "8min", "script": ["模板的价值在于下个月你只需要填数，不需要重新想结构", "竞品监控月报模板（变化摘要 / 差异表 / 告警命中 / 建议）", "某车企月度竞品监控月报样例（脱敏）"]}, "ppt": {"method": "竞品监控月报模板（变化摘要 / 差异表 / 告警命中 / 建议）", "case": "某车企月度竞品监控月报样例（脱敏）", "demo": "模板填写指引"}, "vslides": [{"t": "第一步：定清单与维度", "n": "先把监控清单定死。车型不超过五款，多了填不完；维度固定四个，便于月度对比。清单一旦定下，至少维持两个季度不变，否则月度之间没法比。这一点看似琐碎，却是模板能不能长期用下去的关键。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 车型 ≤5 款</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 维度固定 4 个</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 维持两个季度不变</tspan></text></svg>"}, {"t": "第二步：给每个维度设阈值", "n": "阈值要具体到能被判定。配置维度：出现影响成交的增减项即记录；价格维度：指导价或终端优惠变动超过百分之五即告警；渠道维度：新增或关闭门店超过三家即记录；口碑维度：同一抱怨点一周内出现二十次以上即告警。写成判定句，下个月谁填都一致。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">配置：增减影响成交项</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">价格：变动 &gt;5%</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">渠道：门店变动 &gt;3 家</tspan></text><g><circle cx=\"30\" cy=\"154.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">口碑：同点 20 次/周</tspan></text></svg>"}, {"t": "第三步：月报骨架与责任人", "n": "最后把月报骨架定下来：五条变化摘要、一张差异表、命中告警清单、一条产品建议。每部分都要有填表人。骨架固定之后，你每月的工作就从「想怎么写」变成「把数填进去」，这才是模板真正的价值。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">月报骨架</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">变化摘要 5</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\"> 条</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\" ___________________________________________\n\n■ 2. 给每个维度设阈值与观察窗口\n   ‣ 提示：给出阈值、观察窗口、触发后的第一动作。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写月报骨架（摘要 / 差异表 / 告警 / 建议）\n   ‣ 提示：给出阈值、观察窗口、触发后的第一动作。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   车型：A/B/C｜维度：配置·价格·渠道·口碑 阈值：终端优惠降幅 >5% 且连续 2 周 → 告警 月报：变化摘要 5 条 + 差异表 1 张 + 告警命中 2 条 + 建议 1 条", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M1U8", "tier": "adv", "step": "spar", "title": "战略负责人复盘监控体系", "video": {"dur": "8min", "script": ["监控体系好不好，看的是它有没有真的改变过一次决策", "监控体系复盘清单（覆盖 / 时效 / 命中率 / 决策转化）", "一次监控体系复盘的问答实录"]}, "ppt": {"method": "监控体系复盘清单（覆盖 / 时效 / 命中率 / 决策转化）", "case": "一次监控体系复盘的问答实录", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：他要的是证据", "n": "对手是战略负责人。他不关心你监控得多全，只关心一件事：这套体系有没有真的改变过一次决策。所以上场前先翻一遍过去三个月的月报，找出至少一条被采纳的建议，这是你唯一的硬证据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">复盘四问</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">覆盖</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">时效</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">命中率</tspan></text></g><g class=\"hl\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">决策转化</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：命中率多少", "n": "第二个高频问题是告警命中率。如果三个月里二十条告警只有两条真正触发动作，命中率就是百分之十，这套阈值设计有问题。你要提前算好这个数字，并说明已经把哪几条无效告警关掉了。主动承认并调整，比被追问出来好得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">统计三个月告警总数</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">统计真正触发动作的数</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">算出命中率并给出调整方案</tspan></text></svg>"}, {"t": "第三问：砍一半会漏什么", "n": "最后一问最刁：砍掉一半监控项会漏掉什么。这是在考你知不知道哪些项真正重要。答法是把监控项按决策影响力排序，说清前三项绝对不能砍，后三项可以降频到季度监控。能给出排序依据，这关就过了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">按决策影响力排序</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">说出绝对不能砍的三项</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给出可降频项与替代频率</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "竞品监控月报模板", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《竞品监控月报模板》并通过本单元评分要点"}, "spar": {"role": "战略负责人", "persona": "看全局、追问这套体系有没有真的改变过决策", "mustAsk": ["这套监控上线以来，有没有哪次真的改变了产品决策？", "告警命中率多少，有多少是噪音？", "如果砍掉一半监控项，会漏掉什么？"]}, "task": "把《竞品监控月报模板》拿到「战略负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《竞品监控月报模板》。现在要让它通过「战略负责人」这一关。\n【对手的立场】看全局、追问这套体系有没有真的改变过决策。\n【他一定会追问】「这套监控上线以来，有没有哪次真的改变了产品决策？」 / 「告警命中率多少，有多少是噪音？」 / 「如果砍掉一半监控项，会漏掉什么？」\n【场景】你说「战略负责人复盘监控体系」，对方立刻回一句：这套监控上线以来，有没有哪次真的改变了产品决策？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M2", "title": "M2 用户与场景研究（智能座舱深挖）", "units": [{"id": "M2U1", "tier": "basic", "step": "understand", "title": "车主访谈→洞察方法与 AI 角色", "video": {"dur": "8min", "script": ["访谈研究里最贵的不是录音，是把录音变成可执行需求的那道工序", "研究流程图（人做设计 / AI 做机械 / 人做判断）", "一段车主访谈从录音到需求点的链路"]}, "ppt": {"method": "研究流程图（人做设计 / AI 做机械 / 人做判断）", "case": "一段车主访谈从录音到需求点的链路", "demo": "边界卡（哪些让 AI / 哪些人做）"}, "vslides": [{"t": "研究方法链：四个环节", "n": "从录音到需求点，中间有四道环节：转录、编码、聚类、提炼需求点。转录把语音变文字，编码给每句话贴标签，聚类把标签合成类目，最后从类目里提炼需求。这四道里，前两道最耗时也最机械，后两道最需要人。分工清楚了，AI 才知道往哪插手。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">研究方法链</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">转录</tspan></text></g><g class=\"hl\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">编码</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">聚类</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">需求点</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "AI 的角色：转录与初编码", "n": "AI 在这条链上能稳稳接住两件事。一是转录，现在的语音转写准确率已经足够做初稿；二是初编码，把每段话贴一个候选标签，你再来确认或改。这两件事原来要花掉研究团队大半时间，交给 AI 之后，人可以把精力放在真正难的环节上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">AI 做 · 人把关</tspan></text><g><rect x=\"50.0\" y=\"56.0\" width=\"140.0\" height=\"92.0\" rx=\"10\" fill=\"#1a5cff\" stroke=\"#7aa2ff\" stroke-width=\"2\"/><text x=\"120.0\" y=\"105.8\" font-size=\"12.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"120.0\">70</tspan></text></g><g><rect x=\"210.0\" y=\"56.0\" width=\"140.0\" height=\"92.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"280.0\" y=\"105.8\" font-size=\"12.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"280.0\">30</tspan></text></g></svg>"}, {"t": "边界：需求真伪只能人判", "n": "但需求真伪的判断不能交给 AI。车主说希望车机反应更快，背后可能是等红灯时想快速切歌，也可能是导航卡顿让他错过路口。这两种诉求对应完全不同的解法，AI 从文字里分不出来。区分「用户说的」和「用户做的」，是研究者不可替代的价值。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">AI 能做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人要做</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI：转录 / 初编码 / 聚</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">类</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">人：判真伪 / 定需求 /</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">排优先级</tspan></text></g></svg>"}], "deliverable": {"type": "skill", "name": "车主洞察提取", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "粘贴访谈转录，能产出画像 + 需求池，且每条需求带原文引用与频次"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】研究流程图（人做设计 / AI 做机械 / 人做判断）\n【为什么重要】访谈研究里最贵的不是录音，是把录音变成可执行需求的那道工序\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M2U2", "tier": "basic", "step": "demo", "title": "1 段访谈 → 画像 + 需求点", "video": {"dur": "8min", "script": ["把一段真实访谈跑通，你就知道这套方法到底省在哪", "访谈结构化演示（原文引用 / 编码 / 需求点）", "一段 20 分钟车主访谈转写稿"]}, "ppt": {"method": "访谈结构化演示（原文引用 / 编码 / 需求点）", "case": "一段 20 分钟车主访谈转写稿", "demo": "WorkBuddy 内跑一遍洞察提取提示词"}, "vslides": [{"t": "演示准备：一段脱敏转写稿", "n": "演示素材是一段二十分钟的车主访谈转写稿，已经去掉姓名与联系方式。里面有大量口语、重复和跑题，直接读要十几分钟还抓不住重点。我们的目标是用一次提示词把它变成画像加需求点。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：访谈转写稿（脱敏）</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约 20 分钟 / 口语化 / 有跑题</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：画像 + 需求点</tspan></text></g></svg>"}, {"t": "跑提示词：画像与需求点", "n": "把转写稿贴进 WorkBuddy 跑一遍。输出分三块：车主画像写清用车场景、关注点和决策因素；需求点清单每条都带原文引用和出现频次；最后是存疑条目。第三块最关键，它把「听起来像需求但证据不足」的话单独列出来，避免你被一句话带偏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输出三块</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">画像</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">需求点 + 引用</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">存疑条目</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：回贴原文核对", "n": "AI 给的引用必须回贴原文核一遍。这一步不能省，因为模型有时会生成一句听起来很像车主说的话，但原文里根本没有。核对方法很简单：拿引用去原文搜，搜不到就删掉这条需求。做完这一步，这份洞察才敢拿进评审会。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条引用能回贴原文</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">搜不到的引用已删除</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">频次已手工复核</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "车主洞察提取", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《车主洞察提取》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是一段车主访谈的转写稿（已脱敏，不含姓名与联系方式）：\n[粘贴]\n请输出：①车主画像（用车场景 / 关注点 / 决策因素）②需求点清单（每条包含：需求描述 / 原文引用 / 出现频次）③存疑条目（听起来像需求但证据不足的）。不要替我判断需求真伪。"}, "task": "在 WorkBuddy 里把「访谈结构化演示（原文引用 / 编码 / 需求点）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】访谈结构化演示（原文引用 / 编码 / 需求点）\n【参考案例】一段 20 分钟车主访谈转写稿\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是一段车主访谈的转写稿（已脱敏，不含姓名与联系方式）：\n[粘贴]\n请输出：①车主画像（用车场景 / 关注点 / 决策因素）②需求点清单（每条包含：需求描述 / 原文引用 / 出现频次）③存疑条目（听起来像需求但证据不足的）。不要替我判断需求真伪。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M2U3", "tier": "basic", "step": "todo", "title": "3 段访谈 → 画像 + 需求池", "video": {"dur": "8min", "script": ["单个样本是故事，三个样本才叫规律", "需求池模板（需求 / 引用 / 频次 / 真伪判定 / 优先级）", "三车主访谈合并出的需求池样例"]}, "ppt": {"method": "需求池模板（需求 / 引用 / 频次 / 真伪判定 / 优先级）", "case": "三车主访谈合并出的需求池样例", "demo": "需求池填写指引（先合并再排序）"}, "vslides": [{"t": "第一步：三段各跑一遍", "n": "先对三段访谈各跑一次洞察提取，不要合并跑。合并跑会把不同车主的话混在一起，频次就算不准了。分别跑完，你会拿到三份需求点清单，每份都带自己的引用。这一步看似重复，却是后面所有统计的基础。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 访谈 A → 需求点</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 访谈 B → 需求点</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 访谈 C → 需求点</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 合并</tspan></text></svg>"}, {"t": "第二步：合并同类项累计频次", "n": "把三份清单合并，相同语义的需求归成一条，频次累加。判据很简单：超过两个样本提到的痛点优先处理，只被一个人提过的进观察区。这个规则朴素，但在评审会上最难被推翻——因为它有数据，不是你觉得。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合并规则</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">归同类</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">累计频次</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">≥2 样本优先 /</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">单点进观察</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "第三步：真伪判定与排序", "n": "最后一步人来做。对每条需求判定真伪：有没有行为佐证，还是只是随口一说。真需求按频次和影响面排序，存疑的进观察区并写明需要补什么证据才能确认。排完序的需求池，就是下一阶段产品定义的输入。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条有真伪判定</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">真需求按频次排序</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">存疑项写明补证方式</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "车主需求池", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《车主需求池》并通过本单元评分要点"}, "practice": {"steps": ["跑 3 段访谈各出一份需求点", "合并同类项并累计频次", "对每条做真伪判定与优先级排序"], "exemplar": "需求：上车后想一步连上手机｜引用：「每次上车都要重新连，烦」×2｜频次：3/3｜真伪：真（有行为佐证） 需求：希望车机能办公｜引用：「偶尔想改个文档」×1｜频次：1/3｜真伪：存疑，进观察区"}, "task": "产出《车主需求池》：跑 3 段访谈各出一份需求点；合并同类项并累计频次；对每条做真伪判定与优先级排序", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M2 用户与场景研究（智能座舱深挖）」模块，你要交付的是《车主需求池》。\n【场景】业务侧这周的诉求是：单个样本是故事，三个样本才叫规律。参考做法：三车主访谈合并出的需求池样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（需求池模板（需求 / 引用 / 频次 / 真伪判定 / 优先级）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《车主需求池》填写模板】\n\n■ 1. 跑 3 段访谈各出一份需求点\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 合并同类项并累计频次\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 对每条做真伪判定与优先级排序\n   ‣ 提示：给出排序依据（频次 / 影响面 / 成本），不要只给结果。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   需求：上车后想一步连上手机｜引用：「每次上车都要重新连，烦」×2｜频次：3/3｜真伪：真（有行为佐证） 需求：希望车机能办公｜引用：「偶尔想改个文档」×1｜频次：1/3｜真伪：存疑，进观察区", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M2U4", "tier": "basic", "step": "spar", "title": "车主代表深挖需求", "video": {"dur": "8min", "script": ["陪练会逼你把「用户说想要」变成「用户在什么场景下做了什么」", "深挖追问清单（场景 / 行为 / 替代方案）", "被追问到露馅的需求 vs 站得住的需求"]}, "ppt": {"method": "深挖追问清单（场景 / 行为 / 替代方案）", "case": "被追问到露馅的需求 vs 站得住的需求", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：车主代表的三个追问", "n": "进入陪练，对手是一位车主代表。他不讲术语，只讲自己的日常。他会追问三个问题：你们真的看过我开车吗、我说想要和我真会用是一回事吗、我现在是怎么凑合的。这三个问题直指需求真伪，答不上就说明你只听了话，没看行为。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">深挖三问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">场景</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">行为</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">替代方案</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：现在怎么凑合", "n": "第三个问题最有杀伤力：这个功能我现在是怎么凑合过去的。如果车主已经有一套顺手的替代方案，比如用手机支架代替车机导航，那你这个功能就算做出来，也很难改变习惯。答这道题的关键是给出你观察到的具体行为，而不是复述访谈原话。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">他现在用什么替代</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">替代方案顺不顺手</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">凭什么认为新方案能替换掉</tspan></text></svg>"}, {"t": "通过标准：有行为观察才算过", "n": "通过标准很明确：你能说出车主在什么场景下、做了什么动作、遇到了什么障碍。只说「用户反馈希望有」不算过。如果确实没做过行为观察，正确的答法是承认，并说明下一步补一次跟车观察。诚实补证比硬撑更容易过关。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">说得出具体场景与动作</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">区分「说的」与「做的」</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">缺观察时给出补证计划</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "车主需求池", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《车主需求池》并通过本单元评分要点"}, "spar": {"role": "车主代表", "persona": "务实、爱吐槽，会追问你到底观察过没有", "mustAsk": ["你们真的看过我开车时的样子吗？", "我说想要，和我真的会用的，是一回事吗？", "这个功能我现在是怎么凑合过去的？"]}, "task": "把《车主需求池》拿到「车主代表」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《车主需求池》。现在要让它通过「车主代表」这一关。\n【对手的立场】务实、爱吐槽，会追问你到底观察过没有。\n【他一定会追问】「你们真的看过我开车时的样子吗？」 / 「我说想要，和我真的会用的，是一回事吗？」 / 「这个功能我现在是怎么凑合过去的？」\n【场景】你说「车主代表深挖需求」，对方立刻回一句：你们真的看过我开车时的样子吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M2U5", "tier": "adv", "step": "understand", "title": "用车场景分层与优先级", "video": {"dur": "8min", "script": ["座舱产品最容易犯的错，是把所有场景的诉求平均用力", "场景分层矩阵（频次 × 时长 × 情绪强度）", "通勤 / 长途 / 亲子三类场景的座舱诉求差异"]}, "ppt": {"method": "场景分层矩阵（频次 × 时长 × 情绪强度）", "case": "通勤 / 长途 / 亲子三类场景的座舱诉求差异", "demo": "场景分层卡（每类场景的核心时刻）"}, "vslides": [{"t": "场景不是人群，是时刻", "n": "先纠正一个常见误区：场景不等于人群。同一位车主，早上通勤赶时间、周末带娃出门、节假日跑长途，他要的东西完全不一样。所以分层的单位应该是「时刻」而不是「人」，这一点决定了后面所有设计的取舍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">容易跑偏</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">正确做法</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">按人群分层：新手/老手</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">按时刻分层：通勤/长途/</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">亲子</tspan></text></g></svg>"}, {"t": "分层三维度：频次、时长、情绪", "n": "每个场景用三个维度打分。频次是多久发生一次，时长是每次持续多久，情绪强度是这件事搞砸了车主会有多恼火。三个维度都高的场景，就是座舱必须做好的核心时刻。比如通勤高频、时长中等，但导航卡顿的情绪强度极高。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">场景分层三维度</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">频次</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">时长</tspan></text></g><g class=\"hl\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">情绪强度</tspan></text></g></svg>"}, {"t": "优先级：先保核心时刻", "n": "排完分就该做取舍了。资源有限，先把三个维度都高的两三个时刻做到极致，其余做到及格就行。座舱产品最容易犯的错就是平均用力，结果每个场景都差一口气。敢在次要场景上做减法，核心时刻才能真的做好。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">列出核心时刻 ≤3 个</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\"  x=\"52.0\">输入：12 个座舱场景</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">打分维度：频次/时长/情绪</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：三档优先级</tspan></text></g></svg>"}, {"t": "跑提示词：打分并分层", "n": "把清单贴进 WorkBuddy，让它按三个维度打分并输出分层矩阵。关键要求是打分依据必须注明来自哪条车主反馈。加了这条约束，它的打分就不再凭空，你可以逐条回查。跑出来的矩阵通常会把通勤导航、泊车、带娃排到前三。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">优先级三档</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">必须做好</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">做到及格</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">可延后</tspan></text></g></svg>"}, {"t": "人工收口：把排序拉回工程现实", "n": "AI 给的分层只基于车主反馈，不看工程成本。所以最后一步是把排序拉回现实：泊车体验提升要动域控制器，成本很高；车机语音响应优化主要是软件，成本低。把成本一列补进去，优先级往往会重排。这一步就是人不可替代的地方。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">补入工程成本一列</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">按性价比重排优先级</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明本轮放弃的场景与理由</tspan></text></svg>"}], "deliverable": {"type": "agent", "name": "场景分层师", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《场景分层师》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是我们梳理出的座舱使用场景清单：\n[粘贴]\n请按「频次 / 单次时长 / 搞砸后的情绪强度」三个维度为每个场景打分（1–5），输出分层矩阵，并给出优先级三档（必须做好 / 做到及格 / 可延后）。打分依据请注明是基于哪条车主反馈。"}, "task": "在 WorkBuddy 里把「场景库 → 分层矩阵 → 优先级清单演示」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】场景库 → 分层矩阵 → 优先级清单演示\n【参考案例】十二个座舱场景的分层结果\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是我们梳理出的座舱使用场景清单：\n[粘贴]\n请按「频次 / 单次时长 / 搞砸后的情绪强度」三个维度为每个场景打分（1–5），输出分层矩阵，并给出优先级三档（必须做好 / 做到及格 / 可延后）。打分依据请注明是基于哪条车主反馈。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M2U7", "tier": "adv", "step": "todo", "title": "建场景分层 + 旅程地图", "video": {"dur": "8min", "script": ["旅程地图把抽象的场景变成一格一格可下手的机会点", "旅程地图模板（阶段 / 动作 / 痛点 / 机会点 / 座舱能力）", "一次通勤旅程地图样例"]}, "ppt": {"method": "旅程地图模板（阶段 / 动作 / 痛点 / 机会点 / 座舱能力）", "case": "一次通勤旅程地图样例", "demo": "旅程地图填写指引"}, "vslides": [{"t": "第一步：拆阶段", "n": "选一个核心场景，比如通勤，把它从出门到停好车拆成五到七个阶段。每个阶段是一个时间点，不是一类功能。拆得太粗会漏掉痛点，拆得太细又填不完，五到七个刚好。拆完先在纸上画一条横线，这就是旅程的骨架。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 选核心场景</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 拆 5–7 个阶段</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 逐格填痛点</tspan></text></svg>"}, {"t": "第二步：每格填三样", "n": "每一格填三样东西：车主在这个阶段做了什么动作、遇到什么痛点、我们有什么机会点。动作要写具体的行为，比如「单手够中控屏切歌」，而不是「用车机」。痛点写具体障碍，机会点写能做什么。三样写全，这一格才算填完。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">旅程地图每格三样</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">动作</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">痛点</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">机会点</tspan></text></g></svg>"}, {"t": "第三步：映射到座舱能力", "n": "最后一列把机会点映射到具体座舱能力：语音、屏显、座椅、空调、音响还是域控逻辑。映射完你就能看出哪些能力被反复用到，那些就是投入重点。这一列补完，旅程地图就从研究材料变成了产品定义输入。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每个机会点映射到具体能力</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">统计被复用最多的能力</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给出本轮投入重点</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "座舱旅程地图", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《座舱旅程地图》并通过本单元评分要点"}, "practice": {"steps": ["选一个核心场景拆成 5–7 个阶段", "每阶段填动作 / 痛点 / 机会点", "把机会点映射到座舱能力并排优先级"], "exemplar": "阶段：上车启动｜动作：放包、连手机、设导航｜痛点：蓝牙重连慢｜机会点：上车自动续接上次导航 阶段：等红灯｜动作：切歌｜痛点：触控层级深｜机会点：方向盘一键切歌"}, "task": "产出《座舱旅程地图》：选一个核心场景拆成 5–7 个阶段；每阶段填动作 / 痛点 / 机会点；把机会点映射到座舱能力并排优先级", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M2 用户与场景研究（智能座舱深挖）」模块，你要交付的是《座舱旅程地图》。\n【场景】业务侧这周的诉求是：旅程地图把抽象的场景变成一格一格可下手的机会点。参考做法：一次通勤旅程地图样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（旅程地图模板（阶段 / 动作 / 痛点 / 机会点 / 座舱能力）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《座舱旅程地图》填写模板】\n\n■ 1. 选一个核心场景拆成 5–7 个阶段\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 每阶段填动作 / 痛点 / 机会点\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 把机会点映射到座舱能力并排优先级\n   ‣ 提示：给出排序依据（频次 / 影响面 / 成本），不要只给结果。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   阶段：上车启动｜动作：放包、连手机、设导航｜痛点：蓝牙重连慢｜机会点：上车自动续接上次导航 阶段：等红灯｜动作：切歌｜痛点：触控层级深｜机会点：方向盘一键切歌", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M2U8", "tier": "adv", "step": "spar", "title": "焦点小组：车主当面挑你的分层", "video": {"dur": "8min", "script": ["焦点小组最挑人的地方，是追问你这个分层凭什么代表大多数车主", "焦点小组质询清单（代表性 / 证据 / 取舍）", "一次焦点小组的高分回答与低分回答"]}, "ppt": {"method": "焦点小组质询清单（代表性 / 证据 / 取舍）", "case": "一次焦点小组的高分回答与低分回答", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：他们不会统一口径", "n": "进入陪练，你会同时面对几位车主。他们意见不一致，甚至互相反驳，这恰恰是真实焦点小组的样子。你要做的不是说服所有人，而是用证据说明分层的依据，并坦然承认哪些场景确实被牺牲了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">焦点小组三问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">样本代表性</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">排序依据</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">被砍场景</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：样本能代表我们吗", "n": "第一问是样本代表性。答法不要说「我们访谈了很多人」，要给出结构：多少位车主、覆盖几座城市、几类用车场景、有没有覆盖到你这一类。结构说得清，代表性就站得住；说不清，后面所有结论都会被质疑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">车主数 / 城市数</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">场景覆盖类型</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">有没有覆盖到提问者的类型</tspan></text></svg>"}, {"t": "最后一问：你砍掉的正是我常用的", "n": "最难的一问是「你砍掉的恰恰是我最常用的」。这时候不要辩解说那个场景不重要，正确的答法是：说明砍掉是因为本轮资源限制，而不是价值判断，并给出它在下一轮的排期。承认取舍比否认更能赢得信任。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">说明砍掉的原因是资源而非价值</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给出下一轮排期</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不否认车主的使用事实</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "座舱旅程地图", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《座舱旅程地图》并通过本单元评分要点"}, "spar": {"role": "焦点小组车主", "persona": "意见不一、互相反驳，会质疑样本代表性", "mustAsk": ["你们访谈的那几个人，能代表我们吗？", "凭什么把带娃场景排在通勤后面？", "你砍掉的那个场景，恰恰是我最常用的"]}, "task": "把《座舱旅程地图》拿到「焦点小组车主」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《座舱旅程地图》。现在要让它通过「焦点小组车主」这一关。\n【对手的立场】意见不一、互相反驳，会质疑样本代表性。\n【他一定会追问】「你们访谈的那几个人，能代表我们吗？」 / 「凭什么把带娃场景排在通勤后面？」 / 「你砍掉的那个场景，恰恰是我最常用的」\n【场景】你说「焦点小组：车主当面挑你的分层」，对方立刻回一句：你们访谈的那几个人，能代表我们吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M3", "title": "M3 配置定义、定价与车型生命周期", "units": [{"id": "M3U1", "tier": "basic", "step": "understand", "title": "配置清单与版本矩阵的写法", "video": {"dur": "8min", "script": ["配置矩阵写歪了，后面定价、采购、销售话术全都要返工", "版本矩阵结构（配置项 × 版本档位）", "一款车三个配置版本的矩阵样例"]}, "ppt": {"method": "版本矩阵结构（配置项 × 版本档位）", "case": "一款车三个配置版本的矩阵样例", "demo": "矩阵自查卡（有没有出现「高配比低配还多」的倒挂）"}, "vslides": [{"t": "配置清单：先列全再分档", "n": "做配置定义，第一步是把所有可能影响成交的配置项列全，不要边分档边想。列完之后再看哪些项适合做分档差异——通常是屏幕、音响、座椅、智驾、轮毂这几类。列全再分档，能避免后面发现漏项导致整张矩阵重排。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">配置定义三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">列全配置项</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">挑出可分档的项</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">按版本分配</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "版本矩阵：横竖都要读得通", "n": "矩阵要横竖都读得通。横着读，同一版本内的配置要自洽，不能出现运动套件配舒适悬架这种别扭组合；竖着读，每个配置项要随版本递增，绝不能出现高配比低配少的倒挂。倒挂一旦出现，销售话术就没法讲。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">配置项矩阵</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">屏幕</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">音响</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">座椅</tspan></text></g><g class=\"hl\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">智驾</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">轮毂</tspan></text></g></svg>"}, {"t": "边界：成本与产能决定上限", "n": "AI 能帮你把矩阵列整齐、检查倒挂，但它不知道你的成本和产能。某一项配置加到全系标配，会不会吃掉毛利；某个高阶配置供应商产能够不够，这些只有你和采购知道。所以矩阵永远是先由业务定边界，再让 AI 帮你整理和校验。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">AI 能做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人要做</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI：列矩阵 / 查倒挂 /</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">写话术</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">人：定成本边界 / 定产能</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">上限</tspan></text></g></svg>"}], "deliverable": {"type": "agent", "name": "配置定义师", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "输入卖点描述，能输出配置项 × 版本档位的矩阵，且无配置倒挂"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】版本矩阵结构（配置项 × 版本档位）\n【为什么重要】配置矩阵写歪了，后面定价、采购、销售话术全都要返工\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M3U2", "tier": "basic", "step": "demo", "title": "一句话卖点 → 配置矩阵", "video": {"dur": "8min", "script": ["把一句广告语落成可执行配置，是 PM 的基本功", "卖点 → 配置项 → 版本矩阵演示", "「二十万级最舒服的后排」落成配置矩阵"]}, "ppt": {"method": "卖点 → 配置项 → 版本矩阵演示", "case": "「二十万级最舒服的后排」落成配置矩阵", "demo": "WorkBuddy 内跑一遍配置矩阵生成"}, "vslides": [{"t": "演示准备：一句卖点", "n": "演示起点是一句卖点：「二十万级最舒服的后排」。这句话市场部很喜欢，但它对工程和采购毫无意义。我们要做的是把它拆成可执行配置项：后排座椅角度、腿托、后排屏、后排空调出风口、隔音玻璃。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一句卖点</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">「二十万级最舒服的后排」</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：配置项 × 版本矩阵</tspan></text></g></svg>"}, {"t": "跑提示词：从卖点到配置项", "n": "把卖点和配置项清单贴进 WorkBuddy 跑一遍。它会给出矩阵，并标出哪些项最能支撑这个卖点。注意提示词里我明确要求不给定价、不编成本——这两条约束很重要，否则它会编出一堆看起来专业但无法使用的数字。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示四步</tspan></text><g><rect x=\"
