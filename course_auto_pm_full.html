研发之间最贵的成本，是需求没说清楚导致的返工", "验收标准写法（前置条件 / 操作步骤 / 预期结果）", "「座舱响应要快」的歧义 vs 明确"]}, "ppt": {"method": "验收标准写法（前置条件 / 操作步骤 / 预期结果）", "case": "「座舱响应要快」的歧义 vs 明确", "demo": "对齐清单演示"}, "vslides": [{"t": "三件对齐物：需求 / 接口 / 验收", "n": "PM 与研发、供应商之间要对齐三件东西。需求说清要什么，接口说清怎么接，验收说清怎么判。三件里最常被跳过的是验收，可它恰恰是后面扯皮时唯一的依据。三件齐全，合作才谈得下去。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">对齐三件物</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">需求</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">接口</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">验收</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "验收标准三段式", "n": "验收标准写成三段：前置条件、操作步骤、预期结果。前置条件说清在什么状态下开始，操作步骤写清具体怎么操作，预期结果写清看到什么算通过。三段齐全，任何第三方都能照着测，这才叫验收标准。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">前置条件</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">操作步骤</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">预期结果</tspan></text></svg>"}, {"t": "「要快」到底是多少", "n": "最典型的需求歧义是「座舱响应要快」。快是多少？冷启动三秒内进主界面，还是语音指令八百毫秒内出反馈？写不出来的需求，做出来一定会被打回。把形容词换成数字，是 PM 在供应链协同里最该练的基本功。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">歧义</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">明确</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">响应要快（无法验收）</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">语音指令 ≤800ms 出反馈</tspan></text></g></svg>"}], "deliverable": {"type": "workflow", "name": "验收用例生成", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "模糊需求能拆成「前置 + 步骤 + 预期」三段式验收用例"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】验收标准写法（前置条件 / 操作步骤 / 预期结果）\n【为什么重要】供应链和研发之间最贵的成本，是需求没说清楚导致的返工\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M5U2", "tier": "basic", "step": "demo", "title": "模糊需求 → 验收用例", "video": {"dur": "8min", "script": ["把形容词换成数字，这一步 AI 能帮你起，但判据得你定", "模糊需求转验收用例演示", "把「后排屏要好操作」转成可测用例"]}, "ppt": {"method": "模糊需求转验收用例演示", "case": "把「后排屏要好操作」转成可测用例", "demo": "WorkBuddy 内跑一遍验收用例生成"}, "vslides": [{"t": "演示准备：一条模糊需求", "n": "演示起点是一句产品侧的原话：「后排屏要好操作，老人小孩也能用」。这句话方向没错，但完全没法测。多快算快？多大字算清楚？我们要把它变成五条能照着测的用例。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一句模糊需求</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">「后排屏要好操作」</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：5 条三段式用例</tspan></text></g></svg>"}, {"t": "跑提示词：拆成三段式用例", "n": "把需求贴进 WorkBuddy 跑一遍。它会给出五条用例，每条按前置、步骤、预期三段写，并把模糊表述转成量化描述。关键是最后那条约束：无法量化的部分要标注「需人工定义」——它会诚实指出哪些地方还需要你来拍板。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示四步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">拆成 5 条</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">每段三段</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">式</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">模糊转量</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">化</tspan></text></g><g class=\"hl\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">标出需人</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">工定义</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：把量化阈值定下来", "n": "AI 给的量化阈值常常是拍的，比如「点击响应三百毫秒」。这个数字对不对，要找工程和供应商确认：现有方案能到多少、行业水平是多少、测试环境怎么搭。把阈值确认完，用例才真正可用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">阈值与工程确认过</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">测试环境已说明</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">无法量化的项已人工定义</tspan></text></svg>"}], "deliverable": {"type": "workflow", "name": "验收用例生成", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《验收用例生成》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是产品侧提出的一条需求（原文）：「后排屏要好操作，老人小孩也能用」。\n请帮我把它拆成 5 条验收用例，每条按「前置条件 / 操作步骤 / 预期结果」三段写，并把模糊表述转成可测的量化描述。无法量化的部分请标注「需人工定义」。"}, "task": "在 WorkBuddy 里把「模糊需求转验收用例演示」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】模糊需求转验收用例演示\n【参考案例】把「后排屏要好操作」转成可测用例\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是产品侧提出的一条需求（原文）：「后排屏要好操作，老人小孩也能用」。\n请帮我把它拆成 5 条验收用例，每条按「前置条件 / 操作步骤 / 预期结果」三段写，并把模糊表述转成可测的量化描述。无法量化的部分请标注「需人工定义」。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M5U3", "tier": "basic", "step": "todo", "title": "写一组验收用例", "video": {"dur": "8min", "script": ["验收用例写得好，后期扯皮会少一半", "验收用例模板（用例 / 前置 / 步骤 / 预期 / 阈值来源）", "一组智能座舱验收用例样例"]}, "ppt": {"method": "验收用例模板（用例 / 前置 / 步骤 / 预期 / 阈值来源）", "case": "一组智能座舱验收用例样例", "demo": "填写指引（先拆用例后定阈值）"}, "vslides": [{"t": "第一步：拆成五条用例", "n": "把一条大需求拆成五条具体用例。拆分的依据是用户动作：每一次独立操作就是一条用例。拆完你会发现，原来一句「要好操作」背后至少藏着加载、点击、字体、误触、语音五种场景。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 首屏加载</tspan></text><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 点击响应</tspan></text><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 字体可读性</tspan></text><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 误触防护</tspan></text><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 语音兜底</tspan></text></svg>"}, {"t": "第二步：三段式逐条写", "n": "每条按前置、步骤、预期三段写。前置要具体到状态，比如车辆通电且座舱已启动；步骤要具体到动作，比如从主界面点击后排屏入口；预期要具体到可判定的结果。三段写完，测试同事不需要再来问你。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">前置具体到状态</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">步骤具体到动作</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">预期可判定</tspan></text></svg>"}, {"t": "第三步：阈值注明来源", "n": "最后一列是很多人会漏的：阈值来源。这个一点五秒是竞品实测值、行业惯例还是工程承诺？写清来源，后面被质疑时才有依据；来源为空的阈值，在评审时基本都会被要求补齐。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">阈值来源</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">阈值</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"78.0\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">来源：竞品实测</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">/ 行业惯例 / 工</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">程承诺</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">来源为空需补齐</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "验收用例清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《验收用例清单》并通过本单元评分要点"}, "practice": {"steps": ["把一条模糊需求拆成 5 条用例", "每条按前置 / 步骤 / 预期三段写", "为每条的量化阈值注明来源或依据"], "exemplar": "用例：后排屏首屏加载｜前置：车辆通电、座舱已启动｜步骤：从主界面点击后排屏入口｜预期：≤1.5s 完成首屏渲染｜阈值来源：对标竞品实测 1.8s"}, "task": "产出《验收用例清单》：把一条模糊需求拆成 5 条用例；每条按前置 / 步骤 / 预期三段写；为每条的量化阈值注明来源或依据", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M5 供应链协同与研发交付」模块，你要交付的是《验收用例清单》。\n【场景】业务侧这周的诉求是：验收用例写得好，后期扯皮会少一半。参考做法：一组智能座舱验收用例样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（验收用例模板（用例 / 前置 / 步骤 / 预期 / 阈值来源）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《验收用例清单》填写模板】\n\n■ 1. 把一条模糊需求拆成 5 条用例\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 每条按前置 / 步骤 / 预期三段写\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 为每条的量化阈值注明来源或依据\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   用例：后排屏首屏加载｜前置：车辆通电、座舱已启动｜步骤：从主界面点击后排屏入口｜预期：≤1.5s 完成首屏渲染｜阈值来源：对标竞品实测 1.8s", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M5U4", "tier": "basic", "step": "spar", "title": "研发与供应商挑需求漏洞", "video": {"dur": "8min", "script": ["研发和供应商挑的每一个问题，都是在帮你提前省掉一轮返工", "需求质询清单（可测性 / 依赖 / 边界）", "被挑到改的需求 vs 一次通过的需求"]}, "ppt": {"method": "需求质询清单（可测性 / 依赖 / 边界）", "case": "被挑到改的需求 vs 一次通过的需求", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：他们讲约束", "n": "对手是研发与供应商代表，他们不讲愿景，只讲约束。三个必问：阈值做得到吗、异常情况写了吗、依赖谁负责。上场前把每条用例的阈值依据和上游依赖列成一张表，随问随答。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">质询三问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">可测性</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">异常情况</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">上游依赖</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：异常情况写了吗", "n": "最常被挑的是异常情况。你写了正常流程的验收，有没有写断网怎么办、低温启动怎么办、屏幕触控失灵时的兜底怎么办？用例里至少要有一条异常场景。没写异常的需求，上线后出问题的概率非常高。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">断网 / 弱网</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">低温 / 高温启动</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">触控失效时的语音兜底</tspan></text></svg>"}, {"t": "最后一问：依赖谁负责", "n": "第三问问的是依赖。这个能力依赖域控制器的哪个版本、依赖供应商的哪次固件更新、依赖哪个团队先交付。把依赖和责任人写清楚，才不会出现上线前才发现上游没就绪的情况。答清依赖，这关就过了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">列出上游依赖清单</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项写明责任人</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明最晚就绪时点</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "验收用例清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《验收用例清单》并通过本单元评分要点"}, "spar": {"role": "研发与供应商代表", "persona": "务实、讲约束，追问依赖与边界条件", "mustAsk": ["这个阈值在我们现有方案上做得到吗？", "异常情况怎么处理，你写了吗？", "这个功能依赖哪些上游，谁负责？"]}, "task": "把《验收用例清单》拿到「研发与供应商代表」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《验收用例清单》。现在要让它通过「研发与供应商代表」这一关。\n【对手的立场】务实、讲约束，追问依赖与边界条件。\n【他一定会追问】「这个阈值在我们现有方案上做得到吗？」 / 「异常情况怎么处理，你写了吗？」 / 「这个功能依赖哪些上游，谁负责？」\n【场景】你说「研发与供应商挑需求漏洞」，对方立刻回一句：这个阈值在我们现有方案上做得到吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M5U5", "tier": "adv", "step": "understand", "title": "交付监控与风险看板", "video": {"dur": "8min", "script": ["车企最怕的不是缺货本身，是缺货了三天才知道", "监控三类告警（阈值 / 趋势 / 突变）+ 风险看板结构", "一次零部件缺货风险从预警到处理的链路"]}, "ppt": {"method": "监控三类告警（阈值 / 趋势 / 突变）+ 风险看板结构", "case": "一次零部件缺货风险从预警到处理的链路", "demo": "风险看板模板演示"}, "vslides": [{"t": "告警三类：阈值、趋势、突变", "n": "告警分三类。阈值类看绝对值，比如库存低于安全水位；趋势类看连续变化，比如到货及时率连续三周下滑；突变类看瞬时跳升，比如某供应商当日缺货项数翻倍。三类覆盖不同的失效模式，只配一类就会漏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">告警三类</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">阈值</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">趋势</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">突变</tspan></text></g></svg>"}, {"t": "风险看板：四列就够", "n": "风险看板不用复杂，四列就够：风险项、当前状态、趋势、责任人与下一步动作。第五列千万别加，加了就没人填。看板的价值在于每周例会时所有人看同一张表，而不是每个人各说各的版本。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">风险看板四列</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">风险项</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">当前状态</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">趋势</tspan></text></g><g class=\"hl\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">责任人 +</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">下一步</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "告警必须绑人和动作", "n": "最后一个原则：每条告警必须绑定责任人和第一动作。库存告警的责任人是采购，第一动作是确认到货计划；到货及时率告警的责任人是物流，第一动作是查在途。没有责任人的告警，很快就会变成没人看的噪音。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条告警有责任人</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条告警有第一动作</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每月复盘告警有效率</tspan></text></svg>"}], "deliverable": {"type": "agent", "name": "交付监控官", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出含阈值/趋势/突变三类告警的监控方案，且每条告警绑定责任人与第一动作"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】监控三类告警（阈值 / 趋势 / 突变）+ 风险看板结构\n【为什么重要】车企最怕的不是缺货本身，是缺货了三天才知道\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M5U6", "tier": "adv", "step": "demo", "title": "配一条零部件交付告警", "video": {"dur": "8min", "script": ["配一条告警不难，难的是配完之后它真的有用", "交付告警配置演示（阈值 / 窗口 / 动作）", "某关键零部件到货及时率告警配置"]}, "ppt": {"method": "交付告警配置演示（阈值 / 窗口 / 动作）", "case": "某关键零部件到货及时率告警配置", "demo": "WorkBuddy 内跑一遍告警配置提示词"}, "vslides": [{"t": "演示准备：一段历史数据", "n": "演示素材是某关键零部件近十二周的到货及时率，在百分之八十八到九十七之间波动，安全库存是两周用量。如果只按「低于九成就告警」，波动期间会频繁误报。我们要配一条真正有用的告警。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：近 12 周到货及时率</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">波动区间 88%–97%</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">安全库存 2 周</tspan></text></g></svg>"}, {"t": "跑提示词：定类型、阈值、动作", "n": "把数据贴进 WorkBuddy 跑一遍。它会给出告警类型建议、具体阈值与观察窗口、触发后的第一动作与责任人，还会给出避免误报的办法。通常它建议用趋势类而不是阈值类——连续两周低于百分之九十才告警，比单次低于九成稳得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">配置四步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">选告警类</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">型</tspan></text></g><g class=\"hl\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">定阈值与</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">窗口</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">绑责任人</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">与动作</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">定误报过</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">滤</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：拿历史数据回测", "n": "配完不能直接用，要拿过去十二周的数据回测一遍：这条告警会触发几次、有没有误报、每次是不是真的需要动作。回测完再上线。这一步是告警设计里最容易被跳过、也最不该跳过的环节。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">用历史数据回测</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">统计触发次数与误报率</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">误报率高则调整窗口</tspan></text></svg>"}], "deliverable": {"type": "agent", "name": "交付监控官", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《交付监控官》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "我们要为关键零部件的到货及时率配置一条监控告警。历史数据：近 12 周及时率在 88%–97% 之间波动，安全库存为 2 周用量。\n请帮我设计：①告警类型（阈值/趋势/突变）②具体阈值与观察窗口 ③触发后的第一动作与责任人 ④如何避免误报。"}, "task": "在 WorkBuddy 里把「交付告警配置演示（阈值 / 窗口 / 动作）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】交付告警配置演示（阈值 / 窗口 / 动作）\n【参考案例】某关键零部件到货及时率告警配置\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n我们要为关键零部件的到货及时率配置一条监控告警。历史数据：近 12 周及时率在 88%–97% 之间波动，安全库存为 2 周用量。\n请帮我设计：①告警类型（阈值/趋势/突变）②具体阈值与观察窗口 ③触发后的第一动作与责任人 ④如何避免误报。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M5U7", "tier": "adv", "step": "todo", "title": "写交付风险监控方案", "video": {"dur": "8min", "script": ["监控方案写在纸上，出事时才有人知道自己该做什么", "交付风险监控方案模板（风险项 / 告警 / 责任人 / 升级路径）", "一份完整的零部件交付风险监控方案"]}, "ppt": {"method": "交付风险监控方案模板（风险项 / 告警 / 责任人 / 升级路径）", "case": "一份完整的零部件交付风险监控方案", "demo": "填写指引（先列风险后配告警）"}, "vslides": [{"t": "第一步：列五个风险项", "n": "先列五个关键交付风险项。选择的依据是「一旦发生就会影响整车交付」，通常包括长周期芯片、进口件、单一供应商件、新导入件和法规件。列五个就够，再多就管不过来了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 长周期芯片</tspan></text><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 进口件</tspan></text><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 单一供应商件</tspan></text><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 新导入件</tspan></text><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 法规件</tspan></text></svg>"}, {"t": "第二步：逐项配告警", "n": "每项配告警类型、阈值与观察窗口。长周期芯片适合趋势类，因为它的恶化是渐进的；进口件适合突变类，因为清关延误往往是瞬时的；法规件适合阈值类，因为有明确的截止时点。按失效模式选类型，告警才准。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">按失效模式选类型</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">长周期件 → 趋势</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">进口件 → 突变</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">法规件 → 阈值</tspan></text></g></svg>"}, {"t": "第三步：写清升级路径", "n": "最后写升级路径：多久没解决就往上报、报到哪一级。升级路径是监控方案里最常被漏掉、也最救命的一列。没有升级路径，风险就会在某个环节静静躺到爆发。写清时间和层级，方案才算完整。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明升级触发时间</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明升级到哪一级</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明每级需要谁拍板</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "交付风险监控方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《交付风险监控方案》并通过本单元评分要点"}, "practice": {"steps": ["列出 5 个关键交付风险项", "为每个风险项配告警类型、阈值与观察窗口", "写明责任人、第一动作与升级路径"], "exemplar": "风险项：某芯片到货延迟｜告警：趋势类，及时率连续 2 周 <90%｜责任人：采购 A｜第一动作：确认在途与替代料 升级路径：1 周未解决 → 上报项目组 → 2 周未解决 → 上报经营会"}, "task": "产出《交付风险监控方案》：列出 5 个关键交付风险项；为每个风险项配告警类型、阈值与观察窗口；写明责任人、第一动作与升级路径", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M5 供应链协同与研发交付」模块，你要交付的是《交付风险监控方案》。\n【场景】业务侧这周的诉求是：监控方案写在纸上，出事时才有人知道自己该做什么。参考做法：一份完整的零部件交付风险监控方案。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（交付风险监控方案模板（风险项 / 告警 / 责任人 / 升级路径）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《交付风险监控方案》填写模板】\n\n■ 1. 列出 5 个关键交付风险项\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 为每个风险项配告警类型、阈值与观察窗口\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写明责任人、第一动作与升级路径\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   风险项：某芯片到货延迟｜告警：趋势类，及时率连续 2 周 <90%｜责任人：采购 A｜第一动作：确认在途与替代料 升级路径：1 周未解决 → 上报项目组 → 2 周未解决 → 上报经营会", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M5U8", "tier": "adv", "step": "spar", "title": "停线事故复盘", "video": {"dur": "8min", "script": ["复盘里「说人」的地方越少，改进项才越有效", "复盘清单（时间线 / 根因 / 改进项 / 责任人时限）", "一次停线事故复盘的高分与低分做法"]}, "ppt": {"method": "复盘清单（时间线 / 根因 / 改进项 / 责任人时限）", "case": "一次停线事故复盘的高分与低分做法", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：先还原时间线", "n": "对手是复盘主持人，他第一件事是还原时间线。什么时候第一次出现异常信号、什么时候升级、什么时候停线。上场前先把这条时间线画出来，你会发现信号往往早就出现了，只是没人动。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">复盘时间线</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">首次信号</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">升级时点</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">停线时点</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：为什么没人动", "n": "最尖锐的一问是：信号早就有了，为什么没人动。答案通常不是某个人疏忽，而是流程缺口——告警没有绑定责任人、或者升级路径没写清。把根因指到流程而不是人，改进项才立得住，团队也才愿意配合。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">低分</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">高分</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">根因 = 某人疏忽（改不了</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">什么）</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">根因 = 流程缺口（可改进</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">）</tspan></text></g></svg>"}, {"t": "改进项：责任人与时限", "n": "最后一个要求：每条改进项都要有责任人和完成时限。没有责任人和时限的复盘，等于没复盘。写成「优化告警机制」不算，要写成「由采购 A 在两周内为五类关键件补上告警配置」。具体到人、到日期，才算合格。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条改进项有责任人</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条有明确完成日期</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有验收方式</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "交付风险监控方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《交付风险监控方案》并通过本单元评分要点"}, "spar": {"role": "项目复盘主持人", "persona": "只认时间线与根因，追问改进项有没有责任人与时限", "mustAsk": ["停线前多久就有信号了，为什么没人动？", "根因是什么，别给我表面原因", "改进项谁负责、什么时候完成？"]}, "task": "把《交付风险监控方案》拿到「项目复盘主持人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《交付风险监控方案》。现在要让它通过「项目复盘主持人」这一关。\n【对手的立场】只认时间线与根因，追问改进项有没有责任人与时限。\n【他一定会追问】「停线前多久就有信号了，为什么没人动？」 / 「根因是什么，别给我表面原因」 / 「改进项谁负责、什么时候完成？」\n【场景】你说「停线事故复盘」，对方立刻回一句：停线前多久就有信号了，为什么没人动？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M6", "title": "M6 车辆数据安全与合规下的 AI 用法", "units": [{"id": "M6U1", "tier": "basic", "step": "understand", "title": "车辆数据分级与 AI 红线", "video": {"dur": "8min", "script": ["车企的数据分级比一般行业更细，因为车辆数据同时关系个人与公共安全", "数据分级图 + 红线三原则", "车架号 / 位置轨迹 / 座舱影像的分级示例"]}, "ppt": {"method": "数据分级图 + 红线三原则", "case": "车架号 / 位置轨迹 / 座舱影像的分级示例", "demo": "分级自查卡"}, "vslides": [{"t": "车辆数据分四级", "n": "车辆与车主数据通常分四级。公开级是已经发布的宣传材料；内部级是未发布的车型规划与配置；敏感级是车架号、位置轨迹、座舱影像这类能关联到人的数据；重要级是涉及地理信息与大规模车辆运行的数据。级别决定它能去哪。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">车辆数据四级</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">公开</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">内部</tspan></text></g><g class=\"hl\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">敏感</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">重要</tspan></text></g></svg>"}, {"t": "红线三原则", "n": "三条红线在这里要落到具体动作：敏感及以上数据一律不进公开大模型，只能走私有部署；涉及个人的数据要确认用户授权范围；每次调用要留痕，能回答这次用了什么数据、给了什么输出。三原则落到动作才拦得住风险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">敏感及以上不进公开模型</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">个人数据确认授权范围</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每次调用留痕可审计</tspan></text></svg>"}, {"t": "最小化和脱敏的顺序", "n": "脱敏有固定顺序，不能反。先删除整体身份信息，比如姓名与手机号；再把剩余标识替换成占位符，比如车架号换成样本编号；最后只保留完成任务必需的字段。顺序反了会漏掉可复原的标识。这三步做完，数据才敢用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">脱敏三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">删除身份信息</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">替换成占位符</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">只留必需字段</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "合规检查", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "贴交付物能按清单逐项判定命中，输出待改项且不越权给定性"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】数据分级图 + 红线三原则\n【为什么重要】车企的数据分级比一般行业更细，因为车辆数据同时关系个人与公共安全\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M6U2", "tier": "basic", "step": "demo", "title": "「安全用 AI」规范样例", "video": {"dur": "8min", "script": ["规范要能被一眼看懂，贴在工位上才有用", "安全用 AI 规范生成演示（分级 / 红线 / 动作）", "一份可直接发的《产品部 AI 使用规范》样例"]}, "ppt": {"method": "安全用 AI 规范生成演示（分级 / 红线 / 动作）", "case": "一份可直接发的《产品部 AI 使用规范》样例", "demo": "WorkBuddy 内跑一遍规范生成"}, "vslides": [{"t": "演示准备：从原则到动作", "n": "很多部门的 AI 规范写出来没人看，因为通篇都是原则。我们要做一份一页纸、全是动作的规范。演示起点就是这几条原则：敏感数据不出域、个人数据看授权、调用要留痕，看怎么把它们翻成动作。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：三条原则</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：一页纸规范</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">要求：全是可执行动作</tspan></text></g></svg>"}, {"t": "跑提示词：翻成五条动作", "n": "把要求贴进 WorkBuddy 跑一遍。它会给出四级数据的处置说明、五条可执行动作、三个高频踩坑场景。关键在第二条约束：不要给出法律定性结论。规范里可以有操作要求，但不能替法务下合规结论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">规范三块</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">四级数据处置</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">5 条可执行动作</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">3 个踩坑场景</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：找法务过一遍", "n": "规范草稿出来后，必须找法务与数据安全同事过一遍。他们通常会改两类地方：把某些表述改成引用具体制度条款，把某些动作加上前置审批。过完这一遍，规范才敢正式发布。这一步绝不能省。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">法务已审阅</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">制度条款已引用</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">审批路径已写明</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "合规检查", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《合规检查》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "请帮我起草一份《产品部 AI 使用规范（试用）》，面向产品经理日常使用。要求：①按公开/内部/敏感/重要四级说明什么能进 AI、什么不能 ②给出 5 条可直接执行的动作（而非原则性表述）③列出 3 个高频踩坑场景及正确做法 ④篇幅控制在一页内。不要给出法律定性结论。"}, "task": "在 WorkBuddy 里把「安全用 AI 规范生成演示（分级 / 红线 / 动作）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】安全用 AI 规范生成演示（分级 / 红线 / 动作）\n【参考案例】一份可直接发的《产品部 AI 使用规范》样例\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n请帮我起草一份《产品部 AI 使用规范（试用）》，面向产品经理日常使用。要求：①按公开/内部/敏感/重要四级说明什么能进 AI、什么不能 ②给出 5 条可直接执行的动作（而非原则性表述）③列出 3 个高频踩坑场景及正确做法 ④篇幅控制在一页内。不要给出法律定性结论。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M6U3", "tier": "basic", "step": "todo", "title": "写岗位 AI 红线清单", "video": {"dur": "8min", "script": ["通用的红线记不住，落到你自己岗位的具体动作才拦得住", "岗位红线清单模板（场景 / 风险 / 动作 / 依据）", "车企产品经理岗位红线清单样例"]}, "ppt": {"method": "岗位红线清单模板（场景 / 风险 / 动作 / 依据）", "case": "车企产品经理岗位红线清单样例", "demo": "填写指引（先场景后动作）"}, "vslides": [{"t": "第一步：列五个高频场景", "n": "先列出你自己岗位最常用的五个 AI 场景。不要抄通用清单，要写你真的在做的事：分析车主访谈、做竞品对比、写配置 PRD、整理会议纪要、查订单数据。场景越具体，后面的红线才写得准。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 车主访谈分析</tspan></text><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 竞品对比</tspan></text><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 配置 PRD</tspan></text><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 会议纪要</tspan></text><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 订单查数</tspan></text></svg>"}, {"t": "第二步：逐场景写风险", "n": "每个场景写它可能触的红线。车主访谈的风险是转写稿含手机号与车牌；竞品对比的风险是不小心混入内部成本数据；订单查数的风险是查到了车主个人信息。风险写具体，规避动作才有针对性。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每个场景至少一条风险</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风险写到具体数据项</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不写笼统的「有泄露风险」</tspan></text></svg>"}, {"t": "第三步：每条配一个动作", "n": "最后为每个场景配一条可执行的规避动作，写到怎么做为止。比如「转写前先跑脱敏脚本，只保留结构化字段」。动作要能在日常里真的执行，写「加强意识」这种不算。五条动作写完，这张清单就能贴工位了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">清单三列</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">场景</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">风险</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可执行的规避动</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">作</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "岗位 AI 红线清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《岗位 AI 红线清单》并通过本单元评分要点"}, "practice": {"steps": ["列出你岗位 5 个高频 AI 使用场景", "为每个场景写出可能触的红线与风险", "为每个场景写一条可执行的规避动作"], "exemplar": "场景：用 AI 分析车主访谈｜风险：转写稿含手机号与车牌｜动作：转写前先跑脱敏脚本，只保留结构化字段 场景：用 AI 竞品对比｜风险：混入内部成本数据｜动作：竞品分析只用公开材料，内部成本另走内网流程"}, "task": "产出《岗位 AI 红线清单》：列出你岗位 5 个高频 AI 使用场景；为每个场景写出可能触的红线与风险；为每个场景写一条可执行的规避动作", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M6 车辆数据安全与合规下的 AI 用法」模块，你要交付的是《岗位 AI 红线清单》。\n【场景】业务侧这周的诉求是：通用的红线记不住，落到你自己岗位的具体动作才拦得住。参考做法：车企产品经理岗位红线清单样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（岗位红线清单模板（场景 / 风险 / 动作 / 依据）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《岗位 AI 红线清单》填写模板】\n\n■ 1. 列出你岗位 5 个高频 AI 使用场景\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 为每个场景写出可能触的红线与风险\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 为每个场景写一条可执行的规避动作\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   场景：用 AI 分析车主访谈｜风险：转写稿含手机号与车牌｜动作：转写前先跑脱敏脚本，只保留结构化字段 场景：用 AI 竞品对比｜风险：混入内部成本数据｜动作：竞品分析只用公开材料，内部成本另走内网流程", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M6U4", "tier": "basic", "step": "spar", "title": "合规审计抽查", "video": {"dur": "8min", "script": ["审计不看你说什么，只看你拿得出什么记录", "审计抽查清单（留痕 / 授权 / 越界）", "一次合规审计的问答实录"]}, "ppt": {"method": "审计抽查清单（留痕 / 授权 / 越界）", "case": "一次合规审计的问答实录", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：他要的是记录", "n": "对手是合规审计员，他不听解释，只要记录。三个必问：这次用了什么数据、记录在哪；涉及车主数据的授权文件；输出被用于什么决策、谁签字。上场前把调用留痕表和用户授权范围文件准备好。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">审计三问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">留痕</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">授权</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">输出去向</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：授权文件呢", "n": "第二问最难：涉及车主数据的授权文件在哪。这要求你平时就知道每一类数据的授权范围——座舱影像授权了哪些用途、位置数据授权到什么粒度、授权有效期到哪天。这些如果平时没整理，审计时一定答不上来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">数据类别</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">授权用途范围</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">有效期与撤回机制</tspan></text></svg>"}, {"t": "最后一问：谁签的字", "n": "第三问问输出去向：AI 的建议被用于什么决策、谁签的字。这一问考的是责任边界有没有落实。答法是给出决策记录：哪份材料用了 AI 输出、哪几处由人修改、最终由谁签字。有记录，这一关就过了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">能给出决策记录</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">标出 AI 输出被人工修改处</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">最终签字人明确</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "岗位 AI 红线清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《岗位 AI 红线清单》并通过本单元评分要点"}, "spar": {"role": "合规审计员", "persona": "只看记录与授权文件，不听解释", "mustAsk": ["这次调用用了什么数据，记录在哪？", "涉及车主数据的话，授权文件给我看", "输出被用于什么决策，谁签的字？"]}, "task": "把《岗位 AI 红线清单》拿到「合规审计员」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《岗位 AI 红线清单》。现在要让它通过「合规审计员」这一关。\n【对手的立场】只看记录与授权文件，不听解释。\n【他一定会追问】「这次调用用了什么数据，记录在哪？」 / 「涉及车主数据的话，授权文件给我看」 / 「输出被用于什么决策，谁签的字？」\n【场景】你说「合规审计抽查」，对方立刻回一句：这次调用用了什么数据，记录在哪？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M6U5", "tier": "adv", "step": "understand", "title": "智能网联数据合规与用户授权", "video": {"dur": "8min", "script": ["智能网联汽车的数据合规，是车企 PM 绕不开的一道硬门槛", "数据合规三要素（分类分级 / 授权同意 / 出境评估）", "一次座舱数据新功能的合规评估"]}, "ppt": {"method": "数据合规三要素（分类分级 / 授权同意 / 出境评估）", "case": "一次座舱数据新功能的合规评估", "demo": "合规评估卡演示"}, "vslides": [{"t": "合规三要素", "n": "智能网联场景下的数据合规有三要素。分类分级，确定每类数据属于哪一级别；授权同意，确认用户授权覆盖了这次用途；出境评估，确认数据是否跨境以及是否需要评估。三要素缺一，功能就不能上线。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合规三要素</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">分类分级</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">授权同意</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">出境评估</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "授权不是一次性的", "n": "最容易踩的坑是把授权当成一次性动作。用户授权座舱影像用于行车安全，不代表可以用于产品优化；授权时同意了，也可以随时撤回。所以每次新增用途都要回到授权范围确认一遍，并且支持撤回。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">常见错误</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">正确做法</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">授权一次到处用</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">每次新增用途回查授权范</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">围</tspan></text></g></svg>"}, {"t": "边界：合规结论必须由法务下", "n": "AI 能帮你列出需要确认的合规要点、比对条款、整理材料，但绝不能替法务下合规结论。原因是合规判断依赖大量上下文：业务实质、数据流向、属地要求。用 AI 做清单，用法务做判断，这条边界不能越。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">AI 出清单</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">法务下结论</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论留痕存档</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "数据合规要点库", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "输入一个功能描述，能输出需确认的合规要点清单，且不给出合规定性结论"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】数据合规三要素（分类分级 / 授权同意 / 出境评估）\n【为什么重要】智能网联汽车的数据合规，是车企 PM 绕不开的一道硬门槛\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M6U6", "tier": "adv", "step": "demo", "title": "AI 辅助数据合规自查材料", "video": {"dur": "8min", "script": ["自查材料做得好，法务评审能少来回三轮", "合规自查材料生成演示（要点清单 / 待确认 / 材料索引）", "一个新座舱功能的合规自查材料"]}, "ppt": {"method": "合规自查材料生成演示（要点清单 / 待确认 / 材料索引）", "case": "一个新座舱功能的合规自查材料", "demo": "WorkBuddy 内跑一遍自查提示词"}, "vslides": [{"t": "演示准备：一个新功能", "n": "演示场景是一个新功能：座舱检测到驾驶员疲劳时，上传脱敏后的姿态特征用于模型优化。看着很常规，但涉及数据类别、级别、授权范围、是否出境四件事。我们要把它整理成一份法务能直接看的自查材料。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一个新功能描述</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">疲劳检测 → 上传脱敏姿态特征</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：合规自查材料</tspan></text></g></svg>"}, {"t": "跑提示词：出清单不出结论", "n": "把描述贴进 WorkBuddy 跑一遍。它会给出数据类别与级别、需确认的合规要点、要问法务的问题列表、以及材料索引。关键的最后一条约束是绝不给出「是否合规」的定性结论——那是法务的职责，AI 越界给出反而危险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">自查四块</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">数据类别</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">与级别</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">合规要点</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">清单</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">问法务的</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">问题</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">材料索引</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：带着问题去问法务", "n": "材料出来后，最有价值的是那份「要问法务的问题列表」。带着这张清单去问，法务不用再从头理解业务，评审来回的轮次能从三轮压到一轮。这就是 AI 在合规工作里真正的杠杆点：不是下结论，是减少沟通成本。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">问题清单已整理</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">业务背景材料已附</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论由法务出具</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "数据合规要点库", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《数据合规要点库》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "我们计划上线一个新功能：座舱在检测到驾驶员疲劳时，上传一段脱敏后的姿态特征（不含影像）用于模型优化。\n请帮我整理一份合规自查材料：①涉及哪些数据类别与级别 ②需要确认的合规要点清单 ③需向法务确认的问题列表 ④材料索引。不要给出「是否合规」的定性结论。"}, "task": "在 WorkBuddy 里把「合规自查材料生成演示（要点清单 / 待确认 / 材料索引）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】合规自查材料生成演示（要点清单 / 待确认 / 材料索引）\n【参考案例】一个新座舱功能的合规自查材料\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n我们计划上线一个新功能：座舱在检测到驾驶员疲劳时，上传一段脱敏后的姿态特征（不含影像）用于模型优化。\n请帮我整理一份合规自查材料：①涉及哪些数据类别与级别 ②需要确认的合规要点清单 ③需向法务确认的问题列表 ④材料索引。不要给出「是否合规」的定性结论。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M6U7", "tier": "adv", "step": "todo", "title": "出数据合规检查清单", "video": {"dur": "8min", "script": ["清单化是合规工作里唯一能复用的资产", "数据合规检查清单模板（数据项 / 级别 / 授权 / 出境 / 待确认）", "一份完整的数据合规检查清单样例"]}, "ppt": {"method": "数据合规检查清单模板（数据项 / 级别 / 授权 / 出境 / 待确认）", "case": "一份完整的数据合规检查清单样例", "demo": "填写指引（先列数据项后判级别）"}, "vslides": [{"t": "第一步：列数据项判级别", "n": "先把功能涉及的每一项数据列出来，逐项判定级别。注意要列到字段级，不要写「车辆数据」这种大类——大类里同时含公开级和重要级，无法判定。列完六项左右，判完级别，这张表就有骨架了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列到字段级</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 逐项判级别</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 标出最高级别项</tspan></text></svg>"}, {"t": "第二步：逐项填授权与出境", "n": "每一项填两列：现有授权覆盖什么用途、是否涉及出境。填授权时要具体到用途，比如「行车安全」和「模型优化」是两个用途，不能混。填出境时要写明数据落在哪个区域的服务器上，含糊不清的一律标「待确认」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspect
