18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">拆卖点</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">映射到配</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">置项</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">按版本分</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">配</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">标出支撑</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">项</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：检查倒挂与可采购性", "n": "矩阵出来后要人工过两关。第一关查倒挂，逐列看有没有高配比低配少的项；第二关查可采购性，问采购这几项能不能按时供货。两关都过了，这份矩阵才敢发到项目组。演示的意义就在这最后两关。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">逐列检查配置倒挂</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">与采购确认可供货性</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">补齐成本与毛利测算</tspan></text></svg>"}], "deliverable": {"type": "agent", "name": "配置定义师", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《配置定义师》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "我们这一版的核心卖点是「二十万级最舒服的后排」。以下是可选配置项清单与成本区间（已脱敏）：\n[粘贴]\n请输出配置项 × 三个版本档位的矩阵，并标出哪些项最能支撑这个卖点。不要给出定价，也不要编造成本数据。"}, "task": "在 WorkBuddy 里把「卖点 → 配置项 → 版本矩阵演示」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】卖点 → 配置项 → 版本矩阵演示\n【参考案例】「二十万级最舒服的后排」落成配置矩阵\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n我们这一版的核心卖点是「二十万级最舒服的后排」。以下是可选配置项清单与成本区间（已脱敏）：\n[粘贴]\n请输出配置项 × 三个版本档位的矩阵，并标出哪些项最能支撑这个卖点。不要给出定价，也不要编造成本数据。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M3U3", "tier": "basic", "step": "todo", "title": "产出你的「最小配置方案」", "video": {"dur": "8min", "script": ["最小配置方案是一页纸，但它决定了一款车的成本与话术", "最小配置方案模板（卖点 / 配置项 / 版本矩阵 / 自检）", "一套三版本配置方案样例"]}, "ppt": {"method": "最小配置方案模板（卖点 / 配置项 / 版本矩阵 / 自检）", "case": "一套三版本配置方案样例", "demo": "填写指引（先卖点后矩阵）"}, "vslides": [{"t": "第一步：把卖点写成一句话", "n": "先把这一版的一句话卖点写下来，不超过二十个字。写不短就说明你还没想清楚这版车到底主打什么。这一句话后面会被市场、销售、工程反复引用，所以它必须足够具体，不能是「更智能更舒适」这种谁都能说的话。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 一句话卖点 ≤20 字</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 列支撑配置项</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 分三档并查倒挂</tspan></text></svg>"}, {"t": "第二步：列支撑卖点的配置项", "n": "围绕卖点列五到八个配置项。判据很简单：这一项拿掉，卖点还站得住吗？站得住就砍掉，站不住就留下。用这条判据筛一遍，配置项通常能从十几个压到六七个，成本也好谈了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项都能回答「拿掉会怎样」</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">总数控制在 5–8 项</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项写明供应商状态</tspan></text></svg>"}, {"t": "第三步：分三档并自检", "n": "最后按三个版本分配配置项，做两项自检：竖着看有没有倒挂，横着看同一档内是否自洽。两项都过了，再补一行成本增量估算。补齐这一行，你的方案就能进项目评审会了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">分配与自检</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">分三档</tspan></text></g><g class=\"hl\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">查倒挂</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">查自洽</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">补成本增</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">量</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "最小配置方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《最小配置方案》并通过本单元评分要点"}, "practice": {"steps": ["写清本版一句话卖点", "列出支撑卖点的 5–8 个配置项", "按三个版本分配并检查倒挂"], "exemplar": "卖点：二十万级最舒服的后排 配置项：后排靠背角度可调 / 腿托 / 后排屏 / 后排出风口 / 双层隔音玻璃 版本：入门-舒适 / 中配-豪华 / 顶配-旗舰；逐列检查无倒挂"}, "task": "产出《最小配置方案》：写清本版一句话卖点；列出支撑卖点的 5–8 个配置项；按三个版本分配并检查倒挂", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M3 配置定义、定价与车型生命周期」模块，你要交付的是《最小配置方案》。\n【场景】业务侧这周的诉求是：最小配置方案是一页纸，但它决定了一款车的成本与话术。参考做法：一套三版本配置方案样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（最小配置方案模板（卖点 / 配置项 / 版本矩阵 / 自检）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《最小配置方案》填写模板】\n\n■ 1. 写清本版一句话卖点\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 列出支撑卖点的 5–8 个配置项\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 按三个版本分配并检查倒挂\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   卖点：二十万级最舒服的后排 配置项：后排靠背角度可调 / 腿托 / 后排屏 / 后排出风口 / 双层隔音玻璃 版本：入门-舒适 / 中配-豪华 / 顶配-旗舰；逐列检查无倒挂", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M3U4", "tier": "basic", "step": "spar", "title": "销售 / 成本 / 工程三方挑问题", "video": {"dur": "8min", "script": ["一份配置方案要过三关：好卖、划算、做得出来", "三方质询清单（好卖吗 / 划算吗 / 做得出来吗）", "被三方问倒的配置方案 vs 站得住的方案"]}, "ppt": {"method": "三方质询清单（好卖吗 / 划算吗 / 做得出来吗）", "case": "被三方问倒的配置方案 vs 站得住的方案", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：三方各挑各的", "n": "这次陪练有三个对手，各挑各的。销售问好卖吗，成本问划算吗，工程问做得出来吗。他们不会互相让步，你要做的是用数据分别回应，而不是试图说服所有人。准备时把这三类答案各写一段。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三方三问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">好卖吗</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">划算吗</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">做得出来吗</tspan></text></g></svg>"}, {"t": "高频追问：毛利还剩多少", "n": "成本那一关最难：这一项加上去毛利还剩多少。答不上这个数字，方案基本会被打回。所以上场前先找财务或成本工程要一份增量成本测算，把每项配置的成本增量和目标成交价摆在一起算清楚。有数字才有的谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">每项配置的增量成本</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">目标成交价与毛利</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">销量提升能否覆盖成本</tspan></text></svg>"}, {"t": "工程那一关：时间点", "n": "工程问的是时间点：这个配置在年款冻结前能不能完成验证。答法是给出里程碑，而不是保证。说明验证需要几周、供应商认证到第几轮、最晚什么时候必须冻结。给出里程碑并标明风险点，比拍胸脯更容易被接受。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给出关键里程碑</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">标明风险点与缓冲</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不承诺无依据的日期</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "最小配置方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《最小配置方案》并通过本单元评分要点"}, "spar": {"role": "销售 / 成本 / 工程三方", "persona": "各站在自己立场挑刺，互不妥协", "mustAsk": ["这个配置客户愿意加钱买吗？", "这一项加上去毛利还剩多少？", "这个时间点工程和供应商来得及吗？"]}, "task": "把《最小配置方案》拿到「销售 / 成本 / 工程三方」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《最小配置方案》。现在要让它通过「销售 / 成本 / 工程三方」这一关。\n【对手的立场】各站在自己立场挑刺，互不妥协。\n【他一定会追问】「这个配置客户愿意加钱买吗？」 / 「这一项加上去毛利还剩多少？」 / 「这个时间点工程和供应商来得及吗？」\n【场景】你说「销售 / 成本 / 工程三方挑问题」，对方立刻回一句：这个配置客户愿意加钱买吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M3U5", "tier": "adv", "step": "understand", "title": "定价与生命周期节奏", "video": {"dur": "8min", "script": ["定价不是算出来的，是三个锚点博弈出来的", "定价三锚点（成本 / 竞品 / 用户感知）+ 生命周期四阶段", "一款车三年生命周期的价格与配置节奏"]}, "ppt": {"method": "定价三锚点（成本 / 竞品 / 用户感知）+ 生命周期四阶段", "case": "一款车三年生命周期的价格与配置节奏", "demo": "定价自查卡（三个锚点是否对齐）"}, "vslides": [{"t": "定价三锚点", "n": "定价有三个锚点。成本锚点是底线，低于它卖一台亏一台；竞品锚点是参照，客户会拿你去比；感知锚点是上限，客户觉得你值多少钱。三个锚点重合的区间就是可行定价带。三者不重合时，说明这个产品定位本身有问题。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">定价三锚点</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">成本锚点</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">竞品锚点</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">感知锚点</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "生命周期四阶段", "n": "一款车通常走四个阶段：上市期建认知，价格坚挺；成长期冲量，开始有终端优惠；成熟期靠年款改款维持热度；衰退期清库存，让位给下一代。每个阶段的价格动作不同，把节奏排出来，才知道什么时候该做什么。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 上市期：价格坚挺</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 成长期：冲量优惠</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 成熟期：年款改款</tspan></text><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 衰退期：清库让位</tspan></text></svg>"}, {"t": "边界：定价结论不能交给 AI", "n": "AI 能帮你把三个锚点的数据摆在一起、算出区间、列出竞品历史价格曲线，但定价结论必须人来下。因为它不知道渠道库存压力、不知道这个季度冲量的目标、也不知道集团对毛利的底线。用 AI 做算术，用你做决策。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">AI 能做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人要做</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI：摆数据 / 算区间 /</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">画曲线</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">人：定最终价格 / 定节奏</tspan></text></g></svg>"}], "deliverable": {"type": "agent", "name": "定价策略师", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "输入成本区间与竞品价格，能输出三锚点对照与定价建议区间，结论留白"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】定价三锚点（成本 / 竞品 / 用户感知）+ 生命周期四阶段\n【为什么重要】定价不是算出来的，是三个锚点博弈出来的\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M3U6", "tier": "adv", "step": "demo", "title": "年款改款定价推演", "video": {"dur": "8min", "script": ["改款定价最怕的是拍脑袋，推演一遍能看出三个锚点打架在哪", "年款改款定价推演演示（成本变化 / 竞品动作 / 感知影响）", "一次年款改款的三套定价方案推演"]}, "ppt": {"method": "年款改款定价推演演示（成本变化 / 竞品动作 / 感知影响）", "case": "一次年款改款的三套定价方案推演", "demo": "WorkBuddy 内跑一遍定价推演提示词"}, "vslides": [{"t": "演示准备：改款变化清单", "n": "演示素材是本次年款的三类变化：配置上加了后排屏和双层隔音玻璃，成本上电池采购价下降，竞品侧有两款车近半年各有一次官方调价。三类信息揉在一起，靠脑子推很容易顾此失彼。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：配置变化 / 成本变化</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">竞品近半年价格动作</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：三套定价方案</tspan></text></g></svg>"}, {"t": "跑提示词：三套方案并列", "n": "把材料贴进 WorkBuddy，让它输出保守、中性、进取三套方案，每套给定价区间、毛利影响、竞品相对位置变化和主要风险。刻意不让它给唯一推荐——定价是典型的需要人来拍板的决策，AI 给单结论反而危险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三套方案并列</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">保守</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">中性</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">进取</tspan></text></g></svg>"}, {"t": "人工收口：把风险翻译成预案", "n": "三套方案出来后，工作才刚开始。你要把每套方案的主要风险翻译成预案：进取方案如果竞品跟降怎么办，保守方案如果冲量目标完不成怎么办。预案写进材料，这份推演才能在经营会上被真正讨论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每套方案配一条风险预案</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">明确触发切换的条件</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">最终建议由人签署</tspan></text></svg>"}], "deliverable": {"type": "agent", "name": "定价策略师", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《定价策略师》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是本次年款改款的配置变化、成本区间变化与竞品近半年价格动作（公开与内部脱敏数据）：\n[粘贴]\n请输出三套定价方案（保守 / 中性 / 进取），每套给出：定价区间、对毛利的粗略影响、对竞品相对位置的影响、主要风险。不要给出唯一推荐结论。"}, "task": "在 WorkBuddy 里把「年款改款定价推演演示（成本变化 / 竞品动作 / 感知影响）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】年款改款定价推演演示（成本变化 / 竞品动作 / 感知影响）\n【参考案例】一次年款改款的三套定价方案推演\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是本次年款改款的配置变化、成本区间变化与竞品近半年价格动作（公开与内部脱敏数据）：\n[粘贴]\n请输出三套定价方案（保守 / 中性 / 进取），每套给出：定价区间、对毛利的粗略影响、对竞品相对位置的影响、主要风险。不要给出唯一推荐结论。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M3U7", "tier": "adv", "step": "todo", "title": "产出定价与改款节奏方案", "video": {"dur": "8min", "script": ["把定价和生命周期节奏写成一份材料，你才算真正主导了这一代产品", "定价与节奏方案模板（三锚点 / 定价区间 / 四阶段节奏 / 风险预案）", "一份完整的年款定价与节奏方案样例"]}, "ppt": {"method": "定价与节奏方案模板（三锚点 / 定价区间 / 四阶段节奏 / 风险预案）", "case": "一份完整的年款定价与节奏方案样例", "demo": "填写指引（先锚点后节奏）"}, "vslides": [{"t": "第一步：三锚点各给一个数字", "n": "先把三个锚点各落到具体数字。成本锚点找成本工程要 BOM，竞品锚点列三款直接竞品的官方指导价与终端价，感知锚点用调研里的支付意愿上限。三个数字摆出来，可行定价带就一目了然，这一步不能含糊。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 成本锚点 = BOM</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 竞品锚点 = 指导价 / 终端价</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 感知锚点 = 支付意愿上限</tspan></text></svg>"}, {"t": "第二步：定区间与推荐档位", "n": "在可行带里选一个推荐档位。选档位的依据要写清：是想冲量还是保毛利，是贴着竞品打还是留出差距。定价没有标准答案，但必须有明确理由。理由写清了，即使后面市场变化要调价，也知道当初为什么这么定。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">定档三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">可行带</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">冲量还是保毛利</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">推荐档位 + 理由</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "第三步：四阶段节奏与预案", "n": "最后写四个阶段的节奏：每个阶段持续多久、价格动作是什么、配置动作是什么。每阶段配一条风险预案。节奏写清楚，销售和渠道才知道什么时候该做什么，不会出现上市两个月就私自放价的混乱。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">四阶段各有时间与动作</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每阶段配风险预案</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">与销售渠道对齐过</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "定价与改款节奏方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《定价与改款节奏方案》并通过本单元评分要点"}, "practice": {"steps": ["列出成本 / 竞品 / 感知三锚点的具体数字", "给出定价区间与推荐档位", "写四阶段节奏与每阶段动作"], "exemplar": "成本锚点：BOM 18.6 万；竞品锚点：A 22.98 万 / B 21.88 万；感知锚点：调研上限 23.5 万 定价区间：21.58–22.58 万，推荐 21.98 万 节奏：上市期坚挺 3 个月 → 成长期终端让 6000 → 成熟期年款加配置 → 衰退期清库"}, "task": "产出《定价与改款节奏方案》：列出成本 / 竞品 / 感知三锚点的具体数字；给出定价区间与推荐档位；写四阶段节奏与每阶段动作", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M3 配置定义、定价与车型生命周期」模块，你要交付的是《定价与改款节奏方案》。\n【场景】业务侧这周的诉求是：把定价和生命周期节奏写成一份材料，你才算真正主导了这一代产品。参考做法：一份完整的年款定价与节奏方案样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（定价与节奏方案模板（三锚点 / 定价区间 / 四阶段节奏 / 风险预案）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《定价与改款节奏方案》填写模板】\n\n■ 1. 列出成本 / 竞品 / 感知三锚点的具体数字\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 给出定价区间与推荐档位\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写四阶段节奏与每阶段动作\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   成本锚点：BOM 18.6 万；竞品锚点：A 22.98 万 / B 21.88 万；感知锚点：调研上限 23.5 万 定价区间：21.58–22.58 万，推荐 21.98 万 节奏：上市期坚挺 3 个月 → 成长期终端让 6000 → 成熟期年款加配置 → 衰退期清库", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M3U8", "tier": "adv", "step": "spar", "title": "经营会会审定价方案", "video": {"dur": "8min", "script": ["经营会只问四件事：毛利、销量、竞品怎么反应、渠道能不能执行", "经营会质询清单（毛利 / 销量 / 竞品反应 / 渠道）", "一次经营会的高分与低分回答"]}, "ppt": {"method": "经营会质询清单（毛利 / 销量 / 竞品反应 / 渠道）", "case": "一次经营会的高分与低分回答", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：经营会看报表", "n": "对手是经营会成员，他们只看报表。三个必问：单车毛利多少、竞品跟降怎么办、渠道能不能执行住。准备时把这三个数字写成一页附表，会前就发给与会者，能省掉一半追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">经营会三问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">单车毛利</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">竞品反应</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">渠道执行</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：竞品跟降怎么办", "n": "第二问最考验准备度。不要说「我们产品力更强」，要给分层预案：竞品跟降五千以内我们不动，靠配置差异顶；跟降五千到一万我们出限时权益而非直接降价；超过一万再启动价格调整。分层预案比笼统表态有力得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">跟降 &lt;5000：不动，靠配置顶</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">5000–10000：出限时权益</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">&gt;10000：启动调价</tspan></text></svg>"}, {"t": "第三问：渠道执行得住吗", "n": "第三问问的是渠道纪律。答法要给机制：上市三个月内终端价监控、违规放价的处罚条款、以及给渠道的返利结构。说清机制，才能证明这个价格不是纸上谈兵。机制说不清，前面所有测算都不被信任。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">上市期终端价监控机制</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">违规放价的处理条款</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">返利结构能支撑价格纪律</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "定价与改款节奏方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《定价与改款节奏方案》并通过本单元评分要点"}, "spar": {"role": "经营会成员", "persona": "看报表说话，追问毛利与销量能否同时成立", "mustAsk": ["这个价卖出去，单车毛利多少、全年贡献多少？", "竞品跟降你怎么办？", "渠道能执行得住吗，会不会一上市就放价？"]}, "task": "把《定价与改款节奏方案》拿到「经营会成员」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《定价与改款节奏方案》。现在要让它通过「经营会成员」这一关。\n【对手的立场】看报表说话，追问毛利与销量能否同时成立。\n【他一定会追问】「这个价卖出去，单车毛利多少、全年贡献多少？」 / 「竞品跟降你怎么办？」 / 「渠道能执行得住吗，会不会一上市就放价？」\n【场景】你说「经营会会审定价方案」，对方立刻回一句：这个价卖出去，单车毛利多少、全年贡献多少？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M4", "title": "M4 订单数据分析与上市决策", "units": [{"id": "M4U1", "tier": "basic", "step": "understand", "title": "指标口径与 NL2SQL 边界", "video": {"dur": "8min", "script": ["车企数据最常见的坑不是算错，是同一个词三个人三种算法", "指标字典结构（定义 / 口径 / 来源表）+ 口径自查卡", "「订单转化率」三种口径对照（大定 / 锁单 / 交付）"]}, "ppt": {"method": "指标字典结构（定义 / 口径 / 来源表）+ 口径自查卡", "case": "「订单转化率」三种口径对照（大定 / 锁单 / 交付）", "demo": "口径自查卡演示"}, "vslides": [{"t": "指标字典：先把词定死", "n": "在车企谈数据，第一件事是把词定死。一个「订单转化率」，销售可能算大定转锁单，交付可能算锁单转开票，市场可能算线索转大定。三种算法结果差好几倍。所以每个指标要配一张字典卡：定义、口径、来源表，三样齐全才准。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">指标字典三要素</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">定义</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">口径</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">来源表</tspan></text></g></svg>"}, {"t": "NL2SQL 的最大坑：口径对不上", "n": "用自然语言查数，最常见的失败不是 SQL 写错，而是口径没对齐。你说「上月转化率」，模型不知道你要的是大定转锁单还是锁单转交付。解决办法是查之前先声明口径，并要求它同时输出分子和分母——分母一出来，口径对不对立刻看得见。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">查数三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">声明口径</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">要求输出分子分</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">母</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">回查来源表</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "边界：相关不等于因果", "n": "还有一个边界要守住：基于观测数据的分析只能说相关，不能说因果。某区域转化率突然升高，可能是因为加了门店，也可能是因为竞品缺货。要确定因果，得做实验或找工具变量。把相关说成因果，是数据分析里最贵的错误。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">观测数据能给</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">需要实验验证</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">相关：一起变化</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">因果：一个导致另一个</tspan></text></g></svg>"}], "deliverable": {"type": "skill", "name": "NL2SQL 查数", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "业务问题能转 SQL + 分子/分母口径 + 一句归因，且不查车主敏感数据"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】指标字典结构（定义 / 口径 / 来源表）+ 口径自查卡\n【为什么重要】车企数据最常见的坑不是算错，是同一个词三个人三种算法\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M4U2", "tier": "basic", "step": "demo", "title": "查一个核心指标（订单转化率）", "video": {"dur": "8min", "script": ["跑通一次，你就知道口径声明这一句话有多关键", "NL2SQL 查数演示（口径声明 → SQL → 归因）", "查上月各区域大定转锁单转化率"]}, "ppt": {"method": "NL2SQL 查数演示（口径声明 → SQL → 归因）", "case": "查上月各区域大定转锁单转化率", "demo": "WorkBuddy 内跑一遍查数提示词"}, "vslides": [{"t": "演示准备：一个模糊的查数需求", "n": "演示起点是一句很常见的需求：「帮我看看上月各区域的转化率」。这句话里缺了最关键的东西——口径。直接丢给模型，它会自己挑一种算法，很可能和你想要的不是一回事。我们要演示的正是怎么把这句话补全。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一句模糊需求</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">「上月各区域转化率」</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：SQL + 分子分母</tspan></text></g></svg>"}, {"t": "跑提示词：先声明口径", "n": "把补全口径的提示词贴进 WorkBuddy：指标是大定转锁单转化率，分子是当月完成锁单的订单数，分母是当月产生大定的订单数，维度按区域。它会给出 SQL，还会列出分子分母说明和可能的数据质量问题。第三项常常能帮你发现表里的脏数据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示四步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">声明指标</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">与口径</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">生成 SQL</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">输出分子</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">分母</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">提示数据</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">质量</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：跑一遍并对一遍", "n": "SQL 拿到手不能直接信。先在测试库跑一遍，把结果和报表看板对一下，数字对得上才算通过。对不上通常有三种原因：口径不一致、时间字段有时区差、订单状态有重复。这三种排查完，你对这张表的理解会深一层。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">测试库试跑</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">与看板对数字</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">排查时区与状态重复</tspan></text></svg>"}], "deliverable": {"type": "agent", "name": "NL2SQL 查数", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《NL2SQL 查数》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "请用下面的口径帮我写一段查询：指标=大定转锁单转化率，口径=分子为当月完成锁单的订单数，分母为当月产生大定的订单数，时间=上一个自然月，维度=区域。请输出：①SQL ②分子分母说明 ③可能的数据质量问题提醒。不要查询任何车主个人信息字段。"}, "task": "在 WorkBuddy 里把「NL2SQL 查数演示（口径声明 → SQL → 归因）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】NL2SQL 查数演示（口径声明 → SQL → 归因）\n【参考案例】查上月各区域大定转锁单转化率\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n请用下面的口径帮我写一段查询：指标=大定转锁单转化率，口径=分子为当月完成锁单的订单数，分母为当月产生大定的订单数，时间=上一个自然月，维度=区域。请输出：①SQL ②分子分母说明 ③可能的数据质量问题提醒。不要查询任何车主个人信息字段。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M4U3", "tier": "basic", "step": "todo", "title": "查 3 指标 + 一句话归因", "video": {"dur": "8min", "script": ["能查数和能说清「为什么会这样」，是两回事", "三指标归因模板（指标 / 口径 / 数值 / 归因）", "一次月度经营分析的三指标归因样例"]}, "ppt": {"method": "三指标归因模板（指标 / 口径 / 数值 / 归因）", "case": "一次月度经营分析的三指标归因样例", "demo": "填写指引（先口径后数值）"}, "vslides": [{"t": "第一步：选三个指标", "n": "选三个你真正负责、也真正能影响的指标。不要选太多，三个足够。常见的组合是：线索转大定率、大定转锁单率、锁单到交付周期。这三个串起来，正好覆盖从获客到交付的主链路，也最容易被经营会追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 线索转大定</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 大定转锁单</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 锁单到交付周期</tspan></text></svg>"}, {"t": "第二步：写清口径再查数", "n": "每个指标先写分子分母，再去查数。这一步看着笨，却是唯一能保证数字可复现的做法。写完之后你会发现，有些指标你根本说不清分母是什么——这恰恰暴露了团队里口径不统一的问题，比查出来的数字更有价值。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项写清分子</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项写清分母</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明统计时间窗</tspan></text></svg>"}, {"t": "第三步：一句归因三段式", "n": "归因按三段写：现象是什么、原因可能是什么、建议做什么。原因是推测就标明「推测」，并写清需要什么数据才能确认。不要写「转化率下降需要重视」这种废话，要写到具体动作，这份归因才有意义。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">归因三段式</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">现象</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">原因（推测需标</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">注）</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">建议动作</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "三指标归因表", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《三指标归因表》并通过本单元评分要点"}, "practice": {"steps": ["选 3 个你负责的核心指标", "为每个指标写清分子分母口径并查出数值", "给每个指标写一句归因（现象→原因→建议）"], "exemplar": "指标：大定转锁单转化率｜口径：锁单数/大定数｜数值：42%｜归因：环比降 5 个点，主因是 A 区域两款竞品月底集中放价，建议月底加一轮区域权益"}, "task": "产出《三指标归因表》：选 3 个你负责的核心指标；为每个指标写清分子分母口径并查出数值；给每个指标写一句归因（现象→原因→建议）", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M4 订单数据分析与上市决策」模块，你要交付的是《三指标归因表》。\n【场景】业务侧这周的诉求是：能查数和能说清「为什么会这样」，是两回事。参考做法：一次月度经营分析的三指标归因样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（三指标归因模板（指标 / 口径 / 数值 / 归因）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《三指标归因表》填写模板】\n\n■ 1. 选 3 个你负责的核心指标\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 为每个指标写清分子分母口径并查出数值\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 给每个指标写一句归因（现象→原因→建议）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   指标：大定转锁单转化率｜口径：锁单数/大定数｜数值：42%｜归因：环比降 5 个点，主因是 A 区域两款竞品月底集中放价，建议月底加一轮区域权益", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M4U4", "tier": "basic", "step": "spar", "title": "数据分析师复核你的归因", "video": {"dur": "8min", "script": ["分析师挑的不是你的结论，是你结论底下那层数据是否站得住", "数据复核清单（口径 / 样本 / 混杂 / 显著性）", "被复核打回的归因 vs 站得住的归因"]}, "ppt": {"method": "数据复核清单（口径 / 样本 / 混杂 / 显著性）", "case": "被复核打回的归因 vs 站得住的归因", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：分析师四问", "n": "对手是数据分析师，他会按口径、样本、混杂、显著性四问逐一挑。上场前先把每个指标的分母定义写在一旁，并想清楚这段时间有没有别的变化同时发生——那通常就是他要抓的混杂因素。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">复核四问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">口径</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">样本</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">混杂</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">显著性</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：有没有混杂因素", "n": "最常被追问的是混杂因素。你说转化率降了是因为竞品放价，他会问：同期你们是不是改了试驾流程？是不是有门店装修停业？把同期发生的所有变化列一遍，主动排除掉几个，你的主因才站得住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">列出同期所有变化</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">逐条排除或保留</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">剩下最可能的那条即主因</tspan></text></svg>"}, {"t": "显著性：是波动还是真变化", "n": "最后一问是显著性。转化率从百分之四十二变到百分之四十，如果样本只有几十单，很可能只是波动。答法是给出样本量和波动区间，说明这个差异在样本量下是否可信。样本不足就承认，并说明补多少样本能确认。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给出样本量</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给出波动区间或历史标准差</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">样本不足时说明补证计划</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "三指标归因表", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《三指标归因表》并通过本单元评分要点"}, "spar": {"role": "数据分析师", "persona": "严谨、只认口径与显著性，会追问混杂因素", "mustAsk": ["这个分母是怎么定义的，和看板一致吗？", "有没有混杂因素没排除？", "这个差异显著吗，还是只是波动？"]}, "task": "把《三指标归因表》拿到「数据分析师」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《三指标归因表》。现在要让它通过「数据分析师」这一关。\n【对手的立场】严谨、只认口径与显著性，会追问混杂因素。\n【他一定会追问】「这个分母是怎么定义的，和看板一致吗？」 / 「有没有混杂因素没排除？」 / 「这个差异显著吗，还是只是波动？」\n【场景】你说「数据分析师复核你的归因」，对方立刻回一句：这个分母是怎么定义的，和看板一致吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M4U5", "tier": "adv", "step": "understand", "title": "上市节奏与渠道实验设计", "video": {"dur": "8min", "script": ["上市期的每个动作都很贵，用实验把钱花明白", "实验设计基础（随机分流 / 对照 / 护栏指标）", "一次上市期区域权益 A/B 实验"]}, "ppt": {"method": "实验设计基础（随机分流 / 对照 / 护栏指标）", "case": "一次上市期区域权益 A/B 实验", "demo": "实验设计卡（假设 / 分流 / 指标 / 周期）"}, "vslides": [{"t": "实验成立的两个条件", "n": "一个实验要成立，必须满足两件事：随机分流和设有对照。随机分流把地区、门店、客户类型的差异均分到两组，对照保证两组可比。缺了任何一个，观察到的差异都不能归因到你的动作上，实验就白做了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">实验两条件</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"175.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"105.5\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.5\">随机分流</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"175.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"294.5\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"294.5\">设对照组</tspan></text></g><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "主指标与护栏指标", "n": "指标要分两类。主指标只有一个，是你想验证的那个假设，比如大定转化率；护栏指标是绝对不能恶化的底线，比如退订率、客诉率、单车毛利。主指标涨了但护栏指标破了，这个实验也不能算成功。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">指标两类</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">主指标 1 个</tspan></text></g><g><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">护栏指标 2–3 个</tspan></text></g></svg>"}, {"t": "最贵的错误：偷看数据就停", "n": "最常见的错误是提前偷看数据，看到显著就宣布成功并停止实验。多次偷看会把偶然的差异误判成真实效果，显著水平实际上被放大了好几倍。正确做法是定好样本量或周期，到点再看，中途只监控护栏指标。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">正确做法</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">不要提前停</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">中途只看护栏指标</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">到点再看主指标</tspan></text></g></svg>"}], "deliverable": {"type": "skill", "name": "上市实验设计", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出含假设、分流方式、主指标与护栏指标、周期与停手规则的实验方案"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】实验设计基础（随机分流 / 对照 / 护栏指标）\n【为什么重要】上市期的每个动作都很贵，用实验把钱花明白\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M4U6", "tier": "adv", "step": "demo", "title": "一个上市 A/B 实验全流程", "video": {"dur": "8min", "script": ["把一次实验从头到尾跑通，才知道哪一步最容易出岔子", "实验全流程演示（假设 → 分流 → 监控 → 结论）", "两区域不同权益方案的上市实验"]}, "ppt": {"method": "实验全流程演示（假设 → 分流 → 监控 → 结论）", "case": "两区域不同权益方案的上市实验", "demo": "WorkBuddy 内跑一遍实验设计提示词"}, "vslides": [{"t": "演示准备：两种权益方案", "n": "演示场景是上市期测试两种权益：A 方案给现金优惠，B 方案送配置升级包。十二个城市可选，单月大定约三千台。我们要设计一次能得出可信结论的实验——难点在于城市之间差异本来就大。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：A 现金优惠 vs B 配置升级</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">12 城 / 月 3000 台</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：可信的实验方案</tspan></text></g></svg>"}, {"t": "跑提示词：设计五要素", "n": "把场景贴进 WorkBuddy，让它输出五要素：假设语句、分流方式、主指标与护栏指标、所需样本量与最短周期、中途停手规则。你会发现它给出的周期往往比你以为的长——这正是不偷看数据的代价，也是实验可信的前提。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">实验五要素</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">假设</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">分流</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">指标</tspan></text></g><g class=\"hl\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">样本量</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">停手规则</tspan></text></g></svg>"}, {"t": "人工收口：城市分层不能省", "n": "AI 给的分流通常假设城市可比，但现实里一线和下线城市的成交结构差很多。所以最后一步是把城市按能级分层，层内再做随机分流。做完这一步，两组才真正可比。这一步是实验设计里唯一不能交给 AI 的部分。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">城市按能级分层</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">层内随机分流</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">两组基线指标已对齐</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "上市实验设计", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《上市实验设计》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "我们计划在上市期测试两种权益方案：A 为现金优惠，B 为配置升级包。可选城市 12 个，预计单月大定量约 3000 台。请帮我设计实验方案：①假设语句 ②分流方式与分组数量 ③主指标与护栏指标 ④所需样本量与最短周期 ⑤中途停手规则。不要给出结论。"}, "task": "在 WorkBuddy 里把「实验全流程演示（假设 → 分流 → 监控 → 结论）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】实验全流程演示（假设 → 分流 → 监控 → 结论）\n【参考案例】两区域不同权益方案的上市实验\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n我们计划在上市期测试两种权益方案：A 为现金优惠，B 为配置升级包。可选城市 12 个，预计单月大定量约 3000 台。请帮我设计实验方案：①假设语句 ②分流方式与分组数量 ③主指标与护栏指标 ④所需样本量与最短周期 ⑤中途停手规则。不要给出结论。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M4U7", "tier": "adv", "step": "todo", "title": "设计你的上市实验方案", "video": {"dur": "8min", "script": ["写下来的实验方案才叫方案，脑子里的只是想法", "上市实验方案模板（假设 / 分流 / 指标 / 周期 / 停手规则）", "一份完整的上市实验方案样例"]}, "ppt": {"method": "上市实验方案模板（假设 / 分流 / 指标 / 周期 / 停手规则）", "case": "一份完整的上市实验方案样例", "demo": "填写指引（先假设后指标）"}, "vslides": [{"t": "第一步：写可证伪的假设", "n": "假设必须可证伪，也就是能被数据推翻。不要写「B 方案更好」，要写「B 方案比 A 方案的大定转化率高三个百分点，且单车毛利不低于 A」。写清阈值，实验结束时才能明确判定成立还是不成立。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 写清比较对象</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 写清指标与阈值</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 写清不能被牺牲的底线</tspan></text></svg>"}, {"t": "第二步：定分流与分组", "n": "分流要分层：先按城市能级、门店规模分层，层内再随机分两组。组数不要超过三组，组越多每组样本越少，结论越不可信。分流方案写清之后，交给数据同事执行，不要由业务侧自行挑选城市。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">分流三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">分层</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">层内随机</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">组数 ≤3</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "第三步：定指标与周期停手", "n": "最后定指标与周期。主指标一个，护栏指标两到三个，写明最短周期和样本量，以及中途只允许监控护栏指标。再加一条：护栏指标破线立即停手。这些写进方案，实验执行时才有章可循。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">主指标 1 个 + 护栏 2–3 个</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明最短周期与样本量</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">护栏破线立即停手</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "上市实验方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《上市实验方案》并通过本单元评分要点"}, "practice": {"steps": ["写一句可证伪的假设", "定分流方式与分组数量", "定主指标与护栏指标、样本量与周期"], "exemplar": "假设：B 配置升级包比 A 现金优惠能提升大定转化 3 个百分点且单车毛利不低于 A 分流：12 城按一/二/三线城市分层，层内随机分两组 指标：主=大定转化率；护栏=单车毛利、退订率；周期=6 周"}, "task": "产出《上市实验方案》：写一句可证伪的假设；定分流方式与分组数量；定主指标与护栏指标、样本量与周期", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M4 订单数据分析与上市决策」模块，你要交付的是《上市实验方案》。\n【场景】业务侧这周的诉求是：写下来的实验方案才叫方案，脑子里的只是想法。参考做法：一份完整的上市实验方案样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（上市实验方案模板（假设 / 分流 / 指标 / 周期 / 停手规则）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《上市实验方案》填写模板】\n\n■ 1. 写一句可证伪的假设\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 定分流方式与分组数量\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 定主指标与护栏指标、样本量与周期\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   假设：B 配置升级包比 A 现金优惠能提升大定转化 3 个百分点且单车毛利不低于 A 分流：12 城按一/二/三线城市分层，层内随机分两组 指标：主=大定转化率；护栏=单车毛利、退订率；周期=6 周", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M4U8", "tier": "adv", "step": "spar", "title": "上市评审：实验方案过会", "video": {"dur": "8min", "script": ["评审会关心的是：这个实验值不值得花这些钱和时间", "实验评审清单（假设 / 样本 / 成本 / 伦理）", "一次上市评审的问答实录"]}, "ppt": {"method": "实验评审清单（假设 / 样本 / 成本 / 伦理）", "case": "一次上市评审的问答实录", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：评审组算账", "n": "对手是上市评审组，他们先算账：这个实验要花多少钱、多少时间，值不值。上场前把实验的增量成本算出来——两套权益方案的差价乘以预计台数，再加上执行与分析的工时。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">评审三问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">实验成本</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">客户感受</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">结论不成立怎么</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">办</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：对照组客户感受", "n": "第二问是对照组客户的感受。两组权益不同，被客户发现会不会引发投诉？答法要给处理预案：权益都在官方活动范围内、话术统一由市场部出、客服备好解释口径。有预案，这一问就能过。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">权益均在官方活动范围内</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">话术由市场部统一</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">客服备好解释口径</tspan></text></svg>"}, {"t": "最后一问：结论不成立怎么办", "n": "最后一问最见功力：如果结论不成立你们怎么办。正确答法是提前写清决策树：主指标无差异则选成本更低的方案，护栏指标破线则两案都不采用。提前写好的决策树，说明你想清楚了，评审也更愿意放行。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">无差异 → 选成本低的</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">护栏破 → 两案都不用</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">结论成立 → 按计划推广</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "上市实验方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《上市实验方案》并通过本单元评分要点"}, "spar": {"role": "上市评审组", "persona": "算账、看风险，追问实验成本与对客户的影响", "mustAsk": ["做这个实验要花多少钱、多少时间？", "对照组客户会不会觉得被区别对待？", "如果结论不成立，你们会怎么做？"]}, "task": "把《上市实验方案》拿到「上市评审组」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《上市实验方案》。现在要让它通过「上市评审组」这一关。\n【对手的立场】算账、看风险，追问实验成本与对客户的影响。\n【他一定会追问】「做这个实验要花多少钱、多少时间？」 / 「对照组客户会不会觉得被区别对待？」 / 「如果结论不成立，你们会怎么做？」\n【场景】你说「上市评审：实验方案过会」，对方立刻回一句：做这个实验要花多少钱、多少时间？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M5", "title": "M5 供应链协同与研发交付", "units": [{"id": "M5U1", "tier": "basic", "step": "understand", "title": "零部件需求澄清与验收标准", "video": {"dur": "8min", "script": ["供应链和
