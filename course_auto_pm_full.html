<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能汽车 × 产品经理 AI 实战 · 完整学习课程（M0–M7 · 64 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7}
  header{padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:700}
  header h1 span{font-size:12px;font-weight:500;color:var(--mut);margin-left:8px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;height:calc(100vh - 62px)}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center;background:#fbfcff}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  .vp .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#eaf0ff}
  .slide.on{display:flex}
  .slide h4{font-size:16px;margin:0 0 6px;color:#fff;flex:none}
  .slide svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.72) 55%,rgba(0,0,0,0) 100%);color:#fff;font-size:19px;font-weight:500;line-height:1.5;padding:20px 28px 16px;min-height:70px;display:block;text-align:center;letter-spacing:.4px;text-shadow:0 2px 6px rgba(0,0,0,.95)}
  .dots{position:absolute;top:11px;left:0;right:0;display:flex;gap:6px;justify-content:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
  .dots i.on{background:#fff}
  .vbar{display:flex;align-items:center;gap:12px;margin-top:9px}
  .play{background:var(--blue);color:#fff;border:none;padding:8px 17px;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600;white-space:nowrap}
  .seek{flex:1;height:8px;border-radius:6px;background:#e4eaf7;position:relative;cursor:pointer}
  .seek .fill{height:100%;background:var(--blue);border-radius:6px;width:0}
  .seek .knob{position:absolute;top:-4px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-left:-7px;left:0}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .aud-note{font-size:12px;color:var(--mut);margin-top:5px}
  textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;background:#fcfdff}
  input.tin{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fcfdff}
  .btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:13.2px;margin:6px 6px 0 0}
  .btn.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
  .btn.ok{background:var(--green)}
  .btn[disabled]{background:#c9d3e6;cursor:not-allowed;border-color:#c9d3e6;color:#fff}
  .wb{background:#0e1530;color:#dce6ff;border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;line-height:1.7}
  .wb .me{color:#ffd98a}.wb .ai{color:#9be8b0}.wb .hl-line{color:#fff;font-weight:600}
  .chat{display:flex;flex-direction:column;gap:9px;margin:6px 0}
  .bub{max-width:82%;padding:9px 12px;border-radius:11px;font-size:13.3px;white-space:pre-wrap}
  .bub.ai{background:#eef4ff;color:var(--blue-d);align-self:flex-start}
  .bub.me{background:var(--blue);color:#fff;align-self:flex-end}
  .bub.sys{background:#f1f4fa;color:var(--mut);align-self:center;font-size:12px;max-width:100%}
  .qs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .qbtn{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.4px;cursor:pointer}
  .qbtn:hover{border-color:var(--blue);color:var(--blue)}
  .done-card{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:18px;text-align:center}
  .done-card h3{font-size:19px;color:#166534;margin-bottom:4px}
  .cp-score{font-size:30px;font-weight:800;color:#16a34a;margin:6px 0}
  .tag-done{display:inline-block;background:var(--green);color:#fff;font-size:12px;padding:1px 9px;border-radius:20px;margin-left:6px}
  /* 题干 / 模板 / 评分 */
  .ip{border-left:4px solid var(--blue)}
  .ip-task{font-size:14.5px;font-weight:700;margin:2px 0 8px;color:var(--txt)}
  .brief{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.1px;white-space:pre-wrap;line-height:1.78;color:#28345a}
  .tpl{background:#0e1530;color:#d7e3ff;border-radius:11px;padding:13px 15px;font-size:12.6px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  details>summary{cursor:pointer;font-size:13.3px;color:var(--blue-d);font-weight:600;margin:10px 0 6px;list-style:none;display:flex;align-items:center;gap:6px}
  details>summary::-webkit-details-marker{display:none}
  details>summary:before{content:"\25B8";transition:transform .15s;display:inline-block}
  details[open]>summary:before{transform:rotate(90deg)}
  .rub{list-style:none;font-size:13px;color:var(--mut);margin:4px 0}
  .rub li{padding:2px 0 2px 20px;position:relative}
  .rub li:before{content:"\25CB";position:absolute;left:2px;color:#c3ccdf}
  .rub li.ok{color:#166534}
  .rub li.ok:before{content:"\25CF";color:var(--green)}
  .rub li span.hint{color:#b4682a;font-size:12px}
  .bar{height:9px;background:#e4eaf7;border-radius:6px;overflow:hidden;margin:7px 0 3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1a5cff,#4d8bff);transition:width .3s}
  /* 测验 */
  .qz-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:9px 0;background:#fff}
  .qz-item .q{font-size:13.8px;font-weight:600;margin-bottom:7px}
  .qz-item .op{padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13.2px;border:1px solid transparent}
  .qz-item .op:hover{background:#f5f8ff}
  .qz-item .op.right{background:var(--green-bg);color:#166534;border-color:#86efac}
  .qz-item .op.wrong{background:#fff1f2;color:#be123c;border-color:#fecdd3}
  .qz-item .tip{font-size:12.5px;color:var(--mut);display:none;margin-top:6px}
  .modal{position:fixed;inset:0;background:rgba(8,16,40,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:16px;padding:24px 26px;max-width:520px;width:100%;text-align:center;max-height:86vh;overflow-y:auto;position:relative}
  .modal .box h3{font-size:19px;margin-bottom:4px;color:var(--txt)}
  .modal .box p{font-size:13.4px;color:var(--mut);margin:6px 0 14px}
  .modal .box .acts{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .modal .box.wide{max-width:800px;text-align:left}
  .art-body{white-space:pre-wrap;font-size:12.4px;line-height:1.62;background:#f6f8fc;border:1px solid #e2e8f5;border-radius:10px;padding:14px 16px;max-height:58vh;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .deliv{border:1px solid #e2e8f5;border-left:4px solid #2f6bff;background:#fbfcff;border-radius:12px;padding:14px 16px;margin-top:12px}
  .deliv .dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .deliv .dname{font-weight:700;font-size:15px}
  .badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
  .badge.skill{background:#2f6bff}.badge.agent{background:#7c3aed}.badge.workflow{background:#0e9f6e}.badge.kb{background:#d97706}
  .deliv .dacc{font-size:12.8px;color:var(--mut);margin:6px 0 10px;line-height:1.55}
  .deliv .rub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .deliv .rub .chip2{font-size:11.5px;background:#eef2fb;color:#274690;padding:2px 9px;border-radius:999px}
  .score-ta{width:100%;min-height:160px;box-sizing:border-box;margin-top:10px;padding:12px 14px;border:1px solid #d7e0f2;border-radius:10px;font-size:13px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;background:#fff;color:#1a2233}
  .score-ta:focus{outline:none;border-color:#2f6bff;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
  .score-inp{width:110px;padding:8px 10px;border:1px solid #d7e0f2;border-radius:8px;font-size:14px}
  .cap-entry{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:5px 12px;border:1px solid #2f6bff;color:#2f6bff;background:#f3f7ff;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
  .cap-entry:hover{background:#e6efff}
  .deliv .dacts{display:flex;gap:8px;flex-wrap:wrap}
  .mclose{position:absolute;top:10px;right:14px;font-size:18px;color:var(--mut);cursor:pointer}
  .fm{text-align:left;font-size:13px}
  .fm label{display:block;font-size:12.6px;color:var(--mut);margin:10px 0 4px}
  .fm .note{font-size:12.2px;color:var(--mut);background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;line-height:1.7}
  .fm code{background:#eef2fb;border-radius:4px;padding:1px 5px;font-size:12px}
  /* ===== 学习指引 ===== */
  .guide{border:1px solid #cfe0ff;background:linear-gradient(135deg,#f3f8ff,#eef4ff);border-radius:13px;padding:13px 16px;margin:4px 0 12px;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .guide h3{font-size:14px;color:var(--blue-d);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .guide .g-ctx{font-size:12.4px;color:var(--mut);margin-bottom:8px}
  .g-steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .g-step{display:inline-flex;align-items:center;gap:5px;font-size:12.2px;padding:4px 10px;border-radius:999px;border:1px solid #d7e3ff;background:#fff;color:var(--mut)}
  .g-step.cur{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:700}
  .g-step.done{background:#eafaf0;border-color:#9fe0bd;color:#166534}
  .g-path{list-style:none;margin:8px 0 2px;padding:0}
  .g-path li{font-size:13px;line-height:1.85;color:#28345a;padding-left:22px;position:relative}
  .g-path li:before{content:"▢";position:absolute;left:4px;color:var(--blue)}
  .g-path li.lead:before{content:"▶";color:var(--blue-d);font-weight:700}
  .g-next{font-size:12.7px;color:var(--blue-d);background:#fff;border:1px dashed #b9d0ff;border-radius:9px;padding:9px 11px;margin-top:8px;line-height:1.7}
  .g-next b{color:var(--blue-d)}
  /* ===== 反馈气泡 + 弹窗（参考测评设计） ===== */
  #lf-fab{position:fixed;right:18px;bottom:18px;z-index:150;display:flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(26,92,255,.35)}
  #lf-fab:hover{background:var(--blue-d)}
  #lf-modal .box{max-width:560px;text-align:left}
  .lf-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .lf-head h3{font-size:17px;margin:0}
  .lf-close{margin-left:auto;font-size:22px;color:var(--mut);background:none;border:none;cursor:pointer;line-height:1}
  .lf-meta{font-size:12.3px;color:var(--mut);background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;line-height:1.6;margin-bottom:10px}
  .lf-label{font-size:12.8px;color:var(--blue-d);font-weight:600;margin:12px 0 6px}
  .lf-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .lf-type{padding:9px 4px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;text-align:center;transition:.15s}
  .lf-type .ti{font-size:18px;display:block;margin-bottom:3px}
  .lf-type.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
  .lf-cat-row,.lf-sev-row{display:flex;gap:7px;flex-wrap:wrap}
  .lf-cat,.lf-sev{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12.6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .lf-cat.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
  .lf-sev.on{background:var(--amber);color:#fff;border-color:var(--amber)}
  .lf-media-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .lf-media-row button{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12.8px;cursor:pointer}
  .lf-media-row button:hover{border-color:var(--blue);color:var(--blue-d)}
  .lf-preview{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .lf-thumb-wrap{position:relative;display:inline-block}
  .lf-preview img{max-width:130px;max-height:110px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
  .lf-preview .lf-file{font-size:12px;background:#f1f4fa;border-radius:8px;padding:4px 9px;color:var(--mut)}
  .lf-drop{border:1.5px dashed var(--line);border-radius:10px;padding:10px;text-align:center;font-size:12.3px;color:var(--mut);margin-top:8px}
  .lf-drop.over{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
  /* 图片放大灯箱 */
  .lb-mask{position:fixed;inset:0;background:rgba(8,12,24,.82);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:24px}
  .lb-mask img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .lb-close{position:absolute;top:16px;right:22px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer;line-height:1}
  /* 内嵌 AI 陪练抽屉 */
  .spar-modal .box{width:min(560px,94vw);height:min(76vh,720px);display:flex;flex-direction:column;padding:0;overflow:hidden}
  .spar-hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#f8faff}
  .spar-hd h3{font-size:15px;margin:0}
  .spar-hd .sub{font-size:11.8px;color:var(--mut);margin-top:2px}
  .spar-hd .x{margin-left:auto;font-size:22px;color:var(--mut);background:none;border:none;cursor:pointer;line-height:1}
  .spar-body{flex:1;overflow:auto;padding:12px 14px;background:#fff}
  .spar-msg{margin-bottom:10px;display:flex}
  .spar-msg.me{justify-content:flex-end}
  .spar-msg .b{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.4px;line-height:1.65;white-space:pre-wrap}
  .spar-msg.ai .b{background:#f1f4fa;color:#1a2233;border-top-left-radius:3px}
  .spar-msg.me .b{background:var(--blue);color:#fff;border-top-right-radius:3px}
  .spar-msg.sys .b{background:#fff8e6;color:#8a5a00;font-size:12.4px;border:1px solid #f0dca8;max-width:100%}
  .spar-typing{font-size:12.4px;color:var(--mut);padding:4px 2px}
  .spar-ft{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:#fbfcfe}
  .spar-ft textarea{flex:1;min-height:52px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.4px;font-family:inherit}
  .spar-ft button{padding:9px 14px;border-radius:9px;border:none;background:var(--blue);color:#fff;font-size:13.4px;cursor:pointer;white-space:nowrap}

  .spar-status{font-size:11.8px;color:var(--mut);padding:0 12px 8px;background:#fbfcfe}

  .lf-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lf-note{font-size:11.8px;color:var(--mut);margin-top:10px;line-height:1.6}

  @media(max-width:560px){.lf-type-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:860px){.layout{flex-direction:column}.sidebar{width:100%;max-height:36vh;border-right:none;border-bottom:1px solid var(--line)}}
  /* ===== 多邻国式分步通关 ===== */

  .stepper .sbar{flex:1;height:6px;background:#e4eaf7;border-radius:6px;overflow:hidden;min-width:44px}
  .stepper .sbar i{display:block;height:100%;background:var(--green);transition:width .3s}
  .cp{max-width:680px;margin:0 auto}
  .cp-head{margin:2px 0 10px}
  .cp-title{font-size:19px;font-weight:800}
  .cp-sub{font-size:12.6px;color:var(--mut);margin-top:2px;line-height:1.6}
  .cp-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .cp-notes{margin:10px 0}
  .cp.centered{text-align:center}
  .settle{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:26px 20px}
  .settle .cp-score{font-size:34px;font-weight:800;color:#16a34a;margin:8px 0}

const COURSE = {"id": "auto_pm", "role": "pm", "customization": {"industry": "智能汽车", "company": "模拟车企 X", "product": "星河 L7"}, "modules": [{"id": "M0", "title": "M0 导论：车企 PM 的 AI 机会与红线", "units": [{"id": "M0U1", "tier": "basic", "step": "understand", "title": "车企 PM 的 6 类 AI 机会与 3 条红线", "video": {"dur": "8min", "script": ["车企 PM 同时背销量、成本与合规三本账，是 AI 落地最容易见效也最容易出事的岗位", "六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）", "某新能源车企用 AI 把竞品配置对比周期从 10 天压到 1 天"]}, "ppt": {"method": "六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）", "case": "某新能源车企用 AI 把竞品配置对比周期从 10 天压到 1 天", "demo": "红线对照卡：把「贴车主轨迹数据进公开 AI」标记为高危"}, "vslides": [{"t": "开场：车企 PM 为什么是最关键的落点", "n": "在车企里，最清楚用户想要什么配置、也最清楚一款车成本结构的人，通常是产品经理。你既听得懂工程的约束，也讲得清市场的诉求。所以 AI 在车企落地时，最先产生价值的地方往往不是算法团队，而是你的日常产出。这一节只谈两件事：AI 能替你在哪几个环节干活，以及哪三条线你绝对不能踩。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">车企 PM 的位置</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">懂用户</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">懂配置</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">懂成本</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "六类 AI 机会：逐条对应日常痛点", "n": "把你的工作拆成六类机会。第一类是洞察，比如竞品改款动向；第二类是研究，比如把车主访谈变成结构化需求；第三类是设计，比如配置清单与卖点文案；第四类是分析，比如订单结构与转化率归因；第五类是协同，比如零部件需求与项目例会纪要；第六类是合规，比如数据授权条款比对。这六件事加起来，占掉你六成以上的时间。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六类 AI 机会</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">洞察</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">研究</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">设计</tspan></text></g><g class=\"hl\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">分析</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">协同</tspan></text></g><g><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">合规</tspan></text></g></svg>"}, {"t": "三条红线：越线就别上线", "n": "红线只有三条，条条都硬。第一条，数据不出域，车主位置、座舱影像这类个人信息不能贴进公开大模型；第二条，不替人决策，定价、配置取舍的最终责任人必须写清楚是人；第三条，可解释可追溯，AI 给的结论要能说清依据、也能回放过程。守住这三条，你才谈得上长期提效。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据不出域，车辆与车主信息不进公开模型</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替人决策，责任主体写清楚</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">可解释可追溯，依据与过程能回放</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "粘贴任意 PM 交付物，能输出三类红线风险清单与修改建议，且不越权下合规定性"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）\n【为什么重要】车企 PM 同时背销量、成本与合规三本账，是 AI 落地最容易见效也最容易出事的岗位\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M0U2", "tier": "basic", "step": "demo", "title": "同一份配置需求：踩红线 vs 守红线", "video": {"dur": "8min", "script": ["绝大多数风险不是 AI 不可靠，而是人随手把不该外传的东西贴了出去", "踩红线 / 守红线对照演示（同一份配置需求两种处理方式）", "「星河 L7」改款配置评审材料（含车主调研原始数据）"]}, "ppt": {"method": "踩红线 / 守红线对照演示（同一份配置需求两种处理方式）", "case": "「星河 L7」改款配置评审材料（含车主调研原始数据）", "demo": "WorkBuddy 内跑一遍脱敏后的配置建议生成"}, "vslides": [{"t": "演示准备：一份含车主信息的需求", "n": "我们开始演示。手上是一份「星河 L7」改款的配置需求，里面附带了车主调研的原始记录：车主昵称、手机号、常驻城市、还有一段试驾路线轨迹。在做任何 AI 操作之前，先看一眼它属于什么级别的数据。这一步是习惯，不是形式。车辆数据里，位置和身份是最高敏的两类。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示数据预览</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">原始需求片段</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">车主：李某某  手机：138****</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">试驾路线：沿城市快速路 32km</tspan></text></g></svg>"}, {"t": "踩红线：整段粘贴到公开大模型", "n": "先模拟最常见的错误操作：把整段需求，连同车主手机号和试驾轨迹，一起粘贴到公开的聊天窗口。它会给出很漂亮的回答，效率看起来很高。但代价是这些数据已经离开企业边界。智能网联汽车领域，车辆位置与轨迹属于重要数据，随手外传通常对应监管处罚而不是内部批评。便利和风险在这里同步放大。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩红线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">风险</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">整段贴入公开模型</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">答得漂亮、风险留在门外</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">车主身份与轨迹随文本一</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">起出域</tspan></text></g></svg>"}, {"t": "守红线：脱敏 + 只给结构化字段", "n": "换个做法。先把车主换成「样本 A」，手机号与轨迹整体删除，只保留结构字段：车型级别、配置差异项、目标价格带、竞品对标清单。然后用这条提示词请 AI 基于给定字段给出取舍建议，并明确要求它不得索取任何个人信息。同样拿到可用建议，数据却一步都没出域。守红线的手法就是这三步：脱敏、最小化、显式约束。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">守红线三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">脱敏</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">最小化字段</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">提示词显式约束</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《AI 红线自检》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「星河 L7」改款配置评审要点（已脱敏，不含任何车主个人信息）：\n[粘贴配置差异表]\n请基于公开市场信息，给出三档配置的取舍建议，并明确标出哪些结论需要我补充内部成本数据后才能定。"}, "task": "在 WorkBuddy 里把「踩红线 / 守红线对照演示（同一份配置需求两种处理方式）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】踩红线 / 守红线对照演示（同一份配置需求两种处理方式）\n【参考案例】「星河 L7」改款配置评审材料（含车主调研原始数据）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「星河 L7」改款配置评审要点（已脱敏，不含任何车主个人信息）：\n[粘贴配置差异表]\n请基于公开市场信息，给出三档配置的取舍建议，并明确标出哪些结论需要我补充内部成本数据后才能定。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U3", "tier": "basic", "step": "todo", "title": "画一张你的 AI 提效地图", "video": {"dur": "8min", "script": ["提效方案失败的第一步，往往是连自己这周到底做了什么都列不全", "提效地图模板（工作项 / AI 切入点 / 红线标注）", "「星河 L7」项目组提效地图样例（8 项工作 × 三列）"]}, "ppt": {"method": "提效地图模板（工作项 / AI 切入点 / 红线标注）", "case": "「星河 L7」项目组提效地图样例（8 项工作 × 三列）", "demo": "地图填写操作指引（先列工作再标 AI 点）"}, "vslides": [{"t": "任务说明：先把事实列全", "n": "这一节是实操。打开空白文档，把你本周做过的所有工作列出来，尽量列到八项以上，包括写配置单、跑订单数据、开会、对文档这些看起来琐碎的部分。不要先判断哪个能用 AI，先把事实列全。列不全，后面的地图就是空谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列出本周 8 项主要工作</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 每一项标注三列</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 汇成一张可分享的地图</tspan></text></svg>"}, {"t": "三项标注：能不能、用在哪、是否触红线", "n": "每一行填三列。第一列，这项工作能不能用 AI；第二列，如果可以，用在哪一步，是读材料、生成初稿还是做对比；第三列，这一步是否触红线，涉及车主信息、车辆轨迹还是成本数据。第三列最容易被跳过，却最关键。判定标准很简单：只要数据可能来自真实车主，就先按敏感处理。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每行填三列</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">能否用 AI</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">用在哪一步</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">是否触红线</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "产出与分享：一张图胜过一页汇报", "n": "最后把地图整理成一页，发给直属主管。目的有两个：让主管看到你在用系统性方法提效，也把个人经验沉淀成团队规范。注意地图里至少要有一项标注为红线未通过，这反而让你更可信。一份全是绿灯的提效方案，通常说明写它的人根本没想过风险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">工作项不少于 8 项</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项都有用 AI 的具体环节</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">至少一项明确标注风险判定</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《个人 AI 提效地图》并通过本单元评分要点"}, "practice": {"steps": ["列出你本周 8 项主要工作", "对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线", "用模板汇成一张地图"], "exemplar": "工作项：竞品配置对比｜AI 切入：自动汇总公开配置页并做差异表｜红线：仅用公开来源 工作项：配置评审｜AI 切入：预读 PRD 提 3 个漏洞｜红线：不贴成本与车主数据"}, "task": "产出《个人 AI 提效地图》：列出你本周 8 项主要工作；对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线；用模板汇成一张地图", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M0 导论：车企 PM 的 AI 机会与红线」模块，你要交付的是《个人 AI 提效地图》。\n【场景】业务侧这周的诉求是：提效方案失败的第一步，往往是连自己这周到底做了什么都列不全。参考做法：「星河 L7」项目组提效地图样例（8 项工作 × 三列）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提效地图模板（工作项 / AI 切入点 / 红线标注）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《个人 AI 提效地图》填写模板】\n\n■ 1. 列出你本周 8 项主要工作\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 用模板汇成一张地图\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   工作项：竞品配置对比｜AI 切入：自动汇总公开配置页并做差异表｜红线：仅用公开来源 工作项：配置评审｜AI 切入：预读 PRD 提 3 个漏洞｜红线：不贴成本与车主数据", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M0U4", "tier": "basic", "step": "spar", "title": "合规官挑战你的提效地图", "video": {"dur": "8min", "script": ["合规官的职责不是让你过，而是找出你地图里越过红线的那几个点", "合规挑战清单（数据 / 决策 / 可追溯）", "典型越线写法 vs 合规写法（贴车主轨迹 vs 脱敏字段）"]}, "ppt": {"method": "合规挑战清单（数据 / 决策 / 可追溯）", "case": "典型越线写法 vs 合规写法（贴车主轨迹 vs 脱敏字段）", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "vslides": [{"t": "陪练说明：合规官会挑你的地图", "n": "接下来进入陪练。你的对手是数据合规官，他的职责不是让你过，而是找出你地图里越过红线的点。他会按数据、决策、可追溯三个维度逐一追问。你不需要准备得完美，但必须准备好一条：被问到数据来源时，能说清它从哪来、有没有脱敏、有没有用户授权。这一问通常决定成败。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合规官的追问框架</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">数据来源</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">授权链条</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可追溯</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "他会问什么：三个高频问题", "n": "先剧透三个高频问题。第一，这项 AI 用法涉及的数据里有没有车主个人信息或车辆位置轨迹？第二，如果 AI 给了错误建议，责任和可追溯链条怎么定？第三，有没有人最终决策的卡点？把答案提前写在地图备注里，陪练时你就不会被问倒。提前准备答案，比现场发挥靠谱得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">涉及的数据是否含车主个人信息</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">AI 出错时的责任与追溯链条</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">有没有人最终决策的卡点</tspan></text></svg>"}, {"t": "通过标准：三条都答上才放行", "n": "放行标准很明确：数据来源能说清、责任主体到人、AI 输出只做辅助不做终裁。陪练里如果答案被判定通过，你会拿到放行标记；答不上来就回去补。补的过程本身就是学习，比听十遍课有用。目标是拿到一张经得起合规挑战的地图，而不是让陪练说好话。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据来源说清</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任主体到人</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">AI 输出仅作辅助</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《个人 AI 提效地图》并通过本单元评分要点"}, "spar": {"role": "数据合规官", "persona": "严谨、只认制度，追问数据来源与授权链条", "mustAsk": ["这项 AI 用法涉及的数据里有没有车主个人信息或车辆位置轨迹？", "如果 AI 给了错误建议，责任和可追溯链条怎么定？", "有没有「人最终决策」的卡点？"]}, "task": "把《个人 AI 提效地图》拿到「数据合规官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《个人 AI 提效地图》。现在要让它通过「数据合规官」这一关。\n【对手的立场】严谨、只认制度，追问数据来源与授权链条。\n【他一定会追问】「这项 AI 用法涉及的数据里有没有车主个人信息或车辆位置轨迹？」 / 「如果 AI 给了错误建议，责任和可追溯链条怎么定？」 / 「有没有「人最终决策」的卡点？」\n【场景】你说「合规官挑战你的提效地图」，对方立刻回一句：这项 AI 用法涉及的数据里有没有车主个人信息或车辆位置轨迹？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M0U5", "tier": "adv", "step": "understand", "title": "组织级 AI 落地路线与车型域治理", "video": {"dur": "8min", "script": ["个人提效只是起点，真正拉开差距的是把打法固化到车型项目流程里", "落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）", "某车企 AI 提效治理框架（车型项目三层评审会）"]}, "ppt": {"method": "落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）", "case": "某车企 AI 提效治理框架（车型项目三层评审会）", "demo": "治理机制清单模板（数据 / 模型 / 输出三层）"}, "vslides": [{"t": "从个人提效到组织落地", "n": "前四个单元讲的是个人。但真正拉开差距的是组织级落地，它有三个阶段：试点、推广、治理。试点只选一到两个场景，把成败标准定死；推广把有效打法固化成模板与提示词库；治理建立规则、审计与问责。车企 skipping 试点直接铺到全车型项目，几乎必然失败。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">组织落地三阶段</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">试点</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">推广</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">治理</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "车型域治理：三层清单", "n": "车企的治理要落到三条线上。数据层，明确哪些车辆与车主数据可以进模型、哪些绝对不行；模型层，记录每次调用的场景、提示词版本与输出去向；输出层，规定哪些结论必须人签字才能进评审材料。三层各留一份清单，审计时才拿得出东西。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据层：可进 / 不可进清单</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">模型层：调用与版本留痕</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">输出层：需人签字的结论清单</tspan></text></svg>"}, {"t": "ROI 怎么度量：三类指标", "n": "老板问投入产出，你需要三类指标。效率类，比如配置对比从十天变一天；质量类，比如 PRD 一次通过率提升多少；风险类，比如合规拦截次数、数据事件数。三类都要有数字，只报效率显得片面，只报风险显得没产出。三张卡片摆上桌，汇报才站得住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类 ROI 指标</tspan></text><text x=\"24.0\" y=\"61.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">效率（周期压缩）</tspan></text><rect x=\"150\" y=\"51\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g class=\"hl\"><rect x=\"150\" y=\"51\" width=\"151.2\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"293.2\" y=\"64\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">72%</text></g><text x=\"24.0\" y=\"101.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">质量（一次通过率）</tspan></text><rect x=\"150\" y=\"91\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"91\" width=\"121.8\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"263.8\" y=\"104\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">58%</text></g><text x=\"24.0\" y=\"141.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">风险（拦截与事件）</tspan></text><rect x=\"150\" y=\"131\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"131\" width=\"65.1\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"207.1\" y=\"144\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">31%</text></g></svg>"}], "deliverable": {"type": "agent", "name": "部门 AI 治理官", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出一页纸高管答辩稿（价值 / 风险 / 管控），并明确标出需人决策项"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）\n【为什么重要】个人提效只是起点，真正拉开差距的是把打法固化到车型项目流程里\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M0U6", "tier": "adv", "step": "demo", "title": "模拟车企 X PM 团队提效方案", "video": {"dur": "8min", "script": ["把三份个人地图合成一份团队方案，是推广阶段最典型的一次动作", "团队提效方案结构（机会 / 路线 / 治理）", "「模拟车企 X」产品部方案节选（脱敏）"]}, "ppt": {"method": "团队提效方案结构（机会 / 路线 / 治理）", "case": "「模拟车企 X」产品部方案节选（脱敏）", "demo": "WorkBuddy 生成团队方案演示（粘贴 3 份个人地图）"}, "vslides": [{"t": "演示准备：三份个人地图", "n": "演示开始。手上是三位同项目产品经理的提效地图，内容各不相同：一位偏竞品与配置，一位偏用户研究，一位偏交付协同。我们要做的不是把它们拼在一起，而是找出共性。共性的机会才值得立项，共性的风险才值得写进制度。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：3 份个人提效地图</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">A：竞品/配置 · B：用户研究</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">C：项目协同</tspan></text></g></svg>"}, {"t": "让 WorkBuddy 归纳共性机会与风险", "n": "把三段摘要贴进 WorkBuddy，用准备好的提示词让它归纳。你会看到它很快给出共性机会清单：公开信息汇总、访谈结构化、会议纪要。也会给出共性风险：数据来源不明、结论无人签字。注意它给的风险往往偏泛，这一步必须你自己补上具体场景。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">汇总 3 份地图</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">归纳共性机会与</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">风险</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">补治理机制与排</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">期</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工把关：哪些结论不能照抄", "n": "最后一步最容易省，也最不能省。AI 给的排期通常偏乐观，它不知道工程冻结节点，也不知道供应商的产能约束。你要做的是把排期拉回真实日历，并在方案末尾写清三条必须由人决策的事项。跑完这一遍，你手上就有一份能进部门例会的材料。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">排期已按真实节点校准</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三类风险写清规避动作</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">需人决策项已单独列出</tspan></text></svg>"}], "deliverable": {"type": "agent", "name": "部门 AI 治理官", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《部门 AI 治理官》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是 3 位「星河 L7」项目产品经理的 AI 提效地图摘要：\n[粘贴]\n请归纳共性机会、共性风险，并按「试点—推广—治理」三阶段给出排期建议，输出一页团队方案，明确标注哪些决策必须由人拍板。"}, "task": "在 WorkBuddy 里把「团队提效方案结构（机会 / 路线 / 治理）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】团队提效方案结构（机会 / 路线 / 治理）\n【参考案例】「模拟车企 X」产品部方案节选（脱敏）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是 3 位「星河 L7」项目产品经理的 AI 提效地图摘要：\n[粘贴]\n请归纳共性机会、共性风险，并按「试点—推广—治理」三阶段给出排期建议，输出一页团队方案，明确标注哪些决策必须由人拍板。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U7", "tier": "adv", "step": "todo", "title": "写一页部门 AI 规划", "video": {"dur": "8min", "script": ["站部门负责人视角输出一页纸，是从执行者走向推动者的分水岭", "一页纸规划模板（机会 / 路线 / 风险）", "规划样例（脱敏）：3 机会 + 季度路线 + 3 风险"]}, "ppt": {"method": "一页纸规划模板（机会 / 路线 / 风险）", "case": "规划样例（脱敏）：3 机会 + 季度路线 + 3 风险", "demo": "填写指引（先机会后风险）"}, "vslides": [{"t": "任务说明：一页纸的三个框", "n": "这次的产出是一页纸，只有三个框。第一个框写三个最高价值的机会，第二个框写按季度排的试点路线，第三个框写三类风险与对策。一页纸的价值在于逼你做取舍：写不下就说明你还没想清楚优先级。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 3 个机会</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 季度路线</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 3 类风险与对策</tspan></text></svg>"}, {"t": "机会怎么选：按频次 × 影响面", "n": "选机会不要凭直觉，用两个维度打分。频次是这件事一年做多少次，影响面是做完能省多少人或多少天。两个都高的先做。车企里最典型的双高项通常是竞品配置监控和配置文档初稿——一个高频、一个高影响。单点偶发的任务再性感也别放进前三个。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">机会优先级矩阵</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">高频 × 高影响</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">优先立项</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">低频 × 高影响</tspan></text></g><g><rect x=\"18.0\" y=\"96.7\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">排二期</tspan></text></g><g><rect x=\"145.3\" y=\"96.7\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">高频 × 低影响</tspan></text></g><g><rect x=\"272.7\" y=\"96.7\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">做模板</tspan></text></g><g><rect x=\"18.0\" y=\"149.3\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">低频 × 低影响</tspan></text></g><g><rect x=\"145.3\" y=\"149.3\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">暂不做</tspan></text></g></svg>"}, {"t": "风险怎么写：写到动作为止", "n": "风险栏最常见的毛病是只写风险名，比如「数据泄露」。这不叫对策。要写到动作：车辆与车主数据一律脱敏后进私有部署模型，公开模型只处理公开配置信息。三条风险各配一个可执行的动作，这一页纸才有说服力，也才能在评审会上被通过。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条风险都写清一项具体规避动作</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">路线按季度且对齐车型节点</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三个机会都有频次或天数依据</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "部门 AI 规划一页纸", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《部门 AI 规划一页纸》并通过本单元评分要点"}, "practice": {"steps": ["选 3 个最高价值机会", "写试点路线（按季度）", "列 3 类风险与对策"], "exemplar": "机会：竞品配置监控自动化、配置 PRD 智能初稿、车主访谈结构化 路线：Q1 试点 PRD 初稿→Q2 推广至两个车型项目→Q3 治理固化 风险：车辆数据出域(脱敏)、幻觉(人审)、合规(授权条款)"}, "task": "产出《部门 AI 规划一页纸》：选 3 个最高价值机会；写试点路线（按季度）；列 3 类风险与对策", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M0 导论：车企 PM 的 AI 机会与红线」模块，你要交付的是《部门 AI 规划一页纸》。\n【场景】业务侧这周的诉求是：站部门负责人视角输出一页纸，是从执行者走向推动者的分水岭。参考做法：规划样例（脱敏）：3 机会 + 季度路线 + 3 风险。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（一页纸规划模板（机会 / 路线 / 风险）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《部门 AI 规划一页纸》填写模板】\n\n■ 1. 选 3 个最高价值机会\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写试点路线（按季度）\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 列 3 类风险与对策\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   机会：竞品配置监控自动化、配置 PRD 智能初稿、车主访谈结构化 路线：Q1 试点 PRD 初稿→Q2 推广至两个车型项目→Q3 治理固化 风险：车辆数据出域(脱敏)、幻觉(人审)、合规(授权条款)", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "高管答辩：追问 ROI 与风险", "video": {"dur": "8min", "script": ["高管只关心三件事：多久回本、和战略哪条对齐、最坏情况怎么兜", "高管答辩高频问题清单（ROI / 战略 / 风险）", "高分回答 vs 低分回答对照"]}, "ppt": {"method": "高管答辩高频问题清单（ROI / 战略 / 风险）", "case": "高分回答 vs 低分回答对照", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：副总的三个问题", "n": "进入陪练，对手是分管副总。他不会听你讲方法论，只会问三件事：多久回本、和今年哪个车型目标对齐、最坏情况你怎么兜。这三个问题如果答不上数字，就会被直接打断。所以先想清楚你要引用的那个数字来自哪里。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">副总的追问框架</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">ROI 与回本</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">战略对齐</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">最坏风险兜底</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "ROI 怎么答才有说服力", "n": "ROI 不要说「效率提升明显」，要给算式。比如：配置对比原来十天、现在一天，单次省九人天，一年做十二次，就是一百零八人天。折算成人力成本，再减去工具投入，剩下的才是净收益。给得出算式的回答，才扛得住追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">原来耗时 → 现在耗时</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">单次节省人天 × 年频次</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">减工具投入 = 净收益</tspan></text></svg>"}, {"t": "风险兜底：说清最坏情况", "n": "最后一个问题通常最难：最坏会怎样。不要回避，直接说。最坏情况是有人把车主轨迹贴进公开模型，触发数据合规事件。兜底动作是三层：私有部署、提示词显式约束、输出留痕可审计。能主动说出最坏情况的人，反而更容易拿到预算。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">主动说出最坏情况</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三层兜底动作可执行</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任主体到人</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "部门 AI 规划一页纸", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《部门 AI 规划一页纸》并通过本单元评分要点"}, "spar": {"role": "分管副总", "persona": "结果导向、不耐烦、逼你算清账", "mustAsk": ["这事多久回本？给我一个数字", "和今年车型项目的哪条目标对齐？", "最坏的风险是什么，你准备怎么兜？"]}, "task": "把《部门 AI 规划一页纸》拿到「分管副总」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《部门 AI 规划一页纸》。现在要让它通过「分管副总」这一关。\n【对手的立场】结果导向、不耐烦、逼你算清账。\n【他一定会追问】「这事多久回本？给我一个数字」 / 「和今年车型项目的哪条目标对齐？」 / 「最坏的风险是什么，你准备怎么兜？」\n【场景】你说「高管答辩：追问 ROI 与风险」，对方立刻回一句：这事多久回本？给我一个数字 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M1", "title": "M1 整车产品规划与市场洞察", "units": [{"id": "M1U1", "tier": "basic", "step": "understand", "title": "车型规划信息源与 AI 解读边界", "video": {"dur": "8min", "script": ["规划判断的质量上限，取决于你拿到的信息源质量", "信息源地图 + 解读边界框（归纳✓ / 下结论✗）", "一款竞品改款从曝光到上市的信息链路"]}, "ppt": {"method": "信息源地图 + 解读边界框（归纳✓ / 下结论✗）", "case": "一款竞品改款从曝光到上市的信息链路", "demo": "边界自查卡（这条是归纳还是结论？）"}, "vslides": [{"t": "四类信息源与更新频率", "n": "做车型规划，先认信息源。第一类是公开申报与公告，最权威但滞后；第二类是行业媒体与评测，快但带主观；第三类是终端与渠道反馈，最贴近成交但样本偏；第四类是用户社区舆情，最快也最杂。四类各有偏差，只用一类做判断，基本都会翻车。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四类信息源</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">公告申报</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">媒体评测</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">渠道终端</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">社区舆情</tspan></text></g></svg>"}, {"t": "AI 能做的：归纳、比对、留痕", "n": "AI 在这些材料上能干三件事。归纳，把几十页申报材料压成三段结论；比对，把三款竞品的已知配置拉成一张差异表；留痕，每条结论后面附上来源链接，方便回查。这三件事占掉信息处理的绝大部分工时，也是 AI 最稳的发挥区间。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">归纳：长材料压成要点</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">比对：多车型拉成差异表</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">留痕：每条结论带来源</tspan></text></svg>"}, {"t": "AI 不能做的：替你下规划结论", "n": "但有一件事 AI 不能做：替你判断这款车该不该上、什么时候上。因为竞品的申报信息往往滞后于真实决策，社区舆情又常常被放大。AI 看到的都是二手材料，它不知道你的产能、渠道和成本结构。结论必须由你来下，AI 只负责把材料摆整齐。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">AI 能做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人要做</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI：归纳 / 比对 / 留痕</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">人：判断 / 取舍 / 拍板</tspan></text></g></svg>"}], "deliverable": {"type": "skill", "name": "市场情报简报", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "粘贴公开行业材料，能输出影响范围 / 产品动作 / 时间表 / 待确认，结论留白"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】信息源地图 + 解读边界框（归纳✓ / 下结论✗）\n【为什么重要】规划判断的质量上限，取决于你拿到的信息源质量\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M1U2", "tier": "basic", "step": "demo", "title": "一份行业月报 → 结构化简报", "video": {"dur": "8min", "script": ["简报的价值不在于信息多，而在于让读的人知道下一步该做什么", "四段式简报结构（背景 / 发现 / 建议 / 待确认）", "把 40 页行业月报压成一页决策简报"]}, "ppt": {"method": "四段式简报结构（背景 / 发现 / 建议 / 待确认）", "case": "把 40 页行业月报压成一页决策简报", "demo": "WorkBuddy 内跑一遍简报生成提示词"}, "vslides": [{"t": "演示准备：一份 40 页月报", "n": "演示素材是一份四十页的行业月报，里面有销量数据、政策摘要、竞品动态和一堆图表。直接读完要两个小时，读完还可能抓不住重点。我们要做的，是用一次提示词把它变成一页能进决策会的简报。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：行业月报 40 页</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">含销量/政策/竞品动态</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：一页决策简报</tspan></text></g></svg>"}, {"t": "跑提示词：四段式输出", "n": "把关键片段贴进 WorkBuddy，用四段式提示词跑一遍。你会得到背景三句话、三个带来源标注的发现、一条可执行建议，以及一份待确认清单。关键在第四段：它会自动把那些没有交叉验证的数字标成「需人工核验」，这正是你要拿去回查的部分。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四段式简报</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">背景 3 句</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">3 个发现带</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">来源</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">1 条建议</tspan></text></g><g class=\"hl\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">待确认清</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">单</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：把待确认变成结论", "n": "AI 交出来的简报不能直接发。你要做的是把待确认清单逐条回查：这个销量数字来自哪个口径，是上险量还是批发量；这条政策有没有正式文本。回查完再补进简报，把「待确认」改成「已核实」。这一步做完，简报才真正可用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">待确认项已逐条回查</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数字口径已标注来源</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">建议落到具体车型动作</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "市场情报简报", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《市场情报简报》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是本月智能汽车行业月报的关键片段（公开材料）：\n[粘贴]\n请输出一页决策简报：①背景（3 句话）②3 个关键发现（每条注明来源类型）③1 条可执行建议 ④待确认清单（标「需人工核验」）。不要给出上市时间与定价的确定结论。"}, "task": "在 WorkBuddy 里把「四段式简报结构（背景 / 发现 / 建议 / 待确认）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】四段式简报结构（背景 / 发现 / 建议 / 待确认）\n【参考案例】把 40 页行业月报压成一页决策简报\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是本月智能汽车行业月报的关键片段（公开材料）：\n[粘贴]\n请输出一页决策简报：①背景（3 句话）②3 个关键发现（每条注明来源类型）③1 条可执行建议 ④待确认清单（标「需人工核验」）。不要给出上市时间与定价的确定结论。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M1U3", "tier": "basic", "step": "todo", "title": "生成你细分市场的情报简报", "video": {"dur": "8min", "script": ["把方法落到你自己负责的那个价格带上，才算真的学会", "细分市场情报简报模板（价格带 / 配置 / 竞品 / 结论）", "20 万级纯电 SUV 细分市场情报简报样例"]}, "ppt": {"method": "细分市场情报简报模板（价格带 / 配置 / 竞品 / 结论）", "case": "20 万级纯电 SUV 细分市场情报简报样例", "demo": "填写指引（先价格带后配置差异）"}, "vslides": [{"t": "第一步：锁定价格带与竞品", "n": "先定边界。你负责的是哪个价格带，这个带里真正抢你订单的是哪三款车。竞品不要按品牌选，要按成交重叠度选——终端反馈里客户最常拿来比价的那几款，才是你的直接竞品。选错竞品，后面整份简报都白做。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"
