Ratio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">授权写到具体用途</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">出境写明落地区域</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">含糊项一律标待确认</tspan></text></svg>"}, {"t": "第三步：整理给法务的问题", "n": "最后把所有「待确认」整理成一张给法务的问题列表。每个问题要带上业务背景，让法务不用再猜。问题整理得好，评审效率能翻倍。这一步做完，你手上的清单就是可以跨项目复用的资产。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">第三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">汇总待确认项</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">每项补业务背景</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">形成法务问题列</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">表</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "数据合规检查清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《数据合规检查清单》并通过本单元评分要点"}, "practice": {"steps": ["列出功能涉及的 6 个数据项并判定级别", "逐项填写授权范围与是否出境", "写出需向法务确认的问题列表"], "exemplar": "数据项：姿态特征（脱敏）｜级别：内部｜授权：需确认是否覆盖模型优化用途｜出境：否 数据项：车辆位置｜级别：重要｜授权：行车安全用途已授权｜出境：否｜待确认：模型优化是否需单独授权"}, "task": "产出《数据合规检查清单》：列出功能涉及的 6 个数据项并判定级别；逐项填写授权范围与是否出境；写出需向法务确认的问题列表", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M6 车辆数据安全与合规下的 AI 用法」模块，你要交付的是《数据合规检查清单》。\n【场景】业务侧这周的诉求是：清单化是合规工作里唯一能复用的资产。参考做法：一份完整的数据合规检查清单样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（数据合规检查清单模板（数据项 / 级别 / 授权 / 出境 / 待确认）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《数据合规检查清单》填写模板】\n\n■ 1. 列出功能涉及的 6 个数据项并判定级别\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 逐项填写授权范围与是否出境\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写出需向法务确认的问题列表\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   数据项：姿态特征（脱敏）｜级别：内部｜授权：需确认是否覆盖模型优化用途｜出境：否 数据项：车辆位置｜级别：重要｜授权：行车安全用途已授权｜出境：否｜待确认：模型优化是否需单独授权", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M6U8", "tier": "adv", "step": "spar", "title": "法务与监管检查", "video": {"dur": "8min", "script": ["被检查时最怕的不是被发现有问题，是材料对不上", "检查应对清单（材料齐备 / 口径一致 / 责任明确）", "一次检查的高分与低分应对"]}, "ppt": {"method": "检查应对清单（材料齐备 / 口径一致 / 责任明确）", "case": "一次检查的高分与低分应对", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：他要现场验证", "n": "对手是法务与检查人员，他们不只问你写了什么，还会要求现场验证。所以清单上的每一项都必须是真实执行的做法，不能是理想状态。上场前先自查一遍：清单里有没有写了但没做的项。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">检查三问</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">材料齐备</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">口径一致</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">责任明确</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：级别判定依据", "n": "第二问是级别判定依据。你说某项数据是内部级，依据是什么？是分类分级制度里的哪一条，还是前人这么判的。答得出条款编号才叫有依据。答不出的项，应该提前找数据安全同事确认一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">引分类分级制度条款</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">说明判定理由</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">无依据项提前确认</tspan></text></svg>"}, {"t": "最后一问：不一致谁负责", "n": "最后一问最难：如果实际做法与清单不符，谁负责。答法是给出责任人矩阵：每个数据项对应一个责任人，负责清单与实况一致，并写明多久自查一次。有责任人矩阵，检查才能闭环。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每个数据项有责任人</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明自查频率</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不一致时的整改流程</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "数据合规检查清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《数据合规检查清单》并通过本单元评分要点"}, "spar": {"role": "法务与检查人员", "persona": "只认书面材料，追问口径一致性与责任归属", "mustAsk": ["这份清单和你们实际做法一致吗，能现场验证吗？", "这个数据项的级别判定依据是什么？", "如果实际与清单不符，谁负责？"]}, "task": "把《数据合规检查清单》拿到「法务与检查人员」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《数据合规检查清单》。现在要让它通过「法务与检查人员」这一关。\n【对手的立场】只认书面材料，追问口径一致性与责任归属。\n【他一定会追问】「这份清单和你们实际做法一致吗，能现场验证吗？」 / 「这个数据项的级别判定依据是什么？」 / 「如果实际与清单不符，谁负责？」\n【场景】你说「法务与监管检查」，对方立刻回一句：这份清单和你们实际做法一致吗，能现场验证吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M7", "title": "M7 综合实战：从 0 到 1 定义一款智能车型", "units": [{"id": "M7U1", "tier": "basic", "step": "understand", "title": "0→1 车型产品方法论", "video": {"dur": "8min", "script": ["把前面六个模块串起来，你需要的不是新概念，而是一条能走的路", "方法论图（五步 + 交付物）", "一款智能电动 SUV 从 0 到 1 的路径"]}, "ppt": {"method": "方法论图（五步 + 交付物）", "case": "一款智能电动 SUV 从 0 到 1 的路径", "demo": "步骤检查表"}, "vslides": [{"t": "五步与每步交付物", "n": "从零到一做一款车，走五步。第一步找机会，产出机会描述；第二步立项，产出立项材料；第三步写产品定义，产出配置 PRD；第四步上线闭环，产出上市与监控方案；第五步复盘，产出改进项清单。每步都有明确交付物，没有交付物就等于没走完。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">0→1 五步</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">找机会</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">立项</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">产品定义</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">上线闭环</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">复盘</tspan></text></g></svg>"}, {"t": "AI 在各步的杠杆点", "n": "AI 在这五步里各有杠杆点：找机会时做信息汇总，立项时搭材料骨架，产品定义时生成 PRD 初稿，上线闭环时配监控与归因，复盘时整理时间线。但每一步的最终判断都在人——AI 负责把材料备齐，你负责拍板。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">AI 的五处杠杆</tspan></t ze=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">工程能照着做</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">合规能照着查</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">高管能听懂</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "最小产品方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "机会描述能落成五步一页纸方案，并通过三视角自检"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】方法论图（五步 + 交付物）\n【为什么重要】把前面六个模块串起来，你需要的不是新概念，而是一条能走的路\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M7U2", "tier": "basic", "step": "demo", "title": "从立项到配置 PRD 全流程", "video": {"dur": "8min", "script": ["把五步连起来跑一遍，你才知道断点通常出现在哪", "全流程演示（机会 → 立项 → 配置 PRD）", "一次完整的产品定义演示"]}, "ppt": {"method": "全流程演示（机会 → 立项 → 配置 PRD）", "case": "一次完整的产品定义演示", "demo": "WorkBuddy 内跑一遍全流程提示词"}, "vslides": [{"t": "演示准备：三类前置输入", "n": "演示素材是三类前置输入：市场机会描述、成本约束区间、三款竞品的公开配置。这三类正是立项会要求你带的材料。我们要用一次提示词把它们变成一页产品定义草案。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：机会 / 成本区间 / 竞品配置</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：一页产品定义草案</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">含：需补充的关键信息</tspan></text></g></svg>"}, {"t": "跑提示词：三步输出一页", "n": "把材料贴进 WorkBuddy 跑一遍，按机会、立项要点、配置 PRD 骨架三步输出。关键设计是要求它标出每一步需要你补充的信息——这让你一眼看到断点在哪。通常断点会出现在成本细项和智驾能力边界上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">机会</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">立项要点</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">配置 PRD 骨架</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：补断点再走下一步", "n": "断点补不齐就别往下走。演示的真正价值在这里：它逼你把「还没想清楚」的部分显性化。补完断点再重跑一遍，第二版的草案通常在结构上就完整了。这个循环，就是 AI 时代做产品定义的真实节奏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">断点已逐条列出</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条有补齐责任人与时间</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">补齐后重跑一遍</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "最小产品方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《最小产品方案》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是我们这一代车型的前置输入：市场机会描述、成本约束区间、三个直接竞品的公开配置（已脱敏）：\n[粘贴]\n请按「机会 → 立项要点 → 配置 PRD 骨架」三步输出一页产品定义草案，并标出每一步需要我补充的关键信息。不要给出定价与上市时间的确定结论。"}, "task": "在 WorkBuddy 里把「全流程演示（机会 → 立项 → 配置 PRD）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】全流程演示（机会 → 立项 → 配置 PRD）\n【参考案例】一次完整的产品定义演示\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是我们这一代车型的前置输入：市场机会描述、成本约束区间、三个直接竞品的公开配置（已脱敏）：\n[粘贴]\n请按「机会 → 立项要点 → 配置 PRD 骨架」三步输出一页产品定义草案，并标出每一步需要我补充的关键信息。不要给出定价与上市时间的确定结论。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M7U3", "tier": "basic", "step": "todo", "title": "交付最小车型方案", "video": {"dur": "8min", "script": ["最小方案的价值在于它能被评审，而不是它有多厚", "最小车型方案模板（机会 / 用户 / 配置 / 验证 / 风险）", "一份完整的车型最小方案样例"]}, "ppt": {"method": "最小车型方案模板（机会 / 用户 / 配置 / 验证 / 风险）", "case": "一份完整的车型最小方案样例", "demo": "填写指引（先机会后配置）"}, "vslides": [{"t": "第一步：机会与用户场景", "n": "先写机会描述和核心用户场景。机会要写清在哪个价格带、哪个痛点上成立；用户场景写清两类就够——最高频的那类和最愿意付钱的那类。写清这两类，后面的配置取舍才有依据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 价格带 + 痛点</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 最高频场景</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 最愿付费场景</tspan></text></svg>"}, {"t": "第二步：配置矩阵与卖点", "n": "然后给配置矩阵和差异化卖点。矩阵按三档分配，卖点只留一个一句话版本。卖点超过一个，说明定位还没想清楚。矩阵与卖点必须对得上：卖点里提到的每一项，在矩阵里都要能找到对应配置。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三档分配无倒挂</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">一句话卖点只有一个</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">卖点在矩阵中有对应项</tspan></text></svg>"}, {"t": "第三步：验证方式与风险", "n": "最后写验证方式和三类风险。验证要具体到多少城多少店、看什么指标；风险写成本超支、供应商延期、合规授权未覆盖三类，每类配一个动作。这三块写全，方案就能进立项会了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">第三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">验证：城/店/指</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">标</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">风险：成本 / 供</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">应 / 合规</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">每类配一个动作</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "最小车型方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《最小车型方案》并通过本单元评分要点"}, "practice": {"steps": ["写机会描述与核心用户场景", "给出配置矩阵与差异化卖点", "写验证方式与三类风险"], "exemplar": "机会：20–25 万级纯电 SUV 中，后排舒适度是集中抱怨点｜用户：通勤 + 周末带娃 配置：后排屏 / 靠背可调 / 双层隔音玻璃 三档分配｜验证：6 城 12 店试驾反馈 + 订单结构监控 风险：成本超支 / 供应商延期 / 合规授权未覆盖"}, "task": "产出《最小车型方案》：写机会描述与核心用户场景；给出配置矩阵与差异化卖点；写验证方式与三类风险", "brief": "【你的角色】你是「模拟车企 X」负责「星河 L7」的车企产品经理。本单元属于「M7 综合实战：从 0 到 1 定义一款智能车型」模块，你要交付的是《最小车型方案》。\n【场景】业务侧这周的诉求是：最小方案的价值在于它能被评审，而不是它有多厚。参考做法：一份完整的车型最小方案样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（最小车型方案模板（机会 / 用户 / 配置 / 验证 / 风险）），以及上面场景中描述的业务信息。\n【硬约束】车辆与车主数据不出域（只用脱敏或公开信息）· 不替人决策（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《最小车型方案》填写模板】\n\n■ 1. 写机会描述与核心用户场景\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 给出配置矩阵与差异化卖点\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写验证方式与三类风险\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   机会：20–25 万级纯电 SUV 中，后排舒适度是集中抱怨点｜用户：通勤 + 周末带娃 配置：后排屏 / 靠背可调 / 双层隔音玻璃 三档分配｜验证：6 城 12 店试驾反馈 + 订单结构监控 风险：成本超支 / 供应商延期 / 合规授权未覆盖", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M7U4", "tier": "basic", "step": "spar", "title": "立项评审", "video": {"dur": "8min", "script": ["立项会只关心四件事：机会够不够大、差异化够不够、做不做得出、风险兜不兜得住", "立项评审清单（机会 / 差异化 / 可行性 / 风险）", "一次立项会的问答实录"]}, "ppt": {"method": "立项评审清单（机会 / 差异化 / 可行性 / 风险）", "case": "一次立项会的问答实录", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：委员会四问", "n": "对手是立项评审委员会，四问：机会多大、差异化成立吗、做得出吗、风险怎么兜。上场前把机会的市场量级算清楚——这个价格带一年多少台、你能拿多少份额，这两个数决定一切。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">立项四问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">机会量级</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">差异化</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">可行性</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">风险兜底</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：凭什么是我们", "n": "第二问最难：凭什么是我们能做、竞品做不了。答法要落到能力或节奏上：比如供应链已有独家合作、已有平台可复用、或者能比竞品早半年上市。落到「我们更用心」这种话，一定过不了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">供应链独家 / 平台复用 / 时间窗</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">说清为什么竞品短期跟不上</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">给出可验证的时间差</tspan></text></svg>"}, {"t": "最后一问：最坏情况怎么兜", "n": "最后一问是风险兜底。要给出分层预案：成本超支到什么程度就砍配置，供应商延期到什么时候就切备选，合规授权拿不到就降级功能。分层预案说明你想过失败，反而更容易拿到立项。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">成本超支 → 砍哪些配置</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">供应延期 → 备选方案</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">合规未覆盖 → 功能降级</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "最小车型方案", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《最小车型方案》并通过本单元评分要点"}, "spar": {"role": "立项评审委员会", "persona": "逐条挑刺，追问机会大小与差异化是否成立", "mustAsk": ["这个机会有多大，给我一个量级", "凭什么是我们能做，竞品做不了？", "最坏情况是什么，你怎么兜？"]}, "task": "把《最小车型方案》拿到「立项评审委员会」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《最小车型方案》。现在要让它通过「立项评审委员会」这一关。\n【对手的立场】逐条挑刺，追问机会大小与差异化是否成立。\n【他一定会追问】「这个机会有多大，给我一个量级」 / 「凭什么是我们能做，竞品做不了？」 / 「最坏情况是什么，你怎么兜？」\n【场景】你说「立项评审」，对方立刻回一句：这个机会有多大，给我一个量级 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：_____________________________ const UP=new URLSearchParams(location.search);
const WEAK=(UP.get('weak')||'').split(',').map(s=>s.trim()).filter(Boolean);

// 把「模块 8 单元全部通关」回写主站学习地图进度（localStorage 同源共享），主站监听 storage 事件实时刷新。
function syncMapProgress(){
  try{
    const key='ai_training_progress';
    let cp={}; try{ cp=JSON.parse(localStorage.getItem(key))||{}; }catch(_){}
    COURSE.modules.forEach((m,mi)=>{
      const cid='auto_pm_m'+mi;
      const allDone=m.units.every(u=>prog.units[u.id]&&prog.units[u.id].done);
      if(allDone) cp[cid]=Object.assign({},cp[cid],{done:true,completedAt:Date.now()});
    });
    localStorage.setItem(key, JSON.stringify(cp));
  }catch(_){}
}

/* ===================== 管理员预览模式 =====================
   开启方式：URL 带 ?admin=1 或 ?preview=1，或点击页头「管理员预览」开关。
   作用：顶部显示横幅，练习/陪练/测验标注为可选，结算可跳过测试直接标记已观看。
   对学员（未开启）流程零影响。 */
const ADMIN_KEY='aidax_auto_pm_admin';
function isAdmin(){
  try{
    const p=new URLSearchParams(location.search);
    if(p.has('admin')||p.has('preview')){ try{localStorage.setItem(ADMIN_KEY,'1');}catch(e){} return true; }
    return localStorage.getItem(ADMIN_KEY)==='1';
  }catch(e){ return false; }
}
let ADMIN=isAdmin();
function toggleAdmin(){
  ADMIN=!ADMIN;
  try{ localStorage.setItem(ADMIN_KEY, ADMIN?'1':'0'); }catch(e){}
  applyAdminUI();
  if(prog.cur && findUnit(prog.cur)) openUnit(prog.cur);
}
function applyAdminUI(){
  const tg=document.getElementById('admin-toggle');
  if(tg) tg.textContent='管理员预览：'+(ADMIN?'开':'关');
  const bn=document.getElementById('admin-banner');
  if(bn) bn.style.display=ADMIN?'block':'none';
}
function refreshProg(){
  const u=Object.values(prog.units).filter(x=>x&&x.done).length;
  const q=Object.values(prog.quizzes).filter(Boolean).length;
  const s=prog.scores? Object.values(prog.scores).filter(v=>typeof v==='number').length : 0;
  document.getElementById('prog-done').textContent=u;
  document.getElementById('prog-quiz').textContent=q;
  document.getElementById('prog-pct').textContent=Math.round(u/64*100)+'%';
  const sp=document.getElementById('prog-score'); if(sp) sp.textContent=s;
  const xp=document.getElementById('prog-xp'); if(xp) xp.textContent=totalXP();
}

    _cloudClient=WorkBuddyCloud.createWorkBuddyCloud({endpoint:CLOUD_CFG.endpoint, publishableKey:CLOUD_CFG.publishableKey});
  }catch(e){ _cloudErr=(e&&e.message)||String(e); return null; }
  return _cloudClient;
}
async function cloudModel(){
  if(_cloudModel) return _cloudModel;
  const c=cloudClient(); if(!c) return null;
  try{
    const list=await c.llm.models.list();
    const m=(list||[]).find(x=>x && x.disabled!==true);
    if(m && m.id){ _cloudModel=m.id; _cloudErr=''; return m.id; }
    _cloudErr='云端暂无可用模型';
  }catch(e){
    _cloudErr=(e&&e.error&&e.error&&e.error.code)?e.error.code:((e&&e.message)||String(e));
  }
  return null;
}
const CLOUD_FALLBACK_SYS='你是 AIDAX 企业 AI 实训课程的内嵌陪练教练。回答简洁具体、面向真实业务场景；需要真实数据的地方明确标出待填，绝不编造数字。';
async function cloudChat(messages, opts){
  const c=cloudClient(); if(!c) throw new Error(_cloudErr||'SDK未加载');
  const model=await cloudModel(); if(!model) throw new Error(_cloudErr||'云端无可用模型');
  const msgs=(messages||[]).slice();
  if(!msgs.length || msgs[0].role!=='system') msgs.unshift({role:'system',content:CLOUD_FALLBACK_SYS});
  let out='';
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),45000);
  try{
    const stream=await c.llm.chat.completions.create({
      model:model, messages:msgs, stream:true,
      temperature:(opts&&opts.temperature)||0.6,
      signal:ctl.signal
    });
    for await (const ch of stream){
      const d=ch&&ch.choices&&ch.choices[0]&&ch.choices[0].delta;
      if(d && d.content) out+=d.content;
    }
  } finally { clearTimeout(tm); }
  if(!out.trim()) throw new Error('云端返回空回复');
  return out.trim();
}

function llmEndpoint(){
  if(LLM.state==='direct' && LLM.key){
    return {url:'https://api.deepseek.com/chat/completions',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+LLM.key}};
  }
  return {url:LLM.base.replace(/\/$/,'')+'/chat', headers:{'Content-Type':'application/json'}};
}
async function llmChat(messages, opts){
  /* 优先通道 C（学员零配置）；仅在直连模式下跳过 */
  if(LLM.state!=='direct'){
    try{ return await cloudChat(messages, opts); }catch(e){ /* 继续降级 */ }
  }
  const ep=llmEndpoint();
  const body=Object.assign({model:'deepseek-chat',messages:messages,temperature:0.6,max_tokens:700},opts||{});
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), 25000);
  try{
    const r=await fetch(ep.url,{method:'POST',headers:ep.headers,body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('HTTP '+r.status+' '+t.slice(0,120)); }
    const j=await r.json();
    const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!c) throw new Error('空回复');
    return String(c).trim();
  } finally { clearTimeout(tm); }
}
async function llmProbe(silent){
  let st='off';
  try{ const m=await cloudModel(); if(m) st='cloud'; }catch(e){}
  if(st==='off'){
    try{
      const r=await fetch(LLM.base.replace(/\/$/,'')+'/ping',{cache:'no-store'});
      if(r.ok) st='proxy';
    }catch(e){}
  }
  if(st==='off' && LLM.key){
    try{
      const r=await fetch('https://api.deepseek.com/models',{headers:{'Authorization':'Bearer '+LLM.key}});
      if(r.ok) st='direct';
    }catch(e){}
  }
  LLM.state=st; paintLlm();
  if(!silent && st==='off') openLlm();
  return st;
}

function findUnit(uid){ for(const m of COURSE.modules){ const u=m.units.find(x=>x.id===uid); if(u) return {m,u}; } return null; }
function flatUnits(){ const a=[]; COURSE.modules.forEach(m=>m.units.forEach(u=>a.push(u))); return a; }
function nextUnit(uid){ const a=flatUnits(), i=a.findIndex(x=>x.id===uid); return i>=0&&i+1<a.length?a[i+1]:null; }
function prevUnit(uid){ const a=flatUnits(), i=a.findIndex(x=>x.id===uid); return i>0?a[i-1]:null; }

function buildSteps(u){
  const s=[{key:'watch',icon:'\uD83D\uDCFA',title:'看视频'},
           {key:'task',icon:'\uD83D\uDCDD',title:'做任务'}];
  if(u.deliverable&&u.deliverable.name) s.push({key:'deliv',icon:'\uD83D\uDCE6',title:'交付物'});
  s.push({key:'settle',icon:'\uD83C\uDFC1',title:'结算'});
  return s;
}
function resumeIdx(uid){
  const st=prog.units[uid]||{};
  const u=findUnit(uid).u;
  const steps=buildSteps(u);
  if(!st.watched) return 0;
  if(!st.taskDone) return 1;
  const di=steps.findIndex(s=>s.key==='deliv');
  if(di>=0 && !st.delivSeen) return di;
  return steps.length-1;
}

/* ===================== 播放器（字幕与真人声对齐；高亮讲到才闪三下） ===================== */
function makePlayer(uid, slides, aud){
  const stage=document.getElementById('p-stage'), subEl=document.getElementById('p-sub'), dots=document.getElementById('p-dots'),
        seek=document.getElementById('p-seek'), timeEl=document.getElementById('p-time'), playBtn=document.getElementById('p-play');
  let cur=0, playing=false, mode=null, audio=null, ttsTimer=null, ttsPulse=null, ttsStart=0, pulsedIdx=-1, ttsGuard=null;
  const dur=slides.map(s=>Math.max(2, sub(s.n).length*0.205)); /* 0.205 s/字 = 豆包实测 4.9 字/秒 */
  const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;};
  const total=()=>dur.reduce((a,b)=>a+b,0);
  function linesOf(i){ const n=sub(slides[i].n); return n.split(/(?<=[。！？；\n])/).map(x=>x.trim()).filter(Boolean); }
  function setCaption(i,frac){
    const n=sub(slides[i].n), ls=linesOf(i), spoken=frac*Math.max(1,n.length);
    let acc=0,k=0;
    for(let x=0;x<ls.length;x++){ acc+=ls[x].length; if(spoken<acc){k=x;break;} k=x; }
    subEl.textContent=ls[k];
  }
  function updateSeek(){
    let start=0; for(let k=0;k<cur;k++) start+=dur[k];
    let local=0,d=dur[cur]||1;
    if(mode==='audio'&&audio){ local=audio.currentTime; d=audio.duration||d; }
    else if(mode==='tts'){ local=(performance.now()-ttsStart)/1000; }
    const g=start+Math.min(local,d), frac=total()?g/total():0;
    seek.querySelector('.fill').style.width=(frac*100)+'%';
    seek.querySelector('.knob').style.left=(frac*100)+'%';
    timeEl.textContent=fmt(g)+' / '+fmt(total());
  }
  function pulseNow(){
    const s=stage.querySelectorAll('.slide')[cur]; if(!s) return;
    const h=s.querySelector('.hl'); if(!h) return;
    h.classList.remove('pulse'); void h.offsetWidth; h.classList.add('pulse');
    setTimeout(()=>h.classList.remove('pulse'),2600);
  }
  function maybePulse(i,frac){ if(pulsedIdx!==i && frac>=0.34){ pulsedIdx=i; pulseNow(); } }
  function render(){
    stage.innerHTML=''; dots.innerHTML='';
    slides.forEach((s,i)=>{
      const d=document.createElement('div'); d.className='slide'+(i===cur?' on':'');
      d.innerHTML='<h4>'+sub(s.t)+'</h4>'+sub(s.s);
      stage.appendChild(d);
      const dot=document.createElement('i'); if(i===cur)dot.className='on'; dots.appendChild(dot);
    });
  }
  /* 完全无语音环境：按估算时长滚筒式推进，保证画面一定会走 */
  function clockSlide(i){
    mode='tts'; ttsStart=performance.now();
    setCaption(i,0); updateSeek();
    clearInterval(ttsTimer); ttsTimer=setInterval(updateSeek,200);
    clearInterval(ttsPulse); ttsPulse=setInterval(()=>{ maybePulse(i,(performance.now()-ttsStart)/1000/(dur[i]||1)); },150);
    clearTimeout(ttsGuard);
    ttsGuard=setTimeout(()=>{ if(playing&&mode==='tts'&&cur===i) advance(); }, Math.round((dur[i]+1)*1000));
  }
  function ttsSlide(i){
    var sup=true;
    try{ sup=!!(typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined'); }catch(e){ sup=false; }
    if(!sup){ clockSlide(i); return; }
    var u2;
    try{ u2=new SpeechSynthesisUtterance(sub(slides[i].n)); }catch(e){ clockSlide(i); return; }
    mode='tts'; ttsStart=performance.now();
    u2.lang='zh-CN'; u2.rate=1;
    u2.onboundary=e=>{ const n=sub(slides[i].n), before=n.slice(0,e.charIndex); let acc=0,k=0;
      for(let x=0;x<linesOf(i).length;x++){ acc+=linesOf(i)[x].length; if(before.length<acc){k=x;break;} k=x; }
      const f=before.length/Math.max(1,n.length); setCaption(i,f); maybePulse(i,f); updateSeek(); };
    u2.onend=()=>{ if(playing) advance(); };
    try{ speechSynthesis.cancel(); speechSynthesis.speak(u2); }catch(e){ clockSlide(i); return; }
    setCaption(i,0); updateSeek();
    clearInterval(ttsTimer); ttsTimer=setInterval(updateSeek,200);
    clearInterval(ttsPulse); ttsPulse=setInterval(()=>{ maybePulse(i,(performance.now()-ttsStart)/1000/(dur[i]||1)); },150);
    /* 语音静默失败兜底：到估算时长还没在播报，就自动翻页，避免永久卡住 */
    clearTimeout(ttsGuard);
    ttsGuard=setTimeout(()=>{
      if(!playing||mode!=='tts'||cur!==i) return;
      let sp=false; try{ sp=!!(speechSynthesis.speaking||speechSynthesis.pending); }catch(e){}
      if(!sp) advance();
    }, Math.round((dur[i]+1.5)*1000));
  }
  function playSlide(i){
    cur=i; render(); pulsedIdx=-1; clearInterval(ttsPulse); clearTimeout(ttsGuard);
    if(aud&&aud[i]){
      mode='audio'; audio=new Audio(aud[i]);
      audio.onloadedmetadata=()=>{ if(audio.duration) dur[i]=audio.duration; updateSeek(); };
      audio.onended=()=>{ if(playing) advance(); };
      audio.ontimeupdate=()=>{ if(mode==='audio'){ const f=(audio.currentTime)/(audio.duration||dur[i]); setCaption(i,f); maybePulse(i,f); updateSeek(); } };
      /* 音频真的加载不出来时降级本机语音，绝不静默跳过（静默跳过会表现为「点了没反应」） */
      audio.onerror=()=>{ if(playing&&mode==='audio'){ try{audio.pause();}catch(e){} ttsSlide(i); } };
      const pr=audio.play();
      if(pr&&pr.catch) pr.catch(()=>{ if(playing&&mode==='audio'&&!(audio.duration>0)) ttsSlide(i); });
      setCaption(i,0); updateSeek();
    }else{ ttsSlide(i); }
  }
  function advance(){ const ni=cur+1; if(ni>=slides.length){ stop(); subEl.textContent='本节讲解结束，可继续下方环节活动'; return; } playSlide(ni); }
  function stop(){ playing=false; if(audio){try{audio.pause();}catch(e){}} try{speechSynthesis.cancel();}catch(e){} clearInterval(ttsTimer); clearInterval(ttsPulse); clearTimeout(ttsGuard); if(playBtn) playBtn.textContent='\u25B6 播放'; }
  function play(){ if(playing){ stop(); return; } playing=true; if(playBtn) playBtn.textContent='\u23F8 暂停'; playSlide(cur<0?0:cur); }
  playBtn.onclick=play;
  seek.addEventListener('pointerdown',ev=>{
    const r=seek.getBoundingClientRect(); let frac=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
    let g=frac*total(),acc=0,idx=0;
    for(let k=0;k<slides.length;k++){ if(acc+dur[k]>g){idx=k;break;} acc+=dur[k]; idx=k; }
    stop(); playSlide(idx);
    if(mode==='audio'&&audio) audio.currentTime=Math.min(g-acc,(audio.duration||dur[idx])-0.05);
    updateSeek();
  });
  render();   /* 进入单元先渲染第一页，避免一片黑让人误以为播放器坏了 */
  updateSeek();
  return {stop:stop, play:play};
}

/* ---------- 问题 3：分数由行为算出来，点按钮不能凭空拿分 ---------- */
function actsOf(uid){ return (prog.units[uid]&&prog.units[uid].acts)||{}; }
function setAct(uid,k,v){
  const st=prog.units[uid]||{}; const a=Object.assign({},st.acts||{});
  a[k]=v; prog.units[uid]=Object.assign({},st,{acts:a}); saveProg();
}
const BOUNDARY_RE=/不确定|待确认|留给|由.{1,6}(判断|决定|确认)|需要.{0,4}确认|不能替|边界|存疑|风险|我会补|降级/;
const EVID_RE=/[0-9０-９]|数据|口径|来源|条款|原文|看板|访谈|样本|比例|百分比|%|频次|制度|办法|规则/;
const PLAN_RE=/责任人|负责人|时间|节点|下周|本周|月底|排期|截止|owner|上线|交付|deadline/i;

function computeUnit(uid){
  const f=findUnit(uid); if(!f) return {ok:false,score:0,detail:[],need:'单元不存在'};
  const u=f.u, a=actsOf(uid), R=[]; let s=0, need='';
  if(u.step==='understand'){
    const b=bankOf(uid);
    if(b){
      const bc=bankCorrect(uid);
      const pass=Math.ceil(b.length*0.8);
      const qzScore=Math.round(60*bc.n/b.length);
      s+=qzScore;
      R.push({k:'练习答对 '+bc.n+'/'+bc.total+'（需 ≥'+pass+'）',ok:bc.n>=pass,hint:'答错的题看解析后重选，选对为止'});
      if(bc.n<pass) need='练习题至少要答对 '+pass+' 题（当前 '+bc.n+' 题）';
    } else {
      const q=!!a.quiz;
      s+=q?60:0;
      R.push({k:'自检题答对',ok:q,hint:'答案落在「AI 补结构与措辞、判断与取舍留给人」这条线上'});
      if(!q) need='先答对上面的自检题';
    }
    const nr=scoreNoteText(a.note||'');
    s+=nr.score;
    nr.detail.forEach(function(d){ R.push(d); });
    if(!need && nr.score<20) need='收获要写具体：说清能用在你的哪个项目/指标上，并写出下一步要验证什么';
  } else if(u.step==='demo'){
    const ran=!!a.ran, rec=(a.rec||'').trim(), chk=!!a.checked;
    /* 演示记录按质量判，不看字数：可用/不可用 + 人工修正 + 可复用句式，三要素 */
    const usable=/(可用|能用|直接用|采纳|保留|没问题|符合预期|准确)/.test(rec);
    const unusable=/(不可用|不能采信|不对|有误|编造|幻觉|偏差|失真|要改|需人工|不采纳|错误)/.test(rec);
    const fixed=/(我改了|修正|调整|补充|人工核对|复核|替换|删掉|重写|改成)/.test(rec);
    const reuse=/(以后|下次|复用|固定句式|模板化|沉淀|通用|以后都)/.test(rec);
    const recScore=(usable?12:0)+(unusable?14:0)+(fixed?12:0)+(reuse?12:0);
    R.push({k:'跑通一遍（复制提示词或用模型跑）',ok:ran,hint:'点「复制提示词」或「用模型跑一遍」都算'});
    R.push({k:'指出哪部分可用',ok:usable,hint:'写明 AI 输出里哪些可以直接用'});
    R.push({k:'指出哪部分不可用',ok:unusable,hint:'写明 AI 输出里哪些不能采信（幻觉/偏差/口径错）'});
    R.push({k:'写了你的人工修正',ok:fixed,hint:'写明你改了什么、为什么改'});
    R.push({k:'沉淀出可复用句式/模板',ok:reuse,hint:'写一句下次还能直接用的提示词或句式'});
    R.push({k:'确认已人工核对结果',ok:chk,hint:'勾选下方复选框'});
    s=(ran?30:0)+Math.min(50,recScore)+(chk?20:0);
    if(!ran) need='先跑一遍（复制提示词或用模型跑）';
    else if(recScore<38) need='演示记录要写清：哪部分可用、哪部分不可用、你做了什么人工修正、沉淀出什么可复用句式（当前 '+recScore+'/50）';
    else if(!chk) need='勾选「我已人工核对过模型结果」';
  } else if(u.step==='todo'){
    const t=(a.work||'').trim();
    if(!t){ R.push({k:'提交产出内容',ok:false,hint:'按模板逐节填写后提交'}); need='先按模板写出你的产出并提交'; }
    else { const r=scoreWorkText(u,t); r.need=r.need||''; return r; }
  } else if(u.step==='spar'){
    const rounds=a.rounds||0, best=a.best||0, bd=!!a.boundary;
    R.push({k:'完成 ≥3 轮真实对话',ok:rounds>=3,hint:'陪练至少追问满 3 轮'});
    R.push({k:'≥2 轮给出了可追溯依据',ok:best>=2,hint:'回答里要出现数字/条款/口径/来源'});
    R.push({k:'划出责任边界',ok:bd,hint:'说清哪部分你不下结论、交给谁'});
    s=(rounds>=3?40:Math.min(39,rounds*13))+Math.min(35,best*18)+(bd?25:0);
    if(rounds<3) need='陪练还要继续（已完成 '+rounds+' 轮，至少 3 轮）';
    else if(best<2) need='至少 2 轮答案里要有具体依据（数字/条款/口径）';
    else if(!bd) need='说清哪部分结论你不下、留给谁判断';
  }
  s=Math.max(0,Math.min(100,Math.round(s)));
  return {ok:!need && s>=60, score:s, detail:R, need:need};
}

/* ===================== 真实评分引擎（v3）：按「评分标准」逐项判，不看字数 =====================
   五个维度各占分：结构完整性 20 / 评分要点覆盖 24 / 有据可依 20 / 红线意识 18 / 可执行 18
   另有三条反灌水惩罚：照抄模板、重复注水、过短。每项都给出「差在哪、怎么改」。 */
const STOPWords=/^(我们|你们|他们|可以|应该|需要|必须|这个|那个|这些|那些|进行|通过|使用|如何|什么|以及|然后|如果|因为|所以|但是|一个|没有|就是|自己|对于|关于|并且|或者|可能|已经|还有|不会|只是|这样|那样|一下|一些|很多|非常|比较|目前|现在|未来|首先|其次|最后|综上|例如|比如|其中|内容|情况|方式|方法|结果|过程|目标|能力|系统|平台|团队|公司|部门|流程|场景|环节|部分|方面|相关|主要|重要|有效|直接|实际|基本|整体|具体|明确|完成|提供|实现|提升|优化|支持|管理|分析|设计|开发|评估|判断|说明|描述|列出|包含|基于|根据|结合|利用|帮助|确保|保证|满足|达到|避免|减少|增加|提高|降低|控制|监控|跟踪|反馈|沟通|协作|推进|落地|执行|实施|交付|上线|运营|维护|更新|调整|改进|完善|建立|构建|搭建|制定|编写|整理|汇总|输出|生成|展示|查看|选择|确认|审核|审批|验证|测试|检查|排查|处理|解决|应对|防范|预防|规避|工作|问题|方案|数据|用户|客户|产品|业务)$/;
function cjkTerms(s){
  const out=[]; const runs=(s||'').match(/[\u4e00-\u9fa5]{2,8}/g)||[];
  runs.forEach(function(w){
    for(let L=2;L<=4;L++){ for(let i=0;i+L<=w.length;i++){ const t=w.substr(i,L); if(!STOPWords.test(t)) out.push(t); } }
  });
  return Array.from(new Set(out));
}
/* 从本单元的 rubric / deliverable.rubric 取「评分标准」条目 */
function rubricItemsOf(u){
  let items=(u.rubric&&u.rubric.length)?u.rubric.slice():[];
  const d=u.deliverable;
  if(d&&d.rubric&&d.rubric.length) items=items.concat(d.rubric);
  if(!items.length) items=['结构完整','有据可依','红线意识','可执行'];
  return Array.from(new Set(items)).slice(0,6);
}
/* 量化数字：必须带单位/量纲，纯数字不算 */
function qualifiedNumbers(t){
  const re=/([0-9０-９]+(?:\.[0-9]+)?)\s*(%|％|个百分点|万|亿|千|元|笔|条|个|次|人|天|周|月|年|日|号|分钟|小时|版|条|款|份|轮|倍|Q[1-4]|季度)/g;
  const m=(t||'').match(re)||[]; return Array.from(new Set(m)).length;
}
function hasSource(t){ return /(来源|口径|取自|来自|依据|条款|原文|看板|报表|访谈|样本|问卷|系统导出|统计区间|数据范围)/.test(t||''); }
function hasRisk(t){ return /(风险|红线|合规|监管|泄露|出域|越权|隐私|敏感|误导|幻觉|偏差|失真|不可信|未授权|投诉|处罚)/.test(t||''); }
function hasMitigation(t){ return /(规避|脱敏|审批|授权|复核|留痕|兜底|备份|限定|不输出|人工确认|降级|回退|加密|去标识|最小化|权限收|双人)/.test(t||''); }
function hasOwner(t){ return /(责任人|负责人|owner|Owner|由[^，。；\n]{1,10}(负责|跟进|确认|拍板|决策)|牵头|归属|对接人)/.test(t||''); }
function hasTime(t){ return /([0-9]+\s*(天|周|月|日|个工作日|季度)|下周|本周|月底|季末|Q[1-4]|截止|deadline|排期|里程碑|上线时间|交付时间|T\+[0-9])/.test(t||''); }
function hasAcceptance(t){ return /(验收|验收标准|验收口径|判定标准|达标|通过标准|衡量指标|成功标准|OKR|KPI|指标口径)/.test(t||''); }
/* 反灌水：与模板重合度、句子重复率 */
function dupRatio(t){
  const lines=(t||'').split(/\n/).map(x=>x.trim()).filter(x=>x.length>=8);
  if(lines.length<2) return 0;
  const uniq=new Set(lines); return 1-uniq.size/lines.length;
}
function templateOverlap(t,tpl){
  if(!tpl) return 0;
  const A=new Set(cjkTerms(tpl)); if(!A.size) return 0;
  let hit=0; A.forEach(function(w){ if((t||'').indexOf(w)>=0) hit++; });
  return hit/A.size;
}
function sectionCount(t){
  return (t||'').split(/\n/).map(x=>x.trim())
    .filter(x=>x.length>=10 && /^([■□•\-*·]|[一二三四五六七八九十]+[、.）)]|[0-9]+[、.）)]|#{1,4}\s|\*\*)/.test(x)).length;
}
function scoreWorkText(u,t){
  t=(t||'').trim();
  const R=[]; let total=0;
  const tpl=sub(u.template||'');

  /* ① 结构完整性 20 */
  const secs=sectionCount(t);
  const tplSecs=Math.max(3, sectionCount(tpl));
  const secScore = secs>=tplSecs?20 : (secs>=Math.max(2,tplSecs-1)?14 : (secs>=2?9 : (secs>=1?4:0)));
  total+=secScore;
  R.push({k:'结构完整性',got:secScore,full:20,ok:secScore>=14,
    hint: secs>=tplSecs ? ('模板 '+tplSecs+' 个小节都已填写') : ('模板有 '+tplSecs+' 个小节，当前只识别出 '+secs+' 节，缺的部分要补')});

  /* ② 评分要点覆盖 24（逐条比对本单元 rubric） */
  const items=rubricItemsOf(u);
  let hitItems=0; const missNames=[];
  items.forEach(function(it){
    const terms=cjkTerms(it);
    const need=Math.min(3, Math.max(1, Math.ceil(terms.length*0.18)));
    let c=0; for(let i=0;i<terms.length && c<need;i++){ if(t.indexOf(terms[i])>=0) c++; }
    if(c>=need) hitItems++; else missNames.push(it.slice(0,14));
  });
  const covScore=Math.round(24*hitItems/items.length);
  total+=covScore;
  R.push({k:'评分要点覆盖（'+hitItems+'/'+items.length+'）',got:covScore,full:24,ok:hitItems>=Math.ceil(items.length*0.6),
    hint: hitItems>=items.length?('全部评分要点都有体现') : ('未体现：'+missNames.join('；'))});

  /* ③ 有据可依 20 */
  const qn=qualifiedNumbers(t), src=hasSource(t);
  const evScore = (qn>=2?20 : (qn===1?12 : (src?13:0)));
  total+=evScore;
  R.push({k:'有据可依',got:evScore,full:20,ok:evScore>=12,
    hint: qn>=2?('已给出 '+qn+' 处带单位的数据') : ('需要 ≥2 处「数字+单位」（如 通过率 62%、3 个工作日、样本 12000 笔），当前 '+qn+' 处')});

  /* ④ 红线意识 18：必须同时有风险 + 规避动作 */
  const rk=hasRisk(t), mt=hasMitigation(t);
  const riskScore = (rk&&mt)?18 : (rk||mt)?9 : 0;
  total+=riskScore;
  R.push({k:'红线意识',got:riskScore,full:18,ok:riskScore===18,
    hint: (rk&&mt)?('已指出风险并给出规避动作') : rk?('指出了风险，但没写规避动作（脱敏/审批/人工复核等）') : mt?('写了规避动作，但没说清风险点在哪') : ('需写明「风险点 + 规避动作」')});

  /* ⑤ 可执行 18 */
  const ow=hasOwner(t), tm=hasTime(t), ac=hasAcceptance(t);
  const actScore = (ow&&tm&&ac)?18 : ((ow&&tm)||(ow&&ac)||(tm&&ac))?12 : (ow||tm||ac)?6 : 0;
  total+=actScore;
  R.push({k:'可执行',got:actScore,full:18,ok:actScore>=12,
    hint: (ow&&tm&&ac)?('责任人/时间/验收标准齐全') : ('缺：'+[!ow?'责任人':null,!tm?'时间节点':null,!ac?'验收标准':null].filter(Boolean).join('、'))});

  /* ---- 反灌水惩罚 ---- */
  const pen=[];
  const ov=templateOverlap(t,tpl);
  if(ov>0.62 && t.length<900){ total-=25; pen.push('疑似直接照抄模板（重合度 '+Math.round(ov*100)+'%），请替换成你自己的内容'); }
  const dr=dupRatio(t);
  if(dr>0.3){ total-=15; pen.push('存在重复/注水段落（重复率 '+Math.round(dr*100)+'%）'); }
  if(t.length<120){ total=Math.min(total,35); pen.push('内容过短（'+t.length+' 字），未达到一份交付物的基本篇幅'); }
  total=Math.max(0,Math.min(100,Math.round(total)));

  const detail=R.map(function(x){ return {k:x.k+'　'+x.got+'/'+x.full+' 分', ok:x.ok, hint:x.hint}; });
  pen.forEach(function(p){ detail.push({k:'扣分项：'+p, ok:false, hint:''}); });

  const weak=R.filter(function(x){return !x.ok;}).sort(function(a,b){return (a.full-a.got)-(b.full-b.got);}).slice(0,3);
  let need='';
  if(total<60){
    need='得分 '+total+' 分，未达 60 分通关线。优先补强：'+weak.map(function(x){return x.k;}).join('、')
        +'。\n例如：'+weak[0].hint;
  }
  return {ok:total>=60, score:total, detail:detail, need:need, dims:R};
}

function previewScore(uid,elId){
  const el=document.getElementById(elId); if(!el) return;
  const r=computeUnit(uid);
  const det=r.detail.map(d=>'<li class="'+(d.ok?'ok':'')+'">'+esc(d.k)+(d.ok?'':' <span class="hint">（'+esc(d.hint||'')+'）</span>')+'</li>').join('');
  el.innerHTML='<div class="kv" style="margin-top:10px"><b>预估得分：'+r.score+' 分</b>'
   +'<div class="bar"><i style="width:'+r.score+'%"></i></div>'
   +'<ul class="rub">'+det+'</ul>'
   +(r.need?'<div style="font-size:12.6px;color:#be123c">还差：'+esc(r.need)+'</div>':'<div style="font-size:12.6px;color:#166534">已达通关线（60 分），可以结算。</div>')
   +'</div>';
}

function submitTask(uid){
  if(ADMIN){
    const st=prog.units[uid]||{};
    prog.units[uid]=Object.assign({},st,{taskDone:true,done:true,score:st.score||60,detail:[{k:'管理员预览模式：已标记完成',ok:true}],acts:st.acts||{}});
    saveProg(); refreshProg(); renderSidebar();
    advCheck(); return true;
  }
  const r=computeUnit(uid);
  if(!r.ok){
    alert('还不能结算：\n\n'+(r.need||'请先完成上方环节活动')+'\n\n当前预估 '+r.score+' 分，通关线 60 分。');
    return false;
  }
  const st=prog.units[uid]||{};
  const prev=st.score||0;
  prog.units[uid]=Object.assign({},st,{taskDone:true,done:true,score:Math.max(prev,r.score),detail:r.detail,acts:st.acts||{}});
  saveProg(); refreshProg(); renderSidebar();
  advCheck(); return true;
}

/* 收获笔记评分：不看字数，看是否具体、是否有下一步、是否分点 */
function scoreNoteText(t){
  t=(t||'').trim();
  const R=[]; let s=0;
  const concrete=/(我的|本部门|我们团队|手上|我负责|这个项目|这款产品|我们的客户|指标|流程|场景|客户群)/.test(t);
  const next=/(待查|不确定|还需要|下一步|打算|准备|去验证|去确认|再补|要问)/.test(t);
  const secs=(t.split(/\n/).filter(x=>x.trim().length>=6).length);
  const conclusion=/(结论|记住|学到|明白了|关键|要点|也就是说)/.test(t);
  s += concrete?15:0; s += next?15:0; s += secs>=2?10:(secs===1?5:0);
  R.push({k:'落到具体工作（提到你的场景/项目/指标）',ok:concrete,hint:'写清这件事能用在你的哪个具体项目或指标上'});
  R.push({k:'写出下一步或待确认项',ok:next,hint:'补一句「我还不确定/下一步要验证的是…」'});
  R.push({k:'分点写（≥2 行）',ok:secs>=2,hint:'按 1) 2) 3) 分点写'});
  if(t.length<40){ s=Math.min(s,10); R.push({k:'内容过短（'+t.length+' 字）',ok:false,hint:'至少写清一句结论 + 一句用法'}); }
  return {score:Math.min(40,s),detail:R};
}

async function sparChatSend(){

  /* 计入本单元进度：轮次 / 有据回答 / 责任边界 */
  let tr=(parseInt(actsOf(uid).cRounds||0,10)||0)+1;
  let bs=parseInt(actsOf(uid).best||0,10)||0;
  let bd=actsOf(uid).boundary?true:false;

  if(evid) bs++;

  const body=document.getElementById('spar-chat-body');

  if(body){ body.appendChild(typing); body.scrollTop=body.scrollHeight; }

  let reply=null, src='';
  if((typeof llmReady==='function')&&llmReady()){
    try{
      reply=await llmChat(SPAR_CHAT.msgs.slice(-13),{temperature:0.75,max_tokens:260});
      src='model';
    }catch(e){ reply=null; }
  }
  if(!reply){
    try{ reply=localSparReply(u,t,tr-1); }catch(e){ reply='（本地追问引擎不可用）你可以把问题复制到 WorkBuddy 里继续问。'; }
    src='local';
  }

function sparSystem(u){
  const m=u.spar||{};
  return '你是一场企业内训里的角色扮演评审，此刻扮演「'+sub(m.role||'评审')+'」。'
   +'你的立场：'+sub(m.persona||'只认依据与制度')+'。'
   +'学员刚完成《'+sub(u.deliverable||'本单元产出')+'》，你是来挑它的漏洞的。'
   +'\n硬性要求：'
   +'\n1) 每次只说一段话、只问一个问题，全文不超过 70 字，口语化，像现场评审，禁止使用列表、编号和标题。'
   +'\n2) 必须引用学员上一句话里的具体词汇或原话片段来追问，让他知道你真的听了。'
   +'\n3) 若学员给出了可追溯依据（具体数字、文件条款、口径、访谈编号），先用一句话认可那一处，再往更狠的一层追问：这个前提不成立怎么办、边界在哪、口径对得上吗。'
   +'\n4) 若学员只是表态、复述问题或说空话，直接点破，并要求他给出数据或条款。'
   +'\n5) 你一定会问到这些方向：'+(m.mustAsk||[]).map(x=>sub(x)).join('；')+'。'
   +'\n6) 不要编造不存在的制度条款，需要引用时用「贵行的数据分级办法」这类通称。'
   +'\n只输出你要说的那一句话，不要有任何前缀说明。';
}
function anchorOf(t){
  const s=t.replace(/\s+/g,'');
  const re=/《[^》]{1,10}》|第[0-9０-９]+条|[0-9１-９]+(?:\.[0-9]+)?%|[0-9０-９]+(个|条|项|份|处|类)|不下结论|边界|口径|看板|访谈|PII|脱敏|原文第/g;
  const m=s.match(re);
  if(m && m[0]){
    const i=s.indexOf(m[0]);
    return s.slice(Math.max(0,i), i+m[0].length+8).slice(0,18);
  }
  return s.slice(0,14);
}
function localSparReply(u,t,rounds){
  const role=sub(u.spar.role);
  const anchor=anchorOf(t);
  const hasNum=/[0-9０-９]/.test(t), hasEvid=EVID_RE.test(t), bd=BOUNDARY_RE.test(t);
  const arr=u.spar.mustAsk||[];
  const q=arr[rounds % Math.max(1,arr.length)] || '你的依据是什么？';
  if(!hasEvid){
    return '（'+role+'）你说「'+anchor+'\u2026」\u2014\u2014 我听到的是立场，不是依据。这条结论落在哪份文件、哪张看板、哪组数据上？说得出出处，我们才谈得下去。';
  }
  if(!hasNum){
    return '（'+role+'）「'+anchor+'\u2026」方向对了，但你给的是说法不是数。具体到多少、覆盖哪些产品、口径怎么定义的？';
  }
  if(!bd){
    return '（'+role+'）「'+anchor+'\u2026」这一处我暂时认。那我问下一层：如果这条依据本身不成立，你的结论要不要降级？哪部分你不敢下结论、要交给谁？';
  }
  return '（'+role+'）「'+anchor+'\u2026」有数、有出处、也划了边界，这条我认。最后再确认一件事：'+sub(q);
}
async function sendSpar(){
  if(sparBusy) return;
  const ta=document.getElementById('spar-text'); if(!ta) return;
  const t=ta.value.trim();
  if(!t){ alert('先写点内容再发送'); return; }
  const f=findUnit(prog.cur); if(!f||!f.u.spar) return;
  const u=f.u;
  addBubble('me',t); ta.value='';
  sparHist.push({role:'user',content:t});
  flow.tries++;
  const evid=EVID_RE.test(t) && (/[0-9０-９]/.test(t) || /条款|原文|口径|来源|访谈|看板/.test(t));
  if(evid) flow.best++;
  if(BOUNDARY_RE.test(t)) flow.boundary=true;
  setAct(prog.cur,'rounds',flow.tries);
  setAct(prog.cur,'best',flow.best);
  setAct(prog.cur,'boundary',flow.boundary?1:0);

  sparBusy=true; ta.disabled=true;
  const btnText='\u2026'; let reply=null, src='';
  if(llmReady()){
    try{
      const msgs=[{role:'system',content:sparSystem(u)}].concat(sparHist.slice(-12));
      reply=await llmChat(msgs,{temperature:0.75,max_tokens:220});
      src='model';
    }catch(e){ reply=null; }
  }
  if(!reply){ reply=localSparReply(u,t,flow.tries-1); src='local'; }
  sparBusy=false; ta.disabled=false; try{ ta.focus(); }catch(e){}
  addBubble('ai',reply);
  sparHist.push({role:'assistant',content:reply});

  const st=document.createElement('div'); st.className='kv';
  st.style.cssText='color:var(--mut);font-size:12.4px';
  st.textContent='第 '+flow.tries+' 轮 · 有据回答 '+flow.best+' 次 · '+(flow.boundary?'已划边界':'尚未提到边界')+' · '+(src==='model'?'由云端模型实时生成':'本地追问引擎（未接入模型）');
  const host=document.getElementById('spar-out');
  if(host){ host.innerHTML=''; host.appendChild(st); }

  const r=computeUnit(prog.cur);
  if(r.ok){
    setAct(prog.cur,'passed',1);
    addBubble('sys','\u2705 陪练通过：'+flow.tries+' 轮、'+flow.best+' 次给出依据'+(flow.boundary?'、已划清责任边界':'')+'。');
    finishUnit(prog.cur);
  } else if(flow.tries>=3){
    addBubble('sys','距离通关还差：'+r.need);
  }
}

function pickQ(i){
  const cur=QUIZ[qzState.mid][qzState.idx], n=qzState.idx;

  document.getElementById('op'+i).classList.add(i===cur.a?'right':'wrong');

function nextQ(){
  const qs=QUIZ[qzState.mid];

  const right=qzState.picked.filter((p,i)=>p===qs[i].a).length;
  const pct=Math.round(right/qs.length*100);

    +'<p>得分 <b style="color:var(--blue-d);font-size:20px">'+right+' / '+qs.length+'</b>（'+pct+'%）· 你已完成「'+qzState.mid+' '+mods[mi].title.slice(0,12)+'」的学习闭环。</p>'
    +'<div class="acts">'
    +(nextMid?'<button class="btn ok" onclick="closeQuiz();openUnit(\''+nextMid.units[0].id+'\')">进入 '+nextMid.id+' '+nextMid.title.slice(0,8)+' \u2192</button>'

  Object.keys(FB_CAT).forEach(function(k){ html+='<button class="lf-cat'+(FB.cats.indexOf(k)>=0?' on':'')+'" onclick="fbSetCat(\''+k+'\')">'+FB_CAT[k].i+' '+FB_CAT[k].n+'</button>'; });
  html+='</div>';
  html+='<div class="lf-label">③ 严重度</div><div class="lf-sev-row">';
  Object.keys(FB_SEV).forEach(function(k){ html+='<button class="lf-sev'+(FB.sev===k?' on':'')+'" onclick="fbSetSev(\''+k+'\')">'+FB_SEV[k]+'</button>'; });
  html+='</div>';
  html+='<div class="lf-label">④ 描述（bug 请说明：什么操作 / 看到了什么 / 期望怎样）</div>';
  html+='<textarea id="fb-text" class="score-ta" style="min-height:110px" placeholder="例如：播放 M3U2 视频后点「下一单元」没反应；或：希望加一个快捷键跳到下一单元…">'+esc(FB.text)+'</textarea>';
  html+='<div class="lf-media-row"><button onclick="document.getElementById(\'lf-img\').click()">🖼️ 上传截图</button><button onclick="document.getElementById(\'lf-audio\').click()">🎙️ 上传语音</button><button onclick="document.getElementById(\'lf-vid\').click()">🎬 上传录屏</button>'
      +'<input type="file" id="lf-img" accept="image/*" multiple hidden><input type="file" id="lf-audio" accept="audio/*" hidden><input type="file" id="lf-vid" accept="video/*" hidden></div>';
  html+='<div class="lf-drop" id="lf-drop">📋 可直接按 Ctrl/⌘+V 粘贴截图，或把图片拖到这里（支持多张）</div>';
  html+='<div class="lf-preview" id="lf-preview">'+fbPreviewHtml()+'</div>';
  html+='<div class="lf-label">⑤ 联系方式（选填，方便我们回访）</div>';
  html+='<input id="fb-contact" class="score-inp" style="width:100%" placeholder="微信 / 邮箱 / 电话，选填" value="'+esc(FB.contact)+'">';
  const pend=fbOutbox().length;
  html+='<div class="lf-foot"><button class="btn" onclick="submitFb()">提交反馈</button>'
      +(pend?'<button class="btn ghost" onclick="fbRetryAll()">🔄 补推待发送（'+pend+'）</button>':'')
      +'<button class="btn ghost" onclick="fbSelfTest()">🔧 云端自检</button><button class="btn ghost" onclick="fbExport()">导出我的反馈记录</button><button class="btn ghost" onclick="closeFb()">取消</button></div>';
  html+='<div class="lf-note">反馈已接入云端：提交后自动同步到管理员后台（刚哥可见），同时本机也留存一份、并复制可发送文本。无需重复提交。</div>';
  box.innerHTML=html;
  const img=document.getElementById('lf-img'); if(img) img.onchange=function(e){ fbAddFiles(e.target.files,'image'); img.value=''; };
  const au=document.getElementById('lf-audio'); if(au) au.onchange=function(e){ fbAddFile(e.target.files[0],'audio'); };
  const vid=document.getElementById('lf-vid'); if(vid) vid.onchange=function(e){ fbAddFile(e.target.files[0],'video'); };
  /* 粘贴截图：弹窗打开期间监听 paste */
  if(!window._fbPasteBound){
    window._fbPasteBound=true;
    document.addEventListener('paste', function(e){
      const modal=document.getElementById('lf-modal');
      if(!modal || !modal.classList.contains('on')) return;
      const it=(e.clipboardData&&e.clipboardData.items)||[];
      const pics=[];
      for(let i=0;i<it.length;i++){ if(it[i].type&&it[i].type.indexOf('image/')===0){ const f=it[i].getAsFile(); if(f) pics.push(f); } }
      if(pics.length){
        e.preventDefault();
        fbAddFiles(pics,'image');
        toast('已粘贴 '+pics.length+' 张截图');
      }
    });
  }
  /* 拖拽图片 */
  const dz=document.getElementById('lf-drop');
  if(dz){
    dz.onclick=function(){ document.getElementById('lf-img').click(); };
    dz.ondragover=function(e){ e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave=function(){ dz.classList.remove('over'); };
    dz.ondrop=function(e){
      e.preventDefault(); dz.classList.remove('over');
      const fs=(e.dataTransfer&&e.dataTransfer.files)||[];
      const pics=[]; for(let i=0;i<fs.length;i++){ if(fs[i].type.indexOf('image/')===0) pics.push(fs[i]); }
      if(pics.length){ fbAddFiles(pics,'image'); toast('已添加 '+pics.length+' 张截图'); }
    };
  }
}
function fbAddFiles(list,kind){
  if(!list||!list.length) return;
  const arr=Array.prototype.slice.call(list);
  let n=arr.length;
  arr.forEach(function(f){
    const r=new FileReader();
    r.onload=function(){
      const src=r.result;
      if(src.length>1500000){ FB.imgs.push({src:'',name:f.name,big:true}); toast('「'+f.name+'」较大，仅记录文件名，请单独发送原图'); }
      else FB.imgs.push({src:src,name:f.name});
      if(--n<=0) fbRenderInner();
    };
    r.readAsDataURL(f);
  });
}
function fbAddFile(file,kind){
  if(!file) return;
  if(kind==='image'){
    const r=new FileReader();
    r.onload=function(){
      const src=r.result;
      if(src.length>1500000){ toast('截图较大（>'+(src.length/1e6).toFixed(1)+'MB），本机记录仅存文件名，请单独发送原图'); FB.imgs.push({src:'',name:file.name,big:true}); }
      else FB.imgs.push({src:src,name:file.name});
      fbRenderInner();
    };
    r.readAsDataURL(file);
  } else {
    FB.media[kind]={name:file.name,size:file.size};
    fbRenderInner();
    toast('已附'+(kind==='audio'?'语音':'录屏')+'：'+file.name);
  }
}
function fbDelImg(i){ FB.imgs.splice(i,1); fbRenderInner(); }
function fbReport(){
  fbSaveEditor();
  let cats=FB.cats.slice();
  if(!cats.length) cats=[classifyFeedback(FB.text)];
  const typeName=FB_TYPE[FB.type]?FB_TYPE[FB.type].n:FB.type;
  const catNames=cats.map(function(c){return FB_CAT[c]?FB_CAT[c].i+' '+FB_CAT[c].n:c;}).join('、');
  const att=[];
  (FB.imgs||[]).forEach(function(im,i){ att.push('截图'+(i+1)+(im.big?'（'+im.name+'，请单独发送原图）':'（已附）')); });
  if(FB.media.audio) att.push('语音：'+FB.media.audio.name);
  if(FB.media.video) att.push('录屏：'+FB.media.video.name);
  const now=new Date();
  const pad=function(x){return (''+x).padStart(2,'0');};
  const ts=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  const L=[];
  L.push('【金融×PM 课程 · 用户反馈】');
  L.push('类型：'+typeName+'　|　分类：'+catNames+'　|　严重度：'+FB_SEV[FB.sev]);
  L.push('位置：'+FB_CTX);
  L.push('时间：'+ts);
  L.push('描述：');
  L.push((FB.text||'（未填写）').trim());
  if(att.length) L.push('附件：'+att.join('、'));
  if(FB.contact) L.push('联系方式：'+FB.contact);
  return L.join('\n');
}
function submitFb(){
  fbSaveEditor();
  if(!FB.text.trim() && !FB.imgs.length && !(FB.media.audio||FB.media.video)){ toast('请先填写描述或附上截图/录音'); return; }
  const report=fbReport();
  let cats=FB.cats.length?FB.cats:[classifyFeedback(FB.text)];
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem('aidax_auto_pm_feedback')||'[]'); }catch(e){ arr=[]; }
  const id='f_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const doc={
    id:id, ts:Date.now(), user:FB.contact||'课程学员', role:'learner',
    company:'金融PM课程', type:FB.type, sev:FB.sev, cat:cats[0], cats:cats,
    text:FB.text, images:FB.imgs, media:FB.media, ownerKey:finOwner(),
    page:'金融PM课程', industry:'金融', status:'new', ctx:FB_CTX, contact:FB.contact
  };
  arr.push({ts:doc.ts,type:doc.type,cats:cats,sev:doc.sev,text:doc.text,ctx:doc.ctx,attach:(FB.imgs.length+(FB.media.audio?1:0)+(FB.media.video?1:0)),contact:doc.contact});
  try{ localStorage.setItem('aidax_auto_pm_feedback', JSON.stringify(arr)); }catch(e){ toast('本机存储已满，但反馈已尝试同步云端'); }
  copyText(report);
  if(typeof window.supabase!=='undefined' && navigator.onLine!==false){
    fbEnqueue(doc);
    pushFeedbackToCloud(doc, function(ok,err){ showFbDone(ok, arr.length, report, err); });
  } else {
    fbEnqueue(doc);
    showFbDone(false, arr.length, report, '当前离线或 SDK 未加载');
  }
}
function showFbDone(ok,n,report,err){
  const box=document.getElementById('lf-box');
  const pending=fbOutbox().length;
  const msg = ok
    ? '<p style="font-size:13px;color:#2e7d4f;margin:6px 0 4px">✅ 已同步到管理员后台，刚哥会在「反馈」面板收到这条反馈。</p>'
    : '<p style="font-size:13px;color:var(--mut);margin:6px 0 4px">本机已保存（共 '+n+' 条）。已排队待补推（'+pending+' 条），联网后点「重试同步」即可送达；当前也已复制可发送文本。</p>'
      + (err?'<div class="lf-report" style="margin-top:6px;max-height:90px;color:#be123c">失败原因：'+esc(err)+'</div>':'');
  const extra = ok ? '' : '<button class="btn ghost" onclick="fbRetryAll()">🔄 重试同步</button><button class="btn ghost" onclick="fbSelfTest()">🔧 云端自检</button>';
  box.innerHTML='<div class="lf-head"><span style="font-size:20px">✅</span><h3>已记录</h3><button class="lf-close" onclick="closeFb()">×</button></div>'
    + msg
    +'<div class="lf-report">'+esc(report)+'</div>'
    +'<div class="lf-foot"><button class="btn" onclick="copyText(document.querySelector(\'.lf-report\').textContent)">再复制一次</button>'+extra+'<button class="btn ghost" onclick="fbExport()">导出全部记录</button><button class="btn ghost" onclick="closeFb()">关闭</button></div>';
  toast(ok?'反馈已提交到管理员后台':'已记录（待补推），可点「重试同步」');
}
function fbRetryAll(){
  const q=fbOutbox().length;
  if(!q){ toast('没有待补推的反馈'); return; }
  toast('正在补推 '+q+' 条…');
  fbFlushOutbox(function(ok,total){
    toast('补推完成：成功 '+ok+' / '+total+' 条');
    if(ok===total) showFbDone(true,total,'');
    else showFbDone(false,total,'', '仍有 '+(total-ok)+' 条未送达，可再试或复制文本发送');
  });
}
function fbExport(){
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem('aidax_auto_pm_feedback')||'[]'); }catch(e){ arr=[]; }
  if(!arr.length){ toast('本机还没有反馈记录'); return; }
  const blob=new Blob([JSON.stringify(arr,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='aidax_fin_feedback.json'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  toast('已导出 '+arr.length+' 条反馈记录');
}

/* ===================== 云端反馈同步 v2（推送到管理员后台 feedback 表） =====================
   v2 改动（修复「admin 后台收不到」）：
   ① 鉴权方式改为官方推荐写法：createClient(url, ANON_KEY, {global.headers.Authorization: Bearer <jwt>})
      —— anon key 仍作 apikey 头（网关放行），租户 JWT 走 Authorization（PostgREST 据此判 RLS）。
      旧写法把 JWT 当第二个参数传入，等于把 JWT 同时塞进 apikey 头，网关可能直接拒。
   ② 每一步的真实错误信息都落盘并可展示，便于定位（不再静默失败）。
   ③ 失败进 outbox，下次打开页面 / 点「重试」自动补推，不丢反馈。 */
window.AIDAX_CONFIG = window.AIDAX_CONFIG || { supabaseUrl:'https://nyqiwjwzbpnepamldqto.supabase.co', supabaseAnonKey:'sb_publishable_rnBBDPdiDI5vnc9IEaTP6g_1ZyxJjHI' };
function finOwner(){
  if(!window._finOwner){
    var g=localStorage.getItem('aidax_auto_pm_owner');
    if(!g){ g='finpm:'+(Date.now().toString(36)+Math.random().toString(36).slice(2,7)); localStorage.setItem('aidax_auto_pm_owner',g); }
    window._finOwner=g;
  }
  return window._finOwner;
}
var _finSb=null;
function finSb(){
  if(_finSb===null) return null;
  if(_finSb && typeof _finSb.from==='function') return _finSb;
  var cfg=window.AIDAX_CONFIG;
  if(!cfg||!cfg.supabaseUrl||typeof window.supabase==='undefined'){ _finSb=null; return null; }
  try{ _finSb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey); return _finSb; }
  catch(e){ _finSb=null; return null; }
}
var _finJwt=null;
function finJwt(){ return _finJwt || localStorage.getItem('aidax_auto_pm_jwt') || null; }
function finMintToken(cb){
  var cfg=window.AIDAX_CONFIG; if(!cfg){ cb&&cb(false); return; }
  fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/mint_token',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':cfg.supabaseAnonKey,'Authorization':'Bearer '+cfg.supabaseAnonKey},
    body:JSON.stringify({p_type:'guest',p_company:'金融PM课程',p_owner:finOwner()})
  }).then(function(r){
    return r.text().then(function(t){
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) return { __http:r.status, __raw:(t||'').slice(0,200) };
      return j;
    });
  }).then(function(j){
    if(j&&j.jwt){ _finJwt=j.jwt; localStorage.setItem('aidax_auto_pm_jwt',j.jwt); fbDiag('mint ok'); cb&&cb(true,''); }
    else {
      var m = (j&&j.error) ? j.error : ((j&&j.__raw) ? ('HTTP '+j.__http+' '+j.__raw) : '无返回');
      fbDiag('mint fail: '+m); cb&&cb(false,m);
    }
  }).catch(function(e){ fbDiag('mint 网络异常：'+(e.message||e)); cb&&cb(false,'网络异常：'+(e.message||e)); });
}
/* ---- 诊断日志：每一步的真实错误都记下来，可在反馈弹窗里查看/复制 ---- */
var FB_DIAG=[];
function fbDiag(s){
  FB_DIAG.push(new Date().toLocaleTimeString()+' '+s);
  if(FB_DIAG.length>12) FB_DIAG=FB_DIAG.slice(-12);
  try{ localStorage.setItem('aidax_auto_pm_fb_diag', FB_DIAG.join('\n')); }catch(e){}
}
function fbDiagText(){ try{ return localStorage.getItem('aidax_auto_pm_fb_diag')||'（暂无记录）'; }catch(e){ return '（无法读取）'; } }

/* ---- outbox：同步失败的反馈排队，下次自动补推 ---- */
var FB_OUTBOX_KEY='aidax_fin_fb_outbox';
function fbOutbox(){ try{ return JSON.parse(localStorage.getItem(FB_OUTBOX_KEY)||'[]'); }catch(e){ return []; } }
function fbOutboxSave(a){ try{ localStorage.setItem(FB_OUTBOX_KEY, JSON.stringify(a)); }catch(e){} }
function fbEnqueue(doc){ var a=fbOutbox(); if(a.some(function(x){return x.id===doc.id;})) return; a.push(doc); fbOutboxSave(a); }
function fbDequeue(id){ var a=fbOutbox().filter(function(x){return x.id!==id;}); fbOutboxSave(a); }

function finClient(jwt){
  var cfg=window.AIDAX_CONFIG;
  if(typeof window.supabase==='undefined'||!window.supabase.createClient){ throw new Error('supabase SDK 未加载'); }
  return window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
    global: { headers: { Authorization: 'Bearer '+jwt } },
    auth: { persistSession:false, autoRefreshToken:false }
  });
}
function pushFeedbackToCloud(doc,cb){
  finMintToken(function(ok,err){
    if(!ok){ fbDiag('签发令牌失败：'+(err||'未知')); cb&&cb(false, '签发令牌失败：'+(err||'未知')); return; }
    var c;
    try{ c=finClient(finJwt()); }
    catch(e){ fbDiag('建连失败：'+e.message); cb&&cb(false,'建连失败：'+e.message); return; }
    c.from('feedback').insert({ id:doc.id, doc:doc, updated_at:new Date().toISOString() })
      .then(function(res){
        if(res.error){
          var m=res.error.message||JSON.stringify(res.error);
          fbDiag('写入失败：'+m); cb&&cb(false,'写入失败：'+m); return;
        }
        fbDiag('写入成功 id='+doc.id); fbDequeue(doc.id); cb&&cb(true,'');
      })
      .catch(function(e){ var m=(e&&e.message)||String(e); fbDiag('写入异常：'+m); cb&&cb(false,'写入异常：'+m); });
  });
}
/* 补推队列里所有未送达的反馈 */
function fbFlushOutbox(done){
  var q=fbOutbox();
  if(!q.length){ done&&done(0,0); return; }
  if(typeof window.supabase==='undefined'){ done&&done(0,q.length); return; }
  var ok=0, left=q.length;
  q.forEach(function(doc){
    pushFeedbackToCloud(doc,function(s){
      if(s) ok++;
      if(--left<=0) done&&done(ok,q.length);
    });
  });
}
/* 手动诊断：串起 mint → 建连 → 读表，把真实结果展示出来 */
function fbSelfTest(){
  var out=document.getElementById('lf-box');
  out.innerHTML='<div class="lf-head"><span style="font-size:20px">🔧</span><h3>云端连通性自检</h3><button class="lf-close" onclick="closeFb()">×</button></div>'
    +'<div id="selftest-out" class="lf-report" style="min-height:120px">正在检测…</div>'
    +'<div class="lf-foot"><button class="btn" onclick="copyText(document.getElementById(\'selftest-out\').textContent)">复制结果</button><button class="btn ghost" onclick="openFb()">返回反馈</button></div>';
  var o=document.getElementById('selftest-out'); var L=[];
  function p(s){ L.push(s); o.textContent=L.join('\n'); }
  var cfg=window.AIDAX_CONFIG;
  p('① SDK：'+(typeof window.supabase!=='undefined' && window.supabase.createClient ? '已加载 ✅' : '未加载 ❌（vendor/supabase-js.umd.js 未生效）'));
  p('② 配置：'+(cfg&&cfg.supabaseUrl?cfg.supabaseUrl:'缺失'));
  FB_DIAG=[];
  finMintToken(function(ok,err){
    p('③ 签发令牌：'+(ok?'成功 ✅':'失败 ❌ '+(err||'')));
    if(!ok){ p('\n诊断日志：\n'+fbDiagText()); return; }
    try{
      var c=finClient(finJwt());
      p('④ 建连：成功 ✅');
      c.from('feedback').select('id').limit(1).then(function(res){
        p('⑤ 读表：'+(res.error?('失败 ❌ '+res.error.message):'成功 ✅（RLS 放行）'));
        p('\n诊断日志：\n'+fbDiagText());
      }).catch(function(e){ p('⑤ 读表异常：'+(e.message||e)); p('\n诊断日志：\n'+fbDiagText()); });
    }catch(e){ p('④ 建连失败：'+e.message); p('\n诊断日志：\n'+fbDiagText()); }
  });
}

/* ===================== 启动（问题 8：回到上次所在的单元与模块） ===================== */
['cfg-industry','cfg-company','cfg-product'].forEach(id=>{
  const k=id.slice(4); document.getElementById(id).value=CUSTOM[k];

applyAdminUI(); renderSidebar(); refreshProg();

openUnit(_start);
paintLlm();
llmProbe(true);
/* 启动时补推上次未送达的反馈 */
setTimeout(function(){ fbFlushOutbox(function(ok,total){ if(total&&ok<total) fbDiag('启动补推：'+ok+'/'+total); }); }, 1500);
</script>
