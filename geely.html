<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b4f8a'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' fill='%23fff' text-anchor='middle'%3E用%3C/text%3E%3C/svg%3E">
<title>吉利汽车 · 用户思维线上课程</title>
<style>
:root{
  --pri:#1b4f8a; --deep:#10243d; --ink:#1a1a1a; --mid:#3d4c5c; --muted:#5c6670;
  --soft:#8b96a3; --line:#dfe5ec; --bg:#f4f7fb; --white:#fff;
  --tint:#eef4fb; --tint2:#f8fafd; --accent:#c8102e; --ok:#0f7b5f; --warn:#b26a00;
  --r:10px; --sh:0 1px 2px rgba(16,36,61,.06),0 4px 16px rgba(16,36,61,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,select{font-family:inherit;font-size:inherit}
a{color:var(--pri);text-decoration:none}
.hide{display:none!important}

/* ---------- 登录 ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,#0d2238 0%,#17395f 55%,#1b4f8a 100%)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.login-brand .bar{width:4px;height:34px;background:var(--pri);border-radius:2px}
.login-brand h1{font-size:19px;font-weight:600;letter-spacing:.01em}
.login-brand p{font-size:12px;color:var(--soft);margin-top:2px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mid);margin-bottom:6px;font-weight:500}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 13px;background:#fbfcfe;transition:.15s}
.field input:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(27,79,138,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;
  border-radius:8px;background:var(--pri);color:#fff;font-weight:500;transition:.15s;width:100%}
.btn:hover{background:#173f6e}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.line{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.line:hover{background:var(--tint)}
.btn.sm{height:34px;padding:0 13px;font-size:13px;width:auto;border-radius:7px}
.btn.gray{background:#eef1f5;color:var(--mid)}
.btn.danger{background:#fdecee;color:var(--accent)}
.login-err{background:#fdecee;color:var(--accent);font-size:13px;padding:9px 12px;border-radius:7px;margin-bottom:12px}
.login-tip{font-size:12px;color:var(--soft);text-align:center;margin-top:16px;line-height:1.7}

/* ---------- 通用外壳 ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:0;z-index:50;height:56px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px}
.topbar .brand{font-weight:600;font-size:15px;color:var(--deep);white-space:nowrap}
.topbar .brand span{color:var(--soft);font-weight:400;font-size:12.5px;margin-left:8px}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mid)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--pri);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.crumb{font-size:13px;color:var(--soft);margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb button{color:var(--pri);font-size:13px}
.crumb button:hover{text-decoration:underline}

/* ---------- 课程卡 ---------- */
.hero{background:linear-gradient(120deg,#10243d,#1b4f8a);border-radius:14px;padding:26px 28px;color:#fff;margin-bottom:22px}
.hero h2{font-size:22px;font-weight:600;margin-bottom:8px}
.hero p{font-size:13.5px;color:#c5d6e8;line-height:1.75;max-width:760px}
.hero .meta{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;font-size:12.5px;color:#a8c2dc}
.hero .meta b{color:#fff;font-weight:600}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.mod-card{background:#fff;border-radius:14px;padding:22px;box-shadow:var(--sh);border:1px solid #edf1f6;
  display:flex;flex-direction:column;transition:.18s}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(16,36,61,.1)}
.mod-card .no{font-size:11.5px;font-weight:600;color:var(--pri);letter-spacing:.1em;margin-bottom:8px}
.mod-card h3{font-size:18px;font-weight:600;color:var(--deep);margin-bottom:8px}
.mod-card .desc{font-size:13px;color:var(--mid);line-height:1.72;flex:1}
.mod-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--pri)}
.tag.gray{background:#f0f2f5;color:var(--muted)}
.prog-wrap{margin:14px 0 6px}
.prog-bar{height:6px;background:#e9eef4;border-radius:3px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#1b4f8a,#3f7fc4);border-radius:3px;transition:width .4s}
.prog-txt{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px}
.mod-actions{display:flex;gap:10px;margin-top:14px}
.mod-actions .btn{flex:1}

/* ---------- 学习页 ---------- */
.learn{display:grid;grid-template-columns:246px 1fr;gap:22px;align-items:start}
.sidelist{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;position:sticky;top:74px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.sidelist .hd{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--deep);display:flex;justify-content:space-between;align-items:center}
.sidelist .hd small{font-weight:400;color:var(--soft);font-size:11.5px}
.sidelist .list{overflow-y:auto;flex:1;padding:6px}
.sitem{display:flex;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;align-items:flex-start;transition:.13s}
.sitem:hover{background:var(--tint2)}
.sitem.on{background:var(--tint)}
.sitem .sn{width:20px;height:20px;border-radius:50%;background:#e9eef4;color:var(--soft);font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:0 0 20px;margin-top:2px;font-weight:600}
.sitem.done .sn{background:#e3f3ec;color:var(--ok)}
.sitem.on .sn{background:var(--pri);color:#fff}
.sitem .st{font-size:12.5px;line-height:1.5;color:var(--mid)}
.sitem.on .st{color:var(--deep);font-weight:500}
.sitem .sm{font-size:11px;color:var(--soft);margin-top:2px}

.panel{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;min-height:520px;display:flex;flex-direction:column}
.panel .ph{padding:22px 28px 16px;border-bottom:1px solid #f0f3f7}
.panel .ph .k{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.06em;margin-bottom:8px}
.panel .ph h2{font-size:21px;line-height:1.45;font-weight:600;color:var(--deep)}
.panel .pb{padding:24px 28px;flex:1}
.panel .pf{padding:14px 28px;border-top:1px solid #f0f3f7;display:flex;align-items:center;gap:12px;background:#fbfcfe}
.panel .pf .spacer{flex:1}
.pg-ind{font-size:12.5px;color:var(--soft)}

/* 内容页版式 */
.hook{background:var(--tint);border-left:4px solid var(--pri);border-radius:0 8px 8px 0;padding:16px 20px;margin-bottom:22px}
.hook .lab{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.hook p{font-size:15.5px;color:var(--deep);font-weight:500;line-height:1.6}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.goal{border-top:2px solid var(--line);padding-top:10px}
.goal .gno{font-size:11px;color:var(--pri);font-weight:700;margin-bottom:5px}
.goal p{font-size:13.5px;color:var(--mid);line-height:1.65}

.cpage h3{font-size:19px;font-weight:600;color:var(--deep);line-height:1.5;margin-bottom:8px}
.cpage .lead{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f0f3f7}
.mcards{display:grid;gap:12px}
.mcards.c2{grid-template-columns:1fr 1fr}
.mcards.c3{grid-template-columns:repeat(3,1fr)}
.mcards.c4{grid-template-columns:repeat(2,1fr)}
.mcard{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:#fff;position:relative;overflow:hidden}
.mcard:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--pri)}
.mcard .n{font-size:11px;color:#b9c6d4;font-weight:700;letter-spacing:.06em;margin-bottom:7px}
.mcard h4{font-size:14.5px;font-weight:600;color:var(--pri);margin-bottom:8px;line-height:1.45}
.mcard p{font-size:13px;color:var(--muted);line-height:1.72}

.steps{display:flex;flex-direction:column;gap:9px}
.mstep{display:flex;gap:14px;border:1px solid var(--line);border-radius:9px;padding:13px 16px;background:#fff;align-items:flex-start}
.mstep .sn{font-size:13px;font-weight:700;color:var(--pri);flex:0 0 26px;padding-top:1px}
.mstep .sc h4{font-size:14px;font-weight:600;color:var(--deep);margin-bottom:4px}
.mstep .sc p{font-size:12.8px;color:var(--muted);line-height:1.65}

.mtable{width:100%;border-collapse:collapse;font-size:12.8px}
.mtable th{background:var(--pri);color:#fff;padding:9px 11px;text-align:left;font-weight:500;font-size:12.5px}
.mtable th:first-child{border-radius:7px 0 0 0}
.mtable th:last-child{border-radius:0 7px 0 0}
.mtable td{border-bottom:1px solid #eef1f5;padding:10px 11px;color:var(--muted);line-height:1.6;vertical-align:top}
.mtable tr:nth-child(even) td{background:#fafbfd}
.mtable td:first-child{color:var(--deep);font-weight:500}

.bands{display:flex;flex-direction:column;gap:9px}
.band{border-radius:9px;padding:14px 18px;display:flex;gap:16px;align-items:flex-start;border:1px solid}
.band .bn{font-size:13px;font-weight:700;flex:0 0 64px;padding-top:1px}
.band p{font-size:13px;line-height:1.68;color:var(--mid)}

.mcompare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ccol{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ccol .ch{padding:11px 16px;font-size:13.5px;font-weight:600;color:#fff}
.ccol.good .ch{background:var(--pri)}
.ccol.bad .ch{background:#6b7785}
.ccol ul{list-style:none;padding:12px 16px}
.ccol li{position:relative;padding-left:16px;font-size:12.8px;color:var(--mid);line-height:1.65;margin-bottom:9px}
.ccol li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--pri)}

.note{background:#fbfaf6;border:1px solid #efe9d9;border-radius:9px;padding:15px 18px;margin-top:16px}
.note .nl{font-size:11.5px;font-weight:600;color:#8a6d2f;letter-spacing:.05em;margin-bottom:7px}
.note p{font-size:13px;color:#5c5340;line-height:1.75;white-space:pre-wrap}

.case{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff}
.case .cd{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.05em}
.case h3{font-size:19px;font-weight:600;color:var(--deep);margin:8px 0 16px;line-height:1.45}
.case .cs{font-size:13.5px;color:var(--mid);line-height:1.8;white-space:pre-wrap}
.case .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.case .stat{background:var(--tint2);border:1px solid var(--line);border-radius:9px;padding:12px}
.case .stat b{display:block;font-size:20px;color:var(--pri);font-weight:600;line-height:1.2}
.case .stat span{font-size:11.5px;color:var(--soft);display:block;margin-top:4px}
.case .flip{background:var(--tint);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin-top:16px}
.case .flip .fl{font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px}
.case .flip p{font-size:13px;color:var(--mid);line-height:1.72}
.case .wrong{font-size:12.5px;color:var(--soft);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.case .wrong b{color:var(--muted);font-weight:500}

/* 答题 */
.qbox{background:#fbfcfe;border:1px solid #e6ecf3;border-radius:12px;padding:22px}
.qbox .qh{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.05em;margin-bottom:12px}
.qbox .qt{font-size:15.5px;color:var(--deep);font-weight:500;line-height:1.65;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff;
  cursor:pointer;transition:.13s;align-items:flex-start}
.opt:hover{border-color:#b9cde3;background:#fbfdff}
.opt .ol{width:24px;height:24px;border-radius:6px;background:var(--tint);color:var(--pri);font-size:12px;
  font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.opt .ot{font-size:13.5px;line-height:1.6;color:var(--ink);padding-top:1px}
.opt.sel{border-color:var(--pri);background:var(--tint)}
.opt.sel .ol{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:#eefaf5}
.opt.right .ol{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--accent);background:#fdeef0}
.opt.wrong .ol{background:var(--accent);color:#fff}
.opt.lock{cursor:default}
.explain{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 17px}
.explain .el{font-size:11.5px;font-weight:600;color:var(--ok);margin-bottom:6px}
.explain p{font-size:13px;color:var(--mid);line-height:1.72}
.explain.bad .el{color:var(--accent)}

/* 成绩单 */
.score-hero{text-align:center;padding:34px 20px;background:linear-gradient(130deg,#10243d,#1b4f8a);border-radius:14px;color:#fff;margin-bottom:20px}
.score-hero .big{font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em}
.score-hero .big small{font-size:18px;font-weight:400;color:#a8c2dc}
.score-hero .lbl{font-size:13px;color:#c5d6e8;margin-top:10px}
.score-hero.pass{background:linear-gradient(130deg,#0b4a3a,#0f7b5f)}
.score-hero.fail{background:linear-gradient(130deg,#5a1520,#a3283c)}
.qreview{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.qr{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:#fff}
.qr .qrt{font-size:13.5px;color:var(--deep);line-height:1.6;margin-bottom:8px;font-weight:500}
.qr .qra{font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
.qr .qra span.ok{color:var(--ok)}
.qr .qra span.no{color:var(--accent)}

/* ---------- 管理端 ---------- */
.mtabs{display:flex;gap:4px;background:#fff;border-radius:10px;padding:5px;border:1px solid #edf1f6;margin-bottom:20px;overflow-x:auto}
.mtab{padding:9px 16px;border-radius:7px;font-size:13.5px;color:var(--mid);white-space:nowrap;transition:.13s}
.mtab:hover{background:var(--tint2)}
.mtab.on{background:var(--pri);color:#fff;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:18px;border:1px solid #edf1f6}
.kpi .kl{font-size:12px;color:var(--soft);margin-bottom:8px}
.kpi .kv{font-size:26px;font-weight:600;color:var(--deep);line-height:1.1}
.kpi .kv small{font-size:13px;font-weight:400;color:var(--soft)}
.kpi .ks{font-size:11.5px;color:var(--soft);margin-top:6px}
.card{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;margin-bottom:18px}
.card .ch2{padding:15px 20px;border-bottom:1px solid #f0f3f7;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card .ch2 h3{font-size:15px;font-weight:600;color:var(--deep)}
.card .ch2 .spacer{flex:1}
.card .cb{padding:18px 20px}
.card .cb.p0{padding:0}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:#f7f9fc;padding:11px 14px;text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:11px 14px;border-bottom:1px solid #f3f6f9;color:var(--mid);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:#fbfcfe}
.dt .nm{color:var(--deep);font-weight:500}
.rank{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;background:#f0f3f7;color:var(--muted)}
.rank.r1{background:#fdf3d7;color:#8a6d12}
.rank.r2{background:#eef0f4;color:#5c6670}
.rank.r3{background:#f7ece3;color:#8a5a33}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--tint);color:var(--pri)}
.pill.ok{background:#e6f6ef;color:var(--ok)}
.pill.no{background:#fdeef0;color:var(--accent)}
.pill.warn{background:#fdf4e3;color:var(--warn)}
.pill.gray{background:#f0f2f5;color:var(--muted)}
.bar-mini{height:5px;background:#eef1f5;border-radius:3px;overflow:hidden;min-width:60px}
.bar-mini i{display:block;height:100%;background:var(--pri);border-radius:3px}
.empty{text-align:center;padding:44px 20px;color:var(--soft);font-size:13.5px;line-height:1.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.inp{height:38px;border:1px solid var(--line);border-radius:7px;padding:0 11px;background:#fff;font-size:13.5px;width:100%}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px rgba(27,79,138,.1)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form-grid .fi label{display:block;font-size:12px;color:var(--mid);margin-bottom:5px}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(16,36,61,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.dlg{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.dlg .dh{padding:20px 24px 14px;border-bottom:1px solid #f0f3f7}
.dlg .dh h3{font-size:17px;font-weight:600;color:var(--deep)}
.dlg .dh p{font-size:12.5px;color:var(--soft);margin-top:5px}
.dlg .db{padding:20px 24px}
.dlg .df{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end}
.dlg .df .btn{width:auto;min-width:88px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(16,36,61,.94);color:#fff;
  padding:11px 20px;border-radius:9px;font-size:13.5px;z-index:400;box-shadow:0 8px 26px rgba(0,0,0,.24);
  opacity:0;transition:.24s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;bottom:40px}

@media (max-width:860px){
  .learn{grid-template-columns:1fr}
  .sidelist{position:static;max-height:none;margin-bottom:12px}
  .sidelist .hd{cursor:pointer}
  .sidelist .list{max-height:0;overflow:hidden;transition:max-height .22s ease}

<script>
window.__COURSE__={"course":"geely-user-thinking","modules":[{"no":1,"key":"m1","name":"用户思维总纲","min":60,"ability":"场景还原能力（主） / 需求挖掘与识别（辅）","ability_short":"场景还原","output":"场景还原五问卡","intro":"把「用户思维」从态度问题重新定义成判断顺序问题，并交付全课唯一一把通用尺子——场景还原五问。","points":["三种伪用户思维，以及判断顺序的三步","B 端四层用户与诉求互斥时的判据","从「用户满意」到「组织绩效改善」的翻译"],"wrap":["判断顺序错了，努力就是成本","四层用户先分清谁承担后果","内部系统的价值必须能翻译成组织指标"],"sections":[{"n":1,"m":3,"t":"用户思维不是「态度好」，而是一套可验证的判断顺序","hook":"为什么加了 12 个字段，一线还是不用？","goals":["三种伪用户思维长什么样","判断顺序：先场景、再问题、后功能","顺序错了，代价落在谁身上"],"pages":[{"L":"cards","T":"三种伪用户思维，共同点是「没有判断顺序」","K":"态度好、调研勤、听领导——三件事都做了，问题还是没解决","D":[["态度好，但判断错","把「用户满意」当成目标，把功能多当成诚意。系统越做越重，一线越用越绕。"],["调研走过场","问卷发了、访谈做了，结论是「希望更好用」。没有一句能落到设计决策上。"],["把领导当用户","按汇报口径设计系统，上线后发现天天用它的是一线专员。"]]}],"q":{"q":"某事业部提出「考勤系统补卡流程太麻烦」。以下哪个动作最接近「有判断顺序」的做法？","o":["直接评估把三步改成一步需要多少开发量","先问上个月补了几次卡、当时人在哪、为什么没打上","发一份满意度问卷，看大家打几分","参考同业系统，看别人做成几步"],"a":1,"why":"先还原场景（谁、在什么条件下、为完成什么），再定义问题，最后才谈功能。A 是先给方案，C 拿不到场景，D 是抄答案。"}},{"n":2,"m":5,"t":"数字化转型中三类典型错位","hook":"流程搬上线，为什么一线反而更慢了？","goals":["把流程线上化当成体验","把报表当成决策支持","把使用率当成满意度"],"pages":[{"L":"cards","T":"三类错位，都是把「做了什么」当成了「改善了没有」","K":"上线不等于改善；下发数据不等于支持决策；有人用不等于有人满意","D":[["流程线上化 ≠ 体验","纸质表单原样搬进系统，只是不再手写。字段一个没少、审批一环没减，唯一变化是打字代替写字。"],["报表 ≠ 决策支持","给出一堆数，不给结论。看的人还要自己算一遍，于是继续用 Excel——绕行从这里开始。"],["使用率 ≠ 满意度","被制度强制使用的系统，使用率天然高。它反映流程强制力，不反映体验。"]]}],"q":{"q":"某内部系统月活 96%，管理层据此认为体验良好。以下哪个证据最能推翻这个结论？","o":["用户日均登录 3.2 次","用户把系统数据导出后，在 Excel 里完成核心分析","页面平均加载 1.8 秒","客服工单月均 40 单"],"a":1,"why":"96% 是被制度推上去的。导出到 Excel 完成核心动作，说明系统只承担了「留痕」，真正的决策动作仍在系统外——这就是绕行。"}},{"n":3,"m":10,"t":"场景还原五问：谁在用、在什么条件下、为完成什么、现在怎么绕过、不做会怎样","hook":"五问填完，为什么能直接否掉三成需求？","goals":["五问的提问顺序与每问要拿的证据","「现在怎么绕过」为什么最值钱","怎么用五问当场否需求"],"pages":[{"L":"steps","T":"场景还原五问：顺序不能反","K":"每一问都要拿到可指认的证据，拿不到就是没还原","D":[["谁在用","岗位、职级、是否外包、是否兼职。不是「财务人员」，是「某基地一位费用审核员」。"],["在什么条件下","时间压力、设备、场地、是否被打断。同一个人在不同条件下是完全不同的用户。"],["为完成什么","他要交付的那个动作，不是系统里的功能名。例如「月结前把这张单子核完」。"],["现在怎么绕过","Excel、微信、纸质、私人台账、口头代填。绕行路径暴露真实约束。"],["不做会怎样","后果、承担者、时限。用来判断紧迫性，也用来判断该不该由系统解决。"]],"note":["为什么「绕过」这一问最值钱","因为它是唯一不依赖用户表态的证据。用户嘴上会说「挺好的」，但手会诚实地打开 Excel。\n\n绕行的五种形态：Excel 台账、微信群转发、纸质签批、私人表格、口头代填。每发现一种，就找到一处系统没覆盖的断点。"]},{"L":"table","T":"五问的输出：一张能拿去开会的卡","K":"填不满的那三行，说明需求还没到能评审的程度","w":[2.2,4.4,3.0],"D":{"h":["问","要拿到的证据","填不出来意味着"],"r":[["谁在用","岗位、职级、人数，以及是否外包或兼职","你还没找到真正的使用者"],["什么条件下","一次完整观察或一次跟班记录","你只在会议室里理解用户"],["为完成什么","他交付的动作，以及这件事的截止时间","你在按功能清单设计"],["怎么绕过","具体的文件名、群名、台账名","你还没看到真实约束"],["不做会怎样","后果、承担者、时限","优先级只能靠谁声音大"]]}}],"q":{"q":"复盘一个审批系统时，五问里哪一问最能暴露「设计假设错误」？","o":["谁在用","在什么条件下","现在怎么绕过","不做会怎样"],"a":2,"why":"绕行路径是用户用行为投票的结果，它直接显示「系统没覆盖的那一段」，通常就是假设错的地方。其余三问指向范围与优先级。"}},{"n":4,"m":10,"t":"B 端产品的用户：使用者、管理者、决策者、监管者四层","hook":"一个字段加不加，四个角色四种答案，听谁的？","goals":["四层各自看什么、要什么","三种典型互斥结构与唯一判据","影响者为什么不在四层却能否决"],"pages":[{"L":"bands","T":"四层用户：诉求不同，语言也不同","K":"同一套系统，四个人说的「好用」根本不是一件事","D":[["使用者","看动作与频次：一天点几次、每次几步、会不会被打断。他要的是快。"],["管理者","看指标与考核：人均单量、差错率、周期。他要的是稳、可算。"],["决策者","看投入产出：这笔钱换来什么、能不能对外讲。他要的是值。"],["监管者","看留痕与合规：三年后能不能追溯、有没有依据。他要的是可查。"]]},{"L":"cards","T":"三种互斥结构，判据只有一个：谁承担后果","K":"不按级别排，不按人数排，按后果归属排","D":[["快 vs 稳","一线要少填，审核要留痕。字段越多审核越省事、一线越费时。判据：出错时谁去解释、谁被追责。"],["细 vs 简","管理层要维度，执行层要步数。判据：这个维度有没有人真的拿去做决定。"],["留痕 vs 效率","合规要审批链，业务要当天办完。判据：这条链是制度要求，还是历史遗留。"]]}],"q":{"q":"费控系统拟新增 6 个成本维度字段。一线报销人反对，财务审核员支持。判断依据应是：","o":["报销人人数多，按人数决定","审核员是需求提出方，按提出方决定","出错时由谁承担解释与追责责任","上报分管领导裁决"],"a":2,"why":"四层互斥时的判据是「谁承担后果」。若退单与稽查责任落在审核员，字段就有必要；但必须同时压缩填报代价（预填、默认值）。按人数或按提出方都会系统性伤害一方。"}},{"n":5,"m":10,"t":"B 端价值判据：从「用户满意」走到「组织绩效改善」","hook":"「更好用」这三个字，怎么翻译成领导听得懂的话？","goals":["三个价值锚点：少一个人 / 少一次返工 / 少一天关账","把「更好用」翻译成组织指标的四个动作","翻不出来的需求该排第几"],"pages":[{"L":"cards","T":"内部系统的价值，只有三个锚点","K":"用户满意是过程指标，组织绩效才是结果指标","D":[["少一个人","原来 3 个人干的活，2 个人能干。等价于编制与人力成本，是最容易被管理层听懂的语言。"],["少一次返工","退单、重填、二次核对。可直接折算工时与人日，也最容易验证。"],["少一天关账","周期缩短影响的是资金效率与管理节奏，比工时更值钱，但需要跨部门数据才能算。"]]},{"L":"steps","T":"把「更好用」翻译成组织指标的四个动作","K":"翻不出来的需求，通常不是第一优先级","D":[["找到那个动作","用户说的「麻烦」，对应哪一个具体动作：填、核、催、查、等。"],["数清它的频次","一天几次、一月几次、涉及几个人。频次决定价值量级。"],["折算成时间","单次耗时 × 频次 × 人数 = 月工时，再折算人日。"],["挂到组织指标上","工时→人均单量；周期→关账天数；差错→退单率。挂不上就降级。"]],"note":["一个换算示例","「报销单均填报 41 分钟」，2,400 人月均 1.4 单，就是每月 2,296 小时 ≈ 13 人日。\n\n省一半即 6.5 人日/月，一年 78 人日。这个数比「提升体验」有说服力得多，也更容易进预算评审。"]}],"q":{"q":"以下四条需求，哪一条最容易被直接判为「非第一优先级」？","o":["单据预填，减少 30% 填报时间","审批超时自动提醒，平均缩短 1.2 天","界面配色改为品牌蓝，提升一致性","三单自动匹配，减少人工核对 2 人日/月"],"a":2,"why":"配色无法翻译成「少一个人 / 少一次返工 / 少一天关账」中的任何一项。它未必不做，但不能与前三者争同一批资源。"}},{"n":6,"m":10,"t":"行业数字化产品全景与用户地图","hook":"六类系统，用户的「使用动机」根本不是一回事","goals":["六类系统的用户结构差异","职能域的三个特征：用户即同事","你负责的系统属于哪一类"],"pages":[{"L":"table","T":"六类系统，用户结构完全不同","K":"照搬另一类的做法，方法论就会失焦","w":[2.0,2.6,2.2,2.6],"D":{"h":["系统类别","主要用户","动机来源","体验关键"],"r":[["集团协同办公","全体员工","被要求使用","流程不绕、状态可见"],["供应链与采购","采购执行、需求方、供应商","业务必须完成","状态透明、时效"],["制造与质量","班组长、质检、工艺","生产节拍驱动","少录入、能离线"],["经销商与售后","门店顾问、服务经理","考核与返利","算得清、少返工"],["车主 App 与车机","车主","自愿使用","快、准、有惊喜"],["职能数字化（本期）","人力、财务、采购的同事","制度要求 + 自身省事","一次填对、状态可查"]]}},{"L":"cards","T":"职能域的三个特征，决定了方法要改哪里","K":"用户即同事、需求即管理动作、系统即制度载体","D":[["用户即同事","你明天还要跟他开会。所以不能「调研完就下结论」，方案要能当场被质疑、当场解释。"],["需求即管理动作","需求背后往往是一条管理制度。改系统等于改制度，光靠产品经理推不动，要拉制度 owner。"],["系统即制度载体","它承载的是「必须这样做」。体验的天花板由制度决定，不由界面决定。"]]}],"q":{"q":"职能数字化系统的体验天花板，最先由什么决定？","o":["前端组件选型","背后的管理制度与审批链","服务器性能","培训是否到位"],"a":1,"why":"字段、审批链、留痕要求都由制度规定。界面能优化的是「在制度内少走一步」，改不了「必须走这三步」。先改制度，再谈界面。"}},{"n":7,"m":2,"t":"全课路线图与作业说明","hook":"8 个模块学完，你手上会多出什么？","goals":["模块与能力的对应关系","作品集标准与提交方式","两周学习节奏"],"pages":[{"L":"table","T":"每个模块都有一件产出物，其中两件必须进作品集","K":"课程真正的交付不是「听完」，是那几张填满的表","w":[2.4,3.4,1.6],"D":{"h":["模块","产出物","进作品集"],"r":[["M1 用户思维总纲","场景还原五问卡","配套材料"],["M2 定性研究方法","深访提纲 + 观察记录表","—"],["M3 定量研究方法","问卷自查 20 条 + 样本量速算","—"],["M4 用户画像构建","用户画像卡（1 页 A4）","选交"],["M5 需求挖掘与识别","需求鉴真表","必交"],["M6 需求优先级判断","排序表 + 一页纸理由","选交"],["M7 用户旅程绘制","用户旅程地图（含泳道）","必交"],["M8 反馈闭环与度量","闭环 SOP + 指标卡","—"]]}}],"q":{"q":"认证作品集中的两件必交件是：","o":["画像卡 + 优先级排序表","需求鉴真表 + 用户旅程图","深访提纲 + 问卷","五问卡 + 闭环 SOP"],"a":1,"why":"必交是需求鉴真表（验洞察能力）与用户旅程图（验共情与场景能力）。另外两件为选交加分项，合格每件加 2 分。"}}],"cases":[{"domain":"财务域 · 费控报销","title":"两年加了 14 个字段，退单率反而升到 34%","scene":"某集团费控报销系统上线两年，单据字段从 12 个增至 26 个。一线单均填报 41 分钟，退单率 34%，财务共享中心每月约 3 人日用于解释退回原因。\n\n逐条复盘：哪个字段是「万一要用」加的？哪个字段的数据在合同系统里已经有了？哪个字段的业务规则三个月内改过两次？","stats":[["26","单据字段（两年前 12 个）"],["41 分钟","一线单均填报耗时"],["34%","退单率"]],"flip":"复盘落点不在「删字段」，而在「哪 3 个字段在需求提出时就该被拦下，拦下的依据是哪一问」。","wrong":"每次业务提需求就加字段，理由是「先加上，也许以后用得上」。"},{"domain":"对照 · 车主 App","title":"同一个活动入口，站在车边的人根本不会点","scene":"首页新增活动入口后点击率仅 0.8%。团队第一反应是挪位置、换图标、加动效，连改三版仍无起色。\n\n场景还原后发现真正的变量是「打开 App 时人在哪」：站在车边的人要充电和开门，坐在家里的人才看活动。同一个入口，两种场景，一个场景根本不该出现这个入口。","stats":[["0.8%","入口点击率"],["2 类","真实使用场景"],["3 轮","无效的界面优化"]],"flip":"C 端与 B 端共用同一套场景还原逻辑。差异在于：B 端的「场景」由流程节点定义，不由物理位置定义。","wrong":"把入口从第二屏挪到首屏，并换了一版更大的图标。"}],"quiz":[["五问填完能直接否掉约三成需求，依据是什么？","B","拿不到可指认证据的需求占比约三成，缺证据即缺场景"],["使用率 96% 能否说明体验好？","B","不能，需与绕行率、任务完成时长、退回率交叉验证"],["四层用户诉求互斥时按什么判据排序？","C","按谁承担后果，不按级别、不按人数、不按提出方"],["「更好用」无法翻译成组织指标时应如何处理？","D","降级，不与「少一人/少一次返工/少一天关账」争资源"],["职能系统的体验天花板由什么决定？","B","制度与审批链；界面只能在制度内优化步数"]]},{"no":2,"key":"m2","name":"定性研究方法","min":60,"ability":"定性研究方法（主） / 场景还原能力（辅）","ability_short":"定性研究","output":"深访提纲 + 观察记录表","intro":"能独立设计并执行一次有效访谈或一次现场观察，且拿回来的结论经得起追问。重点不在「会问」，在「不被用户的方案牵着走」。","points":["研究问题的改写：角色、环节、缺失物","BEI 提纲与四类必须删掉的提问","跟班观察：记录打断与绕行，不记录评价"],"wrap":["只访接口人，只能拿到系统的成功故事","绕行和沉默才是设计缺陷的证据","结论强度必须跟证据强度匹配"],"sections":[{"n":1,"m":5,"t":"从业务问题到研究问题：把「不满意」翻译成可观察的现象","hook":"「用户为什么不满意」这个问题，为什么问不出答案？","goals":["不可研究题目的三个特征","研究问题的三要素：角色、环节、缺失物","改写前后的对照"],"pages":[{"L":"cards","T":"不可研究的题目，通常缺三样东西之一","K":"能被观察到，才可能被研究；「想要什么」不可观察","D":[["缺角色","「用户觉得流程太麻烦」——哪个用户？一线还是审批人？两拨人的麻烦不是一回事。","把「用户」直接当成一个人。"],["缺环节","「报销体验不好」——填报、审批、打款，哪一段？没有环节就没有观察点。","用整体评价代替具体环节。"],["缺缺失物","「希望系统更智能」——缺的是信息、是提醒、还是自动填？说不出缺失物，就设计不出方案。","把感受当需求记录下来。"]]},{"L":"steps","T":"改写公式：谁 → 在哪一环 → 因为缺什么而放弃","K":"三要素齐了，题目才可研究，访谈提纲才有落点","D":[["写下原始问题","把业务方原话照抄，不要先美化。「大家都说难用」。"],["找角色","具体到岗位、职级、是否外包。一个角色一张提纲。"],["切环节","把流程切成 4–6 段，指出问题落在哪一段。"],["补缺失物","在这一段里，他缺的是信息、权限、提醒，还是模板？"]],"note":["一个改写示例","原始：「用户觉得绩效系统难用」。\n\n改写：「某基地部门经理，在季度考核打分这一环，因为看不到下属上一季度的目标完成情况，而反复退出系统去翻邮件」。\n\n改写后，下一步做什么已经很清楚：先解决「目标完成情况在打分页不可见」。"]}],"q":{"q":"以下哪一项是可以直接进入研究设计的题目？","o":["用户希望报销系统更好用","员工对HR系统的满意度如何","新员工在入职首周，因找不到导师联系方式而反复询问HR","管理层希望提升数字化体验"],"a":2,"why":"它有角色（新员工）、环节（入职首周）、缺失物（导师联系方式），可直接设计观察与访谈。其余三项都缺至少一个要素。"}},{"n":2,"m":5,"t":"抽样：为什么不能只访接口人","hook":"访谈了 8 个人都说「还行」，问题出在哪？","goals":["接口人偏差：他已是系统的成功适应者","极端用户与边缘用户的选法","6–8 人的饱和判断"],"pages":[{"L":"bands","T":"四类样本，缺一类就会得出偏乐观的结论","K":"接口人最容易被约到，也最不代表真实用户","D":[["关键接口人","各部门指定的系统联络人。熟悉流程、配合度高，但已经适应了系统，问题在他这里被消化掉了。"],["极端用户","用得最多的人和完全不用的人。前者暴露效率瓶颈，后者暴露放弃原因。"],["边缘用户","外包、兼职、跨基地、临退休。权限与培训覆盖最薄弱，问题最集中。"],["放弃者","已经彻底绕行的人。他们不在系统里，只能靠观察和旁敲侧击找到。"]]},{"L":"cards","T":"抽样不看人数，看是否覆盖了四种处境","K":"6–8 人饱和的判断标准：新访谈不再出现新的问题类型","D":[["按处境分层","同一角色下，按使用频次、权限范围、入职时长各取 2 人，比随机抽 10 人有效。"],["必须找到 1 个绕行者","找不到绕行者，说明你的样本仍全在系统内。让他演示他现在怎么做这件事。"],["饱和即停","连续 2–3 人不再带来新的问题类型，可以停；靠人数堆不增加信息量。"]]}],"q":{"q":"一次内部系统调研只访谈了各部门指定的系统联络人，最可能出现的偏差是：","o":["样本量太小，结论不显著","系统性低估问题严重程度，因为联络人已适应系统","受访者不愿说真话","结论无法量化"],"a":1,"why":"联络人是系统的成功适应者，他们的问题已在日常中自行消化。真正的缺陷留在绕行者与边缘用户身上。"}},{"n":3,"m":7,"t":"深访提纲设计：BEI 结构、五问追问、四类必须删掉的提问","hook":"为什么问「你觉得应该怎么改」，永远问不出真问题？","goals":["BEI 的三段结构：情境—行为—结果","五问追问的模板句","四类必须删掉的提问"],"pages":[{"L":"steps","T":"BEI：不问观点，问最近一次具体发生了什么","K":"人的记忆在具体事件上最准，在抽象评价上最不可靠","D":[["情境","「上一次遇到这个问题是什么时候？当时你在做什么？」锁定时间、地点、任务。"],["行为","「你当时第一步做了什么？然后呢？」只要动作，不要解释。"],["结果","「最后这件事怎么解决的？花了多久？」拿到代价与绕行路径。"],["复述校验","「我复述一遍，你看我理解得对不对」——当场纠偏，比事后猜测可靠。"]],"note":["四类必须删掉的提问","① 假设性：「如果系统能自动填，你会用吗」——答案永远是会。\n② 诱导性：「是不是因为字段太多才觉得麻烦」——把答案塞给对方。\n③ 双重问题：「系统是不是又慢又难用」——两个变量，无法归因。\n④ 让对方预测未来：「你希望以后怎么改」——他在给你方案，不是在给你事实。"]},{"L":"cards","T":"五问追问法：把一个模糊回答挖到具体","K":"每一问都要求对方给一个可指认的细节","D":[["「能举个最近的例子吗」","把评价拉回事件。对方说「经常出错」，就问他上一次出错是哪天。"],["「当时你怎么做的」","拿到动作序列，特别是系统外的动作。"],["「为什么这么做」","拿到他的判断依据，往往就是需求的真实约束。"],["「后来怎么解决的」","拿到绕行路径与代价，这是需求的入口。"],["「还有别人也这样吗」","判断这是个体特例还是结构性问题，决定要不要扩大样本。"]]}],"q":{"q":"以下哪个提问方式最符合 BEI 行为事件访谈？","o":["你觉得现在的审批流程合理吗","如果只能改一处，你会改哪里","上一次审批被退回是什么情况？当时你先做了什么","你希望系统增加什么功能"],"a":2,"why":"BEI 问具体事件中的行为。「上一次…当时…」锁定了情境与动作；其余三项分别是要评价、要方案、要功能清单。"}},{"n":4,"m":7,"t":"访谈执行：破冰、沉默、录音与当场复述","hook":"对方说「挺好的」，后面 40 分钟就白聊了？","goals":["破冰的真正目的是消除考核感","沉默 5 秒的作用","复述校验与合规要求"],"pages":[{"L":"steps","T":"四个动作，决定这次访谈有没有真话","K":"内部访谈最大的阻力不是时间，是「他怕你在考核他」","D":[["破冰：先说清用途","「这次不是评估你的工作，是看系统哪里给你添了麻烦，问题会匿名汇总。」"],["前 10 分钟不问系统","先聊他一天怎么过、什么时候最忙，让他进入叙述状态。"],["沉默 5 秒","对方说完停住时不要急着接话。5 秒的空白，往往换来最关键的那句补充。"],["当场复述","「我复述一遍：你每月初要花两天做这件事，因为…，对吗？」让他纠错。"]],"note":["录音与合规","内部访谈同样要口头告知并取得同意：「我录个音，只用于整理，不外传，可以吗？」\n\n转写标注规范：每段标注受访者编号、岗位、时间点；引语保留原话，不要顺手改成书面语——原话里的用词往往就是需求的线索。"]},{"L":"cards","T":"三类现场反应，对应三种处理","K":"访谈不是聊天，是有一张清单要拿满","D":[["对方开始给方案","先接住再还原：「这个思路我记下了。你说的这个问题，最近一次发生是什么时候？」"],["对方只说「都挺好」","换问法，问「最麻烦的一次」或「有没有想过去 Excel 里做」，用对比逼出问题。"],["对方开始抱怨人","把话题拉回系统与流程：「这件事在系统里是怎么走的？」人的问题另行记录。"]]}],"q":{"q":"受访者反复说「系统挺好的，没什么问题」，最有效的下一步是：","o":["换一个受访者","直接问「那你觉得哪里最需要改进」","问他「有没有哪次干脆不在系统里做，而是用 Excel 处理的」","结束访谈，记录为满意"],"a":2,"why":"用具体的绕行行为做切口，比继续问评价有效。绕行几乎人人都做过，承认绕行的心理成本远低于承认不满。"}},{"n":5,"m":5,"t":"焦点小组：什么时候能用，什么时候一定不能用","hook":"把 8 个人关在一间屋子里，为什么反而问不出真话？","goals":["焦点小组适合探索共识边界","同部门同层级的压制效应","主持人的三个控场动作"],"pages":[{"L":"compare","T":"焦点小组的适用与不适用","K":"它擅长找「大家怎么看」，不擅长挖「你实际怎么做」","D":{"l":["适合用",["探索一个群体对某类问题的共同认知边界，例如「大家眼里的『状态不透明』指什么」。","快速收敛选项：当备选方案有 6 个以上，用它淘汰明显不被接受的。","跨部门对齐认知：让财务、采购、IT 坐在一间屋子里，彼此听见对方的约束。"]],"r":["不要用",["挖掘个人真实做法：群体压力会让「绕行」这类行为消失。","同部门同层级同坐：谁职级低谁闭嘴；跨层级则变成汇报会。","涉及考核与责任的话题：没人会当面说自己填错过。"]]}},{"L":"cards","T":"主持人的三个控场动作","K":"控场的目的是让沉默的人说话，不是让会议顺利","D":[["先写后说","开场 5 分钟让大家各自写下 3 条，再轮流念。避免第一个发言者定调。"],["点名沉默者","「刚才你点了下头，你是怎么看的？」用动作召唤，不用「你有什么意见」。"],["压住强势者","「这个观点我先记下，想听听其他人有没有不同做法。」"]]}],"q":{"q":"以下哪个议题最适合用焦点小组，而不是深访？","o":["审核员核对发票时的具体判断顺序","各部门对「状态不透明」这个词的理解是否一致","某位用户上个月为什么放弃使用系统","高管对预算的真实态度"],"a":1,"why":"焦点小组擅长探索群体共识边界。A、C 属于个体行为细节，D 涉及敏感立场，都应在私下深访中获取。"}},{"n":6,"m":7,"t":"现场观察：跟班、影子跟随与工作日志","hook":"为什么观察一天，比访谈 8 个人更有用？","goals":["记录什么、不记录什么","观察记录表的三列结构","跟班的时长与时段选择"],"pages":[{"L":"cards","T":"只记录可数的行为，不记录评价","K":"「他看起来很烦躁」不是证据；「他在 10 分钟内切换了 7 次窗口」才是","D":[["记录打断","每被打断一次记一笔，并记下打断来源：电话、同事、系统弹窗、领导。"],[   if(s<86400)return Math.floor(s/3600)+' 小时前';if(s<2592000)return Math.floor(s/86400)+' 天前';
  return fmtDate(iso).slice(0,10);}

/* 简易哈希（内训场景；不可逆，加盐） */
function hash(pwd,salt){
  var s=salt+'|'+pwd+'|gel-geely';
  var h1=0x811c9dc5,h2=0x01000193;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    h1^=c; h1=(h1*16777619)>>>0;
    h2=(h2+c*(i+7))>>>0; h2=((h2<<5)|(h2>>>27))>>>0;
  }
  return ('00000000'+h1.toString(16)).slice(-8)+('00000000'+h2.toString(16)).slice(-8);
}
function mkSalt(){var a='abcdefghijkmnpqrstuvwxyz23456789',s='';for(var i=0;i<12;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}

function toast(msg,ms){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('on');},ms||2200);
}

var Cloud={
  ready:false,
  async req(table,opt){
    opt=opt||{};
    var url=SB_URL+'/rest/v1/'+table+(opt.qs||'');
    var h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
    if(opt.prefer)h['Prefer']=opt.prefer;
    var r=await fetch(url,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
    if(!r.ok){var t=await r.text();throw new Error(r.status+' '+t.slice(0,160));}
    var txt=await r.text();
    return txt?JSON.parse(txt):null;
  },
  async upsert(table,rows){
    if(!rows||!rows.length)return;
    await this.req(table,{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:rows});
  },
  async all(table,qs){
    return await this.req(table,{qs:qs||'?select=id,doc&limit=5000'});
  }
};

/* ---------- 进度 ---------- */
var Prog={
  key:function(mk,n){return mk+'__s'+n;},
  get:function(mk,n){var m=lsGet('prog',{});return m[this.key(mk,n)]||null;},
  all:function(){return lsGet('prog',{});},
  set:function(mk,n,st,extra){
    var m=lsGet('prog',{});var k=this.key(mk,n);
    var cur=m[k]||{status:'none',seconds:0,visits:0};
    cur.status=st; cur.visits=(cur.visits||0)+1; cur.updatedAt=nowISO();
    if(extra)Object.assign(cur,extra);
    m[k]=cur; lsSet('prog',m);
    if(Me&&Me.role==='student')Cloud.upsert('gel_progress',[{id:Me.id+'__'+k,
      doc:{userId:Me.id,course:mk,unitId:k,status:st,seconds:cur.seconds||0,visits:cur.visits,updatedAt:cur.updatedAt}}]).catch(function(){});
  },
  moduleDone:function(mk,total){var m=this.all(),c=0;
    for(var i=1;i<=total;i++){var p=m[this.key(mk,i)];if(p&&(p.status==='done'||p.status==='quizzed'))c++;}
    return c;}
};

};

function showQuiz(mk,n){
  var m=modByKey(mk),sec=m.sections.filter(function(s){return s.n===n;})[0];
  if(!sec||!sec.q){doneSection(mk,n);return;}
  var q=sec.q,sel=-1,locked=false;
  var body='<div class="qbox"><div class="qh">随堂测 · 第 '+n+' 节</div>'
    +'<div class="qt">'+esc(q.q)+'</div><div class="opts" id="opts">'
    +q.o.map(function(o,i){return '<div class="opt" data-i="'+i+'"><div class="ol">'+'ABCD'[i]+'</div><div class="ot">'+esc(o)+'</div></div>';}).join('')
    +'</div><div id="ex"></div></div>';
  dlg('随堂测','答对后本节记为完成，可重新作答',body,
    [{t:'提交',p:1,fn:function(){
      if(locked){closeDlg();return;}
      if(sel<0){toast('请先选择一个答案');return false;}
      locked=true;
      var ok=sel===q.a;
      document.querySelectorAll('#opts .opt').forEach(function(el){
        var i=+el.dataset.i;el.classList.add('lock');el.classList.remove('sel');
        if(i===q.a)el.classList.add('right');
        else if(i===sel)el.classList.add('wrong');
      });
      document.getElementById('ex').innerHTML='<div class="explain'+(ok?'':' bad')+'">'
        +'<div class="el">'+(ok?'回答正确':'回答错误 · 正确答案 '+'ABCD'[q.a])+'</div>'
        +'<p>'+esc(q.why)+'</p></div>';
      if(ok){doneSection(mk,n);}
      var b=document.querySelector('.dlg .df .btn:last-child');
      if(b){b.textContent=ok?'完成本节':'关闭';}
      return false;
    }}]);
  setTimeout(function(){
    document.querySelectorAll('#opts .opt').forEach(function(el){
      el.onclick=function(){
        if(locked)return;
        document.querySelectorAll('#opts .opt').forEach(function(x){x.classList.remove('sel');});
        el.classList.add('sel');sel=+el.dataset.i;
      };
    });
  },0);
}

function doneSection(mk,n){
  Prog.set(mk,n,'done');
  var m=modByKey(mk);
  var idx=m.sections.filter(function(s){return s.n===n;})[0];
  var next=m.sections[m.sections.indexOf(idx)+1];
  if(document.getElementById('pbody')){
    renderLearn(mk,n);
  }
  logEvent('section_done',mk+'_s'+n);
  toast(next?'本节完成，可以进入下一节':'本节完成，全部章节已学完');
}

var QUIZ={m1:[],m2:[]};

function renderExam(mk){
  var m=modByKey(mk);
  var bank=getBank(mk);
  var old=Exam.get(mk);
  document.getElementById('app').innerHTML='<div class="shell">'+topbar('用户思维 · 线上课程')
   +'<div class="wrap"><div class="crumb"><button onclick="location.hash=\'\'">我的课程</button>'
   +'<span>/</span><span>M'+m.no+' '+esc(m.name)+'</span><span>/</span><span>模块测评</span></div>'
   +'<div style="max-width:800px;margin:0 auto">'
   +'<div class="hero"><h2>M'+m.no+' '+esc(m.name)+' · 模块测评</h2>'
   +'<p>共 '+bank.length+' 题，均为单选题。每题 1 分，满分 '+bank.length+' 分。'
   +'达 '+passLine(bank.length)+' 分（'+Math.round(passLine(bank.length)/bank.length*100)+'%）视为通过。'
   +(old?'<br>你已作答 '+old.attempts+' 次，最高分 '+old.best+' 分。':'')
   +'</p></div>'
   +'<div id="examarea"></div></div></div></div>';
  startExam(mk);
}

function passLine(t){return Math.ceil(t*0.8);}

function startExam(mk){
  var bank=getBank(mk);
  var ans=new Array(bank.length).fill(-1);
  var area=document.getElementById('examarea');
  area.innerHTML=bank.map(function(q,i){
    return '<div class="card" style="margin-bottom:12px"><div class="cb">'
      +'<div class="qh" style="font-size:11.5px;color:var(--pri);font-weight:600;margin-bottom:10px">第 '+(i+1)+' 题</div>'
      +'<div style="font-size:14.5px;color:var(--deep);font-weight:500;line-height:1.6;margin-bottom:14px">'+esc(q.q)+'</div>'
      +'<div class="opts" data-q="'+i+'">'
      +q.o.map(function(o,j){return '<div class="opt" data-i="'+j+'"><div class="ol">'+'ABCD'[j]+'</div><div class="ot">'+esc(o)+'</div></div>';}).join('')
      +'</div></div></div>';
  }).join('')
  +'<div style="display:flex;gap:12px;margin-top:20px">'
  +'<button class="btn" id="sub-exam">提交测评</button></div>';

  area.querySelectorAll('.opts').forEach(function(g){
    var qi=+g.dataset.q;
    g.querySelectorAll('.opt').forEach(function(el){
      el.onclick=function(){
        g.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        el.classList.add('sel');ans[qi]=+el.dataset.i;
      };
    });
  });

  document.getElementById('sub-exam').onclick=function(){
    var un=ans.filter(function(a){return a<0;}).length;
    if(un>0){toast('还有 '+un+' 题未作答');return;}
    var right=0,detail=[];
    bank.forEach(function(q,i){
      var ok=ans[i]===q.a;if(ok)right++;
      detail.push({i:i,sel:ans[i],ok:ok});
    });
    var res={score:right,total:bank.length,right:right,pct:Math.round(right/bank.length*100),
      detail:detail,submittedAt:nowISO()};
    Exam.save(mk,res);
    logEvent('exam_submit',mk+' '+right+'/'+bank.length);
    location.hash='#result/'+mk;
  };
}

function renderResult(mk){
  var m=modByKey(mk),bank=getBank(mk),ex=Exam.get(mk);
  if(!ex){location.hash='#exam/'+mk;return;}
  var pass=ex.score>=passLine(bank.length);
  var h='<div class="shell">'+topbar('用户思维 · 线上课程')
   +'<div class="wrap"><div class="crumb"><button onclick="location.hash=\'\'">我的课程</button>'
   +'<span>/</span><span>M'+m.no+' '+esc(m.name)+'</span><span>/</span><span>测评结果</span></div>'
   +'<div style="max-width:800px;margin:0 auto">'
   +'<div class="score-hero '+(pass?'pass':'fail')+'">'
   +'<div class="big">'+ex.score+'<small> / '+ex.total+'</small></div>'
   +'<div class="lbl">'+(pass?'已通过 · ':'未通过 · ')+'本次正确率 '+ex.pct+'%　（通过线 '+passLine(bank.length)+' 分）</div>'
   +'</div>'
   +'<div class="card"><div class="ch2"><h3>逐题回顾</h3></div><div class="cb">'
   +'<div class="qreview">'
   +bank.map(function(q,i){
     var d=ex.detail&&ex.detail[i]||{};
     return '<div class="qr"><div class="qrt">'+(i+1)+'. '+esc(q.q)+'</div>'
       +'<div class="qra"><span class="'+(d.ok?'ok':'no')+'">你的答案：'+(d.sel>=0?'ABCD'[d.sel]:'—')+'</span>'
       +'<span class="ok">正确答案：'+'ABCD'[q.a]+'</span></div>'
       +'<div style="font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:8px">'+esc(q.why)+'</div></div>';
   }).join('')
   +'</div></div></div>'
   +'<div style="display:flex;gap:12px;margin-top:18px">'
   +'<button class="btn line" onclick="location.hash=\'#exam/'+mk+'\'">重新测评</button>'
   +'<button class="btn" onclick="location.hash=\'\'">返回课程</button></div>'
   +'</div></div></div>';
  document.getElementById('app').innerHTML=h;
}

function getBank(mk){
  var out=[];
  (QUIZ[mk]||[]).forEach(function(q){out.push(q);});
  return out;
}

function dlg(title,sub,body,btns){
  var mask=document.createElement('div');mask.className='mask';
  mask.innerHTML='<div class="dlg"><div class="dh"><h3>'+esc(title)+'</h3>'
    +(sub?'<p>'+esc(sub)+'</p>':'')+'</div><div class="db">'+body+'</div>'
    +'<div class="df">'+btns.map(function(b,i){
      return '<button class="btn'+(b.p?'':' line')+'" data-i="'+i+'">'+esc(b.t)+'</button>';
    }).join('')+'</div></div>';
  document.body.appendChild(mask);
  mask.querySelectorAll('.df .btn').forEach(function(el){
    el.onclick=function(){
      var b=btns[+el.dataset.i];
      var r=b.fn?b.fn():undefined;
      if(r===false)return;
      closeDlg();
    };
  });
  mask.onclick=function(e){if(e.target===mask)closeDlg();};
}
function closeDlg(){var m=document.querySelector('.mask');if(m)m.remove();}

var ADM={tab:'overview',users:[],prog:[],exams:[],events:[],loaded:false,loading:false};

async function admLoad(force){
  if(ADM.loading)return;
  if(ADM.loaded&&!force)return;
  ADM.loading=true;
  try{
    var r=await Promise.all([
      Cloud.all('gel_users','?select=id,doc&order=updated_at.desc&limit=2000'),
      Cloud.all('gel_progress','?select=id,doc&limit=8000'),
      Cloud.all('gel_exams','?select=id,doc&limit=4000'),
      Cloud.all('gel_events','?select=id,doc&order=updated_at.desc&limit=300')
    ]);
    ADM.users=(r[0]||[]).map(function(x){return Object.assign({id:x.id},x.doc);});
    ADM.prog=(r[1]||[]).map(function(x){return Object.assign({id:x.id},x.doc);});
    ADM.exams=(r[2]||[]).map(function(x){return Object.assign({id:x.id},x.doc);});
    ADM.events=(r[3]||[]).map(function(x){return Object.assign({id:x.id},x.doc);});
    ADM.loaded=true;
  }catch(e){
    console.error(e);
    toast('云端数据拉取失败，显示本地缓存');
  }
  ADM.loading=false;
}

function renderAdmin(tab){
  ADM.tab=tab||'overview';
  var TABS=[['overview','概览'],['students','学员账号'],['progress','学习进度'],['scores','成绩与排名'],['bank','题库与答案'],['content','课程内容']];
  var h='<div class="shell">'+topbar('用户思维 · 管理后台')
   +'<div class="wrap">'
   +'<div class="mtabs">'+TABS.map(function(t){
      return '<button class="mtab'+(ADM.tab===t[0]?' on':'')+'" onclick="location.hash=\'#admin/'+t[0]+'\'">'+t[1]+'</button>';
    }).join('')+'</div>'
   +'<div id="admpane"><div class="empty">正在读取云端数据…</div></div></div></div>';
  document.getElementById('app').innerHTML=h;

  admLoad(ADM.tab==='overview'?false:true).then(function(){
    paintAdmin();
  });
}

function paintAdmin(){
  var el=document.getElementById('admpane');
  if(!el)return;
  if(ADM.tab==='overview')el.innerHTML=admOverview();
  else if(ADM.tab==='students')el.innerHTML=admStudents();
  else if(ADM.tab==='progress')el.innerHTML=admProgress();
  else if(ADM.tab==='scores')el.innerHTML=admScores();
  else if(ADM.tab==='bank')el.innerHTML=admBank();
  else if(ADM.tab==='content')el.innerHTML=admContent();
}

function students(){return ADM.users.filter(function(u){return u.role!=='admin';});}

function examOf(uid,mk){
  return ADM.exams.filter(function(e){return e.userId===uid&&e.course===mk;})[0]||null;
}
function progOf(uid,mk){
  return ADM.prog.filter(function(p){return p.userId===uid&&p.course===mk;});
}
function doneOf(uid,mk){
  var total=modByKey(mk).sections.length;
  var d=progOf(uid,mk).filter(function(p){return p.status==='done'||p.status==='quizzed';}).length;
  return {done:d,total:total,pct:total?Math.round(d/total*100):0};
}
function totalDone(uid){
  return MODS.reduce(function(a,m){return a+doneOf(uid,m.key).done;},0);
}
function totalSec(){return MODS.reduce(function(a,m){return a+m.sections.length;},0);}
function avgScore(){
  var s=0,c=0;
  ADM.exams.forEach(function(e){if(e.userId&&students().some(function(u){return u.id===e.userId;})){s+=e.best||e.score||0;c++;}});
  return c?Math.round(s/c*10)/10:0;
}

function admOverview(){
  var st=students();
  var act=st.filter(function(u){return totalDone(u.id)>0;}).length;
  var finished=st.filter(function(u){return totalDone(u.id)>=totalSec();}).length;
  var examed=st.filter(function(u){return ADM.exams.some(function(e){return e.userId===u.id;});}).length;
  var rate=st.length?Math.round(finished/st.length*100):0;

  var feed=ADM.events.slice(0,14).map(function(ev){
    var d=ev.doc||ev;
    var typ={login:'登录',section_done:'完成一节',exam_submit:'提交测评'}[d.type]||d.type;
    return '<tr><td class="nm">'+esc(d.name||(findName(d.userId)))+'</td><td><span class="pill '+(d.type==='exam_submit'?'ok':(d.type==='login'?'gray':''))+'">'+esc(typ)+'</span></td>'
      +'<td>'+esc(d.ref||'')+'</td><td style="white-space:nowrap">'+ago(d.at)+'</td></tr>';
  }).join('');

  return '<div class="kpis">'
   +kpi('学员总数',st.length,'人','已建账号')
   +kpi('已开始学习',act,'人',st.length?Math.round(act/st.length*100)+'%':'—')
   +kpi('完成全部课程',finished,'人','完成率 '+rate+'%')
   +kpi('已参加测评',examed,'人','平均分 '+avgScore())
   +'</div>'
   +'<div class="row2">'
   +'<div class="card"><div class="ch2"><h3>各模块完成情况</h3></div><div class="cb">'
   +MODS.map(function(m){
      var c=0;
      st.forEach(function(u){if(doneOf(u.id,m.key).done>=m.sections.length)c++;});
      var pct=st.length?Math.round(c/st.length*100):0;
      return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">'
        +'<span style="color:var(--deep);font-weight:500">M'+m.no+' '+esc(m.name)+'</span>'
        +'<span style="color:var(--soft)">'+c+' / '+st.length+' 人完成</span></div>'
        +'<div class="prog-bar"><i style="width:'+pct+'%"></i></div></div>';
    }).join('')
   +(st.length?'':'<div class="empty">还没有学员账号</div>')
   +'</div></div>'
   +'<div class="card"><div class="ch2"><h3>最近活动</h3><div class="spacer"></div>'
   +'<button class="btn sm line" onclick="admLoad(true).then(paintAdmin)">刷新</button></div>'
   +'<div class="cb p0">'
   +(feed?'<table class="dt"><thead><tr><th>学员</th><th>动作</th><th>对象</th><th>时间</th></tr></thead><tbody>'+feed+'</tbody></table>'
     :'<div class="empty">暂无活动记录</div>')
   +'</div></div></div>';
}

function kpi(label,val,unit,sub){
  return '<div class="kpi"><div class="kl">'+label+'</div>'
    +'<div class="kv">'+val+'<small> '+unit+'</small></div>'
    +(sub?'<div class="ks">'+sub+'</div>':'')+'</div>';
}
function findName(uid){var u=ADM.users.filter(function(x){return x.id===uid;})[0];return u?u.name:'—';}

function admStudents(){
  var st=students();
  var rows=st.map(function(u){
    var td=totalDone(u.id);
    return '<tr><td class="nm">'+esc(u.name)+'</td>'
      +'<td><code style="font-size:12px;color:var(--muted)">'+esc(u.loginId)+'</code></td>'
      +'<td>'+(u.company?esc(u.company):'—')+'</td>'
      +'<td>'+td+' / '+totalSec()+' 节</td>'
      +'<td><span class="pill '+(u.active===false?'no':'ok')+'">'+(u.active===false?'已停用':'正常')+'</span></td>'
      +'<td style="white-space:nowrap">'+fmtDate(u.createdAt)+'</td>'
      +'<td style="white-space:nowrap">'
      +'<button class="btn sm gray" onclick="resetPwd(\''+u.id+'\')" style="margin-right:6px">重置密码</button>'
      +'<button class="btn sm '+(u.active===false?'line':'danger')+'" onclick="toggleUser(\''+u.id+'\','+(u.active===false)+')">'+(u.active===false?'启用':'停用')+'</button>'
      +'</td></tr>';
  }).join('');

  return '<div class="card"><div class="ch2"><h3>学员账号</h3><span class="pill gray">共 '+st.length+' 人</span>'
   +'<div class="spacer"></div>'
   +'<button class="btn sm line" onclick="bulkAdd()" style="margin-right:8px">批量导入</button>'
   +'<button class="btn sm" onclick="addStudent()">新增学员</button></div>'
   +'<div class="cb p0">'
   +(rows?'<table class="dt"><thead><tr><th>姓名</th><th>登录账号</th><th>部门</th><th>学习进度</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table>'
     :'<div class="empty">还没有学员。点右上角「新增学员」或「批量导入」创建。<br>学员用「登录账号 + 密码」登录，登录后看到的就是 M1/M2 两门课。</div>')
   +'</div>'
   +'<div class="ch2" style="border-top:1px solid var(--line);border-bottom:none">'
   +'<span style="font-size:13px;color:var(--mid)">我的账号：<b>'+esc(Me.loginId)+'</b></span>'
   +'<div class="spacer"></div>'
   +'<button class="btn sm line" onclick="changeMyPwd()">修改我的密码</button>'
   +'</div></div>';
}

function addStudent(pre){
  var p=pre||{};
  dlg('新增学员','创建后把账号密码发给学员', 
    '<div class="form-grid">'
    +'<div class="fi"><label>姓名</label><input class="inp" id="nu-name" value="'+esc(p.name||'')+'" placeholder="如 张明"></div>'
    +'<div class="fi"><label>登录账号</label><input class="inp" id="nu-id" value="'+esc(p.loginId||'')+'" placeholder="如 zh0001"></div>'
    +'<div class="fi"><label>部门 / 职能</label><input class="inp" id="nu-co" value="'+esc(p.company||'')+'" placeholder="如 财务共享中心"></div>'
    +'<div class="fi"><label>初始密码</label><input class="inp" id="nu-pw" value="'+(p.pwd||'gel123456')+'"></div>'
    +'</div>',
    [{t:'取消',fn:function(){return true;}},{t:'创建',p:1,fn:function(){
      var name=document.getElementById('nu-name').value.trim();
      var lid=document.getElementById('nu-id').value.trim();
      var co=document.getElementById('nu-co').value.trim();
      var pw=document.getElementById('nu-pw').value.trim()||'gel123456';
      if(!name||!lid){toast('姓名和登录账号必填');return false;}
      var salt=mkSalt();
      var u={id:uid('u_'),loginId:lid,name:name,role:'student',company:co,
        salt:salt,pwd:hash(pw,salt),active:true,createdAt:nowISO()};
      saveUser(u).then(function(){
        ADM.users.unshift(u);ADM.loaded=true;
        toast('已创建：'+lid+' / '+pw);
        paintAdmin();
      }).catch(function(e){toast('创建失败：'+e.message.slice(0,60));});
    }}]);
}

function bulkAdd(){
  dlg('批量导入学员','每行一个：姓名,登录账号,部门（密码默认 gel123456）',
    '<textarea class="inp" id="bulk-txt" style="height:180px;padding:11px;line-height:1.7;resize:vertical" '
    +'placeholder="张明,zhangming,财务共享中心&#10;李静,lijing,采购中心&#10;王涛,wangtao,人力资源部"></textarea>'
    +'<div style="font-size:12px;color:var(--soft);margin-top:10px;line-height:1.7">'
    +'密码统一为 <b>gel123456</b>。学员忘记密码时，在此页点「重置密码」即可。账号重复会自动跳过。</div>',
    [{t:'取消',fn:function(){return true;}},{t:'导入',p:1,fn:function(){
      var txt=document.getElementById('bulk-txt').value;
      var lines=txt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      if(!lines.length){toast('请粘贴学员名单');return false;}
      var exist={};ADM.users.forEach(function(u){exist[u.loginId]=1;});
      var batch=[],skipped=0;
      lines.forEach(function(ln){
        var c=ln.split(/[,，\t]/).map(function(x){return x.trim();});
        if(c.length<2)return;
        if(exist[c[1]]){skipped++;return;}
        var salt=mkSalt();
        batch.push({id:uid('u_'),loginId:c[1],name:c[0],role:'student',company:c[2]||'',
          salt:salt,pwd:hash('gel123456',salt),active:true,createdAt:nowISO()});
        exist[c[1]]=1;
      });
      if(!batch.length){toast('没有可导入的新账号');return false;}
      Promise.all(batch.map(function(u){return saveUser(u);})).then(function(){
        batch.forEach(function(u){ADM.users.unshift(u);});
        ADM.loaded=true;
        toast('已导入 '+batch.length+' 人'+(skipped?'，跳过重复 '+skipped+' 人':''));
        paintAdmin();
      }).catch(function(e){toast('导入失败：'+e.message.slice(0,60));});
    }}]);
}

function resetPwd(id){
  var u=ADM.users.filter(function(x){return x.id===id;})[0];if(!u)return;
  var np=prompt('给「'+u.name+'」设置新密码：','gel123456');
  if(np===null)return;
  np=np.trim();if(!np){toast('密码不能为空');return;}
  var salt=mkSalt();
  u.salt=salt;u.pwd=hash(np,salt);
  saveUser(u).then(function(){toast('密码已重置为：'+np);}).catch(function(e){toast('失败：'+e.message.slice(0,50));});
}

function changeMyPwd(){
  dlg('修改我的密码','修改后请立即记住新密码，下次登录生效',
    '<div class="field" style="margin-bottom:12px"><label style="font-size:12.5px;color:var(--mid);display:block;margin-bottom:6px">当前密码</label>'
    +'<input class="inp" type="password" id="cp-old" placeholder="请输入当前密码"></div>'
    +'<div class="field" style="margin-bottom:12px"><label style="font-size:12.5px;color:var(--mid);display:block;margin-bottom:6px">新密码</label>'
    +'<input class="inp" type="password" id="cp-new" placeholder="至少 6 位"></div>'
    +'<div class="field"><label style="font-size:12.5px;color:var(--mid);display:block;margin-bottom:6px">确认新密码</label>'
    +'<input class="inp" type="password" id="cp-new2" placeholder="再输入一次"></div>',
    [{t:'取消',fn:function(){return true;}},{t:'保存',p:1,fn:function(){
      var o=document.getElementById('cp-old').value;
      var n1=document.getElementById('cp-new').value;
      var n2=document.getElementById('cp-new2').value;
      var u=ADM.users.filter(function(x){return x.id===Me.id;})[0];
      if(!u){toast('账号信息未加载，请刷新重试');return false;}
      if(hash(o,u.salt)!==u.pwd){toast('当前密码不正确');return false;}
      if(n1.length<6){toast('新密码至少 6 位');return false;}
      if(n1!==n2){toast('两次输入的新密码不一致');return false;}
      var salt=mkSalt();
      u.salt=salt;u.pwd=hash(n1,salt);
      saveUser(u).then(function(){toast('密码已修改');}).catch(function(e){toast('失败：'+e.message.slice(0,50));});
    }}]);
}

function toggleUser(id,enable){
  var u=ADM.users.filter(function(x){return x.id===id;})[0];if(!u)return;
  u.active=!!enable;
  saveUser(u).then(function(){toast(enable?'已启用':'已停用');paintAdmin();})
    .catch(function(e){toast('失败：'+e.message.slice(0,50));});
}

function admProgress(){
  var st=students();
  if(!st.length)return '<div class="card"><div class="empty">还没有学员账号，先到「学员账号」页创建。</div></div>';
  var head=MODS.map(function(m){return m.sections.map(function(s){
    return '<th style="text-align:center;padding:8px 4px;font-size:11px" title="第'+s.n+'节 '+esc(s.t)+'">'+s.n+'</th>';
  }).join('');}).join('');
  var body=st.map(function(u){
    var cells=MODS.map(function(m){
      return m.sections.map(function(s){

function admScores(){
  var st=students();
  var list=st.map(function(u){
    var rec={u:u,m1:examOf(u.id,'m1'),m2:examOf(u.id,'m2')};
    var vals=[];
    if(rec.m1)vals.push(rec.m1.best||rec.m1.score);
    if(rec.m2)vals.push(rec.m2.best||rec.m2.score);
    rec.sum=vals.length?vals.reduce(function(a,b){return a+b;},0):-1;
    rec.avg=vals.length?Math.round(rec.sum/vals.length*10)/10:-1;
    rec.last=Math.max.apply(null,[0].concat([rec.m1,rec.m2].filter(Boolean).map(function(e){return new Date(e.submittedAt||0).getTime();})));
    return rec;
  });
  list.sort(function(a,b){
    if(b.sum!==a.sum)return b.sum-a.sum;
    return b.last-a.last;
  });

  var rows=list.map(function(r,i){
    var m1=r.m1?((r.m1.best||r.m1.score)+' 分'):'<span style="color:var(--soft)">未考</span>';
    var m2=r.m2?((r.m2.best||r.m2.score)+' 分'):'<span style="color:var(--soft)">未考</span>';
    var rk=i+1;
    return '<tr><td><span class="rank'+(rk<=3?' r'+rk:'')+'">'+rk+'</span></td>'
      +'<td class="nm">'+esc(r.u.name)+'</td>'
      +'<td>'+esc(r.u.company||'—')+'</td>'
      +'<td>'+m1+'</td><td>'+m2+'</td>'
      +'<td><b style="color:var(--pri)">'+(r.sum>=0?r.avg:'—')+'</b></td>'
      +'<td style="white-space:nowrap;color:var(--soft)">'+(r.last?ago(new Date(r.last).toISOString()):'—')+'</td></tr>';
  }).join('');

  return '<div class="card"><div class="ch2"><h3>成绩与实时排名</h3>'
   +'<span class="pill">按模块最高分合计排序</span><div class="spacer"></div>'
   +'<button class="btn sm line" onclick="admLoad(true).then(paintAdmin)">刷新排名</button></div>'
   +'<div class="cb p0">'
   +(rows?'<table class="dt"><thead><tr><th style="width:56px">名次</th><th>学员</th><th>部门</th>'
     +'<th>M1 测评</th><th>M2 测评</th><th>平均分</th><th>最近提交</th></tr></thead><tbody>'+rows+'</tbody></table>'
     :'<div class="empty">还没有测评数据。学员完成学习后在本页可看到成绩与排名。</div>')
   +'</div></div>';
}
