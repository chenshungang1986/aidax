          '在评审前把拿不出证据的需求筛掉，避免把资源投给不成立的需求', '统计各部门提了多少需求'],
      a: 2,
      why: '鉴真表是筛子，不是记录。填不满的行就是风险点，它让「证据不足」成为可以在会上当场核验的硬理由，而不是靠谁的嗓门大。' },

    { dim: 'need', type: 'single', s: 1.5,
      q: '以下哪种需求描述最接近可核验的程度？',
      o: ['优化报销流程，提升用户满意度', '费用审核员在月结前 5 天，因查不到供应商历史付款需切到 Excel，单均多花 2.5 分钟',
          '增加报表功能，支持多维度分析', '提升系统易用性，减少操作步骤'],
      a: 1,
      why: '可核验的需求包含四要素：谁、什么条件下、卡在哪个动作、代价多少。A、C、D 都是方案或目标，无法验收，也无法估算价值。' },

    { dim: 'need', type: 'single', s: 1.5,
      q: '需求来源里，哪一类最需要警惕「需求被转述后失真」？',
      o: ['你亲自跟班看到的操作', '系统日志里的退回记录',
          '部门接口人转述的一线意见', '制度文件里写明的留痕要求'],
      a: 2,
      why: '转述会同时损失细节和增益立场：细节丢了，需求变成形容词；立场加进来，需求变成部门诉求。日志和制度是原始记录，跟班是一手观察，都不经过二次加工。' }
  ]
};

/* ============================================================
   四条件认证引擎
   总分 = 学习完成度 5 + 随堂练习 5 + 客观题 50 + 作品集 40
   通过 = 总分≥75 且 客观题≥70% 且 作品集≥70% 且 3 个子项无一项<60%
   ============================================================ */
var CERT_RULE = {
  learnFull: 5, pracFull: 5, objFull: 50, portFull: 40, totalFull: 100,
  passTotal: 75, passObjRate: 0.70, passPortRate: 0.70, passDimRate: 0.60,
  pracPass: 3,            /* 每节 5 题，答对 3 题过关 */
  pracEach: 5,
  examMinutes: 60,
  /* 作品集两件，各 20 分，各 4 维 × 5 分 */
  portItems: [
    { k: 'a', name: '场景还原五问卡', full: 20, src: 'M1 第 3 节产出物',
      dims: ['角色与处境具体', '证据可被第三方核验', '绕行路径写到具体载体', '后果承担者与时限明确'] },
    { k: 'b', name: '深访提纲与观察记录', full: 20, src: 'M2 第 3、6 节产出物',
      dims: ['主问题为 BEI 结构（问事件不问观点）', '每题配有可用的追问', '观察记录可数、连续、无评价词', '结论标注来源数与强度等级'] }
  ]
};

/* ============================================================
   分阶段认证
   9 项能力子项按「主承载模块」切成 3 个阶段，每阶段独立 100 分制四条件。
   判定只作用于本阶段已开评的子项；未开评项在能力面板显式标注「待阶段 N」，
   不参与总分、也不当作 0 分——否则学员会把「还没学」误读成「不会」。
   ============================================================ */
var STAGES = [
  { k: 's1', no: 1, name: '用户思维基础', open: true,
    sub: 'M1 用户思维总纲 · M2 定性研究方法',
    mods: ['m1', 'm2'], mins: 100, examCnt: 33,
    dims: ['scene', 'qual', 'need'],
    works: '场景还原五问卡 · 深访提纲与观察记录',
    portItems: null,          /* 由 CERT_RULE.portItems 填充 */
    goal: '解决「先看事实还是先听观点」。学完能独立做一次不诱导的深访，并把一句模糊抱怨还原成可核验的场景。',
    next: '阶段二 · 研究与洞察' },
  { k: 's2', no: 2, name: '研究与洞察', open: false,
    sub: 'M3 定量研究方法 · M4 用户画像构建 · M5 需求挖掘与识别 · M6 需求优先级判断',
    mods: ['m3', 'm4', 'm5', 'm6'], mins: 240, examCnt: 36,
    dims: ['quant', 'persona', 'prio'],
    works: '问卷自查表 · 需求鉴真表',
    portItems: null,
    goal: '解决「多少人、什么人、先做哪个」。学完能用一份问卷证明规模、用画像卡分出核心与边缘、用排序表在资源冲突时给出可辩护的理由。',
    next: '阶段三 · 旅程与反馈闭环' },
  { k: 's3', no: 3, name: '旅程与反馈闭环', open: false,
    sub: 'M7 用户旅程绘制 · M8 用户反馈闭环与满意度度量',
    mods: ['m7', 'm8'], mins: 120, examCnt: 0,
    dims: ['journey', 'feedback', 'nps'],
    works: '用户旅程地图 · 闭环 SOP 一页图',
    portItems: null,
    goal: '解决「在哪一步断、怎么知道有没有变好」。学完能画一张标出断点的旅程图，并为每个断点配一条可回收的反馈通道与一个不被平均数掩盖的指标。',
    next: '结业 · 9 项能力报告' }
];

/* 9 项能力子项 → 阶段归属（对齐吉利的 4 大能力项 / 9 个子项） */
var DIMS9 = {
  scene:    { name: '场景还原能力',     model: '场景化与共情思维', stage: 's1', full: 20, master: 'M1 第 3–5 节' },
  qual:     { name: '定性研究方法',     model: '用户研究能力',     stage: 's1', full: 18, master: 'M2 全部' },
  need:     { name: '需求挖掘与识别',   model: '用户需求洞察',     stage: 's1', full: 12, master: 'M1 第 4–6 节',
              scope: '考核范围限于 M1/M2 已讲的「需求真伪初判」，M5 会完整展开并在阶段二作品集中复查' },
  quant:    { name: '定量研究方法',     model: '用户研究能力',     stage: 's2', full: 18, master: 'M3 全部' },
  persona:  { name: '用户画像构建',     model: '用户研究能力',     stage: 's2', full: 15, master: 'M4 全部' },
  prio:     { name: '需求优先级判断',   model: '用户需求洞察',     stage: 's2', full: 17, master: 'M6 全部' },
  journey:  { name: '用户旅程绘制',     model: '场景化与共情思维', stage: 's3', full: 20, master: 'M7 全部' },
  feedback: { name: '反馈收集体系搭建', model: '用户反馈闭环',     stage: 's3', full: 16, master: 'M8 第 1–4 节' },
  nps:      { name: '用户满意度度量',   model: '用户反馈闭环',     stage: 's3', full: 14, master: 'M8 第 5–7 节' }
};
STAGES.forEach(function (s) { s.portItems = s.k === 's1' ? CERT_RULE.portItems : []; });

function stageOf(k) {
  for (var i = 0; i < STAGES.length; i++) if (STAGES[i].k === k) return STAGES[i];
  return null;
}
/* 当前开放阶段：同一时刻只有一个，后续阶段上线时把 open 打开即可 */
function openStage() {
  for (var i = 0; i < STAGES.length; i++) if (STAGES[i].open) return STAGES[i];
  return STAGES[0];
}

var Cert = {
  key: function () { return 'cert_' + (Me ? Me.id : 'anon'); },
  get: function () { return lsGet('cert', {}); },
  set: function (o) { lsSet('cert', o); this.push(o); },
  patch: function (p) { var o = this.get(); Object.assign(o, p); o.updatedAt = nowISO(); this.set(o); return o; },
  /* 写云端必须「先读后写」：upsert 是整行替换，直接推本地 doc 会把管理员写的
     review 冲掉——学员考一次试就把已评的作品集分数清零，这是真实踩过的坑。 */
  push: function (o) {
    if (!Me || Me.role !== 'student') return;
    var self = this;
    Cloud.req('gel_cert', { qs: '?id=eq.' + encodeURIComponent(Me.id) + '&select=doc' })
      .then(function (rows) {
        var remote = (rows && rows[0] && rows[0].doc) || {};
        var doc = Object.assign({}, remote, o);
        // 学员改作品集时显式传 review:null，视为评分作废，需管理员重评
        if ('review' in o && o.review === null) delete doc.review;
        doc.userId = Me.id; doc.name = Me.name; doc.loginId = Me.loginId;
        doc.updatedAt = nowISO();
        return Cloud.upsert('gel_cert', [{ id: Me.id, doc: doc }]);
      })
      .catch(function () { });
  },
  /* 从云端拉回管理员评分：学员本地只有自己写的数据，不拉就永远看不到评审结果 */
  sync: function () {
    if (!Me || Me.role !== 'student') return Promise.resolve();
    var self = this;
    return Cloud.req('gel_cert', { qs: '?id=eq.' + encodeURIComponent(Me.id) + '&select=doc' })
      .then(function (rows) {
        if (!rows || !rows.length || !rows[0].doc) return;
        var remote = rows[0].doc, local = lsGet('cert', {});
        var merged = Object.assign({}, remote, local);
        if (remote.review) merged.review = remote.review;
        lsSet('cert', merged);
      })
      .catch(function () { });
  },
  /* ---- 学习完成度：每节听满 80% 或已完成随堂测（只算本阶段模块） ---- */
  learn: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    var total = 0, done = 0, detail = [];
    MODS.filter(function (m) { return S.mods.indexOf(m.key) >= 0; }).forEach(function (m) {
      m.sections.forEach(function (s) {
        total++;
        var p = Prog.get(m.key, s.n) || {};
        var uid = 'g_m' + m.no + '_' + s.n;
        var segs = window.NARR[uid] || [];
        var full = segs.reduce(function (a, x) { return a + x.d; }, 0);
        var heard = p.heard || 0;
        var ok = (p.status === 'done' || p.status === 'quizzed') || (full > 0 && heard / full >= 0.8);
        if (ok) done++;
        detail.push({ uid: uid, t: s.t, rate: full > 0 ? Math.min(1, heard / full) : 0, ok: ok });
      });
    });
    return { done: done, total: total, score: total ? Math.round(done / total * CERT_RULE.learnFull * 10) / 10 : 0, detail: detail };
  },
  /* ---- 随堂练习：每节 5 题，按答对题数累计折算（只算本阶段模块） ----
     记录在 Prog 的 quiz.best 里，取历史最好一次；未做记 0 分，不影响学习完成度 */
  prac: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    var secs = 0, done = 0, got = 0, full = 0, detail = [];
    MODS.filter(function (m) { return S.mods.indexOf(m.key) >= 0; }).forEach(function (m) {
      m.sections.forEach(function (s) {
        var p = Prog.get(m.key, s.n) || {};
        var uid = 'g_m' + m.no + '_' + s.n;
        var bank = (window.PRACTICE && window.PRACTICE[uid]) || [];
        var each = Math.max(bank.length, CERT_RULE.pracEach);
        var qz = p.quiz || null;
        var best = qz ? Math.min(each, qz.best || 0) : 0;
        secs++; full += each; got += best;
        if (qz && (qz.best || 0) >= CERT_RULE.pracPass) done++;
        detail.push({ uid: uid, t: s.t, best: best, each: each, tries: qz ? qz.tries : 0,
          ok: !!(qz && (qz.best || 0) >= CERT_RULE.pracPass) });
      });
    });
    return {
      secs: secs, done: done, got: got, full: full,
      rate: full ? Math.round(got / full * 1000) / 10 : 0,
      score: full ? Math.round(got / full * CERT_RULE.pracFull * 10) / 10 : 0
    };
  },
  /* ---- 客观题：按本阶段子项汇总 ---- */
  obj: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    var c = this.get();
    var ex = c.exam || null;
    var dims = {}, total = 0, full = 0;
    S.dims.forEach(function (k) {
      var d = DIMS9[k] || QUIZ.dims[k] || { name: k, full: 0 };
      dims[k] = { name: d.name, got: 0, full: d.full, stage: d.stage };
      full += d.full;
    });
    if (!ex) return { done: false, got: 0, full: full, dims: dims, ex: null };
    QUIZ.items.forEach(function (q, i) {
      if (!dims[q.dim]) return;
      var d = ex.detail && ex.detail[i];
      var g = d ? d.got : 0;
      dims[q.dim].got += g;
      total += g;
    });
    return { done: true, got: Math.round(total * 10) / 10, full: full, dims: dims, ex: ex };
  },
  /* ---- 作品集 ---- */
  port: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    var c = this.get();
    var pf = c.portfolio || null, rv = c.review || null;
    var items = S.portItems || [];
    var full = items.reduce(function (a, it) { return a + it.full; }, 0);
    var got = 0;
    if (rv) {
      items.forEach(function (it) {
        var arr = rv[it.k] || [];
        (arr || []).forEach(function (v) { got += (+v || 0); });
      });
    }
    return { submitted: !!pf, reviewed: !!rv, got: Math.round(got * 10) / 10, full: full || CERT_RULE.portFull, pf: pf, rv: rv };
  },
  /* ---- 阶段四条件 ---- */
  judge: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    if (!S) S = STAGES[0];
    if (!S.open) return { locked: true, stage: S };
    var L = this.learn(S.k), O = this.obj(S.k), P = this.port(S.k), PR = this.prac(S.k);
    var totalFull = Math.round((CERT_RULE.learnFull + CERT_RULE.pracFull + O.full + P.full) * 10) / 10;
    var total = Math.round((L.score + PR.score + O.got + P.got) * 10) / 10;
    var weak = [];
    Object.keys(O.dims).forEach(function (k) {
      var d = O.dims[k];
      var rate = d.full ? d.got / d.full : 0;
      d.rate = Math.round(rate * 100);
      if (O.done && rate < CERT_RULE.passDimRate) weak.push(d.name + '（' + d.rate + '%）');
    });
    var dimWord = S.dims.length + ' 项';
    var conds = [
      { n: '条件一  总分不低于 75 分', ok: total >= CERT_RULE.passTotal,
        d: total + ' / ' + totalFull + ' 分', need: '≥ 75' },
      { n: '条件二  客观题得分率不低于 70%', ok: O.done && O.got / O.full >= CERT_RULE.passObjRate,
        d: O.done ? (O.got + ' / ' + O.full + ' 分，' + Math.round(O.got / O.full * 100) + '%') : '未考试',
        need: '≥ 70%' },
      { n: '条件三  作品集得分率不低于 70%', ok: P.reviewed && P.got / P.full >= CERT_RULE.passPortRate,
        d: P.reviewed ? (P.got + ' / ' + P.full + ' 分，' + Math.round(P.got / P.full * 100) + '%') : (P.submitted ? '已提交，待评审' : '未提交'),
        need: '≥ 70%' },
      { n: '条件四  能力子项无一项低于 60%（短板否决）', ok: O.done && weak.length === 0,
        d: O.done ? (weak.length ? '短板：' + weak.join('、') : '本阶段' + dimWord + '均达标') : '未考试', need: '全部 ≥ 60%' }
    ];
    var allReady = O.done && P.reviewed;
    return {
      locked: false, stage: S,
      learn: L, prac: PR, obj: O, port: P, total: total, totalFull: totalFull,
      conds: conds, weak: weak,
      passed: allReady && conds.every(function (c) { return c.ok; }),
      ready: allReady,
      level: total >= 90 ? '优秀' : total >= 82 ? '熟练' : total >= 75 ? '合格' : '未通过'
    };
  }
};

/* ---- 9 项能力面板：已认定 / 待阶段 N ---- */
function dimPanel() {
  var open = openStage();
  var out = [], order = ['scene', 'qual', 'need', 'quant', 'persona', 'prio', 'journey', 'feedback', 'nps'];
  var r = null;
  order.forEach(function (k) {
    var d = DIMS9[k];
    var st = stageOf(d.stage);
    var avail = st && st.open;
    if (avail) {
      if (!r || r.stage.k !== st.k) r = Cert.judge(st.k);
      var o = r.obj.dims[k];
      var rate = o ? (o.rate || 0) : 0;
      out.push({ k: k, d: d, st: st, avail: true, got: o ? o.got : 0, full: d.full, rate: rate });
    } else {
      out.push({ k: k, d: d, st: st, avail: false, got: 0, full: d.full, rate: 0 });
    }
  });
  return out;
}

/* ============================================================
   学员端：认证总览（阶段列表 + 9 项能力）
   ============================================================ */
function renderCert() {
  paintCertList();
  Cert.sync().then(function () { paintCertList(); });
}

function paintCertList() {
  var cl = Cert.get();
  var open = openStage();
  var judged = {};
  STAGES.forEach(function (s) {
    judged[s.k] = s.open ? Cert.judge(s.k) : { locked: true, stage: s };
  });

  /* 已认定的能力项数 */
  var panels = dimPanel();
  var gotCnt = panels.filter(function (p) { return p.avail; }).length;

  /* ---- 阶段卡 ---- */
  var cards = STAGES.map(function (s) {
    var j = judged[s.k];
    if (s.open) {
      var badge, cls;
      if (j.passed) { badge = '已通过 · ' + j.total + ' 分'; cls = 'ok'; }
      else if (j.ready) { badge = '未通过 · ' + j.total + ' 分'; cls = 'no'; }
      else if (j.learn.done > 0 || j.obj.done || j.port.submitted) { badge = '进行中 · ' + j.total + ' / ' + j.totalFull; cls = 'go'; }
      else { badge = '未开始'; cls = 'idle'; }
      var dims = s.dims.map(function (k) {
        var d = j.obj.dims[k] || { got: 0, full: 0, rate: 0 };
        return '<span class="stag-dim">' + esc(d.name) + ' <b>' + d.got + '/' + d.full + '</b></span>';
      }).join('');
      return '<div class="stage-card open">'
        + '<div class="sc-hd"><div class="sc-no">阶段 ' + s.no + '</div>'
        + '<span class="sc-badge ' + cls + '">' + badge + '</span></div>'
        + '<h3>' + esc(s.name) + '</h3>'
        + '<div class="sc-sub">' + esc(s.sub) + '</div>'
        + '<p class="sc-goal">' + esc(s.goal) + '</p>'
        + '<div class="sc-meta"><span>成片 <b>' + s.mins + ' 分钟</b></span>'
        + '<span>能力子项 <b>' + s.dims.length + ' 项</b></span>'
        + '<span>作品集 <b>' + s.works + '</b></span></div>'
        + '<div class="sc-dims">' + dims + '</div>'
        + '<div class="sc-ft">'
        + '<button class="btn" onclick="location.hash=\'#cert/' + s.k + '\'">' + (j.ready || j.learn.done ? '查看阶段认证' : '开始阶段认证') + '</button>'
        + (j.passed ? '<button class="btn line" onclick="location.hash=\'#certificate/' + s.k + '\'">查看证书</button>' : '')
        + '</div></div>';
    }
    return '<div class="stage-card lock">'
      + '<div class="sc-hd"><div class="sc-no">阶段 ' + s.no + '</div>'
      + '<span class="sc-badge idle">待课程上线</span></div>'
      + '<h3>' + esc(s.name) + '</h3>'
      + '<div class="sc-sub">' + esc(s.sub) + '</div>'
      + '<p class="sc-goal">' + esc(s.goal) + '</p>'
      + '<div class="sc-meta"><span>成片 <b>' + s.mins + ' 分钟</b></span>'
      + '<span>能力子项 <b>' + s.dims.length + ' 项</b></span>'
      + '<span>作品集 <b>' + s.works + '</b></span></div>'
      + '<div class="sc-dims">' + s.dims.map(function (k) {
          var d = DIMS9[k];
          return '<span class="stag-dim off">' + esc(d.name) + ' <b>待评</b></span>';
        }).join('') + '</div>'
      + '<div class="sc-ft"><span class="sc-soon">课程上线后自动开放，阶段一成绩不受影响</span></div></div>';
  }).join('');

function certNo(sk, uid) {
  var s = stageOf(sk) || STAGES[0];
  var seed = String(uid || '');
  var h = 0;
  for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 1679616;
  var tail = ('00000' + h.toString(36).toUpperCase()).slice(-5);
  var c = Cert.get();
  var ts = (c.updatedAt || nowISO()).slice(0, 10).replace(/-/g, '');
  return 'GEL-' + s.no + '-' + tail + '-' + ts;
}

function renderCertificate(sk) {
  var S = stageOf(sk) || openStage();
  Cert.sync().then(function () { paintCertificate(S.k); });

}

var EX = { ans: [], t0: 0, timer: null };

function renderCertExam() {
  var items = QUIZ.items;

  items.forEach(function (q, i) { (byDim[q.dim] = byDim[q.dim] || []).push(i); });

  var blocks = Object.keys(QUIZ.dims).map(function (k) {
    var d = QUIZ.dims[k];
    var list = (byDim[k] || []).map(function (gi) {
      var q = items[gi];

      }).join('');

      return '<div class="qx"><div class="qxi">' + (gi + 1) + '</div><div style="flex:1">'
        + '<div class="qxt">' + tag + esc(q.q) + '</div>'
        + '<div class="opts" data-gi="' + gi + '">' + opts + '</div></div></div>';
    }).join('');
    return '<div class="card" style="margin-bottom:14px"><div class="ch2"><h3>' + esc(d.name) + '</h3>'
      + '<span class="tag">' + d.full + ' 分 · ' + (byDim[k] || []).length + ' 题</span></div>'
      + '<div class="cb">' + list + '</div></div>';
  }).join('');

  document.getElementById('app').innerHTML = '<div class="shell">' + topbar('用户思维 · 认证考试') +
    '<div class="wrap"><div class="crumb"><button onclick="location.hash=\'#cert\'">认证</button><span>/</span><span>客观题考试</span></div>' +
    '<div style="max-width:820px;margin:0 auto">' +
    '<div class="exam-top"><div><b>33 题</b><span>单选 28 · 多选 3 · 判断 2</span></div>' +
    '<div><b>50 分</b><span>占总分 50%</span></div>' +
    '<div><b id="ex-clock">60:00</b><span>剩余时间</span></div></div>' +
    '<p style="font-size:12.5px;color:var(--muted);line-height:1.8;margin:12px 0 18px">' +
    '多选题必须全部选对才得分，少选或多选均为 0 分。提交后可立即看到总分与三个子项得分，' +
    '未通过可重考，取最高分。</p>' + blocks +
    '<div style="display:flex;gap:12px;margin:20px 0 50px"><button class="btn" id="sub-cert">提交试卷</button>' +
    '<button class="btn line" onclick="location.hash=\'#cert/s1\'">稍后再考</button></div>' +
    '</div></div></div>';

  bindExamOpts();
  var left = CERT_RULE.examMinutes * 60;
  clearInterval(EX.timer);
  EX.timer = setInterval(function () {
    left--;
    var m = Math.floor(left / 60), s = left % 60;
    var el = document.getElementById('ex-clock');
    if (el) el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    if (left <= 0) { clearInterval(EX.timer); toast('时间到，自动交卷'); submitCert(); }
  }, 1000);

  document.getElementById('sub-cert').onclick = function () { submitCert(); };
  window.scrollTo(0, 0);
}

function bindExamOpts() {
  document.querySelectorAll('.opts[data-gi]').forEach(function (g) {
    var gi = +g.dataset.gi, q = QUIZ.items[gi];
    g.querySelectorAll('.opt').forEach(function (el) {
      el.onclick = function () {
        var j = +el.dataset.j;
        if (q.type === 'multi') {
          el.classList.toggle('sel');
          var cur = [];
          g.querySelectorAll('.opt').forEach(function (x) { if (x.classList.contains('sel')) cur.push(+x.dataset.j); });
          EX.ans[gi] = cur;
        } else {
          g.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          el.classList.add('sel');
          EX.ans[gi] = j;
        }
      };
    });
  });
}

function submitCert() {
  var un = 0;
  QUIZ.items.forEach(function (q, i) {
    var a = EX.ans[i];
    if (q.type === 'multi' ? !a || !a.length : (a === undefined || a < 0)) un++;
  });
  if (un > 0 && !confirm('还有 ' + un + ' 题未作答，确认提交？')) return;

  var detail = [], got = 0;
  QUIZ.items.forEach(function (q, i) {
    var a = EX.ans[i], ok = false, myGot = 0;
    if (q.type === 'multi') {
      var mine = (a || []).slice().sort().join(',');
      var right = q.a.slice().sort().join(',');
      ok = mine === right; myGot = ok ? q.s : 0;
    } else {
      ok = a === q.a; myGot = ok ? q.s : 0;
    }
    got += myGot;
    detail.push({ dim: q.dim, sel: a, ok: ok, got: myGot });
  });

  var c = Cert.get();
  var best = c.exam && c.exam.got > got ? c.exam.got : got;
  Cert.patch({
    exam: {
      got: Math.round(best * 10) / 10, thisGot: Math.round(got * 10) / 10,
      full: 50, detail: detail, at: nowISO(), attempts: (c.exam ? (c.exam.attempts || 1) + 1 : 1),
      min: Math.max(1, Math.round((Date.now() - EX.t0) / 60000))
    }
  });
  clearInterval(EX.timer);
  logEvent('cert_exam_submit', 'got ' + got + '/50');
  location.hash = '#certresult';
}

      mineTxt = (d.sel && d.sel.length) ? d.sel.map(function (x) { return 'ABCDE'[x]; }).join('') : '—';
      rightTxt = q.a.map(function (x) { return 'ABCDE'[x]; }).join('');
    } else {
      mineTxt = (d.sel >= 0 && d.sel !== undefined) ? 'ABCDE'[d.sel] : '—';
      rightTxt = 'ABCDE'[q.a];
    }
    return '<div class="qr"><div class="qrt">' + (i + 1) + '. ' + esc(q.q) + '</div>'
      + '<div class="qra"><span class="' + (d.ok ? 'ok' : 'no') + '">你的答案：' + mineTxt + '</span>'
      + '<span class="ok">正确答案：' + rightTxt + '</span>'
      + '<span style="color:var(--muted)">' + (d.got || 0) + ' / ' + q.s + ' 分</span></div>'
      + '<div style="font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:8px">' + esc(q.why) + '</div></div>';
  }).join('');

  document.getElementById('app').innerHTML = '<div class="shell">' + topbar('用户思维 · 成绩') +
    '<div class="wrap"><div class="crumb"><button onclick="location.hash=\'#cert\'">认证</button><span>/</span><span>考试结果</span></div>' +
    '<div style="max-width:820px;margin:0 auto">' +
    '<div class="score-hero ' + (r.obj.got / 50 >= 0.7 ? 'pass' : 'fail') + '">' +
    '<div class="big">' + ex.thisGot + '<small> / 50</small></div>' +
    '<div class="lbl">本次客观题得分　（取最高分 ' + ex.got + ' 分，第 ' + ex.attempts + ' 次作答）</div></div>' +
    '<div class="card"><div class="ch2"><h3>子项得分</h3></div><div class="cb">' +
    Object.keys(r.obj.dims).map(function (k) {
      var d = r.obj.dims[k];
      return '<div class="dimrow"><div class="dn">' + esc(d.name) + '</div>'
        + '<div class="dbar"><i style="width:' + d.rate + '%;background:' + (d.rate >= 60 ? '#0f7b5f' : '#c0392b') + '"></i></div>'
        + '<div class="dv">' + d.got + '/' + d.full + '　' + d.rate + '%</div></div>';
    }).join('') + '</div></div>' +
    '<div class="card"><div class="ch2"><h3>逐题回顾</h3><span class="tag">红色为未得分</span></div>' +
    '<div class="cb"><div class="qreview">' + review + '</div></div></div>' +
    '<div class="btnrow">' +
    '<button class="btn line" onclick="location.hash=\'#certexam\'">再考一次</button>' +
    '<button class="btn" onclick="location.hash=\'#cert/s1\'">返回阶段认证</button></div>' +
    '</div></div></div>';
  window.scrollTo(0, 0);
}

/* ============================================================
   作品集：两件，结构化填写
   ============================================================ */
var PF = { a: [], b: { q: [], obs: [] } };

function renderPortfolio() {
  var c = Cert.get();
  var pf = c.portfolio || {};
  PF.a = (pf.a && pf.a.length === 5) ? pf.a.slice() : ['', '', '', '', ''];
  PF.b = { q: (pf.b && pf.b.q && pf.b.q.length === 3) ? pf.b.q.slice() : ['', '', ''],
           obs: (pf.b && pf.b.obs && pf.b.obs.length === 3) ? pf.b.obs.slice() : ['', '', ''] };

  var Q5 = ['谁在用', '在什么条件下', '为完成什么', '现在怎么绕过', '不做会怎样'];
  var PH = ['岗位 + 职级 + 人数（是否外包/兼职）',
            '一次观察或跟班记录：时间、场地、是否被打断',
            '他要交付的那个动作，以及截止时间',
            '具体的文件名 / 群名 / 台账名，越具体越好',
            '后果、承担者、时限'];
  var aRows = Q5.map(function (q, i) {
    return '<div class="pfr"><div class="pfl">' + (i + 1) + '. ' + q + '</div>'
      + '<textarea class="inp pft" data-k="a" data-i="' + i + '" rows="3" placeholder="' + PH[i] + '">'
      + esc(PF.a[i]) + '</textarea></div>';
  }).join('');

  var qRows = [0, 1, 2].map(function (i) {
    return '<div class="pfq"><div class="pfl">主问题 ' + (i + 1) + '（问最近一次具体事件）</div>'
      + '<textarea class="inp pft" data-k="q" data-i="' + i + '" rows="2" placeholder="例如：上一次你觉得这一步麻烦，是哪天？当时在做什么？">' + esc(PF.b.q[i]) + '</textarea>'
      + '<div class="pfl" style="margin-top:6px">配套追问（至少 2 条）</div>'
      + '<textarea class="inp pft" data-k="q2" data-i="' + i + '" rows="2" placeholder="能举个最近的例子吗 / 当时你怎么做的 / 后来怎么解决的">' + esc(PF.b.q['x' + i] || '') + '</textarea></div>';
  }).join('');

  var obsRows = [0, 1, 2].map(function (i) {
    return '<div class="pfr"><div class="pfl">第 ' + (i + 1) + ' 条记录</div>'
      + '<textarea class="inp pft" data-k="obs" data-i="' + i + '" rows="2" placeholder="格式：时间｜他在做什么（动作）｜打断或绕行（来源）">'
      + esc(PF.b.obs[i]) + '</textarea></div>';
  }).join('');

  var rev = c.review;
  var revBox = rev ? '<div class="note" style="background:#eef7f2;border-color:#bde3d2"><div class="nl" style="color:#0f7b5f">已评审：'
    + Cert.port().got + ' / 40 分</div><p>' + (rev.note ? esc(rev.note) : '评分明细见管理端。') + '</p></div>' : '';

  document.getElementById('app').innerHTML = '<div class="shell">' + topbar('用户思维 · 作品集') +
    '<div class="wrap"><div class="crumb"><button onclick="location.hash=\'#cert\'">认证</button><span>/</span><span>作品集</span></div>' +
    '<div style="max-width:820px;margin:0 auto">' +
    '<div class="hero"><h2>作品集 · 2 件 / 40 分</h2>' +
    '<p>作品集占认证总分 40%，由管理员按 4 个维度逐项评分，每项 0–5 分。两件作品都来自你手上的真实需求，' +
    '不要写课程里的示例。</p></div>' + revBox +
    '<div class="card"><div class="ch2"><h3>作品 A · 场景还原五问卡</h3><span class="tag">20 分</span></div><div class="cb">' + aRows + '</div></div>' +
    '<div class="card"><div class="ch2"><h3>作品 B · 深访提纲与观察记录</h3><span class="tag">20 分</span></div>' +
    '<div class="cb">' + qRows + '<div style="height:14px"></div>' + obsRows + '</div></div>' +
    '<div class="btnrow">' +
    '<button class="btn" id="pf-save">保存并提交</button>' +
    '<button class="btn line" onclick="location.hash=\'#cert/s1\'">返回</button></div>' +
    '</div></div></div>';

  document.querySelectorAll('.pft').forEach(function (el) {
    el.oninput = function () {
      var k = el.dataset.k, i = +el.dataset.i;
      if (k === 'a') PF.a[i] = el.value;
      else if (k === 'q') PF.b.q[i] = el.value;
      else if (k === 'q2') PF.b.q['x' + i] = el.value;
      else if (k === 'obs') PF.b.obs[i] = el.value;
    };
  });

  document.getElementById('pf-save').onclick = function () {
    var emptyA = PF.a.filter(function (x) { return !x.trim(); }).length;
    var emptyB = PF.b.q.filter(function (x) { return !x.trim(); }).length
      + PF.b.obs.filter(function (x) { return !x.trim(); }).length;
    if (emptyA || emptyB) {
      if (!confirm('还有 ' + (emptyA + emptyB) + ' 项没填，提交后管理员会按空缺评分。仍要提交？')) return;
    }
    Cert.patch({ portfolio: { a: PF.a, b: PF.b, at: nowISO() }, review: null });
    logEvent('portfolio_submit');
    toast('已提交，等待管理员评审');
    setTimeout(function () { location.hash = '#cert/s1'; }, 600);
  };
  window.scrollTo(0, 0);
}
