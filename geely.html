<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b4f8a'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' fill='%23fff' text-anchor='middle'%3E用%3C/text%3E%3C/svg%3E">
<title>用户思维 · 吉利汽车产品经理能力培养与认证项目</title>
<style>
:root{
  --pri:#1b4f8a; --deep:#10243d; --ink:#1a1a1a; --mid:#3d4c5c; --muted:#5c6670;
  --soft:#8b96a3; --line:#dfe5ec; --bg:#f4f7fb; --white:#fff;
  --tint:#eef4fb; --tint2:#f8fafd; --accent:#c8102e; --ok:#0f7b5f; --warn:#b26a00;
  --r:10px; --sh:0 1px 2px rgba(16,36,61,.06),0 4px 16px rgba(16,36,61,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,select{font-family:inherit;font-size:inherit}
a{color:var(--pri);text-decoration:none}
.hide{display:none!important}

/* ---------- 登录 ---------- */
#login{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:34px 26px;overflow:hidden;color:#fff;
  background:
    radial-gradient(920px 540px at 4% -16%,#123353 0%,rgba(18,51,83,0) 62%),
    radial-gradient(860px 500px at 104% 110%,#17477c 0%,rgba(23,71,124,0) 58%),
    linear-gradient(150deg,#071a2c 0%,#0c2440 46%,#123a61 100%)}
#login:before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(120% 92% at 18% 26%,#000 8%,transparent 76%);
  mask-image:radial-gradient(120% 92% at 18% 26%,#000 8%,transparent 76%)}
.lg-wrap{position:relative;z-index:1;width:100%;max-width:1180px;
  height:min(820px,calc(100vh - 62px));min-height:520px;
  display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:stretch}

/* 左：字 + 钢笔画同处一块封面区（画在字后当底图） */
.lg-hero{position:relative;display:flex;flex-direction:column;justify-content:center;
  padding-right:66px;overflow:hidden}
.lg-hero-in{position:relative;z-index:2;max-width:430px;
  text-shadow:0 2px 18px rgba(6,22,38,.85)}
.lg-proj{font-size:11.5px;line-height:1.75;letter-spacing:.05em;color:#93b7d8;
  display:flex;align-items:flex-start;gap:10px;max-width:340px}
.lg-proj:before{content:'';width:22px;height:1px;background:#4f8dc9;flex:0 0 22px;margin-top:10px}
.lg-title{font-size:62px;font-weight:600;letter-spacing:.1em;line-height:1.12;margin-top:20px;
  text-shadow:0 6px 40px rgba(6,22,38,.7)}
.lg-sub{margin-top:14px;font-size:13px;color:#9fbdd8;line-height:1.8;letter-spacing:.03em;max-width:300px}
.lg-credit{margin-top:44px;padding-top:24px;border-top:1px solid rgba(255,255,255,.13);
  display:flex;flex-direction:column;gap:9px;max-width:330px}
.lg-credit div{display:flex;align-items:baseline;gap:12px;font-size:11.5px;line-height:1.6}
.lg-credit b{flex:0 0 56px;color:#7ba1c4;font-weight:400;letter-spacing:.08em}
.lg-credit span{color:#c3d9ed;letter-spacing:.02em}

/* 纲笔画：靠封面区右侧当背景，左侧淡出给文字让位 */
.lg-art{position:absolute;inset:0 14px 0 0;z-index:1;display:flex;align-items:center;justify-content:flex-end;
  overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 4%,rgba(0,0,0,.34) 30%,#000 58%);
  mask-image:linear-gradient(90deg,transparent 4%,rgba(0,0,0,.34) 30%,#000 58%)}
.lg-art img{height:90%;width:auto;max-width:none;display:block;opacity:.55;
  transform:translateY(-1.5%);
  filter:drop-shadow(0 12px 44px rgba(88,150,212,.18))}

/* 右：登录卡（跟封面区用一条竖线硬分界） */
.lg-form{position:relative;display:flex;align-items:center;justify-content:center;padding-left:0}
.lg-form:before{content:'';position:absolute;left:0;top:5%;bottom:5%;width:1px;z-index:1;
  background:linear-gradient(180deg,rgba(150,200,244,0),rgba(150,200,244,.55) 12%,
    rgba(150,200,244,.55) 88%,rgba(150,200,244,0))}
.lg-form-in{width:100%;max-width:330px;padding:34px 32px 28px;border-radius:16px;
  background:linear-gradient(180deg,rgba(9,31,53,.72) 0%,rgba(8,26,45,.5) 100%);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 30px 70px -28px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lg-form h2{font-size:19px;font-weight:500;color:#fff;letter-spacing:.07em}
.lg-hint{font-size:12px;color:#7fa0bd;line-height:1.75;margin:9px 0 26px}
#login .field label{color:#8bacc9}
#login .field input{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.15);color:#fff}
#login .field input::placeholder{color:#5b7b98}
#login .field input:focus{background:rgba(255,255,255,.09);border-color:#5c9ad8;
  box-shadow:0 0 0 3px rgba(92,154,216,.16)}
#login .field input:-webkit-autofill,#login .field input:-webkit-autofill:focus{
  -webkit-text-fill-color:#fff;transition:background-color 9999s ease-in-out 0s}
#login .lg-btn{height:46px;font-size:14.5px;letter-spacing:.16em;margin-top:10px;
  background:#fff;color:#0b243c;font-weight:500}
#login .lg-btn:hover{background:#e6f1fb}
#login .lg-btn:disabled{background:rgba(255,255,255,.55);color:#0b243c}
.lg-tip{margin-top:24px;font-size:11px;color:#6a8aa7;line-height:1.9;letter-spacing:.02em}
.login-err{font-size:12px;color:#ffc9c4;background:rgba(226,75,74,.14);
  border:1px solid rgba(226,75,74,.32);border-radius:8px;padding:8px 11px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mid);margin-bottom:6px;font-weight:500}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 13px;background:#fbfcfe;transition:.15s}
.field input:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(27,79,138,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;
  border-radius:8px;background:var(--pri);color:#fff;font-weight:500;transition:.15s;width:100%}
.btn:hover{background:#173f6e}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.line{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.line:hover{background:var(--tint)}
.btn.sm{height:34px;padding:0 13px;font-size:13px;width:auto;border-radius:7px}
.btn.gray{background:#eef1f5;color:var(--mid)}
.btn.danger{background:#fdecee;color:var(--accent)}
.login-err{background:#fdecee;color:var(--accent);font-size:13px;padding:9px 12px;border-radius:7px;margin-bottom:12px}
.login-tip{font-size:11.5px;color:var(--soft);text-align:center;margin-top:18px;line-height:1.85}

/* ---------- 个人中心 ---------- */
.me-hd{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.me-av{width:54px;height:54px;border-radius:50%;background:linear-gradient(140deg,#1b4f8a,#0a3d91);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex:0 0 54px}
.me-id{flex:1;min-width:0}
.me-id h2{font-size:19px;color:var(--deep)}
.me-id p{font-size:12.5px;color:var(--muted);margin-top:3px}
.me-go{flex:0 0 auto}
.plan-bar{height:9px;background:#eef1f6;border-radius:5px;overflow:hidden;margin-bottom:16px}
.plan-bar i{display:block;height:100%;background:linear-gradient(90deg,#1b4f8a,#4a9fe0);border-radius:5px;transition:width .4s}
.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.plan-grid div{background:#f7f9fc;border-radius:9px;padding:12px 14px}
.plan-grid b{display:block;font-size:19px;color:var(--pri);font-weight:600}
.plan-grid span{display:block;font-size:11.5px;color:var(--soft);margin-top:2px}
.plan-next{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.plan-next>div{flex:1;min-width:0}
.plan-next b{font-size:12px;color:var(--soft);font-weight:500}
.plan-next p{font-size:13.5px;color:var(--deep);margin-top:3px;line-height:1.6}
.me-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.mrow+.mrow{border-top:1px solid #f1f4f8}
.mn{flex:0 0 156px;font-size:13px;color:var(--deep)}
.mb{flex:1;height:7px;background:#eef1f6;border-radius:4px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--pri);border-radius:4px}
.mv{flex:0 0 auto;font-size:11.5px;color:var(--soft)}
.me-score{display:flex;align-items:baseline;gap:6px}
.me-score b{font-size:32px;color:var(--pri);font-weight:700;line-height:1}
.me-score span{font-size:12px;color:var(--soft)}
.chiprow{margin-left:auto;display:flex;gap:4px}
.me-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
.rrow{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:13px}
.rrow+.rrow{border-top:1px solid #f4f6f9}
.rrow:hover{background:#f8fafd}
.rdot{width:7px;height:7px;border-radius:50%;background:#c9d3df;flex:0 0 7px}
.rdot.ok{background:var(--ok)}
.rt{flex:0 0 44px;color:var(--soft);font-size:12px}
.rn{flex:1;min-width:0;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{flex:0 0 auto;color:var(--muted);font-size:11.5px}
.rwhen{flex:0 0 auto;color:var(--soft);font-size:11.5px;min-width:56px;text-align:right}
.sitem.lock{opacity:.55;cursor:not-allowed}
.sitem.lock .lk{font-size:11px}

/* ---------- 通用外壳 ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:0;z-index:50;height:56px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px}
.topbar .brand{font-weight:600;font-size:15px;color:var(--deep);white-space:nowrap}
.topbar .brand span{color:var(--soft);font-weight:400;font-size:12.5px;margin-left:8px}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mid)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--pri);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.crumb{font-size:13px;color:var(--soft);margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb button{color:var(--pri);font-size:13px}
.crumb button:hover{text-decoration:underline}

/* ---------- 课程卡 ---------- */
.hero{background:linear-gradient(120deg,#10243d,#1b4f8a);border-radius:14px;padding:26px 28px;color:#fff;margin-bottom:22px}
.hero h2{font-size:22px;font-weight:600;margin-bottom:8px}
.hero p{font-size:13.5px;color:#c5d6e8;line-height:1.75;max-width:760px}
.hero .meta{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;font-size:12.5px;color:#a8c2dc}
.hero .meta b{color:#fff;font-weight:600}
/* 开篇导学：首页入口条 + 导学页三块要点 */
.intro-bar{display:flex;align-items:center;gap:14px;background:linear-gradient(96deg,#edf4fd,#f8fbff);
  border:1px solid #dbe7f6;border-radius:14px;padding:15px 20px;margin-bottom:18px;cursor:pointer;transition:.18s}
.intro-bar:hover{border-color:#b9d4ee;box-shadow:0 6px 20px rgba(16,36,61,.07)}
.ib-ic{flex:0 0 38px;height:38px;border-radius:10px;background:#1b4f8a;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.ib-t{flex:1;min-width:0}
.ib-t b{display:block;font-size:14.5px;color:var(--deep);font-weight:600;margin-bottom:3px}
.ib-t p{font-size:12.5px;color:var(--mid);line-height:1.6}
.ib-go{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--pri)}
.intro-bar.done .ib-ic{background:#2e7d5b}
.intro-bar.done .ib-go{color:var(--soft)}
/* 必修未完成的强调：左侧橙条 + 橙色图标 */
.intro-bar.need{border-color:#f0d6ae;background:linear-gradient(96deg,#fff9ee,#fffdf9);
  box-shadow:0 2px 12px rgba(184,113,26,.08)}
.intro-bar.need:hover{border-color:#e6c185;box-shadow:0 6px 20px rgba(184,113,26,.14)}
.intro-bar.need .ib-ic{background:linear-gradient(140deg,#d9962f,#b8711a)}
/* 导学页里的收听进度条 */
.ib-prog{display:flex;align-items:center;gap:12px;margin:18px 0 4px;padding:12px 16px;
  background:#f7fafd;border:1px solid #e6eef7;border-radius:11px;
  font-size:12.5px;color:var(--mid);flex-wrap:wrap}
.ibp-cap{flex:0 0 auto;font-size:12px;color:var(--soft);font-weight:400;letter-spacing:.02em}
.ibp-bar{position:relative;flex:1;min-width:120px;height:8px;border-radius:99px;background:#e3ebf5;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(16,36,61,.07)}
/* 80% 处标一条刻度，让人知道"还差多少" */
.ibp-bar:after{content:'';position:absolute;left:80%;top:-1px;bottom:-1px;width:1px;
  background:rgba(184,113,26,.5);box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.ibp-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#d9962f,#e6b45c);transition:width .3s}
.ib-prog.ok{color:#2e7d5b;background:#f4fbf7;border-color:#dcefe4}
.ib-prog.ok .ibp-bar i{background:linear-gradient(90deg,#2e7d5b,#4aa87c)}
.ibp-txt{flex:0 0 auto;font-weight:500}
.intro-pts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 4px}
.intro-pts>div{background:#f6f9fd;border:1px solid #e6eef7;border-radius:11px;padding:14px 16px}
.intro-pts b{display:block;font-size:13px;color:var(--deep);margin-bottom:6px}
.intro-pts p{font-size:12.5px;color:var(--mid);line-height:1.72}

.mod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.mod-card{background:#fff;border-radius:14px;padding:22px;box-shadow:var(--sh);border:1px solid #edf1f6;
  display:flex;flex-direction:column;transition:.18s}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(16,36,61,.1)}
/* 未上线模块：灰显但信息完整，不做 hover 抬升，避免被误认为可点 */
.mod-card.lock{background:#fafbfd;border-color:#eef1f6;box-shadow:none}
.mod-card.lock:hover{transform:none;box-shadow:none}
.mod-card.lock .no{color:#9aa9b9}
.mod-card.lock h3{color:#5d7185}
.mod-card.lock .desc{color:#8b9bad}
.mod-card.lock .prog-bar{background:#edf0f4}
.mod-card.lock .btn{cursor:not-allowed}
.mod-card .no{font-size:11.5px;font-weight:600;color:var(--pri);letter-spacing:.1em;margin-bottom:8px}
.mod-card h3{font-size:18px;font-weight:600;color:var(--deep);margin-bottom:8px}
.mod-card .desc{font-size:13px;color:var(--mid);line-height:1.72;flex:1}
.mod-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--pri)}
.tag.gray{background:#f0f2f5;color:var(--muted)}
.prog-wrap{margin:14px 0 6px}
.prog-bar{height:6px;background:#e9eef4;border-radius:3px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#1b4f8a,#3f7fc4);border-radius:3px;transition:width .4s}
.prog-txt{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px}
.mod-actions{display:flex;gap:10px;margin-top:14px}
.mod-actions .btn{flex:1}

/* ---------- 学习页 ---------- */
.learn{display:grid;grid-template-columns:246px 1fr;gap:22px;align-items:start}
.sidelist{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;position:sticky;top:74px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.sidelist .hd{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--deep);display:flex;justify-content:space-between;align-items:center}
.sidelist .hd small{font-weight:400;color:var(--soft);font-size:11.5px}
.sidelist .list{overflow-y:auto;flex:1;padding:6px}
.sitem{display:flex;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;align-items:flex-start;transition:.13s}
.sitem:hover{background:var(--tint2)}
.sitem.on{background:var(--tint)}
.sitem .sn{width:20px;height:20px;border-radius:50%;background:#e9eef4;color:var(--soft);font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:0 0 20px;margin-top:2px;font-weight:600}
.sitem.done .sn{background:#e3f3ec;color:var(--ok)}
.sitem.on .sn{background:var(--pri);color:#fff}
.sitem .st{font-size:12.5px;line-height:1.5;color:var(--mid)}
.sitem.on .st{color:var(--deep);font-weight:500}
.sitem .sm{font-size:11px;color:var(--soft);margin-top:2px}

.panel{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;min-height:520px;display:flex;flex-direction:column}
.panel .ph{padding:22px 28px 16px;border-bottom:1px solid #f0f3f7}
.panel .ph .k{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.06em;margin-bottom:8px}
.panel .ph h2{font-size:21px;line-height:1.45;font-weight:600;color:var(--deep)}
.panel .pb{padding:24px 28px;flex:1}
.panel .pf{padding:14px 28px;border-top:1px solid #f0f3f7;display:flex;align-items:center;gap:12px;background:#fbfcfe}
.panel .pf .spacer{flex:1}
.pg-ind{font-size:12.5px;color:var(--soft)}

/* 内容页版式 */
.hook{background:var(--tint);border-left:4px solid var(--pri);border-radius:0 8px 8px 0;padding:16px 20px;margin-bottom:22px}
.hook .lab{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.hook p{font-size:15.5px;color:var(--deep);font-weight:500;line-height:1.6}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.goal{border-top:2px solid var(--line);padding-top:10px}
.goal .gno{font-size:11px;color:var(--pri);font-weight:700;margin-bottom:5px}
.goal p{font-size:13.5px;color:var(--mid);line-height:1.65}

.cpage h3{font-size:19px;font-weight:600;color:var(--deep);line-height:1.5;margin-bottom:8px}
.cpage .lead{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f0f3f7}
.mcards{display:grid;gap:12px}
.mcards.c2{grid-template-columns:1fr 1fr}
.mcards.c3{grid-template-columns:repeat(3,1fr)}
.mcards.c4{grid-template-columns:repeat(2,1fr)}
.mcard{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:#fff;position:relative;overflow:hidden}
.mcard:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--pri)}
.mcard .n{font-size:11px;color:#b9c6d4;font-weight:700;letter-spacing:.06em;margin-bottom:7px}
.mcard h4{font-size:14.5px;font-weight:600;color:var(--pri);margin-bottom:8px;line-height:1.45}
.mcard p{font-size:13px;color:var(--muted);line-height:1.72}

.steps{display:flex;flex-direction:column;gap:9px}
.mstep{display:flex;gap:14px;border:1px solid var(--line);border-radius:9px;padding:13px 16px;background:#fff;align-items:flex-start}
.mstep .sn{font-size:13px;font-weight:700;color:var(--pri);flex:0 0 26px;padding-top:1px}
.mstep .sc h4{font-size:14px;font-weight:600;color:var(--deep);margin-bottom:4px}
.mstep .sc p{font-size:12.8px;color:var(--muted);line-height:1.65}

.mtable{width:100%;border-collapse:collapse;font-size:12.8px}
.mtable th{background:var(--pri);color:#fff;padding:9px 11px;text-align:left;font-weight:500;font-size:12.5px}
.mtable th:first-child{border-radius:7px 0 0 0}
.mtable th:last-child{border-radius:0 7px 0 0}
.mtable td{border-bottom:1px solid #eef1f5;padding:10px 11px;color:var(--muted);line-height:1.6;vertical-align:top}
.mtable tr:nth-child(even) td{background:#fafbfd}
.mtable td:first-child{color:var(--deep);font-weight:500}

.bands{display:flex;flex-direction:column;gap:9px}
.band{border-radius:9px;padding:14px 18px;display:flex;gap:16px;align-items:flex-start;border:1px solid}
.band .bn{font-size:13px;font-weight:700;flex:0 0 64px;padding-top:1px}
.band p{font-size:13px;line-height:1.68;color:var(--mid)}

.mcompare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ccol{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ccol .ch{padding:11px 16px;font-size:13.5px;font-weight:600;color:#fff}
.ccol.good .ch{background:var(--pri)}
.ccol.bad .ch{background:#6b7785}
.ccol ul{list-style:none;padding:12px 16px}
.ccol li{position:relative;padding-left:16px;font-size:12.8px;color:var(--mid);line-height:1.65;margin-bottom:9px}
.ccol li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--pri)}

.note{background:#fbfaf6;border:1px solid #efe9d9;border-radius:9px;padding:15px 18px;margin-top:16px}
.note .nl{font-size:11.5px;font-weight:600;color:#8a6d2f;letter-spacing:.05em;margin-bottom:7px}
.note p{font-size:13px;color:#5c5340;line-height:1.75;white-space:pre-wrap}

.case{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff}
.case .cd{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.05em}
.case h3{font-size:19px;font-weight:600;color:var(--deep);margin:8px 0 16px;line-height:1.45}
.case .cs{font-size:13.5px;color:var(--mid);line-height:1.8;white-space:pre-wrap}
.case .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.case .stat{background:var(--tint2);border:1px solid var(--line);border-radius:9px;padding:12px}
.case .stat b{display:block;font-size:20px;color:var(--pri);font-weight:600;line-height:1.2}
.case .stat span{font-size:11.5px;color:var(--soft);display:block;margin-top:4px}
.case .flip{background:var(--tint);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin-top:16px}
.case .flip .fl{font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px}
.case .flip p{font-size:13px;color:var(--mid);line-height:1.72}
.case .wrong{font-size:12.5px;color:var(--soft);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.case .wrong b{color:var(--muted);font-weight:500}

/* 答题 */
.qbox{background:#fbfcfe;border:1px solid #e6ecf3;border-radius:12px;padding:22px}
.qbox .qh{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.05em;margin-bottom:12px}
.qbox .qt{font-size:15.5px;color:var(--deep);font-weight:500;line-height:1.65;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff;
  cursor:pointer;transition:.13s;align-items:flex-start}
.opt:hover{border-color:#b9cde3;background:#fbfdff}
.opt .ol{width:24px;height:24px;border-radius:6px;background:var(--tint);color:var(--pri);font-size:12px;
  font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.opt .ot{font-size:13.5px;line-height:1.6;color:var(--ink);padding-top:1px}
.opt.sel{border-color:var(--pri);background:var(--tint)}
.opt.sel .ol{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:#eefaf5}
.opt.right .ol{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--accent);background:#fdeef0}
.opt.wrong .ol{background:var(--accent);color:#fff}

/* 随堂练习（视频下方直接作答） */
.pq{margin-top:24px;border:1px solid #e4ebf3;border-radius:14px;background:#fff;overflow:hidden}
.pqh{display:flex;gap:16px;align-items:flex-start;padding:20px 22px 18px;border-bottom:1px solid #eef2f7;
  background:linear-gradient(180deg,#f7fafd,#fff)}
.pqh-l{flex:1;min-width:0}
.pqh .k{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.pqh h3{font-size:17px;color:var(--deep);font-weight:600;line-height:1.5}
.pqh p{font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:6px}
.pqtag{flex:none;font-size:11.5px;font-weight:600;color:var(--pri);background:var(--tint);
  border:1px solid #d6e4f2;border-radius:99px;padding:5px 12px;white-space:nowrap}
.pqtag.ok{color:var(--ok);background:#eaf7f2;border-color:#c9e8dd}
.pqi{padding:20px 22px;border-bottom:1px solid #f2f5f9}
.pqi:last-of-type{border-bottom:0}
.pqi.ok{background:#fcfffd}
.pqq{display:flex;gap:9px;align-items:flex-start;margin-bottom:12px}
.pqq .qn{flex:none;font-size:11.5px;font-weight:700;color:var(--pri);background:var(--tint);
  border-radius:5px;padding:2px 6px;margin-top:2px}
.pqq .qtx{flex:1;font-size:14.5px;color:var(--deep);font-weight:500;line-height:1.7}
.pqm{flex:none;font-size:12px;font-weight:700;border-radius:5px;padding:2px 7px;margin-top:2px}
.pqm.ok{color:var(--ok);background:#eaf7f2}
.pqm.no{color:var(--accent);background:#fdeef0}
.pqi .opts{gap:7px}
.pqx{margin-top:12px;font-size:12.8px;line-height:1.8;color:var(--mid);background:#f6f9fc;
  border-left:3px solid #cfdcea;border-radius:0 8px 8px 0;padding:10px 13px}
.pqx b{display:block;font-size:11.5px;color:var(--pri);letter-spacing:.04em;margin-bottom:4px}
.pqx.bad{border-left-color:#e8b4bc;background:#fdf6f7}
.pqx.bad b{color:var(--accent)}
.pqf{display:flex;align-items:center;gap:12px;padding:16px 22px;background:#fbfcfe;border-top:1px solid #eef2f7;flex-wrap:wrap}
.pqf .spacer{flex:1}
.pqcnt{font-size:12.5px;color:var(--muted)}
.pqscore{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pqscore b{font-size:26px;line-height:1;color:var(--pri);font-variant-numeric:tabular-nums}
.pqscore.ok b{color:var(--ok)}
.pqscore.no b{color:var(--accent)}
.pqscore span{font-size:12.5px;color:var(--muted)}
.pqscore em{font-size:12.5px;color:var(--mid);font-style:normal;margin-left:8px}
.opt.lock{cursor:default}
.explain{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 17px}
.explain .el{font-size:11.5px;font-weight:600;color:var(--ok);margin-bottom:6px}
.explain p{font-size:13px;color:var(--mid);line-height:1.72}
.explain.bad .el{color:var(--accent)}

/* 成绩单 */
.score-hero{text-align:center;padding:34px 20px;background:linear-gradient(130deg,#10243d,#1b4f8a);border-radius:14px;color:#fff;margin-bottom:20px}
.score-hero .big{font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em}
.score-hero .big small{font-size:18px;font-weight:400;color:#a8c2dc}
.score-hero .lbl{font-size:13px;color:#c5d6e8;margin-top:10px}
.score-hero.pass{background:linear-gradient(130deg,#0b4a3a,#0f7b5f)}
.score-hero.fail{background:linear-gradient(130deg,#5a1520,#a3283c)}
.qreview{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.qr{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:#fff}
.qr .qrt{font-size:13.5px;color:var(--deep);line-height:1.6;margin-bottom:8px;font-weight:500}
.qr .qra{font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
.qr .qra span.ok{color:var(--ok)}
.qr .qra span.no{color:var(--accent)}

/* ---------- 管理端 ---------- */
.mtabs{display:flex;gap:4px;background:#fff;border-radius:10px;padding:5px;border:1px solid #edf1f6;margin-bottom:20px;overflow-x:auto}
.mtab{padding:9px 16px;border-radius:7px;font-size:13.5px;color:var(--mid);white-space:nowrap;transition:.13s}
.mtab:hover{background:var(--tint2)}
.mtab.on{background:var(--pri);color:#fff;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:18px;border:1px solid #edf1f6}
.kpi .kl{font-size:12px;color:var(--soft);margin-bottom:8px}
.kpi .kv{font-size:26px;font-weight:600;color:var(--deep);line-height:1.1}
.kpi .kv small{font-size:13px;font-weight:400;color:var(--soft)}
.kpi .ks{font-size:11.5px;color:var(--soft);margin-top:6px}
.card{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;margin-bottom:18px}
.card .ch2{padding:15px 20px;border-bottom:1px solid #f0f3f7;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card .ch2 h3{font-size:15px;font-weight:600;color:var(--deep)}
.card .ch2 .spacer{flex:1}
.card .cb{padding:18px 20px}
.card .cb.p0{padding:0}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:#f7f9fc;padding:11px 14px;text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:11px 14px;border-bottom:1px solid #f3f6f9;color:var(--mid);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:#fbfcfe}
.dt .nm{color:var(--deep);font-weight:500}
.rank{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;background:#f0f3f7;color:var(--muted)}
.rank.r1{background:#fdf3d7;color:#8a6d12}
.rank.r2{background:#eef0f4;color:#5c6670}
.rank.r3{background:#f7ece3;color:#8a5a33}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--tint);color:var(--pri)}
.pill.ok{background:#e6f6ef;color:var(--ok)}
.pill.no{background:#fdeef0;color:var(--accent)}
.pill.warn{background:#fdf4e3;color:var(--warn)}
.pill.gray{background:#f0f2f5;color:var(--muted)}
/* ---- 客户试听 · 题库查阅 ---- */
.bk-hd{padding:6px 2px 18px}
.bk-hd h2{font-size:22px;font-weight:600;color:var(--deep)}
.bk-hd p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.8}
.bk-stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.bk-stat span{font-size:12.5px;color:var(--mid);background:#fff;border:1px solid #edf1f6;border-radius:8px;padding:7px 13px}
.bk-stat b{color:var(--pri);font-size:15px;margin-right:4px}
details.bk-g{border-bottom:1px solid #eef1f5}
details.bk-g:last-child{border-bottom:none}
details.bk-g>summary{padding:15px 2px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--deep);
  list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.bk-g>summary::-webkit-details-marker{display:none}
details.bk-g>summary .arw{color:var(--soft);font-size:12px;transition:transform .15s}
details.bk-g[open]>summary .arw{transform:rotate(90deg)}
.bk-body{padding:2px 0 12px}
.bk-sec{font-size:12.5px;color:var(--soft);font-weight:600;margin:18px 0 4px;padding:6px 11px;background:#f5f8fb;border-radius:6px}
.bk-q{padding:15px 2px;border-bottom:1px solid #f2f5f8}
.bk-q:last-child{border-bottom:none}
.bk-qt{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--deep);line-height:1.7;margin-bottom:11px;font-weight:500}
.bk-no{color:var(--soft);font-weight:400;flex:none;font-variant-numeric:tabular-nums}
.bk-tag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:#eef3fa;color:var(--pri);font-weight:500;flex:none}
.bk-tag.judge{background:#fdf4e3;color:var(--warn)}
.bk-key{color:var(--ok);font-weight:500;font-size:12px}
.bk-why{font-size:12.5px;color:var(--muted);background:#fbfaf6;border-left:3px solid #d9c48a;
  padding:9px 13px;border-radius:0 6px 6px 0;line-height:1.75;margin-top:10px}
.bk-why b{color:var(--warn);margin-right:8px}
.bar-mini{height:5px;background:#eef1f5;border-radius:3px;overflow:hidden;min-width:60px}
.bar-mini i{display:block;height:100%;background:var(--pri);border-radius:3px}
.sbar{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sbar:last-child{border-bottom:none}
.sbar b{font-size:12px;color:var(--pri);width:46px;flex:0 0 46px}
.sbar span{font-size:13px;color:var(--deep);width:118px;flex:0 0 118px}
.sbar .sbar-p{flex:1;height:7px;background:#eef1f5;border-radius:4px;overflow:hidden;min-width:80px}
.sbar .sbar-p i{display:block;height:100%;background:var(--ok);border-radius:4px}
.sbar em{font-style:normal;font-size:12px;color:var(--muted);width:132px;flex:0 0 132px;text-align:right}
.sbar.off{opacity:.6}
.sbar.off i{font-style:normal;font-size:12px;color:var(--soft);margin-left:auto}
.empty{text-align:center;padding:44px 20px;color:var(--soft);font-size:13.5px;line-height:1.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.inp{height:38px;border:1px solid var(--line);border-radius:7px;padding:0 11px;background:#fff;font-size:13.5px;width:100%}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px rgba(27,79,138,.1)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form-grid .fi label{display:block;font-size:12px;color:var(--mid);margin-bottom:5px}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(16,36,61,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.dlg{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.dlg .dh{padding:20px 24px 14px;border-bottom:1px solid #f0f3f7}
.dlg .dh h3{font-size:17px;font-weight:600;color:var(--deep)}
.dlg .dh p{font-size:12.5px;color:var(--soft);margin-top:5px}
.dlg .db{padding:20px 24px}
.dlg .df{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end}
.dlg .df .btn{width:auto;min-width:88px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(16,36,61,.94);color:#fff;
  padding:11px 20px;border-radius:9px;font-size:13.5px;z-index:400;box-shadow:0 8px 26px rgba(0,0,0,.24);
  opacity:0;transition:.24s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;bottom:40px}

/* 中等屏：缩封面区，线与字仍在一起 */
@media (max-width:1080px){
  .lg-wrap{grid-template-columns:minmax(0,1fr) 344px;max-width:900px}
  .lg-hero{padding-right:20px}
  .lg-hero-in{max-width:310px}
  .lg-art{inset:0 -14px 0 0;
    -webkit-mask-image:linear-gradient(90deg,transparent 24%,rgba(0,0,0,.22) 54%,#000 84%);
    mask-image:linear-gradient(90deg,transparent 24%,rgba(0,0,0,.22) 54%,#000 84%)}
  .lg-art img{height:64%;opacity:.26}
  .lg-title{font-size:46px}
  .lg-sub{max-width:250px}
  .lg-credit{margin-top:30px;max-width:280px}
  .lg-form-in{max-width:302px;padding:28px 24px 24px}
}
@media (max-width:860px){
  .ea{flex-direction:column;align-items:stretch;gap:12px;padding:14px 14px}
  .ea-b{margin-left:0}
  .ea-b .btn{flex:1}
  .qz-hd{flex-wrap:wrap;gap:10px}
  .qz-hl h2{font-size:20px}
  .qz-clock{font-size:19px;padding:8px 14px;margin-left:0}
  .qzi{padding:15px 15px;border-radius:10px}
  .qz-q .qtx{font-size:14.5px}
  .qzi .ot{font-size:13.5px}
  .qz-foot{position:static;padding:13px 14px;margin-bottom:30px}
  .qz-foot .btn{flex:1}
  #login{padding:26px 20px;align-items:flex-start}
  .lg-wrap{grid-template-columns:1fr;height:auto;min-height:0;max-width:440px;gap:0}
  .lg-hero{padding:6px 0 24px;overflow:visible}
  .lg-hero:before{display:none}
  .lg-hero-in{max-width:none}
  .lg-art{display:none}
  .lg-title{font-size:38px;margin-top:14px}
  .lg-sub{font-size:12.5px;margin-top:9px;max-width:250px}
  .lg-credit{margin-top:24px;padding-top:18px;gap:8px}
  .lg-credit div{font-size:11px}
  .lg-credit b{flex:0 0 52px}
  .lg-form{padding-left:0;padding-top:22px}
  .lg-form:before{left:0;right:0;top:0;bottom:auto;width:auto;height:1px;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22) 20%,
      rgba(255,255,255,.22) 80%,rgba(255,255,255,0))}
  .lg-form-in{max-width:none;padding:22px 20px 20px;border-radius:14px}
  .me-two{grid-template-columns:1fr}
  .intro-bar{padding:12px 14px;gap:10px;margin-bottom:14px}
  .ib-ic{flex:0 0 32px;height:32px;font-size:13px;border-radius:9px}
  .ib-t b{font-size:13.5px}
  .ib-t p{font-size:11.5px}
  .ib-go{font-size:12px;white-space:nowrap}
  .intro-pts{grid-template-columns:1fr;gap:9px}
  .plan-grid{grid-template-columns:1fr 1fr;gap:9px}
  .me-hd{flex-wrap:wrap;padding:15px 15px}
  .mn{flex:0 0 104px;font-size:12.5px}
  .rrow .rs{display:none}
  .rwhen{min-width:46px}
  .lg-form h2{font-size:18px}
  .lg-hint{margin-bottom:18px}
  .learn{grid-template-columns:1fr}
  .sidelist{position:static;max-height:none;margin-bottom:12px}
  .sidelist .hd{cursor:pointer}
  .sidelist .list{max-height:0;overflow:hidden;transition:max-height .22s ease}
  .sidelist.open .list{max-height:300px;overflow-y:auto}
  .sidelist .hd .tg{font-size:11.5px;color:var(--pri);font-weight:500}
  .mcards.c3,.mcards.c2,.mcards.c4{grid-template-columns:1fr}
  .mcompare{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .case .stats{grid-template-columns:1fr}
  .wrap{padding:16px 13px 50px}
  .panel .ph,.panel .pb,.panel .pf{padding-left:17px;padding-right:17px}
  .topbar{padding:0 13px;gap:8px}
  .topbar .brand{font-size:14px;white-space:nowrap}
  .topbar .brand span{display:none}
  .topbar .who span{display:none}
  .topbar .btn.sm{white-space:nowrap;flex:0 0 auto}
  .hero{padding:20px}
  .hero h2{font-size:19px}
  .score-hero .big{font-size:42px}
  .kpis{grid-template-columns:1fr 1fr}

.ea{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;

/* .btn 全局 width:100%（为了表单整行按钮），在横向按钮组里必须收回，否则每个按钮独占一行 */
.ea-b .btn{width:auto;min-width:132px}

.qz-page{max-width:880px;margin:0 auto}

.qz-score.ok b{color:var(--ok)}
.qz-score.no b{color:var(--accent)}
.qz-score span{font-size:12.5px;color:var(--muted);margin-left:5px}
.qz-score em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px}

/* 窄屏底部条：必须放在上面 .qz-foot .btn 之后才能覆盖，

}

.pl-top{display:flex;align-items:center;gap:12px;padding:9px 14px 0}

/* 全屏态：只留画面 / 字幕 / 控制条，16:9 居中，其余区域压黑 */
.player:fullscreen,.player:-webkit-full-screen{margin:0;border-radius:0;width:100vw;height:100vh;

.exam-top b{display:block;font-size:18px;color:var(--pri);font-variant-numeric:tabular-nums}

.stag-dim.off{background:#f6f7f9;color:var(--soft)}
.sc-ft{display:flex;align-items:center;gap:10px;margin-top:15px}

.dim-group:last-child{margin-bottom:0}

  border-bottom:1px solid var(--line);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.dg-hd span{font-size:10.5px;font-weight:400;color:var(--soft);background:#f2f4f7;
  border-radius:4px;padding:1px 6px}
.dimrow .dn small{display:block;font-size:10.5px;color:var(--soft);font-weight:400;margin-top:1px}
.dimrow.dw .dn{width:186px;flex:0 0 186px}
.dimrow.dw .dbar{height:7px}

.dscope{font-size:11px;color:var(--soft);margin:-4px 0 11px 198px;line-height:1.65}

/* ---------- 阶段证书 ---------- */
.cert-tools{display:flex;gap:10px;justify-content:flex-end;margin:0 0 14px}

  border-radius:6px;padding:46px 54px 40px;box-shadow:0 6px 30px rgba(16,36,61,.1);

.cd-kind{font-size:12px;color:var(--pri);font-weight:600;letter-spacing:.2em;white-space:nowrap;flex:0 0 auto}

  letter-spacing:.04em;font-weight:600}

  font-weight:600}

.cd-conds .cc small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cd-dims{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid #eef1f5;margin-top:6px}
.cdim{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid #f4f6f9;
  font-size:12.5px;color:var(--mid)}
.cdim span{flex:1}
.cdim b{color:var(--deep);font-variant-numeric:tabular-nums;font-weight:600}
.cdim i{font-style:normal;font-size:11px;color:var(--ok);background:#e6f6ef;
  border-radius:4px;padding:1px 7px}
.cd-score{display:flex;align-items:baseline;justify-content:center;gap:7px;margin:22px 0 6px}
.cd-score span{font-size:12.5px;color:var(--soft)}
.cd-score b{font-size:40px;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1}
.cd-score i{font-style:normal;font-size:12px;color:#a9660f;background:#fdf1e3;
  border-radius:5px;padding:2px 9px;margin-left:6px;font-weight:600}
.cd-note{font-size:11.5px;color:var(--soft);line-height:1.85;margin:16px auto 0;max-width:560px;text-align:center}
.cd-ft{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;margin-top:30px;
  padding-top:16px;border-top:1px solid #eef1f5}
.cd-ft>div:not(.cd-seal){flex:1}
.cd-ft span{display:block;font-size:10.5px;color:var(--soft);margin-bottom:3px}
.cd-ft b{font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cd-seal{flex:0 0 92px;width:92px;height:92px;margin-left:6px;border-radius:50%;
  border:2px solid rgba(200,16,46,.34);color:rgba(200,16,46,.62);display:flex;align-items:center;
  justify-content:center;text-align:center;font-size:11.5px;line-height:1.45;font-weight:600;
  transform:rotate(-9deg);letter-spacing:.02em;pointer-events:none;align-self:center}
.cd-tip{max-width:860px;margin:14px auto 44px;font-size:11.5px;color:var(--soft);text-align:center}


/* 后台课程内容：每节卡片 + 预览按钮 */
.ct-sec{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px;background:#fff}

<script>
window.__COURSE__={"course":"geely-user-thinking","modules":[{"no":1,"key":"m1","name":"用户思维总纲","min":60,"ability":"场景还原能力（主） / 需求挖掘与识别（辅）","ability_short":"场景还原","output":"场景还原五问卡","intro":"把「用户思维」从态度问题重新定义成判断顺序问题，并交付全课唯一一把通用尺子——场景还原五问。","points":["三种伪用户思维，以及判断顺序的三步","B 端四层用户与诉求互斥时的判据","从「用户满意」到「组织绩效改善」的翻译"],"wrap":["判断顺序错了，努力就是成本","四层用户先分清谁承担后果","内部系统的价值必须能翻译成组织指标"],"sections":[{"n":1,"m":3,"t":"用户思维不是「态度好」，而是一套可验证的判断顺序","hook":"为什么加了 12 个字段，一线还是不用？","goals":["三种伪用户思维长什么样","判断顺序：先场景、再问题、后功能","顺序错了，代价落在谁身上"],"pages":[{"L":"cards","T":"三种伪用户思维，共同点是「没有判断顺序」","K":"态度好、调研勤、听领导——三件事都做了，问题还是没解决","D":[["态度好，但判断错","把「用户满意」当成目标，把功能多当成诚意。系统越做越重，一线越用越绕。"],["调研走过场","问卷发了、访谈做了，结论是「希望更好用」。没有一句能落到设计决策上。"],["把领导当用户","按汇报口径设计系统，上线后发现天天用它的是一线专员。"]]}],"q":{"q":"某事业部提出「考勤系统补卡流程太麻烦」。以下哪个动作最接近「有判断顺序」的做法？","o":["直接评估把三步改成一步需要多少开发量","先问上个月补了几次卡、当时人在哪、为什么没打上","发一份满意度问卷，看大家打几分","参考同业系统，看别人做成几步"],"a":1,"why":"先还原场景（谁、在什么条件下、为完成什么），再定义问题，最后才谈功能。A 是先给方案，C 拿不到场景，D 是抄答案。"}},{"n":2,"m":5,"t":"数字化转型中三类典型错位","hook":"流程搬上线，为什么一线反而更慢了？","goals":["把流程线上化当成体验","把报表当成决策支持","把使用率当成满意度"],"pages":[{"L":"cards","T":"三类错位，都是把「做了什么」当成了「改善了没有」","K":"上线不等于改善；下发数据不等于支持决策；有人用不等于有人满意","D":[["流程线上化 ≠ 体验","纸质表单原样搬进系统，只是不再手写。字段一个没少、审批一环没减，唯一变化是打字代替写字。"],["报表 ≠ 决策支持","给出一堆数，不给结论。看的人还要自己算一遍，于是继续用 Excel——绕行从这里开始。"],["使用率 ≠ 满意度","被制度强制使用的系统，使用率天然高。它反映流程强制力，不反映体验。"]]}],"q":{"q":"某内部系统月活 96%，管理层据此认为体验良好。以下哪个证据最能推翻这个结论？","o":["用户日均登录 3.2 次","用户把系统数据导出后，在 Excel 里完成核心分析","页面平均加载 1.8 秒","客服工单月均 40 单"],"a":1,"why":"96% 是被制度推上去的。导出到 Excel 完成核心动作，说明系统只承担了「留痕」，真正的决策动作仍在系统外——这就是绕行。"}},{"n":3,"m":10,"t":"场景还原五问：谁在用、在什么条件下、为完成什么、现在怎么绕过、不做会怎样","hook":"五问填完，为什么能直接否掉三成需求？","goals":["五问的提问顺序与每问要拿的证据","「现在怎么绕过」为什么最值钱","怎么用五问当场否需求"],"pages":[{"L":"steps","T":"场景还原五问：顺序不能反","K":"每一问都要拿到可指认的证据，拿不到就是没还原","D":[["谁在用","岗位、职级、是否外包、是否兼职。不是「财务人员」，是「某基地一位费用审核员」。"],["在什么条件下","时间压力、设备、场地、是否被打断。同一个人在不同条件下是完全不同的用户。"],["为完成什么","他要交付的那个动作，不是系统里的功能名。例如「月结前把这张单子核完」。"],["现在怎么绕过","Excel、微信、纸质、私人台账、口头代填。绕行路径暴露真实约束。"],["不做会怎样","后果、承担者、时限。用来判断紧迫性，也用来判断该不该由系统解决。"]],"note":["为什么「绕过」这一问最值钱","因为它是唯一不依赖用户表态的证据。用户嘴上会说「挺好的」，但手会诚实地打开 Excel。\n\n绕行的五种形态：Excel 台账、微信群转发、纸质签批、私人表格、口头代填。每发现一种，就找到一处系统没覆盖的断点。"]},{"L":"table","T":"五问的输出：一张能拿去开会的卡","K":"填不满的那三行，说明需求还没到能评审的程度","w":[2.2,4.4,3.0],"D":{"h":["问","要拿到的证据","填不出来意味着"],"r":[["谁在用","岗位、职级、人数，以及是否外包或兼职","你还没找到真正的使用者"],["什么条件下","一次完整观察或一次跟班记录","你只在会议室里理解用户"],["为完成什么","他交付的动作，以及这件事的截止时间","你在按功能清单设计"],["怎么绕过","具体的文件名、群名、台账名","你还没看到真实约束"],["不做会怎样","后果、承担者、时限","优先级只能靠谁声音大"]]}}],"q":{"q":"复盘一个审批系统时，五问里哪一问最能暴露「设计假设错误」？","o":["谁在用","在什么条件下","现在怎么绕过","不做会怎样"],"a":2,"why":"绕行路径是用户用行为投票的结果，它直接显示「系统没覆盖的那一段」，通常就是假设错的地方。其余三问指向范围与优先级。"}},{"n":4,"m":10,"t":"B 端产品的用户：使用者、管理者、决策者、监管者四层","hook":"一个字段加不加，四个角色四种答案，听谁的？","goals":["四层各自看什么、要什么","三种典型互斥结构与唯一判据","影响者为什么不在四层却能否决"],"pages":[{"L":"bands","T":"四层用户：诉求不同，语言也不同","K":"同一套系统，四个人说的「好用」根本不是一件事","D":[["使用者","看动作与频次：一天点几次、每次几步、会不会被打断。他要的是快。"],["管理者","看指标与考核：人均单量、差错率、周期。他要的是稳、可算。"],["决策者","看投入产出：这笔钱换来什么、能不能对外讲。他要的是值。"],["监管者","看留痕与合规：三年后能不能追溯、有没有依据。他要的是可查。"]]},{"L":"cards","T":"三种互斥结构，判据只有一个：谁承担后果","K":"不按级别排，不按人数排，按后果归属排","D":[["快 vs 稳","一线要少填，审核要留痕。字段越多审核越省事、一线越费时。判据：出错时谁去解释、谁被追责。"],["细 vs 简","管理层要维度，执行层要步数。判据：这个维度有没有人真的拿去做决定。"],["留痕 vs 效率","合规要审批链，业务要当天办完。判据：这条链是制度要求，还是历史遗留。"]]}],"q":{"q":"费控系统拟新增 6 个成本维度字段。一线报销人反对，财务审核员支持。判断依据应是：","o":["报销人人数多，按人数决定","审核员是需求提出方，按提出方决定","出错时由谁承担解释与追责责任","上报分管领导裁决"],"a":2,"why":"四层互斥时的判据是「谁承担后果」。若退单与稽查责任落在审核员，字段就有必要；但必须同时压缩填报代价（预填、默认值）。按人数或按提出方都会系统性伤害一方。"}},{"n":5,"m":10,"t":"B 端价值判据：从「用户满意」走到「组织绩效改善」","hook":"「更好用」这三个字，怎么翻译成领导听得懂的话？","goals":["三个价值锚点：少一个人 / 少一次返工 / 少一天关账","把「更好用」翻译成组织指标的四个动作","翻不出来的需求该排第几"],"pages":[{"L":"cards","T":"内部系统的价值，只有三个锚点","K":"用户满意是过程指标，组织绩效才是结果指标","D":[["少一个人","原来 3 个人干的活，2 个人能干。等价于编制与人力成本，是最容易被管理层听懂的语言。"],["少一次返工","退单、重填、二次核对。可直接折算工时与人日，也最容易验证。"],["少一天关账","周期缩短影响的是资金效率与管理节奏，比工时更值钱，但需要跨部门数据才能算。"]]},{"L":"steps","T":"把「更好用」翻译成组织指标的四个动作","K":"翻不出来的需求，通常不是第一优先级","D":[["找到那个动作","用户说的「麻烦」，对应哪一个具体动作：填、核、催、查、等。"],["数清它的频次","一天几次、一月几次、涉及几个人。频次决定价值量级。"],["折算成时间","单次耗时 × 频次 × 人数 = 月工时，再折算人日。"],["挂到组织指标上","工时→人均单量；周期→关账天数；差错→退单率。挂不上就降级。"]],"note":["一个换算示例","「报销单均填报 41 分钟」，2,400 人月均 1.4 单，就是每月 2,296 小时 ≈ 13 人日。\n\n省一半即 6.5 人日/月，一年 78 人日。这个数比「提升体验」有说服力得多，也更容易进预算评审。"]}],"q":{"q":"以下四条需求，哪一条最容易被直接判为「非第一优先级」？","o":["单据预填，减少 30% 填报时间","审批超时自动提醒，平均缩短 1.2 天","界面配色改为品牌蓝，提升一致性","三单自动匹配，减少人工核对 2 人日/月"],"a":2,"why":"配色无法翻译成「少一个人 / 少一次返工 / 少一天关账」中的任何一项。它未必不做，但不能与前三者争同一批资源。"}},{"n":6,"m":10,"t":"行业数字化产品全景与用户地图","hook":"六类系统，用户的「使用动机」根本不是一回事","goals":["六类系统的用户结构差异","职能域的三个特征：用户即同事","你负责的系统属于哪一类"],"pages":[{"L":"table","T":"六类系统，用户结构完全不同","K":"照搬另一类的做法，方法论就会失焦","w":[2.0,2.6,2.2,2.6],"D":{"h":["系统类别","主要用户","动机来源","体验关键"],"r":[["集团协同办公","全体员工","被要求使用","流程不绕、状态可见"],["供应链与采购","采购执行、需求方、供应商","业务必须完成","状态透明、时效"],["制造与质量","班组长、质检、工艺","生产节拍驱动","少录入、能离线"],["经销商与售后","门店顾问、服务经理","考核与返利","算得清、少返工"],["车主 App 与车机","车主","自愿使用","快、准、有惊喜"],["职能数字化（本期）","人力、财务、采购的同事","制度要求 + 自身省事","一次填对、状态可查"]]}},{"L":"cards","T":"职能域的三个特征，决定了方法要改哪里","K":"用户即同事、需求即管理动作、系统即制度载体","D":[["用户即同事","你明天还要跟他开会。所以不能「调研完就下结论」，方案要能当场被质疑、当场解释。"],["需求即管理动作","需求背后往往是一条管理制度。改系统等于改制度，光靠产品经理推不动，要拉制度 owner。"],["系统即制度载体","它承载的是「必须这样做」。体验的天花板由制度决定，不由界面决定。"]]}],"q":{"q":"职能数字化系统的体验天花板，最先由什么决定？","o":["前端组件选型","背后的管理制度与审批链","服务器性能","培训是否到位"],"a":1,"why":"字段、审批链、留痕要求都由制度规定。界面能优化的是「在制度内少走一步」，改不了「必须走这三步」。先改制度，再谈界面。"}},{"n":7,"m":2,"t":"全课路线图与作业说明","hook":"8 个模块学完，你手上会多出什么？","goals":["模块与能力的对应关系","作品集标准与提交方式","两周学习节奏"],"pages":[{"L":"table","T":"每个模块都有一件产出物，其中两件必须进作品集","K":"课程真正的交付不是「听完」，是那几张填满的表","w":[2.4,3.4,1.6],"D":{"h":["模块","产出物","进作品集"],"r":[["M1 用户思维总纲","场景还原五问卡","配套材料"],["M2 定性研究方法","深访提纲 + 观察记录表","—"],["M3 定量研究方法","问卷自查 20 条 + 样本量速算","—"],["M4 用户画像构建","用户画像卡（1 页 A4）","选交"],["M5 需求挖掘与识别","需求鉴真表","必交"],["M6 需求优先级判断","排序表 + 一页纸理由","选交"],["M7 用户旅程绘制","用户旅程地图（含泳道）","必交"],["M8 反馈闭环与度量","闭环 SOP + 指标卡","—"]]}}],"q":{"q":"认证作品集中的两件必交件是：","o":["画像卡 + 优先级排序表","需求鉴真表 + 用户旅程图","深访提纲 + 问卷","五问卡 + 闭环 SOP"],"a":1,"why":"必交是需求鉴真表（验洞察能力）与用户旅程图（验共情与场景能力）。另外两件为选交加分项，合格每件加 2 分。"}}],"cases":[{"domain":"财务域 · 费控报销","title":"两年加了 14 个字段，退单率反而升到 34%","scene":"某集团费控报销系统上线两年，单据字段从 12 个增至 26 个。一线单均填报 41 分钟，退单率 34%，财务共享中心每月约 3 人日用于解释退回原因。\n\n逐条复盘：哪个字段是「万一要用」加的？哪个字段的数据在合同系统里已经有了？哪个字段的业务规则三个月内改过两次？","stats":[["26","单据字段（两年前 12 个）"],["41 分钟","一线单均填报耗时"],["34%","退单率"]],"flip":"复盘落点不在「删字段」，而在「哪 3 个字段在需求提出时就该被拦下，拦下的依据是哪一问」。","wrong":"每次业务提需求就加字段，理由是「先加上，也许以后用得上」。"},{"domain":"对照 · 车主 App","title":"同一个活动入口，站在车边的人根本不会点","scene":"首页新增活动入口后点击率仅 0.8%。团队第一反应是挪位置、换图标、加动效，连改三版仍无起色。\n\n场景还原后发现真正的变量是「打开 App 时人在哪」：站在车边的人要充电和开门，坐在家里的人才看活动。同一个入口，两种场景，一个场景根本不该出现这个入口。","stats":[["0.8%","入口点击率"],["2 类","真实使用场景"],["3 轮","无效的界面优化"]],"flip":"C 端与 B 端共用同一套场景还原逻辑。差异在于：B 端的「场景」由流程节点定义，不由物理位置定义。","wrong":"把入口从第二屏挪到首屏，并换了一版更大的图标。"}],"quiz":[["五问填完能直接否掉约三成需求，依据是什么？","B","拿不到可指认证据的需求占比约三成，缺证据即缺场景"],["使用率 96% 能否说明体验好？","B","不能，需与绕行率、任务完成时长、退回率交叉验证"],["四层用户诉求互斥时按什么判据排序？","C","按谁承担后果，不按级别、不按人数、不按提出方"],["「更好用」无法翻译成组织指标时应如何处理？","D","降级，不与「少一人/少一次返工/少一天关账」争资源"],["职能系统的体验天花板由什么决定？","B","制度与审批链；界面只能在制度内优化步数"]]},{"no":2,"key":"m2","name":"定性研究方法","min":60,"ability":"定性研究方法（主） / 场景还原能力（辅）","ability_short":"定性研究","output":"深访提纲 + 观察记录表","intro":"能独立设计并执行一次有效访谈或一次现场观察，且拿回来的结论经得起追问。重点不在「会问」，在「不被用户的方案牵着走」。","points":["研究问题的改写：角色、环节、缺失物","BEI 提纲与四类必须删掉的提问","跟班观察：记录打断与绕行，不记录评价"],"wrap":["只访接口人，只能拿到系统的成功故事","绕行和沉默才是设计缺陷的证据","结论强度必须跟证据强度匹配"],"sections":[{"n":1,"m":5,"t":"从业务问题到研究问题：把「不满意」翻译成可观察的现象","hook":"「用户为什么不满意」这个问题，为什么问不出答案？","goals":["不可研究题目的三个特征","研究问题的三要素：角色、环节、缺失物","改写前后的对照"],"pages":[{"L":"cards","T":"不可研究的题目，通常缺三样东西之一","K":"能被观察到，才可能被研究；「想要什么」不可观察","D":[["缺角色","「用户觉得流程太麻烦」——哪个用户？一线还是审批人？两拨人的麻烦不是一回事。","把「用户」直接当成一个人。"],["缺环节","「报销体验不好」——填报、审批、打款，哪一段？没有环节就没有观察点。","用整体评价代替具体环节。"],["缺缺失物","「希望系统更智能」——缺的是信息、是提醒、还是自动填？说不出缺失物，就设计不出方案。","把感受当需求记录下来。"]]},{"L":"steps","T":"改写公式：谁 → 在哪一环 → 因为缺什么而放弃","K":"三要素齐了，题目才可研究，访谈提纲才有落点","D":[["写下原始问题","把业务方原话照抄，不要先美化。「大家都说难用」。"],["找角色","具体到岗位、职级、是否外包。一个角色一张提纲。"],["切环节","把流程切成 4–6 段，指出问题落在哪一段。"],["补缺失物","在这一段里，他缺的是信息、权限、提醒，还是模板？"]],"note":["一个改写示例","原始：「用户觉得绩效系统难用」。\n\n改写：「某基地部门经理，在季度考核打分这一环，因为看不到下属上一季度的目标完成情况，而反复退出系统去翻邮件」。\n\n改写后，下一步做什么已经很清楚：先解决「目标完成情况在打分页不可见」。"]}],"q":{"q":"以下哪一项是可以直接进入研究设计的题目？","o":["用户希望报销系统更好用","员工对HR系统的满意度如何","新员工在入职首周，因找不到导师联系方式而反复询问HR","管理层希望提升数字化体验"],"a":2,"why":"它有角色（新员工）、环节（入职首周）、缺失物（导师联系方式），可直接设计观察与访谈。其余三项都缺至少一个要素。"}},{"n":2,"m":5,"t":"抽样：为什么不能只访接口人","hook":"访谈了 8 个人都说「还行」，问题出在哪？","goals":["接口人偏差：他已是系统的成功适应者","极端用户与边缘用户的选法","6–8 人的饱和判断"],"pages":[{"L":"bands","T":"四类样本，缺一类就会得出偏乐观的结论","K":"接口人最容易被约到，也最不代表真实用户","D":[["关键接口人","各部门指定的系统联络人。熟悉流程、配合度高，但已经适应了系统，问题在他这里被消化掉了。"],["极端用户","用得最多的人和完全不用的人。前者暴露效率瓶颈，后者暴露放弃原因。"],["边缘用户","外包、兼职、跨基地、临退休。权限与培训覆盖最薄弱，问题最集中。"],["放弃者","已经彻底绕行的人。他们不在系统里，只能靠观察和旁敲侧击找到。"]]},{"L":"cards","T":"抽样不看人数，看是否覆盖了四种处境","K":"6–8 人饱和的判断标准：新访谈不再出现新的问题类型","D":[["按处境分层","同一角色下，按使用频次、权限范围、入职时长各取 2 人，比随机抽 10 人有效。"],["必须找到 1 个绕行者","找不到绕行者，说明你的样本仍全在系统内。让他演示他现在怎么做这件事。"],["饱和即停","连续 2–3 人不再带来新的问题类型，可以停；靠人数堆不增加信息量。"]]}],"q":{"q":"一次内部系统调研只访谈了各部门指定的系统联络人，最可能出现的偏差是：","o":["样本量太小，结论不显著","系统性低估问题严重程度，因为联络人已适应系统","受访者不愿说真话","结论无法量化"],"a":1,"why":"联络人是系统的成功适应者，他们的问题已在日常中自行消化。真正的缺陷留在绕行者与边缘用户身上。"}},{"n":3,"m":7,"t":"深访提纲设计：BEI 结构、五问追问、四类必须删掉的提问","hook":"为什么问「你觉得应该怎么改」，永远问不出真问题？","goals":["BEI 的三段结构：情境—行为—结果","五问追问的模板句","四类必须删掉的提问"],"pages":[{"L":"steps","T":"BEI：不问观点，问最近一次具体发生了什么","K":"人的记忆在具体事件上最准，在抽象评价上最不可靠","D":[["情境","「上一次遇到这个问题是什么时候？当时你在做什么？」锁定时间、地点、任务。"],["行为","「你当时第一步做了什么？然后呢？」只要动作，不要解释。"],["结果","「最后这件事怎么解决的？花了多久？」拿到代价与绕行路径。"],["复述校验","「我复述一遍，你看我理解得对不对」——当场纠偏，比事后猜测可靠。"]],"note":["四类必须删掉的提问","① 假设性：「如果系统能自动填，你会用吗」——答案永远是会。\n② 诱导性：「是不是因为字段太多才觉得麻烦」——把答案塞给对方。\n③ 双重问题：「系统是不是又慢又难用」——两个变量，无法归因。\n④ 让对方预测未来：「你希望以后怎么改」——他在给你方案，不是在给你事实。"]},{"L":"cards","T":"五问追问法：把一个模糊回答挖到具体","K":"每一问都要求对方给一个可指认的细节","D":[["「能举个最近的例子吗」","把评价拉回事件。对方说「经常出错」，就问他上一次出错是哪天。"],["「当时你怎么做的」","拿到动作序列，特别是系统外的动作。"],["「为什么这么做」","拿到他的判断依据，往往就是需求的真实约束。"],["「后来怎么解决的」","拿到绕行路径与代价，这是需求的入口。"],["「还有别人也这样吗」","判断这是个体特例还是结构性问题，决定要不要扩大样本。"]]}],"q":{"q":"以下哪个提问方式最符合 BEI 行为事件访谈？","o":["你觉得现在的审批流程合理吗","如果只能改一处，你会改哪里","上一次审批被退回是什么情况？当时你先做了什么","你希望系统增加什么功能"],"a":2,"why":"BEI 问具体事件中的行为。「上一次…当时…」锁定了情境与动作；其余三项分别是要评价、要方案、要功能清单。"}},{"n":4,"m":7,"t":"访谈执行：破冰、沉默、录音与当场复述","hook":"对方说「挺好的」，后面 40 分钟就白聊了？","goals":["破冰的真正目的是消除考核感","沉默 5 秒的作用","复述校验与合规要求"],"pages":[{"L":"steps","T":"四个动作，决定这次访谈有没有真话","K":"内部访谈最大的阻力不是时间，是「他怕你在考核他」","D":[["破冰：先说清用途","「这次不是评估你的工作，是看系统哪里给你添了麻烦，问题会匿名汇总。」"],["前 10 分钟不问系统","先聊他一天怎么过、什么时候最忙，让他进入叙述状态。"],["沉默 5 秒","对方说完停住时不要急着接话。5 秒的空白，往往换来最关键的那句补充。"],["当场复述","「我复述一遍：你每月初要花两天做这件事，因为…，对吗？」让他纠错。"]],"note":["录音与合规","内部访谈同样要口头告知并取得同意：「我录个音，只用于整理，不外传，可以吗？」\n\n转写标注规范：每段标注受访者编号、岗位、时间点；引语保留原话，不要顺手改成书面语——原话里的用词往往就是需求的线索。"]},{"L":"cards","T":"三类现场反应，对应三种处理","K":"访谈不是聊天，是有一张清单要拿满","D":[["对方开始给方案","先接住再还原：「这个思路我记下了。你说的这个问题，最近一次发生是什么时候？」"],["对方只说「都挺好」","换问法，问「最麻烦的一次」或「有没有想过去 Excel 里做」，用对比逼出问题。"],["对方开始抱怨人","把话题拉回系统与流程：「这件事在系统里是怎么走的？」人的问题另行记录。"]]}],"q":{"q":"受访者反复说「系统挺好的，没什么问题」，最有效的下一步是：","o":["换一个受访者","直接问「那你觉得哪里最需要改进」","问他「有没有哪次干脆不在系统里做，而是用 Excel 处理的」","结束访谈，记录为满意"],"a":2,"why":"用具体的绕行行为做切口，比继续问评价有效。绕行几乎人人都做过，承认绕行的心理成本远低于承认不满。"}},{"n":5,"m":5,"t":"焦点小组：什么时候能用，什么时候一定不能用","hook":"把 8 个人关在一间屋子里，为什么反而问不出真话？","goals":["焦点小组适合探索共识边界","同部门同层级的压制效应","主持人的三个控场动作"],"pages":[{"L":"compare","T":"焦点小组的适用与不适用","K":"它擅长找「大家怎么看」，不擅长挖「你实际怎么做」","D":{"l":["适合用",["探索一个群体对某类问题的共同认知边界，例如「大家眼里的『状态不透明』指什么」。","快速收敛选项：当备选方案有 6 个以上，用它淘汰明显不被接受的。","跨部门对齐认知：让财务、采购、IT 坐在一间屋子里，彼此听见对方的约束。"]],"r":["不要用",["挖掘个人真实做法：群体压力会让「绕行」这类行为消失。","同部门同层级同坐：谁职级低谁闭嘴；跨层级则变成汇报会。","涉及考核与责任的话题：没人会当面说自己填错过。"]]}},{"L":"cards","T":"主持人的三个控场动作","K":"控场的目的是让沉默的人说话，不是让会议顺利","D":[["先写后说","开场 5 分钟让大家各自写下 3 条，再轮流念。避免第一个发言者定调。"],["点名沉默者","「刚才你点了下头，你是怎么看的？」用动作召唤，不用「你有什么意见」。"],["压住强势者","「这个观点我先记下，想听听其他人有没有不同做法。」"]]}],"q":{"q":"以下哪个议题最适合用焦点小组，而不是深访？","o":["审核员核对发票时的具体判断顺序","各部门对「状态不透明」这个词的理解是否一致","某位用户上个月为什么放弃使用系统","高管对预算的真实态度"],"a":1,"why":"焦点小组擅长探索群体共识边界。A、C 属于个体行为细节，D 涉及敏感立场，都应在私下深访中获取。"}},{"n":6,"m":7,"t":"现场观察：跟班、影子跟随与工作日志","hook":"为什么观察一天，比访谈 8 个人更有用？","goals":["记录什么、不记录什么","观察记录表的三列结构","跟班的时长与时段选择"],"pages":[{"L":"cards","T":"只记录可数的行为，不记录评价","K":"「他看起来很烦躁」不是证据；「他在 10 分钟内切换了 7 次窗口」才是","D":[["记录打断","每被打断一次记一笔，并记下打断来源：电话、同事、系统弹窗、领导。"],["记录绕行","什么时候打开 Excel、什么时候发微信、什么时候打印。每一次都是一处断点。"],["记录口头禅","「这个我得先问问」「等会儿再弄」——口头禅指向流程里的不确定处。"],["缺勤记录","不要写「态度不好」「不熟练」。评价性描述无法复盘，也无法让设计师行动。"]]},{"L":"table","T":"观察记录表：三列就够，但要连续","K":"时间—动作—打断/绕行，一天下来就是一张流程图","w":[1.4,4.4,3.2],"D":{"h":["时间","他在做什么（动作）","打断 / 绕行"],"r":[["09:12","打开待办，逐条浏览 14 条","电话打断 1 次"],["09:20","打开发票 PDF，与单据逐项核对","系统弹窗提醒 2 次"],["09:34","切到 Excel 台账查该供应商历史付款","绕行：系统内查不到"],["09:51","退回 1 单，填写退回原因（自由文本）","——"],["10:05","在微信群问采购员合同编号","绕行：跨系统取数"]]}}],"q":{"q":"跟班观察时，以下哪条记录符合「只记行为」的要求？","o":["她显然不熟悉这个界面","09:34 她切到 Excel 台账查该供应商历史付款","她觉得系统太复杂了","她对系统很不满意"],"a":1,"why":"行为记录包含时间、动作、对象，可复盘。其余三项都是评价或推断，无法定位设计问题，也无法验证。"}},{"n":7,"m":9,"t":"B 端与 C 端定性研究的五处关键差异","hook":"把 C 端的用户研究方法直接搬到内部系统，哪里会失效？","goals":["五处差异：样本、意愿、场景边界、决策链、采信标准","B 端为什么要「走出去拿」","哪些方法可以照搬"],"pages":[{"L":"table","T":"五处差异，决定方法要改哪里","K":"方法是同一套，取材方式完全不同","w":[1.8,4.2,4.2],"D":{"h":["维度","C 端","B 端（职能域）"],"r":[["样本可得性","公开招募，量大，可筛选","要一层层约，靠业务方配合"],["表达意愿","有动力吐槽，也可能为奖励而说好话","怕被考核，倾向说「挺好」"],["场景边界","全场景，物理位置决定行为","工位、会议、现场，流程节点决定行为"],["决策链","产品经理 → 用户","使用者、管理者、决策者、监管者四层"],["采信标准","数据与增长指标","能不能说服业务方与制度 owner"]]}},{"L":"cards","T":"B 端的三条取材原则","K":"等反馈来，等到的都是已经被消化过的问题","D":[["走出去","坐在他工位旁边看半天，比发一次问卷有效。每月固定半天驻场。"],["找绕行","真实的约束藏在 Excel 和微信里，不在工单里。"],["拿代价","不问「烦不烦」，问「这件事花了你多久、多久做一次」。"]]}],"q":{"q":"B 端内部访谈中「对方倾向说挺好」的根本原因是：","o":["对系统不了解","担心反馈被用于考核自己","表达能力有限","系统确实没问题"],"a":1,"why":"内部访谈的受访者同时是同事与被考核对象。破冰阶段必须先解除「考核感」，否则后面拿到的都是安全答案。"}},{"n":8,"m":5,"t":"定性结论的可信度：三角验证、反例搜寻与强度分级","hook":"「用户都说要这个功能」——这句话什么时候能信？","goals":["三角验证的三种组合","反例搜寻怎么做","结论强度的三档表述"],"pages":[{"L":"steps","T":"让结论站得住的三件事","K":"一个来源是故事，两个来源是线索，三个来源才敢写进需求文档","D":[["三角验证","访谈 + 观察 + 文档/日志，三者指向同一结论才立项。只有访谈的结论先别写。"],["反例搜寻","主动找 2 个不符合结论的人，问他们为什么不同。找不到反例再下结论。"],["强度分级","「普遍」（多数样本＋多来源）/「多见于」（多来源但样本少）/「个别」（仅个案）。"]],"note":["为什么必须分级","结论强度直接决定资源投入。写成「普遍」的问题，评审会要求你上方案；写成「个别」的问题，可以进观察清单而不占正式资源。\n\n反面案例：把 3 个外包人员的反馈写成「全体员工反映」，一旦被业务方抽查，整个调研的可信度都会被质疑。"]}],"q":{"q":"关于定性结论，以下哪个表述最专业？","o":["用户普遍反映审批太慢","8 位受访者中有 6 位提到审批卡在部门经理环节，与日志中位时长 4 小时吻合","大家都觉得系统不好用","用户希望系统更快"],"a":1,"why":"给出了样本量、具体环节、以及第二来源（日志）的互证。其余三项都是无来源、无强度分级的概括。"}}],"cases":[{"domain":"财务域 · 共享中心","title":"跟班一位费用审核员一天：被系统打断 27 次","scene":"跟班财务共享中心一位费用审核员完整一个工作日，记录系统打断 27 次，其中 19 次发生在「正在核对发票与单据」的过程中。\n\n观察发现她真实的判断顺序是：先看供应商历史付款记录 → 再看金额 → 最后看发票。而系统把「费用类型」设为第一个必填项，每次核对都被打断重来。","stats":[["27 次","单日系统打断"],["19 次","发生在核对过程中"],["1 天","跟班观察时长"]],"flip":"结论不是「界面不好用」，而是「必填项顺序与专业判断顺序不一致」，导致每次核对都被打断重来。","wrong":"把页面字段做成两列布局，减少了滚动距离。"},{"domain":"人力资源 · 招聘 ATS","title":"深访 8 位用人经理：说的是「麻烦」，痛的是「看不见」","scene":"8 位用人经理普遍反馈「面试安排太麻烦」。深访追问具体事件后发现，麻烦不在操作步数，而在「面试官时间不可见」。\n\n结果是平均每个岗位改约 2.3 次，每次改约要打 3 通电话。表层诉求是「简化操作」，真实问题是「时间可见性」。","stats":[["8 位","用人经理深访"],["2.3 次","平均每岗改约次数"],["3 通","每次改约的电话量"]],"flip":"表层诉求「简化操作」与真实问题「时间可见性」对应的方案完全不同：前者做表单瘦身，后者做日历打通。","wrong":"把面试安排表单从 11 个字段减到 7 个字段。"}],"quiz":[["研究问题必须包含的三要素是？","A","角色、环节、缺失物，缺一即不可观察"],["为什么不能只访接口人？","B","接口人是系统的成功适应者，问题已被消化"],["BEI 访谈的提问对象是什么？","C","最近一次具体事件中的行为，不是观点"],["焦点小组最适合回答哪类问题？","B","群体对某概念的理解边界是否一致"],["观察记录中不应出现的内容是？","D","评价性判断，如「她很不熟练」"]]},{"no":3,"key":"m3","name":"定量研究方法","min":60,"ability":"定量研究方法（主） / 需求优先级判断（辅）","ability_short":"定量研究","output":"问卷自查表 + 样本量速算表","intro":"这一模块解决一件事：什么问题必须用数，什么数不能信。学完你能独立设计一份内部问卷、读懂一份埋点报表，不再被「满意度 4.2 分」「使用率 31%」这类互相打架的数字带偏。交出两样能直接用的东西：问卷自查表、样本量速算表。","points":["四类可量化问题，以及「为什么」为什么定量答不了","总体怎么界定、样本量怎么速算、问卷五条铁律","行为数据互证，和四类解读陷阱"],"wrap":["先问「这个问题定量能不能答」","使用率是流程强制力，不是体验","均值会骗人，看分布"],"sections":[{"n":1,"m":5,"t":"不是所有问题都该发问卷：先分清什么该用数、什么该去现场","hook":"「大家都说系统难用」这句话，到底该发问卷还是该去现场？","goals":["分清四类可量化问题，以及各自对应的方法","知道「为什么」类问题定量答不了","记住必须先定性的三种情形"],"pages":[{"L":"cards","T":"先分清什么问题该发问卷什么问题该去现场","K":"「大家都说系统难用」这句话，到底该发问卷还是该去现场？","D":[["分清四类可量化问题，以及各自对应的方法","分清四类可量化问题，以及各自对应的方法"],["知道「为什么」类问题定量答不了","知道「为什么」类问题定量答不了"],["记住必须先定性的三种情形","记住必须先定性的三种情形"]]}],"q":{"q":"业务方甩来一句「大家对新的费控系统满不满意」，让你一周内出个数。按本课判断顺序，第一步该做：","o":["先设计满意度问卷，尽快发全公司收分","先拆清这句话里哪些能数、哪些得去现场","先查同业系统的满意度分数做对标","先评估这个需求要多少开发量能上线"],"a":1,"why":"顺序是先分清问题再选方法。「满不满意」里有多少人、集中在哪、差多少能数，但「为什么不满意」数答不了。直接发问卷是拿态度当事实，对标同业是抄答案，评估开发量是先给方案，三者都跳过了最该先做的翻译。"}},{"n":2,"m":5,"t":"总体不是花名册：内部系统连「到底谁是用户」都说不清","hook":"「全公司 200 人都发一遍」，这句话里藏着几个没说清的前提？","goals":["学会界定内部系统的总体边界","分清概率抽样和非概率抽样各自的用处","掌握 B 端样本量不足时的三种补救"],"pages":[{"L":"cards","T":"先把谁算用户钉死再谈抽谁、抽多少","K":"「全公司 200 人都发一遍」，这句话里藏着几个没说清的前提？","D":[["学会界定内部系统的总体边界","学会界定内部系统的总体边界"],["分清概率抽样和非概率抽样各自的用处","分清概率抽样和非概率抽样各自的用处"],["掌握 B 端样本量不足时的三种补救","掌握 B 端样本量不足时的三种补救"]]}],"q":{"q":"某协同审批模块只有 18 个活跃账号，横向怎么分组样本都不够。最合适的补救是：","o":["把不相关部门也拉进来问卷凑人数","改盯这 18 人连续四周的任务时长","按现成花名册做一次简单随机抽样","只访谈其中最熟练的两位老员工"],"a":1,"why":"样本小的时候用时间序列代替横截面，用时间换观测点，18 人四周就有 72 个点。拉不相关部门进来会把没用过系统的人算进分母，数据更脏；随机抽样在总体只有 18 人时没有意义；只访最熟练的两人属于接口人偏差，覆盖不了边缘处境。"}},{"n":3,"m":8,"t":"样本量速算：先定能容忍多大误差，再倒推发多少份","hook":"200 人的系统发 200 份问卷，为什么反而不如做 12 个深访？","goals":["记住置信度与误差这两个参数的经验口径","会用速算表定样本量并按总体修正","看懂内部系统最常见的过度调查"],"pages":[{"L":"cards","T":"样本量不是越多越好先定误差和把握","K":"200 人的系统发 200 份问卷，为什么反而不如做 12 个深访？","D":[["记住置信度与误差这两个参数的经验口径","记住置信度与误差这两个参数的经验口径"],["会用速算表定样本量并按总体修正","会用速算表定样本量并按总体修正"],["看懂内部系统最常见的过度调查","看懂内部系统最常见的过度调查"]]}],"q":{"q":"某内部系统总体 200 人，一次调研只收回 41 份问卷，且多为有意见或有空的人。最准确的判断是：","o":["样本量已够，可放心外推到全公司","再群发催填一轮，把回收率拉高即可","这是系统性偏差，比样本少更难修正","改用 95% 置信度重新算一遍就行"],"a":2,"why":"回收率低带来的是不回应偏差，谁没回来是系统性的，算不出大小；样本少只是区间宽、能估算。群发催填催来的还是同一批愿配合的人，偏差不动；重算置信度改变不了已经偏掉的样本；41 份且结构失衡，根本不能外推全公司。"}},{"n":4,"m":8,"t":"问卷五条铁律：一道题只测一件事，其余都是细节","hook":"一道「系统是否稳定且好用」，为什么收上来的分根本没法用？","goals":["记住五条铁律，以及各自的内部系统反例","一眼认出满意度题里的双重问题","会做一场 5 人预测试并看对地方"],"pages":[{"L":"cards","T":"「稳定且好用」一句话问了两件事","K":"一道「系统是否稳定且好用」，为什么收上来的分根本没法用？","D":[["记住五条铁律，以及各自的内部系统反例","记住五条铁律，以及各自的内部系统反例"],["一眼认出满意度题里的双重问题","一眼认出满意度题里的双重问题"],["会做一场 5 人预测试并看对地方","会做一场 5 人预测试并看对地方"]]}],"q":{"q":"内部满意度问卷里出现「您觉得系统是否稳定且好用」，最该做的修改是：","o":["把 5 分制改成 7 分制让打分更细","拆成稳定性和好用程度两道独立的题","在题前加一句系统上线背景作说明","把这道题挪到问卷最末尾再问一次"],"a":1,"why":"「稳定且好用」是双重问题，一题缝了两个变量，回答者感受不一致时只能打个模糊分，拆不开。换 7 分制只是把模糊分切得更细，仍然拆不出两件事；加背景说明属于诱导；挪到末尾不改变题目本身，重复问还是同样的坑。"}},{"n":5,"m":10,"t":"题型与量表：点数不是越多越准，题型是为决定服务的","hook":"满意度从 5 点换成 7 点，为什么数据反而更乱了？","goals":["会判断该用 5 点还是 7 点李克特","记住排序题上限与 MaxDiff 的成本","知道 NPS 该放哪、该怎么问"],"pages":[{"L":"cards","T":"先想拿这个数做什么决定再选题型","K":"满意度从 5 点换成 7 点，为什么数据反而更乱了？","D":[["会判断该用 5 点还是 7 点李克特","会判断该用 5 点还是 7 点李克特"],["记住排序题上限与 MaxDiff 的成本","记住排序题上限与 MaxDiff 的成本"],["知道 NPS 该放哪、该怎么问","知道 NPS 该放哪、该怎么问"]]}],"q":{"q":"一份几十人的内部系统小调研，要把满意度量表从 5 点改成 7 点。更稳妥的判断是：","o":["7 点更精细，应默认改用 7 点量表","5 点够用，同事难稳定区分多出的格子","改成 7 点后前后两年分数仍可直接对比","点数越多，均值就越接近真实满意度"],"a":1,"why":"内部同事抽空填答，对「有点同意」「比较同意」没有稳定区分，多出的格子是噪声而非精度。7 点只在样本大、验证过能区分时才用；换量表会让前后分数不可比、趋势线断掉；点数多少和「接近真实」没有关系，噪声多反而更偏。"}},{"n":6,"m":9,"t":"行为数据互证：问卷说满意、埋点说没用，你该信哪一个","hook":"满意度 4.2 分、使用率 31%，这份报告你信哪一半？","goals":["记住内部系统四个核心行为指标","会用「问卷说满意但不用」的三步判断法","识别埋点口径里最常混进来的三类账号"],"pages":[{"L":"cards","T":"4.2 分 / 31% / 68%三个数打架先别挑一个信","K":"满意度 4.2 分、使用率 31%，这份报告你信哪一半？","D":[["记住内部系统四个核心行为指标","记住内部系统四个核心行为指标"],["会用「问卷说满意但不用」的三步判断法","会用「问卷说满意但不用」的三步判断法"],["识别埋点口径里最常混进来的三类账号","识别埋点口径里最常混进来的三类账号"]]}],"q":{"q":"SRM 门户满意度 4.2 分、使用率 31%、68% 供应商月登 1 次。最该先做的判断是：","o":["认可 4.2 分，判定体验良好并结项","把 31% 判为推广不足，发培训通知","查使用是否被制度强制、满意度测的是什么","立即改版门户首页，拉高登录观感"],"a":2,"why":"三个数打架时先查各自测的是什么：门户只在月度对账被强制使用，4.2 分评价的是「能用」不是「好用」，使用率是流程强制力指标。直接认 4.2 分是把态度当体验；发培训、改首页都跳到了方案，把流程问题当成推广或界面问题，两周后使用率照样不动。"}},{"n":7,"m":5,"t":"四类解读陷阱：数算出来之后，才是真正容易出错的地方","hook":"平均审批时长 2 天，为什么没人觉得自己等了两天？","goals":["认出四类解读陷阱以及各自的内部实例","记住均值陷阱最典型的那组数","带走模块收尾三句，接上模块四"],"pages":[{"L":"cards","T":"均值 2 天 / 中位数 4 小时长尾只是 3 个节点","K":"平均审批时长 2 天，为什么没人觉得自己等了两天？","D":[["认出四类解读陷阱以及各自的内部实例","认出四类解读陷阱以及各自的内部实例"],["记住均值陷阱最典型的那组数","记住均值陷阱最典型的那组数"],["带走模块收尾三句，接上模块四","带走模块收尾三句，接上模块四"]]}],"q":{"q":"报表显示平均审批时长 2 天，但一线普遍反映半天就批完了。更该先做的动作是：","o":["立项目标，把平均时长从 2 天压到 1 天","拉出中位数和分布，查长尾由哪些单子造成","给审批人做一轮提速培训，缩短每单耗时","按均值给各基地排名，追责最慢的基地"],"a":1,"why":"均值 2 天、中位数 4 小时、长尾由 3 个特殊节点拉出，说明多数单子并不慢，问题在那几张卡住的单子上。直接压均值、做培训、按均值排名，都是拿一个被长尾污染的均值当事实，力气全花在多数本来就不慢的单子上，指不到真正该改的节点。"}}]},{"no":4,"key":"m4","name":"用户画像构建","min":60,"ability":"用户画像构建（主） / 场景还原能力（辅）","ability_short":"用户画像","output":"一页 A4 用户画像卡","intro":"把画像从贴在墙上的海报，变成评审会上能用的判据。这一模块解决两件事：多角色诉求互相拉扯时，这一次为谁优化、代价由谁承担；以及谁进核 天来的人更核心？","goals":["会用价值贡献、使用频次、不可替代性三条打分","说清低频高价值为什么常被误判成边缘","把判定用在资源分配、需求优先级、灰度范围"],"pages":[{"L":"cards","T":"三条判据低频不等于边缘","K":"一年只来几次的人，凭什么比天天来的人更核心？","D":[["会用价值贡献、使用频次、不可替代性三条打分","会用价值贡献、使用频次、不可替代性三条打分"],["说清低频高价值为什么常被误判成边缘","说清低频高价值为什么常被误判成边缘"],["把判定用在资源分配、需求优先级、灰度范围","把判定用在资源分配、需求优先级、灰度范围"]]}],"q":{"q":"一套采购系统里，供应商一年只对接几次，采购合规平时不出现但能否决签单。按三条判据，正确的判定是：","o":["两者频次都低，应判为边缘用户，不进灰度","供应商算边缘，合规算核心，按否决权区分","两者不可替代性都高，都应判为核心用户","两者都是低频，资源分配上可以最后再考虑"],"a":2,"why":"不可替代性权重最高：供应商一次不来影响交付，合规不点头不能签，都属低频高不可替代的核心。把频次当重要性、或只认否决权漏掉供应商的交付影响，都判偏了。"}},{"n":5,"m":10,"t":"五种画像反模式，每一种都长得像正经交付物","hook":"一张挑不出毛病的画像，为什么评审时谁都不用它？","goals":["认出五种反模式各自的识别信号","会针对每种给出具体修法","把不可验证和理想用户两类挡在评审外"],"pages":[{"L":"cards","T":"坏画像的共同点看着完整落不到决定","K":"一张挑不出毛病的画像，为什么评审时谁都不用它？","D":[["认出五种反模式各自的识别信号","认出五种反模式各自的识别信号"],["会针对每种给出具体修法","会针对每种给出具体修法"],["把不可验证和理想用户两类挡在评审外","把不可验证和理想用户两类挡在评审外"]]}],"q":{"q":"一张画像写着「熟练、配合、愿意看帮助文档、按规范填全字段」，还据此砍掉了必填校验。它最可能中了哪条反模式？","o":["人口统计学堆砌，因为没写年龄司龄","没有场景，因为没写月结高峰的条件","一厢情愿的理想用户，描的是希望有的同事","不可验证，因为结论没挂访谈出处"],"a":2,"why":"画像里的人不累、不赶时间、不找捷径，是「应该会怎么用」而非「实际怎么用」，据此砍校验必然被真实绕行打脸。它没堆人口统计，也不是缺月结条件，最致命的是描了希望有的同事。"}},{"n":6,"m":10,"t":"画像进评审，是决定这次不为谁优化","hook":"评审会上，一张画像该怎么用才不是念一遍就过？","goals":["会用画像判断谁受益、谁受损、灰度顺序","避开用画像替代论证、压制反对两种错法","能填出一页纸六格画像卡"],"pages":[{"L":"cards","T":"画像在评审的位置是吵起来那一刻定事","K":"评审会上，一张画像该怎么用才不是念一遍就过？","D":[["会用画像判断谁受益、谁受损、灰度顺序","会用画像判断谁受益、谁受损、灰度顺序"],["避开用画像替代论证、压制反对两种错法","避开用画像替代论证、压制反对两种错法"],["能填出一页纸六格画像卡","能填出一页纸六格画像卡"]]}],"q":{"q":"需求评审会上有人问「凭什么这个字段不必填」，以下哪一种用法最符合本课？","o":["答「核心用户就是讨厌填单」，用画像快速收口","摆出该改动让哪组少几步、谁承担代价再定","把反对者归为边缘用户，这轮先不收其意见","出示人物画像海报，请评审先理解一下用户"],"a":1,"why":"画像只说明谁受影响、影响多大，不替你回答「所以这么改」，中间因果要自己摆事实、算代价。替论证、压反对、念人物介绍，三种都没把画像用成判据。"}}]}]};

window.NARR={"g_m0_1":[{"u":"audio/geely/g_m0_1_0.m4a?v=202611051410","d":44.33,"t":"这门课开始之前，先花八分钟，把三件事说清楚：你要学什么，怎么学，以及怎么才算学完。先说第一件。这门课不教你怎么对用户更热情，也不教你多去和用户聊天。它教的是一套判断顺序：先看场景，再定问题，最后才谈功能。为什么顺序这么重要？因为顺序反了，努力就是成本。你在项目里一定见过这种情况：需求会上所有人都说这个字段有用，上线三个月，使用率不到两成。这不是态度的问题，是顺序的问题。"},{"u":"audio/geely/g_m0_1_1.m4a?v=202611051410","d":48.91,"t":"再说你的用户是谁。这门课面向的是人力、财务、采购这些职能部门的业务产品经理，你的用户不是消费者，是同事，而且往往是比你更强势的同事。这就带来一个根本差别：内部系统没有流失率这个信号，用户不会卸载，他只会绕行——用 Excel，用微信群，用纸质台账。所以本课把绕行当作最重要的诊断信号，在用户思维、需求挖掘、旅程绘制三个模块里反复训练你怎么识别它。记住一句话：用户不抱怨，不代表没问题；他不吭声，可能已经绕过去了。"},{"u":"audio/geely/g_m0_1_2.m4a?v=202611051410","d":44.04,"t":"全课八个模块，五十九节，八个学时。前四个模块解决的是怎么看清：模块一用户思维总纲，给你一把全课通用的尺子，叫场景还原五问；模块二定性研究方法，教你把访谈和现场观察做扎实，结论经得起追问；模块三定量研究方法，讲清什么问题必须用数、什么数不能信；模块四用户画像构建，让画像从墙上的海报，变成评审会上能用的判据。这四个模块学完，你手上会有四张填好的工具卡。"},{"u":"audio/geely/g_m0_1_3.m4a?v=202611051410","d":48.46,"t":"后四个模块解决的是怎么判：模块五需求挖掘与识别，是全课最核心的一章，目标是把一句话需求拆到真实问题；模块六需求优先级判断，让排序从谁声音大谁先做，变成同一套口径、可解释、可复述；模块七用户旅程绘制，画出从认知到离开的完整旅程，包含系统外的触点；模块八用户反馈闭环与满意度度量，把反馈从收集箱变成改进流水线。八个模块串起来是一条链：场景、问题、证据、取舍、体验、闭环，缺一环就断。"},{"u":"audio/geely/g_m0_1_4.m4a?v=202611051410","d":42.58,"t":"为什么必须是这个顺序？因为后面每一步的判断，都建立在前面一步的结论上。场景没还原，你定出来的问题就是伪问题；问题没定准，你收集的证据都是为错误结论服务的；证据不足，排序就退化成拍脑袋；排序错了，旅程画得再漂亮也是在优化不该做的事。所以这门课不允许跳着学。不是我们想管着你，是跳过前面的判断，后面的工具你只会照着表格填，填完还是不知道该怎么决策。"},{"u":"audio/geely/g_m0_1_5.m4a?v=202611051410","d":44.9,"t":"学习节奏建议两周。第一周前两天，模块一加模块二，把场景还原五问卡和深访提纲做出来；第三第四天，模块三加模块四；第二周前半周，模块五和模块六，这两章最费脑子，建议留整块时间；后半周，模块七和模块八，收尾交作品集。每一节八到十分钟，一天看两到三节，加上练习大约四十分钟。不要攒到周末一次看完，这门课的价值在填卡，不在看完。课程有效期六个月，重看免费。"},{"u":"audio/geely/g_m0_1_6.m4a?v=202611051410","d":38.5,"t":"每一节怎么学？三步。第一步，把这一节的视频看完，注意是看完，不是打开。系统按有效收听时长计算，听到八成以上才算看完，拖动进度条不算数。第二步，点马上测评，做五道随堂题，每题一分钟，十分钟倒计时。第三步，测评通过，下一节自动解锁。视频没听完，或者测评没过，下一节是锁着的。这两个条件缺一不可，这是本课唯一的硬规则。"},{"u":"audio/geely/g_m0_1_7.m4a?v=202611051410","d":36.07,"t":"测评怎么设计？先说随堂。每节五道题，答对三道通过，题目全部来自本节内容，大概一半是场景题：给一个具体的业务情境，问你第一步该做什么。做题的时候，提交之前答案可以随时改，点了提交就锁定，立刻出成绩和逐题解析。成绩取历史最好一次，没过可以重做，重做会重新计时。十分钟倒计时归零会自动交卷，所以别在一道题上耗太久。"},{"u":"audio/geely/g_m0_1_8.m4a?v=202611051410","d":34.49,"t":"然后是章节测评。每学完一章，也就是七到八节全部完成之后，解锁这一章的章节测评，十道题，十分钟，答对六道通过。它比随堂难一档，案例更长，干扰项更接近真实会议上的说法。章节测评不通过，下一章第一节就打不开。这是为了确保你带着完整的框架进入下一章。重做不限次数，但每次题目顺序和选项顺序会变，背答案没有用。"},{"u":"audio/geely/g_m0_1_9.m4a?v=202611051410","d":39.6,"t":"最后是认证。总分一百分，由四块构成：学习完成度五分，随堂练习五分，客观题考试五十分，实操作品集四十分。客观题三十三题，单选多选判断都有，多选必须全对才给分，考完即冻结。作品集两件交付物，由评审按四个维度打分。注意分值分布：客观题和作品集占了九十分，随堂和完成度只有十分。意思是，光把视频看完拿不到证，必须真的会做题、交得出东西。"},{"u":"audio/geely/g_m0_1_10.m4a?v=202611051410","d":41.38,"t":"发证是四个条件同时满足，不是总分过线就行。第一，总分不低于七十五；第二，客观题得分率不低于七成；第三，作品集得分率不低于七成；第四，九项能力子项里，任何一项都不能低于六成，这叫短板否决。为什么这么设？因为总分可以靠强项拉平，但一项能力真的不会，到了岗位上就会出事。三个阶段分别认定三组能力，目前开放的是阶段一，模块一到模块二。"},{"u":"audio/geely/g_m0_1_11.m4a?v=202611051410","d":38.26,"t":"最后三条注意事项。第一，别攒着看，这门课每天四十分钟，两周能走完，攒到周末就是三次放弃。第二，工具卡一定要用自己的真实项目去填，填别人的案例，评审一眼就能看出来。第三，遇到和工作冲突的章节，先跳过去看下一节，回头再补，但章节测评之前必须补齐。好，规则讲完了。下一节我们正式开始模块一：什么叫可验证的判断顺序。"},{"u":"audio/geely/g_m0_1_12.m4a?v=202611061038","d":54.67,"t":"导学到这里就结束了。三句话带走：第一，这门课教的是判断顺序，先看场景，再定问题，最后才谈功能，顺序反了，努力就是成本。第二，八模块五十九节，两周节奏，每天四十分钟，别攒着看，攒到周末就是三次放弃。第三，工具卡必须用你自己的真实项目填，填别人的案例，评审一眼就能看出来。下一节正式进模块一：为什么说用户思维不是态度，而是一套能被追问的判断顺序。我们从一个真实现象说起——一个新系统上线三个月，使用率不到两成，问题到底出在哪。"}],"g_m1_1":[{"u":"audio/geely/g_m1_1_0.m4a?v=2026110417","d":60.24,"t":"这一节我们讲第一件事：什么叫用户思维。先说结论，用户思维不是态度问题，是一套判断顺序。很多同学听到这儿会觉得，态度我也没问题，我很愿意听一线的意见。但你在项目里一定遇到过这种情况：需求会上所有人都说这个字段有用，上线三个月，使用率不到两成。这不是态度的问题，是顺序的问题——先收集意见，再拼功能，最后才想谁在用。这三分钟，我给你三样东西：三种看起来很努力、其实没有判断的伪用户思维；一个可以照着走的顺序，先场景、再问题、后功能；还有一件事，顺序错了，代价到底落在谁头上。"},{"u":"audio/geely/g_m1_1_1.m4a?v=2026110417","d":65.52,"t":"先说三种伪用户思维。第一种，态度好但判断错。开会最积极，用户提什么都记下来，最后做成一个功能很全的系统。他以为功能多就是诚意，结果系统越做越重，一线越用越绕。第二种，调研走过场。问卷发了三百份，访谈做了十几场，报告写得很长，结论是「希望系统更好用一点」。这句话没错，但它落不到任何一个设计决策上——你没法拿它去决定这个按钮放左边还是右边。第三种，把领导当用户。按汇报的口径设计系统，因为汇报的时候领导看得见。上线以后天天用它的是一线专员，而这位专员从来没进过需求评审会。这三种的共同点，不是不努力，是没有判断顺序。"},{"u":"audio/geely/g_m1_1_2.m4a?v=2026110417","d":54.89,"t":"那正确的顺序是什么？三句话：先还原场景，再定义问题，最后才谈功能。场景是「谁、在什么条件下、为完成什么」，问题是「他现在卡在哪一步、付出了什么代价」，功能是前两步的答案。顺序一反，后面全废——因为功能一旦先定下来，场景就会被裁掉去迁就它。说代价：顺序错了，代价不落在你身上，落在那位每天多点二十下的专员身上，落在月底加班核单的审核员身上。所以这一节的任务很简单：找一件你手上正在做的需求，先别写方案，把「谁在用」写成具体的岗位和人，写不出来就先停。"},{"u":"audio/geely/g_m1_1_3.m4a?v=202611061038","d":48.26,"t":"这一节钉三句话。第一，伪用户思维有三种：态度好但没判断、调研走过场、把领导当用户。第二，正确顺序是先还原场景，再定义问题，最后才谈功能，顺序一反，后面全废。第三，顺序错了，代价不落在你身上，落在每天多点二十下的专员身上。下一节我们看反面：顺序错到底会变成什么样。数字化项目里最常见的三类错位，你可以拿它照一照自己手上的系统。先猜一个：把纸质流程原样搬上线，一线为什么反而更慢了？"}],"g_m1_2":[{"u":"audio/geely/g_m1_2_0.m4a?v=2026110417","d":70.87,"t":"上一节说了判断顺序，这一节我们看反面：顺序错了会变成什么样。数字化项目里最常见的三类错位，都是把「做了什么」当成了「改善了没有」。我先说个现象。有个基地的报销流程上线以后，一线反馈比纸质时代更慢。项目组的判断是「用户不习惯」，于是加培训、发操作手册。三个月后还是慢。后来有人去跟了半天班才发现：纸质时代，一张单子填完直接递给隔壁工位的领导签字；上线以后要拍照上传、要选成本中心、要等领导有空登录系统审批。系统一步没少，还多了附件和等待。这不是习惯问题，是把流程原样搬上线的必然结果。这五分钟，把三类错位讲清楚，你回去可以拿这三条去照自己的项目。"},{"u":"audio/geely/g_m1_2_1.m4a?v=2026110417","d":64.73,"t":"第一类，把流程线上化当成体验改善。判定标准很简单：字段有没有减少，审批环节有没有减少，等待时间有没有缩短。三个都没有，那你做的只是把写字换成了打字。真正的体验改善，往往发生在「删」上面，不在「加」上面。我常说一句话：上线一个系统，先删三个字段，比加三个功能更能让人感受到变化。第二类，把报表当成决策支持。很多系统做了很漂亮的看板，十几个图表，但看完以后你不知道该干什么。财务的同事看完还得自己导出来算一遍，于是继续用 Excel。绕行就是从这儿开始的——不是他不愿意用系统，是系统没有给他结论。决策支持的定义是：看完这张表，他能做出一个决定，或者能回答一个会上会被问到的问题。"},{"u":"audio/geely/g_m1_2_2.m4a?v=2026110417","d":54.17,"t":"第三类，把使用率当成满意度。这一条最容易被误读，因为在内部系统里，使用率天然很高——制度要求你必须用。一个被强制使用的系统，使用率可以是百分之百，同时满意度很低。它反映的是流程强制力，跟体验没关系。那看什么？看绕行率、看人均操作步数、看二次修改率、看单均耗时、看求助工单量。这些指标才反映体验。我建议每个项目上线后都看一个数：同一件事，在系统内完成的比例是多少，剩下那些人是怎么办成的。这个数往上走，才叫体验改善。"},{"u":"audio/geely/g_m1_2_3.m4a?v=2026110417","d":70.01,"t":"这三类错位背后有一个共同的根源：把交付当成成果。项目交付物是上线通知，成果是行为改变。上线通知可以按计划发出，行为改变不会。所以我建议你把每个项目的验收标准改一下：不写「系统已上线并稳定运行」，写「某岗位的某动作，从几步降到几步、从几分钟降到几分钟」。这个改动看着小，它会让整个项目组的注意力从「按时交付」转到「有没有变」。还有一个更隐蔽的版本：把上线当成了终点。上线之后没人看数据、没人回访、没人改，系统就停在第一版。职能系统真正的价值往往在第二版、第三版才出来，因为第一版只能验证流程通不通，第二版才知道哪里真的卡。所以我建议每个系统上线后固定做一次三十天回访，看三个数：绕行率、求助量、单均耗时。"},{"u":"audio/geely/g_m1_2_4.m4a?v=2026110417","d":49.2,"t":"把这三类错位收一下。线上化不等于体验，因为字段和环节可能一个没少；报表不等于决策支持，因为看完还得自己算；使用率高不等于满意，因为它是制度推出来的。判断的方法就一句：你做的这件事，改变了用户哪一个具体动作、减少了多少时间、少了几次返工。答不上来，说明你还在做「做了什么」，没做到「改善了没有」。这一节的任务：拿你现在负责的一个系统，把这三个数找出来——单均操作步数、单均耗时、绕行率。找不出来的，说明你现在还看不到体验。"},{"u":"audio/geely/g_m1_2_5.m4a?v=202611061038","d":53.95,"t":"这一节钉三句话。第一，线上化不等于体验，判定标准是字段有没有减少、环节有没有减少、等待有没有缩短，三个都没有，你只是把写字换成了打字。第二，报表不等于决策支持，看完这张表他能做出一个决定，才算支持，看完还要自己导出来算，他会继续用 Excel。第三，使用率高不等于满意，内部系统的使用率是制度推出来的，要看绕行率、单均步数、二次修改率。下一节给你一把全课通用的尺子——场景还原五问。一个中等规模的需求池，五问填完，大概三成会被自己的答案否掉。"}],"g_m1_3":[{"u":"audio/geely/g_m1_3_0.m4a?v=2026110417","d":47.83,"t":"这一节是 M1 的核心，也是整门课后面所有方法的地基：场景还原五问。这十分钟，我要让你带走一个能当场用的东西——不是概念，是五个问题，以及每一问必须拿到的证据。先给结论：五问填满，你能直接否掉三成需求；五问填不满，说明这个需求还没到能评审的程度。为什么这么说？因为大部分需求写的是方案，不是场景。比如「报销单要支持批量导入」。这句话里没有人在用，没有条件，没有代价。它可能对，也可能完全没必要——你没法判断。"},{"u":"audio/geely/g_m1_3_1.m4a?v=2026110417","d":58.63,"t":"我先说五问为什么有效。它的顺序是设计过的：从人，到条件，到目的，到绕行，到最后后果。前面四问是还原，最后一问是定价。顺序不能反，反了就会变成「先问要不要做」。很多需求评审开成吵架会，就是因为一上来就讨论「这个功能该不该做」，而没人知道用户当时在什么条件下、卡在哪一步。五问的作用，是把讨论从「要不要」拉回到「是不是这样」。我做过统计，一个中等规模的职能系统需求池，五问填完，大概三成会被自己的答案否掉：要么使用者根本找不出来，要么说不出绕行路径，说明这个痛感不成立。"},{"u":"audio/geely/g_m1_3_2.m4a?v=2026110417","d":49.7,"t":"第一问，谁在用。注意，不是「财务人员」，是「某基地一位费用审核员」，要写到岗位、职级、人数，还要写是不是外包、是不是兼职。为什么要这么细？因为外包和正式员工在权限、培训覆盖、离职率上完全不同，兼职的人一个月只进来两次，他记不住路径。这一问要拿到的证据是：这个人真实存在，你能叫出他的岗位。填不出来的意思是：你还没找到真正的使用者，现在讨论的是想象中的用户。最常见的错误是写「全体财务人员」，这等于没写。"},{"u":"audio/geely/g_m1_3_3.m4a?v=2026110417","d":54.65,"t":"第二问，在什么条件下。时间压力、设备、场地、会不会被打断。同一个人在不同条件下完全是两个用户。月底关账前一天的他，和月中闲着的他，对同一个界面的容忍度差好几倍。这一问要的证据是一次完整观察或者一份跟班记录，不是「我跟他聊过」。比如你在会议室里问他流程顺不顺，他一定说不顺；但你坐在他工位旁边看，会发现他其实是在两个系统之间来回切，真正的卡点不是界面难用，是数据在两个系统里对不上。填不出来，说明你只在会议室里理解用户。"},{"u":"audio/geely/g_m1_3_4.m4a?v=2026110417","d":59.64,"t":"第三问，为完成什么。这一问要的是他交付的那个动作，不是系统里的功能名。不是「提交报销单」，是「月结前把这张单子核完，别拖到次月」。区别在哪？前者是系统语言，后者是工作语言。工作语言里带着截止时间和后果，能帮你判断这件事有多急、错一次的代价有多大。填不出来，说明你在按功能清单设计，不是按工作目标设计。我常让学员做一个小练习：把需求描述里所有的动词圈出来，如果圈出来的都是点击、提交、查询、导出，那就是功能清单；如果出现核完、催到、对平、签完，那才是工作目标。"},{"u":"audio/geely/g_m1_3_5.m4a?v=2026110417","d":48.74,"t":"第四问，现在怎么绕过。这一问最值钱，因为它暴露真实约束。绕过的方式有很多：Excel 台账、微信群、纸质单、私人记录、让同事代为填写。每一种绕行都指向一个系统没解决的约束。比如审核员在 Excel 里建了一张供应商历史付款台账，说明系统里查不到历史付款；比如采购员在微信群里问合同编号，说明两个系统的编码没打通。这一问的证据要具体到文件名、群名、台账名。说不出具体的，说明你还没看到真实约束，只听到了抱怨。"},{"u":"audio/geely/g_m1_3_6.m4a?v=2026110417","d":48.29,"t":"第五问，不做会怎样。后果是什么、谁承担、有没有时限。这一问是用来判断紧迫性的，也是用来判断「该不该由系统解决」的。有些后果是流程问题，加功能解决不了；有些是培训问题；还有些后果，其实根本没人承担，那就说明这件事优先级不高，别硬做。五个问题问完，输出是一张能拿去开会的卡：左边五个问题，右边填证据。这张卡最大的价值不是记录，是筛子——填不满的那几行，就是这个需求还没准备好的地方。"},{"u":"audio/geely/g_m1_3_7.m4a?v=2026110417","d":70.18,"t":"我们拿一个真实场景把五问走一遍，你就知道这张卡怎么填。需求是「报销单要加项目编号字段」。第一问，谁在用：某基地费用审核员，正式员工，一共四人，其中两人兼岗；第二问，什么条件下：月结前五天最忙，一天要看六十到八十单，一半以上的单子附件不全要退回；第三问，为完成什么：月结前把这批单子核完，别拖到次月影响关账；第四问，怎么绕过：审核员自己维护了一张 Excel 台账，文件名就叫「待核清单」，每天更新；第五问，不做会怎样：关账延后，财务经理要在集团会上说明原因。五问填完你会发现，真正的问题不是缺项目编号，是附件不全导致反复退回——项目编号只是他们想到的一个解法。这就是五问的价值：它把「要什么功能」变成了「卡在哪一步」。"},{"u":"audio/geely/g_m1_3_8.m4a?v=2026110417","d":61.68,"t":"再说五问在评审会上怎么用，这是它最实用的地方。当有人提一个需求，你不要说「我觉得没必要」，那会变成立场之争。你只问三句：这个功能谁用，能说出岗位吗；他现在怎么解决这件事，有没有具体文件名；不做的话，后果谁承担。这三句问完，通常有三种结果：一是对方答得很顺，那这个需求成立，往下走；二是对方卡在第二问，说明他还没去过现场，你可以建议他先去跟半天班；三是对方卡在第三问，说明这件事没有后果承担者，那它就不是需求，是想法。用这三句的好处是，你否掉的是证据不足，不是某个人。这在对内协作里非常重要，因为你们明天还要一起开会。"},{"u":"audio/geely/g_m1_3_9.m4a?v=2026110417","d":54.17,"t":"最后说五问的边界，别把它用成万能工具。有三种情况五问不够用。第一种，全新业务，还没有现有用户，这时候没有「现在怎么绕过」可问，你得用类比和推演，去找一个最接近的相似场景。第二种，跨部门流程重设计，问题不在单点动作，而在部门之间的交接，这时候要把五问按环节各做一遍，看断点落在哪个交接处。第三种，制度性约束，比如合规要求必须留痕，这时候五问能帮你算清成本，但改不了结论，你要做的是把成本讲给制度 owner 听。认清边界，比把工具用到底更重要。"},{"u":"audio/geely/g_m1_3_10.m4a?v=2026110417","d":44.54,"t":"收一下。五问的顺序是：谁在用、在什么条件下、为完成什么、现在怎么绕过、不做会怎样。每一问都要拿到可指认的证据：岗位、观察记录、交付动作、文件名、承担者。拿不到就是没还原。判断标准很硬：填不满三行以上的，别提交评审，回去补。这一节的任务：挑一个你手上的需求，把这张五问卡填完，然后发给你的主管看。特别注意第四问，如果你写不出具体的文件名和群名，就说明你还没去过现场。"},{"u":"audio/geely/g_m1_3_11.m4a?v=202611061038","d":127.22,"t":"这一节的方法讲完了，最后加一段方法之外的东西：这件事怎么用 AI 提速。先说清楚，AI 不替你判断，它替你搬运和整理。你手上一定有这些东西：需求评审的会议纪要、三个月的工单记录、群里的聊天截图、上一版的需求文档。五问的答案大部分已经存在里面了，只是散在各处。以前你要花半天一条条翻，现在可以一起交给 WorkBuddy，让它按五问逐条抽。我常用的说法是：这是一份需求评审纪要和三个月的工单记录，请按五问逐条抽取。谁在用，写到岗位、职级、是否外包；在什么条件下；为完成什么；现在怎么绕过；不做会怎样。每一问必须给出原文出处，出自第几段、哪条工单；原文里没有的，写「缺口」，不要推测。最后按缺口排序，告诉我应该去访谈哪三个人、各问什么。注意最后那两句：要出处、不许推测。这两句决定了输出能不能用。AI 最常见的两个毛病，一是把方案当场景——你给它「支持批量导入」，它会顺着写成场景；二是补全一个不存在的岗位，写得很像，但那个人你根本找不到。所以它给的每一条证据，你都要能在原文里找到原句，找不到就删。它还有一件事做得比人快：找缺口。五问里哪几格是空的，它一列就出来了。你拿着这张缺口表去现场，比拿着一份完整但全是推测的表有用得多。这一段大概是这么个效率：原来半天的梳理压到二十分钟，省下的时间不是用来休息，是用来补那两个你最不想去的访谈。工具的位置要放对：它把材料变成表格，你把表格变成判断。"},{"u":"audio/geely/g_m1_3_12.m4a?v=202611061038","d":50.21,"t":"五问这一节，钉三句话。第一，顺序不能反：谁在用、什么条件下、为完成什么、怎么绕过、不做会怎样。第二，每一问都要拿到可指认的证据：岗位、观察记录、交付动作、文件名、承担者。第三，填不满三行以上的，别提交评审，回去补。下一节换一个角度看同一件事：B 端一个字段加不加，使用者、管理者、决策者、监管者会给你四个答案——你听谁的？而且还有第五种人，不在四层里，却能一句话否掉你。"}],"g_m1_4":[{"u":"audio/geely/g_m1_4_0.m4a?v=202611061142","d":41.66,"t":"这一节解决一个具体麻烦：一个字段到底加不加，四个角色给你四种答案，听谁的？职能数字化系统里，这几乎是每天都要面对的事。这一节十分钟，我给你一个分层结构，以及一条唯一的判据——不是按级别排，也不是按人数排，是按后果归属排。先说结论：同一套系统，四个人说的「好用」根本不是一件事。你把他们的诉求混在一起讨论，结论一定是最保守的那个方案，因为每个人的诉求都会削掉别人的东西。"},{"u":"audio/geely/g_m1_4_1.m4a?v=202611061142","d":42.34,"t":"第一层，使用者。他看的是动作和频次：一天点几次、每次几步、会不会被打断。他要的是快。判断使用者的诉求真不真，不要问他「你觉得好不好用」，问他「昨天这件事你做了几遍、花了多久」。使用者的诉求有个特点：极其具体，而且经常跟制度冲突。他说「这个附件能不能不传」，背后可能是制度要求必须留档。这时候你要做的是把冲突记下来，不是当场答应或拒绝。"},{"u":"audio/geely/g_m1_4_2.m4a?v=202611061142","d":40.32,"t":"第二层，管理者。他看的是指标和考核：人均单量、差错率、处理周期。他要的是稳、可算。管理者的诉求往往表现为「要一个报表」「要一个字段」，但你往下追一层，会发现他要的是「能对外解释清楚」。所以对着管理者，你要问的是：这个数你拿去做什么决定，或者回答谁的提问。答不出来的维度，就是可以砍的维度——这一条在 M1 第五节的排版会再讲一次。"},{"u":"audio/geely/g_m1_4_3.m4a?v=202611061142","d":42.65,"t":"第三层，决策者。他看投入产出：这笔钱换来什么、能不能对外讲、能不能写进年度总结。他要的是值。职能系统的决策者通常不是业务一把手，而是分管副总或者数字化负责人。他关心的不是某个页面好不好用，而是这个项目跟集团今年的重点对不对得上。跟他汇报，不要讲交互细节，讲三件事：省了多少人日、缩了多少天、少了多少差错。这就是下一节「价值判据」要展开的内容。"},{"u":"audio/geely/g_m1_4_4.m4a?v=202611061142","d":43.8,"t":"第四层，监管者。他看留痕和合规：三年后能不能追溯、有没有依据、审计来了能不能拿得出来。他要的是可查。这一层最容易被忘掉，因为它不在日常需求会上。但它是否决权最大的一层——一旦审计提出意见，前面所有的体验优化都要让路。所以你在设计阶段就要问：这个流程的留痕要求是哪份制度定的，要求保存几年，谁有权查看。这三个问题问清楚，能省掉后面很多返工。"},{"u":"audio/geely/g_m1_4_5.m4a?v=202611061142","d":44.76,"t":"四层讲完，我们看三种典型的互斥结构。第一种，快对稳。一线要少填，审核要留痕。字段越多审核越省事，一线越费时。第二种，细对简。管理层要维度，执行层要步数。第三种，留痕对效率。合规要审批链，业务要当天办完。这三种互斥，你在任何一个职能系统里都会遇到，而且它们不会自己消失，只能被裁决。很多项目卡住，不是因为方案不好，是因为没人做这个裁决，于是一直挂着。"},{"u":"audio/geely/g_m1_4_6.m4a?v=202611061142","d":54.26,"t":"裁决的判据只有一个：谁承担后果。注意，是承担后果，不是谁级别高、不是谁人多。比如「这个字段要不要设成必填」。一线的后果是每次多花十五秒；审核的后果是这张单子出问题时解释不清。如果出问题时要审核员去写说明、去补材料，那这个字段就该必填，同时你要在一线那一侧补偿——比如带出上次的值、做默认值、做批量填。判据的作用不是选边站，是让你在选边之后知道该补偿谁。我建议每个争议字段都写一行：谁承担后果、补偿动作是什么。写不出来，说明这个裁决还没做完。"},{"u":"audio/geely/g_m1_4_7.m4a?v=202611061142","d":62.62,"t":"举一个采购系统的例子。需求是「合同编号要设成必填，而且从合同系统带过来」。使用者说不要必填，因为急单的时候合同还没签，填不了就卡住了；管理者说必须必填，因为没有合同编号，付款时对不上账；决策者说这个字段能减少多少纠纷；监管者说审计要求每一笔付款都能追到合同。四个人四个答案，而且都对。这时候判据是：谁承担后果。付款对不上账，承担后果的是审核员和财务经理；急单卡住，承担后果的是采购执行。两边都承担后果，那就不是选一个，是设计一个分支：急单走例外通道，标记待补，三十天内补齐，超期提醒。这个方案谁都不满意，但谁的后果都没被忽略。"},{"u":"audio/geely/g_m1_4_8.m4a?v=202611061142","d":64.03,"t":"所以字段争议的处理，我建议固定三步。第一步，摆后果：把每一层「如果不这样，会出什么问题、谁去解释」写下来。写不出来的一方，诉求就先放一放。第二步，定补偿：裁决之后，被削掉诉求的那一方，你要给他一个补偿动作。比如字段必填了，就给一线做默认值、做上次值带出、做批量填；审批链长了，就给业务做一个加急通道。补偿动作不需要很大，但它决定了这个人下次还愿不愿意跟你说真话。第三步，留记录：把裁决理由写进需求文档，注明是谁定的、依据哪份制度。半年后有人翻旧账，你有据可查。这三步做完，一个字段争议大概二十分钟能定，而不是开三次会还挂着。"},{"u":"audio/geely/g_m1_4_9.m4a?v=202611061142","d":60.24,"t":"再说四层失衡会有什么后果，这三种你一定见过。只听使用者，系统会变得很好用但合规上有洞——字段能省就省，留痕能少就少，等到审计来了一次补齐，前面省的都白省。只听管理者，系统会变成考核工具，一线开始系统性绕行：能不进系统就不进，进去了也填假数据。只听决策者，系统会做得很大很全，功能清单漂亮，但每个功能都浅，谁也说不清哪个真的在用。只听众监管者，系统会变成一台留痕机器，每个动作都要审批，业务等不起，最后还是走线下。四种失衡的共同点是：你以为你在优化，其实你在把成本转移给没有发言权的那一层。"},{"u":"audio/geely/g_m1_4_10.m4a?v=202611061142","d":66.72,"t":"那怎么把四层拉到一起？我建议开一次九十分钟的对齐会，四步走。第一步，十五分钟，把场景还原五问的结果念一遍，让所有人对「谁在用、什么条件下」有同一个事实基础。这一步不能省，很多争议是因为大家脑子里想的是不同的用户。第二步，二十分钟，让每一层各说一条最不能让步的诉求，只许说一条，逼他们排序。第三步，三十分钟，逐条摆互斥关系，用「谁承担后果」裁决，当场定，不许带回部门。第四步，十五分钟，把裁决结果和补偿动作复述一遍，确认每层都听懂了。这个会的产出是一页纸，不是会议纪要——一页纸上写清：争了什么、怎么定的、补偿是什么。"},{"u":"audio/geely/g_m1_4_11.m4a?v=202611061142","d":41.47,"t":"最后说一类人：影响者。他不在四层里，却能否决你。典型的是信息安全、内控、法务、IT 架构、工会。他们不产生需求，但会否掉需求。处理方式不是最后才去报批，而是在方案成形之前就拉进来，问他一句：这个做法有没有硬约束。这一句话能省掉你两周的返工。这一节的任务：把你在做的系统，按四层各写一个具体的人名或岗位，然后找出你漏掉的那一层。绝大多数人漏掉的是监管者。"},{"u":"audio/geely/g_m1_4_12.m4a?v=202611061142","d":174.48,"t":"讲完四层，加一段：这张四层表怎么用 WorkBuddy 铺出来。这一节的产出有两样：四个角色各写一个真实的人，每个争议字段写一行——谁承担后果、补偿什么。喂进去四样：系统的字段清单、三次评审纪要、争议字段在群里吵的那几段、你知道的那几份制度文件名。我常用的说法是：请对每个争议字段生成四行后果——使用者、管理者、决策者、监管者，各写一条：不这样做，谁会出什么问题，最后谁去解释。写不出后果的格子就留空，不要替我编。最后把空格单独列出来。最后那句是重点。多数人拿到表想把每格填满，其实空格子才是价值——空的那一层，就是这个字段没有责任人的地方，出事的时候没人接得住。第二个用法：让它扮四个人互驳。你说，你现在是费用审核岗，反对取消必填，讲一次你最担心的事故，要具体到哪张单子、哪次对账。四轮下来，你会拿到四条能直接写进评审纪要的理由。第三个用法，让它出一页裁决单：争的是什么、定了什么、谁定的、依据哪份制度、给谁的补偿动作。这三样出来，一场九十分钟的对齐会基本就够用。但有三个坑。第一，它会按级别加权。你把四层喂给它，它默认把决策者的意见当成结论，可这一节的判据是后果归属，不是级别高低。提示词里要写一句：不要按级别排序，按谁承担后果排。第二，它会给你编制度名和条款号。依据某某办法第十二条这种引用最像专业，也最容易错。条号必须自己核，宁可写待确认条款，也别带着编的条号进审计。第三，它会漏掉第五类人。信息安全、内控、法务、IT 架构、工会，这些不产生需求却能否决你的部门，它想不起来，因为你问题里只有四层。要单独问一句：除了这四层，还有哪些部门能否决这件事。开会之前，它帮你把四层后果表铺好，二十分钟。省下的时间不要用来把表做漂亮，用来真的去找那四个人各聊十分钟。工具的位置放对：它铺后果，你下裁决。"},{"u":"audio/geely/g_m1_4_13.m4a?v=202611061142","d":53.21,"t":"这一节钉三句话。第一，B 端一个字段，四种角色四种答案：使用者看这一步顺不顺，管理者看管不管得住，决策者看值不值，监管者看合不合规。第二，听谁的不能靠嗓门，要看这个字段影响谁的动作、谁承担后果。第三，还有一类人不在四层里，却能一句话否掉你：信息安全、内控、法务、IT 架构、工会。方案成形之前就把他拉进来。下一节我们把「好用」翻译成领导听得懂的话：从用户满意，走到组织绩效改善。少一个人、少一次返工、少一天关账，这三个说法才有分量。"}],"g_m1_5":[{"u":"audio/geely/g_m1_5_0.m4a?v=2026110417","d":39.07,"t":"这一节讲怎么把「更好用」翻译成领导听得懂的话。这是产品经理在职能域最缺的一项能力——不是不会做设计，是不会定价。你做了很多改善，但说不清值多少钱，于是排在别人后面。这一节十分钟，三个价值锚点，四个翻译动作，还有一条判断：翻不出来的需求该排第几。先说结论：用户满意是过程指标，组织绩效才是结果指标。在内部系统里，只讲前者，永远拿不到资源。"},{"u":"audio/geely/g_m1_5_1.m4a?v=2026110417","d":46.61,"t":"为什么「更好用」翻不出来？因为它是形容词，不是数量。形容词没法比较，也没法验收。你说这个系统更好用了，别人问好用多少，你答不上来。更麻烦的是，形容词会让人怀疑你在替用户说话，而不是替组织说话。在职能域，用户和组织是同一个人群，但立场不同：作为用户他想少填两栏，作为组织成员他要对流程负责。你只讲前一半，就会被当成「替一线叫苦」。所以必须翻译，翻译成组织语言：人、钱、天、差错。"},{"u":"audio/geely/g_m1_5_2.m4a?v=2026110417","d":46.42,"t":"第一个锚点，少一个人。原来三个人干的活，两个人能干。这句话等价于编制和人力成本，是最容易被管理层听懂的语言。要注意，不要直接说「可以减一个人」，那会引发抵触。更稳的说法是「同等业务量下，所需投入从三个人降到两个人」，把结论留给对方说。算法是：单次耗时乘以频次乘以人数，得到月工时，再除以一个人的月有效工时。这个数算出来往往比直觉小，但它是可验证的，比形容词有力得多。"},{"u":"audio/geely/g_m1_5_3.m4a?v=2026110417","d":44.09,"t":"第二个锚点，少一次返工。退单、重填、二次核对。这一类最容易验证，因为系统里有记录。退单率从百分之三十四降到百分之十五，就是一个可以写进汇报的数。算法是：退单量乘以单均重填耗时，再乘以涉及人数。返工的价值还有一层：它往往伴随情绪成本和沟通成本，这部分不好量化，但可以在访谈里拿到原话，作为汇报里的引证。我建议每个项目都盯一个返工指标，这是投入产出最清楚的改善点。"},{"u":"audio/geely/g_m1_5_4.m4a?v=2026110417","d":36.96,"t":"第三个锚点，少一天关账。周期缩短影响的是资金效率和管理节奏，比工时更值钱，但需要跨部门数据才能算。比如月结从七天压到六天，对财务意味着什么？意味着资金计划提前一天，意味着管理层早一天看到数。这一条最值钱，也最难算，因为它需要你去找财务计划岗要数据。但只要算出来一次，后面所有项目都可以复用这个换算关系。"},{"u":"audio/geely/g_m1_5_5.m4a?v=2026110417","d":63.86,"t":"接下来是四个翻译动作，可以照着做。第一步，找到那个动作。用户说的「麻烦」，对应哪一个具体动作：填、核、催、查、等。注意是动词，不是模块名。第二步，数清它的频次。一天几次、一月几次、涉及几个人。频次决定价值量级——一天三次的动作，改善百分之二十，价值远大于一年一次的动作改善百分之八十。第三步，折算成时间。单次耗时乘以频次乘以人数，等于月工时，再折算人日。第四步，挂到组织指标上。工时挂人均单量，周期挂关账天数，差错挂退单率。挂不上就降级。"},{"u":"audio/geely/g_m1_5_6.m4a?v=2026110417","d":36.77,"t":"为什么要强调「挂不上就降级」？因为职能域的资源永远不够，你必须排序。一个需求如果既省不了人、省不了时间、降不了差错，那它大概率是「体验优化」，应该排在能算出价值的后面。这不是说体验不重要，是说在资源有限的时候，要先做能算清的。反过来说，如果你手上全是算不清的需求，那说明你没有在做价值管理，你在做需求搬运。"},{"u":"audio/geely/g_m1_5_7.m4a?v=2026110417","d":70.39,"t":"把四个动作走一个完整例子，你会看到数字怎么出来。某集团费用审核岗，单均审核耗时六分半，月均四千二百单，涉及十二个人。第一步找动作：卡在「核对发票与单据是否一致」，这是一个核的动作。第二步数频次：每单必做一次，月四千二百次。第三步折时间：如果系统能自动比对金额和税号，单均从六分半降到四分钟，每单省两分半，月省一万零五百分钟，约一百七十五小时，折二十二人日。第四步挂指标：二十二人日除以月均二十一点七五日，约等于一个人。所以这个需求的表述应该是：同等业务量下，审核投入从十二人降到十一人，或者同样十二人可承接一点零九倍业务量。这句话放进立项材料，比「提升审核效率」有力得多。"},{"u":"audio/geely/g_m1_5_8.m4a?v=2026110417","d":55.34,"t":"这四个动作算完，怎么写进立项文档？我给你一个三行模板。第一行写现状：某岗位，单均耗时多少，月频次多少，涉及多少人，折算月工时多少。第二行写改善：改完预计单均降到多少，月省工时多少，折多少人日，依据是什么（依据可以是试点数据、可以是同类系统对比、可以是访谈里的自述耗时）。第三行写挂靠：这个数对应哪个组织指标，是人均单量、关账天数，还是退单率，这个指标现在是多少，改完预期是多少。三行写完，一页纸，可以直接进排期会。写不满三行的需求，不要拿去争资源，先去补数据。"},{"u":"audio/geely/g_m1_5_9.m4a?v=2026110417","d":70.92,"t":"三个锚点有三个常见误用，提前说清楚，免得你踩。第一个，把「少一个人」说成「可以减员」。这句话一出口，一线立刻把你当对手，后面所有访谈都拿不到真话。正确说法是「同等业务量下投入下降」，减不减人、减谁，是管理者的事，不是你的结论。第二个，把理论工时当成实际节省。算出月省一百七十五小时，不等于真的省了这些时间——如果没有把省下的时间转去做别的事，这些时间会消失在碎片里。所以要在方案里写清楚：省下的时间用来做什么。第三个，口径不一致。你按工时算，财务按人日算，人力按编制算，三个数对不上，会上就会被质疑。统一口径的办法是：先问对方按什么口径考核，再用他的口径重算一遍。"},{"u":"audio/geely/g_m1_5_10.m4a?v=2026110417","d":62.86,"t":"最后说数据从哪来，这是大多数人卡住的地方。三个入口，按可得性排序。第一个，系统日志：单均耗时、操作步数、退回率、二次修改率，这些系统里都有，找 IT 或者运维要，一般一周内能拿到。第二个，财务口径：人日成本、关账天数、退单量，这些在财务报表和管理报表里有，找财务的计划岗或者共享中心负责人。第三个，人力口径：编制、在岗人数、兼岗比例，找 HRBP。三个入口都拿不到的时候，还有一个办法：自己测。找两个人，各做五单，掐表记时间，样本小，但比拍脑袋强，而且这个数据是你自己的，对方没法质疑口径。"},{"u":"audio/geely/g_m1_5_11.m4a?v=2026110417","d":36.55,"t":"这一节收一下。三个锚点：少一个人、少一次返工、少一天关账。四个动作：找动作、数频次、折时间、挂指标。一条判断：翻不出价值的，降级排队。这一节的任务：拿你最近提的一个需求，用这四个动作算一遍，写成三行字——现在花多少时间、改完省多少、挂到哪个组织指标上。写不出来，就说明这个需求你还没想清楚为什么要做。"},{"u":"audio/geely/g_m1_5_12.m4a?v=202611061038","d":47.88,"t":"这一节钉三句话。第一，价值链条是三段：行为改变、业务指标、组织绩效，说不清第三段，价值主张就不算数。第二，用三个锚点说话：少一个人、少一次返工、少一天关账。第三，四个动作算一遍：找动作、数频次、折时间、挂指标，翻不出价值的，降级排队。下一节看一张地图：行业数字化里的六类系统。交易、管控、协同、分析、工具、平台
