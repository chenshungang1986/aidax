<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b4f8a'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' fill='%23fff' text-anchor='middle'%3E用%3C/text%3E%3C/svg%3E">
<title>用户思维 · 吉利汽车产品经理能力培养与认证项目</title>
<style>
:root{
  --pri:#1b4f8a; --deep:#10243d; --ink:#1a1a1a; --mid:#3d4c5c; --muted:#5c6670;
  --soft:#8b96a3; --line:#dfe5ec; --bg:#f4f7fb; --white:#fff;
  --tint:#eef4fb; --tint2:#f8fafd; --accent:#c8102e; --ok:#0f7b5f; --warn:#b26a00;
  --r:10px; --sh:0 1px 2px rgba(16,36,61,.06),0 4px 16px rgba(16,36,61,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,select{font-family:inherit;font-size:inherit}
a{color:var(--pri);text-decoration:none}
.hide{display:none!important}

/* ---------- 登录 ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 22px;
  background:
    radial-gradient(1100px 560px at 8% -12%,#dce8f6 0%,rgba(220,232,246,0) 62%),
    radial-gradient(900px 520px at 102% 112%,#e3ecf7 0%,rgba(227,236,247,0) 58%),
    #f1f5fa}
.lg-wrap{width:100%;max-width:1032px;min-height:548px;display:grid;grid-template-columns:1.12fr .88fr;
  background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 1px 3px rgba(16,36,61,.05),0 24px 64px rgba(16,36,61,.13)}

/* 左：项目品牌墙 */
.lg-hero{position:relative;overflow:hidden;padding:48px 42px 34px;color:#fff;
  display:flex;flex-direction:column;
  background:linear-gradient(148deg,#0a1c2f 0%,#12314f 48%,#1b4f8a 100%)}
.lg-hero:before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:linear-gradient(155deg,#000 6%,rgba(0,0,0,.35) 52%,transparent 82%);
  mask-image:linear-gradient(155deg,#000 6%,rgba(0,0,0,.35) 52%,transparent 82%)}
.lg-hero:after{content:'';position:absolute;width:360px;height:360px;right:-130px;top:-120px;
  border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.3),rgba(96,165,250,0) 70%)}
.lg-hero>*{position:relative;z-index:1}
.lg-proj{font-size:11.5px;line-height:1.7;letter-spacing:.04em;color:#9dbfe0;
  display:flex;align-items:flex-start;gap:9px}
.lg-proj:before{content:'';width:20px;height:2px;background:#4b8bcb;flex:0 0 20px;margin-top:8px}
.lg-title{font-size:38px;font-weight:700;letter-spacing:.04em;line-height:1.22;margin-top:18px}
.lg-sub{margin-top:9px;font-size:13.5px;color:#bed4ea;line-height:1.75;max-width:430px}
.lg-sub b{color:#fff;font-weight:600}
.lg-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;padding:14px 0;
  border-top:1px solid rgba(255,255,255,.15);border-bottom:1px solid rgba(255,255,255,.15)}
.lg-facts b{display:block;font-size:22px;font-weight:600;line-height:1.15;letter-spacing:.01em}
.lg-facts span{display:block;font-size:11px;color:#8fb1d1;margin-top:3px;letter-spacing:.02em}
/* 8 个模块全量展示：2 列 × 4 行，已开放亮、未上线暗 */
.lg-mods{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg-mod{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:9px;min-width:0;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14)}
.lg-mod i{flex:0 0 27px;height:27px;border-radius:7px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-style:normal;
  font-size:11px;font-weight:600;color:#eaf3fc;letter-spacing:.02em}
.lg-mod-t{flex:1;min-width:0}
.lg-mod b{display:block;font-size:12.5px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-mod p{font-size:10.5px;color:#a9c5de;margin-top:2px;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-mod.lock{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.08)}
.lg-mod.lock i{background:rgba(255,255,255,.08);color:#7e9bb7}
.lg-mod.lock b{color:#8ea9c2;font-weight:500}
.lg-mod.lock p{color:#6f8da8}
.lg-mod.lock:after{content:'锁';flex:0 0 auto;font-size:9.5px;color:#7e9bb7;
  border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:1px 4px;line-height:1.4}
.lg-mod.on:after{content:'已开';flex:0 0 auto;font-size:9.5px;color:#9ed0ff;
  background:rgba(96,165,250,.16);border:1px solid rgba(96,165,250,.34);border-radius:4px;padding:1px 4px;line-height:1.4}
.lg-foot{margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;
  gap:12px;font-size:11.5px;color:#8fb1d1;letter-spacing:.02em;flex-wrap:wrap}
.lg-foot span:last-child{color:#a8c9e8}

/* 右：登录表单 */
.lg-form{display:flex;align-items:center;justify-content:center;padding:48px 42px}
.lg-form-in{width:100%;max-width:320px}
.lg-form h2{font-size:20px;font-weight:600;color:var(--deep);letter-spacing:.01em}
.lg-hint{font-size:12.5px;color:var(--soft);line-height:1.7;margin:7px 0 24px}
.lg-btn{height:46px;font-size:15px;letter-spacing:.06em;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mid);margin-bottom:6px;font-weight:500}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 13px;background:#fbfcfe;transition:.15s}
.field input:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(27,79,138,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;
  border-radius:8px;background:var(--pri);color:#fff;font-weight:500;transition:.15s;width:100%}
.btn:hover{background:#173f6e}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.line{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.line:hover{background:var(--tint)}
.btn.sm{height:34px;padding:0 13px;font-size:13px;width:auto;border-radius:7px}
.btn.gray{background:#eef1f5;color:var(--mid)}
.btn.danger{background:#fdecee;color:var(--accent)}
.login-err{background:#fdecee;color:var(--accent);font-size:13px;padding:9px 12px;border-radius:7px;margin-bottom:12px}
.login-tip{font-size:11.5px;color:var(--soft);text-align:center;margin-top:18px;line-height:1.85}

/* ---------- 个人中心 ---------- */
.me-hd{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.me-av{width:54px;height:54px;border-radius:50%;background:linear-gradient(140deg,#1b4f8a,#0a3d91);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex:0 0 54px}
.me-id{flex:1;min-width:0}
.me-id h2{font-size:19px;color:var(--deep)}
.me-id p{font-size:12.5px;color:var(--muted);margin-top:3px}
.me-go{flex:0 0 auto}
.plan-bar{height:9px;background:#eef1f6;border-radius:5px;overflow:hidden;margin-bottom:16px}
.plan-bar i{display:block;height:100%;background:linear-gradient(90deg,#1b4f8a,#4a9fe0);border-radius:5px;transition:width .4s}
.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.plan-grid div{background:#f7f9fc;border-radius:9px;padding:12px 14px}
.plan-grid b{display:block;font-size:19px;color:var(--pri);font-weight:600}
.plan-grid span{display:block;font-size:11.5px;color:var(--soft);margin-top:2px}
.plan-next{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.plan-next>div{flex:1;min-width:0}
.plan-next b{font-size:12px;color:var(--soft);font-weight:500}
.plan-next p{font-size:13.5px;color:var(--deep);margin-top:3px;line-height:1.6}
.me-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.mrow+.mrow{border-top:1px solid #f1f4f8}
.mn{flex:0 0 156px;font-size:13px;color:var(--deep)}
.mb{flex:1;height:7px;background:#eef1f6;border-radius:4px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--pri);border-radius:4px}
.mv{flex:0 0 auto;font-size:11.5px;color:var(--soft)}
.me-score{display:flex;align-items:baseline;gap:6px}
.me-score b{font-size:32px;color:var(--pri);font-weight:700;line-height:1}
.me-score span{font-size:12px;color:var(--soft)}
.chiprow{margin-left:auto;display:flex;gap:4px}
.me-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
.rrow{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:13px}
.rrow+.rrow{border-top:1px solid #f4f6f9}
.rrow:hover{background:#f8fafd}
.rdot{width:7px;height:7px;border-radius:50%;background:#c9d3df;flex:0 0 7px}
.rdot.ok{background:var(--ok)}
.rt{flex:0 0 44px;color:var(--soft);font-size:12px}
.rn{flex:1;min-width:0;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{flex:0 0 auto;color:var(--muted);font-size:11.5px}
.rwhen{flex:0 0 auto;color:var(--soft);font-size:11.5px;min-width:56px;text-align:right}
.sitem.lock{opacity:.55;cursor:not-allowed}
.sitem.lock .lk{font-size:11px}

/* ---------- 通用外壳 ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:0;z-index:50;height:56px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px}
.topbar .brand{font-weight:600;font-size:15px;color:var(--deep);white-space:nowrap}
.topbar .brand span{color:var(--soft);font-weight:400;font-size:12.5px;margin-left:8px}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mid)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--pri);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.crumb{font-size:13px;color:var(--soft);margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb button{color:var(--pri);font-size:13px}
.crumb button:hover{text-decoration:underline}

/* ---------- 课程卡 ---------- */
.hero{background:linear-gradient(120deg,#10243d,#1b4f8a);border-radius:14px;padding:26px 28px;color:#fff;margin-bottom:22px}
.hero h2{font-size:22px;font-weight:600;margin-bottom:8px}
.hero p{font-size:13.5px;color:#c5d6e8;line-height:1.75;max-width:760px}
.hero .meta{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;font-size:12.5px;color:#a8c2dc}
.hero .meta b{color:#fff;font-weight:600}
/* 开篇导学：首页入口条 + 导学页三块要点 */
.intro-bar{display:flex;align-items:center;gap:14px;background:linear-gradient(96deg,#edf4fd,#f8fbff);
  border:1px solid #dbe7f6;border-radius:14px;padding:15px 20px;margin-bottom:18px;cursor:pointer;transition:.18s}
.intro-bar:hover{border-color:#b9d4ee;box-shadow:0 6px 20px rgba(16,36,61,.07)}
.ib-ic{flex:0 0 38px;height:38px;border-radius:10px;background:#1b4f8a;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.ib-t{flex:1;min-width:0}
.ib-t b{display:block;font-size:14.5px;color:var(--deep);font-weight:600;margin-bottom:3px}
.ib-t p{font-size:12.5px;color:var(--mid);line-height:1.6}
.ib-go{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--pri)}
.intro-bar.done .ib-ic{background:#2e7d5b}
.intro-bar.done .ib-go{color:var(--soft)}
.intro-pts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 4px}
.intro-pts>div{background:#f6f9fd;border:1px solid #e6eef7;border-radius:11px;padding:14px 16px}
.intro-pts b{display:block;font-size:13px;color:var(--deep);margin-bottom:6px}
.intro-pts p{font-size:12.5px;color:var(--mid);line-height:1.72}

.mod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.mod-card{background:#fff;border-radius:14px;padding:22px;box-shadow:var(--sh);border:1px solid #edf1f6;
  display:flex;flex-direction:column;transition:.18s}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(16,36,61,.1)}
/* 未上线模块：灰显但信息完整，不做 hover 抬升，避免被误认为可点 */
.mod-card.lock{background:#fafbfd;border-color:#eef1f6;box-shadow:none}
.mod-card.lock:hover{transform:none;box-shadow:none}
.mod-card.lock .no{color:#9aa9b9}
.mod-card.lock h3{color:#5d7185}
.mod-card.lock .desc{color:#8b9bad}
.mod-card.lock .prog-bar{background:#edf0f4}
.mod-card.lock .btn{cursor:not-allowed}
.mod-card .no{font-size:11.5px;font-weight:600;color:var(--pri);letter-spacing:.1em;margin-bottom:8px}
.mod-card h3{font-size:18px;font-weight:600;color:var(--deep);margin-bottom:8px}
.mod-card .desc{font-size:13px;color:var(--mid);line-height:1.72;flex:1}
.mod-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--pri)}
.tag.gray{background:#f0f2f5;color:var(--muted)}
.prog-wrap{margin:14px 0 6px}
.prog-bar{height:6px;background:#e9eef4;border-radius:3px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#1b4f8a,#3f7fc4);border-radius:3px;transition:width .4s}
.prog-txt{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px}
.mod-actions{display:flex;gap:10px;margin-top:14px}
.mod-actions .btn{flex:1}

/* ---------- 学习页 ---------- */
.learn{display:grid;grid-template-columns:246px 1fr;gap:22px;align-items:start}
.sidelist{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;position:sticky;top:74px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.sidelist .hd{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--deep);display:flex;justify-content:space-between;align-items:center}
.sidelist .hd small{font-weight:400;color:var(--soft);font-size:11.5px}
.sidelist .list{overflow-y:auto;flex:1;padding:6px}
.sitem{display:flex;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;align-items:flex-start;transition:.13s}
.sitem:hover{background:var(--tint2)}
.sitem.on{background:var(--tint)}
.sitem .sn{width:20px;height:20px;border-radius:50%;background:#e9eef4;color:var(--soft);font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:0 0 20px;margin-top:2px;font-weight:600}
.sitem.done .sn{background:#e3f3ec;color:var(--ok)}
.sitem.on .sn{background:var(--pri);color:#fff}
.sitem .st{font-size:12.5px;line-height:1.5;color:var(--mid)}
.sitem.on .st{color:var(--deep);font-weight:500}
.sitem .sm{font-size:11px;color:var(--soft);margin-top:2px}

.panel{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;min-height:520px;display:flex;flex-direction:column}
.panel .ph{padding:22px 28px 16px;border-bottom:1px solid #f0f3f7}
.panel .ph .k{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.06em;margin-bottom:8px}
.panel .ph h2{font-size:21px;line-height:1.45;font-weight:600;color:var(--deep)}
.panel .pb{padding:24px 28px;flex:1}
.panel .pf{padding:14px 28px;border-top:1px solid #f0f3f7;display:flex;align-items:center;gap:12px;background:#fbfcfe}
.panel .pf .spacer{flex:1}
.pg-ind{font-size:12.5px;color:var(--soft)}

/* 内容页版式 */
.hook{background:var(--tint);border-left:4px solid var(--pri);border-radius:0 8px 8px 0;padding:16px 20px;margin-bottom:22px}
.hook .lab{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.hook p{font-size:15.5px;color:var(--deep);font-weight:500;line-height:1.6}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.goal{border-top:2px solid var(--line);padding-top:10px}
.goal .gno{font-size:11px;color:var(--pri);font-weight:700;margin-bottom:5px}
.goal p{font-size:13.5px;color:var(--mid);line-height:1.65}

.cpage h3{font-size:19px;font-weight:600;color:var(--deep);line-height:1.5;margin-bottom:8px}
.cpage .lead{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f0f3f7}
.mcards{display:grid;gap:12px}
.mcards.c2{grid-template-columns:1fr 1fr}
.mcards.c3{grid-template-columns:repeat(3,1fr)}
.mcards.c4{grid-template-columns:repeat(2,1fr)}
.mcard{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:#fff;position:relative;overflow:hidden}
.mcard:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--pri)}
.mcard .n{font-size:11px;color:#b9c6d4;font-weight:700;letter-spacing:.06em;margin-bottom:7px}
.mcard h4{font-size:14.5px;font-weight:600;color:var(--pri);margin-bottom:8px;line-height:1.45}
.mcard p{font-size:13px;color:var(--muted);line-height:1.72}

.steps{display:flex;flex-direction:column;gap:9px}
.mstep{display:flex;gap:14px;border:1px solid var(--line);border-radius:9px;padding:13px 16px;background:#fff;align-items:flex-start}
.mstep .sn{font-size:13px;font-weight:700;color:var(--pri);flex:0 0 26px;padding-top:1px}
.mstep .sc h4{font-size:14px;font-weight:600;color:var(--deep);margin-bottom:4px}
.mstep .sc p{font-size:12.8px;color:var(--muted);line-height:1.65}

.mtable{width:100%;border-collapse:collapse;font-size:12.8px}
.mtable th{background:var(--pri);color:#fff;padding:9px 11px;text-align:left;font-weight:500;font-size:12.5px}
.mtable th:first-child{border-radius:7px 0 0 0}
.mtable th:last-child{border-radius:0 7px 0 0}
.mtable td{border-bottom:1px solid #eef1f5;padding:10px 11px;color:var(--muted);line-height:1.6;vertical-align:top}
.mtable tr:nth-child(even) td{background:#fafbfd}
.mtable td:first-child{color:var(--deep);font-weight:500}

.bands{display:flex;flex-direction:column;gap:9px}
.band{border-radius:9px;padding:14px 18px;display:flex;gap:16px;align-items:flex-start;border:1px solid}
.band .bn{font-size:13px;font-weight:700;flex:0 0 64px;padding-top:1px}
.band p{font-size:13px;line-height:1.68;color:var(--mid)}

.mcompare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ccol{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ccol .ch{padding:11px 16px;font-size:13.5px;font-weight:600;color:#fff}
.ccol.good .ch{background:var(--pri)}
.ccol.bad .ch{background:#6b7785}
.ccol ul{list-style:none;padding:12px 16px}
.ccol li{position:relative;padding-left:16px;font-size:12.8px;color:var(--mid);line-height:1.65;margin-bottom:9px}
.ccol li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--pri)}

.note{background:#fbfaf6;border:1px solid #efe9d9;border-radius:9px;padding:15px 18px;margin-top:16px}
.note .nl{font-size:11.5px;font-weight:600;color:#8a6d2f;letter-spacing:.05em;margin-bottom:7px}
.note p{font-size:13px;color:#5c5340;line-height:1.75;white-space:pre-wrap}

.case{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff}
.case .cd{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.05em}
.case h3{font-size:19px;font-weight:600;color:var(--deep);margin:8px 0 16px;line-height:1.45}
.case .cs{font-size:13.5px;color:var(--mid);line-height:1.8;white-space:pre-wrap}
.case .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.case .stat{background:var(--tint2);border:1px solid var(--line);border-radius:9px;padding:12px}
.case .stat b{display:block;font-size:20px;color:var(--pri);font-weight:600;line-height:1.2}
.case .stat span{font-size:11.5px;color:var(--soft);display:block;margin-top:4px}
.case .flip{background:var(--tint);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin-top:16px}
.case .flip .fl{font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px}
.case .flip p{font-size:13px;color:var(--mid);line-height:1.72}
.case .wrong{font-size:12.5px;color:var(--soft);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.case .wrong b{color:var(--muted);font-weight:500}

/* 答题 */
.qbox{background:#fbfcfe;border:1px solid #e6ecf3;border-radius:12px;padding:22px}
.qbox .qh{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.05em;margin-bottom:12px}
.qbox .qt{font-size:15.5px;color:var(--deep);font-weight:500;line-height:1.65;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff;
  cursor:pointer;transition:.13s;align-items:flex-start}
.opt:hover{border-color:#b9cde3;background:#fbfdff}
.opt .ol{width:24px;height:24px;border-radius:6px;background:var(--tint);color:var(--pri);font-size:12px;
  font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.opt .ot{font-size:13.5px;line-height:1.6;color:var(--ink);padding-top:1px}
.opt.sel{border-color:var(--pri);background:var(--tint)}
.opt.sel .ol{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:#eefaf5}
.opt.right .ol{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--accent);background:#fdeef0}
.opt.wrong .ol{background:var(--accent);color:#fff}

/* 随堂练习（视频下方直接作答） */
.pq{margin-top:24px;border:1px solid #e4ebf3;border-radius:14px;background:#fff;overflow:hidden}
.pqh{display:flex;gap:16px;align-items:flex-start;padding:20px 22px 18px;border-bottom:1px solid #eef2f7;
  background:linear-gradient(180deg,#f7fafd,#fff)}
.pqh-l{flex:1;min-width:0}
.pqh .k{font-size:11.5px;color:var(--pri);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.pqh h3{font-size:17px;color:var(--deep);font-weight:600;line-height:1.5}
.pqh p{font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:6px}
.pqtag{flex:none;font-size:11.5px;font-weight:600;color:var(--pri);background:var(--tint);
  border:1px solid #d6e4f2;border-radius:99px;padding:5px 12px;white-space:nowrap}
.pqtag.ok{color:var(--ok);background:#eaf7f2;border-color:#c9e8dd}
.pqi{padding:20px 22px;border-bottom:1px solid #f2f5f9}
.pqi:last-of-type{border-bottom:0}
.pqi.ok{background:#fcfffd}
.pqq{display:flex;gap:9px;align-items:flex-start;margin-bottom:12px}
.pqq .qn{flex:none;font-size:11.5px;font-weight:700;color:var(--pri);background:var(--tint);
  border-radius:5px;padding:2px 6px;margin-top:2px}
.pqq .qtx{flex:1;font-size:14.5px;color:var(--deep);font-weight:500;line-height:1.7}
.pqm{flex:none;font-size:12px;font-weight:700;border-radius:5px;padding:2px 7px;margin-top:2px}
.pqm.ok{color:var(--ok);background:#eaf7f2}
.pqm.no{color:var(--accent);background:#fdeef0}
.pqi .opts{gap:7px}
.pqx{margin-top:12px;font-size:12.8px;line-height:1.8;color:var(--mid);background:#f6f9fc;
  border-left:3px solid #cfdcea;border-radius:0 8px 8px 0;padding:10px 13px}
.pqx b{display:block;font-size:11.5px;color:var(--pri);letter-spacing:.04em;margin-bottom:4px}
.pqx.bad{border-left-color:#e8b4bc;background:#fdf6f7}
.pqx.bad b{color:var(--accent)}
.pqf{display:flex;align-items:center;gap:12px;padding:16px 22px;background:#fbfcfe;border-top:1px solid #eef2f7;flex-wrap:wrap}
.pqf .spacer{flex:1}
.pqcnt{font-size:12.5px;color:var(--muted)}
.pqscore{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pqscore b{font-size:26px;line-height:1;color:var(--pri);font-variant-numeric:tabular-nums}
.pqscore.ok b{color:var(--ok)}
.pqscore.no b{color:var(--accent)}
.pqscore span{font-size:12.5px;color:var(--muted)}
.pqscore em{font-size:12.5px;color:var(--mid);font-style:normal;margin-left:8px}
.opt.lock{cursor:default}
.explain{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 17px}
.explain .el{font-size:11.5px;font-weight:600;color:var(--ok);margin-bottom:6px}
.explain p{font-size:13px;color:var(--mid);line-height:1.72}
.explain.bad .el{color:var(--accent)}

/* 成绩单 */
.score-hero{text-align:center;padding:34px 20px;background:linear-gradient(130deg,#10243d,#1b4f8a);border-radius:14px;color:#fff;margin-bottom:20px}
.score-hero .big{font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em}
.score-hero .big small{font-size:18px;font-weight:400;color:#a8c2dc}
.score-hero .lbl{font-size:13px;color:#c5d6e8;margin-top:10px}
.score-hero.pass{background:linear-gradient(130deg,#0b4a3a,#0f7b5f)}
.score-hero.fail{background:linear-gradient(130deg,#5a1520,#a3283c)}
.qreview{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.qr{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:#fff}
.qr .qrt{font-size:13.5px;color:var(--deep);line-height:1.6;margin-bottom:8px;font-weight:500}
.qr .qra{font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
.qr .qra span.ok{color:var(--ok)}
.qr .qra span.no{color:var(--accent)}

/* ---------- 管理端 ---------- */
.mtabs{display:flex;gap:4px;background:#fff;border-radius:10px;padding:5px;border:1px solid #edf1f6;margin-bottom:20px;overflow-x:auto}
.mtab{padding:9px 16px;border-radius:7px;font-size:13.5px;color:var(--mid);white-space:nowrap;transition:.13s}
.mtab:hover{background:var(--tint2)}
.mtab.on{background:var(--pri);color:#fff;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:18px;border:1px solid #edf1f6}
.kpi .kl{font-size:12px;color:var(--soft);margin-bottom:8px}
.kpi .kv{font-size:26px;font-weight:600;color:var(--deep);line-height:1.1}
.kpi .kv small{font-size:13px;font-weight:400;color:var(--soft)}
.kpi .ks{font-size:11.5px;color:var(--soft);margin-top:6px}
.card{background:#fff;border-radius:12px;border:1px solid #edf1f6;overflow:hidden;margin-bottom:18px}
.card .ch2{padding:15px 20px;border-bottom:1px solid #f0f3f7;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card .ch2 h3{font-size:15px;font-weight:600;color:var(--deep)}
.card .ch2 .spacer{flex:1}
.card .cb{padding:18px 20px}
.card .cb.p0{padding:0}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:#f7f9fc;padding:11px 14px;text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:11px 14px;border-bottom:1px solid #f3f6f9;color:var(--mid);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:#fbfcfe}
.dt .nm{color:var(--deep);font-weight:500}
.rank{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;background:#f0f3f7;color:var(--muted)}
.rank.r1{background:#fdf3d7;color:#8a6d12}
.rank.r2{background:#eef0f4;color:#5c6670}
.rank.r3{background:#f7ece3;color:#8a5a33}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--tint);color:var(--pri)}
.pill.ok{background:#e6f6ef;color:var(--ok)}
.pill.no{background:#fdeef0;color:var(--accent)}
.pill.warn{background:#fdf4e3;color:var(--warn)}
.pill.gray{background:#f0f2f5;color:var(--muted)}
.bar-mini{height:5px;background:#eef1f5;border-radius:3px;overflow:hidden;min-width:60px}
.bar-mini i{display:block;height:100%;background:var(--pri);border-radius:3px}
.sbar{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sbar:last-child{border-bottom:none}
.sbar b{font-size:12px;color:var(--pri);width:46px;flex:0 0 46px}
.sbar span{font-size:13px;color:var(--deep);width:118px;flex:0 0 118px}
.sbar .sbar-p{flex:1;height:7px;background:#eef1f5;border-radius:4px;overflow:hidden;min-width:80px}
.sbar .sbar-p i{display:block;height:100%;background:var(--ok);border-radius:4px}
.sbar em{font-style:normal;font-size:12px;color:var(--muted);width:132px;flex:0 0 132px;text-align:right}
.sbar.off{opacity:.6}
.sbar.off i{font-style:normal;font-size:12px;color:var(--soft);margin-left:auto}
.empty{text-align:center;padding:44px 20px;color:var(--soft);font-size:13.5px;line-height:1.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.inp{height:38px;border:1px solid var(--line);border-radius:7px;padding:0 11px;background:#fff;font-size:13.5px;width:100%}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px rgba(27,79,138,.1)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form-grid .fi label{display:block;font-size:12px;color:var(--mid);margin-bottom:5px}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(16,36,61,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.dlg{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.dlg .dh{padding:20px 24px 14px;border-bottom:1px solid #f0f3f7}
.dlg .dh h3{font-size:17px;font-weight:600;color:var(--deep)}
.dlg .dh p{font-size:12.5px;color:var(--soft);margin-top:5px}
.dlg .db{padding:20px 24px}
.dlg .df{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end}
.dlg .df .btn{width:auto;min-width:88px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(16,36,61,.94);color:#fff;
  padding:11px 20px;border-radius:9px;font-size:13.5px;z-index:400;box-shadow:0 8px 26px rgba(0,0,0,.24);
  opacity:0;transition:.24s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;bottom:40px}

@media (max-width:860px){
  .ea{flex-direction:column;align-items:stretch;gap:12px;padding:14px 14px}
  .ea-b{margin-left:0}
  .ea-b .btn{flex:1}
  .qz-hd{flex-wrap:wrap;gap:10px}
  .qz-hl h2{font-size:20px}
  .qz-clock{font-size:19px;padding:8px 14px;margin-left:0}
  .qzi{padding:15px 15px;border-radius:10px}
  .qz-q .qtx{font-size:14.5px}
  .qzi .ot{font-size:13.5px}
  .qz-foot{position:static;padding:13px 14px;margin-bottom:30px}
  .qz-foot .btn{flex:1}
  #login{padding:14px 11px;align-items:flex-start}
  .lg-wrap{grid-template-columns:1fr;border-radius:16px;max-width:460px;min-height:0}
  .lg-hero{padding:24px 22px 20px}
  .lg-title{font-size:27px;margin-top:13px}
  .lg-sub{font-size:12.5px;margin-top:8px}
  .lg-facts{margin-top:16px;padding:12px 0;gap:6px}
  .lg-facts b{font-size:19px}
  .lg-facts span{font-size:10px}
  .lg-mods{margin-top:14px;gap:6px}
  .lg-mod{padding:7px 8px;gap:7px}
  .lg-mod i{flex:0 0 23px;height:23px;font-size:10px;border-radius:6px}
  .lg-mod b{font-size:11px}
  .lg-mod p{font-size:9.5px}
  .lg-mod.on:after,.lg-mod.lock:after{display:none}
  .lg-foot{padding-top:14px;font-size:10.5px}
  .lg-form{padding:24px 22px 28px}
  .me-two{grid-template-columns:1fr}
  .intro-bar{padding:12px 14px;gap:10px;margin-bottom:14px}
  .ib-ic{flex:0 0 32px;height:32px;font-size:13px;border-radius:9px}
  .ib-t b{font-size:13.5px}
  .ib-t p{font-size:11.5px}
  .ib-go{font-size:12px;white-space:nowrap}
  .intro-pts{grid-template-columns:1fr;gap:9px}
  .plan-grid{grid-template-columns:1fr 1fr;gap:9px}
  .me-hd{flex-wrap:wrap;padding:15px 15px}
  .mn{flex:0 0 104px;font-size:12.5px}
  .rrow .rs{display:none}
  .rwhen{min-width:46px}
  .lg-form h2{font-size:18px}
  .lg-hint{margin-bottom:18px}
  .learn{grid-template-columns:1fr}
  .sidelist{position:static;max-height:none;margin-bottom:12px}
  .sidelist .hd{cursor:pointer}
  .sidelist .list{max-height:0;overflow:hidden;transition:max-height .22s ease}
  .sidelist.open .list{max-height:300px;overflow-y:auto}
  .sidelist .hd .tg{font-size:11.5px;color:var(--pri);font-weight:500}
  .mcards.c3,.mcards.c2,.mcards.c4{grid-template-columns:1fr}
  .mcompare{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .case .stats{grid-template-columns:1fr}
  .wrap{padding:16px 13px 50px}
  .panel .ph,.panel .pb,.panel .pf{padding-left:17px;padding-right:17px}
  .topbar{padding:0 13px;gap:8px}
  .topbar .brand{font-size:14px;white-space:nowrap}
  .topbar .brand span{display:none}
  .topbar .who span{display:none}
  .topbar .btn.sm{white-space:nowrap;flex:0 0 auto}
  .hero{padding:20px}
  .hero h2{font-size:19px}
  .score-hero .big{font-size:42px}
  .kpis{grid-template-columns:1fr 1fr}
  .mtabs{padding:4px}
  .mtab{padding:8px 12px;font-size:13px}
  .dt{font-size:12.5px}
  .dt th,.dt td{padding:9px 8px}
  .case .stats{grid-template-columns:1fr 1fr}
}

/* ---------- 音频播放器 ---------- */
.player{background:#0c1725;border-radius:14px;overflow:hidden;
  margin:0 0 18px;box-shadow:0 8px 24px rgba(15,35,56,.18)}

/* ---- 视频画面：固定 1600x900 画布等比缩放（PPT 层） ---- */
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#eef2f7}
.sl-canvas{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.sl{position:absolute;inset:0;color:#1a2430;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.sl-bg{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.sl-lg{position:absolute;right:54px;top:32px;width:148px;height:auto;opacity:.95}
.sl-kicker{position:absolute;left:74px;top:112px;font-size:19px;letter-spacing:.15em;color:#4c6d99;font-weight:600}
.sl-h{position:absolute;left:74px;right:200px;top:138px;font-size:51px;line-height:1.32;
  font-weight:800;color:#0a3d91;letter-spacing:.01em}
.sl-h b{font-weight:800;position:relative;z-index:0}
.sl-h b:after{content:'';position:absolute;left:-3px;right:-3px;bottom:3px;height:13px;
  background:rgba(120,175,235,.40);z-index:-1}
.sl-body{position:absolute;left:74px;right:74px;top:300px;bottom:92px;display:flex;flex-direction:column;justify-content:center;gap:30px}
.sl-body.one>.bl{width:100%}
.bl-cols.n4 .bc-card,.bl-cols.n5 .bc-card{min-height:172px;padding:22px 22px 18px}
.bl-cols.n4 .bc-card h4,.bl-cols.n5 .bc-card h4{font-size:28px}
.sl-tag{position:absolute;right:74px;bottom:34px;background:#0a3d91;color:#fff;
  font-size:15px;letter-spacing:.04em;padding:5px 13px;border-radius:3px}
.sl-miss{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa8b8}

.bl-lead{font-size:28px;color:#2c3f56;line-height:1.58;font-weight:600;padding-left:20px;border-left:5px solid #0a3d91}
.bl-stats{display:flex;gap:20px}
.bs-item{flex:1;background:#fff;border:1px solid #dde5ef;border-radius:8px;padding:30px 26px;
  box-shadow:0 1px 2px rgba(16,36,61,.04)}
.bs-item b{display:block;font-size:60px;font-weight:800;color:#0a3d91;line-height:1.1}
.bs-item span{display:block;font-size:18.5px;color:#4e647d;margin-top:7px;font-weight:600}
.bl-chain{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bc-lab{font-size:19px;color:#7086a0;font-weight:600}
.bc-node{background:#eaf1fa;color:#12406f;font-size:24px;font-weight:600;padding:10px 17px;border-radius:6px}
.bc-ar{color:#9fb4cc;font-style:normal}
.bc-tail{font-size:19px;font-weight:600;color:#c8102e;margin-left:8px}
.bl-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.bc-card{background:#fff;border:1px solid #e3eaf3;border-radius:10px;padding:26px 26px 22px;
  box-shadow:0 1px 3px rgba(16,36,61,.05);display:flex;flex-direction:column;min-height:300px}
/* 紧凑卡：一页放 4 张以上时用，避免两行 300px 把底部色带挤出去 */
.bl-cols.tight{gap:14px}
.bl-cols.tight .bc-card{min-height:0;padding:18px 22px 15px;border-radius:9px}
.bl-cols.tight .bc-n{font-size:14.5px}
.bl-cols.tight .bc-card h4{font-size:25px;margin:5px 0 8px}
.bl-cols.tight .bc-card p{font-size:18px;line-height:1.62}
.bl-cols.tight .bc-card em{font-size:15.5px;padding-top:9px;margin-top:9px}
.bc-n{font-size:17px;font-weight:800;color:#6b98cd;letter-spacing:.12em}
.bc-card h4{font-size:31px;color:#0a3d91;margin:8px 0 12px;font-weight:800}
.bc-card p{font-size:20.5px;line-height:1.72;color:#33455a}
.bc-card em{display:block;margin-top:auto;font-size:17.5px;font-weight:600;color:#c8102e;font-style:normal;
  border-top:1px dashed #e3eaf3;padding-top:12px}
.bl-band{background:#eef4fb;border-left:5px solid #0a3d91;padding:18px 24px;
  font-size:28px;font-weight:600;color:#12406f;border-radius:0 8px 8px 0}
.bl-band b{color:#0a3d91;font-weight:800}
.bl-steps{display:flex;align-items:stretch}
.bst{flex:1;background:#fff;border:1px solid #e3eaf3;border-radius:10px;padding:26px 26px 24px;min-height:196px}
.bst i{display:flex;width:32px;height:32px;border-radius:50%;background:#0a3d91;color:#fff;

.bst p{font-size:19.5px;color:#3d4f63;line-height:1.62}
.bst-line{width:26px;align-self:center;height:3px;background:#b9cde4;flex:0 0 26px;border-radius:2px}
.bl-pairs h5{font-size:19px;font-weight:600;color:#7086a0;margin-bottom:10px;letter-spacing:.02em}
.bp{display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid #eef2f7}
.bp-a{font-size:21px;font-weight:600;color:#7086a0;min-width:100px}
.bp-b{font-size:25px;font-weight:600;color:#1a2c40}
.bl-todo{background:#fff7e8;border:1px solid #f0dcb8;

.bl-todo i{font-style:normal;background:#d08a2c;color:#fff;font-size:14.5px;

.kk{transition:opacity .5s ease}
.stage.hl .kk{opacity:.42}
.stage.hl .kk.on{opacity:1}

/* ---- 章节封面 / 结束封面 ---- */
.cv{background:linear-gradient(122deg,#07182b 0%,#0d2c4e 46%,#1a4b84 100%);color:#fff}
.cv-wash{position:absolute;inset:0;
  background:radial-gradient(circle at 86% 10%,rgba(88,162,242,.30),transparent 48%),
    radial-gradient(circle at 6% 94%,rgba(28,88,158,.38),transparent 54%)}
.cv:after{content:'';position:absolute;right:-190px;top:150px;width:780px;height:780px;
  border:1px solid rgba(255,255,255,.10);border-radius:50%;pointer-events:none}
.cv-lg{position:absolute;right:64px;top:44px;width:190px;height:auto;
  background:rgba(255,255,255,.95);padding:9px 13px;border-radius:6px}
.cv-kick{position:absolute;left:100px;top:118px;display:flex;align-items:center;
  font-size:22px;font-weight:600;letter-spacing:.06em;color:#9dc4ee}
.cv-kick i{display:block;width:34px;height:2px;background:rgba(157,196,238,.55);margin:0 16px}
.cv-h{position:absolute;left:100px;right:150px;bottom:430px;font-size:78px;line-height:1.3;
  font-weight:800;letter-spacing:.01em;color:#fff}
.cv-h b{font-weight:800;color:#8ec5ff}
.cv-sub{position:absolute;left:102px;right:210px;top:500px;font-size:26px;
  color:rgba(255,255,255,.74);font-weight:500;line-height:1.6}
.cv-pts{position:absolute;left:100px;right:100px;top:588px;display:grid;
  grid-template-columns:repeat(3,1fr);gap:20px}
.cv-pt{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:22px 24px;display:flex;gap:14px;align-items:flex-start}
.cv-pt b{font-size:22px;font-weight:800;color:#7db8f2;line-height:1.5;flex:0 0 auto}
.cv-pt span{font-size:21px;font-weight:600;color:rgba(255,255,255,.92);line-height:1.55}
.cv-foot{position:absolute;left:100px;right:100px;bottom:56px;display:flex;
  align-items:flex-end;justify-content:space-between;padding-top:22px;
  border-top:1px solid rgba(255,255,255,.14)}
.cv-credit{font-size:17px;line-height:1.75;color:rgba(255,255,255,.70);letter-spacing:.02em}
.cv-credit .cvl{color:rgba(255,255,255,.86);margin-bottom:4px;font-weight:600}
.cv-no{font-size:34px;font-weight:800;color:rgba(255,255,255,.9);letter-spacing:.04em;flex:0 0 auto}
.cv-no em{font-size:17px;font-style:normal;font-weight:600;color:rgba(255,255,255,.45);
  margin-left:7px;letter-spacing:.02em}
.ce-mark{position:absolute;left:100px;top:118px;display:flex;align-items:center;
  font-size:22px;font-weight:700;letter-spacing:.14em;color:#8ec5ff}
.ce-mark:before{content:'';width:46px;height:2px;background:#8ec5ff;margin-right:16px}
.cv-end .cv-h{top:172px;bottom:auto;font-size:56px;line-height:1.28;right:190px}
.ce-pts{position:absolute;left:100px;right:640px;top:348px}
.ce-lab{font-size:19px;font-weight:600;color:rgba(255,255,255,.45);
  letter-spacing:.14em;margin-bottom:14px}
.ce-pt{display:flex;gap:16px;align-items:flex-start;padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.09)}
.ce-pt b{font-size:20px;font-weight:800;color:#7db8f2;line-height:1.6;flex:0 0 auto}
.ce-pt span{font-size:26px;font-weight:600;color:rgba(255,255,255,.94);line-height:1.55}
.ce-nx{position:absolute;left:100px;right:100px;top:622px;display:flex;
  align-items:center;gap:16px}
.ce-nx i{font-style:normal;background:rgba(142,197,255,.18);color:#8ec5ff;font-size:18px;
  font-weight:700;padding:6px 14px;border-radius:4px;flex:0 0 auto}
.ce-nx-t{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ce-nx-t b{font-size:22px;color:rgba(255,255,255,.9);font-weight:600;line-height:1.4}
.ce-nx-t em{font-style:normal;font-size:17px;color:rgba(255,255,255,.68);line-height:1.5}
.ce-wm{position:absolute;right:68px;bottom:214px;font-size:300px;font-weight:800;
  line-height:1;color:rgba(255,255,255,.055);letter-spacing:-.05em;pointer-events:none}

.cap{min-height:56px;display:flex;align-items:center;justify-content:center;
  padding:13px 22px;background:#0c1725;color:#f4f9ff;font-size:18px;font-weight:600;line-height:1.55;
  text-align:center;letter-spacing:.02em;border-top:1px solid rgba(255,255,255,.06)}

/* ---- 看完分流条：再看一遍 / 马上测评 ---- */
.ea{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 18px;
  box-shadow:var(--sh)}
.ea-t b{display:block;font-size:15.5px;color:var(--ink);font-weight:700}
.ea-t b i{font-style:normal;font-variant-numeric:tabular-nums}
.ea-t span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.ea-t.ok b{color:var(--ok)}
.ea-b{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
/* .btn 全局 width:100%（为了表单整行按钮），在横向按钮组里必须收回，否则每个按钮独占一行 */
.ea-b .btn{width:auto;min-width:132px}

/* ---- 测评页 ---- */
.qz-page{max-width:880px;margin:0 auto}
.qz-hd{display:flex;align-items:flex-start;gap:16px;margin:8px 0 12px}
.qz-hl .k{font-size:11.5px;color:var(--soft);letter-spacing:.12em}
.qz-hl h2{font-size:23px;margin:5px 0 7px;color:var(--deep);font-weight:800}
.qz-hl p{font-size:13px;color:var(--muted);line-height:1.7}
.qz-clock{margin-left:auto;flex:0 0 auto;background:var(--deep);color:#fff;border-radius:10px;
  padding:11px 18px;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;transition:.2s}
.qz-clock.warn{background:var(--accent)}
.qz-bar{height:4px;background:#e6edf5;border-radius:2px;overflow:hidden;margin-bottom:14px}
.qz-tip{font-size:12.5px;color:var(--muted);background:#f5f8fc;border-radius:8px;
  padding:11px 14px;margin-bottom:16px;line-height:1.75}
.qzi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;
  margin-bottom:14px;box-shadow:0 1px 2px rgba(16,36,61,.04)}
.qzi.ok{border-color:#c4e6d4}
.qzi.no{border-color:#f2ccd1}
.qz-q{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.qz-q .qn{font-size:11.5px;font-weight:800;color:#9fb4cc;flex:0 0 auto;padding-top:4px}
.qz-m{flex:0 0 auto;font-size:14px;font-weight:800;padding-top:1px}
.qz-m.ok{color:var(--ok)}
.qz-m.no{color:var(--accent)}
.qz-q .qtx{font-size:15.5px;line-height:1.75;color:var(--ink);font-weight:600}
.qzi .ot{font-size:14.5px;line-height:1.65}
.qz-x{margin-top:13px;font-size:13px;line-height:1.8;color:var(--mid);
  background:#f2f7fd;border-radius:8px;padding:12px 15px}
.qz-x.bad{background:#fdf1f2}
.qz-x b{display:block;font-size:12.5px;color:var(--pri);margin-bottom:4px;font-weight:700}
.qz-x.bad b{color:var(--accent)}
.qz-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin:8px 0 44px;
  position:sticky;bottom:12px;box-shadow:0 -2px 14px rgba(16,36,61,.07)}
.qz-foot .btn{width:auto;min-width:120px}
.qz-foot .spacer{flex:1}
.qz-score b{font-size:27px;color:var(--pri);font-variant-numeric:tabular-nums;font-weight:800}
.qz-score.ok b{color:var(--ok)}
.qz-score.no b{color:var(--accent)}
.qz-score span{font-size:12.5px;color:var(--muted);margin-left:5px}
.qz-score em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px}
.qz-cnt{font-size:13px;color:var(--muted)}

/* 窄屏底部条：必须放在上面 .qz-foot .btn 之后才能覆盖，
   目标是「计数/成绩 + 两个按钮」挤在一行，别把提交按钮挤到第二行 */
@media (max-width:860px){
  .qz-foot{flex-wrap:nowrap;padding:11px 12px;margin-bottom:26px}
  .qz-foot .spacer{display:none}
  .qz-foot .qz-cnt,.qz-foot .qz-score{flex:1;min-width:0;overflow:hidden}
  .qz-foot .qz-cnt{font-size:12px;white-space:nowrap}
  .qz-foot .qz-score b{font-size:20px}
  .qz-foot .qz-score span{font-size:11px;margin-left:3px}
  .qz-foot .qz-score em{display:none}
  .qz-foot .btn{flex:0 0 auto;min-width:0;height:40px;padding:0 13px;font-size:13.5px}
}

.pl-top{display:flex;align-items:center;gap:12px;padding:9px 14px 0}
.pl-btn{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:#fff;color:#0f2338;
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pl-btn:hover{background:#e8f0f9}
.pl-bar{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:3px;position:relative;cursor:pointer}
.pl-bar i{position:absolute;left:0;top:0;height:100%;background:#4a9fe0;border-radius:3px;pointer-events:none}
.pl-time{color:#cfdcea;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-rate{background:rgba(255,255,255,.12);color:#dfe9f3;border:1px solid rgba(255,255,255,.18);
  border-radius:6px;padding:4px 6px;font-size:12px}
.cap.done{color:#8ba3ba}
.pl-sub{margin:12px 14px 0;color:#eaf1f8;font-size:13.5px;line-height:1.78;min-height:44px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-height:76px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 44px}
.btnrow .btn{width:auto;min-width:170px}
.pl-tools{display:flex;align-items:center;gap:10px;padding:8px 14px 11px}
.pl-tg{background:transparent;border:1px solid rgba(255,255,255,.24);color:#c9d8e8;
  border-radius:6px;padding:3px 10px;font-size:11.5px}
.pl-hint{font-size:11.5px;color:#8ba3ba}
.pl-text{max-height:0;overflow:hidden;transition:max-height .25s ease}
.pl-text{padding:0 14px}
.pl-text.open{max-height:320px;overflow-y:auto;margin-top:10px;padding-top:6px;
  border-top:1px solid rgba(255,255,255,.12)}
.pl-seg{padding:8px 10px;border-left:2px solid transparent;color:#9fb3c8;font-size:13px;
  line-height:1.8;cursor:pointer;border-radius:0 6px 6px 0}
.pl-seg:hover{color:#dfe9f3;background:rgba(255,255,255,.05)}
.pl-seg.on{background:rgba(74,159,224,.16);border-left-color:#4a9fe0;color:#fff}
.pl-seg b{color:#7fa8c9;font-weight:600;margin-right:6px;font-size:11px}

/* ---------- 认证 ---------- */
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.sgi{border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;background:var(--tint2)}
.sgi b{display:block;font-size:26px;color:var(--pri);line-height:1.2;font-variant-numeric:tabular-nums}
.sgi span{display:block;font-size:12px;color:var(--mid);margin-top:2px}
.sgi small{display:block;font-size:11px;color:var(--soft);margin-top:4px}
.sgi.tot{background:#eef4fb;border-color:#c8daee}
.sgi.tot b{color:var(--deep)}
.cond{display:flex;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.cond:last-child{border-bottom:none}
.ci{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700}
.ci.ok{background:#e6f6ef;color:var(--ok)}
.ci.no{background:#f2f4f7;color:var(--soft)}
.cn{font-size:13.5px;color:var(--deep);font-weight:500}
.cd{font-size:12px;color:var(--muted);margin-top:2px}
.dimrow{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.dimrow .dn{width:112px;flex:0 0 112px;font-size:12.5px;color:var(--mid)}
.dimrow .dbar{flex:1;height:8px;background:#eef1f5;border-radius:4px;overflow:hidden}
.dimrow .dbar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.dimrow .dv{width:96px;flex:0 0 96px;text-align:right;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.exam-top{display:flex;gap:10px;margin-bottom:6px}
.exam-top>div{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.exam-top b{display:block;font-size:18px;color:var(--pri);font-variant-numeric:tabular-nums}
.exam-top span{display:block;font-size:11.5px;color:var(--soft);margin-top:1px}
.qx{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #f0f3f7}
.qx:last-child{border-bottom:none}
.qxi{width:24px;flex:0 0 24px;font-size:12px;color:var(--soft);padding-top:3px;
  font-variant-numeric:tabular-nums}
.qxt{font-size:14px;color:var(--deep);line-height:1.65;margin-bottom:11px}
.qtag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;margin-right:6px;
  vertical-align:middle;font-weight:600}
.qtag.multi{background:#fdf1e3;color:#a9660f}
.qtag.judge{background:#eaf1fb;color:var(--pri)}
.qx .opts{display:grid;grid-template-columns:1fr;gap:7px}
.qx .opt{padding:9px 11px}
.pfr,.pfq{margin-bottom:16px}
.pfl{font-size:12px;color:var(--mid);font-weight:500;margin-bottom:5px}
.pft{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;
  line-height:1.7;color:var(--ink);background:#fff;resize:vertical}
.pft:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(27,79,138,.08)}
.cdt{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:5px;
  font-size:10.5px;background:#eef1f5;color:#8a97a6;margin-right:4px;font-weight:600;vertical-align:middle}
.cdt.ok{background:var(--ok);color:#fff}
.cert-banner{display:flex;align-items:center;gap:14px;border:1px solid #c8daee;background:#eef4fb;
  border-radius:12px;padding:14px 16px;margin-bottom:18px;cursor:pointer}
.cert-banner .cb1{flex:1}
.cert-banner b{font-size:14px;color:var(--deep)}
.cert-banner p{font-size:12.5px;color:var(--mid);margin-top:2px}
.cert-banner .arr{color:var(--pri);font-size:18px}

/* ---------- 分阶段认证 ---------- */
.stage-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}
.stage-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px 18px 16px;
  box-shadow:var(--sh)}
.stage-card.open{border-color:#c8daee;background:linear-gradient(180deg,#fbfdff 0%,#fff 60%)}
.stage-card.lock{background:#fafbfd;border-style:dashed;box-shadow:none}
.stage-card.lock h3{color:#41536a}
.stage-card.lock .sc-sub{color:#4a6c93}
.stage-card.lock .sc-goal{color:#6b7787}
.sc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sc-no{font-size:11px;letter-spacing:.12em;color:var(--soft);font-weight:600}
.sc-badge{font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:600}
.sc-badge.ok{background:#e6f6ef;color:var(--ok)}
.sc-badge.no{background:#fdecee;color:var(--accent)}
.sc-badge.go{background:#eef4fb;color:var(--pri)}
.sc-badge.idle{background:#eef1f5;color:var(--soft)}
.stage-card h3{font-size:18px;color:var(--deep);letter-spacing:-.01em}
.sc-sub{font-size:12.5px;color:var(--pri);margin-top:4px;line-height:1.7}
.sc-goal{font-size:13px;color:var(--mid);line-height:1.8;margin-top:9px}
.sc-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:12px;color:var(--soft)}
.sc-meta b{color:var(--mid);font-weight:500}
.sc-dims{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.stag-dim{font-size:11.5px;background:#f2f6fb;color:var(--mid);border-radius:6px;padding:4px 9px}
.stag-dim b{color:var(--pri);font-variant-numeric:tabular-nums}
.stag-dim.off{background:#f6f7f9;color:var(--soft)}
.sc-ft{display:flex;align-items:center;gap:10px;margin-top:15px}
.sc-ft .btn{width:auto;height:38px;font-size:13.5px;min-width:132px}
.sc-soon{font-size:11.5px;color:var(--soft)}
.dim-group{margin-bottom:16px}
.dim-group:last-child{margin-bottom:0}
.dg-hd{font-size:12px;color:var(--pri);font-weight:600;padding:7px 0 8px;
  border-bottom:1px solid var(--line);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.dg-hd span{font-size:10.5px;font-weight:400;color:var(--soft);background:#f2f4f7;
  border-radius:4px;padding:1px 6px}
.dimrow .dn small{display:block;font-size:10.5px;color:var(--soft);font-weight:400;margin-top:1px}
.dimrow.dw .dn{width:186px;flex:0 0 186px}
.dimrow.dw .dbar{height:7px}
.dimrow.off{opacity:.62}
.dscope{font-size:11px;color:var(--soft);margin:-4px 0 11px 198px;line-height:1.65}

/* ---------- 阶段证书 ---------- */
.cert-tools{display:flex;gap:10px;justify-content:flex-end;margin:0 0 14px}
.cert-doc{position:relative;max-width:860px;margin:0 auto;background:#fff;border:1px solid #d9c9a3;
  border-radius:6px;padding:46px 54px 40px;box-shadow:0 6px 30px rgba(16,36,61,.1);
  background-image:radial-gradient(circle at 50% 0%,#fdfbf5 0%,#fff 55%)}
.cd-top{display:flex;align-items:center;justify-content:space-between;
  border-bottom:2px solid var(--pri);padding-bottom:12px}
.cd-org{font-size:12.5px;color:var(--mid);letter-spacing:.04em;padding-right:14px}
.cd-kind{font-size:12px;color:var(--pri);font-weight:600;letter-spacing:.2em;white-space:nowrap;flex:0 0 auto}
.cd-title{font-size:26px;color:var(--deep);text-align:center;margin:30px 0 6px;
  letter-spacing:.04em;font-weight:600}
.cd-line{width:64px;height:3px;background:#c8a558;margin:0 auto 26px;border-radius:2px}
.cd-body{padding:0 6px}
.cd-p{font-size:13.5px;color:var(--mid);line-height:2;text-align:center}
.cd-name{font-size:32px;color:var(--deep);text-align:center;margin:14px 0 4px;letter-spacing:.12em;
  font-weight:600}
.cd-conds{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0 16px}
.cd-conds .cc{border:1px solid #e6e9ef;border-radius:8px;padding:9px 10px;background:#fcfdff;text-align:center}

<script>
window.__COURSE__={"course":"geely-user-thinking","modules":[{"no":1,"key":"m1","name":"用户思维总纲","min":60,"ability":"场景还原能力（主） / 需求挖掘与识别（辅）","ability_short":"场景还原","output":"场景还原五问卡","intro":"把「用户思维」从态度问题重新定义成判断顺序问题，并交付全课唯一一把通用尺子——场景还原五问。","points":["三种伪用户思维，以及判断顺序的三步","B 端四层用户与诉求互斥时的判据","从「用户满意」到「组织绩效改善」的翻译"],"wrap":["判断顺序错了，努力就是成本","四层用户先分清谁承担后果","内部系统的价值必须能翻译成组织指标"],"sections":[{"n":1,"m":3,"t":"用户思维不是「态度好」，而是一套可验证的判断顺序","hook":"为什么加了 12 个字段，一线还是不用？","goals":["三种伪用户思维长什么样","判断顺序：先场景、再问题、后功能","顺序错了，代价落在谁身上"],"pages":[{"L":"cards","T":"三种伪用户思维，共同点是「没有判断顺序」","K":"态度好、调研勤、听领导——三件事都做了，问题还是没解决","D":[["态度好，但判断错","把「用户满意」当成目标，把功能多当成诚意。系统越做越重，一线越用越绕。"],["调研走过场","问卷发了、访谈做了，结论是「希望更好用」。没有一句能落到设计决策上。"],["把领导当用户","按汇报口径设计系统，上线后发现天天用它的是一线专员。"]]}],"q":{"q":"某事业部提出「考勤系统补卡流程太麻烦」。以下哪个动作最接近「有判断顺序」的做法？","o":["直接评估把三步改成一步需要多少开发量","先问上个月补了几次卡、当时人在哪、为什么没打上","发一份满意度问卷，看大家打几分","参考同业系统，看别人做成几步"],"a":1,"why":"先还原场景（谁、在什么条件下、为完成什么），再定义问题，最后才谈功能。A 是先给方案，C 拿不到场景，D 是抄答案。"}},{"n":2,"m":5,"t":"数字化转型中三类典型错位","hook":"流程搬上线，为什么一线反而更慢了？","goals":["把流程线上化当成体验","把报表当成决策支持","把使用率当成满意度"],"pages":[{"L":"cards","T":"三类错位，都是把「做了什么」当成了「改善了没有」","K":"上线不等于改善；下发数据不等于支持决策；有人用不等于有人满意","D":[["流程线上化 ≠ 体验","纸质表单原样搬进系统，只是不再手写。字段一个没少、审批一环没减，唯一变化是打字代替写字。"],["报表 ≠ 决策支持","给出一堆数，不给结论。看的人还要自己算一遍，于是继续用 Excel——绕行从这里开始。"],["使用率 ≠ 满意度","被制度强制使用的系统，使用率天然高。它反映流程强制力，不反映体验。"]]}],"q":{"q":"某内部系统月活 96%，管理层据此认为体验良好。以下哪个证据最能推翻这个结论？","o":["用户日均登录 3.2 次","用户把系统数据导出后，在 Excel 里完成核心分析","页面平均加载 1.8 秒","客服工单月均 40 单"],"a":1,"why":"96% 是被制度推上去的。导出到 Excel 完成核心动作，说明系统只承担了「留痕」，真正的决策动作仍在系统外——这就是绕行。"}},{"n":3,"m":10,"t":"场景还原五问：谁在用、在什么条件下、为完成什么、现在怎么绕过、不做会怎样","hook":"五问填完，为什么能直接否掉三成需求？","goals":["五问的提问顺序与每问要拿的证据","「现在怎么绕过」为什么最值钱","怎么用五问当场否需求"],"pages":[{"L":"steps","T":"场景还原五问：顺序不能反","K":"每一问都要拿到可指认的证据，拿不到就是没还原","D":[["谁在用","岗位、职级、是否外包、是否兼职。不是「财务人员」，是「某基地一位费用审核员」。"],["在什么条件下","时间压力、设备、场地、是否被打断。同一个人在不同条件下是完全不同的用户。"],["为完成什么","他要交付的那个动作，不是系统里的功能名。例如「月结前把这张单子核完」。"],["现在怎么绕过","Excel、微信、纸质、私人台账、口头代填。绕行路径暴露真实约束。"],["不做会怎样","后果、承担者、时限。用来判断紧迫性，也用来判断该不该由系统解决。"]],"note":["为什么「绕过」这一问最值钱","因为它是唯一不依赖用户表态的证据。用户嘴上会说「挺好的」，但手会诚实地打开 Excel。\n\n绕行的五种形态：Excel 台账、微信群转发、纸质签批、私人表格、口头代填。每发现一种，就找到一处系统没覆盖的断点。"]},{"L":"table","T":"五问的输出：一张能拿去开会的卡","K":"填不满的那三行，说明需求还没到能评审的程度","w":[2.2,4.4,3.0],"D":{"h":["问","要拿到的证据","填不出来意味着"],"r":[["谁在用","岗位、职级、人数，以及是否外包或兼职","你还没找到真正的使用者"],["什么条件下","一次完整观察或一次跟班记录","你只在会议室里理解用户"],["为完成什么","他交付的动作，以及这件事的截止时间","你在按功能清单设计"],["怎么绕过","具体的文件名、群名、台账名","你还没看到真实约束"],["不做会怎样","后果、承担者、时限","优先级只能靠谁声音大"]]}}],"q":{"q":"复盘一个审批系统时，五问里哪一问最能暴露「设计假设错误」？","o":["谁在用","在什么条件下","现在怎么绕过","不做会怎样"],"a":2,"why":"绕行路径是用户用行为投票的结果，它直接显示「系统没覆盖的那一段」，通常就是假设错的地方。其余三问指向范围与优先级。"}},{"n":4,"m":10,"t":"B 端产品的用户：使用者、管理者、决策者、监管者四层","hook":"一个字段加不加，四个角色四种答案，听谁的？","goals":["四层各自看什么、要什么","三种典型互斥结构与唯一判据","影响者为什么不在四层却能否决"],"pages":[{"L":"bands","T":"四层用户：诉求不同，语言也不同","K":"同一套系统，四个人说的「好用」根本不是一件事","D":[["使用者","看动作与频次：一天点几次、每次几步、会不会被打断。他要的是快。"],["管理者","看指标与考核：人均单量、差错率、周期。他要的是稳、可算。"],["决策者","看投入产出：这笔钱换来什么、能不能对外讲。他要的是值。"],["监管者","看留痕与合规：三年后能不能追溯、有没有依据。他要的是可查。"]]},{"L":"cards","T":"三种互斥结构，判据只有一个：谁承担后果","K":"不按级别排，不按人数排，按后果归属排","D":[["快 vs 稳","一线要少填，审核要留痕。字段越多审核越省事、一线越费时。判据：出错时谁去解释、谁被追责。"],["细 vs 简","管理层要维度，执行层要步数。判据：这个维度有没有人真的拿去做决定。"],["留痕 vs 效率","合规要审批链，业务要当天办完。判据：这条链是制度要求，还是历史遗留。"]]}],"q":{"q":"费控系统拟新增 6 个成本维度字段。一线报销人反对，财务审核员支持。判断依据应是：","o":["报销人人数多，按人数决定","审核员是需求提出方，按提出方决定","出错时由谁承担解释与追责责任","上报分管领导裁决"],"a":2,"why":"四层互斥时的判据是「谁承担后果」。若退单与稽查责任落在审核员，字段就有必要；但必须同时压缩填报代价（预填、默认值）。按人数或按提出方都会系统性伤害一方。"}},{"n":5,"m":10,"t":"B 端价值判据：从「用户满意」走到「组织绩效改善」","hook":"「更好用」这三个字，怎么翻译成领导听得懂的话？","goals":["三个价值锚点：少一个人 / 少一次返工 / 少一天关账","把「更好用」翻译成组织指标的四个动作","翻不出来的需求该排第几"],"pages":[{"L":"cards","T":"内部系统的价值，只有三个锚点","K":"用户满意是过程指标，组织绩效才是结果指标","D":[["少一个人","原来 3 个人干的活，2 个人能干。等价于编制与人力成本，是最容易被管理层听懂的语言。"],["少一次返工","退单、重填、二次核对。可直接折算工时与人日，也最容易验证。"],["少一天关账","周期缩短影响的是资金效率与管理节奏，比工时更值钱，但需要跨部门数据才能算。"]]},{"L":"steps","T":"把「更好用」翻译成组织指标的四个动作","K":"翻不出来的需求，通常不是第一优先级","D":[["找到那个动作","用户说的「麻烦」，对应哪一个具体动作：填、核、催、查、等。"],["数清它的频次","一天几次、一月几次、涉及几个人。频次决定价值量级。"],["折算成时间","单次耗时 × 频次 × 人数 = 月工时，再折算人日。"],["挂到组织指标上","工时→人均单量；周期→关账天数；差错→退单率。挂不上就降级。"]],"note":["一个换算示例","「报销单均填报 41 分钟」，2,400 人月均 1.4 单，就是每月 2,296 小时 ≈ 13 人日。\n\n省一半即 6.5 人日/月，一年 78 人日。这个数比「提升体验」有说服力得多，也更容易进预算评审。"]}],"q":{"q":"以下四条需求，哪一条最容易被直接判为「非第一优先级」？","o":["单据预填，减少 30% 填报时间","审批超时自动提醒，平均缩短 1.2 天","界面配色改为品牌蓝，提升一致性","三单自动匹配，减少人工核对 2 人日/月"],"a":2,"why":"配色无法翻译成「少一个人 / 少一次返工 / 少一天关账」中的任何一项。它未必不做，但不能与前三者争同一批资源。"}},{"n":6,"m":10,"t":"行业数字化产品全景与用户地图","hook":"六类系统，用户的「使用动机」根本不是一回事","goals":["六类系统的用户结构差异","职能域的三个特征：用户即同事","你负责的系统属于哪一类"],"pages":[{"L":"table","T":"六类系统，用户结构完全不同","K":"照搬另一类的做法，方法论就会失焦","w":[2.0,2.6,2.2,2.6],"D":{"h":["系统类别","主要用户","动机来源","体验关键"],"r":[["集团协同办公","全体员工","被要求使用","流程不绕、状态可见"],["供应链与采购","采购执行、需求方、供应商","业务必须完成","状态透明、时效"],["制造与质量","班组长、质检、工艺","生产节拍驱动","少录入、能离线"],["经销商与售后","门店顾问、服务经理","考核与返利","算得清、少返工"],["车主 App 与车机","车主","自愿使用","快、准、有惊喜"],["职能数字化（本期）","人力、财务、采购的同事","制度要求 + 自身省事","一次填对、状态可查"]]}},{"L":"cards","T":"职能域的三个特征，决定了方法要改哪里","K":"用户即同事、需求即管理动作、系统即制度载体","D":[["用户即同事","你明天还要跟他开会。所以不能「调研完就下结论」，方案要能当场被质疑、当场解释。"],["需求即管理动作","需求背后往往是一条管理制度。改系统等于改制度，光靠产品经理推不动，要拉制度 owner。"],["系统即制度载体","它承载的是「必须这样做」。体验的天花板由制度决定，不由界面决定。"]]}],"q":{"q":"职能数字化系统的体验天花板，最先由什么决定？","o":["前端组件选型","背后的管理制度与审批链","服务器性能","培训是否到位"],"a":1,"why":"字段、审批链、留痕要求都由制度规定。界面能优化的是「在制度内少走一步」，改不了「必须走这三步」。先改制度，再谈界面。"}},{"n":7,"m":2,"t":"全课路线图与作业说明","hook":"8 个模块学完，你手上会多出什么？","goals":["模块与能力的对应关系","作品集标准与提交方式","两周学习节奏"],"pages":[{"L":"table","T":"每个模块都有一件产出物，其中两件必须进作品集","K":"课程真正的交付不是「听完」，是那几张填满的表","w":[2.4,3.4,1.6],"D":{"h":["模块","产出物","进作品集"],"r":[["M1 用户思维总纲","场景还原五问卡","配套材料"],["M2 定性研究方法","深访提纲 + 观察记录表","—"],["M3 定量研究方法","问卷自查 20 条 + 样本量速算","—"],["M4 用户画像构建","用户画像卡（1 页 A4）","选交"],["M5 需求挖掘与识别","需求鉴真表","必交"],["M6 需求优先级判断","排序表 + 一页纸理由","选交"],["M7 用户旅程绘制","用户旅程地图（含泳道）","必交"],["M8 反馈闭环与度量","闭环 SOP + 指标卡","—"]]}}],"q":{"q":"认证作品集中的两件必交件是：","o":["画像卡 + 优先级排序表","需求鉴真表 + 用户旅程图","深访提纲 + 问卷","五问卡 + 闭环 SOP"],"a":1,"why":"必交是需求鉴真表（验洞察能力）与用户旅程图（验共情与场景能力）。另外两件为选交加分项，合格每件加 2 分。"}}],"cases":[{"domain":"财务域 · 费控报销","title":"两年加了 14 个字段，退单率反而升到 34%","scene":"某集团费控报销系统上线两年，单据字段从 12 个增至 26 个。一线单均填报 41 分钟，退单率 34%，财务共享中心每月约 3 人日用于解释退回原因。\n\n逐条复盘：哪个字段是「万一要用」加的？哪个字段的数据在合同系统里已经有了？哪个字段的业务规则三个月内改过两次？","stats":[["26","单据字段（两年前 12 个）"],["41 分钟","一线单均填报耗时"],["34%","退单率"]],"flip":"复盘落点不在「删字段」，而在「哪 3 个字段在需求提出时就该被拦下，拦下的依据是哪一问」。","wrong":"每次业务提需求就加字段，理由是「先加上，也许以后用得上」。"},{"domain":"对照 · 车主 App","title":"同一个活动入口，站在车边的人根本不会点","scene":"首页新增活动入口后点击率仅 0.8%。团队第一反应是挪位置、换图标、加动效，连改三版仍无起色。\n\n场景还原后发现真正的变量是「打开 App 时人在哪」：站在车边的人要充电和开门，坐在家里的人才看活动。同一个入口，两种场景，一个场景根本不该出现这个入口。","stats":[["0.8%","入口点击率"],["2 类","真实使用场景"],["3 轮","无效的界面优化"]],"flip":"C 端与 B 端共用同一套场景还原逻辑。差异在于：B 端的「场景」由流程节点定义，不由物理位置定义。","wrong":"把入口从第二屏挪到首屏，并换了一版更大的图标。"}],"quiz":[["五问填完能直接否掉约三成需求，依据是什么？","B","拿不到可指认证据的需求占比约三成，缺证据即缺场景"],["使用率 96% 能否说明体验好？","B","不能，需与绕行率、任务完成时长、退回率交叉验证"],["四层用户诉求互斥时按什么判据排序？","C","按谁承担后果，不按级别、不按人数、不按提出方"],["「更好用」无法翻译成组织指标时应如何处理？","D","降级，不与「少一人/少一次返工/少一天关账」争资源"],["职能系统的体验天花板由什么决定？","B","制度与审批链；界面只能在制度内优化步数"]]},{"no":2,"key":"m2","name":"定性研究方法","min":60,"ability":"定性研究方法（主） / 场景还原能力（辅）","ability_short":"定性研究","output":"深访提纲 + 观察记录表","intro":"能独立设计并执行一次有效访谈或一次现场观察，且拿回来的结论经得起追问。重点不在「会问」，在「不被用户的方案牵着走」。","points":["研究问题的改写：角色、环节、缺失物","BEI 提纲与四类必须删掉的提问","跟班观察：记录打断与绕行，不记录评价"],"wrap":["只访接口人，只能拿到系统的成功故事","绕行和沉默才是设计缺陷的证据","结论强度必须跟证据强度匹配"],"sections":[{"n":1,"m":5,"t":"从业务问题到研究问题：把「不满意」翻译成可观察的现象","hook":"「用户为什么不满意」这个问题，为什么问不出答案？","goals":["不可研究题目的三个特征","研究问题的三要素：角色、环节、缺失物","改写前后的对照"],"pages":[{"L":"cards","T":"不可研究的题目，通常缺三样东西之一","K":"能被观察到，才可能被研究；「想要什么」不可观察","D":[["缺角色","「用户觉得流程太麻烦」——哪个用户？一线还是审批人？两拨人的麻烦不是一回事。","把「用户」直接当成一个人。"],["缺环节","「报销体验不好」——填报、审批、打款，哪一段？没有环节就没有观察点。","用整体评价代替具体环节。"],["缺缺失物","「希望系统更智能」——缺的是信息、是提醒、还是自动填？说不出缺失物，就设计不出方案。","把感受当需求记录下来。"]]},{"L":"steps","T":"改写公式：谁 → 在哪一环 → 因为缺什么而放弃","K":"三要素齐了，题目才可研究，访谈提纲才有落点","D":[["写下原始问题","把业务方原话照抄，不要先美化。「大家都说难用」。"],["找角色","具体到岗位、职级、是否外包。一个角色一张提纲。"],["切环节","把流程切成 4–6 段，指出问题落在哪一段。"],["补缺失物","在这一段里，他缺的是信息、权限、提醒，还是模板？"]],"note":["一个改写示例","原始：「用户觉得绩效系统难用」。\n\n改写：「某基地部门经理，在季度考核打分这一环，因为看不到下属上一季度的目标完成情况，而反复退出系统去翻邮件」。\n\n改写后，下一步做什么已经很清楚：先解决「目标完成情况在打分页不可见」。"]}],"q":{"q":"以下哪一项是可以直接进入研究设计的题目？","o":["用户希望报销系统更好用","员工对HR系统的满意度如何","新员工在入职首周，因找不到导师联系方式而反复询问HR","管理层希望提升数字化体验"],"a":2,"why":"它有角色（新员工）、环节（入职首周）、缺失物（导师联系方式），可直接设计观察与访谈。其余三项都缺至少一个要素。"}},{"n":2,"m":5,"t":"抽样：为什么不能只访接口人","hook":"访谈了 8 个人都说「还行」，问题出在哪？","goals":["接口人偏差：他已是系统的成功适应者","极端用户与边缘用户的选法","6–8 人的饱和判断"],"pages":[{"L":"bands","T":"四类样本，缺一类就会得出偏乐观的结论","K":"接口人最容易被约到，也最不代表真实用户","D":[["关键接口人","各部门指定的系统联络人。熟悉流程、配合度高，但已经适应了系统，问题在他这里被消化掉了。"],["极端用户","用得最多的人和完全不用的人。前者暴露效率瓶颈，后者暴露放弃原因。"],["边缘用户","外包、兼职、跨基地、临退休。权限与培训覆盖最薄弱，问题最集中。"],["放弃者","已经彻底绕行的人。他们不在系统里，只能靠观察和旁敲侧击找到。"]]},{"L":"cards","T":"抽样不看人数，看是否覆盖了四种处境","K":"6–8 人饱和的判断标准：新访谈不再出现新的问题类型","D":[["按处境分层","同一角色下，按使用频次、权限范围、入职时长各取 2 人，比随机抽 10 人有效。"],["必须找到 1 个绕行者","找不到绕行者，说明你的样本仍全在系统内。让他演示他现在怎么做这件事。"],["饱和即停","连续 2–3 人不再带来新的问题类型，可以停；靠人数堆不增加信息量。"]]}],"q":{"q":"一次内部系统调研只访谈了各部门指定的系统联络人，最可能出现的偏差是：","o":["样本量太小，结论不显著","系统性低估问题严重程度，因为联络人已适应系统","受访者不愿说真话","结论无法量化"],"a":1,"why":"联络人是系统的成功适应者，他们的问题已在日常中自行消化。真正的缺陷留在绕行者与边缘用户身上。"}},{"n":3,"m":7,"t":"深访提纲设计：BEI 结构、五问追问、四类必须删掉的提问","hook":"为什么问「你觉得应该怎么改」，永远问不出真问题？","goals":["BEI 的三段结构：情境—行为—结果","五问追问的模板句","四类必须删掉的提问"],"pages":[{"L":"steps","T":"BEI：不问观点，问最近一次具体发生了什么","K":"人的记忆在具体事件上最准，在抽象评价上最不可靠","D":[["情境","「上一次遇到这个问题是什么时候？当时你在做什么？」锁定时间、地点、任务。"],["行为","「你当时第一步做了什么？然后呢？」只要动作，不要解释。"],["结果","「最后这件事怎么解决的？花了多久？」拿到代价与绕行路径。"],["复述校验","「我复述一遍，你看我理解得对不对」——当场纠偏，比事后猜测可靠。"]],"note":["四类必须删掉的提问","① 假设性：「如果系统能自动填，你会用吗」——答案永远是会。\n② 诱导性：「是不是因为字段太多才觉得麻烦」——把答案塞给对方。\n③ 双重问题：「系统是不是又慢又难用」——两个变量，无法归因。\n④ 让对方预测未来：「你希望以后怎么改」——他在给你方案，不是在给你事实。"]},{"L":"cards","T":"五问追问法：把一个模糊回答挖到具体","K":"每一问都要求对方给一个可指认的细节","D":[["「能举个最近的例子吗」","把评价拉回事件。对方说「经常出错」，就问他上一次出错是哪天。"],["「当时你怎么做的」","拿到动作序列，特别是系统外的动作。"],["「为什么这么做」","拿到他的判断依据，往往就是需求的真实约束。"],["「后来怎么解决的」","拿到绕行路径与代价，这是需求的入口。"],["「还有别人也这样吗」","判断这是个体特例还是结构性问题，决定要不要扩大样本。"]]}],"q":{"q":"以下哪个提问方式最符合 BEI 行为事件访谈？","o":["你觉得现在的审批流程合理吗","如果只能改一处，你会改哪里","上一次审批被退回是什么情况？当时你先做了什么","你希望系统增加什么功能"],"a":2,"why":"BEI 问具体事件中的行为。「上一次…当时…」锁定了情境与动作；其余三项分别是要评价、要方案、要功能清单。"}},{"n":4,"m":7,"t":"访谈执行：破冰、沉默、录音与当场复述","hook":"对方说「挺好的」，后面 40 分钟就白聊了？","goals":["破冰的真正目的是消除考核感","沉默 5 秒的作用","复述校验与合规要求"],"pages":[{"L":"steps","T":"四个动作，决定这次访谈有没有真话","K":"内部访谈最大的阻力不是时间，是「他怕你在考核他」","D":[["破冰：先说清用途","「这次不是评估你的工作，是看系统哪里给你添了麻烦，问题会匿名汇总。」"],["前 10 分钟不问系统","先聊他一天怎么过、什么时候最忙，让他进入叙述状态。"],["沉默 5 秒","对方说完停住时不要急着接话。5 秒的空白，往往换来最关键的那句补充。"],["当场复述","「我复述一遍：你每月初要花两天做这件事，因为…，对吗？」让他纠错。"]],"note":["录音与合规","内部访谈同样要口头告知并取得同意：「我录个音，只用于整理，不外传，可以吗？」\n\n转写标注规范：每段标注受访者编号、岗位、时间点；引语保留原话，不要顺手改成书面语——原话里的用词往往就是需求的线索。"]},{"L":"cards","T":"三类现场反应，对应三种处理","K":"访谈不是聊天，是有一张清单要拿满","D":[["对方开始给方案","先接住再还原：「这个思路我记下了。你说的这个问题，最近一次发生是什么时候？」"],["对方只说「都挺好」","换问法，问「最麻烦的一次」或「有没有想过去 Excel 里做」，用对比逼出问题。"],["对方开始抱怨人","把话题拉回系统与流程：「这件事在系统里是怎么走的？」人的问题另行记录。"]]}],"q":{"q":"受访者反复说「系统挺好的，没什么问题」，最有效的下一步是：","o":["换一个受访者","直接问「那你觉得哪里最需要改进」","问他「有没有哪次干脆不在系统里做，而是用 Excel 处理的」","结束访谈，记录为满意"],"a":2,"why":"用具体的绕行行为做切口，比继续问评价有效。绕行几乎人人都做过，承认绕行的心理成本远低于承认不满。"}},{"n":5,"m":5,"t":"焦点小组：什么时候能用，什么时候一定不能用","hook":"把 8 个人关在一间屋子里，为什么反而问不出真话？","goals":["焦点小组适合探索共识边界","同部门同层级的压制效应","主持人的三个控场动作"],"pages":[{"L":"compare","T":"焦点小组的适用与不适用","K":"它擅长找「大家怎么看」，不擅长挖「你实际怎么做」","D":{"l":["适合用",["探索一个群体对某类问题的共同认知边界，例如「大家眼里的『状态不透明』指什么」。","快速收敛选项：当备选方案有 6 个以上，用它淘汰明显不被接受的。","跨部门对齐认知：让财务、采购、IT 坐在一间屋子里，彼此听见对方的约束。"]],"r":["不要用",["挖掘个人真实做法：群体压力会让「绕行」这类行为消失。","同部门同层级同坐：谁职级低谁闭嘴；跨层级则变成汇报会。","涉及考核与责任的话题：没人会当面说自己填错过。"]]}},{"L":"cards","T":"主持人的三个控场动作","K":"控场的目的是让沉默的人说话，不是让会议顺利","D":[["先写后说","开场 5 分钟让大家各自写下 3 条，再轮流念。避免第一个发言者定调。"],["点名沉默者","「刚才你点了下头，你是怎么看的？」用动作召唤，不用「你有什么意见」。"],["压住强势者","「这个观点我先记下，想听听其他人有没有不同做法。」"]]}],"q":{"q":"以下哪个议题最适合用焦点小组，而不是深访？","o":["审核员核对发票时的具体判断顺序","各部门对「状态不透明」这个词的理解是否一致","某位用户上个月为什么放弃使用系统","高管对预算的真实态度"],"a":1,"why":"焦点小组擅长探索群体共识边界。A、C 属于个体行为细节，D 涉及敏感立场，都应在私下深访中获取。"}},{"n":6,"m":7,"t":"现场观察：跟班、影子跟随与工作日志","hook":"为什么观察一天，比访谈 8 个人更有用？","goals":["记录什么、不记录什么","观察记录表的三列结构","跟班的时长与时段选择"],"pages":[{"L":"cards","T":"只记录可数的行为，不记录评价","K":"「他看起来很烦躁」不是证据；「他在 10 分钟内切换了 7 次窗口」才是","D":[["记录打断","每被打断一次记一笔，并记下打断来源：电话、同事、系统弹窗、领导。"],[
