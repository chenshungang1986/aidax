window.NARR={"g_m0_1":[{"u":"audio/geely/g_m0_1_0.m4a?v=202611051410","d":44.33,"t":"这门课开始之前，先花八分钟，把三件事说清楚：你要学什么，怎么学，以及怎么才算学完。先说第一件。这门课不教你怎么对用户更热情，也不教你多去和用户聊天。它教的是一套判断顺序：先看场景，再定问题，最后才谈功能。为什么顺序这么重要？因为顺序反了，努力就是成本。你在项目里一定见过这种情况：需求会上所有人都说这个字段有用，上线三个月，使用率不到两成。这不是态度的问题，是顺序的问题。"},{"u":"audio/geely/g_m0_1_1.m4a?v=202611051410","d":48.91,"t":"再说你的用户是谁。这门课面向的是人力、财务、采购这些职能部门的业务产品经理，你的用户不是消费者，是同事，而且往往是比你更强势的同事。这就带来一个根本差别：内部系统没有流失率这个信号，用户不会卸载，他只会绕行——用 Excel，用微信群，用纸质台账。所以本课把绕行当作最重要的诊断信号，在用户思维、需求挖掘、旅程绘制三个模块里反复训练你怎么识别它。记住一句话：用户不抱怨，不代表没问题；他不吭声，可能已经绕过去了。"},{"u":"audio/geely/g_m0_1_2.m4a?v=202611051410","d":44.04,"t":"全课八个模块，五十九节，八个学时。前四个模块解决的是怎么看清：模块一用户思维总纲，给你一把全课通用的尺子，叫场景还原五问；模块二定性研究方法，教你把访谈和现场观察做扎实，结论经得起追问；模块三定量研究方法，讲清什么问题必须用数、什么数不能信；模块四用户画像构建，让画像从墙上的海报，变成评审会上能用的判据。这四个模块学完，你手上会有四张填好的工具卡。"},{"u":"audio/geely/g_m0_1_3.m4a?v=202611051410","d":48.46,"t":"后四个模块解决的是怎么判：模块五需求挖掘与识别，是全课最核心的一章，目标是把一句话需求拆到真实问题；模块六需求优先级判断，让排序从谁声音大谁先做，变成同一套口径、可解释、可复述；模块七用户旅程绘制，画出从认知到离开的完整旅程，包含系统外的触点；模块八用户反馈闭环与满意度度量，把反馈从收集箱变成改进流水线。八个模块串起来是一条链：场景、问题、证据、取舍、体验、闭环，缺一环就断。"},{"u":"audio/geely/g_m0_1_4.m4a?v=202611051410","d":42.58,"t":"为什么必须是这个顺序？因为后面每一步的判断，都建立在前面一步的结论上。场景没还原，你定出来的问题就是伪问题；问题没定准，你收集的证据都是为错误结论服务的；证据不足，排序就退化成拍脑袋；排序错了，旅程画得再漂亮也是在优化不该做的事。所以这门课不允许跳着学。不是我们想管着你，是跳过前面的判断，后面的工具你只会照着表格填，填完还是不知道该怎么决策。"},{"u":"audio/geely/g_m0_1_5.m4a?v=202611051410","d":44.9,"t":"学习节奏建议两周。第一周前两天，模块一加模块二，把场景还原五问卡和深访提纲做出来；第三第四天，模块三加模块四；第二周前半周，模块五和模块六，这两章最费脑子，建议留整块时间；后半周，模块七和模块八，收尾交作品集。每一节八到十分钟，一天看两到三节，加上练习大约四十分钟。不要攒到周末一次看完，这门课的价值在填卡，不在看完。课程有效期六个月，重看免费。"},{"u":"audio/geely/g_m0_1_6.m4a?v=202611051410","d":38.5,"t":"每一节怎么学？三步。第一步，把这一节的视频看完，注意是看完，不是打开。系统按有效收听时长计算，听到八成以上才算看完，拖动进度条不算数。第二步，点马上测评，做五道随堂题，每题一分钟，十分钟倒计时。第三步，测评通过，下一节自动解锁。视频没听完，或者测评没过，下一节是锁着的。这两个条件缺一不可，这是本课唯一的硬规则。"},{"u":"audio/geely/g_m0_1_7.m4a?v=202611051410","d":36.07,"t":"测评怎么设计？先说随堂。每节五道题，答对三道通过，题目全部来自本节内容，大概一半是场景题：给一个具体的业务情境，问你第一步该做什么。做题的时候，提交之前答案可以随时改，点了提交就锁定，立刻出成绩和逐题解析。成绩取历史最好一次，没过可以重做，重做会重新计时。十分钟倒计时归零会自动交卷，所以别在一道题上耗太久。"},{"u":"audio/geely/g_m0_1_8.m4a?v=202611051410","d":34.49,"t":"然后是章节测评。每学完一章，也就是七到八节全部完成之后，解锁这一章的章节测评，十道题，十分钟，答对六道通过。它比随堂难一档，案例更长，干扰项更接近真实会议上的说法。章节测评不通过，下一章第一节就打不开。这是为了确保你带着完整的框架进入下一章。重做不限次数，但每次题目顺序和选项顺序会变，背答案没有用。"},{"u":"audio/geely/g_m0_1_9.m4a?v=202611051410","d":39.6,"t":"最后是认证。总分一百分，由四块构成：学习完成度五分，随堂练习五分，客观题考试五十分，实操作品集四十分。客观题三十三题，单选多选判断都有，多选必须全对才给分，考完即冻结。作品集两件交付物，由评审按四个维度打分。注意分值分布：客观题和作品集占了九十分，随堂和完成度只有十分。意思是，光把视频看完拿不到证，必须真的会做题、交得出东西。"},{"u":"audio/geely/g_m0_1_10.m4a?v=202611051410","d":41.38,"t":"发证是四个条件同时满足，不是总分过线就行。第一，总分不低于七十五；第二，客观题得分率不低于七成；第三，作品集得分率不低于七成；第四，九项能力子项里，任何一项都不能低于六成，这叫短板否决。为什么这么设？因为总分可以靠强项拉平，但一项能力真的不会，到了岗位上就会出事。三个阶段分别认定三组能力，目前开放的是阶段一，模块一到模块二。"},{"u":"audio/geely/g_m0_1_11.m4a?v=202611051410","d":38.26,"t":"最后三条注意事项。第一，别攒着看，这门课每天四十分钟，两周能走完，攒到周末就是三次放弃。第二，工具卡一定要用自己的真实项目去填，填别人的案例，评审一眼就能看出来。第三，遇到和工作冲突的章节，先跳过去看下一节，回头再补，但章节测评之前必须补齐。好，规则讲完了。下一节我们正式开始模块一：什么叫可验证的判断顺序。"}],"g_m1_1":[{"u":"audio/geely/g_m1_1_0.m4a?v=2026110417","d":60.24,"t":"这一节我们讲第一件事：什么叫用户思维。先说结论，用户思维不是态度问题，是一套判断顺序。很多同学听到这儿会觉得，态度我也没问题，我很愿意听一线的意见。但你在项目里一定遇到过这种情况：需求会上所有人都说这个字段有用，上线三个月，使用率不到两成。这不是态度的问题，是顺序的问题——先收集意见，再拼功能，最后才想谁在用。这三分钟，我给你三样东西：三种看起来很努力、其实没有判断的伪用户思维；一个可以照着走的顺序，先场景、再问题、后功能；还有一件事，顺序错了，代价到底落在谁头上。"},{"u":"audio/geely/g_m1_1_1.m4a?v=2026110417","d":65.52,"t":"先说三种伪用户思维。第一种，态度好但判断错。开会最积极，用户提什么都记下来，最后做成一个功能很全的系统。他以为功能多就是诚意，结果系统越做越重，一线越用越绕。第二种，调研走过场。问卷发了三百份，访谈做了十几场，报告写得很长，结论是「希望系统更好用一点」。这句话没错，但它落不到任何一个设计决策上——你没法拿它去决定这个按钮放左边还是右边。第三种，把领导当用户。按汇报的口径设计系统，因为汇报的时候领导看得见。上线以后天天用它的是一线专员，而这位专员从来没进过需求评审会。这三种的共同点，不是不努力，是没有判断顺序。"},{"u":"audio/geely/g_m1_1_2.m4a?v=2026110417","d":54.89,"t":"那正确的顺序是什么？三句话：先还原场景，再定义问题，最后才谈功能。场景是「谁、在什么条件下、为完成什么」，问题是「他现在卡在哪一步、付出了什么代价」，功能是前两步的答案。顺序一反，后面全废——因为功能一旦先定下来，场景就会被裁掉去迁就它。说代价：顺序错了，代价不落在你身上，落在那位每天多点二十下的专员身上，落在月底加班核单的审核员身上。所以这一节的任务很简单：找一件你手上正在做的需求，先别写方案，把「谁在用」写成具体的岗位和人，写不出来就先停。"}],"g_m1_2":[{"u":"audio/geely/g_m1_2_0.m4a?v=2026110417","d":70.87,"t":"上一节说了判断顺序，这一节我们看反面：顺序错了会变成什么样。数字化项目里最常见的三类错位，都是把「做了什么」当成了「改善了没有」。我先说个现象。有个基地的报销流程上线以后，一线反馈比纸质时代更慢。项目组的判断是「用户不习惯」，于是加培训、发操作手册。三个月后还是慢。后来有人去跟了半天班才发现：纸质时代，一张单子填完直接递给隔壁工位的领导签字；上线以后要拍照上传、要选成本中心、要等领导有空登录系统审批。系统一步没少，还多了附件和等待。这不是习惯问题，是把流程原样搬上线的必然结果。这五分钟，把三类错位讲清楚，你回去可以拿这三条去照自己的项目。"},{"u":"audio/geely/g_m1_2_1.m4a?v=2026110417","d":64.73,"t":"第一类，把流程线上化当成体验改善。判定标准很简单：字段有没有减少，审批环节有没有减少，等待时间有没有缩短。三个都没有，那你做的只是把写字换成了打字。真正的体验改善，往往发生在「删」上面，不在「加」上面。我常说一句话：上线一个系统，先删三个字段，比加三个功能更能让人感受到变化。第二类，把报表当成决策支持。很多系统做了很漂亮的看板，十几个图表，但看完以后你不知道该干什么。财务的同事看完还得自己导出来算一遍，于是继续用 Excel。绕行就是从这儿开始的——不是他不愿意用系统，是系统没有给他结论。决策支持的定义是：看完这张表，他能做出一个决定，或者能回答一个会上会被问到的问题。"},{"u":"audio/geely/g_m1_2_2.m4a?v=2026110417","d":54.17,"t":"第三类，把使用率当成满意度。这一条最容易被误读，因为在内部系统里，使用率天然很高——制度要求你必须用。一个被强制使用的系统，使用率可以是百分之百，同时满意度很低。它反映的是流程强制力，跟体验没关系。那看什么？看绕行率、看人均操作步数、看二次修改率、看单均耗时、看求助工单量。这些指标才反映体验。我建议每个项目上线后都看一个数：同一件事，在系统内完成的比例是多少，剩下那些人是怎么办成的。这个数往上走，才叫体验改善。"},{"u":"audio/geely/g_m1_2_3.m4a?v=2026110417","d":70.01,"t":"这三类错位背后有一个共同的根源：把交付当成成果。项目交付物是上线通知，成果是行为改变。上线通知可以按计划发出，行为改变不会。所以我建议你把每个项目的验收标准改一下：不写「系统已上线并稳定运行」，写「某岗位的某动作，从几步降到几步、从几分钟降到几分钟」。这个改动看着小，它会让整个项目组的注意力从「按时交付」转到「有没有变」。还有一个更隐蔽的版本：把上线当成了终点。上线之后没人看数据、没人回访、没人改，系统就停在第一版。职能系统真正的价值往往在第二版、第三版才出来，因为第一版只能验证流程通不通，第二版才知道哪里真的卡。所以我建议每个系统上线后固定做一次三十天回访，看三个数：绕行率、求助量、单均耗时。"},{"u":"audio/geely/g_m1_2_4.m4a?v=2026110417","d":49.2,"t":"把这三类错位收一下。线上化不等于体验，因为字段和环节可能一个没少；报表不等于决策支持，因为看完还得自己算；使用率高不等于满意，因为它是制度推出来的。判断的方法就一句：你做的这件事，改变了用户哪一个具体动作、减少了多少时间、少了几次返工。答不上来，说明你还在做「做了什么」，没做到「改善了没有」。这一节的任务：拿你现在负责的一个系统，把这三个数找出来——单均操作步数、单均耗时、绕行率。找不出来的，说明你现在还看不到体验。"}],"g_m1_3":[{"u":"audio/geely/g_m1_3_0.m4a?v=2026110417","d":47.83,"t":"这一节是 M1 的核心，也是整门课后面所有方法的地基：场景还原五问。这十分钟，我要让你带走一个能当场用的东西——不是概念，是五个问题，以及每一问必须拿到的证据。先给结论：五问填满，你能直接否掉三成需求；五问填不满，说明这个需求还没到能评审的程度。为什么这么说？因为大部分需求写的是方案，不是场景。比如「报销单要支持批量导入」。这句话里没有人在用，没有条件，没有代价。它可能对，也可能完全没必要——你没法判断。"},{"u":"audio/geely/g_m1_3_1.m4a?v=2026110417","d":58.63,"t":"我先说五问为什么有效。它的顺序是设计过的：从人，到条件，到目的，到绕行，到最后后果。前面四问是还原，最后一问是定价。顺序不能反，反了就会变成「先问要不要做」。很多需求评审开成吵架会，就是因为一上来就讨论「这个功能该不该做」，而没人知道用户当时在什么条件下、卡在哪一步。五问的作用，是把讨论从「要不要」拉回到「是不是这样」。我做过统计，一个中等规模的职能系统需求池，五问填完，大概三成会被自己的答案否掉：要么使用者根本找不出来，要么说不出绕行路径，说明这个痛感不成立。"},{"u":"audio/geely/g_m1_3_2.m4a?v=2026110417","d":49.7,"t":"第一问，谁在用。注意，不是「财务人员」，是「某基地一位费用审核员」，要写到岗位、职级、人数，还要写是不是外包、是不是兼职。为什么要这么细？因为外包和正式员工在权限、培训覆盖、离职率上完全不同，兼职的人一个月只进来两次，他记不住路径。这一问要拿到的证据是：这个人真实存在，你能叫出他的岗位。填不出来的意思是：你还没找到真正的使用者，现在讨论的是想象中的用户。最常见的错误是写「全体财务人员」，这等于没写。"},{"u":"audio/geely/g_m1_3_3.m4a?v=2026110417","d":54.65,"t":"第二问，在什么条件下。时间压力、设备、场地、会不会被打断。同一个人在不同条件下完全是两个用户。月底关账前一天的他，和月中闲着的他，对同一个界面的容忍度差好几倍。这一问要的证据是一次完整观察或者一份跟班记录，不是「我跟他聊过」。比如你在会议室里问他流程顺不顺，他一定说不顺；但你坐在他工位旁边看，会发现他其实是在两个系统之间来回切，真正的卡点不是界面难用，是数据在两个系统里对不上。填不出来，说明你只在会议室里理解用户。"},{"u":"audio/geely/g_m1_3_4.m4a?v=2026110417","d":59.64,"t":"第三问，为完成什么。这一问要的是他交付的那个动作，不是系统里的功能名。不是「提交报销单」，是「月结前把这张单子核完，别拖到次月」。区别在哪？前者是系统语言，后者是工作语言。工作语言里带着截止时间和后果，能帮你判断这件事有多急、错一次的代价有多大。填不出来，说明你在按功能清单设计，不是按工作目标设计。我常让学员做一个小练习：把需求描述里所有的动词圈出来，如果圈出来的都是点击、提交、查询、导出，那就是功能清单；如果出现核完、催到、对平、签完，那才是工作目标。"},{"u":"audio/geely/g_m1_3_5.m4a?v=2026110417","d":48.74,"t":"第四问，现在怎么绕过。这一问最值钱，因为它暴露真实约束。绕过的方式有很多：Excel 台账、微信群、纸质单、私人记录、让同事代为填写。每一种绕行都指向一个系统没解决的约束。比如审核员在 Excel 里建了一张供应商历史付款台账，说明系统里查不到历史付款；比如采购员在微信群里问合同编号，说明两个系统的编码没打通。这一问的证据要具体到文件名、群名、台账名。说不出具体的，说明你还没看到真实约束，只听到了抱怨。"},{"u":"audio/geely/g_m1_3_6.m4a?v=2026110417","d":48.29,"t":"第五问，不做会怎样。后果是什么、谁承担、有没有时限。这一问是用来判断紧迫性的，也是用来判断「该不该由系统解决」的。有些后果是流程问题，加功能解决不了；有些是培训问题；还有些后果，其实根本没人承担，那就说明这件事优先级不高，别硬做。五个问题问完，输出是一张能拿去开会的卡：左边五个问题，右边填证据。这张卡最大的价值不是记录，是筛子——填不满的那几行，就是这个需求还没准备好的地方。"},{"u":"audio/geely/g_m1_3_7.m4a?v=2026110417","d":70.18,"t":"我们拿一个真实场景把五问走一遍，你就知道这张卡怎么填。需求是「报销单要加项目编号字段」。第一问，谁在用：某基地费用审核员，正式员工，一共四人，其中两人兼岗；第二问，什么条件下：月结前五天最忙，一天要看六十到八十单，一半以上的单子附件不全要退回；第三问，为完成什么：月结前把这批单子核完，别拖到次月影响关账；第四问，怎么绕过：审核员自己维护了一张 Excel 台账，文件名就叫「待核清单」，每天更新；第五问，不做会怎样：关账延后，财务经理要在集团会上说明原因。五问填完你会发现，真正的问题不是缺项目编号，是附件不全导致反复退回——项目编号只是他们想到的一个解法。这就是五问的价值：它把「要什么功能」变成了「卡在哪一步」。"},{"u":"audio/geely/g_m1_3_8.m4a?v=2026110417","d":61.68,"t":"再说五问在评审会上怎么用，这是它最实用的地方。当有人提一个需求，你不要说「我觉得没必要」，那会变成立场之争。你只问三句：这个功能谁用，能说出岗位吗；他现在怎么解决这件事，有没有具体文件名；不做的话，后果谁承担。这三句问完，通常有三种结果：一是对方答得很顺，那这个需求成立，往下走；二是对方卡在第二问，说明他还没去过现场，你可以建议他先去跟半天班；三是对方卡在第三问，说明这件事没有后果承担者，那它就不是需求，是想法。用这三句的好处是，你否掉的是证据不足，不是某个人。这在对内协作里非常重要，因为你们明天还要一起开会。"},{"u":"audio/geely/g_m1_3_9.m4a?v=2026110417","d":54.17,"t":"最后说五问的边界，别把它用成万能工具。有三种情况五问不够用。第一种，全新业务，还没有现有用户，这时候没有「现在怎么绕过」可问，你得用类比和推演，去找一个最接近的相似场景。第二种，跨部门流程重设计，问题不在单点动作，而在部门之间的交接，这时候要把五问按环节各做一遍，看断点落在哪个交接处。第三种，制度性约束，比如合规要求必须留痕，这时候五问能帮你算清成本，但改不了结论，你要做的是把成本讲给制度 owner 听。认清边界，比把工具用到底更重要。"},{"u":"audio/geely/g_m1_3_10.m4a?v=2026110417","d":44.54,"t":"收一下。五问的顺序是：谁在用、在什么条件下、为完成什么、现在怎么绕过、不做会怎样。每一问都要拿到可指认的证据：岗位、观察记录、交付动作、文件名、承担者。拿不到就是没还原。判断标准很硬：填不满三行以上的，别提交评审，回去补。这一节的任务：挑一个你手上的需求，把这张五问卡填完，然后发给你的主管看。特别注意第四问，如果你写不出具体的文件名和群名，就说明你还没去过现场。"}],"g_m1_4":[{"u":"audio/geely/g_m1_4_0.m4a?v=2026110417","d":41.66,"t":"这一节解决一个具体麻烦：一个字段到底加不加，四个角色给你四种答案，听谁的？职能数字化系统里，这几乎是每天都要面对的事。这一节十分钟，我给你一个分层结构，以及一条唯一的判据——不是按级别排，也不是按人数排，是按后果归属排。先说结论：同一套系统，四个人说的「好用」根本不是一件事。你把他们的诉求混在一起讨论，结论一定是最保守的那个方案，因为每个人的诉求都会削掉别人的东西。"},{"u":"audio/geely/g_m1_4_1.m4a?v=2026110417","d":42.34,"t":"第一层，使用者。他看的是动作和频次：一天点几次、每次几步、会不会被打断。他要的是快。判断使用者的诉求真不真，不要问他「你觉得好不好用」，问他「昨天这件事你做了几遍、花了多久」。使用者的诉求有个特点：极其具体，而且经常跟制度冲突。他说「这个附件能不能不传」，背后可能是制度要求必须留档。这时候你要做的是把冲突记下来，不是当场答应或拒绝。"},{"u":"audio/geely/g_m1_4_2.m4a?v=2026110417","d":40.32,"t":"第二层，管理者。他看的是指标和考核：人均单量、差错率、处理周期。他要的是稳、可算。管理者的诉求往往表现为「要一个报表」「要一个字段」，但你往下追一层，会发现他要的是「能对外解释清楚」。所以对着管理者，你要问的是：这个数你拿去做什么决定，或者回答谁的提问。答不出来的维度，就是可以砍的维度——这一条在 M1 第五节的排版会再讲一次。"},{"u":"audio/geely/g_m1_4_3.m4a?v=2026110417","d":42.65,"t":"第三层，决策者。他看投入产出：这笔钱换来什么、能不能对外讲、能不能写进年度总结。他要的是值。职能系统的决策者通常不是业务一把手，而是分管副总或者数字化负责人。他关心的不是某个页面好不好用，而是这个项目跟集团今年的重点对不对得上。跟他汇报，不要讲交互细节，讲三件事：省了多少人日、缩了多少天、少了多少差错。这就是下一节「价值判据」要展开的内容。"},{"u":"audio/geely/g_m1_4_4.m4a?v=2026110417","d":43.8,"t":"第四层，监管者。他看留痕和合规：三年后能不能追溯、有没有依据、审计来了能不能拿得出来。他要的是可查。这一层最容易被忘掉，因为它不在日常需求会上。但它是否决权最大的一层——一旦审计提出意见，前面所有的体验优化都要让路。所以你在设计阶段就要问：这个流程的留痕要求是哪份制度定的，要求保存几年，谁有权查看。这三个问题问清楚，能省掉后面很多返工。"},{"u":"audio/geely/g_m1_4_5.m4a?v=2026110417","d":44.76,"t":"四层讲完，我们看三种典型的互斥结构。第一种，快对稳。一线要少填，审核要留痕。字段越多审核越省事，一线越费时。第二种，细对简。管理层要维度，执行层要步数。第三种，留痕对效率。合规要审批链，业务要当天办完。这三种互斥，你在任何一个职能系统里都会遇到，而且它们不会自己消失，只能被裁决。很多项目卡住，不是因为方案不好，是因为没人做这个裁决，于是一直挂着。"},{"u":"audio/geely/g_m1_4_6.m4a?v=2026110417","d":54.26,"t":"裁决的判据只有一个：谁承担后果。注意，是承担后果，不是谁级别高、不是谁人多。比如「这个字段要不要设成必填」。一线的后果是每次多花十五秒；审核的后果是这张单子出问题时解释不清。如果出问题时要审核员去写说明、去补材料，那这个字段就该必填，同时你要在一线那一侧补偿——比如带出上次的值、做默认值、做批量填。判据的作用不是选边站，是让你在选边之后知道该补偿谁。我建议每个争议字段都写一行：谁承担后果、补偿动作是什么。写不出来，说明这个裁决还没做完。"},{"u":"audio/geely/g_m1_4_7.m4a?v=2026110417","d":62.62,"t":"举一个采购系统的例子。需求是「合同编号要设成必填，而且从合同系统带过来」。使用者说不要必填，因为急单的时候合同还没签，填不了就卡住了；管理者说必须必填，因为没有合同编号，付款时对不上账；决策者说这个字段能减少多少纠纷；监管者说审计要求每一笔付款都能追到合同。四个人四个答案，而且都对。这时候判据是：谁承担后果。付款对不上账，承担后果的是审核员和财务经理；急单卡住，承担后果的是采购执行。两边都承担后果，那就不是选一个，是设计一个分支：急单走例外通道，标记待补，三十天内补齐，超期提醒。这个方案谁都不满意，但谁的后果都没被忽略。"},{"u":"audio/geely/g_m1_4_8.m4a?v=2026110417","d":64.03,"t":"所以字段争议的处理，我建议固定三步。第一步，摆后果：把每一层「如果不这样，会出什么问题、谁去解释」写下来。写不出来的一方，诉求就先放一放。第二步，定补偿：裁决之后，被削掉诉求的那一方，你要给他一个补偿动作。比如字段必填了，就给一线做默认值、做上次值带出、做批量填；审批链长了，就给业务做一个加急通道。补偿动作不需要很大，但它决定了这个人下次还愿不愿意跟你说真话。第三步，留记录：把裁决理由写进需求文档，注明是谁定的、依据哪份制度。半年后有人翻旧账，你有据可查。这三步做完，一个字段争议大概二十分钟能定，而不是开三次会还挂着。"},{"u":"audio/geely/g_m1_4_9.m4a?v=2026110417","d":60.24,"t":"再说四层失衡会有什么后果，这三种你一定见过。只听使用者，系统会变得很好用但合规上有洞——字段能省就省，留痕能少就少，等到审计来了一次补齐，前面省的都白省。只听管理者，系统会变成考核工具，一线开始系统性绕行：能不进系统就不进，进去了也填假数据。只听决策者，系统会做得很大很全，功能清单漂亮，但每个功能都浅，谁也说不清哪个真的在用。只听众监管者，系统会变成一台留痕机器，每个动作都要审批，业务等不起，最后还是走线下。四种失衡的共同点是：你以为你在优化，其实你在把成本转移给没有发言权的那一层。"},{"u":"audio/geely/g_m1_4_10.m4a?v=2026110417","d":66.72,"t":"那怎么把四层拉到一起？我建议开一次九十分钟的对齐会，四步走。第一步，十五分钟，把场景还原五问的结果念一遍，让所有人对「谁在用、什么条件下」有同一个事实基础。这一步不能省，很多争议是因为大家脑子里想的是不同的用户。第二步，二十分钟，让每一层各说一条最不能让步的诉求，只许说一条，逼他们排序。第三步，三十分钟，逐条摆互斥关系，用「谁承担后果」裁决，当场定，不许带回部门。第四步，十五分钟，把裁决结果和补偿动作复述一遍，确认每层都听懂了。这个会的产出是一页纸，不是会议纪要——一页纸上写清：争了什么、怎么定的、补偿是什么。"},{"u":"audio/geely/g_m1_4_11.m4a?v=2026110417","d":41.47,"t":"最后说一类人：影响者。他不在四层里，却能否决你。典型的是信息安全、内控、法务、IT 架构、工会。他们不产生需求，但会否掉需求。处理方式不是最后才去报批，而是在方案成形之前就拉进来，问他一句：这个做法有没有硬约束。这一句话能省掉你两周的返工。这一节的任务：把你在做的系统，按四层各写一个具体的人名或岗位，然后找出你漏掉的那一层。绝大多数人漏掉的是监管者。"}],"g_m1_5":[{"u":"audio/geely/g_m1_5_0.m4a?v=2026110417","d":39.07,"t":"这一节讲怎么把「更好用」翻译成领导听得懂的话。这是产品经理在职能域最缺的一项能力——不是不会做设计，是不会定价。你做了很多改善，但说不清值多少钱，于是排在别人后面。这一节十分钟，三个价值锚点，四个翻译动作，还有一条判断：翻不出来的需求该排第几。先说结论：用户满意是过程指标，组织绩效才是结果指标。在内部系统里，只讲前者，永远拿不到资源。"},{"u":"audio/geely/g_m1_5_1.m4a?v=2026110417","d":46.61,"t":"为什么「更好用」翻不出来？因为它是形容词，不是数量。形容词没法比较，也没法验收。你说这个系统更好用了，别人问好用多少，你答不上来。更麻烦的是，形容词会让人怀疑你在替用户说话，而不是替组织说话。在职能域，用户和组织是同一个人群，但立场不同：作为用户他想少填两栏，作为组织成员他要对流程负责。你只讲前一半，就会被当成「替一线叫苦」。所以必须翻译，翻译成组织语言：人、钱、天、差错。"},{"u":"audio/geely/g_m1_5_2.m4a?v=2026110417","d":46.42,"t":"第一个锚点，少一个人。原来三个人干的活，两个人能干。这句话等价于编制和人力成本，是最容易被管理层听懂的语言。要注意，不要直接说「可以减一个人」，那会引发抵触。更稳的说法是「同等业务量下，所需投入从三个人降到两个人」，把结论留给对方说。算法是：单次耗时乘以频次乘以人数，得到月工时，再除以一个人的月有效工时。这个数算出来往往比直觉小，但它是可验证的，比形容词有力得多。"},{"u":"audio/geely/g_m1_5_3.m4a?v=2026110417","d":44.09,"t":"第二个锚点，少一次返工。退单、重填、二次核对。这一类最容易验证，因为系统里有记录。退单率从百分之三十四降到百分之十五，就是一个可以写进汇报的数。算法是：退单量乘以单均重填耗时，再乘以涉及人数。返工的价值还有一层：它往往伴随情绪成本和沟通成本，这部分不好量化，但可以在访谈里拿到原话，作为汇报里的引证。我建议每个项目都盯一个返工指标，这是投入产出最清楚的改善点。"},{"u":"audio/geely/g_m1_5_4.m4a?v=2026110417","d":36.96,"t":"第三个锚点，少一天关账。周期缩短影响的是资金效率和管理节奏，比工时更值钱，但需要跨部门数据才能算。比如月结从七天压到六天，对财务意味着什么？意味着资金计划提前一天，意味着管理层早一天看到数。这一条最值钱，也最难算，因为它需要你去找财务计划岗要数据。但只要算出来一次，后面所有项目都可以复用这个换算关系。"},{"u":"audio/geely/g_m1_5_5.m4a?v=2026110417","d":63.86,"t":"接下来是四个翻译动作，可以照着做。第一步，找到那个动作。用户说的「麻烦」，对应哪一个具体动作：填、核、催、查、等。注意是动词，不是模块名。第二步，数清它的频次。一天几次、一月几次、涉及几个人。频次决定价值量级——一天三次的动作，改善百分之二十，价值远大于一年一次的动作改善百分之八十。第三步，折算成时间。单次耗时乘以频次乘以人数，等于月工时，再折算人日。第四步，挂到组织指标上。工时挂人均单量，周期挂关账天数，差错挂退单率。挂不上就降级。"},{"u":"audio/geely/g_m1_5_6.m4a?v=2026110417","d":36.77,"t":"为什么要强调「挂不上就降级」？因为职能域的资源永远不够，你必须排序。一个需求如果既省不了人、省不了时间、降不了差错，那它大概率是「体验优化」，应该排在能算出价值的后面。这不是说体验不重要，是说在资源有限的时候，要先做能算清的。反过来说，如果你手上全是算不清的需求，那说明你没有在做价值管理，你在做需求搬运。"},{"u":"audio/geely/g_m1_5_7.m4a?v=2026110417","d":70.39,"t":"把四个动作走一个完整例子，你会看到数字怎么出来。某集团费用审核岗，单均审核耗时六分半，月均四千二百单，涉及十二个人。第一步找动作：卡在「核对发票与单据是否一致」，这是一个核的动作。第二步数频次：每单必做一次，月四千二百次。第三步折时间：如果系统能自动比对金额和税号，单均从六分半降到四分钟，每单省两分半，月省一万零五百分钟，约一百七十五小时，折二十二人日。第四步挂指标：二十二人日除以月均二十一点七五日，约等于一个人。所以这个需求的表述应该是：同等业务量下，审核投入从十二人降到十一人，或者同样十二人可承接一点零九倍业务量。这句话放进立项材料，比「提升审核效率」有力得多。"},{"u":"audio/geely/g_m1_5_8.m4a?v=2026110417","d":55.34,"t":"这四个动作算完，怎么写进立项文档？我给你一个三行模板。第一行写现状：某岗位，单均耗时多少，月频次多少，涉及多少人，折算月工时多少。第二行写改善：改完预计单均降到多少，月省工时多少，折多少人日，依据是什么（依据可以是试点数据、可以是同类系统对比、可以是访谈里的自述耗时）。第三行写挂靠：这个数对应哪个组织指标，是人均单量、关账天数，还是退单率，这个指标现在是多少，改完预期是多少。三行写完，一页纸，可以直接进排期会。写不满三行的需求，不要拿去争资源，先去补数据。"},{"u":"audio/geely/g_m1_5_9.m4a?v=2026110417","d":70.92,"t":"三个锚点有三个常见误用，提前说清楚，免得你踩。第一个，把「少一个人」说成「可以减员」。这句话一出口，一线立刻把你当对手，后面所有访谈都拿不到真话。正确说法是「同等业务量下投入下降」，减不减人、减谁，是管理者的事，不是你的结论。第二个，把理论工时当成实际节省。算出月省一百七十五小时，不等于真的省了这些时间——如果没有把省下的时间转去做别的事，这些时间会消失在碎片里。所以要在方案里写清楚：省下的时间用来做什么。第三个，口径不一致。你按工时算，财务按人日算，人力按编制算，三个数对不上，会上就会被质疑。统一口径的办法是：先问对方按什么口径考核，再用他的口径重算一遍。"},{"u":"audio/geely/g_m1_5_10.m4a?v=2026110417","d":62.86,"t":"最后说数据从哪来，这是大多数人卡住的地方。三个入口，按可得性排序。第一个，系统日志：单均耗时、操作步数、退回率、二次修改率，这些系统里都有，找 IT 或者运维要，一般一周内能拿到。第二个，财务口径：人日成本、关账天数、退单量，这些在财务报表和管理报表里有，找财务的计划岗或者共享中心负责人。第三个，人力口径：编制、在岗人数、兼岗比例，找 HRBP。三个入口都拿不到的时候，还有一个办法：自己测。找两个人，各做五单，掐表记时间，样本小，但比拍脑袋强，而且这个数据是你自己的，对方没法质疑口径。"},{"u":"audio/geely/g_m1_5_11.m4a?v=2026110417","d":36.55,"t":"这一节收一下。三个锚点：少一个人、少一次返工、少一天关账。四个动作：找动作、数频次、折时间、挂指标。一条判断：翻不出价值的，降级排队。这一节的任务：拿你最近提的一个需求，用这四个动作算一遍，写成三行字——现在花多少时间、改完省多少、挂到哪个组织指标上。写不出来，就说明这个需求你还没想清楚为什么要做。"}],"g_m1_6":[{"u":"audio/geely/g_m1_6_0.m4a?v=2026110417","d":39.89,"t":"这一节换个视角，从单个需求拉到全景：行业里的数字化产品分成几类，每一类的用户结构有什么不同。为什么要讲这个？因为很多同学会把另一类产品的做法直接搬过来，方法论就失焦了。比如你在车主 App 那边做得很顺手，调过来做费控，会发现原来那套完全不好使——因为那边的用户是自愿的，这边的用户是被要求的。这一节给你一张地图，帮你定位自己在哪一格。"},{"u":"audio/geely/g_m1_6_1.m4a?v=2026110417","d":52.27,"t":"行业里的数字化产品，粗略分六类。第一类，集团协同办公，主要用户是全体员工，动机是被要求使用，体验关键是流程不绕、状态可见。第二类，供应链与采购，用户是采购执行、需求方和供应商，动机是业务必须完成，体验关键是状态透明、时效。第三类，制造与质量，用户是班组长、质检、工艺，动机是生产节拍驱动，体验关键是少录入、能离线。第四类，经销商与售后，用户是门店顾问、服务经理，动机是考核与返利，体验关键是算得清、少返工。"},{"u":"audio/geely/g_m1_6_2.m4a?v=2026110417","d":53.28,"t":"第五类，车主 App 与车机，用户是车主，动机是自愿使用，体验关键是快、准、有惊喜。第六类，就是本期要讲的职能数字化，用户是人力、财务、采购的同事，动机是制度要求加自身省事，体验关键是一次填对、状态可查。这六类里，前五类你都可能接触过，但方法论不能直接搬。我举一个最典型的对比：车主 App 的用户不用就卸载了，所以留存率是真信号；而职能系统的用户不用就没法交差，使用率是假信号。同一个指标，含义完全相反。"},{"u":"audio/geely/g_m1_6_3.m4a?v=2026110417","d":36.7,"t":"重点讲职能域的三个特征，它们决定了方法要改哪里。第一个特征，用户即同事。你明天还要跟他开会，甚至他就坐在你斜对面。这个特征带来两个后果：一是你不能「调研完就下结论」，你的方案要能当场被质疑、当场解释；二是他会给你留面子，访谈时说「挺好的」，这会严重污染你的样本。所以内部访谈要比外部访谈更刻意地去拿具体事件，不能靠感觉。"},{"u":"audio/geely/g_m1_6_4.m4a?v=2026110417","d":37.94,"t":"第二个特征，需求即管理动作。职能域的需求背后往往是一条管理制度：为什么要这个字段，因为制度要求留痕；为什么要这一级审批，因为内控规定。改系统等于改制度，光靠产品经理推不动，要拉制度 owner 进来。判断方法很简单：问一句「这是谁定的」。如果答不上来，说明这个约束可能是历史遗留，而不是现行制度——历史遗留是可以谈的，现行制度不能硬碰。"},{"u":"audio/geely/g_m1_6_5.m4a?v=2026110417","d":34.18,"t":"第三个特征，系统即制度载体。它承载的是「必须这样做」。这一条最反直觉：体验的天花板由制度决定，不由界面决定。你可以把界面做得再顺，如果制度要求三级审批，用户还是得等三天。所以职能域的产品经理，真正的高价值工作不是画原型，是参与制度设计——在制度定下来之前，把执行成本讲清楚。"},{"u":"audio/geely/g_m1_6_6.m4a?v=2026110417","d":30.67,"t":"把这三个特征合起来看，你会发现职能域的产品经理有个独特的优势：你能同时看到制度、流程和系统三件事，而业务部门只看得到自己那一段。这个视角就是你的价值。但前提是你得走出去，不能只坐在会议室里看流程图。流程图上写的是应该怎么走，工位上发生的才是实际怎么走。"},{"u":"audio/geely/g_m1_6_7.m4a?v=2026110417","d":57.7,"t":"把六类系统的体验关键展开说两句，你就明白为什么不能照搬。制造与质量类的系统，体验关键是「能离线」——车间里信号不好，班组长不可能为了填一条记录走到办公室，所以离线录入、断点续传是硬需求，不是加分项。供应链与采购类，体验关键是「时效」，因为它的下游是生产计划，晚一天就是停线风险，所以状态透明比界面美观重要得多。经销商与售后类，体验关键是「算得清」，因为门店顾问的收入跟返利挂钩，一个算不清的界面会直接引发投诉。你看，同样是「好用」，在不同类里指向完全不同的东西。"},{"u":"audio/geely/g_m1_6_8.m4a?v=2026110417","d":63.07,"t":"职能域的用户地图怎么画？一张纸就够。横轴画流程节点，从发起到结束，四到六段，比如申请、审核、审批、付款、归档。纵轴画四层角色：使用者、管理者、决策者、监管者。然后往格子里填人，填具体的岗位名，不填部门名。填完你会看到两件事：一是有些格子是空的，那是你还没覆盖到的人；二是有些人的名字出现在好几个格子里，那个人就是关键用户，他的诉求优先级最高。这张图的价值在于，它把「用户是谁」从一个抽象问题变成了一个可以逐格检查的清单。我建议每个项目开工第一周就画这张图，贴在墙上，后面每次需求评审都对着它看。"},{"u":"audio/geely/g_m1_6_9.m4a?v=2026110417","d":53.93,"t":"跨类迁移有三个陷阱，我提醒一下。第一个，把留存率搬到内部系统。车主 App 的留存是真信号，内部系统的留存没有意义，因为不用就没法交差。第二个，把满意度问卷直接搬过来。内部系统的满意度会被「怕被考核」严重污染，同一个人当面打八分，私下说「凑合用」。第三个，把净推荐值搬过来。内部系统没有「推荐给同事」这个场景，问了也白问。这三个指标不是不能用，是要换问法：留存换成绕行率，满意度换成求助工单量，推荐值换成「如果明天系统停用一天，你的工作受影响多大」。"},{"u":"audio/geely/g_m1_6_10.m4a?v=2026110417","d":47.59,"t":"这张地图有三个具体用途。第一个，立项时用它界定范围：这次改哪几个格子，不改哪几个，写进立项材料，避免后面无限扩张。第二个，排期时用它排序：同一个需求影响到几个格子，影响格子多的优先。第三个，汇报时用它讲故事：不说「我们优化了报销流程」，说「四位审核员每人每月省六个半小时，财务经理早一天看到月结数」。同样是汇报，后一种说法对方能记住，因为里面有具体的人和具体的数。"},{"u":"audio/geely/g_m1_6_11.m4a?v=2026110417","d":58.34,"t":"怎么判断自己负责的系统属于哪一类？三个问题。第一问，用户有没有选择权——可以不用吗？可以就会去别的地方，不可以就只能忍着。第二问，动机来自制度还是来自任务？制度驱动的系统，使用率不可信；任务驱动的系统，绕行率更能说明问题。第三问，失效的后果落在谁身上——落在业务上、落在合规上，还是落在某个人的考核上。这三个问题回答完，系统的类别就清楚了，方法也就知道该往哪边调。我建议你把这三个答案写进项目的背景页，每次评审前看一眼，防止不知不觉用了别类产品的方法。"},{"u":"audio/geely/g_m1_6_12.m4a?v=2026110417","d":40.54,"t":"这一节收一下。六类系统，用户结构完全不同，动机来源完全不同，照搬方法论就会失焦。职能域的三个特征是：用户即同事、需求即管理动作、系统即制度载体。这一节的任务：判断你负责的系统属于哪一类，然后写一句话——它的用户动机是自愿还是被迫。如果答案是「一半一半」，那说明你还没分清使用者和管理者，回到第四节再看一遍四层结构。"}],"g_m1_7":[{"u":"audio/geely/g_m1_7_0.m4a?v=2026110417","d":43.82,"t":"M1 到这里结束，最后两分钟说清楚后面怎么走。整门课八个模块，每个模块都有一件产出物，其中两件必须进作品集：M5 的需求鉴真表，和 M7 的用户旅程地图。这两件是认证的硬指标。M1 的产出物是场景还原五问卡，作为配套材料；M2 是深访提纲加观察记录表。学习节奏建议两周：第一周把 M1 到 M4 的内容过完，同时完成五问卡；第二周做 M5 到 M8，并动手写提纲、做观察。"},{"u":"audio/geely/g_m1_7_1.m4a?v=2026110417","d":44.09,"t":"把两周节奏说细一点，方便你安排。第一周：周一到周二看 M1，周三到周四看 M2，周五交五问卡和深访提纲初稿；第二周：周一到周二看 M3 和 M4，周三到周四做 M5 的需求鉴真表，周五做 M7 的旅程图。M6 和 M8 可以并行听，不占整块时间。三次提交节点分别是周五的五问卡、第二周周三的鉴真表、第二周周五的旅程图，后两件进作品集，直接用于认证评审。"},{"u":"audio/geely/g_m1_7_2.m4a?v=2026110417","d":40.06,"t":"为什么要强调产出物？因为这门课真正的交付不是「听完」，是那几张填满的表。你听完八个小时，能力模型上的分数不会动；你把五问卡和旅程图填出来，评审才有依据。所以每个模块结束时，我都会给你一个具体动作，不是「思考一下」，是「写出来发出去」。下一节进入 M2，讲怎么做定性研究——也就是怎么把五问卡里那些填不出来的格子，用一次访谈补上。"}],"g_m2_1":[{"u":"audio/geely/g_m2_1_0.m4a?v=2026110417","d":54.65,"t":"这一节讲定性研究的第一步，也是最容易被跳过的一步：把业务问题翻译成研究问题。很多同学拿到任务就去做访谈，提纲一列二十个问题，聊完写一份纪要，结论是「用户希望更简单」。问题出在最开始：题目本身不可研究，所以怎么问都问不出东西。这一节五分钟，我给你三样东西：不可研究题目的三个特征，一个改写公式，还有改写前后的对照。先说结论：能被观察到，才可能被研究；「他想要什么」不可观察，「他上一次做了什么」才是可观察的。这条判断会决定你后面所有访谈的成败。"},{"u":"audio/geely/g_m2_1_1.m4a?v=2026110417","d":62.95,"t":"先说不可研究的题目缺什么。第一个，缺角色。「用户觉得流程太麻烦」——哪个用户？一线还是审批人？这两拨人的麻烦根本不是一回事：一线嫌填得多，审批人嫌看不到关键信息。你把两拨人混在一个题目里，访谈的时候就会一会儿问这个、一会儿问那个，最后结论也混在一起。第二个，缺环节。「报销体验不好」——填报、审核、打款，哪一段？没有环节就没有观察点，你只能得到一句笼统的评价。第三个，缺缺失物。「希望系统更智能」——缺的是信息、是提醒、还是自动填？说不出缺失物，就设计不出方案，因为「更智能」这三个字后面可以接一百种做法。"},{"u":"audio/geely/g_m2_1_2.m4a?v=2026110417","d":60.24,"t":"所以改写公式是三段：谁，在哪一环，因为缺什么而放弃。注意是「而放弃」，不是「而不满」。放弃是可观察的行为终点，不满只是情绪。举例子：原题「财务觉得报销系统难用」，改写成「费用审核员在审核环节，因为看不到供应商历史付款记录，放弃核对，改为按月抽查」。你看，改写以后，观察点自动出来了：你要观察他审核时打开哪几个窗口、在哪一步停下、什么时候切到 Excel。提纲也有了落点：问最近一次审核，问那次他是怎么查历史的。这就是可研究题目的标准：一读就知道去哪看、问谁、问什么。"},{"u":"audio/geely/g_m2_1_3.m4a?v=2026110417","d":57.96,"t":"再补一个环节，容易被忽略：改写完的题目要让业务方确认一次。为什么？因为研究题目是你对业务问题的转译，转译就可能失真。具体做法是把改写后的那句话念给提需求的人听，问他一句：如果我去看这件事，是你想解决的问题吗？他如果说「不完全是，我更关心的是某某」，那你就拿到了更准的题目。这个动作只要五分钟，但能避免你做完两轮访谈才发现方向错了。另一个动作是给题目加一个「不研究什么」的清单——比如这次不研究审批链合理性，只研究审核环节的取数困难。写清边界，后面约人的时候就不会被拉进无关的讨论。"},{"u":"audio/geely/g_m2_1_4.m4a?v=2026110417","d":58.13,"t":"把四个动作再收一遍，方便你照着做。第一步，写下原始问题，把业务方原话照抄，不要先美化——「大家都说难用」这句话本身是重要信息，它说明业务方也没有具体事实。第二步，找角色，具体到岗位、职级、是否外包，一个角色一张提纲。第三步，切环节，把流程切成四到六段，指出问题落在哪一段。第四步，补缺失物，在这一段里他缺的是信息、权限、提醒，还是模板。四步走完，题目就变形了：从一个态度问题，变成一个可以观察的行为问题。这一节的任务：把你手上一个模糊的抱怨，按这个公式改写成一句话，然后问自己——如果这句话成立，我应该去哪看、问谁。"}],"g_m2_2":[{"u":"audio/geely/g_m2_2_0.m4a?v=2026110417","d":46.15,"t":"这一节讲抽样。听起来像统计学，其实在 B 端内部研究里，抽样是个人际问题：你能约到谁。最常见的失败是这样的：找了八个部门联络人，每个人都配合，都说「还行，就是有点慢」，你拿着这个结论去立项，被业务方一句「一线根本不这么想」打回来。问题不在访谈技巧，在样本结构——你访的这八个人，是最不可能抱怨的那八个人。这一节五分钟，讲清接口人偏差、四类样本，还有六到八人饱和怎么判断。"},{"u":"audio/geely/g_m2_2_1.m4a?v=2026110417","d":52.1,"t":"为什么接口人有偏差？三个原因。第一，他是指定联络人，通常是最熟悉系统、最配合工作的那个人，他已经适应了系统，问题在他这里被消化掉了——不是他不说，是他真的不觉得是问题。第二，他承担反馈职责，说的话会经过一次自我审查：哪些能说、哪些说了会给自己添麻烦。第三，他离实际操作用户有距离，一个部门的联络人往往自己不做那些琐碎动作，他听到的是二手信息。所以接口人不是不能访，是不能只访他。他的价值在于帮你找到后面那三类人，不在提供结论。"},{"u":"audio/geely/g_m2_2_2.m4a?v=2026110417","d":60.34,"t":"要覆盖四类样本。第一类，关键接口人，一到两人，作用是导航和给名单。第二类，极端用户，用得最多的人和完全不用的人。用得最多的人暴露效率瓶颈，因为他把每个环节都走遍了；完全不用的人暴露放弃原因，因为他已经绕开了。第三类，边缘用户：外包、兼职、跨基地、临退休。这一类人的权限和培训覆盖最薄弱，问题最集中，也最容易被抽样漏掉。第四类，放弃者：已经彻底绕行的人。他们不在系统里，你从系统名单上根本抽不到，只能靠观察和旁敲侧击找——问一句「这件事你们组谁还在用 Excel 做」，通常就能找到。"},{"u":"audio/geely/g_m2_2_3.m4a?v=2026110417","d":46.42,"t":"抽样不看人数，看是否覆盖了四种处境。具体做法是分层：同一角色下，按使用频次、权限范围、入职时长各取两人。这样六个人就能覆盖三组处境，比随机抽十个人有效得多。另一个硬要求：至少找到一个绕行者。找不到绕行者，说明你的样本仍然全部在系统内，你听到的会是同一个版本的真相。找到之后，不要问他「为什么不用的」，直接说「你演示一下现在你怎么做这件事」，让他一步步操作，你在旁边记。这个动作的信息密度，比一小时访谈还高。"},{"u":"audio/geely/g_m2_2_4.m4a?v=2026110417","d":45.02,"t":"最后补一个实操问题：名单怎么要。三个入口。第一个，系统后台的用户列表，按操作频次排序，取最高和最低各若干，这是最快找到极端用户的办法。第二个，部门联络人，让他给一份「这个流程谁最熟、谁最不熟」的名单，注意要两份，不要一份，因为熟了的人和生的人给出的信息完全不同。第三个，自己扫楼，在工位上问一句「这件事你们组一般谁弄」，往往能找到系统名单上没有的人，比如外包和兼职。"},{"u":"audio/geely/g_m2_2_5.m4a?v=2026110417","d":53.69,"t":"最后说饱和怎么判断。饱和不是访够八个人，是连续两到三个人不再带来新的问题类型。注意是「类型」，不是「细节」——细节永远会新增，类型会收敛。所以我建议你访谈时边访边归类：每访完一个人，把他的问题归到已有的类别里，或者新开一类。如果连续三个人都是往已有类别里填，可以停；如果每个人都能开出新类别，说明样本还不够，或者你的角色分层有问题。这一节的任务：为你的研究题目列一份六到八人的抽样名单，每人在后面标一个处境标签，然后检查一遍——四类样本里，你缺了哪一类。"}],"g_m2_3":[{"u":"audio/geely/g_m2_3_0.m4a?v=2026110417","d":45.5,"t":"这一节讲提纲怎么设计。先问一个问题：你为什么问不出真问题？很多人以为是技巧不够，其实是问法错了。你问「你觉得应该怎么改」，对方给你一个方案；你问「你觉得哪里不好用」，对方给你一个评价。方案和评价都不是事实，你拿它们做不了设计决策。事实只有一个来源：具体发生过的某一次。这一节七分钟，讲 BEI 的三段结构、五问追问法，还有四类必须从提纲里删掉的提问。这三样东西配齐，你的提纲就能用了。"},{"u":"audio/geely/g_m2_3_1.m4a?v=2026110417","d":58.25,"t":"BEI 是行为事件访谈，核心就一句：不问观点，问最近一次具体发生了什么。它有三段。第一段，情境：「上一次遇到这个问题是什么时候？当时你在做什么？」这一问锁定时间、地点、任务，把对方从抽象评价拉回具体场景。第二段，行为：「你当时第一步做了什么？然后呢？」只要动作，不要解释。他一旦开始解释「因为系统设计得不合理」，你就往回拉：「稍等，这一步你具体点了哪里？」第三段，结果：「最后这件事怎么解决的？花了多久？」这一问拿到代价和绕行路径，是整个访谈里信息量最大的部分。"},{"u":"audio/geely/g_m2_3_2.m4a?v=2026110417","d":46.85,"t":"BEI 有个常见错法：把三段问成了三段评价。比如对方说「系统太慢」，你接着问「你觉得慢在哪」，这就又回到观点了。正确接法是「最近一次觉得慢是哪天，当时在做什么，等了多久」。还有一个错法：只问情境不问结果。很多人聊得很投入，聊了四十分钟当时的场景，但没问最后怎么解决的、花了多久。结果你知道了问题，不知道代价，也就没法定价。所以我建议提纲里把「花了多久」「最后怎么弄成的」写成固定问题，每段都要问一遍。"},{"u":"audio/geely/g_m2_3_3.m4a?v=2026110417","d":50.42,"t":"再说五问追问法，这是把模糊回答挖到具体的五个句式。第一，「能举个最近的例子吗」——把评价拉回事件，对方说「经常出错」，你就问他上一次出错是哪天。第二，「当时你怎么做的」——拿到动作序列，特别注意系统外的动作，那是绕行的入口。第三，「为什么这么做」——拿到他的判断依据，往往就是需求的真实约束。第四，「后来怎么解决的」——拿到绕行路径与代价。第五，「还有别人也这样吗」——判断这是个体特例还是结构性问题，决定要不要扩大样本。这五句不用背，写在提纲最上面当提示，访谈中卡住就挑一句问。"},{"u":"audio/geely/g_m2_3_4.m4a?v=2026110417","d":48.48,"t":"四类提问必须从提纲里删掉。第一类，假设性问题：「如果系统能自动填，你会用吗？」所有人都说会用，这个答案没有信息量。第二类，引导性问题：「是不是因为字段太多所以慢？」你把答案写进问题里，对方只会点头。第三类，评价性问题：「你觉得这个功能好不好？」这是让人替你下结论。第四类，未来性问题：「你希望明年系统变成什么样？」人对未来的想象受限于他见过的系统，问出来的是他的想象力，不是他的需求。这四类删掉，提纲会短一半，信息量反而更大。"},{"u":"audio/geely/g_m2_3_5.m4a?v=2026110417","d":60.34,"t":"提纲写完之后要做一次预访谈，这一步绝大多数人会跳过，但它是性价比最高的一步。找一个关系好的同事，把提纲念一遍，限时三十分钟，让他随时打断说「这句我没听懂」。你会立刻发现三类问题：一是问题太长，一句话里套了三个问号，对方不知道该答哪个；二是术语太多，你用了「闭环」「拉通」「埋点」，他得先翻译再回答，思路就断了；三是顺序不顺，前面的问题把后面的答案带出来了，导致后面问不出东西。预访谈还有一个作用：让你熟悉自己的提纲，正式访谈时不用低头看纸，能一直看着对方的眼睛。低头看提纲的那几秒，往往就是对方说出关键信息的那几秒。"},{"u":"audio/geely/g_m2_3_6.m4a?v=2026110417","d":47.35,"t":"还有一种提纲结构值得试：把提纲做成「一次任务复盘」，而不是「一串问题」。开场就说：我们挑上周你做过的某一天，从早上第一件事讲到现在。然后顺着他的叙述走，在关键节点插追问。这样做的好处是，问题不再是孤立的，而是嵌在一条时间线里，你能看到因果顺序：因为系统里查不到，所以他先问了同事，所以晚了半小时。因果顺序是设计决策最需要的原料，而一串孤立问题永远拼不出因果。代价是主持难度更高，你要不停判断「现在该不该打断」，建议先用两三次访谈练手。"},{"u":"audio/geely/g_m2_3_7.m4a?v=2026110417","d":58.92,"t":"最后说提纲的整体结构，七分钟能讲完的部分。一次九十分钟的深访，我建议这样排：前十分钟破冰和背景，不问系统；中间五十分钟走 BEI，挑两到三个最近发生的事件，每个事件把情境、行为、结果问完整；接着十五分钟问绕行和替代方案，让他演示现在怎么做；最后十分钟做复述校验和补充。提纲上写的问题不要超过十五个，每个问题下面列三到五个追问句式。问题多了你会赶进度，赶进度就问不出细节。这一节的任务：写一份十到十二个主问题的提纲，每个主问题下面配三个追问，然后自己念一遍，把属于那四类的全删掉。"}],"g_m2_4":[{"u":"audio/geely/g_m2_4_0.m4a?v=2026110417","d":38.9,"t":"这一节讲执行。提纲写好了，访谈还是可能失败，因为内部访谈最大的阻力不是时间，是「他怕你在考核他」。这个担心不解决，你问什么都是「挺好的」。这一节七分钟，四个动作：破冰、前十分钟、沉默五秒、当场复述；再加上三类现场反应的处理办法。先说一句结论：访谈不是聊天，是有一张清单要拿满。你可以聊得很愉快，但清单没拿满，这次访谈就是失败的。"},{"u":"audio/geely/g_m2_4_1.m4a?v=2026110417","d":52.75,"t":"先说破冰。破冰的目的不是拉近关系，是消除考核感。所以开场三十秒必须说清三件事：这次不是评估你的工作；我要了解的是系统哪里给你添了麻烦；问题会匿名汇总，不会追溯到个人。这三句话要说得具体，不能只说「你放心」。更好的做法是给一个承诺加一个动作：承诺「我整理完会先把结论发你看一遍，有不准确的地方你直接改」，动作是「今天我不做记录表，只记要点」。内部访谈里，愿意给你真话的人不多，你每失去一个，就少一个后续可以回访的人。"},{"u":"audio/geely/g_m2_4_2.m4a?v=2026110417","d":54.91,"t":"第二个动作，前十分钟不问系统。先聊他一天怎么过、什么时候最忙、这个月最烦的一件事是什么。目的是让他进入叙述状态。人一开始讲自己的日常，语速会变、细节会多，这个时候你再问系统，他给的就是场景不是评价。第三个动作，沉默五秒。对方说完停住的时候，不要急着接话、不要急着点头总结。五秒的空白很难熬，但往往就是这五秒，换来最关键的那句补充——「其实还有个事」。我建议你在提纲上写一句提醒：停住就数五秒。这个技巧没有成本，效果比任何追问句式都好。"},{"u":"audio/geely/g_m2_4_3.m4a?v=2026110417","d":46.92,"t":"第四个动作，当场复述。访谈进行到一半和结束时，各做一次。句式是：「我复述一遍，你看我理解得对不对——你每月初要花两天做这件事，因为系统里查不到历史数据，所以你自己维护了一个台账，对吗？」让对方纠错。复述有三个作用：确认事实、暴露你自己的理解偏差、让对方感觉被听懂从而愿意多说。注意复述要具体到数字和时间，不要说「你觉得这个流程很麻烦，我理解得对吗」，那不是复述，是共鸣。"},{"u":"audio/geely/g_m2_4_4.m4a?v=2026110417","d":63.84,"t":"再说三类现场反应怎么处理。第一类，对方开始给方案。比如他说「你们应该做个批量导入」。别急着记，也别否定，先接住再还原：「这个思路我记下了。你说的这个问题，最近一次发生是什么时候？」把方案当作线索，顺着它回到事件。第二类，对方只说「都挺好」。换问法，用对比逼出问题：「有没有哪次你干脆在 Excel 里做了？」「最麻烦的一次是什么情况？」「如果明天系统停用一天，你的工作会受多大影响？」这三个问法比「哪里不好用」有效得多。第三类，对方开始抱怨人。把话题拉回系统和流程：「这件事在系统里是怎么走的？」人的问题另外记，但不要在现场附和，附和会让你后面的话都变成站队。"},{"u":"audio/geely/g_m2_4_5.m4a?v=2026110417","d":68.09,"t":"访谈结束后，整理稿怎么写，这一步决定了研究能不能复用。我建议三栏：事实、原话、判断。事实栏写发生了什么，比如「九月三日上午，他处理了十一单，退回四单，退单原因都是附件不全」。原话栏照抄关键句，比如「这个我得先看群里有没有人发过」。判断栏写你的推断，并且一定要标注「推断」，比如「推断：退单主因是附件规范没有前置告知」。三栏分开的好处是，事实和原话可以直接进报告、可以被别人复核，判断一旦被证伪，是正常的认知修正，不会变成你的失误。另外建议访谈后立刻约一次十五分钟的二次确认，只问两个问题：我理解得对吗，有没有漏掉的重要情况。这十五分钟经常能拿到最有价值的一句话。"},{"u":"audio/geely/g_m2_4_6.m4a?v=2026110417","d":51.65,"t":"再补一个执行细节：怎么处理对方的时间压力。内部访谈最常见的失败是「我只有二十分钟」。遇到这种情况，不要试图压缩九十分钟的提纲，直接改成「只问一个事件」：挑最近一次最麻烦的事，把情境、行为、结果走完，正好二十分钟。二十分钟拿一个完整事件，比四十分钟拿五个半截回答有用得多。走之前补一句：这次先到这，下次你方便的时候我想再看看另一次的情况。愿意让你再来的比例很高，因为第一次你守时、不啰嗦，他就知道你不会浪费他的时间。"},{"u":"audio/geely/g_m2_4_7.m4a?v=2026110417","d":52.75,"t":"最后说两件容易被忽略的事：录音和合规。录音一定要先问，说清用途和保存期限，对方不同意就用笔记，不要偷偷录——内部访谈被发现一次，你在整个部门都约不到人了。同意录音的，也要在访谈结束后四十八小时内整理完，超过这个时间细节会失真。整理时按「事实、原话、你的判断」三栏分开写，事实和原话可以直接进报告，判断要标注是你自己的推断。这一节的任务：按这四个动作，去做一次六十分钟的访谈，录音前问一句，结束时复述一次，然后把整理稿按三栏写出来。"}],"g_m2_5":[{"u":"audio/geely/g_m2_5_0.m4a?v=2026110417","d":35.76,"t":"这一节讲焦点小组。很多人对它有两种极端态度：一种是特别喜欢，觉得一次能听八个人，效率高；另一种是完全不用，觉得群体压力下听不到真话。两种都不对。焦点小组有它明确的适用边界，用对了很省时间，用错了会给你一个集体幻觉。这一节五分钟，讲清三件：它擅长什么、什么情况下一定不能用、主持人要做的三个控场动作。"},{"u":"audio/geely/g_m2_5_1.m4a?v=2026110417","d":61.03,"t":"焦点小组擅长三件事。第一，探索一个群体对某类问题的共同认知边界。比如你想知道「状态不透明」在大家嘴里到底指什么，八个人一起聊，会把这个词的边界撑开：有人指审批到哪一步不知道，有人指对方有没有看过，有人指时间预估。这种语义的展开，一对一访谈效率很低，群体讨论反而快。第二，快速收敛选项。当备选方案有六个以上，用它淘汰明显不被接受的，比做六次访谈省事。第三，跨部门对齐认知。让财务、采购、IT 坐在一间屋子里，彼此听见对方的约束——这个价值不在于你收集到了什么，而在于他们互相听见了什么，很多争议当场就消了。"},{"u":"audio/geely/g_m2_5_2.m4a?v=2026110417","d":56.83,"t":"但这三种情况一定不能用。第一，挖掘个人真实做法。群体压力会让「绕行」这类行为消失：没人会在一屋子同事面前说「我一直在用 Excel 偷偷做」。你要研究真实行为，必须一对一，而且要在他工位旁边。第二，同部门同层级同坐。这一条最容易被忽略：同一部门同一层级的人坐在一起，谁职级低谁闭嘴；跨层级坐在一起，就变成汇报会，大家开始说正确的废话。第三，涉及考核与责任的话题。没人会当面说自己填错过、没人会当面说某个流程是他拖的。这类话题只能单独问，而且要承诺匿名。"},{"u":"audio/geely/g_m2_5_3.m4a?v=2026110417","d":56.98,"t":"主持人要做的三个动作，目的都是让沉默的人说话，不是让会议顺利。第一个，先写后说：开场五分钟，让每个人各自写下三条，再轮流念。这个动作能避免第一个发言者定调——一旦有人先说「我觉得还行」，后面的人就会沿着「还行」往下说。第二个，点名沉默者：不要问「你有什么意见」，那等于给他压力；用动作召唤：「刚才你点了下头，你是怎么看的？」第三个，压住强势者：「这个观点我先记下，想听听其他人有没有不同的做法。」注意是「不同的做法」，不是「不同的意见」，前者要事实，后者要立场。"},{"u":"audio/geely/g_m2_5_4.m4a?v=2026110417","d":49.46,"t":"再补一句焦点小组的产出形式。它不该产出「结论」，它产出的是「议题清单」和「分歧地图」。议题清单是大家共同关心的三到五件事，按被提及的频次排；分歧地图是哪些问题上大家意见分裂，分裂在哪一层。这两样东西的价值在于，它们告诉你接下来该一对一去问谁、问什么。所以焦点小组应该是研究的前半段，不是后半段——先开小组把议题铺开，再一对一挖细节，最后再开一次小组验证结论。反过来做，先一对一再开小组，你会发现小组开完什么都没增加。"},{"u":"audio/geely/g_m2_5_5.m4a?v=2026110417","d":53.98,"t":"再补两个操作细节。人数控制在六到八人，少于六人讨论不开，多于八人一定会分成小团体私聊。时长控制在九十分钟以内，超过这个时间注意力会掉，后半段的发言质量明显下降。另外一定要有一个记录员，主持人不能自己记——一低头记笔记，控场就断了。记录员记三样：谁说的、说的是什么事实、有没有人反对。这一节的任务：判断你手上的研究题目，属于焦点小组能用的还是不能用的；如果能用，写出三个议题和三个控场动作；如果不能，说明理由，改成一对一方案。"}],"g_m2_6":[{"u":"audio/geely/g_m2_6_0.m4a?v=2026110417","d":47.83,"t":"这一节讲现场观察。我先说一句可能不太好听的话：访谈里拿到的是「他记得的自己」，观察里拿到的是「他实际做的」。这两者经常不一致，而且不一致的地方，往往就是需求的真正入口。有个典型案例：访谈时审核员说「系统挺好，就是慢一点」；跟班半天发现，他每单要切换七次窗口，其中三次是去查系统里查不到的数据，而他根本没把这件事当成「系统的问题」，因为三年来一直这样。这一节七分钟，讲记录什么、不记录什么、记录表怎么设计、跟班怎么选时段。"},{"u":"audio/geely/g_m2_6_1.m4a?v=2026110417","d":58.68,"t":"先说记录什么：只记录可数的行为，不记录评价。「他看起来很烦躁」不是证据，「他在十分钟内切换了七次窗口」才是。具体三类。第一类，打断：每被打断一次记一笔，并记下来源——电话、同事、系统弹窗、领导。打断的次数决定了这个人能不能连续工作，而连续性是效率的前提。第二类，绕行：什么时候打开 Excel、什么时候发微信、什么时候打印。每一次绕行都是一处断点，把断点连起来，就是系统的真实短板。第三类，口头禅：「这个我得先问问」「等会儿再弄」「这个不准」——口头禅指向流程里的不确定处，是访谈里问不出来的东西。"},{"u":"audio/geely/g_m2_6_2.m4a?v=2026110417","d":45.62,"t":"不记录什么也要说清楚。不要写「态度不好」「不熟练」「不配合」这类评价性描述。原因有两个：一是评价无法复盘，你拿着「不熟练」这三个字，设计师不知道要改什么；二是评价会污染你的判断，一旦你在记录里写了「他不熟练」，后面所有观察都会被这个结论解释。如果确实要记能力问题，改成行为描述：不写「不熟练」，写「在第三步停留了两分十五秒，期间三次回到上一步」。行为描述可以被验证，评价不能。"},{"u":"audio/geely/g_m2_6_3.m4a?v=2026110417","d":61.22,"t":"观察记录表三列就够，但要连续记。第一列时间，精确到分钟；第二列他在做什么，写动作，不写目的；第三列打断或绕行。举个真实片段的写法：九点十二分，打开待办，逐条浏览十四条，电话打断一次；九点二十分，打开发票附件，与单据逐项核对，系统弹窗提醒两次；九点三十四分，切到 Excel 台账查该供应商历史付款，绕行，系统内查不到；九点五十一分，退回一单，填写退回原因自由文本；十点零五分，在群里问采购员合同编号，绕行，跨系统取数。这样记一天，你手上就是一张真实的流程图，比任何流程文档都准。"},{"u":"audio/geely/g_m2_6_4.m4a?v=2026110417","d":42.43,"t":"跟班怎么选时段？三个原则。第一，覆盖忙时，不要只选闲时。月结、季末、月初、周五下午，这些是问题集中爆发的时候，也是最容易约不到人的时候，但你必须去。第二，至少连续两小时。半小时只能看到片段，两小时才能看到一次完整的任务闭环，包括打断、绕行、求助、完成。第三，至少两个人，而且要有一个人是边缘用户——外包或者兼职，他们的操作路径往往比正式员工更绕。"},{"u":"audio/geely/g_m2_6_5.m4a?v=2026110417","d":56.38,"t":"再补两件观察时容易踩坑的事。第一件，怎么跟对方说。不要一上来就说「我要研究你」，那会让他全程表演。说清三件事就好：我是做系统改进的，想看看实际怎么用；今天不影响你工作，你按平时节奏来；有不对的地方我记下来，不会说是你的问题。说完加一句：如果你觉得我妨碍你了，随时让我出去。这句话会显著降低他的紧张感。第二件，不要在现场提问。看到他在 Excel 里做，忍住，不要问「为什么不用系统」。一问就变成访谈，人就进入解释状态，真实行为就消失了。记下来，等结束后一起问。"},{"u":"audio/geely/g_m2_6_6.m4a?v=2026110417","d":55.85,"t":"观察结果怎么用？三个动作。第一个，把断点标到流程图上。你手上一定有一张流程文档，把观察到的绕行点、打断点标上去，你会发现它们集中在两三个位置，那些位置就是真正的设计机会。第二个，把一天的记录折算成时间账：审核八小时里，有多少时间在做系统内动作，多少在等，多少在跨系统找数据。这个比例通常很惊人，我见过系统内动作只占四成的。第三个，把三到五个人的记录并排放，看重复出现的模式。一个人身上的问题是个案，三个人身上都出现就是结构问题。"},{"u":"audio/geely/g_m2_6_7.m4a?v=2026110417","d":61.25,"t":"观察还有两个技巧。第一个，影子跟随：不说话，坐在他侧后方，看屏幕但不要盯着看，让他慢慢忘记你在。开口的时机只有一个——他主动问你。第二个，工作日志：如果没法长时间跟班，就让他连续记三天日志，每小时一行，写做了什么、卡在哪。日志的准确度不如观察，但覆盖面更广，而且能拿到非工作日的状态。观察结束后立刻做两件事：当天补齐记录（隔天细节会丢一半），把断点标在流程图对应的位置上。这一节的任务：选一个人跟班两小时，用三列表记满，然后数出打断次数和绕行次数。这两个数，就是你下一次评审会上的开场。"}],"g_m2_7":[{"u":"audio/geely/g_m2_7_0.m4a?v=2026110417","d":46.1,"t":"这一节是 M2 的重点，九分钟，讲一件事：把 C 端的用户研究方法直接搬到内部系统，哪里会失效。在场很多同学是从消费端产品转过来的，或者同时在做两端，方法拿过来就用，结果发现访谈没人说实话、样本约不到、结论推不动。这不是能力问题，是两端的研究对象性质不同。这一节我给你五处差异，逐条讲清楚每一处该怎么改，再加三条 B 端的取材原则。先说结论：方法是同一套，取材方式完全不同。"},{"u":"audio/geely/g_m2_7_1.m4a?v=2026110417","d":64.56,"t":"第一处差异，样本可得性。C 端是公开招募，量大，可以按条件筛选，一份问卷能回收几百份，访谈能约到陌生人。B 端不行，B 端要一层层约：先找业务方对接人，对接人再找部门联络人，联络人再找具体的人，每一层都可能卡住。所以 B 端的研究计划里，约人的时间要按周算，不是按天算，而且要在计划里写清每一层找谁。第二处差异，表达意愿。C 端用户有动力吐槽，也可能为了奖励说好话，但总体愿意表达。B 端用户怕被考核，倾向说「挺好」，而且要给你留面子——你们明天还要开会。所以 B 端要用更硬的取证方式：不问评价问事件，不靠访谈靠观察，不靠自述靠日志。"},{"u":"audio/geely/g_m2_7_2.m4a?v=2026110417","d":41.9,"t":"第三处差异，场景边界。C 端的场景由物理位置决定：在地铁上、在家里、在店里，不同位置行为差别很大，所以研究要覆盖场景。B 端的场景由流程节点决定：工位上、会议中、车间现场、月末关账日。同一个人在关账日和平时完全是两个用户，所以 B 端研究要覆盖的是流程节点，不是地理位置。这一条直接决定你什么时候去观察：要选忙时，不要选闲时，忙时才暴露真实的取舍。"},{"u":"audio/geely/g_m2_7_3.m4a?v=2026110417","d":45.0,"t":"第四处差异，决策链。C 端的链路很短：产品经理对用户。B 端有四层：使用者、管理者、决策者、监管者，每一层的诉求不同，而且互相否决。所以 B 端的研究结论不能只给出一份「用户想要什么」，要给出「四层各要什么、冲突在哪、怎么裁决」。这一点在 M1 第四节讲过四层结构，这里补一句操作层面的：研究阶段就要分层抽样，不要研究完再补，补不出来——因为不同层的人说的根本不是同一件事。"},{"u":"audio/geely/g_m2_7_4.m4a?v=2026110417","d":41.23,"t":"第五处差异，采信标准。C 端的结论靠数据增长采信：留存、转化、复购。B 端的结论靠两件事采信：能不能说服业务方，能不能说服制度 owner。这意味着你在写报告的时候，要写两套话：一套是给业务方看的场景与代价，一套是给制度 owner 看的合规与留痕。只写一套，你的报告会在另一个会上被否掉。这也是为什么职能域的产品经理必须懂制度——不懂制度，你的研究结论落不了地。"},{"u":"audio/geely/g_m2_7_5.m4a?v=2026110417","d":47.57,"t":"基于这五处差异，B 端有三条取材原则。第一条，走出去：坐在他工位旁边看半天，比发一次问卷有效。建议每月固定半天驻场，不要等项目立项才去。第二条，找绕行：真实的约束藏在 Excel 和微信里，不在工单里。工单只记录已经进入系统的问题，绕行记录的是被系统挡在门外的问题。第三条，拿代价：不问「烦不烦」，问「这件事花了你多久、多久做一次」。烦不烦是感受，会随心情变；多久一次、每次多久，是事实，可以累加，可以进汇报。"},{"u":"audio/geely/g_m2_7_6.m4a?v=2026110417","d":58.39,"t":"对从消费端转过来的同学，我再给两条转型建议。第一条，先改自己的取证习惯，再改方法。C 端你习惯了看数据、看漏斗，这一套在 B 端仍然有用，但它只能回答「有多少」，回答不了「为什么」。所以你每周要留出半天做不带目的的观察，不设提纲、不写报告，就是坐着看。这个习惯养三个月，你对职能场景的直觉会明显不同。第二条，学一点制度语言。B 端的需求背后往往是一条制度，你能看懂制度文件，就能提前判断哪些约束是硬的、哪些是历史遗留。这两条都不在方法论书里，但它们是迁移的关键。"},{"u":"audio/geely/g_m2_7_7.m4a?v=2026110417","d":63.84,"t":"再说组织层面怎么让研究被采信，这也是 B 端的特殊难题。C 端的研究结论对产品团队负责，B 端的研究结论要过三道关：业务方、制度 owner、IT 排期。所以研究计划一开始就要设计「采信路径」：每一轮研究的结论，先给谁看、在什么会上看、他可能会拿什么理由反对、我准备什么证据回应。我建议做一张一页纸的结论卡：左边写结论和强度分级，右边写证据来源和反例，底下写这个结论影响哪个决策。这张卡不要超过一页，因为多数会上你只有五分钟。还有一个小技巧：把业务方拉进研究过程，让他参加一次访谈或一次跟班。他亲耳听到的东西，比你的报告有说服力得多。"},{"u":"audio/geely/g_m2_7_8.m4a?v=2026110417","d":54.89,"t":"还有一个常被忽略的差异：反馈的时效。C 端产品今天上线，明天就能看到数据变化；B 端系统改一个流程，要等一个业务周期才能验证，月结类系统甚至要等一个月。这意味着 B 端的研究不能一次做完就结束，要设计「研究—上线—再研究」的循环。我建议每个改动上线后固定做一次回访，问三个问题：这个改动你用上了吗；有没有带来新的麻烦；有没有因此改掉某个绕行习惯。第三个问题最重要，因为它直接反映行为是否真的变了。行为没变，指标改善就是假的。"},{"u":"audio/geely/g_m2_7_9.m4a?v=2026110417","d":47.14,"t":"最后说哪些可以照搬，别把自己吓住。C 端的用户旅程地图、痛点排序、同理心地图、访谈技巧，这些都可以直接用，方法层面没有差别。不能直接搬的是三样：样本获取方式、指标的解读、结论的采信路径。把这三样替换掉，剩下的都可以复用。这一节的任务：拿你现在做的一个 B 端研究，按这五处差异逐条对照，写一行——这一处我原来是照 C 端做的，现在要改做什么。五条都写出来的，你下一轮研究计划就不会跑偏。"}],"g_m2_8":[{"u":"audio/geely/g_m2_8_0.m4a?v=2026110417","d":42.6,"t":"M2 最后一节，讲结论的可信度。这一节要解决的问题很具体：「用户都说要这个功能」这句话，什么时候能信？很多项目就败在这一步——研究做了，结论写了，立项也过了，做完发现没人用。回头看，当时的结论只有访谈一个来源，而且访谈对象还都是接口人。这一节五分钟，三件事：三角验证、反例搜寻、结论强度分级。这三件事做完，你的结论才能写进需求文档。"},{"u":"audio/geely/g_m2_8_1.m4a?v=2026110417","d":54.0,"t":"第一件，三角验证。我有一个说法：一个来源是故事，两个来源是线索，三个来源才敢写进需求文档。三个来源指的是访谈、观察、文档或日志。比如「审核员看不到历史付款记录」，访谈里他说了，这是一；你观察到他切到 Excel 台账，这是二；系统日志里能看到他在审核页平均停留四分半、并频繁切换到另一个系统，这是三。三个来源指向同一结论，这个结论可以立项。只有访谈的结论先别写，因为访谈得到的是他的叙述，不是他的行为，两者之间的差距经常是决定性的。"},{"u":"audio/geely/g_m2_8_2.m4a?v=2026110417","d":53.04,"t":"第二件，反例搜寻。做法是主动找两到三个不符合结论的人，问他们为什么不同。注意，是主动找，不是碰运气。比如你得出「大家都需要批量导入」这个结论，就去问那个从来不用批量功能的人：他为什么不用？可能是他的单量少，可能是他的单据类型不统一，也可能是他根本不知道有这个功能。三种原因对应三种不同的结论：前者说明这个需求有边界，中者说明要先解决数据规范，后者说明是推广问题不是产品问题。找不到反例再下结论；找到了反例，结论就要加限定条件。"},{"u":"audio/geely/g_m2_8_3.m4a?v=2026110417","d":49.01,"t":"第三件，强度分级。我建议所有结论都用三档表述：普遍、多见于、个别。「普遍」的条件是多数样本加多来源，可以直接写进立项材料；「多见于」的条件是多来源但样本少，可以写，但要注明样本量；「个别」只有个案，只能作为线索，不能作为立项依据。这个分级的价值不在于学术严谨，在于保护你自己：你写「个别用户反馈」，后面被证伪了，是正常的；你写「用户普遍认为」，被证伪了，是你的判断失误。"},{"u":"audio/geely/g_m2_8_4.m4a?v=2026110417","d":49.42,"t":"最后补一下结论怎么写成一页纸，这是 M2 的交付形态。一页纸分四块。第一块，研究问题，一句话，就是那个改写后的题目。第二块，结论三到五条，每条后面标强度分级和来源数量，比如「审核环节取数困难，来源三个，普遍」。第三块，反例与边界，写清什么情况下结论不成立。第四块，对设计的含义，每条结论对应一个设计动作建议。四块填满，这张纸可以直接进需求评审。如果某个结论填不满四块，说明它还没到能用的程度，放回研究清单继续。"},{"u":"audio/geely/g_m2_8_5.m4a?v=2026110417","d":55.9,"t":"最后把 M2 收一下。这一模块的逻辑是一条线：先把业务问题改写成可研究的问题，再抽到对的人，然后用 BEI 和追问拿到事件，执行时消除考核感，需要群体视角时用焦点小组，需要真实行为时去现场观察，最后用三角验证和反例把结论坐实。这一节的任务：把你手上一个已有结论，标注它有几个来源、找过几个反例、属于哪一档强度。如果只有一个来源，回去补观察；如果没找过反例，找两个不同意见的人聊二十分钟。下一模块 M3 讲定量方法，解决的是「有多少人这样」的问题。"}]};

function stageFit() {
  var st = document.getElementById('p-stage'), cv = document.getElementById('p-canvas');
  if (!st || !cv) return;

  cv.style.transform = 'scale(' + k + ')';

/* ---------- 字幕切分：按标点切 ≤22 字短语，只显示一行 ---------- */
function capChunks(txt) {
  var parts = [], last = 0, m, re = /[。！？；，、：\n]/g;
  while ((m = re.exec(txt))) { parts.push([last, m.index + 1]); last = m.index + 1; }
  if (last < txt.length) parts.push([last, txt.length]);
  var out = [], buf = '', from = -1, to = 0;
  parts.forEach(function (p) {
    var t = txt.slice(p[0], p[1]).replace(/\s+/g, '').trim();
    if (!t) return;
    if (buf && (buf.length + t.length) > 22) { out.push({ s: buf, to: to }); buf = t; from = p[0]; to = p[1]; }
    else { if (!buf) from = p[0]; buf += t; to = p[1]; }
  });
  if (buf) out.push({ s: buf, to: to });
  return out;
}

/* ---------- 高亮：把 data-k 对到旁白里的位置，转成 0–1 进度 ---------- */
function stageArm(i) {
  STAGE.hlEls = []; STAGE.hlAt = [];
  var arr = (window.SLIDES && window.SLIDES[STAGE.uid]) || [];
  var sl = arr[i] || null;
  var seg = (window.NARR && window.NARR[STAGE.uid] || [])[i] || {};
  var n = String(seg.t || '');
  STAGE.capTxt = n;
  STAGE.caps = capChunks(n);
  /* 字幕时间轴：按字数占比分配（语速近似均匀） */
  var totCh = STAGE.caps.reduce(function (a, c) { return a + c.s.length; }, 0) || 1;
  var acc = 0;
  STAGE.capAt = STAGE.caps.map(function (c) { var v = acc / totCh; acc += c.s.length; return v; });

  var cv = document.getElementById('p-canvas');
  if (!cv || !n) return;
  var nodes = [].slice.call(cv.querySelectorAll('[data-k]'));
  if (!nodes.length) return;
  var cjk = function (t) { return String(t).replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, ''); };

  /* 每个 key 在旁白里的字符位置；找不到就取「最长公共片段」的起点，再不行均分 */
  var pos = nodes.map(function (el) {
    var key = cjk(el.getAttribute('data-k'));
    if (!key) return -1;
    var at = cjk(n).indexOf(key);
    if (at >= 0) return at;
    /* 退化：取 key 前 4 字在原文里找；再不行用二分词频匹配 */
    for (var L = Math.min(key.length, 6); L >= 3; L--) {
      var sub = key.slice(0, L);
      at = cjk(n).indexOf(sub);
      if (at >= 0) return at + (key.length - L) * 0.0;
    }
    return -1;
  });
  var known = [];
  pos.forEach(function (p, x) { if (p >= 0) known.push(x); });
  var endAt = Math.max(1, n.length);
  STAGE.hlAt = nodes.map(function (el, x) {
    var p = pos[x];
    if (p < 0) {
      var prev = known.filter(function (y) { return y < x; }).pop();
      var next = null;
      for (var y = 0; y < known.length; y++) { if (known[y] > x) { next = known[y]; break; } }
      if (prev !== undefined && next !== null) p = pos[prev] + (pos[next] - pos[prev]) * (x - prev) / (next - prev);
      else if (prev !== undefined) p = pos[prev] + (endAt - pos[prev]) * (x - prev) / Math.max(1, nodes.length - prev);
      else if (next !== null) p = Math.max(0, pos[next] - (next - x) * Math.max(8, pos[next] / Math.max(1, next)));
      else p = endAt * x / Math.max(1, nodes.length + 1);
    }
    return p / endAt;
  });
  for (var z = 1; z < STAGE.hlAt.length; z++) {
    if (STAGE.hlAt[z] < STAGE.hlAt[z - 1]) STAGE.hlAt[z] = STAGE.hlAt[z - 1];
  }
  STAGE.hlEls = nodes;
  nodes.forEach(function (el) { el.classList.add('kk'); });
}

/* ---------- 每帧：字幕 + 高亮 ---------- */
function stageSync(frac) {
  var st = document.getElementById('p-stage');
  if (st && frac > 0.004 && !st.classList.contains('hl')) st.classList.add('hl');
  var sub = document.getElementById('pl-sub');
  if (sub && STAGE.caps.length) {
    var idx = 0;
    for (var i = 0; i < STAGE.capAt.length; i++) { if (frac >= STAGE.capAt[i] - 1e-6) idx = i; }
    var txt = STAGE.caps[idx] ? STAGE.caps[idx].s : '';
    if (sub.textContent !== txt) sub.textContent = txt;
  }
  if (!STAGE.hlEls.length) return;
  var on = -1;
  for (var j = 0; j < STAGE.hlAt.length; j++) { if (frac >= STAGE.hlAt[j]) on = j; }
  if (on === STAGE._lastHl) return;
  STAGE._lastHl = on;
  STAGE.hlEls.forEach(function (el, x) { el.classList.toggle('on', x <= on); });
}

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function fmtDate(iso){if(!iso)return '—';var d=new Date(iso);if(isNaN(d))return '—';

/* 简易哈希（内训场景；不可逆，加盐） */
function hash(pwd,salt){
  var s=salt+'|'+pwd+'|gel-geely';
  var h1=0x811c9dc5,h2=0x01000193;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    h1^=c; h1=(h1*16777619)>>>0;
    h2=(h2+c*(i+7))>>>0; h2=((h2<<5)|(h2>>>27))>>>0;
  }
  return ('00000000'+h1.toString(16)).slice(-8)+('00000000'+h2.toString(16)).slice(-8);
}
function mkSalt(){var a='abcdefghijkmnpqrstuvwxyz23456789',s='';for(var i=0;i<12;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}

  },
  async upsert(table,rows){

/* ---------- 进度 ---------- */
var Prog={
  key:function(mk,n){return mk+'__s'+n;},
  get:function(mk,n){var m=lsGet('prog',{});return m[this.key(mk,n)]||null;},
  all:function(){return lsGet('prog',{});},
  set:function(mk,n,st,extra){
    var m=lsGet('prog',{});var k=this.key(mk,n);
    var cur=m[k]||{status:'none',seconds:0,visits:0};
    cur.status=st; cur.visits=(cur.visits||0)+1; cur.updatedAt=nowISO();
    if(extra)Object.assign(cur,extra);
    m[k]=cur; lsSet('prog',m);
    if(Me&&Me.role==='student')Cloud.upsert('gel_progress',[{id:Me.id+'__'+k,
      doc:{userId:Me.id,course:mk,unitId:k,status:st,seconds:cur.seconds||0,visits:cur.visits,
        quiz:cur.quiz||null,updatedAt:cur.updatedAt}}]).catch(function(){});
  },
  // 累计有效收听时长（只计真实播放推进，拖动不计）
  addHeard:function(mk,n,delta){
    if(!(delta>0))return;
    var m=lsGet('prog',{}),k=this.key(mk,n);
    var cur=m[k]||{status:'reading',seconds:0,visits:0,heard:0};
    cur.heard=(cur.heard||0)+delta; cur.updatedAt=nowISO();
    var uid=Pl.uid&&Pl.segs?Pl.uid:null;
    var full=uid&&window.NARR[uid]?window.NARR[uid].reduce(function(a,x){return a+x.d;},0):0;
    if(full>0&&cur.heard/full>=0.8&&cur.status!=='quizzed')cur.status='done';
    if(cur.status==='none')cur.status='reading';
    m[k]=cur;lsSet('prog',m);
    this._acc=(this._acc||0)+delta;
    if(this._acc>=20){this._acc=0;this.set(mk,n,cur.status,{heard:Math.round(cur.heard)});}
  },
  heardOf:function(mk,n){
    var p=this.get(mk,n);return (p&&p.heard)||0;
  },
  moduleDone:function(mk,total){var c=0;
    for(var i=1;i<=total;i++){ if(this.doneOf(mk,i)) c++; }
    return c;},
  /* ---- 逐步解锁 ----
     一节算完成 = 视频听完(≥80%) 且 节测过关(≥3/5)
     一章算完成 = 章末的章节测评过关(≥6/10)，过关后才开下一章第 1 节 */
  seq:function(){
    var out=[];
    MODS.forEach(function(m){
      m.sections.forEach(function(s){out.push({mk:m.key,n:s.n});});
      out.push({mk:m.key,n:0,chap:true});
    });
    return out;
  },
  heardPct:function(mk,n){
    var mm=modByKey(mk),p=this.get(mk,n);
    if(p&&(p.status==='done'||p.status==='quizzed'))return 100;
    var segs=(window.NARR||{})['g_m'+(mm?mm.no:1)+'_'+n]||[];
    var full=segs.reduce(function(a,x){return a+x.d;},0);
    if(!full)return 0;
    return Math.min(100,Math.round(((p&&p.heard)||0)/full*100));
  },
  heardOk:function(mk,n){ return this.heardPct(mk,n)>=80; },
  quizOk:function(mk,n){
    var p=this.get(mk,n);
    return !!(p&&p.quiz&&(p.quiz.best||0)>=PQ_PASS);
  },
  chapStat:function(mk){ return lsGet('chap',{})[mk]||null; },
  chapOk:function(mk){ var c=this.chapStat(mk); return !!(c&&(c.best||0)>=CH_PASS); },
  doneOf:function(mk,n){
    if(!n)return this.chapOk(mk);
    return this.heardOk(mk,n)&&this.quizOk(mk,n);
  },
  openTo:function(){
    var sq=this.seq();
    for(var i=0;i<sq.length;i++){ if(!this.doneOf(sq[i].mk,sq[i].n)) return i; }
    return sq.length-1;
  },
  unlocked:function(mk,n){
    var sq=this.seq(),idx=-1;
    for(var i=0;i<sq.length;i++){ if(sq[i].mk===mk&&sq[i].n===n){idx=i;break;} }
    if(idx<0)return false;
    return idx<=this.openTo();
  },
  /* 章节测评是否已解锁：本章所有节都完成，才开本章测评 */
  chapOpen:function(mk){
    var sq=this.seq(),idx=-1;
    for(var i=0;i<sq.length;i++){ if(sq[i].mk===mk&&sq[i].chap){idx=i;break;} }
    return idx>=0&&idx<=this.openTo();
  },
  openCount:function(){
    var sq=this.seq(),lim=this.openTo(),c=0;
    for(var i=0;i<=lim&&i<sq.length;i++)if(!sq[i].chap)c++;
    return c;
  },
  /* 换设备 / 清缓存后本地进度为空，但云端有——不回灌就会出现
     「管理员看到 15/15，学员自己看到 0/15」，证书上的学习完成度也会失真。
     只按 updatedAt 取较新的一条，不覆盖本地更新的进度。 */
  hydrate:function(){
    if(!Me||Me.role!=='student')return Promise.resolve(0);
    /* userId 在 doc(jsonb) 里、不是列，按列过滤会 400；id 形如 <uid>__<mk>__s<n>，按前缀取即可 */
    return Cloud.req('gel_progress',{qs:'?select=id,doc&id=like.'+encodeURIComponent(Me.id+'__%')+'&limit=2000'})
      .then(function(rows){
        if(!rows||!rows.length)return 0;
        var m=lsGet('prog',{}),ch=0,cm=lsGet('chap',{});
        rows.forEach(function(r){
          var d=r.doc||{};if(!d.unitId)return;
          /* 章节测评单独存在 chap 里，unitId 形如 <mk>__chap */
          if(/__chap$/.test(d.unitId)){
            var mk=d.unitId.replace(/__chap$/,'');
            var oldc=cm[mk];
            if(d.quiz&&(!oldc||(d.updatedAt||'')>(oldc.at||''))){ cm[mk]=d.quiz; ch++; }
            return;
          }
          var loc=m[d.unitId], rAt=d.updatedAt||'';
          if(!loc||(rAt&&(!loc.updatedAt||rAt>loc.updatedAt))){
            m[d.unitId]={status:d.status||'none',seconds:d.seconds||0,
              visits:d.visits||0,heard:d.heard||loc&&loc.heard||0,
              quiz:d.quiz||(loc&&loc.quiz)||null,updatedAt:rAt};
            ch++;
          }
        });
        if(ch){ lsSet('prog',m); lsSet('chap',cm); }
        return ch;
      }).catch(function(){return 0;});
  }
};

   ============================================================ */
function renderMe(){
  if(!Me){renderLogin();return;}
  var sq=Prog.seq(), total=0, done=0, heard=0;
  sq.forEach(function(x){ if(x.chap)return; total++; if(Prog.doneOf(x.mk,x.n)) done++; });
  var all=Prog.all();
  Object.keys(all).forEach(function(k){ if(k.indexOf('m0__')!==0) heard+=(all[k].heard||0); });
  var totalSec=Object.keys(window.NARR||{}).reduce(function(a,k){
    return a+NARR[k].reduce(function(b,x){return b+x.d;},0);},0);
  /* 剩余时长按「没完成的节」逐节累加，不再用 总时长-累计收听秒数：
     收听秒数会被倍速、重听、测试数据拉偏，算出来常常是 0 */
  var leftSec=0;
  sq.forEach(function(x){
    if(x.chap)return;
    if(Prog.doneOf(x.mk,x.n))return;
    var mm0=modByKey(x.mk);
    var sg=(window.NARR||{})['g_m'+(mm0?mm0.no:1)+'_'+x.n]||[];
    leftSec+=sg.reduce(function(b,y){return b+y.d;},0);
  });
  var leftMin=Math.round(leftSec/60);
  var pct=total?Math.round(done/total*100):0;
  var openTo=Prog.openCount();
  var jr=Cert.judge();

  var cur=null;
  for(var i=0;i<sq.length;i++){ if(!Prog.doneOf(sq[i].mk,sq[i].n)){cur=sq[i];break;} }
  if(!cur) cur=sq[sq.length-1];
  var cm=modByKey(cur.mk);
  var isChap=!!(cur&&cur.chap);

  }else if(p.L==='table'){
    var w=p.w||[],tot=w.reduce(function(a,b){return a+b;},0)||1;
    h+='<div style="overflow-x:auto"><table class="mtable"><thead><tr>'
      +p.D.h.map(function(x,j){return '<th'+(w[j]?' style="width:'+Math.round(w[j]/tot*100)+'%"':'')+'>'+esc(x)+'</th>';}).join('')
      +'</tr></thead><tbody>'
      +p.D.r.map(function(row){
        return '<tr>'+row.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';
      }).join('')+'</tbody></table></div>';
  }else if(p.L==='bands'){
    var cols=[['#eef4fb','#1b4f8a'],['#f0f7f4','#0f7b5f'],['#fdf6ec','#b26a00'],['#f6f2fa','#6b4fa8']];
    h+='<div class="bands">'+D.map(function(it,i){
      var c=cols[i%4];
      return '<div class="band" style="background:'+c[0]+';border-color:'+c[0]+'">'
        +'<div class="bn" style="color:'+c[1]+'">'+esc(it[0])+'</div><p>'+esc(it[1])+'</p></div>';
    }).join('')+'</div>';
  }else if(p.L==='compare'){
    h+='<div class="mcompare">'
      +'<div class="ccol good"><div class="ch">'+esc(p.D.l[0])+'</div><ul>'
      +p.D.l[1].map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'
      +'<div class="ccol bad"><div class="ch">'+esc(p.D.r[0])+'</div><ul>'
      +p.D.r[1].map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div></div>';
  }
  if(p.note){
    h+='<div class="note"><div class="nl">'+esc(p.note[0])+'</div><p>'+esc(p.note[1])+'</p></div>';
  }
  return h;
}

/* ============================================================
   随堂练习（每节 5 题 · 15 节合计占认证总分 5%）
   PQ 存本次作答态；成绩落进 Prog 记录的 quiz 字段，取最好一次
   ============================================================ */
var PQ={mk:null,n:0,sel:{},res:null};
var PQ_PASS=3;                 /* 答对 3 / 5 即过关 */
var PQ_EACH=5;                 /* 每节 5 题 */

function pracBank(mk,n){
  var m=modByKey(mk);
  var uid='g_m'+(m?m.no:1)+'_'+n;
  return (window.PRACTICE&&window.PRACTICE[uid])||[];
}
function pqStat(mk,n){
  var p=Prog.get(mk,n);
  return (p&&p.quiz)||null;
}

function pqNextOf(mk,n){
  var m=modByKey(mk);
  if(!m)return null;
  var idx=-1;
  m.sections.forEach(function(s,i){if(s.n===n)idx=i;});
  return idx>=0&&idx<m.sections.length-1?m.sections[idx+1]:null;
}

/* ============================================================
   视频下方分流条：看完 → 再看一遍 / 马上测评
   ============================================================ */
function actBody(mk,n){
  var pct=Prog.heardPct(mk,n);
  var st=pqStat(mk,n), best=(st&&st.best)||0;
  var pass=best>=PQ_PASS, nx=pqNextOf(mk,n);
  var head,btns;
  if(pct<80){
    head='<div class="ea-t"><b>本节视频看到 <i id="ea-pct">'+pct+'</i>%</b>'
      +'<span>听完后解锁随堂测评（5 道题，10 分钟内完成）</span></div>';
    btns='<button class="btn line" onclick="plReplay()">从头播放</button>';
  }else if(!pass){
    head='<div class="ea-t"><b>本节已看完</b><span>'
      +(st?('上次答对 '+best+' / '+PQ_EACH+'，可以再来一次'):'5 道随堂题，答对 '+PQ_PASS+' 道记本节完成')
      +'</span></div>';
    btns='<button class="btn line" onclick="plReplay()">再看一遍</button>'
      +'<button class="btn" onclick="location.hash=\'#quiz/'+mk+'/'+n+'\'">马上测评</button>';
  }else{
    head='<div class="ea-t ok"><b>✓ 本节已完成</b><span>随堂测评 '+best+' / '+PQ_EACH
      +'　·　视频已听完</span></div>';
    btns='<button class="btn line" onclick="plReplay()">再看一遍</button>'
      +'<button class="btn line" onclick="location.hash=\'#quiz/'+mk+'/'+n+'\'">重做测评</button>'
      +(nx?'<button class="btn" onclick="goSec(\''+mk+'\','+nx.n+')">下一节 →</button>'
        :'<button class="btn" onclick="location.hash=\'#chap/'+mk+'\'">章节测评 →</button>');
  }
  return head+'<div class="ea-b">'+btns+'</div>';
}
function actHTML(mk,n){
  return '<div class="ea" id="ea">'+actBody(mk,n)+'</div>';
}
function paintAct(){
  var box=document.getElementById('ea');
  if(!box||!LS_.mk)return;
  var pct=Prog.heardPct(LS_.mk,LS_.n);
  var st=pqStat(LS_.mk,LS_.n), pass=!!(st&&st.best>=PQ_PASS);
  var sig=(pct>=80?'h':'w')+'|'+(pass?1:0)+'|'+(st?st.best:0);
  if(paintAct._sig===sig){
    var lab=document.getElementById('ea-pct');
    if(lab)lab.textContent=String(pct);
    return;
  }
  paintAct._sig=sig;
  box.innerHTML=actBody(LS_.mk,LS_.n);
}
function plReplay(){
  if(!Pl.audio||!Pl.segs)return;
  Pl.i=0;Pl.last=0;
  Pl.audio.src=Pl.segs[0].u;
  Pl.audio.playbackRate=Pl.rate;
  if(window.SLIDES&&window.SLIDES[Pl.uid])stageShow(0);
  Pl.audio.play().catch(function(){});
  plPaint();
  toast('从头播放本节');
}

/* ============================================================
   测评页：随堂测评（每节 5 题）· 章节测评（每章 10 题）
   10 分钟倒计时；提交前可随时改答案；提交即出成绩与逐题解析
   ============================================================ */
var QZ={kind:'quiz',mk:null,n:0,sel:{},res:null,endAt:0,timer:null};
var QZ_MIN=10;
var CH_PASS=6;
var CH_EACH=10;

function quizBank(kind,mk,n){
  if(kind==='chap')return (window.CHAPTER&&window.CHAPTER[mk])||[];
  return pracBank(mk,n);
}
function quizPass(kind){ return kind==='chap'?CH_PASS:PQ_PASS; }
function qzKey(kind,mk,n){ return kind+':'+mk+':'+(n||0); }
function qzEndAt(kind,mk,n){
  var key=qzKey(kind,mk,n), t=lsGet('qz_time',null);
  if(t&&t.key===key&&t.endAt>Date.now())return t.endAt;
  var e=Date.now()+QZ_MIN*60000;
  lsSet('qz_time',{key:key,endAt:e});
  return e;
}
function qzDropTimer(){
  var t=lsGet('qz_time',null);
  if(t&&t.key===qzKey(QZ.kind,QZ.mk,QZ.n))lsSet('qz_time',null);
}
function qzBack(){
  var m=modByKey(QZ.mk);
  if(!m)return '';
  if(QZ.kind==='chap')return '#learn/'+QZ.mk+'/'+m.sections[m.sections.length-1].n;
  return '#learn/'+QZ.mk+'/'+QZ.n;
}

function qzListHTML(){
  var qs=quizBank(QZ.kind,QZ.mk,QZ.n), res=QZ.res;
  return qs.map(function(q,i){
    var picked=QZ.sel[i], mark='';
    if(res)mark='<span class="qz-m '+(res.detail[i]?'ok':'no')+'">'+(res.detail[i]?'✓':'✗')+'</span>';
    var opts=q.o.map(function(o,j){
      var cls='opt';
      if(res){ cls+=' lock'; if(j===q.a)cls+=' right'; else if(j===picked)cls+=' wrong'; }
      else if(picked===j)cls+=' sel';
      return '<div class="'+cls+'" data-q="'+i+'" data-o="'+j+'"><div class="ol">'+'ABCD'[j]
        +'</div><div class="ot">'+esc(o)+'</div></div>';
    }).join('');
    var ex=res?'<div class="qz-x'+(res.detail[i]?'':' bad')+'"><b>'
      +(res.detail[i]?'答对了':'正确答案 '+'ABCD'[q.a])+'</b>'+esc(q.why)+'</div>':'';
    return '<div class="qzi'+(res?(res.detail[i]?' ok':' no'):'')+'" data-i="'+i+'">'
      +'<div class="qz-q"><span class="qn">'+String(i+1).padStart(2,'0')+'</span>'+mark
      +'<div class="qtx">'+esc(q.q)+'</div></div>'
      +'<div class="opts">'+opts+'</div>'+ex+'</div>';
  }).join('');
}

function qzFootHTML(){
  var qs=quizBank(QZ.kind,QZ.mk,QZ.n), res=QZ.res;
  if(res){
    var pass=res.pass, m=modByKey(QZ.mk), btns='';
    btns+='<button class="btn line" onclick="qzAgain()">再做一次</button>';
    if(QZ.kind==='chap'){
      var nxm=MODS.filter(function(x){return x.no===m.no+1;})[0];
      btns+='<button class="btn line" onclick="goSec(\''+QZ.mk+'\','+m.sections[m.sections.length-1].n+')">返回课程</button>';
      if(pass&&nxm)btns+='<button class="btn" onclick="goSec(\''+nxm.key+'\',1)">进入下一章 →</button>';
      else if(pass&&!nxm)btns+='<button class="btn" onclick="location.hash=\'#cert\'">进入阶段一认证 →</button>';
    }else{
      var nx=pqNextOf(QZ.mk,QZ.n);
      btns+='<button class="btn line" onclick="location.hash=\''+qzBack()+'\'">返回本节</button>';
      if(pass&&nx)btns+='<button class="btn" onclick="goSec(\''+QZ.mk+'\','+nx.n+')">下一节 →</button>';
      else if(pass&&!nx)btns+='<button class="btn" onclick="location.hash=\'#chap/'+QZ.mk+'\'">章节测评 →</button>';
    }
    return '<div class="qz-score '+(pass?'ok':'no')+'"><b>'+res.got+'</b><span>/ '+qs.length
      +' 题答对</span><em>'+(pass?'已通过':'未通过，答对 '+quizPass(QZ.kind)+' 题即可')+'</em></div>'
      +'<div class="spacer"></div>'+btns;
  }
  return '<div class="qz-cnt" id="qz-cnt">已作答 '+Object.keys(QZ.sel).length+' / '+qs.length+'</div>'
    +'<div class="spacer"></div>'
    +'<button class="btn line" onclick="location.hash=\''+qzBack()+'\'">稍后再做</button>'
    +'<button class="btn" id="qz-sub">提交测评</button>';
}

function qzBind(){
  var list=document.getElementById('qz-list');
  if(!list)return;
  list.onclick=function(e){
    var el=e.target.closest?e.target.closest('.opt'):null;
    if(!el||QZ.res)return;
    var i=+el.dataset.q, j=+el.dataset.o;
    QZ.sel[i]=j;
    var host=list.querySelector('.qzi[data-i="'+i+'"]');
    if(host)host.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
    el.classList.add('sel');
    var c=document.getElementById('qz-cnt');
    if(c)c.textContent='已作答 '+Object.keys(QZ.sel).length+' / '+quizBank(QZ.kind,QZ.mk,QZ.n).length;
  };
  var sub=document.getElementById('qz-sub');
  if(sub)sub.onclick=function(){qzSubmit(false);};
}

function qzTick(){
  clearInterval(QZ.timer);
  var draw=function(){
    var left=Math.max(0,Math.round((QZ.endAt-Date.now())/1000));
    var el=document.getElementById('qz-clock');
    if(el){
      el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
      el.classList.toggle('warn',left<=60);
    }
    if(left<=0&&!QZ.res){ clearInterval(QZ.timer); toast('时间到，自动提交'); qzSubmit(true); }
  };
  draw();
  QZ.timer=setInterval(draw,500);
}

function qzAgain(){
  QZ.sel={};QZ.res=null;
  QZ.endAt=qzEndAt(QZ.kind,QZ.mk,QZ.n);
  var l=document.getElementById('qz-list'); if(l)l.innerHTML=qzListHTML();
  var f=document.getElementById('qz-foot'); if(f)f.innerHTML=qzFootHTML();
  qzBind(); qzTick(); window.scrollTo(0,0);
}

function qzSubmit(auto){
  if(QZ.res)return;
  var qs=quizBank(QZ.kind,QZ.mk,QZ.n);
  if(!qs.length)return;
  var miss=[];
  for(var i=0;i<qs.length;i++)if(QZ.sel[i]===undefined)miss.push(i+1);
  if(!auto&&miss.length){ toast('第 '+miss.join('、')+' 题还没作答'); return; }
  var got=0,detail=[];
  qs.forEach(function(q,i){ var ok=QZ.sel[i]===q.a; detail.push(ok); if(ok)got++; });
  var pass=got>=quizPass(QZ.kind);
  QZ.res={got:got,detail:detail,pass:pass};
  clearInterval(QZ.timer);
  qzDropTimer();

  if(QZ.kind==='chap'){
    var old=Prog.chapStat(QZ.mk)||{best:0,tries:0};
    var rec={best:Math.max(old.best||0,got),last:got,tries:(old.tries||0)+1,at:nowISO()};
    var cm=lsGet('chap',{}); cm[QZ.mk]=rec; lsSet('chap',cm);
    if(Me&&Me.role==='student')Cloud.upsert('gel_progress',[{id:Me.id+'__'+QZ.mk+'__chap',
      doc:{userId:Me.id,course:QZ.mk,unitId:QZ.mk+'__chap',status:'chap',quiz:rec,updatedAt:nowISO()}}]).catch(function(){});
    logEvent('chapter_quiz',QZ.mk+'_'+got+'/'+qs.length);
  }else{
    var pst=pqStat(QZ.mk,QZ.n)||{best:0,tries:0};
    var p2=Prog.get(QZ.mk,QZ.n)||{};
    var quiz={best:Math.max(pst.best||0,got),last:got,tries:(pst.tries||0)+1,at:nowISO()};
    Prog.set(QZ.mk,QZ.n,pass?'quizzed':(p2.status&&p2.status!=='none'?p2.status:'reading'),{quiz:quiz});
    logEvent('practice_submit',QZ.mk+'_s'+QZ.n+'_'+got);
  }

  var l2=document.getElementById('qz-list'); if(l2)l2.innerHTML=qzListHTML();
  var f2=document.getElementById('qz-foot'); if(f2)f2.innerHTML=qzFootHTML();
  qzBind();
  /* 成绩条就贴在手边（sticky），再弹 toast 会盖住底部按钮，这里不再弹 */
  window.scrollTo(0,0);
}

function renderQuiz(mk,n){ renderAssess('quiz',mk,n); }
function renderChap(mk){ renderAssess('chap',mk,0); }

function renderAssess(kind,mk,n){
  var m=modByKey(mk);
  if(!m){ renderHome(); return; }
  var qs=quizBank(kind,mk,n);
  if(!qs.length){ renderHome(); return; }

  if(!(Me&&Me.role==='admin')){
    if(kind==='chap'){
      if(!Prog.chapOpen(mk)){
        toast('本章还没学完，章节测评暂未开放');
        location.hash='#learn/'+mk+'/'+m.sections[m.sections.length-1].n;
        return;
      }
    }else if(!Prog.heardOk(mk,n)){
      toast('先把本节视频听完，再来做测评');
      location.hash='#learn/'+mk+'/'+n;
      return;
    }
  }

  clearInterval(QZ.timer);
  QZ={kind:kind,mk:mk,n:n,sel:{},res:null,endAt:qzEndAt(kind,mk,n),timer:null};

  var title=kind==='chap'?(m.name+' · 章节测评'):('第 '+n+' 节 · 随堂测评');
  /* 面包屑已经写了节号，标题上方那行小字改为模块语境，避免同一句话出现两遍 */
  var kicker='M'+m.no+' '+m.name+(kind==='chap'?'':' · 第 '+n+' 节');
  var sub=kind==='chap'
    ? ('覆盖 M'+m.no+' 全部 '+m.sections.length+' 节，共 '+qs.length+' 道选择题，答对 '+CH_PASS+' 道通过')
    : ('5 道选择题，答对 '+PQ_PASS+' 道记本节完成');
  var back=kind==='chap'?('#learn/'+mk+'/'+m.sections[m.sections.length-1].n):('#learn/'+mk+'/'+n);

  document.getElementById('app').innerHTML='<div class="shell">'+topbar('用户思维 · 在线测评')
    +'<div class="wrap"><div class="crumb"><button onclick="location.hash=\''+back+'\'">'
    +(kind==='chap'?'返回课程':'返回本节')+'</button><span>/</span><span>'+esc(title)+'</span></div>'
    +'<div class="qz-page">'
    +'<div class="qz-hd"><div class="qz-hl"><div class="k">'+esc(kicker)+'</div>'
    +'<h2>'+(kind==='chap'?'章节测评':'随堂测评')+'</h2><p>'+esc(sub)+'</p></div>'
    +'<div class="qz-clock" id="qz-clock">10:00</div></div>'
    +'<div class="qz-bar"><i id="qz-fill"></i></div>'
    +'<div class="qz-tip">提交前可以随时修改答案；提交后立即给出成绩与逐题解析，不能再改。</div>'
    +'<div id="qz-list">'+qzListHTML()+'</div>'
    +'<div class="qz-foot" id="qz-foot">'+qzFootHTML()+'</div>'
    +'</div></div></div>';
  qzBind();
  qzTick();
  window.scrollTo(0,0);
}

function showQuiz(mk,n){
  var m=modByKey(mk),sec=m.sections.filter(function(s){return s.n===n;})[0];
  if(!sec||!sec.q){doneSection(mk,n);return;}
  var q=sec.q,sel=-1,locked=false;
  var body='<div class="qbox"><div class="qh">随堂测 · 第 '+n+' 节</div>'
    +'<div class="qt">'+esc(q.q)+'</div><div class="opts" id="opts">'
    +q.o.map(function(o,i){return '<div class="opt" data-i="'+i+'"><div class="ol">'+'ABCD'[i]+'</div><div class="ot">'+esc(o)+'</div></div>';}).join('')
    +'</div><div id="ex"></div></div>';
  dlg('随堂测','答对后本节记为完成，可重新作答',body,
    [{t:'提交',p:1,fn:function(){
      if(locked){closeDlg();return;}
      if(sel<0){toast('请先选择一个答案');return false;}
      locked=true;
      var ok=sel===q.a;
      document.querySelectorAll('#opts .opt').forEach(function(el){
        var i=+el.dataset.i;el.classList.add('lock');el.classList.remove('sel');
        if(i===q.a)el.classList.add('right');
        else if(i===sel)el.classList.add('wrong');
      });
      document.getElementById('ex').innerHTML='<div class="explain'+(ok?'':' bad')+'">'
        +'<div class="el">'+(ok?'回答正确':'回答错误 · 正确答案 '+'ABCD'[q.a])+'</div>'
        +'<p>'+esc(q.why)+'</p></div>';
      if(ok){doneSection(mk,n);}
      var b=document.querySelector('.dlg .df .btn:last-child');
      if(b){b.textContent=ok?'完成本节':'关闭';}
      return false;
    }}]);
  setTimeout(function(){
    document.querySelectorAll('#opts .opt').forEach(function(el){
      el.onclick=function(){
        if(locked)return;
        document.querySelectorAll('#opts .opt').forEach(function(x){x.classList.remove('sel');});
        el.classList.add('sel');sel=+el.dataset.i;
      };
    });
  },0);
}

function doneSection(mk,n){
  Prog.set(mk,n,'done');
  var m=modByKey(mk);
  var idx=m.sections.filter(function(s){return s.n===n;})[0];
  var next=m.sections[m.sections.indexOf(idx)+1];
  if(document.getElementById('pbody')){
    renderLearn(mk,n);
  }
  logEvent('section_done',mk+'_s'+n);
  toast(next?'本节完成，可以进入下一节':'本节完成，全部章节已学完');
}


/* ============================================================
   音频播放器（分段续播 + 逐字稿联动 + 有效收听计时）
   ============================================================ */
var Pl = { audio: null, uid: null, segs: null, i: 0, rate: 1, tot: 0, last: 0, start: 0 };
/* 默认倍速：全站播放器统一 1.25×。时长显示一律按音频真实时长，不按倍速折算。 */
var RATE_DEF = 1.25;

function fmtT(s) {
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), x = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
}

function playerHTML(uid) {
  var segs = (window.NARR && window.NARR[uid]) || [];
  if (!segs.length) return '';
  var tot = segs.reduce(function (a, x) { return a + x.d; }, 0);
  var rates = [0.9, 1, 1.1, 1.25].map(function (r) {
    var lab = r === 1 ? '1.0' : String(r);
    return '<option value="' + r + '"' + (r === RATE_DEF ? ' selected' : '') + '>' + lab + '×</option>';
  }).join('');
  var hasSlide = !!(window.SLIDES && window.SLIDES[uid]);
  return '<div class="player" id="pl">'
    + (hasSlide
      ? '<div class="stage" id="p-stage"><div class="sl-canvas" id="p-canvas"></div></div>'
        + '<div class="cap" id="pl-sub">点击播放，画面随讲解翻页</div>'
      : '<div class="pl-sub" id="pl-sub">' + esc(segs[0].t) + '</div>')
    + '<div class="pl-top">'
    + '<button class="pl-btn" id="pl-toggle" aria-label="播放或暂停">▶</button>'
    + '<div class="pl-bar" id="pl-bar" title="点击定位"><i id="pl-fill"></i></div>'
    + '<div class="pl-time" id="pl-time">00:00 / ' + fmtT(tot) + '</div>'
    + '<select class="pl-rate" id="pl-rate">' + rates + '</select>'
    + '</div>'
    + '<div class="pl-tools">'
    + '<span class="pl-hint" id="pl-hint">本节 ' + Math.round(tot / 60) + ' 分钟 · 共 ' + segs.length + ' 页</span></div>'
    + '<div class="pl-text" id="pl-text">' + segs.map(function (x, k) {
      return '<div class="pl-seg' + (k === 0 ? ' on' : '') + '" data-k="' + k + '"><b>' + (k + 1) + '</b>'
        + esc(x.t) + '</div>';
    }).join('') + '</div>'

}

function initPlayer(uid) {
  var segs = (window.NARR && window.NARR[uid]) || [];
  if (!segs.length) return;
  if (Pl.audio) { try { Pl.audio.pause(); } catch (e) { } Pl.audio = null; }
  Pl.uid = uid; Pl.segs = segs; Pl.i = 0; Pl.rate = RATE_DEF; Pl.last = 0;
  Pl.tot = segs.reduce(function (a, x) { return a + x.d; }, 0);
  STAGE.uid = uid; STAGE.i = -1; STAGE._lastHl = -2; STAGE.caps = []; STAGE.capAt = []; STAGE.hlEls = [];

  var a = new Audio();
  Pl.audio = a;
  a.preload = 'auto';
  a.src = segs[0].u;
  a.playbackRate = RATE_DEF;
  a.onended = function () { plNext(); };
  a.ontimeupdate = function () {
    if (!a.paused) {
      var d = a.currentTime - Pl.last;
      // 只认 0–1.5 秒的自然推进，拖动进度条不产生有效收听
      if (d > 0 && d < 1.5) Prog.addHeard(LS_.mk, LS_.n, d);
    }
    Pl.last = a.currentTime;
    plPaint();
  };
  a.onerror = function () {
    var h = document.getElementById('pl-hint');
    if (h) h.textContent = '音频加载失败，请刷新或检查网络';
  };

  var tg = document.getElementById('pl-toggle');
  if (tg) tg.onclick = plToggle;
  var rt = document.getElementById('pl-rate');
  if (rt) rt.onchange = function (e) { Pl.rate = +e.target.value; a.playbackRate = Pl.rate; };
  var bar = document.getElementById('pl-bar');
  if (bar) bar.onclick = function (e) {
    var r = e.currentTarget.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    plSeek(Pl.tot * pct);
  };
  // 一进本节先停章节封面，点播放才进第 1 页
  if (window.SLIDES && window.SLIDES[uid]) {
    stageShow(-1);
    var sb0 = document.getElementById('pl-sub');
    if (sb0) { var _c = coverOf(uid); sb0.textContent = (_c.mod === 'M0' ? '开篇导学' : (_c.mod ? _c.mod + ' ' : '') + '第 ' + _c.no + ' 节') + ' · 点播放开始'; }
  } else {
    stageShow(0);
  }
  document.querySelectorAll('.pl-seg').forEach(function (el) {
    el.onclick = function () { plGo(+el.dataset.k, true); };
  });
  if (!Pl.hook) {
    Pl.hook = true;
    var flush = function () {
      if (!Pl.uid) return;
      var pr = Prog.get(LS_.mk, LS_.n);
      if (pr && (pr.heard || 0) > 0) Prog.set(LS_.mk, LS_.n, pr.status || 'reading', { heard: Math.round(pr.heard) });
    };
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });
    window.addEventListener('hashchange', flush);
  }
  plPaint();
}

function plToggle() {
  if (!Pl.audio) return;
  if (Pl.audio.paused) {
    // 停在封面时点播放，直接进第 1 页
    if (STAGE.i < 0 && window.SLIDES && window.SLIDES[Pl.uid]) { STAGE._lastHl = -2; stageShow(0); }
    Pl.audio.play().catch(function () { toast('浏览器阻止了自动播放，请再点一次'); });
  } else {
    Pl.audio.pause();
  }
  setTimeout(plPaint, 80);
}

function plGo(i, play) {
  if (!Pl.segs || i < 0 || i >= Pl.segs.length) return;
  Pl.i = i; Pl.last = 0;
  Pl.audio.src = Pl.segs[i].u;
  Pl.audio.playbackRate = Pl.rate;
  if (play) Pl.audio.play().catch(function () { });
  STAGE._lastHl = -2;
  if (window.SLIDES && window.SLIDES[Pl.uid]) stageShow(i);
  else {
    var sb0 = document.getElementById('pl-sub');
    if (sb0) sb0.textContent = Pl.segs[i].t;
  }
  document.querySelectorAll('.pl-seg').forEach(function (el) {
    var on = +el.dataset.k === i;
    el.classList.toggle('on', on);
    if (on && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  });
  plPaint();
}

function plNext() {
  if (!Pl.segs) return;
  if (Pl.i < Pl.segs.length - 1) plGo(Pl.i + 1, true);
  else {
    Pl.audio.pause();
    var b = document.getElementById('pl-toggle');
    if (b) b.textContent = '▶';
    // 最后一页播完 → 停在本节结束封面
    if (window.SLIDES && window.SLIDES[Pl.uid]) stageShow(Pl.segs.length);
    var sb = document.getElementById('pl-sub');
    if (sb) { sb.textContent = '本节已播完，可以做随堂测评'; sb.classList.add('done'); }
    toast('本节音频已播完');
  }
}

function plSeek(sec) {
  if (!Pl.segs) return;
  var acc = 0;
  for (var i = 0; i < Pl.segs.length; i++) {
    if (sec < acc + Pl.segs[i].d || i === Pl.segs.length - 1) {
      plGo(i, false);
      Pl.audio.currentTime = Math.max(0, Math.min(Pl.segs[i].d - 0.2, sec - acc));
      plPaint();
      return;
    }
    acc += Pl.segs[i].d;
  }
}

function plPaint() {
  if (!Pl.audio || !Pl.segs) return;
  var before = 0;
  for (var i = 0; i < Pl.i; i++) before += Pl.segs[i].d;
  var cur = before + (Pl.audio.currentTime || 0);
  var f = document.getElementById('pl-fill');
  if (f) f.style.width = Math.min(100, cur / Pl.tot * 100) + '%';
  var t = document.getElementById('pl-time');
  if (t) t.textContent = fmtT(cur) + ' / ' + fmtT(Pl.tot);
  var b = document.getElementById('pl-toggle');
  if (b) b.textContent = Pl.audio.paused ? '▶' : '❚❚';
  var seg = Pl.segs[Pl.i] || {};
  var frac = seg.d > 0 ? Math.min(1, Math.max(0, (Pl.audio.currentTime || 0) / seg.d)) : 0;
  stageSync(frac);
  paintAct();
}

/* ============================================================
   认证口径（管理端对任意学员计算，不依赖学员端 Cert 对象）
   ============================================================ */
function certRec(uid) {
  return (ADM.certs || []).filter(function (x) { return x.userId === uid; })[0] || {};
}
function learnScoreOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var total = 0, done = 0;
  var ps = ADM.prog.filter(function (x) { return x.userId === uid; });
  MODS.filter(function (m) { return !S || S.mods.indexOf(m.key) >= 0; }).forEach(function (m) {
    m.sections.forEach(function (sec) {
      total++;
      var k = m.key + '__s' + sec.n;
      var pr = ps.filter(function (x) { return x.unitId === k; })[0];
      if (!pr) return;
      var uid2 = 'g_m' + m.no + '_' + sec.n;
      var full = (window.NARR[uid2] || []).reduce(function (a, x) { return a + x.d; }, 0);
      var ok = (pr.status === 'done' || pr.status === 'quizzed')
        || (full > 0 && (pr.heard || 0) / full >= 0.8);
      if (ok) done++;
    });
  });
  return { done: done, total: total, score: total ? Math.round(done / total * CERT_RULE.learnFull * 10) / 10 : 0 };
}
function pracOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var ps = ADM.prog.filter(function (x) { return x.userId === uid; });
  var secs = 0, done = 0, got = 0, full = 0;
  MODS.filter(function (m) { return !S || S.mods.indexOf(m.key) >= 0; }).forEach(function (m) {
    m.sections.forEach(function (sec) {
      var k = m.key + '__s' + sec.n;
      var pr = ps.filter(function (x) { return x.unitId === k; })[0];
      var uid2 = 'g_m' + m.no + '_' + sec.n;
      var bank = (window.PRACTICE && window.PRACTICE[uid2]) || [];
      var each = Math.max(bank.length, CERT_RULE.pracEach);
      var qz = (pr && pr.quiz) || null;
      var best = qz ? Math.min(each, qz.best || 0) : 0;
      secs++; full += each; got += best;
      if (qz && (qz.best || 0) >= CERT_RULE.pracPass) done++;
    });
  });
  return {
    secs: secs, done: done, got: got, full: full,
    rate: full ? Math.round(got / full * 1000) / 10 : 0,
    score: full ? Math.round(got / full * CERT_RULE.pracFull * 10) / 10 : 0
  };
}
function objOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var c = certRec(uid), ex = c.exam;
  var keys = S ? S.dims : Object.keys(QUIZ.dims);
  var dims = {};
  keys.forEach(function (k) {
    var d = DIMS9[k] || QUIZ.dims[k] || { name: k, full: 0 };
    dims[k] = { name: d.name, got: 0, full: d.full };
  });
  var fullSum = keys.reduce(function (a, k) { return a + dims[k].full; }, 0);
  if (!ex) return { done: false, got: 0, full: fullSum, dims: dims, ex: null };
  QUIZ.items.forEach(function (q, i) {
    if (!dims[q.dim]) return;
    var d = ex.detail && ex.detail[i];
    dims[q.dim].got += d ? d.got : 0;
  });
  var got = 0, full = 0;
  Object.keys(dims).forEach(function (k) { got += dims[k].got; full += dims[k].full; });
  return { done: true, got: Math.round(got * 10) / 10, full: full, dims: dims, ex: ex };
}
function portOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var c = certRec(uid), rv = c.review, got = 0;
  var items = (S && S.portItems) || CERT_RULE.portItems;
  var full = items.reduce(function (a, it) { return a + it.full; }, 0);
  if (rv) {
    items.forEach(function (it) {
      (rv[it.k] || []).forEach(function (v) { got += (+v || 0); });
    });
  }
  return { submitted: !!c.portfolio, reviewed: !!rv, got: got, full: full || 40, pf: c.portfolio, rv: rv };
}
function judgeOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var L = learnScoreOf(uid, S && S.k), O = objOf(uid, S && S.k), P = portOf(uid, S && S.k);
  var PR = pracOf(uid, S && S.k);
  var totalFull = Math.round((CERT_RULE.learnFull + CERT_RULE.pracFull + O.full + P.full) * 10) / 10;
  var total = Math.round((L.score + PR.score + O.got + P.got) * 10) / 10;
  var weak = [];
  Object.keys(O.dims).forEach(function (k) {
    var d = O.dims[k], rate = d.full ? d.got / d.full : 0;
    d.rate = Math.round(rate * 100);
    if (O.done && rate < CERT_RULE.passDimRate) weak.push(d.name);
  });
  var c1 = total >= CERT_RULE.passTotal;
  var c2 = O.done && O.got / O.full >= CERT_RULE.passObjRate;
  var c3 = P.reviewed && P.got / P.full >= CERT_RULE.passPortRate;
  var c4 = O.done && weak.length === 0;
  var ready = O.done && P.reviewed;
  return {
    stage: S, learn: L, prac: PR, obj: O, port: P, total: total, totalFull: totalFull,
    weak: weak, ready: ready,
    passed: ready && c1 && c2 && c3 && c4,
    conds: [c1, c2, c3, c4],
    level: total >= 90 ? '优秀' : total >= 82 ? '熟练' : total >= 75 ? '合格' : '未通过'
  };
}

    [{t:'取消',fn:function(){return true;}},{t:'导入',p:1,fn:function(){
      var txt=document.getElementById('bulk-txt').value;
      var lines=txt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      if(!lines.length){toast('请粘贴学员名单');return false;}
      var exist={};ADM.users.forEach(function(u){exist[u.loginId]=1;});
      var batch=[],skipped=0;
      lines.forEach(function(ln){
        var c=ln.split(/[,，\t]/).map(function(x){return x.trim();});
        if(c.length<2)return;
        if(exist[c[1]]){skipped++;return;}
        var salt=mkSalt();
        batch.push({id:uid('u_'),loginId:c[1],name:c[0],role:'student',company:c[2]||'',
          salt:salt,pwd:hash('gel123456',salt),active:true,createdAt:nowISO()});
        exist[c[1]]=1;
      });
      if(!batch.length){toast('没有可导入的新账号');return false;}
      Promise.all(batch.map(function(u){return saveUser(u);})).then(function(){
        batch.forEach(function(u){ADM.users.unshift(u);});
        ADM.loaded=true;
        toast('已导入 '+batch.length+' 人'+(skipped?'，跳过重复 '+skipped+' 人':''));
        paintAdmin();
      }).catch(function(e){toast('导入失败：'+e.message.slice(0,60));});
    }}]);
}

function resetPwd(id){

function admScores(){
  var st=students();
  if(!st.length){
    return '<div class="card"><div class="ch2"><h3>认证排名</h3></div><div class="cb">'
      +'<div class="empty">还没有学员。<br>先到「学员账号」建号，学员学习与考试后这里会自动出排名。</div></div></div>';
  }
  var open=openStage();
  var list=st.map(function(u){
    var j=judgeOf(u.id);
    var rec=certRec(u.id);
    var last=rec.updatedAt||rec.exam&&rec.exam.at||null;
    return {u:u,j:j,last:last?new Date(last).getTime():0};
  });
  list.sort(function(a,b){
    if(b.j.total!==a.j.total)return b.j.total-a.j.total;
    return b.last-a.last;
  });
  var rows=list.map(function(r,i){
    var j=r.j, rk=i+1;
    var condChip=j.conds.map(function(ok,ci){
      return '<span class="cdt'+(ok?' ok':'')+'" title="条件'+(ci+1)+'">'+(ci+1)+'</span>';
    }).join('');
    var stTxt=j.ready?(j.passed?'<b style="color:var(--ok)">通过</b>':'<b style="color:var(--accent)">未通过</b>')
      :'<span style="color:var(--soft)">进行中</span>';
    var stageTxt=j.passed?'<span class="tag" style="background:#e6f6ef;color:#0f7b5f">阶段 1 已通过</span>'
      :j.ready?'<span class="tag" style="background:#fdecee;color:#c8102e">阶段 1 未通过</span>'
      :(j.learn.done>0||j.obj.done||j.port.submitted)?'<span class="tag" style="background:#eef4fb;color:#1b4f8a">阶段 1 进行中</span>'
      :'<span class="tag gray">阶段 1 未开始</span>';
    return '<tr><td><span class="rank'+(rk<=3?' r'+rk:'')+'">'+rk+'</span></td>'
      +'<td class="nm">'+esc(r.u.name)+'</td>'
      +'<td>'+esc(r.u.company||'—')+'</td>'
      +'<td style="white-space:nowrap">'+stageTxt+'</td>'
      +'<td>'+j.learn.score+'</td>'
      +'<td>'+j.prac.score+'</td>'
      +'<td>'+j.obj.got+'</td>'
      +'<td>'+(j.port.reviewed?j.port.got:'<span style="color:var(--soft)">待评</span>')+'</td>'
      +'<td><b style="color:var(--pri);font-size:15px">'+j.total+'</b></td>'
      +'<td style="white-space:nowrap">'+condChip+'</td>'
      +'<td>'+stTxt+'</td>'
      +'<td style="white-space:nowrap;color:var(--soft)">'+(r.last?ago(new Date(r.last).toISOString()):'—')+'</td></tr>';
  }).join('');

  var passCnt=list.filter(function(r){return r.j.passed;}).length;
  var avg=list.length?Math.round(list.reduce(function(a,r){return a+r.j.total;},0)/list.length*10)/10:0;

  var stageBar=STAGES.map(function(s){
    if(!s.open){
      return '<div class="sbar off"><b>阶段 '+s.no+'</b><span>'+esc(s.name)+'</span>'
        +'<i>待上线 · '+s.dims.length+' 项</i></div>';
    }
    var n=list.filter(function(r){return r.j.passed;}).length;
    var pct=list.length?Math.round(n/list.length*100):0;
    return '<div class="sbar"><b>阶段 '+s.no+'</b><span>'+esc(s.name)+'</span>'
      +'<div class="sbar-p"><i style="width:'+pct+'%"></i></div>'
      +'<em>已通过 '+n+' / '+list.length+' 人</em></div>';
  }).join('');

  return '<div class="card"><div class="ch2"><h3>阶段认证进度</h3>'
   +'<span class="pill">当前开放：阶段 '+open.no+'</span></div><div class="cb">'+stageBar+'</div></div>'

   +'<div class="card"><div class="ch2"><h3>认证排名（阶段 1 · 四条件）</h3>'
   +'<span class="pill">已通过 '+passCnt+' / '+list.length+' 人 · 平均 '+avg+' 分</span><div class="spacer"></div>'
   +'<button class="btn sm line" onclick="admLoad(true).then(paintAdmin)">刷新</button></div>'
   +'<div class="cb p0">'
   +'<table class="dt"><thead><tr><th style="width:52px">名次</th><th>学员</th><th>部门</th><th>阶段状态</th>'
   +'<th title="满分 5">学习</th><th title="满分 5">随堂</th><th title="满分 50">客观题</th><th title="满分 40">作品集</th>'
   +'<th>总分</th><th>四条件</th><th>结论</th><th>最近</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'</div><div class="cb" style="border-top:1px solid var(--line)">'
   +'<p style="font-size:12px;color:var(--muted);line-height:1.8">'
   +'四条件依次为：①总分≥75　②客观题≥70%　③作品集≥70%　④本阶段能力子项无一项低于60%（短板否决）。'
   +'绿点为已满足。阶段 1 总分 = 学习完成度 5 + 随堂练习 5 + 客观题 50 + 作品集 40；'
   +'阶段 2、3 上线后按同一规则独立判定，已通过阶段不受影响。</p></div></div>';
}

  dlg('作品集评审 · '+esc(u.name),'按 4 维 × 2 件逐项评分，每维 0–5 分，合计 40 分',

var DIMS9 = {
