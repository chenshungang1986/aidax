    return '<tr><td class="nm">'+esc(d.name||(findName(d.userId)))+'</td><td><span class="pill '+(d.type==='exam_submit'?'ok':(d.type==='login'?'gray':''))+'">'+esc(typ)+'</span></td>'
      +'<td>'+esc(d.ref||'')+'</td><td style="white-space:nowrap">'+ago(d.at)+'</td></tr>';
  }).join('');

  return '<div class="kpis">'
   +kpi('学员总数',st.length,'人','已建账号')
   +kpi('已开始学习',act,'人',st.length?Math.round(act/st.length*100)+'%':'—')
   +kpi('完成全部课程',finished,'人','完成率 '+rate+'%')
   +kpi('已参加测评',examed,'人','平均分 '+avgScore())
   +kpi('阶段 1 已通过',st.filter(function(u){return judgeOf(u.id).passed;}).length,'人','四条件全部满足')
   +'</div>'
   +'<div class="row2">'
   +'<div class="card"><div class="ch2"><h3>各模块完成情况</h3></div><div class="cb">'
   +MODS.map(function(m){
      var c=0;
      st.forEach(function(u){if(doneOf(u.id,m.key).done>=m.sections.length)c++;});
      var pct=st.length?Math.round(c/st.length*100):0;
      return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">'
        +'<span style="color:var(--deep);font-weight:500">M'+m.no+' '+esc(m.name)+'</span>'
        +'<span style="color:var(--soft)">'+c+' / '+st.length+' 人完成</span></div>'

function bulkAdd(){
  dlg('批量导入学员','每行一个：姓名,登录账号,部门（密码默认 gel123456）',
    '<textarea class="inp" id="bulk-txt" style="height:180px;padding:11px;line-height:1.7;resize:vertical" '
    +'placeholder="张明,zhangming,财务共享中心&#10;李静,lijing,采购中心&#10;王涛,wangtao,人力资源部"></textarea>'
    +'<div style="font-size:12px;color:var(--soft);margin-top:10px;line-height:1.7">'
    +'密码统一为 <b>gel123456</b>。学员忘记密码时，在此页点「重置密码」即可。账号重复会自动跳过。</div>',
    [{t:'取消',fn:function(){return true;}},{t:'导入',p:1,fn:function(){
      var txt=document.getElementById('bulk-txt').value;
      var lines=txt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      if(!lines.length){toast('请粘贴学员名单');return false;}
      var exist={};ADM.users.forEach(function(u){exist[u.loginId]=1;});
      var batch=[],skipped=0;
      lines.forEach(function(ln){
        var c=ln.split(/[,，\t]/).map(function(x){return x.trim();});
        if(c.length<2)return;
        if(exist[c[1]]){skipped++;return;}
        var salt=mkSalt();
        batch.push({id:uid('u_'),loginId:c[1],name:c[0],role:'student',company:c[2]||'',
          salt:salt,pwd:hash('gel123456',salt),active:true,createdAt:nowISO()});
        exist[c[1]]=1;
      });
      if(!batch.length){toast('没有可导入的新账号');return false;}
      Promise.all(batch.map(function(u){return saveUser(u);})).then(function(){
        batch.forEach(function(u){ADM.users.unshift(u);});
        ADM.loaded=true;
        toast('已导入 '+batch.length+' 人'+(skipped?'，跳过重复 '+skipped+' 人':''));
        paintAdmin();
      }).catch(function(e){toast('导入失败：'+e.message.slice(0,60));});
    }}]);
}

function resetPwd(id){
  var u=ADM.users.filter(function(x){return x.id===id;})[0];if(!u)return;
  var np=prompt('给「'+u.name+'」设置新密码：','gel123456');
  if(np===null)return;
  np=np.trim();if(!np){toast('密码不能为空');return;}
  var salt=mkSalt();
  u.salt=salt;u.pwd=hash(np,salt);
  saveUser(u).then(function(){toast('密码已重置为：'+np);}).catch(function(e){toast('失败：'+e.message.slice(0,50));});
}

function admScores(){
  var st=students();
  if(!st.length){
    return '<div class="card"><div class="ch2"><h3>认证排名</h3></div><div class="cb">'
      +'<div class="empty">还没有学员。<br>先到「学员账号」建号，学员学习与考试后这里会自动出排名。</div></div></div>';
  }
  var open=openStage();
  var list=st.map(function(u){
    var j=judgeOf(u.id);
    var rec=certRec(u.id);
    var last=rec.updatedAt||rec.exam&&rec.exam.at||null;
    return {u:u,j:j,last:last?new Date(last).getTime():0};
  });
  list.sort(function(a,b){
    if(b.j.total!==a.j.total)return b.j.total-a.j.total;
    return b.last-a.last;
  });
  var rows=list.map(function(r,i){
    var j=r.j, rk=i+1;
    var condChip=j.conds.map(function(ok,ci){
      return '<span class="cdt'+(ok?' ok':'')+'" title="条件'+(ci+1)+'">'+(ci+1)+'</span>';
    }).join('');
    var stTxt=j.ready?(j.passed?'<b style="color:var(--ok)">通过</b>':'<b style="color:var(--accent)">未通过</b>')
      :'<span style="color:var(--soft)">进行中</span>';
    var stageTxt=j.passed?'<span class="tag" style="background:#e6f6ef;color:#0f7b5f">阶段 1 已通过</span>'
      :j.ready?'<span class="tag" style="background:#fdecee;color:#c8102e">阶段 1 未通过</span>'
      :(j.learn.done>0||j.obj.done||j.port.submitted)?'<span class="tag" style="background:#eef4fb;color:#1b4f8a">阶段 1 进行中</span>'
      :'<span class="tag gray">阶段 1 未开始</span>';
    return '<tr><td><span class="rank'+(rk<=3?' r'+rk:'')+'">'+rk+'</span></td>'
      +'<td class="nm">'+esc(r.u.name)+'</td>'
      +'<td>'+esc(r.u.company||'—')+'</td>'
      +'<td style="white-space:nowrap">'+stageTxt+'</td>'
      +'<td>'+j.learn.score+'</td>'
      +'<td>'+j.obj.got+'</td>'
      +'<td>'+(j.port.reviewed?j.port.got:'<span style="color:var(--soft)">待评</span>')+'</td>'
      +'<td><b style="color:var(--pri);font-size:15px">'+j.total+'</b></td>'
      +'<td style="white-space:nowrap">'+condChip+'</td>'
      +'<td>'+stTxt+'</td>'
      +'<td style="white-space:nowrap;color:var(--soft)">'+(r.last?ago(new Date(r.last).toISOString()):'—')+'</td></tr>';
  }).join('');

  var passCnt=list.filter(function(r){return r.j.passed;}).length;
  var avg=list.length?Math.round(list.reduce(function(a,r){return a+r.j.total;},0)/list.length*10)/10:0;

  var stageBar=STAGES.map(function(s){
    if(!s.open){
      return '<div class="sbar off"><b>阶段 '+s.no+'</b><span>'+esc(s.name)+'</span>'
        +'<i>待上线 · '+s.dims.length+' 项</i></div>';
    }
    var n=list.filter(function(r){return r.j.passed;}).length;
    var pct=list.length?Math.round(n/list.length*100):0;
    return '<div class="sbar"><b>阶段 '+s.no+'</b><span>'+esc(s.name)+'</span>'
      +'<div class="sbar-p"><i style="width:'+pct+'%"></i></div>'
      +'<em>已通过 '+n+' / '+list.length+' 人</em></div>';
  }).join('');

  return '<div class="card"><div class="ch2"><h3>阶段认证进度</h3>'
   +'<span class="pill">当前开放：阶段 '+open.no+'</span></div><div class="cb">'+stageBar+'</div></div>'

   +'<div class="card"><div class="ch2"><h3>认证排名（阶段 1 · 四条件）</h3>'
   +'<span class="pill">已通过 '+passCnt+' / '+list.length+' 人 · 平均 '+avg+' 分</span><div class="spacer"></div>'
   +'<button class="btn sm line" onclick="admLoad(true).then(paintAdmin)">刷新</button></div>'
   +'<div class="cb p0">'
   +'<table class="dt"><thead><tr><th style="width:52px">名次</th><th>学员</th><th>部门</th><th>阶段状态</th>'
   +'<th title="满分 10">学习</th><th title="满分 50">客观题</th><th title="满分 40">作品集</th>'
   +'<th>总分</th><th>四条件</th><th>结论</th><th>最近</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'</div><div class="cb" style="border-top:1px solid var(--line)">'
   +'<p style="font-size:12px;color:var(--muted);line-height:1.8">'
   +'四条件依次为：①总分≥75　②客观题≥70%　③作品集≥70%　④本阶段能力子项无一项低于60%（短板否决）。'
   +'绿点为已满足。阶段 1 总分 = 学习完成度 10 + 客观题 50 + 作品集 40；'
   +'阶段 2、3 上线后按同一规则独立判定，已通过阶段不受影响。</p></div></div>';

function admCert(){
  var st=students();
  if(!st.length){
    return '<div class="card"><div class="ch2"><h3>作品集评审</h3></div><div class="cb">'
      +'<div class="empty">还没有学员。</div></div></div>';
  }
  var wait=0,done=0;
  var rows=st.map(function(u){
    var j=judgeOf(u.id);
    var P=j.port;
    var stt=P.reviewed?'<span class="tag" style="background:#e6f6ef;color:#0f7b5f">已评 '+P.got+' 分</span>'
      :P.submitted?'<span class="tag" style="background:#fdf1e3;color:#a9660f">待评审</span>'
      :'<span class="tag gray">未提交</span>';
    if(P.reviewed)done++;else if(P.submitted)wait++;
    return '<tr><td class="nm">'+esc(u.name)+'</td><td>'+esc(u.loginId)+'</td>'
      +'<td>'+stt+'</td>'
      +'<td>'+j.obj.got+'</td><td>'+j.learn.score+'</td><td><b>'+j.total+'</b></td>'
      +'<td style="white-space:nowrap">'
      +'<button class="btn sm line" onclick="openReview(\''+u.id+'\')">'+(P.reviewed?'查看/改分':'评审')+'</button>'
      +'</td></tr>';

  return '<div class="card"><div class="ch2"><h3>作品集评审</h3>'
   +'<span class="pill">待评 '+wait+' 人 · 已评 '+done+' 人</span><div class="spacer"></div>'
   +'<button class="btn sm line" onclick="admLoad(true).then(paintAdmin)">刷新</button></div>'
   +'<div class="cb p0"><table class="dt"><thead><tr><th>学员</th><th>账号</th><th>作品集</th>'
   +'<th>客观题</th><th>学习</th><th>总分</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<div class="cb" style="border-top:1px solid var(--line)"><p style="font-size:12px;color:var(--muted);line-height:1.8">'
   +'两件作品各 20 分，每件按 4 个维度评分，每维 0–5 分。评分提交后立即计入学员总分并更新排名。</p></div></div>';
}

function openReview(uid){
  var c=certRec(uid);
  var u=ADM.users.filter(function(x){return x.id===uid;})[0]||{name:'学员'};
  var pf=c.portfolio;
  if(!pf){
    dlg('作品集评审','该学员还没有提交作品集', '<p style="font-size:13.5px;color:var(--mid);line-height:1.9">'
      +esc(u.name)+' 尚未填写作品集。学员端进入「能力认证 → 填写作品集」，提交后这里才可评分。</p>',
      [{t:'知道了',p:1,fn:function(){return true;}}]);
    return;
  }
  var rv=c.review||{a:[0,0,0,0],b:[0,0,0,0],note:''};
  var body='';
  CERT_RULE.portItems.forEach(function(it){
    body+='<div style="margin-bottom:18px"><div style="font-size:13px;color:var(--pri);font-weight:600;margin-bottom:6px">'
      +esc(it.name)+'（'+it.full+' 分）</div>';
    if(it.k==='a'){
      body+='<div style="background:#f8fafd;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.85;color:var(--mid);margin-bottom:10px">'
        +['谁在用','在什么条件下','为完成什么','现在怎么绕过','不做会怎样'].map(function(q,i){
            return '<div><b style="color:var(--deep)">'+(i+1)+'. '+q+'：</b>'+esc((pf.a&&pf.a[i])||'（空）')+'</div>';
          }).join('')+'</div>';
    }else{
      body+='<div style="background:#f8fafd;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.85;color:var(--mid);margin-bottom:10px">'
        +[0,1,2].map(function(i){
            return '<div><b style="color:var(--deep)">主问题 '+(i+1)+'：</b>'+esc((pf.b&&pf.b.q&&pf.b.q[i])||'（空）')
              +'<div style="color:var(--soft)">追问：'+esc((pf.b&&pf.b.q&&pf.b.q['x'+i])||'—')+'</div></div>';
          }).join('')
        +'<div style="margin-top:6px"><b style="color:var(--deep)">观察记录：</b></div>'
        +[0,1,2].map(function(i){return '<div>· '+esc((pf.b&&pf.b.obs&&pf.b.obs[i])||'（空）')+'</div>';}).join('')
        +'</div>';
    }
    body+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
      +it.dims.map(function(dn,di){
          var val=rv[it.k]&&rv[it.k][di]!=null?rv[it.k][di]:0;
          return '<label style="font-size:12.5px;color:var(--mid);display:flex;align-items:center;gap:7px">'
            +'<span style="flex:1">'+esc(dn)+'</span>'
            +'<select class="inp" style="width:74px;padding:5px 7px" data-k="'+it.k+'" data-d="'+di+'">'
            +[0,1,2,3,4,5].map(function(v){return '<option value="'+v+'"'+(v==val?' selected':'')+'>'+v+' 分</option>';}).join('')
            +'</select></label>';
        }).join('')+'</div></div>';
  });
  body+='<div style="margin-top:6px"><div style="font-size:12.5px;color:var(--mid);margin-bottom:5px">评语（可选，学员可见）</div>'
    +'<textarea class="inp" id="rv-note" rows="2" style="width:100%">'+esc(rv.note||'')+'</textarea></div>';

  dlg('作品集评审 · '+esc(u.name),'按 4 维 × 2 件逐项评分，每维 0–5 分，合计 40 分',
    body,[{t:'取消',fn:function(){return true;}},{t:'保存评分',p:1,fn:function(){
      var rev={a:[0,0,0,0],b:[0,0,0,0],note:(document.getElementById('rv-note').value||'').slice(0,500),
        by:Me.name,at:nowISO()};
      document.querySelectorAll('.dlg select[data-k]').forEach(function(el){
        rev[el.dataset.k][+el.dataset.d]=+el.value;
      });
      var doc={userId:uid,name:u.name,loginId:u.loginId};
      Object.assign(doc,c,{review:rev});
      delete doc.id;
      Cloud.upsert('gel_cert',[{id:uid,doc:doc}]).then(function(){
        ADM.loaded=false;
        admLoad(true).then(paintAdmin);
        toast('已保存，学员总分与排名已更新');
      }).catch(function(e){toast('保存失败：'+String(e.message||e).slice(0,40));});
      return true;
    }}]);
}

/* ============================================================

var CERT_RULE = {

/* ============================================================
   分阶段认证
   9 项能力子项按「主承载模块」切成 3 个阶段，每阶段独立 100 分制四条件。
   判定只作用于本阶段已开评的子项；未开评项在能力面板显式标注「待阶段 N」，
   不参与总分、也不当作 0 分——否则学员会把「还没学」误读成「不会」。
   ============================================================ */
var STAGES = [
  { k: 's1', no: 1, name: '用户思维基础', open: true,
    sub: 'M1 用户思维总纲 · M2 定性研究方法',

    goal: '解决「先看事实还是先听观点」。学完能独立做一次不诱导的深访，并把一句模糊抱怨还原成可核验的场景。',
    next: '阶段二 · 研究与洞察' },
  { k: 's2', no: 2, name: '研究与洞察', open: false,
    sub: 'M3 定量研究方法 · M4 用户画像构建 · M5 需求挖掘与识别 · M6 需求优先级判断',

    portItems: null,
    goal: '解决「多少人、什么人、先做哪个」。学完能用一份问卷证明规模、用画像卡分出核心与边缘、用排序表在资源冲突时给出可辩护的理由。',
    next: '阶段三 · 旅程与反馈闭环' },
  { k: 's3', no: 3, name: '旅程与反馈闭环', open: false,
    sub: 'M7 用户旅程绘制 · M8 用户反馈闭环与满意度度量',

/* 9 项能力子项 → 阶段归属（对齐吉利的 4 大能力项 / 9 个子项） */
var DIMS9 = {
  scene:    { name: '场景还原能力',     model: '场景化与共情思维', stage: 's1', full: 20, master: 'M1 第 3–5 节' },
  qual:     { name: '定性研究方法',     model: '用户研究能力',     stage: 's1', full: 18, master: 'M2 全部' },
  need:     { name: '需求挖掘与识别',   model: '用户需求洞察',     stage: 's1', full: 12, master: 'M1 第 4–6 节',
              scope: '考核范围限于 M1/M2 已讲的「需求真伪初判」，M5 会完整展开并在阶段二作品集中复查' },
  quant:    { name: '定量研究方法',     model: '用户研究能力',     stage: 's2', full: 18, master: 'M3 全部' },
  persona:  { name: '用户画像构建',     model: '用户研究能力',     stage: 's2', full: 15, master: 'M4 全部' },
  prio:     { name: '需求优先级判断',   model: '用户需求洞察',     stage: 's2', full: 17, master: 'M6 全部' },
  journey:  { name: '用户旅程绘制',     model: '场景化与共情思维', stage: 's3', full: 20, master: 'M7 全部' },
  feedback: { name: '反馈收集体系搭建', model: '用户反馈闭环',     stage: 's3', full: 16, master: 'M8 第 1–4 节' },

};
STAGES.forEach(function (s) { s.portItems = s.k === 's1' ? CERT_RULE.portItems : []; });

function stageOf(k) {
  for (var i = 0; i < STAGES.length; i++) if (STAGES[i].k === k) return STAGES[i];
  return null;
}
/* 当前开放阶段：同一时刻只有一个，后续阶段上线时把 open 打开即可 */
function openStage() {
  for (var i = 0; i < STAGES.length; i++) if (STAGES[i].open) return STAGES[i];
  return STAGES[0];
}

var Cert = {
  key: function () { return 'cert_' + (Me ? Me.id : 'anon'); },
  get: function () { return lsGet('cert', {}); },
  set: function (o) { lsSet('cert', o); this.push(o); },
  patch: function (p) { var o = this.get(); Object.assign(o, p); o.updatedAt = nowISO(); this.set(o); return o; },
  /* 写云端必须「先读后写」：upsert 是整行替换，直接推本地 doc 会把管理员写的
     review 冲掉——学员考一次试就把已评的作品集分数清零，这是真实踩过的坑。 */
  push: function (o) {
    if (!Me || Me.role !== 'student') return;
    var self = this;
    Cloud.req('gel_cert', { qs: '?id=eq.' + encodeURIComponent(Me.id) + '&select=doc' })
      .then(function (rows) {
        var remote = (rows && rows[0] && rows[0].doc) || {};
        var doc = Object.assign({}, remote, o);
        // 学员改作品集时显式传 review:null，视为评分作废，需管理员重评
        if ('review' in o && o.review === null) delete doc.review;
        doc.userId = Me.id; doc.name = Me.name; doc.loginId = Me.loginId;
        doc.updatedAt = nowISO();
        return Cloud.upsert('gel_cert', [{ id: Me.id, doc: doc }]);
      })
      .catch(function () { });
  },
  /* 从云端拉回管理员评分：学员本地只有自己写的数据，不拉就永远看不到评审结果 */
  sync: function () {
    if (!Me || Me.role !== 'student') return Promise.resolve();
    var self = this;
    return Cloud.req('gel_cert', { qs: '?id=eq.' + encodeURIComponent(Me.id) + '&select=doc' })
      .then(function (rows) {
        if (!rows || !rows.length || !rows[0].doc) return;
        var remote = rows[0].doc, local = lsGet('cert', {});
        var merged = Object.assign({}, remote, local);
        if (remote.review) merged.review = remote.review;
        lsSet('cert', merged);
      })
      .catch(function () { });
  },
  /* ---- 学习完成度：每节听满 80% 或已完成随堂测（只算本阶段模块） ---- */
  learn: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    var total = 0, done = 0, detail = [];
    MODS.filter(function (m) { return S.mods.indexOf(m.key) >= 0; }).forEach(function (m) {
      m.sections.forEach(function (s) {
        total++;
        var p = Prog.get(m.key, s.n) || {};
        var uid = 'g_m' + m.no + '_' + s.n;
        var segs = window.NARR[uid] || [];
        var full = segs.reduce(function (a, x) { return a + x.d; }, 0);
        var heard = p.heard || 0;
        var ok = (p.status === 'done' || p.status === 'quizzed') || (full > 0 && heard / full >= 0.8);
        if (ok) done++;
        detail.push({ uid: uid, t: s.t, rate: full > 0 ? Math.min(1, heard / full) : 0, ok: ok });
      });
    });
    return { done: done, total: total, score: total ? Math.round(done / total * CERT_RULE.learnFull * 10) / 10 : 0, detail: detail };
  },
  /* ---- 客观题：按本阶段子项汇总 ---- */
  obj: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    var c = this.get();
    var ex = c.exam || null;
    var dims = {}, total = 0, full = 0;
    S.dims.forEach(function (k) {
      var d = DIMS9[k] || QUIZ.dims[k] || { name: k, full: 0 };
      dims[k] = { name: d.name, got: 0, full: d.full, stage: d.stage };
      full += d.full;
    });
    if (!ex) return { done: false, got: 0, full: full, dims: dims, ex: null };
    QUIZ.items.forEach(function (q, i) {
      if (!dims[q.dim]) return;
      var d = ex.detail && ex.detail[i];
      var g = d ? d.got : 0;
      dims[q.dim].got += g;
      total += g;
    });
    return { done: true, got: Math.round(total * 10) / 10, full: full, dims: dims, ex: ex };
  },
  /* ---- 作品集 ---- */
  port: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    var c = this.get();
    var pf = c.portfolio || null, rv = c.review || null;
    var items = S.portItems || [];
    var full = items.reduce(function (a, it) { return a + it.full; }, 0);
    var got = 0;
    if (rv) {
      items.forEach(function (it) {
        var arr = rv[it.k] || [];
        (arr || []).forEach(function (v) { got += (+v || 0); });
      });
    }
    return { submitted: !!pf, reviewed: !!rv, got: Math.round(got * 10) / 10, full: full || CERT_RULE.portFull, pf: pf, rv: rv };
  },
  /* ---- 阶段四条件 ---- */
  judge: function (sk) {
    var S = sk ? stageOf(sk) : openStage();
    if (!S) S = STAGES[0];
    if (!S.open) return { locked: true, stage: S };
    var L = this.learn(S.k), O = this.obj(S.k), P = this.port(S.k);
    var totalFull = Math.round((CERT_RULE.learnFull + O.full + P.full) * 10) / 10;
    var total = Math.round((L.score + O.got + P.got) * 10) / 10;
    var weak = [];
    Object.keys(O.dims).forEach(function (k) {
      var d = O.dims[k];
      var rate = d.full ? d.got / d.full : 0;
      d.rate = Math.round(rate * 100);
      if (O.done && rate < CERT_RULE.passDimRate) weak.push(d.name + '（' + d.rate + '%）');
    });
    var dimWord = S.dims.length + ' 项';
    var conds = [
      { n: '条件一  总分不低于 75 分', ok: total >= CERT_RULE.passTotal,
        d: total + ' / ' + totalFull + ' 分', need: '≥ 75' },
      { n: '条件二  客观题得分率不低于 70%', ok: O.done && O.got / O.full >= CERT_RULE.passObjRate,
        d: O.done ? (O.got + ' / ' + O.full + ' 分，' + Math.round(O.got / O.full * 100) + '%') : '未考试',
        need: '≥ 70%' },
      { n: '条件三  作品集得分率不低于 70%', ok: P.reviewed && P.got / P.full >= CERT_RULE.passPortRate,
        d: P.reviewed ? (P.got + ' / ' + P.full + ' 分，' + Math.round(P.got / P.full * 100) + '%') : (P.submitted ? '已提交，待评审' : '未提交'),
        need: '≥ 70%' },
      { n: '条件四  能力子项无一项低于 60%（短板否决）', ok: O.done && weak.length === 0,
        d: O.done ? (weak.length ? '短板：' + weak.join('、') : '本阶段' + dimWord + '均达标') : '未考试', need: '全部 ≥ 60%' }
    ];
    var allReady = O.done && P.reviewed;
    return {
      locked: false, stage: S,
      learn: L, obj: O, port: P, total: total, totalFull: totalFull,
      conds: conds, weak: weak,
      passed: allReady && conds.every(function (c) { return c.ok; }),
      ready: allReady,
      level: total >= 90 ? '优秀' : total >= 82 ? '熟练' : total >= 75 ? '合格' : '未通过'
    };
  }
};

/* ---- 9 项能力面板：已认定 / 待阶段 N ---- */
function dimPanel() {
  var open = openStage();
  var out = [], order = ['scene', 'qual', 'need', 'quant', 'persona', 'prio', 'journey', 'feedback', 'nps'];
  var r = null;
  order.forEach(function (k) {
    var d = DIMS9[k];
    var st = stageOf(d.stage);
    var avail = st && st.open;
    if (avail) {
      if (!r || r.stage.k !== st.k) r = Cert.judge(st.k);
      var o = r.obj.dims[k];
      var rate = o ? (o.rate || 0) : 0;
      out.push({ k: k, d: d, st: st, avail: true, got: o ? o.got : 0, full: d.full, rate: rate });
    } else {
      out.push({ k: k, d: d, st: st, avail: false, got: 0, full: d.full, rate: 0 });
    }
  });
  return out;
}

function certNo(sk, uid) {
  var s = stageOf(sk) || STAGES[0];
  var seed = String(uid || '');
  var h = 0;
  for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 1679616;
  var tail = ('00000' + h.toString(36).toUpperCase()).slice(-5);
  var c = Cert.get();
  var ts = (c.updatedAt || nowISO()).slice(0, 10).replace(/-/g, '');
  return 'GEL-' + s.no + '-' + tail + '-' + ts;
}

function renderCertificate(sk) {
  var S = stageOf(sk) || openStage();
  Cert.sync().then(function () { paintCertificate(S.k); });

    + '<div><span>认证机构</span><b>起点课堂 · 企业服务</b></div>'
    + '<div class="cd-seal">用户思维<br>阶段认证</div></div>'
    + '</div>'
    + '<p class="cd-tip">提示：点「打印 / 存为 PDF」可保存或打印，打印设置里选择「背景图形」效果更好。</p>'
    + '</div></div>';
  window.scrollTo(0, 0);
}

/* ============================================================
   认证考试：33 题 / 60 分钟
   ============================================================ */
var EX = { ans: [], t0: 0, timer: null };

function renderCertExam() {
  var items = QUIZ.items;
  EX.ans = items.map(function (q) { return q.type === 'multi' ? [] : -1; });
  EX.t0 = Date.now();

  var byDim = {};
  items.forEach(function (q, i) { (byDim[q.dim] = byDim[q.dim] || []).push(i); });

  var blocks = Object.keys(QUIZ.dims).map(function (k) {
    var d = QUIZ.dims[k];
    var list = (byDim[k] || []).map(function (gi) {
      var q = items[gi];
      var opts = q.o.map(function (o, j) {
        return '<div class="opt" data-gi="' + gi + '" data-j="' + j + '"><div class="ol">' + 'ABCDE'[j] + '</div>'
          + '<div class="ot">' + esc(o) + '</div></div>';
      }).join('');
      var tag = q.type === 'multi' ? '<span class="qtag multi">多选</span>'
        : q.type === 'judge' ? '<span class="qtag judge">判断</span>' : '';
      return '<div class="qx"><div class="qxi">' + (gi + 1) + '</div><div style="flex:1">'
        + '<div class="qxt">' + tag + esc(q.q) + '</div>'
        + '<div class="opts" data-gi="' + gi + '">' + opts + '</div></div></div>';
    }).join('');
    return '<div class="card" style="margin-bottom:14px"><div class="ch2"><h3>' + esc(d.name) + '</h3>'
      + '<span class="tag">' + d.full + ' 分 · ' + (byDim[k] || []).length + ' 题</span></div>'
      + '<div class="cb">' + list + '</div></div>';
  }).join('');

  document.getElementById('app').innerHTML = '<div class="shell">' + topbar('用户思维 · 认证考试') +
    '<div class="wrap"><div class="crumb"><button onclick="location.hash=\'#cert\'">认证</button><span>/</span><span>客观题考试</span></div>' +
    '<div style="max-width:820px;margin:0 auto">' +
    '<div class="exam-top"><div><b>33 题</b><span>单选 28 · 多选 3 · 判断 2</span></div>' +
    '<div><b>50 分</b><span>占总分 50%</span></div>' +
    '<div><b id="ex-clock">60:00</b><span>剩余时间</span></div></div>' +
    '<p style="font-size:12.5px;color:var(--muted);line-height:1.8;margin:12px 0 18px">' +
    '多选题必须全部选对才得分，少选或多选均为 0 分。提交后可立即看到总分与三个子项得分，' +
    '未通过可重考，取最高分。</p>' + blocks +
    '<div style="display:flex;gap:12px;margin:20px 0 50px"><button class="btn" id="sub-cert">提交试卷</button>' +
    '<button class="btn line" onclick="location.hash=\'#cert/s1\'">稍后再考</button></div>' +
    '</div></div></div>';

  bindExamOpts();
  var left = CERT_RULE.examMinutes * 60;
  clearInterval(EX.timer);
  EX.timer = setInterval(function () {
    left--;
    var m = Math.floor(left / 60), s = left % 60;
    var el = document.getElementById('ex-clock');
    if (el) el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    if (left <= 0) { clearInterval(EX.timer); toast('时间到，自动交卷'); submitCert(); }
  }, 1000);

  document.getElementById('sub-cert').onclick = function () { submitCert(); };
  window.scrollTo(0, 0);
}

function bindExamOpts() {
  document.querySelectorAll('.opts[data-gi]').forEach(function (g) {
    var gi = +g.dataset.gi, q = QUIZ.items[gi];
    g.querySelectorAll('.opt').forEach(function (el) {
      el.onclick = function () {
        var j = +el.dataset.j;
        if (q.type === 'multi') {
          el.classList.toggle('sel');
          var cur = [];
          g.querySelectorAll('.opt').forEach(function (x) { if (x.classList.contains('sel')) cur.push(+x.dataset.j); });
          EX.ans[gi] = cur;
        } else {
          g.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          el.classList.add('sel');
          EX.ans[gi] = j;
        }
      };
    });
  });
}

function submitCert() {
  var un = 0;
  QUIZ.items.forEach(function (q, i) {
    var a = EX.ans[i];
    if (q.type === 'multi' ? !a || !a.length : (a === undefined || a < 0)) un++;
  });
  if (un > 0 && !confirm('还有 ' + un + ' 题未作答，确认提交？')) return;

  var detail = [], got = 0;
  QUIZ.items.forEach(function (q, i) {
    var a = EX.ans[i], ok = false, myGot = 0;
    if (q.type === 'multi') {
      var mine = (a || []).slice().sort().join(',');
      var right = q.a.slice().sort().join(',');
      ok = mine === right; myGot = ok ? q.s : 0;
    } else {
      ok = a === q.a; myGot = ok ? q.s : 0;
    }
    got += myGot;
    detail.push({ dim: q.dim, sel: a, ok: ok, got: myGot });
  });

  var c = Cert.get();
  var best = c.exam && c.exam.got > got ? c.exam.got : got;
  Cert.patch({
    exam: {
      got: Math.round(best * 10) / 10, thisGot: Math.round(got * 10) / 10,
      full: 50, detail: detail, at: nowISO(), attempts: (c.exam ? (c.exam.attempts || 1) + 1 : 1),
      min: Math.max(1, Math.round((Date.now() - EX.t0) / 60000))
    }
  });
  clearInterval(EX.timer);
  logEvent('cert_exam_submit', 'got ' + got + '/50');
  location.hash = '#certresult';
}

/* ============================================================
   认证结果：逐题回顾 + 四条件
   ============================================================ */
function renderCertResult() {
  var r = Cert.judge();
  var ex = r.obj.ex;
  if (!ex) { location.hash = '#cert/s1'; return; }
  var cur = ex.detail;
  var review = QUIZ.items.map(function (q, i) {
    var d = cur[i] || {};
    var mineTxt, rightTxt;
    if (q.type === 'multi') {
      mineTxt = (d.sel && d.sel.length) ? d.sel.map(function (x) { return 'ABCDE'[x]; }).join('') : '—';
      rightTxt = q.a.map(function (x) { return 'ABCDE'[x]; }).join('');
    } else {
      mineTxt = (d.sel >= 0 && d.sel !== undefined) ? 'ABCDE'[d.sel] : '—';
      rightTxt = 'ABCDE'[q.a];
    }
    return '<div class="qr"><div class="qrt">' + (i + 1) + '. ' + esc(q.q) + '</div>'
      + '<div class="qra"><span class="' + (d.ok ? 'ok' : 'no') + '">你的答案：' + mineTxt + '</span>'
      + '<span class="ok">正确答案：' + rightTxt + '</span>'
      + '<span style="color:var(--muted)">' + (d.got || 0) + ' / ' + q.s + ' 分</span></div>'
      + '<div style="font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:8px">' + esc(q.why) + '</div></div>';
  }).join('');

  document.getElementById('app').innerHTML = '<div class="shell">' + topbar('用户思维 · 成绩') +
    '<div class="wrap"><div class="crumb"><button onclick="location.hash=\'#cert\'">认证</button><span>/</span><span>考试结果</span></div>' +
    '<div style="max-width:820px;margin:0 auto">' +
    '<div class="score-hero ' + (r.obj.got / 50 >= 0.7 ? 'pass' : 'fail') + '">' +
    '<div class="big">' + ex.thisGot + '<small> / 50</small></div>' +
    '<div class="lbl">本次客观题得分　（取最高分 ' + ex.got + ' 分，第 ' + ex.attempts + ' 次作答）</div></div>' +
    '<div class="card"><div class="ch2"><h3>子项得分</h3></div><div class="cb">' +
    Object.keys(r.obj.dims).map(function (k) {
      var d = r.obj.dims[k];
      return '<div class="dimrow"><div class="dn">' + esc(d.name) + '</div>'
        + '<div class="dbar"><i style="width:' + d.rate + '%;background:' + (d.rate >= 60 ? '#0f7b5f' : '#c0392b') + '"></i></div>'
        + '<div class="dv">' + d.got + '/' + d.full + '　' + d.rate + '%</div></div>';
    }).join('') + '</div></div>' +
    '<div class="card"><div class="ch2"><h3>逐题回顾</h3><span class="tag">红色为未得分</span></div>' +
    '<div class="cb"><div class="qreview">' + review + '</div></div></div>' +
    '<div class="btnrow">' +
    '<button class="btn line" onclick="location.hash=\'#certexam\'">再考一次</button>' +
    '<button class="btn" onclick="location.hash=\'#cert/s1\'">返回阶段认证</button></div>' +
    '</div></div></div>';
  window.scrollTo(0, 0);
}

/* ============================================================
   作品集：两件，结构化填写
   ============================================================ */
var PF = { a: [], b: { q: [], obs: [] } };

function renderPortfolio() {
  var c = Cert.get();
  var pf = c.portfolio || {};
  PF.a = (pf.a && pf.a.length === 5) ? pf.a.slice() : ['', '', '', '', ''];
  PF.b = { q: (pf.b && pf.b.q && pf.b.q.length === 3) ? pf.b.q.slice() : ['', '', ''],
           obs: (pf.b && pf.b.obs && pf.b.obs.length === 3) ? pf.b.obs.slice() : ['', '', ''] };

  var Q5 = ['谁在用', '在什么条件下', '为完成什么', '现在怎么绕过', '不做会怎样'];
  var PH = ['岗位 + 职级 + 人数（是否外包/兼职）',
            '一次观察或跟班记录：时间、场地、是否被打断',
            '他要交付的那个动作，以及截止时间',
            '具体的文件名 / 群名 / 台账名，越具体越好',
            '后果、承担者、时限'];
  var aRows = Q5.map(function (q, i) {
    return '<div class="pfr"><div class="pfl">' + (i + 1) + '. ' + q + '</div>'
      + '<textarea class="inp pft" data-k="a" data-i="' + i + '" rows="3" placeholder="' + PH[i] + '">'
      + esc(PF.a[i]) + '</textarea></div>';
  }).join('');

  var qRows = [0, 1, 2].map(function (i) {
    return '<div class="pfq"><div class="pfl">主问题 ' + (i + 1) + '（问最近一次具体事件）</div>'
      + '<textarea class="inp pft" data-k="q" data-i="' + i + '" rows="2" placeholder="例如：上一次你觉得这一步麻烦，是哪天？当时在做什么？">' + esc(PF.b.q[i]) + '</textarea>'
      + '<div class="pfl" style="margin-top:6px">配套追问（至少 2 条）</div>'
      + '<textarea class="inp pft" data-k="q2" data-i="' + i + '" rows="2" placeholder="能举个最近的例子吗 / 当时你怎么做的 / 后来怎么解决的">' + esc(PF.b.q['x' + i] || '') + '</textarea></div>';
  }).join('');

  var obsRows = [0, 1, 2].map(function (i) {
    return '<div class="pfr"><div class="pfl">第 ' + (i + 1) + ' 条记录</div>'
      + '<textarea class="inp pft" data-k="obs" data-i="' + i + '" rows="2" placeholder="格式：时间｜他在做什么（动作）｜打断或绕行（来源）">'
      + esc(PF.b.obs[i]) + '</textarea></div>';
  }).join('');

  var rev = c.review;
  var revBox = rev ? '<div class="note" style="background:#eef7f2;border-color:#bde3d2"><div class="nl" style="color:#0f7b5f">已评审：'
    + Cert.port().got + ' / 40 分</div><p>' + (rev.note ? esc(rev.note) : '评分明细见管理端。') + '</p></div>' : '';

  document.getElementById('app').innerHTML = '<div class="shell">' + topbar('用户思维 · 作品集') +
    '<div class="wrap"><div class="crumb"><button onclick="location.hash=\'#cert\'">认证</button><span>/</span><span>作品集</span></div>' +
    '<div style="max-width:820px;margin:0 auto">' +
    '<div class="hero"><h2>作品集 · 2 件 / 40 分</h2>' +
    '<p>作品集占认证总分 40%，由管理员按 4 个维度逐项评分，每项 0–5 分。两件作品都来自你手上的真实需求，' +
    '不要写课程里的示例。</p></div>' + revBox +
    '<div class="card"><div class="ch2"><h3>作品 A · 场景还原五问卡</h3><span class="tag">20 分</span></div><div class="cb">' + aRows + '</div></div>' +
    '<div class="card"><div class="ch2"><h3>作品 B · 深访提纲与观察记录</h3><span class="tag">20 分</span></div>' +
    '<div class="cb">' + qRows + '<div style="height:14px"></div>' + obsRows + '</div></div>' +
    '<div class="btnrow">' +
    '<button class="btn" id="pf-save">保存并提交</button>' +
    '<button class="btn line" onclick="location.hash=\'#cert/s1\'">返回</button></div>' +
    '</div></div></div>';

  document.querySelectorAll('.pft').forEach(function (el) {
    el.oninput = function () {
      var k = el.dataset.k, i = +el.dataset.i;
      if (k === 'a') PF.a[i] = el.value;
      else if (k === 'q') PF.b.q[i] = el.value;
      else if (k === 'q2') PF.b.q['x' + i] = el.value;
      else if (k === 'obs') PF.b.obs[i] = el.value;
    };
  });

  document.getElementById('pf-save').onclick = function () {
    var emptyA = PF.a.filter(function (x) { return !x.trim(); }).length;
    var emptyB = PF.b.q.filter(function (x) { return !x.trim(); }).length
      + PF.b.obs.filter(function (x) { return !x.trim(); }).length;
    if (emptyA || emptyB) {
      if (!confirm('还有 ' + (emptyA + emptyB) + ' 项没填，提交后管理员会按空缺评分。仍要提交？')) return;
    }
    Cert.patch({ portfolio: { a: PF.a, b: PF.b, at: nowISO() }, review: null });
    logEvent('portfolio_submit');
    toast('已提交，等待管理员评审');
    setTimeout(function () { location.hash = '#cert/s1'; }, 600);
  };
  window.scrollTo(0, 0);
}
