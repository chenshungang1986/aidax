window.PRACTICE = window.PRACTICE || {};
Object.assign(window.PRACTICE, {"g_m3_1":[{"q":"业务方问「大家为什么不用新系统」。按本课分界线，这个问题该怎么做？","o":["发一份满意度问卷，用分数定位原因","先做访谈还原绕行的具体动作","拉埋点看使用率，从数里找原因","做一次 A/B 测试比较新旧版本"],"a":1,"why":"「为什么」定量答不了，数只给事实不给机制。满意度分数、使用率、A/B 都只能告诉你「是什么、有多少」，说不出「为什么」。要补机制得回到模块二的定性，去现场看具体那一次绕行动作，别指望从数里翻出原因。"},{"q":"下列哪个问题最适合用定量方法回答？","o":["用户为什么绕到 Excel 里做台账","退回单集中在哪些岗位和时段","「好用」在同事心里到底指什么","下一步系统该优先改哪个环节"],"a":1,"why":"「集中在哪些岗位和时段」是分布问题，交叉表一拉就出来，属于四类可量化问题。「为什么绕行」和「好用什么意思」是机制与概念，数答不了；「该先改哪个」是决策，要先有判断再谈，不是问卷能直接给的。"},{"q":"把审核岗按是否培训分两组，发现培训组退回率低 12 个点。更稳妥的结论是：","o":["培训有效，应马上全面推广","这是相关，先查两组单子结构是否可比","退回率下降说明字段口径已对齐","样本分组已够，可直接写进立项报告"],"a":1,"why":"两个数一起动只是相关，不说明谁带动谁，培训组可能本来就只接简单单子。直接推广是跳到方案，断言字段对齐是硬编因果，写进立项报告更是把没验证的相关当结论。先查结构可比性，才是该补的那一步。"},{"q":"「系统好不好用」这类需求，为什么不适合一上来就发问卷？","o":["因为样本量一定不够，分数没意义","因为「好用」概念没定义，等于替用户先定了","因为同事填问卷普遍不认真，数据脏","因为满意度题必须放问卷末尾才有效"],"a":1,"why":"这是「概念未定义」，属定性先行三种情形之一，问卷会用自己的定义收分。样本量够不够是后面几节的事；填答认不认真是执行问题；满意度放末尾是题型顺序，都绕开了「概念还没拆成可观察动作」这个根子。"},{"q":"某协同模块场景还没摸清就发问卷，人均填答 41 分钟、34% 中途退出。最该先补的是：","o":["把问卷缩短一半，提高完成率","加一道 NPS 题提升专业度","先去现场弄清谁在哪个环节用","换 7 点量表让打分更精细"],"a":2,"why":"根因是场景不清楚，连发给谁、问几题都没定，属于定性先行。缩短问卷、加 NPS、换量表都是在「问卷已经该发」的前提下打磨工具，不改变框架缺失；人填到一半走，正是题目问不到点上的信号。"}],"g_m3_2":[{"q":"某系统后台 27 个账号，9 个共用、4 个已离职未回收。界定总体时最该做的是：","o":["按 27 个账号直接作为总体人数","只算在职在岗、且能对应到活人的操作者","把 9 个共用账号各算作一个独立用户","把 4 个离职账号也算进来凑够样本"],"a":1,"why":"一个账号不等于一个人，共用账号背后是好几个人，离职未回收的已不在当前用户里。按 27 发分母从第一步就错；把共用账号当独立用户、把离职账号算进来凑数，都是拿现成名单偷懒，没写那句「谁算用户」的界定。"},{"q":"关于概率抽样和非概率抽样，下面哪句是对的？","o":["配额抽样能给全公司算误差范围","概率抽样的价值是能估误差、能外推","非概率抽样数据可以直接写「全公司 34%」","B 端名单有洞，反而更适合简单随机抽样"],"a":1,"why":"只有概率抽样每个个体有已知被抽中概率，才能算误差范围、外推全体。配额给不了这句话，写「全公司百分之多少」是把线索冒充结论；名单全是洞时恰恰做不了随机抽样，只能老实承认用的是配额。"},{"q":"某采购域按部门人数等比例发问卷，结果漏了三个人的边缘岗。这个错法是：","o":["总体界定没写清离职怎么处理","配额按人数发，把音量给了人多的部门","预测试人数不够，题目没验过","用了概率抽样却没算置信度"],"a":1,"why":"配额要看处境不看人数，等比例发让人多的部门占满样本，人少但问题集中的边缘岗整类漏掉。总体界定、预测试、置信度都是别的环节；这里错在分层维度选错，把「人数」当成了「结构」。"},{"q":"某协同审批模块只有 18 个活跃账号，横向分组都不够。最合适的补救是：","o":["拉不相关兄弟部门的人进来凑样本","盯这 18 人连续四周，用时间换观测点","按花名册做一次简单随机抽样","只访最熟练的两位，深挖操作细节"],"a":1,"why":"这是「时间序列代替横截面」，18 人四周就有 72 个观测点，趋势能看出来。拉不相关的人会把没用过系统的算进分母、数据更脏；总体才 18 人随机抽样没意义；只访两位熟练工是接口人偏差，覆盖不了边缘处境。"},{"q":"内部系统抽样时，最隐蔽、也最容易让结论只听到「留下来的人」的错法是：","o":["名单只从系统后台导，绕行者不在名单上","配额表多留了一格给低频用户","预测试时没有记录填答耗时","问卷里没放 NPS 整体推荐题"],"a":0,"why":"后台名单里只有「用过系统的人」，已绕到 Excel、微信、纸质台账的人根本不在，从名单上永远抽不到，结论自然只剩留下来的那批人。多留低频格是对的；预测试耗时、NPS 位置是别的环节，都不造成「整类人缺席」这种系统性漏抽。"}],"g_m3_3":[{"q":"关于置信度和误差，下面说法最准确的是：","o":["置信度越高，所需样本量反而越少","误差减半，样本量约翻四倍","这两个参数有行业统一默认值可照抄","误差大小只影响问卷题目数量"],"a":1,"why":"误差是平方关系，从 10% 收到 5%，样本量差不多翻四倍，真正贵的是压误差。置信度从 90% 提到 95% 样本量是增加不是减少；两个参数要按「这个数拿来做什么决定」定，没有统一默认值；误差影响的是样本量，不是题目数。"},{"q":"总体 200 人、95% 置信度、±5% 误差，查大总体表得 380 份。正确做法是：","o":["照 380 份发，借兄弟部门的人也要凑够","做有限总体校正，约 132 份有效即可","降到 90% 置信度，好把发放量压下来","改按回收率 100% 反推，只发 132 份"],"a":1,"why":"大总体近似面对的是几万人，内部系统只有 200 人，要打折，约 132 份就够。硬凑 380 份物理上发不到还污染分母；为了少发而擅自降置信度是把业务口径当儿戏；按 100% 回收率反推是忘了还有回收率这一层。"},{"q":"200 人总体发 200 份问卷，只回收 41 份，且多是有意见或有空的人。最该认同的判断是：","o":["全量发放最准，结论可外推全公司","样本量已超 132，可以放心写报告","这是系统性偏差，不如做 12 个分层深访","再群发催填一轮，回收率到 60% 就好"],"a":2,"why":"只回 41 份且结构失衡，回来的不是随机样本，是最有意见和最闲的人，这是算不出来的系统性偏差，能问出「为什么」时不如 12 个深访。全量不等于准、样本量看的是有效回收不是发出去的数量；群发催填催来的还是同一批愿配合的人，偏差不动。"},{"q":"把填问卷写进月度考核后，回收率冲到 90%，却几乎全是「满意」。这个方案错在：","o":["把回收率当成目标，逼出来的是服从不是回答","没做预测试，题目措辞还有歧义","置信度定得太低，分数不够稳","没有加 NPS 题，收不到推荐意愿"],"a":0,"why":"回收率只是手段，要的是真实、有分布、能指到具体环节的回答，用考核逼出来的是服从，白搭两周还损耗信任。预测试、置信度、NPS 都是问卷设计里的其他环节，跟「用考核换回收率」这个根子上的错无关。"},{"q":"样本量少、和回收率低，两者最本质的区别是：","o":["样本少算得出误差，不回应偏差算不出","样本少必须重发，回收率低可以不管","两者都只要提高置信度就能解决","回收率低只影响开放题，不影响打分题"],"a":0,"why":"样本少只是区间宽，查表能估出误差、标一句就行；不回应是系统性偏差，谁没回来算不出来还容易以为有数。重发、提置信度都治不了偏差；回收率低会让整份数据偏，打分题同样受影响，不是只坑开放题。"}],"g_m3_4":[{"q":"「您觉得系统是否稳定且好用」这道题最根本的毛病是：","o":["量表点数太少，该换 7 点","双重问题，一题缝了两个变量","没放在问卷末尾，顺序不对","缺一个「其他请注明」选项"],"a":1,"why":"稳定和好用是两个能分别评价的变量，用「且」缝在一起，回答者感受不一致时只能打个模糊分，拆不开。换点数只是把模糊分切细，挪位置、加选项都不改变「一题两变量」这个根子，收上来的分照样没法用。"},{"q":"下列哪道题属于诱导性提问？","o":["过去一个月你遇到几次报错或卡顿","我们大幅提速的新系统，您是否满意","填一张单子大概需要几步完成","与上一版相比，填单耗时属于哪一档"],"a":1,"why":"「大幅提速」已经替回答者下了一半结论，收上来的分是被题目推着走的，属于把答案塞进题目。其余三问都只问事实或中性的时间档，没有预设「好」或「提升」，让人能如实选，不替系统说好话。"},{"q":"选项「1 到 3 次」「3 到 5 次」最主要违反了哪条铁律？","o":["避免诱导，选项里带了倾向词","选项互斥，正好 3 次的人卡在两档","单一变量，一题问了次数和满意度","预测试不足，没发现档位问题"],"a":1,"why":"两档在「3 次」处重叠，正好 3 次的人只能随便选，频次统计就歪了，违反的是互斥。这不是诱导、也不是一题两变量，改成「1 到 3 次」「4 到 6 次」就干净；预测试能帮着发现，但错本身出在选项设计。"},{"q":"内部问卷漏了「我现在不用这套系统」这个选项，后果最可能是：","o":["问卷显得太短，专业度不够","绕行的人被逼着替系统打满意度分","NPS 没法放末尾，顺序乱了","样本量不足，误差算不出来"],"a":1,"why":"这违反选项穷尽。费控那轮 31% 早已绕到 Excel 的人没位置可选，只能在满意 / 不满意里硬投，给系统一堆不属于他们的分。和问卷长短、NPS 位置、样本量都无关，加这一项后这批人才能被分流到该去的路径。"},{"q":"关于 5 人预测试，下面哪句是对的？","o":["5 人太少，至少凑 30 人才科学","主要看分数均值，先出一版结论","看有没有人卡在某道题、哪个词听不懂","重点验证置信度够不够、能否外推"],"a":2,"why":"预测试是找题病不是出结论，5 人足够把八成措辞问题炸出来，盯的是停顿、反问、填答耗时和逻辑跳转。凑 30 人、盯分数、验置信度都把预测试当成了小样本调研，方向就反了——它验的是题目，不是数据。"}],"g_m3_5":[{"q":"内部系统小调研把满意度从 5 点换成 7 点，最可能出现的结果是：","o":["精度明显提升，趋势线更平滑","多出的格子成噪声，前后分数还不可比","回收率大幅上升，大家更愿意填","NPS 和满意度终于可以直接互相换算"],"a":1,"why":"同事抽空填答，对「有点同意」「比较同意」没有稳定区分，多出的格子是抖动不是精度；换量表还会让前后两年分数断掉、没法比。它不会提升回收率，NPS 测的是推荐意愿，本来就不能和满意度换算。"},{"q":"让同事给 9 个待建功能排重要性，收回来的数据最可能的问题是：","o":["后六位基本是随手拖的，顺序近乎随机","大家会过度集中选第一个，出现趋同","7 点量表不够，该换 MaxDiff","排序题给不出「差多少」，所以完全没用"],"a":0,"why":"排序题选项超过 6 个，人只认真排头三个，后面全是噪声，照均值排路线图等于拿随机数定优先级。趋中不是主要问题；该做的是先多选筛到 6 个再排，不是直接上更贵的 MaxDiff；排序题虽不给「差多少」，排对了仍有相对次序价值。"},{"q":"关于 MaxDiff 最大差异法，最准确的判断是：","o":["任何内部小调研都该默认用它","选项多、要定资源分配时才值得上","它题量小、设计简单，最省时间","它能顺带解释用户为什么这样选"],"a":1,"why":"MaxDiff 逼人取舍、优先级稳，但题量大、设计复杂、样本要求高，只有这批选项要拿来定资源分配或半年路线图时才值。小调研默认上它是杀鸡用牛刀；说它省时间正好反了；它给的是相对权重，同样不解释「为什么」。"},{"q":"NPS 题在内部问卷里的正确放法是：","o":["放第一道，先拿一个整体印象分","放末尾，不加解释性前缀","放中间，前面垫一段系统优化介绍","和满意度题合并成一道，少占一题"],"a":1,"why":"NPS 问整体推荐意愿，得让人先想过具体环节再答，且不能垫「我们做了很多优化」这类诱导前缀。放开头答的是第一印象，垫介绍是诱导，和满意度合并会把两个不同的数缝在一起，都让这个数变成客气话。"},{"q":"把满意度题从问卷第一道挪到行为事实题之后，均值从 4.2 掉到 3.8。说明：","o":["系统那几天确实变慢了，体验下降","先想了具体卡住的事，打分更实在","7 点量表比 5 点量表更敏感","回收率变化把均值拉低了"],"a":1,"why":"一上来问「满意吗」会给整份问卷定情绪基调，后面具体题被第一印象带着走；先答行为事实让人回到具体场景，打分就实了。系统没变、量表没换、也没动回收率，变的只是题目顺序，这正是锚定效应。"}],"g_m3_6":[{"q":"SRM 门户满意度 4.2 分、使用率 31%、68% 月登 1 次。最不该做的是：","o":["查使用是不是被月度对账强制的","看满意度测的是「能用」还是「好用」","看到 4.2 分就判定体验良好并结项","查那 68% 的人有没有进问卷样本"],"a":2,"why":"三个数打架时先查各自测的是什么，直接认 4.2 分是把态度当体验：门户只在月度对账被强制打开，人家评价的是「能用」不是「好用」。查强制、辨能用好用、看谁没被问到，都是三步判断法里该做的，唯独跳到结项是错的。"},{"q":"内部系统四个核心行为指标里，最难从后台拿到、却最说明问题的是：","o":["登录频次，看人来得多不多","任务完成时长，看一单办多久","退回率，看多少单被打回重做","绕行率，看多少动作跑去系统外"],"a":3,"why":"前三个后台能导，绕行率记的是跑去 Excel、微信、纸质台账的动作，埋点看不到系统外，得靠现场观察和工单补，而它恰恰是内部系统真正的体检结果。登录频次还最容易被制度推高，最不能单独当体验看。"},{"q":"门户只在月度对账被强制使用，据此最该得出的结论是：","o":["使用率是流程强制力，不是体验指标","满意度 4.2 分说明界面设计到位","应加大培训，让供应商天天来登录","该把 UI 改版成工作台样式提活跃"],"a":0,"why":"使用强度由对账流程决定，31% 和 68% 描的是「这是个对账工具」，不是体验好坏。把 4.2 分归功界面、发培训、改首页，都是把流程问题当成推广或观感问题办，当时那轮培训加改版就是这么白花的，使用率一动没动。"},{"q":"一份费控报表没剔测试账号、管理员、批量导入，最可能的后果是：","o":["登录频次虚高，误判成「大家用得勤」","退回率被拉低，漏掉字段口径问题","中位数被长尾拉高，均值反而变准","绕行率被算进后台，反而更完整"],"a":0,"why":"测试账号一天点几百下、管理员进出几十倍、一次批量导入被记成 200 次，都会把登录和操作频次整体抬起来，让人误判活跃。退回率、中位数不受这三类直接影响；绕行发生在系统外，后台再怎么算也补不进来。"},{"q":"费控 RFM 分层发现 22%「高活跃低深度」，每天只点审批待办。它主要说明了：","o":["整体日活健康，可照原路线优化报表","均值把一批动机不同的人盖住了，要看分布","这批人不会用查询功能，该补培训","PC 端报表方向正确，只是入口要挪"],"a":1,"why":"单看整体活跃度这 22% 被平均得干干净净，分层才看出他们是审批人、真实需求是手机上 30 秒处理待办，而当时路线图在优化 PC 报表，一个对他们没用的方向。说日活健康、补培训、挪入口，都还在拿整体或自己的方案去套，没让被忽略的需求显形。"}],"g_m3_7":[{"q":"平均审批时长 2 天、中位数 4 小时、长尾由 3 个节点造成。最该先做的是：","o":["立项把平均时长从 2 天压到 1 天","查那 3 个卡住的节点卡在哪一步","给全体审批人做一轮提速培训","按均值给各基地排名并追责"],"a":1,"why":"多数单子 4 小时就走完，均值被 3 张压了十几天的单子拉高，问题在那几个特殊节点。压均值、做培训、按均值排名，都是拿被长尾污染的数当事实，力气花在多数本来就不慢的单子上，指不到真正该改的地方。"},{"q":"满意度样本从后台活跃账号里抽，结论「留存用户满意度稳步上升」。这最可能是：","o":["均值掩盖分布，该补报中位数","幸存者偏差，放弃的人不在样本里","辛普森悖论，分组结论和整体相反","相关非因果，误把一起动当因果"],"a":1,"why":"系统越难用、走的人越多，留下来的越是能忍的，满意度自然上升，而彻底绕走的人一个都没进样本，是把「留下来的人」当成「所有人」。补中位数是均值陷阱，分组反转是辛普森，把相关当因果是第四类，都对准了别的陷阱。"},{"q":"整体看 A 基地退回率低于 B，拆到每个岗位 A 都更高。最该先查的是：","o":["两基地单子结构是不是不一样","是不是有几张单子卡了十几天","问卷是不是漏了「不用系统」项","埋点有没有混进测试账号"],"a":0,"why":"这是辛普森悖论，整体和分组结论相反，多半因为 A 的简单单子占大头，把结构差异当成了能力差异，比较前先对齐结构。查长尾单子是均值陷阱，漏选项是问卷铁律，混测试账号是埋点口径，都治不了结构不一致。"},{"q":"「培训组退回率低」，于是全面推广培训，一个季度后退回率没动。错在：","o":["把相关当因果，没补上机制","样本量没做有限总体校正","量表从 5 点换成了 7 点","NPS 题放错了位置"],"a":0,"why":"两个数一起动只是相关，很可能是单子简单的人才有空培训，数不说明谁带动谁；根因其实是字段口径没对齐，跟培训无关。总体校正、量表点数、NPS 位置都是别的环节，跟「从相关一步跨到方案、没补机制」这个错无关。"},{"q":"SRM 的 4.2 分、费控的 22%、审批的 2 天，三个案例栽在同一件事上，是：","o":["只看了一个数，没看它背后站着哪些人","都没做预测试，题目措辞有歧义","都用了 7 点量表，分数不可比","都把 NPS 放在了问卷开头"],"a":0,"why":"三个案例的共同点是拿一个现成好看的数直接当结论：4.2 分没问是谁打的、22% 被整体活跃度平均掉、2 天被 3 个节点拉高，都是没看分布、没看谁没被算进去。预测试、量表点数、NPS 位置都只是问卷设计细节，不是这三处翻车的根子。"}],"g_m4_1":[{"q":"一个职能域的新系统还没上线、也没有埋点，团队要定「谁在用」。以下哪份材料最适合作为角色画像的依据？","o":["后台导出的操作日志与页面停留时长","岗位说明、权限矩阵与流程图","一份配照片的原型人物海报","按年龄司龄切好的分层统计表"],"a":1,"why":"角色画像靠制度、岗位、流程这类稳定证据，组织结构稳定就能切人。后台日志是新系统拿不到的埋点数据，海报是原型画像接不住设计决策，年龄司龄选了不改变任何设计的维度。"},{"q":"关于三类画像的适用阶段，下列说法最准确的是？","o":["原型画像适合直接拿进评审定字段","数据画像适合任何阶段的全新系统","角色画像适合需求定义与评审阶段","三类画像可以互相替代，任选一种"],"a":2,"why":"原型画像早期用来立概念，一到设计决策就该退场；数据画像要有埋点的存量系统；三类是不同阶段的工具不能互相替代。拿原型定字段、给新系统跑数据画像、任选一种，都是用错阶段。"},{"q":"某人力系统上线两年、埋点齐全，团队想验证「审核员最卡在查历史付款」这句访谈结论。最该做的是：","o":["再补一版更细的原型人物画像","按性别把审核员重新分成两类","把这句话写进画像当作既定结论","去后台日志看那一页平均停留与退出"],"a":3,"why":"数据画像的正确位置是校验角色画像：把访谈里的判断拿去日志里对，对不上回去改画像不是改数据。补原型、按性别分层都停在错的阶段，写进画像当结论让判断不可验证。"},{"q":"一套证明开具系统做了一版配照片、写一天生活的画像，评审时没人用它定「在职证明字段是否必填」。最可能的根因是？","o":["把原型画像用在了需要设计决策的阶段","照片不够精美，人物不够有代入感","访谈样本太少，应该再访十个人","没给这张画像配上后台埋点数据"],"a":0,"why":"原型画像的证据是生活细节，回答不了字段该不该必填这种岗位层面的决定，这是用错阶段，不是做得不够细。加照片、加访谈、贴埋点都是在错的阶段上继续加料。"},{"q":"为什么职能域优先做角色画像，而不是消费端常见的原型画像？","o":["因为内部同事不爱被起名字配照片","因为组织结构稳定、角色边界清楚","因为角色画像做起来比原型画像快","因为后台埋点在内部系统里都不准"],"a":1,"why":"内部系统被使用不被选择，诉求长在岗位身上而非个人性格上，按岗位就能稳定切人且能接设计决策。不爱配照片、做得快、埋点不准都不是判据，也没说到根上。"}],"g_m4_2":[{"q":"下面四个画像维度，哪一个最符合「只选能改变设计决策的维度」？","o":["每单处理量，区分日均六十单与一天三单","报销人的年龄段，分年轻与资深两类","报销人的性别，分男同事与女同事两类","办公所在楼层，分高区与低区两类"],"a":0,"why":"维度只留能改设计的：处理量不同，批量功能与字段必填就不同。年龄、性别、楼层切完两类走的还是同一套必填字段，做不出不一样的设计，属于该删掉的维度。"},{"q":"五步构建法里，「数据来源盘点」这一步的最小产出应该是什么？","o":["一份写好名字和故事的人物卡","一张分好四到六组的角色清单","一张标了出处的来源清单，空格也留着","一份能直接进评审的最终画像"],"a":2,"why":"盘点的产出是带空格的清单：每样来源能答哪个问题、覆盖哪些岗位、上次何时更新，空格是下一步要补的访谈。人物卡是命名叙事、分组是聚类、最终画像都不是这一步的产出。"},{"q":"给一组用户起名字，下面哪一个最符合本课的命名标准？","o":["效率追求者，听着专业又好记","天天填单的人，一出口就指向步数","数字化先锋，体现转型方向","温和务实型，概括性格特质"],"a":1,"why":"好名字念出来大家就知道该拿它做什么决定，「天天填单的人」直接指向字段和步数。其余三个都是形容词或性格标签，谁也不知道该改哪，属于只有标签没有行为。"},{"q":"画像拿去找真实同事核对，被当场推翻了一条。按第五步「校验与迭代」，正确做法是？","o":["把那条删掉，卡片保持干净不留痕","解释给他听，说服他接受我们的判断","当作个体特例，不影响整体画像","改掉那条，并在卡角记下被谁何时否了"],"a":3,"why":"校验要专找反例，被推翻的当场改，并记一笔「某月某日被谁否了」，画像才能一次比一次少错、三个月后说得清改过什么。删掉不留痕、说服对方、当特例，都让画像退回没人负责的海报。"},{"q":"一套画像的故事和名字都写完了，才发现维度选的是年龄。按本课，这次返工的根子是？","o":["第二步维度没过判据，把后面全带偏了","第四步名字起得不够有代入感","第五步校验找的同事不够多","第三步聚类分出的组数太少"],"a":0,"why":"维度选错，聚出来的组、起的名字、写的故事全跟着错，越往后发现拆起来越贵，所以返工最多的是第二步。名字、校验人数、组数都不是这次推倒重来的原因。"}],"g_m4_3":[{"q":"B 端画像四层里，最关心「三年后能不能倒查到当时口径」的是哪一层？","o":["使用者，因为天天在系统里点","管理者，因为要背差错率指标","监管者，因为看留痕与合规","决策者，因为要算投入产出"],"a":2,"why":"监管者只设底线、看留痕与合规，平时不出现却能一句「不可追溯」否掉方案。使用者看动作频次，管理者看指标考核，决策者看投入产出，三者都不问三年后怎么倒查。"},{"q":"以下哪一类人最符合本课说的「影响者」？","o":["信息安全，不产需求却能因跨库否掉字段","一线报销人，天天提交单量最大","共享中心主管，背着人均单量考核","分管领导，负责批预算和立项"],"a":0,"why":"影响者不在四层里、不产生日常需求，却能一句话否掉你，比如架构或信息安全以数据存储为由叫停字段。其余三个分别属于使用者、管理者、决策者，都在四层内。"},{"q":"费控系统里「谁都不得罪、字段加满人人留痕」的方案，后来一线绕回 Excel、审核也没少退。它最根本的问题是？","o":["字段还是不够多，应该再加几格","一线培训没跟上，不会用新字段","没给主管的人均单量做配套激励","把四层互斥的诉求当成可全满足的愿望"],"a":3,"why":"四层诉求结构性互斥：字段越多审核越省事、一线越费时，全满足等于没判断。加字段、补培训、做激励都在这个错前提上打补丁，只有给出「为谁优化、代价谁担」的裁决才解。"},{"q":"四层对某字段争执不下，按本课的判据，听谁的应该主要看什么？","o":["谁的级别高，谁的意见就是结论","这个字段影响谁的动作、谁承担后果","谁在评审会上把理由说得最完整","哪一层的人数在系统里占最多"],"a":1,"why":"判据是后果归属不是级别高低：按字段把每层后果各写一行，才看得见谁的动作被改、谁去解释、谁设底线。按级别、按口才、按人数，都会漏掉真正承担代价的那一层。"},{"q":"要把四层加影响者真正用起来，下面哪种落点最对？","o":["给五类人各做一张独立的人物卡","按部门分别写一段画像贴墙","按争议字段把每层后果各写一行","只访使用者，把一线话当全场结论"],"a":2,"why":"别按人分卡、按字段分行，写不出的格子就是这层没责任人的地方。四张孤立海报各写各的定不了事，只访一线会漏掉背指标和设底线的人，按部门分卡又退回讨好四类人。"}],"g_m4_4":[{"q":"核心／边缘的三条判据里，本课给的权重最高的是哪一条？","o":["使用频次，用得越多越核心","不可替代性，离了他会不会断","价值贡献，看创造多少价值","登录时长，在线越久越重要"],"a":1,"why":"不可替代性占一半、价值贡献三成、频次只两成，因为职能域里频次高常只说明活儿碎，不说明关键。把频次或登录时长当主体，正是把后台登录榜代替判断。"},{"q":"内审一年查一次、监管报送一季度一次，按本课应怎么判？","o":["频次太低，统一划为边缘用户","先做访谈，答得上来才算核心","看他们配不配合评审再定","低频但不可替代性高，判为核心"],"a":3,"why":"低频不等于边缘，内审拿不出留痕那年就过不去、报送错一次要重报，一次不来就办不成，属低频高不可替代。按频次划走、或等访谈和配合度再定，都会把最能让你返工的人删掉。"},{"q":"判定结果用到「灰度范围」时，下面哪一种做法最对？","o":["逐个点名核心角色，低频的也占名额","按登录活跃度拉前二十个用户","只放天天用系统的高频用户","等上线后再把低频角色补进名单"],"a":0,"why":"灰度名单不能只按活跃度圈，得把核心逐个点名，尤其供应商、内审、合规这些低频却一票否决的，采购域那次返工就吃亏在漏了供应商协同。按活跃度、只放高频、上线再补都会测不到最要命那段。"},{"q":"「低频高价值」的角色总被误判成边缘，本课点出的最根上的原因是？","o":["这些角色不愿意参加评审","他们操作步数少、不好写画像","把「用得多」直接当成「重要」","后台埋点对这些角色统计不准"],"a":2,"why":"消费端高频确实约等于重度，内部系统却不是被选择的，高频往往是被制度摊派出来的，只说明被摊派得多。名单来自后台、约访按方便排都是表层，根子是把频次当重要性。"},{"q":"本课说「判成边缘」，准确的意思是？","o":["这些用户以后可以不再管了","这次不优先为他优化，不是不用了","他们的需求一律排到明年","把他们从评审名单里删掉"],"a":1,"why":"边缘是资源分配上的「这次不优先」，不是「他不用了」；低频核心照样要点名进灰度。彻底不管、一律排明年、从名单删掉，都会漏掉一次不来就办不成的人，是本节最贵的错。"}],"g_m4_5":[{"q":"画像里写「注重效率、偏好简洁、数字化程度高」，最可能中了哪条反模式？","o":["人口统计学堆砌，因为缺饼图","没有场景，因为没写月结条件","只有标签没有行为，形容词不指向动作","不可验证，因为没挂访谈出处"],"a":2,"why":"三个词全是形容词，谁都同意，可「注重效率」到底该砍字段还是加批量导入能吵出两种改法，盖住标签卡上没有他真做过的事。修法是把每个标签翻译成一句可观察行为。"},{"q":"画像里出现「大多数用户希望系统更智能」，却跟不出任何记录。按本课该怎么处理？","o":["给每条结论挂出处，没有就标「待验证」","把它改写成更委婉的一句评价","再补几个同类形容词让画像更完整","把这句移到附录，正文只留结论"],"a":0,"why":"不可验证最危险在它不能被反驳、也就不能被确认，最后变成谁职位高谁说了算。挂出处、没有就写缺口，才能被单独拎出来对质、才能迭代。改写、加词、挪附录都让结论照样查无实据。"},{"q":"一条痛点是「审核员觉得查历史付款麻烦」，按本课要补的最关键是哪一步？","o":["补一张审核员的照片和姓名","统计这类抱怨一共出现几次","把「麻烦」换成程度更重的词","补什么条件下、为完成什么、卡在哪一步"],"a":3,"why":"没写场景，就不知道该优化查询本身还是月结高峰的批量：月结一天六十单连着来，翻两屏就是几十分钟。补条件、任务、卡点三件套并记下绕去哪，照片、计数、换词都不指向该改哪一步。"},{"q":"给画像补人时，下面哪一类最该被写进去，以避免「理想用户」反模式？","o":["最熟悉系统、用得最顺的老同事","刚入职、只在季度末用一次的人","评审会上发言最积极的接口人","写过需求文档的业务方代表"],"a":1,"why":"理想用户画像里没有会累、会忘、会找捷径的人，描的是希望有的同事；补进外包、新人、跨基地、季度用户这些最不配合的处境，画像才落回地面。其余三类恰恰最容易被驯化、最不暴露绕行。"},{"q":"识别五种反模式，本课给的总判据是哪一句？","o":["画像有没有配齐年龄性别司龄","访谈人数够不够六到八人","递给不知情同事，他能否照着改一个决定","排版是不是一页 A4、六格齐全"],"a":2,"why":"五种反模式共同点是看着完整、落不到决定，所以不背定义，只问照着它能不能改一个具体的设计决定。年龄性别是该删的维度，人数是抽样口径，六格是第六节交付格式，都不是识别反模式的尺子。"}],"g_m4_6":[{"q":"下面哪一项不属于本课说的「画像进评审」的三个正确用法？","o":["判断这一改让哪一组受益、少几步","判断谁受损、代价落到哪一层头上","判断灰度顺序，核心角色先走","判断该功能的开发工作量和排期"],"a":3,"why":"三个正确用法是判断谁受益、判断谁受损、判断灰度顺序，画像告诉你谁得谁失谁先试，不告诉你做什么功能、更不替代排期评估。开发工作量是另一套估算，混进来就把画像当论证用了。"},{"q":"评审会上说「这是给核心用户做的，边缘用户这轮先不收」，这属于哪种错法？","o":["用画像压制反对意见","用画像判断谁受益","用画像判断灰度顺序","用画像主动报出代价"],"a":0,"why":"把不同意见归成「不是目标用户」，看着有方法论，其实是拿画像当免吵金牌；反对的人里常坐着低频却能否决你的内审或合规。判断受益、排灰度、报代价都是正确用法，唯独压反对让分歧消失。"},{"q":"一页 A4 画像卡的六格里，唯一必须由人拍板、不该自动生成的是？","o":["数据来源，写清出处那几格","这次的决定：为谁优化、不为谁优化","关键行为，记系统外的动作","核心／边缘判定与理由"],"a":1,"why":"第六格「这次的决定」是取舍——为谁优化、不为谁优化、谁承担代价、灰度先放谁，必须由人写并负责；AI 一替你写，卡就从判据变回好看的海报。其余五格都是可查证的事实或打分。"},{"q":"按本课的会上用法，提案一摆出来，最该先念出来的是哪半句？","o":["这次让哪一组少了几步","核心用户满意度会提升","这次不为谁优化","界面会比上一版清爽"],"a":2,"why":"先把「不为谁优化」那半句念出来、别藏，再翻行为与场景、主动把代价报出来；主动报代价比被人问出来强，评审最怕代价没主。少几步、满意度、界面清爽都在只报受益不报受损。"},{"q":"画像卡在评审通过后，下面哪种后续做法最符合本课？","o":["锁进柜子归档，当作项目交付物","下个需求另起一张，重新做一遍","把六格扩成六页附全部访谈原文","灰度数据回来核一次，把改动记回卡上"],"a":3,"why":"第六格写的「不为谁优化」对不对，得等灰度数据回来核一次，核完把改动记回卡上，卡才跟着版本走、才是活的。归档锁死、另起炉灶、扩成六页，都让前五节产出断在这一步。"}]});

/* ============================================================
   章节测评题库（每个模块一次，10 题 / 10 分钟 / 答对 6 题过关）
   —— 一半是场景题：给一段真实业务情境，问「下一步该做什么」
   —— 通过后才能解锁下一章
   —— 选项长度已对齐（差 ≤4 字），答案位置由脚本均衡，不要凭长度或位置猜
   ============================================================ */

window.CHAPTER = {

  m1: [
    { q: "某集团财务共享中心上线新的报销系统，三个月后使用率只有 30%，一线继续在 Excel 里维护台账。你是这个系统的产品经理，第一件事应该做：",
      o: ["排查系统性能，把页面加载时间从 2 秒压到 1 秒",
          "找到还在用 Excel 的那批人，问清他们绕开的原因",
          "请管理层发文，把继续用 Excel 台账列为违规操作",
          "把报销单的必填字段全部加满，逼一线只能线上提交"],
      a: 1,
      why: "使用率低的根因通常在需求阶段没还原场景。压性能、下禁令、加必填，都是在「功能已经做了」的前提下打补丁，只会让绕行更隐蔽。先去现场问清绕开的那一步是什么，才知道该改哪里。" },

    { q: "业务方要求给报销单加「预算预警」字段。你发现预算编制在财务、预算执行在业务部门。此时最合适的做法是：",

Object.assign(window.CHAPTER, {"m3":[{"q":"费控系统上线三个月，业务方甩来一句「大家都说难用，你出个数」。作为产品经理，第一件事应该做：","o":["先发一份满意度问卷，一周内收齐","先去现场看绕行的人上次怎么操作","拉埋点使用率，用数定位难用环节","对标同业系统，看别人做成了几步"],"a":1,"why":"「为什么难用」是机制问题，定量答不了。发问卷、拉使用率、抄同业都只能给「是什么、有多少」，说不出「为什么」；最难用的人往往已绕到 Excel，现场才看得到那一次具体绕行动作。顺序是先还原场景，再谈用什么数。"},{"q":"某 HR 系统要做体验调研，总体 200 人。同事打算给全公司 200 人都发问卷。更稳妥的做法是：","o":["照发不误，全量发放一定最准","先定置信度误差，校正后定有效样本","先按部门人数等比例发，覆盖最全","只发给最配合的部门，回收率最高"],"a":1,"why":"全量发放若只回收两成，等于把判断交给不回应偏差；等比例发会把人少但问题集中的边缘岗漏掉；只发配合部门是接口人偏差。正确顺序是定口径、查表、按 200 人做有限总体校正，再按预估回收率反推发放量，盯的是有效回收不是发出去的数量。"},{"q":"满意度问卷收回 41 份，业务方催着写结论。你发现回来的多是有意见或有空的人。下一步该做：","o":["按 41 份直接算均值写进报告","群发催填一轮，把回收率拉到六成","拆一次回收样本分布，看缺了哪格","把置信度提到 95%，让结论更稳"],"a":2,"why":"不回应是算不出来的系统性偏差，最该先弄清「谁没回来」：按岗位、频次拆回收样本，和总体名单比，缺的那格就是偏差方向。直接算均值是把偏样本当结论；催填催来的还是同一批愿配合的人；提置信度改变不了已经偏掉的样本。"},{"q":"复核一份现有问卷，看到「系统是否稳定且好用」「大幅提速后您是否满意」。最该做的修改是：","o":["把两题都改成 7 点量表提精度","拆双重问题，并删掉诱导性形容词","把两题挪到问卷末尾再问一次","加一道 NPS，补足整体评价"],"a":1,"why":"前者是「且」缝起两个变量的双重问题，得拆成两题；后者「大幅提速」是诱导，得删形容词只留中性问法。换点数只是把模糊分切细，挪位置、加 NPS 都不碰这两处根子，收上来的分照样拆不开、还被题目推着走。"},{"q":"费控 RFM 分层后，22% 的人每天登录却只点审批待办，而路线图在优化 PC 报表。你该向评审建议：","o":["维持原路线，整体日活看着很健康","承认这批人需求是手机 30 秒处理待办","给这批人补一轮查询功能培训","把报表入口挪到更显眼的位置"],"a":1,"why":"分层让被均值盖住的需求显形：这批是审批人，要的是移动端快速处理待办，PC 报表对他们没用。维持路线、补培训、挪入口都还在拿整体或自己的方案去套，没让那 22% 说话；原路线图正是「当时看着对、后来证明没用」的那个方向。"},{"q":"下面哪一句最准确地概括「什么问题上定量」？","o":["定量能答「为什么」，定性只答「有多少」","定量答规模分布差异相关，答不了为什么","只要样本够大，定量能答任何业务问题","内部系统用户的「好用」可以直接用分数量"],"a":1,"why":"四类可量化问题是规模、分布、差异、相关性，问的都是「是什么、有多少」；「为什么」和机制交给定性。B 端同事的「好用」概念没定义，直接打分等于替用户先定义；样本再大也补不出机制，定量答不了任何「为什么」。"},{"q":"关于内部系统「总体」的界定，下面哪句是对的？","o":["HR 花名册就是最干净的抽样框","离职、外包、共用、跨系统权限都要交代","一个后台账号就对应一个真实用户","已绕到 Excel 的人自然在后台名单里"],"a":1,"why":"内部系统没有干净名单：离职未回收、外包兼职不在册、多系统权限被数三次、共用账号背后好几个人，都要在总体界定那句话里写清。花名册、一账号一人、绕行者在后台，三者都把「谁算用户」想简单了，绕行的人恰恰不在后台。"},{"q":"样本量速算时，误差从 ±10% 收到 ±5%，最贴近事实的说法是：","o":["样本量约翻四倍，压误差最费样本","样本量减半，因为区间更窄了","只要提置信度，样本量几乎不变","总体越小，需要的样本反而越多"],"a":0,"why":"误差是平方关系，10% 收到 5%，样本量差不多翻四倍；置信度从 90% 到 95% 只是多三成，真正贵的是压误差。说减半、说提置信度不变都反了；总体越小做有限总体校正后需要的样本反而越少，不是越多。"},{"q":"出一份埋点报表前，下列哪项是必须先做的口径处理？","o":["把登录按「次」计，次数越多越好看","剔掉测试账号、管理员、批量导入","把满意度分数并入活跃度一起算","只保留高频用户，样本更整齐"],"a":1,"why":"测试账号一天几百下、管理员几十倍、一次批量导入记成 200 次，混进来登录频次直接虚高，报表会误判「大家用得勤」。按次计、把态度和行为混算、只留高频用户，都会制造新偏差；口径干净了才谈得上和问卷互证。"},{"q":"「平均审批时长 2 天，但没人觉得自己等了两天」，这句反差最该提醒你：","o":["报均值时同时报中位数和分布","把 2 天当作目标，压到 1 天即可","这是相关非因果，别急着推方案","样本量不足，该再多收几份问卷"],"a":0,"why":"中位数 4 小时、长尾由 3 个特殊节点拉出，说明均值被少数卡住的单子污染，报均值必须同时报中位数和分布。拿 2 天立目标是把被污染的数当事实；这里不是相关非因果；也不是样本量问题，再收多少份，均值照样被那 3 张单子拉高。"}],"m4":[{"q":"一套费控系统上线后，一线报销人单均仍要 41 分钟，不少人绕回 Excel 台账；审核员抱怨退回没依据，内审要求三年可追溯。你是产品经理，评审前最该先做：","o":["把争议字段按四层加影响者各写一行后果","按级别请分管领导拍板字段加不加","把字段全砍到最少，先让一线快起来","给四层各做一张人物画像分别陈述"],"a":0,"why":"四层诉求结构性互斥，先按字段把每层后果写清（谁的动作被改、谁去解释、谁设底线），才可能给出「为谁优化、代价谁担」的裁决。按级别拍板会漏一线代价，只砍字段会背上差错率，各写海报定不了事。"},{"q":"你接手一套已有埋点、上线两年的采购系统，要判核心／边缘。后台显示需求提出人天天登录，供应商一年几次，采购合规几乎不出现。下一步最该做的是：","o":["按登录频次把前二十名定为核心用户","把一年几次的角色先归到边缘名单","按价值贡献、频次、不可替代性三条打分","只深访天天在用的需求提出人"],"a":2,"why":"后台名单天然漏掉低频角色，而供应商一次不来影响交付、合规不点头不能签，都是低频高不可替代的核心。按频次排、把低频划边缘、只访高频，都会把最能让你返工的人从名单里删掉。"},{"q":"需求评审会上，有人质疑「凭什么把这个字段改成非必填」。你手里有一张填好的画像卡，最符合本课的做法是：","o":["答「核心用户就是讨厌填单」快速收口","摆出这改让哪组少几步、谁承担代价","把反对者归为边缘用户，这轮不收","翻出人物海报请大家先理解用户"],"a":1,"why":"画像只说明谁受影响、影响多大，不替你回答「所以这么改」，中间因果要摆事实算代价，并把不做的半句、受损的一层主动报出来。替论证、压反对、念人物介绍，三种都没把画像用成判据。"},{"q":"一套给各职能中心用的台账工具，按「用户会认真读提示、按规范填字段」做了画像，砍掉必填校验与导入模板。上线后新人用不起来、老同事先记微信月底粘回。最该回改的是：","o":["补进新人、外包、季度用户的绕行行为","把帮助文档写得更详细一些","给老同事加一次系统操作培训","把界面再做得更干净一点"],"a":0,"why":"这版描的是希望有的同事、不是真会坐下的人，属一厢情愿的理想用户；补进最不配合那类人的绕行，画像才落回地面。加文档、加培训、清界面都在「用户会配合」这个错前提上打补丁。"},{"q":"你为一套还没上线、也没埋点的人力证明系统做画像，有人主张先跑数据画像、有人主张先做配照片的原型海报。按本课，你会怎么定？","o":["先跑数据画像，数字最客观","先做原型海报，评审时最直观","按岗位写角色画像，写清权限与动作","按年龄司龄分层，先把人切开"],"a":2,"why":"新系统没有埋点，数据画像没有数据来源；原型画像早期立概念可以，但接不住「字段该不该必填」的设计决策；年龄司龄不改变任何字段。组织结构稳定、角色边界清楚，按岗位写角色画像最稳。"},{"q":"关于三类画像，下列说法最准确的是？","o":["原型画像证据最硬，应作为最终交付","数据画像适合任何阶段的全新系统","角色画像靠制度与岗位，接得住设计决策","三类画像可以任选一种互相替代"],"a":2,"why":"原型画像靠访谈原话、早期立概念，一到设计决策该退场；数据画像要有埋点的存量系统、用来校验角色画像；三类是不同阶段的工具不能替代。把原型当终稿、给新系统跑数据画像、任选一种，都用错了阶段或前提。"},{"q":"五步构建法里，「维度选取」这条判据最准确的表达是？","o":["维度越多越细，画像越可信","只选能改变设计决策的维度","优先选年龄性别等稳定属性","选领导最关心的那几个角度"],"a":1,"why":"一个维度值不值得留，只问切成两类后会不会给它们做不一样的东西；不会就删，年龄性别司龄基本都该删。维度多不等于可信、稳定属性不改设计、按领导关心选是把汇报口径当判据。"},{"q":"B 端画像四层加影响者，下列对应正确的是？","o":["使用者看投入产出，决策者看动作频次","管理者看留痕合规，监管者看指标考核","使用者看动作频次，监管者看留痕合规","影响者天天用系统，属于使用者一层"],"a":2,"why":"使用者看动作与频次，管理者看指标与考核，决策者看投入产出，监管者看留痕与合规；影响者不在四层里、不产日常需求却能一票否决。其余三项都把各层看的东西对错，或把影响者算进了四层。"},{"q":"五种画像反模式里，「出现大多数、普遍、却跟不出一处记录」指的是？","o":["人口统计学堆砌","只有标签没有行为","没有场景","不可验证"],"a":3,"why":"不可验证的信号就是「大多数」「普遍」「一般来说」后面没有数、没有出处、没有观察，既不能被反驳也不能被确认，最后变成谁职位高谁说了算。堆人口统计缺动作、贴标签是形容词、没场景缺条件，信号各不相同。"},{"q":"一页 A4 画像卡六格中，写「三条判据各打几分、为什么这么判」的是哪一格？","o":["数据来源那一格","关键行为那一格","核心／边缘判定与理由那一格","这次的决定那一格"],"a":2,"why":"第五格放核心／边缘判定与理由，三条判据各打几分、低频的别漏；第一格是出处，第二格是系统外的实际动作，第六格是为谁优化、不为谁优化、谁承担代价的取舍，由人拍板。"}]});

<script>
/* ============================================================
   吉利汽车 · 用户思维线上课程  (独立系统)
   数据隔离：localStorage 前缀 gel_ ；云端表 gel_*
   与 aidax 主站（aidax_* / app.html）完全独立，互不读写
   ============================================================ */
var SB_URL='https://nyqiwjwzbpnepamldqto.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55cWl3and6YnBuZXBhbWxkcXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzMwMjcsImV4cCI6MjEwNTU0OTAyN30.ZTHpavVBlN80wO4OwYv7njdlFOuUBNVlyLYFyi9Oy5w';
var LS='gel_';
var APP_VER='g2.1.1';

/* ---------- 本地存储 ---------- */
/* 本地存储按账号隔离：gel_<账号id>__<key>
   只 session 走全局前缀，否则退出后就找不回登录态。
   ⚠️ 这里不隔离会导致换账号登录看到同一个人的进度与历史（真实踩过的坑）。 */
function lsPre(k){
  if(k==='session')return LS;
  var me=window.Me;
  return me&&me.id?(LS+me.id+'__'):LS;
}
function lsGet(k,d){try{var v=localStorage.getItem(lsPre(k)+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(lsPre(k)+k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(lsPre(k)+k);}catch(e){}}

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2(s){return esc(s).replace(/\n/g,'<br>');}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function nowISO(){return new Date().toISOString();}
function fmtDate(iso){if(!iso)return '—';var d=new Date(iso);if(isNaN(d))return '—';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function ago(iso){if(!iso)return '—';var t=new Date(iso).getTime();if(isNaN(t))return '—';
  var s=Math.floor((Date.now()-t)/1000);
  if(s<60)return '刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时前';if(s<2592000)return Math.floor(s/86400)+' 天前';
  return fmtDate(iso).slice(0,10);}

/* 简易哈希（内训场景；不可逆，加盐） */
function hash(pwd,salt){
  var s=salt+'|'+pwd+'|gel-geely';
  var h1=0x811c9dc5,h2=0x01000193;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    h1^=c; h1=(h1*16777619)>>>0;
    h2=(h2+c*(i+7))>>>0; h2=((h2<<5)|(h2>>>27))>>>0;
  }
  return ('00000000'+h1.toString(16)).slice(-8)+('00000000'+h2.toString(16)).slice(-8);
}
function mkSalt(){var a='abcdefghijkmnpqrstuvwxyz23456789',s='';for(var i=0;i<12;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}

function toast(msg,ms){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('on');},ms||2200);
}

/* ---------- 云端（PostgREST） ---------- */
var Cloud={
  ready:false,
  async req(table,opt){
    opt=opt||{};
    var url=SB_URL+'/rest/v1/'+table+(opt.qs||'');
    var h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
    if(opt.prefer)h['Prefer']=opt.prefer;
    var r=await fetch(url,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
    if(!r.ok){var t=await r.text();throw new Error(r.status+' '+t.slice(0,160));}
    var txt=await r.text();
    return txt?JSON.parse(txt):null;
  },
  async upsert(table,rows){
    if(!rows||!rows.length)return;
    await this.req(table,{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:rows});
  },
  async all(table,qs){
    return await this.req(table,{qs:qs||'?select=id,doc&limit=5000'});
  }
};

/* ---------- 会话 ---------- */
var Me=null;
function loadMe(){var s=lsGet('session',null);if(s&&s.id)Me=s;return Me;}
function setMe(u){Me=u;lsSet('session',u?{id:u.id,loginId:u.loginId,name:u.name,role:u.role,company:u.company}:null);}

/* ---------- 账号 ---------- */
async function findUser(loginId){
  var rows=await Cloud.req('gel_users',{qs:'?select=id,doc&doc->>loginId=eq.'+encodeURIComponent(loginId)+'&limit=1'});
  return rows&&rows.length?Object.assign({id:rows[0].id},rows[0].doc):null;
}
async function listUsers(){
  var rows=await Cloud.all('gel_users','?select=id,doc&order=updated_at.desc&limit=2000');
  return (rows||[]).map(function(r){return Object.assign({id:r.id},r.doc);});
}
async function saveUser(u){
  var doc={loginId:u.loginId,name:u.name,role:u.role||'student',pwd:u.pwd,salt:u.salt,
    company:u.company||'',active:u.active!==false,createdAt:u.createdAt||nowISO()};
  await Cloud.upsert('gel_users',[{id:u.id,doc:doc}]);
}

/* ---------- 进度 ---------- */
/* 管理员与学员共用同一套界面和流程，唯一差别是「不需要解锁」。
   所有门禁判断都走这一个入口，避免散落的 Me.role==='admin' 漏改。 */
function isAdm(){ return !!(window.Me&&Me.role==='admin'); }
/* 客户试听账号：与学员同一套界面和流程，只是不需要解锁；
   不写云端进度、不写学员活动流、不进后台统计，避免污染正式学员数据。 */
function isTrial(){ return !!(window.Me&&Me.role==='trial'); }
/* 所有解锁门禁的统一入口：管理员与客户试听都不受解锁限制。
   后台入口仍只认 isAdm()，题库查阅页仅 isFree() 可进。 */
function isFree(){ return isAdm()||isTrial(); }
var Prog={
  key:function(mk,n){return mk+'__s'+n;},
  get:function(mk,n){var m=lsGet('prog',{});return m[this.key(mk,n)]||null;},
  all:function(){return lsGet('prog',{});},
  set:function(mk,n,st,extra){
    if(window.__pvOn||isTrial())return;      // 管理员预览 / 客户试听不写进度
    var m=lsGet('prog',{});var k=this.key(mk,n);
    var cur=m[k]||{status:'none',seconds:0,visits:0};
    cur.status=st; cur.visits=(cur.visits||0)+1; cur.updatedAt=nowISO();
    if(extra)Object.assign(cur,extra);
    m[k]=cur; lsSet('prog',m);
    if(Me&&Me.role==='student')Cloud.upsert('gel_progress',[{id:Me.id+'__'+k,
      doc:{userId:Me.id,course:mk,unitId:k,status:st,seconds:cur.seconds||0,visits:cur.visits,
        quiz:cur.quiz||null,updatedAt:cur.updatedAt}}]).catch(function(){});
  },
  // 累计有效收听时长（只计真实播放推进，拖动不计）
  addHeard:function(mk,n,delta){
    if(window.__pvOn||isTrial())return;      // 管理员预览 / 客户试听不累计收听时长
    if(!(delta>0))return;
    var m=lsGet('prog',{}),k=this.key(mk,n);
    var cur=m[k]||{status:'reading',seconds:0,visits:0,heard:0};
    cur.heard=(cur.heard||0)+delta; cur.updatedAt=nowISO();
    var uid=Pl.uid&&Pl.segs?Pl.uid:null;
    var full=uid&&window.NARR[uid]?window.NARR[uid].reduce(function(a,x){return a+x.d;},0):0;
    if(full>0&&cur.heard/full>=0.8&&cur.status!=='quizzed')cur.status='done';
    if(cur.status==='none')cur.status='reading';
    m[k]=cur;lsSet('prog',m);
    this._acc=(this._acc||0)+delta;
    if(this._acc>=20){this._acc=0;this.set(mk,n,cur.status,{heard:Math.round(cur.heard)});}
  },
  heardOf:function(mk,n){
    var p=this.get(mk,n);return (p&&p.heard)||0;
  },
  moduleDone:function(mk,total){var c=0;
    for(var i=1;i<=total;i++){ if(this.doneOf(mk,i)) c++; }
    return c;},
  /* ---- 逐步解锁 ----
     一节算完成 = 视频听完(≥80%) 且 节测过关(≥3/5)
     一章算完成 = 章末的章节测评过关(≥6/10)，过关后才开下一章第 1 节 */
  seq:function(){
    var out=[];
    MODS.forEach(function(m){
      m.sections.forEach(function(s){out.push({mk:m.key,n:s.n});});
      out.push({mk:m.key,n:0,chap:true});
    });
    return out;
  },
  heardPct:function(mk,n){
    var mm=modByKey(mk),p=this.get(mk,n);
    if(p&&(p.status==='done'||p.status==='quizzed'))return 100;
    var segs=(window.NARR||{})['g_m'+(mm?mm.no:1)+'_'+n]||[];
    var full=segs.reduce(function(a,x){return a+x.d;},0);
    if(!full)return 0;
    return Math.min(100,Math.round(((p&&p.heard)||0)/full*100));
  },
  heardOk:function(mk,n){ return this.heardPct(mk,n)>=80; },
  /* ---- 开篇导学（M0）是必修 ----
     导学不在 MODS 里，所以单独算：不进 seq() 的节数分母、不进认证计分。
     听过 80%（与其他节同一口径）才允许进 M1 第 1 节，之后的解锁链不变。 */
  introTot:function(){
    var segs=(window.NARR||{})['g_m0_1']||[];
    return segs.reduce(function(a,x){return a+x.d;},0);
  },
  introPct:function(){
    var p=this.get('m0',1);
    if(p&&(p.status==='done'||p.status==='quizzed'))return 100;
    var tot=this.introTot();
    if(!tot)return 0;
    return Math.min(100,Math.round(((p&&p.heard)||0)/tot*100));
  },
  introDone:function(){ return this.introPct()>=80; },
  /* 门禁只对正式学员生效：管理员与客户试听同一套观看流程，只是不需要解锁 */
  needIntro:function(){ return !this.introDone() && !isFree(); },
  quizOk:function(mk,n){
    var p=this.get(mk,n);
    return !!(p&&p.quiz&&(p.quiz.best||0)>=PQ_PASS);
  },
  chapStat:function(mk){ return lsGet('chap',{})[mk]||null; },
  chapOk:function(mk){ var c=this.chapStat(mk); return !!(c&&(c.best||0)>=CH_PASS); },
  doneOf:function(mk,n){
    if(!n)return this.chapOk(mk);
    return this.heardOk(mk,n)&&this.quizOk(mk,n);
  },
  openTo:function(){
    var sq=this.seq();
    for(var i=0;i<sq.length;i++){ if(!this.doneOf(sq[i].mk,sq[i].n)) return i; }
    return sq.length-1;
  },
  unlocked:function(mk,n){
    /* 导学必修：没听完 80%，M1 一节都不开（管理员除外） */
    if(mk==='m1'&&this.needIntro())return false;
    var sq=this.seq(),idx=-1;
    for(var i=0;i<sq.length;i++){ if(sq[i].mk===mk&&sq[i].n===n){idx=i;break;} }
    if(idx<0)return false;
    return idx<=this.openTo();
  },
  /* 章节测评是否已解锁：本章所有节都完成，才开本章测评 */
  chapOpen:function(mk){
    var sq=this.seq(),idx=-1;
    for(var i=0;i<sq.length;i++){ if(sq[i].mk===mk&&sq[i].chap){idx=i;break;} }
    return idx>=0&&idx<=this.openTo();
  },
  openCount:function(){
    var sq=this.seq(),lim=this.openTo(),c=0;
    for(var i=0;i<=lim&&i<sq.length;i++)if(!sq[i].chap)c++;
    return c;
  },
  /* 换设备 / 清缓存后本地进度为空，但云端有——不回灌就会出现
     「管理员看到 15/15，学员自己看到 0/15」，证书上的学习完成度也会失真。
     只按 updatedAt 取较新的一条，不覆盖本地更新的进度。 */
  hydrate:function(){
    if(!Me||Me.role!=='student')return Promise.resolve(0);
    /* userId 在 doc(jsonb) 里、不是列，按列过滤会 400；id 形如 <uid>__<mk>__s<n>，按前缀取即可 */
    return Cloud.req('gel_progress',{qs:'?select=id,doc&id=like.'+encodeURIComponent(Me.id+'__%')+'&limit=2000'})
      .then(function(rows){
        if(!rows||!rows.length)return 0;
        var m=lsGet('prog',{}),ch=0,cm=lsGet('chap',{});
        rows.forEach(function(r){
          var d=r.doc||{};if(!d.unitId)return;
          /* 章节测评单独存在 chap 里，unitId 形如 <mk>__chap */
          if(/__chap$/.test(d.unitId)){
            var mk=d.unitId.replace(/__chap$/,'');
            var oldc=cm[mk];
            if(d.quiz&&(!oldc||(d.updatedAt||'')>(oldc.at||''))){ cm[mk]=d.quiz; ch++; }
            return;
          }
          var loc=m[d.unitId], rAt=d.updatedAt||'';
          if(!loc||(rAt&&(!loc.updatedAt||rAt>loc.updatedAt))){
            m[d.unitId]={status:d.status||'none',seconds:d.seconds||0,
              visits:d.visits||0,heard:d.heard||loc&&loc.heard||0,
              quiz:d.quiz||(loc&&loc.quiz)||null,updatedAt:rAt};
            ch++;
          }
        });
        if(ch){ lsSet('prog',m); lsSet('chap',cm); }
        return ch;
      }).catch(function(){return 0;});
  }
};

    res.attempts=old?(old.attempts||1)+1:1;

    e[mk]=res;lsSet('exams',e);
    if(Me&&Me.role==='student'){
      Cloud.upsert('gel_exams',[{id:Me.id+'__'+mk,doc:Object.assign({userId:Me.id,course:mk},res)}]).catch(function(){});
    }

};

/* ---------- 课程索引 ---------- */
var COURSE=window.__COURSE__;
var MODS=COURSE.modules;
function modByKey(k){return MODS.filter(function(m){return m.key===k;})[0];}

/* 单节时长一律以音频实测为准。
   内容增补（AI 提效 / 小结预告）之后，课件里的 s.m 会失真，
   目录、个人中心的「X 分钟」必须读这里，否则同一节出现两个时长。 */
function secMin(mk,n){
  var mm=modByKey(mk);
  var sg=(window.NARR||{})['g_m'+(mm?mm.no:1)+'_'+n]||[];
  var d=sg.reduce(function(a,x){return a+x.d;},0);
  return d?Math.max(1,Math.round(d/60)):0;
}

async function login(loginId,pwd){
  var u=await findUser(loginId);
  if(!u)return false;
  if(u.active===false)return false;
  if(hash(pwd,u.salt)!==u.pwd)return false;
  setMe({id:u.id,loginId:u.loginId,name:u.name,role:u.role,company:u.company});
  logEvent('login');
  route();
  // 换设备登录：把云端进度补回本地，补到了就重绘一次
  Prog.hydrate().then(function(n){if(n)route();});
  if(u.role==='student')Cert.sync();
  return true;
}

function route(){
  if(!Me){renderLogin();return;}
  var h=(location.hash||'').replace(/^#/,'');
  var p=h.split('/').filter(Boolean);
  clearInterval(QZ.timer);          // 离开测评页就停表
  if(!p.length){renderHome();return;}
  if(p[0]==='me')return renderMe();

  if(p[0]==='bank')return renderBank();
  if(p[0]==='certexam')return renderCertExam();
  if(p[0]==='certresult')return renderCertResult();

}

  if(!Me){renderLogin();return;}
  var sq=Prog.seq(), total=0, done=0, heard=0;
  sq.forEach(function(x){ if(x.chap)return; total++; if(Prog.doneOf(x.mk,x.n)) done++; });
  var all=Prog.all();
  Object.keys(all).forEach(function(k){ if(k.indexOf('m0__')!==0) heard+=(all[k].heard||0); });
  var totalSec=Object.keys(window.NARR||{}).reduce(function(a,k){
    return a+NARR[k].reduce(function(b,x){return b+x.d;},0);},0);
  /* 剩余时长按「没完成的节」逐节累加，不再用 总时长-累计收听秒数：
     收听秒数会被倍速、重听、测试数据拉偏，算出来常常是 0 */
  var leftSec=0;
  sq.forEach(function(x){
    if(x.chap)return;
    if(Prog.doneOf(x.mk,x.n))return;
    var mm0=modByKey(x.mk);
    var sg=(window.NARR||{})['g_m'+(mm0?mm0.no:1)+'_'+x.n]||[];
    leftSec+=sg.reduce(function(b,y){return b+y.d;},0);
  });

  var pct=total?Math.round(done/total*100):0;
  var openTo=Prog.openCount();

  var cur=null;
  for(var i=0;i<sq.length;i++){ if(!Prog.doneOf(sq[i].mk,sq[i].n)){cur=sq[i];break;} }
  if(!cur) cur=sq[sq.length-1];
  var cm=modByKey(cur.mk);
  var isChap=!!(cur&&cur.chap);
  var cs=cm&&!isChap?cm.sections.filter(function(x){return x.n===cur.n;})[0]:null;

  var nextN=introNeed?'':(isChap?'　'+(cm?'M'+cm.no:''):('　'+(cm?'M'+cm.no:'')+'·'+cur.n));

    :esc(isChap?((cm?cm.name:'')+' 全部内容，10 道题'):(cs?cs.t:''));

  var nextMin=introNeed?(Math.round(Prog.introTot()/60)+' 分钟'):(isChap?'10 分钟':((cs?secMin(cur.mk,cur.n):0)+' 分钟'));
  var nextMinTxt=introNeed?'必修时长':(isChap?'章节测评时长':'下一节时长');

      +'<div class="sn">'+(can?p.no:'<span class="lk">🔒</span>')+'</div>'

  document.getElementById('app').innerHTML='<div class="shell">'+topbar('用户思维 · 线上课程')
   +'<div class="wrap"><div class="crumb"><button onclick="location.hash=\'\'">我的课程</button>'
   +'<span>/</span><span>开篇导学</span></div>'
   +'<div class="learn">'
   +'<div class="sidelist" id="side"><div class="hd" onclick="toggleSide()">'
   +'<span>课程目录</span><small>'+totalMods+' 模块 · '+totalSecs+' 节 <span class="tg" id="sidetg">目录 ▾</span></small></div>'
   +'<div class="list">'
   +'<div class="sitem on"><div class="sn">导</div><div><div class="st">开篇导学 · 必修</div>'
   +'<div class="sm">'+mins+' 分钟 · '+segs.length+' 页</div></div></div>'
   +modItems
   +'</div></div>'
   +'<div class="panel">'
   +'<div class="ph"><div class="k">开篇导学 · 必修 · 讲解 '+mins+' 分钟 · 共 '+segs.length+' 页</div>'
   +'<h2>先花 8 分钟，把规则说清楚</h2></div>'
   +'<div class="pb" id="pbody">'+playerHTML(uid)
   +'<div class="ib-prog'+(ok?' ok':'')+'" id="ib-prog">'
   +'<b class="ibp-cap">导学观看进度</b>'
   +'<span class="ibp-bar"><i style="width:'+pct+'%"></i></span>'
   +'<span class="ibp-txt">'+(ok?'已听完 · 模块一已解锁':'已听 '+pct+'% · 听到 80% 才解锁模块一')+'</span></div>'
   +'<div class="intro-pts">'

      toast('导学是必修，听到 80% 才解锁模块一（当前 '+Prog.introPct()+'%）');

  if(!ok && window.Pl && Pl.onTick===undefined){

var LS_ = {mk:null, n:1};
function renderLearn(mk,n){
  var m=modByKey(mk);
  if(!m){renderHome();return;}
  var sec=m.sections.filter(function(s){return s.n===n;})[0]||m.sections[0];
  n=sec.n;
  /* 开篇导学是必修：没听完 80%，整章 M1 都进不来（管理员除外） */
  if(mk==='m1'&&Prog.needIntro()){
    toast('开篇导学是必修，听完 80% 才解锁模块一');
    location.hash='#intro';
    return;
  }
  if(!isFree()&&!Prog.unlocked(mk,n)){
    toast('这一节还没解锁，先完成上一节');
    location.hash='';
    return;
  }
  LS_.mk=mk;LS_.n=n;

  var items=m.sections.map(function(s){
    var done=Prog.doneOf(mk,s.n);
    var lock=!isFree()&&!Prog.unlocked(mk,s.n);
    return '<div class="sitem'+(s.n===n?' on':'')+(done?' done':'')+(lock?' lock':'')+'" data-n="'+s.n+'"'
      +(lock?' title="完成上一节后解锁"':' onclick="goSec(\''+mk+'\','+s.n+')"')+'>'
      +'<div class="sn">'+(done?'✓':(lock?'<span class="lk">🔒</span>':s.n))+'</div>'
      +'<div><div class="st">'+esc(s.t)+'</div><div class="sm">'+(lock?'完成上一节后解锁':secMin(mk,s.n)+' 分钟')+'</div></div></div>';
  }).join('');

  // 视频下方只放分流条：看完 → 再看一遍 / 马上测评（测评在独立页面做）
  var body=actHTML(mk,n);

  var chOk=Prog.chapOk(mk), chOpen=isFree()||Prog.chapOpen(mk), chSt=Prog.chapStat(mk);
  var chItem='<div class="sitem chap'+(chOk?' done':'')+(chOpen?'':' lock')+'"'
    +(chOpen?' onclick="location.hash=\'#chap/'+mk+'\'"':' title="学完本章后解锁"')+'>'
    +'<div class="sn">'+(chOk?'✓':(chOpen?'章':'<span class="lk">🔒</span>'))+'</div>'
    +'<div><div class="st">章节测评</div><div class="sm">'
    +(chOk?('已通过 '+(chSt?chSt.best:0)+' / 10'):(chOpen?'10 道题 · 10 分钟':'学完本章后解锁'))
    +'</div></div></div>';

  var idx=m.sections.indexOf(sec);
  var prev=idx>0?m.sections[idx-1]:null;
  var next=idx<m.sections.length-1?m.sections[idx+1]:null;

  document.getElementById('app').innerHTML='<div class="shell">'+topbar('用户思维 · 线上课程')
   +'<div class="wrap"><div class="crumb"><button onclick="location.hash=\'\'">我的课程</button>'
   +'<span>/</span><span>M'+m.no+' '+esc(m.name)+'</span><span>/</span><span>第 '+n+' 节</span></div>'
   +'<div class="learn">'
   +'<div class="sidelist" id="side"><div class="hd" onclick="toggleSide()"><span>M'+m.no+' '+esc(m.name)
   +'</span><small>'+Prog.moduleDone(mk,m.sections.length)+'/'+m.sections.length
   +' <span class="tg" id="sidetg">目录 ▾</span></small></div>'
   +'<div class="list">'+items+chItem+'</div></div>'
   +'<div class="panel">'
   +'<div class="ph"><div class="k">第 '+n+' 节 · 讲解 '+Math.round((window.NARR['g_m'+m.no+'_'+n]||[]).reduce(function(a,x){return a+x.d;},0)/60*10)/10+' 分钟</div><h2>'+esc(sec.t)+'</h2></div>'
   +'<div class="pb" id="pbody">'+playerHTML('g_m'+m.no+'_'+n)+body+'</div>'
   +'<div class="pf">'
   +(prev?'<button class="btn line sm" onclick="goSec(\''+mk+'\','+prev.n+')">← 上一节</button>':'<span></span>')
   +'<div class="spacer"></div>'
   +'<button class="btn sm" id="btn-next">'+(next?'下一节 →':'进入模块测评 →')+'</button>'
   +'</div></div></div></div></div>';

  // 标记在学
  var cur=Prog.get(mk,n);
  if(!cur||cur.status==='none')Prog.set(mk,n,'reading');
  else Prog.set(mk,n,cur.status);

  document.getElementById('btn-next').onclick=function(){
    /* 管理员 / 客户试听不需要「听完 + 随堂过关」也能翻页，其余交互与学员一致 */
    if(isFree()){ if(next)goSec(mk,next.n);else location.hash='#chap/'+mk; return; }
    if(!Prog.doneOf(mk,n)){
      var pct=Prog.heardPct(mk,n);
      if(pct<80){ toast('本节视频还没听完（已听 '+pct+'%），听完才能测评'); return; }
      toast('先完成本节随堂测评，才能进入下一节');
      location.hash='#quiz/'+mk+'/'+n;
      return;
    }
    if(next)goSec(mk,next.n);else location.hash='#chap/'+mk;
  };

  initPlayer('g_m'+m.no+'_'+n);
  paintAct._sig=null;
  window.scrollTo(0,0);
}

function goSec(mk,n){
  if(!isFree()){
    if(!Prog.unlocked(mk,n)){ toast('这一节还没解锁，先完成上一节'); return; }
  }
  location.hash='#learn/'+mk+'/'+n;
}
function toggleSide(){
  var s=document.getElementById('side'),t=document.getElementById('sidetg');
  if(!s)return;
  s.classList.toggle('open');
  if(t)t.textContent=s.classList.contains('open')?'收起 ▴':'目录 ▾';
}

function pageHTML(sec,m,mk){
  var h='';
  // 1) 开场
  h+='<div class="hook"><div class="lab">本节要解决的一个判断</div><p>'+esc(sec.hook)+'</p></div>';
  h+='<div style="font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;margin-bottom:10px">这一节你会拿到</div>';
  h+='<div class="goals">'+sec.goals.map(function(g,i){
      return '<div class="goal"><div class="gno">'+String(i+1).padStart(2,'0')+'</div><p>'+esc(g)+'</p></div>';
    }).join('')+'</div>';

  // 2) 内容页
  sec.pages.forEach(function(p){
    h+='<div class="cpage" style="margin-top:34px;padding-top:26px;border-top:1px solid #eef1f5">'+renderPage(p)+'</div>';
  });

  // 3) 案例
  if(m.cases&&sec.n===m.sections[0].n){
    // 案例放在第一节末尾（模块导入）
  }
  return h;
}

function renderPage(p){
  var h='<h3>'+esc(p.T)+'</h3>';
  if(p.K)h+='<div class="lead">'+esc(p.K)+'</div>';
  var D=p.D;
  if(p.L==='cards'){
    var cls=D.length>=4?'c4':(D.length===2?'c2':'c3');
    h+='<div class="mcards '+cls+'">'+D.map(function(it,i){
      return '<div class="mcard"><div class="n">'+String(i+1).padStart(2,'0')+'</div>'
        +'<h4>'+esc(it[0])+'</h4><p>'+esc(it[1])+'</p></div>';
    }).join('')+'</div>';
  }else if(p.L==='steps'){
    h+='<div class="steps">'+D.map(function(it,i){
      return '<div class="mstep"><div class="sn">'+String(i+1).padStart(2,'0')+'</div>'
        +'<div class="sc"><h4>'+esc(it[0])+'</h4><p>'+esc(it[1])+'</p></div></div>';
    }).join('')+'</div>';
  }else if(p.L==='table'){
    var w=p.w||[],tot=w.reduce(function(a,b){return a+b;},0)||1;
    h+='<div style="overflow-x:auto"><table class="mtable"><thead><tr>'
      +p.D.h.map(function(x,j){return '<th'+(w[j]?' style="width:'+Math.round(w[j]/tot*100)+'%"':'')+'>'+esc(x)+'</th>';}).join('')
      +'</tr></thead><tbody>'
      +p.D.r.map(function(row){
        return '<tr>'+row.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';
      }).join('')+'</tbody></table></div>';
  }else if(p.L==='bands'){
    var cols=[['#eef4fb','#1b4f8a'],['#f0f7f4','#0f7b5f'],['#fdf6ec','#b26a00'],['#f6f2fa','#6b4fa8']];
    h+='<div class="bands">'+D.map(function(it,i){
      var c=cols[i%4];
      return '<div class="band" style="background:'+c[0]+';border-color:'+c[0]+'">'
        +'<div class="bn" style="color:'+c[1]+'">'+esc(it[0])+'</div><p>'+esc(it[1])+'</p></div>';
    }).join('')+'</div>';
  }else if(p.L==='compare'){
    h+='<div class="mcompare">'
      +'<div class="ccol good"><div class="ch">'+esc(p.D.l[0])+'</div><ul>'
      +p.D.l[1].map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'
      +'<div class="ccol bad"><div class="ch">'+esc(p.D.r[0])+'</div><ul>'
      +p.D.r[1].map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div></div>';
  }
  if(p.note){
    h+='<div class="note"><div class="nl">'+esc(p.note[0])+'</div><p>'+esc(p.note[1])+'</p></div>';
  }
  return h;
}

/* ============================================================
   随堂练习（每节 5 题 · 阶段一 15 节计入认证总分 5%）
   PQ 存本次作答态；成绩落进 Prog 记录的 quiz 字段，取最好一次
   ============================================================ */
var PQ={mk:null,n:0,sel:{},res:null};
var PQ_PASS=3;                 /* 答对 3 / 5 即过关 */
var PQ_EACH=5;                 /* 每节 5 题 */

function pracBank(mk,n){
  var m=modByKey(mk);
  var uid='g_m'+(m?m.no:1)+'_'+n;
  return (window.PRACTICE&&window.PRACTICE[uid])||[];
}
function pqStat(mk,n){
  var p=Prog.get(mk,n);
  return (p&&p.quiz)||null;
}

function pqNextOf(mk,n){
  var m=modByKey(mk);
  if(!m)return null;
  var idx=-1;
  m.sections.forEach(function(s,i){if(s.n===n)idx=i;});
  return idx>=0&&idx<m.sections.length-1?m.sections[idx+1]:null;
}

/* ============================================================
   视频下方分流条：看完 → 再看一遍 / 马上测评
   ============================================================ */
function actBody(mk,n){
  var pct=Prog.heardPct(mk,n);
  var st=pqStat(mk,n), best=(st&&st.best)||0;
  var pass=best>=PQ_PASS, nx=pqNextOf(mk,n);
  var head,btns;
  if(pct<80){
    head='<div class="ea-t"><b>本节视频看到 <i id="ea-pct">'+pct+'</i>%</b>'
      +'<span>'+(isFree()?(isTrial()?'试听账号不受解锁限制，可直接测评或翻到下一节':'管理员不受解锁限制，可直接测评或翻到下一节'):'听完后解锁随堂测评（5 道题，10 分钟内完成）')+'</span></div>';
    btns='<button class="btn line" onclick="plReplay()">从头播放</button>'
      +(isFree()?'<button class="btn line" onclick="location.hash=\'#quiz/'+mk+'/'+n+'\'">直接测评</button>':'');
  }else if(!pass){
    head='<div class="ea-t"><b>本节已看完</b><span>'
      +(st?('上次答对 '+best+' / '+PQ_EACH+'，可以再来一次'):'5 道随堂题，答对 '+PQ_PASS+' 道记本节完成')
      +'</span></div>';
    btns='<button class="btn line" onclick="plReplay()">再看一遍</button>'
      +'<button class="btn" onclick="location.hash=\'#quiz/'+mk+'/'+n+'\'">马上测评</button>';
  }else{
    head='<div class="ea-t ok"><b>✓ 本节已完成</b><span>随堂测评 '+best+' / '+PQ_EACH
      +'　·　视频已听完</span></div>';
    btns='<button class="btn line" onclick="plReplay()">再看一遍</button>'
      +'<button class="btn line" onclick="location.hash=\'#quiz/'+mk+'/'+n+'\'">重做测评</button>'
      +(nx?'<button class="btn" onclick="goSec(\''+mk+'\','+nx.n+')">下一节 →</button>'
        :'<button class="btn" onclick="location.hash=\'#chap/'+mk+'\'">章节测评 →</button>');
  }
  return head+'<div class="ea-b">'+btns+'</div>';
}
function actHTML(mk,n){
  return '<div class="ea" id="ea">'+actBody(mk,n)+'</div>';
}
function paintAct(){
  var box=document.getElementById('ea');
  if(!box||!LS_.mk)return;
  var pct=Prog.heardPct(LS_.mk,LS_.n);
  var st=pqStat(LS_.mk,LS_.n), pass=!!(st&&st.best>=PQ_PASS);
  var sig=(pct>=80?'h':'w')+'|'+(pass?1:0)+'|'+(st?st.best:0);
  if(paintAct._sig===sig){
    var lab=document.getElementById('ea-pct');
    if(lab)lab.textContent=String(pct);
    return;
  }
  paintAct._sig=sig;
  box.innerHTML=actBody(LS_.mk,LS_.n);
}
function plReplay(){
  if(!Pl.audio||!Pl.segs)return;
  Pl.i=0;Pl.last=0;
  Pl.audio.src=Pl.segs[0].u;
  Pl.audio.playbackRate=Pl.rate;
  if(window.SLIDES&&window.SLIDES[Pl.uid])stageShow(0);
  Pl.audio.play().catch(function(){});
  plPaint();
  toast('从头播放本节');
}

/* ============================================================
   测评页：随堂测评（每节 5 题）· 章节测评（每章 10 题）
   10 分钟倒计时；提交前可随时改答案；提交即出成绩与逐题解析
   ============================================================ */
var QZ={kind:'quiz',mk:null,n:0,sel:{},res:null,endAt:0,timer:null};
var QZ_MIN=10;
var CH_PASS=6;
var CH_EACH=10;

function quizBank(kind,mk,n){
  if(kind==='chap')return (window.CHAPTER&&window.CHAPTER[mk])||[];
  return pracBank(mk,n);
}
function quizPass(kind){ return kind==='chap'?CH_PASS:PQ_PASS; }
function qzKey(kind,mk,n){ return kind+':'+mk+':'+(n||0); }
function qzEndAt(kind,mk,n){
  var key=qzKey(kind,mk,n), t=lsGet('qz_time',null);
  if(t&&t.key===key&&t.endAt>Date.now())return t.endAt;
  var e=Date.now()+QZ_MIN*60000;
  lsSet('qz_time',{key:key,endAt:e});
  return e;
}
function qzDropTimer(){
  var t=lsGet('qz_time',null);
  if(t&&t.key===qzKey(QZ.kind,QZ.mk,QZ.n))lsSet('qz_time',null);
}
function qzBack(){
  var m=modByKey(QZ.mk);
  if(!m)return '';
  if(QZ.kind==='chap')return '#learn/'+QZ.mk+'/'+m.sections[m.sections.length-1].n;
  return '#learn/'+QZ.mk+'/'+QZ.n;
}

function qzListHTML(){
  var qs=quizBank(QZ.kind,QZ.mk,QZ.n), res=QZ.res;
  return qs.map(function(q,i){
    var picked=QZ.sel[i], mark='';
    if(res)mark='<span class="qz-m '+(res.detail[i]?'ok':'no')+'">'+(res.detail[i]?'✓':'✗')+'</span>';
    var opts=q.o.map(function(o,j){
      var cls='opt';
      if(res){ cls+=' lock'; if(j===q.a)cls+=' right'; else if(j===picked)cls+=' wrong'; }
      else if(picked===j)cls+=' sel';
      return '<div class="'+cls+'" data-q="'+i+'" data-o="'+j+'"><div class="ol">'+'ABCD'[j]
        +'</div><div class="ot">'+esc(o)+'</div></div>';
    }).join('');
    var ex=res?'<div class="qz-x'+(res.detail[i]?'':' bad')+'"><b>'
      +(res.detail[i]?'答对了':'正确答案 '+'ABCD'[q.a])+'</b>'+esc(q.why)+'</div>':'';
    return '<div class="qzi'+(res?(res.detail[i]?' ok':' no'):'')+'" data-i="'+i+'">'
      +'<div class="qz-q"><span class="qn">'+String(i+1).padStart(2,'0')+'</span>'+mark
      +'<div class="qtx">'+esc(q.q)+'</div></div>'
      +'<div class="opts">'+opts+'</div>'+ex+'</div>';
  }).join('');
}

function qzFootHTML(){
  var qs=quizBank(QZ.kind,QZ.mk,QZ.n), res=QZ.res;
  if(res){
    var pass=res.pass, m=modByKey(QZ.mk), btns='';
    btns+='<button class="btn line" onclick="qzAgain()">再做一次</button>';
    if(QZ.kind==='chap'){
      var nxm=MODS.filter(function(x){return x.no===m.no+1;})[0];
      btns+='<button class="btn line" onclick="goSec(\''+QZ.mk+'\','+m.sections[m.sections.length-1].n+')">返回课程</button>';
      if(pass&&nxm)btns+='<button class="btn" onclick="goSec(\''+nxm.key+'\',1)">进入下一章 →</button>';
      else if(pass&&!nxm)btns+='<button class="btn" onclick="location.hash=\'#cert\'">进入阶段一认证 →</button>';
    }else{
      var nx=pqNextOf(QZ.mk,QZ.n);
      btns+='<button class="btn line" onclick="location.hash=\''+qzBack()+'\'">返回本节</button>';
      if(pass&&nx)btns+='<button class="btn" onclick="goSec(\''+QZ.mk+'\','+nx.n+')">下一节 →</button>';
      else if(pass&&!nx)btns+='<button class="btn" onclick="location.hash=\'#chap/'+QZ.mk+'\'">章节测评 →</button>';
    }
    return '<div class="qz-score '+(pass?'ok':'no')+'"><b>'+res.got+'</b><span>/ '+qs.length
      +' 题答对</span><em>'+(pass?'已通过':'未通过，答对 '+quizPass(QZ.kind)+' 题即可')+'</em></div>'
      +'<div class="spacer"></div>'+btns;
  }
  return '<div class="qz-cnt" id="qz-cnt">已作答 '+Object.keys(QZ.sel).length+' / '+qs.length+'</div>'
    +'<div class="spacer"></div>'
    +'<button class="btn line" onclick="location.hash=\''+qzBack()+'\'">稍后再做</button>'
    +'<button class="btn" id="qz-sub">提交测评</button>';
}

function qzBind(){
  var list=document.getElementById('qz-list');
  if(!list)return;
  list.onclick=function(e){
    var el=e.target.closest?e.target.closest('.opt'):null;
    if(!el||QZ.res)return;
    var i=+el.dataset.q, j=+el.dataset.o;
    QZ.sel[i]=j;
    var host=list.querySelector('.qzi[data-i="'+i+'"]');
    if(host)host.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
    el.classList.add('sel');
    var c=document.getElementById('qz-cnt');
    if(c)c.textContent='已作答 '+Object.keys(QZ.sel).length+' / '+quizBank(QZ.kind,QZ.mk,QZ.n).length;
  };
  var sub=document.getElementById('qz-sub');
  if(sub)sub.onclick=function(){qzSubmit(false);};
}

function qzTick(){
  clearInterval(QZ.timer);
  var draw=function(){
    var left=Math.max(0,Math.round((QZ.endAt-Date.now())/1000));
    var el=document.getElementById('qz-clock');
    if(el){
      el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
      el.classList.toggle('warn',left<=60);
    }
    if(left<=0&&!QZ.res){ clearInterval(QZ.timer); toast('时间到，自动提交'); qzSubmit(true); }
  };
  draw();
  QZ.timer=setInterval(draw,500);
}

function qzAgain(){
  QZ.sel={};QZ.res=null;
  QZ.endAt=qzEndAt(QZ.kind,QZ.mk,QZ.n);
  var l=document.getElementById('qz-list'); if(l)l.innerHTML=qzListHTML();
  var f=document.getElementById('qz-foot'); if(f)f.innerHTML=qzFootHTML();
  qzBind(); qzTick(); window.scrollTo(0,0);
}

function qzSubmit(auto){
  if(QZ.res)return;
  var qs=quizBank(QZ.kind,QZ.mk,QZ.n);
  if(!qs.length)return;
  var miss=[];
  for(var i=0;i<qs.length;i++)if(QZ.sel[i]===undefined)miss.push(i+1);
  if(!auto&&miss.length){ toast('第 '+miss.join('、')+' 题还没作答'); return; }
  var got=0,detail=[];
  qs.forEach(function(q,i){ var ok=QZ.sel[i]===q.a; detail.push(ok); if(ok)got++; });
  var pass=got>=quizPass(QZ.kind);
  QZ.res={got:got,detail:detail,pass:pass};
  clearInterval(QZ.timer);
  qzDropTimer();

  if(QZ.kind==='chap'){
    var old=Prog.chapStat(QZ.mk)||{best:0,tries:0};
    var rec={best:Math.max(old.best||0,got),last:got,tries:(old.tries||0)+1,at:nowISO()};
    var cm=lsGet('chap',{}); cm[QZ.mk]=rec; lsSet('chap',cm);
    if(Me&&Me.role==='student')Cloud.upsert('gel_progress',[{id:Me.id+'__'+QZ.mk+'__chap',
      doc:{userId:Me.id,course:QZ.mk,unitId:QZ.mk+'__chap',status:'chap',quiz:rec,updatedAt:nowISO()}}]).catch(function(){});
    logEvent('chapter_quiz',QZ.mk+'_'+got+'/'+qs.length);
  }else{
    var pst=pqStat(QZ.mk,QZ.n)||{best:0,tries:0};
    var p2=Prog.get(QZ.mk,QZ.n)||{};
    var quiz={best:Math.max(pst.best||0,got),last:got,tries:(pst.tries||0)+1,at:nowISO()};
    Prog.set(QZ.mk,QZ.n,pass?'quizzed':(p2.status&&p2.status!=='none'?p2.status:'reading'),{quiz:quiz});
    logEvent('practice_submit',QZ.mk+'_s'+QZ.n+'_'+got);
  }

  var l2=document.getElementById('qz-list'); if(l2)l2.innerHTML=qzListHTML();
  var f2=document.getElementById('qz-foot'); if(f2)f2.innerHTML=qzFootHTML();
  qzBind();
  /* 成绩条就贴在手边（sticky），再弹 toast 会盖住底部按钮，这里不再弹 */
  window.scrollTo(0,0);
}

function renderQuiz(mk,n){ renderAssess('quiz',mk,n); }
function renderChap(mk){ renderAssess('chap',mk,0); }

function renderAssess(kind,mk,n){
  var m=modByKey(mk);
  if(!m){ renderHome(); return; }
  var qs=quizBank(kind,mk,n);
  if(!qs.length){ renderHome(); return; }

  if(!isFree()){
    if(kind==='chap'){
      if(!Prog.chapOpen(mk)){
        toast('本章还没学完，章节测评暂未开放');
        location.hash='#learn/'+mk+'/'+m.sections[m.sections.length-1].n;
        return;
      }
    }else if(!Prog.heardOk(mk,n)){
      toast('先把本节视频听完，再来做测评');
      location.hash='#learn/'+mk+'/'+n;
      return;
    }
  }

  clearInterval(QZ.timer);
  QZ={kind:kind,mk:mk,n:n,sel:{},res:null,endAt:qzEndAt(kind,mk,n),timer:null};

    : ('5 道选择题，答对 '+PQ_PASS+' 道记本节完成');
  var back=kind==='chap'?('#learn/'+mk+'/'+m.sections[m.sections.length-1].n):('#learn/'+mk+'/'+n);

  document.getElementById('app').innerHTML='<div class="shell">'+topbar('用户思维 · 在线测评')
    +'<div class="wrap"><div class="crumb"><button onclick="location.hash=\''+back+'\'">'
    +(kind==='chap'?'返回课程':'返回本节')+'</button><span>/</span><span>'+esc(title)+'</span></div>'
    +'<div class="qz-page">'
    +'<div class="qz-hd"><div class="qz-hl"><div class="k">'+esc(kicker)+'</div>'
    +'<h2>'+(kind==='chap'?'章节测评':'随堂测评')+'</h2><p>'+esc(sub)+'</p></div>'
    +'<div class="qz-clock" id="qz-clock">10:00</div></div>'
    +'<div class="qz-bar"><i id="qz-fill"></i></div>'
    +'<div class="qz-tip">提交前可以随时修改答案；提交后立即给出成绩与逐题解析，不能再改。</div>'
    +'<div id="qz-list">'+qzListHTML()+'</div>'
    +'<div class="qz-foot" id="qz-foot">'+qzFootHTML()+'</div>'
    +'</div></div></div>';
  qzBind();
  qzTick();
  window.scrollTo(0,0);
}

/* ============================================================
   客户试听：测评题目查阅
   —— 覆盖三类：随堂 5 题/节、章测 10 题/章、阶段一认证客观题。
   只读，不计时、不写成绩，答案与解析默认展开，方便客户评估课程内容。
   ============================================================ */
function bankQHTML(q,i,letters,showNo){
  var multi=Array.isArray(q.a);
  var letter=letters||'ABCD';
  var right=multi?q.a.map(function(x){return letter[x];}).join(''):letter[q.a];
  var opts=q.o.map(function(o,j){
    var isA=multi?q.a.indexOf(j)>=0:j===q.a;
    return '<div class="opt'+(isA?' right':'')+'" style="cursor:default">'
      +'<div class="ol">'+letter[j]+'</div><div class="ot">'+esc(o)
      +(isA?'　<span class="bk-key">✓ 正确答案</span>':'')+'</div></div>';
  }).join('');
  return '<div class="bk-q"><div class="bk-qt">'
    +(showNo?'<span class="bk-no">'+String(i+1).padStart(2,'0')+'</span>':'')
    +(multi?'<span class="bk-tag">多选</span>':'')
    +(q.type==='judge'?'<span class="bk-tag judge">判断</span>':'')
    +'<span>'+esc(q.q)+'</span></div>'
    +'<div class="opts">'+opts+'</div>'
    +'<div class="bk-why"><b>解析</b>'+esc(q.why)
    +(q.s?'　<span style="color:var(--soft)">（'+q.s+' 分）</span>':'')+'</div></div>';
}

function renderBank(){

  if(!isFree()){toast('题库查阅仅对客户试听开放');renderHome();location.hash='';return;}
  var pracTotal=0, chapTotal=0;
  MODS.forEach(function(m){
    m.sections.forEach(function(s){ pracTotal+=(window.PRACTICE&&window.PRACTICE['g_m'+m.no+'_'+s.n]||[]).length; });
    chapTotal+=(window.CHAPTER&&window.CHAPTER[m.key]||[]).length;
  });
  var certTotal=(window.QUIZ&&window.QUIZ.items||[]).length;

  var h='<div class="shell">'+topbar('用户思维 · 题库查阅')
    +'<div class="wrap"><div class="crumb"><button onclick="location.hash=\'\'">我的课程</button>'
    +'<span>/</span><span>测评题目查阅</span></div>'
    +'<div class="bk-hd"><h2>测评题目查阅</h2>'
    +'<p>这是客户试听只读视图，可查看学员实际作答的全部题目、正确答案与解析。'
    +'答案默认展开、不计时、不计分，也不会记录你的作答。正式学员端仍按「听完 → 测评 → 出分」的流程进行。</p>'
    +'<div class="bk-stat"><span><b>'+pracTotal+'</b>随堂测评题（5 题/节）</span>'
    +'<span><b>'+chapTotal+'</b>章节测评题（10 题/章）</span>'
    +'<span><b>'+certTotal+'</b>阶段一认证客观题</span></div></div>';

function showQuiz(mk,n){
  var m=modByKey(mk),sec=m.sections.filter(function(s){return s.n===n;})[0];
  if(!sec||!sec.q){doneSection(mk,n);return;}
  var q=sec.q,sel=-1,locked=false;
  var body='<div class="qbox"><div class="qh">随堂测 · 第 '+n+' 节</div>'
    +'<div class="qt">'+esc(q.q)+'</div><div class="opts" id="opts">'
    +q.o.map(function(o,i){return '<div class="opt" data-i="'+i+'"><div class="ol">'+'ABCD'[i]+'</div><div class="ot">'+esc(o)+'</div></div>';}).join('')
    +'</div><div id="ex"></div></div>';
  dlg('随堂测','答对后本节记为完成，可重新作答',body,
    [{t:'提交',p:1,fn:function(){
      if(locked){closeDlg();return;}
      if(sel<0){toast('请先选择一个答案');return false;}
      locked=true;
      var ok=sel===q.a;
      document.querySelectorAll('#opts .opt').forEach(function(el){
        var i=+el.dataset.i;el.classList.add('lock');el.classList.remove('sel');
        if(i===q.a)el.classList.add('right');
        else if(i===sel)el.classList.add('wrong');
      });
      document.getElementById('ex').innerHTML='<div class="explain'+(ok?'':' bad')+'">'
        +'<div class="el">'+(ok?'回答正确':'回答错误 · 正确答案 '+'ABCD'[q.a])+'</div>'
        +'<p>'+esc(q.why)+'</p></div>';
      if(ok){doneSection(mk,n);}
      var b=document.querySelector('.dlg .df .btn:last-child');
      if(b){b.textContent=ok?'完成本节':'关闭';}
      return false;
    }}]);
  setTimeout(function(){
    document.querySelectorAll('#opts .opt').forEach(function(el){
      el.onclick=function(){
        if(locked)return;
        document.querySelectorAll('#opts .opt').forEach(function(x){x.classList.remove('sel');});
        el.classList.add('sel');sel=+el.dataset.i;
      };
    });
  },0);
}

function doneSection(mk,n){
  Prog.set(mk,n,'done');
  var m=modByKey(mk);
  var idx=m.sections.filter(function(s){return s.n===n;})[0];
  var next=m.sections[m.sections.indexOf(idx)+1];
  if(document.getElementById('pbody')){
    renderLearn(mk,n);
  }
  logEvent('section_done',mk+'_s'+n);
  toast(next?'本节完成，可以进入下一节':'本节完成，全部章节已学完');
}


/* ============================================================
   音频播放器（分段续播 + 逐字稿联动 + 有效收听计时）
   ============================================================ */
var Pl = { audio: null, uid: null, segs: null, i: 0, rate: 1, tot: 0, last: 0, start: 0 };
/* 默认倍速：全站播放器统一 1.25×。时长显示一律按音频真实时长，不按倍速折算。 */
var RATE_DEF = 1.25;

function fmtT(s) {
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), x = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
}

function playerHTML(uid) {
  var segs = (window.NARR && window.NARR[uid]) || [];
  if (!segs.length) return '';
  var tot = segs.reduce(function (a, x) { return a + x.d; }, 0);
  var rates = [0.9, 1, 1.1, 1.25].map(function (r) {
    var lab = r === 1 ? '1.0' : String(r);
    return '<option value="' + r + '"' + (r === RATE_DEF ? ' selected' : '') + '>' + lab + '×</option>';
  }).join('');
  var hasSlide = !!(window.SLIDES && window.SLIDES[uid]);
  return '<div class="player" id="pl">'
    + (hasSlide
      ? '<div class="stage" id="p-stage"><div class="sl-canvas" id="p-canvas"></div></div>'
        + '<div class="cap" id="pl-sub">点击播放，画面随讲解翻页</div>'
      : '<div class="pl-sub" id="pl-sub">' + esc(segs[0].t) + '</div>')
    + '<div class="pl-top">'
    + '<button class="pl-btn" id="pl-toggle" aria-label="播放或暂停">▶</button>'
    + '<div class="pl-bar" id="pl-bar" title="点击定位"><i id="pl-fill"></i></div>'
    + '<div class="pl-time" id="pl-time">00:00 / ' + fmtT(tot) + '</div>'
    + '<select class="pl-rate" id="pl-rate">' + rates + '</select>'
    + '<button class="pl-fs" id="pl-fs" type="button" title="全屏" aria-label="全屏">'
    + '<svg class="i-fs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>'
    + '<svg class="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M16 3v3a2 2 0 0 0 2 2h3"/><path d="M8 21v-3a2 2 0 0 0-2-2H3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
    + '</button>'
    + '</div>'
    + '<div class="pl-tools">'
    + '<span class="pl-hint" id="pl-hint">本节 ' + Math.round(tot / 60) + ' 分钟 · 共 ' + segs.length + ' 页</span></div>'
    + '<div class="pl-text" id="pl-text">' + segs.map(function (x, k) {
      return '<div class="pl-seg' + (k === 0 ? ' on' : '') + '" data-k="' + k + '"><b>' + (k + 1) + '</b>'
        + esc(x.t) + '</div>';
    }).join('') + '</div>'
    + '</div>';
}

function initPlayer(uid) {
  var segs = (window.NARR && window.NARR[uid]) || [];
  if (!segs.length) return;
  if (Pl.audio) { try { Pl.audio.pause(); } catch (e) { } Pl.audio = null; }
  Pl.uid = uid; Pl.segs = segs; Pl.i = 0; Pl.rate = RATE_DEF; Pl.last = 0;
  Pl.tot = segs.reduce(function (a, x) { return a + x.d; }, 0);
  STAGE.uid = uid; STAGE.i = -1; STAGE._lastHl = -2; STAGE.caps = []; STAGE.capAt = []; STAGE.hlEls = [];

  var a = new Audio();
  Pl.audio = a;
  a.preload = 'auto';
  a.src = segs[0].u;
  a.playbackRate = RATE_DEF;
  a.onended = function () { plNext(); };
  a.ontimeupdate = function () {
    if (!a.paused) {
      var d = a.currentTime - Pl.last;
      // 只认 0–1.5 秒的自然推进，拖动进度条不产生有效收听
      if (d > 0 && d < 1.5) Prog.addHeard(LS_.mk, LS_.n, d);
    }
    Pl.last = a.currentTime;
    plPaint();
  };
  a.onerror = function () {
    var h = document.getElementById('pl-hint');
    if (h) h.textContent = '音频加载失败，请刷新或检查网络';
  };

  var tg = document.getElementById('pl-toggle');
  if (tg) tg.onclick = plToggle;
  var rt = document.getElementById('pl-rate');
  if (rt) rt.onchange = function (e) { Pl.rate = +e.target.value; a.playbackRate = Pl.rate; };
  var fsb = document.getElementById('pl-fs');
  if (fsb) fsb.onclick = plFsToggle;
  if (!Pl.fsHook) {
    Pl.fsHook = true;
    var onFs = function () {
      var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
      var b = document.getElementById('pl-fs');
      if (b) b.classList.toggle('on', on);
      // 全屏切换后容器尺寸变了，必须重算画布缩放，否则画面停在旧比例
      setTimeout(function () { if (window.stageFit) stageFit(); }, 80);
      setTimeout(function () { if (window.stageFit) stageFit(); }, 260);
    };
    document.addEventListener('fullscreenchange', onFs);
    document.addEventListener('webkitfullscreenchange', onFs);
  }
  var bar = document.getElementById('pl-bar');
  if (bar) bar.onclick = function (e) {
    var r = e.currentTarget.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    plSeek(Pl.tot * pct);
  };
  // 一进本节先停章节封面，点播放才进第 1 页
  if (window.SLIDES && window.SLIDES[uid]) {
    stageShow(-1);
    var sb0 = document.getElementById('pl-sub');
    if (sb0) { var _c = coverOf(uid); sb0.textContent = (_c.mod === 'M0' ? '开篇导学' : (_c.mod ? _c.mod + ' ' : '') + '第 ' + _c.no + ' 节') + ' · 点播放开始'; }
  } else {
    stageShow(0);
  }
  document.querySelectorAll('.pl-seg').forEach(function (el) {
    el.onclick = function () { plGo(+el.dataset.k, true); };
  });
  if (!Pl.hook) {
    Pl.hook = true;
    var flush = function () {
      if (!Pl.uid) return;
      var pr = Prog.get(LS_.mk, LS_.n);
      if (pr && (pr.heard || 0) > 0) Prog.set(LS_.mk, LS_.n, pr.status || 'reading', { heard: Math.round(pr.heard) });
    };
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });
    window.addEventListener('hashchange', flush);
  }
  plPaint();
}

/* 全屏：整块播放器（画面 + 字幕 + 控制条）一起进全屏，不是单独放大画面 */
function plFsToggle() {
  var el = document.getElementById('pl');
  if (!el) return;
  var d = document;
  var touch = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var cur = d.fullscreenElement || d.webkitFullscreenElement;
  if (cur) {
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) { }
    if (d.exitFullscreen) { try { d.exitFullscreen(); } catch (e) { } }
    else if (d.webkitExitFullscreen) { try { d.webkitExitFullscreen(); } catch (e) { } }
    return;
  }
  var tip = touch ? '当前浏览器不支持网页全屏，请横屏观看' : '当前浏览器不支持网页全屏，可按 F11 全屏';
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) { toast(tip); return; }
  var r;
  try { r = req.call(el); } catch (e) { toast(tip); return; }
  var after = function () {
    // 手机上顺手锁横屏，竖屏全屏画面太小；不支持就保持原样
    try {
      if (touch && screen.orientation && screen.orientation.lock)
        screen.orientation.lock('landscape').catch(function () { });
    } catch (e) { }
  };
  if (r && r.then) r.then(after).catch(function () { toast('全屏被浏览器拦截了，再点一次'); });
  else after();
}

function plToggle() {
  if (!Pl.audio) return;
  if (Pl.audio.paused) {
    // 停在封面时点播放，直接进第 1 页
    if (STAGE.i < 0 && window.SLIDES && window.SLIDES[Pl.uid]) { STAGE._lastHl = -2; stageShow(0); }
    Pl.audio.play().catch(function () { toast('浏览器阻止了自动播放，请再点一次'); });
  } else {
    Pl.audio.pause();
  }
  setTimeout(plPaint, 80);
}

function plGo(i, play) {
  if (!Pl.segs || i < 0 || i >= Pl.segs.length) return;
  Pl.i = i; Pl.last = 0;
  Pl.audio.src = Pl.segs[i].u;
  Pl.audio.playbackRate = Pl.rate;
  if (play) Pl.audio.play().catch(function () { });
  STAGE._lastHl = -2;
  if (window.SLIDES && window.SLIDES[Pl.uid]) stageShow(i);
  else {
    var sb0 = document.getElementById('pl-sub');
    if (sb0) sb0.textContent = Pl.segs[i].t;
  }
  document.querySelectorAll('.pl-seg').forEach(function (el) {
    var on = +el.dataset.k === i;
    el.classList.toggle('on', on);
    if (on && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  });
  plPaint();
}

function plNext() {
  if (!Pl.segs) return;
  if (Pl.i < Pl.segs.length - 1) plGo(Pl.i + 1, true);
  else {
    Pl.audio.pause();
    var b = document.getElementById('pl-toggle');
    if (b) b.textContent = '▶';
    // 最后一页播完 → 停在本节结束封面
    if (window.SLIDES && window.SLIDES[Pl.uid]) stageShow(Pl.segs.length);
    var sb = document.getElementById('pl-sub');
    if (sb) { sb.textContent = '本节已播完，可以做随堂测评'; sb.classList.add('done'); }
    toast('本节音频已播完');
  }
}

function plSeek(sec) {
  if (!Pl.segs) return;
  var acc = 0;
  for (var i = 0; i < Pl.segs.length; i++) {
    if (sec < acc + Pl.segs[i].d || i === Pl.segs.length - 1) {
      plGo(i, false);
      Pl.audio.currentTime = Math.max(0, Math.min(Pl.segs[i].d - 0.2, sec - acc));
      plPaint();
      return;
    }
    acc += Pl.segs[i].d;
  }
}

function plPaint() {
  if (!Pl.audio || !Pl.segs) return;
  var before = 0;
  for (var i = 0; i < Pl.i; i++) before += Pl.segs[i].d;
  var cur = before + (Pl.audio.currentTime || 0);
  var f = document.getElementById('pl-fill');
  if (f) f.style.width = Math.min(100, cur / Pl.tot * 100) + '%';
  var t = document.getElementById('pl-time');
  if (t) t.textContent = fmtT(cur) + ' / ' + fmtT(Pl.tot);
  var b = document.getElementById('pl-toggle');
  if (b) b.textContent = Pl.audio.paused ? '▶' : '❚❚';
  var seg = Pl.segs[Pl.i] || {};
  var frac = seg.d > 0 ? Math.min(1, Math.max(0, (Pl.audio.currentTime || 0) / seg.d)) : 0;
  stageSync(frac);
  paintAct();
}

function pvOpen(uid){

    +'</div><button class="pvc" onclick="pvClose()">关闭</button></div>'

  initPlayer(uid);
  m.onclick=function(e){if(e.target===m)pvClose();};

}
function pvEsc(e){if(e.key==='Escape')pvClose();}
function pvClose(){
  var m=document.getElementById('pvm');
  if(m)m.remove();
  if(window.Pl&&Pl.audio){try{Pl.audio.pause();}catch(e){}}
  if(window.Pl){Pl.audio=null;Pl.segs=null;Pl.uid=null;}
  window.__pvOn=false;
  STAGE.uid='';STAGE.i=-1;
  document.removeEventListener('keydown',pvEsc);
}

/* ============================================================
   认证口径（管理端对任意学员计算，不依赖学员端 Cert 对象）
   ============================================================ */
function certRec(uid) {
  return (ADM.certs || []).filter(function (x) { return x.userId === uid; })[0] || {};
}
function learnScoreOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var total = 0, done = 0;
  var ps = ADM.prog.filter(function (x) { return x.userId === uid; });
  MODS.filter(function (m) { return !S || S.mods.indexOf(m.key) >= 0; }).forEach(function (m) {
    m.sections.forEach(function (sec) {
      total++;
      var k = m.key + '__s' + sec.n;
      var pr = ps.filter(function (x) { return x.unitId === k; })[0];
      if (!pr) return;
      var uid2 = 'g_m' + m.no + '_' + sec.n;
      var full = (window.NARR[uid2] || []).reduce(function (a, x) { return a + x.d; }, 0);
      var ok = (pr.status === 'done' || pr.status === 'quizzed')
        || (full > 0 && (pr.heard || 0) / full >= 0.8);
      if (ok) done++;
    });
  });
  return { done: done, total: total, score: total ? Math.round(done / total * CERT_RULE.learnFull * 10) / 10 : 0 };
}
function pracOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var ps = ADM.prog.filter(function (x) { return x.userId === uid; });
  var secs = 0, done = 0, got = 0, full = 0;
  MODS.filter(function (m) { return !S || S.mods.indexOf(m.key) >= 0; }).forEach(function (m) {
    m.sections.forEach(function (sec) {
      var k = m.key + '__s' + sec.n;
      var pr = ps.filter(function (x) { return x.unitId === k; })[0];
      var uid2 = 'g_m' + m.no + '_' + sec.n;
      var bank = (window.PRACTICE && window.PRACTICE[uid2]) || [];
      var each = Math.max(bank.length, CERT_RULE.pracEach);
      var qz = (pr && pr.quiz) || null;
      var best = qz ? Math.min(each, qz.best || 0) : 0;
      secs++; full += each; got += best;
      if (qz && (qz.best || 0) >= CERT_RULE.pracPass) done++;
    });
  });
  return {
    secs: secs, done: done, got: got, full: full,
    rate: full ? Math.round(got / full * 1000) / 10 : 0,
    score: full ? Math.round(got / full * CERT_RULE.pracFull * 10) / 10 : 0
  };
}
function objOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var c = certRec(uid), ex = c.exam;
  var keys = S ? S.dims : Object.keys(QUIZ.dims);
  var dims = {};
  keys.forEach(function (k) {
    var d = DIMS9[k] || QUIZ.dims[k] || { name: k, full: 0 };
    dims[k] = { name: d.name, got: 0, full: d.full };
  });
  var fullSum = keys.reduce(function (a, k) { return a + dims[k].full; }, 0);
  if (!ex) return { done: false, got: 0, full: fullSum, dims: dims, ex: null };
  QUIZ.items.forEach(function (q, i) {
    if (!dims[q.dim]) return;
    var d = ex.detail && ex.detail[i];
    dims[q.dim].got += d ? d.got : 0;
  });
  var got = 0, full = 0;
  Object.keys(dims).forEach(function (k) { got += dims[k].got; full += dims[k].full; });
  return { done: true, got: Math.round(got * 10) / 10, full: full, dims: dims, ex: ex };
}
function portOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var c = certRec(uid), rv = c.review, got = 0;
  var items = (S && S.portItems) || CERT_RULE.portItems;
  var full = items.reduce(function (a, it) { return a + it.full; }, 0);
  if (rv) {
    items.forEach(function (it) {
      (rv[it.k] || []).forEach(function (v) { got += (+v || 0); });
    });
  }
  return { submitted: !!c.portfolio, reviewed: !!rv, got: got, full: full || 40, pf: c.portfolio, rv: rv };
}
function judgeOf(uid, sk) {
  var S = sk ? stageOf(sk) : openStage();
  var L = learnScoreOf(uid, S && S.k), O = objOf(uid, S && S.k), P = portOf(uid, S && S.k);
  var PR = pracOf(uid, S && S.k);
  var totalFull = Math.round((CERT_RULE.learnFull + CERT_RULE.pracFull + O.full + P.full) * 10) / 10;
  var total = Math.round((L.score + PR.score + O.got + P.got) * 10) / 10;
  var weak = [];
  Object.keys(O.dims).forEach(function (k) {
    var d = O.dims[k], rate = d.full ? d.got / d.full : 0;
    d.rate = Math.round(rate * 100);
    if (O.done && rate < CERT_RULE.passDimRate) weak.push(d.name);
  });
  var c1 = total >= CERT_RULE.passTotal;
  var c2 = O.done && O.got / O.full >= CERT_RULE.passObjRate;
  var c3 = P.reviewed && P.got / P.full >= CERT_RULE.passPortRate;
  var c4 = O.done && weak.length === 0;
  var ready = O.done && P.reviewed;
  return {
    stage: S, learn: L, prac: PR, obj: O, port: P, total: total, totalFull: totalFull,
    weak: weak, ready: ready,
    passed: ready && c1 && c2 && c3 && c4,
    conds: [c1, c2, c3, c4],
    level: total >= 90 ? '优秀' : total >= 82 ? '熟练' : total >= 75 ? '合格' : '未通过'
  };
}

function examOf(uid,mk){
  return ADM.exams.filter(function(e){return e.userId===uid&&e.course===mk;})[0]||null;
}
function progOf(uid,mk){
  return ADM.prog.filter(function(p){return p.userId===uid&&p.course===mk;});
}
function doneOf(uid,mk){
  var total=modByKey(mk).sections.length;
  var d=progOf(uid,mk).filter(function(p){return p.status==='done'||p.status==='quizzed';}).length;
  return {done:d,total:total,pct:total?Math.round(d/total*100):0};
}
function totalDone(uid){
  return MODS.reduce(function(a,m){return a+doneOf(uid,m.key).done;},0);
}
function totalSec(){return MODS.reduce(function(a,m){return a+m.sections.length;},0);}

  var st=students();
  if(!st.length)return 0;
  var s=0;
  st.forEach(function(u){s+=judgeOf(u.id).total;});
  return Math.round(s/st.length*10)/10;
}

      var txt=document.getElementById('bulk-txt').value;
      var lines=txt.split('\n').map(function(x){return x.trim();}).filter(Boolean);

      });

        batch.forEach(function(u){ADM.users.unshift(u);});
        ADM.loaded=true;
        toast('已导入 '+batch.length+' 人'+(skipped?'，跳过重复 '+skipped+' 人':''));

   +'<th title="满分 5">学习</th><th title="满分 5">随堂</th><th title="满分 50">客观题</th><th title="满分 40">作品集</th>'
   +'<th>总分</th><th>四条件</th><th>结论</th><th>最近</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'</div><div class="cb" style="border-top:1px solid var(--line)">'

function openReview(uid){
  var c=certRec(uid);
  var u=ADM.users.filter(function(x){return x.id===uid;})[0]||{name:'学员'};
  var pf=c.portfolio;
  if(!pf){
    dlg('作品集评审','该学员还没有提交作品集', '<p style="font-size:13.5px;color:var(--mid);line-height:1.9">'
      +esc(u.name)+' 尚未填写作品集。学员端进入「能力认证 → 填写作品集」，提交后这里才可评分。</p>',
      [{t:'知道了',p:1,fn:function(){return true;}}]);
    return;
  }
  var rv=c.review||{a:[0,0,0,0],b:[0,0,0,0],note:''};
  var body='';
  CERT_RULE.portItems.forEach(function(it){
    body+='<div style="margin-bottom:18px"><div style="font-size:13px;color:var(--pri);font-weight:600;margin-bottom:6px">'
      +esc(it.name)+'（'+it.full+' 分）</div>';
    if(it.k==='a'){
      body+='<div style="background:#f8fafd;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.85;color:var(--mid);margin-bottom:10px">'
        +['谁在用','在什么条件下','为完成什么','现在怎么绕过','不做会怎样'].map(function(q,i){
            return '<div><b style="color:var(--deep)">'+(i+1)+'. '+q+'：</b>'+esc((pf.a&&pf.a[i])||'（空）')+'</div>';
          }).join('')+'</div>';
    }else{
      body+='<div style="background:#f8fafd;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.85;color:var(--mid);margin-bottom:10px">'
        +[0,1,2].map(function(i){
            return '<div><b style="color:var(--deep)">主问题 '+(i+1)+'：</b>'+esc((pf.b&&pf.b.q&&pf.b.q[i])||'（空）')
              +'<div style="color:var(--soft)">追问：'+esc((pf.b&&pf.b.q&&pf.b.q['x'+i])||'—')+'</div></div>';
          }).join('')
        +'<div style="margin-top:6px"><b style="color:var(--deep)">观察记录：</b></div>'
        +[0,1,2].map(function(i){return '<div>· '+esc((pf.b&&pf.b.obs&&pf.b.obs[i])||'（空）')+'</div>';}).join('')
        +'</div>';
    }
    body+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
      +it.dims.map(function(dn,di){
          var val=rv[it.k]&&rv[it.k][di]!=null?rv[it.k][di]:0;
          return '<label style="font-size:12.5px;color:var(--mid);display:flex;align-items:center;gap:7px">'
            +'<span style="flex:1">'+esc(dn)+'</span>'
            +'<select class="inp" style="width:74px;padding:5px 7px" data-k="'+it.k+'" data-d="'+di+'">'
            +[0,1,2,3,4,5].map(function(v){return '<option value="'+v+'"'+(v==val?' selected':'')+'>'+v+' 分</option>';}).join('')
            +'</select></label>';
        }).join('')+'</div></div>';
  });
  body+='<div style="margin-top:6px"><div style="font-size:12.5px;color:var(--mid);margin-bottom:5px">评语（可选，学员可见）</div>'
    +'<textarea class="inp" id="rv-note" rows="2" style="width:100%">'+esc(rv.note||'')+'</textarea></div>';

  dlg('作品集评审 · '+esc(u.name),'按 4 维 × 2 件逐项评分，每维 0–5 分，合计 40 分',
    body,[{t:'取消',fn:function(){return true;}},{t:'保存评分',p:1,fn:function(){
      var rev={a:[0,0,0,0],b:[0,0,0,0],note:(document.getElementById('rv-note').value||'').slice(0,500),
        by:Me.name,at:nowISO()};
      document.querySelectorAll('.dlg select[data-k]').forEach(function(el){
        rev[el.dataset.k][+el.dataset.d]=+el.value;
      });
      var doc={userId:uid,name:u.name,loginId:u.loginId};
      Object.assign(doc,c,{review:rev});
      delete doc.id;
      Cloud.upsert('gel_cert',[{id:uid,doc:doc}]).then(function(){
        ADM.loaded=false;
        admLoad(true).then(paintAdmin);
        toast('已保存，学员总分与排名已更新');
      }).catch(function(e){toast('保存失败：'+String(e.message||e).slice(0,40));});
      return true;
    }}]);
}

          +'<div style="font-size:12.5px;color:var(--muted);line-height:1.7">'+esc(c.flip)+'</div></div>';
      }).join('');
    }
    h+='</div></div>';
  });
  return h;
}

    { dim: 'need', type: 'single', s: 1.5,
      q: '需求鉴真表最核心的作用是什么？',
