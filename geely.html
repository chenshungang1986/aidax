，用户结构完全不同。同样是内部系统，照搬方法论，一定失焦。"}],"g_m1_6":[{"u":"audio/geely/g_m1_6_0.m4a?v=2026110417","d":39.89,"t":"这一节换个视角，从单个需求拉到全景：行业里的数字化产品分成几类，每一类的用户结构有什么不同。为什么要讲这个？因为很多同学会把另一类产品的做法直接搬过来，方法论就失焦了。比如你在车主 App 那边做得很顺手，调过来做费控，会发现原来那套完全不好使——因为那边的用户是自愿的，这边的用户是被要求的。这一节给你一张地图，帮你定位自己在哪一格。"},{"u":"audio/geely/g_m1_6_1.m4a?v=2026110417","d":52.27,"t":"行业里的数字化产品，粗略分六类。第一类，集团协同办公，主要用户是全体员工，动机是被要求使用，体验关键是流程不绕、状态可见。第二类，供应链与采购，用户是采购执行、需求方和供应商，动机是业务必须完成，体验关键是状态透明、时效。第三类，制造与质量，用户是班组长、质检、工艺，动机是生产节拍驱动，体验关键是少录入、能离线。第四类，经销商与售后，用户是门店顾问、服务经理，动机是考核与返利，体验关键是算得清、少返工。"},{"u":"audio/geely/g_m1_6_2.m4a?v=2026110417","d":53.28,"t":"第五类，车主 App 与车机，用户是车主，动机是自愿使用，体验关键是快、准、有惊喜。第六类，就是本期要讲的职能数字化，用户是人力、财务、采购的同事，动机是制度要求加自身省事，体验关键是一次填对、状态可查。这六类里，前五类你都可能接触过，但方法论不能直接搬。我举一个最典型的对比：车主 App 的用户不用就卸载了，所以留存率是真信号；而职能系统的用户不用就没法交差，使用率是假信号。同一个指标，含义完全相反。"},{"u":"audio/geely/g_m1_6_3.m4a?v=2026110417","d":36.7,"t":"重点讲职能域的三个特征，它们决定了方法要改哪里。第一个特征，用户即同事。你明天还要跟他开会，甚至他就坐在你斜对面。这个特征带来两个后果：一是你不能「调研完就下结论」，你的方案要能当场被质疑、当场解释；二是他会给你留面子，访谈时说「挺好的」，这会严重污染你的样本。所以内部访谈要比外部访谈更刻意地去拿具体事件，不能靠感觉。"},{"u":"audio/geely/g_m1_6_4.m4a?v=2026110417","d":37.94,"t":"第二个特征，需求即管理动作。职能域的需求背后往往是一条管理制度：为什么要这个字段，因为制度要求留痕；为什么要这一级审批，因为内控规定。改系统等于改制度，光靠产品经理推不动，要拉制度 owner 进来。判断方法很简单：问一句「这是谁定的」。如果答不上来，说明这个约束可能是历史遗留，而不是现行制度——历史遗留是可以谈的，现行制度不能硬碰。"},{"u":"audio/geely/g_m1_6_5.m4a?v=2026110417","d":34.18,"t":"第三个特征，系统即制度载体。它承载的是「必须这样做」。这一条最反直觉：体验的天花板由制度决定，不由界面决定。你可以把界面做得再顺，如果制度要求三级审批，用户还是得等三天。所以职能域的产品经理，真正的高价值工作不是画原型，是参与制度设计——在制度定下来之前，把执行成本讲清楚。"},{"u":"audio/geely/g_m1_6_6.m4a?v=2026110417","d":30.67,"t":"把这三个特征合起来看，你会发现职能域的产品经理有个独特的优势：你能同时看到制度、流程和系统三件事，而业务部门只看得到自己那一段。这个视角就是你的价值。但前提是你得走出去，不能只坐在会议室里看流程图。流程图上写的是应该怎么走，工位上发生的才是实际怎么走。"},{"u":"audio/geely/g_m1_6_7.m4a?v=2026110417","d":57.7,"t":"把六类系统的体验关键展开说两句，你就明白为什么不能照搬。制造与质量类的系统，体验关键是「能离线」——车间里信号不好，班组长不可能为了填一条记录走到办公室，所以离线录入、断点续传是硬需求，不是加分项。供应链与采购类，体验关键是「时效」，因为它的下游是生产计划，晚一天就是停线风险，所以状态透明比界面美观重要得多。经销商与售后类，体验关键是「算得清」，因为门店顾问的收入跟返利挂钩，一个算不清的界面会直接引发投诉。你看，同样是「好用」，在不同类里指向完全不同的东西。"},{"u":"audio/geely/g_m1_6_8.m4a?v=2026110417","d":63.07,"t":"职能域的用户地图怎么画？一张纸就够。横轴画流程节点，从发起到结束，四到六段，比如申请、审核、审批、付款、归档。纵轴画四层角色：使用者、管理者、决策者、监管者。然后往格子里填人，填具体的岗位名，不填部门名。填完你会看到两件事：一是有些格子是空的，那是你还没覆盖到的人；二是有些人的名字出现在好几个格子里，那个人就是关键用户，他的诉求优先级最高。这张图的价值在于，它把「用户是谁」从一个抽象问题变成了一个可以逐格检查的清单。我建议每个项目开工第一周就画这张图，贴在墙上，后面每次需求评审都对着它看。"},{"u":"audio/geely/g_m1_6_9.m4a?v=2026110417","d":53.93,"t":"跨类迁移有三个陷阱，我提醒一下。第一个，把留存率搬到内部系统。车主 App 的留存是真信号，内部系统的留存没有意义，因为不用就没法交差。第二个，把满意度问卷直接搬过来。内部系统的满意度会被「怕被考核」严重污染，同一个人当面打八分，私下说「凑合用」。第三个，把净推荐值搬过来。内部系统没有「推荐给同事」这个场景，问了也白问。这三个指标不是不能用，是要换问法：留存换成绕行率，满意度换成求助工单量，推荐值换成「如果明天系统停用一天，你的工作受影响多大」。"},{"u":"audio/geely/g_m1_6_10.m4a?v=2026110417","d":47.59,"t":"这张地图有三个具体用途。第一个，立项时用它界定范围：这次改哪几个格子，不改哪几个，写进立项材料，避免后面无限扩张。第二个，排期时用它排序：同一个需求影响到几个格子，影响格子多的优先。第三个，汇报时用它讲故事：不说「我们优化了报销流程」，说「四位审核员每人每月省六个半小时，财务经理早一天看到月结数」。同样是汇报，后一种说法对方能记住，因为里面有具体的人和具体的数。"},{"u":"audio/geely/g_m1_6_11.m4a?v=2026110417","d":58.34,"t":"怎么判断自己负责的系统属于哪一类？三个问题。第一问，用户有没有选择权——可以不用吗？可以就会去别的地方，不可以就只能忍着。第二问，动机来自制度还是来自任务？制度驱动的系统，使用率不可信；任务驱动的系统，绕行率更能说明问题。第三问，失效的后果落在谁身上——落在业务上、落在合规上，还是落在某个人的考核上。这三个问题回答完，系统的类别就清楚了，方法也就知道该往哪边调。我建议你把这三个答案写进项目的背景页，每次评审前看一眼，防止不知不觉用了别类产品的方法。"},{"u":"audio/geely/g_m1_6_12.m4a?v=2026110417","d":40.54,"t":"这一节收一下。六类系统，用户结构完全不同，动机来源完全不同，照搬方法论就会失焦。职能域的三个特征是：用户即同事、需求即管理动作、系统即制度载体。这一节的任务：判断你负责的系统属于哪一类，然后写一句话——它的用户动机是自愿还是被迫。如果答案是「一半一半」，那说明你还没分清使用者和管理者，回到第四节再看一遍四层结构。"},{"u":"audio/geely/g_m1_6_13.m4a?v=202611061038","d":51.31,"t":"这一节钉三句话。第一，六类系统用户结构不同、动机来源不同：交易、管控、协同、分析、工具、平台。第二，职能域有三个特征：用户即同事、需求即管理动作、系统即制度载体。第三，先定位系统类型，再定访谁、问什么，否则访谈对象一开始就选错了。下一节是模块一最后一节，我把全课路线图和作业要求一次讲完：三个提交节点、两份必交件。以及一件事——为什么这门课的交付不是「听完」，而是那几张填满的表。"}],"g_m1_7":[{"u":"audio/geely/g_m1_7_0.m4a?v=2026110417","d":43.82,"t":"M1 到这里结束，最后两分钟说清楚后面怎么走。整门课八个模块，每个模块都有一件产出物，其中两件必须进作品集：M5 的需求鉴真表，和 M7 的用户旅程地图。这两件是认证的硬指标。M1 的产出物是场景还原五问卡，作为配套材料；M2 是深访提纲加观察记录表。学习节奏建议两周：第一周把 M1 到 M4 的内容过完，同时完成五问卡；第二周做 M5 到 M8，并动手写提纲、做观察。"},{"u":"audio/geely/g_m1_7_1.m4a?v=2026110417","d":44.09,"t":"把两周节奏说细一点，方便你安排。第一周：周一到周二看 M1，周三到周四看 M2，周五交五问卡和深访提纲初稿；第二周：周一到周二看 M3 和 M4，周三到周四做 M5 的需求鉴真表，周五做 M7 的旅程图。M6 和 M8 可以并行听，不占整块时间。三次提交节点分别是周五的五问卡、第二周周三的鉴真表、第二周周五的旅程图，后两件进作品集，直接用于认证评审。"},{"u":"audio/geely/g_m1_7_2.m4a?v=2026110417","d":40.06,"t":"为什么要强调产出物？因为这门课真正的交付不是「听完」，是那几张填满的表。你听完八个小时，能力模型上的分数不会动；你把五问卡和旅程图填出来，评审才有依据。所以每个模块结束时，我都会给你一个具体动作，不是「思考一下」，是「写出来发出去」。下一节进入 M2，讲怎么做定性研究——也就是怎么把五问卡里那些填不出来的格子，用一次访谈补上。"},{"u":"audio/geely/g_m1_7_3.m4a?v=202611061038","d":41.47,"t":"模块一到这里收口。三句话：第一，八个模块按两周节奏推进，每天四十分钟，别攒。第二，三个提交节点，逾期不补，到点把东西发出去，不要等完美。第三，必交件是五问卡，加上模块二的深访提纲和观察记录。下一节进模块二，第一件事是把「不满意」翻译成可观察的现象。因为「用户为什么不满意」这个问题，本身就问不出答案——我们看怎么把它改成能被观察、能被验证的研究问题。"}],"g_m2_1":[{"u":"audio/geely/g_m2_1_0.m4a?v=2026110417","d":54.65,"t":"这一节讲定性研究的第一步，也是最容易被跳过的一步：把业务问题翻译成研究问题。很多同学拿到任务就去做访谈，提纲一列二十个问题，聊完写一份纪要，结论是「用户希望更简单」。问题出在最开始：题目本身不可研究，所以怎么问都问不出东西。这一节五分钟，我给你三样东西：不可研究题目的三个特征，一个改写公式，还有改写前后的对照。先说结论：能被观察到，才可能被研究；「他想要什么」不可观察，「他上一次做了什么」才是可观察的。这条判断会决定你后面所有访谈的成败。"},{"u":"audio/geely/g_m2_1_1.m4a?v=2026110417","d":62.95,"t":"先说不可研究的题目缺什么。第一个，缺角色。「用户觉得流程太麻烦」——哪个用户？一线还是审批人？这两拨人的麻烦根本不是一回事：一线嫌填得多，审批人嫌看不到关键信息。你把两拨人混在一个题目里，访谈的时候就会一会儿问这个、一会儿问那个，最后结论也混在一起。第二个，缺环节。「报销体验不好」——填报、审核、打款，哪一段？没有环节就没有观察点，你只能得到一句笼统的评价。第三个，缺缺失物。「希望系统更智能」——缺的是信息、是提醒、还是自动填？说不出缺失物，就设计不出方案，因为「更智能」这三个字后面可以接一百种做法。"},{"u":"audio/geely/g_m2_1_2.m4a?v=2026110417","d":60.24,"t":"所以改写公式是三段：谁，在哪一环，因为缺什么而放弃。注意是「而放弃」，不是「而不满」。放弃是可观察的行为终点，不满只是情绪。举例子：原题「财务觉得报销系统难用」，改写成「费用审核员在审核环节，因为看不到供应商历史付款记录，放弃核对，改为按月抽查」。你看，改写以后，观察点自动出来了：你要观察他审核时打开哪几个窗口、在哪一步停下、什么时候切到 Excel。提纲也有了落点：问最近一次审核，问那次他是怎么查历史的。这就是可研究题目的标准：一读就知道去哪看、问谁、问什么。"},{"u":"audio/geely/g_m2_1_3.m4a?v=2026110417","d":57.96,"t":"再补一个环节，容易被忽略：改写完的题目要让业务方确认一次。为什么？因为研究题目是你对业务问题的转译，转译就可能失真。具体做法是把改写后的那句话念给提需求的人听，问他一句：如果我去看这件事，是你想解决的问题吗？他如果说「不完全是，我更关心的是某某」，那你就拿到了更准的题目。这个动作只要五分钟，但能避免你做完两轮访谈才发现方向错了。另一个动作是给题目加一个「不研究什么」的清单——比如这次不研究审批链合理性，只研究审核环节的取数困难。写清边界，后面约人的时候就不会被拉进无关的讨论。"},{"u":"audio/geely/g_m2_1_4.m4a?v=2026110417","d":58.13,"t":"把四个动作再收一遍，方便你照着做。第一步，写下原始问题，把业务方原话照抄，不要先美化——「大家都说难用」这句话本身是重要信息，它说明业务方也没有具体事实。第二步，找角色，具体到岗位、职级、是否外包，一个角色一张提纲。第三步，切环节，把流程切成四到六段，指出问题落在哪一段。第四步，补缺失物，在这一段里他缺的是信息、权限、提醒，还是模板。四步走完，题目就变形了：从一个态度问题，变成一个可以观察的行为问题。这一节的任务：把你手上一个模糊的抱怨，按这个公式改写成一句话，然后问自己——如果这句话成立，我应该去哪看、问谁。"},{"u":"audio/geely/g_m2_1_5.m4a?v=202611061038","d":40.06,"t":"这一节钉三句话。第一，「不满意」是情绪，不是研究问题，研究问题要落到谁、在什么条件下、做了什么。第二，四步改写：照抄原话、找角色、切环节、定问题。第三，一句话测试：这句话能被观察到吗？观察不到，就还没改完。下一节讲抽样：为什么不能只访接口人。访谈了八个人都说「还行」，问题往往不在你的提问技巧，而在你访的那八个人，早就被系统驯化了。"}],"g_m2_2":[{"u":"audio/geely/g_m2_2_0.m4a?v=202611061142","d":46.15,"t":"这一节讲抽样。听起来像统计学，其实在 B 端内部研究里，抽样是个人际问题：你能约到谁。最常见的失败是这样的：找了八个部门联络人，每个人都配合，都说「还行，就是有点慢」，你拿着这个结论去立项，被业务方一句「一线根本不这么想」打回来。问题不在访谈技巧，在样本结构——你访的这八个人，是最不可能抱怨的那八个人。这一节五分钟，讲清接口人偏差、四类样本，还有六到八人饱和怎么判断。"},{"u":"audio/geely/g_m2_2_1.m4a?v=202611061142","d":52.1,"t":"为什么接口人有偏差？三个原因。第一，他是指定联络人，通常是最熟悉系统、最配合工作的那个人，他已经适应了系统，问题在他这里被消化掉了——不是他不说，是他真的不觉得是问题。第二，他承担反馈职责，说的话会经过一次自我审查：哪些能说、哪些说了会给自己添麻烦。第三，他离实际操作用户有距离，一个部门的联络人往往自己不做那些琐碎动作，他听到的是二手信息。所以接口人不是不能访，是不能只访他。他的价值在于帮你找到后面那三类人，不在提供结论。"},{"u":"audio/geely/g_m2_2_2.m4a?v=202611061142","d":60.34,"t":"要覆盖四类样本。第一类，关键接口人，一到两人，作用是导航和给名单。第二类，极端用户，用得最多的人和完全不用的人。用得最多的人暴露效率瓶颈，因为他把每个环节都走遍了；完全不用的人暴露放弃原因，因为他已经绕开了。第三类，边缘用户：外包、兼职、跨基地、临退休。这一类人的权限和培训覆盖最薄弱，问题最集中，也最容易被抽样漏掉。第四类，放弃者：已经彻底绕行的人。他们不在系统里，你从系统名单上根本抽不到，只能靠观察和旁敲侧击找——问一句「这件事你们组谁还在用 Excel 做」，通常就能找到。"},{"u":"audio/geely/g_m2_2_3.m4a?v=202611061142","d":46.42,"t":"抽样不看人数，看是否覆盖了四种处境。具体做法是分层：同一角色下，按使用频次、权限范围、入职时长各取两人。这样六个人就能覆盖三组处境，比随机抽十个人有效得多。另一个硬要求：至少找到一个绕行者。找不到绕行者，说明你的样本仍然全部在系统内，你听到的会是同一个版本的真相。找到之后，不要问他「为什么不用的」，直接说「你演示一下现在你怎么做这件事」，让他一步步操作，你在旁边记。这个动作的信息密度，比一小时访谈还高。"},{"u":"audio/geely/g_m2_2_4.m4a?v=202611061142","d":45.02,"t":"最后补一个实操问题：名单怎么要。三个入口。第一个，系统后台的用户列表，按操作频次排序，取最高和最低各若干，这是最快找到极端用户的办法。第二个，部门联络人，让他给一份「这个流程谁最熟、谁最不熟」的名单，注意要两份，不要一份，因为熟了的人和生的人给出的信息完全不同。第三个，自己扫楼，在工位上问一句「这件事你们组一般谁弄」，往往能找到系统名单上没有的人，比如外包和兼职。"},{"u":"audio/geely/g_m2_2_5.m4a?v=202611061142","d":53.69,"t":"最后说饱和怎么判断。饱和不是访够八个人，是连续两到三个人不再带来新的问题类型。注意是「类型」，不是「细节」——细节永远会新增，类型会收敛。所以我建议你访谈时边访边归类：每访完一个人，把他的问题归到已有的类别里，或者新开一类。如果连续三个人都是往已有类别里填，可以停；如果每个人都能开出新类别，说明样本还不够，或者你的角色分层有问题。这一节的任务：为你的研究题目列一份六到八人的抽样名单，每人在后面标一个处境标签，然后检查一遍——四类样本里，你缺了哪一类。"},{"u":"audio/geely/g_m2_2_6.m4a?v=202611061142","d":166.82,"t":"讲完抽样，加一段：这份名单怎么用 WorkBuddy 排。数据从系统后台导，但导出来第一件事是脱敏。姓名、工号、手机号全部删掉，只留岗位、职级、是否外包、所属基地、入职时长、近三个月操作次数、权限范围。内部数据不要整表往外扔，这一条比效率重要。我常用的说法是：这是一份脱敏后的用户列表。请按四类处境分桶——关键接口人、极端用户、边缘用户、放弃者，极端用户分成用得最多、和一次不用两个桶。每桶给三个人选，说明为什么归这一类。分不进去的单独列出来，不要硬塞。最后告诉我哪一桶是空的。哪一桶是空的，这句最值钱。名单再漂亮，空桶都在那儿——空桶就是你这次抽样的缺口，而缺的那一桶，往往正是问题最集中的地方。第二个用法：排约访顺序，给每个人一句开场。它默认从高频用户开始，因为那样最省事；你要的是先约一个绕行者，把真实做法看一遍，再回去谈方案。顺序自己调，理由让它写。第三个用法：找绕行者的问法。这些人系统名单上没有，只能问出来。让它给三句能在工位上直接说出口的话：这件事你们组一般谁还在用 Excel 做、谁从来不用这个系统。话说得太正式，对方会防着你。三个坑。第一，它默认给你随机抽样，按部门均匀抽取十人，最省事，也最没用。抽样不看人数，看是否覆盖了四种处境，这条必须写进提示词。第二，它会编人去填表。字段不全时它补一个某基地财务专员，看着很真，但那个人不存在。所有岗位必须来自你给的表，表里没有的写待补。第三，它会把操作次数低直接归成不用的人。可频次低有很多原因：权限没开、刚入职、只做季度业务。频次低不等于放弃，放弃是绕行，这两类要分开。从后台拉数到标签标好，半小时。省下的时间用来真的去扫一次楼，名单上没有的人都在楼道里。工具的位置放对：它分桶，你判断谁值得聊。"},{"u":"audio/geely/g_m2_2_7.m4a?v=202611061142","d":43.08,"t":"这一节钉三句话。第一，接口人已经被系统驯化，他的「还行」不代表一线。第二，样本要覆盖四类处境，其中必须有一个「不爱用」的人，否则你听不到绕行。第三，少于六个人不要下结论，饱和的标准是连续两到三个人不再带来新的问题类型。下一节给你一份能直接用的东西：深访提纲。BEI 结构怎么搭，追问怎么往下挖三层，还有四类必须删掉的提问。为什么问「你觉得应该怎么改」，永远问不出真问题。"}],"g_m2_3":[{"u":"audio/geely/g_m2_3_0.m4a?v=2026110417","d":45.5,"t":"这一节讲提纲怎么设计。先问一个问题：你为什么问不出真问题？很多人以为是技巧不够，其实是问法错了。你问「你觉得应该怎么改」，对方给你一个方案；你问「你觉得哪里不好用」，对方给你一个评价。方案和评价都不是事实，你拿它们做不了设计决策。事实只有一个来源：具体发生过的某一次。这一节七分钟，讲 BEI 的三段结构、五问追问法，还有四类必须从提纲里删掉的提问。这三样东西配齐，你的提纲就能用了。"},{"u":"audio/geely/g_m2_3_1.m4a?v=2026110417","d":58.25,"t":"BEI 是行为事件访谈，核心就一句：不问观点，问最近一次具体发生了什么。它有三段。第一段，情境：「上一次遇到这个问题是什么时候？当时你在做什么？」这一问锁定时间、地点、任务，把对方从抽象评价拉回具体场景。第二段，行为：「你当时第一步做了什么？然后呢？」只要动作，不要解释。他一旦开始解释「因为系统设计得不合理」，你就往回拉：「稍等，这一步你具体点了哪里？」第三段，结果：「最后这件事怎么解决的？花了多久？」这一问拿到代价和绕行路径，是整个访谈里信息量最大的部分。"},{"u":"audio/geely/g_m2_3_2.m4a?v=2026110417","d":46.85,"t":"BEI 有个常见错法：把三段问成了三段评价。比如对方说「系统太慢」，你接着问「你觉得慢在哪」，这就又回到观点了。正确接法是「最近一次觉得慢是哪天，当时在做什么，等了多久」。还有一个错法：只问情境不问结果。很多人聊得很投入，聊了四十分钟当时的场景，但没问最后怎么解决的、花了多久。结果你知道了问题，不知道代价，也就没法定价。所以我建议提纲里把「花了多久」「最后怎么弄成的」写成固定问题，每段都要问一遍。"},{"u":"audio/geely/g_m2_3_3.m4a?v=2026110417","d":50.42,"t":"再说五问追问法，这是把模糊回答挖到具体的五个句式。第一，「能举个最近的例子吗」——把评价拉回事件，对方说「经常出错」，你就问他上一次出错是哪天。第二，「当时你怎么做的」——拿到动作序列，特别注意系统外的动作，那是绕行的入口。第三，「为什么这么做」——拿到他的判断依据，往往就是需求的真实约束。第四，「后来怎么解决的」——拿到绕行路径与代价。第五，「还有别人也这样吗」——判断这是个体特例还是结构性问题，决定要不要扩大样本。这五句不用背，写在提纲最上面当提示，访谈中卡住就挑一句问。"},{"u":"audio/geely/g_m2_3_4.m4a?v=2026110417","d":48.48,"t":"四类提问必须从提纲里删掉。第一类，假设性问题：「如果系统能自动填，你会用吗？」所有人都说会用，这个答案没有信息量。第二类，引导性问题：「是不是因为字段太多所以慢？」你把答案写进问题里，对方只会点头。第三类，评价性问题：「你觉得这个功能好不好？」这是让人替你下结论。第四类，未来性问题：「你希望明年系统变成什么样？」人对未来的想象受限于他见过的系统，问出来的是他的想象力，不是他的需求。这四类删掉，提纲会短一半，信息量反而更大。"},{"u":"audio/geely/g_m2_3_5.m4a?v=2026110417","d":60.34,"t":"提纲写完之后要做一次预访谈，这一步绝大多数人会跳过，但它是性价比最高的一步。找一个关系好的同事，把提纲念一遍，限时三十分钟，让他随时打断说「这句我没听懂」。你会立刻发现三类问题：一是问题太长，一句话里套了三个问号，对方不知道该答哪个；二是术语太多，你用了「闭环」「拉通」「埋点」，他得先翻译再回答，思路就断了；三是顺序不顺，前面的问题把后面的答案带出来了，导致后面问不出东西。预访谈还有一个作用：让你熟悉自己的提纲，正式访谈时不用低头看纸，能一直看着对方的眼睛。低头看提纲的那几秒，往往就是对方说出关键信息的那几秒。"},{"u":"audio/geely/g_m2_3_6.m4a?v=2026110417","d":47.35,"t":"还有一种提纲结构值得试：把提纲做成「一次任务复盘」，而不是「一串问题」。开场就说：我们挑上周你做过的某一天，从早上第一件事讲到现在。然后顺着他的叙述走，在关键节点插追问。这样做的好处是，问题不再是孤立的，而是嵌在一条时间线里，你能看到因果顺序：因为系统里查不到，所以他先问了同事，所以晚了半小时。因果顺序是设计决策最需要的原料，而一串孤立问题永远拼不出因果。代价是主持难度更高，你要不停判断「现在该不该打断」，建议先用两三次访谈练手。"},{"u":"audio/geely/g_m2_3_7.m4a?v=2026110417","d":58.92,"t":"最后说提纲的整体结构，七分钟能讲完的部分。一次九十分钟的深访，我建议这样排：前十分钟破冰和背景，不问系统；中间五十分钟走 BEI，挑两到三个最近发生的事件，每个事件把情境、行为、结果问完整；接着十五分钟问绕行和替代方案，让他演示现在怎么做；最后十分钟做复述校验和补充。提纲上写的问题不要超过十五个，每个问题下面列三到五个追问句式。问题多了你会赶进度，赶进度就问不出细节。这一节的任务：写一份十到十二个主问题的提纲，每个主问题下面配三个追问，然后自己念一遍，把属于那四类的全删掉。"},{"u":"audio/geely/g_m2_3_8.m4a?v=202611061038","d":143.86,"t":"讲完提纲，加一段怎么用 AI 把它写快。把三样东西一起交给 WorkBuddy：你的五问卡、受访者的岗位说明、上一轮访谈的记录。然后给它一个角色，和一条硬约束。我常用的说法是：受访者是某基地的费用审核员，外包，日均处理六十单，场景是报销单批量导入。请按 BEI 结构写十二个主问题，每问配三个追问，追问必须指向最近一次具体事件，要有时间、动作、结果。不要问「你觉得应该怎么改」。输出后逐条标注它属于情境、行为、结果还是绕行。最后，把你原本想问、但属于假设性、引导性、评价性、未来性的问题，单独放进「删除区」，并说明为什么该删。最后那句「删除区」是关键。你让它自己把不该问的写出来、再自己删掉，比事后你一条条审要快，而且它会把那四类的边界讲清楚——这正好是这一节的知识点。但要防两个坑。第一，AI 写追问特别爱写成并列选项：你是觉得慢，还是觉得麻烦？这是引导题，必须改成：上一次出现这种情况是什么时候，当时你怎么做的。第二，它会写得太完整、太客气，像客服话术，不像人和人说话。提纲是要念出来的，念一遍，凡是拗口的、你自己都不会这么说出口的，改成口语。还有一个用法：让它扮演受访者，你先试访一轮。你说，你现在是那位外包审核员，我问什么你答什么，遇到不想答的就含糊过去。然后真的问一遍。你会立刻发现哪些问题问不动、哪些追问接不上。这一轮试访十五分钟，能省掉现场半小时的尴尬。提纲初稿十五分钟能出来，省下的时间用来找两个真实受访者试访，别用来把提纲改得更漂亮。"},{"u":"audio/geely/g_m2_3_9.m4a?v=202611061038","d":44.09,"t":"提纲这一节，钉三句话。第一，BEI 的问法是先问最近一次具体事件，不问一般情况。第二，追问一次往下挖三层：当时什么情况、你做了什么、结果怎么样。第三，假设性、引导性、评价性、未来性，四类全删。下一节讲执行：破冰、沉默、录音与当场复述。同一份提纲，不同的人去问，拿回来的东西能差一倍。差别常常在开场那三句话，和对方说完之后你沉默的那五秒。"}],"g_m2_4":[{"u":"audio/geely/g_m2_4_0.m4a?v=2026110417","d":38.9,"t":"这一节讲执行。提纲写好了，访谈还是可能失败，因为内部访谈最大的阻力不是时间，是「他怕你在考核他」。这个担心不解决，你问什么都是「挺好的」。这一节七分钟，四个动作：破冰、前十分钟、沉默五秒、当场复述；再加上三类现场反应的处理办法。先说一句结论：访谈不是聊天，是有一张清单要拿满。你可以聊得很愉快，但清单没拿满，这次访谈就是失败的。"},{"u":"audio/geely/g_m2_4_1.m4a?v=2026110417","d":52.75,"t":"先说破冰。破冰的目的不是拉近关系，是消除考核感。所以开场三十秒必须说清三件事：这次不是评估你的工作；我要了解的是系统哪里给你添了麻烦；问题会匿名汇总，不会追溯到个人。这三句话要说得具体，不能只说「你放心」。更好的做法是给一个承诺加一个动作：承诺「我整理完会先把结论发你看一遍，有不准确的地方你直接改」，动作是「今天我不做记录表，只记要点」。内部访谈里，愿意给你真话的人不多，你每失去一个，就少一个后续可以回访的人。"},{"u":"audio/geely/g_m2_4_2.m4a?v=2026110417","d":54.91,"t":"第二个动作，前十分钟不问系统。先聊他一天怎么过、什么时候最忙、这个月最烦的一件事是什么。目的是让他进入叙述状态。人一开始讲自己的日常，语速会变、细节会多，这个时候你再问系统，他给的就是场景不是评价。第三个动作，沉默五秒。对方说完停住的时候，不要急着接话、不要急着点头总结。五秒的空白很难熬，但往往就是这五秒，换来最关键的那句补充——「其实还有个事」。我建议你在提纲上写一句提醒：停住就数五秒。这个技巧没有成本，效果比任何追问句式都好。"},{"u":"audio/geely/g_m2_4_3.m4a?v=2026110417","d":46.92,"t":"第四个动作，当场复述。访谈进行到一半和结束时，各做一次。句式是：「我复述一遍，你看我理解得对不对——你每月初要花两天做这件事，因为系统里查不到历史数据，所以你自己维护了一个台账，对吗？」让对方纠错。复述有三个作用：确认事实、暴露你自己的理解偏差、让对方感觉被听懂从而愿意多说。注意复述要具体到数字和时间，不要说「你觉得这个流程很麻烦，我理解得对吗」，那不是复述，是共鸣。"},{"u":"audio/geely/g_m2_4_4.m4a?v=2026110417","d":63.84,"t":"再说三类现场反应怎么处理。第一类，对方开始给方案。比如他说「你们应该做个批量导入」。别急着记，也别否定，先接住再还原：「这个思路我记下了。你说的这个问题，最近一次发生是什么时候？」把方案当作线索，顺着它回到事件。第二类，对方只说「都挺好」。换问法，用对比逼出问题：「有没有哪次你干脆在 Excel 里做了？」「最麻烦的一次是什么情况？」「如果明天系统停用一天，你的工作会受多大影响？」这三个问法比「哪里不好用」有效得多。第三类，对方开始抱怨人。把话题拉回系统和流程：「这件事在系统里是怎么走的？」人的问题另外记，但不要在现场附和，附和会让你后面的话都变成站队。"},{"u":"audio/geely/g_m2_4_5.m4a?v=2026110417","d":68.09,"t":"访谈结束后，整理稿怎么写，这一步决定了研究能不能复用。我建议三栏：事实、原话、判断。事实栏写发生了什么，比如「九月三日上午，他处理了十一单，退回四单，退单原因都是附件不全」。原话栏照抄关键句，比如「这个我得先看群里有没有人发过」。判断栏写你的推断，并且一定要标注「推断」，比如「推断：退单主因是附件规范没有前置告知」。三栏分开的好处是，事实和原话可以直接进报告、可以被别人复核，判断一旦被证伪，是正常的认知修正，不会变成你的失误。另外建议访谈后立刻约一次十五分钟的二次确认，只问两个问题：我理解得对吗，有没有漏掉的重要情况。这十五分钟经常能拿到最有价值的一句话。"},{"u":"audio/geely/g_m2_4_6.m4a?v=2026110417","d":51.65,"t":"再补一个执行细节：怎么处理对方的时间压力。内部访谈最常见的失败是「我只有二十分钟」。遇到这种情况，不要试图压缩九十分钟的提纲，直接改成「只问一个事件」：挑最近一次最麻烦的事，把情境、行为、结果走完，正好二十分钟。二十分钟拿一个完整事件，比四十分钟拿五个半截回答有用得多。走之前补一句：这次先到这，下次你方便的时候我想再看看另一次的情况。愿意让你再来的比例很高，因为第一次你守时、不啰嗦，他就知道你不会浪费他的时间。"},{"u":"audio/geely/g_m2_4_7.m4a?v=2026110417","d":52.75,"t":"最后说两件容易被忽略的事：录音和合规。录音一定要先问，说清用途和保存期限，对方不同意就用笔记，不要偷偷录——内部访谈被发现一次，你在整个部门都约不到人了。同意录音的，也要在访谈结束后四十八小时内整理完，超过这个时间细节会失真。整理时按「事实、原话、你的判断」三栏分开写，事实和原话可以直接进报告，判断要标注是你自己的推断。这一节的任务：按这四个动作，去做一次六十分钟的访谈，录音前问一句，结束时复述一次，然后把整理稿按三栏写出来。"},{"u":"audio/geely/g_m2_4_8.m4a?v=202611061038","d":129.43,"t":"讲完执行，加一段：访谈策划案怎么用 AI 出。去现场之前，最耗神的不是提纲，是那一堆琐事：谁访谁、几点去、在哪儿坐、录音怎么问、谁记录、访完多久交东西。每一件都不难，但漏一件就白跑。把它们交给 WorkBuddy，一次出全。我常用的说法是：我下周去某基地访谈三位费用审核员，每人六十分钟，场地在办公区。请输出一份访谈执行策划案，做成表格，我要打印带走。要包括五件事：一，时间窗建议，避开他们的业务高峰，并说明理由；二，场地与座位安排，要求能看到他的屏幕，不要会议室；三，六十分钟的分钟级流程，破冰、暖场、事件回溯、绕行演示、复述校验各占多久；四，破冰话术和录音知情同意话术，各一百字以内，不要有评估感；五，记录分工，以及访后二十四小时内要交的三样东西。它给的初稿通常七八成能用，但有三处必须你自己改。第一，时间窗它不知道你们基地哪天结账，这个只有你知道，一定要按对方的班次倒推。第二，场地它会默认会议室，而会议室里问不出绕行，最好选工位旁边，能看到他真实怎么操作。第三，录音它一定建议录，但内部访谈里录音是要争取的，不是默认的——对方不同意就用笔记，不要偷偷录。改完这三处，这份策划案就能直接打印带走。现场你只管执行，不用一边问一边想下一步该干嘛。顺便说一句，访完那三样东西也可以让它先出骨架：访谈纪要、绕行清单、待验证假设。你补事实，它排版。"},{"u":"audio/geely/g_m2_4_9.m4a?v=202611061038","d":44.28,"t":"执行这一节，钉三句话。第一，破冰要说清三件事：不是评估你、会添麻烦、匿名汇总。第二，沉默五秒，对方会补上关键那句。第三，当场复述，把你的理解讲回去，换来的往往是一句「其实还有个事」。下一节讲焦点小组：什么时候能用，什么时候一定不能用。把八个人关在一间屋子里，为什么反而问不出真话。这背后是一条关于群体压力的规律，跟你的主持水平关系不大。"}],"g_m2_5":[{"u":"audio/geely/g_m2_5_0.m4a?v=2026110417","d":35.76,"t":"这一节讲焦点小组。很多人对它有两种极端态度：一种是特别喜欢，觉得一次能听八个人，效率高；另一种是完全不用，觉得群体压力下听不到真话。两种都不对。焦点小组有它明确的适用边界，用对了很省时间，用错了会给你一个集体幻觉。这一节五分钟，讲清三件：它擅长什么、什么情况下一定不能用、主持人要做的三个控场动作。"},{"u":"audio/geely/g_m2_5_1.m4a?v=2026110417","d":61.03,"t":"焦点小组擅长三件事。第一，探索一个群体对某类问题的共同认知边界。比如你想知道「状态不透明」在大家嘴里到底指什么，八个人一起聊，会把这个词的边界撑开：有人指审批到哪一步不知道，有人指对方有没有看过，有人指时间预估。这种语义的展开，一对一访谈效率很低，群体讨论反而快。第二，快速收敛选项。当备选方案有六个以上，用它淘汰明显不被接受的，比做六次访谈省事。第三，跨部门对齐认知。让财务、采购、IT 坐在一间屋子里，彼此听见对方的约束——这个价值不在于你收集到了什么，而在于他们互相听见了什么，很多争议当场就消了。"},{"u":"audio/geely/g_m2_5_2.m4a?v=2026110417","d":56.83,"t":"但这三种情况一定不能用。第一，挖掘个人真实做法。群体压力会让「绕行」这类行为消失：没人会在一屋子同事面前说「我一直在用 Excel 偷偷做」。你要研究真实行为，必须一对一，而且要在他工位旁边。第二，同部门同层级同坐。这一条最容易被忽略：同一部门同一层级的人坐在一起，谁职级低谁闭嘴；跨层级坐在一起，就变成汇报会，大家开始说正确的废话。第三，涉及考核与责任的话题。没人会当面说自己填错过、没人会当面说某个流程是他拖的。这类话题只能单独问，而且要承诺匿名。"},{"u":"audio/geely/g_m2_5_3.m4a?v=2026110417","d":56.98,"t":"主持人要做的三个动作，目的都是让沉默的人说话，不是让会议顺利。第一个，先写后说：开场五分钟，让每个人各自写下三条，再轮流念。这个动作能避免第一个发言者定调——一旦有人先说「我觉得还行」，后面的人就会沿着「还行」往下说。第二个，点名沉默者：不要问「你有什么意见」，那等于给他压力；用动作召唤：「刚才你点了下头，你是怎么看的？」第三个，压住强势者：「这个观点我先记下，想听听其他人有没有不同的做法。」注意是「不同的做法」，不是「不同的意见」，前者要事实，后者要立场。"},{"u":"audio/geely/g_m2_5_4.m4a?v=2026110417","d":49.46,"t":"再补一句焦点小组的产出形式。它不该产出「结论」，它产出的是「议题清单」和「分歧地图」。议题清单是大家共同关心的三到五件事，按被提及的频次排；分歧地图是哪些问题上大家意见分裂，分裂在哪一层。这两样东西的价值在于，它们告诉你接下来该一对一去问谁、问什么。所以焦点小组应该是研究的前半段，不是后半段——先开小组把议题铺开，再一对一挖细节，最后再开一次小组验证结论。反过来做，先一对一再开小组，你会发现小组开完什么都没增加。"},{"u":"audio/geely/g_m2_5_5.m4a?v=2026110417","d":53.98,"t":"再补两个操作细节。人数控制在六到八人，少于六人讨论不开，多于八人一定会分成小团体私聊。时长控制在九十分钟以内，超过这个时间注意力会掉，后半段的发言质量明显下降。另外一定要有一个记录员，主持人不能自己记——一低头记笔记，控场就断了。记录员记三样：谁说的、说的是什么事实、有没有人反对。这一节的任务：判断你手上的研究题目，属于焦点小组能用的还是不能用的；如果能用，写出三个议题和三个控场动作；如果不能，说明理由，改成一对一方案。"},{"u":"audio/geely/g_m2_5_6.m4a?v=202611061038","d":44.83,"t":"这一节钉三句话。第一，焦点小组适合探索群体共识的边界，不适合挖个体行为细节和敏感立场。第二，六到八人、九十分钟以内，超过八人一定分成小团体私聊。第三，主持人不能自己记，必须有记录员，一低头记笔记，控场就断了。下一节走出会议室：现场观察，跟班、影子跟随和工作日志。为什么观察一天，比访谈八个人更有用？因为人会说错，但很少做错。"}],"g_m2_6":[{"u":"audio/geely/g_m2_6_0.m4a?v=2026110417","d":47.83,"t":"这一节讲现场观察。我先说一句可能不太好听的话：访谈里拿到的是「他记得的自己」，观察里拿到的是「他实际做的」。这两者经常不一致，而且不一致的地方，往往就是需求的真正入口。有个典型案例：访谈时审核员说「系统挺好，就是慢一点」；跟班半天发现，他每单要切换七次窗口，其中三次是去查系统里查不到的数据，而他根本没把这件事当成「系统的问题」，因为三年来一直这样。这一节七分钟，讲记录什么、不记录什么、记录表怎么设计、跟班怎么选时段。"},{"u":"audio/geely/g_m2_6_1.m4a?v=2026110417","d":58.68,"t":"先说记录什么：只记录可数的行为，不记录评价。「他看起来很烦躁」不是证据，「他在十分钟内切换了七次窗口」才是。具体三类。第一类，打断：每被打断一次记一笔，并记下来源——电话、同事、系统弹窗、领导。打断的次数决定了这个人能不能连续工作，而连续性是效率的前提。第二类，绕行：什么时候打开 Excel、什么时候发微信、什么时候打印。每一次绕行都是一处断点，把断点连起来，就是系统的真实短板。第三类，口头禅：「这个我得先问问」「等会儿再弄」「这个不准」——口头禅指向流程里的不确定处，是访谈里问不出来的东西。"},{"u":"audio/geely/g_m2_6_2.m4a?v=2026110417","d":45.62,"t":"不记录什么也要说清楚。不要写「态度不好」「不熟练」「不配合」这类评价性描述。原因有两个：一是评价无法复盘，你拿着「不熟练」这三个字，设计师不知道要改什么；二是评价会污染你的判断，一旦你在记录里写了「他不熟练」，后面所有观察都会被这个结论解释。如果确实要记能力问题，改成行为描述：不写「不熟练」，写「在第三步停留了两分十五秒，期间三次回到上一步」。行为描述可以被验证，评价不能。"},{"u":"audio/geely/g_m2_6_3.m4a?v=2026110417","d":61.22,"t":"观察记录表三列就够，但要连续记。第一列时间，精确到分钟；第二列他在做什么，写动作，不写目的；第三列打断或绕行。举个真实片段的写法：九点十二分，打开待办，逐条浏览十四条，电话打断一次；九点二十分，打开发票附件，与单据逐项核对，系统弹窗提醒两次；九点三十四分，切到 Excel 台账查该供应商历史付款，绕行，系统内查不到；九点五十一分，退回一单，填写退回原因自由文本；十点零五分，在群里问采购员合同编号，绕行，跨系统取数。这样记一天，你手上就是一张真实的流程图，比任何流程文档都准。"},{"u":"audio/geely/g_m2_6_4.m4a?v=2026110417","d":42.43,"t":"跟班怎么选时段？三个原则。第一，覆盖忙时，不要只选闲时。月结、季末、月初、周五下午，这些是问题集中爆发的时候，也是最容易约不到人的时候，但你必须去。第二，至少连续两小时。半小时只能看到片段，两小时才能看到一次完整的任务闭环，包括打断、绕行、求助、完成。第三，至少两个人，而且要有一个人是边缘用户——外包或者兼职，他们的操作路径往往比正式员工更绕。"},{"u":"audio/geely/g_m2_6_5.m4a?v=2026110417","d":56.38,"t":"再补两件观察时容易踩坑的事。第一件，怎么跟对方说。不要一上来就说「我要研究你」，那会让他全程表演。说清三件事就好：我是做系统改进的，想看看实际怎么用；今天不影响你工作，你按平时节奏来；有不对的地方我记下来，不会说是你的问题。说完加一句：如果你觉得我妨碍你了，随时让我出去。这句话会显著降低他的紧张感。第二件，不要在现场提问。看到他在 Excel 里做，忍住，不要问「为什么不用系统」。一问就变成访谈，人就进入解释状态，真实行为就消失了。记下来，等结束后一起问。"},{"u":"audio/geely/g_m2_6_6.m4a?v=2026110417","d":55.85,"t":"观察结果怎么用？三个动作。第一个，把断点标到流程图上。你手上一定有一张流程文档，把观察到的绕行点、打断点标上去，你会发现它们集中在两三个位置，那些位置就是真正的设计机会。第二个，把一天的记录折算成时间账：审核八小时里，有多少时间在做系统内动作，多少在等，多少在跨系统找数据。这个比例通常很惊人，我见过系统内动作只占四成的。第三个，把三到五个人的记录并排放，看重复出现的模式。一个人身上的问题是个案，三个人身上都出现就是结构问题。"},{"u":"audio/geely/g_m2_6_7.m4a?v=2026110417","d":61.25,"t":"观察还有两个技巧。第一个，影子跟随：不说话，坐在他侧后方，看屏幕但不要盯着看，让他慢慢忘记你在。开口的时机只有一个——他主动问你。第二个，工作日志：如果没法长时间跟班，就让他连续记三天日志，每小时一行，写做了什么、卡在哪。日志的准确度不如观察，但覆盖面更广，而且能拿到非工作日的状态。观察结束后立刻做两件事：当天补齐记录（隔天细节会丢一半），把断点标在流程图对应的位置上。这一节的任务：选一个人跟班两小时，用三列表记满，然后数出打断次数和绕行次数。这两个数，就是你下一次评审会上的开场。"},{"u":"audio/geely/g_m2_6_8.m4a?v=202611061038","d":119.09,"t":"最后一段，讲观察记录怎么用 AI 整理。跟班一天回来，你手上是一堆流水笔记：几点几分他打开了哪个表，跟谁说了句什么，在哪一步停下来找单号。这种笔记当场记得越快越好，回来整理最痛苦。把它交给 WorkBuddy，让它转成表。我常用的说法是：这是我一天的跟班笔记，按时间流水记的，很乱。请整理成观察记录表，字段是时间、触发事件、他的动作、在系统内还是系统外、耗时、卡点、绕行方式。整理时不要合并我记的两次不同动作，也不要用常识替我补时间。然后统计：哪三个卡点出现次数最多，系统外动作集中在哪两个时段，每个卡点对应哪条工单或哪个群聊记录。「不要用常识替我补时间」这句必须说。AI 整理流水账时特别喜欢补齐——你记了九点和十一点，它会自动给你补一条十点，看着很合理，但那是编的。所以规则是：每一行都要能对回笔记原句，补出来的行单独标出来，第二天回现场补看。表出来以后，它的第二个用处是找模式。人眼看一天笔记，记住的是最刺激的那件事；它数的是频次，哪个卡点出现最多、绕行集中在哪个时段，一目了然。这就是你要写进报告的那句话：一天里他有多少动作发生在系统外。一天笔记，三十分钟出表。但结论必须你下，因为只有你知道，那条被标了五次的动作，到底是流程问题，还是人的问题。"},{"u":"audio/geely/g_m2_6_9.m4a?v=202611061038","d":45.02,"t":"观察这一节，钉三句话。第一，跟班一天胜过访谈八人，因为人会说错，很少做错。第二，记时间、地点、动作，重点记绕行——绕行处就是需求。第三，影子跟随不说话，工作日志每小时一行，两种都能补上访谈拿不到的行为证据。下一节讲 B 端和 C 端定性研究的五处关键差异：样本、动机、场景、权力、验证。把 C 端方法直接搬进内部系统，最容易在「权力」这一处翻车。"}],"g_m2_7":[{"u":"audio/geely/g_m2_7_0.m4a?v=2026110417","d":46.1,"t":"这一节是 M2 的重点，九分钟，讲一件事：把 C 端的用户研究方法直接搬到内部系统，哪里会失效。在场很多同学是从消费端产品转过来的，或者同时在做两端，方法拿过来就用，结果发现访谈没人说实话、样本约不到、结论推不动。这不是能力问题，是两端的研究对象性质不同。这一节我给你五处差异，逐条讲清楚每一处该怎么改，再加三条 B 端的取材原则。先说结论：方法是同一套，取材方式完全不同。"},{"u":"audio/geely/g_m2_7_1.m4a?v=2026110417","d":64.56,"t":"第一处差异，样本可得性。C 端是公开招募，量大，可以按条件筛选，一份问卷能回收几百份，访谈能约到陌生人。B 端不行，B 端要一层层约：先找业务方对接人，对接人再找部门联络人，联络人再找具体的人，每一层都可能卡住。所以 B 端的研究计划里，约人的时间要按周算，不是按天算，而且要在计划里写清每一层找谁。第二处差异，表达意愿。C 端用户有动力吐槽，也可能为了奖励说好话，但总体愿意表达。B 端用户怕被考核，倾向说「挺好」，而且要给你留面子——你们明天还要开会。所以 B 端要用更硬的取证方式：不问评价问事件，不靠访谈靠观察，不靠自述靠日志。"},{"u":"audio/geely/g_m2_7_2.m4a?v=2026110417","d":41.9,"t":"第三处差异，场景边界。C 端的场景由物理位置决定：在地铁上、在家里、在店里，不同位置行为差别很大，所以研究要覆盖场景。B 端的场景由流程节点决定：工位上、会议中、车间现场、月末关账日。同一个人在关账日和平时完全是两个用户，所以 B 端研究要覆盖的是流程节点，不是地理位置。这一条直接决定你什么时候去观察：要选忙时，不要选闲时，忙时才暴露真实的取舍。"},{"u":"audio/geely/g_m2_7_3.m4a?v=2026110417","d":45.0,"t":"第四处差异，决策链。C 端的链路很短：产品经理对用户。B 端有四层：使用者、管理者、决策者、监管者，每一层的诉求不同，而且互相否决。所以 B 端的研究结论不能只给出一份「用户想要什么」，要给出「四层各要什么、冲突在哪、怎么裁决」。这一点在 M1 第四节讲过四层结构，这里补一句操作层面的：研究阶段就要分层抽样，不要研究完再补，补不出来——因为不同层的人说的根本不是同一件事。"},{"u":"audio/geely/g_m2_7_4.m4a?v=2026110417","d":41.23,"t":"第五处差异，采信标准。C 端的结论靠数据增长采信：留存、转化、复购。B 端的结论靠两件事采信：能不能说服业务方，能不能说服制度 owner。这意味着你在写报告的时候，要写两套话：一套是给业务方看的场景与代价，一套是给制度 owner 看的合规与留痕。只写一套，你的报告会在另一个会上被否掉。这也是为什么职能域的产品经理必须懂制度——不懂制度，你的研究结论落不了地。"},{"u":"audio/geely/g_m2_7_5.m4a?v=2026110417","d":47.57,"t":"基于这五处差异，B 端有三条取材原则。第一条，走出去：坐在他工位旁边看半天，比发一次问卷有效。建议每月固定半天驻场，不要等项目立项才去。第二条，找绕行：真实的约束藏在 Excel 和微信里，不在工单里。工单只记录已经进入系统的问题，绕行记录的是被系统挡在门外的问题。第三条，拿代价：不问「烦不烦」，问「这件事花了你多久、多久做一次」。烦不烦是感受，会随心情变；多久一次、每次多久，是事实，可以累加，可以进汇报。"},{"u":"audio/geely/g_m2_7_6.m4a?v=2026110417","d":58.39,"t":"对从消费端转过来的同学，我再给两条转型建议。第一条，先改自己的取证习惯，再改方法。C 端你习惯了看数据、看漏斗，这一套在 B 端仍然有用，但它只能回答「有多少」，回答不了「为什么」。所以你每周要留出半天做不带目的的观察，不设提纲、不写报告，就是坐着看。这个习惯养三个月，你对职能场景的直觉会明显不同。第二条，学一点制度语言。B 端的需求背后往往是一条制度，你能看懂制度文件，就能提前判断哪些约束是硬的、哪些是历史遗留。这两条都不在方法论书里，但它们是迁移的关键。"},{"u":"audio/geely/g_m2_7_7.m4a?v=2026110417","d":63.84,"t":"再说组织层面怎么让研究被采信，这也是 B 端的特殊难题。C 端的研究结论对产品团队负责，B 端的研究结论要过三道关：业务方、制度 owner、IT 排期。所以研究计划一开始就要设计「采信路径」：每一轮研究的结论，先给谁看、在什么会上看、他可能会拿什么理由反对、我准备什么证据回应。我建议做一张一页纸的结论卡：左边写结论和强度分级，右边写证据来源和反例，底下写这个结论影响哪个决策。这张卡不要超过一页，因为多数会上你只有五分钟。还有一个小技巧：把业务方拉进研究过程，让他参加一次访谈或一次跟班。他亲耳听到的东西，比你的报告有说服力得多。"},{"u":"audio/geely/g_m2_7_8.m4a?v=2026110417","d":54.89,"t":"还有一个常被忽略的差异：反馈的时效。C 端产品今天上线，明天就能看到数据变化；B 端系统改一个流程，要等一个业务周期才能验证，月结类系统甚至要等一个月。这意味着 B 端的研究不能一次做完就结束，要设计「研究—上线—再研究」的循环。我建议每个改动上线后固定做一次回访，问三个问题：这个改动你用上了吗；有没有带来新的麻烦；有没有因此改掉某个绕行习惯。第三个问题最重要，因为它直接反映行为是否真的变了。行为没变，指标改善就是假的。"},{"u":"audio/geely/g_m2_7_9.m4a?v=2026110417","d":47.14,"t":"最后说哪些可以照搬，别把自己吓住。C 端的用户旅程地图、痛点排序、同理心地图、访谈技巧，这些都可以直接用，方法层面没有差别。不能直接搬的是三样：样本获取方式、指标的解读、结论的采信路径。把这三样替换掉，剩下的都可以复用。这一节的任务：拿你现在做的一个 B 端研究，按这五处差异逐条对照，写一行——这一处我原来是照 C 端做的，现在要改做什么。五条都写出来的，你下一轮研究计划就不会跑偏。"},{"u":"audio/geely/g_m2_7_10.m4a?v=202611061038","d":42.91,"t":"这一节钉三句话。第一，五处差异：样本、动机、场景、权力、验证，权力是最容易被忽略的一处。第二，内部用户没有「换一家」的自由，他的沉默不等于满意。第三，结论要备两套说法：一套给业务方，一套给制度 owner。下一节是模块二最后一节：定性结论的可信度。三角验证、反例搜寻、强度分级。「用户都说要这个功能」这句话，到底什么时候能信？"}],"g_m2_8":[{"u":"audio/geely/g_m2_8_0.m4a?v=2026110417","d":42.6,"t":"M2 最后一节，讲结论的可信度。这一节要解决的问题很具体：「用户都说要这个功能」这句话，什么时候能信？很多项目就败在这一步——研究做了，结论写了，立项也过了，做完发现没人用。回头看，当时的结论只有访谈一个来源，而且访谈对象还都是接口人。这一节五分钟，三件事：三角验证、反例搜寻、结论强度分级。这三件事做完，你的结论才能写进需求文档。"},{"u":"audio/geely/g_m2_8_1.m4a?v=2026110417","d":54.0,"t":"第一件，三角验证。我有一个说法：一个来源是故事，两个来源是线索，三个来源才敢写进需求文档。三个来源指的是访谈、观察、文档或日志。比如「审核员看不到历史付款记录」，访谈里他说了，这是一；你观察到他切到 Excel 台账，这是二；系统日志里能看到他在审核页平均停留四分半、并频繁切换到另一个系统，这是三。三个来源指向同一结论，这个结论可以立项。只有访谈的结论先别写，因为访谈得到的是他的叙述，不是他的行为，两者之间的差距经常是决定性的。"},{"u":"audio/geely/g_m2_8_2.m4a?v=2026110417","d":53.04,"t":"第二件，反例搜寻。做法是主动找两到三个不符合结论的人，问他们为什么不同。注意，是主动找，不是碰运气。比如你得出「大家都需要批量导入」这个结论，就去问那个从来不用批量功能的人：他为什么不用？可能是他的单量少，可能是他的单据类型不统一，也可能是他根本不知道有这个功能。三种原因对应三种不同的结论：前者说明这个需求有边界，中者说明要先解决数据规范，后者说明是推广问题不是产品问题。找不到反例再下结论；找到了反例，结论就要加限定条件。"},{"u":"audio/geely/g_m2_8_3.m4a?v=2026110417","d":49.01,"t":"第三件，强度分级。我建议所有结论都用三档表述：普遍、多见于、个别。「普遍」的条件是多数样本加多来源，可以直接写进立项材料；「多见于」的条件是多来源但样本少，可以写，但要注明样本量；「个别」只有个案，只能作为线索，不能作为立项依据。这个分级的价值不在于学术严谨，在于保护你自己：你写「个别用户反馈」，后面被证伪了，是正常的；你写「用户普遍认为」，被证伪了，是你的判断失误。"},{"u":"audio/geely/g_m2_8_4.m4a?v=2026110417","d":49.42,"t":"最后补一下结论怎么写成一页纸，这是 M2 的交付形态。一页纸分四块。第一块，研究问题，一句话，就是那个改写后的题目。第二块，结论三到五条，每条后面标强度分级和来源数量，比如「审核环节取数困难，来源三个，普遍」。第三块，反例与边界，写清什么情况下结论不成立。第四块，对设计的含义，每条结论对应一个设计动作建议。四块填满，这张纸可以直接进需求评审。如果某个结论填不满四块，说明它还没到能用的程度，放回研究清单继续。"},{"u":"audio/geely/g_m2_8_5.m4a?v=2026110417","d":55.9,"t":"最后把 M2 收一下。这一模块的逻辑是一条线：先把业务问题改写成可研究的问题，再抽到对的人，然后用 BEI 和追问拿到事件，执行时消除考核感，需要群体视角时用焦点小组，需要真实行为时去现场观察，最后用三角验证和反例把结论坐实。这一节的任务：把你手上一个已有结论，标注它有几个来源、找过几个反例、属于哪一档强度。如果只有一个来源，回去补观察；如果没找过反例，找两个不同意见的人聊二十分钟。下一模块 M3 讲定量方法，解决的是「有多少人这样」的问题。"},{"u":"audio/geely/g_m2_8_6.m4a?v=202611061038","d":40.75,"t":"模块二到这里收口。三句话：第一，三角验证，访谈、观察、日志至少两个来源对上。第二，主动找反例，找不到才敢下结论。第三，强度分级：单点提及、多人共识、行为印证，写结论时必须标档。到这里，阶段一的两个模块学完了。你手上有五问卡、深访提纲、观察记录表。把这三样交上去，通过章节测评，就能进阶段二，讲定量研究——解决「有多少人这样」的问题。"}],"g_m3_1":[{"u":"audio/geely/g_m3_1_0.m4a?v=202611101139","d":68.93,"t":"这一节先钉一个判断：不是所有问题都该发问卷。上周做费控的同事找我，说业务方甩过来一句「大家对新报销系统满不满意」，让他一周内出个数，他第一反应是设计一份满意度问卷发全公司。先别急。停下来问一句：这个问题定量能不能答。「满不满意」听着像一句态度，其实里面混着三件事，有多少人不满意、集中在哪些岗位、跟旧系统比差多少，这三件都能数；可「为什么不满意」，数答不了。定量答的是规模、分布、差异、相关性，答不了「为什么」。这一节五分钟，我给你一条分界线，还有三类必须先定性的情形。下次接活，先拿这条线量一下，再决定发不发问卷。最常见的错法是先发了再说，收上来再看能分析出啥，那等于把判断推给数据，最后报告里写满「希望更好用」这种谁也用不了的话。"},{"u":"audio/geely/g_m3_1_1.m4a?v=202611101139","d":76.99,"t":"先说四类能数的问题，前两类是规模和分布。规模就是有多少，多少人用、多少次退回、一个月绕回 Excel 27 次，这类问题直接数，答案是个数或者比例，来源多半是埋点和台账，不一定要问卷。分布是这些数落在哪儿，按基地拆、按岗位拆、按时段拆，看它是不是集中在某几个格子。某基地一位入职两年的费用审核员，一个月里退回单子 34 次，可把全基地的退回按岗位一拆，八成集中在他这一格，这就不是他个人的问题，是这一格的任务设计有问题。方法上，规模用计数，分布用交叉表，一张表两分钟就能拉出来。常见错法是只报一个总数：这个月退回 200 单，同比降了，报告就交了。总数一降你就以为好了，可如果降的是本来就不退回的那批人，真正卡住的那一格纹丝没动。所以拿到规模的数，一定顺手拆一次分布，别让一个总数把差异盖住。"},{"u":"audio/geely/g_m3_1_2.m4a?v=202611101139","d":80.98,"t":"后两类是差异和相关性。差异是两组比一比，外包和正式员工、A 基地和 B 基地、用旧系统和用新系统的，差多少、差在哪。相关性是两个变量一起变，培训次数上去，退回率下没下来；登录频次高的那批人，任务完成时长是不是更短。方法上，差异做分组对比，相关性看两个列是不是同涨同跌，都不用高深模型。费控那边有个真事：把审核岗按是否参加过新功能培训分两组，培训组退回率低了 12 个点，看着像培训有效，可再一看，培训组本来就只接简单单子。这就是相关性最容易骗人的地方，它只告诉你两个数一起动，不告诉你谁带动了谁。这里先埋一句，因果和机制要留到能说出「为什么会这样」的时候再下，数自己不会解释自己。常见错法是把分组差异直接写成「所以应该全面推广培训」，一步就从数跳到了方案，中间那层机制没人补。"},{"u":"audio/geely/g_m3_1_3.m4a?v=202611101139","d":76.73,"t":"把四类放一起看，分界线就清楚了：规模、分布、差异、相关性，问的都是「是什么」和「有多少」，问卷和埋点能给；可「为什么」，数答不了。满意度 4.2 分是个很典型的坑。SRM 供应商门户那份问卷收回来，5 分制打了 4.2 分，业务方第一反应是体验不错、可以结项了。先别急着结项，这个 4.2 分只说了用户给了一个偏高的分，没说这个分是冲着什么打的。是「页面没报错所以能用」，还是「真帮我省了事所以好用」？这两句话对应的方案完全相反，一个该去保稳定，一个该去砍步骤。数里没有这一句，你翻遍报表也翻不出来。常见错法就是拿一个分数直接下体验结论：4.2 分，判定体验良好，写进汇报。要补「为什么」，只有两条路，去现场看他怎么操作，或者在问卷里加一道开放题收原话，而且得承认开放题收来的也是线索不是定论。记住这条：数负责圈出在哪儿，定性负责说清为什么。"},{"u":"audio/geely/g_m3_1_4.m4a?v=202611101139","d":78.48,"t":"那什么时候连问卷都不该发，先去做定性？三种情形，记牢能省很多返工。第一种，概念没定义。业务方说「系统好不好用」，可「好用」指什么还没人说得清，是步骤少、是不卡、还是不用切窗口？这时候你发问卷，等于替全公司先定义了一遍「好用」，收上来的分是你自己的定义，不是他们的。先访谈三四个人，把「好用」拆成能观察到的动作，再来出题。第二种，选项不知道。你想问用户绕到了哪些工具，可你根本不知道现场有 Excel、有微信群、有纸质台账还有共享文档，问卷选项只能凭空编，漏掉的那个往往就是最主流的那个。第三种，场景不清楚。谁在哪个环节用、一天用几次、在什么时间压力下用，都说不上来，你连问卷该发给谁、发几题都定不了。这三种情形有个共同点：你缺的不是数，是框架。框架没搭好，发多少份问卷都是把空白表格收回来。"},{"u":"audio/geely/g_m3_1_5.m4a?v=202611101139","d":86.4,"t":"把这一节收成一个能直接用的顺序。接到一个业务问题，先问第一句：这个问题定量能不能答。答的是有多少、在哪儿、差多少、有没有关系，就能；答的是为什么、该怎么办，先放一放。能答，再问第二句：定义、选项、场景，三样齐不齐。三样缺一样，先定性补齐，别急着发问卷。三样齐了，才轮到后面几节的总体、样本量、题目怎么出。某协同审批模块就吃过这个亏，场景还没摸清就把问卷发下去，收回来人均填答 41 分钟、34% 的人中途退出，最后能用的只有那句「希望更智能」。常见的错法是把「先发了再说」当成执行力，觉得数据到手总能分析出点东西。恰恰相反，问题没定对，数据越多越难收拾，你会花两周解释一堆本来就不该收的数。这一节的小任务：把你手上正要做的那个调研，用第一句话量一下，写下它到底该定量、该定性，还是先定性再定量。"},{"u":"audio/geely/g_m3_1_6.m4a?v=202611101139","d":53.52,"t":"这一节钉三句话。第一，定量答的是规模、分布、差异、相关性，答的是「有多少、在哪儿、差多少、有没有关系」，答不了「为什么」。第二，「为什么」和「该怎么办」交给定性，数只给事实，不给机制，4.2 分不会告诉你这个分是冲着「能用」还是「好用」打的。第三，概念没定义、选项不知道、场景不清楚，这三种情形先别发问卷，先去现场把框架搭起来。下一节讲一件更靠前的事：发问卷之前，你连「到底谁是用户」都未必说得清。一份 200 人的花名册里，为什么真正能对应到活人的只剩十几个？"}],"g_m3_2":[{"u":"audio/geely/g_m3_2_0.m4a?v=202611101139","d":77.52,"t":"这一节讲发问卷之前的一件事，也是最容易含糊过去的一件事：总体到底是谁。很多同事做内部调研，第一步就是打开 HR 花名册，数一数 200 人，按这个数发下去。先停一下。内部系统和 C 端产品有个根本区别，它没有一份干净的「用户名单」。你以为总体是 200 个在册员工，可真正在这套系统里干活的人，和在册的人根本不是同一批。我说个真事：某基地费用审核岗，后台挂着 27 个账号，其中 9 个是几个人共用的，4 个是已离职还没回收的，真正能对应到一个活人的只有 14 个。你要是按 200 人发，分母从第一步就错了，后面算出来的所有比例都带着这个错。这一节五分钟，先讲总体边界上的四个洞，再讲概率、非概率怎么选，最后给 B 端样本不够的三种补救。判断只有一句：先把「谁算用户」钉死，再谈抽谁、抽多少。"},{"u":"audio/geely/g_m3_2_1.m4a?v=202611101139","d":86.98,"t":"总体边界上有四个洞，一个一个说。第一个，离职。上个季度操作过、这个月已经走了的人，算不算用户？你要研究的是「当前体验」，就不该算；你要研究「为什么这批人放弃」，偏偏得算。第二个，外包和兼职。他们有账号、干同样的活，可不在 HR 花名册里，培训覆盖也最薄，问题往往最集中，抽样时最容易整类漏掉。第三个，跨系统权限。同一个人可能同时在费控、SRM、协同三个系统里有身份，你按系统各导一份名单，他就被数了三次，成了三个用户。第四个，共用账号和挂名账号。像前面那 9 个共用账号，背后是三四个人轮流用，一个账号不等于一个人。常见错法是拿现成花名册当总体，图省事。正确的做法是先写一句界定的话：本次总体是「近三个月在某系统有过实际操作、且当前在职的在岗人员」，把离职、外包、共用账号怎么处理写明白，再照着这句话去导名单。这句话写不出来，样本框就是漏的。"},{"u":"audio/geely/g_m3_2_2.m4a?v=202611101139","d":81.77,"t":"总体说清了，接着选抽样。概率抽样是每个个体都有已知、非零的被抽中概率，简单说就是随机抽；非概率抽样是配额、方便抽样、滚雪球这些，谁被抽中说不准。两者不是谁高级谁低级，是用途不同。概率抽样的价值只有一个：能给你算误差范围，能让你说「全公司有 34% 的人怎样，误差正负多少」。非概率抽样给不了这句话，它只能给线索、给问题类型，不能外推到全体。关键判断来了：B 端内部系统，多数时候你压根拿不到一个完整、干净的抽样框，名单里全是上一节那四个洞，随机抽也就无从谈起。所以老实承认，你用的多半是配额抽样。这不丢人，前提是别拿配额抽样的数据，去说一句只有概率抽样才配说的「全公司百分之多少」。常见错法就是这一点：明明是找了几个熟部门填的，报告里却写「全公司满意度 4.2 分」，一句话把线索冒充成了结论。"},{"u":"audio/geely/g_m3_2_3.m4a?v=202611101139","d":79.42,"t":"那配额具体怎么配？一句话：不看人数，看处境。按岗位、基地、使用频次、权限范围各切几层，每层取固定人数，哪怕这一层全公司只有三个人，也要占一个格子。某采购结算域做过一次，按部门人数等比例发问卷，人最多的那个部门收回一大半，结论是「系统还行」；可真正卡在跨系统对账上的，是三个人的那个边缘岗，一个人都没被抽到。等比例发看着公平，其实是把音量给了人多的部门，而人少的边缘岗常常才是重灾区。所以配额表要这样列：角色一层、基地一层、高频低频一层，每格至少两人，再单独留一格给「完全不用的人」——这一格系统名单上找不到，得靠问出来。常见错法有两个，一是按部门人数等比例，二是配额填不满就随便找人凑数。凑进来的多半是最配合、最没意见的那批人，等于亲手把偏差又加了一遍。宁可少一格，写「待补」，也别硬凑。"},{"u":"audio/geely/g_m3_2_4.m4a?v=202611101139","d":97.51,"t":"B 端经常碰到的现实是：总体本来就小，样本怎么算都不够。三种补救，按这个顺序挑。第一种，全量普查。总体只有三四十人，比如某基地的采购结算岗就 40 个人，别抽样了，全发，回收率盯紧一点，比抽二十个准得多。样本量公式在这里是给大总体用的，小总体硬套没意义。第二种，分层配额，就是上一节那张表，用结构换人数，六到八个人也能覆盖主要处境。第三种，时间序列代替横截面。这个最容易被忽略，也最好用：横向比不动 200 人，就改成盯同一个人连续看四周。某协同审批模块只有 18 个活跃账号，横向怎么分都不够看，后来改成每周记一次这 18 个人的任务完成时长和退回率，四周就有了 72 个观测点，趋势一眼就出来了。常见错法是一看样本不够就急着扩大发放范围，把不相关部门也拉进来凑数，人数上去了，可加进来的全是没用过这套系统的人，数据反而更脏。样本不够时先想这三个补救，别先想拉人。"},{"u":"audio/geely/g_m3_2_5.m4a?v=202611101139","d":73.94,"t":"把这一节收成一句判断：抽样好不好，不看你下发了多少份，看回收回来的人覆盖了几种处境。最隐蔽的一个错，我留到最后说：名单只从系统后台导。后台里有的是「用过系统的人」，而你要找的那些已经绕到 Excel、微信群、纸质台账的人，压根不在后台里，你从名单上永远抽不到他。这和模块二讲绕行者那节是同一件事，到了定量这里只是换了个形式——定性时你漏访了他，定量时你漏抽了他，结果都是只听到留下来的那批人的版本。所以名单导出之后，一定补一句：这份名单里，有没有根本不用这套系统的人？没有，就想办法从工位上问出来，哪怕只补进两三个，结论都会变。这一节的小任务：为你手上的调研写一句总体界定，再把配额表列出来，最后检查一遍，四种处境里，你缺了哪一格。"},{"u":"audio/geely/g_m3_2_6.m4a?v=202611101139","d":61.94,"t":"这一节钉三句话。第一，内部系统没有干净的抽样框，离职、外包、兼职、跨系统权限、共用账号，五个洞都要在总体界定那句话里交代清楚。第二，概率抽样给你误差范围，非概率抽样只给线索，B 端多数只能用配额，就别拿它去说「全公司百分之多少」。第三，样本不够时按全量普查、分层配额、时间序列代替横截面三种补救来，别急着拉不相关的人凑数。下一节给你一张能直接抄的速算表：置信度和误差先怎么定，再怎么倒推发多少份。顺便拆一个特别普遍的错——200 人的总体发 200 份问卷，为什么反而不如做 12 个深访。"}],"g_m3_3":[{"u":"audio/geely/g_m3_3_0.m4a?v=202611101139","d":64.7,"t":"这一节讲一个特别容易被「越多越准」带偏的东西：样本量。先说结论，样本量不是拍脑袋发全公司，也不是越多越好，是先定两件事——我能容忍多大的误差、我要多有把握，再倒推需要多少人。某 HR 系统上线后要做一次体验调研，负责人一咬牙给全公司 200 人全发了问卷，觉得这叫全量、最准。结果两周后只收回来 41 份，回收率两成，写报告时还得硬着头皮说「样本覆盖全公司」。这就是这一节要拆的典型错法。八分钟我给你三样东西：置信度和误差到底在说什么，一张能直接抄的速算表，还有为什么「发得多」常常不如「收得准」。判断先放这儿：定口径，再查表，最后按回收率反推发放量，顺序一步都不能反。"},{"u":"audio/geely/g_m3_3_1.m4a?v=202611101139","d":76.56,"t":"先把两个参数讲成人话。置信度，说的是「同样这件事重复做一百次，有多少次结论能落在区间里」，常用的就两档，90% 和 95%。误差，说的是「我允许结果和真实值差多少」，常用正负 5% 和正负 10%。这两个数不是技术指标，是业务选择：这次只是摸个方向，90%、正负 10% 就够，收个几十份心里有底；这次要写进立项报告、要跟业务方拍板，就得 95%、正负 5%，样本量立刻翻几倍。常见错法是两个参数从头到尾没人提，直接问「发多少份合适」，好像存在一个标准答案。没有标准答案，只有你这次肯花多少成本、担多大风险。我的建议是接活时就把这句话问出口：这个数最后要拿来做什么决定？决定越大，置信度越高、误差越小，样本量越大。反过来，一个只用来排优先级的内部小调研，上 95% 正负 5% 是浪费，把同事的时间花在填一份根本用不着的问卷上。"},{"u":"audio/geely/g_m3_3_2.m4a?v=202611101139","d":87.62,"t":"有了两个参数，就能查表。记住这张经验口径，够你应付绝大多数内部调研。总体很大、按大总体近似来算：95% 置信度配正负 5% 误差，约需 380 份；95% 配正负 10%，约 96 份；90% 配正负 5%，约 270 份；90% 配正负 10%，约 68 份。你会发现规律：误差从 10% 收到 5%，样本量差不多翻四倍，因为误差是平方关系；置信度从 90% 提到 95%，大约多三成。所以真正贵的是「把误差压小」，不是「把把握提高」。这张表不用背，抄在样本量速算表里，用的时候对一下行和列就行。常见错法是只记一个「384 份」走天下，不管这次是摸方向还是上会，一律发 400 份，内部系统总共才两百人，物理上都发不到这个数。表是给你定数量级的，不是给你一个死数字，先看清楚这一行对应的是大总体，再往下做一步修正。"},{"u":"audio/geely/g_m3_3_3.m4a?v=202611101139","d":87.07,"t":"接着说那一步修正，叫有限总体校正，名字唬人，道理很朴素：大总体近似是假设你面对的是几万人、几十万人，可内部系统常常就两三百人，人群没那么无穷无尽，需要的人自然比表上少。同样 95% 正负 5%，面对 200 人的总体，不需要 380 份，约 132 份就够；总体再小到 100 人，约 80 份就到顶了。所以查表的正确姿势是三步：先报总体多大，再按置信度误差查到那个大总体数字，最后按总体规模折一次。某财务共享中心做过一次，总体 180 人，同事照着网上的 384 份发，发遍全公司还借了兄弟部门的人来填，纯粹白忙，其实一百出头就够。常见错法是跳过总体这一步，把大总体的表直接套到小总体上，要么夸大样本量吓退自己，要么发现根本发不够就干脆不做了。还有个反向的错：把「按总体修正后的数」当成「实际要发的数」，忘了还有回收率这一层，下一节细说。"},{"u":"audio/geely/g_m3_3_4.m4a?v=202611101139","d":76.01,"t":"现在回头拆开头那个 200 发 200 的错，它有个名字，叫过度调查。看着「全量最准」，其实只收回 41 份，回收率 20%，而且回来的多半是两种人：对系统憋了一肚子意见的，和那天正好有空的。真正每天被系统折磨、又忙到没空填的人，恰恰没回来。这时候你手上这 41 份，比认认真真抽 80 份还偏，因为你连它偏在哪儿都说不清。同一件事，改成做 12 个分层深访，按岗位、基地、高频低频各取两人，每人聊四十分钟，你拿到的不是 41 个随手打的分，是 12 段能直接改设计的具体操作。判断就一句：能问出「为什么」的时候，别用发问卷去换一个算不准的比例。常见错法是把「发出去的数量」当样本量，报告里写「发放 200 份」，可统计上认的是回收且有效的那 41 份，发出去的不算。这个错特别普遍，因为发问卷这个动作最像在干活，收回来多少反而没人盯。"},{"u":"audio/geely/g_m3_3_5.m4a?v=202611101139","d":79.49,"t":"再说透一层：回收率低，比样本少更致命。样本少，只是区间宽，你查表能算出「误差大概正负 10%」，心里有数，写报告时标一句就行，它是个知道大小的毛病。不回应却是系统性偏差，你算不出来，还容易以为自己有数。满意度问卷最典型：真正绕到 Excel、微信里干活的人，对这套系统最没感情、最懒得填，于是收回来的分天然偏高，你据此判定「体验良好」，等于把最该听的那批人自动静音了。所以别只盯回收率这个百分比，要盯「谁没回来」。做法是回收后拆一次分布：回来的 41 份，按岗位、按使用频次拆开，和总体名单比一比，哪一格明显少了，就知道偏差往哪边歪。常见错法是回收率低就再群发一遍催填，催回来的还是同一批愿意配合的人，数字好看了，偏差一点没动，反而更隐蔽。真缺的那一格，得点名去请，或者干脆补两个访谈。"},{"u":"audio/geely/g_m3_3_6.m4a?v=202611101139","d":83.54,"t":"讲一个当时看起来特别对、后来证明完全没用的方案，你引以为戒。还是那份满意度问卷，上一轮回收率两成太难看，有位负责人想了个办法：把填问卷写进部门月度考核，不填扣三分。一周之内回收率冲到 90%，报表漂亮得能直接贴墙上，可翻开一看，几乎清一色「满意」，一句能拿来改设计的线索都没有，还白搭进去两周的推动和一轮答疑。问题出在他把「回收率」当成了目标，可回收率只是手段，你要的是真实、有分布、能指到具体环节的回答。用考核逼出来的，是服从，不是回答。代价很清楚：两周人力，加上一次之后大家更不愿意认真填问卷的信任。把这一节收成能用的四步：定置信度和误差、查表、按总体修正、按预估回收率反推该发多少。比如要 100 份有效、预估回收率四成，就得发 250 份，发不到就老实降口径。小任务：拿样本量速算表，给你手上的调研定一次发放量，把这四个数都写下来。"},{"u":"audio/geely/g_m3_3_7.m4a?v=202611101139","d":208.85,"t":"讲完样本量，加一段：这张速算表怎么用 WorkBuddy 铺出来，以及怎么用它反推该发多少份。先说清楚，AI 不替你判断，只替你搬运整理。你手上一定有这些东西：上次调研的发放记录、后台能导出的总体名单、业务方对这次结论用途的一句话交代，也许还有一份写了一半的调研方案。口径表和反推公式是死的，让 AI 按你的数填一遍最快。我常用的说法是：这是一次内部系统调研。总体 200 人，结论要写进立项报告，请按 95% 置信度、正负 5% 误差，先给大总体所需样本量，再做有限总体校正，写出校正后的目标有效样本数。然后按预估回收率 40% 反推建议发放量，把三步的计算过程逐行列出来，每一步注明用的哪个数。最后单独列一行：如果只做 12 个分层深访，这三条口径分别会怎么变，不要替我下结论。注意最后两句：要逐行过程、不许下结论。这两句决定了输出能不能用。AI 最常见的毛病，是直接甩给你一个「384 份」，既不做有限总体校正，也不问回收率，看着很专业，套到 200 人的系统上物理上都发不到。所以每一步用哪个数，你都要能自己对回去。它还有个比人快的用处：算反推。你改一次预估回收率，它一秒把发放量重算一遍，你可以顺手试三档，三成、四成、五成各是多少，心里立刻有数该找多少人填。但有三个坑必须防。第一，它会默认大总体近似，不打折。提示词里一定要写「总体多大、做有限总体校正」，否则它给的是面对几万人的数。第二，它会把「发放量」和「有效样本量」混成一件事，把 250 份当成样本量写进报告。统计上认的是回收且有效的那部分，这两列必须分开，让它各列一行。第三，它会替你选口径。你没说置信度，它自己挑一个 95%；你没说用途，它默认「越准越好」。可这一节的判据是「这个数拿来做什么决定」，只排优先级就别上 95% 正负 5%，这句业务判断必须你给，它给不了。另外有几样必须人工核：总体人数是不是从界定那句话里数出来的、离职和共用账号剔没剔、预估回收率是不是照你们部门上几次的真实回收率，而不是拍的。表里每个数，你都要能在发放记录或名单里找到出处，找不到就自己填，别让它编。原来翻公式、按计算器的半小时，压到十分钟。省下的时间不是用来把表做漂亮，是用来去跟业务方确认那句「这个数最后要拿来做什么决定」。工具的位置放对：它算数，你定口径。"},{"u":"audio/geely/g_m3_3_8.m4a?v=202611101139","d":56.98,"t":"样本量这一节，钉三句话。第一，先定置信度和误差，再查表，别一上来就问「发多少份合适」，这两个参数是业务选择，不是技术默认值。第二，200 人的总体发 200 份只回收 41 份，不如做 12 个分层深访，发得多不等于收得准。第三，回收率低比样本少更致命，样本少只是区间宽，算得出来；不回应是系统性偏差，算不出来还以为自己有数。下一节进问卷本身，五条铁律，条条配一个内部反例。先看一道几乎人人都写过的题：「系统是否稳定且好用」，它到底错在哪。"}],"g_m3_4":[{"u":"audio/geely/g_m3_4_0.m4a?v=202611101139","d":73.97,"t":"这一节讲问卷怎么出题，先从一个几乎人人都踩过的坑说起。有份内部问卷里有一道：「您觉得本系统是否稳定且好用」，1 到 5 分打分。收回来一看分数挺整齐，可用不了。为什么？它一句话问了两件事：稳定是稳定，好用是好用。一个人觉得系统从来不崩、但填一张单子要切四个窗口，他该打几分？打 5 分吧，好用这一半不答应；打 2 分吧，稳定这一半又委屈。最后他随手给个 4，你拿到这个 4，既不知道稳定怎么样，也不知道好用怎么样，等于白问。这就是五条铁律里最常犯的那条，双重问题。八分钟，我把五条一条条过，每条配一个内部系统的真反例，最后说预测试怎么做。总判断先给你：一题只测一个变量，选项是给回答用的，不是给你省题数用的。"},{"u":"audio/geely/g_m3_4_1.m4a?v=202611101139","d":76.78,"t":"铁律一，单一变量，一题只测一个变量。变量就是你真正想拿到的那一个数。想测稳定性，就只问「过去一个月遇到几次报错或卡顿」；想测好用，就只问「填一张单子大概要几步」。拆开问，题目是多了一道，但每道的分都能直接用。反过来说，判断一题合不合格有个很简单的办法：把它念给同事听，如果回答时得在心里先问一句「你指的是哪方面」，这题就一定得拆。某费控问卷里有一道「您对报销流程的整体感受如何」，「整体感受」四个字里塞了填报、审核、打款三段，一个人可能填报烦、打款快，他给的分你永远不知道该挂到哪一段。后来拆成三题，才发现 34% 的不满全卡在审核等待这一段。常见错法是为了让问卷显得短，把好几件事揉进一道题，觉得 respondent 填着省事。省下的是他三十秒，废掉的是你整份数据。宁可长两题，别让一题里藏两个变量。"},{"u":"audio/geely/g_m3_4_2.m4a?v=202611101139","d":80.06,"t":"铁律二，避免双重问题，把它单独拎出来讲，因为它在内部问卷里最爱藏在满意度题里。「稳定且好用」「快捷且准确」「界面清晰、操作方便」，这些并列的词看着很顺，其实是用「且」「、」把两个变量缝在了一起。人对两个变量感受不一致时，打的不是分，是两者相加再除以二的模糊值，你永远还原不回原来那两个数。识别方法很土但有效：搜一遍题目里的「且」「和」「并」「以及」「、」，只要连接的是两个能被分别评价的东西，就拆。SRM 供应商门户那轮问卷就吃过亏，一道「门户访问是否快捷且信息齐全」，后来跟埋点一对，访问速度其实没问题，是信息缺字段，可那道题的分数两件事糊在一起，白白少拿一条能定位的结论。常见错法是觉得「反正都是问体验，放一起更全面」，全面是全面了，全面到没法用。拆开之后你甚至会发现，两个数一个高一个低，那个低的就是下一步该改的地方。"},{"u":"audio/geely/g_m3_4_3.m4a?v=202611101139","d":78.67,"t":"铁律三，避免诱导，别把答案塞进题目里。看这句：「我们新上线、大幅提速的报销系统，您是否满意？」「大幅提速」四个字已经替回答者下了一半结论，他再不满意也不好意思打低分，这叫顺应，收上来的分是被题目推着走的。某采购域的问卷写过「优化后体验提升明显吗」，同样的问题：「提升明显」是预设，人家只能答明显或不明显，压根没有「没感觉」这个位置。改法很简单，把描述全删掉，只留中性一问：「与上一个版本相比，您填一张单子的耗时」，再给几个时间档让他自己选。还有一类隐蔽诱导，是题目里带权威：「按集团要求，本系统须全面使用，您是否支持」，这问的不是体验，是表态，谁敢说不支持。常见错法是写题目时忍不住替系统说两句好话，怕同事觉得这系统白做了。记住，问卷是来收问题的，不是来收表扬的，一句夸奖都会把真实那半句压回去。"},{"u":"audio/geely/g_m3_4_4.m4a?v=202611101139","d":79.78,"t":"铁律四，选项互斥穷尽。互斥是说选项之间不能重叠，穷尽是说所有情况都得有个位置。互斥最常错在数字档：「1 到 3 次」「3 到 5 次」，正好 3 次的人卡在两档之间，他随便选一个，你的频次统计就歪了，改成「1 到 3 次」「4 到 6 次」才干净。穷尽最常错在漏了「零」和「其他」。内部问卷尤其要加一个选项：「我现在不用这套系统」。费控那轮就漏了这一项，结果 31% 实际上早就绕到 Excel 的人，被逼着在「满意 / 不满意」里选一个，硬生生给系统投了一堆不属于他们的分。加上这一项之后，这批人直接被分流到另一条路径，数据立刻清爽了。还有开放场景要留「其他，请注明」，不然用户真用的那个工具你永远收不到。常见错法是选项凭空编：坐在办公室里想了五个「用户可能会用的工具」，现场其实还有纸质台账和共享文档，漏掉的那个偏偏是主流。选项不是想出来的，是从模块二那些访谈记录里抄出来的。"},{"u":"audio/geely/g_m3_4_5.m4a?v=202611101139","d":84.31,"t":"铁律五，预测试，最小 5 个人就够，而且看的不是分数，是卡点。正式发之前，找 5 个跟真实用户尽量像的同事，坐旁边看他们填，别解释、别提示。你要盯四件事：他在哪道题停超过五秒、哪个词他反过来问你什么意思、有没有人两道题选了同一个答案、整份填下来花了多久。某 HR 问卷预测试就救回一次：5 个人里 3 个把「单据归档」理解成了两件不同的事，一个以为是存 PDF，一个以为是交财务，这道题要是直接发下去，收上来的全是不可比的数据。改一个词，成本几乎为零。预测试还有个附带好处，它能顺手验一下逻辑跳转：选了「不用这套系统」的人，是不是真的被跳过了后面二十道功能题，别让他硬着头皮全填完。常见错法有两种，一是觉得 5 个人太少不科学，干脆不做；二是把预测试当成收一轮小数据，盯着分数看。预测试是找题病的，不是出结论的，五个人足够把八成的措辞问题炸出来。"},{"u":"audio/geely/g_m3_4_6.m4a?v=202611101139","d":91.87,"t":"五条讲完，把它们摊成一张 20 条的自查表，发问卷之前逐条打钩，这就是这个模块的产出之一。一题一变量、没有「且」和顿号缝两个变量、没有夸系统的形容词、没有权威前缀、数字档不重叠、有「零」和「不用」的位置、有「其他请注明」、跳转验过、预测试做过……一条条对，五分钟能过完一遍。这里说个最常见的整体错法：把问卷写长显得专业，觉得题多、显得我们调研做得扎实。恰恰相反，题越多，中途退出越多，某协同模块那次 34% 的人填到一半走了，多半就是被四十道题吓的。还有一个是「一题多问省题数」，省下来的题数换来的是整份数据不能拆，账根本算不过来。判断收成一句：自查表不是走形式的清单，是发之前最后一次替回答者走一遍问卷，你自己填着都嫌烦的题，别指望同事会认真填。小任务：拿这份 20 条自查表，去复查一份你们部门现有的问卷，把踩了铁律的题原样抄出来，改一版，改完再拿去预测试。"},{"u":"audio/geely/g_m3_4_7.m4a?v=202611101139","d":185.52,"t":"讲完五条铁律，加一段：那份 20 条自查表怎么用 WorkBuddy 把一份现有问卷过一遍。先说清楚，AI 不替你判断，只替你搬运整理。喂进去三样：你们部门现用的一份问卷全文、模块二留下的访谈记录里关于字段和绕行的那几段、还有上一轮问卷的开放题原话。第三样最有用，选项是不是凭空编的，拿原话一对就知道。我常用的说法是：这是一份内部系统问卷。请按五条铁律逐题体检——一题是否只测一个变量、有没有「且」「和」「、」缝起来的双重问题、有没有诱导或权威前缀、选项是否互斥穷尽、有没有留「我现在不用这套系统」和「其他请注明」。每题给三列：原题、踩了哪条、建议改法。改法要给出改写后的题目原句，不要只说「建议拆分」。所有判断必须指到原题里的具体词，指不到的写「未发现」，不要推测。最后把 20 条自查表按「通过 / 待改 / 未覆盖」三档汇总，未覆盖的单独列出来。「指到具体词、不许推测」这句必须写。AI 审问卷最爱泛泛而谈，一句「该题略显引导」你根本没法改；它一旦被逼着指出是哪个词，输出就能直接动手了。它还有个比人稳的用处：查「且」「和」「以及」这类连接词，二十道题它一遍扫完，不漏，比你自己逐行看快得多。但有三个坑。第一，它会替你改写题目时顺手把选项也补全，补出几个现场根本不存在的工具。所有选项必须来自你给的访谈记录，记录里没有的写「待补」，别让它凭常识编一个「共享文档」出来。第二，它会把长问卷夸成「覆盖全面」。你要的是删题不是加题，提示词里补一句：同时指出哪三道题可以合并或删除，并说明理由。第三，它判断不了「互斥」里的数字档。「1 到 3 次」「3 到 5 次」这种边界重叠，它常常看不出来，得你自己逐档核一遍。另外必须人工核的：改写后的题目念出来像不像人话、「我现在不用这套系统」有没有配上跳转逻辑、预测试那 5 个人到底卡在哪道题。AI 能告诉你哪题可疑，卡不卡只有真人填了才知道。一份四十题的问卷，二十分钟出体检表。省下的时间用来真找 5 个同事坐旁边填一遍，别用来把体检表排版排得更漂亮。工具的位置放对：它挑错，你定题。"},{"u":"audio/geely/g_m3_4_8.m4a?v=202611101139","d":59.33,"t":"问卷这一节，钉三句话。第一，一题只测一个变量，双重问题最爱藏在满意度题里，「稳定且好用」收上来的分根本拆不开。第二，避免诱导、选项互斥穷尽，内部问卷尤其要留「我现在不用这套系统」，别逼绕行的人替系统打分。第三，预测试 5 人就够，看的是有没有人卡在某道题、哪个词听不懂，不是看分数。五条摊开就是那张 20 条自查表，发之前逐条打钩。下一节讲题型和量表：5 点够用为什么就别上 7 点，排序题为什么不能超过 6 个选项，还有 NPS 到底该摆在哪。"}],"g_m3_5":[{"u":"audio/geely/g_m3_5_0.m4a?v=202611101139","d":65.28,"t":"这一节讲题型和量表，先破一个很普遍的直觉：点数不是越多越精细。有同事觉得 5 点太粗，把满意度换成 7 点，想着能分辨得更细，结果数据反而更难解释——同一个人在「比较同意」和「有点同意」之间，今天选这个、明天选那个，多出来的两格全是随机噪声。内部问卷的填写场景你得先想清楚：同事是趁两三个工单之间抽空填的，不是坐下来做量表。选项越细，他越随手，你以为拿到了精度，其实拿到了抖动。这一节十分钟，讲四样东西：李克特几点够用、排序题放几个选项、MaxDiff 什么时候值得上、NPS 该摆在哪。总判断先给你：先想清楚「我要拿这个数做什么决定」，再回头选题型，别倒过来。"},{"u":"audio/geely/g_m3_5_1.m4a?v=202611101139","d":87.77,"t":"先说李克特。5 点够用就别上 7 点，这是内部系统的默认选项。判断标准不是统计上哪个更精细，是回答者能不能稳定地区分那些格子。「非常不满意、不满意、一般、满意、非常满意」，五档，同事扫一眼就知道自己该勾哪个；7 点多出来的「有点不满意」「比较满意」，人对这两档没有稳定标准，同一个人隔一周填，答案都可能不一样。某协同工具换 7 点后就发现，4.2 分和 4.6 分在业务上根本分不出差别，却多出近两成的人专门选中间那几格，等于用样本量换了一堆不可比的答案。那 7 点什么时候用？样本大、要追踪细微态度变化、而且你已经验证过回答者能区分，比如上千人的年度敬业度调研，可以上。一次几十人的内部系统小调研，5 点，够了。常见错法是把「更精细」自动等于「更专业」，换量表时连一句为什么都没写，结果前后两年的分数没法比，趋势线从换量表那天起就断了。"},{"u":"audio/geely/g_m3_5_2.m4a?v=202611101139","d":83.62,"t":"量表还有三个小地方最容易糊弄过去：中点、标签、方向。先说中点，5 点里那个「一般」要不要留，得看你打算怎么用。想逼出倾向、排优先级，可以用 4 点不留中点；想如实收态度，就留着，别把没意见的人硬推到满意或不满那边去。再说标签，最忌只有两端写、中间全裸：「1 分非常不满意，5 分非常满意」，中间三格什么都不标，于是每个人心里的「4 分」都不是同一个 4 分，这份数据没法横向比。要么每格一个短标签，要么至少把中点标清楚。方向也别乱：同一份问卷里，有的题 1 分是好、有的题 5 分是好，同事填着填着就反了，后面怎么算均值都是错的。某 HR 问卷就混过一次，三道反向题没标出来，回收后有一半人明显是顺着勾的。常见错法是只盯着「用几点」，把这三个细节当排版小事，恰恰是它们决定这份分能不能比、能不能加。"},{"u":"audio/geely/g_m3_5_3.m4a?v=202611101139","d":81.48,"t":"排序题，记住一个上限：选项别超过 6 个。人的工作记忆就那么点，让同事认真排 9 个功能的重要性，他只会把最在意的头三个认真排完，后面六位基本是随手拖的，你拿到的后六名顺序里几乎没有信息。某采购系统做过一次，列了 9 个待建功能让供应商联系人排序，收回来一看，后六位在不同人那里顺序完全是乱的，可报告里照着这个均值排了优先级，等于拿随机噪声定了半年路线图。正确做法是两步：先给一道多选，让他从 9 个里勾出「跟我有关的」，每人最多勾 6 个；再让这 6 个排序。题多了一道，排序那一步的数据才干净。还有一点，排序题只给相对次序，不给「差多少」，别拿「第一名比第二名重要」直接推出「该给第一名三倍资源」，它没这个信息。常见错法是把所有能想到的功能一股脑塞进排序题，觉得一次问完最高效，高效是高效，收上来的是一份谁也信不过的榜单。"},{"u":"audio/geely/g_m3_5_4.m4a?v=202611101139","d":76.51,"t":"再说 MaxDiff，最大差异法。它的问法不是打分，是每轮给你四五个选项，问「哪个最重要、哪个最不重要」，反复十几轮，最后算出每个选项的相对权重。好处很实在：它不给「全都重要」这种和稀泥的答案，逼着人做取舍，拿到的优先级比排序题更稳，也更适合选项多、彼此难分高下的场景。代价也得说清：题量大、设计复杂、对样本量要求高，一次几十人的内部小调研上它，光设计题库就得搭半天，回收质量还容易崩。判断标准就一条：这批选项要拿来定资源分配、定半年路线图，值得上；只是想粗粗知道「大家更在意哪几个功能」，排序题加多选就够，别杀鸡用牛刀。某费控域曾经想用 MaxDiff 排二十多个优化点，做到一半发现受访者填到第八轮就开始乱点，最后还是退回六项排序。常见错法是被方法名字唬住，觉得越复杂越显得调研扎实，忽略了自己手上只有两周和三十个同事。"},{"u":"audio/geely/g_m3_5_5.m4a?v=202611101139","d":78.43,"t":"NPS 题，位置比措辞更要紧，记住两条：放问卷末尾，不加解释性前缀。放末尾是因为它问的是整体推荐意愿，得让人把前面具体环节都想过一遍再答，一上来就问，答的是第一印象，不是判断。不加前缀，是说它前面别垫「我们系统今年做了很多优化」这类话，垫了就是诱导，和上一节铁律三一个道理。标准就一句：「您有多大可能，把这套系统推荐给其他基地或部门的同事」，0 到 10 分。B 端内部系统还得改一个词：C 端问「推荐给朋友」，内部没有朋友，要改成「推荐给其他基地、其他部门用」，回答者才有个具体画面。还有一点，NPS 只给一个数，它不告诉你为什么，所以后面最好跟一道开放题「主要原因是什么」，把那个「为什么」接住。常见错法是把 NPS 放在开头当门面，或者在题目前加一大段系统介绍，两种都会把这个数变成一句客气话；还有人拿 NPS 直接当满意度用，可它测的是推荐意愿，和满意不是一回事。"},{"u":"audio/geely/g_m3_5_6.m4a?v=202611101139","d":77.71,"t":"题型定了，还有个顺序问题，很多报告的差异其实出在这儿。推荐的顺序是：先行为事实，再评价打分，最后 NPS 和开放题。行为事实是「上个月你填了几张单子、有没有绕到 Excel」，这类题不带情绪，让人先回到具体场景；然后再问满意度、易用性这些评价；NPS 收尾，开放题放最后接原因。反过来，一上来就问「你满意吗」，等于给整份问卷定了情绪基调，后面所有具体题都会被这个第一印象带着走，这叫锚定。某协同模块做过一次 A/B，只是把满意度题从第一道挪到行为题之后，均值就从 4.2 掉到 3.8——不是系统变了，是人先想了几件卡住的具体事，再打分就实在了。常见错法是把最想给领导看的那道题放最前面，或者把开放题塞在中间打断节奏。顺序不是排版美观问题，它悄悄决定了你收上来的是态度还是事实。"},{"u":"audio/geely/g_m3_5_7.m4a?v=202611101139","d":78.89,"t":"把这一节收成一句：题型是为决定服务的，不是为问卷好看服务的。动手出题前，先把话写下来——我要拿这个数做什么决定。是想排功能优先级，就用多选加六项排序；是想追踪态度变化，就用 5 点李克特、标签标全、方向统一；是想要一个能对外说的整体数，就末尾放一道干净的 NPS。说不清这个决定，就别加题。最典型的错法是「把能问的都问一遍」，觉得数据先收着，将来总有用。内部问卷每多一道题，都在消耗同事下一次还愿意认真填的耐心，这份耐心比数据稀缺得多。还有个错是照搬 C 端问卷模板，NPS 问「推荐给朋友」、量表上 7 点、排序塞九个功能，三样都是为陌生消费者设计的，放到同事身上全不对。小任务：拿你那份问卷，给每道题后面写一句「这个数用来做什么决定」，写不出来的题，删掉；写得出来但题型不对的，按这一节换一版。"},{"u":"audio/geely/g_m3_5_8.m4a?v=202611101139","d":60.07,"t":"题型这一节，钉三句话。第一，5 点够用就别上 7 点，点多不等于更准，同事抽空填答时，多出来的格子全是噪声。第二，排序题选项别超过 6 个，MaxDiff 好用但题量大、成本高，小调研别硬上。第三，NPS 放问卷末尾、不加解释性前缀，B 端还得把「推荐给朋友」改成「推荐给其他基地、其他部门」。题型和顺序都是为一个东西服务：你要拿这个数做什么决定。下一节是这一模块最硬的一节，把问卷和埋点放一起对。满意度 4.2 分、使用率 31%、68% 的人月登 1 次，这三个数打架，你信哪一半？"}],"g_m3_6":[{"u":"audio/geely/g_m3_6_0.m4a?v=202611101139","d":80.78,"t":"这一节讲全模块最有用的一件事：把问卷和埋点放一起看。先摆一个真案例。SRM 供应商门户上线半年，使用率 31%，同一轮问卷满意度 4.2 分，5 分制，业务方看着这分数挺踏实。可埋点一拉，68% 的供应商每月只登录 1 次。三个数摆一块儿就打架了：4.2 分说体验不错，31% 说没多少人用，68% 说就算用也一个月才碰一回。这时候最忌讳挑一个信，比如只拿 4.2 分去汇报、把 31% 解释成「推广不够」。正确动作是先别下结论，去查这三个数各自测的到底是什么。这一节九分钟，给你四个行为指标、一个三步判断法、还有埋点口径的三个坑，最后用费控的分层案例收口。判断先给你：态度是线索，行为才是事实，两个对不上时，以行为为准，回头去问态度为什么撒了谎。"},{"u":"audio/geely/g_m3_6_1.m4a?v=202611101139","d":82.2,"t":"先认全内部系统的四个核心行为指标：登录频次、任务完成时长、退回率、绕行率。登录频次看人来得多不多，但要小心，它最容易被制度推高，后面细说。任务完成时长看一件事从点开到办完花多久，某费控模块这个数是 41 分钟，其中一大半耗在反复找单号上，这个数比任何满意度都更能指到具体环节。退回率看有多少单子被打回来重做，同一个模块 34%，基本就是字段口径没对齐的信号。绕行率最关键，也最难拿：它记的是本该在系统里做、结果跑去 Excel、微信、纸质台账的动作。系统埋点看不到系统外，所以这一项得靠现场观察、工单记录、甚至那句「你们组谁还在用 Excel 做」补。四个指标里，前三个后台能导，第四个要你去现场，可偏偏第四个才是内部系统真正的体检结果。常见错法是只盯登录频次，因为它最好看、最好导，月活一涨就写「用户活跃度提升」，把被强制登录当成用得顺。"},{"u":"audio/geely/g_m3_6_2.m4a?v=202611101139","d":76.51,"t":"回到那三个打架的数，「问卷说满意但不用」有个三步判断法，照着走就行。第一步，看使用是不是被制度强制的。一查就清楚了：门户实际只在月度对账时被强制使用，供应商那个月必须上来确认一次数，所以 31% 和 68% 月登 1 次，描的是同一件事——这是个对账工具，不是日常工作台。第二步，看满意度测的是「能用」还是「好用」。一个月才碰一回、每次就点两下确认，页面没报错、数对得上，人家当然给 4.2 分，评价的是「能用」，不是「好用」，更不是「离不了」。第三步，看谁没被问到。填问卷的本来就是那批还会登录的人，68% 月登 1 次的人里，大量压根没进入样本，真正绕开的人一个都没开口。三步走完，结论就稳了：使用率是流程强制力指标，不是体验指标。常见错法是跳到方案，一看 31% 就发培训通知，把流程问题当成推广问题办。"},{"u":"audio/geely/g_m3_6_3.m4a?v=202611101139","d":79.66,"t":"把上一段那个结论再钉一下，顺便讲一个当时看着特别顺、后来证明没用的方案。当时团队看到 31% 使用率，第一反应是「供应商不会用」，于是做了一轮操作培训，又顺手把门户 UI 改了一版，图标、配色、引导全翻新。两周下来使用率一动没动。回头才明白：门户只在月度对账被强制打开一次，人家不是不会用，是压根没有别的事需要进来，界面再漂亮也没有第二次登录的理由。代价是一轮培训加一次改版，还有供应商被折腾一回的耐心。真正该做的，是承认这个系统的使用强度由对账流程决定，要提升体验，得去砍对账那一步的等待和核对，而不是在门户首页上使劲。常见错法有两个，一是看到 4.2 分就判定体验良好、直接结项；二是把使用率低一律归成「推广不够」，发通知、加考核、做培训，全是冲着「让人多来几趟」使劲，没碰那个人为什么只来一趟。"},{"u":"audio/geely/g_m3_6_4.m4a?v=202611101139","d":90.84,"t":"接着说埋点口径，出报表前必过三个坑，少剔一类数就全歪。第一个，含测试账号。上线前联调、验收时压测，都会留下一堆操作记录，这些账号一天能点几百下，混进来登录频次直接虚高。第二个，含管理员。管理员、系统运维、实施顾问天天在后台进出，他们的操作频次是普通用户的几十倍，一平均，把整条均值抬起来。第三个，含批量导入。一次批量导入 200 条，埋点要是按条计数，就成了 200 次操作，可那只是一个人点了一下按钮。某费控报表没剔这三类，登录频次一度虚高两成多，据此判断「大家用得挺勤」，跟现场看到的冷清完全对不上。所以拉数回来第一句要问：测试账号、管理员、批量导入，剔了没有？再补一句口径：登录算「人」还是算「次」，任务完成算不算被打回重做的。常见错法是拿到后台导出的表就直接做图，默认数据是干净的，可后台从来不会替你区分谁是真人、谁是联调。"},{"u":"audio/geely/g_m3_6_5.m4a?v=202611101139","d":82.85,"t":"口径干净了，才谈得上互证。互证的方法不难：问卷里每一句态度，都去埋点里找一个能对照的行为。问卷说「查历史记录很麻烦」，就去看查询功能的点击占比、看那一步的平均停留；问卷说「挺满意」，就去看绕行率和退回率有没有同步降。两个来源对得上，结论可以写硬一点；对不上，以行为为准，态度只当线索，再回头查是不是问错了人、问错了题，或者像门户那样把「能用」当成了「好用」。还有个好用的反向查法：埋点里发现某个功能几乎没人点，别急着下「不需要」的结论，先去问卷和访谈里找有没有人提过它——可能不是不需要，是入口藏太深、或者权限根本没开。某协同模块的「批量导出」就是这么被救回来的，埋点显示点击寥寥，访谈里却被三个人主动提到，一查是按钮在二级菜单里，谁都没看见。常见错法是各出各的报告：问卷组交一份满意度、数据组交一份月活，两份都漂亮，谁也不去对，打架就一直留在那儿。"},{"u":"audio/geely/g_m3_6_6.m4a?v=202611101139","d":78.0,"t":"这一节最后一个案例，讲功能使用分布怎么把被忽略的需求翻出来。费控系统用 RFM 的变体给用户分层，三个维度换成最近使用、使用频次、功能深度，把人分成四层。分完冒出一个谁都没料到的群体，约占 22%：每天登录，但只点「审批待办」，从不碰查询和分析功能，典型的「高活跃低深度」。单看整体活跃度，这批人被平均得干干净净，报告上写的是「日活稳定、使用健康」。可单独把这 22% 拎出来访谈，真实需求一句话就清楚了：他们是各级审批人，要的是「手机上 30 秒把待办处理完」，根本不需要 PC 端那些报表。而当时的产品路线图，恰恰在集中优化 PC 端报表——一个当时看起来理所应当、后来证明对这批人完全没用的方向。分层让被忽略的需求显形，这就是「看分布」比「看均值」值钱的地方。常见错法是只报一个整体活跃度或整体满意度，一个数把内部几拨动机完全不同的人压成一团，谁的需求都看不见。"},{"u":"audio/geely/g_m3_6_7.m4a?v=202611101139","d":81.24,"t":"把这一节收成一个出数前必问的三句，任何报表、任何问卷结论都适用。第一句，这个数是态度还是行为？是别人嘴上说的，还是手上做出来的，权重不一样。第二句，口径干净吗？测试账号、管理员、批量导入剔没剔，登录算人还是算次，问一遍。第三句，分布长什么样？别只看一个均值，按角色、按频次拆开，看有没有哪一群人被平均掉了，那 22% 就是这么藏住的。三句问完，再去写结论。常见错法是拿到数就往汇报里搬，尤其碰上 4.2 分、31% 这种现成又好看的数，忍不住直接当结论用，忘了它们各自站在哪一层。这一节的小任务：挑你们系统一份现成的埋点报表，按三句逐条核一遍，写下至少一处口径问题和一处被均值盖住的群体。下一节是模块收口，讲四类解读陷阱，其中一类就叫均值掩盖分布，你会看到它还能把结论骗得更狠。"},{"u":"audio/geely/g_m3_6_8.m4a?v=202611101139","d":200.14,"t":"讲完互证，加一段：埋点报表和问卷结论怎么用 WorkBuddy 摆到一张桌上对。先说清楚，AI 不替你判断，只替你搬运整理。喂进去四样：后台导出的、脱敏后的埋点明细，问卷的汇总结果，你对口径的一段说明，还有模块二的观察记录。导埋点第一件事是脱敏，账号、姓名、工号全删，只留岗位、基地、操作类型、时间戳，内部数据别整表往外扔，这条比效率重要。我常用的说法是：这是一份脱敏后的埋点明细和一份问卷汇总。请先按口径说明，把测试账号、管理员、批量导入三类记录单独标出来，并给出剔除前后的登录频次对比。然后把问卷里每一句态度，配一个能对上的行为指标，做成两列：态度、对应行为、是否一致。不一致的单独列一组，只写「哪里对不上」，不要解释原因、不要给方案。最后按岗位和使用频次把用户分层，报出每层的活跃度和功能深度，特别标出「高频次但低深度」那一层占多少。「不要解释原因、不要给方案」这句最关键。AI 一看到 4.2 分配 31% 使用率，立刻会编一段「可能是推广不足、建议加强培训」，听着通顺，正是这一节要防的那个跳步。让它只把对不上的地方摆出来，为什么，你自己去现场查。它比人快的地方有两处：一是剔口径，三类账号在几万行里它一遍扫完；二是分层，RFM 那三个维度它一秒切四层，22% 那群「每天登录只点审批待办」的人，肉眼翻报表根本翻不出来。但有三个坑。第一，它默认后台数据干净，你不写「标出三类账号」，它直接拿全量算均值。第二，它会把「登录算次」还是「登录算人」自己定一个，口径说明必须你写清，不然两份报告的分母都不一样，对也是白对。第三，它会拿态度去解释行为。对不上的那一组，它总想补一句因果，提示词里要明说：只列现象，相关不等于因果，机制由人补。必须人工核的还有几样：绕行率它算不出来，那部分得靠观察记录和你去工位上问；「高活跃低深度」那层到底是不是审批人、真实需求是不是手机上 30 秒处理待办，得访谈过才算数；剔除规则有没有误伤真实用户，也自己抽几行看看。几万行埋点，半小时出对照表。省下的时间用来真的去找那 22% 的人聊十分钟，别用来把图表配色改得更顺眼。工具的位置放对：它对数，你下结论。"},{"u":"audio/geely/g_m3_6_9.m4a?v=202611101139","d":58.7,"t":"互证这一节，钉三句话。第一，登录频次、任务完成时长、退回率、绕行率，四个指标里绕行率最难拿，也最说明问题。第二，问卷说满意但不用，按强制不强制、测的是能用还是好用、谁没被问到三步走，别急着改功能。第三，埋点口径先剔掉测试账号、管理员、批量导入，口径不干净，后面的数全白算。态度是线索，行为才是事实，两个对不上，以行为为准。下一节是模块收口，讲四类解读陷阱：算对了的数，结论照样能错。先猜一个——平均审批时长 2 天，为什么一线没一个人觉得自己等过两天？"}],"g_m3_7":[{"u":"audio/geely/g_m3_7_0.m4a?v=202611101139","d":72.96,"t":"这一节是模块收口，讲一个反直觉的地方：数算对之后，结论照样能错。先说设计稿里那组最典型的数。某审批流报表写「平均审批时长 2 天」，看着挺慢，可你去问一线，没一个人觉得自己等过两天。把分布拉出来就明白了：中位数只有 4 小时，绝大多数单子半天内就走完了，长尾是被 3 个特殊节点拉出来的——有几张卡在跨系统补材料、等特殊签批的单子，一压就是十几天。均值把这几张的等待摊到了所有人头上，于是「2 天」这个数，既不代表多数人的体验，也指不到真正该改的那 3 个节点。判断很简单：报均值必须同时报中位数和分布，缺一个就别下结论。这一类叫均值掩盖分布，是四类陷阱里最普遍、也最容易带错方案的一个。常见错法是拿一个漂亮均值直接进汇报，还顺手立个「把 2 天压到 1 天」的目标。"},{"u":"audio/geely/g_m3_7_1.m4a?v=202611101139","d":74.64,"t":"第二类，幸存者偏差。你分析的，是还留在系统里的那批人，而已经绕到 Excel、微信群、纸质台账的人，早就不在数据里了。某协同模块做满意度分析，样本从后台活跃账号里抽，结论是「留存用户满意度稳步提升」，听着挺好，可那批三个月前就彻底不登录、改用共享表格的人，一个都没进样本——系统越难用，走的人越多，留下来的越是能忍的，满意度自然逐年上升。你把「留下来的用户」的样子，当成了「所有用户」的样子。这跟模块二讲绕行者、第三节讲回收率，是同一个洞换了三件衣服。识别办法就一句：这份数据里，有没有「已经放弃的人」？没有，就主动补，哪怕靠现场问出两三个。常见错法是用留存、活跃这类口径做体验结论，指标定义本身就把失败者排除在外了，越算越好看。"},{"u":"audio/geely/g_m3_7_2.m4a?v=202611101139","d":79.37,"t":"第三类，辛普森悖论，听着玄，内部系统里其实常碰到。说的是：整体看一个结论，拆到每个组里看，结论反过来。举个真事。整体报表显示 A 基地退回率比 B 基地低，于是写「A 的做法值得推广」。可把两个基地都按岗位拆开，A 在每一个岗位上的退回率都比 B 高。反了，为什么？因为 A 的单子结构里，简单单子占了大头，简单单子本来就不容易退，把整体一平均，就把结构差异当成了能力差异。判断标准：分组结论和整体结论打架时，先别急着解释，去查两组的构成是不是不一样。比较之前先对齐结构，按岗位、按单子类型分层比，或者干脆看同一层里的数。常见错法是拿两个部门、两个基地的整体率直接排名、直接追责，排名表一贴，被表扬的那个其实是活儿简单，被批评的那个扛的全是硬骨头。"},{"u":"audio/geely/g_m3_7_3.m4a?v=202611101139","d":81.77,"t":"第四类，相关非因果，这个在第一节埋过一句，这里收回来。培训次数多的组退回率低，不等于培训降低了退回率；登录频次高的人任务完成快，也不等于多登录能让人变熟练。很可能是倒过来的：本来单子简单、活儿顺手的人，才有空去参加培训、才愿意多上来点两下。数只告诉你两个东西一起动，不告诉你谁带动谁，要下因果，你得能说出一条机制，最好还能找个反例或者做个对照。某费控域就据「培训组退回率低」全面推了培训，一个季度后退回率没动，因为根因是字段口径没对齐，跟培不培训无关。判断一句：相关只是线索，是「值得去查一下」的提示，不是「所以该这么做」的依据。常见错法是把一条漂亮的相关直接写进汇报，配一句「建议推广」，从数到方案一步跨过去，中间那句「为什么会这样」从头到尾没人补，而这恰恰是第一节说的、定量答不了的那部分。"},{"u":"audio/geely/g_m3_7_4.m4a?v=202611101139","d":85.2,"t":"四类摆一起，共同点很清楚：它们都不发生在算数的那一步，而发生在「数已经摆桌上、正要写结论」的那一步。错法也高度一致——拿到一个现成、好看、能直接贴进汇报的数，就不肯再多问一句。其实只要补三问，四类陷阱大多能挡住：这个数是怎么算出来的、谁没被算进去、分布长什么样。第一问挡口径和均值陷阱，第二问挡幸存者偏差，第三问挡辛普森和「高活跃低深度」那 22% 被平均掉的情况。回头看，SRM 门户的 4.2 分、费控的 22% 分层、审批时长那 2 天，栽的都是同一件事：只看了一个数，没看它背后站着哪些人。常见错法还有个心态上的：觉得定量结论比定性硬，一旦算出个数就不愿意再推翻，宁可给它配个方案，也不肯回去查口径。记住，数不会自己撒谎，是我们替它把话说得太满。把三问写成自查表最后一栏，出结论前逐条勾一遍，这一模块的工具就齐了。"},{"u":"audio/geely/g_m3_7_5.m4a?v=202611101139","d":85.75,"t":"模块三到这里收口，三句话带走。第一，先问「这个问题定量能不能答」；第二，使用率是流程强制力，不是体验；第三，均值会骗人，看分布。三句分别对着这一模块的三个关口：接活时别拿问卷去答「为什么」，看数时别把被强制的登录当成用得顺，出结论时别让一个均值盖住一群人。你手上现在多了两样能直接带回岗位的东西：一张 20 条的问卷自查表，和一张样本量速算表，前者管「问得对不对」，后者管「发得值不值」。加上前面模块留下的五问卡、深访提纲、观察记录表，到这里，「有多少人这样」和「他们为什么这样」两套证据你都能自己收了。下一节进模块四，第一件事是把这些证据收成画像：原型画像、角色画像、数据画像，三类各用在哪，为什么 B 端内部系统多半该先做角色画像，而不是先堆标签。先留一个问题给你：同一个岗位，用得最多的人和几乎不用的人，该画成两个画像，还是一个人身上的两种状态？"},{"u":"audio/geely/g_m3_7_6.m4a?v=202611101139","d":76.13,"t":"模块三到这里收口，三句话带走。第一，先问「这个问题定量能不能答」，答「有多少、差多少」用数，答「为什么、该怎么办」先去现场。第二，使用率是流程强制力，不是体验，31% 和 4.2 分放一起，先查它们各自测的是什么。第三，均值会骗人，看分布，均值 2 天、中位数 4 小时，中间藏着 3 个卡住的节点。这一模块你多了问卷自查表和样本量速算表，加上前面的五问卡、深访提纲、观察记录表，「有多少人这样」和「为什么这样」两套证据都能自己收了。下一节进模块四第一节，三类画像：原型画像、角色画像、数据画像，各用在哪。先想一个问题：同一个岗位，用得最多的人和几乎不用的人，该画成两个画像，还是一个人身上的两种状态？"}],"g_m4_1":[{"u":"audio/geely/g_m4_1_0.m4a?v=202611101139","d":72.31,"t":"你手上有三样都叫「用户画像」的东西，长得完全不一样。第一样是原型画像，给一类人起个名字、配张照片、写一段他一天怎么过，市场部最熟这种，贴在墙上很好看，评审会上却没人拿它做决定。第二样是角色画像，不写姓名、不写年龄，只写岗位、权限、每天要交付什么动作、被哪张考核表卡住。第三样是数据画像，从后台埋点里跑出来的，谁在哪一步停了多少秒、哪张表一个月导出过几次、哪个字段从来没人填。这一节五分钟就讲清一件事：这三种不是三种风格，是三个不同阶段该用的三样东西，用错阶段的代价比不做画像还大。先给结论——在职能域做内部系统，优先做角色画像，不是因为它最细，是因为组织结构稳定、角色边界清楚，你拿岗位就能把人干净地切开，不用去猜他是什么性格。"},{"u":"audio/geely/g_m4_1_1.m4a?v=202611101139","d":72.29,"t":"原型画像的证据是访谈里那些活生生的细节：他几点上班、用几个系统、最烦哪一步、原话怎么说的。它适合项目最早期，团队对这类人一无所知的时候，用来把「用户」从一个词变成一个人，让大家愿意听下去。但它的产地是消费端，那边一个人可以选、也可以走，所以性格、态度、生活方式真的会影响他买不买。内部系统不是被选择的，是被摊派的。我们踩过一次：做一套人力条线的证明开具系统，先给一线办事专员做了一版特别完整的原型画像，起了名字、配了照片、写了他一天怎么过，贴在项目室墙上，来参观的人都夸做得细。后来进评审，没有一条结论用得上它——因为要决定的是那个「在职证明」字段该不该必填，跟他性格、他几点上班一点关系都没有。那版画像当时看着最像成果，后来证明最没用。"},{"u":"audio/geely/g_m4_1_2.m4a?v=202611101139","d":78.96,"t":"角色画像不写这个人是谁，只写这个位置要求他做什么。一个岗位一张，字段就四个：权限边界、每天必须交付的动作、被哪张表考核、卡住时他绕去哪。你会发现这四样全都能在制度文件和流程图里找到，不用猜、不用共情，换谁来填结果都差不多。这正是职能域最舒服的地方：组织结构稳定、角色边界清楚，一个费用审核岗今天和明年干的事基本一致，你今年做的画像，后年还能用。还有一层更实在的——内部用户的诉求不是长在他个人身上，是长在岗位身上的。他嫌填得多，不是因为他没耐心，是因为这个岗位一天要过六十单；他坚持要留痕，也不是因为他谨慎，是三年后内审要倒查。你按性格去写，就把一件制度问题写成了脾气问题，后面所有判断都会歪。所以角色画像看着最干巴，却是唯一能直接接上设计决策的一种：加不加字段、砍不砍环节，都能对着岗位问一句「他这一步会变成什么样」。"},{"u":"audio/geely/g_m4_1_3.m4a?v=202611101139","d":79.58,"t":"数据画像听着最硬，其实挑系统。它要后台有埋点、有操作日志、有至少几个月的真实流水，才能告诉你谁在哪一步停了、哪个字段九成的人跳过。所以它只适合已有埋点的存量系统，而且是那种用量大到肉眼数不过来的系统。新系统、或者压根没埋点的小工具，你硬要做，只能拿登录次数凑数，跑出来一张挺漂亮、但什么也说明不了的图。更常见的坑是把数据画像当起点：一上来就拉后台，按操作频次把人分成高频低频，然后宣布高频的就是核心用户。这一判断我们后面第四节会专门拆，因为它错得很贵——采购域里供应商一年才来几次，按频次连前二十都进不去，可他一次不来，整批交付就卡住。数据画像的正确位置在后面，是拿来校验角色画像的：你访谈里说审核员最卡在查历史付款，那就去日志里看，他是不是真在那一页平均停了四十秒。对得上，画像才算数；对不上，回去改画像，不是改数据。"},{"u":"audio/geely/g_m4_1_4.m4a?v=202611101139","d":85.68,"t":"把三样摆一起，你就清楚该什么时候用哪个。原型画像的证据是访谈原话，产出是一个让人记得住的人，用在最早期，解决「团队根本没概念」的问题，但一到设计决策就该退场。角色画像的证据是制度、流程图、岗位说明和观察记录，产出是一张能对着问「这一步会怎样」的卡，用在需求定义和评审，是职能域的主力气。数据画像的证据是后台日志，产出是频次、停留、绕行率这些数，用在存量系统的校验和灰度，回答「我猜的对不对」。判断顺序是：先用原型把人立起来，尽快换成角色把决策接住，等有了埋点再用数据去验。最怕的是停在第一步不动，把一张写得动情的人物海报当成最终成果，评审会上念一遍，然后该吵的字段还是照吵。也怕跳步，系统还没上线、一个人没用过，就先拉一张埋点分布图，那张图上的每个数字都只是你已经填进去的假设。这一节你要带走的不是三种画法，是一句话：现在这个阶段，我手上这张卡，能不能改一个具体的设计决定。"},{"u":"audio/geely/g_m4_1_5.m4a?v=202611101139","d":93.94,"t":"最后说三个最常见的错法，你对照一下自己手上的项目。第一个，把原型画像当交付物，名字照片一天生活写得越细越好，可评审要的是「这次为谁优化」，海报回答不了这个。第二个，给每个部门都做一张，做完十几张挂一墙，彼此没主次，等于没有画像——画像的价值恰恰在分出核心和边缘，这个第四节讲。第三个，用年龄、司龄、办公地点去切内部用户，切完发现每一类要的功能一模一样，白切。这三个错的根子是同一个：把画像当成「更了解同事」的资料，而不是「更敢下判断」的判据。内部系统里，你的用户不会卸载，只会绕到 Excel、微信、纸质台账，他嘴上不说不满意，手上早就投了票。所以这一节的任务很具体：挑你手上一个系统，别做海报，按岗位写一张角色画像，四个字段填全——权限、每天交付的动作、被哪张表考核、卡住时绕去哪。填完问自己一句：拿着它，我能不能否掉一个正在排期的功能。能，这张卡就活了。"},{"u":"audio/geely/g_m4_1_6.m4a?v=202611101139","d":67.3,"t":"这一节钉三句话。第一，三类画像是三个不同阶段用的三样东西：原型画像靠访谈原话，用来早期把人立起来；角色画像靠制度和岗位，用来接设计决策；数据画像靠后台埋点，用来校验前两者。第二，B 端先做角色画像，因为组织结构稳定、角色边界清楚，拿岗位就能把人切开。第三，用错阶段比不做画像还贵，一张贴墙的原型海报接不住「这个字段加不加」。下一节给你一套能照着走的流程：五步构建法。盘来源、选维度、分层、命名、校验，看着规整，可返工最多的偏偏是第二步。先猜一个：按年龄把报销人切成年轻和资深两类，为什么写得再细也白写？"}],"g_m4_2":[{"u":"audio/geely/g_m4_2_0.m4a?v=202611101139","d":73.46,"t":"构建一张画像，拆开就五步：数据来源盘点、维度选取、分层聚类、命名与叙事、校验与迭代。听起来像流程表，其实每一步都有一个最小产出，少一样，下一步就得回头。第一步盘数据，产出是一张来源清单；第二步选维度，产出是三到五个真能改设计的切分角度；第三步分层聚类，产出是几组彼此不重叠的角色；第四步命名叙事，产出是让评审记得住的一句话；第五步校验迭代，产出是「哪条被现场推翻了」的记录。这五步里，返工最多的是第二步。原因很简单：维度选错了，后面聚出来的组、起的名字、写的故事全跟着错，而且越往后再发现，拆起来越贵。先给这一节的结论——只选能改变设计决策的维度。一个维度值不值得留，就问一句：把它切成两类之后，我会给这两类做不一样的东西吗？不会，就删掉。"},{"u":"audio/geely/g_m4_2_1.m4a?v=202611101139","d":79.39,"t":"第一步盘数据来源，别一上来就访谈。职能域的好处是证据本来就在：岗位说明、权限矩阵、制度文件、流程图、上季度的工单、系统里导出的操作流水、还有跟班时记的那几页笔记。你要做的不是全读一遍，是列一张清单，每样后面标三件事：它能回答哪个问题、覆盖哪几个岗位、上一次更新是什么时候。标完你会发现两件事。一是有些来源互相打架，制度写着三级审批，流程图上其实两级就过了，这个差本身就是重要发现，别急着选一个信。二是一定有几格是空的——比如谁在绕行、绕行花了多久，制度里不会写，工单里也未必有，只能去现场看。把这些空格圈出来，它们就是第二步要补的访谈对象。常见错法是拿一份需求文档当全部来源，那上面写的是「系统该有什么」，不是「人实际怎么做」，照着它盘，等于把别人的假设又抄了一遍。盘点的产出不是资料堆，是一张带空格的清单，空格比填满的格子更值钱。"},{"u":"audio/geely/g_m4_2_2.m4a?v=202611101139","d":86.42,"t":"第二步选维度，这是最容易翻车的一步，也是这一节真正想讲的地方。判据只有一条：这个维度会不会让我给两类人做不一样的设计。会，留；不会，删。拿费控系统试一下。「每单处理量」该留，日均六十单的审核员和一天三单的兼职，要的批量功能完全不同。「是否外包」该留，权限边界和能不能看历史单据直接由它决定。「卡在哪一步」该留，卡在查历史付款的人和卡在等发票的人，改法南辕北辙。哪些不该留？年龄、性别、司龄、办公地点，基本都不该留。我们真做过一版：按年龄把报销人切成「年轻员工」和「资深员工」，写了两页很顺的画像，年轻员工说偏好手机端、资深员工说习惯打印。看着挺对，后来证明一点用没有——因为系统只给一个入口，手机端和打印都得走同一套必填字段，你不可能给一类人少填三个格。那两页画像当时看着最完整，恰恰因为它选了一个不改变任何设计的维度。维度不是越多越细越好，是越能分出不同动作越好。"},{"u":"audio/geely/g_m4_2_3.m4a?v=202611101139","d":77.76,"t":"第三步分层聚类，把选好的维度叠起来，看人自然落成几组。职能域通常不用算法，两三个维度一交叉就够：按岗位切开，再按「高频还是低频」「绕行还是不绕行」分一层，四到六组就到顶了。这里两个返工点特别常见。第一个是组之间重叠，同一个人被算进两组，原因是维度没选干净，比如同时用了「岗位」和「是否审批」，审批本身是岗位的一部分，叠起来就重了。检验办法很土但有效：任挑一个真实同事，问他能且只能落进哪一组，落不进或落两处，回去重切。第二个是组太多，切到十几组，每组只剩一两个人，那不叫画像，叫花名册。组数一多，评审会上没人记得住，更没人会照着它做决定。记住聚类的目的是分出主次，不是把每个人安顿好。分完之后先别急着写故事，把每组的人数、典型动作、最常卡的那一步各写一行，四到六行摆在一页里，能一眼看出哪组人多、哪组最痛，这一页就是下一步命名要用的底稿。"},{"u":"audio/geely/g_m4_2_4.m4a?v=202611101139","d":83.59,"t":"第四步命名与叙事，最容易写成文案。给每组起个名字、写一段小故事，本意是让评审记得住，不是让人感动。好名字就一个标准：念出来，大家知道该拿它做什么决定。「天天填单的人」比「效率追求者」有用，因为前者一出口就指向字段和步数，「效率追求者」听着高级，谁也不知道该改哪。叙事也别写性格，写一次具体卡住的过程：他做到哪一步、缺什么、最后绕去了哪、多花了多久。一页一段，别超过五句。第五步校验迭代，是五步里最常被省掉、又最不能省的一步。拿画像回去找两三个真实同事对一遍，专问反例：「有没有人其实不这样？」当场被推翻的那条，改掉，并在卡片角落记一笔「某月某日被谁否了」。为什么要记？因为画像不是一次做对的东西，是一次比一次少错的东西。没有这条记录，三个月后没人说得清哪一版改过、为什么改，画像就又慢慢变回一张谁也不负责的海报。校验完，第五步的产出反过来喂给第一步，下一轮盘点就知道该补哪格。"},{"u":"audio/geely/g_m4_2_5.m4a?v=202611101139","d":82.22,"t":"把五步再收一遍，你照着走一遍就不容易返工。盘来源，交一张带空格的清单；选维度，交三到五个能改设计的角度，其余全删；分层聚类，交四到六组不重叠的角色，每组写清人数、动作、最卡的一步；命名叙事，交一个念出来就知道该干嘛的名字和一段五句以内的卡壳过程；校验迭代，交被现场推翻的那几条和改动记录。五个产出，一个都不能少，少的那一步会在评审会上以另一种方式找上你：要么分不清主次，要么名字谁都记不住，要么被人一句「我们组不这样」当场问住。还要提醒一句顺序：这五步是顺着走的，别跳。见过最贵的返工，是故事都写完了、名字也起好了，才发现维度选的是年龄，整叠卡片推倒重来。这一节的任务：拿第一节那张角色画像，把它的维度列出来，逐个过一遍那句判据——切成两类后，我会给它们做不一样的东西吗？把答「不会」的删掉，你会删得很心疼，但那正是画像开始能用的地方。"},{"u":"audio/geely/g_m4_2_6.m4a?v=202611101139","d":67.1,"t":"五步这一节，钉三句话。第一，五步各有最小产出：带空格的来源清单、三到五个能改设计的维度、四到六组不重叠的角色、一个念出来就知道干嘛的名字、被现场推翻的改动记录，缺一步，评审会补上。第二，维度只留能改变设计决策的，切成两类后你不会做不一样的东西，就删，年龄性别司龄基本都该删。第三，五步顺着走别跳，最贵的返工是故事写完才发现维度选错，整叠推倒。下一节进 B 端的硬骨头：同一个字段，使用者、管理者、决策者、监管者给你四种答案，还有第五类人不在四层里却能一句话否掉你。先想一个：一套费控系统，单均 41 分钟，为什么「谁都不得罪」的方案最后谁都没讨好？"}],"g_m4_3":[{"u":"audio/geely/g_m4_3_0.m4a?v=202611101139","d":83.35,"t":"先看一套费控系统，同一个「费用归属」字段，四个人给你四种答案。一线报销人求快，一张单平均要花 41 分钟，他恨不得只填一个金额就提交。财务审核员求合规，退回要有依据，字段少了她没法判断该不该退，出事是她解释。共享中心主管求效率和差错率，人均单量是他的考核项，他既怕填得慢，又怕退回来重做。内审求留痕，三年后要能倒查到当初谁按什么口径填的。四层诉求结构性互斥，说白了就一句：字段越多，审核越省事、一线越费时；字段越少，一线越快、审核和内审越没底。这时候画像的价值，不是「理解四方都不容易」，是给出一个明确判断——这一次为谁优化，代价由谁承担。当时有个方案看着特别周全：四层各让一步，字段加满、人人留痕，谁都不得罪。后来证明最没用，一线单均时间不降反升，绕回 Excel 台账，审核那边也没少退。"},{"u":"audio/geely/g_m4_3_1.m4a?v=202611101139","d":75.12,"t":"四层不是四个头衔，是四种完全不同的看系统的方式，画像里给每层写的东西也得不一样。先说使用者，就是天天在系统里点的那个人。写他只写两样：动作和频次。他一天开几次、每单几步、在哪一步停下来找东西、卡住时切到哪个 Excel。别写他「希望更智能」，写他「为核一段历史付款，切了三个窗口、花了两分钟」。管理者看的是指标和考核，也就是主管那一层。写他要写他背的那张表：人均单量、差错率、平均处理时长、一次通过率。他支持加字段，往往不是爱管人，是那张表上差错率超标要扣的分落在他头上。所以同一个字段，使用者问「我这一步顺不顺」，管理者问「管不管得住、指标好不好看」。这两问经常相反，你要是只访一线，会以为减字段是全场共识；把主管那张考核表摆上来，才知道减了之后谁要去解释那几个百分点的差错。"},{"u":"audio/geely/g_m4_3_2.m4a?v=202611101139","d":80.54,"t":"第三层决策者，看投入产出。他不天天用系统，但预算和立项归他批。写他要写他认的那笔账：这套东西上线，少几个人、少几次返工、关账早几天，翻不出这三项，他不会点头。别给他讲用户满意，讲了他也接不住。第四层监管者，看留痕与合规，内审、内控、报送口径都在这一层。写他要写「三年后怎么倒查」：哪一步谁改过、依据哪条口径、能不能还原当时的单子。这一层最容易被漏，因为他平时根本不出现，系统上线前你名单上想不起他，可他一句「这个不可追溯」就能让整套方案推倒重来。而且他的诉求有个特点：不产生任何日常需求，只设底线。你不能用「使用频次低」把他划走，这一点第四节会专门讲。把四层摆齐你会发现，画像不是给四层各写一段好话，是给每个争议字段写一行——谁的动作被改、谁的指标被影响、谁去解释、谁设底线。写不出后果的那一格，就是这次没人负责的地方。"},{"u":"audio/geely/g_m4_3_3.m4a?v=202611101139","d":80.98,"t":"四层之外还有第五类人，我管他叫影响者：信息安全、内控、法务、IT 架构、工会。他不在四层里，不产生日常需求，也很少来开会，但能一句话否掉你。比如某个字段要采集身份证号，使用者、管理者、决策者、监管者四层都谈妥了，信息安全一句「这个字段不该落在这套库里」，方案就得改。影响者和监管者不一样：监管者设的是业务底线，还能在流程里找到他；影响者常常连流程都不在，你按四层名单逐个发评审邀请，恰恰会漏掉他。所以画像里要专门留一栏，写「谁能否决这件事、依据什么、方案成形前找谁签过字」。识别他的办法也简单，别问「谁会用这个系统」，改问「这件事要上线，哪些部门不点头就推不动」。这一问能问出四层之外的人。把他拖进来的时机也有讲究：方案还没成形就拉，是请他设边界；等评审那天才通知，是请他否你。我们吃过这个亏，字段都开发完了，架构那边才说跨库不同步，返工两周。"},{"u":"audio/geely/g_m4_3_4.m4a?v=202611101139","d":82.18,"t":"把影响者写进画像，不是给他也做一张人物卡，他根本不用系统，写卡没意义。要写的是一条「否决记录」，挂在相关字段上：谁能否、依据哪类要求、什么时候必须让他看过、他点头之前哪些不能算定稿。拿费控那套系统收一下口：四层加影响者，落在「费用归属」这一个字段上就是五行——一线写「多填三格、单均多两分钟」，审核员写「少了依据退回会变多」，主管写「差错率那栏要有人背」，内审写「三年后倒查不到口径」，架构那边写「这个字段要同步到下游两处」。五行摆出来，你不用再听谁嗓门大，照着看这个字段影响谁的动作、谁承担后果，就能定这次往哪边偏。这也回过头解释了那个「谁都不得罪」的方案为什么没用：它把五行当成五个都要满足的愿望，可它们本来就是彼此拉扯的，全满足等于没判断。画像在这里干的活，是把含糊的「大家都有道理」，变成一张能指着说「这次先保这一行、那一行下轮补」的单子。"},{"u":"audio/geely/g_m4_3_5.m4a?v=202611101139","d":107.28,"t":"这一节三个错法，你八成见过。第一个，只访使用者，把一线的话当成全场结论，减字段减得痛快，上线后主管拿着差错率找上门，才想起还有一层背指标的人。第二个，把决策者当最大，谁级别高听谁的，于是画像写成汇报材料，全是投入产出，一线的 41 分钟一个字没有——可这一节反复讲的判据是后果归属，不是级别高低。第三个，把四层做成四张孤立的海报，各写各的，没有落在同一个争议字段上，结果评审时四张都对、就是定不了事。这三个错的根子，都是把四层当成「要讨好的四类人」，而不是「同一件事上的四种后果」。纠正的办法很具体：别按人分卡，按字段分行。挑三到五个吵得最凶的字段，每个字段下面把四层加影响者各写一行后果，谁的动作被改、谁去解释、谁设底线，写不出的格子留空。空格子不是偷懒，是提醒你这一层还没有责任人，出事那天没人接得住。四层结构讲完，下一步自然就来了：这些行里，到底哪一层算核心、哪一层只能算边缘？"},{"u":"audio/geely/g_m4_3_6.m4a?v=202611101139","d":86.18,"t":"收一下。B 端一张画像，至少站得住四层加一类：使用者看动作和频次，管理者看指标和考核，决策者看投入产出，监管者看留痕与合规，影响者看能不能否。每层的写法不同，别拿一张人物卡套五类人。落点也不是「理解大家」，而是对每个争议字段，给出一行「这次为谁优化、代价由谁承担」的裁决。费控那套系统最后没走「谁都不得罪」的路，是先保了一线的 41 分钟，把审核要的依据挪到后台自动带出、把内审要的留痕做成不可改的日志，等于把加字段的成本从一线身上搬走——判断没变，承担的人换了。这就是画像该有的样子：不消灭冲突，是让冲突有个明确的落点。这一节的任务：挑你系统里吵得最久的那个字段，按四层加影响者写五行后果，写完圈出空格，再补一句「这次先保哪一行」。下一节回答刚才那个问题——五行里谁算核心。先给你一个反直觉的：一年只来几次的人，往往比天天来的人更核心。"},{"u":"audio/geely/g_m4_3_7.m4a?v=202611101139","d":59.33,"t":"四层这一节，钉三句话。第一，四层看的东西完全不同：使用者看动作与频次，管理者看指标与考核，决策者看投入产出，监管者看留痕与合规，别拿一张人物卡套四类人。第二，四层之外还有影响者，信息安全、内控、法务、IT 架构，不产生需求却能一票否决，方案成形前就得拉进来。第三，画像的价值不是理解四方，是给出「这一次为谁优化、代价由谁承担」的裁决，按字段分行，别按人分卡。下一节回答刚冒出来的问题：这些行里谁算核心、谁算边缘？先给你一个反直觉的——一年只来几次的人，往往比天天来的人更核心，采购域的供应商和合规就是。"}],"g_m4_4":[{"u":"audio/geely/g_m4_4_0.m4a?v=202611101139","d":73.42,"t":"上一节留了个问题：四层加影响者，谁算核心、谁算边缘？直觉是按谁用得多来排，天天登录的放核心，一年来几次的扫到边上。这个直觉在内部系统里基本是错的。核心和边缘不看亲疏，也不看嗓门，看三条判据：价值贡献、使用频次、不可替代性。价值贡献是他在那件事里创造或守住多少价值；使用频次是他多久来一次；不可替代性是这件事离了他会不会转不动、有没有别人能顶。三条分开打分，别揉成一个感觉。先给结论，也是这一节最该记住的一句：低频不等于边缘，判定看不可替代性。内审、监管报送、采购合规，都是一年来几次、但一次不来就出大事的角色。你按频次把他们划到边缘，等于把最能让你返工的那批人，从评审名单里删掉了。"},{"u":"audio/geely/g_m4_4_1.m4a?v=202611101139","d":80.5,"t":"三条怎么打分，说个能直接照做的版本，都按一到五分。价值贡献看后果量级：他这一步出错，是重填一张单，还是整批交付卡住、对外报送逾期，前者一分，后者五分。使用频次看周期：每天、每周、每月、每季、每年几次，分别给五到一分——注意频次分是给排期用的，不是给重要性用的，别拿它当总分的主体。不可替代性看能不能顶：随便谁都能替两分，要专门授权三分，只有这个岗位能签、缺了他流程就断五分。权重上，我的习惯是不可替代性占一半，价值贡献占三成，频次只占两成。为什么把频次压这么低？因为在职能域，频次高常常只说明这活儿碎，不说明它关键。三步算完你会得到一个反常识的排序：天天来但谁都能替的人，分数中等；一年来一次、但一次卡住整条链的人，分数冲到前面。打分不是数学题，是逼你把「我觉得他重要」拆成三句能吵得起来的话。"},{"u":"audio/geely/g_m4_4_2.m4a?v=202611101139","d":91.3,"t":"拿采购域走一遍，你会立刻明白这三条为什么值钱。四类角色：需求提出人，提完需求就走，高频但低价值，谁都能自己填一单；采购执行 buyer，高频高价值，天天在跑、离了他流程断；供应商，一年对接几次，低频，可每一次都直接影响交付，规格对不上整批到不了；采购合规，更低频，平时不出现，但一票否决，不点头这单不能签。按三条判据打分，供应商和采购合规的不可替代性都顶到五分，属于核心用户；需求提出人频次满分、价值贡献和不可替代性都低，判成边缘用户。这个结果跟「谁喊得响」恰好相反——需求提出人天天在群里催，供应商半年不吭声，可真到灰度名单，你漏了供应商，交付就出洞。当时有个方案看着很顺：按登录次数拉前二十个用户做灰度，把名单铺给天天用系统的人。后来证明没用，上线后卡在供应商协同那一环，天天用的人根本碰不到那个问题。低频不等于边缘，这句话在采购域是用一次返工换来的。"},{"u":"audio/geely/g_m4_4_3.m4a?v=202611101139","d":80.02,"t":"为什么「低频高价值」总被误判成边缘？三个原因，都挺隐蔽。第一，名单来自系统后台。后台只记登录和操作，一年来几次的人自然排在末页，你从下拉框里根本看不到他，不是你故意忽略，是数据源里就没有他。第二，访谈按「方便约」来排，天天在工位的人最好找，内审、报送、合规这类角色跨部门、约一次要提前一周，排期一紧就被砍掉。第三，也是最根上的，把「用得多」直接当成「重要」。这在消费端大致成立，一个人天天打开 App 确实是重度用户；内部系统不是被选择的，高频往往是被制度推出来的，只能说明他被摊派得多，不能说明他关键。识别信号其实很直白：某个角色一旦不配合，是「慢一点」还是「办不成」。慢一点的是边缘，办不成的是核心，跟他来几次没关系。内审一年查一次，查的时候你拿不出留痕，那年就过不去；监管报送一个季度一次，错一次要重报加说明。这两类从来不是边缘，只是不常出现。"},{"u":"audio/geely/g_m4_4_4.m4a?v=202611101139","d":81.89,"t":"判定出来不是贴个标签就完事，它有三个具体去处。第一，资源分配。访谈时间、可用性测试名额、专人对接，优先给核心，别平均分——你一共能深访六个人，全给天天填单的人，就永远听不到那个一年几次、却能卡住交付的声音。第二，需求优先级。同一拨需求排期时，核心角色的阻断性问题往前放，边缘角色的体验优化往后放，这不是厚此薄彼，是同样一个人天，先解会办不成的那件事。第三，灰度范围，这是最容易出事的一处。灰度名单不能只按活跃度圈，得把核心角色逐个点名进去，尤其那些低频的：供应商、内审、合规，哪怕他们这次只占三个名额，也得占。采购域那次返工就吃亏在这——灰度铺给了高频用户，供应商协同那一段没人真正走过。补一句边界：判成边缘不等于不管，是「这次不优先为他优化」，不是「他不用了」。这句话听着硬，却是画像最有用的一句，第六节会把它带进评审。"},{"u":"audio/geely/g_m4_4_5.m4a?v=202611101139","d":76.25,"t":"这一节三个错法。第一，三条揉成一个「重要程度」凭感觉打，最后还是谁嗓门大谁核心，判据白设。第二，把频次当总分主体，前面说过，那等于用后台登录榜代替判断。第三，判完就锁死，半年不重跑——组织一调整、系统一换，去年边缘的角色今年可能接了新口径，变成一票否决。判定要跟着版本走，每次大需求重跑一遍三条分。还要回头说那个「按登录次数拉前二十做灰度」的方案，它当时看着特别数据驱动、特别公平，后来证明没用，根子就在把频次当成了重要性。这类方案的迷惑性在于它有一张漂亮的名单，你很难当场反驳；能反驳它的，只有把不可替代性那一列单独摆出来。所以别把三条判据存成一次性的表，存成提示词也行、存成评审会第一页也行，每次评审先问一句：这次名单里，有没有那个一年来几次、却一次不来就办不成的人。问完再排期，能省掉一整轮返工。"},{"u":"audio/geely/g_m4_4_6.m4a?v=202611101139","d":85.66,"t":"收一下三条判据。价值贡献看后果量级，使用频次看周期，不可替代性看离了会不会断；不可替代性占一半，价值贡献三成，频次只两成。低频不等于边缘，内审、监管报送、采购合规都是低频高不可替代，判错一次，代价是一次完整返工。采购域那四类角色值得你记牢：需求提出人高频低价值是边缘，buyer 高频高价值是核心，供应商和合规低频却一票否决，照样核心。判定的三个去处——资源分配、需求优先级、灰度范围，第三处最容易漏人。这一节的任务：把你系统里的角色列出来，逐个打三条分，圈出分数最高但频次最低的那一个，然后去翻上一版灰度名单，看他有没有在里面。多半没有。下一节换个方向，不讲怎么把画像做对，讲怎么把画像做坏——五种反模式，每一种都长得挺像正经画像，混在交付物里特别难认。先猜一个：一张写着「熟练、配合、愿意看帮助文档」的画像，问题出在哪。"},{"u":"audio/geely/g_m4_4_7.m4a?v=202611101139","d":203.76,"t":"讲完三条判据，加一段：这张打分表怎么用 WorkBuddy 铺出来。先说清楚，AI 不替你判断，只替你搬运整理。你手上一定有这些东西：一份角色清单、系统后台导出的脱敏操作流水、几次评审纪要、那几份能说清谁能否决的流程文件。三条判据的原料大多散在里面，以前你得一处处翻、凭印象打一分，现在可以一起交给它先铺一张底表。喂之前先脱敏，姓名、工号、手机号全删，只留岗位、是否外包、近半年操作次数、权限范围、参与环节，内部名单不要整表往外扔，这条比效率重要。我常用的说法是：这是一份脱敏后的角色清单和评审纪要，请按价值贡献、使用频次、不可替代性三条逐个打一到五分。价值贡献看这一步出错是重填一张单还是整批交付卡住；不可替代性看离了他流程会不会断、有没有人能顶；频次只作排期参考。每条打分必须给出材料出处，出自哪份纪要、哪条流水；材料里没有的写「待补」，不要推测。最后按不可替代性从高到低排序，单独把「频次低但不可替代性高」的角色列一栏。但有三个坑，必须写进提示词约束里。第一，它默认按使用频次排核心用户，天天登录的排前面，因为那样最省事——你要在提示词里写死一句：不要按频次排重要性，不可替代性权重最高，频次只占两成。第二，它会编岗位和制度条款，补一个「某基地采购合规专员」、引用「依据某某办法第十二条」，看着很像，那个人和那条制度你根本找不到；所有岗位必须来自我给的表，制度只写文件名、不写条款号，条号我自己核。第三，也是最贵的，它会把「低频」直接判成「边缘」，一年几次的角色顺手就归到末页。提示词里要专门加一句：低频不等于边缘，频次低不等于可替代，凡是一年几次但一次不来就办不成的，单独标出来。表出来以后，它还有个用处：把「低频高不可替代」那一栏单独甩给你，那往往正是你上一版灰度名单漏掉的人。从拉数到分栏排好，半小时。但分数必须你核，因为只有你知道，那个季度才来一次的角色，到底是真的能顶，还是缺了他整条链就断。工具的位置放对：它铺表、它找缺口，你下判定。哪些必须人工核，再钉一遍：不可替代性那一列逐个过，凡是标了核心的，去翻一眼流程文件里他是不是真能签、真能卡住；制度条款号一个都别直接带进评审；还有那个「低频」栏，挨个问自己一句，他不配合是慢一点还是办不成。这三处它替不了你。"},{"u":"audio/geely/g_m4_4_8.m4a?v=202611101139","d":61.68,"t":"判据这一节，钉三句话。第一，核心边缘看三条：价值贡献、使用频次、不可替代性，不可替代性占一半、价值贡献三成、频次只两成，别揉成一句「我觉得他重要」。第二，低频不等于边缘，内审、监管报送、采购合规都是低频高不可替代，按登录频次划走，等于把最能让你返工的人从名单里删了。第三，判定有三个去处：资源分配、需求优先级、灰度范围，第三处最容易漏那些低频核心。下一节不讲解法讲反面：五种画像反模式，每一种都长得挺像正经交付物，混在材料里特别难认。先猜一个：一张写着「熟练、配合、愿意看帮助文档」的画像，问题出在哪？"}],"g_m4_5":[{"u":"audio/geely/g_m4_5_0.m4a?v=202611101139","d":72.5,"t":"上一节讲怎么把画像做对，这一节讲怎么把它做坏。坏画像有个共同特点：单看每一张都挺像正经交付物，排版工整、词也专业，混在一堆材料里你很难当场说它不行。五种反模式：人口统计学堆砌、只有标签没有行为、没有场景、不可验证、一厢情愿的理想用户。它们不是五种低级错误，是五种「做到一半停住」的样子，所以识别信号比定义更重要。先给个总判据，五条都适用：把这张卡递给一个没参与过项目的同事，问他「照着它，你能改一个具体的设计决定吗」。答不上来，基本就中了一条。画像不是用来更了解同事的资料，是用来支撑一个能被追问的判断——这句话第一节说过，到反模式这一节才真正显出分量，因为下面五种，卡住的都是同一个地方：看着完整，落不到决定。"},{"u":"audio/geely/g_m4_5_1.m4a?v=202611101139","d":78.89,"t":"第一种，人口统计学堆砌。年龄、性别、司龄、学历、办公地点铺半页，配一张饼图，就是不写他每天在系统里干什么。识别信号：整张卡找不出一个动作、一个字段、一次卡壳。修法很直接，第二节那句判据再过一遍——每个维度问「切成两类我会做不一样的东西吗」，不会的全删，腾出的地方写动作。第二种，只有标签没有行为。「注重效率」「偏好简洁」「数字化程度高」，全是形容词。这类标签最迷惑，因为谁都同意，可「注重效率」到底意味着该砍字段还是该加批量导入，两个人能吵出两种改法。识别信号：把标签盖住，卡上还剩一件他真做过的事吗。修法是把每个标签翻译成一句可观察的行为，「注重效率」改成「为省一次复制，把单号先记在微信里再粘贴」。我们做过一版画像，八个标签写得很漂亮，评审时有人问「那这个字段加不加」，全场没人接得上——标签不指向动作，就接不住决定。"},{"u":"audio/geely/g_m4_5_2.m4a?v=202611101139","d":79.78,"t":"第三种，没有场景。卡上写了角色、写了痛点，但没写他在什么条件下、为完成什么任务时痛。比如「审核员觉得查历史付款麻烦」，听着是条需求，可月结那三天和平时，麻烦完全不是一回事：平时翻两屏能找到，月结时一天六十单连着来，翻两屏就是几十分钟。没写条件，你就不知道该优化的是查询本身，还是月结高峰的批量处理。识别信号：痛点后面接不出「什么时候」「当时在做什么」。修法是给每条痛点补一个场景三件套：什么条件下、为完成什么、卡在哪一步。补完你常会发现，同一句「麻烦」其实来自两种完全不同的处境，得拆成两条。内部系统还有个隐性问题：用户不会卸载，只会绕行，所以「没有场景」的画像往往连绕行都没记——他到底切去了 Excel 还是微信、纸质台账还是私下问人，这才是痛点真正的落点。把场景补上，画像才从一句评价变成一件发生过的事。"},{"u":"audio/geely/g_m4_5_3.m4a?v=202611101139","d":76.1,"t":"第四种，不可验证。卡上写着「大多数用户希望系统更智能」「一线普遍反映填得太多」，没出处、没样本、没时间，谁也没法去核。识别信号特别好认：出现「大多数」「普遍」「一般来说」，却跟不出一个数、一份记录、一次观察。这类画像在评审会上最危险，因为它不能被反驳——不能反驳的东西自然也不能被确认，最后就变成谁职位高谁说了算。修法是给每条结论挂一个可指认的证据：哪次访谈、第几段原话、哪天的跟班笔记、哪条工单编号，原话没有就写「缺口」，不许推测补。第二节讲盘点时说过空格比填满的格子值钱，到这儿同理：一张标了三处「待验证」的卡，比一张句句笃定却查无实据的卡可信得多。还有一层，不可验证的画像没法迭代，三个月后你想改，都不知道该改哪句、凭什么改。第五节讲校验迭代要记「某月某日被谁否了」，前提就是画像里每条都能被单独拎出来对质。"},{"u":"audio/geely/g_m4_5_4.m4a?v=202611101139","d":77.98,"t":"第五种最隐蔽，一厢情愿的理想用户。卡上那个人熟练、配合、愿意看帮助文档、记得住每一步口径，还乐意把信息填全。识别信号：画像里没有一个人会累、会忘、会赶时间、会找捷径，通篇是「应该会怎么用」，不是「实际怎么用」。我们吃过一次实打实的亏：一套给各职能中心用的台账工具，按「用户会认真读提示、会按规范填字段」写了画像，据此砍掉了必填校验、行内提示和导入模板，界面做得极干净，当时内部评审人人夸清爽。上线后新人根本用不起来，老同事照样把数据先记在微信、月底一次性粘回来，字段空一大片，返工比旧台账还重。那版画像看着最省心，后来证明最贵——它描的是我们希望有的同事，不是真会坐在那儿的那个人。修法只有一条：往画像里补进最不配合的那类人。外包、刚入职、跨基地、临退休、只在季度末用一次的人，把他们的绕行写进去，画像才从理想落回地面。"},{"u":"audio/geely/g_m4_5_5.m4a?v=202611101139","d":85.22,"t":"把五种和修法摆一排，方便你照着查。堆人口统计的，删掉不改变设计的维度，换成动作；只有标签的，把每个形容词翻译成一句可观察行为；没有场景的，补条件、任务、卡点三件套，并记下绕去了哪；不可验证的，每条挂出处，没有就标缺口，不许推测；理想用户的，补进外包、新人、季度用户这些最不配合的处境。你会发现五种修法指向同一件事：把画像从「描述一个人」拽回「记录一次发生过的事、支撑一个能改的决定」。再提醒两个错法。一个是修过头，把画像写成一沓访谈逐字稿，几十页没人看——修的是让它可验证，不是让它变长。另一个是拿反模式当检查清单打勾，勾完五种都没中，就宣布画像合格。别这么用。反模式是拿来照自己的，不是拿来交差的；真到评审，还是回到那句总判据：递给一个不知情的同事，他能不能照着改一个具体决定。能，才算过关。"},{"u":"audio/geely/g_m4_5_6.m4a?v=202611101139","d":91.27,"t":"收一下。五种反模式，人口统计学堆砌、只有标签没有行为、没有场景、不可验证、一厢情愿的理想用户，共同点都不是「做得糙」，是「停在了半路」：停在标签、停在评价、停在应该，没走到行为和证据。识别它们别背定义，用那句总判据——照着它，能不能改一个具体的设计决定。修法也别贪多，就是把每个词往回拽一格：形容词拽成动作，痛点拽成带条件的场景，结论拽成能查的出处，理想用户拽成会绕行的真人。那套台账工具的教训值得记：界面清爽是用「用户会配合」换来的，后来全赔进了返工。内部系统里，你的用户不会卸载，只会绕到 Excel、微信、纸质台账，画像要是没把绕行写进去，就等于没写他的真实选择。这一节的任务：翻出你手上那张画像，逐条找「大多数」「注重」「希望」「应该」这四类词，每个都补一句可观察、可查证的事实，补不上的直接删。下一节是这一模块的落点：一张修干净的画像，到底怎么进需求评审，怎么变成会上那句能定事的话。"},{"u":"audio/geely/g_m4_5_7.m4a?v=202611101139","d":63.38,"t":"反模式这一节，钉三句话。第一，五种反模式是人口统计学堆砌、只有标签没有行为、没有场景、不可验证、一厢情愿的理想用户，共同点不是做得糙，是停在了半路。第二，识别别背定义，用那句总判据：递给不知情的同事，他能不能照着改一个具体的设计决定，答不上来就中了一条。第三，修法只往回拽一格——形容词拽成动作，痛点拽成带条件的场景，结论拽成能查的出处，理想用户拽成会绕行的真人。下一节是这一模块的落点：一张修干净的画像，怎么进需求评审，怎么变成会上那句能定事的话。特别看两个坑：用画像替代论证，和用画像压制反对意见。"}],"g_m4_6":[{"u":"audio/geely/g_m4_6_0.m4a?v=202611101139","d":88.37,"t":"画像做干净了，最后一步是带进需求评审。先说清楚它在该出现的位置：不是开场念一遍人物介绍，是吵起来的那一刻，拿出来定事。三个正确用法。第一，判断谁受益。任何一个功能提案，把画像摆上来逐个过：这一改，哪一组的哪一步变快了、少了几个动作，说得出具体才算数，说不出就是没人为它受益。第二，判断谁受损，这条比第一条更值钱。减字段让一线快了，可审核的依据少了、内审的留痕断了、主管的差错率要有人背——把代价指名道姓落到某一层头上，别用「整体可控」糊过去。第三，判断灰度顺序。核心角色先走，尤其那些低频却一票否决的，第四节讲过，漏了他们等于没测到最要命的那段。三个用法其实是一句话：画像不告诉你做什么功能，它告诉你这次改动，谁得、谁失、谁先试。回到费控那套系统，最后能定下来，不是因为理解了四方，是因为把「先保一线 41 分钟、代价由后台自动带出和留痕日志承担」写成了明账。"},{"u":"audio/geely/g_m4_6_1.m4a?v=202611101139","d":81.46,"t":"两个错误用法，见一次挡一次。第一个，用画像替代论证。会上有人问「凭什么这个字段不必填」，答「因为我们的核心用户就是讨厌填单」——这不是论证，是把结论藏进一张卡里。画像能说明「谁会受影响、影响多大」，不能替你回答「所以该这么改」，中间那步因果还得自己摆事实、算代价。第二个更糟，用画像压制反对意见。「这就是给我们核心用户做的，边缘用户的意见这轮先不收」，一句话把不同意见归成「不是目标用户」，看着挺有方法论，其实是把画像当成了免吵金牌。反对的人里，常常正坐着那个低频却能否决你的内审或合规，你把他划成边缘，方案上线那天他一样能叫停。识别这两类错法有个简单信号：会上有没有人因为这张卡，反而更不敢说话了。画像该让分歧显形，不是让分歧消失。真用对了，它带来的不是一致，是一句能被记进纪要的取舍：这次保谁、暂缓谁、由谁承担、下一轮什么时候补。"},{"u":"audio/geely/g_m4_6_2.m4a?v=202611101139","d":87.05,"t":"这些取舍要能落在纸上，就得靠那张一页 A4 的画像卡，六格，别多。第一格，数据来源：这张卡依据哪几份材料、哪次访谈、哪天的跟班笔记，写清出处，方便被质询。第二格，关键行为：他实际做了什么，尤其系统外的动作——切去 Excel、记在微信、月底粘回来。第三格，场景：什么条件下、为完成什么、卡在哪一步，月结那三天和平时要分开。第四格，痛点与代价：多花了多久、退回重填几张单、谁去解释。第五格，核心／边缘判定与理由：三条判据各打几分，为什么这么判，低频的别漏。第六格，这次的决定：为谁优化、不为谁优化、谁承担代价、灰度先放谁。六格填满正好一页，填不下的说明还没想清楚，别加页，回去删。这张卡和前几节的产出是一套的：数据来源接第二节的盘点清单，关键行为和场景接第三节的四层后果，判定接第四节的打分，最后一格正是这一节的取舍。一页纸不是省事，是逼你把判断收窄到能被人追问的程度。"},{"u":"audio/geely/g_m4_6_3.m4a?v=202611101139","d":85.54,"t":"卡怎么用，说个会上真能发生的顺序。提案一摆，先翻第五格：这次改的是核心还是边缘角色的动作；再翻第六格：为谁优化、不为谁优化，先把不做的那半句念出来，别藏。然后翻第二、三格，把「他会快多少」落到具体动作和场景，别用「体验提升」。最后翻第四格，主动把代价报出来——哪一层要多做一步、哪个指标可能波动、谁去解释。主动报代价比被人问出来强太多，评审最怕的不是有代价，是代价没主。常见错法有三个。一是把六格做成六页，附一堆截图和访谈原文，会上一页都翻不完。二是只填前四格，第五第六空着，卡就退回了资料，没判定没取舍，等于没进评审。三是填完锁进柜子，上线不复盘——第六格写的「不为谁优化」到底对不对，得等灰度数据回来核一次，核完把改动记回卡上，这张卡才算活的。还记得第五节最后那句吗，让不知情的同事照着能改一个具体决定；六格里真正干这活的，是最后两格。"},{"u":"audio/geely/g_m4_6_4.m4a?v=202611101139","d":82.94,"t":"把两个案例在卡上收个口，你会更清楚六格怎么填。费控那套系统，第五格里一线报销人判核心，因为单均 41 分钟、天天在用、动作被字段直接卡住；内审低频但不可替代性满分，也判核心；当初那个「四层各让一步、字段加满人人留痕」的方案，写在第六格就是一句「这次不为谁都不优化」，看着周全，结果谁都没优化成，一线绕回 Excel 台账，审核也没少退。改对的那一版，第六格写得很硬：「这次为报销人优化，审核依据由后台带出、留痕走不可改日志，代价由共享中心的系统配置承担。」采购域那张卡更典型：需求提出人高频低价值判边缘，供应商、采购合规低频高不可替代判核心，第六格直接写明「灰度必须点名供应商与合规，不按登录活跃度圈」。两件事合起来就是这一模块反复讲的那句——画像的用处，是决定这次不为谁优化。它不讨好所有人，它给冲突一个能写进纪要的落点，写下来，才有人负责。"},{"u":"audio/geely/g_m4_6_5.m4a?v=202611101139","d":83.4,"t":"进评审这一层，最后挡三个错法。第一，把画像当一次性交付物，评审完就归档，下个需求重做一张，四节课的产出全浪费——卡该跟着版本走，每次大需求只改动的几格。第二，用画像评人，「这组数字化程度低」「那个部门不配合」，把岗位处境写成了部门评价，这在内部系统里特别伤人，也特别没用：他绕去 Excel 是因为这一步设计得反人性，不是因为他不配合。第三，只报受益不报受损，会上皆大欢喜，上线后差错率、退回率、倒查留痕一起找上来。这三个错法跟前五节是连着的：卡不迭代，是第五节校验那步省了；写成评价，是第二节维度选成了态度；不报受损，是第三节四层后果没写全。所以这一节看着是讲开会，其实是把整个模块串起来验一遍——三类画像选对阶段没有，五步有没有落到可验证的事实，四层加影响者齐不齐，核心边缘看的是不是不可替代性。哪一格虚，会上就会在哪一格被问住。"},{"u":"audio/geely/g_m4_6_6.m4a?v=202611101139","d":85.22,"t":"这一模块到这里收口，三句话带走。第一，B 端先做角色画像，组织结构稳定、角色边界清楚，别先做那张贴墙的原型画像。第二，低频不等于边缘，判定看不可替代性，内审、报送、采购合规都是一年几次、一次不来就办不成的人。第三，画像的用处，是决定这次不为谁优化——它不消灭冲突，是给冲突一个能写进纪要的落点。四个模块学到这里，你手上从五问卡、深访提纲、观察记录，到一页 A4 的画像卡，是连成一条线的：先还原场景，再把人切开，最后敢在会上写死取舍。别把这张卡当成作业交掉。下一次真实的需求评审，把它打印出来带进去，吵到「这个字段加不加」的时候，翻到第五第六格，把不为谁优化那半句念出来，再主动报一遍代价。念一次你就知道它是不是真能定事。后面还有模块会上线，等那些内容开了，我们再接着往定量、往验证走；眼下这一张卡，先拿去用，用出一次被追问、被修正，比多听三节课值钱。"},{"u":"audio/geely/g_m4_6_7.m4a?v=202611101139","d":203.62,"t":"讲完六格卡，加一段：怎么让 WorkBuddy 帮你把散材料收进这一页。还是那句话，AI 不替你判断，只替你搬运整理。你手上有：这一模块攒下的角色画像、四层后果那几行、三条判据的打分表、跟班笔记、评审纪要里吵得最凶的那几个字段。六格的原料全在，只是散在五六个文件里，以前你要手工粘半天还容易漏格。喂进去之前，把姓名工号删干净，只留岗位、动作、场景、代价和出处。我常用的说法是：请把这些材料整理成一页 A4 的六格画像卡，六格是数据来源、关键行为、场景、痛点与代价、核心边缘判定与理由、这次的决定。每一格只写能在我给的材料里找到原句的事实，找不到就写「缺口」，不要替我补、不要替我下结论。第六格「这次的决定」留空，标注「需人工填写」，不要自动生成。重点在最后两句：留空、不自动填。第六格是整张卡唯一要你拍板的地方——为谁优化、不为谁优化、谁承担代价，AI 一替你写，这张卡就从判据变回了一张好看的海报。三个坑照样要写进提示词。第一，它默认按使用频次排核心用户，把天天登录的摆到第五格前排，一年几次的内审、合规顺手沉底；要写死：核心边缘按不可替代性判，低频不等于边缘，低频不等于可替代。第二，它会编岗位和制度条款，补一个不存在的「某中心审核岗」、引用一条编出来的办法第几条，所有岗位来自我给的清单、制度只留文件名。第三，它会把「大多数用户希望」这类话当成事实直接抄进痛点格，而那正是第五节讲的不可验证；要加一句：凡「大多数」「普遍」「希望」没有出处可指的，一律标「待验证」，不许写成结论。卡出来之后，让它再干一件搬运的活：把六格里每一条，回链到原材料的第几段、哪份笔记，做成一张出处对照，评审被质询时你一翻就到。一小时的手工粘贴压到二十分钟。省下的时间别用来把卡排得更漂亮，用来做两件它替不了的事：把第六格亲手填了，再拿去跟那个低频却能否决你的角色当面核一遍。工具的位置放对：它把材料收进格子、把出处对齐，你把「不为谁优化」那半句写上去，并为此负责。"},{"u":"audio/geely/g_m4_6_8.m4a?v=202611101139","d":72.96,"t":"这一模块到这里收口，三句话。第一，B 端先做角色画像，组织结构稳定、角色边界清楚，别先做那张贴墙的原型画像。第二，低频不等于边缘，判定看不可替代性，内审、报送、采购合规都是一年几次、一次不来就办不成的人。第三，画像的用处，是决定这次不为谁优化，它不消灭冲突，是给冲突一个能写进纪要的落点。四个模块学到这里收口，你手上的五问卡、深访提纲、观察记录到一页 A4 画像卡，连成了一条线。别把卡当作业交掉，下一次真实需求评审打印出来带进去，吵到字段加不加时，翻到第五第六格，把不为谁优化那半句念出来。后续模块上线后再接着往定量、往验证走，眼下先把这张卡用出一次被追问、被修正。"}]};

/* ============================================================
   PPT 画面层：固定 1600×900 画布，按容器宽度等比缩放

var STAGE = { uid: '', i: -1, hlEls: [], hlAt: [], caps: [], capAt: [], capTxt: '' };

function stageFit() {
  var st = document.getElementById('p-stage'), cv = document.getElementById('p-canvas');
  if (!st || !cv) return;
  var k = (st.clientWidth || 800) / 1600;
  cv.style.transform = 'scale(' + k + ')';
  STAGE.k = k;
}

/* ---------- 内容块 ---------- */
function blkHTML(b) {
  var k = b.k ? ' data-k="' + esc(b.k) + '"' : '';
  if (b.t === 'lead') {
    return '<div class="bl bl-lead"' + k + '>' + b.s + '</div>';
  }
  if (b.t === 'stats') {
    return '<div class="bl bl-stats">' + b.items.map(function (x) {
      return '<div class="bs-item"' + (x.k ? ' data-k="' + esc(x.k) + '"' : '') + '>'
        + '<b>' + x.v + '</b><span>' + x.l + '</span></div>';
    }).join('') + '</div>';
  }
  if (b.t === 'chain') {
    return '<div class="bl bl-chain"><span class="bc-lab">' + b.label + '</span>'
      + b.items.map(function (x, i) {
        return (i ? '<i class="bc-ar">→</i>' : '')
          + '<span class="bc-node"' + (x.k ? ' data-k="' + esc(x.k) + '"' : '') + '>' + x.s + '</span>';
      }).join('')
      + '<span class="bc-tail">' + (b.tail || '') + '</span></div>';
  }
  if (b.t === 'cols') {
    var gs = b.n ? ' style="grid-template-columns:repeat(' + b.n + ',1fr)"' : '';
    return '<div class="bl bl-cols' + (b.cls ? ' ' + b.cls : '') + '"' + gs + '>' + b.items.map(function (x) {
      return '<div class="bc-card"' + (x.k ? ' data-k="' + esc(x.k) + '"' : '') + '>'
        + '<div class="bc-n">' + x.n + '</div>'
        + '<h4>' + x.s + '</h4><p>' + x.d + '</p>'
        + (x.foot ? '<em>' + x.foot + '</em>' : '') + '</div>';
    }).join('') + '</div>';
  }
  if (b.t === 'band') {
    return '<div class="bl bl-band"' + k + '>' + b.s + '</div>';
  }
  if (b.t === 'steps') {
    return '<div class="bl bl-steps">' + b.items.map(function (x, i) {
      return (i ? '<div class="bst-line"></div>' : '')
        + '<div class="bst"' + (x.k ? ' data-k="' + esc(x.k) + '"' : '') + '>'
        + '<i>' + x.n + '</i><h4>' + x.s + '</h4><p>' + x.d + '</p></div>';
    }).join('') + '</div>';
  }
  if (b.t === 'pairs') {
    return '<div class="bl bl-pairs">' + (b.title ? '<h5>' + b.title + '</h5>' : '')
      + b.items.map(function (x) {
        return '<div class="bp"' + (x.k ? ' data-k="' + esc(x.k) + '"' : '') + '>'
          + '<span class="bp-a">' + x.a + '</span><span class="bp-b">' + x.b + '</span></div>';
      }).join('') + '</div>';
  }
  if (b.t === 'todo') {
    return '<div class="bl bl-todo"' + k + '><i>任务</i><span>' + b.s + '</span></div>';
  }
  return '';
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function plainOf(t) {
  return String(t || '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}

function coverOf(uid) {
  var c = (window.COVERS && window.COVERS[uid]) || null;
  if (c) return c;
  /* 兜底：拿第 1 页的页眉与大标题凑一张封面 */
  var arr = (window.SLIDES && window.SLIDES[uid]) || [];
  var s = arr[0] || {};
  var kick = String(s.kicker || '');
  var mm = /^(M\d+)\s*(.*?)\s*·/.exec(kick);
  return {
    mod: mm ? mm[1] : '', modName: mm ? mm[2] : kick.replace(/·.*$/, '').trim(),
    no: 1, total: 1,
    title: String(s.h || '本节内容'), sub: '', pts: []
  };
}

  /* 按课程顺序找下一节，不用对象键顺序：
     M0 导学是后追加进 COVERS 的键，按相邻位取会把 M2 最后一节的预告指回导学。 */
  var mm = /^g_m(\d+)_(\d+)$/.exec(uid);
  if (!mm) {
    var ks = Object.keys(C), i = ks.indexOf(uid);
    return (i >= 0 && i < ks.length - 1) ? C[ks[i + 1]] : null;
  }
  var no = +mm[1], n = +mm[2];
  if (no === 0) return C['g_m1_1'] || null;
  var same = C['g_m' + no + '_' + (n + 1)];
  if (same) return same;
  var ms = ((window.__COURSE__ || {}).modules || []);
  for (var j = 0; j < ms.length; j++) {
    if (+ms[j].no === no) {
      var nx = ms[j + 1];
      return nx ? (C['g_' + nx.key + '_1'] || null) : null;
    }
  }
  return null;
}

  if (mx <= 15) return 74;

  return 58;

/* ---------- 字幕切分：按标点切 ≤22 字短语，只显示一行 ---------- */
function capChunks(txt) {
  var parts = [], last = 0, m, re = /[。！？；，、：\n]/g;
  while ((m = re.exec(txt))) { parts.push([last, m.index + 1]); last = m.index + 1; }
  if (last < txt.length) parts.push([last, txt.length]);
  var out = [], buf = '', from = -1, to = 0;
  parts.forEach(function (p) {
    var t = txt.slice(p[0], p[1]).replace(/\s+/g, '').trim();
    if (!t) return;
    if (buf && (buf.length + t.length) > 22) { out.push({ s: buf, to: to }); buf = t; from = p[0]; to = p[1]; }
    else { if (!buf) from = p[0]; buf += t; to = p[1]; }
  });
  if (buf) out.push({ s: buf, to: to });
  return out;
}

/* ---------- 高亮：把 data-k 对到旁白里的位置，转成 0–1 进度 ---------- */
function stageArm(i) {
  STAGE.hlEls = []; STAGE.hlAt = [];
  var arr = (window.SLIDES && window.SLIDES[STAGE.uid]) || [];
  var sl = arr[i] || null;
  var seg = (window.NARR && window.NARR[STAGE.uid] || [])[i] || {};
  var n = String(seg.t || '');
  STAGE.capTxt = n;
  STAGE.caps = capChunks(n);
  /* 字幕时间轴：按字数占比分配（语速近似均匀） */
  var totCh = STAGE.caps.reduce(function (a, c) { return a + c.s.length; }, 0) || 1;
  var acc = 0;
  STAGE.capAt = STAGE.caps.map(function (c) { var v = acc / totCh; acc += c.s.length; return v; });

  var cv = document.getElementById('p-canvas');
  if (!cv || !n) return;
  var nodes = [].slice.call(cv.querySelectorAll('[data-k]'));
  if (!nodes.length) return;
  var cjk = function (t) { return String(t).replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, ''); };

  /* 每个 key 在旁白里的字符位置；找不到就取「最长公共片段」的起点，再不行均分 */
  var pos = nodes.map(function (el) {
    var key = cjk(el.getAttribute('data-k'));
    if (!key) return -1;
    var at = cjk(n).indexOf(key);
    if (at >= 0) return at;
    /* 退化：取 key 前 4 字在原文里找；再不行用二分词频匹配 */
    for (var L = Math.min(key.length, 6); L >= 3; L--) {
      var sub = key.slice(0, L);
      at = cjk(n).indexOf(sub);
      if (at >= 0) return at + (key.length - L) * 0.0;
    }
    return -1;
  });
  var known = [];
  pos.forEach(function (p, x) { if (p >= 0) known.push(x); });
  var endAt = Math.max(1, n.length);
  STAGE.hlAt = nodes.map(function (el, x) {
    var p = pos[x];
    if (p < 0) {
      var prev = known.filter(function (y) { return y < x; }).pop();
      var next = null;
      for (var y = 0; y < known.length; y++) { if (known[y] > x) { next = known[y]; break; } }
      if (prev !== undefined && next !== null) p = pos[prev] + (pos[next] - pos[prev]) * (x - prev) / (next - prev);
      else if (prev !== undefined) p = pos[prev] + (endAt - pos[prev]) * (x - prev) / Math.max(1, nodes.length - prev);
      else if (next !== null) p = Math.max(0, pos[next] - (next - x) * Math.max(8, pos[next] / Math.max(1, next)));
      else p = endAt * x / Math.max(1, nodes.length + 1);
    }
    return p / endAt;
  });
  for (var z = 1; z < STAGE.hlAt.length; z++) {
    if (STAGE.hlAt[z] < STAGE.hlAt[z - 1]) STAGE.hlAt[z] = STAGE.hlAt[z - 1];
  }
  STAGE.hlEls = nodes;
  nodes.forEach(function (el) { el.classList.add('kk'); });
}

/* ---------- 每帧：字幕 + 高亮 ---------- */
function stageSync(frac) {
  var st = document.getElementById('p-stage');
  if (st && frac > 0.004 && !st.classList.contains('hl')) st.classList.add('hl');
  var sub = document.getElementById('pl-sub');
  if (sub && STAGE.caps.length) {
    var idx = 0;
    for (var i = 0; i < STAGE.capAt.length; i++) { if (frac >= STAGE.capAt[i] - 1e-6) idx = i; }
    var txt = STAGE.caps[idx] ? STAGE.caps[idx].s : '';
    if (sub.textContent !== txt) sub.textContent = txt;
  }
  if (!STAGE.hlEls.length) return;
  var on = -1;
  for (var j = 0; j < STAGE.hlAt.length; j++) { if (frac >= STAGE.hlAt[j]) on = j; }
  if (on === STAGE._lastHl) return;
  STAGE._lastHl = on;
  STAGE.hlEls.forEach(function (el, x) { el.classList.toggle('on', x <= on); });
}

  { q: "拿到「考勤补卡流程太麻烦」这个需求，按本课顺序正确的第一步是？",
    o: ["先把「谁在用、在什么条件下用」还原成具体岗位和场景",
        "先评估开发工作量和排期，看能不能赶上这个季度",

  { q: "「顺序反了，功能就会裁剪场景」最准确的意思是？",
    o: ["先定的功能越多，后面要补的场景描述就写得越细",

  { q: "一个需求上线 3 个月，某字段使用率不到 20%，最该先补的动作是？",

'g_m1_2': [
