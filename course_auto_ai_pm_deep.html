<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 配音走 CDN：提前建连，省掉首段 100–300ms 的 DNS/TLS 时间 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<title>智能汽车 × AI 产品经理 AI 实战 · 深版课程（M0/M3 · 16 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex:none}
  header h1{font-size:17px;font-weight:700;white-space:nowrap}
  header h1 span{display:none}   /* 课程副标题（样板间/单元数/行业机构产品）默认不显示：学员只需要课程名 */
  /* 顶栏只留三样：课程名、一条进度条、一个设置入口 */
  .hp{flex:1;height:5px;background:#e8eefb;border-radius:99px;overflow:hidden;max-width:560px;min-width:70px}
  .hp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1a5cff,#4f8bff);border-radius:99px;transition:width .35s}
  .gear{margin-left:auto;width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;font-size:15px;line-height:1}
  .gear:hover{border-color:var(--blue);color:var(--blue)}
  .cfg-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .cfg-row label{color:var(--mut);width:40px;flex:none}
  .cfg-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .cfg-sep{border:none;border-top:1px solid var(--line);margin:13px 0}
  .cfg-label{display:flex;align-items:center;gap:8px;text-align:left;font-size:12px;font-weight:700;color:var(--blue-d);margin:14px 0 5px;letter-spacing:.02em}
  .cfg-hint{text-align:left;font-size:11.8px;color:var(--mut);line-height:1.65;margin:3px 0 2px}
  .cfg-row label{width:auto;min-width:66px}
  .cfg-note{font-size:11.5px;color:#8a6d1f;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 9px;line-height:1.6;margin:6px 0}
  .ident-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#eef4ff;border:1px solid #c7d9ff;color:var(--blue-d);border-radius:999px;padding:3px 10px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;flex:1;min-height:0}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  /* 模块头改为两层：标题独占一行（两行截断），进度/短板/测验标签下移一行，
     避免标签把标题挤成「M1 写出第一句好…」这种半句话。 */
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;background:#fbfcff}
  .mod-h .mh-top{display:flex;gap:7px;align-items:flex-start}
  .mod-h .mh-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
  .mod-h .mid{flex-shrink:0}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  /* 模块标题：原来代码里写死 slice(0,12) 会把标题砍成半句（如「M1 写出第一句好用的提」），
     改为最多两行、超出加省略号，标题完整可读且不撑破左栏。 */
  .mod-h .mtitle{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;word-break:break-word}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  /* 单元标题原来写死 slice(0,11)，长标题被切成半句；改为单行省略，完整语义优先 */
  .unit .ut{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vwrap{position:relative}
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  /* 底部留出字幕条的高度：字幕是「占位」而不是「盖住」PPT 最后一行 */
  .vp .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px 60px;pointer-events:none}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#eaf0ff}
  .slide.on{display:flex}
  .slide h4{font-size:16px;margin:0 0 6px;color:#fff;flex:none}
  .slide svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  /* 高亮跟讲解走：未讲到的条目压暗，讲到的那一项亮起（.k-on 由播放器逐项切换） */
  .slide.spot [data-k]{opacity:.25;transition:opacity .25s ease}
  .slide.spot [data-k].k-on{opacity:1;filter:drop-shadow(0 0 7px rgba(150,190,255,.9)) brightness(1.06)}
  /* 字幕：永远只有一行，超出省略；不吃掉画面（stage 已为它留了 60px） */
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 70%,rgba(0,0,0,0) 100%);color:#fff;font-size:17px;font-weight:600;line-height:1.35;padding:12px 20px 10px;min-height:0;display:block;text-align:center;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes capin{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
  .cap.swap{animation:capin .16s ease-out}
  @media (max-width:620px){
    .vp .stage{padding:8px 8px 46px}
    .cap{font-size:13.5px;padding:8px 10px 6px;letter-spacing:0}
    .vbar{gap:7px}.play{padding:7px 12px;font-size:12.5px}.time{font-size:11.5px}
    /* 答案行在窄屏上改成自然折行：flex 会把「→ 标准答案」整体挤到下一行，读起来断得莫名其妙 */
    .anshd{display:block}
    .anshit{margin-left:0;display:block;margin-top:3px}
    .opb{margin-right:5px}
  }
  .dots{position:absolute;top:9px;left:12px;display:flex;gap:5px;justify-content:flex-start}
  /* 缓冲反馈：点播放后立刻给「在加载」的确定感，别让人以为按钮坏了。
     配音约 200–350KB，慢网下要 2–18 秒才能出第一声。 */
  .pbuf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:9px;
        background:rgba(8,16,40,.82);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;
        backdrop-filter:blur(6px);z-index:5;pointer-events:none;white-space:nowrap}
  .pbuf.on{display:flex}
  .pbuf i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.28);border-top-color:#fff;
          animation:pbspin .8s linear infinite;flex:none}
  @keyframes pbspin{to{transform:rotate(360deg)}}
  @media (max-width:620px){.pbuf{font-size:12px;padding:8px 13px;gap:7px}}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
  .dots i.on{background:#fff}
  .vbar{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
  .play{background:var(--blue);color:#fff;border:none;padding:8px 17px;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600;white-space:nowrap}
  .seek{flex:1;min-width:160px;height:8px;border-radius:6px;background:#e4eaf7;position:relative;cursor:pointer;touch-action:none}
  .seek .fill{height:100%;background:var(--blue);border-radius:6px;width:0;pointer-events:none}
  .seek .knob{position:absolute;top:-4px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-left:-7px;left:0;pointer-events:none}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .pbtn{background:#fff;color:var(--blue-d);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.1}
  .pbtn:hover{border-color:var(--blue);color:var(--blue)}
  /* 全屏：把「画面 + 控制条」一起放进去，否则全屏后没法暂停/拖进度 */
  #p-wrap:fullscreen,#p-wrap:-webkit-full-screen{background:#070d1c;display:flex;flex-direction:column;justify-content:center;padding:10px 3vw 14px;border-radius:0;box-sizing:border-box}
  #p-wrap:fullscreen .vp,#p-wrap:-webkit-full-screen .vp{width:100%;height:calc(100% - 58px);aspect-ratio:auto;border-radius:0}
  #p-wrap:fullscreen .cap,#p-wrap:-webkit-full-screen .cap{font-size:23px;padding:16px 28px 12px}
  #p-wrap:fullscreen .vbar,#p-wrap:-webkit-full-screen .vbar{padding:0 2px}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .aud-note{font-size:12px;color:var(--mut);margin-top:5px}
  textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;background:#fcfdff}
  input.tin{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fcfdff}
  .btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:13.2px;margin:6px 6px 0 0}
  .btn.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
  .btn.ok{background:var(--green)}
  .btn[disabled]{background:#c9d3e6;cursor:not-allowed;border-color:#c9d3e6;color:#fff}
  .wb{background:#0e1530;color:#dce6ff;border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;line-height:1.7}
  .wb .me{color:#ffd98a}.wb .ai{color:#9be8b0}.wb .hl-line{color:#fff;font-weight:600}
  .chat{display:flex;flex-direction:column;gap:9px;margin:6px 0}
  .bub{max-width:82%;padding:9px 12px;border-radius:11px;font-size:13.3px;white-space:pre-wrap}
  .bub.ai{background:#eef4ff;color:var(--blue-d);align-self:flex-start}
  .bub.me{background:var(--blue);color:#fff;align-self:flex-end}
  .bub.sys{background:#f1f4fa;color:var(--mut);align-self:center;font-size:12px;max-width:100%}
  .qs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .qbtn{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.4px;cursor:pointer}
  .qbtn:hover{border-color:var(--blue);color:var(--blue)}
  .done-card{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:18px;text-align:center}
  .done-card h3{font-size:19px;color:#166534;margin-bottom:4px}
  .cp-score{font-size:30px;font-weight:800;color:#16a34a;margin:6px 0}
  .tag-done{display:inline-block;background:var(--green);color:#fff;font-size:12px;padding:1px 9px;border-radius:20px;margin-left:6px}
  /* 题干 / 模板 / 评分 */
  .ip{border-left:4px solid var(--blue)}
  .ip-task{font-size:14.5px;font-weight:700;margin:2px 0 8px;color:var(--txt)}
  .brief{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.1px;white-space:pre-wrap;line-height:1.78;color:#28345a}
  .tpl{background:#0e1530;color:#d7e3ff;border-radius:11px;padding:13px 15px;font-size:12.6px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  details>summary{cursor:pointer;font-size:13.3px;color:var(--blue-d);font-weight:600;margin:10px 0 6px;list-style:none;display:flex;align-items:center;gap:6px}
  details>summary::-webkit-details-marker{display:none}
  details>summary:before{content:"\25B8";transition:transform .15s;display:inline-block}
  details[open]>summary:before{transform:rotate(90deg)}
  .rub{list-style:none;font-size:13px;color:var(--mut);margin:4px 0}
  .rub li{padding:2px 0 2px 20px;position:relative}
  .rub li:before{content:"\25CB";position:absolute;left:2px;color:#c3ccdf}
  /* ===== 演示环节 · 情景题（素材 + 填写框架） ===== */
  .shsitu{background:#f1f5fd;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 13px;font-size:13.3px;line-height:1.8;color:#28345a;white-space:pre-wrap}
  .shask{font-size:12.9px;color:var(--mut);line-height:1.85;margin:8px 0 4px;white-space:pre-wrap}
  .shbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--mut);margin:12px 0 8px;flex-wrap:wrap}
  .shcard{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fff}
  .shhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.2px;color:var(--mut);margin-bottom:7px}
  .shhead b{color:var(--blue);font-size:12.6px;font-family:ui-monospace,Menlo,monospace}
  .shmat{font-size:13.2px;line-height:1.8;white-space:pre-wrap;background:#f7f9fd;border-radius:7px;padding:9px 11px;margin-bottom:9px;color:#1f2a44}
  .shc{margin-top:7px}
  .shrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .shrow>.shc{flex:1 1 200px;min-width:0}
  .shc>label{display:block;font-size:12.2px;color:var(--mut);margin-bottom:5px}
  .shtags{display:flex;flex-wrap:wrap;gap:5px}
  .shtag{font-size:12.3px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:#fff;user-select:none;color:#3b4763;transition:.12s}
  .shtag:hover{border-color:#b9caf0}
  .shtag.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .shin{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;color:var(--txt)}
  .shin:focus{outline:none;border-color:var(--blue)}
  .shstep{margin-top:18px;padding-top:15px;border-top:1px dashed var(--line)}
  .shstep>b{display:block;font-size:13.4px;margin-bottom:8px;color:var(--txt)}
  .shstep.lock{opacity:.45;pointer-events:none}
  .shref{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px;padding:11px 13px;margin-top:14px}
  .shref>.hd{font-size:13px;font-weight:700;color:#166534;margin-bottom:6px}
  /* 陪练材料卡：把上一节产出带进这一关 */
  .matbox{border:1px solid #dbe4f5;background:#f6f9ff;border-radius:10px;padding:10px 12px;margin:12px 0}
  .matbox .mhd{font-size:13px;font-weight:700;color:#1d4ed8}
  .matbox .mname{font-size:12.8px;color:var(--txt);margin-top:4px;font-weight:600}
  .matbox .mhint{font-size:12.4px;color:var(--mut);margin-top:4px;line-height:1.6}
  .matbox .mact{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12.5px}
  .matbox details{margin-top:7px}
  .matbox textarea{min-height:96px;margin-top:6px}
  /* 标准答案：逐格对答 + 模型输出该改哪几处 */
  .ansrow{border:1px solid #e6e9f0;border-radius:9px;padding:8px 10px;margin-bottom:7px;background:#fff}
  .ansrow.bad{border-color:#fecdd3;background:#fff7f8}
  .ansrow.good{border-color:#d7ead9;background:#f8fdf9}
  .anshd{font-size:12.6px;line-height:1.75;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
  .ansid{font-weight:700;color:#1f2b45}
  .ansg{color:#8f9ab0}
  .answ{color:#166534;font-weight:700}
  .ansy{color:#be123c;font-weight:700}
  .answhy{font-size:12px;color:#5a6580;margin-top:4px;line-height:1.6}
  .anshit{margin-left:auto;font-size:11.5px;color:#8f9ab0;white-space:nowrap}
  .anscov{font-size:12.5px;color:#3d6b4a;margin:0 0 8px}

const COURSE = {"id": "auto_ai_pm", "role": "pm", "customization": {"industry": "智能汽车", "company": "Z 汽车", "product": "Z7"}, "modules": [{"id": "M0", "title": "M0 导论：AI 产品经理在车企的位置", "dims": ["security", "workflow"], "units": [{"id": "M0U1", "tier": "basic", "step": "understand", "title": "AI 产品经理的三重身份：场景翻译官、需求守门人、签字人", "video": {"dur": "3.5min", "script": ["AI 需求最大的浪费不是做错，是没人说清「做到什么程度算完」，于是每个人都按自己的理解做", "三段身份对照表 + 铁三角职责边界图（每段标注「你签什么、谁不签」）", "Z 汽车 座舱域一次「语音加功能」需求，因无人写验收口径，上线三天收到投诉"]}, "ppt": {"method": "三段身份对照表 + 铁三角职责边界图（每段标注「你签什么、谁不签」）", "case": "Z 汽车 座舱域一次「语音加功能」需求，因无人写验收口径，上线三天收到投诉", "demo": "把一张「加个功能」的需求单，拆成三份可签字的材料"}, "objective": "能说清自己在铁三角里对哪三件事签字，并为每件事各举一个本域真实例子", "transfer": "48 小时内，把手上一件在做的需求按「场景定义 / 需求验收 / 上线签字」三张单重标一遍，发给研发负责人确认", "vslides": [{"t": "先定身份：你是替三样东西签字的人", "n": "在车企，AI 产品经理不是提需求的人，是替三样东西签字的人。哪三样？场景对不对、需求能不能验、上线敢不敢发。为什么是这三样？因为车企的钱不花在想法上，花在验证和量产上。一个想法要上车，得穿过需求评审、模型训练、仿真、实车、OTA 灰度，每一关都有人向你要证据。你只会说「这个体验很好」，第一关就过不去。铁三角里的分工其实很清楚：算法负责模型能不能学到，软件负责能不能跑起来，你负责做的东西对不对、够不够、敢不敢放出去。道理简单，出问题的地方在于三件事都被默认成了别人的事——场景等业务给，验收等测试定，上线等领导拍。那你在这个位置上就只剩传话，而这个岗位之所以存在，恰恰是因为传话没人负责。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">你签的三样</tspan></text><g data-k=\"场景定义\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">场景定义</tspan></text></g><g data-k=\"需求验收\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">需求验收</tspan></text></g><g data-k=\"上线签字\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">上线签字</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 73.46}, {"t": "三张单子，写法完全不同", "n": "第一张，场景定义单：谁在什么条件下用、多久一次、失败一次的代价是什么。可用的写法是这样：语音指令「我想透透气」，场景写主驾单人、车速低于 60、车窗未锁止、雨天不触发；频次写实测日均 0.8 次/人；代价写误开窗导致淋雨投诉。第二张，验收单：输入是什么、输出是什么、口径多少、什么情况必须拒答。口径一定要给数——唤醒率、识别准确率、误触发率、响应时延，各一个门槛值，并注明是离线测还是实车测。第三张，上线签字单：门槛数值、降级链、回滚触发。降级链要落到动作：云端不通走端侧，端侧失败回落本地规则，都失败就明确提示并保留物理按键。三张单子都不长，但缺一张，后面每个环节都会替你做决定。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三张单子</tspan></text><g data-k=\"场景定义单：条件·频次·代价\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">场景定义单：条件·频次·代价</tspan></text></g><g data-k=\"验收单：口径·门槛·拒答边界\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">验收单：口径·门槛·拒答边界</tspan></text></g><g data-k=\"签字单：降级链·回滚线\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">签字单：降级链·回滚线</tspan></text></g></svg>", "d": 71.86}, {"t": "三个错法，和一条不能越的边界", "n": "第一个错法，把自己做成项目经理：天天对齐排期，验收口径一个字没写，测试按自己的理解测，上线全是「跟我想的不一样」。第二个，把签字当形式：签字前没翻过 badcase，出了投诉，纪要上第一个名字是你。第三个，越权下结论：说「这个功能不影响行车安全」——这句话该由功能安全工程师按 ISO 26262 的流程判，你说出口就是把责任揽到自己身上。记住一条边界：你可以判断体验够不够，不能判断安全行不行；你可以提这个数据我想用，不能判断这个数据能不能出域。越线的代价不是被批评，是事故复盘时那份签字单成为责任链的起点。后面七节，就是把这三张单子逐张拆开练。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"不替安全定级\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替安全定级</tspan></text></g><g data-k=\"不替合规判出域\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替合规判出域</tspan></text></g><g data-k=\"不空手签上线\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不空手签上线</tspan></text></g></svg>", "d": 64.8}], "deliverable": {"type": "skill", "name": "岗位签字清单", "rubric": ["身份边界", "签字依据", "可执行性"], "acceptance": "对任意一条在做的需求，能指出三张单分别由谁签、依据什么签、不签会怎样"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三段身份对照表 + 铁三角职责边界图（每段标注「你签什么、谁不签」）\n【为什么重要】AI 需求最大的浪费不是做错，是没人说清「做到什么程度算完」，于是每个人都按自己的理解做\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["能说清三张单各自的内容边界：场景定义写使用条件，验收单写口径与门槛，签字单写降级与回滚（各举一个本域例子）", "能指出至少一个「本该自己签、实际推给了别人」的具体情况，并说明推出去之后出了什么问题", "能说出两条不属于自己判断范围的事（安全定级、数据出域），并说明该找谁", "作业写成能直接贴进需求模板的条目，不写「提升了认识」这类感想"]}, {"id": "M0U2", "tier": "basic", "step": "demo", "title": "用 AI 把一张战略图拆成本域季度需求清单", "video": {"dur": "3.5min", "script": ["战略图人人会念，能把它拆成「本周能立项的三条」才是稀缺能力", "三道筛（挂曲线 → 落业务域 → 看底座）+ 需求池三栏法", "Z 汽车 今年把资源往「卖软件」曲线压，座舱域要接的三条需求"]}, "ppt": {"method": "三道筛（挂曲线 → 落业务域 → 看底座）+ 需求池三栏法", "case": "Z 汽车 今年把资源往「卖软件」曲线压，座舱域要接的三条需求", "demo": "在 WorkBuddy 里跑一遍「战略→需求池」提示词"}, "objective": "能用一张战略图跑出含「做什么 / 不做什么 / 为什么」的需求池，并当场指出 AI 掺水的四处", "transfer": "把本域今年的战略目标贴给 AI，先出一版需求池，用「挂曲线—落环节—看底座」三道筛逐条过一遍再上报", "vslides": [{"t": "战略不能直接变需求，中间要过三道筛", "n": "战略图不能直接变需求，中间要过三道筛。第一道，挂曲线：这条需求是让车更好卖、让数据更值钱、还是让软件能收钱。三条增长曲线不是三个口号，是三种回收投入的方式——卖好车靠溢价，用好数据靠服务，卖软件靠订阅，回收周期和考核方式都不一样。第二道，落环节：研发、制造、营销服务，你的需求具体落在哪个环节的哪个动作上。第三道，看底座：车端数据、算力、算法、安全，四样里缺哪样。三道筛答不齐，做出来就是为 AI 而 AI，上线没人用，复盘还说不清价值。反过来，三样都答得上的需求，立项材料其实已经写了一半。这个筛子最大的作用不是找机会，是帮你把不该做的挡在门外。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三道筛</tspan></text><g data-k=\"挂曲线\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">挂曲线</tspan></text></g><g data-k=\"落环节\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">落环节</tspan></text></g><g data-k=\"看底座\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">看底座</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.93}, {"t": "提示词要喂三样，输出强制三栏", "n": "提示词不能只写一句「帮我拆解战略」，要喂三样东西。第一，三条曲线的定义，以及今年资源往哪压；第二，本域现状——现在有什么数据、多少算力、哪些功能在跑；第三，硬约束——预算、车型节点、不能碰的红线。输出强制三栏：做什么、不做什么、为什么。第三栏最容易偷懒，也最值钱。看一个真实颗粒度的例子：Z 汽车 今年资源往卖软件压，座舱域的候选需求是场景模式包可订阅。做的一栏写：把现有六个场景模式打包成两个订阅包，复用已有执行器，不改硬件。不做的一栏写：不做座椅、香氛这类硬件联动，单车成本八百元，按 3% 订阅率两年收不回。为什么一栏写：座舱激活率 61%，其中四成用过至少一个场景模式，有付费基础。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">跑法</tspan></text><g data-k=\"喂三样：曲线·现状·约束\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">喂三样：曲线·现状·约束</tspan></text></g><g data-k=\"强制三栏：做·不做·为什么\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">强制三栏：做·不做·为什么</tspan></text></g><g data-k=\"每条落三问：曲线·环节·底座\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">每条落三问：曲线·环节·底座</tspan></text></g></svg>", "d": 72.77}, {"t": "AI 拆战略的四个固定毛病", "n": "AI 拆战略有四个固定毛病，看输出时先找它们。第一，把行业通用做法当自家机会——「友商都在做座舱订阅」不算机会，那叫行业水位。第二，编收益数字——「预计提升订阅率 30%」，这个数没有出处，正确写法是待 A/B 验证、暂按行业区间测算。第三，把采不到的数据写成需求——「识别用户情绪并推荐音乐」，情绪标签从哪来、谁标、标多少条，答不上就是空需求，而且生物特征属于敏感个人信息，方向本身就要先过合规。第四，只写做什么不写不做什么——评审时一定被问「那为什么不做 X」，当场答不上，材料就被打回。这四条不用记术语，就记一句话：凡是它说得特别顺、数字特别整的地方，先怀疑，再核。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"行业水位当机会\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">行业水位当机会</tspan></text></g><g data-k=\"无出处的收益数字\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">无出处的收益数字</tspan></text></g><g data-k=\"采不到的数据当需求\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">采不到的数据当需求</tspan></text></g><g data-k=\"只写做不写不做\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只写做不写不做</tspan></text></g></svg>", "d": 69.96}], "deliverable": {"type": "skill", "name": "季度需求池", "rubric": ["曲线对应", "可执行性", "剔除理由"], "acceptance": "产出的需求池每条都能回答「挂哪条曲线、落在哪个环节、缺哪个底座、谁签字」"}, "demo": {"ref": "■ 本季度可立项需求池（Z7 座舱域 · 2027 Q1）\n\n【做什么】\n1. 场景模式包订阅化\n · 挂曲线：卖软件（订阅营收）\n · 落环节：营销服务—用户运营\n · 依赖底座：算法（场景识别）· 安全（行车中禁用清单）\n · 判据：现有 6 个场景模式已具备执行器，改造量在软件层\n\n2. 语音指令本地化兜底\n · 挂曲线：卖好车（体验溢价）\n · 落环节：研发—座舱体验\n · 依赖底座：算力（端侧推理）· 车端数据（离线语料）\n · 判据：地库与隧道场景失败率高，属可测量的体验缺口\n\n3. 维保提醒接入服务包\n · 挂曲线：用好数据（服务收入）\n · 落环节：营销服务—售后\n · 依赖底座：车端数据（里程与故障码）\n · 判据：已有故障码回传链路，只需加运营侧触达\n\n【不做什么】\n1. 座椅、香氛等硬件联动订阅\n · 理由：单车 BOM 增加约 800 元，按 3% 订阅率两年收不回\n2. 情绪识别推荐音乐\n · 理由：情绪标签无采集来源，标注成本无法估，且涉及生物特征合规\n3. 全场景免唤醒\n · 理由：误唤醒率与功耗不可控，现有 SoC 余量不足\n\n【为什么（只写有依据的部分）】\n· 座舱激活率 61%（内部埋点，近 30 天），其中 40% 用过至少一个场景模式 → 有付费基础\n· 地库/隧道语音失败占比 23%（内部埋点）→ 兜底需求有明确缺口\n· 订阅转化率尚未验证，暂按行业区间 3%–8% 测算，需 A/B 验证后替换", "fix": ["删掉 AI 自己补的「预计订阅转化率 12%，年增收 2400 万」——它没有任何出处，写进立项书就是给自己挖坑；正确做法是标注「待 A/B 验证，暂按行业区间 3%–8%」。", "把「情绪识别」从需求池移到剔除项：它涉及生物特征，属于个人信息保护法里的敏感个人信息，不是产品能自己拍板的方向。", "给每条需求补上签字人：场景包订阅归营销，语音兜底归研发，维保触达归售后——否则三栏写得再漂亮，也没人接。", "把「全场景免唤醒」的理由补成可验证的：不是「体验不好」，而是 SoC 余量、误唤醒率、暗电流三个指标给不出余量，需要先测。"], "judge": "判断依据：有没有凭空出现转化率或营收数字；剔除项是否给了成本或合规理由；每条需求是否指得出曲线、环节、底座三样；有没有把「做不了」写成「以后再做」"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是 Z 汽车 今年的三条增长曲线定义与本域现状（已脱敏，不含任何用户个人信息）：\n[粘贴三曲线定义 + 座舱域现有功能与数据清单 + 预算与车型节点]\n请拆出本域本季度可立项的需求，按「做什么 / 不做什么 / 为什么」三栏输出；每条需求注明挂哪条曲线、落在哪个业务环节、依赖哪个底座（车端数据/算力/算法/安全）；凡是你无法从给定材料确认的信息，标注「需我补证」，不要替我给数字。"}, "task": "在 WorkBuddy 里把「三道筛（挂曲线 → 落业务域 → 看底座）+ 需求池三栏法」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三道筛（挂曲线 → 落业务域 → 看底座）+ 需求池三栏法\n【参考案例】Z 汽车 今年把资源往「卖软件」曲线压，座舱域要接的三条需求\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是 Z 汽车 今年的三条增长曲线定义与本域现状（已脱敏，不含任何用户个人信息）：\n[粘贴三曲线定义 + 座舱域现有功能与数据清单 + 预算与车型节点]\n请拆出本域本季度可立项的需求，按「做什么 / 不做什么 / 为什么」三栏输出；每条需求注明挂哪条曲线、落在哪个业务环节、依赖哪个底座（车端数据/算力/算法/安全）；凡是你无法从给定材料确认的信息，标注「需我补证」，不要替我给数字。", "rubric": ["每条需求都能对上一条具体曲线和一个具体业务环节，不是笼统的「智能化升级」", "「不做什么」至少三条，且每条给出成本、合规或技术余量上的具体理由", "能指出 AI 输出里至少一处编造的数字或无来源的判断", "需求池里出现的每一个数，都标明来源（内部埋点 / 行业区间 / 待测）"]}, {"id": "M0U3", "tier": "basic", "step": "todo", "title": "产出《岗位 AI 机会—红线对照表》", "video": {"dur": "3.4min", "script": ["机会清单谁都会写，写完之后能对上自己上周的时间去向，才算真的看懂了", "六类机会逐条勾选（各配一件本周做过的事）+ 三条红线各配一个越线场景", "Z 汽车 座舱域 PM 组把对照表贴在需求看板上，作为需求准入的第一道自检"]}, "ppt": {"method": "六类机会逐条勾选（各配一件本周做过的事）+ 三条红线各配一个越线场景", "case": "Z 汽车 座舱域 PM 组把对照表贴在需求看板上，作为需求准入的第一道自检", "demo": "按模板逐格填，每格都要能指回一件真实做过的事"}, "objective": "产出一份能直接贴进部门周报的《岗位 AI 机会—红线对照表》，机会与红线各不少于三条且有本域实例", "transfer": "把对照表发给直属上级，请他挑一条本周就能试的，约定两周后回看效果", "vslides": [{"t": "这张表不是作业，是下周的动手清单", "n": "对照表不是为了交作业，是为了回答一个问题：下周从哪下手。所以它必须有两半。左边是机会，从六类里挑你能用上的：洞察、研究、设计、分析、协同、合规；右边是红线，你这个岗位一旦越线就停不下来的那三条。判断标准只有一条：每一条都对得上一件本周真实做过的事。对不上的，宁可写对不上。因为对不上的部分恰恰最有用——它告诉你哪些活 AI 替不了，哪些活你再努力也提不了效，得从流程或人手上去要资源。很多人写这张表，写完就放下了；真正有用的写法是写完当天就挑一条去试，两周后回看。如果一条都挑不出来，说明你手上的活全是判断和担责，那不是你的问题，是该往上要人了。把这句话写进表里，反而比硬凑一条机会更专业。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六类机会</tspan></text><g data-k=\"洞察\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">洞察</tspan></text></g><g data-k=\"研究\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">研究</tspan></text></g><g data-k=\"设计\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">设计</tspan></text></g><g data-k=\"分析\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">分析</tspan></text></g><g data-k=\"协同\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">协同</tspan></text></g><g data-k=\"合规\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">合规</tspan></text></g></svg>", "d": 71.18}, {"t": "先列时间去向，再谈机会", "n": "填法是有顺序的，顺序错了就变成抄概念。第一步，列本周花时间最多的六件事，每件标一个耗时，粗到小时就行。第二步，把这六件事逐条对到六类机会上，对不上的明确写「对不上」——写需求判断、开会定责、对外承诺这三类，基本都对不上。第三步，从对得上的里面挑两件「错了也不致命」的，写成可以试的切入点，每条都要写清 AI 出什么、你改哪三处。第四步，红线写具体的：不是「遵守信息安全规定」，而是「把含 VIN 和手机号的埋点原始表贴进公开模型」这种一听就知道会出事的场景。第五步，写一句两周后的回看口径，含一个能查的数。这一步别省，它是这张表和你上级之间唯一的约定。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五步填法</tspan></text><g data-k=\"列六件事 + 耗时\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">列六件事 + 耗时</tspan></text></g><g data-k=\"逐条对机会（含对不上）\"><g><circle cx=\"42\" cy=\"79.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"83.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"83.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">逐条对机会（含对不上）</tspan></text></g><g data-k=\"挑两件可试的写切入点\"><g><circle cx=\"42\" cy=\"106.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">挑两件可试的写切入点</tspan></text></g><g data-k=\"红线写具体场景\"><g><circle cx=\"42\" cy=\"133.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"138.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"138.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">红线写具体场景</tspan></text></g><g data-k=\"写回看口径\"><g><circle cx=\"42\" cy=\"160.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"165.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"165.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">写回看口径</tspan></text></g></svg>", "d": 66.41}, {"t": "三个错法，写完自己先挑一遍", "n": "第一个错法：机会写得漂亮，但没有一件是自己做过的。这种表在评审会上撑不过一个问题——「你说的洞察，最近一次是什么时候做的」。第二个错法：红线抄制度原文。「遵守公司信息安全规定」这种话，等于没写，因为它不告诉你明天要不要把这张表发给外部供应商。红线必须带字段名或决策动作，比如「含车架号、手机号、常去地址的数据不进外部模型」「行车中哪些功能可用，不由产品判断」。第三个错法：只写机会不写回看。两周后没人记得当初为什么挑这条，于是这条线就烂尾了。三个错法都不涉及能力，全是习惯问题，所以改起来最快。今天先改一条，比想清楚十条有用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"机会要能对上真做过的事\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">机会要能对上真做过的事</tspan></text></g><g data-k=\"红线要带字段名或决策动作\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">红线要带字段名或决策动作</tspan></text></g><g data-k=\"必须有回看口径\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">必须有回看口径</tspan></text></g></svg>", "d": 64.73}], "deliverable": {"type": "skill", "name": "岗位 AI 机会—红线对照表", "rubric": ["真实对应", "红线具体", "可回看"], "acceptance": "六件事、六类机会、三条红线全部有具体对应；每个切入点都写明「AI 出初稿、我改哪三处」"}, "practice": {"steps": ["列出本周实际花时间最多的六件事，标出各自耗时", "把六件事逐条对上六类机会（洞察/研究/设计/分析/协同/合规），对不上的写「对不上」", "挑出其中两件「错了也不致命」的，写成可试的 AI 切入点，写清 AI 出什么、你把关什么", "三条红线各写一个本域越线场景，必须带字段名或决策动作", "写一句两周后的回看口径：用什么指标判断这个切入点值不值得继续"], "exemplar": "《座舱域 PM · AI 机会—红线对照表》（张，座舱域产品经理，2027 Q1）\n\n一、本周时间去向（按耗时排序）\n1. 写「场景模式包」需求文档 —— 9 小时\n2. 整理近 30 天语音失败 case —— 6 小时\n3. 对齐三次评审会纪要 —— 4 小时\n4. 拆解两个竞品的座舱功能清单 —— 3 小时\n5. 回复售后的功能咨询 —— 2 小时\n6. 填季度汇报材料 —— 2 小时\n\n二、机会对照\n· 洞察 → 第 2 项「整理失败 case」：可让 AI 先按「识别失败/理解偏差/网络不可用」三类聚类，\n 我只复核聚类边界和取 10 条回听。预计 6 小时压到 1.5 小时。\n· 分析 → 第 6 项「季度汇报」：让 AI 按固定五段结构出初稿（进展/数据/问题/风险/下季计划），\n 我改数据口径与风险描述两处。\n· 研究 → 第 4 项「竞品功能拆解」：让 AI 按「功能—交互步数—是否需联网」三列出表，我核发布来源。\n· 对不上：第 1 项写需求文档（判断与取舍为主，AI 只能出结构）、第 3 项评审纪要（责任归属要人到场）、\n 第 5 项售后咨询（涉及承诺，不能由 AI 直接答）。\n\n三、可试的两个切入点（错了也不致命）\n1. 失败 case 聚类：AI 出三分类清单与每类 5 条代表样本，我回听并改分类边界。\n 改的三处：①把「网络不可用」里混入的「麦克风被遮挡」单独拆出；②把方言样本单列；\n ③标出无法归类的 8%。\n2. 竞品功能表：AI 出三列清单，我改三处：①核对每个功能的 OTA 版本来源；\n ②把「宣称支持」与「实测可用」分列；③删掉它推测的销量数据。\n\n四、三条红线（本域越线场景）\n1. 数据不裸奔：把含 VIN、车主手机号、常去地址的埋点原始表贴进公开模型 —— 越线。\n 做法：只给「车型 + 城市等级 + 失败类型」三列，VIN 做哈希后本地留存。\n2. 不替人决策：用 AI 判断「这个功能要不要在行车中开放」—— 越线。\n 行车中可用性属功能安全范畴，须走安全评估，不能由产品判断。\n3. 可解释可追溯：拿 AI 生成的竞品对比直接进汇报，不标注来源 —— 越线。\n 做法：每条结论标注来源（官网/发布会/实车），推测项单列。\n\n五、两周后回看口径\n· 失败 case 整理：单次耗时是否降到 2 小时以内；分类边界被研发返工的次数是否 ≤1。\n· 竞品表：被评审指出「来源不明」的条目是否为 0。"}, "task": "产出《岗位 AI 机会—红线对照表》：列出本周实际花时间最多的六件事，标出各自耗时；把六件事逐条对上六类机会（洞察/研究/设计/分析/协同/合规），对不上的写「对不上」；挑出其中两件「错了也不致命」的，写成可试的 AI 切入点，写清 AI 出什么、你把关什么；三条红线各写一个本域越线场景，必须带字段名或决策动作；写一句两周后的回看口径：用什么指标判断这个切入点值不值得继续", "brief": "【你的角色】你是「Z 汽车」负责「Z7」的座舱域 AI 产品经理。本单元属于「M0 导论：AI 产品经理在车企的位置」模块，你要交付的是《岗位 AI 机会—红线对照表》。\n【场景】业务侧这周的诉求是：机会清单谁都会写，写完之后能对上自己上周的时间去向，才算真的看懂了。参考做法：Z 汽车 座舱域 PM 组把对照表贴在需求看板上，作为需求准入的第一道自检。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（六类机会逐条勾选（各配一件本周做过的事）+ 三条红线各配一个越线场景），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《岗位 AI 机会—红线对照表》填写模板】\n\n■ 1. 列出本周实际花时间最多的六件事，标出各自耗时\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 把六件事逐条对上六类机会（洞察/研究/设计/分析/协同/合规），对不上的写「对不上」\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 挑出其中两件「错了也不致命」的，写成可试的 AI 切入点，写清 AI 出什么、你把关什么\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 三条红线各写一个本域越线场景，必须带字段名或决策动作\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写一句两周后的回看口径：用什么指标判断这个切入点值不值得继续\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   《座舱域 PM · AI 机会—红线对照表》（张，座舱域产品经理，2027 Q1）\n\n一、本周时间去向（按耗时排序）\n1. 写「场景模式包」需求文档 —— 9 小时\n2. 整理近 30 天语音失败 case —— 6 小时\n3. 对齐三次评审会纪要 —— 4 小时\n4. 拆解两个竞品的座舱功能清单 —— 3 小时\n5. 回复售后的功能咨询 —— 2 小时\n6. 填季度汇报材料 —— 2 小时\n\n二、机会对照\n· 洞察 → 第 2 项「整理失败 case」：可让 AI 先按「识别失败/理解偏差/网络不可用」三类聚类，\n 我只复核聚类边界和取 10 条回听。预计 6 小时压到 1.5 小时。\n· 分析 → 第 6 项「季度汇报」：让 AI 按固定五段结构出初稿（进展/数据/问题/风险/下季计划），\n 我改数据口径与风险描述两处。\n· 研究 → 第 4 项「竞品功能拆解」：让 AI 按「功能—交互步数—是否需联网」三列出表，我核发布来源。\n· 对不上：第 1 项写需求文档（判断与取舍为主，AI 只能出结构）、第 3 项评审纪要（责任归属要人到场）、\n 第 5 项售后咨询（涉及承诺，不能由 AI 直接答）。\n\n三、可试的两个切入点（错了也不致命）\n1. 失败 case 聚类：AI 出三分类清单与每类 5 条代表样本，我回听并改分类边界。\n 改的三处：①把「网络不可用」里混入的「麦克风被遮挡」单独拆出；②把方言样本单列；\n ③标出无法归类的 8%。\n2. 竞品功能表：AI 出三列清单，我改三处：①核对每个功能的 OTA 版本来源；\n ②把「宣称支持」与「实测可用」分列；③删掉它推测的销量数据。\n\n四、三条红线（本域越线场景）\n1. 数据不裸奔：把含 VIN、车主手机号、常去地址的埋点原始表贴进公开模型 —— 越线。\n 做法：只给「车型 + 城市等级 + 失败类型」三列，VIN 做哈希后本地留存。\n2. 不替人决策：用 AI 判断「这个功能要不要在行车中开放」—— 越线。\n 行车中可用性属功能安全范畴，须走安全评估，不能由产品判断。\n3. 可解释可追溯：拿 AI 生成的竞品对比直接进汇报，不标注来源 —— 越线。\n 做法：每条结论标注来源（官网/发布会/实车），推测项单列。\n\n五、两周后回看口径\n· 失败 case 整理：单次耗时是否降到 2 小时以内；分类边界被研发返工的次数是否 ≤1。\n· 竞品表：被评审指出「来源不明」的条目是否为 0。", "rubric": ["六件事都带耗时估计，且至少两件能对上具体的 AI 机会，不是笼统归类", "每个切入点都写明「AI 出什么、我改哪三处」，改的那三处要具体到动作", "三条红线各配一个越线场景，含字段名（如 VIN、手机号、精确定位）或决策动作（如定价、供应商取舍）", "写出两周后的回看口径，含一个可查的指标或一次可交付的产出"]}, {"id": "M0U4", "tier": "basic", "step": "spar", "title": "车型总监挑战「这些需求凭什么排前面」", "video": {"dur": "3.4min", "script": ["排序讲不清，需求池再漂亮也只是「产品经理的个人偏好清单」", "结论—依据—边界三段式应答；被砍时给替代方案而不是重排", "Z 汽车 车型总监在季度评审会上连问三句：凭什么、谁说的、砍了会怎样"]}, "ppt": {"method": "结论—依据—边界三段式应答；被砍时给替代方案而不是重排", "case": "Z 汽车 车型总监在季度评审会上连问三句：凭什么、谁说的、砍了会怎样", "demo": "现场演练：三轮追问后仍能给出一个可签字的排序"}, "objective": "能在三轮追问内讲清需求排序依据，被要求「砍掉一条」时能当场给出取舍而不是重排全部", "transfer": "下次评审前，先把「为什么排这个顺序」写成三行依据，避免现场被问住", "vslides": [{"t": "评审会问的不是好坏，是凭什么", "n": "评审会上你被问的，几乎不是「这个需求好不好」，而是「凭什么排前面」。这两个问题的答法完全不同。前者可以讨论，后者必须给依据。所以回答的结构要固定成三段：结论先行，一句话说清排第一的是哪条；依据可查，三条，每条都指得出来源；取舍明确，被要求砍的时候，直接说砍哪两条、砍完什么后果。三段里最容易崩的是第三段，因为它要求你承认代价。但凡你能把代价说清楚，对方反而会信你前面的判断，因为这说明你真的比较过，而不是拍脑袋排的序。另外提醒一句：评审会前把三条依据写成三行字，现场照着念，都比临场组织强。三行字写不出来，说明你自己还没想清楚为什么这条排第一。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三段式应答</tspan></text><g data-k=\"结论先行\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">结论先行</tspan></text></g><g data-k=\"依据可查\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">依据可查</tspan></text></g><g data-k=\"取舍明确\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">取舍明确</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 67.01}, {"t": "依据要落在三类事实上，不要落在感受上", "n": "依据只认三类事实。第一类，缺口可测：某个场景的失败率、投诉量、退出率，有口径有样本。第二类，卡住基础体验：这条不做，别的功能再好也白搭，这类判断要举一个具体的连带影响。第三类，改动可控：不碰硬件、只动软件层、一个 OTA 周期能上。三类各说一条，比列十条「用户反馈很多」有用得多。被追问数据来源时，直接报出口径和样本量，并主动说一句样本覆盖不到哪里——这句话会让你的可信度立刻不一样。反过来，如果你只有感受没有事实，最体面的做法是当场说「这条我回去补数据」，而不是硬编一个百分比。数据补上之后主动发过去，这一来一回就把信任建立了。下一次评审，他会先问你的意见。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类可查依据</tspan></text><g data-k=\"缺口可测\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">缺口可测</tspan></text></g><g data-k=\"卡住基础体验\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">卡住基础体验</tspan></text></g><g data-k=\"改动可控\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">改动可控</tspan></text></g></svg>", "d": 66.67}, {"t": "三个失分动作，比答错更致命", "n": "答错可以补，失分动作补不回来。第一个，先讲背景铺垫：「我们调研了三个月，访谈了四十位车主」——对方已经没耐心了，你要先说结论。第二个，用「用户反馈很多」代替数据：这句话在车企评审会上等于没说，因为每个人都能这么说。第三个，被质疑就改口：一被问「数据哪来的」立刻改口说「大概」，等于承认原来没依据。还有一种更隐蔽的失分：替安全或合规下结论。被问到「这个功能行车中用会不会有风险」，正确答法是「这属功能安全评估范围，我请安全工程师按 ISO 26262 的口径给可用清单」，而不是「应该没问题」。一句应该没问题，就会进会议纪要。纪要不会记你的表情，只记你的结论。所以宁可少说一句，也别多说一句不该你说的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"不要铺垫背景\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不要铺垫背景</tspan></text></g><g data-k=\"不用感受代替数据\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不用感受代替数据</tspan></text></g><g data-k=\"被质疑不改口\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">被质疑不改口</tspan></text></g><g data-k=\"不替安全下结论\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替安全下结论</tspan></text></g></svg>", "d": 69.05}], "deliverable": {"type": "skill", "name": "需求排序说明", "rubric": ["依据可查", "取舍明确", "不防线崩"], "acceptance": "能产出《需求排序说明》并通过本单元评分要点"}, "spar": {"role": "车型总监", "persona": "管着这款车的整体竞争力与成本，最烦「什么都重要」。他会用竞品和销量数据压你，也会突然说「这条砍掉」看你反应。他要的不是完整，是能签字", "mustAsk": ["这三条需求，凭什么这个排第一？", "你说频次高，数据哪来的、样本多少？", "如果预算只够做一条，你砍哪两条，砍了会怎样？", "竞品上个月刚上了同类功能，我们慢一个季度还行不行？"]}, "exemplar": "（总监：这三条需求，凭什么这个排第一？）\n\n结论：排第一的是「语音本地化兜底」，不是场景包订阅。\n依据有三条：一是缺口可测——近 30 天地库与隧道场景语音失败占比 23%，样本 4.2 万次请求，\n来自端侧埋点，不是问卷；二是它卡住的是基础体验，场景包订阅再好看，语音不好用也没人付费；\n三是改动可控——只动端侧兜底逻辑，不碰硬件，一个 OTA 周期能上。\n场景包订阅排第二，理由是有付费基础但转化未验证，适合放在兜底之后做 A/B。\n\n（总监：数据哪来的，样本多少？）\n端侧埋点，近 30 天 4.2 万次语音请求，失败判定口径是「三次重试仍无有效指令」。\n口径和取数 SQL 我可以会后发你，样本只覆盖已激活车机，未激活的不在里面，这个偏差我认。\n\n（总监：预算只够做一条，你砍哪两条？）\n砍场景包订阅和维保提醒，保语音兜底。\n砍掉的后果我说明白：场景包订阅推迟一个季度，订阅收入今年归零；\n维保提醒本可以复用现有故障码链路，推迟会让售后继续靠人工外呼，单月约 3000 通。\n这两条我认，因为语音兜底不做，另外两条的用户体验都会被拖累。\n\n（总监：竞品上个月上了同类功能，我们慢一个季度行不行？）\n行，但要说清差别：友商上的是「云端增强」，我们做的是「端侧兜底」，\n地库和隧道这两类场景它同样解决不了。如果要对标它的宣传口径，\n我建议加一条对外表述的合规检查，避免出现「全场景可用」这类表述。\n\n边界说明：行车中哪些语音指令可用，属功能安全评估范围，我不下结论，\n这条要请安全工程师按 ISO 26262 的口径给可用清单。", "task": "把《需求排序说明》拿到「车型总监」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《需求排序说明》。现在要让它通过「车型总监」这一关。\n【对手的立场】管着这款车的整体竞争力与成本，最烦「什么都重要」。他会用竞品和销量数据压你，也会突然说「这条砍掉」看你反应。他要的不是完整，是能签字。\n【他一定会追问】「这三条需求，凭什么这个排第一？」 / 「你说频次高，数据哪来的、样本多少？」 / 「如果预算只够做一条，你砍哪两条，砍了会怎样？」\n【场景】你说「车型总监挑战「这些需求凭什么排前面」」，对方立刻回一句：这三条需求，凭什么这个排第一？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["第一轮回答先给结论（排第一的是哪条），再给依据，不铺垫背景", "每条依据都指得出数据来源与样本量，不说「用户反馈很多」", "被要求砍需求时，直接给砍哪两条 + 砍掉的后果，不重排全部", "全程不替安全与合规下结论；被问到「会不会有风险」时，指出去找谁评"]}, {"id": "M0U5", "tier": "adv", "step": "understand", "title": "从造车基因到 AI 产品力：三段跃迁的能力清单", "video": {"dur": "3.3min", "script": ["车企 PM 转型最常卡住的不是不会用 AI，是软件迭代思维没建立，AI 能力就没有落点", "三段能力对照表（造车基因 / 软件思维 / AI 产品力）+ 每段三个可观察行为", "Z 汽车 从整车部门转到智能化研究院的一批 PM，卡在第二段到第三段之间"]}, "ppt": {"method": "三段能力对照表（造车基因 / 软件思维 / AI 产品力）+ 每段三个可观察行为", "case": "Z 汽车 从整车部门转到智能化研究院的一批 PM，卡在第二段到第三段之间", "demo": "用三段清单给自己打分，找出最缺的一段并写一条补法"}, "objective": "能给自己和团队各定一条 90 天补短板动作，并说清补的是造车基因、软件思维还是 AI 产品力", "transfer": "把三段跃迁清单发给上级，圈出自己最缺的一段，约一次 30 分钟的能力对齐", "vslides": [{"t": "三段不是三个台阶，是三种工作方式", "n": "车企人才转型常被说成三段：造车基因、软件思维、AI 产品力。但很多人理解错了，以为是一级一级考上去。它其实是三种工作方式，同时要用。造车基因是底线思维：这个功能失效会怎样、谁受伤、怎么证明它不会失效，对应的是 DFMEA、功能安全、验证闭环那一套。软件思维是节奏思维：小步发布、灰度、看数据、快速回滚，对应的是敏捷和埋点。AI 产品力是概率思维：接受模型会错，用数据分布和评测集来界定它错在哪、错多少、错了怎么办。三种思维打架的时候最难受——造车基因要你把边界焊死，软件思维要你快点发，AI 产品力告诉你边界本身是概率的。能同时用这三套语言说话的人，在车企最稀缺。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三种工作方式</tspan></text><g data-k=\"造车基因\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">造车基因</tspan></text></g><g data-k=\"软件思维\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">软件思维</tspan></text></g><g data-k=\"AI 产品力\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">AI 产品力</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.45}, {"t": "每段给三个可观察行为，别用形容词", "n": "怎么判断自己在哪一段？别看自我感觉，看行为。造车基因段：你能独立写出一个功能的失效模式清单；你知道这个功能属于哪个 ASIL 等级、为什么；你能说清验证要跑多少场景才算够。软件思维段：你能把一个季度的大需求切成四个两周可发的版本；你会为每个版本定一个可回滚的判据；你看的是留存和频次，不是「上线了没有」。AI 产品力段：你能给一个模型能力写出评测集和门槛；你能说清这个功能错了之后的兜底路径；你能判断一个需求该端侧做还是云端做。三段各三条，一共九条，能对上六条以上，基本就在第三段了。对不上的那几条，就是你 90 天要补的。别贪多，一次补一条。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">九条可观察行为</tspan></text><g data-k=\"失效模式清单\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">失效模式清单</tspan></text></g><g data-k=\"ASIL 定级\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">ASIL 定级</tspan></text></g><g data-k=\"验证场景数\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">验证场景数</tspan></text></g><g data-k=\"两周一切版\"><rect x=\"18.0\" y=\"96.7\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">两周一切版</tspan></text></g><g data-k=\"回滚判据\"><rect x=\"145.3\" y=\"96.7\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">回滚判据</tspan></text></g><g data-k=\"留存与频次\"><rect x=\"272.7\" y=\"96.7\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">留存与频次</tspan></text></g><g data-k=\"评测集与门槛\"><rect x=\"18.0\" y=\"149.3\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">评测集与门槛</tspan></text></g><g data-k=\"兜底路径\"><rect x=\"145.3\" y=\"149.3\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">兜底路径</tspan></text></g><g data-k=\"端云判断\"><rect x=\"272.7\" y=\"149.3\" width=\"109.3\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">端云判断</tspan></text></g></svg>", "d": 63.43}, {"t": "补短板要补在交付物上，不是补在课上", "n": "补短板最容易犯的错，是去上课、去考证，回来还是原来的做法。有效的补法只有一个特征：产出一个原来不会做的交付物。造车基因缺，就去要一份真实的安全分析报告，跟着安全工程师做一遍，产出你自己功能的失效模式清单。软件思维缺，就把手上的需求强行切版，切完之后请研发负责人评一句「这个切法能不能两周发」。AI 产品力缺，就为你负责的一个功能建一个 50 条规模的评测集，跑一遍，把结果贴到评审会上。三件事都不需要额外预算，需要的是把「学和做」合并成一件事。90 天能做完其中一件，就已经超过大多数同岗位的人。补完把交付物留下来，它比任何培训证书都硬。补的那一条最好挑下个版本就会用到的，用得上才留得住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">补法</tspan></text><g data-k=\"缺造车基因 → 产出一份失效模式清单\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">缺造车基因 → 产出一份失效模式清单</tspan></text></g><g data-k=\"缺软件思维 → 切一版两周可发的需求\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">缺软件思维 → 切一版两周可发的需求</tspan></text></g><g data-k=\"缺 AI 产品力 → 建一个 50 条评测集\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">缺 AI 产品力 → 建一个 50 条评测集</tspan></text></g></svg>", "d": 69.26}], "deliverable": {"type": "skill", "name": "个人能力跃迁清单", "rubric": ["分段准确", "行为可观察", "动作可验证"], "acceptance": "三段各写出一个可观察行为作为自评依据，并给出 90 天内能验证的一次动作"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三段能力对照表（造车基因 / 软件思维 / AI 产品力）+ 每段三个可观察行为\n【为什么重要】车企 PM 转型最常卡住的不是不会用 AI，是软件迭代思维没建立，AI 能力就没有落点\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三段能力各自用「能做什么」描述，不用「了解 / 熟悉 / 精通」这类无法验证的词", "能指出自己目前实际处在哪一段，并给出一个反例说明为什么不是更高一段", "90 天动作要落在具体交付物上（一份文档、一次评审、一个上线的功能），不是「多学习」", "能说清团队层面的短板在哪一段，以及补它需要什么资源（人、数据、工具）"]}, {"id": "M0U6", "tier": "adv", "step": "demo", "title": "用 AI 预判「这个功能能不能上车」", "video": {"dur": "3.6min", "script": ["同一句「加个 AI 功能」，端侧做和云端做是两种成本、两种体验、两种风险，判错方向整条线白做", "三档判定（端侧可行 / 仅云端 / 暂不可行）+ 四个约束值（时延 / 算力 / 离线 / 功耗）", "Z 汽车 三个候选功能同时排队：离线语音指令、座舱内多模态手势、云端大模型闲聊"]}, "ppt": {"method": "三档判定（端侧可行 / 仅云端 / 暂不可行）+ 四个约束值（时延 / 算力 / 离线 / 功耗）", "case": "Z 汽车 三个候选功能同时排队：离线语音指令、座舱内多模态手势、云端大模型闲聊", "demo": "在 WorkBuddy 里跑一遍「功能可行性三档判定」提示词"}, "objective": "能对一个候选功能给出「端侧可行 / 仅云端 / 暂不可行」的判断，并写出支撑判断的三个约束值", "transfer": "把手上排队的一个功能按三档判一遍，把「暂不可行」的那条写清缺什么条件才能做", "vslides": [{"t": "同一个功能，端侧做和云端做是两门生意", "n": "同一个功能，端侧做和云端做是两门生意。端侧：时延低、离线可用、隐私不出车，但算力有天花板，模型只能做小，迭代要跟整车 OTA。云端：模型可以很大、迭代按周，但依赖网络，隧道地库直接歇，流量和推理都是持续成本。所以判断一个功能能不能上车，不是问 AI 能不能做到，是问三件事：要多快、要多聪明、断网了怎么办。要多快决定能不能放端侧，要多聪明决定要不要上云，断网怎么办决定降级链长什么样。这三问答完，技术路线基本就定了，剩下才是选型。产品经理最容易犯的错，是先想功能再想约束，等架构师说算力不够，已经写了两周 PRD。顺序反过来——先量约束，再写功能，返工少一半。这两个顺序的差别，就是三个月和六周的差别。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">端侧</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">云端</tspan></text><g data-k=\"['端侧：低时延·离线·算力受限']\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">['端侧：低时延·离线·</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">算力受限']</tspan></text></g><g data-k=\"['云端：大模型·快迭代·依赖网络']\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">['云端：大模型·快迭代</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">·依赖网络']</tspan></text></g></svg>", "d": 71.38}, {"t": "四个约束值，缺一个判断就不成立", "n": "判断要落在四个值上。第一，时延：语音唤醒到执行，交互上通常按 600 到 800 毫秒做预算，超过 1 秒用户会重复说，重复说就是失败。第二，算力与内存：不是看峰值，是看并发余量——语音、导航、音乐同时跑的时候还剩多少。第三，离线可用性：地库、隧道、山区，这三类场景决定你的降级链必须存在。第四，功耗：座舱常驻推理会影响暗电流和续航，尤其是停车监控类功能。四个值里只要有一个答不上来，判定就只能写需实测，不能写可行。写需实测不丢人，写错了才丢人——因为后面所有排期和预算都挂在这个判断上。所以宁可先写待测，也别先拍一个数。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四个约束值（示意）</tspan></text><g data-k=\"时延\"><text x=\"24.0\" y=\"61.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">时延</tspan></text><rect x=\"150\" y=\"51\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"51\" width=\"168.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"310.0\" y=\"64\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">≤800ms</text></g></g><g data-k=\"算力余量\"><text x=\"24.0\" y=\"101.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">算力余量</tspan></text><rect x=\"150\" y=\"91\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"91\" width=\"63.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"205.0\" y=\"104\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">三成</text></g></g><g data-k=\"离线可用\"><text x=\"24.0\" y=\"141.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">离线可用</tspan></text><rect x=\"150\" y=\"131\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"131\" width=\"126.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"268.0\" y=\"144\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">必须</text></g></g><g data-k=\"功耗\"><text x=\"24.0\" y=\"181.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">功耗</tspan></text><rect x=\"150\" y=\"171\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"171\" width=\"94.5\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"236.5\" y=\"184\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">常驻</text></g></g></svg>", "d": 65.71}, {"t": "三档判定，和「暂不可行」的正确写法", "n": "判定分三档，别只写能做或不能做。端侧可行：四个值都在余量内，且能写出降级链。仅云端：端侧做不了但云端能补，前提是必须设计离线兜底，并在宣传口径上避免全场景可用。暂不可行：不是永远不做，是现在缺条件——要写清缺什么，是缺算力、缺数据、缺合规路径，还是需求本身还没被验证。第三种写法最见功力：把手势控制判成暂不可行时，顺手给一个最小验证版本，静态手势加固定区域，把需求真伪先测出来，这样你既没挡路，也没乱花预算。评审会上，这种写法比一句技术上可行值钱得多。评审最怕的不是保守，是没有边界的乐观。把不确定性写在纸上，你才有资格谈可行性。还有一条：可行性判定有保质期，实测数据一到就重判，别让旧结论替新需求背书。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三档判定</tspan></text><g data-k=\"端侧可行\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">端侧可行</tspan></text></g><g data-k=\"仅云端\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">仅云端</tspan></text></g><g data-k=\"暂不可行\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">暂不可行</tspan></text></g></svg>", "d": 77.4}], "deliverable": {"type": "skill", "name": "功能可行性判定单", "rubric": ["判定有据", "约束具体", "降级可行"], "acceptance": "每条判定都带三个约束值与一个降级方案，能直接被架构师拿去评估"}, "demo": {"ref": "■ 三个候选功能的三档判定（Z7 座舱域 · 现有 SoC 余量约三成）\n\n1. 离线语音指令（空调 / 车窗 / 导航回家 等十二类固定指令）\n 判定：端侧可行\n · 时延：端侧识别加执行 ≤ 600ms（不含执行器动作时间）\n · 算力与内存：占用 NPU 约 15%，常驻内存 ≤ 180MB，在现有余量内\n · 离线：完全离线可用，无需网络\n · 降级链：端侧置信度低于 0.6 → 复述确认一次 → 仍失败 → 提示「请用按键或稍后重试」\n · 需实测：方言与车内噪声条件下的识别率（材料未给）\n\n2. 座舱内多模态手势控制\n 判定：暂不可行\n · 时延：采集加推理加执行，链路预算 ≥ 900ms，超出交互可接受范围\n · 算力与内存：需常驻视觉推理，现有 NPU 余量不足（估算需四成以上，需实测）\n · 离线：可离线，但夜间与逆光条件下识别率无法保证\n · 缺什么才能做：SoC 换代或增加独立视觉算力；先做「静态手势加固定区域」的降级版本验证需求真伪\n\n3. 云端大模型闲聊与知识问答\n 判定：仅云端\n · 时延：首字响应 1.2–2.5 秒，依赖网络，隧道与地库不可用\n · 算力与内存：端侧无占用，成本在云端推理与流量\n · 离线：不可用，必须配离线兜底\n · 降级链：网络不可用 → 切端侧固定指令集 → 再失败 → 明确告知「当前无法联网」\n · 需实测：单车日均请求数与流量成本（材料未给）\n\n■ 需要补证的参数\n· 现有 NPU 在语音与导航并发下的实际余量\n· 车内 60–80km/h 噪声下的识别率\n· 云端推理单次成本与日均请求量", "fix": ["把 AI 给的「算力占用约四成」改成「需实测，按现有余量不足处理」——它没有任何依据，而这个数字会直接决定项目生死。", "给「多模态手势」补一条降级版本：先做静态手势加固定区域，用最小成本验证需求是否真实，而不是直接否掉。", "把「云端闲聊」的时延从单个数字改成区间加条件：1.2–2.5 秒且依赖网络，隧道地库不可用——只写一个数会让人误以为哪儿都能用。", "给每个「端侧可行」的判定加上降级链，否则架构师会认为你只做了上半场，评审照样过不了。"], "judge": "判断依据：有没有把「需实测」写成确定值；不可行的功能有没有说清缺什么条件才能做；每个可行判定是否配了降级链；时延是否标了条件（网络、噪声、并发）"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是 Z 汽车 Z7 座舱域三个候选功能，以及现有硬件与平台条件（已脱敏）：[功能描述三条 + SoC 型号与算力余量 + 内存余量 + 网络条件 + 现有云服务能力] 请对每个功能给出三档判定：端侧可行 / 仅云端 / 暂不可行；每档必须给出支撑判断的三个约束值（时延上限、算力或内存占用、离线可用性），并为端侧可行的功能写一条降级链；无法从材料确认的参数请标注「需实测」，不要估算。"}, "task": "在 WorkBuddy 里把「三档判定（端侧可行 / 仅云端 / 暂不可行）+ 四个约束值（时延 / 算力 / 离线 / 功耗）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三档判定（端侧可行 / 仅云端 / 暂不可行）+ 四个约束值（时延 / 算力 / 离线 / 功耗）\n【参考案例】Z 汽车 三个候选功能同时排队：离线语音指令、座舱内多模态手势、云端大模型闲聊\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是 Z 汽车 Z7 座舱域三个候选功能，以及现有硬件与平台条件（已脱敏）：[功能描述三条 + SoC 型号与算力余量 + 内存余量 + 网络条件 + 现有云服务能力] 请对每个功能给出三档判定：端侧可行 / 仅云端 / 暂不可行；每档必须给出支撑判断的三个约束值（时延上限、算力或内存占用、离线可用性），并为端侧可行的功能写一条降级链；无法从材料确认的参数请标注「需实测」，不要估算。", "rubric": ["三档判定各有明确结论，不出现「视情况而定」这类无法执行的表述", "每条判定至少给出三个约束值，且标明是实测值还是待测值", "「暂不可行」的功能要写清缺什么条件才能做，不是直接否掉", "「端侧可行」的功能必须配降级链，且降级动作具体到提示话术"]}, {"id": "M0U7", "tier": "adv", "step": "todo", "title": "产出《域内 AI 能力建设 90 天路线》", "video": {"dur": "3.3min", "script": ["能力建设最容易写成培训计划，落地要看有没有产出物留下来", "三支柱（人 / 数据 / 工具）× 三段（0–30 / 31–60 / 61–90 天）× 每格一个可交付物", "Z 汽车 座舱域在年度规划里被要求「三个月内形成可持续的 AI 迭代能力」"]}, "ppt": {"method": "三支柱（人 / 数据 / 工具）× 三段（0–30 / 31–60 / 61–90 天）× 每格一个可交付物", "case": "Z 汽车 座舱域在年度规划里被要求「三个月内形成可持续的 AI 迭代能力」", "demo": "按三支柱铺九格，每格写一个交付物和一个验收人"}, "objective": "产出一份含人、数据、工具三项动作与验收点的 90 天能力建设路线，且每项都有可交付物", "transfer": "把路线发给直属上级与一位研发负责人，各取一条认领，两周后对一次进度", "vslides": [{"t": "能力建设最容易写成培训计划", "n": "能力建设类方案最常见的失败，是写成了一张培训计划：几月做什么课、请谁讲、多少人参加。这类方案在评审会上很难被否，但也很难被记住，因为没有留下任何东西。判断一份能力建设方案有没有价值，只问一句：90 天后，桌上多了什么？是一份判读手册、一个两百条的标注集、一个能跑的评测脚本，还是一套被强制使用的模板。有资产留下来，能力就沉淀了；只有课时记录，人一走就归零。所以路线要按三根支柱铺：人、数据、工具。三根里缺一根，另外两根也转不起来——有人没数据是空谈，有数据没工具是摆设，有工具没人用是浪费。三根里最容易被跳过的是数据，也恰恰是最难补的一根。所以数据那一列，宁可写得难看，也要写真实状态。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三根支柱</tspan></text><g data-k=\"人\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">人</tspan></text></g><g data-k=\"数据\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">数据</tspan></text></g><g data-k=\"工具\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">工具</tspan></text></g></svg>", "d": 72.34}, {"t": "三支柱乘三段，每格只放一个交付物", "n": "铺法很简单：三支柱乘三段，一共九格，每格只放一个交付物，写清验收人和验收口径。0 到 30 天放「打底」的东西：一份判读手册、一份可用数据清单、一次额度申请。31 到 60 天放「跑通」：四个人各做一次实战、建成两百条标注集、评测脚本能跑。61 到 90 天放「固化」：模板进评审流程、标注集扩到五百条并接入回归、评测结果进 OTA 放行单。每格工作量不要超过四周，超了就拆。验收人写岗位就行，不用写名字，但一定要有——没有验收人的交付物，基本都会拖成下一季度。所以验收人这一列，宁可不写全，也不能空着。空着一格，等于这一格没人负责。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">九格法</tspan></text><g data-k=\"0–30 天：打底\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"62.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">0–30 天：打底</tspan></text></g><g data-k=\"31–60 天：跑通\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"62.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">31–60 天：跑通</tspan></text></g><g data-k=\"61–90 天：固化\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"62.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">61–90 天：固化</tspan></text></g><g data-k=\"人：手册\"><rect x=\"18.0\" y=\"83.5\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"101.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">人：手册</tspan></text></g><g data-k=\"人：四次实战\"><rect x=\"145.3\" y=\"83.5\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"101.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">人：四次实战</tspan></text></g><g data-k=\"人：模板进流程\"><rect x=\"272.7\" y=\"83.5\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"101.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">人：模板进流程</tspan></text></g><g data-k=\"数据：清单\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"141.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">数据：清单</tspan></text></g><g data-k=\"数据：200 条\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"141.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">数据：200 条</tspan></text></g><g data-k=\"数据：500 条 + 回归\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"140.7\" font-size=\"9.9\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">数据：500 条 + 回归</tspan></text></g><g data-k=\"工具：额度\"><rect x=\"18.0\" y=\"162.5\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"180.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">工具：额度</tspan></text></g><g data-k=\"工具：脚本\"><rect x=\"145.3\" y=\"162.5\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"180.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">工具：脚本</tspan></text></g><g data-k=\"工具：进放行单\"><rect x=\"272.7\" y=\"162.5\" width=\"109.3\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"180.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">工具：进放行单</tspan></text></g></svg>", "d": 56.52}, {"t": "不写「不做清单」，方案会被当成什么都想做", "n": "第三个要点最容易被忽略：一定要有不做清单。不写，评审时对方会默认你什么都想做，然后开始砍你的范围；写了，主动权在你手上。不做清单的每条都要给理由，理由只认四类：预算不够、算力不够、合规过不去、优先级排不上。比如「不做端侧大模型，现有 SoC 余量不足，等下一代硬件」，「不做跨域数据打通，出域审批周期不可控，不在本季度承诺」。还有一条：提前定止损点。什么条件下承认做不成、什么时候报、报给谁，写在方案里。愿意提前说「我可能做不成」的人，反而更容易被批准，因为对方知道你会在该停的时候停。这不是示弱，是把不确定性提前定好价。不做清单控制在三条以内，写多了等于没取舍，评审也记不住你砍了什么。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">两个必备项</tspan></text><g data-k=\"不做清单四条理由：预算/算力/合规/优先级\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不做清单四条理由：预算/算力/合规/优先级</tspan></text></g><g data-k=\"每条给一个具体理由\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">每条给一个具体理由</tspan></text></g><g data-k=\"提前写止损点：条件·时间·对象\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">提前写止损点：条件·时间·对象</tspan></text></g></svg>", "d": 70.82}], "deliverable": {"type": "skill", "name": "域内 AI 能力建设 90 天路线", "rubric": ["交付物实", "分段合理", "验收可查"], "acceptance": "九格里至少六格有交付物，每个交付物都有验收人与可查口径，且不含「培训 / 宣贯 / 提升意识」这类无产出动作"}, "practice": {"steps": ["盘点现状：人（谁会什么）、数据（有哪些、缺哪些）、工具（能跑什么）", "按三支柱各定 1–2 个 90 天内必须留下的交付物", "把交付物分到 0–30 / 31–60 / 61–90 三段，每段只放能做完的", "每个交付物写验收人和验收口径（可查、可数）", "写一条「不做清单」：90 天内明确不碰的方向与原因"], "exemplar": "《Z7 座舱域 AI 能力建设 90 天路线》（2027 Q1）\n\n一、现状盘点\n· 人：座舱域 6 名 PM，2 人做过 AI 功能，4 人只做过传统车控功能；无专职评测人员。\n· 数据：有端侧埋点（语音请求、失败类型），无标注团队；场景视频数据由研究院代管，调用要走审批。\n· 工具：可申请云端推理额度，无内部评测平台，评测靠人工回听。\n\n二、三支柱 × 三段（每格一个交付物）\n\n【人】\n· 0–30 天：《语音失败 case 判读手册》——由 2 名有经验 PM 出，覆盖三类失败的判定标准。验收人：座舱域负责人。\n· 31–60 天：4 名 PM 各完成一次「用 AI 出初稿 + 人工改三处」的实战，产出 4 份需求初稿。验收人：本人上级。\n· 61–90 天：形成「AI 需求三张单」模板并在一级评审中强制使用。验收人：评审召集人。\n\n【数据】\n· 0–30 天：《座舱可用数据清单》——字段、来源、更新频率、可否出域四列。验收人：数据合规。\n· 31–60 天：建成 200 条语音失败标注集（三类标签），由 PM 自标、研发复核。验收人：算法负责人。\n· 61–90 天：标注集扩到 500 条并接入回归流程，每次 OTA 前跑一次。验收人：测试负责人。\n\n【工具】\n· 0–30 天：申请云端推理额度并跑通一个内部小工具（失败 case 聚类）。验收人：IT。\n· 31–60 天：评测脚本上线，输入标注集输出通过率与失败分布。验收人：测试负责人。\n· 61–90 天：把评测结果接入 OTA 放行单，作为必填项。验收人：质量。\n\n三、不做清单（90 天内明确不碰）\n1. 不做端侧大模型 —— 现有 SoC 余量不足，需等下一代硬件，先按云端方案设计。\n2. 不做全场景免唤醒 —— 误唤醒与功耗无实测数据，先做地库/隧道兜底。\n3. 不建独立标注团队 —— 90 天内用 PM 自标 + 研发复核，规模不够再申请。\n4. 不做跨域数据打通 —— 涉及数据出域审批，周期不可控，不在本季度承诺。\n\n四、验收节奏\n· 每 30 天一次 30 分钟对齐会，只过交付物，不讲进展。\n· 任一交付物延期超过 2 周，触发范围裁剪而不是延期交付。"}, "task": "产出《域内 AI 能力建设 90 天路线》：盘点现状：人（谁会什么）、数据（有哪些、缺哪些）、工具（能跑什么）；按三支柱各定 1–2 个 90 天内必须留下的交付物；把交付物分到 0–30 / 31–60 / 61–90 三段，每段只放能做完的；每个交付物写验收人和验收口径（可查、可数）；写一条「不做清单」：90 天内明确不碰的方向与原因", "brief": "【你的角色】你是「Z 汽车」负责「Z7」的座舱域 AI 产品经理。本单元属于「M0 导论：AI 产品经理在车企的位置」模块，你要交付的是《域内 AI 能力建设 90 天路线》。\n【场景】业务侧这周的诉求是：能力建设最容易写成培训计划，落地要看有没有产出物留下来。参考做法：Z 汽车 座舱域在年度规划里被要求「三个月内形成可持续的 AI 迭代能力」。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（三支柱（人 / 数据 / 工具）× 三段（0–30 / 31–60 / 61–90 天）× 每格一个可交付物），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《域内 AI 能力建设 90 天路线》填写模板】\n\n■ 1. 盘点现状：人（谁会什么）、数据（有哪些、缺哪些）、工具（能跑什么）\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 按三支柱各定 1–2 个 90 天内必须留下的交付物\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 把交付物分到 0–30 / 31–60 / 61–90 三段，每段只放能做完的\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 每个交付物写验收人和验收口径（可查、可数）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写一条「不做清单」：90 天内明确不碰的方向与原因\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   《Z7 座舱域 AI 能力建设 90 天路线》（2027 Q1）\n\n一、现状盘点\n· 人：座舱域 6 名 PM，2 人做过 AI 功能，4 人只做过传统车控功能；无专职评测人员。\n· 数据：有端侧埋点（语音请求、失败类型），无标注团队；场景视频数据由研究院代管，调用要走审批。\n· 工具：可申请云端推理额度，无内部评测平台，评测靠人工回听。\n\n二、三支柱 × 三段（每格一个交付物）\n\n【人】\n· 0–30 天：《语音失败 case 判读手册》——由 2 名有经验 PM 出，覆盖三类失败的判定标准。验收人：座舱域负责人。\n· 31–60 天：4 名 PM 各完成一次「用 AI 出初稿 + 人工改三处」的实战，产出 4 份需求初稿。验收人：本人上级。\n· 61–90 天：形成「AI 需求三张单」模板并在一级评审中强制使用。验收人：评审召集人。\n\n【数据】\n· 0–30 天：《座舱可用数据清单》——字段、来源、更新频率、可否出域四列。验收人：数据合规。\n· 31–60 天：建成 200 条语音失败标注集（三类标签），由 PM 自标、研发复核。验收人：算法负责人。\n· 61–90 天：标注集扩到 500 条并接入回归流程，每次 OTA 前跑一次。验收人：测试负责人。\n\n【工具】\n· 0–30 天：申请云端推理额度并跑通一个内部小工具（失败 case 聚类）。验收人：IT。\n· 31–60 天：评测脚本上线，输入标注集输出通过率与失败分布。验收人：测试负责人。\n· 61–90 天：把评测结果接入 OTA 放行单，作为必填项。验收人：质量。\n\n三、不做清单（90 天内明确不碰）\n1. 不做端侧大模型 —— 现有 SoC 余量不足，需等下一代硬件，先按云端方案设计。\n2. 不做全场景免唤醒 —— 误唤醒与功耗无实测数据，先做地库/隧道兜底。\n3. 不建独立标注团队 —— 90 天内用 PM 自标 + 研发复核，规模不够再申请。\n4. 不做跨域数据打通 —— 涉及数据出域审批，周期不可控，不在本季度承诺。\n\n四、验收节奏\n· 每 30 天一次 30 分钟对齐会，只过交付物，不讲进展。\n· 任一交付物延期超过 2 周，触发范围裁剪而不是延期交付。", "rubric": ["人、数据、工具三支柱都有动作，且动作落在交付物上而不是课程上", "每个交付物写清验收人（岗位即可）与验收口径（数量或状态）", "90 天只放做得完的事：单格工作量不超过 4 周", "有明确的不做清单，且给出原因（预算、算力、合规或优先级）"]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "转型委员会质疑「路线落不了人」", "video": {"dur": "3.4min", "script": ["能力建设类方案最容易在这一关被否，因为听起来都对，但没人负责", "三问三答（谁来做 / 会不会做 / 做不做得到位），每问答到可执行动作", "Z 汽车 转型委员会在年度评审上追问：路线写得漂亮，人从哪来、考核怎么落"]}, "ppt": {"method": "三问三答（谁来做 / 会不会做 / 做不做得到位），每问答到可执行动作", "case": "Z 汽车 转型委员会在年度评审上追问：路线写得漂亮，人从哪来、考核怎么落", "demo": "现场演练：三轮追问不回避，每次回答都落到一个具体动作"}, "objective": "能在编制、能力、考核三问上给出正面回答，不把问题推回给「公司机制」", "transfer": "把路线里最容易被质疑的一条，提前写好编制与考核的应对，评审时先讲", "vslides": [{"t": "这一关只问三件事", "n": "这类答辩，无论对方问多少句，实质只有三问：人从哪来、会不会做、做不好怎么办。第一问考的是你有没有真的算过资源，第二问考的是你有没有把「学会」拆成可观察的动作，第三问考的是你敢不敢提前认输。三问答不上任何一条，方案就自动降级成愿景，而愿景是不给预算的。回答的姿势很重要：不要防御，不要解释动机，直接给动作。对方追问同一个点，往往不是没听懂，是在试你会不会改口。你要做的是同一套答案说第二遍，细节更具体一点，而不是换一套说法。如果第二遍比第一遍还空，这一关基本就过不去了。对方要的是稳定，不是聪明。这句话在评审现场说，比在材料里写得漂亮有用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">实质三问</tspan></text><g data-k=\"人从哪来\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">人从哪来</tspan><
