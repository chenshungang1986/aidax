/text></g><g data-k=\"会不会做\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">会不会做</tspan></text></g><g data-k=\"做不好怎么办\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">做不好怎么办</tspan></text></g></svg>", "d": 67.15}, {"t": "三问的答法，都要落到数字和动作", "n": "第一问答法：给出具体的调配方案。「不新增编制，用二加四：两名做过 AI 功能的 PM 抽三成工时做模板和手册，另外四人各承担一次实战，每人约五个工作日，从现有项目里置换，减的是每人手上一条低优先级需求。」第二问答法：把「学会」拆成三次有复核的实战，每次都有产出物，做不出来一眼能看见。第三问答法：给三个止损触发条件，加一个明确的时间和上报对象。三个答案有共同点：都能被数、被看见、被追责。这也是为什么它们能过会——不是因为说得好，是因为无法含糊。所以准备答辩不是准备话术，是准备那几组数。数不齐，话术越好越像在绕。答辩前把三类数写在手卡上：工时、条数、条件。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三问三动作</tspan></text><g data-k=\"调配方案\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">调配方案</tspan></text></g><g data-k=\"三次实战\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三次实战</tspan></text></g><g data-k=\"三个止损点\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">三个止损点</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 70.42}, {"t": "三个说法，说出来就输", "n": "第一句，「靠大家努力」。这句话一出口，对方就知道你没算过工时。第二句，「加强培训」。培训是动作不是结果，没人会因为一句加强培训批预算。第三句，「保证都能学会」。这是不可能兑现的承诺，而评审最怕不可兑现的承诺。换成什么？换成「我不承诺都学会，我承诺都做过一次，且有人复核」。还有一个小技巧：主动交代边界。比如「跨域数据打通不在本季度承诺，涉及出域审批，周期不可控，我不拿它充数」。主动划掉一条，比硬撑十条更可信，因为对方立刻知道你的方案是筛过的，不是凑的。这一条在预算会上尤其管用。因为预算会最怕不可证的东西，最认主动划掉的边界。主动划边界的人，通常拿到的预算更多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"不说靠大家努力\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不说靠大家努力</tspan></text></g><g data-k=\"不说加强培训\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不说加强培训</tspan></text></g><g data-k=\"不承诺都学会\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不承诺都学会</tspan></text></g><g data-k=\"主动交代边界\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">主动交代边界</tspan></text></g></svg>", "d": 69.07}], "deliverable": {"type": "skill", "name": "能力建设答辩稿", "rubric": ["正面回答", "动作具体", "承认约束"], "acceptance": "能产出《能力建设答辩稿》并通过本单元评分要点"}, "spar": {"role": "转型委员会成员（分管智能化）", "persona": "不管你写得多完整，只问三件事：人从哪来、会不会做、做不好怎么办。他会重复追问同一个点，看你是不是在绕", "mustAsk": ["这些活现在谁在做？你新增了编制还是让现有的人加班？", "现有 PM 没做过 AI 功能，你凭什么认为 90 天能上手？", "如果第 60 天发现做不成，你什么时候说、跟谁说、怎么退？", "这套东西做完，怎么证明它有效，而不是又一份文档？"]}, "exemplar": "（委员：这些活现在谁在做？新增编制还是让现有的人加班？）\n\n正面回答：不新增编制，用「2 + 4」调配。\n2 名做过 AI 功能的 PM 抽 30% 工时做模板和判读手册，另外 4 人各承担一次实战，\n每人投入约 5 个工作日，从现有项目里置换出来，不减项目，减的是每人手上的低优先级需求各一条。\n这件事我已经和域负责人对过，置换清单在附件第 3 页。\n\n（委员：现有 PM 没做过 AI 功能，凭什么 90 天能上手？）\n\n不靠课程，靠三次实战。第一次是 0–30 天的失败 case 判读——每人判 50 条，判完和算法同学对一遍，\n标准以算法复核为准；第二次是 31–60 天的需求初稿，用三张单模板写，写完进一级评审被挑毛病；\n第三次是 61–90 天自己建 50 条评测集。三次都有产出物，做不出来一眼能看见。\n我不承诺「都学会」，我承诺「都做过一次，且有人复核」。\n\n（委员：第 60 天发现做不成，你什么时候说、跟谁说、怎么退？）\n\n止损点我定在三个：标注集 60 天做不到 200 条、评测脚本跑不通、\n或者 4 人里有 2 人以上初稿被评审直接退回且原因相同——任一条触发，我在当月对齐会上直接报，\n不拖到季度末。退的方式是裁剪范围：保标注集和评测脚本，砍模板推广，\n因为前两个是资产，模板是流程。\n\n（委员：怎么证明有效，而不是又一份文档？）\n\n三个可查口径：一是语音失败 case 的整理耗时，从单次 6 小时降到 2 小时以内；\n二是需求被研发返工的次数，从平均 2.3 次降到 1 次以内；三是每次 OTA 前是否真的跑了评测集，\n这个看放行单上有没有签字。三个都能数，数不出来就是我这条路线失败。\n\n边界：跨域数据打通不在本季度承诺，涉及出域审批周期不可控，我不拿它充数。", "task": "把《能力建设答辩稿》拿到「转型委员会成员（分管智能化）」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《能力建设答辩稿》。现在要让它通过「转型委员会成员（分管智能化）」这一关。\n【对手的立场】不管你写得多完整，只问三件事：人从哪来、会不会做、做不好怎么办。他会重复追问同一个点，看你是不是在绕。\n【他一定会追问】「这些活现在谁在做？你新增了编制还是让现有的人加班？」 / 「现有 PM 没做过 AI 功能，你凭什么认为 90 天能上手？」 / 「如果第 60 天发现做不成，你什么时候说、跟谁说、怎么退？」\n【场景】你说「转型委员会质疑「路线落不了人」」，对方立刻回一句：这些活现在谁在做？你新增了编制还是让现有的人加班？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["编制问题给出明确来源（内部调配 / 新增 / 外部支持），不说「靠大家努力」", "能力问题落到具体动作（谁在什么时候完成哪次实战），不说「加强培训」", "能主动给出止损点：什么条件下承认做不成、什么时候上报", "有效性有可查口径（评测集通过率、返工次数、决策周期），不用「提升效率」这种词"]}]}, {"id": "M3", "title": "M3 车端 PRD 与端云约束", "dims": ["content", "product", "data"], "units": [{"id": "M3U1", "tier": "basic", "step": "understand", "title": "车端 PRD 与互联网 PRD 的五处不同", "video": {"dur": "3.6min", "script": ["车端 PRD 缺的不是文采，是约束：不写资源预算和降级矩阵，架构师无法评估，只能退回", "五处差异对照（时延 / 资源 / 离线 / 降级 / 合规）+ 每处给一个可写进 PRD 的字段", "Z 汽车 一位从互联网转来的 PM，把详情页 PRD 的写法搬到座舱功能上，评审被退回三次"]}, "ppt": {"method": "五处差异对照（时延 / 资源 / 离线 / 降级 / 合规）+ 每处给一个可写进 PRD 的字段", "case": "Z 汽车 一位从互联网转来的 PM，把详情页 PRD 的写法搬到座舱功能上，评审被退回三次", "demo": "同一份需求，用互联网写法与车端写法各写一遍，逐段对比"}, "objective": "能说出车端 PRD 与互联网 PRD 的五处硬差异，并在自己最近一份 PRD 里逐条标出缺哪几处", "transfer": "把手上最近一份 PRD 按五处差异补一版，标出新增的资源预算表与降级矩阵，发给架构师过一眼", "vslides": [{"t": "差别不在文采，在约束", "n": "互联网 PRD 和车端 PRD 的差别，不在写得好不好，在约束多不多。互联网产品的资源是弹性的：服务器不够就扩容，网慢了就等一等，出问题发个版就修。车端不是。算力是买车时就定死的，网络在隧道里是断的，版本发出去要召回才能改。所以同一句「语音助手支持连续对话」，写在互联网 PRD 里能过，写在车端 PRD 里会被退回，因为它没说清：跑在端侧还是云端、占多少算力、断网怎么办、识别错了怎么降级。车端 PRD 的价值不在于把功能描述得多好，而在于把所有会让这个功能失效的条件提前写清楚。写清楚了，架构师才知道怎么给你排资源；写不清楚，他只能按最保守的方式估，你的功能就会被砍。被砍不是因为这个功能不好，是因为没人敢给一个说不清边界的方案排资源。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">互联网 PRD</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">车端 PRD</tspan></text><g data-k=\"['互联网：资源弹性·随时发版']\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">['互联网：资源弹性·随</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">时发版']</tspan></text></g><g data-k=\"['车端：算力定死·召回才能改']\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">['车端：算力定死·召回</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">才能改']</tspan></text></g></svg>", "d": 73.44}, {"t": "五处差异，每处都对应一个要写的字段", "n": "第一处，时延。要写端到端预算，拆成采集、推理、执行三段，各给上限，比如唤醒到执行不超过八百毫秒。第二处，资源。要有一张资源预算表：CPU、NPU、内存、包体积、功耗，写清峰值和常驻。第三处，离线。要定义离线态：哪些能力保留、哪些明确不可用、提示说什么。第四处，降级。要有一张降级矩阵：场景乘失效原因，交叉格子里写动作和话术。第五处，合规。功能安全等级与数据出域判定，这两项产品不能自己定，但必须在 PRD 里留位置、写清由谁定。五处里最容易被漏掉的是第三和第四处，因为它们只在坏情况下才发生，而写 PRD 的人习惯想好情况。所以写车端 PRD，顺序要反过来：先想坏情况，再想好情况。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五处差异</tspan></text><g data-k=\"时延预算\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">时延预算</tspan></text></g><g data-k=\"资源预算表\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">资源预算表</tspan></text></g><g data-k=\"离线态定义\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">离线态定义</tspan></text></g><g data-k=\"降级矩阵\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">降级矩阵</tspan></text></g><g data-k=\"安全与出域判定\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">安全与出域判定</tspan></text></g></svg>", "d": 74.9}, {"t": "两个常见写法，和一条不能越的线", "n": "第一种常见写法：把降级写成「异常时提示用户重试」。这句话等于没写，因为开发和测试都不知道该提示什么、重试几次、失败之后界面停在哪。正确写法是三步：云端超时三秒切端侧，端侧置信度低于阈值复述确认一次，仍失败则明示不可用并保留物理按键。第二种常见写法：资源预算写「占用较低」。较低是多少？必须给数，哪怕是估算也要标「待实测」。还有一条线不能越：功能安全等级和数据出域，这两项由安全工程师和合规判断，产品在 PRD 里写的是「待定级」和「待判定」，而不是自己填一个 QM 或「应该可以」。填了，责任就落到你身上，而你没有判定依据。留白不是不负责，是让该负责的人来负责。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"降级要写三步动作\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">降级要写三步动作</tspan></text></g><g data-k=\"资源要给数或标待测\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">资源要给数或标待测</tspan></text></g><g data-k=\"安全等级不自己填\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">安全等级不自己填</tspan></text></g></svg>", "d": 66.43}], "deliverable": {"type": "skill", "name": "车端 PRD 自查表", "rubric": ["差异准确", "字段可写", "补齐到位"], "acceptance": "能对自己一份 PRD 逐条判断五处差异是否写到位，并给出补齐的具体字段"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】五处差异对照（时延 / 资源 / 离线 / 降级 / 合规）+ 每处给一个可写进 PRD 的字段\n【为什么重要】车端 PRD 缺的不是文采，是约束：不写资源预算和降级矩阵，架构师无法评估，只能退回\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["五处差异各用一个可写进 PRD 的字段说明，不停留在「车端要求更高」这类判断", "能指出自己 PRD 里具体缺哪几处，并说清缺了会导致什么后果", "降级要写到动作与提示话术，不写「异常时提示用户」", "知道哪两处不能自己拍板（功能安全定级、数据出域），并说清该找谁"]}, {"id": "M3U2", "tier": "basic", "step": "demo", "title": "深度演示：一份能过评审的座舱 PRD 是怎么写出来的", "video": {"dur": "14.6min", "script": ["PRD 的含金量不在篇幅，在后四节——资源预算、降级矩阵、验收测法、非目标，这四节决定它能不能过会", "六节骨架（目标与非目标 / 主流程 / 资源预算 / 降级矩阵 / 验收口径 / 待办）+ 三层降级链 + 逐项测法", "Z 汽车 Z7 的「通勤模式一键切换」，第一版只写主流程，被架构师连退三次"]}, "ppt": {"method": "六节骨架（目标与非目标 / 主流程 / 资源预算 / 降级矩阵 / 验收口径 / 待办）+ 三层降级链 + 逐项测法", "case": "Z 汽车 Z7 的「通勤模式一键切换」，第一版只写主流程，被架构师连退三次", "demo": "逐节走读一份可直接进评审会的 PRD 全文，讲清每一行为什么这么写"}, "objective": "能照着标准件写出含资源预算表、降级矩阵与验收测法的座舱功能 PRD，并说清每一节为什么这么写", "transfer": "48 小时内拿手上一个座舱功能按六节骨架写出第一版，并找架构师要到 NPU 峰值、内存峰值、包体积上限三个数", "vslides": [{"t": "这份 PRD 被退回过三次", "n": "这份 PRD 退回过三次。第一版只写了主流程——功能是什么、怎么用、界面长什么样，架构师看完回一句：资源呢？第二版补了资源，但只写「占用较低」，评审又退：我要峰值和并发。第三版补了降级，还是退，因为每一格写的是「提示用户」，没写提示之后用户还能做什么。第四版才是你现在看到的这份。三次退回，没有一次是因为想法不对，全部是因为后四节写不实。这也是判断 PRD 成熟度的分水岭：前两节写的是你想做什么，后四节写的是这件事在真实约束下还能不能成立。前者靠表达，后者靠功课。接下来十四分钟，我逐节带你看这份文档每一行为什么这么写，看完你要能自己写一份，而不是改一份。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四次版本</tspan></text><g data-k=\"只写主流程\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">只写主流</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">程</tspan></text></g><g data-k=\"补资源（太虚）\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">补资源（</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">太虚）</tspan></text></g><g data-k=\"补降级（只写提示）\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"78.0\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">补降级（</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">只写提示</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">）</tspan></text></g><g data-k=\"六节齐全才过会\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">六节齐全</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">才过会</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.5}, {"t": "先想清楚：这份文档替谁做决定", "n": "动笔之前先做一件事：列出这份文档有哪几个读者，他们各自拿它做什么决定。这份 PRD 有四个读者。架构师拿第三节和第四节做资源决策：这块 SoC 还放不放得下这个功能。测试拿第五节排测法和用例：测什么、怎么测、多少算过。安全与法务拿第一节的非目标做合规判断：你有没有承诺本代做不到的事。项目经理拿第六节排风险和排期。四个读者，四套关注点。所以写的时候有个实用规矩：每写一节，先问这一节是给谁看的，他要拿它做什么决定。答不上来的小节，要么删掉，要么说明你还不知道这份文档要解决什么问题。这一问能省掉大量自嗨式篇幅——PRD 里最没用的部分，往往就是写得最用力的部分。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四个读者四种用法</tspan></text><g data-k=\"架构师→资源与降级\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">架构师→资源与降级</tspan></text></g><g data-k=\"测试→验收测法\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">测试→验收测法</tspan></text></g><g data-k=\"安全法务→非目标\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">安全法务→非目标</tspan></text></g><g data-k=\"项目经理→待办排期\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">项目经理→待办排期</tspan></text></g></svg>", "d": 68.98}, {"t": "全文地图：六节，篇幅不平均", "n": "全文六节：目标与非目标、主流程、资源预算、降级矩阵、验收口径、待办与风险。篇幅不是平均分配的，大约一比一比三比三比二比零点五。前两节写得快，因为 AI 和你都擅长；后四节占七成工作量，也是评审真正会追问的地方。给个参照：这份 PRD 一共约一千九百字，前两节五百字，资源预算和降级各四百字上下，验收三百字。如果你的 PRD 反过来——目标写八百字，资源预算三行——不用等评审，自己就知道问题在哪。还有一个格式建议：资源预算用表格，因为表格逼你每格填数字和来源，写成段落就容易滑过去；降级用矩阵，因为矩阵逼你穷举，写成清单一定会漏。表格和矩阵不是为了好看，是为了不让自己偷懒。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">篇幅配比</tspan></text><g data-k=\"目标与非目标 1 份\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">目标与非目标 1 份</tspan></text></g><g data-k=\"主流程 1 份\"><g><circle cx=\"42\" cy=\"74.66666666666667\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"79.16666666666667\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"79.2\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">主流程 1 份</tspan></text></g><g data-k=\"资源预算 3 份\"><g><circle cx=\"42\" cy=\"97.33333333333334\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"101.83333333333334\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"101.8\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">资源预算 3 份</tspan></text></g><g data-k=\"降级矩阵 3 份\"><g><circle cx=\"42\" cy=\"120.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"124.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">降级矩阵 3 份</tspan></text></g><g data-k=\"验收口径 2 份\"><g><circle cx=\"42\" cy=\"142.66666666666669\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"147.16666666666669\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"147.2\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">验收口径 2 份</tspan></text></g><g data-k=\"待办 0.5 份\"><g><circle cx=\"42\" cy=\"165.33333333333334\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"169.83333333333334\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑥</text></g><text x=\"70.0\" y=\"169.8\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">待办 0.5 份</tspan></text></g></svg>", "d": 70.68}, {"t": "第一节 目标：写成一句能被验收的话", "n": "目标只写一件事：在什么条件下，做什么动作，达到什么门槛。三要素缺一个都不算目标。看这份的写法：主驾一次操作，三秒内完成四项联动，时延 P90 不超过三秒，成功率不低于百分之九十八。条件、动作、门槛全在。反例是「提升座舱体验」「让切换更顺畅」，这类话在评审会上会被问成筛子：怎么衡量顺畅？几秒算顺畅？谁说了算？还有一个容易漏的：适用条件必须写进目标里。这份写的是 P 挡或车速不超过六十公里每小时。为什么？因为超过六十座椅不能动，这是安全约束，不是实现细节。条件不写进目标，测试就会按「任何车速」去测，测出来必然不达标。目标写不实，后面每一节都会跟着虚，所以这一节宁可多改两遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"条件（P 挡或 ≤60）\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">条件（P 挡或 ≤60）</tspan></text></g><g data-k=\"动作（四项联动）\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">动作（四项联动）</tspan></text></g><g data-k=\"门槛（≤3s / ≥98%）\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">门槛（≤3s / ≥98%）</tspan></text></g></svg>", "d": 71.11}, {"t": "第一节 非目标：理由只认四类", "n": "非目标比目标难写，因为它要求你说不，还要说清为什么不。这份 PRD 有四条非目标。不做后排联动，理由是后排执行器型号不统一，改造成本约四百元每台。不做驾驶模式联动，理由是跨域授权，本季度不承诺。不做自定义场景编辑，理由是先用固定场景验证使用率。不做方言入口，理由是方言模型包十二兆，端侧放不下。四条理由分别落在成本、合规、优先级、算力上，这就是非目标能用的四类理由，别的理由评审不认。最常被写坏的一句是「本期不做，后续规划」——这不是理由，这是拖延，等于告诉评审你没想过。还有一条经验：非目标至少三条，这份写了四条，每条都带数字或条款。少于三条，说明你没做取舍，评审一定会追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四条非目标与理由</tspan></text><g data-k=\"成本：后排 +400 元/台\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">成本：后排 +400 元/台</tspan></text></g><g data-k=\"合规：跨域授权\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">合规：跨域授权</tspan></text></g><g data-k=\"算力：方言包 12MB\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">算力：方言包 12MB</tspan></text></g><g data-k=\"优先级：先验使用率\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">优先级：先验使用率</tspan></text></g></svg>", "d": 74.47}, {"t": "第二节 主流程：五步，重点是第二步和第四步", "n": "主流程五步：入口、前置判定、逐项执行、结果播报、状态留存。第一步和第三步是常规动作，真正决定质量的是第二步和第四步。第二步前置判定：这份写的是 P 挡或车速不超过六十允许四项全做，超过六十就跳过座椅并播报原因。为什么要单独一步？因为车端功能的合法性依赖车辆状态，不是所有时刻都能做同一件事。第四步结果播报：全成功说「已切换通勤模式」，部分失败必须说清哪项没成、为什么，这份写的是「已切换，座椅没调，因为车速较高」。这一步最容易被写成「提示用户」，然后开发各自实现，上线后三种播报并存。写主流程时给自己一个检查动作：每一步都问一句「这一步的输出是什么」，答不出来就说明这一步是空的。第五步状态留存也别省，它决定撤销和复用能不能做。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">主流程五步</tspan></text><g data-k=\"入口\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">入口</tspan></text></g><g data-k=\"前置判定（车速）\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">前置判定（车速）</tspan></text></g><g data-k=\"逐项执行\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">逐项执行</tspan></text></g><g data-k=\"结果播报\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">结果播报</tspan></text></g><g data-k=\"状态留存\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">状态留存</tspan></text></g></svg>", "d": 75.34}, {"t": "第三节 资源预算：五个字段，去问五个人", "n": "资源预算五个字段：NPU 占用、常驻内存、峰值内存、包体积、功耗。写之前先接受一个事实：这些数你算不出来，只能去问。NPU 峰值问算法，常驻和峰值内存问座舱软件，包体积问自己，功耗问硬件，时延三段分别问语音、编排和执行器。这份表六个格，五格来自台架实测，一格写待实测，并注明低温零下十度待补、谁负责、什么时候交。三条规矩：不写「较低」「较高」这类形容词；每格必须标来源，实测、台架、供应商文档都行；没测的写「待实测」加一句话说清谁在什么台架测。为什么这么严？因为这张表到了架构师手里，他要拿它做放不放得下的决定。你给他一个模糊的占用率，他只能退回给你；你给他二十二个百分点和测法，他当场就能判。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六个格，五格实测一格待测</tspan></text><g data-k=\"NPU 峰值\"><text x=\"24.0\" y=\"61.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">NPU 峰值</tspan></text><rect x=\"150\" y=\"51\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"51\" width=\"46.2\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"188.2\" y=\"64\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">22%</text></g></g><g data-k=\"常驻内存\"><text x=\"24.0\" y=\"101.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">常驻内存</tspan></text><rect x=\"150\" y=\"91\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"91\" width=\"94.5\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"236.5\" y=\"104\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">45MB</text></g></g><g data-k=\"峰值内存\"><text x=\"24.0\" y=\"141.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">峰值内存</tspan></text><rect x=\"150\" y=\"131\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"131\" width=\"189.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"331.0\" y=\"144\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">90MB</text></g></g><g data-k=\"功耗\"><text x=\"24.0\" y=\"181.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">功耗</tspan></text><rect x=\"150\" y=\"171\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"171\" width=\"63.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"205.0\" y=\"184\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">+2.1W</text></g></g></svg>", "d": 75.17}, {"t": "第三节 时延预算：拆成三段才谈得上优化", "n": "时延是最容易被写成一个总数、然后谁都不认账的指标。这份写的是端到端 P90 不超过三秒，但真正有用的是拆开之后那三行：语音识别四百毫秒，指令编排一百五十毫秒，执行器响应二百五十毫秒乘四、可并行。拆开之后责任就落地了：识别慢找语音团队，编排慢找软件，执行慢找硬件。只写总数，出问题时四方互相看。还有个技巧：写清「可并行」，因为四项联动是同时下发还是串行，时延能差四倍，评审时架构师一定会问这句。最后提醒一句：所有时延都要标 P90 还是均值。这份写 P90，因为用户感受到的是慢的那一次，不是平均那一次。写均值等于给自己留后门，评审看多了会直接问你要 P90，到时候拿不出来，前面写的都白写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">时延三段拆解</tspan></text><g data-k=\"识别 400ms\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">识别 400ms</tspan></text></g><g data-k=\"编排 150ms\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">编排 150ms</tspan></text></g><g data-k=\"执行 250ms×4（并行）\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">执行 250ms×4（并行）</tspan></text></g><g data-k=\"合计 P90 ≤ 3000ms\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">合计 P90 ≤ 3000ms</tspan></text></g></svg>", "d": 71.35}, {"t": "第四节 降级矩阵：六个场景乘四类失效", "n": "降级矩阵的写法是穷举，不是列举。先列场景：地库、隧道、弱网、云端超时、执行器无响应、语音置信度低。再列失效原因：网络不可用、执行超时、结果不确定、能力不存在。两样一乘就是二十四个格子，每格写三样东西：判定条件、动作、话术。这份填了七格，每格都有三样。比如语音置信度低于零点六，动作是复述确认一次，话术是「你是要切通勤模式吗」；二次确认还是失败，动作是明示可用入口，话术是「没听清，你可以点桌面卡片切」。降级链至少三层：云端不行切端侧固定配置，端侧不行降规则，规则不行明示不可用并保留手动入口。这份的终点是「你可以在设置里手动调」。只写一层的方案，遇到第二层失效就抓瞎。判断写没写完的标准很土：把话术念出来，用户听了不知道该干什么，就是没写完。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每格三样：判定条件/动作/话术\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每格三样：判定条件/动作/话术</tspan></text></g><g data-k=\"至少三层：云端→端侧→手动\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">至少三层：云端→端侧→手动</tspan></text></g><g data-k=\"念一遍话术，能听懂才合格\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">念一遍话术，能听懂才合格</tspan></text></g></svg>", "d": 72.07}, {"t": "第五节 验收口径：不写测法等于没定", "n": "验收口径每条三样：指标、门槛、测法。这份五行：端到端时延 P90 不超三秒用实车；四项链全成功率不低于百分之九十八用实车两百次；部分失败话术准确率百分之百用离线回放；语音识别率不低于百分之九十二，在六十公里每小时车内噪声下用实车；降级后用户继续操作率不低于百分之七十用埋点。测法为什么必须写？因为同一个指标换测法，数字会差一大截。时延在实验室测和在实车测不是一个数；识别率在安静环境和六十公里噪声下差十几个点。测法不写，测试只能自己选，测出来的数不可比，最后还是你来背。还有个隐形好处：写测法的时候你会发现自己有些指标根本测不了，那就趁早改成能测的。验收写完的标准是——测试拿到这一节，不用来问你，就能排测法和用例。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五项指标各自的测法</tspan></text><g data-k=\"时延 → 实车\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">时延 → 实车</tspan></text></g><g data-k=\"成功率 → 实车 200 次\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">成功率 → 实车 200 次</tspan></text></g><g data-k=\"话术准确率 → 离线回放\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">话术准确率 → 离线回放</tspan></text></g><g data-k=\"继续操作率 → 埋点\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">继续操作率 → 埋点</tspan></text></g></svg>", "d": 75.12}, {"t": "AI 在这份文档里能干到哪一步", "n": "回到工具。把需求描述丢给模型，让它按六节出骨架，它能给你结构、给你矩阵的行列、给你话术草稿。这三样大概占这份文档六成篇幅，十分钟能出。但它给不了三样东西。第一，数字。它不知道你这块 SoC 还剩多少 NPU，写出来的占用率都是编的，所以提示词里必须写死「数值标待实测，不要编造性能数字」。第二，非目标。模型倾向于把功能写全，你越问它越给你加，非目标是反着来的，只能你自己砍。第三，三层降级到底停在哪。停在手动入口还是停在物理按键，取决于你的车型有没有物理按键，模型不知道。所以正确的用法是：AI 出六节骨架和话术草稿，你补数字、砍非目标、定降级终点。一句话记住分工：结构交给模型，约束留给自己。反过来用——让模型定约束、你只负责润色——产出的文档一定过不了评审，因为约束错了，文笔再好也没用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">分工线</tspan></text><g data-k=\"AI：六节骨架\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">AI：六节</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">骨架</tspan></text></g><g data-k=\"AI：矩阵行列\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">AI：矩阵</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">行列</tspan></text></g><g data-k=\"AI：话术草稿\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">AI：话术</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">草稿</tspan></text></g><g data-k=\"你：数字/非目标/降级终点\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"78.0\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">你：数字/</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">非目标/降</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">级终点</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 80.54}, {"t": "练习换了个功能，你要改哪四处", "n": "接下来要你写的那份 PRD，功能换了：后排儿童模式。同一个域，六节骨架可以照搬，但有四处必须重写。第一，读者变了。安全与法务从「看一眼」变成主要读者，因为涉及儿童，误触发和误锁都是安全问题。第二，非目标变得更关键。比如「不做儿童独自留车监测」，理由是涉及舱内影像与合规，这条必须写在第一节。第三，降级链多一层：涉及儿童的操作要有家长确认，确认不上怎么办——是拒绝执行还是延迟执行，必须写死，不能留给开发。第四，验收多一项：误触发率，也就是不该切的时候切了，这个数比成功率更要紧。四处都改完，才叫换了场景；只改功能名字，等于把上一份抄了一遍。写的时候先别回头看这份全文，自己先写四节，写完再对照，看漏了哪格。这一步的差别，就是会写 PRD 和会复制 PRD 的差别。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四处必须重写</tspan></text><g data-k=\"读者：安全/法务变主审\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">读者：安全/法务变主审</tspan></text></g><g data-k=\"非目标：加合规边界\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">非目标：加合规边界</tspan></text></g><g data-k=\"降级：多一层家长确认\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">降级：多一层家长确认</tspan></text></g><g data-k=\"验收：加误触发率\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">验收：加误触发率</tspan></text></g></svg>", "d": 75.82}], "deliverable": {"type": "skill", "name": "座舱功能 PRD 全文（六节）", "rubric": ["六节齐全", "数字有来源", "降级无空格"], "acceptance": "六节齐全；资源预算每个数值都带来源或测法；降级矩阵没有空格且每格有动作与话术；验收每项写明测法"}, "demo": {"ref": "■ 《通勤模式一键切换 · 车端 PRD》 v1.0\nZ7 座舱域 · 面向 2027 年款 · 编制：座舱域 AI 产品经理 · 评审：架构 / 测试 / 安全 / 项目\n\n【这份文档给谁看，他们各看哪一节】\n· 架构师：看第三节资源预算与第四节降级，判断这块 SoC 还放不放得下\n· 测试：看第五节验收口径，据此排测法与用例\n· 安全与法务：看第一节非目标，确认没有越界的功能承诺\n· 项目经理：看第六节待办与风险，据此定排期\n（同一份 PRD 四个读者。每写一节，先想清楚这一节是给谁看、他要拿它做什么决定。）\n\n一、目标与非目标\n1.1 目标（可验收：条件 + 动作 + 门槛）\n· 主驾一次操作（语音「切通勤模式」或桌面卡片），在 3 秒内完成座椅位置、空调温度、氛围灯、音乐歌单四项联动\n· 端到端时延 P90 ≤ 3s；四项链全成功率 ≥ 98%\n· 适用条件：车辆处于 P 挡，或车速 ≤ 60km/h\n1.2 非目标（每条给理由，理由只认成本 / 算力 / 合规 / 优先级四类）\n· 不做后排联动：后排执行器型号不统一，改造成本约 400 元/台，本代车型不做（成本）\n· 不做驾驶模式联动：涉及动力域跨域授权，本季度不承诺（合规）\n· 不做自定义场景编辑：编辑态交互复杂，先用固定场景验证使用率（优先级）\n· 不做方言语音入口：方言识别模型包体积 12MB，端侧放不下（算力）\n\n二、主流程\n1 入口：语音唤醒「切通勤模式」/ 桌面卡片点击 / 方向盘快捷键长按 2 秒\n2 前置判定：P 挡或车速 ≤ 60 → 允许四项；车速 > 60 → 跳过座椅项并播报原因\n3 逐项执行：座椅 → 空调 → 氛围灯 → 音乐；单项超时 800ms 记失败，但继续执行后续项\n4 结果播报：全成功 → 「已切换通勤模式」；部分失败 → 「已切换，座椅没调，因为车速较高」\n5 状态留存：记录四项执行结果供下次复用；用户可在车内一键撤销\n\n三、资源预算表（字段 / 数值 / 来源）\n· NPU 占用（峰值，与语音识别并发）：22% ／ 台架实测（M3 台架，工具 npu-mon）\n· 常驻内存：≤ 45MB ／ 台架实测\n· 峰值内存：≤ 90MB ／ 台架实测\n· 包体积增量：0.3MB（仅配置文件，无模型文件）／ 实测\n· 功耗增量：执行态 +2.1W，持续约 3s ／ 台架实测\n· 唤醒态待机功耗增量：+0.4W ／ 待实测（-10℃ 低温待补，座舱软件张工，两周内）\n三条规矩：不写「较低 / 较高」；每格标来源；没测的写「待实测 + 谁在什么台架测」。\n\n四、降级矩阵（场景 × 失效原因 → 判定条件 → 动作 → 用户听到的话术）\n· 云端不可用 → 切端侧固定场景配置 → 「网络不太好，用本地配置帮你切」\n· 座椅执行器无响应（>800ms）→ 跳过该项继续 → 「座椅没调成，其他已切好」\n· 车速 > 60 → 跳过座椅项 → 「车速较高，座椅这次不动」\n· 部分项失败 ≥ 2 → 不播报成功，改为逐项说明 → 「空调和音乐好了，座椅和氛围灯没成」\n· 语音置信度 < 0.6 → 复述确认一次 → 「你是要切通勤模式吗」\n· 二次确认仍失败 → 明示可用入口 → 「没听清，你可以点桌面卡片切」\n· 四项全失败 → 明示不可用并保留手动入口 → 「这次没切成功，你可以在设置里手动调」\n三层降级链：云端 → 端侧固定配置 → 手动入口。每层都要有落点和话术，不许只写一层。\n\n五、验收口径（指标 / 门槛 / 测法）\n· 端到端时延 P90 ≤ 3s ／ 实车\n· 四项链全成功率 ≥ 98% ／ 实车 200 次\n· 部分失败时话术准确率 100%（禁止播报「全部成功」）／ 离线回放\n· 语音识别率 ≥ 92%（60km/h 车内噪声）／ 实车\n· 降级触发后用户继续操作率 ≥ 70% ／ 埋点\n不写测法的口径等于没定：离线回放、实车、仿真、埋点各管一段，混用会让数字不可比。\n\n六、待办与风险\n· 座椅执行器 -10℃ 低温响应时间待测（影响时延预算）→ 座舱软件 张工，两周内\n· 与动力域的驾驶模式联动评估 → 产品 本人，下季度\n· 后排联动改造成本需硬件出正式报价 → 硬件 李工，本月底", "fix": ["给资源预算补上「待实测那格是谁测」：座舱软件张工、M3 台架、两周内——AI 只会写「待实测」，不会写责任人和台架。", "补一条 AI 一定漏的降级：二轮监听/执行过程中用户改说别的指令（如导航中途说开空调），要写清是打断还是排队。", "把「3 秒」「800ms」这些数字标上来由：是台架实测还是行业惯例，否则评审会追一句「谁定的」。", "在非目标里补一条「多人同时说话的处理策略」，写成「本代不做，仅保留主驾优先」——这类边界不写，上线后一定被投诉。"], "judge": "判断依据：有没有凭空出现时延或占用数字（有就是编的）；资源预算每格是否带来源；降级矩阵是否每格都有判定条件、动作、话术；验收口径是否写了测法；非目标是否四条以上且带理由"}, "deep": true, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是 Z 汽车 Z7 座舱域一个待立项功能的需求描述与现有条件（已脱敏）：[功能描述：语音说「切通勤模式」，一次完成座椅位置、空调温度、氛围灯、音乐歌单四项联动] [现有条件：座舱 SoC 型号与 NPU 余量、内存上限、麦克风阵列、是否支持端侧语音识别、云端时延区间、后排执行器型号是否统一] 请按六节输出 PRD：目标与非目标、主流程、资源预算表、降级矩阵、验收口径、待办与风险。三条硬要求：① 资源预算一栏只给字段名与单位，数值一律写「待实测」，并注明该由谁在什么台架上测，绝不编造任何性能数字；② 降级矩阵按「场景 × 失效原因」列表格，每格必须写判定条件、动作、用户听到的话术；③ 非目标至少四条，每条给成本、算力、合规或优先级上的理由。凡是你无法从给定材料确认的信息，标注「需我补证」。"}, "task": "在 WorkBuddy 里把「六节骨架（目标与非目标 / 主流程 / 资源预算 / 降级矩阵 / 验收口径 / 待办）+ 三层降级链 + 逐项测法」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】六节骨架（目标与非目标 / 主流程 / 资源预算 / 降级矩阵 / 验收口径 / 待办）+ 三层降级链 + 逐项测法\n【参考案例】Z 汽车 Z7 的「通勤模式一键切换」，第一版只写主流程，被架构师连退三次\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是 Z 汽车 Z7 座舱域一个待立项功能的需求描述与现有条件（已脱敏）：[功能描述：语音说「切通勤模式」，一次完成座椅位置、空调温度、氛围灯、音乐歌单四项联动] [现有条件：座舱 SoC 型号与 NPU 余量、内存上限、麦克风阵列、是否支持端侧语音识别、云端时延区间、后排执行器型号是否统一] 请按六节输出 PRD：目标与非目标、主流程、资源预算表、降级矩阵、验收口径、待办与风险。三条硬要求：① 资源预算一栏只给字段名与单位，数值一律写「待实测」，并注明该由谁在什么台架上测，绝不编造任何性能数字；② 降级矩阵按「场景 × 失效原因」列表格，每格必须写判定条件、动作、用户听到的话术；③ 非目标至少四条，每条给成本、算力、合规或优先级上的理由。凡是你无法从给定材料确认的信息，标注「需我补证」。", "rubric": ["六节齐全，且资源预算给的是「字段 + 数值 + 来源」，不是形容词", "降级矩阵按场景乘失效原因展开，每格有判定条件、动作与话术，且至少三层降级", "验收口径每项都写了测法（离线回放 / 实车 / 仿真 / 埋点）与门槛值", "非目标不少于四条，每条理由落在成本、算力、合规或优先级上，并尽量带数字"]}, {"id": "M3U3", "tier": "basic", "step": "todo", "title": "产出《后排儿童模式 PRD》", "video": {"dur": "3.5min", "script": ["让安全工程师在评审会上点头排期——他只认降级链和家长确认这两件事", "沿用六节骨架，换到安全相关的后排场景：读者、非目标、家长确认层、误触发率四处必须重写", "Z 汽车 上一个座舱功能（通勤模式）第一版被退回三次，补完六节才过会"]}, "ppt": {"method": "沿用六节骨架，换到安全相关的后排场景：读者、非目标、家长确认层、误触发率四处必须重写", "case": "Z 汽车 上一个座舱功能（通勤模式）第一版被退回三次，补完六节才过会", "demo": "按六节骨架逐节填，资源预算每格标来源，降级矩阵不留空格"}, "objective": "产出一份含资源预算表、降级矩阵与验收测法的后排儿童模式 PRD，且降级每格都有动作与话术", "transfer": "拿这份 PRD 找架构师做一次 30 分钟资源评审，把他的反馈改进文档形成第二版，并抄送安全工程师", "vslides": [{"t": "换场景不是换名字：四处会直接翻车", "n": "把上一份 PRD 改个功能名就交，四处会当场翻车。第一处是读者：儿童功能的主审不是架构师，是安全工程师，他看的是第一节非目标和第四节降级，你如果还按资源视角写，他会认为你没意识到这是安全相关功能。第二处是非目标：涉及儿童的边界要主动写死，比如不做儿童独自留车监测、不做舱内影像上传，理由写合规，而不是等评审来问。第三处是家长确认：上一份的降级终点是手动入口，这一份不行，涉及儿童的操作必须有确认，确认不上要写清是拒绝执行还是延迟执行。第四处是验收：上一份看成功率，这一份先看误触发率，也就是不该切的时候切了，这个数比成功率更要紧。四处都是因为场景性质变了，不是因为功能变了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四处会翻车</tspan></text><g data-k=\"读者换成安全主审\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">读者换成安全主审</tspan></text></g><g data-k=\"非目标写死合规边界\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">非目标写死合规边界</tspan></text></g><g data-k=\"降级加家长确认\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">降级加家长确认</tspan></text></g><g data-k=\"验收先看误触发\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">验收先看误触发</tspan></text></g></svg>", "d": 66.91}, {"t": "家长确认这一层，必须写死", "n": "家长确认是这份 PRD 里最难写、也最容易被跳过的一层。要写清四件事。第一，谁算家长：是主驾，还是车内有绑定关系的手机，还是任意成人，三选一必须写死，否则开发会挑最容易实现的那个。第二，怎么确认：语音确认、屏幕点按还是手机推送，涉及儿童时要优先选不易误触的。第三，确认超时怎么办：三十秒没确认，是拒绝执行还是按默认值执行，这一条必须给结论，写成「视情况而定」等于没写。第四，确认失败要不要留痕：留痕意味着要落日志，落日志就涉及数据保留期和合规，这一条要和非目标对上。四件事写完，这一层才算能开发。经验上，评审时被追问最多的就是「确认不上怎么办」，答不出来整份方案会被挂起。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"谁算家长（三选一）\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">谁算家长（三选一）</tspan></text></g><g data-k=\"怎么确认（防误触优先）\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">怎么确认（防误触优先）</tspan></text></g><g data-k=\"超时是拒绝还是默认\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">超时是拒绝还是默认</tspan></text></g><g data-k=\"失败要不要留痕\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">失败要不要留痕</tspan></text></g></svg>", "d": 72.98}, {"t": "交之前，用这五个问题自检一遍", "n": "交之前用五个问题自检，全过再提评审。第一，六节是不是都有，字数配比是不是大致一比一比三比三比二？第二节写八百字、第三节三行，说明你还没做功课。第二，资源预算六格里，有没有一格写着「较低」或「不影响」？有一格就重写，改成数字加来源。第三，降级矩阵有没有空格？空格就是没设计，评审会逐个问你填。第四，随便挑一句话术念出来，用户听完知道下一步做什么吗？不知道就重写。第五，验收口径里每一行都有测法吗？没测法的指标等于没定，测试会自己挑一个，最后数不可比。五个问题花二十分钟，能省一次退回，也能省你和架构师之间两轮拉扯。自检这件事不用靠能力，靠的是愿不愿意在交之前多看一眼。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">交前五问</tspan></text><g data-k=\"六节齐全且配比合理\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">六节齐全且配比合理</tspan></text></g><g data-k=\"资源每格是数字+来源\"><g><circle cx=\"42\" cy=\"79.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"83.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"83.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">资源每格是数字+来源</tspan></text></g><g data-k=\"降级矩阵无空格\"><g><circle cx=\"42\" cy=\"106.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">降级矩阵无空格</tspan></text></g><g data-k=\"话术能听懂\"><g><circle cx=\"42\" cy=\"133.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"138.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"138.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">话术能听懂</tspan></text></g><g data-k=\"验收每行有测法\"><g><circle cx=\"42\" cy=\"160.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"165.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"165.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">验收每行有测法</tspan></text></g></svg>", "d": 68.93}], "deliverable": {"type": "skill", "name": "后排儿童模式 PRD", "rubric": ["约束写全", "降级可执行", "安全边界清"], "acceptance": "六节齐全；资源预算每格带来源；降级矩阵不留空格且含家长确认失败一层；验收含误触发率与测法；非目标至少四条"}, "practice": {"steps": ["写读者清单：这份 PRD 谁会看、各拿它做什么决定（安全工程师必须是其中之一）", "写目标与非目标：目标带条件与门槛；非目标至少四条，其中至少一条是合规理由", "画主流程：入口、前置判定（车速 / 后排是否有乘员 / 家长是否在车）、执行、播报、状态留存", "填资源预算表：NPU、内存、包体积、功耗、时延三段；每格标来源，没测的写待实测＋谁测", "写降级矩阵：场景乘失效原因，每格给判定条件、动作、话术；家长确认失败这一层必须写死", "写验收口径：五项指标各写门槛与测法，其中必须含误触发率"], "exemplar": ""}, "task": "产出《后排儿童模式 PRD》：写读者清单：这份 PRD 谁会看、各拿它做什么决定（安全工程师必须是其中之一）；写目标与非目标：目标带条件与门槛；非目标至少四条，其中至少一条是合规理由；画主流程：入口、前置判定（车速 / 后排是否有乘员 / 家长是否在车）、执行、播报、状态留存；填资源预算表：NPU、内存、包体积、功耗、时延三段；每格标来源，没测的写待实测＋谁测；写降级矩阵：场景乘失效原因，每格给判定条件、动作、话术；家长确认失败这一层必须写死；写验收口径：五项指标各写门槛与测法，其中必须含误触发率", "brief": "【你的角色】你是「Z 汽车」负责「Z7」的座舱域 AI 产品经理。本单元属于「M3 车端 PRD 与端云约束」模块，你要交付的是《后排儿童模式 PRD》。\n【场景】业务侧这周的诉求是：让安全工程师在评审会上点头排期——他只认降级链和家长确认这两件事。参考做法：Z 汽车 上一个座舱功能（通勤模式）第一版被退回三次，补完六节才过会。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（沿用六节骨架，换到安全相关的后排场景：读者、非目标、家长确认层、误触发率四处必须重写），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《后排儿童模式 PRD》填写模板】\n\n■ 1. 写读者清单：这份 PRD 谁会看、各拿它做什么决定（安全工程师必须是其中之一）\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写目标与非目标：目标带条件与门槛；非目标至少四条，其中至少一条是合规理由\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 画主流程：入口、前置判定（车速 / 后排是否有乘员 / 家长是否在车）、执行、播报、状态留存\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 填资源预算表：NPU、内存、包体积、功耗、时延三段；每格标来源，没测的写待实测＋谁测\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写降级矩阵：场景乘失效原因，每格给判定条件、动作、话术；家长确认失败这一层必须写死\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 写验收口径：五项指标各写门槛与测法，其中必须含误触发率\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 7. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？", "rubric": ["读者清单里写了安全工程师，并说明他看哪一节", "非目标至少四条，至少一条落在合规（如舱内影像、儿童独自留车），且带理由", "资源预算五项齐全，每格标来源（实测 / 台架 / 待实测＋责任人），不出现「较低」「较高」", "降级矩阵每格有判定条件、动作、话术，且写了家长确认失败时是拒绝执行还是延迟执行", "验收口径含误触发率，并写明测法（离线回放 / 实车 / 仿真 / 埋点）与门槛"]}, {"id": "M3U4", "tier": "basic", "step": "spar", "title": "架构师挑战你的资源预算", "video": {"dur": "3.3min", "script": ["资源评审不看你写得多完整，看你有没有量过", "三个数回应（占用 / 峰值 / 功耗）+ 降级版方案", "Z 汽车 架构师在评审会上只问三句：占多少、什么时候占、砍掉哪部分还能用"]}, "ppt": {"method": "三个数回应（占用 / 峰值 / 功耗）+ 降级版方案", "case": "Z 汽车 架构师在评审会上只问三句：占多少、什么时候占、砍掉哪部分还能用", "demo": "现场演练：三轮追问后拿到资源，或拿到一个明确的替代方案"}, "objective": "能用具体数字回应资源质疑，被要求砍功能时能给出降级版而不是全盘放弃", "transfer": "下次资源评审前，把 NPU、内存、功耗三个数先测一遍，带着数去而不是带着方案去", "vslides": [{"t": "资源评审只看一件事：你量过没有", "n": "资源评审看起来在争资源，其实只考一件事：你量过没有。量过的人，说的是峰值多少、并发多少、在哪个台架测的、波动多大；没量过的人，说的是占用较低、影响可控、应该没问题。架构师每天听十份方案，三句话就能分辨。这不是态度问题，是方法问题：很多产品经理不知道去哪要这些数。答案是三个口子——算法团队给 NPU 与内存，座舱软件给并发下的余量，硬件给功耗与暗电流。要到之后自己上过一次台架，哪怕只测一个场景，你的说法就完全不一样了。所以资源评审的准备不是改 PPT，是提前两周去排队测一次。排队可能占掉两天，但能让你后面三个月说话都算数。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">准备动作</tspan></text><g data-k=\"要数：算法/软件/硬件\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">要数：算法/软</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">件/硬件</tspan></text></g><g data-k=\"上台架实测一次\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">上台架实测一次</tspan></text></g><g data-k=\"带峰值与并发去评审\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">带峰值与并发去</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">评审</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 60.53}, {"t": "三个数，和被追问时的答法", "n": "三个数必须张口就来：峰值占用、并发占用、可砍项。峰值占用要说明出现在什么时刻，比如四项联动同时下发指令的那三百毫秒。并发占用要给最坏组合，语音加导航加当前功能同时跑是多少。可砍项是第三个数，也是最容易被忽略的：你要提前想好砍哪部分、砍完降多少、体验差在哪。被追问时有个技巧：先报数，再报测法，最后报误差。比如峰值 8%，台架实测五十次，波动正负 1.2%。这三句说完，对方基本不会再追。反过来，如果你先说功能多重要，再说资源不多，对方只会觉得你在讨价还价。报数的顺序也重要：先峰值，再并发，最后可砍项。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三个数</tspan></text><g data-k=\"峰值：出现在什么时刻\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">峰值：出现在什么时刻</tspan></text></g><g data-k=\"并发：最坏组合是多少\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">并发：最坏组合是多少</tspan></text></g><g data-k=\"可砍项：砍哪块、降多少、差在哪\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">可砍项：砍哪块、降多少、差在哪</tspan></text></g></svg>", "d": 62.81}, {"t": "两个失分动作", "n": "第一个失分动作：把资源问题推回去。「这个要研发想办法」这句话一出口，评审就结束了，因为你没有承担产品该承担的取舍。正确做法是带着选项去：A 方案占 32% 但体验完整，B 方案占 18% 但音乐要等 1.5 秒，我建议 B，理由是埋点显示用户切换后十秒内会继续操作，这 1.5 秒被盖住了。第二个失分动作：替架构师判断全局。「别的地方可以省一点」这种话不该由你说，因为你不知道别人的账。你只报自己这一块的占用和可砍项，腾挪由架构师决定。这条边界守住了，反而更容易拿到资源，因为你显得可信。会守边界的人，拿到的资源往往比会争的人多。资源评审不是辩论赛，是让人相信你的数。被追问三轮还能报出同一组数，这本身就是可信度。进评审会前把这三个数写在一张卡片上摆在手边，被问就照着念，别临场算。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"不把问题推给研发\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不把问题推给研发</tspan></text></g><g data-k=\"带方案而不是带诉求\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">带方案而不是带诉求</tspan></text></g><g data-k=\"不替架构师判断全局\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替架构师判断全局</tspan></text></g></svg>", "d": 75.12}], "deliverable": {"type": "skill", "name": "资源评审记录", "rubric": ["数字具体", "取舍清晰", "不越权"], "acceptance": "能产出《资源评审记录》并通过本单元评分要点"}, "spar": {"role": "座舱架构师", "persona": "管着整个座舱的资源账本，最烦「占用很低」。他不管你的功能多重要，只关心峰值会不会顶到别人。他会连着追问同一个数三次，看你是不是在估", "mustAsk": ["这功能占多少 NPU？峰值还是均值？", "跟导航、语音识别并发的时候是多少？你测过吗？", "内存峰值九十兆，我这只剩六十兆，你砍哪部分？", "砍完之后体验差多少，用户能接受吗？"]}, "exemplar": "（架构师：这功能占多少 NPU？峰值还是均值？）\n\n峰值 8%，均值 3%。峰值出现在四项联动同时下发指令的那 300 毫秒内。\n台架实测，工具 npu-mon，样本 50 次，波动 ±1.2%。\n\n（架构师：跟导航、语音识别并发的时候是多少？你测过吗？）\n\n测过，三种并发都跑了：与导航并发 12%，与语音识别并发 22%，三个同时 26%。\n这三个数是台架环境，实车因为温度会影响降频，我按 1.2 倍留了余量，即按 32% 报。\n\n（架构师：内存峰值九十兆，我这只剩六十兆，你砍哪部分？）\n\n砍音乐歌单预加载，这一项占 35MB，砍完峰值降到 55MB。\n砍完的体验差别：切模式后音乐不会立刻播，要等 1.5 秒左右加载，其他三项不受影响。\n第二刀可以砍氛围灯的渐变效果，占 12MB，但这项体验损失明显，我不建议先砍。\n\n（架构师：砍完之后体验差多少，用户能接受吗？）\n\n按我们现有的场景模式使用数据，用户切换后 80% 会在 10 秒内继续操作其他功能，\n1.5 秒的音乐加载在这段时间里基本被盖住。这一条我没有实车验证，只是埋点推断，\n所以我建议先上砍过的版本，跑两周看「切换后立即调整音乐」的操作占比，\n超过 15% 我再申请把这 35MB 要回来。\n\n边界：资源怎么腾挪是架构的账，我只报我这一块的占用和可砍项，不替你判断别处能不能让。", "task": "把《资源评审记录》拿到「座舱架构师」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《资源评审记录》。现在要让它通过「座舱架构师」这一关。\n【对手的立场】管着整个座舱的资源账本，最烦「占用很低」。他不管你的功能多重要，只关心峰值会不会顶到别人。他会连着追问同一个数三次，看你是不是在估。\n【他一定会追问】「这功能占多少 NPU？峰值还是均值？」 / 「跟导航、语音识别并发的时候是多少？你测过吗？」 / 「内存峰值九十兆，我这只剩六十兆，你砍哪部分？」\n【场景】你说「架构师挑战你的资源预算」，对方立刻回一句：这功能占多少 NPU？峰值还是均值？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每个资源数字都标明是实测还是估算，估算要说清依据和误差范围", "被指出余量不足时，直接给砍哪部分、砍完体验差多少，不重讲功能价值", "能给出一个降级版方案（如先做两项联动），并说明验证路径", "不替架构师判断资源能否腾挪，只提供自己功能的账"]}, {"id": "M3U5", "tier": "adv", "step": "understand", "title": "端云分工：什么必须在车端、什么必须上云", "video": {"dur": "3.6min", "script": ["端云放错位置，功能不是变慢，是直接不可用，而这类错误在 PRD 阶段最容易被放过", "三判据（实时性 / 隐私 / 成本）+ 一条反向校验（能上端不等于该上端）", "Z 汽车 把一个本该端侧做的唤醒判断放到云端，结果地库场景全军覆没"]}, "ppt": {"method": "三判据（实时性 / 隐私 / 成本）+ 一条反向校验（能上端不等于该上端）", "case": "Z 汽车 把一个本该端侧做的唤醒判断放到云端，结果地库场景全军覆没", "demo": "用三判据给五个功能逐个判端云归属，找出放错的那个"}, "objective": "能对一条功能给出端云切分方案，并说清三个判据各自的分量，而不是笼统「上云更聪明」", "transfer": "把本域三个已上线功能按三判据重新判一次端云归属，找出一个放错位置的", "vslides": [{"t": "端云不是技术选型，是体验与成本的分配", "n": "端云分工经常被当成技术选型，交给架构师定。其实它决定了三件产品经理要负责的事：多快、多可靠、多贵。放端侧，快且断网可用，但模型小、迭代要跟整车版本；放云端，模型大、迭代快，但慢、依赖网络、每次调用都产生成本。所以端云归属不是「哪边技术更强」，是「你愿意为这个功能付多少时延、多少可用性、多少钱」。最典型的错配是唤醒判断放云端：听起来合理，云端模型更准，但地库和隧道没网，唤醒直接失效，用户的第一感受是这车语音是坏的。这个错误在 PRD 阶段最容易被放过，因为评审时大家都在看功能描述，没人问断网了怎么办。如果一份 PRD 里没有一处提到断网，那它一定不是车端的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">端侧</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">云端</tspan></text><g data-k=\"['端侧：快·离线可用·迭代慢']\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">['端侧：快·离线可用·</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">迭代慢']</tspan></text></g><g data-k=\"['云端：聪明·迭代快·依赖网络']\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">['云端：聪明·迭代快·</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">依赖网络']</tspan></text></g></svg>", "d": 65.28}, {"t": "三个判据，加一条反向校验", "n": "判据一，实时性。交互链路里人感知得到的延迟阈值大概在八百毫秒，超过就要做端侧，或者做端侧预判加云端校正。判据二，隐私。涉及车内影像、声纹、精确位置的原始数据，优先端侧处理，只上传结论或特征，不上传原始数据。判据三，成本。云端推理按次计费，一个日活十万次的功能，成本会随规模线性涨；端侧是一次性投入，边际成本接近零。三条都指向端侧时，还要做一条反向校验：能上端，是不是该上端？因为端侧要占算力、要进包体、要跟 OTA 版本，如果你的模型三个月就要换一版，放端侧会让每次迭代都变成整车发版。这时候合理的选择是端侧做兜底、云端做增强。这条反向校验还有个用处：能让你的方案在评审时显得成熟。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三个判据</tspan></text><g data-k=\"实时性\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">实时性</tspan></text></g><g data-k=\"隐私\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">隐私</tspan></text></g><g data-k=\"成本\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">成本</tspan></text></g></svg>", "d": 76.22}, {"t": "三种放错位置，代价各不一样", "n": "第一种，该端侧放云端：代价是不可用。唤醒、刹车灯识别、车内手势这类要求即时响应的，断网就等于没有。第二种，该云端放端侧：代价是天花板。把大模型硬塞进座舱 SoC，结果只能是砍能力、砍上下文，最后做出一个「听起来像 AI 但什么都不会」的助手。第三种，两边都做但没写清主备：代价是行为不一致。同一个指令，有网时走云端、没网时走端侧，回答风格和能力范围都不一样，用户会觉得这车「时好时坏」。正确写法是明确主路径与兜底路径，并在播报话术上做区分，让用户知道现在在用什么。这三种错，前两种在 PRD 阶段能看住，第三种只能靠降级矩阵写清楚。三种错配里，第三种最常见，也最难在上线前发现。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三种错配</tspan></text><g data-k=\"该端放云 → 不可用\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">该端放云 → 不可用</tspan></text></g><g data-k=\"该云放端 → 天花板被砍\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">该云放端 → 天花板被砍</tspan></text></g><g data-k=\"两边都做没写主备 → 行为不一致\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">两边都做没写主备 → 行为不一致</tspan></text></g></svg>", "d": 76.25}], "deliverable": {"type": "skill", "name": "端云归属判定表", "rubric": ["判据清晰", "归属有据", "反向校验"], "acceptance": "能对每个功能给出归属、判据分量与反向校验理由，且指出一个当前放错的案例"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三判据（实时性 / 隐私 / 成本）+ 一条反向校验（能上端不等于该上端）\n【为什么重要】端云放错位置，功能不是变慢，是直接不可用，而这类错误在 PRD 阶段最容易被放过\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三个判据各能举一个本域例子，说清各自在什么情况下是决定性的", "能指出一个当前放错位置的功能，并说明放错的代价（时延、可用性或成本）", "做反向校验：能上端但不上端的理由（迭代成本、包体积、算力挤占）", "不使用「云端更智能」这类笼统理由，每个结论都落在具体约束上"]}, {"id": "M3U6", "tier": "adv", "step": "demo", "title": "用 AI 跑两版端云拆分方案做取舍", "video": {"dur": "3.6min", "script": ["端云之争很少是技术问题，是没人把三项代价摆到同一张表上", "两版方案（端侧优先 / 云端优先）× 三项取舍（时延 / 成本 / 迭代）", "Z 汽车 座舱知识问答功能，端侧与云端两派争了两周没结论"]}, "ppt": {"method": "两版方案（端侧优先 / 云端优先）× 三项取舍（时延 / 成本 / 迭代）", "case": "Z 汽车 座舱知识问答功能，端侧与云端两派争了两周没结论", "demo": "在 WorkBuddy 里跑一遍「双方案对比」提示词"}, "objective": "能对同一功能出两版端云方案，并用时延、成本、迭代速度三项做出可签字的取舍", "transfer": "把手上一个正在争的方案做成两版对比表，拿着表去开会，而不是在会上现算", "vslides": [{"t": "两版方案，要放在同一张表上比", "n": "端云之争之所以吵不出结论，通常不是因为技术难，是因为两边说的不是同一件事：一派说体验，一派说成本，中间没有人把六项代价摆到一张表上。要摆的六行是：首字时延、离线可用性、单次成本、迭代周期、包体积、风险。每行给两版的数字或区间，没有数的写待实测或待询价。摆完之后你会发现，多数争论其实是三个具体数字的分歧：日均请求量多少、云端单价多少、端侧压缩后准确率掉多少。把这三个数拿到，结论往往十分钟就出来了。拿不到数的争论，本质上是立场之争。所以做对比表不是为了好看，是为了把争论从立场变成数字。表做出来，会就开完了一半。表的最后一列永远留给风险，因为风险决定这个方案敢不敢签。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六行对比</tspan></text><g data-k=\"首字时延\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">首字时延</tspan></text></g><g data-k=\"离线可用\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">离线可用</tspan></text></g><g data-k=\"单次成本\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">单次成本</tspan></text></g><g data-k=\"迭代周期\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">迭代周期</tspan></text></g><g data-k=\"包体积\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">包体积</tspan></text></g><g data-k=\"风险\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">风险</tspan></text></g></svg>", "d": 68.81}, {"t": "推荐结论必须带条件，否则等于没结论", "n": "光有对比表还不够，会上一定要有人给结论。但结论不能是「我推荐 B」，要写成「我推荐 B，前提是三条」。比如：日均请求量低于三万次、端侧兜底覆盖二十条高频问答、答案侧加内容过滤。这样写的好处是，任何一条不成立，结论就能翻转，讨论立刻聚焦到那条前提上，而不是重新吵一遍。反过来，如果你只给结论不给条件，对方一旦质疑，你只能靠音量。另外，推荐里要写清「为什么不选另一版」，一句话就够，但要具体：不是「端侧能力不够」，而是「压缩到可上车规模后准确率下降，这个功能的价值恰恰在什么都问得到，砍到这个程度不如不做」。放弃理由要写得让人觉得你真试过，而不是没试就否了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">结论写法</tspan></text><g data-k=\"对比表\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">对比表</tspan></text></g><g data-k=\"推荐结论\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">推荐结论</tspan></text></g><g data-k=\"三条适用条件\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">三条适用</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">条件</tspan></text></g><g data-k=\"放弃另一版的理由\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">放弃另一</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">版的理由</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.09}, {"t": "云端方案的两个隐性成本", "n": "选云端的人通常只看两笔账：推理单价和流量。还有两笔容易被漏掉。第一笔，幻觉。用车知识问答里，模型很可能会编保养周期、编续航衰减曲线，而这些数在车端明明有。兜底写法是：涉及车辆参数的问答必须引用车端数据，模型只负责组织语言，不负责给数。第二笔，内容合规。开放域问答意味着用户什么都可能问，答案必须过滤，过滤就会带来时延和误杀。这两笔在 PRD 里不写，上线后一定变成投诉和合规问题。所以云端方案的完整成本是四笔：单价、流量、幻觉兜底、内容过滤。前两笔能算，后两笔只能靠设计规避。四笔账都算完，你才知道这个功能到底贵不贵。漏掉后两笔的方案，往往在灰度第三周被投诉推着改，那时改的是架构，不是文案。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"幻觉：车辆参数必须引车端数据\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">幻觉：车辆参数必须引车端数据</tspan></text></g><g data-k=\"内容过滤：时延与误杀\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">内容过滤：时延与误杀</tspan></text></g><g data-k=\"流量与单价随规模线性涨\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">流量与单价随规模线性涨</tspan></text></g></svg>", "d": 76.27}], "deliverable": {"type": "skill", "name": "端云方案对比表", "rubric": ["两版可比", "取舍有数", "有推荐结论"], "acceptance": "两版方案各有明确适用条件与放弃理由，三项取舍都有数字或区间，能被会上直接拍板"}, "demo": {"ref": "■ 用车知识问答 · 两版端云方案对比（Z7 座舱域）\n\n一、对比表\n· 首字时延\n A 端侧：≤ 400ms（本地推理，不受网络影响）——需实测\n B 云端：1.2–2.5s（依赖网络），隧道地库不可用——需实测\n· 离线可用性\n A：完全可用（模型在本地）\n B：不可用，需端侧兜底，兜底能力仅覆盖固定问答\n· 单次成本\n A：推理成本 0，边际成本近 0；一次性投入为模型压缩与适配工时\n B：按次计费，单价需询价；日均请求量 × 单价 = 月度成本，随规模线性增长\n· 迭代周期\n A：随整车 OTA，约 6–8 周一个窗口\n B：云端按周迭代，不受整车节奏限制\n· 包体积\n A：模型文件增加约 300–600MB（需压缩，压缩后能力下降）——需实测\n B：端侧仅保留兜底小模型，约 40MB\n· 风险\n A：能力上限低、压缩后准确率下降、占 NPU 影响并发\n B：网络依赖、答案不可控（幻觉）、内容合规需额外过滤、成本随用量上涨\n\n二、推荐结论\n推荐 B（云端为主 + 端侧兜底），适用条件有三条：\n1. 日均请求量预估低于 3 万次，月度推理成本在预算内（需询价确认）\n2. 端侧兜底覆盖 20 条最高频问答，断网时明确提示「当前仅支持常用问题」\n3. 答案侧必须加内容过滤与免责话术，且不涉及行车操作类问答\n\n三、不建议选 A 的理由\n端侧模型压缩到可上车规模后，问答准确率与覆盖面都会明显下降，\n而这个功能的价值恰恰在「什么都问得到」，砍到这个程度不如不做。\n\n四、需要补证\n· 云端推理单价与日均请求量（询价 + 埋点预估）\n· 端侧模型压缩后的准确率（需实测）\n· 内容过滤的误杀率（需灰度）", "fix": ["把「月度推理成本在预算内」改成具体算式：日均请求量 × 单价 × 30，并把单价标为待询价——否则这条推荐结论等于没有门槛。", "给方案 B 补一条幻觉兜底：涉及车辆参数（续航、保养周期）的回答必须引用车端数据，不允许模型自由生成。", "把「端侧兜底覆盖 20 条」改成覆盖清单：哪 20 条、谁定、多久更新一次。", "加一条 B 方案的隐性成本：内容合规过滤会增加时延与误杀，需在验收口径里体现。"], "judge": "判断依据：两版是否在同一套指标下可比；有没有把待询价写成确定值；推荐结论是否带适用条件；幻觉与合规风险有没有落到具体动作"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是 Z 汽车 Z7 座舱域「用车知识问答」功能的两种技术方案与现有条件（已脱敏）：[方案A：端侧小模型；方案B：云端大模型 + 端侧兜底] [现有条件：NPU 余量、内存余量、可接受的包体积增量、云端推理单价区间、日均请求量预估] 请出一张对比表，按「首字时延 / 离线可用性 / 单次成本 / 迭代周期 / 包体积 / 风险」六行展开，每行给出两版的数字或区间；最后给一个推荐结论和它的适用条件。凡是材料里没有的数字，写「需实测或需询价」，不要估算。"}, "task": "在 WorkBuddy 里把「两版方案（端侧优先 / 云端优先）× 三项取舍（时延 / 成本 / 迭代）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】两版方案（端侧优先 / 云端优先）× 三项取舍（时延 / 成本 / 迭代）\n【参考案例】Z 汽车 座舱知识问答功能，端侧与云端两派争了两周没结论\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（VIN/手机号/精确定位不进外部模型）· 不替人决策（安全定级与出域判定不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是 Z 汽车 Z7 座舱域「用车知识问答」功能的两种技术方案与现有条件（已脱敏）：[方案A：端侧小模型；方案B：云端大模型 + 端侧兜底] [现有条件：NPU 余量、内存余量、可接受的包体积增量、云端推理单价区间、日均请求量预估] 请出一张对比表，按「首字时延 / 离线可用性 / 单次成本 / 迭代周期 / 包体积 / 风险」六行展开，每行给出两版的数字或区间；最后给一个推荐结论和它的适用条件。凡是材料里没有的数字，写「需实测或需询价」，不要估算。", "rubric": ["对比表六行齐全，两版在同一指标下比较，不出现「A 更快」这类无数字结论", "所有未知数字标为待实测或待询价，没有编造单价或请求量", "推荐结论附带明确适用条件，条件不成立时能翻转结论", "能指出方案 B 的幻觉与合规风险，并给出具体兜底动作"]}, {"id": "M3U7", "tier": "adv", "step": "todo", "title": "产出《端云职责划分与接口约定》", "video": {"dur": "3.4min", "script": ["端云之间最容易出事的不是能力，是边界：谁都以为对方在做", "三件套（职责表 / 接口字段 / 回流策略）+ 每条职责一个归属方", "Z 汽车 Z7 一次端云接口变更没通知到端侧，导致两个版本行为不一致"]}, "ppt": {"method": "三件套（职责表 / 接口字段 / 回流策略）+ 每条职责一个归属方", "case": "Z 汽车 Z7 一次端云接口变更没通知到端侧，导致两个版本行为不一致", "demo": "按三件套逐项填，任何一项归属不明就标出来"}, "objective": "产出一份含职责表、接口字段与回流策略的端云职责划分文档，且每项职责都有明确归属", "transfer": "把文档发给云端平台与端侧软件两方，各确认一遍自己的职责，把分歧写进待办", "vslides": [{"t": "端云之间出事，几乎都在边界上", "n": "端云协作出问题，很少是因为哪边能力不够，几乎都在边界上：谁都以为对方在做。典型场景是这样——云端改了返回字段名，没通知端侧，端侧读不到就静默失败，用户看到的是「功能时好时坏」。这类问题在联调阶段不一定暴露，因为联调时两边都是最新版本；一旦线上出现版本错配，就变成偶发故障，排查要几天。所以这份文档的价值不在写得多全，而在于把「谁负责」和「怎么变」写死。判断一份端云文档够不够用，问三个问题：每个动作有没有责任方？每个接口有没有超时和失败返回？接口变更有没有提前通知期？三个都能答，才算能交付。这三个问题也是你自查的顺序：先查职责，再查接口，最后查变更。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三个问题</tspan></text><g data-k=\"每个动作有责任方\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">每个动作有责任方</tspan></text></g><g data-k=\"每个接口有超时与失败返回\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">每个接口有超时与失败返回</tspan></text></g><g data-k=\"每次变更提前通知\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">每次变更提前通知</tspan></text></g></svg>", "d": 64.01}, {"t": "三件套：职责表、接口、回流", "n": "第一件，职责表。把功能拆成判定、推理、执行、记录四类动作，逐个标端侧还是云端。拆分粒度要细到「唤醒判定」「二轮监听窗口管理」这种程度，不能只写「语音识别归云端」。第二件，接口。每个跨端调用写清请求字段、响应字段、超时时间、失败返回码。超时时间特别重要，因为它直接决定降级什么时候触发。第三件，回流。哪些数据回云端、频率多少、字段最小化到什么程度、保留多久。三件里最容易糊弄的是回流，因为它不影响功能跑通，只影响后面能不能分析问题；但恰恰是它，决定了半年后你还有没有数据可用。职责表是给人看的，接口是给机器看的，回流是给半年后的自己看的。三件套里接口最容易扯皮，最好在动笔前先拉一次三方会。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件套</tspan></text><g data-k=\"职责表\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">职责表</tspan></text></g><g data-k=\"接口约定\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">接口约定</tspan></text></g><g data-k=\"回流策略\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">回流策略</tspan></text></g><g data-k=\"责任方\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">责任方</tspan></text></g><g data-k=\"超时与失败码\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">超时与失败码</tspan></text></g><g data-k=\"字段与保留期\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">字段与保留期</tspan></text></g></svg>", "d": 75.14}, {"t": "三个错法，都会在半年后爆发", "n": "第一个错法：职责表留空白。写着「待定」的那一格，最后一定没人做，而且是在上线前一周才发现。第二个错法：接口只写成功路径。没有超时、没有失败返回码，端侧只能靠猜，猜的结果就是各写一套兜底，行为不一致。第三个错法：回流写成「尽量少传」。这句话没有可执行性，开发和合规都无法据此判断。要写成清单：传哪十二个字段，不传原始音频与精确位置，保留九十天，弱网缓存上限两百条。三个错法的共同点是当时看着没事，半年后集中爆发，而那个时候改一版要走一个 OTA 周期，代价比现在写清楚大得多。所以这份文档的验收标准不是评审通过，是半年后还能对上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"职责表不留空白\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">职责表不留空白</tspan></text></g><g data-k=\"接口写失败路径\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">接口写失败路径</tspan></text></g><g data-k=\"回流写成字段清单\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">回流写成字段清单</tspan></text></g></svg>", "d": 65.69}], "deliverable": {"type": "skill", "name": "端云职责划分文档", "rubric": ["归属无空白", "接口可联调", "回流可审计"], "acceptance": "职责表无空白项；每个接口有超时与失败返回；回流策略含字段清单与保留期限"}, "practice": {"steps": ["列职责：把功能拆成判定、推理、执行、记录四类动作，逐个标端侧还是云端", "写接口：每个跨端调用写清请求字段、响应字段、超时时间、失败返回", "定回流：哪些数据回云端、频率多少、字段最小化到什么程度、存多久", "标归属：每项职责写责任方与联调人，不留空白", "写变更约定：接口变更的提前通知期与兼容策略"], "exemplar": "《连续对话 · 端云职责划分与接口约定》（Z7 座舱域 · v1.0）\n\n一、职责表（动作 / 归属 / 责任方 / 联调人）\n· 唤醒判定 — 端侧 — 座舱软件 — 王（端侧）\n· 首轮识别 — 端侧（离线）/ 云端（在线增强）— 语音团队 — 李（云端）\n· 意图判定 — 端侧优先，低置信度转云端 — 语音团队 — 李\n· 指令执行 — 端侧 — 车控 — 赵（车控）\n· 监听窗口管理 — 端侧 — 座舱软件 — 王\n· 会话记录与埋点 — 端侧采集，云端聚合 — 数据平台 — 周（数据）\n· 模型更新 — 云端训练，随 OTA 下发 — 算法 — 陈（算法）\n\n二、接口约定（3 个跨端接口）\n1. ASR_REQ（端 → 云）\n 请求：audio_chunk（16k 单声道）、session_id、vehicle_state（车速档位、车窗状态）、\n lang_hint、is_second_turn\n 响应：text、confidence、intent、slots、error_code\n 超时：800ms（超时即切端侧，不重试）\n 失败返回：error_code = TIMEOUT / NO_NET / SERVER_BUSY，端侧按降级矩阵处理\n2. INTENT_FALLBACK（端 → 云）\n 请求：text、confidence、上下文两轮\n 响应：intent、slots、need_confirm\n 超时：1200ms\n3. SESSION_REPORT（端 → 云，异步）\n 请求：session_id、轮次数、每轮时延、降级触发类型、是否成功\n 响应：ack（不阻塞主流
