// ==================== COURSE CONTENT GENERATOR ====================
function getCourseContent(courseId) {
  const CONTENTS = {
    // 研发
    dev1: { objectives:['掌握AI编程助手的核心能力，从简单补全到项目级架构','学会用AI生成完整的REST API接口和业务模块','理解如何通过渐进式提示优化AI代码质量'],
      concepts:[{t:'AI编程助手的工作原理',c:'AI编程助手基于大语言模型，通过分析代码上下文、注释和自然语言指令来生成代码。它理解代码结构、API调用模式和最佳实践，能够提供上下文感知的代码建议。核心机制包括：上下文窗口（分析前后代码）、提示工程（通过注释和命名引导生成）、多轮对话优化（逐步完善代码）。'},{t:'从补全到架构的思维跃迁',c:'多数开发者停留在"让AI补全一行代码"的阶段。真正的高效用法是：将AI视为结对编程伙伴。先描述需求→让AI生成方案→审查并细化→迭代优化。这要求你从"写代码的人"转变为"定义问题的人"，用清晰的规格描述代替手工编写。关键是学会分解问题：大需求拆成小模块，每个模块独立与AI交互。'}],
      steps:[{t:'第一步：建立清晰的上下文',d:'在开始编码前，用注释明确描述需求、输入输出格式、边界条件、性能要求。例如："// 需要实现一个用户注册接口，POST /api/register，接收username（3-20位字母数字）、password（8位以上，含大小写和数字）、email。返回JSON包含userId和token。需校验参数，密码需BCrypt加密存储。"'},{t:'第二步：分模块迭代生成',d:'不要试图让AI一次生成整个项目。采用"自顶向下"策略：先生成类型定义和接口→再生成核心业务逻辑→然后生成错误处理→最后生成测试。每步都在前一步基础上迭代。'},{t:'第三步：人工审查与定向优化',d:'AI生成的代码不是终点。检查：逻辑是否正确（特别是边界条件）、安全是否到位（输入验证、权限控制）、性能是否合理（N+1查询、内存泄漏）。发现问题后，用精准的提示词让AI针对性修复，而不是手动改代码——这样下次AI能生成更好的代码。'},{t:'第四步：沉淀团队提示词库',d:'将高频场景的优质提示词整理成团队知识库：API生成模板、数据库迁移模板、测试生成模板。统一团队的AI使用规范，提升整体效率。」'}],
      cases:[{s:'场景：新人接到一个"实现文件上传功能"的任务，第一次用AI',sol:'好的做法：先整理需求（支持哪些文件类型、最大大小、存储位置、是否需要缩略图、安全性要求），将这些信息写成详细的注释块，再让AI生成代码。结果：一次生成的代码就达到了80%完成度，剩下20%是业务特有的安全策略调整。'},{s:'场景：重构一个历史遗留的订单处理模块',sol:'策略：先让AI分析现有代码，生成重构方案（不直接改代码），人工确认方案后，再逐步让AI执行重构。每步review后继续。这样避免了AI不理解业务逻辑就乱改的风险。'}],
      tools:[{n:'GitHub Copilot',d:'IDE内置，代码补全和对话最强，支持VS Code/JetBrains'},{n:'Cursor',d:'AI-first编辑器，内置Chat和Composer，适合项目级开发'},{n:'Claude Code/Aider',d:'命令行AI编程，适合重构和批量修改'},{n:'Windsurf',d:'AI原生IDE，Context-aware代码生成'}],
      tips:['始终添加清晰的需求注释，AI产出的质量与输入质量正相关','分而治之：大需求拆小模块，逐个攻破','养成"先看方案再改代码"的习惯，不要盲目信任AI输出','团队应统一AI工具和提示词规范，形成协作标准','定期回顾AI生成的代码，总结经验优化提示词策略'] },
    dev2: { objectives:['建立AI代码审查的系统方法论','学会用AI发现代码坏味道、安全漏洞和性能瓶颈','能生成结构化的代码审查报告并指导改进'],
      concepts:[{t:'AI代码审查的价值',c:'传统代码审查依赖审查者的经验和精力，容易遗漏隐蔽问题。AI代码审查可以系统性地扫描：命名规范、代码复杂度、安全漏洞、性能模式、API误用等。它不是替代人工审查，而是作为"第一道防线"，让人工审查聚焦在架构和业务逻辑层面。'},{t:'审查维度与标准',c:'AI代码审查应覆盖六个维度：安全性（注入、鉴权、敏感信息）、性能（N+1查询、内存泄漏、循环优化）、可维护性（圈复杂度、重复代码、注释质量）、正确性（边界条件、异常处理）、规范性（代码风格、API设计）、可测试性（依赖注入、职责分离）。'}],
      steps:[{t:'第一步：建立审查上下文',d:'提交代码审查时，给AI提供完整背景：这个PR解决了什么问题、涉及哪些模块、有什么特别需要注意的地方。提供PR的描述链接或文字。'},{t:'第二步：分维度系统审查',d:'不要一次性让AI审查所有维度。分轮进行：第一轮关注安全→第二轮关注性能→第三轮关注可维护性。每轮生成独立的问题清单，按严重程度分级。'},{t:'第三步：生成可执行的修复建议',d:'对于每个发现的问题，要求AI不仅指出问题，还生成具体的修复代码。包含"问题描述→影响范围→修复方案→修改后代码"。这样开发者可以直接应用。'},{t:'第四步：沉淀审查规范',d:'基于AI发现的问题模式，总结团队的代码规范文档。将高频问题加入lint规则，形成自动化检测。逐步减少同类问题重复出现。'}],
      cases:[{s:'场景：一个电商系统PR，涉及支付接口改造',sol:'审查指令示例："这是一个支付接口改造的PR，涉及资金安全，请重点审查：1)金额计算是否安全（防止浮点精度问题）；2)支付回调的幂等性处理；3)敏感数据是否脱敏；4)SQL是否有注入风险。对每个问题给出严重级别和修复代码。"'}],
      tools:[{n:'CodeRabbit',d:'AI代码审查机器人，自动审查PR并生成评论'},{n:'SonarQube+AI',d:'静态代码分析+AI智能化建议'},{n:'GitHub Copilot Chat',d:'在IDE中直接对PR进行对话式审查'}],
      tips:['审查不是找茬，是帮助团队写出更好的代码','永远不能让AI审查替代人工审查，尤其涉及业务逻辑','建立团队的审查维度checklist，AI和人工共用','审查报告要简明扼要，优先列出高严重性问题','定期复盘审查发现，优化开发规范'] },
    dev3: { objectives:['掌握AI生成测试用例的系统方法','学会用AI分析测试覆盖率并补充用例','建立AI驱动的持续测试流程'],
      concepts:[{t:'AI在测试中的角色',c:'测试是AI最能产生价值的领域之一。AI可以：1)从代码逻辑自动推导测试场景（正常、边界、异常、并发）；2)根据覆盖率报告生成缺失的测试用例；3)维护测试代码（重构导致的测试更新）。这大大减少了编写测试的枯燥感，让开发者更愿意写测试。'},{t:'测试用例的完整性',c:'一个好的测试策略应覆盖：正向用例（happy path）、边界用例（极值、空值、零值）、异常用例（错误输入、网络超时、资源不足）、并发用例（多线程安全问题）。AI可以帮助系统性地生成这些用例，确保不遗漏任何维度。'}],
      steps:[{t:'第一步：让AI分析目标代码',d:'将要测试的代码输入AI，让它分析：函数签名和参数类型、业务逻辑分支、依赖的外部服务、可能的异常情况。AI会生成一个测试方案概述。'},{t:'第二步：生成测试用例矩阵',d:'基于分析结果，让AI生成测试用例矩阵。包含：用例ID、测试场景描述、输入参数、预期输出、覆盖的代码路径。人工review这个矩阵，补充AI未想到的业务场景。'},{t:'第三步：逐个生成测试代码',d:'按用例矩阵，逐个让AI生成测试代码。每个测试用例独立管理，方便后续维护。特别注意mock/stub外部依赖。'},{t:'第四步：CI集成与持续维护',d:'将测试集成到CI流水线。当代码变更导致测试失败时，让AI分析失败原因并建议修复方案。定期让AI扫描新增代码并生成对应测试。'}],
      cases:[{s:'场景：一个支付服务有几十个分支条件，手动写测试太耗时',sol:'将支付服务的核心代码和业务文档一起提供给AI，要求它生成完整的测试用例矩阵。AI识别出7个主流程分支和23个边界条件，生成了30个测试用例。人工review后发现还需要增加退款和重复支付的并发测试，补充后覆盖率达到92%。'}],
      tools:[{n:'Jest + Copilot',d:'JavaScript/TypeScript测试，AI辅助生成'},{n:'pytest + Claude/Cursor',d:'Python测试框架，AI生成pytest用例'},{n:'Playwright + AI',d:'E2E测试，AI生成浏览器操作脚本'}],
      tips:['先让AI生成测试方案，人工确认后再生成代码','测试数据和业务逻辑分离，提高可维护性','利用AI分析覆盖率报告，针对性地补充缺失用例','复杂业务场景必须人工review AI生成的测试','将测试生成整合到日常开发流程中，不是一次性任务'] },
    dev4: { objectives:['掌握提示词工程的核心方法论','学会角色设定、few-shot和链式推理等高级技巧','建立个人和团队的提示词模板库'],
      concepts:[{t:'提示词工程的本质',c:'提示词工程（Prompt Engineering）不是"跟AI好好说话"，而是结构化地表达需求。核心要素：角色设定（告诉AI它是谁）、任务描述（要做什么）、输出格式（怎么呈现）、约束条件（不能做什么）、示例（few-shot，给出范例）。好的提示词能提升AI产出质量30-50%。'},{t:'链式思维推理',c:'Chain-of-Thought（CoT）是让AI"逐步思考"的技巧。不要直接问结果，而是要求AI"先分析问题→拆解步骤→逐步推理→得出结论"。例如调试复杂bug时："分析错误日志→列出可能原因→逐个排查→给出结论和修复方案"。这种分步推理大幅提升复杂问题的准确率。'},{t:'Few-shot学习',c:'给AI提供2-5个"输入→期望输出"的范例，AI会模仿范例的风格和结构。例如，给出3个代码审查的范例（问题→严重级别→修复方案），之后AI会按照相同格式输出。Few-shot的关键是范例要覆盖不同类型的场景。'}],
      steps:[{t:'第一步：定义AI角色',d:'清晰的角色设定至关重要。不只说"你是程序员"，而是"你是一位有15年经验的资深后端架构师，精通Java和分布式系统，重视代码质量和安全性"。越具体，AI的行为越符合预期。'},{t:'第二步：结构化任务描述',d:'用分点、标题、代码块等方式组织你的请求。例如："【任务】审查以下代码【关注点】1)SQL注入 2)并发安全 3)异常处理【输出格式】问题描述+严重级别+修复代码【代码】{...}"。结构化的请求减少歧义。'},{t:'第三步：设计Few-shot示例',d:'对于团队的重复性任务，设计标准化的few-shot示例。每个示例包含：输入场景→AI的正确输出。维护3-5个高质量示例覆盖不同情况。'},{t:'第四步：链式推理调试',d:'当问题复杂时，拆成多轮对话：第一轮让AI分析问题、第二轮制定方案、第三轮执行方案、第四轮验证结果。每轮基于前一轮的产出继续深入。'}],
      cases:[{s:'场景：一段复杂代码出现难以定位的内存泄漏',sol:'使用链式推理：第1轮"分析这段代码的内存分配模式"→AI识别出3个可疑点；第2轮"对可疑点1深入分析对象生命周期"→AI发现闭包未释放；第3轮"给出修复方案"→AI提供代码修复。这种分步方式比一次提问效果好几倍。'}],
      tools:[{n:'PromptPerfect',d:'提示词自动优化工具'},{n:'Anthropic Prompt Library',d:'官方提示词模板库'},{n:'Cursor Rules/Notion',d:'个人提示词知识库管理'}],
      tips:['角色设定是提示词最被低估的部分，花30秒写好角色','复杂问题一定用链式推理，拆成多步让AI思考','few-shot示例要精选，覆盖不同的失败和成功情况','建立团队提示词库，新人可以继承最佳实践','定期回顾哪些提示词效果好，哪些需要优化'] },
    dev5: { objectives:['学会用AI从代码自动生成API文档','掌握用AI撰写高质量技术方案的方法','建立团队AI文档生成规范和知识库管理'],
      concepts:[{t:'AI文档生成的价值',c:'文档是开发中被忽视最多的环节。AI改变了文档编写的成本结构：从"写文档要1小时"变成"审文档要10分钟"。关键转变：从代码生成文档→从需求生成方案→从变更生成更新记录。AI让文档可以像代码一样被持续维护。'},{t:'从代码到文档的自动化',c:'AI可以分析代码的注释、函数签名、类型定义，自动生成结构化的API文档。关键是：代码中的注释要规范、类型定义要完整、要有清晰的模块分层。投入写好注释，AI就能产出好的文档。'}],
      steps:[{t:'第一步：建立代码注释规范',d:'制定团队的注释标准：每个公共函数必须有JSDoc/docstring，包含参数说明、返回值、异常说明、使用示例。AI生成的文档质量完全取决于注释质量。'},{t:'第二步：AI生成API文档',d:'将代码模块和注释提供给AI，要求它按照OpenAPI/Swagger格式生成接口文档。包含：接口路径、请求方法、参数定义、响应格式、错误码、使用示例。'}],
      cases:[{s:'场景：新项目需要完整的技术方案文档',sol:'在需求分析后，将需求要点提供给AI，让它生成技术方案初稿。包含：架构设计、模块划分、技术选型理由、数据流设计、部署方案。人工review后补充业务特有部分。比从零写节省70%时间。'}],
      tools:[{n:'Swagger/OpenAPI + AI',d:'API文档标准+AI自动生成'},{n:'Storybook + AI',d:'组件文档+AI生成用例'},{n:'Notion AI/飞书智能文档',d:'技术方案协同编辑+AI辅助'}],
      tips:['注释是AI生成文档的原材料，垃圾进垃圾出','文档模板要统一，AI生成的文档才能保持一致风格','技术方案文档要包含选型理由，不只是架构图','定期让AI更新文档（代码变更后）','建立团队的文档review流程，AI生成+人工审核'] },
    dev6: { objectives:['识别AI生成代码中的安全风险类型','建立AI代码安全审查的标准流程','制定团队AI代码安全规范'],
      concepts:[{t:'AI代码的独特安全风险',c:'AI生成的代码可能引入传统开发中不常见的风险：1)训练数据中的不安全模式被复制；2)AI不了解你的安全策略（如特定的加密算法、权限模型）；3)AI可能生成看似正常但有细微漏洞的代码。这些风险要求我们建立专门的安全审查流程。'},{t:'安全审查清单',c:'AI代码安全审查需要覆盖：输入验证（注入攻击）、认证授权（权限绕过）、敏感数据处理（明文存储、日志泄露）、加密安全（弱算法、硬编码密钥）、依赖安全（过时库、已知漏洞）、配置安全（默认密码、调试模式）。每项都需要有明确的检查标准。'}],
      steps:[{t:'第一步：建立安全性审查基线',d:'制定AI代码安全检查清单，包含：SQL/NoSQL注入检查、XSS/CSRF防护、认证token管理、敏感信息（密码、密钥、个人信息）处理、加密算法选择、依赖版本检查。'},{t:'第二步：AI安全审查工作流',d:'将安全检查清单作为提示词输入AI，让它逐项审查代码。要求AI输出：风险点、风险等级、影响范围、修复建议、修复后的代码。人工对高风险项做二次review。'},{t:'第三步：代码安全规范落地',d:'基于AI发现的安全问题模式，制定团队安全编码规范。将高频安全问题加入CI检测流水线。对新生成的AI代码，自动运行安全扫描。'}],
      cases:[{s:'场景：AI生成了一个用户登录接口，审查发现密码用MD5加固定salt',sol:'正确做法：让AI改用bcrypt/argon2进行密码哈希，加随机salt。同时检查token生成是否使用加密安全的随机数，检查session管理是否存在会话固定攻击。这些安全细节AI在生成代码时可能忽略。'}],
      tools:[{n:'Snyk',d:'代码依赖安全扫描'},{n:'OWASP ZAP',d:'Web应用安全测试'},{n:'Semgrep',d:'自定义安全规则扫描'},{n:'Burp Suite',d:'专业Web安全测试工具'}],
      tips:['永远不要信任AI生成的代码的安全性','建立团队的安全审查checklist，含AI特有风险','敏感配置（密钥、密码）绝对不能硬编码','安全审查要成为代码合并的必要条件','定期更新安全规范，跟踪最新的AI安全风险'] },

    // 产品
    pm1: { objectives:['学会用AI从海量用户反馈中提取真实需求','掌握用AI生成结构化PRD文档的方法','能基于数据和AI分析进行需求优先级排序'],
      concepts:[{t:'AI辅助需求挖掘的方法论',c:'产品经理的核心工作之一是"发现真正的需求"。传统方式依赖用户访谈和手动分析，效率低且容易受主观偏差影响。AI可以：批量分析用户反馈（评论、工单、NPS）→聚类相似问题→识别高频痛点→发现隐性需求→生成洞察报告。关键不是让AI替你决策，而是用AI减少信息处理的时间，让你有更多精力做判断。'},{t:'从反馈到PRD的转化',c:'AI可以将"用户说"转化为"需求描述"再转化为"功能规格"。流程：用户原话→AI提取核心诉求→AI判断是大需求/小优化/bug→AI生成需求背景和目标→AI撰写详细功能描述→人工review和补充业务上下文。'},{t:'需求优先级的系统化评估',c:'用AI做优先级排序不是让它"凭感觉"打分。要给AI一个评估框架（如RICE：Reach覆盖人数、Impact影响程度、Confidence信心指数、Effort投入成本），让AI基于数据和信息给每个需求打分，生成优先级矩阵。'}],
      steps:[{t:'第一步：收集并清洗用户反馈',d:'从多个渠道（客服系统、App评论、NPS反馈、用户访谈录音）收集原始反馈。用AI去除无效信息（纯情绪宣泄、重复内容），保留有实质性内容的反馈。'},{t:'第二步：AI聚类分析',d:'将清洗后的反馈提供给AI，要求它按主题聚类。例如：将所有关于"登录体验"的反馈归为一类，"支付流程"的归为另一类。AI会生成聚类结果和每类的典型用户语录。'},{t:'第三步：提取核心需求',d:'对每个聚类，让AI提取"用户真正的需求是什么"。区分表面需求（"我要更快"）和底层需求（"订单确认页加载超过3秒"）。AI会生成用户故事和需求背景。'},{t:'第四步：生成PRD',d:'基于确认的需求，让AI生成结构化PRD。包含：需求背景、用户故事、功能描述、交互逻辑、验收标准、影响评估。人工review后补充业务策略和排期信息。'}],
      cases:[{s:'场景：App收到了200条关于"搜索不好用"的反馈',sol:'将200条反馈输入AI，要求聚类分析。AI识别出4个子问题：搜索速度慢（35%）、结果不相关（30%）、无法按类别筛选（20%）、历史搜索无法清除（15%）。每个子问题都给出了3-5条典型用户语录。PM据此制定分阶段优化计划。'}],
      tools:[{n:'ChatGPT/Claude',d:'需求分析和PRD生成'},{n:'Notion AI',d:'需求文档协同和AI写作'},{n:'飞书智能文档',d:'PRD模板+AI辅助'}],
      tips:['反馈分析要区分"高频问题"和"高价值问题"，两者不总一致','AI生成的需求背景需要人工核实——用户的表述和真实需求可能有差距','PRD要有验收标准，AI可以帮助生成但需要PM确认','需求优先级评估要结合业务战略，AI提供数据参考而非最终决策','定期让AI分析需求趋势，发现产品演进方向'] },
    pm2: { objectives:['用AI设计高效的用研方案','学会用AI分析调研数据并提取洞察','能基于AI分析生成精准的用户画像'],
      concepts:[{t:'AI如何赋能用户研究',c:'传统用户研究面临三大难题：样本量有限（每次调研只能覆盖部分用户）、分析耗时长（从数据到洞察需要数天）、洞察碎片化（不同研究之间的关联难以发现）。AI的优势在于：快速处理大量非结构化数据（文本、语音）、发现数据中的隐性模式、跨越不同研究形成全局洞察。'},{t:'用户画像的AI构建方法',c:'AI构建用户画像不是凭空想象，而是基于真实数据：行为日志→用户分群→特征提取→画像生成→验证迭代。AI可以分析用户的行为数据（点击、购买、留存），识别出不同的行为模式，再结合调研数据丰富画像的社会属性（动机、偏好、痛点）。'}],
      steps:[{t:'第一步：设计调研方案',d:'告诉AI你的调研目标（了解某功能的使用障碍），让它生成方案：调研方法建议（问卷/访谈/可用性测试）、问卷问题设计、访谈提纲、用户招募标准、样本量建议。'},{t:'第二步：执行调研并收集数据',d:'按照AI设计的方案执行调研。将收集到的数据（问卷结果、访谈录音转文字）整理后提供给AI分析。'},{t:'第三步：AI深度分析',d:'让AI从数据中提取关键发现：按主题分类洞察、标记频率（多少人提到）、发现矛盾点（用户说的和做的不同）、识别隐性需求（用户没说出来但行为表明的）。'},{t:'第四步：生成用户画像',d:'综合行为数据+调研洞察，让AI生成用户画像。每个画像包含：人口属性、行为特征、核心需求、典型场景、使用障碍、决策因素。给出代表性用户语录。'}],
      cases:[{s:'场景：B2B产品用户流失率上升，需要快速了解原因',sol:'用AI分析最近流失用户的反馈和数据：AI发现流失用户集中在中型客户（50-200人），他们普遍提到"迁移成本高"和"培训不足"。基于此设计针对性调研方案：访谈5位最近流失的客户，确认AI发现的模式。'}],
      tools:[{n:'腾讯问卷+AI',d:'问卷设计和数据收集'},{n:'ChatGPT/Claude',d:'调研数据分析'},{n:'Dovetail/Condens',d:'用户研究管理+AI分析'},{n:'飞书妙记',d:'访谈录音转文字+AI总结'}],
      tips:['调研不是为了证明假设，是为了发现你不知道的东西','AI分析的输出要人工验证，防止过度解读数据','用户画像要定期更新，用户需求是动态变化的','定量数据告诉你"是什么"，定性调研告诉你"为什么"','将研究洞察结构化存储，形成团队的用户知识库'] },
    pm3: { objectives:['建立AI辅助的数据驱动决策框架','学会用AI分析A/B测试并得出可靠结论','能基于数据用AI生成产品迭代决策建议'],
      concepts:[{t:'数据驱动决策的AI框架',c:'数据→信息→洞察→决策，这是数据驱动决策的完整链路。AI在每个环节都能提供助力：数据清洗和可视化→模式发现和相关性分析→假设检验和因果推断→决策建议和风险评估。关键是建立"数据说话"的团队文化，并用AI降低数据分析的门槛。'},{t:'A/B测试的AI分析',c:'传统A/B测试分析的陷阱：只关注p值忽略效应量、多组测试的假阳性问题、统计显著但业务不显著。AI可以帮助：计算所需样本量、分析多维度指标（不仅看主指标）、检查分组均衡性、发现细分人群的差异化效果、生成通俗易懂的分析报告。'}],
      steps:[{t:'第一步：定义分析目标和关键指标',d:'用AI辅助定义核心指标（北极星指标）和辅助指标（护栏指标）。AI会根据你描述的业务场景，建议合适的指标体系框架（如AARRR、HEART等）。'},{t:'第二步：搭建数据看板',d:'将定义的指标告诉AI，让它生成看板设计方案：布局建议、图表类型选择、异常阈值定义、数据刷新频率。关键是让看板"可行动"——看到数据就能判断下一步做什么。'},{t:'第三步：A/B测试全流程',d:'用AI辅助A/B测试的每个环节：样本量计算→实验设计→数据收集→结果分析→决策建议。特别是分析环节，让AI同时检查主指标和细分指标，避免过度关注单一指标。'},{t:'第四步：生成决策报告',d:'定期让AI分析产品数据趋势，生成决策建议。格式：本期关键数据变化→变化背后的原因分析→建议的行动方案→预测行动后的效果。'}],
      cases:[{s:'场景：新功能上线后核心指标有波动，不确定是正面还是负面影响',sol:'让AI做多维度分析：1)核心指标趋势（上升还是下降）；2)不同用户群的表现差异（新老用户、活跃度分层）；3)关联指标的连锁反应；4)同期其他因素的影响。AI帮助发现是新功能降低了老用户的使用效率，建议对老用户做使用引导优化。'}],
      tools:[{n:'Metabase/Superset',d:'开源数据分析看板'},{n:'ChatGPT Code Interpreter',d:'AI数据分析'},{n:'Amplitude/Mixpanel',d:'产品分析+AI洞察'},{n:'Eppo/Optimizely',d:'实验平台的AB测试分析'}],
      tips:['数据驱动不是"唯数据是从"，要结合定性洞察','A/B测试要设置足够长的实验时长，避免早期波动误导','关注细分人群的差异化效果，总量指标可能掩盖问题','决策报告要简洁，一页纸说清楚"发生了什么→为什么→怎么办"','建立"假设→实验→验证→迭代"的闭环流程'] },
    pm4: { objectives:['学会用AI快速生成和迭代产品原型','掌握用AI分析交互流程并提出优化建议','建立AI辅助的设计规范和组件管理体系'],
      concepts:[{t:'AI辅助原型设计的范式转变',c:'传统产品设计流程：需求→手绘草图→低保真原型→高保真原型→开发实现。AI改变了这个流程：需求→AI生成多个方案→人工选择方向→AI细化细节→开发实现。核心变化是"方案探索"的成本急剧降低——以前做一个方案需要一天，现在AI可以生成10个方案让你选。'},{t:'从描述到原型的转化',c:'高效的AI原型设计需要你清晰描述：页面目的（用户来这做什么）、核心元素（必须有按钮、输入框、列表）、交互逻辑（点击后发生什么）、信息层级（什么最重要、什么次要）、约束条件（已有的组件库、品牌色）。描述越精确，AI生成的越接近你想要的。'}],
      steps:[{t:'第一步：需求的结构化描述',d:'用结构化格式描述你要的页面。包含：页面类型（列表/详情/表单/仪表盘）、用户任务、核心元素清单、重点信息、交互预期。示例格式："【页面类型】订单列表页【用户任务】快速找到待处理的订单【核心元素】搜索栏、状态筛选、订单卡片（含订单号、客户名、金额、时间、状态）【交互】点击卡片进入详情"）'},{t:'第二步：AI生成多个方案',d:'基于需求描述，让AI生成3个不同方向的方案。例如：方案A侧重效率（信息密度高）、方案B侧重清晰（留白多、信息聚焦）、方案C侧重新功能引导。比较不同方向的优劣。'},{t:'第三步：UI细节优化',d:'选定方向后，让AI逐项优化：信息架构是否合理、视觉层级是否清晰、操作路径是否最短、异常状态是否覆盖（空状态、加载中、错误状态）。AI会给出修改建议和修改后的原型描述。'},{t:'第四步：构建设计规范',d:'让AI整理项目中用到的设计模式，生成设计规范文档。包含：组件清单、使用规则、设计原则、响应式断点。便于团队统一设计语言。'}],
      cases:[{s:'场景：需要一个B2B产品的仪表盘页面',sol:'需求描述示例："CRM数据看板，用户是销售主管。核心信息：本月业绩（目标vs实际）、团队排名、近期商机Pipeline、流失预警。信息层级：业绩>商机>排名>预警。风格：专业、清晰、可操作。"AI基于此生成了低信息密度和高信息密度两个方案，团队选择了高密度方案。'}],
      tools:[{n:'Figma + AI插件',d:'AI辅助原型设计和组件库'},{n:'v0.dev / bolt.new',d:'AI生成UI代码'},{n:'Galileo AI',d:'文字描述生成UI设计稿'},{n:'Uizard',d:'AI驱动的快速原型设计工具'}],
      tips:['AI生成原型后一定要做可用性测试，不要直接开发','原型是沟通工具，不是美术作品——功能正确比视觉好看重要','设计规范要由人定义，AI辅助执行和检查','异常状态和边界情况要特别关注，AI容易忽略','每个页面要有明确的用户任务，避免"什么都能做"的设计'] },
    pm5: { objectives:['建立系统化的AI竞品分析框架','学会用AI深度拆解竞品并发现策略机会','能基于竞品分析生成产品差异化策略'],
      concepts:[{t:'AI如何提升竞品分析的质量',c:'传统竞品分析的痛点：信息收集耗时（每天刷竞品）→分析深度不够（停留在功能列表对比）→洞察不可操作（看了也不知道怎么做）。AI可以：自动化信息收集和整理→深度分析竞品的产品策略→发现市场空白机会→持续监控竞品动态。将分析时间从"每周半天"降到"每天10分钟"。'},{t:'从功能对比到策略分析',c:'好的竞品分析不是列功能表，而是理解竞品"为什么这样做"。分析框架：竞品的目标用户是谁（看似一样可能不同）→竞品的价值主张是什么（他们卖什么）→竞品的核心壁垒在哪（用户为什么离不开）→竞品的增长策略是什么（怎么获取用户）。AI可以帮助推断这些策略层面的信息。'}],
      steps:[{t:'第一步：建立竞品分析框架',d:'让AI生成竞品分析模板：分析维度（产品功能、用户体验、商业模式、市场策略、技术架构）、每个维度的评估指标、数据收集方法、分析频率。'},{t:'第二步：收集和整理信息',d:'用AI辅助收集竞品信息：让AI搜索竞品的最新动态、整理App Store评论的核心反馈、分析竞品官网和帮助文档的产品定位、汇总公开的定价和商业模式信息。'},{t:'第三步：深度策略分析',d:'基于收集的信息，让AI做深度策略分析：竞品的核心优势和劣势、他们的产品演进路径、可能的下一步动作、我们和他们的关键差异点。不要只问"他们有什么功能"，要问"他们为什么做这个功能"。'},{t:'第四步：生成差异化建议',d:'根据分析结果，让AI生成产品策略建议：哪些领域我们应该追平、哪些可以差异化、哪些市场机会竞品还没覆盖。结合自身优势制定行动方案。'}],
      cases:[{s:'场景：新竞品发布了一个看起来很厉害的功能，团队焦虑',sol:'不要让团队焦虑。用AI快速做一个小型竞品分析：这个功能解决什么问题、竞品的实现方式、用户的实际反馈（看评论而不是宣传）、我们的用户是否有这个需求、替代方案是什么。10分钟得出结论：这个功能用户反馈一般，当前不是优先级。'}],
      tools:[{n:'SimilarWeb/SEMrush',d:'竞品流量和营销分析'},{n:'App Annie/data.ai',d:'应用商店数据分析'},{n:'ChatGPT/Claude',d:'竞品深度分析'},{n:'Crayon/Klue',d:'竞品监控和情报管理'}],
      tips:['竞品分析是为了启发，不是为了复制','关注竞品"为什么赢"和"在什么场景下弱"','定期做但不频繁做——每周快速扫描，每季度深度分析','竞品分析要产出可行动的建议，不只是信息汇总','最好的差异化往往来自竞品忽视的领域'] },

    // 运营
    ops1: { objectives:['建立AI驱动的内容生产流水线','学会用AI一个选题生成多平台适配内容','掌握AI标题优化和内容质量评估方法'],
      concepts:[{t:'AI内容生产的思维转变',c:'传统内容生产的瓶颈是人：一个人一天最多写3-4篇高质量内容。AI将瓶颈从"创作"转移到"策略"：你的核心工作变成"决定做什么内容"和"判断什么是好内容"，AI负责执行。这要求运营人员从"内容生产者"进化为"内容策略师"——决定选题方向、定义质量标准、把控品牌调性。'},{t:'多平台内容适配',c:'同一个主题在不同平台需要不同的表达方式：小红书要情绪化、口语化、带emoji；公众号要结构化、有深度、可收藏；抖音要抓眼球、前3秒定生死、口语化。AI可以理解这些风格差异，将一篇文章的材料转化为不同平台的适配内容。关键是给AI清晰的目标平台风格指南。'}],
      steps:[{t:'第一步：AI选题策划',d:'让AI分析近期热点趋势、你的目标用户兴趣、竞品的内容策略，生成10-20个选题建议。每个选题标注：目标用户群、预期阅读量、内容形式、与品牌调性的匹配度。'},{t:'第二步：内容大纲和初稿生成',d:'选定选题后，让AI生成内容大纲（文章结构、核心观点、支撑论据）。审核大纲后，让AI按大纲生成完整初稿。控制AI的输出长度和质量方向（专业深度/普适易懂）。'},{t:'第三步：多平台适配',d:'将核心内容交给AI，让它生成不同平台的版本。提供清晰的指令："将以下内容改写为小红书版本，风格：口语化、分点、带emoji、加入个人体验感、适合年轻女性用户。字数300以内。"'},{t:'第四步：标题A/B优化',d:'为同一篇文章，让AI生成10个不同风格的标题（悬念式、数字式、冲突式、情感式）。根据平台特性选择合适的标题，发布后根据数据反馈优化。'}],
      cases:[{s:'场景：一篇关于AI工具评测的文章，需要覆盖公众号和小红书',sol:'公众号版：深度评测、数据对比、购买建议，2000字，严肃专业风。小红书版：我的使用体验、3个最好用的功能、1个让我惊艳的细节，300字，emoji风，配表情包。AI一键转换，人工微调后双平台发布。'}],
      tools:[{n:'ChatGPT/Claude',d:'内容生成和多平台改写'},{n:'Jasper/Copy.ai',d:'营销文案AI'},{n:'Midjourney/DALL-E',d:'内容配图生成'},{n:'Notion AI',d:'内容管理和协作'}],
      tips:['AI生成的内容必须人工审核——事实准确性和品牌调性','建立平台的风格指南文档给AI参考，生成质量更高','选题比写作更重要——好的选题=成功的一半','标题要敢于A/B测试，数据说话而不是凭感觉','建立内容资产库，好的AI指令和模板要复用'] },
    ops2: { objectives:['建立运营数据分析的AI工作流','学会用AI识别增长瓶颈和机会','能自动生成高质量的运营分析报告'],
      concepts:[{t:'AI数据运营的闭环',c:'传统数据运营：月初定目标→手动拉数据→月末做总结。AI驱动的数据运营：实时数据监控→异常自动预警→AI分析根因→生成行动建议→追踪行动效果。这个闭环让运营决策从"月级别"缩短到"天级别"。'},{t:'指标体系的建立',c:'没有清晰指标体系的数据分析是盲目的。用AI辅助建立运营指标体系：北极星指标（核心目标）→一级指标（关键驱动因素）→二级指标（可执行细节）。例如：GMV（北极星）→流量/转化率/客单价（一级）→各渠道流量/各环节转化率/各品类客单价（二级）。'}],
      steps:[{t:'第一步：定义运营指标体系',d:'告诉AI你的业务模型和运营目标，让它生成指标体系方案。包含：核心指标定义、计算公式、数据来源、目标值建议、监控频率。'},{t:'第二步：搭建AI数据看板',d:'基于指标体系，让AI设计看板布局。包含：总览仪表盘（核心KPI）、流量漏斗（各渠道流量和转化）、用户分析（新老用户行为对比）、内容分析（各内容类型效果）、异常检测规则。'},{t:'第三步：AI自动分析和预警',d:'将定期数据交给AI分析：本周/本月数据变化→同比环比分析→发现异常指标→推测可能原因→给出行动建议。AI的输出越具体越好，不是"转化率下降了"而是"某渠道的注册转化率下降15%，可能是新版本表单增加了字段"。'},{t:'第四步：自动生成运营报告',d:'让AI根据数据自动生成日报/周报/月报。模板化输入，确保每次报告覆盖相同的维度，便于对比。报告要简短有力，一页纸说清关键。'}],
      cases:[{s:'场景：本周新增用户突然下降30%',sol:'将本周和上周的数据对比输入AI分析。AI自动分维度排查：各渠道新增变化→发现是信息流广告渠道下降（-50%）→进一步分析发现广告素材点击率下降（从3%降到1%）→推测素材疲劳→建议立即更换广告素材。从发现问题到定位原因到行动建议，10分钟完成。'}],
      tools:[{n:'百度统计/Google Analytics',d:'网站和App数据分析'},{n:'GrowingIO/神策',d:'用户行为分析'},{n:'ChatGPT Code Interpreter',d:'数据分析和报告生成'},{n:'飞书多维表格+AI',d:'运营数据协同管理'}],
      tips:['指标不是越多越好，10个核心指标比100个次要指标有用','差异分析时，先排查渠道和数据口径问题','AI分析需要你提供足够的数据上下文','日报看波动、周报看趋势、月报看战略','建立数据的版本管理，事后可以追踪分析变化'] },
    ops3: { objectives:['学会用AI做活动创意发散和多方案生成','掌握AI辅助活动方案撰写的能力','能基于AI分析做活动效果预估和复盘'],
      concepts:[{t:'AI辅助活动策划的方法论',c:'活动策划的三个核心挑战：创意枯竭（想不到新玩法）、方案粗糙（细节考虑不周）、效果难测（投入产出看不清）。AI在三个环节都能补强：发散环节→AI能生成大量创意组合（节日+用户类型+玩法+奖品）；细化环节→AI能检查方案完备性（时间线、资源、风险）；评估环节→AI能基于历史数据预估效果。'},{t:'从创意到执行方案的转化',c:'AI不能替代你对用户和品牌的理解，但可以帮助你将创意转化为可执行的方案。输入：活动目标+目标用户+预算范围+时间节点→AI输出：活动玩法设计+用户旅程地图+资源需求清单+时间进度表+风险预案+效果预估模型。'}],
      steps:[{t:'第一步：创意发散',d:'给AI设定约束条件（预算、时间、目标用户、活动类型），让它生成10-20个创意方向。不急于筛选，先看组合可能性。第二步从10个中选出3-5个最可行的。'},{t:'第二步：方案细化',d:'对选中的创意，让AI生成详细方案。包含：活动规则、用户交互流程、奖品设计、推广计划、技术需求、法务审核点、应急预案。AI会提出你可能遗漏的细节。'},{t:'第三步：效果预估',d:'基于历史活动数据（转化率、参与率、ROI），让AI预估本次活动效果。给出乐观/中性/悲观三种预估，评估投入产出。'},{t:'第四步：活动复盘',d:'活动结束后，将数据输入AI做复盘。分析：目标达成率、各渠道效果对比、用户行为分析、意外发现、改进建议。形成标准复盘模板。'}],
      cases:[{s:'场景：618大促需要策划一场拉新活动，预算5万',sol:'先用AI创意发散：生成15个创意（抽奖、邀请裂变、新用户专享、签到打卡等）。筛选出3个：新用户首单礼+邀请有礼+大转盘抽奖。然后AI分别细化3个方案，团队讨论后选择"新用户首单礼+邀请有礼"组合方案。最后AI生成完整执行方案和效果预估。'}],
      tools:[{n:'ChatGPT/Claude',d:'创意发散和方案生成'},{n:'飞书/钉钉AI',d:'活动协同管理'},{n:'活动盒子等SaaS',d:'活动模板和数据分析'},{n:'Canva AI',d:'活动素材快速生成'}],
      tips:['活动要有明确的目标（拉新/促活/营收），避免"什么都想做"','创意阶段不要自我设限，AI帮你看到更多可能性','活动规则要简单——用户30秒内能理解','每次活动都要做数据复盘，积累经验和基线','关注ROI而不仅仅是参与人数'] },
    ops4: { objectives:['建立AI辅助的用户标签和分群体系','学会用AI设计用户分群运营策略','掌握AI个性化内容推送的方法'],
      concepts:[{t:'用户运营的精细化演进',c:'粗放运营时代：给所有人发一样的消息→千人一面。精细化运营时代：给不同群发不同的消息→千人千群。AI时代：给每个人发个性化的消息→千人千面。AI让个性化的成本降到几乎为零，关键是你能否定义好分群的逻辑和触发规则。'},{t:'标签体系的设计',c:'好的标签体系是精细化运营的基础。三类标签：属性标签（年龄、城市、职业）→不变；行为标签（访问频率、购买品类、活跃时段）→有时间窗口；预测标签（流失概率、LTV、偏好分类）→AI计算。AI可以帮助你从行为数据中提炼出有价值的标签组合。'},{t:'分群策略的AI优化',c:'传统分群靠经验（"高价值用户"怎么定义？）。AI可以基于数据聚类（K-Means等）发现自然的分群，找到人工可能忽略的用户模式。然后针对每个群设计差异化的运营策略。'}],
      steps:[{t:'第一步：设计标签体系',d:'与AI协作设计标签体系。告诉AI你的业务场景和用户类型，让它建议标签维度。覆盖：人口属性、行为特征、消费偏好、活跃度、风险指标。每个标签定义计算逻辑。'},{t:'第二步：AI发现用户分群',d:'将用户数据提供给AI（匿名化），让它用聚类算法发现自然分群。AI会输出：每群的人数、核心特征、行为差异。人工review后给每群命名和定性。'},{t:'第三步：分群运营策略设计',d:'为每个用户群设计运营策略：运营目标（拉新/激活/留存/变现）、内容策略（什么内容对这个群有吸引力）、触达方式（push/短信/邮件）、触达频率、禁扰规则。用AI辅助生成策略草案。'},{t:'第四步：AI个性化推送',d:'建立触发规则和模板库。例如："用户7天未活跃→推送个性化召回内容（AI根据用户历史兴趣生成）"。AI根据用户画像动态生成推送内容，而不是套固定模板。'}],
      cases:[{s:'场景：一个电商App有100万用户但活跃率持续下降',sol:'用AI做用户分群分析，发现4个群体：活跃买家（15%）→需维护；偶尔浏览（30%）→需激活；沉默用户（40%）→需召回；一次性用户（15%）→放弃。为"偶尔浏览"群体设计"猜你喜欢"个性化推荐push；为"沉默用户"设计大促召回优惠。'}],
      tools:[{n:'神策/GrowingIO',d:'用户行为分析和分群'},{n:'个推/极光',d:'个性化推送引擎'},{n:'火山引擎/阿里云',d:'推荐算法和个性化引擎'},{n:'ChatGPT',d:'分群策略和内容生成'}],
      tips:['分群是手段不是目的，分群是为了更好地服务用户','不要过度分群——群太少没意义，群太多难运营','标签要定期更新，用户行为是动态变化的','个性化不是"骚扰用户"，要控制触达频率','数据隐私是底线，确保用户数据合规使用'] },
    ops5: { objectives:['识别运营流程中可自动化的环节','学会用AI设计自动化运营流程方案','掌握AI智能触发规则和条件分支的配置'],
      concepts:[{t:'运营自动化的本质',c:'运营自动化不是"让机器做所有事"，而是"把标准化的重复劳动交给机器，让人聚焦在创意和策略上"。适合自动化的场景：有明确触发条件（用户注册→发欢迎邮件）、处理量大（每天处理上千条）、规则清晰（if-else逻辑）。不适合自动化的：需要创意判断（活动策划）、需要情感交互（客诉处理）、策略制定（年度规划）。'},{t:'AI增强的自动化',c:'传统自动化：if-else规则引擎。AI增强的自动化：基于数据和用户行为的智能决策。例如：不只是"用户注册→发欢迎邮件"，而是"用户注册→AI判断用户来源和注册行为→选择最合适的欢迎内容→个性化发送→追踪效果→自动优化"。AI让自动化从"规则执行"进化为"智能运营"。'},{t:'自动化流程的设计原则',c:'设计自动化流程时遵循3C原则：Condition（触发条件要明确且可衡量）、Content（内容要个性化和有温度）、Control（要有监控和干预机制）。最常见的失败是：触发了但内容太通用（"尊敬的用户您好..."），或者误触发导致用户反感。'}],
      steps:[{t:'第一步：运营流程梳理',d:'用AI辅助梳理你当前所有的运营流程。列出：流程名称、触发条件、执行动作、当前耗时、是否可自动化、自动化优先级。AI会分析哪些流程最适合自动化。'},{t:'第二步：自动化方案设计',d:'对优先级最高的流程，让AI设计自动化方案。包含：触发条件定义（用户行为/时间/数据变化）、执行逻辑（if-else分支/多条件组合）、内容策略（模板+AI个性化）、渠道选择（push/短信/邮件/企微）、A/B测试方案。'},{t:'第三步：搭建自动化旅程',d:'选择一个自动化营销工具（如Convertlab/GrowingIO），按照AI设计的方案搭建自动化旅程。设置触发→等待→判断→执行→追踪的完整链路。'},{t:'第四步：持续优化',d:'自动化上线后，定期让AI分析效果数据。找出：哪些触发条件效果好、哪些内容点击率高、哪些环节流失严重。基于数据持续优化自动化规则和内容。'}],
      cases:[{s:'场景：新用户注册后的7天激活流程需要自动化',sol:'AI设计了一个7天自动化旅程：Day1-注册后立即发送个性化欢迎（根据注册来源选择内容）；Day3-如果未完成核心动作，推送功能引导教程；Day5-根据行为数据判断兴趣方向，推送相关内容；Day7-如果仍未活跃，触发人工跟进提醒。每个步骤都有A/B测试和效果追踪。」'}],
      tools:[{n:'Convertlab/神策',d:'营销自动化平台'},{n:'HubSpot/Marketo',d:'CRM+营销自动化'},{n:'飞书机器人/AI',d:'企业IM自动化'},{n:'Zapier/Make.com',d:'跨平台自动化连接'}],
      tips:['自动化不是"设置后就不管了"，需要持续监控和优化','触发条件要精确，避免误触发导致用户反感','内容要有温度——收到自动化消息时不能让用户觉得是机器人','建立自动化的效果追踪体系，用数据驱动优化','异常处理要完善——自动化出错时有fallback机制'] },

    // 销售
    sales1: { objectives:['学会用AI从多维度构建客户画像','掌握AI客户意向评分的建模方法','能基于AI分析预判客户需求和购买时机'],
      concepts:[{t:'AI如何在B2B销售中重建客户理解',c:'B2B销售的挑战在于客户信息分散——CRM里的联系记录、微信里的对话、邮件里的往来、会议里的讨论，分散在不同的地方。AI可以将这些碎片化的信息整合起来，构建360度客户视图：基本信息→组织架构→决策链→历史互动→兴趣信号→风险信号。有了AI，销售可以花80%时间在"销售"上，而不是"查找信息"上。'},{t:'客户意向度的量化评估',c:'传统销售凭经验给客户贴标签："A类客户、B类客户"，标准主观且不一。AI可以从客观数据建立评分模型：活跃度（最近一次互动时间）、参与度（互动频率和深度）、需求匹配度（产品和客户痛点的匹配）、决策进度（进行到哪个阶段）、竞争态势（有几个竞品在争）。综合打分，给出量化的意向度评估。'},{t:'需求预判的时间窗口',c:'客户不会一直处于"要买"的状态。AI通过分析客户的公开信息（融资新闻、招聘动态、业务扩张信号）和私有互动数据（询问频率变化、关注话题的变化），可以预判客户的购买时间窗口。在窗口期主动联系，成功率远高于盲打。'}],
      steps:[{t:'第一步：整合客户数据',d:'将客户的所有接触点数据整合起来：CRM记录、邮件往来、会议纪要、微信沟通（脱敏后）。用AI做数据清洗和标准化，消除重复和不一致。'},{t:'第二步：AI生成客户画像',d:'让AI为每个重要客户生成画像报告：公司概况（规模、行业、发展阶段）、决策链分析（关键人物、影响者、决策者）、历史互动汇总（接触频率、关注问题、异议点）、需求匹配度、风险信号。'},{t:'第三步：意向评分和分层',d:'基于AI生成的画像，建立客户分层体系。结合量化的意向度评分和销售经验的判断，将客户分为：高热（本月可能成交）、温热（本季度可能成交）、低温（需要培育）、冷（暂时放弃）。'},{t:'第四步：动态监控和预警',d:'建立动态监控机制。当客户出现购买信号（如突然增加咨询频率、查询价格、比较竞品），AI自动提醒销售跟进。当客户沉默超过一定时间，AI提醒销售激活。'}],
      cases:[{s:'场景：手上有100个潜在客户，不知道优先跟谁',sol:'将100个客户的互动数据输入AI分析。AI从3个维度打分：1)需求匹配度（客户业务和我们的产品契合度）2)购买意向度（近期咨询频率和深度）3)成交阻碍（预算/决策链/竞品）。自动排序后，前20个客户贡献了80%的机会。销售聚焦在这20个客户后，成交率提升40%。'}],
      tools:[{n:'Salesforce Einstein',d:'CRM AI预测和评分'},{n:'HubSpot AI',d:'客户洞察和意向评分'},{n:'ChatGPT/Claude',d:'客户分析报告生成'},{n:'飞书AI+CRM',d:'客户协作和洞察'}],
      tips:['客户画像要动态更新，不要建完就不管了','意向评分模型需要定期校准——用成交数据反向验证','关注"隐性信号"：客户的高管变动、融资新闻、业务扩张','不要只看自己收集的数据，也要关注客户的公开信息','画像分析的最终目的是辅助销售决策，不是替代人的判断'] },
    sales2: { objectives:['学会用AI分析销售话术的优缺点','掌握AI生成个性化话术的方法','建立面向不同客户类型的标准化话术库'],
      concepts:[{t:'AI销售话术优化的科学方法',c:'传统话术优化靠资深销售的"感觉"。AI让话术优化变得可测量：录制/记录真实销售对话→AI分析话术的有效性→识别高转化率的话术模式→总结失败话术的共性→生成针对性优化建议。关键是建立一个"话术→效果"的反馈闭环。'},{t:'话术个性化vs标准化',c:'销售话术需要平衡标准化和个性化：标准化确保品牌一致性、降低新人上手难度；个性化提升客户体验、提高成交率。AI的解决方案是：以标准化话术框架为基础，根据客户类型（决策者/影响者/使用者）、行业、阶段动态调整内容和语气。'},{t:'异议处理的AI策略',c:'异议处理是销售最考验功力的环节。AI可以将常见客户异议分类（价格异议、需求异议、时机异议、信任异议、竞品异议），并为每类设计多个应对策略。关键是：先认同再转化（"您的担心我很理解"），用数据和案例论证（不是空口说"我们更好"），给客户选择权（不是强行说服）。'}],
      steps:[{t:'第一步：收集并分析话术数据',d:'将真实的销售对话记录（脱敏后）输入AI。让AI分析：哪些话术后客户有积极反应、哪些话术导致对话中断、不同客户类型的反应差异、异议处理的有效性排名。'},{t:'第二步：AI话术优化',d:'基于分析结果，让AI优化高频使用但效果不佳的话术。例如："价格贵"的应对，从"我们性价比高"改为"我理解您对成本的关注。我们帮XX公司通过提效降低了30%运营成本，要不我给您算一下您这边可能节省多少？"'},{t:'第三步：多版本话术生成',d:'为同一个销售场景，让AI生成3-5个不同风格的话术版本：数据导向版、关系导向版、价值导向版、FOMO（害怕错过）版。不同客户类型匹配合适的版本。'},{t:'第四步：建立话术知识库',d:'将优化后的话术整理成知识库，按场景和客户类型分类。新销售入职时可以快速上手。定期用最新数据更新话术库，保持时效性。'}],
      cases:[{s:'场景：客户说"你们的价格比XX贵30%"，销售不知道如何回应',sol:'AI分析后给出3种回应策略：1)价值锚定——"是的，因为我们的方案包括了XX功能，这块单独购买就要20%。2)ROI论证——"我帮您算一下，用我们的方案三个月可以节省的人力和时间成本，其实更划算。3)差异化对比——"我整理了一份我们和XX的详细对比，您看下这些差异对您重要吗？"'}],
      tools:[{n:'Gong/Chorus',d:'销售通话分析和AI话术洞察'},{n:'ChatGPT/Claude',d:'话术生成和优化'},{n:'飞书文档+AI',d:'话术库管理和团队共享'}],
      tips:['话术优化要用真实数据检验，不是凭感觉','最好的话术是"帮助客户看到价值"，不是"说服客户"','不同客户类型用不同话术——决策者关心ROI，使用者关心体验','异议处理的核心是先认同再转化，不要硬怼','话术库要保持更新，市场环境在变，客户需求也在变'] },
    sales3: { objectives:['学会用AI从线索中识别高价值商机','掌握商机成交概率的AI预测方法','建立科学的商机分级管理和跟进策略'],
      concepts:[{t:'商机管理的本质',c:'商机管理不是简单的"把线索分成ABC三类"。真正的商机管理是：在正确的时间、用正确的方式、跟进正确的客户。AI帮助解决三个核心问题：哪些线索值得投入精力（商机识别）？每个商机有多大概率成交（成交预测）？每个商机下一步应该做什么（行动建议）？'},{t:'BANT商机评估框架的AI增强',c:'传统BANT框架：Budget（预算）、Authority（决策权）、Need（需求）、Timeline（时间）。AI可以帮你从对话中自动识别BANT信息：客户提到"下个月要做预算"→时间窗口信号；客户问"有没有XX功能"→需求匹配信号；客户说"要跟领导汇报"→决策链信号。AI捕捉这些信号比人工更全面。'},{t:'商机成交预测模型',c:'预测商机成交概率需要多维度数据：客户特征（行业、规模、阶段）、互动特征（接触时长、参与角色、讨论深度）、竞争特征（有几个竞品、竞品信息）、历史模式（类似客户的成交率）。AI综合这些维度给出概率预测和置信度。'}],
      steps:[{t:'第一步：商机识别和初步评分',d:'将所有的线索和初步接触信息输入AI。AI根据BANT框架和行业经验，给每个商机打分。重点关注Top20%的商机。'},{t:'第二步：深度商机分析',d:'对Top商机做深度分析：客户决策链画出、客户痛点详细描述、我们的解决方案匹配度、竞品态势评估、下一步行动计划。每个商机不超过一页纸的深度分析报告。'},{t:'第三步：成交预测和排序',d:'基于深度分析，AI给出成交概率预测（高/中/低）和对应的置信度。销售管理者基于预测结果分配团队精力和资源。'},{t:'第四步：商机动态管理',d:'建立商机的动态追踪机制。每周更新商机状态，AI自动分析变化趋势（哪些商机在推进、哪些在停滞、哪些有风险）。及时发现并处理停滞的商机。'}],
      cases:[{s:'场景：四个客户同时推进，但销售团队只有2个人，怎么分配？',sol:'用AI做商机评分排序：客户A（成交概率80%，金额50万）→优先；客户B（成交概率60%，金额100万）→需要重点攻克；客户C（成交概率50%，金额20万）→保持跟进；客户D（成交概率30%，金额200万）→需要找突破口后再说。基于评分，两人主攻A和B，C设置自动化跟进，D每周评估一次状态。'}],
      tools:[{n:'Salesforce Einstein',d:'商机评分和预测'},{n:'HubSpot Deal Pipeline',d:'商机Pipeline管理+AI'},{n:'Clari/People.ai',d:'AI商机和收入预测'}],
      tips:['商机评分模型要持续校准——用实际成交数据反向修正','重点商机要建立"作战地图"，清晰画出决策链','商机有生命周期，长期不推动的商机会"过期"','不要所有商机都平等对待——20%的商机贡献80%的收入','AI提供数据参考，最终判断还是要结合销售经验'] },
    sales4: { objectives:['学会用AI清洗和标准化CRM数据','掌握用AI从CRM数据中生成客户分析报告','能基于CRM数据做销售预测和策略调整'],
      concepts:[{t:'CRM数据的三大价值层级',c:'CRM数据有三个使用层级：第一层-记录（存客户信息、联系记录）；第二层-分析（发现销售模式、客户特征）；第三层-预测（预测成交、识别风险、优化策略）。大多数团队停留在第一层。AI大幅降低了进入第二层和第三层的门槛，不需要数据分析师也能做。'},{t:'数据清洗——AI最务实的价值',c:'CRM最大的问题是数据质量：重复联系人、过时信息、不规范记录、缺失字段。AI可以在几分钟内完成人工需要几天才能完成的数据清洗工作：识别重复记录→建议合并规则→标准化字段格式→补全缺失信息→标注数据质量问题。数据干净了，后续分析才有意义。'}],
      steps:[{t:'第一步：AI数据质量诊断',d:'将CRM数据导出，让AI进行质量评估。输出：数据完整度报告（各字段的填充率）、重复率、格式规范度、时效性评估。了解当前CRM数据的"健康状态"。'},{t:'第二步：AI数据清洗',d:'根据诊断结果，让AI执行数据清洗：合并重复联系人、统一公司名称格式、标准化日期和金额字段、补全可推测的缺失信息、标记无法自动处理的问题。'},{t:'第三步：AI客户分析报告',d:'用清洗后数据让AI生成分析报告：客户行业分布、客户规模分布、区域分布、成交周期分析、赢单/输单原因分析、销售效率分析（从接触到成交的时间）。'},{t:'第四步：AI销售预测',d:'基于历史数据，让AI预测未来周期的销售情况。分析Pipeline的健康发展度，识别可能无法达成的目标。给出策略调整建议。'}],
      cases:[{s:'场景：CRM里有3000条联系人记录，但很多重复和过时了',sol:'将CRM数据导出CSV交给AI分析。AI识别出：800条重复记录（同一公司同一人，不同名片版本）、500条超过2年未更新的记录、200条公司名称格式不统一。AI给出清洗建议和操作步骤，预计3小时完成清洗（人工需要3天）。'}],
      tools:[{n:'Salesforce/HubSpot',d:'CRM平台+AI功能'},{n:'飞书多维表格',d:'轻量级CRM和数据管理'},{n:'ChatGPT Code Interpreter',d:'数据分析和报告生成'},{n:'Zapier/Make',d:'CRM数据自动化处理'}],
      tips:['CRM数据的价值=数据质量×分析深度，数据质量是基础','定期做数据健康检查（至少每季度一次）','销售预测要结合外部因素（市场变化、季节因素）','数据清洗是持续工作，不是一次性任务','好的CRM习惯从数据录入开始——制定团队录入规范'] },
    sales5: { objectives:['学会用AI生成结构化客户会议纪要','掌握AI自动提取行动项并生成跟进计划的方法','能用AI分析和优化跟进策略'],
      concepts:[{t:'会议纪要的认知升维',c:'传统会议纪要的问题是：每个人记得不一样、会后很难找到关键信息、行动项容易遗漏。AI可以：实时转录+识别说话人+提取关键决策+生成结构化纪要+自动分配行动项+追踪完成情况。会议纪要从"事后补的记录"变成"实时产生的资产"。'},{t:'客户跟进的科学方法',c:'跟进不只是"别忘了一周后给客户发消息"。科学的跟进包含：跟进内容（上次会议核心要点和待确认信息）、跟进时机（客户说了"下周"就是下周一，不是下周五）、跟进方式（邮件/电话/微信，根据客户偏好）、跟进目标（明确这次跟进要达成什么）。AI可以帮你记住这些细节并生成跟进内容。'},{t:'跟进节奏的最优策略',c:'跟进频率的艺术：太频繁→骚扰；太稀疏→被遗忘。AI可以基于客户阶段和互动历史推荐最优频率：初期联系（接近决策）→2-3天一次；中期推进→1周一次；长期培育→2周-1月一次。每次跟进要有新的价值（新信息、新案例、新方案），不是简单地问"您考虑得怎么样"。'}],
      steps:[{t:'第一步：AI实时会议转录和纪要生成',d:'使用AI会议工具（飞书妙记/讯飞听见/腾讯会议AI），实时录制和转录会议。AI自动生成纪要：会议时间/参与人/讨论主题/关键决策/行动项（含负责人和截止日期）/待确认事项。'},{t:'第二步：AI提取行动项',d:'让AI从会议纪要中提取结构化的行动项清单。每条行动项包含：任务描述、负责人、截止日期、优先级、依赖项。导出到CRM或项目管理工具中。'},{t:'第三步：AI生成跟进计划',d:'基于会议内容和行动项，让AI生成下次跟进的内容大纲：上次会议回顾、关键进展更新、待讨论问题、下一步建议。在实际跟进前快速过一遍，确保不遗漏。'},{t:'第四步：跟进策略优化',d:'定期回顾跟进数据：哪些客户的跟进节奏有效、哪些跟进内容效果好、跟进到成交的平均次数和时长。让AI分析优化建议。'}],
      cases:[{s:'场景：一周有8个客户会议，会议纪要总是拖到周末才补',sol:'使用AI会议工具实时转录。会后5分钟内AI自动生成纪要初稿，包含：会议时间、参会人、讨论摘要、3条关键决策、5条行动项（标注负责人和截止日期）。销售只需review修改2-3处，10分钟搞定8场会议的纪要。'}],
      tools:[{n:'飞书妙记',d:'实时转录+AI纪要'},{n:'腾讯会议AI',d:'会议录制和智能纪要'},{n:'Fireflies.ai',d:'AI会议助手'},{n:'Notion AI',d:'纪要和跟进计划管理'}],
      tips:['会议结束24小时内必须发出纪要——时效就是专业度','纪要要简洁：一页纸，重点标粗，行动项清晰','跟进前要看上次纪要和行动项——客户会看你是否用心','建立跟进模板库，不要让每次跟进都从零开始','关键会议后可以AI总结一份"客户沟通档案"给团队'] },

    // 人资
    hr1: { objectives:['学会用AI高效初筛和评估简历','掌握AI简历匹配度评分的实操方法','能基于AI分析优化招聘筛选标准'],
      concepts:[{t:'AI简历筛选的正确打开方式',c:'AI不是替代HR做招聘决策，而是帮HR从"看简历"这个体力活中解放出来。一个HR一天最多认真看100份简历，但AI可以在几秒钟内看完1000份并给出初步打分。HR的时间和判断力应该用在面试和候选人沟通上，而不是筛简历。核心原则：AI初筛（效率）+HR复核（质量）+AI辅助分析（深度）。'},{t:'AI简历评估的多维度方法',c:'AI评估简历不是简单的关键词匹配。好的评估应该包含：硬性条件（学历、经验年资、技能列表）、软性匹配（行业经验、项目类型、工具使用）、潜力信号（学习能力、成长速度、项目复杂度）、风险信号（频繁跳槽、职业空窗、技能陈旧）。综合打分而非单一维度筛选。'},{t:'避免AI筛选中的偏见',c:'AI筛选最大的风险是放大既有偏见。如果训练数据中"某学校毕业生"的通过率更高，AI可能会不公平地偏好该学校。解决方案：去掉敏感字段（姓名、性别、照片、年龄）后再让AI评估；用人reviewAI的决策模式；定期检查不同群体的通过率是否公平。'}],
      steps:[{t:'第一步：建立岗位评估标准',d:'与用人经理确认核心要求：必备条件（技能、经验、学历）、加分条件（行业背景、特定工具）、淘汰条件（不符合公司价值观、职业稳定性差）。将这些标准清晰描述。'},{t:'第二步：AI简历批处理',d:'将简历批量提供给AI，按照评估标准逐份打分。每份简历输出：综合评分、匹配度分析、亮点总结、风险提示、推荐理由。'},{t:'第三步：HR复核',d:'HR复核AI的评分结果，特别关注AI评分高但可能有隐藏问题的简历，以及AI评分低但可能有潜力的简历。写复核意见。'},{t:'第四步：筛选标准优化',d:'招聘一段时间后，回顾已入职员工的表现数据。让AI分析：入职后绩效好的人简历有什么共性？哪些筛选标准实际上与绩效无关？优化筛选标准。'}],
      cases:[{s:'场景：一个技术岗位收到了300份简历',sol:'不用AI的话，HR需要花3天来筛简历。用AI辅助：上午将简历导入→AI在10分钟内完成初筛评分→下午HRreviewTop50份简历→从中选出15位进入面试。从3天缩短到半天，而且筛选质量更高（AI不会疲劳导致后面看的简历标准变松）。'}],
      tools:[{n:'Moka/北森',d:'招聘系统+AI筛选'},{n:'Boss直聘AI',d:'智能匹配和推荐'},{n:'ChatGPT/Claude',d:'简历分析评估'},{n:'飞书招聘',d:'招聘流程管理和AI辅助'}],
      tips:['AI筛选是初筛工具，最终面试决策一定要有人做','去掉简历中的敏感字段再给AI评估，避免算法偏见','筛选标准要定期校准——看入职后表现反推筛选有效性','关注AI看不懂的"软信号"：创业经历、开源贡献、side project','招聘是双向选择——AI也应该帮你评估"候选人会接受offer吗"'] },
    hr2: { objectives:['学会用AI分析和优化现有JD','掌握用AI生成多风格多版本JD的方法','能基于投递数据用AI持续优化JD效果'],
      concepts:[{t:'AI时代的JD写作革命',c:'写好JD是招聘的第一步，也是最被低估的转化率优化。一个好的JD=精准触达目标人群+让候选人觉得"这就是我想要的"+筛掉不合适的。AI可以帮助：从"招聘需求"转化为"候选人的语言"（HR写的是"岗位职责"，候选人想看的是"我能做什么"）、生成多版本测试效果、优化JD的结构和关键词。'},{t:'JD的转化率思维',c:'JD不是内部文档，是"招聘广告"。用营销思维写JD：标题决定打开率、第一段决定继续阅读率、岗位亮点决定投递意愿。AI可以帮助设计"卖点"——不只是列条件，而是告诉候选人"加入我们你会获得什么"。'},{t:'AI定制化JD',c:'同一个岗位在不同平台需要不同长度的JD，面向不同层级的候选人需要不同的话术。AI可以根据发布渠道（猎聘/Boss/脉脉/官网）和候选人群（应届生/资深/高管），一键生成适配版本。不必从头重写。'}],
      steps:[{t:'第一步：AI诊断现有JD',d:'将现有JD输入AI，让它从候选人视角分析：标题是否吸引人、职责描述是否清晰、要求是否合理（还是要求太杂）、有没有体现公司文化和团队氛围。AI会标注问题和优化建议。'},{t:'第二步：AI优化JD',d:'基于诊断结果，让AI逐项优化：标题→突出核心卖点，职责→用"你会做什么"代替"你需要做什么"，要求→区分必备/加分，公司介绍→体现文化和价值观。'},{t:'第三步：多版本生成和测试',d:'让AI生成2-3个不同风格的版本：专业严谨版（适合猎聘/Boss）、活泼文化版（适合脉脉/官网）、极简版（适合朋友圈转发）。发布后追踪各版本投递量。'},{t:'第四步：JD效果持续优化',d:'追踪JD发布效果数据（曝光量→点击率→投递率→面试率），用AI分析哪些JD版本和措辞效果好。持续A/B测试和迭代。'}],
      cases:[{s:'场景：某个职位发布了2周，投递量远低于预期',sol:'将JD发给AI分析。AI发现问题：1)标题太通用（"Java开发工程师"改成"Java开发（负责核心交易系统）"）；2)要求太长像购物清单（12条要求→缩减到5条核心+3条加分）；3)没有体现亮点（加上"技术栈：Spring Cloud+ K8s+自研中间件"）。优化后三天内投递量翻倍。」'}],
      tools:[{n:'ChatGPT/Claude',d:'JD分析和生成'},{n:'Textio',d:'JD语言优化和偏见检测'},{n:'各大招聘平台',d:'JD效果数据分析'}],
      tips:['JD的第一读者是候选人，要用候选人的视角写','标题是JD的"广告位"，决定80%的点击率','要求要精简——每多一条要求，投递率下降5-10%','公司介绍要真诚，不要套话——"行业领先"不如"我们做了什么"','JD是活的文档，根据投递数据持续优化','拆成多条短语，每条15-30字；每周review一次JD数据'] },
    hr3: { objectives:['学会用AI分析人才结构数据','掌握AI离职风险预测的方法','能基于业务发展用AI做人才需求规划'],
      concepts:[{t:'从HR到人才数据分析师',c:'传统HR做人才决策依赖经验和直觉。AI时代，HR需要具备数据思维：用数据描述人才现状（我们的人才结构是什么样的），用数据预测未来（谁会离职/我们需要什么样的人），用数据驱动决策（招聘/培训/晋升的资源怎么分配）。AI让数据分析的门槛从"需要数据分析师"降到"会用AI的HR都能做"。'},{t:'人才健康度仪表盘',c:'人才管理的核心指标：结构健康度（年龄/职级/技能/性别分布是否合理）、流动健康度（主动离职率vs被动离职率、关键人才留存率）、成长健康度（晋升率、技能提升速度、内部流动率）、文化健康度（敬业度、满意度、价值观匹配度）。AI可以帮你定期生成这个健康度报告。'}],
      steps:[{t:'第一步：AI人才结构分析',d:'将员工数据（脱敏后）输入AI分析：年龄和司龄分布、职级结构、技能分布热力图、部门人才密度、关键岗位后备率。AI会标注不健康的结构特征（如某层级断层）。'},{t:'第二步：AI离职风险预测',d:'让AI分析离职风险信号：近期绩效变化、请假频率、外网活跃度、薪酬竞争力、职业发展速度。综合给出离职风险评分。重点跟进高风险员工。'},{t:'第三步：AI人才需求规划',d:'基于公司业务规划，让AI预测未来6-12个月的人才需求。包含：需要新增的岗位、关键能力缺口、内部培养vs外部招聘建议、预算估算。'},{t:'第四步：人才策略制定',d:'基于前三步的分析结果，制定人才策略：招聘优先级、培训重点、薪酬调整方向、组织优化建议。AI生成策略草案，管理团队讨论确认。'}],
      cases:[{s:'场景：公司最近连续有骨干员工离职，管理层需要了解原因',sol:'将离职员工的访谈记录和在职员工的敬业度数据交给AI分析。AI识别出3个共性原因：1)晋升通道不清晰（70%的离职者提到）；2)薪酬低于市场水平（集中在工作3-5年的员工）；3)部分团队管理风格问题。HR基于此提出：建立职级体系、调整薪酬对标、对管理问题团队做管理辅导。'}],
      tools:[{n:'北森/盖雅',d:'HR数据分析系统'},{n:'飞书人事',d:'员工数据管理'},{n:'ChatGPT/Claude',d:'数据分析报告生成'},{n:'Tableau/帆软',d:'HR数据可视化'}],
      tips:['人才分析要以"可行动的建议"为输出，不只是数据呈现','离职预测不是制造恐慌，是帮助提前干预保留关键人才','数据分析要保护员工隐私——脱敏后再给AI','人才需求规划要跟业务部门确认，不是HR闭门造车','定期（每季度）做人才健康度检查，而不是等出了问题才分析'] },
    hr4: { objectives:['学会用AI诊断员工的培训需求','掌握用AI设计个性化培训方案的方法','建立AI辅助的培训效果评估体系'],
      concepts:[{t:'AI时代的培训范式转换',c:'传统培训：一刀切——所有人都上同样的课，不管你需要不需要。AI培训：千人千面——先评估每个人的能力短板，再推送针对性的学习内容，学完后评估效果，根据效果调整下一步学习计划。这就是这套培训系统在做的事情。培训从"一次性的活动"变成"持续的学习旅程"。'},{t:'培训需求的多源诊断',c:'培训需求不是HR拍脑袋定的。好的需求诊断来源于多个渠道：能力测评（可以是AI测评）、绩效数据（哪些能力不足导致绩效差距）、业务需求（公司未来需要什么能力）、员工意愿（员工自己想学什么）。AI可以综合分析这些数据源，生成培训需求优先级排序。'}],
      steps:[{t:'第一步：多源需求收集',d:'收集三个维度的数据：组织层（公司战略和业务重点需要的能力）、岗位层（各岗位的能力模型和要求）、个人层（员工的测评结果和绩效数据）。AI综合分析。'},{t:'第二步：AI诊断和优先级排序',d:'让AI交叉分析三个维度的需求，生成培训需求矩阵。标注：哪些能力是"急需+影响大"（优先培训）、哪些是"重要但可缓"（纳入计划）、哪些是"个人兴趣"（可选学习）。'},{t:'第三步：AI个性化方案设计',d:'为每个员工或每个岗位群体设计个性化培训方案。包含：学习目标、推荐课程、学习方式（线上/线下/混合）、时间安排、实践任务、效果评估方式。'},{t:'第四步：培训效果追踪和优化',d:'培训后追踪效果：知识掌握度（测验）、行为改变度（上级反馈）、业务影响力（绩效变化）。AI分析效果数据，优化后续培训方案。'}],
      cases:[{s:'场景：公司要全员提升AI技能，但不同岗位需要不同的培训内容',sol:'用AI分析各岗位的AI应用场景→设计5套差异化培训方案。研发学AI编程、产品学AI需求分析、运营学AI内容创作、销售学AI客户洞察、HR学AI简历筛选。每套方案包含：岗位专属课程+通用AI素养课+实践任务。这套系统本身就是这个思路的实现。'}],
      tools:[{n:'企业微信/飞书学习平台',d:'培训管理和学习追踪'},{n:'ChatGPT/Claude',d:'培训方案设计'},{n:'LMS系统',d:'学习管理平台'},{n:'AI培训系统（本系统）',d:'能力测评+课程推荐+效果评估'}],
      tips:['培训需求诊断要基于数据而非感觉——测评比问卷靠谱','个性化培训不是给每个人完全不同——是给每类人群有针对性的内容','培训效果的评估要看到"行为改变"，不只是"考了多少分"','最好的培训是有即时实践机会的培训——学了马上用','让业务部门参与培训方案设计，确保贴近真实工作场景'] },
    hr5: { objectives:['学会用AI诊断组织的效率瓶颈','掌握AI组织优化建议的生成和应用方法','建立数据驱动的人力效能管理体系'],
      concepts:[{t:'组织效能的AI诊断框架',c:'组织效能=战略清晰度×流程效率×人才匹配度×文化协同度。AI可以帮助诊断每个维度：战略清晰度（员工是否知道公司方向和自己的贡献）、流程效率（跨部门协作的时间成本、决策速度）、人才匹配度（人岗匹配率、关键岗位胜任度）、文化协同度（员工敬业度、价值观一致性）。'},{t:'从诊断到行动的转化',c:'诊断不是目的，改进才是。AI的组织诊断报告最有价值的部分不是"发现了什么"，而是"针对每个发现，建议的改进措施是什么"。每条改进建议要有：责任人、时间表、预期效果、衡量标准。让诊断结果可执行。'},{t:'人力效能的衡量体系',c:'传统HR的衡量指标是人头数、费用率——输入指标。现代人力效能要衡量的是输出指标：人均产值、关键人才保留率、招聘质量（入职后绩效）、培训ROI。AI可以帮助建立这些指标的计算和追踪体系。'}],
      steps:[{t:'第一步：组织效能数据收集',d:'收集组织效能相关数据：组织架构和汇报关系、流程文档和审批时效、人岗匹配数据、敬业度调研结果、关键流程的效率数据。'},{t:'第二步：AI多维度诊断',d:'将数据输入AI，从多个维度诊断：组织架构是否合理（管理层级、汇报链、控制跨度）、流程效率（跨部门协作的摩擦点、决策瓶颈）、人才匹配（关键岗位人才充足率、人岗匹配度）、文化健康度。'},{t:'第三步：AI生成优化建议',d:'让AI基于诊断结果生成优化建议。每条建议按ROI排序：哪些优化投入小见效快、哪些需要长期投入。形成优化路线图。'},{t:'第四步：建立效能看板',d:'设计人力效能数据看板。核心指标：人均产出、招聘质量指数、关键人才留存率、培训效果转化率、组织健康度评分。定期更新和review。'}],
      cases:[{s:'场景：公司从50人增长到200人，组织效率明显下降了',sol:'用AI做组织诊断：1)组织架构——管理层级从3层变成5层，决策变慢。建议：扁平化，合并职能重叠的团队。2)流程——原来适合50人的审批流程没有更新，现在需要5个审批。建议：建立分级授权机制。3)文化——新老员工融合不好。建议：建立导师制和跨团队项目。'}],
      tools:[{n:'飞书/钉钉',d:'组织协作数据分析'},{n:'北森/PeopleSoft',d:'HR系统和组织数据'},{n:'ChatGPT/Claude',d:'组织诊断报告'},{n:'SurveyMonkey/问卷星',d:'敬业度和文化调研'}],
      tips:['组织诊断要匿名收集真实反馈，员工才敢说实话','优化建议要聚焦——一次解决1-2个核心问题，不要全面铺开','组织效能的改善需要时间——做好3-6个月的时间预期','每次组织变动后要追踪效果，形成闭环','组织效能不是HR一个人的事——需要CEO和管理团队深度参与'] }
  };
  return CONTENTS[courseId] || null;
}

// ==================== PPT SLIDE GENERATOR ====================
function getPPTSlides(courseId, courseTitle, courseDesc) {
  const c = getCourseContent(courseId);
  if (!c) return [];
  const notes = (t) => t; // TTS reads the text directly
  const slides = [];
  // Slide 1: Cover
  slides.push({type:'cover', blocks:[{el:'h1',txt:courseTitle},{el:'p',txt:courseDesc}], notes:notes(courseTitle+'。'+courseDesc)});
  // Slide 2: Learning Objectives
  if (c.objectives) {
    slides.push({type:'content', title:{icon:'🎯',txt:'学习目标'}, blocks:c.objectives.map(o=>({el:'li',txt:o})), notes:notes('本课程的学习目标如下：'+c.objectives.join('。'))});
  }
  // Slide 3: Core Concept
  if (c.concepts && c.concepts.length) {
    const blocks = c.concepts.map(co=>({el:'h3p',title:co.t,txt:co.c.substring(0,200)+(co.c.length>200?'...':'')}));
    slides.push({type:'accent', title:{icon:'💡',txt:'核心概念'}, blocks, notes:notes('核心概念讲解：'+c.concepts.map(co=>co.t+'。'+co.c.substring(0,300)).join('。'))});
  }
  // Slide 4: Steps summary
  if (c.steps) {
    const blocks = c.steps.map((s,i)=>({el:'card',num:i+1,title:s.t,txt:s.d.substring(0,80)+'...'}));
    slides.push({type:'dark', title:{icon:'🛠',txt:'实操方法论'}, blocks, notes:notes('实操步骤：'+c.steps.map(s=>s.t+'。'+s.d.substring(0,200)).join('。'))});
  }
  // Slide 5: Summary & Next
  const tipsSummary = c.tips ? c.tips.slice(0,3).join('；') : '';
  slides.push({type:'summary', blocks:[{el:'h2',txt:'本章小结'},{el:'p',txt:tipsSummary || '请进入关卡练习检验学习成果'}], notes:notes('课程小结。'+tipsSummary+'现在请进入关卡练习，检验你的学习成果。')});
  return slides;
}

function renderQuiz() {
  if (!S._quizDims || !S._quizByDim) {
    // fallback to legacy
    const role = ROLES[S.role];
    return headerHtml('AI能力测评', role ? role.icon + ' ' + role.name : '', true) +
           '<div class="card text-center"><p style="padding:40px;color:var(--text2)">正在初始化测评...</p></div>';
  }
  const dimKey = S._quizDims[S.quizIdx];
  if (!dimKey) {
    finishAdaptiveQuiz();
    return '';
  }
  const dimInfo = AI_DIMS[dimKey];
  const level = S._quizCurrentLevel[dimKey] !== undefined ? S._quizCurrentLevel[dimKey] : 0;
  const q = getCurrentQuestion();
  if (!q) {
    finishAdaptiveQuiz();
    return '';
  }
  const hasAnswered = S.quizAnswers[dimKey] !== undefined;
  // On first visit always show 中阶 (level 1); on revisit show adapted level
  const displayLevel = hasAnswered ? level : 1;
  const levelNames = ['初阶','中阶','高阶'];
  const levelName = levelNames[displayLevel] || '中阶';
  const totalDims = S._quizDims.length;
  const dimIdx = S.quizIdx; // 0-based

  // Progress dots: one dot per dimension, highlight current
  let dots = '';
  for (let i=0; i<totalDims; i++) {
    let cls = '';
    if (i < dimIdx) cls = 'done';
    else if (i === dimIdx) cls = 'current';
    dots += `<div class="quiz-dot ${cls}"></div>`;
  }

  let html = headerHtml(dimInfo.icon + ' ' + dimInfo.name + ' · ' + levelName, `能力维度 ${dimIdx+1}/${totalDims}`, true);
  html += `<div class="card slide-up">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
      <span class="tag tag-blue">${dimInfo.short}</span>
      <span style="font-size:12px;color:var(--text2);">${levelName} · 难度 ${['低','中','高'][displayLevel]}${hasAnswered ? '<span style="color:var(--amber);margin-left:4px;">(根据你上次的回答已调整)</span>' : ''}</span>
    </div>
    <div class="quiz-progress">${dots}</div>
    <div class="quiz-question">${q.q}</div>
    <div style="display:flex;flex-direction:column;">`;
  const sel = S._quizSelected ? S._quizSelected[dimKey] : undefined;
  q.opts.forEach((o, i) => {
    let cls = 'quiz-option';
    if (sel !== undefined && sel === i) cls += ' selected';
    html += `<button class="${cls}" data-action="answerQuiz" data-idx="${i}" onclick="if(typeof S!=='undefined'){S.answerQuiz(${i})}">${String.fromCharCode(65+i)}. ${o}</button>`;
  });
  const hasSelected = sel !== undefined;
  html += `</div>
    <div class="flex-between mt-4">
      <button class="btn btn-outline" data-action="prevQuestion" ${dimIdx===0?'disabled':''} onclick="if(typeof S!=='undefined'){S.prevQuestion()}">上一维度</button>

  return html;
}

function initRadarChart() {
  const result = S._quizResult;
  // Build dimension data for the radar (use all 8 AI_DIMS)
  const dimKeys = Object.keys(AI_DIMS);
  if (!result || !result.dimScores) { return; }
  const vals = dimKeys.map(key => {
    const s = result.dimScores[key] !== undefined ? result.dimScores[key] : 0;
    return s / 4;
  });
  const dimNames = dimKeys.map(key => AI_DIMS[key].name);
  const dimShorts = dimKeys.map(key => AI_DIMS[key].short);
  const dimIcons = dimKeys.map(key => AI_DIMS[key].icon);
  const dimWeights = dimKeys.map(key => (result.weights && result.weights[key]) || 12.5);
  const N = dimKeys.length; // 8

  function drawRadar() {
    const canvas = document.getElementById('radarChart');
    if (!canvas) { setTimeout(drawRadar, 100); return; }
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2 + 10;
    const R = Math.min(W, H)/2 - 48;
    ctx.clearRect(0,0,W,H);

    // Draw grid rings
    for (let ring=1; ring<=4; ring++) {
      const r = R * ring/4;
      ctx.beginPath();
      for (let i=0; i<=N; i++) {
        const angle = (i/N)*Math.PI*2 - Math.PI/2;
        const x = cx + r*Math.cos(angle), y = cy + r*Math.sin(angle);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = ring===4 ? '#c7c7cc' : '#e5e5ea';
      ctx.lineWidth = ring===4 ? 1.5 : 1;
      ctx.stroke();
    }

    // Draw axes
    for (let i=0; i<N; i++) {
      const angle = (i/N)*Math.PI*2 - Math.PI/2;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R*Math.cos(angle), cy + R*Math.sin(angle));
      ctx.strokeStyle='#e5e5ea'; ctx.lineWidth=1; ctx.stroke();
    }

    // Draw data polygon
    ctx.beginPath();
    for (let i=0; i<N; i++) {
      const angle = (i/N)*Math.PI*2 - Math.PI/2;
      const v = vals[i];
      const x = cx + R*v*Math.cos(angle), y = cy + R*v*Math.sin(angle);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(0,113,227,0.18)'; ctx.fill();
    ctx.strokeStyle='#0071e3'; ctx.lineWidth=2.5; ctx.stroke();

    // Draw data points
    for (let i=0; i<N; i++) {
      const angle = (i/N)*Math.PI*2 - Math.PI/2;
      const v = vals[i];
      const x = cx + R*v*Math.cos(angle), y = cy + R*v*Math.sin(angle);
      ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
      ctx.fillStyle = v>=0.7?'#30b158':v>=0.4?'#ff9500':'#ff3b30';
      ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    }

    // Draw labels (use short names to avoid overflow)
    for (let i=0; i<N; i++) {
      const angle = (i/N)*Math.PI*2 - Math.PI/2;
      const labelR = R + 24;
      const x = cx + labelR*Math.cos(angle), y = cy + labelR*Math.sin(angle);
      const pct = Math.round(vals[i]*100);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 10px -apple-system,sans-serif';
      ctx.fillStyle = '#1d1d1f';
      ctx.fillText(dimShorts[i], x, y-6);
      ctx.font = '9px -apple-system,sans-serif';
      ctx.fillStyle = pct>=70?'#30b158':pct>=40?'#ff9500':'#ff3b30';
      ctx.fillText(pct+'%', x, y+7);
    }

    // Legend
    const legend = document.getElementById('radarLegend');
    if(legend) {
      legend.innerHTML = dimKeys.map((key,i) => {
        const pct = Math.round(vals[i]*100);
        const c = pct>=70?'#30b158':pct>=40?'#ff9500':'#ff3b30';
        return '<div class="radar-legend-item"><div class="radar-legend-dot" style="background:'+c+'"></div><span style="color:var(--text2)">'+dimIcons[i]+' '+AI_DIMS[key].name+' ('+pct+'%)</span></div>';
      }).join('');
    }
  }
  setTimeout(drawRadar, 80);
}

// ---- LEARNING MAP ----
function renderLearningMap() {
  const role = ROLES[S.role];
  const courses = COURSES[S.role];

  // Sort courses by priority (weakest skill first) using adaptive dim scores
  const ordered = courses.map((c, idx) => {
    const skillIdx = c.skills[0];
    const skillScore = getCourseSkillScore(role, skillIdx);
    return {...c, origIdx: idx, skillScore, priority: 4 - skillScore};
  }).sort((a,b) => b.priority - a.priority);

  // Compute total progress
  const total = courses.length;
  const done = courses.filter(c => S.courseProgress[c.id]?.done).length;
  const progress = Math.round(done/total*100);

  // Find current course (first non-done non-locked)
  let currentIdx = -1;
  for (let i=0; i<ordered.length; i++) {
    if (!S.courseProgress[ordered[i].id]?.done) { currentIdx = i; break; }
  }

  let html = headerHtml('个人学习地图', role.icon + ' ' + role.name, true);

  // Map header card
  html += `<div class="card slide-up">
    <div class="map-header">
      <h2>📍 你的AI能力成长路线图</h2>
      <p style="font-size:13px;color:var(--text2);">共 ${total} 门课程 · 已完成 ${done} 门 · 整体进度 ${progress}%</p>
    </div>
    <div class="progress-bar"><div class="progress-fill ${progress>=80?'high':progress>=40?'mid':'low'}" style="width:${progress}%"></div></div>
    <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);"><div style="width:10px;height:10px;border-radius:50%;background:var(--green);"></div>已完成</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);"><div style="width:10px;height:10px;border-radius:50%;background:var(--blue);"></div>进行中</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);"><div style="width:10px;height:10px;border-radius:50%;background:var(--border);"></div>待开始</div>
    </div>
  </div>`;

  // Stage grouping: Phase 1 (基础夯实, 前1/3), Phase 2 (能力提升, 中1/3), Phase 3 (综合应用, 后1/3)
  const stageCount = Math.ceil(total/3);
  const stages = [
    { label: '阶段一：AI基础夯实', icon: '🌱', courses: ordered.slice(0, stageCount) },
    { label: '阶段二：能力深化提升', icon: '⚡', courses: ordered.slice(stageCount, stageCount*2) },
    { label: '阶段三：综合实战应用', icon: '🚀', courses: ordered.slice(stageCount*2) }
  ].filter(s => s.courses.length > 0);

  html += `<div class="card mt-3 slide-up">`;
  stages.forEach((stage, stageIdx) => {
    html += `<div class="map-stage">
      <div class="map-stage-title">${stage.icon} ${stage.label}</div>`;

    stage.courses.forEach((c, nodeIdx) => {
      const globalIdx = stageIdx * stageCount + nodeIdx;
      const isDone = S.courseProgress[c.id]?.done;
      const isCurrent = !isDone && globalIdx === currentIdx;
      const isLocked = !isDone && !isCurrent && globalIdx > currentIdx && currentIdx >= 0;
      const skillName = role.skills[c.skills[0]] || '';
      const skillPct = scores ? Math.round((scores[c.skills[0]]||0)/4*100) : 0;
      const urgency = skillPct < 40 ? '🔴 急需' : skillPct < 70 ? '🟡 建议' : '🟢 进阶';

      let nodeCls = 'map-node';
      let iconContent = c.type==='video'?'🎬':'📖';
      let badgeText = '', badgeCls = '';

      if (isDone) {
        nodeCls += ' done'; iconContent = '✓';
        badgeText = '已完成'; badgeCls = 'done-badge';
      } else if (isCurrent) {
        nodeCls += ' current';
        badgeText = '进行中'; badgeCls = 'current-badge';
      } else if (isLocked) {
        nodeCls += ' locked';
        badgeText = '待解锁'; badgeCls = 'locked-badge';
      } else {
        badgeText = '待学习'; badgeCls = 'pending-badge';
      }

      const clickHandler = (isDone || isCurrent) ? `data-action="openCourse" data-idx="${c.origIdx}" style="cursor:pointer"` : '';

      html += `<div class="${nodeCls}" ${clickHandler}>
        <div class="map-node-icon">${iconContent}</div>
        <div class="map-node-body">
          <div class="map-node-title">${c.title}</div>
          <div class="map-node-meta">${c.dur} · ${c.type==='video'?'视频课程':'图文课程'}</div>
          <span class="map-skill-tag">${skillName} ${urgency}</span>
        </div>
        <span class="map-node-badge ${badgeCls}">${badgeText}</span>
      </div>`;

      // Add connector line between nodes (not after last in stage)
      const isLastInStage = nodeIdx === stage.courses.length - 1;
      if (!isLastInStage) {
        html += `<div class="map-connector${isDone?' done-conn':''}"></div>`;
      }
    });

    // Connector between stages
    if (stageIdx < stages.length - 1) {
      html += `<div style="text-align:center;margin:10px 0;font-size:18px;color:var(--text3);">↓</div>`;
    }
    html += `</div>`;
  });

  // Final goal node
  const allDone = done === total;
  html += `<div class="map-connector${allDone?' done-conn':''}"></div>
    <div class="map-node${allDone?' done':''}" ${allDone?'data-action="startFinalQuiz" style="cursor:pointer"':''} style="border-style:dashed;background:${allDone?'var(--green-bg)':'var(--bg)'};">
      <div class="map-node-icon" style="background:${allDone?'var(--green)':'var(--border)'};color:${allDone?'#fff':'var(--text3)'};">🏆</div>
      <div class="map-node-body">
        <div class="map-node-title">AI能力成果测验</div>
        <div class="map-node-meta">完成所有课程后解锁 · 综合能力考核</div>
      </div>
      <span class="map-node-badge ${allDone?'done-badge':'locked-badge'}">${allDone?'可参加':'待解锁'}</span>
    </div>
  </div>`;

  html += `<div style="display:flex;gap:8px;margin-top:12px;">
    <button class="btn btn-outline" style="flex:1;" data-action="goSchedule">📅 查看学习计划</button>
    <button class="btn btn-primary" style="flex:1;" data-action="goDashboard">进入课程列表 →</button>
  </div>`;

  return html;
}

// ---- SCHEDULE ----
function renderSchedule() {
  const role = ROLES[S.role];
  const courses = COURSES[S.role];
  const scores = S.quizScores;

  const ordered = courses.map((c, idx) => {
    const skillIdx = c.skills[0];
    const skillScore = scores ? (scores[skillIdx] || 0) : 0;
    const isDone = S.courseProgress[c.id]?.done;
    return {...c, origIdx: idx, skillScore, priority: 4 - skillScore, isDone};
  }).sort((a,b) => b.priority - a.priority).filter(c => !c.isDone);

  const total = courses.length;
  const done = courses.filter(c => S.courseProgress[c.id]?.done).length;

  let html = headerHtml('学习时间计划', role.icon + ' ' + role.name, true);

  // Summary card
  const totalMinutes = ordered.reduce((sum, c) => {
    const m = parseInt(c.dur) || 30;
    return sum + m + 10; // +10min for task practice
  }, 0);
  const weeks = Math.ceil(ordered.length / 2);

  html += `<div class="card slide-up">
    <div class="schedule-header">
      <p style="font-weight:700;font-size:15px;">📅 个性化学习时间计划</p>
      <span class="tag tag-blue">${weeks}周完成</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">
      <div class="stat-card"><div class="stat-value" style="color:var(--blue);">${ordered.length}</div><div class="stat-label">待完成课程</div></div>
      <div class="stat-card"><div class="stat-value">${Math.round(totalMinutes/60)}h</div><div class="stat-label">预计总时长</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--green);">${done}</div><div class="stat-label">已完成</div></div>
    </div>
    <div class="schedule-tip">💡 <strong>建议节奏：</strong>每周安排2-3次学习，每次60-90分钟。优先完成标记为"急需提升"的课程，利用碎片时间完成图文课程，保持学习连续性效果最佳。</div>
  </div>`;

  if (ordered.length === 0) {
    html += `<div class="card mt-3 slide-up text-center">
      <p style="font-size:16px;font-weight:700;margin-bottom:8px;">🎉 所有课程已完成！</p>
      <p style="color:var(--text2);font-size:13px;margin-bottom:16px;">你已完成全部学习计划，快去参加成果测验吧</p>
      <button class="btn btn-primary" data-action="startFinalQuiz">开始成果测验</button>
    </div>`;
    return html;
  }

  // Generate weekly plan
  const weekDays = ['周一','周三','周五'];
  html += `<div class="card mt-3 slide-up"><p style="font-weight:600;font-size:14px;margin-bottom:16px;">分周学习安排</p>`;

  let courseQueue = [...ordered];
  let weekNum = 1;

  while (courseQueue.length > 0 && weekNum <= 8) {
    const weekCourses = courseQueue.splice(0, 2);
    const isCurrentWeek = weekNum === 1 && done === 0 || (weekNum === Math.ceil(done/2)+1);

    html += `<div class="schedule-week">
      <div class="schedule-week-title">第${weekNum}周${isCurrentWeek?' (当前)':''}</div>`;

    weekCourses.forEach((c, ci) => {
      const skillPct = scores ? Math.round((scores[c.skills[0]]||0)/4*100) : 50;
      const priorityCls = skillPct < 40 ? 'priority-high' : skillPct < 70 ? 'priority-mid' : 'priority-low';
      const day = weekDays[ci] || weekDays[0];
      const dur = parseInt(c.dur) || 30;
      const tagCls = c.type==='video' ? 'tag-blue' : 'tag-purple';

      html += `<div class="schedule-item ${priorityCls}" data-action="openCourse" data-idx="${c.origIdx}" style="cursor:pointer;">
        <div class="schedule-day">${day}</div>
        <div class="schedule-course">
          <div class="schedule-course-name">${c.title}</div>
          <div class="schedule-course-dur">${c.dur} + 约10分钟关卡练习 · <span class="tag ${tagCls}" style="font-size:10px;padding:1px 6px;">${c.type==='video'?'视频':'图文'}</span></div>
        </div>
      </div>`;
    });

    // Add review/practice day if week has 2 courses
    if (weekCourses.length === 2) {
      html += `<div class="schedule-item" style="border-left-color:#9b59b6;opacity:.7;">
        <div class="schedule-day">周日</div>
        <div class="schedule-course">
          <div class="schedule-course-name">📝 复习巩固 + AI工具实操练习</div>
          <div class="schedule-course-dur">约20分钟 · 自主实践</div>
        </div>
      </div>`;
    }

    html += `</div>`;
    weekNum++;
  }

  // Tips section
  html += `<div style="background:var(--bg);border-radius:var(--radius-sm);padding:14px;margin-top:4px;">
    <p style="font-weight:600;font-size:13px;margin-bottom:8px;">🌟 高效学习建议</p>
    <div style="font-size:12px;color:var(--text2);line-height:2;">
      ① <strong>学前预热</strong>：提前5分钟回顾上节课内容，提升新知识吸收率<br>
      ② <strong>即学即用</strong>：每次学完立即在实际工作中尝试应用，不留作业到明天<br>
      ③ <strong>工具配套</strong>：先准备好ChatGPT/Copilot账号，学习时同步实操<br>
      ④ <strong>记录卡点</strong>：遇到疑惑的地方记录下来，用AI工具本身去求解答案<br>
      ⑤ <strong>分享输出</strong>：每周跟同事分享1个AI使用心得，教别人是最好的学习
    </div>
  </div>`;

  html += `</div>`;
  html += `<div style="display:flex;gap:8px;margin-top:12px;">
    <button class="btn btn-outline" style="flex:1;" data-action="goLearningMap">📍 返回学习地图</button>
    <button class="btn btn-primary" style="flex:1;" data-action="goDashboard">进入课程列表 →</button>
  </div>`;

  return html;
}

  let html = headerHtml('学习仪表盘', role.icon + ' ' + role.name + ' · ' + (S.currentEmployee?.name || '新学员'), true);

  </div>`;

  html += `<div class="card mt-3 slide-up"><p style="font-weight:600;font-size:14px;margin-bottom:14px;">课程列表</p>`;

    const skillIdx = c.skills[0];

    return {...c, origIdx: idx, priority: 4 - skillScore};
  }).sort((a,b) => b.priority - a.priority);
  ordered.forEach((c, i) => {
    const prog = S.courseProgress[c.id];
    const isDone = prog?.done;
    const locked = i > 0 && !S.courseProgress[ordered[i-1].id]?.done;
    const cls = isDone ? 'completed' : locked ? 'locked' : '';
    const tagCls = c.type==='video' ? 'tag-blue' : 'tag-purple';
    html += `<div class="course-card ${cls}" ${locked?'':'data-action="openCourse" data-idx="'+c.origIdx+'"'}>
      <div class="course-num">${i+1}</div>
      <div style="flex:1;min-width:0;"><div class="course-title">${c.title}</div><div class="course-meta">${c.dur}</div></div>

      <span style="font-size:12px;margin-left:8px;">${isDone?'已完成':locked?'🔒':'待学习'}</span>
    </div>`;
  });

    </div>`;
  }

  return html;
}
