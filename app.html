  tools: [
    {level:0,difficulty:"初阶",scenario:"场景：你收到 30 份供应商报价单（PDF/Excel 格式不一），需要整理成统一比价表。",q:"如何用 AI 工具高效整理报价？",opts:["A. 三步：(1)用AI文档解析（如上传PDF/Excel）自动提取报价要素（品名/规格/单价/税率/运费/交期/账期） (2)AI统一单位口径（含税/不含税、货币）并生成比价表 (3)AI标注异常（缺项/明显偏离/重复）→人工核对后用于比价", "B. 把30份报价单按收到顺序编号，用Excel手工逐份录入品名、规格、单价、税率与交期等要素后生成比价表", "C. 先按报价总价排序只保留价格最低的5家做详细比对，其余报价单归档备查不再处理", "D. 统一退回所有报价单，要求供应商按公司下发的Excel模板重新填报后再逐份导入汇总", "E. OCR加肉眼比对法：(1)用扫描工具把30份PDF与Excel报价单逐份转成可编辑文本 (2)把识别出的品名、规格、单价、税率、运费与交期要素手工复制粘贴进同一张汇总表 (3)对税率口径不一致的报价手工换算成含税与不含税两列 (4)最后用肉眼逐行比对各家同品名价格的高低差异并标注明显偏离项，全程不借助AI结构化提取与异常自动标注"],scores:[4, 0, 1, 1, 2],best:0,explain:"AI 报价整理=自动提取+口径统一+异常标注。30 份报价整理从 2 小时降到 15 分钟。"},
    {level:1,difficulty:"中阶",scenario:"场景：采购部要定期监控大宗原料价格波动，人工盯行情网页费时费力。",q:"如何搭建 AI 行情监控工具？",opts:["A. 四步搭建：(1)AI采集公开行情源（期货/现货/行业网站） (2)AI按日/周生成价格趋势和涨跌幅 (3)AI设置预警规则（涨跌超5%/接近历史高位）自动通知 (4)AI结合采购计划建议采购时机（如「铜价低位窗口」提示）→辅助择时采购", "B. 安排采购助理每周固定花半天时间手工打开期货与现货网站，把关键原料价格抄录到Excel里跟踪", "C. 每天浏览财经新闻与行业公众号，看到大宗原料价格异动的报道就记录下来并口头提醒相关采购员", "D. 供应商报价倒逼法：(1)暂停自建行情监控，把价格跟踪责任转嫁给主要供应商 (2)要求各家供应商在每次报价时附带说明近期原料市场走势与涨价原因 (3)采购员以供应商提供的行情说明作为价格谈判依据，供应商说涨就接受涨价 (4)重大行情变化依赖供应商主动告知，公司内部不建立独立的行情数据采集与预警机制", "E. 不安排专门监控，采购员凭多年经验在需要下单时判断当前价格高低，认为经验比数据可靠"],scores:[4, 0, 1, 1, 0],best:0,explain:"AI 行情监控=自动采集+趋势+预警+时机建议。择时采购的收益远大于工具成本。"},
    {level:2,difficulty:"高阶",scenario:"场景：你评估引入「AI 供应商风险管理平台」——自动监控供应商经营风险（诉讼/股权变更/舆情）。",q:"AI 供应商风险平台选型要点？",opts:["A. 五步评估：(1)数据源覆盖（司法/工商/舆情/财务数据源质量） (2)预警准确率POC（历史风险事件回测：能提前多久发现？误报率？） (3)与SRM系统集成能力 (4)数据更新频率（日更vs月更） (5)成本对比→选能早期预警且误报可控的方案", "B. 数据源数量优先法：(1)把市场上主流供应商风险平台的功能与数据源清单横向拉通对比 (2)选定数据源覆盖最广、接入司法工商舆情渠道最多的一家直接签约 (3)上线后以平台提供的风险评分作为供应商准入与年度评审的唯一依据 (4)对预警准确率、提前量与误报率不做上线前回测验证，把平台更新的风险名单按月导出存档即视为完成风险监控", "C. 先让平台方提供一份报价单，在预算范围内选择价格最合适的一家采购并试运行", "D. 交由法务部门从合同与合规角度审核平台资质与数据授权，法务认可即可采购", "E. 先采购年度订阅试用一年，用实际预警事件数量评估平台价值后再决定是否续约扩大范围"],scores:[4, 0, 1, 0, 1],best:0,explain:"风险平台选型=数据源+预警准确率+集成+更新频率。预警要「早」和「准」才有价值。"}
  ],
  data: [
    {level:0,difficulty:"初阶",scenario:"场景：你管理的 A 类物料有 20 家供应商，想分析哪些供应商质量稳定、交付准时、价格合理。",q:"如何用 AI 做供应商绩效分析？",opts:["A. 三步分析：(1)让AI整合质量（来料合格率/客诉）、交付（准时率/交期）、价格（价格指数）数据 (2)AI用加权评分（如质量40%/交付30%/价格30%）给供应商排名并分级（A/B/C） (3)AI输出每个供应商的短板和改善建议→用于年度评审和配额调整", "B. 印象打分法：(1)把A类物料20家供应商名单发给各采购员与质量工程师，请每人凭日常合作印象对质量、交付与价格逐项打分 (2)由采购主管汇总各人打分取平均，作为年度供应商绩效得分 (3)按平均分从高到低把供应商划分为A/B/C三档并公示结果 (4)得分靠后的供应商直接缩减份额，全程不引用质量合格率、准时交付率与价格指数等客观数据", "C. 只按年度采购金额给供应商排名，采购额越大说明合作越紧密，列为优先合作的A级供应商", "D. 只看质量部门的来料检验合格率数据，合格率最高的几家直接评为A级并增加配额", "E. 由品管部门直接给出每家供应商的年度质量结论，采购按结论调整配额即可"],scores:[4, 0, 1, 1, 0],best:0,explain:"供应商绩效=多源整合→加权评分→短板诊断。数据驱动分级才能公平激励。"},
    {level:1,difficulty:"中阶",scenario:"场景：某关键物料最近价格持续上涨，你要分析涨价原因并判断趋势。",q:"如何用 AI 做采购成本上涨归因分析？",opts:["A. 四步分析：(1)AI拆解成本构成（原料/加工/物流/汇率/关税） (2)AI分析各成本项近12个月走势和相关事件（如原料涨价/海运波动） (3)AI判断涨价的可持续性（周期性vs趋势性） (4)输出应对策略：锁价/换供应商/替代料/备货→供采购决策", "B. 供应商问答法：(1)直接向涨价的供应商发送书面问询，要求对方说明本轮涨价的构成与幅度 (2)以供应商回复的原料上涨、运费增加等理由作为本次涨价的官方解释记录在案 (3)再向另外两家同类供应商口头求证涨价说法是否普遍，确认后即接受涨价现实 (4)按新价格与供应商重签补充协议，不自行拆解成本构成、不评估涨价持续性与替代应对，把成本波动全部归结为外部行情", "C. 在市场上重新寻源比价，只要找到报价更低的替代供应商就切换采购，不再分析涨价原因", "D. 把该物料采购量下调两成应对涨价，等价格回落后再恢复原采购量", "E. 将上涨成本通过调整内部结算价格转移给使用部门，由业务部门承担涨价差额"],scores:[4, 0, 1, 0, 0],best:0,explain:"成本归因=拆解→走势→持续性判断→应对策略。搞清楚是周期还是趋势才能正确应对。"},
    {level:2,difficulty:"高阶",scenario:"场景：你要用历史采购数据预测明年关键物料的采购量，用于预算和框架协议谈判。",q:"如何用 AI 构建采购需求预测？",opts:["A. 四步建模：(1)AI整合历史用量（按物料/月份/产线）并识别趋势和季节因子 (2)AI结合销售预测和BOM用量反向推算物料需求 (3)AI考虑安全库存和交期做净需求预测 (4)AI做情景模拟（销售±10%/供应中断）→输出分物料预测区间→与业务对表", "B. 以今年各月实际采购量为基数统一上浮5%作为明年各月预测，再按季度汇总提交预算", "C. 产线申报汇总法：(1)年初向各产线下发物料需求申报模板，要求按产品与月份填报明年预测用量 (2)各产线依据在手订单与经验判断填报后上交采购部 (3)采购把各产线申报数量直接加总，并叠加一个固定比例的安全余量 (4)以加总结果作为明年采购预算与框架协议谈判数量，不结合历史用量规律、BOM用量与销售预测做交叉验证", "D. 用上月实际采购量直接外推下月需求，每月滚动更新一次预测数字", "E. 只预测明年采购总金额不拆分到物料，金额够用即可满足预算编制需要"],scores:[4, 0, 1, 1, 0],best:0,explain:"需求预测=用量规律+BOM推算+安全库存+情景模拟。预测区间比单一数字更实用。"}
  ],
  content: [
    {level:0,difficulty:"初阶",scenario:"场景：你要发一份询价单（RFQ）给 5 家供应商，需包含物料规格、数量、交期、报价要求。",q:"如何用 AI 生成询价单？",opts:["A. 三步生成：(1)给AI物料清单（品名/规格/数量/目标价/交期） (2)AI生成标准化RFQ模板（含报价格式要求、付款条件、质保条款、投标截止） (3)AI检查条款完整性和歧义（如「含税」「FOB/CIF」等术语明确）→发送供应商", "B. 电话口头通知5家供应商物料规格、数量与交期要求，请对方按口头沟通内容直接报价", "C. 网络模板套用法：(1)从网上下载一份通用询价单模板，直接套用其格式填写本次物料清单 (2)对模板中的付款条件、质保条款与投标截止时间沿用模板默认表述，不做针对性修改 (3)把品名规格数量交期填入后群发5家供应商 (4)收到报价后发现各家口径不一，再逐家电话补充解释含税、运费与FOB/CIF等术语要求，反复补发澄清说明", "D. 让AI根据物料清单自动生成一份通用询价单，不核对条款完整性与术语歧义直接发送", "E. 直接要求5家供应商报最低价，谁的最终价低就把订单给谁，不提供规格与条款明细"],scores:[4, 0, 2, 1, 0],best:0,explain:"RFQ=标准化模板+条款明确。含糊的询价单导致不可比的报价。"},
    {level:1,difficulty:"中阶",scenario:"场景：公司年度供应商大会要发布采购政策，你要准备一份采购部年度报告（供应商数量/降本成果/质量表现）。",q:"如何用 AI 撰写采购年度报告？",opts:["A. 五步写作：(1)AI生成框架（概览→绩效（降本/质量/交付）→供应商管理→数字化→明年计划） (2)逐节喂数据让AI生成初稿（降本金额/合格率/准时率） (3)AI生成图表建议（降本趋势/供应商分布） (4)AI润色为管理层汇报语气 (5)人工核对数据口径→成稿", "B. AI代笔全包法：(1)把供应商数量、降本金额、来料合格率与准时交付率等年度数据打包发给AI (2)要求AI以采购总监口吻直接撰写整份年度报告，涵盖业绩概览、降本成果、质量管理、数字化进展与明年计划全部章节 (3)AI完成后只在开头结尾做少量文字润色即提交管理层 (4)对报告中降本金额的计算口径、质量数据的统计范围与去年对比基准不做逐项核对", "C. 把去年年度报告全文调出，替换其中供应商数量、降本金额等数字后直接作为今年版本发布", "D. 让负责供应商管理的专员按自己的理解撰写报告初稿，汇总各方数据后提交", "E. 只汇报年度降本总额与目标达成率两个核心数字，其余内容以口头补充说明代替书面报告"],scores:[4, 0, 1, 1, 0],best:0,explain:"采购报告=框架→数据→图表→润色。降本要讲清楚「怎么降的」才可信。"},
    {level:2,difficulty:"高阶",scenario:"场景：某关键零部件要切换供应商，需要准备一份技术+商务的切换方案给管理层审批。",q:"如何用 AI 构建供应商切换方案？",opts:["A. 四步构建：(1)AI对比新旧供应商（价格/质量/产能/技术/风险） (2)AI评估切换成本（模具/认证/验证/停产损失）和收益（年降本额）→算ROI (3)AI制定切换计划（小批量试产→验证→爬坡→切换）和风险预案（供应中断/质量不稳） (4)输出决策建议和审批要点→管理层决策", "B. 低价直切方案：(1)确认新供应商报价比现供应商低一定幅度后，直接决定切换 (2)通知现供应商在现有订单交付完毕后停止供货，同时与新供应商签订长期供货协议 (3)要求产线在新供应商首批到货后直接切换投料，不再安排小批量试产与性能验证 (4)若切换后出现质量或交付问题，再临时联系原供应商紧急补货，把切换风险交给事后补救", "C. 先小批量试产验证新供应商样品质量，样品合格即可全面切换，不做产能与长期稳定性评估", "D. 把新供应商样品交由质量部门做全项测试，测试报告合格即签署切换协议", "E. 仅测算新旧供应商的单价差乘以年采购量得出年节省额，节省为正即批准切换方案"],scores:[4, 0, 1, 1, 0],best:0,explain:"供应商切换=对比→ROI→分阶段计划→风险预案。切换成本常被低估，必须算总账。"}
  ],
  dev: [
    {level:0,difficulty:"初阶",scenario:"场景：你每月要从 SRM 系统导出供应商数据整理成月报，Excel 操作繁琐。",q:"如何用 AI 实现采购月报自动化？",opts:["A. 三步：(1)让AI根据月报模板生成脚本（读取SRM导出数据→按供应商/物料/金额汇总→生成月报） (2)AI加入校验（金额合计/数据完整性） (3)定时自动运行→月报从半天降到10分钟", "B. 维持每月手工从SRM导出供应商数据、在Excel中按供应商与物料汇总金额并排版生成月报的现有做法", "C. 向IT部门提交正式开发申请，等待信息化团队开发一套标准报表模块上线后再替代手工月报", "D. 把每月汇总填报工作交给部门实习生完成，用人力替代自动化，出错由主管复核把关", "E. 商业报表工具方案：(1)调研市面主流报表软件，选定一款支持对接SRM导出数据的产品 (2)由厂商实施顾问配置数据源连接、汇总口径与月报样式模板 (3)上线后设置每月定时刷新自动生成月报并推送给采购管理层 (4)后续月报口径或样式调整均走厂商工单流程，由厂商修改配置后交付，采购部内部不做脚本维护"],scores:[4, 0, 1, 1, 2],best:0,explain:"月报自动化=脚本生成+校验+定时。先解决最重复的环节，不必等大系统。"},
    {level:1,difficulty:"中阶",scenario:"场景：采购合同散落在各业务员手里，需要建立一个可检索的合同台账。",q:"如何用 AI 构建采购合同台账？",opts:["A. 三步构建：(1)AI解析存量合同（PDF/扫描件OCR）提取关键要素（供应商/金额/期限/付款条件/违约责任） (2)AI生成结构化台账并按到期日/金额/风险等级标记 (3)AI设置提醒（合同到期前90天预警）→后续新合同自动归档", "B. 人工建账法：(1)把散落在各采购员手中的合同按业务线收集齐 (2)安排专人逐份翻阅纸质与电子合同，手工录入供应商、金额、期限、付款条件与违约责任等字段 (3)以录入完成的Excel表作为合同台账，按到期日手工排序并标注临期合同 (4)新签合同仍由各采购员自行登记，每月底专人抽检补录遗漏，不建设AI解析与自动归档机制", "C. 只把年采购金额超过一定阈值的重要合同登记入台账，小额合同不做系统登记", "D. 合同管理整体移交法务部门，由法务在合同审批流程中顺带维护台账信息", "E. 把历史合同统一扫描成PDF存档到共享盘，需要查某份合同时按供应商名称搜索文件名"],scores:[4, 0, 1, 0, 0],best:0,explain:"合同台账=AI提取要素→结构化+提醒。合同到期漏续签的损失远大于建台账成本。"},
    {level:2,difficulty:"高阶",scenario:"场景：集团采购数字化要从「Excel+邮件」升级为「SRM+AI」，你要规划系统蓝图。",q:"采购数字化系统蓝图的关键模块？",opts:["A. 六模块蓝图：(1)寻源管理（供应商准入/询比价/招标） (2)合同管理（模板/审批/台账） (3)订单协同（下单/交期/对账） (4)质量管理（来料/客诉/绩效） (5)数据分析（降本/风险/需求预测） (6)AI助手（智能问答/预警/建议）→分三期实施", "B. 电子招标单点方案：(1)把数字化预算集中投向电子招标系统，先实现询比价与招标环节的线上化 (2)招标系统上线后，合同仍走线下审批、订单仍用邮件与供应商确认、质量数据仍留在纸质来料单中 (3)认为寻源环节线上化即完成采购数字化的主体，其余环节维持现状 (4)数据分散在招标系统、邮箱与纸质单据多处，不做统一数据平台与AI分析规划", "C. 直接采购全套SAP采购模块，一步到位覆盖寻源、合同、订单、质量与财务集成全部功能", "D. 先建供应商名录数据库，把各供应商基础信息录入系统，其余模块后续再说", "E. 继续用微信群与邮件收发订单与对账，先把电子化沟通理顺再规划系统建设"],scores:[4, 0, 1, 0, 1],best:0,explain:"采购数字化=寻源→合同→订单→质量→数据→AI 六模块。循序渐进，数据是地基。"}
  ],
  workflow: [
    {level:0,difficulty:"初阶",scenario:"场景：采购申请审批流程长——业务提交→部门经理→采购→总监，纸质或邮件流转慢且信息不全。",q:"如何把 AI 嵌入采购审批流程？",opts:["A. 三段式优化：(1)提交端→AI自动检查申请完整性（规格/预算/比价依据/紧急原因） (2)审批端→AI预审：预算是否充足、是否重复采购、历史价格参考→给出建议价 (3)超权限或异常件才人工审批→正常件自动流转→审批周期从5天降到1天", "B. 把现有纸质与邮件审批原样搬到OA线上流程，审批环节与顺序不变，仅实现无纸化流转", "C. 事后审计式流程：(1)取消事前审批环节，业务部门在预算内可直接下单采购 (2)采购系统自动记录每笔订单的规格、金额、供应商与紧急原因 (3)财务每月按预算与采购制度对全部订单做一次事后审计，发现超预算或违规的订单再追溯处理 (4)以月度审计威慑替代事前审核把关，认为多数采购合规、抽查追责足以控制风险", "D. 只保留金额超过一定额度的大额采购人工审批，小额采购由业务自行决定", "E. 在现有流程中增加财务会签环节，让财务在采购审批时同步核对预算与价格"],scores:[4, 0, 1, 1, 0],best:0,explain:"AI 嵌入审批=完整性检查+预审建议+分级审批。AI 处理常规件，人聚焦异常件。"},
    {level:1,difficulty:"中阶",scenario:"场景：紧急采购（如产线停线抢修）经常绕过正常流程，事后补单混乱。",q:"如何设计 AI 加持的紧急采购流程？",opts:["A. 四步设计：(1)紧急采购触发→AI快速核验（是否真紧急：有无库存/替代料/维修可能） (2)AI推荐在库或可快速交付的供应商（历史交期最短） (3)AI生成紧急采购单（简化审批+事后补全标记） (4)事后AI复盘：紧急采购频率/原因/超支额→推动根因治理（备件管理/预测改进）", "B. 明文禁止一切紧急采购，要求所有采购必须提前走完整审批流程，缺流程不予付款", "C. 紧急情况下由采购员先自行联系供应商快速下单，事后补一份说明即可，不做核验与复盘", "D. 特事特办全放行：(1)凡是产线或业务部门以紧急为名提出的采购一律立即批准，先满足现场需要 (2)采购员接到紧急需求后直接联系平时合作最多的供应商快速送货，不比较价格与交期 (3)事后由需求部门补填一张紧急采购申请单走完存档流程 (4)不对紧急采购的频率、原因与超额成本做统计分析，认为紧急情况本来就是偶发、无需系统治理", "E. 对每笔紧急采购在正常采购价基础上加收一定比例费用，用经济惩罚减少紧急采购数量"],scores:[4, 0, 1, 1, 0],best:0,explain:"紧急采购=真伪核验→快速寻源→简化流程→事后复盘。流程要快，但必须有事后治理。"},
    {level:2,difficulty:"高阶",scenario:"场景：采购部要搭建「供应商协同平台」——让供应商在线接单、报交期、对账。",q:"供应商协同平台+AI 的落地路径？",opts:["A. 四步路径：(1)先线上化→供应商注册、订单确认、交期回报、对账在线化（从邮件到平台） (2)再自动化→订单自动推送、交期异常自动预警 (3)再智能化→AI分析供应商交期达成、库存水位建议、产能预警 (4)分层推广→先核心供应商再扩展→逐步替代邮件模式", "B. 一步到位采购国际知名供应商协同平台，要求全部供应商统一入驻并按平台规范操作", "C. 供应商强制入驻法：(1)选定一款供应商协同SaaS平台后直接签约上线 (2)以邮件通知全部供应商限期注册入驻，逾期未入驻的取消后续订单资格 (3)上线初期要求供应商在平台与邮件双轨并行操作，避免遗漏 (4)供应商配合度低、操作习惯难改时，由采购员通过电话与微信逐家辅导，平台推广完全依赖强制要求与人工催促，不设计分阶段的接受度培育", "D. 维持现有邮件收发订单、电话确认交期与月底对账的模式，认为流程简单可靠无需平台", "E. 先只把订单下达环节搬到线上，交期回报与对账仍走邮件，平台价值有限"],scores:[4, 0, 1, 0, 1],best:0,explain:"协同平台=线上化→自动化→智能化渐进。供应商的接受度决定平台成败。"}
  ],
  security: [
    {level:0,difficulty:"初阶",scenario:"场景：你要用 AI 分析供应商报价数据，其中包含历史成交价等敏感信息。",q:"处理采购敏感数据时的注意点？",opts:["A. 四步安全：(1)确认AI工具的数据政策（数据是否被用于训练/是否出境） (2)敏感数据（历史底价/供应商折扣）脱敏或用私有化工具 (3)限制访问权限（仅相关采购员可见） (4)处理过程留痕→再进行分析", "B. 免费工具直用方案：(1)把含历史成交价与供应商折扣的报价数据直接上传到免费网页版AI工具进行分析 (2)为图方便使用默认设置，不查看工具的数据留存与训练条款 (3)分析过程中把供应商全称、联系人等字段一并保留不脱敏，方便AI理解 (4)分析完成后不保留处理记录，认为数据在内部使用、不对外发布即无泄露风险", "C. 认为数据仅在公司内部流转、不对外公开即安全，直接用内部共享的AI工具分析全部报价数据", "D. 把文件名改为不含供应商与价格的代号后上传分析，认为改名即可防止数据被识别", "E. 只从报价数据中抽出物料、数量等非敏感字段交给AI分析，价格字段留在本地由人工处理"],scores:[4, 0, 1, 0, 1],best:0,explain:"采购数据安全=工具政策+脱敏+权限+留痕。底价泄露直接损害谈判地位。"},
    {level:1,difficulty:"中阶",scenario:"场景：供应商给你发来一个「报价分析工具」的链接，说是能帮你自动比价。",q:"收到供应商提供的 AI 工具链接，你该怎么做？",opts:["A. 拒绝使用：(1)供应商提供的工具可能采集你的比价/底价数据回传 (2)可能存在植入恶意程序风险 (3)可能被用于「钓鱼」获取内部信息→礼貌拒绝，用公司批准的采购工具分析", "B. 直接点开链接试用，觉得工具确实方便就推荐给部门同事一起使用", "C. 有限输入试用法：(1)认为只要不输入核心底价数据，用供应商提供的工具做一般比价没有风险 (2)先输入几家供应商的公开报价让工具演示比价效果 (3)使用后手动清除浏览器历史记录与缓存，认为删除本地记录即可防止数据泄露 (4)工具要求注册时使用公司邮箱与真实姓名，为获取完整功能照常填写", "D. 先向同行打听这款工具是否有人用过、口碑如何，反馈正常再决定是否使用", "E. 只把不含价格的非敏感物料清单输入工具试运行，观察输出是否准确再考虑正式使用"],scores:[4, 0, 1, 1, 0],best:0,explain:"供应商给的工具有数据回传和恶意程序风险。采购数据是谈判筹码，不能泄露。"},
    {level:2,difficulty:"高阶",scenario:"场景：公司要建采购数据中台，接入供应商主数据、价格、合同等信息供全集团使用。",q:"采购数据中台的安全与合规设计？",opts:["A. 五层设计：(1)数据分级→价格/成本等敏感数据单独分级 (2)权限矩阵→按角色（采购员/经理/审计）最小化授权 (3)脱敏策略→跨部门展示时屏蔽底价 (4)审计留痕→所有查询和导出可追溯 (5)合规审查→数据使用符合《数据安全法》和反垄断要求（不交换竞合供应商数据）", "B. 开放共享优先方案：(1)把供应商主数据、价格与合同数据全部接入中台并面向全集团开放查询 (2)认为数据越开放越能发挥价值，各子公司与部门均可按需查看任何供应商的价格与成本明细 (3)对底价、折扣与合同条款不做跨部门屏蔽，采购员与业务人员权限一致 (4)所有查询不做留痕审计，出现价格泄露或数据滥用时再事后追查，把开放共享置于分级管控之上", "C. 把中台全部数据加密存储，任何人访问都需领导逐级审批，宁可牺牲效率也要杜绝外泄", "D. 只对管理层开放中台查询权限，采购员与业务人员沿用原有Excel渠道获取数据", "E. 参照同行企业的采购数据中台制度原样复制一份权限与安全规范，不结合本公司实际调整"],scores:[4, 0, 1, 1, 0],best:0,explain:"采购数据中台=分级+权限+脱敏+留痕+合规。共享与安全的平衡靠分级实现。"}
  ],
  strategy: [
    {level:0,difficulty:"初阶",scenario:"场景：老板问「AI 对采购到底有什么用」，请你用 3 句话讲清楚。",q:"AI 对采购的核心价值是什么？",opts:["A. 三层价值：(1)省时→报价整理/月报/合同台账自动化省 60% 事务性工时 (2)省钱→行情监控/多维比价/TCO分析提升议价和降本能力 (3)控险→供应商风险预警/合规检查降低断供和舞弊风险→采购从「下单员」升级为「价值创造者」", "B. 加班减少论：(1)认为AI对采购最直接的价值是把报价整理、月报编制与合同台账等繁琐事务自动化 (2)采购员从重复劳动中解脱后可以准点下班，工作压力明显降低 (3)把省出的时间用于处理日常订单跟进与催货等事务性工作 (4)不把AI能力投入比价分析、风险预警与战略寻源等增值方向，采购部门的价值定位保持不变", "C. AI未来能替代采购员完成与供应商的全部谈判，采购岗位将逐步缩减甚至消失", "D. AI能帮公司直接降低采购成本，省钱是引入AI的最主要目的", "E. AI能帮助减少供应商数量，把订单集中到少数几家以提升管理效率"],scores:[4, 0, 0, 1, 0],best:0,explain:"AI 采购价值=省时+省钱+控险。核心是让采购聚焦战略寻源而非事务操作。"},
    {level:1,difficulty:"中阶",scenario:"场景：公司要求「降本 8%」，你不能只压供应商价格，需要系统性方案。",q:"如何用 AI 设计系统性降本方案？",opts:["A. 五维降本：(1)商务降本→AI多维比价+谈判策略（压价/账期/批量） (2)技术降本→AI分析规格优化/替代料/标准化（VE/VA） (3)流程降本→AI识别重复采购/紧急采购/过度定制 (4)供应链降本→AI优化物流/库存/交期 (5)需求降本→AI分析需求合理性（规格过度/频次异常）→每维量化目标", "B. 统一压价方案：(1)把年降本8%的目标直接换算成对所有供应商统一降价8%的要求 (2)向全部供应商群发降价通知，要求限期确认新的价格协议 (3)对拒不接受降价的供应商，以切换份额或终止合作为筹码施压 (4)认为压价幅度即降本成果，不开展技术、流程与需求侧的降本工作，把供应商关系恶化与断供风险全部留给后续处理", "C. 在各品类重新招标比价一轮，谁的报价低就把订单份额转给谁，靠竞价实现降本", "D. 缩减采购品类数量，砍掉利润贡献低或管理复杂的物料品类来达成降本目标", "E. 把降本8%的指标分解给财务部门设定各品类目标价，采购按目标价执行采购"],scores:[4, 0, 1, 0, 1],best:0,explain:"系统性降本=商务+技术+流程+供应链+需求五维。压价只是最容易被看穿的降本。"},
    {level:2,difficulty:"高阶",scenario:"场景：地缘政治/自然灾害频发，你思考如何构建供应链韧性，老板要你出方案。",q:"如何用 AI 构建供应链韧性体系？",opts:["A. 四层韧性：(1)可视化→AI整合供应商-产能-库存-物流数据，实时掌握风险敞口 (2)预警→AI监控地缘/天气/供应商经营风险，提前预警 (3)替代→AI建立多源替代方案（备选供应商/替代料/安全库存策略） (4)演练→AI模拟供应中断情景（断供30/60/90天）评估影响并制定应急预案→形成韧性体系", "B. 多源备份方案：(1)认为供应链韧性的关键是分散风险，为核心物料再引入两到三家备选供应商 (2)备选供应商完成准入后仅保持框架关系，平时不分配订单也不验证其产能与交付能力 (3)发生供应中断时临时通知备选供应商紧急供货，以高于常规的价格采购现货 (4)不做风险敞口可视化、不做中断情景演练，把韧性等同于供应商数量，断供发生时再依赖临时采购应急", "C. 大幅提升关键物料的安全库存水位，用足够多的库存应对一切供应中断风险", "D. 在框架协议中要求供应商自行保障原材料与产能储备，把断供责任转移给供应商", "E. 为关键物料统一投保供应链中断保险，出险后以保险赔付弥补停产损失"],scores:[4, 0, 1, 0, 1],best:0,explain:"供应链韧性=可视化→预警→替代→演练。韧性的本质是「知道风险在哪+有备用方案」。"}

    {level:0,difficulty:"初阶",scenario:"场景：你要起草一份保密协议（NDA），以前都是从模板库复制修改。",q:"如何用 AI 高效起草 NDA？",opts:["A. 三步起草：(1)用AI调取公司NDA模板并填入本次交易要素（双方主体/保密范围/期限/例外情形） (2)AI检查条款一致性（定义是否前后呼应/期限是否明确） (3)AI生成中英双语版本+签署注意事项→律师审核后用", "B. 网络模板改编法：(1)从网络文库下载一份通用保密协议模板，直接在上面修改双方主体名称与保密范围 (2)协议期限、例外情形、违约责任与争议解决条款沿用网络模板的默认表述，不做公司与交易场景适配 (3)模板缺少双语版本时，用翻译软件把中文版机翻成英文版直接使用 (4)不核对条款定义一致性、不经过公司律师审核即随合同包发出", "C. 让AI脱离模板凭通用法律知识直接起草一份NDA，法务只检查双方主体与期限是否填写正确", "D. 请对方公司先起草NDA文本，我方收到后审阅主要条款并修改为己方有利的表述", "E. 认为双方长期合作信任度高，以口头约定保密义务替代书面保密协议"],scores:[4, 0, 1, 1, 0],best:0,explain:"AI 起草=模板化+一致性检查+双语。用审批过的模板而非AI自由发挥。"},

  data: [
    {level:0,difficulty:"初阶",scenario:"场景：今年公司合同纠纷增多，老板要你分析主要风险来源。",q:"如何用 AI 做合同纠纷数据分析？",opts:["A. 三步分析：(1)AI整合历史纠纷数据（合同类型/金额/原因/结果/损失） (2)AI按维度统计：纠纷集中在哪些合同类型/哪些条款/哪些业务线 (3)AI输出Top风险画像（如「销售合同付款条款引发60%纠纷」）+制度建议（模板修订/审批强化）→推动整改", "B. 经验归纳法：(1)召集合同与诉讼条线律师开复盘会，凭各自经办印象讨论今年纠纷增多的原因 (2)把讨论中提到的销售合同回款、履约争议等高频原因整理成会议纪要 (3)以纪要中提及最多的条款类型作为主要风险点，直接推动对应模板修订 (4)不统计纠纷数量在合同类型、金额区间与业务线的实际分布，用印象代替数据", "C. 只统计全年纠纷涉及的总金额与胜诉率两个指标，据此向管理层汇报风险状况", "D. 下发通知要求各业务部门自查本部门合同履约问题并上报，汇总各部门自查结果作为分析依据", "E. 把纠纷数据整体发给外部律所请其出具分析意见，法务引用律所结论汇报"],scores:[4, 0, 1, 1, 0],best:0,explain:"纠纷数据分析=整合→维度统计→风险画像。用数据让法务从「灭火」转向「预防」。"},
    {level:1,difficulty:"中阶",scenario:"场景：你要评估一个新市场的合规风险（如东南亚某国数据保护法对公司业务的影响）。",q:"如何用 AI 做合规风险量化评估？",opts:["A. 四步评估：(1)AI梳理该地法律要点（数据/劳动/税务/行业准入） (2)AI对照公司业务模式（收集什么数据/怎么用人/怎么收款）找适用点 (3)AI评估违规后果（罚款上限/业务禁令/声誉风险）和合规成本（系统改造/本地律师） (4)输出风险矩阵（发生概率×影响）和进入建议→管理层决策", "B. 让AI直接判断该市场能不能进入，以AI结论作为管理层进入与否的决策依据", "C. 罚款成本核算法：(1)只检索该国数据保护、劳动与税务法规中罚款上限的规定 (2)把各项罚款上限相加估算潜在违规成本，与市场预期收入做简单对比 (3)罚款总额低于预期收入即认定合规风险可控、可以进入 (4)不评估业务禁令、停业整顿与声誉损失等非罚款后果，也不测算达到合规要求所需的系统改造与本地律师投入", "D. 重点参考已进入该市场的同行业公司做法，参照其合规清单执行即认为风险可控", "E. 委托当地律师就准入合规出具意见，法务以律师意见为最终依据不再自行评估"],scores:[4, 0, 1, 1, 0],best:0,explain:"合规风险评估=法律梳理→业务对照→后果量化→风险矩阵。合规成本要算进市场进入决策。"},
    {level:2,difficulty:"高阶",scenario:"场景：公司积累了大量合同、判决、监管文书，你要建设「法务数据资产」支撑决策。",q:"如何规划法务数据资产体系？",opts:["A. 四层体系：(1)数据采集→合同/案件/监管/舆情数据统一入库 (2)数据治理→分类打标（类型/金额/风险等级/业务线） (3)分析能力→风险趋势/纠纷归因/条款效力分析 (4)决策应用→合同模板优化/审批策略/风险预警→形成法务数据看板，定期输出风险报告", "B. 电子归档方案：(1)把公司历年合同、判决书与监管文书统一扫描成PDF存入共享文档库 (2)按业务线与年份建立文件夹层级，文件以合同编号与日期命名便于查找 (3)需要统计纠纷趋势或条款风险时，人工打开相关文件逐个查阅 (4)不对文档做分类打标、不建设结构化数据库与分析看板，把法务数据资产等同于电子化档案", "C. 先建一张案件登记Excel表，把新发生案件的当事人、案由与金额逐行登记管理", "D. 向长期合作的外部律所采购其积累的行业判例数据，作为法务分析的外部数据源", "E. 只保留胜诉判决与对公司有利的文书，败诉材料单独归档不纳入数据资产"],scores:[4, 0, 1, 1, 0],best:0,explain:"法务数据资产=采集→治理→分析→决策应用。数据化让法务工作可量化、可预测。"}
  ],
  content: [
    {level:0,difficulty:"初阶",scenario:"场景：业务要你出具一份关于「某营销活动是否合规」的简明意见。",q:"如何用 AI 起草法律意见？",opts:["A. 三步起草：(1)给AI活动方案（玩法/奖品/宣传语/数据使用） (2)AI对照相关法规（广告法/消法/个保法/反不正当竞争）逐项评估合规点 (3)AI按「结论→依据→风险点→整改建议」结构出具意见初稿→律师逐条核对法条后签发", "B. AI结论直答方案：(1)把营销活动的玩法、奖品与宣传语方案直接发给AI (2)让AI以资深合规律师身份判断活动是否合规并给出通过与不通过的结论 (3)把AI结论连同其简要理由整理成书面意见，经部门负责人签字后对外出具 (4)不逐条回查广告法、消费者权益保护法、个保法与反不正当竞争法的具体条文，AI引用的法条不核对原文", "C. 凭多年执业经验对活动方案做口头合规判断，先让业务照常推进再补书面手续", "D. 将活动方案发外部律所出具正式法律意见书，以律所意见作为业务开展的合规依据", "E. 让AI套用公司往期同类活动的法律意见模板，替换活动名称与奖品内容后直接出具"],scores:[4, 0, 1, 0, 1],best:0,explain:"法律意见=逐项对照+结论结构+法条核对。AI初稿加速，法条准确性必须人工把关。"},
    {level:1,difficulty:"中阶",scenario:"场景：公司要建立标准合同库（销售/采购/保密/劳务等常用合同模板）。",q:"如何用 AI 构建标准合同库？",opts:["A. 四步构建：(1)AI盘点现有合同和常见交易场景（销售/采购/合作/用工） (2)AI起草各场景标准合同模板（含可配置条款选项：付款/交付/违约责任分级） (3)AI编写模板使用说明（什么场景用哪个模板/哪些条款可谈/底线条款） (4)律师审核定稿→发布为业务可自助调用的合同库", "B. 从网络下载销售、采购、保密、劳务等各场景的合同范本，整理后直接作为公司标准合同库发布", "C. 业务自拟征集法：(1)向各业务部门征集他们日常使用频率最高的合同类型清单 (2)请各业务部门自行起草或提供现有的合同样本作为模板素材 (3)法务把征集到的样本做格式统一与错别字修正后汇编成标准合同库 (4)模板中付款、交付与违约责任等条款不做分级选项设计，业务使用时自行手改条款，使用说明与底线条款标注缺位", "D. 让AI脱离参照自由发挥起草各场景标准模板，法务审核后定稿发布", "E. 先只做销售合同一个场景的标准模板，其余场景继续由业务临时起草提交法务个案审查"],scores:[4, 0, 1, 1, 0],best:0,explain:"标准合同库=场景盘点→模板起草→使用说明→律师定稿。模板库是法务提效的核心资产。"},
    {level:2,difficulty:"高阶",scenario:"场景：监管机构来公司现场检查数据合规情况，你要准备一份合规自述报告。",q:"如何用 AI 辅助准备监管检查材料？",opts:["A. 四步准备：(1)AI梳理检查要点（数据收集/存储/出境/用户权利/安全措施） (2)AI对照公司实际情况生成合规自述初稿（制度建设/流程执行/技术措施/整改情况） (3)AI预演检查官可能追问的问题并生成应答要点 (4)AI核对材料中的数据和证据一致性→律师终审后提交", "B. AI代笔全包法：(1)把数据收集、存储、出境、用户权利与安全措施等检查主题发给AI (2)要求AI参照行业通行的合规自述报告格式直接撰写完整报告初稿 (3)报告中涉及的制度建设、流程执行与整改情况由AI按行业最佳实践合理推断填充，不逐项核实公司实际现状 (4)报告成稿后仅做格式排版即提交监管机构，不预演检查官追问、不核对材料间数据一致性", "C. 临时通知各业务部门按数据合规要求整理现有材料，把收集到的材料汇编后提交应付检查", "D. 让业务部门各自撰写本部门相关的数据合规情况说明，法务汇总拼装成完整报告", "E. 请外部律所代写合规自述报告，法务提供公司基础信息后由律所独立成稿"],scores:[4, 0, 1, 1, 0],best:0,explain:"监管检查材料=要点梳理→自述初稿→追问预演→证据核对。口径一致性是检查成败关键。"}

  dev: [
    {level:0,difficulty:"初阶",scenario:"场景：法务部要定期统计合同审批耗时、案件进展等数据，手工统计费时。",q:"如何用 AI 实现法务数据自动化统计？",opts:["A. 三步：(1)让AI生成脚本自动汇总合同审批/案件数据（从OA/Excel导出） (2)AI生成法务周报模板（审批量/平均耗时/待办/风险件） (3)定时自动运行→法务周报从半天降到10分钟", "B. 继续由法务助理每周手工从OA与Excel导出合同审批与案件数据，汇总计算后编制法务周报", "C. 向IT部门申请开发正式的法务管理系统，系统上线后再替换手工统计与周报编制工作", "D. 把周报统计任务交给部门助理用Excel公式完成，助理离职时做好模板交接即可", "E. 采购法务管理系统方案：(1)调研市面成熟法务管理软件，选定支持合同审批与案件管理的产品 (2)由厂商实施团队配置审批流程、案件字段与统计报表模板 (3)上线后由系统自动归集审批与案件数据，法务在系统中查看周报与看板 (4)系统外的临时统计需求仍由人工处理，后续功能增强依赖厂商迭代版本，内部不做脚本与接口开发"],scores:[4, 0, 1, 1, 2],best:0,explain:"法务数据自动化=脚本+周报模板+定时。先自动化统计，再谈系统建设。"},
    {level:1,difficulty:"中阶",scenario:"场景：你想建一个「合同条款知识库」，让 AI 根据历史合同和判例给出条款谈判建议。",q:"如何用 AI 构建条款知识库？",opts:["A. 四步构建：(1)AI解析历史合同和判决书提取条款模式（违约金比例/责任上限的市场区间） (2)AI建立条款标签体系（类型/风险等级/谈判空间） (3)AI沉淀「条款谈判指南」（常见博弈点/底线/替代方案） (4)接入合同审查助手供业务自助查询→定期更新", "B. 合同囤积方案：(1)把历年合同与判决书按供应商与案件名批量上传到共享知识库文件夹 (2)仅按合同类型建立一级分类，文件以原始编号命名，不做条款级别拆解与标签标注 (3)法务需要查询违约金常见比例时，人工翻找同类合同逐份比对 (4)知识库只有存档功能，不提炼条款模式、不沉淀谈判指南，也不与合同审查工具联动", "C. 把判决书中涉及条款效力的裁判观点摘录到Excel，形成一份条款裁判规则登记表", "D. 只保存法院判决书作为知识来源，历史合同因条款未经司法检验不纳入知识库", "E. 让AI把全部合同与判例内容记入模型参数，法务提问时由模型凭记忆直接回答"],scores:[4, 0, 1, 1, 0],best:0,explain:"条款知识库=模式提取→标签→谈判指南→接入助手。知识库让每个法务都站在团队经验上。"},
    {level:2,difficulty:"高阶",scenario:"场景：集团要建设「智慧法务平台」，整合合同、案件、合规、知识产权管理。",q:"智慧法务平台的架构规划？",opts:["A. 五模块架构：(1)合同管理（起草/审查/归档/履约） (2)案件管理（诉讼/纠纷/律师协作） (3)合规管理（法规库/检查/整改跟踪） (4)知识产权管理（专利/商标/版权台账与监控） (5)AI能力（合同审查/条款知识库/风险预警/智能问答）→分阶段实施，先合同+合规", "B. 全模块一步到位方案：(1)把合同、案件、合规与知识产权四大模块连同AI能力统一立项采购，一次性建设上线 (2)各模块按厂商标准配置直接启用，不对公司法务流程做差异化调整 (3)上线初期四大模块并行推广到全体法务与业务用户，边用边暴露问题边补丁修正 (4)AI合同审查与条款知识库在平台上线后同步开放，数据治理与历史数据迁移压缩到上线前集中突击完成", "C. 直接采购成熟的SaaS法务系统，按厂商预设模块开通账号后全员投入使用", "D. 由IT部门基于公司OA自主开发法务模块，法务提出需求清单后等待IT排期交付", "E. 先只做历史合同与案件的电子化归档，把线上化完成作为智慧法务平台建设的终点"],scores:[4, 0, 1, 1, 0],best:0,explain:"智慧法务=合同+案件+合规+知产+AI 五模块。AI 能力是灵魂，数据治理是基础。"}

  workflow: [
    {level:0,difficulty:"初阶",scenario:"场景：业务合同审批流程长（业务→法务→财务→分管领导），法务环节经常被打回。",q:"如何优化合同审批流程？",opts:["A. 三段式优化：(1)业务提交前→AI预检（用标准模板/必填项/常见错误自动检查） (2)法务审查中→AI辅助初筛（标准合同快速通过/非标合同标注风险点供律师聚焦） (3)分级审批→低风险标准合同缩短流程，高风险非标合同重点审查→审批周期从5天降到2天", "B. 在现有审批链中直接取消法务环节，业务与分管领导确认后即可签约，减少审批层级", "C. 先签后审模式：(1)为加快业务效率，允许业务部门在与客户达成一致后先行签署合同 (2)合同签署后把扫描件提交法务做补充审查，发现问题再与对方协商补充协议修正 (3)对低风险常规合同完全免审，由业务自行归档 (4)认为签约后再审不会产生实质风险，对方不同意补协议时再通过内部风险提示留档，不做事前模板预检与分级审批", "D. 所有合同无论金额大小与风险高低一律保留完整审批链，任何人不得简化或跳级", "E. 把财务审查挪到法务之前，先由财务核对价格与预算，再交由法务审查条款"],scores:[4, 0, 1, 1, 0],best:0,explain:"合同审批优化=预检+AI初筛+分级审批。低风险合同不占用律师时间。"},
    {level:1,difficulty:"中阶",scenario:"场景：公司商标被抢注，需要快速响应：收集证据、评估异议可能性、准备异议材料。",q:"如何用 AI 支撑商标维权工作流？",opts:["A. 四步工作流：(1)AI检索抢注商标信息（类别/注册状态/申请人）和相似商标情况 (2)AI分析异议成功率（近似度/恶意抢注证据/使用证据） (3)AI起草异议理由书初稿（引证商标/在先使用证据/恶意证据） (4)AI设置案件时间表（异议期限/举证期限提醒）→律师审核提交", "B. 律所全权外包方案：(1)发现商标被抢注后立即委托外部律所全权处理异议事宜 (2)把商标注册证、使用证据等材料整体移交律所，由律所自行评估异议成功率并制定策略 (3)公司只负责在律所要求时补充用印与付款，不参与检索分析与证据组织 (4)异议时限、举证期限等关键节点依赖律所内部提醒，公司不建立案件时间表与节点跟踪，法务定期电话询问进展即可", "C. 先观望对手注册进展，等对方商标公告期满前再决定是否启动异议程序", "D. 让AI检索近似商标与恶意抢注证据后自动生成异议文书并直接在线提交商标局", "E. 先购买商标监测服务持续监控抢注动态，暂不启动本次异议的法律程序"],scores:[4, 0, 1, 1, 0],best:0,explain:"商标维权=检索→胜率评估→文书初稿→时限管理。响应速度和时限管理决定维权成败。"},
    {level:2,difficulty:"高阶",scenario:"场景：公司要推动「法务数字化」，把法务从「救火队」变成「风险预防中心」。",q:"法务数字化转型的路线图？",opts:["A. 三阶段路线：(1)线上化→合同/案件/知产台账线上管理，数据统一 (2)自动化→AI合同审查/风险扫描/到期提醒，事务性工作自动化 (3)智能化→AI风险预警（舆情/诉讼/监管变化）+数据化决策支持→法务BP嵌入业务（营销/采购/数据场景前置合规审查）", "B. 系统先行方案：(1)先采购一套功能全面的法务管理系统并完成部署上线 (2)系统上线后再组织各条线梳理合同、案件与知产数据导入系统，边用边定义流程 (3)把AI合同审查、到期提醒等功能模块全部开通，鼓励法务在日常工作中自行摸索使用 (4)系统使用一段时间后，再根据实际痛点回头补做流程梳理与数据治理，认为先有工具自然会产生用法", "C. 把法务数字化工作整体委托给外部律所或咨询机构代为规划与实施，法务配合提供资料", "D. 维持现有线下台账加人工审查的运作方式，业务量增长时增配法务人手应对", "E. 只上线合同电子签章一个环节，把签约线上化视为法务数字化的全部内容"],scores:[4, 0, 1, 1, 0],best:0,explain:"法务数字化=线上化→自动化→智能化。终极目标是让合规审查前置到业务决策前。"}

  security: [
    {level:0,difficulty:"初阶",scenario:"场景：你把一份含客户个人信息和交易条款的合同发给 AI 工具做条款分析。",q:"用 AI 处理含敏感信息的法律文件时？",opts:["A. 先安全评估：(1)确认工具数据处理政策（是否用于训练/是否出境/是否加密） (2)敏感信息脱敏（客户名/身份证号/银行账号打码）后再上传 (3)或用公司私有化部署的工具 (4)保留处理记录→再让AI分析", "B. 直接上传方案：(1)把含客户个人信息与交易条款的合同PDF直接上传到公共AI工具做条款分析 (2)选择功能较强的免费版本使用，不查看其数据处理与留存政策 (3)上传前不做客户姓名、身份证号、银行账号等敏感信息的脱敏处理 (4)分析完成后关闭页面即认为数据已消失，不保留处理记录、不评估数据是否被用于模型训练", "C. 认为合同属于公司内部文件、仅用于内部条款分析不构成对外泄露，直接使用内部AI工具上传全文", "D. 把合同文件重命名为编号代号后再上传，认为文件名不含客户信息即可规避敏感数据风险", "E. 只上传合同首页的当事人与条款摘要部分，正文敏感信息留在本地人工分析"],scores:[4, 0, 1, 0, 1],best:0,explain:"法律文件涉个人信息，上传公共AI工具前必须脱敏和核查政策。律师保密义务同样适用于AI。"},
    {level:1,difficulty:"中阶",scenario:"场景：律师助理用 AI 生成的合同条款直接发给了客户，未经律师复核。",q:"AI 生成的法律文件直接外发的风险？",opts:["A. 立即纠正并建立规范：(1)AI输出可能「幻觉」法条/判例（编造不存在的规定） (2)未经复核的条款可能损害客户权益或公司声誉 (3)建立制度：AI产出必须经执业律师复核签字后才可外发；AI生成内容标注「草稿」；重大文件禁用AI直接生成", "B. AI输出信任方案：(1)认为大模型生成的合同条款经过海量法律文本训练、质量有保障 (2)助理将AI生成的条款直接发给客户后，法务复核时发现个别引用条款的表述与现行规定存在出入 (3)为赶客户时限仍同意按AI文本发出，仅在邮件中加一句「以正式签约为准」 (4)后续同类文件继续由AI直接起草外发，把逐条法条核对与律师签字环节视为可省略的形式要求", "C. 口头提醒助理以后使用AI生成内容前先自行检查一遍，不再重复发生即可", "D. 认为AI生成的法律文本比人工起草更全面规范，此后重要文件也直接采用AI全文", "E. 只对涉及金额与期限的核心条款做人工复核，程序性条款沿用AI原文外发"],scores:[4, 0, 1, 0, 1],best:0,explain:"AI 法律文书外发=律师复核是铁律。AI幻觉的法条和判例是法律服务的重大事故源。"},
    {level:2,difficulty:"高阶",scenario:"场景：公司要用 AI 处理诉讼策略和谈判方案，涉及重大商业机密。",q:"AI 用于重大案件支持的安全框架？",opts:["A. 五层安全：(1)选型→私有化部署或签订数据不训练协议 (2)分级→涉密案件数据隔离（专案专用实例） (3)权限→案件材料按「需知」最小化授权 (4)留痕→所有AI输入输出审计 (5)复核→AI策略建议仅作参考，重大决策律师定→发布重大案件AI使用规范", "B. 最强模型直用方案：(1)把诉讼策略、谈判底牌等重大案件材料直接输入市面最强的通用大模型寻求建议 (2)认为模型能力越强给出的策略质量越高，选择云端公共版本使用并开启联网检索增强分析 (3)案件材料不做隔离处理，与日常办公问答共用同一账号与上下文 (4)AI输出的策略建议直接纳入案件讨论纪要与对外方案，输入输出不做审计留痕，由经办律师自行把握保密边界", "C. 把案件材料加密压缩后再上传公共AI工具分析，认为加密即可保证内容不被模型学习", "D. 要求外部律师使用其自有AI工具处理案件材料，律所自行承担技术与保密责任", "E. 规定AI只用于公开法律法规与判例的检索，案件材料一律不进入任何AI工具"],scores:[4, 0, 1, 0, 1],best:0,explain:"重大案件AI=私有化+隔离+最小授权+审计+人工决策。诉讼策略泄露的代价无法承受。"}

    {level:0,difficulty:"初阶",scenario:"场景：老板问「AI 对法务有什么价值」，请你简明回答。",q:"AI 对法务的核心价值？",opts:["A. 三层价值：(1)提效→合同审查/法律检索/文书起草从数天到数小时 (2)控险→批量扫描存量合同风险/监控监管变化/风险预警 (3)赋能业务→标准合同库+AI助手让业务自助合规→法务从「把关人」升级为「业务伙伴」", "B. 律师替代论：(1)认为AI在法律条文检索、合同审查与文书起草上的能力将逐步逼近甚至超过普通律师 (2)法务部应主动压缩律师岗位编制，把常规审查与检索工作交给AI完成 (3)保留少数资深律师负责复杂案件与对外出庭，初级岗位不再扩招 (4)公司以AI替代人工作为法务降本的主要手段，法务人员的培养路径与职业发展预期随之收缩", "C. AI能显著减少公司支付给外部律所的律师费，省下的预算可用于其他部门", "D. AI只是Word、邮箱一样的新办公工具，用法务用不用差别不大", "E. AI未来能自动代理公司参与诉讼并赢得官司，法务只需维护系统参数"],scores:[4, 0, 1, 0, 0],best:0,explain:"AI 法务价值=提效+控险+赋能。核心是让法务从重复审查中解放出来做战略合规。"},
    {level:1,difficulty:"中阶",scenario:"场景：AI 监管趋严（如生成式AI管理办法），你思考公司 AI 应用的整体合规策略。",q:"如何制定公司 AI 应用的合规策略？",opts:["A. 四步策略：(1)盘点→AI应用清单（用在哪/处理什么数据/是否对外） (2)评估→对照监管要求（算法备案/数据合规/内容安全/安全评估）逐项找差距 (3)治理→建立AI使用规范（分级审批/敏感场景清单/培训） (4)预案→监管问询和处罚的应对预案→形成《公司AI合规手册》", "B. 观望等待方案：(1)认为生成式AI监管细则尚未完全落地，先保持观望不做系统应对 (2)公司各部门AI应用维持现状自行发展，不建立统一的应用清单与使用台账 (3)等监管处罚案例出现或细则明确后再启动盘点与整改，把外部案例作为内部合规的启动信号 (4)期间法务不发布AI使用规范、不组织培训，认为提前治理会束缚业务创新、投入产出不明确", "C. 在公司内部限制一切生成式AI的使用，用行政禁令规避监管与合规风险", "D. 把AI合规职责划归IT部门，由IT在技术层面落实算法备案与数据安全措施", "E. 定期收集同行业头部公司的AI合规制度文本，参照其做法修订公司制度"],scores:[4, 0, 1, 1, 0],best:0,explain:"AI 合规策略=盘点→评估→治理→预案。合规要走在监管前面，别等处罚来了再补。"},
    {level:2,difficulty:"高阶",scenario:"场景：你是集团法务负责人，思考 AI 时代法务组织的战略定位。",q:"AI 时代法务负责人的战略思考？",opts:["A. 三重转型：(1)从「合同审查者」到「规则架构师」→用AI把合规规则嵌入业务流程（合同模板/审批流/数据治理） (2)从「风险防御者」到「价值护航者」→AI驱动风险预警和合规赋能，支持业务快速创新 (3)从「法律专家」到「AI治理者」→主导公司AI伦理与合规治理（AI用不好=公司新风险源）", "B. 工具应用论：(1)认为AI时代法务的核心任务是把合同审查、法律检索等工具用熟用好 (2)法务部引入AI工具后，把节省的时间用于处理更多合同与案件的个案审查 (3)公司AI伦理与治理问题由CEO办公室或IT部门牵头，法务只在需要时提供法律意见支持 (4)法务组织架构与人员技能维持现状，把AI落地视为效率工具升级而非法务职能的战略重构", "C. 法务应推动公司限制AI在业务中的使用范围，把控制AI风险作为法务的首要职责", "D. 法务的职责重心仍是合同审查与诉讼管理，AI只是辅助这些传统工作更高效地完成", "E. AI治理应由IT与数据部门主导，法务不需要建立专门的AI合规与治理能力"],scores:[4, 0, 1, 1, 0],best:0,explain:"AI 时代法务=规则架构师+价值护航者+AI治理者。最大的机会是把合规做成业务竞争力。"}

// Industry-aware course getter — tries role_industry key first, falls back to role
function getRoleCourses() {
  const key = S.industry ? S.role + '_' + S.industry : S.role;
  const base = COURSES[key] || COURSES[S.role] || [];
  // v37: AI工具指南系列为全岗位通用课，追加到每个岗位的课程列表末尾
  return (COURSES.tools && COURSES.tools.length) ? base.concat(COURSES.tools) : base;
}

// Normalize course skills to [{s:index, w:weight}] format (backward compatible)
function normalizeSkills(skills) {
  if (!skills || !skills.length) return [{s:0,w:1}];
  if (typeof skills[0] === 'object' && 's' in skills[0]) return skills;
  return skills.map(s => ({s, w:1.0}));
}

// Get primary skill index (highest weight)
function getPrimarySkillIdx(course) {
  const skills = normalizeSkills(course.skills);
  let best = skills[0];
  for (let i = 1; i < skills.length; i++) {
    if (skills[i].w > best.w) best = skills[i];
  }
  return best.s;
}

// Compute weighted composite score from the 8-dim result
function getCourseCompositeScore(course) {
  const result = S._quizResult;
  const role = ROLES[S.role];
  const skills = normalizeSkills(course.skills);
  let totalW = 0, totalWS = 0;
  skills.forEach(sk => {
    const dimKey = (role && role.dimKeys && role.dimKeys[sk.s]) || null;
    let score = 0;
    if (dimKey && result && result.dimScores && result.dimScores[dimKey] !== undefined) {
      score = result.dimScores[dimKey];
    } else if (S.quizScores && S.quizScores[sk.s] !== undefined) {
      score = S.quizScores[sk.s];
    }
    totalW += sk.w;
    totalWS += score * sk.w;
  });
  return totalW > 0 ? totalWS / totalW : 0;
}

// Compute course priority factoring in: skill gap, industry weight, prerequisites
function getCoursePriority(course) {
  const compScore = getCourseCompositeScore(course);
  const basePriority = Math.max(0, 4 - compScore); // 0~4, higher = more urgent

  // Industry dimension multiplier: higher weight dims get more urgency when weak
  const weights = S._quizResult ? (S._quizResult.weights || getWeights(S.industry, S.role)) : getWeights(S.industry, S.role);
  const dimKey = (ROLES[S.role] && ROLES[S.role].dimKeys && ROLES[S.role].dimKeys[getPrimarySkillIdx(course)]) || null;
  let indBoost = 1.0;
  if (dimKey && weights && weights[dimKey] !== undefined) {
    indBoost = 0.7 + (weights[dimKey] / 100) * 0.6; // 0.7 ~ 1.3 range
  }

  // Prerequisite urgency: if prereq not done, boost this course
  let prereqBoost = 1.0;
  if (course.requires && course.requires.length) {
    const unmet = course.requires.filter(rid => !S.courseProgress[rid]?.done);
    if (unmet.length > 0) prereqBoost = 1.0 + unmet.length * 0.3;
  }

  // Combine: base priority × industry urgency × prereq factor
  return Math.round(basePriority * indBoost * prereqBoost * 100) / 100;
}

// Check if all prerequisites for a course are met
function prereqsMet(course) {
  if (!course.requires || !course.requires.length) return true;
  return course.requires.every(rid => S.courseProgress[rid]?.done);
}

    dev4: { objectives:['掌握提示词工程的核心方法论','学会角色设定、few-shot和链式推理等高级技巧','建立个人和团队的提示词模板库'],
      concepts:[{t:'提示词工程的本质',c:'提示词工程（Prompt Engineering）不是"跟AI好好说话"，而是结构化地表达需求。核心要素：角色设定（告诉AI它是谁）、任务描述（要做什么）、输出格式（怎么呈现）、约束条件（不能做什么）、示例（few-shot，给出范例）。好的提示词能提升AI产出质量30-50%。'},{t:'链式思维推理',c:'Chain-of-Thought（CoT）是让AI"逐步思考"的技巧。不要直接问结果，而是要求AI"先分析问题→拆解步骤→逐步推理→得出结论"。例如调试复杂bug时："分析错误日志→列出可能原因→逐个排查→给出结论和修复方案"。这种分步推理大幅提升复杂问题的准确率。'},{t:'Few-shot学习',c:'给AI提供2-5个"输入→期望输出"的范例，AI会模仿范例的风格和结构。例如，给出3个代码审查的范例（问题→严重级别→修复方案），之后AI会按照相同格式输出。Few-shot的关键是范例要覆盖不同类型的场景。'}],
      steps:[{t:'第一步：定义AI角色',d:'清晰的角色设定至关重要。不只说"你是程序员"，而是"你是一位有15年经验的资深后端架构师，精通Java和分布式系统，重视代码质量和安全性"。越具体，AI的行为越符合预期。'},{t:'第二步：结构化任务描述',d:'用分点、标题、代码块等方式组织你的请求。例如："【任务】审查以下代码【关注点】1)SQL注入 2)并发安全 3)异常处理【输出格式】问题描述+严重级别+修复代码【代码】{...}"。结构化的请求减少歧义。'},{t:'第三步：设计Few-shot示例',d:'对于团队的重复性任务，设计标准化的few-shot示例。每个示例包含：输入场景→AI的正确输出。维护3-5个高质量示例覆盖不同情况。'},{t:'第四步：链式推理调试',d:'当问题复杂时，拆成多轮对话：第一轮让AI分析问题、第二轮制定方案、第三轮执行方案、第四轮验证结果。每轮基于前一轮的产出继续深入。'}],
      cases:[{s:'场景：一段复杂代码出现难以定位的内存泄漏',sol:'使用链式推理：第1轮"分析这段代码的内存分配模式"→AI识别出3个可疑点；第2轮"对可疑点1深入分析对象生命周期"→AI发现闭包未释放；第3轮"给出修复方案"→AI提供代码修复。这种分步方式比一次提问效果好几倍。'}],
      tools:[{n:'PromptPerfect',d:'提示词自动优化工具'},{n:'Anthropic Prompt Library',d:'官方提示词模板库'},{n:'Cursor Rules/Notion',d:'个人提示词知识库管理'}],
      tips:['角色设定是提示词最被低估的部分，花30秒写好角色','复杂问题一定用链式推理，拆成多步让AI思考','few-shot示例要精选，覆盖不同的失败和成功情况','建立团队提示词库，新人可以继承最佳实践','定期回顾哪些提示词效果好，哪些需要优化'],
      quizzes:[
        {triggerSlide:2, q:'Chain-of-Thought (CoT) 链式推理的核心技巧是？',opts:['一次问所有问题让AI回答','要求AI逐步分析→拆解→推理→得出结论','只用简短的问题','让AI自由发挥不设约束'],ans:1, explain:'CoT关键是让AI"逐步思考"——先分析问题→拆解步骤→逐步推理→得出结论。例如调试bug："分析错误日志→列出可能原因→逐个排查→给出结论和修复方案"。分步推理大幅提升复杂问题准确率。'}
      ] },
    dev5: { objectives:['学会用AI从代码自动生成API文档','掌握用AI撰写高质量技术方案的方法','建立团队AI文档生成规范和知识库管理'],
      concepts:[{t:'AI文档生成的价值',c:'文档是开发中被忽视最多的环节。AI改变了文档编写的成本结构：从"写文档要1小时"变成"审文档要10分钟"。关键转变：从代码生成文档→从需求生成方案→从变更生成更新记录。AI让文档可以像代码一样被持续维护。'},{t:'从代码到文档的自动化',c:'AI可以分析代码的注释、函数签名、类型定义，自动生成结构化的API文档。关键是：代码中的注释要规范、类型定义要完整、要有清晰的模块分层。投入写好注释，AI就能产出好的文档。'}],
      steps:[{t:'第一步：建立代码注释规范',d:'制定团队的注释标准：每个公共函数必须有JSDoc/docstring，包含参数说明、返回值、异常说明、使用示例。AI生成的文档质量完全取决于注释质量。'},{t:'第二步：AI生成API文档',d:'将代码模块和注释提供给AI，要求它按照OpenAPI/Swagger格式生成接口文档。包含：接口路径、请求方法、参数定义、响应格式、错误码、使用示例。'}],
      cases:[{s:'场景：新项目需要完整的技术方案文档',sol:'在需求分析后，将需求要点提供给AI，让它生成技术方案初稿。包含：架构设计、模块划分、技术选型理由、数据流设计、部署方案。人工review后补充业务特有部分。比从零写节省70%时间。'}],
      tools:[{n:'Swagger/OpenAPI + AI',d:'API文档标准+AI自动生成'},{n:'Storybook + AI',d:'组件文档+AI生成用例'},{n:'Notion AI/飞书智能文档',d:'技术方案协同编辑+AI辅助'}],
      tips:['注释是AI生成文档的原材料，垃圾进垃圾出','文档模板要统一，AI生成的文档才能保持一致风格','技术方案文档要包含选型理由，不只是架构图','定期让AI更新文档（代码变更后）','建立团队的文档review流程，AI生成+人工审核'],
      quizzes:[
        {triggerSlide:2, q:'AI生成API文档的质量取决于什么？',opts:['AI模型的能力', '代码中注释的规范性和完整性', '文档生成工具的版本', '项目的大小'],ans:1, explain:'AI生成文档的质量完全取决于代码注释的质量——规范的JSDoc/docstring、完整的类型定义、清晰的模块分层。垃圾进垃圾出。'},
        {triggerSlide:4, q:'用AI撰写技术方案文档时，最需要注意的是？',opts:['让AI全部写完直接提交', '包含技术选型理由，不只画架构图', '文档越长越好', '只写架构图不做文字说明'],ans:1, explain:'技术方案的关键是“为什么这么选”，不是“我们用了什么”。AI可以生成架构描述，但选型理由需要工程师的理解和判断。'}
      ],
       },
    dev6: { objectives:['识别AI生成代码中的安全风险类型','建立AI代码安全审查的标准流程','制定团队AI代码安全规范'],
      concepts:[{t:'AI代码的独特安全风险',c:'AI生成的代码可能引入传统开发中不常见的风险：1)训练数据中的不安全模式被复制；2)AI不了解你的安全策略（如特定的加密算法、权限模型）；3)AI可能生成看似正常但有细微漏洞的代码。这些风险要求我们建立专门的安全审查流程。'},{t:'安全审查清单',c:'AI代码安全审查需要覆盖：输入验证（注入攻击）、认证授权（权限绕过）、敏感数据处理（明文存储、日志泄露）、加密安全（弱算法、硬编码密钥）、依赖安全（过时库、已知漏洞）、配置安全（默认密码、调试模式）。每项都需要有明确的检查标准。'}],
      steps:[{t:'第一步：建立安全性审查基线',d:'制定AI代码安全检查清单，包含：SQL/NoSQL注入检查、XSS/CSRF防护、认证token管理、敏感信息（密码、密钥、个人信息）处理、加密算法选择、依赖版本检查。'},{t:'第二步：AI安全审查工作流',d:'将安全检查清单作为提示词输入AI，让它逐项审查代码。要求AI输出：风险点、风险等级、影响范围、修复建议、修复后的代码。人工对高风险项做二次review。'},{t:'第三步：代码安全规范落地',d:'基于AI发现的安全问题模式，制定团队安全编码规范。将高频安全问题加入CI检测流水线。对新生成的AI代码，自动运行安全扫描。'}],
      cases:[{s:'场景：AI生成了一个用户登录接口，审查发现密码用MD5加固定salt',sol:'正确做法：让AI改用bcrypt/argon2进行密码哈希，加随机salt。同时检查token生成是否使用加密安全的随机数，检查session管理是否存在会话固定攻击。这些安全细节AI在生成代码时可能忽略。'}],
      tools:[{n:'Snyk',d:'代码依赖安全扫描'},{n:'OWASP ZAP',d:'Web应用安全测试'},{n:'Semgrep',d:'自定义安全规则扫描'},{n:'Burp Suite',d:'专业Web安全测试工具'}],
      tips:['永远不要信任AI生成的代码的安全性','建立团队的安全审查checklist，含AI特有风险','敏感配置（密钥、密码）绝对不能硬编码','安全审查要成为代码合并的必要条件','定期更新安全规范，跟踪最新的AI安全风险'],
      quizzes:[
        {triggerSlide:2, q:'AI生成代码的安全审查应覆盖哪些维度？',opts:['只检查SQL注入', '输入验证+认证授权+敏感数据+加密安全+依赖安全+配置安全', '只检查编译是否通过', 'AI代码天然安全不需要审查'],ans:1, explain:'AI代码安全审查需要六维度覆盖：输入验证（注入攻击）、认证授权（权限绕过）、敏感数据（明文存储/日志泄露）、加密安全（弱算法）、依赖安全（过时库）、配置安全（默认密码）。'},
        {triggerSlide:4, q:'以下关于AI代码安全的最佳实践，哪个是正确的？',opts:['信任AI生成的代码安全性', '敏感配置可以硬编码在AI生成的代码中', '建立团队AI代码安全检查清单并纳入CI流水线', '安全审查只在上线前做一次'],ans:2, explain:'正确做法：建立AI代码安全检查清单→CI自动扫描→高风险项人工review→持续更新安全规范。敏感配置绝对不能硬编码，安全审查是持续过程。'}
      ],
       },

    // 产品
    pm1: { objectives:['学会用AI从海量用户反馈中提取真实需求','掌握用AI生成结构化PRD文档的方法','能基于数据和AI分析进行需求优先级排序'],
      concepts:[{t:'AI辅助需求挖掘的方法论',c:'产品经理的核心工作之一是"发现真正的需求"。传统方式依赖用户访谈和手动分析，效率低且容易受主观偏差影响。AI可以：批量分析用户反馈（评论、工单、NPS）→聚类相似问题→识别高频痛点→发现隐性需求→生成洞察报告。关键不是让AI替你决策，而是用AI减少信息处理的时间，让你有更多精力做判断。'},{t:'从反馈到PRD的转化',c:'AI可以将"用户说"转化为"需求描述"再转化为"功能规格"。流程：用户原话→AI提取核心诉求→AI判断是大需求/小优化/bug→AI生成需求背景和目标→AI撰写详细功能描述→人工review和补充业务上下文。'},{t:'需求优先级的系统化评估',c:'用AI做优先级排序不是让它"凭感觉"打分。要给AI一个评估框架（如RICE：Reach覆盖人数、Impact影响程度、Confidence信心指数、Effort投入成本），让AI基于数据和信息给每个需求打分，生成优先级矩阵。'}],
      steps:[{t:'第一步：收集并清洗用户反馈',d:'从多个渠道（客服系统、App评论、NPS反馈、用户访谈录音）收集原始反馈。用AI去除无效信息（纯情绪宣泄、重复内容），保留有实质性内容的反馈。'},{t:'第二步：AI聚类分析',d:'将清洗后的反馈提供给AI，要求它按主题聚类。例如：将所有关于"登录体验"的反馈归为一类，"支付流程"的归为另一类。AI会生成聚类结果和每类的典型用户语录。'},{t:'第三步：提取核心需求',d:'对每个聚类，让AI提取"用户真正的需求是什么"。区分表面需求（"我要更快"）和底层需求（"订单确认页加载超过3秒"）。AI会生成用户故事和需求背景。'},{t:'第四步：生成PRD',d:'基于确认的需求，让AI生成结构化PRD。包含：需求背景、用户故事、功能描述、交互逻辑、验收标准、影响评估。人工review后补充业务策略和排期信息。'}],
      cases:[{s:'场景：App收到了200条关于"搜索不好用"的反馈',sol:'将200条反馈输入AI，要求聚类分析。AI识别出4个子问题：搜索速度慢（35%）、结果不相关（30%）、无法按类别筛选（20%）、历史搜索无法清除（15%）。每个子问题都给出了3-5条典型用户语录。PM据此制定分阶段优化计划。'}],
      tools:[{n:'ChatGPT/Claude',d:'需求分析和PRD生成'},{n:'Notion AI',d:'需求文档协同和AI写作'},{n:'飞书智能文档',d:'PRD模板+AI辅助'}],
      tips:['反馈分析要区分"高频问题"和"高价值问题"，两者不总一致','AI生成的需求背景需要人工核实——用户的表述和真实需求可能有差距','PRD要有验收标准，AI可以帮助生成但需要PM确认','需求优先级评估要结合业务战略，AI提供数据参考而非最终决策','定期让AI分析需求趋势，发现产品演进方向'],
      quizzes:[
        {triggerSlide:2, q:'用AI做需求挖掘时，从"用户说"到"功能规格"的正确转化流程是？',opts:['直接让AI写PRD','用户原话→AI提取核心诉求→判断需求类型→AI生成功能描述→人工review','跳过用户反馈直接设计','只做关键词统计'],ans:1, explain:'完整流程：用户原话→AI提取核心诉求→AI判断是大需求/小优化/bug→AI生成需求背景和目标→AI撰写详细功能描述→人工review补充业务上下文。每个环节都需要AI辅助+人工判断。'},
        {triggerSlide:4, q:'用RICE框架做需求优先级排序时，AI最适合辅助哪个环节？',opts:['替PM做最终决策','基于数据和信息为每个需求打分，生成优先级矩阵','忽略投入成本只看影响力','只做排序不做解释'],ans:1, explain:'AI按RICE框架（Reach覆盖/Impact影响/Confidence信心/Effort成本）为每个需求打分，生成优先级矩阵。但最终决策要结合业务战略和团队判断——AI提供数据参考而非替你做决定。'}
      ] },
    pm2: { objectives:['用AI设计高效的用研方案','学会用AI分析调研数据并提取洞察','能基于AI分析生成精准的用户画像'],
      concepts:[{t:'AI如何赋能用户研究',c:'传统用户研究面临三大难题：样本量有限（每次调研只能覆盖部分用户）、分析耗时长（从数据到洞察需要数天）、洞察碎片化（不同研究之间的关联难以发现）。AI的优势在于：快速处理大量非结构化数据（文本、语音）、发现数据中的隐性模式、跨越不同研究形成全局洞察。'},{t:'用户画像的AI构建方法',c:'AI构建用户画像不是凭空想象，而是基于真实数据：行为日志→用户分群→特征提取→画像生成→验证迭代。AI可以分析用户的行为数据（点击、购买、留存），识别出不同的行为模式，再结合调研数据丰富画像的社会属性（动机、偏好、痛点）。'}],
      steps:[{t:'第一步：设计调研方案',d:'告诉AI你的调研目标（了解某功能的使用障碍），让它生成方案：调研方法建议（问卷/访谈/可用性测试）、问卷问题设计、访谈提纲、用户招募标准、样本量建议。'},{t:'第二步：执行调研并收集数据',d:'按照AI设计的方案执行调研。将收集到的数据（问卷结果、访谈录音转文字）整理后提供给AI分析。'},{t:'第三步：AI深度分析',d:'让AI从数据中提取关键发现：按主题分类洞察、标记频率（多少人提到）、发现矛盾点（用户说的和做的不同）、识别隐性需求（用户没说出来但行为表明的）。'},{t:'第四步：生成用户画像',d:'综合行为数据+调研洞察，让AI生成用户画像。每个画像包含：人口属性、行为特征、核心需求、典型场景、使用障碍、决策因素。给出代表性用户语录。'}],
      cases:[{s:'场景：B2B产品用户流失率上升，需要快速了解原因',sol:'用AI分析最近流失用户的反馈和数据：AI发现流失用户集中在中型客户（50-200人），他们普遍提到"迁移成本高"和"培训不足"。基于此设计针对性调研方案：访谈5位最近流失的客户，确认AI发现的模式。'}],
      tools:[{n:'腾讯问卷+AI',d:'问卷设计和数据收集'},{n:'ChatGPT/Claude',d:'调研数据分析'},{n:'Dovetail/Condens',d:'用户研究管理+AI分析'},{n:'飞书妙记',d:'访谈录音转文字+AI总结'}],
      tips:['调研不是为了证明假设，是为了发现你不知道的东西','AI分析的输出要人工验证，防止过度解读数据','用户画像要定期更新，用户需求是动态变化的','定量数据告诉你"是什么"，定性调研告诉你"为什么"','将研究洞察结构化存储，形成团队的用户知识库'],
      quizzes:[
        {triggerSlide:2, q:'AI在用户研究中最大的价值是什么？',opts:['替代用户访谈', '快速处理大量非结构化数据并发现隐性模式', '自动生成完美方案', '减少用户研究预算'],ans:1, explain:'AI优势在于快速处理文本/语音等非结构化数据，发现孤立数据难以察觉的隐性模式，跨越不同研究形成全局洞察。但不能替代用户访谈和PM的判断。'},
        {triggerSlide:4, q:'用AI构建用户画像的正确方法是？',opts:['让AI凭空想象用户画像', '基于行为日志+调研数据的综合分析', '只分析人口属性', '只看定量数据不用定性调研'],ans:1, explain:'AI用户画像 = 行为数据（浏览/购买/留存→分群） + 调研数据（动机/偏好/痛点→丰富画像） + 验证迭代。定性和定量缺一不可。'}
      ],
       },
    pm3: { objectives:['建立AI辅助的数据驱动决策框架','学会用AI分析A/B测试并得出可靠结论','能基于数据用AI生成产品迭代决策建议'],
      concepts:[{t:'数据驱动决策的AI框架',c:'数据→信息→洞察→决策，这是数据驱动决策的完整链路。AI在每个环节都能提供助力：数据清洗和可视化→模式发现和相关性分析→假设检验和因果推断→决策建议和风险评估。关键是建立"数据说话"的团队文化，并用AI降低数据分析的门槛。'},{t:'A/B测试的AI分析',c:'传统A/B测试分析的陷阱：只关注p值忽略效应量、多组测试的假阳性问题、统计显著但业务不显著。AI可以帮助：计算所需样本量、分析多维度指标（不仅看主指标）、检查分组均衡性、发现细分人群的差异化效果、生成通俗易懂的分析报告。'}],
      steps:[{t:'第一步：定义分析目标和关键指标',d:'用AI辅助定义核心指标（北极星指标）和辅助指标（护栏指标）。AI会根据你描述的业务场景，建议合适的指标体系框架（如AARRR、HEART等）。'},{t:'第二步：搭建数据看板',d:'将定义的指标告诉AI，让它生成看板设计方案：布局建议、图表类型选择、异常阈值定义、数据刷新频率。关键是让看板"可行动"——看到数据就能判断下一步做什么。'},{t:'第三步：A/B测试全流程',d:'用AI辅助A/B测试的每个环节：样本量计算→实验设计→数据收集→结果分析→决策建议。特别是分析环节，让AI同时检查主指标和细分指标，避免过度关注单一指标。'},{t:'第四步：生成决策报告',d:'定期让AI分析产品数据趋势，生成决策建议。格式：本期关键数据变化→变化背后的原因分析→建议的行动方案→预测行动后的效果。'}],
      cases:[{s:'场景：新功能上线后核心指标有波动，不确定是正面还是负面影响',sol:'让AI做多维度分析：1)核心指标趋势（上升还是下降）；2)不同用户群的表现差异（新老用户、活跃度分层）；3)关联指标的连锁反应；4)同期其他因素的影响。AI帮助发现是新功能降低了老用户的使用效率，建议对老用户做使用引导优化。'}],
      tools:[{n:'Metabase/Superset',d:'开源数据分析看板'},{n:'ChatGPT Code Interpreter',d:'AI数据分析'},{n:'Amplitude/Mixpanel',d:'产品分析+AI洞察'},{n:'Eppo/Optimizely',d:'实验平台的AB测试分析'}],
      tips:['数据驱动不是"唯数据是从"，要结合定性洞察','A/B测试要设置足够长的实验时长，避免早期波动误导','关注细分人群的差异化效果，总量指标可能掩盖问题','决策报告要简洁，一页纸说清楚"发生了什么→为什么→怎么办"','建立"假设→实验→验证→迭代"的闭环流程'],
      quizzes:[
        {triggerSlide:2, q:'用AI分析A/B测试时最常见的陷阱是？',opts:['AI无法分析数据', '只关注p值忽略效应量和业务显著度', 'AI分析太慢', '测试样本太多'],ans:1, explain:'传统A/B分析陷阱：p值显著≠业务显著（如转化率提升0.01%虽然p<0.05但对业务没意义）。AI可以帮助你同时检查统计显著性和业务显著性。'},
        {triggerSlide:4, q:'数据驱动决策的正确姿势是？',opts:['唯数据是从，不看定性洞察', '数据→信息→洞察→决策，结合定性验证', '凭感觉做决策', '只看总量指标不看细分'],ans:1, explain:'数据驱动决策的全链路：数据→信息→洞察→决策。AI在每个环节提供助力，但最终决策要结合业务理解和定性反馈。关注细分人群差异——总量指标可能掩盖问题。'}
      ],
       },
    pm4: { objectives:['学会用AI快速生成和迭代产品原型','掌握用AI分析交互流程并提出优化建议','建立AI辅助的设计规范和组件管理体系'],
      concepts:[{t:'AI辅助原型设计的范式转变',c:'传统产品设计流程：需求→手绘草图→低保真原型→高保真原型→开发实现。AI改变了这个流程：需求→AI生成多个方案→人工选择方向→AI细化细节→开发实现。核心变化是"方案探索"的成本急剧降低——以前做一个方案需要一天，现在AI可以生成10个方案让你选。'},{t:'从描述到原型的转化',c:'高效的AI原型设计需要你清晰描述：页面目的（用户来这做什么）、核心元素（必须有按钮、输入框、列表）、交互逻辑（点击后发生什么）、信息层级（什么最重要、什么次要）、约束条件（已有的组件库、品牌色）。描述越精确，AI生成的越接近你想要的。'}],
      steps:[{t:'第一步：需求的结构化描述',d:'用结构化格式描述你要的页面。包含：页面类型（列表/详情/表单/仪表盘）、用户任务、核心元素清单、重点信息、交互预期。示例格式："【页面类型】订单列表页【用户任务】快速找到待处理的订单【核心元素】搜索栏、状态筛选、订单卡片（含订单号、客户名、金额、时间、状态）【交互】点击卡片进入详情"）'},{t:'第二步：AI生成多个方案',d:'基于需求描述，让AI生成3个不同方向的方案。例如：方案A侧重效率（信息密度高）、方案B侧重清晰（留白多、信息聚焦）、方案C侧重新功能引导。比较不同方向的优劣。'},{t:'第三步：UI细节优化',d:'选定方向后，让AI逐项优化：信息架构是否合理、视觉层级是否清晰、操作路径是否最短、异常状态是否覆盖（空状态、加载中、错误状态）。AI会给出修改建议和修改后的原型描述。'},{t:'第四步：构建设计规范',d:'让AI整理项目中用到的设计模式，生成设计规范文档。包含：组件清单、使用规则、设计原则、响应式断点。便于团队统一设计语言。'}],
      cases:[{s:'场景：需要一个B2B产品的仪表盘页面',sol:'需求描述示例："CRM数据看板，用户是销售主管。核心信息：本月业绩（目标vs实际）、团队排名、近期商机Pipeline、流失预警。信息层级：业绩>商机>排名>预警。风格：专业、清晰、可操作。"AI基于此生成了低信息密度和高信息密度两个方案，团队选择了高密度方案。'}],
      tools:[{n:'Figma + AI插件',d:'AI辅助原型设计和组件库'},{n:'v0.dev / bolt.new',d:'AI生成UI代码'},{n:'Galileo AI',d:'文字描述生成UI设计稿'},{n:'Uizard',d:'AI驱动的快速原型设计工具'}],
      tips:['AI生成原型后一定要做可用性测试，不要直接开发','原型是沟通工具，不是美术作品——功能正确比视觉好看重要','设计规范要由人定义，AI辅助执行和检查','异常状态和边界情况要特别关注，AI容易忽略','每个页面要有明确的用户任务，避免"什么都能做"的设计'],
      quizzes:[
        {triggerSlide:2, q:'AI辅助原型设计改变了什么？',opts:['AI替代了设计师', '方案探索的成本急剧降低——AI可快速生成多方案供选择', '不需要用户测试了', '原型不再需要迭代'],ans:1, explain:'AI的核心变化是“方案探索”成本降低：以前做1个方案要1天，现在AI生成10个方案让你选。但选择方向、验证可用性仍需要人工判断。'},
        {triggerSlide:4, q:'AI生成原型后最关键的下一步是？',opts:['直接进入开发', '做可用性测试验证方案是否合理', '立即发布上线', '让AI继续美化界面'],ans:1, explain:'原型是沟通工具不是最终产品。AI生成后必须做可用性测试：信息架构是否合理、操作路径是否最短、异常状态是否覆盖。验证后再进入开发。'}
      ],
       },
    pm5: { objectives:['建立系统化的AI竞品分析框架','学会用AI深度拆解竞品并发现策略机会','能基于竞品分析生成产品差异化策略'],
      concepts:[{t:'AI如何提升竞品分析的质量',c:'传统竞品分析的痛点：信息收集耗时（每天刷竞品）→分析深度不够（停留在功能列表对比）→洞察不可操作（看了也不知道怎么做）。AI可以：自动化信息收集和整理→深度分析竞品的产品策略→发现市场空白机会→持续监控竞品动态。将分析时间从"每周半天"降到"每天10分钟"。'},{t:'从功能对比到策略分析',c:'好的竞品分析不是列功能表，而是理解竞品"为什么这样做"。分析框架：竞品的目标用户是谁（看似一样可能不同）→竞品的价值主张是什么（他们卖什么）→竞品的核心壁垒在哪（用户为什么离不开）→竞品的增长策略是什么（怎么获取用户）。AI可以帮助推断这些策略层面的信息。'}],
      steps:[{t:'第一步：建立竞品分析框架',d:'让AI生成竞品分析模板：分析维度（产品功能、用户体验、商业模式、市场策略、技术架构）、每个维度的评估指标、数据收集方法、分析频率。'},{t:'第二步：收集和整理信息',d:'用AI辅助收集竞品信息：让AI搜索竞品的最新动态、整理App Store评论的核心反馈、分析竞品官网和帮助文档的产品定位、汇总公开的定价和商业模式信息。'},{t:'第三步：深度策略分析',d:'基于收集的信息，让AI做深度策略分析：竞品的核心优势和劣势、他们的产品演进路径、可能的下一步动作、我们和他们的关键差异点。不要只问"他们有什么功能"，要问"他们为什么做这个功能"。'},{t:'第四步：生成差异化建议',d:'根据分析结果，让AI生成产品策略建议：哪些领域我们应该追平、哪些可以差异化、哪些市场机会竞品还没覆盖。结合自身优势制定行动方案。'}],
      cases:[{s:'场景：新竞品发布了一个看起来很厉害的功能，团队焦虑',sol:'不要让团队焦虑。用AI快速做一个小型竞品分析：这个功能解决什么问题、竞品的实现方式、用户的实际反馈（看评论而不是宣传）、我们的用户是否有这个需求、替代方案是什么。10分钟得出结论：这个功能用户反馈一般，当前不是优先级。'}],
      tools:[{n:'SimilarWeb/SEMrush',d:'竞品流量和营销分析'},{n:'App Annie/data.ai',d:'应用商店数据分析'},{n:'ChatGPT/Claude',d:'竞品深度分析'},{n:'Crayon/Klue',d:'竞品监控和情报管理'}],
      tips:['竞品分析是为了启发，不是为了复制','关注竞品"为什么赢"和"在什么场景下弱"','定期做但不频繁做——每周快速扫描，每季度深度分析','竞品分析要产出可行动的建议，不只是信息汇总','最好的差异化往往来自竞品忽视的领域'],
      quizzes:[
        {triggerSlide:2, q:'好的AI竞品分析不是列功能表，而是？',opts:['尽可能多地收集竞品信息', '理解竞品为什么这样做——目标用户/价值主张/核心壁垒/增长策略', '复制竞品的所有功能', '只看竞品的价格'],ans:1, explain:'深度竞品分析要超越功能对比：竞品的目标用户是谁（可能跟你不一样）、价值主张是什么（他们卖什么）、核心壁垒在哪（用户为什么离不开）、增长策略是什么。'},
        {triggerSlide:4, q:'竞品分析最应该避免的心态是？',opts:['定期做竞品分析', '竞品发布新功能就立即焦虑跟风', '分析竞品的差异化机会', '关注竞品忽视的领域'],ans:1, explain:'竞品分析是为了启发不是复制。竞品发布新功能要用AI快速评估：用户真实反馈如何、我们的用户是否有这个需求、替代方案是什么。不要因为竞品做什么就焦虑。'}
      ],
       },

    // === PM 行业专属课程内容 ===
    // 智能制造×PM
    mfg_pm1: { objectives:['学会用AI从MES/IoT/SCADA数据中提取产品需求','掌握工业数据分析的需求挖掘方法','能生成面向产线数字化的PRD文档'],
      concepts:[{t:'从产线数据到产品需求的转化',c:'制造企业的数据金矿在产线上：设备运行数据（OEE/MTBF/MTTR）、质量数据（首件检验/过程抽检/不良品分析）、物料数据（库存周转/齐套率/损耗率）、人员数据（工时/技能/排班）。PM的工作是从这些数据中识别"哪里需要AI和数字化改造"——不是技术实现，而是定义问题和评估ROI。AI可以帮你快速分析这些数据，发现人工难以发现的模式。'},{t:'工业场景的需求定义',c:'制造业的产品需求有独特特征：高可靠性（产线停1小时的损失可能上百万）、强约束（不能随意停机改造）、长期价值（系统要服务5-10年）、多角色（操作员/班组长/工程师/厂长需求各不相同）。定义需求时要区分：效率提升需求（减少等待和搬运）、质量改善需求（降低不良率）、成本优化需求（减少物料浪费）、合规需求（满足行业标准和法规）。'}],
      steps:[{t:'第一步：产线数据探索',d:'获取产线的核心数据指标：产量、良率、设备综合效率OEE、换线时间。将这些数据描述给AI，让它做初步的趋势分析和异常检测。'},{t:'第二步：AI根因分析',d:'对发现的异常（良率突然下降、某设备频繁故障），用AI做根因分析。提供相关数据维度（班次、物料批次、操作员、环境参数），AI会给出可能的根因和验证方法。'},{t:'第三步：需求优先级排序',d:'基于分析结果，将需求按"价值×可行性"排序。高价值高可行（先做）、高价值低可行（技术预研）、低价值高可行（快速迭代）、低价值低可行（暂缓）。'},{t:'第四步：PRD撰写',d:'用AI生成结构化的产线数字化需求PRD。包含：业务背景（当前问题）、需求描述（功能和技术要求）、预期效果（量化目标如良率提升X%）、实施约束（不能影响正常生产）。'}],
      cases:[{s:'场景：SMT贴片产线良率从98.5%降到96.2%，需要快速定位原因',sol:'将3个月的产线数据输入AI（按设备/班次/物料供应商/时间段分维度）→AI发现周二晚班一批PCB板材的锡膏印刷厚度偏差超标→定位到供应商批次问题→需求：SPI检测设备的AI异常预警功能。从发现到定位用了2小时（传统方式需要1周）。'}],
      tools:[{n:'Claude/GPT-4o',d:'工业数据分析与PRD生成'},{n:'Power BI + AI',d:'产线数据可视化看板'},{n:'飞书多维表格',d:'需求管理和优先级排序'},{n:'Figma + AI',d:'工业看板原型设计'}],
      tips:['产线数据要脱敏后再传给AI——遵守公司数据安全规定','AI分析的结果需要工艺工程师验证——AI不懂物理约束','数字化需求的ROI要量化：节省多少时间/提升多少良率/减少多少浪费','产线改造要考虑"不停机部署"——制造业容错率极低','跟产线操作员多聊——他们知道机器在什么情况下"脾气不好"'],
      quizzes:[
        {triggerSlide:2, q:'制造业PM从产线数据中挖掘需求时，以下哪个是正确的思路？',opts:['直接问厂长需要什么系统','从OEE/良率/MTBF/MTTR等指标中识别"哪里需要数字化改造"','把所有设备都接入IoT','让AI替代工艺工程师做决策'],ans:1, explain:'PM的工作是从产线核心指标（OEE/良率/MTBF/MTTR/换线时间）中识别数字化机会——不是技术实现，而是定义问题和评估ROI。如"良率从98%降到96%"→定位原因→数字化改造需求→量化预期收益。'},
        {triggerSlide:4, q:'制造业需求定义与C端产品的最大区别是？',opts:['制造业不需要PRD','高可靠性+强约束+长期价值+多角色需求','制造需求更简单','不需要考虑ROI'],ans:1, explain:'制造业需求有独特特征：高可靠性（停机1小时损失百万）、强约束（不能随意停机改造）、长期价值（系统服务5-10年）、多角色（操作员/班组长/工程师/厂长需求各不相同）、ROI必须量化。'}
      ] },
    mfg_pm2: { objectives:['学会用AI分析产线操作员和工艺工程师的行为数据','掌握工业用户研究方法','能生成数据驱动的用户画像和改进建议'],
      concepts:[{t:'工业用户研究的独特挑战',c:'制造业的用户研究跟C端产品完全不同：用户（操作员/工程师）没有时间接受访谈、工作场景高度专业化（外行很难理解）、数据散落在各种系统里、用户习惯"忍着不说"（工厂文化）。AI的价值在于：不需要漫长访谈，从操作日志、故障记录、排班数据中就能发现行为模式。'},{t:'人机协作的优化方向',c:'工业场景的人机协作要考虑：认知负荷（操作员一次要关注多少信息）、操作便利性（戴手套时能否点击、环境噪音下能否听清）、安全隐患（任何交互不能分散安全注意力）、学习成本（新操作员的上手时间）。AI可以分析：哪些操作步骤最常出错、哪些界面信息操作员根本不看、什么情况下操作员绕过系统。'}],
      steps:[{t:'第一步：操作日志分析',d:'收集操作员的操作日志（点击路径、页面停留时间、操作时间分布），用AI分析操作模式和效率瓶颈。'},{t:'第二步：识别痛点场景',d:'让AI识别：重复操作最多的步骤、出错频率最高的环节、操作员主动绕过的功能（说明设计有问题）、新手vs老手操作差异大的地方。'},{t:'第三步：用户画像构建',d:'基于行为数据构建工业用户画像：新手操作员（需要引导和防错）、熟练操作员（需要效率工具和快捷键）、工程师（需要深度数据和诊断工具）、班组长（需要全局视图和异常告警）。'},{t:'第四步：改进方案设计',d:'针对每个画像的痛点，用AI生成界面优化和功能改进方案。包含：改进前vs改进后的操作对比、预期效率提升、实施难度评估。'}],
      cases:[{s:'场景：新上线的MES系统被操作员抵制，说"不如以前的Excel好用"',sol:'用AI分析操作日志：发现新系统完成一次"报工"操作需要8步点击，旧Excel只要3步。50%的操作员在做完第5步后就放弃了。需求很明确：将高频操作从8步简化到3步以内。还发现80%的操作员从不使用系统的高级功能——不是不需要，是找不到入口。'}],
      tools:[{n:'FullStory/Hotjar',d:'用户行为录屏和热力图'},{n:'Claude/GPT',d:'操作日志分析'},{n:'Microsoft Clarity',d:'免费的用户行为分析'},{n:'Miro/Figma',d:'用户旅程图绘制'}],
      tips:['到产线上去看操作员怎么用系统——亲眼看到的比数据更真实','操作员说"好用"的标准很简单：少点几下，快点完成','新手上手时间是最容易被忽视的隐性成本','工业系统的"容错设计"比"功能丰富"更重要','每次改版后要观察操作员的实际行为变化'],
      quizzes:[
        {triggerSlide:2, q:'制造业用户研究与C端产品最大的不同是？',opts:['没有不同', '用户没时间访谈+工作场景高度专业化+数据散落各系统+用户忍着不说', '制造业不需要用户研究', '只能做问卷'],ans:1, explain:'制造业用户研究特殊挑战：操作员/工程师没时间接受访谈、场景外行难理解、数据分散在MES/SCADA等系统、工厂文化倾向“忍着不说”。AI可从操作日志、故障记录中直接发现行为模式。'},
        {triggerSlide:4, q:'新MES系统被操作员抵制时，最应该用什么方法定位问题？',opts:['强制推行', 'AI分析操作日志——高频操作步数、放弃率、功能使用频率，量化不好用的根因', '换一套新系统', '做更多培训'],ans:1, explain:'操作员说“不好用”时，数据告诉你为什么：高频操作步数是否过多、放弃率在哪个环节最高、哪些功能实际没人用。用AI量化分析替代主观抱怨。'}
      ],
       },
    mfg_pm3: { objectives:['学会用AI分析良率/OEE/排产数据','掌握工业核心指标的数据驱动决策方法','能生成数据驱动的产线优化方案'],
      concepts:[{t:'制造业核心指标体系',c:'OEE（设备综合效率）= 可用率×性能率×质量率。每个下降背后都有不同的根因：可用率低→设备故障多或换线慢；性能率低→设备运行速度未达理论值；质量率低→不良品多。另外还有：MTBF（平均故障间隔）、MTTR（平均修复时间）、直通率（一次合格率）、换线时间（SMED）。PM不需要成为精益专家，但要能用数据讲清楚"问题在哪里"和"改善后值多少钱"。'},{t:'AI在工业决策中的角色',c:'AI不是替代工艺工程师的经验，而是让经验数据化、可量化、可复盘。比如老师傅说"这批料不好"，AI可以说"这批料的XX参数比历史均值偏移了1.2个标准差，与良率相关性0.78"。AI还能发现人工难以发现的交叉影响：比如"周二晚班+A供应商+B设备"的组合良率显著偏低。'}],
      steps:[{t:'第一步：建立指标基线',d:'收集最近6-12个月的核心指标数据，建立baseline：正常范围是多少、波动多大算异常、季节性规律是什么。让AI帮你统计和可视化。'},{t:'第二步：异常检测与根因分析',d:'当指标偏离baseline时，用AI做多维交叉分析：按时间（班次/星期/月度）、按设备（机台/模具/夹具）、按物料（供应商/批次/存储时间）、按人员（班组/技能等级）、按环境（温湿度/季节）。'},{t:'第三步：改善方案生成',d:'让AI针对根因生成改善建议：工艺参数优化、设备维护策略调整、来料检验标准强化、操作SOP更新。每条建议附带预期效果和风险评估。'},{t:'第四步：效果追踪',d:'实施改善后，用AI持续监控指标变化。设计A/B对比（改善前后）或对照组（未改善的同类产线），量化改善效果。'}],
      cases:[{s:'场景：某汽车零部件产线OEE从85%持续下降到78%',sol:'AI多维分析发现：性能率下降是主因（设备实际速度降到理论值的85%）。进一步分析发现：近1个月新增了3个产品型号，换线次数显著增加，但SMED流程没有优化。改善方案：建立快速换线SOP，优先排产同类型号减少换线。预计OEE可恢复至83%。'}],
      tools:[{n:'Power BI/Tableau',d:'工业数据看板'},{n:'Python + Pandas + AI',d:'OEE深度分析'},{n:'MinTab/JMP',d:'统计过程控制SPC'},{n:'Claude/GPT',d:'分析报告生成'}],
      tips:['OEE的三个因子要分别分析——混在一起看不出根因','改善方案要有量化的ROI——工厂厂长关心的是"省了多少钱"','AI的统计结论要用工程逻辑验证——相关性≠因果性','改善要小步快跑——一次只改一个变量，才知道效果来自哪里','数据质量是工业分析最大的敌人——传感器漂移、人为录入错误'],
      quizzes:[
        {triggerSlide:2, q:'OEE（设备综合效率）下降时，AI最适合做什么分析？',opts:['只看总体OEE趋势', '多维交叉分析：按班次/设备/物料/人员/环境分解OEE的三个因子（可用率/性能率/质量率）', '直接换设备', '只看其中一个因子'],ans:1, explain:'OEE=可用率×性能率×质量率。每个因子下降的根因不同：可用率低→设备故障/换线慢；性能率低→实际速度低于理论值；质量率低→不良品多。AI可做多维度交叉分析精准定位。'},
        {triggerSlide:4, q:'制造数据改善方案最关键的一步是？',opts:['改完就结束了', '改善后持续监控指标变化+A/B对比改善前后+量化ROI', '只关注技术不关注人', '一次改多个变量'],ans:1, explain:'改善闭环：实施改善→持续监控指标变化→A/B对比（改善前vs改善后）或对照组→量化效果→ROI报告。一次只改一个变量才知道效果来自哪里。'}
      ],
       },
    mfg_pm4: { objectives:['学会用AI设计工业软件（MES/SCADA/WMS）交互原型','掌握工业界面的设计原则','能生成数字孪生相关的产品交互方案'],
      concepts:[{t:'工业界面的设计原则',c:'工业界面跟消费App完全不同：信息密度要高（一屏要能看到全局）、操作要容错（不能无确认就执行危险操作）、状态要一目了然（正常/警告/异常用明确颜色）、操作路径要短（戴手套/在噪音环境/快速移动中操作）、支持键盘和扫码枪（不只是触摸）。AI可以帮你检查这些原则是否被满足。'},{t:'数字孪生的产品化思维',c:'数字孪生不是"做个3D模型"，而是创造价值：实时监控（设备状态一目了然）、预测性维护（提前知道哪个设备要坏）、仿真优化（在虚拟环境中测试新工艺）、远程协作（专家远程指导现场）。PM要做的是：定义数字孪生要解决什么业务问题、需要哪些数据源、价值如何衡量。'}],
      steps:[{t:'第一步：定义工业界面的信息架构',d:'用AI分析操作员/工程师/管理者的信息需求差异，设计分层信息架构：一线操作员（设备状态+生产任务+异常告警）、工程师（参数详情+趋势图+诊断工具）、管理者（KPI仪表盘+异常汇总+效率对比）。'},{t:'第二步：AI生成界面原型',d:'描述工业场景和操作流程，让AI生成界面原型描述。包含：主界面布局、关键信息展示、操作按钮布局、异常状态的视觉处理。'},{t:'第三步：安全与容错设计',d:'用AI审查设计中的安全隐患：危险操作是否有二次确认、异常状态是否足够醒目、操作反馈是否及时、误操作是否有撤销机制。'},{t:'第四步：数字孪生方案设计',d:'用AI辅助定义数字孪生的功能范围：哪些设备需要3D可视化、哪些数据需要实时同步、需要哪些交互功能（缩放/旋转/点击查看详情）、与MES/SCADA的数据集成方案。'}],
      cases:[{s:'场景：工厂需要一套数字孪生系统来监控注塑车间',sol:'先用AI分析需求：操作员最关注的是"哪台机有问题"（3D全局视图+颜色标记）和"问题是什么"（点击设备查看异常详情）。不需要高精度3D模型，只需设备级方块+颜色标记+标签。MVP版先做10台关键设备，3周上线。'}],
      tools:[{n:'Figma/即时设计',d:'工业界面原型'},{n:'Unity/Three.js',d:'数字孪生3D可视化'},{n:'Claude/GPT',d:'界面方案设计'},{n:'ThingJS/UE',d:'工业数字孪生平台'}],
      tips:['工业界面的"好看"不重要，"好用+安全"才重要','用颜色编码要统一——红色=异常/停机，黄色=警告，绿色=正常运行','异常信息要比正常信息大——操作员需要一眼看到问题','数字孪生的精度要匹配业务需求——不是越高越好，越贵','做原型前先到车间看操作员的工作环境——光照/噪音/手套/站位'],
      quizzes:[
        {triggerSlide:2, q:'工业界面设计最重要的原则是？',opts:['界面越炫酷越好', '信息密度高+操作容错+状态一目了然+操作路径短+支持手套操作', '模仿手机App设计', '颜色越多越好'],ans:1, explain:'工业界面核心原则：信息密度高（一屏看全局）、操作容错（危险操作需二次确认）、状态醒目（红/黄/绿编码）、操作路径短（戴手套/噪音环境）、支持键盘和扫码枪。'},
        {triggerSlide:4, q:'做数字孪生项目时，PM最容易犯的错误是？',opts:['追求高精度3D模型而不定义业务价值', '先做MVP验证', '从核心设备开始', '先明确要解决什么业务问题'],ans:0, explain:'数字孪生不是“做个3D模型”，而是创造价值。PM要先定义：解决什么业务问题、需要哪些数据源、价值如何衡量。MVP从核心设备开始，精度匹配业务需求即可。'}
      ],
       },
    mfg_pm5: { objectives:['学会用AI系统化追踪工业4.0技术趋势','掌握制造业竞品分析方法','能基于技术趋势生成产品路线图'],
      concepts:[{t:'工业4.0技术趋势框架',c:'制造业的技术趋势可以从几个维度追踪：自动化（机器人/AGV/协作机器人）、信息化（MES/WMS/QMS新一代架构）、智能化（AI质检/预测维护/智能排产）、互联化（5G+工业互联网/边缘计算/云边协同）。PM不需要精通每项技术，但要理解每项技术"能解决什么问题"和"成熟度如何"。AI可以帮助定期扫描和总结技术动态。'},{t:'制造业竞品分析的策略视角',c:'制造业竞品分析不同于互联网——竞争对手的信息不公开（工厂不对外开放）。分析方法：产品功能对比（公开的规格参数和功能列表）、客户案例研究（竞品在官网披露的标杆客户）、专利分析（技术布局方向）、招聘信息分析（招什么人说明在做什么方向）、展会和技术论坛信息。AI可以帮你从公开渠道聚合和解读这些信息。'}],
      steps:[{t:'第一步：建立技术雷达',d:'让AI建立技术雷达模板：技术名称、成熟度（实验室/早期采用/主流/淘汰）、相关性（高/中/低）、影响时机（短期/中期/长期）。定期（每月）更新。'},{t:'第二步：竞品信息收集',d:'制定竞品信息收集清单：官网更新、公开案例、招聘JD、专利申请、行业报告。用AI做定期收集和摘要。'},{t:'第三步：差异化机会识别',d:'用AI分析竞品盲区：哪些客户需求竞品没有覆盖、哪些技术方向竞品没有布局、哪些细分市场竞品不重视。结合自身优势找到差异化赛道。'},{t:'第四步：技术路线图制定',d:'基于技术雷达+竞品分析+客户需求，用AI辅助生成12-18个月产品技术路线图。包含：时间线、里程碑、关键假设、风险点、备选方案。'}],
      cases:[{s:'场景：公司要做下一代MES产品规划，但不太清楚行业趋势',sol:'用AI做三轮分析：1)技术雷达：扫描最近2年工业软件领域的技术动态（低代码/云原生/AI质检/数字孪生）；2)竞品情报：分析西门子/达索/本土MES厂商的产品演进方向；3)客户需求：汇总最近一年客户反馈中的Top 10诉求。三轮分析交叉得出产品规划方向。'}],
      tools:[{n:'Claude/GPT',d:'技术趋势研究'},{n:'Google Patents',d:'专利搜索和分析'},{n:'Gartner/IDC',d:'行业分析报告'},{n:'Perplexity',d:'实时技术信息检索'}],
      tips:['技术趋势不是追热点——判断什么会在你的领域落地','竞品分析要看"他们在投什么"而不是"他们在说什么"','每季度做一次技术雷达更新——制造业技术发展速度在加快','路线图要留弹性——预留20-30%的buffer应对变化','最好的竞品情报来源是你们的销售和售前——他们天天跟客户聊'],
      quizzes:[
        {triggerSlide:2, q:'追踪工业4.0技术趋势的正确方法是？',opts:['追每一个热点', '建立技术雷达：技术名称+成熟度+相关性+影响时机，定期更新', '只看大厂做了什么', '技术越新越好'],ans:1, explain:'技术雷达=技术名称+成熟度（实验室/早期/主流/淘汰）+相关性（高/中/低）+影响时机（短期/中期/长期）。不是追热点，是判断什么会在你的领域真正落地。'},
        {triggerSlide:4, q:'制造业竞品分析最难之处在于？',opts:['技术门槛太高', '竞品工厂不对外开放，需要多渠道信息交叉验证：公开规格+客户案例+专利+招聘+展会', '没有竞品', '数据太容易获取'],ans:1, explain:'制造业竞品信息不公开（工厂不开放）。需要多渠道交叉验证：产品功能对比+标杆客户案例+专利分析（技术方向）+招聘JD分析（说明在做什么方向）+展会论坛信息。'}
      ],
       },

    // 金融数字化×PM
    fin_pm1: { objectives:['学会用AI从金融业务数据中挖掘产品需求','掌握信贷/风控/理财场景的需求分析方法','能生成合规优先的金融产品PRD'],
      concepts:[{t:'金融数据的独特价值',c:'金融行业的数据质量在所有行业中是最高的——因为每一笔交易、每一次审批都必须精确记录。这些数据是AI分析的绝佳素材。但金融数据的挑战也很独特：高度敏感（必须脱敏）、强监管约束（某些数据不允许用于特定目的）、长周期（用户的生命周期可能跨越数年）、非线性（经济周期和政策变化的影响巨大）。'},{t:'金融场景需求挖掘的三层次',c:'第一层：用户说出来的需求——"审批太慢了""额度不够用""找不到好产品"；第二层：数据透露的需求——审批拒绝率分析、用户流失前的行为模式、不同风险等级用户的真实需求差异；第三层：监管驱动的需求——新的监管要求催生的产品改造需求。AI擅长从第一层加速到第二层，把"用户抱怨"转化为"数据洞察"。'}],
      steps:[{t:'第一步：金融数据分类和脱敏',d:'对要分析的数据进行分类：客户身份信息（绝对不碰）、交易行为数据（脱敏后可用）、审批决策数据（脱敏后可用）、风险表现数据（脱敏后可用）。明确哪些数据能用于AI分析，哪些绝对不能。'},{t:'第二步：AI业务数据分析',d:'选择安全合规的AI工具（企业版或私有部署），将脱敏数据输入，按业务场景分析：信贷审批的拒绝原因分布、用户流失的关键触发点、不同客群的额度使用率差异。'},{t:'第三步：需求转化和PRD撰写',d:'将AI分析洞察转化为产品需求：每个洞察对应一个需求假设、每个需求假设需要验证和PRD描述。PRD必须包含合规审查段落——说明该需求如何满足或不受监管限制。'},{t:'第四步：合规对齐',d:'生成PRD后，用AI对照最新的监管要求做合规检查：资金安全、数据隐私、适当性管理、信息披露等方面是否满足要求。'}],
      cases:[{s:'场景：消费贷产品近3个月审批通过率持续下降',sol:'将脱敏审批数据输入AI，按拒绝原因码、用户分层、申请时段、渠道来源多维分析。AI发现：不是因为风控变严了，而是某个获客渠道吸引的用户质量下降（多头借贷比例从15%升到35%）。需求方向：优化该渠道的准入规则，而不是调整整体风控策略。'}],
      tools:[{n:'企业版AI',d:'金融数据安全分析（必选）'},{n:'Claude Enterprise',d:'合规场景的AI分析'},{n:'飞书多维表格',d:'需求管理和追踪'},{n:'JIRA/Confluence',d:'PRD管理和评审'}],
      tips:['金融数据脱敏是铁律——任何含客户信息的数据绝对不能上传公共AI','AI分析结果需要风控和合规团队review——不是替代而是增强','金融PRD的第一段应该写"合规前置"——产品是否合规','需求优先级公式：合规需求 > 风险需求 > 体验需求 > 增长需求','AI让你看得更多，但决策权永远在风控委员会'],
      quizzes:[
        {triggerSlide:2, q:'金融场景需求挖掘最独特的约束是什么？',opts:['没有特殊约束', '数据高度敏感必须脱敏+强监管约束+长周期+非线性（政策影响）', '金融数据可以随意使用', '和普通产品一样'],ans:1, explain:'金融数据独特挑战：高度敏感（必须脱敏）、强监管（某些数据禁用）、长周期（用户生命周期跨数年）、非线性（经济周期和政策影响）。用AI前必须确保合规。'},
        {triggerSlide:4, q:'金融产品PRD与普通产品PRD最大的区别是？',opts:['没有区别', 'PRD必须包含合规审查段落——说明该需求如何满足监管要求', '金融PRD更简单', '不需要写验收标准'],ans:1, explain:'金融PRD的第一段应该写“合规前置”——产品是否合规、涉及哪些监管要求、如何满足。需求优先级公式：合规需求 > 风险需求 > 体验需求 > 增长需求。'}
      ],
       },
    fin_pm2: { objectives:['学会用AI构建金融用户画像','掌握交易行为数据的分析方法','能生成基于用户分层的产品策略'],
      concepts:[{t:'金融用户画像的多维度构建',c:'金融用户画像比电商用户画像更复杂：不只是"买什么"，还有财富水平（AUM/资产规模）、风险偏好（保守/平衡/进取）、金融素养（对产品的理解程度）、生命周期（学生/职场/家庭/退休）。AI可以综合交易行为、产品持有、浏览日志等多源数据，构建360度用户视图。'},{t:'从行为到洞察的转化',c:'用户行为背后有隐含信息：频繁查看余额→可能有支付焦虑；突然大幅增加定投→可能是年终奖入账；长时间不登录后突然活跃→可能换了工作有新的理财需求。AI可以发现这些行为模式并提醒PM："这类用户可能需要XX产品"。关键是建立"行为→需求"的映射知识库。'}],
      steps:[{t:'第一步：数据源整合',d:'明确可用的数据源：交易流水、产品持仓、App行为日志、客服记录、KYC信息。评估每个数据源的覆盖度和质量。'},{t:'第二步：AI用户分群',d:'用AI基于行为数据进行用户分群。不用预设分群标准，让AI从数据中发现自然群体。输出每个群体的特征描述、规模、价值贡献、成长性。'},{t:'第三步：需求发现',d:'分析每个分群的金融需求特征：资金流动性需求、收益期望、风险承受、触达偏好（App/客户经理/微信）。发现未被满足的需求。'},{t:'第四步：产品策略生成',d:'基于用户分群和需求洞察，用AI生成差异化的产品策略：每个分群匹配什么产品、用什么渠道触达、什么时机推送、预期转化率和AUM增长。'}],
      cases:[{s:'场景：理财产品的用户留存率持续下降，但不知道为什么',sol:'AI分析流失用户的行为模式：发现流失用户主要集中在"30-35岁/月定投<1000元"群体。他们的共同行为是：每周打开App看收益→收益没达到预期就停止定投→2个月后卸载App。洞察：这个群体需要的是"收益稳定"而非"收益最高"，当前推送的都是高收益高波动产品。'}],
      tools:[{n:'企业版AI',d:'用户行为安全分析'},{n:'神策/GrowingIO',d:'用户行为分析平台'},{n:'Tableau',d:'用户画像可视化'},{n:'飞书/企业微信',d:'策略协同和执行'}],
      tips:['用户画像不是一次性工作——行为在变，画像要定期更新','分群不是为了"贴标签"，是为了"差异化服务"','最危险的偏见是"我们以为用户需要什么"——让数据说话','金融产品的触达时机非常重要——工资日/还款日/市场波动日','好的洞察要可执行——"用户需要低风险产品"是可执行的，"用户需要更好的体验"不是'],
      quizzes:[
        {triggerSlide:2, q:'金融用户画像和电商用户画像最大的区别是？',opts:['没有区别', '需综合财富水平+风险偏好+金融素养+生命周期多维度，是360度而非仅消费偏好', '金融画像更简单', '只用交易数据就够了'],ans:1, explain:'金融用户画像不只是“买什么”，还包括：财富水平（AUM/资产规模）、风险偏好（保守/平衡/进取）、金融素养、生命周期（学生/职场/家庭/退休）。多维综合才能准确匹配产品。'},
        {triggerSlide:4, q:'用户理财留存率下降时，AI应该优先分析什么？',opts:['只看整体留存率', '分层分析流失用户的行为模式：什么人群在流失+共同行为特征+流失前的信号', '立即推优惠活动', '只看收益率'],ans:1, explain:'流失不是均匀的。AI可以分层分析：哪个年龄段/收入段/风险偏好的用户在流失？他们共同的行为特征是什么？流失前有什么信号（如停止定投/频繁查看收益但不操作）？'}
      ],
       },
    fin_pm3: { objectives:['学会用AI做金融风险定价和决策分析','掌握反欺诈规则的AI优化方法','能基于数据模拟制定额度策略'],
      concepts:[{t:'金融决策的数据科学方法',c:'风险定价 = 坏账率 × 坏账损失 + 资金成本 + 运营成本 + 目标利润率。每个参数的微小变化都会影响最终定价和竞争力。AI的优势在于：能够精细地分层定价（不是所有人一个价格）、发现新的风险因子（传统评分卡可能遗漏的）、量化竞争约束（定价太高客户跑，太低不赚钱）。'},{t:'反欺诈的进化博弈',c:'反欺诈是一场永不停止的军备竞赛——欺诈者不断寻找规则漏洞，风控团队不断修补。AI可以：实时分析欺诈模式的变化趋势、发现欺诈团伙的关联网络、识别新型欺诈（如合成身份欺诈）的早期信号。但AI也有局限性：历史数据训练出来的模型可能无法识别全新的欺诈模式。因此需要"规则+模型+人工"三层防御。'}],
      steps:[{t:'第一步：风险分层分析',d:'将历史借贷数据按风险等级分层，用AI分析每层的损失率分布、额度利用率、提前还款率。发现各层的差异化和定价空间。'},{t:'第二步：定价敏感度分析',d:'用AI模拟不同定价策略对客户转化率和整体利润率的影响。找到"客户能接受"和"公司能赚钱"的最优区间。'},{t:'第三步：反欺诈规则优化',d:'收集近期欺诈案例和正常案例的特征数据，用AI分析当前规则的有效性。识别过严（误杀率高）和过松（漏过率高）的规则，提出优化建议。'},{t:'第四步：额度策略模拟',d:'用AI模拟不同额度策略对通过率、GMV、坏账率的影响。特别关注"提额"策略：给谁提额、提多少、什么时候提、如何控制风险敞口。'}],
      cases:[{s:'场景：反欺诈规则升级后，正常用户的拒绝率从8%升到15%',sol:'AI交叉分析被拒绝用户的特征：发现有一类"25-30岁/自由职业/线上申请"的正常用户被误判。原因是反欺诈规则中"自由职业"的权重过高。优化方案：对"自由职业+有稳定银行流水+无多头借贷"的用户降权处理。误杀率回到8%，同时欺诈率没有上升。'}],
      tools:[{n:'企业版AI',d:'风险数据安全分析'},{n:'Python/R',d:'统计建模和假设检验'},{n:'决策引擎（自研/商用）',d:'规则配置和A/B测试'},{n:'Tableau/Superset',d:'风险看板可视化'}],
      tips:['风险定价是科学也是艺术——数据告诉你"合理的价格"，市场告诉你"能卖的价格"','反欺诈不要追求100%拦截——误杀一个正常用户的损失远超放过一个欺诈','任何模型上线前必须做回溯测试——拿历史数据验证模型的准确性','风险策略变更要有"冷静期"——不能看到一个异常就立即调规则','金融决策中，AI是参谋不是司令——最终决策需要人工确认'],
      quizzes:[
        {triggerSlide:2, q:'金融风险定价的核心公式是？',opts:['市场定价+利润率', '坏账率×坏账损失+资金成本+运营成本+目标利润率', '竞品价格-10%', '只看资金成本'],ans:1, explain:'风险定价 = 坏账率 × 坏账损失 + 资金成本 + 运营成本 + 目标利润率。AI的优势在于精细分层定价（不同风险等级不同价格）和量化竞争约束。'},
        {triggerSlide:4, q:'反欺诈规则优化的核心原则是？',opts:['追求100%拦截率', '不要追求100%——误杀一个正常用户的损失远超放过一个欺诈', '规则越严越好', '不要人工参与'],ans:1, explain:'反欺诈的平衡艺术：拦截率太高→误杀正常用户（投诉+流失）；拦截率太低→欺诈损失增加。最优解是“规则+模型+人工”三层防御，不断校准阈值。'}
      ],
       },
    fin_pm4: { objectives:['学会在合规框架下用AI设计金融产品原型','掌握金融产品交互的合规设计原则','能设计嵌入AI合规审查的产品流程'],
      concepts:[{t:'金融产品设计的合规第一原则',c:'金融产品设计跟其他产品最大的区别：合规不是"加分项"，是"一票否决项"。任何一个设计决策都要先问"合规吗？"然后问"好用吗？"。关键合规要求：适当性管理（把合适的产品卖给合适的人）、风险揭示（让客户充分了解风险）、信息披露（费用、条款清晰透明）、客户确认（关键操作必须有明确同意）、数据安全（客户信息保护）。'},{t:'AI合规审查的嵌入设计',c:'传统的合规审查是"事后检查"——产品设计完了，合规团队审一遍。更好的方式是将AI合规审查嵌入到产品设计流程中：设计阶段→AI预审合规风险；开发阶段→AI检查功能是否符合合规要求；上线前→AI全面合规扫描；运营中→AI持续监控合规变化。'},{t:'金融产品交互的信任设计',c:'金融产品的交互设计核心是建立信任：金额要大字显示（让人看清楚）、费用要明确标注（不要藏在小字里）、风险要主动告知（不要等客户踩坑）、确认操作要有"无法后悔"的仪式感（输入密码/短信验证）。AI可以帮你检查交互流程中是否有"信任缺陷"——比如客户可能在不知情的情况下签约。'}],
      steps:[{t:'第一步：合规需求梳理',d:'梳理该产品涉及的所有监管要求：销售适当性、信息披露、反洗钱、数据保护。用AI从监管文件中提取关键条款和对应功能要求。'},{t:'第二步：合规前置原型设计',d:'在原型设计阶段就嵌入合规要求：风险揭示页面的内容和位置、适当性评估的交互流程、客户确认的节点和方式。用AI检查原型是否满足所有合规点。'},{t:'第三步：AI合规审查节点设计',d:'在产品流程中嵌入AI合规审查节点：申购前→AI检查客户是否满足适当性要求；签约前→AI检查条款是否包含所有必要披露；交易后→AI检查是否有异常交易模式。'},{t:'第四步：合规测试用例生成',d:'让AI生成合规相关的测试用例：边界条件（刚好满足/刚好不满足的客户）、异常场景（客户中途退出流程）、攻击场景（试图绕过适当性评估）。'}],
      cases:[{s:'场景：设计一个理财产品申购流程，合规审核反复打回',sol:'根本原因是合规要求没有前置。改进方案：设计前就把《理财公司理财产品销售管理暂行办法》的合规要点整理成checklist→每个交互步骤标注对应的合规要求→用AI预审设计稿是否满足所有checklist→提交合规团队复审。合规审核周期从2周缩短到3天。'}],
      tools:[{n:'Figma/即时设计',d:'金融产品原型'},{n:'Claude/GPT',d:'合规分析'},{n:'Axure',d:'复杂交互流程设计'},{n:'合规管理系统',d:'合规checklist管理'}],
      tips:['合规设计不是限制创新——是在规则内找到最优体验','风险揭示不是免责声明——要让客户真正理解风险','金融产品的"取消"和"确认"按钮要一样大——不能诱导操作','每次监管政策更新，第一时间用AI评估产品影响','产品设计评审会的第一项议程永远是"合规检查"'],
      quizzes:[
        {triggerSlide:2, q:'金融产品设计的第一原则是什么？',opts:['界面好看', '合规是一票否决项——任何设计决策先问合规吗再问好用吗', '功能越多越好', '模仿竞品'],ans:1, explain:'金融产品的合规是硬约束不是加分项：适当性管理、风险揭示、信息披露、客户确认、数据安全——每个设计决策都必须先过合规这关。'},
        {triggerSlide:4, q:'金融产品交互设计中建立信任的关键是？',opts:['多用红色突出重要信息', '金额大字显示+费用明确标注+风险主动告知+确认操作有仪式感', '操作越简单越好', '隐藏费用信息'],ans:1, explain:'金融产品信任设计四要素：金额大字显示（看错就是大问题）、费用明确标注（不藏在小字里）、风险主动告知（不要等客户踩坑）、确认操作有仪式感（如输入密码/短信验证）。'}
      ],
       },
    fin_pm5: { objectives:['学会用AI系统化分析FinTech竞品','掌握监管政策变化的AI影响评估方法','能生成竞品驱动的产品策略报告'],
      concepts:[{t:'FinTech竞争格局的分析框架',c:'金融科技领域的竞争需要从多个维度分析：牌照和资质（能做什么不能做什么，这是最大差异）、用户和场景（谁的生态更大、场景更多）、技术和数据（AI能力/数据积累/风控模型成熟度）、资金成本（大行有存款优势，互金靠ABS）。AI可以帮助系统化地收集和分析这些维度的信息。'},{t:'监管驱动vs市场驱动的产品演进',c:'金融产品的演进有两条主线：监管驱动（新规要求→产品改造→全行业统一变化）和市场驱动（用户需求→产品创新→竞品跟进）。PM需要同时关注两条线：监管变化是"必须做"的（没有选择）、市场变化是"想要做"的（有选择空间）。AI可以帮助分析监管文件的影响范围和市场动态的趋势。'}],
      steps:[{t:'第一步：竞品信息雷达',d:'建立竞品监控清单：蚂蚁集团、微众银行、招商银行、京东科技、度小满等。设定监控维度：新产品/新功能、牌照和资质变化、用户规模和增长、技术动态和AI应用。'},{t:'第二步：AI竞品深度分析',d:'每季度做一次深度竞品分析。用AI对比：产品矩阵（各自覆盖哪些金融产品线）、技术差异（AI/大数据/区块链应用程度）、用户策略（获客/留存/转化的打法）、合规策略（如何应对监管变化）。'},{t:'第三步：监管影响评估',d:'当新监管政策发布时，用AI快速评估影响：涉及的部门/产品/流程、整改的紧急程度和工作量、对业务指标的影响、竞品可能的应对策略。'},{t:'第四步：策略建议生成',d:'综合竞品+监管+市场信息，用AI生成季度策略建议：本季度必须做（合规+追平竞品）、应该做（差异化+新机会）、可以做（锦上添花）。'}],
      cases:[{s:'场景：蚂蚁集团发布了新的AI理财助手，团队焦虑',sol:'用AI快速分析它跟我们的差异：1)蚂蚁的优势是数据和流量，AI理财助手的核心是"帮你选产品"→这是我们的痛处；2)但它的AI推荐依赖支付宝生态数据，跨行客户覆盖不全→这是我们的机会；3)我们的突破口可以是"跨行资产全景分析+AI建议"——帮客户管理所有行的资产。'}],
      tools:[{n:'Claude/GPT',d:'竞品分析和策略生成'},{n:'36氪/华尔街见闻',d:'FinTech资讯'},{n:'企查查/天眼查',d:'竞品工商信息'},{n:'监管机构官网',d:'政策文件原文'}],
      tips:['竞品分析要看趋势不是看点——某个功能上线不说明什么','监管是金融行业的"游戏规则"——理解规则比优化产品更重要','不要让竞品分析引发焦虑——重点是"我们的优势在哪"','FinTech竞品分析要分层次：直接竞品（同类产品）、间接竞品（替代方案）','定期输出竞品洞察给管理层——让决策层有信息优势'],
      quizzes:[
        {triggerSlide:2, q:'FinTech竞品分析最核心的维度是？',opts:['只看产品功能', '牌照和资质（能做什么不能做什么）+用户和场景+技术和数据+资金成本', '只看价格', '只看用户量'],ans:1, explain:'FinTech竞争四维度：牌照资质（最大差异——没有牌照什么都不能做）、用户和场景（谁的生态更大）、技术和数据（AI/数据积累/风控模型）、资金成本（大行存款优势vs互金ABS）。'},
        {triggerSlide:4, q:'新监管政策发布时，PM最应该做什么？',opts:['等待法务部门给结论', '用AI快速评估影响：涉及哪些产品/流程+整改紧急度和工作量+对业务指标的影响', '忽略它', '直接停掉所有相关产品'],ans:1, explain:'监管变化=必须做的。AI快速评估：涉及部门/产品/流程→整改紧急度和工作量→业务指标影响→竞品可能应对。金融产品演进有两条主线：监管驱动（必须做）和市场驱动（可选择做）。'}
      ],
       },

    // 智能汽车×PM
    auto_pm1: { objectives:['学会用AI分析车载场景的用户数据','掌握智能座舱产品的需求挖掘方法','能生成面向座舱AI功能的需求文档'],
      concepts:[{t:'智能座舱的AI场景地图',c:'智能座舱的AI应用正在从"锦上添花"变成"核心体验"：语音助手不再是简单的指令执行，而是上下文感知的智能对话；导航不再是路径规划，而是综合路况/充电/日程的智能出行助手；个性化不再是记住座椅位置，而是基于驾驶行为和环境预测用户需求。PM需要从"功能思维"转向"场景思维"——不是问"AI能做什么功能"，而是问"在这个驾驶场景下用户需要什么"。'},{t:'车载场景的特殊约束',c:'设计车载AI产品有很多独特约束：安全性第一（任何交互不能分散驾驶注意力）、环境复杂（噪音/震动/光线变化）、用户状态受限（驾驶中不能看屏幕太久）、使用场景碎片化（平均每次驾驶30-60分钟）。这些约束不是限制，而是定义了好的车载产品应该是什么样的。'}],
      steps:[{t:'第一步：车载场景数据收集',d:'明确可用数据：语音助手使用日志、导航行为数据、座舱功能使用频率、用户反馈和评价。数据要脱敏并确保合规。'},{t:'第二步：AI场景分析',d:'用AI分析不同驾驶场景下的用户行为模式：通勤场景（高频短途，最关心路况和时效）、长途场景（关心充电/加油和休息）、接送场景（关心等待时间和乘客体验）。发现每个场景的未满足需求。'},{t:'第三步：需求定义和优先级',d:'用AI辅助定义需求：用户场景描述→当前痛点→期望体验→AI方案的可行性→预期价值。按"安全价值>便利价值>娱乐价值"排序。'},{t:'第四步：座舱AI功能PRD',d:'用AI生成座舱AI功能的PRD。包含：功能描述、适用场景、交互方式（语音/触控/手势）、安全性考量、技术可行性、验收标准。'}],
      cases:[{s:'场景：语音助手的"无法理解"率高达25%，用户抱怨"太笨"',sol:'AI分析无法理解的语音指令类型：Top3是目的地名称（生僻字/口音）、模糊指令（"找个安静的地方"）、复合指令（"导航回家顺便看看路上哪有加油站"）。需求方向：不是让AI更聪明，而是优化引导——在用户发出模糊指令时主动追问澄清，而不是直接说"无法理解"。'}],
      tools:[{n:'Claude/GPT',d:'场景分析和PRD生成'},{n:'Figma',d:'座舱HMI原型'},{n:'语音分析工具',d:'语音日志分析'},{n:'JIRA/飞书',d:'需求管理'}],
      tips:['车载场景的需求要从"驾驶安全"出发——不是所有AI功能都适合在车里用','语音交互要有"容错"设计——一次听不清就要换方式提示，不能卡住','导航是座舱最高频的需求——把这个做到极致比做一堆花哨功能更重要','每次开车都是一次"用户访谈"——真实使用场景比实验室测试更准','座舱AI的终极目标不是"替代手机"，而是让驾驶者"不想看手机"'],
      quizzes:[
        {triggerSlide:2, q:'设计车载AI产品的核心思维转换是什么？',opts:['从功能思维到场景思维——问在这个驾驶场景下用户需要什么而非AI能做什么功能', '功能越多越好', '模仿手机App', '只关注娱乐功能'],ans:0, explain:'车载AI要从“功能思维”转向“场景思维”：通勤场景（关心路况和时效）→AI做什么；长途场景（关心充电和休息）→AI做什么；接送场景（等待+乘客体验）→AI做什么。场景决定功能。'},
        {triggerSlide:4, q:'语音助手无法理解率高时，根因通常不是AI不够聪明，而是？',opts:['语音识别技术太差', '缺乏引导设计——模糊指令时没有主动追问澄清，而是直接说无法理解', '用户说话不标准', '硬件太差'],ans:1, explain:'用户发出模糊指令或复合指令时，AI需要主动追问澄清，而非直接拒绝。好的引导设计比更强的AI更有效。'}
      ],
       },
    auto_pm2: { objectives:['学会用AI分析车联网用户行为数据','掌握驾驶行为和能源补充模式的分析方法','能生成基于用户数据的产品优化建议'],
      concepts:[{t:'车联网数据的分析价值',c:'现代汽车每天产生大量数据：驾驶数据（速度/加速度/刹车/转弯）、位置数据（常去地点/路线偏好）、车辆数据（电池/油耗/胎压/故障码）、座舱数据（功能使用/设置偏好/语音指令）。这些数据组合在一起，能描绘出完整的用户画像和行为模式。AI的价值在于从海量低价值密度的数据中提取高价值的洞察。'},{t:'驾驶行为与产品设计的关系',c:'驾驶行为数据能告诉PM很多用户没说的事情：激进型驾驶者可能对"运动模式"和"加速性能"更敏感；经济型驾驶者可能最关注"能耗排名"和"节能建议"；新手驾驶者可能需要更多的"安全提醒"和"驾驶辅助"。这些洞察可以直接转化为产品功能的设计方向。'}],
      steps:[{t:'第一步：数据类型梳理',d:'梳理可用的车联网数据维度：驾驶行为（加速度分布/制动频率/巡航比例）、出行模式（通勤/周末/长途/短途）、能源行为（充电时段/快充vs慢充/充电前的剩余里程）、座舱习惯（常用功能/设置偏好/语音使用频率）。'},{t:'第二步：AI用户分群',d:'用AI基于多维数据做用户聚类。常见分群：通勤族（工作日固定路线）、周末出游族（周末高频出行）、科技发烧友（高频使用座舱功能）、佛系驾驶者（平均车速低、极少急加速刹车）。'},{t:'第三步：痛点发现和需求洞察',d:'分析每个用户群的行为特征，发现痛点：通勤族可能最关心路况预测和充电规划、科技发烧友可能希望更多个性化设置、佛系驾驶者可能更适合"自动模式"而非复杂设置。'},{t:'第四步：产品优化建议',d:'针对每个用户群的痛点，用AI生成产品优化建议。建议要有"预期改善指标"——比如"为通勤族优化充电规划功能，预计提升满意度X%、降低续航焦虑投诉Y%"。'}],
      cases:[{s:'场景：电动车的"续航焦虑"投诉居高不下',sol:'AI分析发现：不是续航不够，是续航预测不准。80%的投诉发生在"表显续航突然大幅下降"时——比如上高速或开空调后。用户不是真的跑不到，是不知道能不能跑到。改进方向：不是堆更大电池，而是做更准的"动态续航预测"——基于驾驶风格/路况/天气/空调使用实时调整续航估算。'}],
      tools:[{n:'企业版AI',d:'车联网数据安全分析'},{n:'Python/Pandas',d:'驾驶数据处理'},{n:'Tableau',d:'用户画像可视化'},{n:'Claude/GPT',d:'洞察报告生成'}],
      tips:['车联网数据是座舱产品PM最重要的决策依据','驾驶行为没有好坏——激进的不是坏用户，是不同需求','用户抱怨"续航不准"的根因通常是"估算模型不考虑实际场景"','车联网数据的时效性很重要——昨天的充电习惯可能跟今天不同','做用户画像时要考虑"偶尔模式"——周末的驾驶风格和平时完全不同'],
      quizzes:[
        {triggerSlide:2, q:'车联网数据对PM最核心的价值是？',opts:['存储大量数据', '驾驶行为数据直接反映用户偏好和需求——激进型需要运动模式，经济型关注能耗排名', '卖数据赚钱', '只做统计报表'],ans:1, explain:'驾驶行为告诉你用户没说的事：激进驾驶者→对运动模式和加速性能敏感；经济驾驶者→最关注能耗排名和节能建议；新手→需要安全提醒和驾驶辅助。数据=产品方向。'},
        {triggerSlide:4, q:'电动车续航焦虑投诉居高不下的根因通常是？',opts:['电池不够大', '续航预测不准——表显续航不考虑驾驶风格/路况/空调等实际用电', '用户太焦虑', '充电桩太少'],ans:1, explain:'80%的续航焦虑投诉发生在“表显续航突然大幅下降”时。用户不是真的跑不到，是不知道能不能跑到。改进方向不是堆电池，而是做更准的动态续航预测。'}
      ],
       },
    auto_pm3: { objectives:['学会用AI管理自动驾驶数据闭环','掌握Corner Case的分析和优先级排序方法','能基于测试数据驱动智驾产品迭代决策'],
      concepts:[{t:'自动驾驶数据闭环的概念',c:'自动驾驶的核心是"数据驱动迭代"：路测收集数据→标注和清洗→模型训练→仿真验证→OTA更新→再收集数据。每一环的数据质量和效率都影响最终产品的体验。PM要管理的不是模型本身，而是这个闭环的"效率"和"质量"——数据收集是否覆盖了足够多的场景、标注质量是否达标、模型更新的节奏是否合理。'},{t:'Corner Case管理策略',c:'Corner Case（长尾场景）是自动驾驶最大的挑战——99%的场景很好处理，但剩下1%决定了安全性和用户体验。例如：临时施工的非常规路障、被遮挡的交通标志、极端天气+夜间+拥堵的组合场景。AI可以帮助分类和优先级排序Corner Case：发生频率（多罕见）× 危险程度（出了事多大影响）× 用户感知（用户是否注意到来判断）。'}],
      steps:[{t:'第一步：路测数据管理',d:'建立路测数据的管理体系：场景分类（高速/城市/泊车/夜间/雨天）、事件标签（接管/急刹/碰撞预警/规划异常）、数据质量检查（传感器数据完整性/标注准确性）。用AI辅助做数据质量评估。'},{t:'第二步：Corner Case发现和分类',d:'用AI从路测日志中自动识别Corner Case。分析维度：场景类型、发生频率、系统表现（正确/错误/不确定）、严重程度、与竞品对比。建立Corner Case优先级矩阵。'},{t:'第三步：模型迭代决策',d:'基于Corner Case分析结果，用AI辅助制定模型迭代计划：本期重点解决哪些场景、预计改善效果、所需数据和计算资源、上线时间预估。'},{t:'第四步：版本效果评估',d:'建立模型版本间的对比评估体系：A/B对比新老模型在相同场景下的表现、回归测试确保新版本不会"修好A搞坏B"、用户体感指标（接管率/舒适度评分）。'}],
      cases:[{s:'场景：某个路口一直被报告为"系统表现不稳定"',sol:'AI分析该路口的所有路测数据：发现问题是该路口有"潮汐车道"——早高峰和晚高峰车道方向不同。模型在早高峰数据上训练，但下午经过时车道方向变了就不知道怎么走了。方案：(1)短期：加入潮汐车道的时间规则；(2)长期：让模型根据交通标志和车流动态识别车道方向。'}],
      tools:[{n:'数据标注平台',d:'标注质量管理和评估'},{n:'仿真平台',d:'虚拟场景生成和测试'},{n:'Python/MLOps',d:'模型评估和对比'},{n:'JIRA/Linear',d:'迭代管理和追踪'}],
      tips:['Corner Case是自动驾驶产品的"硬骨头"——啃不完但一直在啃','数据闭环的效率比数据量更重要——能快速从数据到改进才是关键','模型迭代不是越勤越好——每次OTA更新用户都要适应','仿真永远不能替代真实路测——仿真通过的场景真实世界可能还是有问题','智驾PM最重要的能力是"判断哪些Corner Case该优先解决"'],
      quizzes:[
        {triggerSlide:2, q:'自动驾驶数据闭环中最关键的环节是？',opts:['数据收集越多越好', '数据→标注→训练→仿真→OTA→再收集，每个环节的效率和质量', '只关注模型训练', '只做仿真不做路测'],ans:1, explain:'数据闭环的效率比数据量更重要：路测数据收集→标注质量→模型训练→仿真验证→OTA更新→新一轮路测。PM要管理的是这个闭环的效率和每个环节的质量。'},
        {triggerSlide:4, q:'Corner Case管理的策略重点是？',opts:['解决所有Corner Case', '优先级排序：发生频率×危险程度×用户感知——先解决高频+高危的', '忽略Corner Case', '随机处理'],ans:1, explain:'Corner Case永远解决不完（长尾效应）。正确策略：按频率×危险度×用户感知排序——先解决频繁发生+高危险+用户明显感知的Case，低频无害的可以后处理。'}
      ],
       },
    auto_pm4: { objectives:['学会用AI设计多模态车载交互体验','掌握语音/触控/手势/视觉的协同设计原则','能评估HMI设计的驾驶安全风险'],
      concepts:[{t:'多模态交互的设计哲学',c:'车载场景天然适合多模态交互——驾驶时不能用眼看（视觉受限）、停车时可以用手操作（触控最佳）、任何场景下都能说话（语音普适）、新手可能需要更多视觉引导。设计原则：每个模态有最适合的场景；模态之间无缝切换（"导航到XX"→语音输入，确认→触控点击）；冗余设计保障安全（一个模态失效时有备选）。'},{t:'驾驶安全与HMI设计',c:'车载HMI设计的核心约束是"分心管理"：ISO标准和NHTSA指南规定了驾驶中可接受的视觉分心时间（通常<2秒/次，累计<12秒/任务）。AI可以帮助评估HMI设计方案的分心风险：操作步数、每步需要的视觉注视时间、任务复杂度。好的设计让驾驶者在"几乎不看你"的情况下完成操作。'},{t:'车载AI交互的新范式',c:'传统的车载交互是"用户主动操作"——点屏幕、按按钮、说指令。AI带来的新范式是"系统主动服务"——系统预测用户需求并主动建议，"您常在这个时间去公司，路上有点堵，建议15分钟后出发"。"主动服务"的设计难点是：什么该主动什么不该、什么时机出现不打扰、用户如何优雅地拒绝。'}],
      steps:[{t:'第一步：场景分析和模态选择',d:'分析每个功能的使用场景，选择最合适的交互模态：驾驶中→语音为主+极简视觉确认；停车/等待→触控为主+视觉详情；副驾/停车→手势+触控+大屏。'},{t:'第二步：AI生成交互流程',d:'描述使用场景和约束条件，让AI生成多模态交互流程图。标注每个步骤的交互方式、异常处理、模态切换逻辑。'},{t:'第三步：安全评估',d:'用AI评估交互流程的安全性：驾驶场景下的视觉分心时间、操作步数、单步操作复杂度。标注可能存在安全风险的步骤并提出优化建议。'},{t:'第四步：用户测试方案',d:'用AI生成用户测试方案：测试场景设计（正常/压力/疲劳场景）、测试指标（任务完成率/完成时间/错误率/主观评分）、不同用户群的测试要点。'}],
      cases:[{s:'场景：用户在高速行驶中想切换音乐播放列表',sol:'不安全的做法：让用户在屏幕上滑滑滑找歌（分心>10秒）。安全的做法：语音说"换点high的歌"→系统自动切换到快节奏播放列表→仪表盘/HUD显示"已切换：运动歌单"（1秒确认）。全程驾驶者视线不离开路面。这就是多模态协同的价值。'}],
      tools:[{n:'Figma/Sketch',d:'HMI原型设计'},{n:'Unity/Unreal',d:'3D车载交互原型'},{n:'眼动仪/Tobii',d:'分心评估'},{n:'Claude/GPT',d:'交互设计分析'}],
      tips:['任何需要在驾驶时操作的交互，3步以上就要重新设计','语音不是万能——在噪音环境或乘客交谈时语音效果很差','HUD是驾驶中最安全的信息展示方式——关键信息放HUD','"一把回到主页"要有物理按钮——触摸屏不能完全替代实体键','设计完一定要在真实驾驶场景中测试——桌面上的完美≠车里的好用'],
      quizzes:[
        {triggerSlide:2, q:'车载多模态交互的核心设计原则是？',opts:['所有功能都用语音', '每个模态有最适合的场景，模态间无缝切换，冗余设计保障安全', '只用触摸屏', '语音和触控不能混用'],ans:1, explain:'多模态原则：驾驶时语音为主+极简视觉确认；停车时触控+视觉详情；任何场景都能说话；模态间无缝切换。冗余设计：一个模态失效时有备选。'},
        {triggerSlide:4, q:'车载HMI设计中关于分心的硬约束是？',opts:['没有约束', '单次视线离开路面<2秒，单任务累计<12秒（ISO/NHTSA标准）', '可以看5秒', '只看设计规范'],ans:1, explain:'驾驶分心的硬约束：单次视觉分心<2秒，单任务累计<12秒。任何需要在驾驶时操作超过3步的交互都需要重新设计。这是安全红线而非设计建议。'}
      ],
       },
    auto_pm5: { objectives:['学会用AI系统化分析智能汽车竞品','掌握智驾技术路线的研究方法','能基于行业趋势制定产品规划'],
      concepts:[{t:'智能汽车竞争格局',c:'智能汽车的竞争是"软件定义汽车"时代的全面竞争。竞争维度包括：智驾能力（L2/L2+/L3落地进度和体验）、座舱智能化（语音/导航/生态/个性化）、OTA能力（更新频率和内容质量）、数据闭环效率（从路测到模型更新的速度）。AI可以帮助系统化地追踪这些维度的竞品动态。'},{t:'技术路线的战略选择',c:'智驾领域的技术路线之争（纯视觉 vs 多传感器融合、高精地图 vs 轻地图 vs 无图、规则驱动 vs 数据驱动）本质上是"成本/体验/安全"的三角平衡。PM不需要选择技术路线，但需要理解每条路线的优劣势和适用场景，以及竞品的选择逻辑。AI可以帮助分析各技术路线的落地效果和演进趋势。'}],
      steps:[{t:'第一步：竞品技术雷达',d:'建立主要竞品的技术追踪矩阵：特斯拉/蔚来/小鹏/理想/华为/比亚迪。追踪维度：智驾功能落地时间表、核心传感器配置、算法架构演进、用户口碑和体验评分。'},{t:'第二步：AI竞品体验对比',d:'用AI汇总竞品评测、用户反馈、媒体评测中的关键信息，生成对比分析：各自的优势场景和弱势场景、用户最满意和最不满意的功能、OTA更新的内容和用户反响。'},{t:'第三步：技术趋势研究',d:'追踪自动驾驶的前沿技术动态：BEV+Transformer/占用网络/端到端/大模型上车。用AI分析每项技术的成熟度和落地可行性。'},{t:'第四步：产品规划建议',d:'综合竞品分析+技术趋势+用户需求+公司资源，用AI生成12-18个月产品功能规划。标注：必做功能（追平行业基线）、差异化功能（建立竞争壁垒）、探索功能（技术预研）。'}],
      cases:[{s:'场景：竞品纷纷宣布"城市NOA"，公司要决定是否跟进',sol:'用AI做三件事：1)分析竞品"城市NOA"的实际体验（不是看发布会，是看真实用户评测）→发现多数竞品的城市NOA只能在特定城市特定路段使用，用户口碑一般；2)分析自身优势→高速NOA体验已经是行业顶尖，用户对高速场景更满意；3)结论→先把高速NOA做到100分，城市NOA作为差异化长期投入。'}],
      tools:[{n:'Claude/GPT',d:'竞品分析'},{n:'汽车之家/懂车帝',d:'用户口碑和评测'},{n:'专利检索',d:'技术方向追踪'},{n:'行业报告',d:'IHS/麦肯锡汽车报告'}],
      tips:['不要被竞品的PPT功能迷惑——要看真实用户的实际体验','智驾的发展不是线性的——"最后一公里"（Corner Case）往往最难','产品规划要区分"做给投资人看的"和"做给用户用的"','OTA能力是智能汽车的核心竞争力——迭代速度=产品生命力','关注传统车企的转型速度——他们不会是永远的"慢鱼"'],
      quizzes:[
        {triggerSlide:2, q:'智能汽车竞品分析最应该关注什么？',opts:['只看发布会PPT', '用户真实体验和口碑——不是看发布了什么功能，是看实际好不好用', '只看销量', '只看技术参数'],ans:1, explain:'不要被竞品的PPT功能迷惑。要看：真实用户评测和口碑、功能实际覆盖场景（不是“支持”而是在哪些城市哪些路能真正用）、用户最满意和最不满意的功能。'},
        {triggerSlide:4, q:'制定智驾产品规划时，正确的优先级是？',opts:['追平所有竞品功能', '先把核心场景（高速NOA）做到100分，差异化场景（城市NOA）长期投入', '所有功能同步开发', '只做差异不做基础'],ans:1, explain:'产品规划策略：必做功能（追平行业基线）→先把高频场景做到极致；差异化功能（建立竞争壁垒）→长期投入但不急于追平竞品的PPT功能；探索功能（技术预研）。'}
      ],
       },

    // 日化快消×PM
    cpg_pm1: { objectives:['学会用AI从海量消费者反馈中提取产品创新信号','掌握社媒/电商数据的消费者洞察方法','能基于洞察生成新产品概念Brief'],
      concepts:[{t:'快消品消费者洞察的数据来源',c:'快消品的消费者数据极其丰富但碎片化：电商评论（京东/天猫/拼多多）、社媒内容（小红书/抖音/微博）、搜索数据（百度/淘宝搜索趋势）、私域数据（企业微信/会员系统）。AI的价值在于把这些碎片拼成完整的"消费者声音全景"——不是听一个人说什么，而是听100万人在说什么。'},{t:'从数据到产品创新',c:'消费者反馈中最有价值的不是"我想要XX"，而是隐藏在产品评价中的"如果...就好了"。例如："这个面霜保湿很好，就是太油了"→机会：保湿但不油腻的面霜；"包装很好看，但用到最后挤不出来很浪费"→机会：真空泵包装。AI可以批量扫描评价，自动识别这些"可行动的产品洞察"。'}],
      steps:[{t:'第一步：多渠道数据收集',d:'从电商平台、社媒、客服系统收集消费者反馈数据。清洗数据：去重、去除刷单/营销内容、提取有实质性评价的内容。'},{t:'第二步：AI情感和需求分析',d:'用AI对反馈做情感分析（正/负/中性）和需求分类：功效相关、体验相关、包装相关、价格相关、服务相关。找出高频负面和高频期望。'},{t:'第三步：产品创新机会识别',d:'让AI从分析结果中提取产品创新机会。每个机会包含：消费者原话、需求量级、当前竞品表现、技术可行性评估。'},{t:'第四步：产品概念Brief生成',d:'基于创新机会，用AI生成新产品概念Brief：产品定位、目标人群、核心卖点、与竞品的差异点、初步配方/成分方向。'}],
      cases:[{s:'场景：某面霜产品的差评集中在"过敏"和"搓泥"',sol:'AI深入分析差评：过敏的消费者中70%提到"脸颊泛红"——典型的敏感肌反应。进一步分析发现，同品牌的敏感肌系列却很少收到过敏投诉。洞察：不是产品不好，是消费者选错了系列。改进方向：在购买页增加"肤质适配测试"，引导敏感肌用户选择敏感肌系列。'}],
      tools:[{n:'Claude/GPT',d:'消费者反馈分析'},{n:'小红书/抖音数据分析',d:'社媒趋势追踪'},{n:'电商评论分析工具',d:'评价批量处理'},{n:'飞书多维表格',d:'需求管理和追踪'}],
      tips:['10条好评不如1条差评有价值——差评告诉你要改进什么','消费者说的不一定是他们真正在乎的——看行为比看语言更准','产品创新机会要在"消费者想要"和"技术可实现"之间找交集','关注"竞品好评中提到的"——说明这是消费者在乎的价值点','趋势发现要有时效性——社媒上的热点1个月后就过时了'],
      quizzes:[
        {triggerSlide:2, q:'快消品消费者洞察最有价值的数据来源是？',opts:['只看问卷调研', '碎片化数据的全景整合——电商评论+社媒内容+搜索趋势+私域数据', '只看销量数据', '只看竞品动态'],ans:1, explain:'快消消费者数据极度碎片化：电商评论（京东/天猫）、社媒（小红书/抖音）、搜索趋势、私域数据。AI的价值就是把这些碎片拼成全景图。'},
        {triggerSlide:4, q:'差评中隐藏的最有价值的信息是什么？',opts:['差评就是用户不喜欢', '如果...就好了——隐藏在产品评价中的创新机会信号', '差评没用', '差评都是恶意差评'],ans:1, explain:'消费者评价中最有价值的是“如果...就好了”——“保湿很好，就是太油了”→机会：保湿不油腻的面霜。这些可行动的产品洞察是创新的金矿。'}
      ],
       },
    cpg_pm2: { objectives:['学会用AI分析消费者购买决策路径','掌握复购驱动因素的AI分析方法','能构建消费者分群和差异化运营策略'],
      concepts:[{t:'快消品消费者决策模型',c:'快消品的购买决策跟耐用品不同：决策速度快（几秒到几分钟）、受情绪和习惯影响大（"看到了就想买"）、品牌忠诚度相对低（容易被促销和尝新吸引）。AI可以分析完整购买路径：触达（在哪里看到）→兴趣（为什么点击）→决策（为什么选A不选B）→购买（是否顺利）→复购（是否还会买）。每个环节的转化率优化就是产品和运营的工作。'},{t:'复购的秘密',c:'快消品的复购 = 产品效果满意度 × 品牌情感连接 × 购买便利性 × 价格接受度。任何一个因子为零，复购就是零。AI可以帮助分析：复购用户和流失用户在行为上有什么不同、什么触发因素能提高复购率（如用完了提醒/会员专属优惠/新品试用）、不同品类的复购周期规律（面霜3个月、洗发水2个月）。'}],
      steps:[{t:'第一步：购买路径分析',d:'用AI分析用户从首次接触到购买的完整路径：曝光渠道分布、浏览行为、加购/收藏行为、购买决策时间、转化漏斗各环节的流失率。'},{t:'第二步：复购行为分析',d:'分析复购用户和一次购买用户的差异：产品偏好（什么产品更容易产生复购）、购买时机（什么时候买第二次）、行为特征（复购前有什么信号）。'},{t:'第三步：流失预警和干预',d:'建立AI流失预警模型：识别"有流失风险"的用户（如使用周期已到但未复购）。设计干预策略：个性化优惠券/使用提醒/新品推荐。'},{t:'第四步：分群运营策略',d:'基于购买行为做用户分群：忠诚用户、价格敏感用户、尝新用户、沉睡用户。为每类设计差异化的产品和运营策略。'}],
      cases:[{s:'场景：某洗发水品牌复购率只有18%，远低于行业平均的30%',sol:'AI分析发现：不是产品不好（好评率92%），是"买一瓶用半年"——复购周期太长。而且用户用完时通常已经忘了上次买的什么品牌。改进：推出"小瓶装试用装+正装"组合（缩短复购周期）、在使用后第5周（快用完时）推送复购提醒、会员订阅制（自动定期配送）。'}],
      tools:[{n:'神策/GrowingIO',d:'用户行为分析'},{n:'企业微信/个推',d:'用户触达和推送'},{n:'Claude/GPT',d:'分群策略生成'},{n:'CRM/CDP',d:'用户数据平台'}],
      tips:['快消品的复购是生命线——获取一个新客户的成本是留住老客户的5倍','推送时机比推送内容更重要——用户快用完时的提醒效果最好','分群不要太细——3-5个群体即可，太细无法执行','复购率低的根因往往是"产品不够好"或"用户忘了你"','试用装是小钱买大复购——降低首次决策成本是快消品的通用法则'],
      quizzes:[
        {triggerSlide:2, q:'快消品复购的核心公式是什么？',opts:['复购=产品质量', '复购=产品效果满意度×品牌情感连接×购买便利性×价格接受度', '复购=促销力度', '复购=广告投放'],ans:1, explain:'复购的四个因子是乘积关系——任何一个为零，复购为零。产品不好（0分）→复购=0；买不到（0分）→复购=0；太贵（0分）→复购=0。AI可以帮你量化每个因子的得分和改善空间。'},
        {triggerSlide:4, q:'复购率从18%提升到30%，AI推荐的最有效的策略通常是？',opts:['加大广告投放', '缩短复购周期（如小包装+订阅制）+使用后用AI识别流失信号精准触达', '大幅降价', '增加产品线'],ans:1, explain:'复购率低通常不是产品不好，是用户忘了你。策略：缩短复购周期（试用装→小包装→订阅制）+AI识别流失信号（使用周期已到但未复购→个性化提醒+优惠）。'}
      ],
       },
    cpg_pm3: { objectives:['学会用AI分析市场趋势和研发数据','掌握成分/配方层面的竞品分析方法','能生成数据驱动的产品创新方向报告'],
      concepts:[{t:'快消品的产品创新方法',c:'快消品的产品创新有三个来源：市场拉动（消费者想要什么）、技术推动（新的原料/配方/工艺能做什么）、竞品跟随（竞品做了什么我们怎么做更好）。AI可以同时分析这三股力量：消费者数据告诉你"需求是什么"、原料/技术数据告诉你"能做什么"、竞品数据告诉你"别人在做什么"。三股力量交叉的地方就是最好的创新机会。'},{t:'成分和配方的分析框架',c:'美妆/食品行业的成分分析是PM的基本功：宣称成分（主打卖点）、配方架构（基础体系+活性物+防腐+香精）、浓度梯度（活性物的有效浓度）、协同效应（A+B>C）。AI可以帮助批量对比竞品的成分表和功效宣称，快速发现差异化和机会点。'}],
      steps:[{t:'第一步：市场趋势扫描',d:'用AI分析行业报告和社媒数据，提取上升趋势的关键词：新兴成分、消费理念、使用场景、包装创新。建立趋势热度排名。'},{t:'第二步：竞品成分对标',d:'收集主要竞品的产品成分表（备案信息/产品详情页），用AI做对比分析：成分差异点、宣称的匹配度、成本结构推估。'},{t:'第三步：消费者需求匹配',d:'将趋势和竞品分析结果与消费者洞察（Phase 1的成果）交叉匹配。找到"消费者想要+趋势上升+竞品未充分满足"的机会窗口。'},{t:'第四步：创新方向报告',d:'用AI生成季度产品创新方向报告：3-5个创新方向、每个方向的消费者验证、竞品差异化分析、技术和成本可行性、预期市场效果。'}],
      cases:[{s:'场景：精华品类增长很快但公司没有爆款，不知道该做什么方向',sol:'AI三步分析：1)趋势→"早C晚A"概念持续火爆，但A醇有刺激性问题→"温和A醇替代成分"是机会；2)竞品→头部品牌的A醇精华主打"高浓度"，副作用是泛红脱皮→差异化方向：温和但有效的A醇替代；3)找研发确认→补骨脂酚（Bakuchiol）是植物源A醇替代，温和不刺激。产品方向确定：温和抗老精华。'}],
      tools:[{n:'Claude/GPT',d:'趋势分析和成分研究'},{n:'美丽修行/成分APP',d:'成分数据库'},{n:'Nint任拓/魔镜',d:'电商数据'},{n:'行业展会/期刊',d:'新原料和新技术'}],
      tips:['趋势不是追热点——是判断什么会从"小众"变成"主流"','成分分析要懂"有效浓度"——很多产品加了成分但浓度不够是噱头','最好的创新来自"消费者需求×技术可实现"的交集','每季度做一次趋势更新——消费品市场变化太快','不要只盯着竞品——跨品类借鉴往往能带来真正的突破'],
      quizzes:[
        {triggerSlide:2, q:'快消品产品创新的三个来源是什么？',opts:['只靠消费者反馈', '市场拉动（消费者想要）+技术推动（新原料/工艺能做）+竞品跟随（别人做了什么）三股力量交叉', '只靠研发部门', '只靠竞品分析'],ans:1, explain:'最好的创新机会在三股力量交叉处：消费者告诉你需求是什么+技术告诉你能做什么+竞品告诉你别人在做什么。AI可以同时分析这三股力量，找到最佳创新窗口。'},
        {triggerSlide:4, q:'分析竞品成分表时，最应该关注什么？',opts:['成分列表越长越好', '宣称成分（主打卖点）+配方架构+活性物有效浓度+协同效应+差异化空间', '只看主打成分', '只看价格不看成分'],ans:1, explain:'竞品成分分析五维度：宣称成分（卖点是什么）、配方架构（基础体系+活性物）、浓度梯度（是否达到有效浓度）、协同效应（A+B>C）、差异化空间（我们能做到什么不同）。'}
      ],
       },
    cpg_pm4: { objectives:['学会用AI高效生产多渠道营销内容','掌握品牌调性的AI控制方法','能构建AI驱动的内容生产流水线'],
      concepts:[{t:'AI内容的品牌一致性',c:'快消品的内容营销极度依赖品牌调性：同一个产品，奢侈品牌说的是"永恒优雅"，大众品牌说的是"性价比之王"。AI最大的风险不是写不好，是"写成了别人"。解决方案：给AI输入品牌语言指南（品牌人设、核心话术、禁用词、经典句式）、提供品牌过往优质内容作为few-shot参考、建立内容审核checklist。'},{t:'多渠道内容的生产策略',c:'快消品在不同渠道需要不同的内容：电商详情页→功能+卖点+信任背书（专业长文案）、小红书→真实体验+情绪共鸣（口语化+emoji）、抖音→前3秒抓眼球+快节奏+行动呼吁、公众号→品牌故事+深度内容。AI可以将核心产品信息转化为适配各渠道的"素材包"。'}],
      steps:[{t:'第一步：建立品牌语言指南',d:'用AI辅助生成品牌语言指南：品牌人设描述、核心话术库、禁用词清单、经典文案案例、不同渠道的风格指引。'},{t:'第二步：AI内容批量生产',d:'输入产品核心信息，让AI生成多渠道内容包：电商详情页文案、社交平台种草文、短视频脚本、广告素材文案、PR稿。'},{t:'第三步：内容质量审核',d:'建立AI+人工的内容审核流程：AI初审（品牌调性检查+事实准确性+合规性）→人工复审（创意质量+消费者感知）。'},{t:'第四步：内容效果追踪',d:'追踪每条AI生成内容的真实效果（点击率/转化率/互动量），让AI分析"什么类型的内容效果好"，持续优化品牌语言指南和AI指令。'}],
      cases:[{s:'场景：新品上市需要同时产出20条不同渠道的内容，时间只有3天',sol:'用AI：第1天→输入产品核心信息和品牌指南，AI生成30条内容初稿（电商5条+小红书10条+抖音5条+公众号2条+PR稿3条+朋友圈5条）；第2天→AI初审+人工精选15条+修改；第3天→定稿+排期发布。效率提升5倍，而且内容风格统一。'}],
      tools:[{n:'ChatGPT/Claude',d:'多渠道内容生成'},{n:'Jasper/Copy.ai',d:'营销文案AI'},{n:'Midjourney/SD',d:'内容配图'},{n:'飞书/Notion',d:'内容日历管理'}],
      tips:['品牌语言指南是AI内容质量的"宪法"——花时间做好','AI生成内容≠不用审核——品牌调性和事实准确性必须人工把关','好的AI指令要包含"品牌人设+渠道风格+目标人群+字数范围+禁忌"','AI内容模板化——高频内容类型建立模板，效率更高','追踪AI内容的真实数据，让AI自己学习"什么内容更好"'],
      quizzes:[
        {triggerSlide:2, q:'AI内容营销最大的风险是什么？',opts:['写得太快', '写成了别的品牌——不同品牌人设下同一产品的表达完全不同，AI容易丢失品牌调性', '内容太短', '没有图片'],ans:1, explain:'AI最大风险不是写不好，是写成了别人。同一个产品：奢侈品牌说永恒优雅，大众品牌说性价比之王。解决方案：建立品牌语言指南（品牌人设+核心话术+禁用词+经典句式）作为AI输入。'},
        {triggerSlide:4, q:'多渠道内容生产的最佳策略是？',opts:['所有渠道发一样的内容', '核心产品信息→AI转化为各渠道适配版本（电商专业/小红书口语/抖音快节奏）→人工审核发布', '每个渠道独立创作', '只做一个渠道'],ans:1, explain:'高效策略=一个核心素材→AI多渠道适配：电商详情页（专业+信任背书）、小红书（口语化+体验感）、抖音（前3秒抓眼球+快节奏）、公众号（深度+品牌故事）。AI生成+人工审核。'}
      ],
       },
    cpg_pm5: { objectives:['学会用AI自动监控竞品动态','掌握市场份额变化的分析方法','能生成竞品驱动的策略调整建议'],
      concepts:[{t:'快消品竞品监控体系',c:'快消品的竞争态势变化速度极快——新品上市、价格调整、促销活动、渠道变化每天都在发生。AI可以实现：新品自动发现和成分/卖点分析、价格变动实时监控、促销活动识别和对比、渠道覆盖和货架份额追踪。从"每周看报告"变成"实时监控+日报摘要"。'},{t:'份额变化的归因分析',c:'市场份额的变化需要归因：是新品上市抢走了份额（需要产品创新应对）、是价格促销拉走了消费者（需要考虑价格策略）、是渠道覆盖不足（需要加强铺货）、是品牌心智下降（需要加强品牌营销）。每种原因对应不同的对策。AI可以帮你从数据中判断"为什么变了"。'}],
      steps:[{t:'第一步：竞品监控清单',d:'确定监控的竞品清单和监控维度：产品（新品/成分/功效/包装/价格）、渠道（铺货率/货架位置/促销力度）、营销（投放量/内容方向/KOL合作）、消费者（口碑变化/好评率趋势/差评主题）。'},{t:'第二步：AI自动数据收集',d:'设定AI定期扫描规则：电商平台→新品上架+价格变化+评价趋势；社媒→品牌讨论量和情感倾向；渠道→促销活动识别。'},{t:'第三步：月度竞品报告',d:'用AI生成月度竞品报告：本月关键动态、市场份额估算、价格带变化、新品分析、消费者口碑对比、策略建议。'},{t:'第四步：策略响应',d:'基于竞品动态制定应对策略：竞品大打价格战→是否跟进/如何差异化应对；竞品推出创新产品→评估是否需要快速跟进；竞品开拓新渠道→评估该渠道的机会和风险。'}],
      cases:[{s:'场景：主要竞品突然全线降价20%，市场份额被快速侵蚀',sol:'AI快速分析：竞品的降价不是清仓——所有渠道同步降，是战略性的。检查竞品成本结构（包装简化/成分替代）→发现他们换了更便宜的包材。评估：我们降价跟进会伤利润且无法持续。策略：不跟进价格战，而是强化"品质不妥协"的品牌定位+推出高性价比副线产品。'}],
      tools:[{n:'电商数据分析工具',d:'价格/销量监控'},{n:'小红书/抖音分析',d:'社媒口碑追踪'},{n:'Claude/GPT',d:'竞品报告生成'},{n:'Nielsen/Kantar',d:'市场份额数据'}],
      tips:['竞品监控要自动化——手动收集赶不上市场变化速度','关注竞品的"结构性变化"（换原料/换包材/换渠道）而非表面变化','价格战不要轻易跟进——先分析竞品的成本结构是否有变化','月报要简洁——一页纸说清楚"变什么+为什么变+怎么办"','最好的防御是进攻——不要只盯着竞品做了什么，要自己创造新需求'],
      quizzes:[
        {triggerSlide:2, q:'快消品竞品监控的关键变化是什么？',opts:['监控越频繁越好', '从每周看报告变成实时监控+AI日报摘要——快速响应市场变化', '手动收集最准确', '只监控价格'],ans:1, explain:'快消品市场变化极快（每天都有新品/调价/促销）。AI可以实现：新品自动发现+成分/卖点分析+价格变动实时监控+促销活动识别+渠道覆盖追踪。从周报变日报。'},
        {triggerSlide:4, q:'竞品全线降价抢市场时，最不应该做的反应是？',opts:['分析竞品降价是否可持续（成本结构变化？）', '盲目跟进价格战——先分析对手是战略性降价还是清仓甩卖', '强化自身差异化定位', '评估是否推高性价比副线'],ans:1, explain:'面对竞品降价：1) AI分析竞品成本结构（包材替换？成分替代？）→判断是否可持续；2) 不盲目跟进价格战（伤利润且不可持续）；3) 强化品质定位+推高性价比副线差异化应对。'}
      ],
       },

    // 互联网×PM
    internet_pm1: { objectives:['学会用AI从用户反馈中挖掘互联网产品需求','掌握评论/社区/行为数据的洞察方法','能基于洞察生成结构化PRD'],
      concepts:[{t:'互联网用户声音的三大来源',c:'互联网产品的用户需求藏在三类数据里：评论与评分（应用商店、电商评价、社媒吐槽——用户"说出来"的需求）、社区与反馈（论坛、客服工单、问卷——用户"讨论"的需求）、行为与数据（点击、停留、转化、流失——用户"做出来"的需求）。AI的核心价值是把这三类非结构化数据变成结构化的需求清单。'},{t:'从洞察到PRD的转化',c:'用户洞察不等于需求——"用户说加载慢"是现象，需求是"首屏加载时间<2秒，弱网下有降级方案"。AI可以帮你完成这个转化：现象（用户原声）→归因（技术/设计/内容哪个环节）→量化（影响多少用户/多少流失）→方案（产品改进+验收标准）。每一条洞察都应该能追溯回用户原声，否则就是编造的需求。'}],
      steps:[{t:'第一步：数据收集与清洗',d:'确定洞察目标（电商转化/游戏留存/社交活跃），收集对应数据：应用商店评论、客服工单、社区帖子、埋点行为数据。用AI做数据清洗：去重、过滤广告和无关评论、按情感倾向分类。'},{t:'第二步：AI主题聚类',d:'用AI对用户反馈做主题聚类：高频问题自动归类（性能/价格/功能/体验/客服），输出每个主题的占比、情感倾向和典型用户原声。用词云或聚类图呈现。'},{t:'第三步：需求优先级排序',d:'用AI综合评估每个需求主题的优先级：影响用户规模×影响严重程度×频次趋势×解决成本。输出"高优先级/中优先级/低优先级"清单，标注推荐处理节奏。'},{t:'第四步：生成PRD框架',d:'对高优先级需求，用AI生成PRD初稿：用户故事、功能描述、交互要点、验收标准、数据埋点要求。人工审核后再进入开发排期。'}],
      cases:[{s:'场景：电商App的退款相关客服工单激增',sol:'AI聚类工单发现：60%的退款投诉不是"不给退"，而是"流程太繁琐"——需要找客服、发凭证、等审核，用户嫌麻烦。进一步分析退款漏斗：发起退款→上传凭证环节流失率最高（40%）。改进方向：简化凭证上传（拍照自动识别）+退款进度主动推送。工单量下降45%。'}],
      tools:[{n:'Claude/GPT',d:'反馈聚类和需求分析'},{n:'神策/GrowingIO',d:'行为数据分析'},{n:'蓝湖/Figma',d:'原型设计'},{n:'JIRA/飞书',d:'需求管理'}],
      tips:['用户原声是需求的"证据"——PRD里每条需求都要能追溯','评论情感分析要看趋势不是看绝对值','差评是最便宜的用研——每一条差评背后都有一个未被满足的场景','AI聚类后一定要人工抽检——防止模型把不同问题混为一类','洞察驱动的PRD要让AI帮你写"为什么做"而不是只写"做什么"'],
      quizzes:[
        {triggerSlide:2, q:'互联网产品用户需求的三大来源是？',opts:['只有用户访谈', '评论评分+社区反馈+行为数据——用户说出来的、讨论的、做出来的需求', '只看竞品', '只靠老板拍板'],ans:1, explain:'三类用户声音：评论与评分（用户说出来的需求）、社区与反馈（用户讨论的需求）、行为与数据（用户做出来的需求）。AI的价值是把这三类非结构化数据变成结构化需求清单。'},
        {triggerSlide:4, q:'"用户说加载慢"这个现象，正确的需求转化方式是？',opts:['直接告诉开发"用户说卡"', '现象→归因→量化→方案——首屏<2秒、弱网降级、影响X%用户流失', '不处理', '只优化网络'],ans:1, explain:'用户洞察≠需求：现象（用户原声）→归因（技术/设计/内容哪个环节）→量化（影响多少用户/流失）→方案（产品改进+验收标准）。每条需求都能追溯回用户原声。'}
      ],
       },
    internet_pm2: { objectives:['学会用AI构建用户分群与画像','掌握增长漏斗的诊断方法','能基于留存分析制定增长策略'],
      concepts:[{t:'用户分群的AI方法',c:'互联网产品的用户分群有多个维度：行为分群（高频/低频/沉睡/流失）、价值分群（高价值/低价值/潜在价值）、生命周期分群（引入/成长/成熟/衰退）。AI可以自动发现数据中自然形成的用户群组（聚类），也可以根据业务规则做人工分群。好的分群要满足：组内相似、组间差异大、可行动（每组都能对应运营动作）。'},{t:'增长漏斗与留存的关系',c:'增长不是单点优化：拉新解决"来不来"、激活解决"用不用"、留存解决"留不留"、变现解决"花不花"、推荐解决"传不传"。漏斗诊断要找"最宽的漏水口"——各环节转化率中最低的那个环节，就是最大的增长机会。留存分析要关注"关键行为"——完成某个核心动作的用户留存显著高于未完成的，这个动作就是"aha时刻"。'}],
      steps:[{t:'第一步：数据准备',d:'梳理用户数据：注册信息、行为事件（浏览/点击/购买/分享）、渠道来源、版本信息。确定分群目标和指标口径（新用户定义、活跃定义、留存定义）。'},{t:'第二步：AI分群与画像',d:'用AI做用户聚类分析，生成分群结果。对每个分群输出画像：人口特征、行为特征、价值特征、典型使用路径。检查分群的可解释性和可行动性。'},{t:'第三步：漏斗与留存诊断',d:'用AI分析转化漏斗各环节的转化率，找出最大流失点。分析不同分群用户的留存曲线，找出"aha时刻"关键行为。'},{t:'第四步：增长策略输出',d:'基于诊断结果，用AI生成增长策略：针对最大漏斗漏洞的优化方案、针对关键行为的激活引导设计、针对高价值人群的精细化运营方案。'}],
      cases:[{s:'场景：游戏App新用户7日留存仅8%，远低于行业水平',sol:'AI分析新用户前7天的行为序列：发现完成"新手引导+首局对战"的用户7日留存达35%，而只完成新手引导就退出的用户留存仅3%。进一步分析：新手引导中"跳过按钮"位置太显眼，40%的用户跳过引导直接进入对战→被高手碾压→流失。改进：引导不可跳过+匹配新手专属房间。7日留存从8%提升到22%。'}],
      tools:[{n:'Python/Pandas',d:'用户数据处理'},{n:'神策/GrowingIO',d:'行为漏斗分析'},{n:'Claude/GPT',d:'洞察和策略生成'},{n:'Tableau',d:'用户画像可视化'}],
      tips:['分群的目的是"可行动"——无法对应运营动作的分群没有价值','漏斗诊断永远找最宽的漏水口——补最大的漏洞收益最高','留存分析的灵魂是找到"aha时刻"关键行为','不要被平均值迷惑——分群看数据才有洞察','增长策略要落到具体动作+预期指标，不能停留在概念'],
      quizzes:[
        {triggerSlide:2, q:'好的用户分群必须满足的条件是？',opts:['组数越多越好', '组内相似+组间差异大+可行动（每组能对应运营动作）', '按年龄段分就行', '越简单越好'],ans:1, explain:'好的分群三条件：组内相似（同组用户行为接近）、组间差异大（不同组有明显区别）、可行动（每组都能对应具体的运营策略）。无法对应运营动作的分群没有价值。'},
        {triggerSlide:4, q:'留存分析中"aha时刻"指的是？',opts:['用户打开App的时刻', '完成某个核心行为的用户留存显著更高——这个行为就是aha时刻', '用户付费的时刻', '用户卸载的时刻'],ans:1, explain:'aha时刻=关键行为：完成某核心动作的用户留存显著高于未完成的。找到aha时刻→设计激活引导让新用户尽快体验→留存率大幅提升。'}
      ],
       },
    internet_pm3: { objectives:['学会用AI分析互联网核心产品指标','掌握转化/付费/活跃的归因方法','能基于数据做出产品迭代决策'],
