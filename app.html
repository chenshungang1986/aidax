function renderTaskModal() {
  const c = COURSES[S.role][S.courseIdx];
  const ti = S.courseTaskIdx;
  const t = c.tasks[ti];
  const prog = S.courseProgress[c.id] || {};
  const hintData = getTaskHint(c.id, ti);
  const showHint = S.taskShowHint[c.id+'_'+ti];
  const showAnswer = S.taskShowAnswer[c.id+'_'+ti];

  let html = headerHtml(c.title + ' — 关卡' + (ti+1), '任务陪练', true);
  html += `<div class="card slide-up">
    <div style="display:flex;gap:8px;margin-bottom:16px;">`;
  c.tasks.forEach((_, i) => {
    const done = prog.tasksDone > i;
    html += `<div style="flex:1;height:4px;border-radius:2px;background:${done?'var(--green)':i===ti?'var(--blue)':'var(--border)'};"></div>`;
  });
  html += `</div>
    <p style="font-weight:700;font-size:16px;margin-bottom:8px;">关卡 ${ti+1}：${t.t}</p>
    <p style="font-size:14px;color:var(--text2);margin-bottom:16px;">${t.h}</p>`;

  // Hint system
  if (hintData && hintData.hints && hintData.hints.length) {
    html += `<button class="hint-toggle" onclick="S.toggleTaskHint('${c.id}',${ti})">${showHint ? '🔽 收起提示' : '💡 查看解题提示 ('+hintData.hints.length+'步)'}</button>`;
    if (showHint) {
      html += `<div class="hint-steps">`;
      hintData.hints.forEach((h, hi) => {
        html += `<div class="hint-step"><div class="hint-num">${hi+1}</div><div>${h}</div></div>`;
      });
      html += `</div>`;
    }
  }

  html += `<div style="background:var(--bg);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;margin-top:12px;">
      <p style="font-size:13px;font-weight:500;margin-bottom:6px;">请在下方完成你的任务</p>
      <p style="font-size:12px;color:var(--text2);">模拟真实工作场景，用AI工具完成对应任务。在文本框中描述你的操作过程和成果。</p>
    </div>
    <textarea class="task-input" id="taskAnswer" placeholder="请描述你使用AI工具完成任务的过程和成果...">${prog['taskAns'+ti]||''}</textarea>`;

  // Reference answer
  if (hintData && hintData.answer) {
    html += `<button class="hint-toggle" style="margin-top:8px;" onclick="S.toggleTaskAnswer('${c.id}',${ti})">${showAnswer ? '🔼 收起参考' : '📋 查看参考答案'}</button>`;
    html += `<div class="task-answer-box${showAnswer?' show':''}" id="taskAnswerBox">${hintData.answer.replace(/\n/g,'<br>')}</div>`;
  }

  html += `<div class="flex-between mt-4">
      <button class="btn btn-outline" onclick="S.goBack()">返回课程</button>
      <div style="display:flex;gap:8px;">
        ${ti>0?`<button class="btn btn-outline" onclick="S.prevTask()">上一关卡</button>`:''}
        <button class="btn btn-primary" onclick="S.submitTask()">提交任务</button>
      </div>
    </div>`;

  if (prog['taskAns'+ti]) {
    html += `<div class="alert alert-success mt-3">
      <strong>任务已提交！</strong>
      <p style="margin-top:4px;">AI评估：${prog['taskFeedback'+ti] || '正在评估中...'}</p>
      ${ti < c.tasks.length-1 ? `<button class="btn btn-green btn-sm mt-2" onclick="S.nextTask()">进入下一关卡 →</button>` :
      `<button class="btn btn-green btn-sm mt-2" onclick="S.finishCourse()">完成课程 ✓</button>`}
    </div>`;
  }

  html += `</div>`;
  return html;
}

// ---- FINAL QUIZ ----
function renderFinalQuiz() {
  const role = ROLES[S.role];
  const questions = FINAL_QUIZZES[S.role];

  let html = headerHtml('AI能力成果测验', role.icon + ' ' + role.name, true);
  html += `<div class="card slide-up">
    <p style="font-weight:600;font-size:15px;margin-bottom:16px;">完成学习后，检验你的AI应用能力（${questions.filter(q=>q.type==='choice').length}道选择题 + ${questions.filter(q=>q.type==='subjective').length}道主观题）</p>`;

  if (S.finalSubmitted) {
    html += renderFinalResults();
  } else {
    questions.forEach((q, i) => {
      const typeBadge = q.type === 'choice'
        ? '<span class="quiz-type-badge quiz-type-choice">选择题</span>'
        : '<span class="quiz-type-badge quiz-type-subj">主观题</span>';
      html += `<div style="margin-bottom:20px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span style="font-weight:700;font-size:14px;color:var(--blue);">第${i+1}题</span>${typeBadge}
        </div>
        <p style="font-weight:600;font-size:14px;margin-bottom:8px;">${q.q}</p>`;

      if (q.type === 'choice') {
        q.opts.forEach((o, j) => {
          const sel = S.finalAnswers[i];
          html += `<label class="quiz-option" style="margin-bottom:4px;${sel===j?'border-color:var(--blue);background:var(--blue-bg);':''}">
            <input type="radio" name="q${i}" value="${j}" ${sel===j?'checked':''} onchange="S.answerFinal(${i},${j})" style="margin-right:8px;">${String.fromCharCode(65+j)}. ${o}</label>`;
        });
      } else {
        // Subjective question
        html += `<div class="subj-template"><div class="subj-label">📋 答案模板</div><div class="subj-content">${q.template}</div></div>`;
        const showHint = S.finalShowHint[i];
        html += `<button class="hint-toggle" onclick="S.toggleFinalHint(${i})">${showHint ? '🔼 收起提示' : '💡 查看解题步骤 ('+q.steps.length+'步)'}</button>`;
        if (showHint) {
          html += `<div class="hint-steps">`;
          q.steps.forEach((s, si) => {
            html += `<div class="hint-step"><div class="hint-num">${si+1}</div><div>${s}</div></div>`;
          });
          html += `</div>`;
        }
        html += `<textarea class="task-input" id="subjAns${i}" onchange="S.answerSubjFinal(${i},this.value)" placeholder="请按照模板在此作答...">${S.finalSubjAnswers[i]||''}</textarea>`;
      }
      html += `</div>`;
    });

    const allAnswered = questions.every((q,i) => {
      if (q.type === 'choice') return S.finalAnswers[i] !== undefined;
      return S.finalSubjAnswers[i] && S.finalSubjAnswers[i].trim();
    });
    html += `<button class="btn btn-primary" onclick="S.submitFinal()" ${!allAnswered?'disabled':''}>提交测验</button>`;
  }

  html += `</div>`;
  return html;
}

function renderFinalResults() {
  const questions = FINAL_QUIZZES[S.role];
  let html = `<div class="text-center" style="padding:20px 0;">
      <div class="gauge"><svg viewBox="0 0 120 120" width="120" height="120"><circle class="gauge-bg" cx="60" cy="60" r="52"/><circle class="gauge-fill" cx="60" cy="60" r="52" stroke-dasharray="326" stroke-dashoffset="${326 - 326*S.finalScore/100}" stroke="${S.finalScore>=80?'var(--green)':S.finalScore>=60?'var(--amber)':'var(--red)'}"/></svg>
        <div class="gauge-text">${S.finalScore}</div></div>
      <div class="gauge-label">分</div>
      <p style="margin-top:12px;font-size:14px;font-weight:500;">${S.finalScore>=80?'优秀！你已掌握AI核心应用能力':S.finalScore>=60?'良好！继续练习可进一步提升':'需要加强，建议重新学习重点课程'}</p>
    </div>`;

  // Show correct answers for choice questions
  html += `<div class="mt-3"><p style="font-weight:600;font-size:14px;margin-bottom:10px;">答案解析</p>`;
  questions.forEach((q, i) => {

      const correct = userAns === q.ans;
      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <span style="color:${correct?'var(--green)':'var(--red)'};font-weight:600;">${correct?'✓':'✗'}</span> ${i+1}. ${q.q}
        <span style="display:block;margin-top:4px;color:var(--text2);">正确答案：${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]} — ${q.explain||''}</span></div>`;
    } else {
      const hasAnswer = S.finalSubjAnswers[i] && S.finalSubjAnswers[i].trim();
      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <span style="color:${hasAnswer?'var(--green)':'var(--red)'};font-weight:600;">${hasAnswer?'✓ 已作答':'✗ 未作答'}</span> ${i+1}. ${q.q}
        <span style="display:block;margin-top:4px;color:var(--text2);">评分要点：${(q.keyPoints||[]).join(' | ')}</span></div>`;
    }
  });
  html += `</div>`;

  html += `<div class="text-center mt-3" style="display:flex;gap:10px;justify-content:center;">
      <button class="btn btn-outline" onclick="S.goDashboard()">返回学习</button>
      <button class="btn btn-outline" onclick="S.startFinalQuiz()">重新测验</button>
      <button class="btn btn-primary" onclick="S.saveAndFinish()">保存并完成</button>
    </div>`;
  return html;
}

// ---- ADMIN ----
function renderAdmin() {
  const all = S.employees;
  const total = all.length;
  const completed = all.filter(e => e.finalScore != null).length;
  const avgScore = completed > 0 ? Math.round(all.filter(e=>e.finalScore!=null).reduce((s,e)=>s+e.finalScore,0)/completed) : 0;
  const roleBreakdown = {};
  all.forEach(e => { roleBreakdown[e.role] = (roleBreakdown[e.role]||0)+1; });

  let html = headerHtml('管理员看板', '团队AI学习进度总览', true);
  html += `<div class="card slide-up">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-value" style="color:var(--blue);">${total}</div><div class="stat-label">参训人数</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--green);">${completed}</div><div class="stat-label">已完成测评</div></div>
      <div class="stat-card"><div class="stat-value">${avgScore}</div><div class="stat-label">平均成绩</div></div>
      <div class="stat-card"><div class="stat-value">${Math.round(completed/total*100)||0}%</div><div class="stat-label">完成率</div></div>
    </div>
    <div class="progress-bar mt-2"><div class="progress-fill ${completed/total>=0.8?'high':completed/total>=0.4?'mid':'low'}" style="width:${Math.round(completed/total*100)}%"></div></div>
  </div>`;

  html += `<div class="card mt-3 slide-up"><p style="font-weight:600;font-size:14px;margin-bottom:12px;">岗位分布</p>`;
  for (const [rid, cnt] of Object.entries(roleBreakdown)) {
    const r = ROLES[rid];
    html += `<div class="emp-row"><div class="emp-avatar">${r?r.icon:'?'}</div>
      <div class="emp-info"><div class="emp-name">${r?r.name:rid}</div><div class="emp-meta">${cnt}人</div></div>
      <div class="emp-score">${Math.round(cnt/total*100)}%</div></div>`;
  }
  html += `</div>`;

  html += `<div class="card mt-3 slide-up"><p style="font-weight:600;font-size:14px;margin-bottom:12px;">员工详细记录</p>`;
  if (all.length === 0) {
    html += `<p style="color:var(--text2);text-align:center;padding:20px;">暂无员工数据</p>`;
  } else {
    all.forEach((e, i) => {
      const r = ROLES[e.role];
      const scoreCls = e.finalScore>=80?'var(--green)':e.finalScore>=60?'var(--amber)':'var(--red)';
      html += `<div class="emp-row">
        <div class="emp-avatar">${e.name[0]}</div>
        <div class="emp-info"><div class="emp-name">${e.name}</div><div class="emp-meta">${r?r.icon+' '+r.name:''} · ${e.date} · ${e.doneCourses||0}/${COURSES[e.role]?.length||0}课</div></div>
        <div class="emp-score" style="color:${scoreCls}">${e.finalScore!=null?e.finalScore+'分':'学习中'}</div>
        <button class="btn btn-sm btn-outline" onclick="S.loadEmployee(${i});S.goDashboard();">查看</button>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

// ==================== ACTIONS ====================
S.selectRole = function(id) { S.role = id; render(); };
S.startQuiz = function() { S.quizIdx=0; S.quizAnswers=[]; S.quizScores=null; S.courseProgress={}; S.finalAnswers=[]; S.finalSubjAnswers={}; S.finalScore=null; S.finalSubmitted=false; S.finalShowHint={}; S.currentEmployee=null; S.view='quiz'; render(); };
S.answerQuiz = function(i) { S.quizAnswers[S.quizIdx]=i; render(); };
S.prevQuestion = function() { if(S.quizIdx>0) S.quizIdx--; render(); };
S.nextQuestion = function() {
  const questions = ASSESSMENTS[S.role];
  if (S.quizIdx < questions.length-1) { S.quizIdx++; render(); }
  else { S.calcResults(); }
};
S.calcResults = function() {
  const questions = ASSESSMENTS[S.role];
  const scores = Array(ROLES[S.role].skills.length).fill(0);
  questions.forEach((q, i) => { scores[q.dim] += q.scores[S.quizAnswers[i]]; });
  const dimCount = {};
  questions.forEach(q => { dimCount[q.dim] = (dimCount[q.dim]||0)+1; });
  Object.keys(dimCount).forEach(k => { scores[k] = Math.round(scores[k] / dimCount[k]); });
  S.quizScores = scores;
  S.view = 'results';
  render();
};
S.openCourse = function(idx) { S.courseIdx = idx; S.courseTaskIdx = 0; S.pptCurrentSlide = 0; S.voicePlaying = false; S.view = 'course'; render(); };
S.goDashboard = function() { stopVoice(); S.view = 'dashboard'; S.courseIdx = null; S.courseTaskIdx = 0; render(); };
S.goLearningMap = function() { stopVoice(); S.view = 'map'; render(); };
S.goSchedule = function() { stopVoice(); S.view = 'schedule'; render(); };
S.openTask = function() {
  const c = COURSES[S.role][S.courseIdx];
  const prog = S.courseProgress[c.id];
  S.courseTaskIdx = prog?.tasksDone || 0;
  if (S.courseTaskIdx >= c.tasks.length) S.courseTaskIdx = c.tasks.length - 1;
  S.view = 'task'; render();
};
S.submitTask = function() {
  const c = COURSES[S.role][S.courseIdx];
  const ans = document.getElementById('taskAnswer')?.value || '';
  if (!ans.trim()) { alert('请先完成任务描述'); return; }
  if (!S.courseProgress[c.id]) S.courseProgress[c.id] = {tasksDone:0};
  const prog = S.courseProgress[c.id];
  prog['taskAns'+S.courseTaskIdx] = ans;
  const feedbacks = ['任务完成度较高，操作流程清晰。建议补充边界情况处理。','AI工具使用得当，产出质量良好。可以尝试更多工具组合。','任务执行规范，思路清晰。继续加油！'];
  prog['taskFeedback'+S.courseTaskIdx] = feedbacks[Math.floor(Math.random()*feedbacks.length)];
  if (S.courseTaskIdx >= prog.tasksDone) prog.tasksDone = S.courseTaskIdx + 1;
  render();
};
S.prevTask = function() { if(S.courseTaskIdx>0) S.courseTaskIdx--; render(); };
S.nextTask = function() { S.courseTaskIdx++; render(); };
S.finishCourse = function() {
  const c = COURSES[S.role][S.courseIdx];
  if (!S.courseProgress[c.id]) S.courseProgress[c.id] = {tasksDone:0};
  S.courseProgress[c.id].done = true;
  S.goDashboard();
};
S.startFinalQuiz = function() { S.finalAnswers = []; S.finalSubjAnswers = {}; S.finalShowHint = {}; S.finalSubmitted = false; S.view = 'final'; render(); };
S.answerFinal = function(i, j) { S.finalAnswers[i] = j; render(); };
S.answerSubjFinal = function(i, val) { S.finalSubjAnswers[i] = val; };
S.toggleFinalHint = function(i) { S.finalShowHint[i] = !S.finalShowHint[i]; render(); };
S.toggleTaskHint = function(courseId, ti) { const k = courseId+'_'+ti; S.taskShowHint[k] = !S.taskShowHint[k]; render(); };
S.toggleTaskAnswer = function(courseId, ti) { const k = courseId+'_'+ti; S.taskShowAnswer[k] = !S.taskShowAnswer[k]; render(); };
S.submitFinal = function() {
  const questions = FINAL_QUIZZES[S.role];
  let score = 0;
  let maxScore = 0;
  questions.forEach((q,i) => {
    if (q.type === 'choice') { maxScore += 20; if (S.finalAnswers[i] === q.ans) score += 20; }
    else { maxScore += 20; if (S.finalSubjAnswers[i] && S.finalSubjAnswers[i].trim().length > 50) score += 16; else if (S.finalSubjAnswers[i] && S.finalSubjAnswers[i].trim()) score += 8; }
  });
  S.finalScore = Math.round(score / maxScore * 100);
  S.finalSubmitted = true;
  render();
};
S.saveAndFinish = function() {
  const name = prompt('请输入你的姓名（用于管理看板）：', S.currentEmployee?.name || '');
  if (!name) return;
  const emp = {
    name, role: S.role,
    date: new Date().toLocaleDateString('zh-CN'),
    quizScores: S.quizScores,
    courseProgress: S.courseProgress,
    finalScore: S.finalScore,
    doneCourses: Object.values(S.courseProgress).filter(p=>p.done).length
  };
  if (S.currentEmployee) {
    const idx = S.employees.findIndex(e => e===S.currentEmployee);
    if (idx>=0) S.employees[idx] = emp;
  } else {
    S.employees.push(emp);
  }
  S.currentEmployee = emp;
  saveEmployees();
  alert('数据已保存！');
};
S.reset = function() { stopVoice(); S.role=null; S.view='role'; S.quizIdx=0; S.quizAnswers=[]; S.quizScores=null; S.courseIdx=null; S.courseTaskIdx=0; S.courseProgress={}; S.finalAnswers=[]; S.finalSubjAnswers={}; S.finalScore=null; S.finalSubmitted=false; S.finalShowHint={}; S.currentEmployee=null; render(); };
S.goAdmin = function() { S.view='admin'; render(); };
S.logout = function() {
  stopVoice();
  localStorage.removeItem('ai_training_session');
  localStorage.removeItem('ai_training_emp_role');
  window.location.replace('index.html');
};
S.loadEmployee = function(idx) {
  const e = S.employees[idx];
  S.currentEmployee = e;
  S.role = e.role;
  S.quizScores = e.quizScores;
  S.courseProgress = e.courseProgress;
  S.finalScore = e.finalScore;
  S.finalSubmitted = e.finalScore != null;
};
S.goBack = function() {
  stopVoice();
  if (S.view === 'quiz') { S.view='role'; }
  else if (S.view === 'results') { S.view='role'; }
  else if (S.view === 'final') { S.goDashboard(); return; }
  else if (S.view === 'map') { S.view='results'; }
  else if (S.view === 'schedule') { S.view='map'; }
  else { S.goDashboard(); return; }
  render();
};

// ==================== PPT & VOICE SYSTEM ====================
let _voiceSynth = window.speechSynthesis;
let _voiceUtterance = null;
let _pptInterval = null;

function initPPT() {
  S.pptCurrentSlide = 0;
  S.voicePlaying = false;
  stopVoice();
  updatePPTUI();
  // Auto-start voice for slide 0
  setTimeout(function() { S.toggleVoice(); }, 500);
}

function stopVoice() {
  if (_voiceUtterance) { _voiceUtterance.onend = null; }
  _voiceSynth.cancel();
  if (_pptInterval) clearInterval(_pptInterval);
  S.voicePlaying = false;
  S.voicePaused = false;
}

S.toggleVoice = function() {
  if (S.voicePlaying && !S.voicePaused) { // pause
    _voiceSynth.pause();
    S.voicePaused = true;
    updateVoiceButton();
    return;
  }
  if (S.voicePaused) { // resume
    _voiceSynth.resume();
    S.voicePaused = false;
    updateVoiceButton();
    return;
  }
  // Start playing from current slide
  playCurrentSlide();
};

S.prevPPTSlide = function() {
  if (S.pptCurrentSlide > 0) {
    stopVoice();
    S.pptCurrentSlide--;
    updatePPTUI();
    if (S.voicePlaying) setTimeout(function() { playCurrentSlide(); }, 200);
  }
};

S.nextPPTSlide = function() {
  const slides = document.querySelectorAll('.ppt-slide');
  if (S.pptCurrentSlide < slides.length - 1) {
    stopVoice();
    S.pptCurrentSlide++;
    updatePPTUI();
    if (S.voicePlaying) setTimeout(function() { playCurrentSlide(); }, 200);
  }
};

S.setVoiceSpeed = function(rate) {
  S.voiceRate = parseFloat(rate);
};

function playCurrentSlide() {
  S.voicePlaying = true;
  S.voicePaused = false;
  updateVoiceButton();
  const slides = getPPTSlides(COURSES[S.role][S.courseIdx].id, '', '');
  if (!slides[S.pptCurrentSlide]) return;
  const notes = slides[S.pptCurrentSlide].notes || '';
  _voiceUtterance = new SpeechSynthesisUtterance(notes);
  _voiceUtterance.lang = 'zh-CN';
  _voiceUtterance.rate = S.voiceRate;
  _voiceUtterance.onend = function() {
    // Auto advance to next slide
    const allSlides = document.querySelectorAll('.ppt-slide');
    if (S.pptCurrentSlide < allSlides.length - 1) {
      S.pptCurrentSlide++;
      updatePPTUI();
      playCurrentSlide();
    } else {
      S.voicePlaying = false;
      updateVoiceButton();
    }
  };
  updateSubtitle(notes);
  _voiceSynth.speak(_voiceUtterance);
}

function updatePPTUI() {
  const slides = document.querySelectorAll('.ppt-slide');
  slides.forEach(function(s, i) { s.classList.toggle('active', i === S.pptCurrentSlide); });
  const counter = document.getElementById('slideCounter');
  if (counter) counter.textContent = (S.pptCurrentSlide+1) + '/' + slides.length;
  const prog = document.getElementById('voiceProgress');
  if (prog && slides.length > 1) prog.style.width = Math.round(S.pptCurrentSlide/(slides.length-1)*100) + '%';
}

function updateSubtitle(text) {
  const bar = document.getElementById('subtitleBar');
  if (bar) bar.textContent = text;
  if (bar) bar.classList.remove('paused');
}

function updateVoiceButton() {
  const btn = document.getElementById('voicePlayBtn');
  if (!btn) return;
  if (S.voicePlaying && !S.voicePaused) { btn.textContent = '⏸'; }
  else { btn.textContent = '▶'; }
  const bar = document.getElementById('subtitleBar');
  if (bar) bar.classList.toggle('paused', S.voicePaused);
}

document.addEventListener('keydown', function(e) {
  if (S.view !== 'course') return;
  if (e.key === 'ArrowRight') { S.nextPPTSlide(); }
  else if (e.key === 'ArrowLeft') { S.prevPPTSlide(); }
  else if (e.key === ' ') { e.preventDefault(); S.toggleVoice(); }
});

// ==================== INIT ====================
function bindEvents() {}
// Auto-select role from login
(function() {
  var empRole = localStorage.getItem('ai_training_emp_role');
  var session = JSON.parse(localStorage.getItem('ai_training_session') || '{}');
  if (session.role === 'admin') {
    S.view = 'role';
  } else if (empRole && ROLES[empRole]) {
    S.role = empRole;
    S.view = 'role';
  }
  // clean up emp_role after use (keep for this session, clear on logout)
})();
render();
</script>
