// P1.3: Local heuristic-based task answer grading, no external API needed.
// Scores each answer on 4 dimensions and produces targeted feedback.

function extractKeywords(text) {
  // Extract meaningful Chinese+English terms (2+ chars)
  const terms = new Set();
  const re = /[\u4e00-\u9fa5]{2,}|[a-zA-Z]{2,}|[A-Z]{2,}(?:\s+[A-Z]{2,})?/g;
  let m;
  while ((m = re.exec(text || '')) !== null) {
    const term = m[0].toLowerCase().trim();
    if (term && !/^(的|了|在|是|和|或|与|及|等|这|那|也|都|就|还|要|能|会|可以|需要|必须|应该|进行|使用|通过|根据|按照|针对|对于|关于)$/i.test(term)) {
      terms.add(term);
    }
  }
  return [...terms];
}

function gradeAnswer(userAnswer, taskDesc, refAnswer) {
  const ans = (userAnswer || '').trim();
  const len = ans.length;

  // === Completeness (0-100): length + point count ===
  let completeness = 0;
  if (len < 20) { completeness = 5; }
  else if (len < 60) { completeness = 20; }
  else if (len < 120) { completeness = 40; }
  else if (len < 200) { completeness = 55; }
  else if (len < 350) { completeness = 70; }
  else if (len < 500) { completeness = 85; }
  else { completeness = 95; }
  // Bonus for distinct points (line breaks / numbered items)
  const numLines = ans.split(/\n|。/).filter(l => l.trim().length > 8).length;
  completeness = Math.min(100, completeness + numLines * 3);

  // === Specificity (0-100): concrete details ===
  let specificity = 0;
  const hasCode = /[{}()[\];=]|<[a-z]+>|function|class|const|let|var|import|from|SELECT|WHERE|JOIN|API|JSON|XML|REST|HTTP|POST|GET|PUT|DELETE/i.test(ans);
  const hasNumbers = (ans.match(/\d+/g) || []).length >= 2;
  const hasToolNames = /copilot|cursor|chatgpt|claude|gemini|copilot|通义|文心|kimi|豆包|deepseek|midjourney|dall/i.test(ans);
  const hasMetrics = /[\d.]+%|提升|降低|减少|增加|增长|节省|缩短|提高|优化|改善了?[\d.]+/.test(ans);
  const hasExamples = /例如|比如|举例|实例|案例|场景|示例/.test(ans);
  const hasSteps = /第一步|第二步|第三步|步骤\d|首先.*其次.*最后|1\..*2\..*3\./.test(ans);

  specificity += hasCode ? 25 : 0;
  specificity += hasNumbers ? 20 : 0;
  specificity += hasToolNames ? 20 : 0;
  specificity += hasMetrics ? 15 : 0;
  specificity += hasExamples ? 10 : 0;
  specificity += hasSteps ? 10 : 0;
  specificity = Math.min(100, specificity);

  // === Structure (0-100): organization ===
  let structure = 0;
  const hasHeaders = /[【\[(（]|##|：\s*$|^\d+[.、)]/m.test(ans);
  const hasBullets = /[-*•·]|\d+[.、)]/.test(ans);
  const hasParagraphs = (ans.split(/\n\n+/).length >= 2);
  const usesFullSentences = ans.includes('。') || ans.includes('. ');
  const hasSections = ans.includes('\n') && (hasHeaders || hasBullets);

  structure += hasHeaders ? 30 : 0;
  structure += hasBullets ? 25 : 0;
  structure += hasParagraphs ? 20 : 0;
  structure += usesFullSentences ? 15 : 0;
  structure += hasSections ? 10 : 0;
  structure = Math.min(100, structure);

  // === Relevance (0-100): keyword match against task+reference ===
  let relevance = 0;
  const taskKeywords = extractKeywords((taskDesc || '') + ' ' + (refAnswer || ''));
  const ansLower = ans.toLowerCase();
  const ansKeywords = extractKeywords(ans);
  const ansKWSet = new Set(ansKeywords);

  if (taskKeywords.length > 0) {
    let hits = 0;
    for (const kw of taskKeywords) {
      if (ansLower.includes(kw.toLowerCase())) hits++;
    }
    relevance = Math.min(100, Math.round((hits / Math.min(taskKeywords.length, 15)) * 100));
  } else {
    relevance = 60; // default when no reference
  }

  // === Overall score: weighted average ===
  const overall = Math.round(
    completeness * 0.25 + specificity * 0.30 + structure * 0.15 + relevance * 0.30
  );

  // === Generate feedback ===
  const strengths = [];
  const improvements = [];
  const missingTopics = [];

  if (completeness >= 70) strengths.push('回答内容充实，覆盖了较多细节');
  else if (completeness >= 40) improvements.push('可以展开更多细节，当前回答内容偏简短');
  else improvements.push('回答过于简短，建议详细描述操作过程和思考');

  if (specificity >= 60) strengths.push('回答包含具体工具名称、数据或实例，具有实操性');
  else if (specificity >= 30) improvements.push('建议加入具体工具名称、数据指标或实际案例');
  else improvements.push('请补充具体的AI工具名称、操作步骤或量化结果');

  if (structure >= 60) strengths.push('回答结构清晰，层次分明');
  else improvements.push('建议使用分点、分段或编号来组织答案结构');

  if (relevance >= 70) strengths.push('回答紧扣任务要求，相关度高');
  else if (relevance >= 40) improvements.push('部分回答与任务要求关联不紧密');
  else improvements.push('回答偏离任务主题，建议重新聚焦任务要求');

  // Identify missing topics from reference answer
  if (refAnswer) {
    const refKWs = extractKeywords(refAnswer);
    const ansFlat = ansLower + ' ' + ansKeywords.join(' ');
    const missed = refKWs.filter(kw => {
      return kw.length >= 3 && !ansFlat.includes(kw.toLowerCase());
    }).slice(0, 5);
    if (missed.length > 0) {
      missingTopics.push(...missed);
    }
  }

  // Generate score-based level
  let level = '';
  if (overall >= 85) level = '优秀';
  else if (overall >= 70) level = '良好';
  else if (overall >= 50) level = '及格';
  else level = '需改进';

  return {
    overall,
    level,
    dimensions: {
      completeness: Math.round(completeness),
      specificity: Math.round(specificity),
      structure: Math.round(structure),
      relevance: Math.round(relevance)
    },
    strengths: strengths.slice(0, 3),
    improvements: improvements.slice(0, 3),
    missingTopics: missingTopics.slice(0, 5),
    summary: `综合评分${overall}分（${level}）`
  };
}

// ==================== IN-COURSE QUIZ ENGINE (P2.1) ====================
function getCourseQuizzes(courseId) {
  const content = getCourseContent(courseId);
  return (content && content.quizzes) ? content.quizzes : [];
}

function getQuizResult(courseId, quizIdx) {
  var prog = S.courseProgress[courseId] || {};
  var results = prog.quizResults || {};
  return results[quizIdx] || null;
}

function saveQuizResult(courseId, quizIdx, result) {
  var prog = S.courseProgress[courseId] || {};
  if (!prog.quizResults) prog.quizResults = {};
  prog.quizResults[quizIdx] = result;
  S.courseProgress[courseId] = prog;
  saveProgress();
}

function getTotalQuizStats(courseId) {
  var prog = S.courseProgress[courseId] || {};
  var results = prog.quizResults || {};
  var total = Object.keys(results).length;
  var correct = 0;
  for (var k in results) { if (results[k].correct) correct++; }
  return { total: total, correct: correct, rate: total > 0 ? Math.round(correct/total*100) : 0 };
}

function renderQuizPopup(courseId, quizIdx) {
  var quizzes = getCourseQuizzes(courseId);
  if (!quizzes || quizIdx >= quizzes.length) return '';
  var quiz = quizzes[quizIdx];
  var prevResult = getQuizResult(courseId, quizIdx);
  var answered = !!prevResult;
  var isCorrect = answered && prevResult.correct;
  var labels = ['A', 'B', 'C', 'D'];

  // P2.2: Score stats
  var stats = getTotalQuizStats(courseId);
  var scorePct = stats.rate;

  var html = '<div class="quiz-popup-overlay" id="quizPopup'+quizIdx+'">';
  html += '<div class="quiz-popup-card">';
  // P2.2: Progress bar
  html += '<div class="qp-progress-bar"><div class="qp-progress-fill" style="width:'+((quizIdx+1)/quizzes.length*100)+'%"></div></div>';
  html += '<span class="qp-badge">课中测验 '+(quizIdx+1)+'/'+quizzes.length+'</span>';
  html += '<div class="qp-question">'+escapeHtml(quiz.q)+'</div>';

  quiz.opts.forEach(function(opt, oi) {
    var cls = 'qp-option';
    if (answered) {
      if (oi === quiz.ans) cls += ' reveal-correct';
      if (oi === prevResult.answer && !isCorrect) cls += ' selected-wrong';
      if (oi === prevResult.answer && isCorrect) cls += ' selected-correct';
    }
    html += '<button class="'+cls+'" '+(answered?'disabled':'')+' data-action="answerQuizQ" data-cid="'+courseId+'" data-qidx="'+quizIdx+'" data-ans="'+oi+'">'+labels[oi]+'. '+escapeHtml(opt)+'</button>';
  });

  if (answered) {
    html += '<div class="qp-feedback '+(isCorrect?'correct':'wrong')+'">';
    html += isCorrect ? '✅ 回答正确！+10分' : '❌ 回答错误';
    html += '</div>';
    // P2.2: Score stats row
    html += '<div class="qp-score-row">';
    html += '<div class="qp-score-badge good">✅ '+stats.correct+' 正确</div>';
    html += '<div class="qp-score-badge bad">❌ '+(stats.total-stats.correct)+' 错误</div>';
    html += '<div class="qp-score-badge good">📊 '+stats.rate+'% 正确率</div>';
    html += '</div>';
    html += '<div class="qp-explain">'+escapeHtml(quiz.explain)+'</div>';
    html += '<button class="qp-btn" data-action="closeQuiz">继续学习 →</button>';
  } else {
    html += '<div class="qp-explain" style="text-align:center;margin-top:12px;color:var(--text3);">请选择一个答案</div>';
  }

  html += '</div></div>';
  return html;
}

S.submitQuizAnswer = function(courseId, quizIdx, answer) {
  var quizzes = getCourseQuizzes(courseId);
  if (!quizzes || quizIdx >= quizzes.length) return;
  var quiz = quizzes[quizIdx];
  var correct = (answer === quiz.ans);

  saveQuizResult(courseId, quizIdx, { answer: answer, correct: correct, time: Date.now() });

  // Re-render the quiz popup with result
  var oldPopup = document.getElementById('quizPopup'+quizIdx);
  if (oldPopup) {
    oldPopup.outerHTML = renderQuizPopup(courseId, quizIdx);
    // Re-bind events since we replaced HTML
    bindQuizEvents();
  }
};

S.closeQuizPopup = function() {
  var popups = document.querySelectorAll('.quiz-popup-overlay');
  popups.forEach(function(p) { p.remove(); });
  S.quizActive = -1;
};

function bindQuizEvents() {
  // Re-bind quiz answer and close buttons after HTML replacement
  document.querySelectorAll('[data-action="answerQuizQ"]').forEach(function(btn) {
    btn.onclick = function() {
      var cid = btn.getAttribute('data-cid');
      var qidx = parseInt(btn.getAttribute('data-qidx'));
      var ans = parseInt(btn.getAttribute('data-ans'));
      S.submitQuizAnswer(cid, qidx, ans);
    };
  });
  document.querySelectorAll('[data-action="closeQuiz"]').forEach(function(btn) {
    btn.onclick = function() { S.closeQuizPopup(); };
  });
}

function checkQuizTrigger(courseId) {
  var quizzes = getCourseQuizzes(courseId);
  if (!quizzes || quizzes.length === 0) return;
  var currentSlide = S.pptCurrentSlide;

  // Find the first unanswered quiz whose triggerSlide <= currentSlide
  for (var i = 0; i < quizzes.length; i++) {
    if (quizzes[i].triggerSlide === currentSlide) {
      var key = S.courseIdx+'_'+courseId+'_q'+i;
      if (!S.quizShown[key]) {
        S.quizShown[key] = true;
        S.quizActive = i;
        showQuizOnSlide(courseId, i);
        return;
      }
    }
  }
}

function showQuizOnSlide(courseId, quizIdx) {
  // Insert quiz popup into the PPT container
  var container = document.getElementById('pptContainer');
  if (!container) return;
  var existing = container.querySelector('.quiz-popup-overlay');
  if (existing) existing.remove();
  var quizHTML = renderQuizPopup(courseId, quizIdx);
  container.insertAdjacentHTML('beforeend', quizHTML);
  bindQuizEvents();
}

// ---- QUIZ (v41: 同维连答自适应 UI) ----
function renderQuiz() {
  if (!S._quizPlan || !S._quizPlan.length) {
    // fallback to legacy
    const role = ROLES[S.role];
    return headerHtml('AI能力测评', role ? role.icon + ' ' + role.name : '', true) +
           '<div class="card text-center"><p style="padding:40px;color:var(--text2)">正在初始化测评...</p></div>';
  }
  const step = S.quizIdx;
  const t = S._quizPlan[step];
  if (!t) {
    finishAdaptiveQuiz();
    return '';
  }
  ensureQuizTiming(step); // v34: 记录本题展示起始时间（防猜题计时，每题独立）
  const dimKey = t.d;
  const dimInfo = AI_DIMS[dimKey];
  const q = t.q;
  if (!q) {
    finishAdaptiveQuiz();
    return '';
  }
  // Inject industry context for non-PM roles to make questions industry-specific
  const indCtx = getIndustryContext(S.role, S.industry);
  const scenarioHtml = q.scenario
    ? `<div style="font-size:13px;color:var(--accent);margin-bottom:12px;padding:10px 14px;background:var(--bg2);border-radius:8px;border-left:3px solid var(--accent);">${indCtx}${q.scenario.replace('场景：','')}</div>`
    : '';
  const levelNames = ['初阶','中阶','高阶'];
  const levelName = levelNames[t.lv] || '中阶';
  const totalDims = S._quizDims.length;
  const dimPos = S._quizDims.indexOf(dimKey); // 0-based 维度序
  // 本维内第几题：回看 plan 中同维第 1 题位置
  let dimStart = step;
  while (dimStart > 0 && S._quizPlan[dimStart-1].d === dimKey) dimStart--;
  const qNoInDim = step - dimStart + 1;
  const stepAnswered = !!(S._quizSelectedStep && S._quizSelectedStep[step] !== undefined);

  // Progress dots: one dot per dimension — 未测灰 / 当前蓝 / 已定级绿
  let dots = '';
  for (let i=0; i<totalDims; i++) {
    const d = S._quizDims[i];
    let cls = S._quizDone[d] !== undefined ? 'done' : (d === dimKey ? 'current' : '');
    dots += `<div class="quiz-dot ${cls}" title="${(AI_DIMS[d] && AI_DIMS[d].name) || d}"></div>`;
  }

  let html = headerHtml(dimInfo.icon + ' ' + dimInfo.name + ' · ' + levelName, `能力维度 ${dimPos+1}/${totalDims}`, true);
  html += `<div class="card slide-up">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
      <span class="tag tag-blue">${dimInfo.short}</span>
      <span style="font-size:12px;color:var(--text2);">${levelName} · 难度 ${['低','中','高'][t.lv] || '中'} · 本维第 ${qNoInDim}/2 题</span>
      <span style="margin-left:auto;font-size:12px;font-weight:600;color:${Object.keys(S._quizDone).length === totalDims ? 'var(--green)' : 'var(--text2)'};">已定级 ${Object.keys(S._quizDone).length}/${totalDims} 维</span>
    </div>
    <div class="quiz-progress">${dots}</div>
    ${scenarioHtml}
    <div class="quiz-question">${q.q}</div>
    <div style="display:flex;flex-direction:column;">`;
  const sel = stepAnswered ? S._quizSelectedStep[step] : undefined;
  q.opts.forEach((o, i) => {
    let cls = 'quiz-option';
    if (sel !== undefined && sel === i) cls += ' selected';
    html += `<button class="${cls}" data-action="answerQuiz" data-idx="${i}" onclick="if(typeof S!=='undefined'){S.answerQuiz(${i})}">${String.fromCharCode(65+i)}. ${o}</button>`;
  });
  html += `</div>`;

  // 作答反馈条：本题表现三态 + 下一题难度预告（让考生感知自适应）
  if (stepAnswered) {
    const evLog = (S._quizLog && S._quizLog[dimKey]) || [];
    const evNow = evLog.filter(e => e.step === step);
    const sc = evNow.length ? evNow[0].score : 0;
    const verdict = sc >= 3 ? {t:'掌握 ✓', c:'var(--green)'} : sc === 2 ? {t:'边缘 △', c:'var(--amber)'} : {t:'未掌握 ✗', c:'var(--red)'};
    let nextHint = '';
    if (step + 1 < S._quizPlan.length && S._quizPlan[step+1].d === dimKey) {
      nextHint = S._quizPlan[step+1].lv > t.lv
        ? '<span style="color:var(--green);">答得不错，下一题将升测高阶 ⬆</span>'
        : '<span style="color:var(--amber);">本难度的关键要素尚未掌握，下一题将降测初阶 ⬇</span>';
    } else if (S._quizAllDone) {
      nextHint = '<span style="color:var(--green);">该维已定级，可查看结果</span>';
    }
    html += `<div style="font-size:13px;margin:12px 2px 0;color:var(--text2);display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
      <span>本题表现：<b style="color:${verdict.c};">${verdict.t}</b></span>${nextHint}</div>`;
  }

  const canBackToFirst = step > 0 && S._quizPlan[step-1].d === dimKey; // 本维第 2 题 → 可回退重答第 1 题
  const isLastPlan = step >= S._quizPlan.length - 1;
  const doneCount = Object.keys(S._quizDone).length;
  html += `<div class="flex-between mt-4">
      <button class="btn btn-outline" data-action="prevQuestion" ${canBackToFirst ? '' : 'disabled'} onclick="if(typeof S!=='undefined'){S.prevQuestion()}">↺ 重答本维第一题</button>
      <span style="font-size:13px;color:${stepAnswered ? 'var(--text2)' : 'var(--red)'};">${doneCount}/${totalDims} 已完成${stepAnswered ? '' : '（请先选择答案）'}</span>
      ${stepAnswered && isLastPlan && S._quizAllDone
        ? '<button class="btn btn-primary" data-action="finishQuiz" onclick="if(typeof S!==\'undefined\'){S.finishQuiz()}">查看结果</button>'
        : '<button class="btn btn-primary" data-action="nextQuestion"' + (stepAnswered ? '' : ' disabled') + ' onclick="if(typeof S!==\'undefined\'){S.nextQuestion()}">下一题 →</button>'}
    </div>
  </div>`;
  return html;
}

function escHtml(s) {

}

function buildReportRadarSVG(result) {
  const dimKeys = Object.keys(AI_DIMS);
  const N = dimKeys.length;
  const W = 360, H = 300, cx = W/2, cy = H/2, R = 100;
  const vals = dimKeys.map(k => {
    const s = result.dimScores[k] !== undefined ? result.dimScores[k] : 0;
    return s / 4;
  });
  const pt = (i, r) => {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;">`;
  // Grid rings (4 levels)
  for (let ring = 1; ring <= 4; ring++) {
    const r = R * ring / 4;
    const pts = [];
    for (let i = 0; i < N; i++) { const [x, y] = pt(i, r); pts.push(x.toFixed(1) + ',' + y.toFixed(1)); }
    svg += `<polygon points="${pts.join(' ')}" fill="none" stroke="${ring === 4 ? '#c7c7cc' : '#e5e5ea'}" stroke-width="${ring === 4 ? 1.5 : 1}"/>`;
  }
  // Axes
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(i, R);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e5e5ea" stroke-width="1"/>`;
  }
  // Data polygon
  const dataPts = [];
  for (let i = 0; i < N; i++) { const [x, y] = pt(i, R * vals[i]); dataPts.push(x.toFixed(1) + ',' + y.toFixed(1)); }
  svg += `<polygon points="${dataPts.join(' ')}" fill="rgba(0,113,227,0.18)" stroke="#0071e3" stroke-width="2.5"/>`;
  // Points + labels
  for (let i = 0; i < N; i++) {
    const v = vals[i];
    const [x, y] = pt(i, R * v);
    const color = v >= 0.7 ? '#30b158' : v >= 0.4 ? '#ff9500' : '#ff3b30';
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>`;
    const [lx, ly] = pt(i, R + 28);
    const pct = Math.round(v * 100);
    const anchor = Math.abs(Math.cos((i / N) * Math.PI * 2 - Math.PI / 2)) < 0.3 ? 'middle' : (Math.cos((i / N) * Math.PI * 2 - Math.PI / 2) > 0 ? 'start' : 'end');
    const sinV = Math.sin((i / N) * Math.PI * 2 - Math.PI / 2);
    const tdy = sinV > 0.6 ? 16 : (sinV < -0.6 ? -8 : 0);
    svg += `<text x="${lx.toFixed(1)}" y="${(ly + tdy).toFixed(1)}" text-anchor="${anchor}" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">${escHtml(AI_DIMS[dimKeys[i]].short)}</text>`;
    svg += `<text x="${lx.toFixed(1)}" y="${(ly + tdy + 13).toFixed(1)}" text-anchor="${anchor}" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10" fill="${color}">${pct}%</text>`;
  }
  svg += `</svg>`;
  return svg;
}

function exportReport() {
  const result = S._quizResult;
  const role = ROLES[S.role];
  const industry = INDUSTRIES[S.industry];
  if (!result || !result.dimScores) { alert('请先完成测评，再导出报告'); return; }

  const overall = result.overall || 0;
  const dimKeys = Object.keys(AI_DIMS);
  const dimRows = dimKeys.map(k => {
    const score = result.dimScores[k] !== undefined ? result.dimScores[k] : 0;
    const pct = Math.round(score / 4 * 100);
    const w = (result.weights && result.weights[k]) || 12.5;
    const state = pct >= 70 ? {t:'掌握良好', c:'green'} : pct >= 40 ? {t:'有待提升', c:'amber'} : {t:'薄弱短板', c:'red'};
    return { icon: AI_DIMS[k].icon, name: AI_DIMS[k].name, score, pct, w, state };
  });
  const weakest = [...dimRows].sort((a, b) => a.pct - b.pct).slice(0, 3);

  // Recommended courses
  const courses = getRoleCourses();
  const ordered = courses.map((c, idx) => ({
    ...c, idx,
    priority: getCoursePriority(c),
    compScore: getCourseCompositeScore(c)
  })).sort((a, b) => b.priority - a.priority).slice(0, 8);
  const courseRows = ordered.map((c, i) => {
    const skillIdx = getPrimarySkillIdx(c);
    const skillName = role.skills[skillIdx] || '';

function fallbackCopyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert('报告摘要已复制，可直接粘贴分享 ✅'); }
  catch (e) { alert('复制失败，请手动截图分享 📷'); }
  document.body.removeChild(ta);
}

function initRadarChart() {
  const result = S._quizResult;
  // Build dimension data for the radar (use all 8 AI_DIMS)
  const dimKeys = Object.keys(AI_DIMS);
  if (!result || !result.dimScores) { return; }
  const vals = dimKeys.map(key => {
    const s = result.dimScores[key] !== undefined ? result.dimScores[key] : 0;
    return s / 4;
  });
  const dimNames = dimKeys.map(key => AI_DIMS[key].name);
  const dimShorts = dimKeys.map(key => AI_DIMS[key].short);
  const dimIcons = dimKeys.map(key => AI_DIMS[key].icon);
  const dimWeights = dimKeys.map(key => (result.weights && result.weights[key]) || 12.5);
  const N = dimKeys.length; // 8

  function drawRadar() {
    const canvas = document.getElementById('radarChart');
    if (!canvas) { setTimeout(drawRadar, 100); return; }
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2 + 10;
    const R = Math.min(W, H)/2 - 48;
    ctx.clearRect(0,0,W,H);

    // Draw grid rings
    for (let ring=1; ring<=4; ring++) {
      const r = R * ring/4;
      ctx.beginPath();
      for (let i=0; i<=N; i++) {
        const angle = (i/N)*Math.PI*2 - Math.PI/2;
        const x = cx + r*Math.cos(angle), y = cy + r*Math.sin(angle);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = ring===4 ? '#c7c7cc' : '#e5e5ea';
      ctx.lineWidth = ring===4 ? 1.5 : 1;
      ctx.stroke();
    }

    // Draw axes
    for (let i=0; i<N; i++) {
      const angle = (i/N)*Math.PI*2 - Math.PI/2;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R*Math.cos(angle), cy + R*Math.sin(angle));
      ctx.strokeStyle='#e5e5ea'; ctx.lineWidth=1; ctx.stroke();
    }

    // Draw data polygon
    ctx.beginPath();
    for (let i=0; i<N; i++) {
      const angle = (i/N)*Math.PI*2 - Math.PI/2;
      const v = vals[i];
      const x = cx + R*v*Math.cos(angle), y = cy + R*v*Math.sin(angle);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(0,113,227,0.18)'; ctx.fill();
    ctx.strokeStyle='#0071e3'; ctx.lineWidth=2.5; ctx.stroke();

    // Draw data points
    for (let i=0; i<N; i++) {
      const angle = (i/N)*Math.PI*2 - Math.PI/2;
      const v = vals[i];
      const x = cx + R*v*Math.cos(angle), y = cy + R*v*Math.sin(angle);
      ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
      ctx.fillStyle = v>=0.7?'#30b158':v>=0.4?'#ff9500':'#ff3b30';
      ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    }

    // Draw labels (use short names to avoid overflow)
    for (let i=0; i<N; i++) {
      const angle = (i/N)*Math.PI*2 - Math.PI/2;
      const labelR = R + 24;
      const x = cx + labelR*Math.cos(angle), y = cy + labelR*Math.sin(angle);
      const pct = Math.round(vals[i]*100);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 10px -apple-system,sans-serif';
      ctx.fillStyle = '#1d1d1f';
      ctx.fillText(dimShorts[i], x, y-6);
      ctx.font = '9px -apple-system,sans-serif';
      ctx.fillStyle = pct>=70?'#30b158':pct>=40?'#ff9500':'#ff3b30';
      ctx.fillText(pct+'%', x, y+7);
    }

    // Legend
    const legend = document.getElementById('radarLegend');
    if(legend) {
      legend.innerHTML = dimKeys.map((key,i) => {
        const pct = Math.round(vals[i]*100);
        const c = pct>=70?'#30b158':pct>=40?'#ff9500':'#ff3b30';
        return '<div class="radar-legend-item"><div class="radar-legend-dot" style="background:'+c+'"></div><span style="color:var(--text2)">'+dimIcons[i]+' '+AI_DIMS[key].name+' ('+pct+'%)</span></div>';
      }).join('');
    }
  }
  setTimeout(drawRadar, 80);
}

  // Compute total progress
  const total = courses.length;
  const done = courses.filter(c => S.courseProgress[c.id]?.done).length;
  const progress = Math.round(done/total*100);

  // Find current course (first non-done, prereqs-met)
  let currentIdx = -1;
  for (let i=0; i<ordered.length; i++) {
    if (!S.courseProgress[ordered[i].id]?.done && prereqsMet(ordered[i])) { currentIdx = i; break; }
  }
  // If no prereqs-met course, fall back to first non-done
  if (currentIdx === -1) {
    currentIdx = ordered.findIndex(c => !S.courseProgress[c.id]?.done);
  }

  let html = headerHtml('个人学习地图', role.icon + ' ' + role.name, true);

  // Map header card
  html += `<div class="card slide-up">
    <div class="map-header">
      <h2>📍 你的AI能力成长路线图</h2>
      <p style="font-size:13px;color:var(--text2);">共 ${total} 门课程 · 已完成 ${done} 门 · 整体进度 ${progress}%</p>
    </div>
    <div class="progress-bar"><div class="progress-fill ${progress>=80?'high':progress>=40?'mid':'low'}" style="width:${progress}%"></div></div>
    <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);"><div style="width:10px;height:10px;border-radius:50%;background:var(--green);"></div>已完成</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);"><div style="width:10px;height:10px;border-radius:50%;background:var(--blue);"></div>进行中</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);"><div style="width:10px;height:10px;border-radius:50%;background:var(--border);"></div>待开始</div>
    </div>
  </div>`;

  // Stage grouping: Phase 1 (基础夯实, 前1/3), Phase 2 (能力提升, 中1/3), Phase 3 (综合应用, 后1/3)
  const stageCount = Math.ceil(total/3);
  const stages = [
    { label: '阶段一：AI基础夯实', icon: '🌱', courses: ordered.slice(0, stageCount) },
    { label: '阶段二：能力深化提升', icon: '⚡', courses: ordered.slice(stageCount, stageCount*2) },
    { label: '阶段三：综合实战应用', icon: '🚀', courses: ordered.slice(stageCount*2) }
  ].filter(s => s.courses.length > 0);

  html += `<div class="card mt-3 slide-up">`;
  stages.forEach((stage, stageIdx) => {
    html += `<div class="map-stage">
      <div class="map-stage-title">${stage.icon} ${stage.label}</div>`;

    stage.courses.forEach((c, nodeIdx) => {
      const globalIdx = stageIdx * stageCount + nodeIdx;
      const isDone = S.courseProgress[c.id]?.done;
      const isLocked = !isDone && !prereqsMet(c);
      const isCurrent = !isDone && !isLocked && globalIdx === currentIdx;
      const skillIdx = getPrimarySkillIdx(c);
      const skillName = role.skills[skillIdx] || '';
      const skillPct = S.quizScores ? Math.round((S.quizScores[skillIdx]||0)/4*100) : 0;
      const urgency = skillPct < 40 ? '🔴 急需' : skillPct < 70 ? '🟡 建议' : '🟢 进阶';

      let nodeCls = 'map-node';
      let iconContent = c.type==='video'?'🎬':'📖';
      let badgeText = '', badgeCls = '';

      if (isDone) {
        nodeCls += ' done'; iconContent = '✓';
        badgeText = '已完成'; badgeCls = 'done-badge';
      } else if (isCurrent) {
        nodeCls += ' current';
        badgeText = '进行中'; badgeCls = 'current-badge';
      } else if (isLocked) {
        nodeCls += ' locked';
        badgeText = '待解锁'; badgeCls = 'locked-badge';
      } else {
        badgeText = '待学习'; badgeCls = 'pending-badge';
      }

      const clickHandler = !isLocked ? `data-action="openCourse" data-idx="${c.origIdx}" style="cursor:pointer"` : '';

      html += `<div class="${nodeCls}" ${clickHandler}>
        <div class="map-node-icon">${iconContent}</div>
        <div class="map-node-body">
          <div class="map-node-title">${c.title}</div>
          <div class="map-node-meta">${c.dur} · ${c.type==='video'?'视频课程':'图文课程'}</div>
          <span class="map-skill-tag">${skillName} ${urgency}</span>
        </div>
        <span class="map-node-badge ${badgeCls}">${badgeText}</span>
      </div>`;

      // Add connector line between nodes (not after last in stage)
      const isLastInStage = nodeIdx === stage.courses.length - 1;
      if (!isLastInStage) {
        html += `<div class="map-connector${isDone?' done-conn':''}"></div>`;
      }
    });

    // Connector between stages
    if (stageIdx < stages.length - 1) {
      html += `<div style="text-align:center;margin:10px 0;font-size:18px;color:var(--text3);">↓</div>`;
    }
    html += `</div>`;
  });

  // Final goal node
  const allDone = done === total;
  html += `<div class="map-connector${allDone?' done-conn':''}"></div>
    <div class="map-node${allDone?' done':''}" ${allDone?'data-action="startFinalQuiz" style="cursor:pointer"':''} style="border-style:dashed;background:${allDone?'var(--green-bg)':'var(--bg)'};">
      <div class="map-node-icon" style="background:${allDone?'var(--green)':'var(--border)'};color:${allDone?'#fff':'var(--text3)'};">🏆</div>
      <div class="map-node-body">
        <div class="map-node-title">AI能力成果测验</div>
        <div class="map-node-meta">完成所有课程后解锁 · 综合能力考核</div>
      </div>
      <span class="map-node-badge ${allDone?'done-badge':'locked-badge'}">${allDone?'可参加':'待解锁'}</span>
    </div>
  </div>`;

  html += `<div style="display:flex;gap:8px;margin-top:12px;">
    <button class="btn btn-outline" style="flex:1;" data-action="goSchedule">📅 查看学习计划</button>
    <button class="btn btn-primary" style="flex:1;" data-action="goDashboard">进入课程列表 →</button>
  </div>`;

  return html;
}

// ---- SCHEDULE ----
function renderSchedule() {
  const role = ROLES[S.role];
  const courses = getRoleCourses();
  const scores = S.quizScores;

  const ordered = courses.map((c, idx) => {
    const priority = getCoursePriority(c);
    const isDone = S.courseProgress[c.id]?.done;
    return {...c, origIdx: idx, priority, isDone};
  }).sort((a,b) => b.priority - a.priority).filter(c => !c.isDone);

  const total = courses.length;
  const done = courses.filter(c => S.courseProgress[c.id]?.done).length;

  let html = headerHtml('学习时间计划', role.icon + ' ' + role.name, true);

  // Summary card
  const totalMinutes = ordered.reduce((sum, c) => {
    const m = parseInt(c.dur) || 30;
    return sum + m + 10; // +10min for task practice
  }, 0);
  const weeks = Math.ceil(ordered.length / 2);

  html += `<div class="card slide-up">
    <div class="schedule-header">
      <p style="font-weight:700;font-size:15px;">📅 个性化学习时间计划</p>
      <span class="tag tag-blue">${weeks}周完成</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">
      <div class="stat-card"><div class="stat-value" style="color:var(--blue);">${ordered.length}</div><div class="stat-label">待完成课程</div></div>
      <div class="stat-card"><div class="stat-value">${Math.round(totalMinutes/60)}h</div><div class="stat-label">预计总时长</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--green);">${done}</div><div class="stat-label">已完成</div></div>
    </div>
    <div class="schedule-tip">💡 <strong>建议节奏：</strong>每周安排2-3次学习，每次60-90分钟。优先完成标记为"急需提升"的课程，利用碎片时间完成图文课程，保持学习连续性效果最佳。</div>
  </div>`;

  if (ordered.length === 0) {
    html += `<div class="card mt-3 slide-up text-center">
      <p style="font-size:16px;font-weight:700;margin-bottom:8px;">🎉 所有课程已完成！</p>
      <p style="color:var(--text2);font-size:13px;margin-bottom:16px;">你已完成全部学习计划，快去参加成果测验吧</p>
      <button class="btn btn-primary" data-action="startFinalQuiz">开始成果测验</button>
    </div>`;
    return html;
  }

  // Generate weekly plan
  const weekDays = ['周一','周三','周五'];
  html += `<div class="card mt-3 slide-up"><p style="font-weight:600;font-size:14px;margin-bottom:16px;">分周学习安排</p>`;

  let courseQueue = [...ordered];
  let weekNum = 1;

  while (courseQueue.length > 0 && weekNum <= 8) {
    const weekCourses = courseQueue.splice(0, 2);
    const isCurrentWeek = weekNum === 1 && done === 0 || (weekNum === Math.ceil(done/2)+1);

    html += `<div class="schedule-week">
      <div class="schedule-week-title">第${weekNum}周${isCurrentWeek?' (当前)':''}</div>`;

    weekCourses.forEach((c, ci) => {
      const compScore = getCourseCompositeScore(c);
      const skillPct = compScore > 0 ? Math.round(compScore/4*100) : (scores ? Math.round((scores[getPrimarySkillIdx(c)]||0)/4*100) : 50);
      const priorityCls = skillPct < 40 ? 'priority-high' : skillPct < 70 ? 'priority-mid' : 'priority-low';
      const day = weekDays[ci] || weekDays[0];
      const dur = parseInt(c.dur) || 30;
      const tagCls = c.type==='video' ? 'tag-blue' : 'tag-purple';

      const schedLocked = !prereqsMet(c);
      html += `<div class="schedule-item ${priorityCls}${schedLocked?' locked':''}" ${schedLocked?'':'data-action="openCourse" data-idx="'+c.origIdx+'" style="cursor:pointer;"'}>
        <div class="schedule-day">${day}</div>
        <div class="schedule-course">
          <div class="schedule-course-name">${schedLocked?'🔒 ':''}${c.title}</div>
          <div class="schedule-course-dur">${c.dur} + 约10分钟关卡练习 · <span class="tag ${tagCls}" style="font-size:10px;padding:1px 6px;">${c.type==='video'?'视频':'图文'}</span>${schedLocked?' · <span style="color:var(--text3);font-size:11px;">需完成前置课程</span>':''}</div>
        </div>
      </div>`;
    });

    // Add review/practice day if week has 2 courses
    if (weekCourses.length === 2) {
      html += `<div class="schedule-item" style="border-left-color:#9b59b6;opacity:.7;">
        <div class="schedule-day">周日</div>
        <div class="schedule-course">
          <div class="schedule-course-name">📝 复习巩固 + AI工具实操练习</div>
          <div class="schedule-course-dur">约20分钟 · 自主实践</div>
        </div>
      </div>`;
    }

    html += `</div>`;
    weekNum++;
  }

  // Tips section
  html += `<div style="background:var(--bg);border-radius:var(--radius-sm);padding:14px;margin-top:4px;">
    <p style="font-weight:600;font-size:13px;margin-bottom:8px;">🌟 高效学习建议</p>
    <div style="font-size:12px;color:var(--text2);line-height:2;">
      ① <strong>学前预热</strong>：提前5分钟回顾上节课内容，提升新知识吸收率<br>
      ② <strong>即学即用</strong>：每次学完立即在实际工作中尝试应用，不留作业到明天<br>
      ③ <strong>工具配套</strong>：先准备好ChatGPT/Copilot账号，学习时同步实操<br>
      ④ <strong>记录卡点</strong>：遇到疑惑的地方记录下来，用AI工具本身去求解答案<br>
      ⑤ <strong>分享输出</strong>：每周跟同事分享1个AI使用心得，教别人是最好的学习
    </div>
  </div>`;

  html += `</div>`;
  html += `<div style="display:flex;gap:8px;margin-top:12px;">
    <button class="btn btn-outline" style="flex:1;" data-action="goLearningMap">📍 返回学习地图</button>
    <button class="btn btn-primary" style="flex:1;" data-action="goDashboard">进入课程列表 →</button>
  </div>`;

  return html;
}

// ---- DASHBOARD ----
function renderDashboard() {
  const role = ROLES[S.role];
  const courses = getRoleCourses();
  const total = courses.length;
  const done = courses.filter(c => S.courseProgress[c.id]?.done).length;
  const progress = Math.round(done/total*100);

  let html = headerHtml('学习仪表盘', role.icon + ' ' + role.name + ' · ' + (S.currentEmployee?.name || '新学员'), true);
  html += `<div class="card slide-up">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-value" style="color:var(--blue);">${total}</div><div class="stat-label">课程总数</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--green);">${done}</div><div class="stat-label">已完成</div></div>
      <div class="stat-card"><div class="stat-value">${progress}%</div><div class="stat-label">学习进度</div></div>
      <div class="stat-card"><div class="stat-value" style="color:${progress>=80?'var(--green)':'var(--amber)'};">${done>=total/2?'阶段二':'阶段一'}</div><div class="stat-label">当前阶段</div></div>
    </div>
    <div class="progress-bar mt-2"><div class="progress-fill ${progress>=80?'high':progress>=40?'mid':'low'}" style="width:${progress}%"></div></div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-outline" style="flex:1;font-size:12px;" data-action="goLearningMap">📍 学习地图</button>
      <button class="btn btn-outline" style="flex:1;font-size:12px;" data-action="goSchedule">📅 学习计划</button>
    </div>
  </div>`;

  html += `<div class="card mt-3 slide-up"><p style="font-weight:600;font-size:14px;margin-bottom:14px;">课程列表</p>`;
  const ordered = courses.map((c, idx) => {
    const priority = getCoursePriority(c);
    return {...c, origIdx: idx, priority};
  }).sort((a,b) => b.priority - a.priority);

  // P2.3: Calculate adaptive learning stats
  let totalQuizAttempted = 0, totalQuizCorrect = 0;
  courses.forEach(c => {
    const stats = getTotalQuizStats(c.id);
    totalQuizAttempted += stats.total;
    totalQuizCorrect += stats.correct;
  });

  ordered.forEach((c, i) => {
    const prog = S.courseProgress[c.id];
    const isDone = prog?.done;
    const canStart = prereqsMet(c) || isDone;
    const locked = !isDone && !canStart;
    const cls = isDone ? 'completed' : locked ? 'locked' : '';
    const tagCls = c.type==='video' ? 'tag-blue' : 'tag-purple';
    const statusLabel = isDone ? '已完成' : locked ? '🔒 需前置' : '待学习';

    // P2.3: Quiz stats for adaptive feedback
    const quizStats = getTotalQuizStats(c.id);
    const hasQuizData = quizStats.total > 0;
    const quizWarning = hasQuizData && quizStats.rate < 70;
    const quizOk = hasQuizData && quizStats.rate >= 70;
    let quizBadge = '';
    if (quizWarning) quizBadge = `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;background:#fef2f2;color:var(--red);font-size:11px;font-weight:600;margin-left:6px;">⚠️ 需复习 (${quizStats.rate}%)</span>`;
    else if (quizOk) quizBadge = `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;background:var(--green-bg);color:var(--green);font-size:11px;font-weight:600;margin-left:6px;">✓ 已掌握 (${quizStats.rate}%)</span>`;

    html += `<div class="course-card ${cls}" ${locked?'':'data-action="openCourse" data-idx="'+c.origIdx+'"'}>
      <div class="course-num">${i+1}</div>
      <div style="flex:1;min-width:0;"><div class="course-title">${c.title}${quizBadge}</div><div class="course-meta">${c.dur}${c.requires?.length?' · 前置：'+c.requires.map(r=>getRoleCourses().find(rc=>rc.id===r)?.title||r).join('+ '):''}</div></div>
      <span class="tag ${tagCls}">${c.type==='video'?'视频':'图文'}</span>
      <span style="font-size:12px;margin-left:8px;">${statusLabel}</span>
    </div>`;
  });
  html += `</div>`;

  // P2.3: Adaptive review recommendations
  const needReview = ordered.filter(c => {
    const stats = getTotalQuizStats(c.id);
    return stats.total > 0 && stats.rate < 70;
  });
  if (needReview.length > 0) {
    html += `<div class="card mt-3 slide-up" style="border-left:4px solid var(--red);">
      <p style="font-weight:600;font-size:14px;margin-bottom:8px;color:var(--red);">📋 需重点复习</p>
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px;">以下课程的课中测验正确率偏低，建议重新学习</p>`;
    needReview.forEach(c => {
      const stats = getTotalQuizStats(c.id);
      html += `<div style="padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;" data-action="openCourse" data-idx="${ordered.indexOf(c)}">
        <span style="font-weight:600;font-size:13px;flex:1;">${c.title}</span>
        <span style="font-size:12px;color:var(--red);">${stats.correct}/${stats.total} 正确 (${stats.rate}%)</span>
        <span style="font-size:11px;color:var(--blue);">→ 重新学习</span>
      </div>`;
    });
    html += `</div>`;
  }

  // P2.3: Overall quiz stats card
  if (totalQuizAttempted > 0) {
    const quizRate = Math.round(totalQuizCorrect/totalQuizAttempted*100);
    html += `<div class="card mt-3 slide-up">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-value" style="color:var(--blue);">${totalQuizAttempted}</div><div class="stat-label">课中测验总数</div></div>
        <div class="stat-card"><div class="stat-value" style="color:${quizRate>=70?'var(--green)':'var(--red)'};">${totalQuizCorrect}</div><div class="stat-label">答对数量</div></div>
        <div class="stat-card"><div class="stat-value" style="color:${quizRate>=70?'var(--green)':'var(--orange)'};">${quizRate}%</div><div class="stat-label">综合正确率</div></div>
        <div class="stat-card"><div class="stat-value" style="color:${needReview.length===0?'var(--green)':'var(--orange)'};">${needReview.length}</div><div class="stat-label">需复习课程</div></div>
      </div>
    </div>`;
  }

  if (done === total) {
    html += `<div class="card mt-3 slide-up text-center">
      <p style="font-size:18px;font-weight:700;margin-bottom:8px;">恭喜完成全部课程！</p>
      <p style="color:var(--text2);font-size:13px;margin-bottom:16px;">现在可以进行AI能力成果测验</p>
      <button class="btn btn-primary" data-action="startFinalQuiz">开始成果测验</button>
      ${S.finalScore!==null ? `<div class="alert alert-success mt-3">上次测验成绩：${S.finalScore}分</div>` : ''}
    </div>`;
  }

  return html;
}

// ---- COURSE DETAIL ----
function renderCourseDetail() {
  const c = getRoleCourses()[S.courseIdx];
  const role = ROLES[S.role];
  const prog = S.courseProgress[c.id];
  const content = getCourseContent(c.id);
  const adaptLevel = getAdaptationLevel(c.id);

  let html = headerHtml(c.title, role.icon + ' ' + role.name, true);
  html += `<div class="card slide-up">
    <div class="flex-between mb-3"><span class="tag ${c.type==='video'?'tag-blue':'tag-purple'}">${c.type==='video'?'视频课程（配音+PPT）':'图文课程'}</span>
    ${adaptLevel.level !== 'intermediate' ? `<span class="tag" style="background:${adaptLevel.level==='beginner'?'#fef3c7':'#dbeafe'};color:${adaptLevel.level==='beginner'?'#92400e':'#1e40af'};">${adaptLevel.level==='beginner'?'🎯 初级适配':'🚀 高级适配'}</span>` : ''}
    <span style="font-size:13px;color:var(--text2);">${c.dur}</span></div>
    <p style="font-size:14px;color:var(--text2);margin-bottom:16px;">${c.desc}</p>`;

  if (c.type === 'video' && content) {
    const slides = getPPTSlides(c.id, c.title, c.desc);

    // P2.2: Chapter markers
    const chapterNames = ['封面', '学习目标', '核心概念', '实操方法', '小结'];
    const chapterSlides = [0, 1, 2, 3, 4]; // slide indices for each chapter
    html += `<div class="chapter-strip" id="chapterStrip">`;
    chapterNames.forEach((name, ci) => {
      html += `<span class="chapter-dot${S.pptCurrentSlide===chapterSlides[ci]?' active':''}" onclick="S.pptCurrentSlide=${chapterSlides[ci]};stopVoice();updatePPTUI();" title="跳转到：${name}">${name}</span>`;
    });
    html += `</div>`;

    // PPT Player
    html += `<div class="ppt-container" id="pptContainer">
      <div class="ppt-frame" id="pptFrame">`;
    slides.forEach((s, i) => {
      html += renderPPTSlide(s, i, slides.length);
    });
    html += `</div>
      <!-- Subtitles -->
      <div class="subtitle-bar" id="subtitleBar">${escapeHtml(slides[0]?.notes || '')}</div>
      <!-- Voice Controls -->
      <div class="voice-controls">
        <button class="voice-btn voice-btn-play" id="voicePlayBtn" onclick="S.toggleVoice()" title="播放/暂停">▶</button>
        <button class="voice-btn voice-btn-outline" onclick="S.prevPPTSlide()" title="上一页">⏮</button>
        <button class="voice-btn voice-btn-outline" onclick="S.nextPPTSlide()" title="下一页">⏭</button>
        <div class="voice-progress"><div class="voice-progress-fill" id="voiceProgress" style="width:0%"></div></div>
        <select class="voice-speed-select" onchange="S.setVoiceSpeed(this.value)" title="语速">
          <option value="0.7">0.7x</option><option value="0.85">0.85x</option><option value="1" selected>1x</option><option value="1.2">1.2x</option>
        </select>
        <span class="voice-slide-counter" id="slideCounter">1/${slides.length}</span>
      </div>
    </div>`;

    // P2.2: Transcript toggle + panel
    html += `<button class="transcript-toggle" id="transcriptToggle" onclick="S.toggleTranscript()">📜 查看字幕文本</button>`;
    html += `<div class="transcript-panel" id="transcriptPanel">`;
    slides.forEach((s, i) => {
      html += `<div class="transcript-entry" onclick="S.pptCurrentSlide=${i};stopVoice();updatePPTUI();S.toggleTranscript();" data-tslide="${i}">
        <span class="ts-num">${i+1}</span>
        <span class="ts-title">${s.type==='cover'?c.title:'章节 '+(i+1)}</span>
        <div class="ts-text">${escapeHtml(s.notes || '')}</div>
      </div>`;
    });
    html += `</div>`;

    // P2.3: Quiz score summary if any quizzes taken
    const quizStats = getTotalQuizStats(c.id);
    if (quizStats.total > 0) {
      html += `<div class="alert alert-${quizStats.rate>=70?'success':quizStats.rate>=40?'warning':'danger'} mt-2" style="font-size:13px;">
        课中测验：${quizStats.correct}/${quizStats.total} 正确（正确率 ${quizStats.rate}%）${quizStats.rate<70?' — 建议复习相关章节':''}
      </div>`;
    }

    // Full content below PPT (only show if transcript is hidden)
    html += `<div class="mt-4" id="courseFullContent">${buildContentHTML(content)}</div>`;
  } else if (c.type === 'video') {
    html += `<div class="video-placeholder"><div class="play-btn">▶</div><p style="font-weight:600;font-size:16px;">${c.title}</p><p style="font-size:13px;opacity:0.8;">课程PPT视频演示</p></div>`;
  } else {
    if (content) { html += buildContentHTML(content); }
    else { html += `<div style="background:var(--bg);border-radius:var(--radius);padding:20px;"><p style="font-size:13px;color:var(--text2);text-align:center;">课程内容加载中…</p></div>`; }
  }

  // Task progress
  html += `<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);">
    <p style="font-weight:600;font-size:14px;margin-bottom:12px;">关卡任务 (${prog?.tasksDone||0}/${c.tasks.length})</p>`;
  c.tasks.forEach((t, i) => {
    const taskDone = prog?.tasksDone > i;
    html += `<div class="task-step"><div class="task-num ${taskDone?'done':'active'}">${taskDone?'✓':i+1}</div>
      <div class="task-desc"><strong>关卡${i+1}：${t.t}</strong>${t.h}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="flex-between mt-4">
    <button class="btn btn-outline" data-action="goDashboard">返回课程列表</button>
    <button class="btn btn-primary" data-action="openTask">${prog?.tasksDone >= c.tasks.length ? '已完成所有关卡' : '进入关卡挑战'}</button>
  </div></div>`;
  return html;
}

function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderPPTSlide(slide, idx, total) {
  const clsMap = {cover:'ppt-slide-cover', content:'ppt-slide-content', accent:'ppt-slide-accent', dark:'ppt-slide-dark', summary:'ppt-slide-summary'};
  const cls = clsMap[slide.type] || 'ppt-slide-content';
  let inner = '';
  // Title bar
  if (slide.title) {
    inner += `<div class="ppt-h2"><span class="ppt-icon" style="background:var(--blue-bg);">${slide.title.icon||''}</span>${slide.title.txt}</div>`;
  }
  // Blocks
  slide.blocks.forEach(b => {
    switch(b.el) {
      case 'h1': inner += `<div class="ppt-badge ppt-badge-blue">视频课程</div><div class="ppt-h1">${b.txt}</div>`; break;
      case 'h2': inner += `<div class="ppt-h1" style="font-size:22px;">${b.txt}</div>`; break;
      case 'p': inner += `<div class="ppt-p" style="color:rgba(255,255,255,0.7);max-width:500px;margin:0 auto;">${b.txt}</div>`; break;
      case 'li': inner += `<li>${b.txt}</li>`; break;
      case 'h3p': inner += `<div style="margin-bottom:12px;"><div class="ppt-h3">${b.title}</div><div class="ppt-p">${b.txt}</div></div>`; break;
      case 'card': inner += `<div class="ppt-card-mini"><div class="ppt-card-num">${String(b.num).padStart(2,'0')}</div><div class="ppt-card-t">${b.title}</div><div class="ppt-card-d">${b.txt}</div></div>`; break;
    }
  });
  // Wrap li's in ul
  if (slide.blocks.some(b=>b.el==='li')) {
    inner = inner.replace(/((?:<li>.*?<\/li>)+)/g, '<ul class="ppt-list">$1</ul>');
  }
  // Wrap cards in grid
  if (slide.blocks.some(b=>b.el==='card')) {
    inner = inner.replace(/((?:<div class="ppt-card-mini">.*?<\/div>)+)/g, '<div class="ppt-grid2">$1</div>');
  }
  return `<div class="ppt-slide ${cls}${idx===0?' active':''}" data-slide="${idx}">${inner}</div>`;
}

function buildContentHTML(content) {
  if (!content) return '';
  let h = '';

  // Objectives
  if (content.objectives && content.objectives.length) {
    h += `<div class="content-section"><h3>学习目标</h3>`;
    content.objectives.forEach((o,i) => {
      h += `<div class="obj-card"><div class="obj-num">${i+1}</div><div>${o}</div></div>`;
    });
    h += `</div>`;
  }

  // Core Concepts
  if (content.concepts && content.concepts.length) {
    h += `<div class="content-section"><h3>核心概念</h3>`;
    content.concepts.forEach(c => {
      h += `<div style="margin-bottom:14px;">
        <p style="font-weight:600;font-size:14px;margin-bottom:4px;color:var(--text);">${c.t}</p>
        <p style="font-size:13px;color:var(--text2);line-height:1.8;">${c.c}</p>
      </div>`;
    });
    h += `</div>`;
  }

  // Steps
  if (content.steps && content.steps.length) {
    h += `<div class="content-section"><h3>实操步骤</h3>`;
    content.steps.forEach(s => {
      h += `<div class="step-card"><div class="step-num">${content.steps.indexOf(s)+1}</div>
        <div class="step-body"><strong>${s.t}</strong>${s.d}</div></div>`;
    });
    h += `</div>`;
  }

  // Cases
  if (content.cases && content.cases.length) {
    h += `<div class="content-section"><h3>场景案例</h3>`;
    content.cases.forEach(c => {
      h += `<div class="case-box"><div class="case-label">场景</div><p>${c.s}</p>
        <div class="case-label" style="margin-top:8px;color:var(--green);">最佳实践</div><p>${c.sol}</p></div>`;
    });
    h += `</div>`;
  }

  // Tools
  if (content.tools && content.tools.length) {
    h += `<div class="content-section"><h3>推荐工具</h3><div class="tools-grid">`;
    content.tools.forEach(t => {
      h += `<div class="tool-card"><div class="tool-name">${t.n}</div><div class="tool-desc">${t.d}</div></div>`;
    });
    h += `</div></div>`;
  }

  // Tips
  if (content.tips && content.tips.length) {
    h += `<div class="content-section"><h3>实践要点</h3>`;
    content.tips.forEach((t,i) => {
      h += `<div class="tip-item"><div class="tip-icon">${i+1}</div><div>${t}</div></div>`;
    });
    h += `</div>`;
  }

  // Summary
  if (content.summary) {
    h += `<div class="summary-box"><h4>本章小结</h4><p>${content.summary}</p></div>`;
  }

  return h;
}

// ---- TASK MODAL ----
function renderTaskModal() {
  const c = getRoleCourses()[S.courseIdx];
  const ti = S.courseTaskIdx;
  const t = c.tasks[ti];
  const prog = S.courseProgress[c.id] || {};
  const hintData = getTaskHint(c.id, ti);
  const showHint = S.taskShowHint[c.id+'_'+ti];
  const showAnswer = S.taskShowAnswer[c.id+'_'+ti];

  let html = headerHtml(c.title + ' — 关卡' + (ti+1), '任务陪练', true);
  html += `<div class="card slide-up">
    <div style="display:flex;gap:8px;margin-bottom:16px;">`;
  c.tasks.forEach((_, i) => {
    const done = prog.tasksDone > i;
    html += `<div style="flex:1;height:4px;border-radius:2px;background:${done?'var(--green)':i===ti?'var(--blue)':'var(--border)'};"></div>`;
  });
  html += `</div>
    <p style="font-weight:700;font-size:16px;margin-bottom:8px;">关卡 ${ti+1}：${t.t}</p>
    <p style="font-size:14px;color:var(--text2);margin-bottom:16px;">${t.h}</p>`;

  // Hint system
  if (hintData && hintData.hints && hintData.hints.length) {
    html += `<button class="hint-toggle" data-action="toggleTaskHint" data-cid="${c.id}" data-ti="${ti}">${showHint ? '🔽 收起提示' : '💡 查看解题提示 ('+hintData.hints.length+'步)'}</button>`;
    if (showHint) {
      html += `<div class="hint-steps">`;
      hintData.hints.forEach((h, hi) => {
        html += `<div class="hint-step"><div class="hint-num">${hi+1}</div><div>${h}</div></div>`;
      });
      html += `</div>`;
    }
  }

  html += `<div style="background:var(--bg);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;margin-top:12px;">
      <p style="font-size:13px;font-weight:500;margin-bottom:6px;">请在下方完成你的任务</p>
      <p style="font-size:12px;color:var(--text2);">模拟真实工作场景，用AI工具完成对应任务。在文本框中描述你的操作过程和成果。</p>
    </div>
    <textarea class="task-input" id="taskAnswer" placeholder="请描述你使用AI工具完成任务的过程和成果...">${prog['taskAns'+ti]||''}</textarea>`;

  // Reference answer — only before submission (after submission it's in grade area)
  const hasSubmitted = !!prog['taskAns'+ti];
  if (!hasSubmitted && hintData && hintData.answer) {
    html += `<button class="hint-toggle" style="margin-top:8px;" data-action="toggleTaskAnswer" data-cid="${c.id}" data-ti="${ti}">${showAnswer ? '🔼 收起参考' : '📋 查看参考答案'}</button>`;
    html += `<div class="task-answer-box${showAnswer?' show':''}" id="taskAnswerBox">${hintData.answer.replace(/\n/g,'<br>')}</div>`;
  }

  html += `<div class="flex-between mt-4">
      <button class="btn btn-outline" data-action="goBack">返回课程</button>
      <div style="display:flex;gap:8px;">
        ${ti>0?`<button class="btn btn-outline" data-action="prevTask">上一关卡</button>`:''}
        <button class="btn btn-primary" data-action="submitTask">提交任务</button>
      </div>
    </div>`;

  if (prog['taskAns'+ti]) {
    const grade = prog['taskGrade'+ti];
    if (grade) {
      // P1.3: Rich grading display
      const ringCls = grade.overall >= 85 ? 'excellent' : grade.overall >= 70 ? 'good' : grade.overall >= 50 ? 'ok' : 'poor';
      html += `<div class="grade-box">
        <div class="grade-header">
          <div class="grade-score-ring ${ringCls}">${grade.overall}</div>
          <div>
            <div class="grade-level" style="color:${grade.overall>=70?'var(--green)':grade.overall>=50?'var(--orange)':'var(--red)'};">${grade.level} · 任务已提交</div>
            <div style="font-size:12px;color:var(--text3);">${grade.summary}</div>
          </div>
        </div>
        <div class="grade-section-label">评分维度</div>`;
      const dims = [
        {k:'completeness',name:'完整性',color:'var(--blue)'},
        {k:'specificity',name:'具体性',color:'var(--purple)'},
        {k:'structure',name:'结构性',color:'var(--orange)'},
        {k:'relevance',name:'相关性',color:'var(--green)'}
      ];
      dims.forEach(d => {
        const v = grade.dimensions[d.k] || 0;
        html += `<div class="grade-dim-row">
          <div class="grade-dim-label">${d.name}</div>
          <div class="grade-dim-bar"><div class="grade-dim-fill" style="width:${v}%;background:${d.color};"></div></div>
          <div class="grade-dim-score">${v}分</div>
        </div>`;
      });
      html += `</div>`;

      // Strengths & improvements
      if (grade.strengths && grade.strengths.length) {
        html += `<div class="grade-box" style="margin-top:8px;">
          <div class="grade-section-label">优点</div>
          <ul class="grade-feedback-list">`;
        grade.strengths.forEach(s => { html += `<li class="strength">${s}</li>`; });
        html += `</ul></div>`;
      }
      if (grade.improvements && grade.improvements.length) {
        html += `<div class="grade-box" style="margin-top:8px;">
          <div class="grade-section-label">改进建议</div>
          <ul class="grade-feedback-list">`;
        grade.improvements.forEach(s => { html += `<li class="improve">${s}</li>`; });
        html += `</ul></div>`;
      }
      if (grade.missingTopics && grade.missingTopics.length) {
        html += `<div class="grade-box" style="margin-top:8px;">
          <div class="grade-section-label">参考答案中未覆盖的关键点</div>
          <ul class="grade-feedback-list">`;
        grade.missingTopics.forEach(s => { html += `<li class="missing">${s}</li>`; });
        html += `</ul></div>`;
      }
    } else {
      // Legacy: no grade data (old submission)
      html += `<div class="alert alert-success mt-3">
        <strong>任务已提交！</strong>
        <p style="margin-top:4px;">AI评估：${prog['taskFeedback'+ti] || '正在评估中...'}</p>
      </div>`;
    }

    // Reference answer always show after submission
    if (hintData && hintData.answer) {
      html += `<button class="hint-toggle" style="margin-top:8px;" data-action="toggleTaskAnswer" data-cid="${c.id}" data-ti="${ti}">${showAnswer ? '🔼 收起参考' : '📋 查看参考答案'}</button>`;
      html += `<div class="task-answer-box${showAnswer?' show':''}" id="taskAnswerBox">${hintData.answer.replace(/\n/g,'<br>')}</div>`;
    }

    html += `<div style="margin-top:12px;">
      ${ti < c.tasks.length-1 ? `<button class="btn btn-green" data-action="nextTask" style="width:100%;">进入下一关卡 →</button>` :
      `<button class="btn btn-green" data-action="finishCourse" style="width:100%;">完成课程 ✓</button>`}
    </div>`;
  }

  html += `</div>`;
  return html;
}

// ---- FINAL QUIZ ----
function renderFinalQuiz() {
  const role = ROLES[S.role];
  const questions = FINAL_QUIZZES[S.role];

  let html = headerHtml('AI能力成果测验', role.icon + ' ' + role.name, true);
  html += `<div class="card slide-up">
    <p style="font-weight:600;font-size:15px;margin-bottom:16px;">完成学习后，检验你的AI应用能力（${questions.filter(q=>q.type==='choice').length}道选择题 + ${questions.filter(q=>q.type==='subjective').length}道主观题）</p>`;

  if (S.finalSubmitted) {
    html += renderFinalResults();
  } else {
    questions.forEach((q, i) => {
      const typeBadge = q.type === 'choice'
        ? '<span class="quiz-type-badge quiz-type-choice">选择题</span>'
        : '<span class="quiz-type-badge quiz-type-subj">主观题</span>';
      html += `<div style="margin-bottom:20px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span style="font-weight:700;font-size:14px;color:var(--blue);">第${i+1}题</span>${typeBadge}
        </div>
        <p style="font-weight:600;font-size:14px;margin-bottom:8px;">${q.q}</p>`;

      if (q.type === 'choice') {
        q.opts.forEach((o, j) => {
          const sel = S.finalAnswers[i];
          html += `<label class="quiz-option" style="margin-bottom:4px;${sel===j?'border-color:var(--blue);background:var(--blue-bg);':''}">
            <input type="radio" name="q${i}" value="${j}" ${sel===j?'checked':''} onchange="S.answerFinal(${i},${j})" style="margin-right:8px;">${String.fromCharCode(65+j)}. ${o}</label>`;
        });
      } else {
        // Subjective question
        html += `<div class="subj-template"><div class="subj-label">📋 答案模板</div><div class="subj-content">${q.template}</div></div>`;
        const showHint = S.finalShowHint[i];
        html += `<button class="hint-toggle" data-action="toggleFinalHint" data-idx="${i}">${showHint ? '🔼 收起提示' : '💡 查看解题步骤 ('+q.steps.length+'步)'}</button>`;
        if (showHint) {
          html += `<div class="hint-steps">`;
          q.steps.forEach((s, si) => {
            html += `<div class="hint-step"><div class="hint-num">${si+1}</div><div>${s}</div></div>`;
          });
          html += `</div>`;
        }
        html += `<textarea class="task-input" id="subjAns${i}" onchange="S.answerSubjFinal(${i},this.value)" placeholder="请按照模板在此作答...">${S.finalSubjAnswers[i]||''}</textarea>`;
      }
      html += `</div>`;
    });

    const allAnswered = questions.every((q,i) => {
      if (q.type === 'choice') return S.finalAnswers[i] !== undefined;
      return S.finalSubjAnswers[i] && S.finalSubjAnswers[i].trim();
    });
    html += `<button class="btn btn-primary" data-action="submitFinal" ${!allAnswered?'disabled':''}>提交测验</button>`;
  }

  html += `</div>`;
  return html;
}

function renderFinalResults() {
  const questions = FINAL_QUIZZES[S.role];
  let html = `<div class="text-center" style="padding:20px 0;">
      <div class="gauge"><svg viewBox="0 0 120 120" width="120" height="120"><circle class="gauge-bg" cx="60" cy="60" r="52"/><circle class="gauge-fill" cx="60" cy="60" r="52" stroke-dasharray="326" stroke-dashoffset="${326 - 326*S.finalScore/100}" stroke="${S.finalScore>=80?'var(--green)':S.finalScore>=60?'var(--amber)':'var(--red)'}"/></svg>
        <div class="gauge-text">${S.finalScore}</div></div>
      <div class="gauge-label">分</div>
      <p style="margin-top:12px;font-size:14px;font-weight:500;">${S.finalScore>=80?'优秀！你已掌握AI核心应用能力':S.finalScore>=60?'良好！继续练习可进一步提升':'需要加强，建议重新学习重点课程'}</p>
    </div>`;

  // Show correct answers for choice questions
  html += `<div class="mt-3"><p style="font-weight:600;font-size:14px;margin-bottom:10px;">答案解析</p>`;

    if (q.type === 'choice') {

      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <span style="color:${correct?'var(--green)':'var(--red)'};font-weight:600;">${correct?'✓':'✗'}</span> ${i+1}. ${q.q}
        <span style="display:block;margin-top:4px;color:var(--text2);">正确答案：${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]} — ${q.explain||''}</span></div>`;
    } else {
      const hasAnswer = S.finalSubjAnswers[i] && S.finalSubjAnswers[i].trim();
      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <span style="color:${hasAnswer?'var(--green)':'var(--red)'};font-weight:600;">${hasAnswer?'✓ 已作答':'✗ 未作答'}</span> ${i+1}. ${q.q}

  });
  html += `</div>`;

  html += `<div class="text-center mt-3" style="display:flex;gap:10px;justify-content:center;">
      <button class="btn btn-outline" data-action="goDashboard">返回学习</button>
      <button class="btn btn-outline" data-action="startFinalQuiz">重新测验</button>
      <button class="btn btn-primary" data-action="saveAndFinish">保存并完成</button>

}

S.prevQuestion = function() { // v41: 仅允许回退到本维第 1 题（撤销第 2 题，含已定级撤销）
  if (!S._quizPlan || S.quizIdx <= 0) return;
  const cur = S._quizPlan[S.quizIdx];
  const prev = S._quizPlan[S.quizIdx - 1];
  if (!cur || !prev || cur.d !== prev.d) return;
  const step = S.quizIdx;
  S._quizPlan.pop();
  if (S._quizLog && S._quizLog[cur.d]) S._quizLog[cur.d] = S._quizLog[cur.d].filter(e => e.step !== step);
  if (S._quizSelectedStep) delete S._quizSelectedStep[step];
  if (S._quizStartAt) delete S._quizStartAt[step];
  if (S._quizTiming) delete S._quizTiming[step];
  if (cur.d in S._quizDone) { delete S._quizDone[cur.d]; delete S.quizAnswers[cur.d]; }
  S._quizAllDone = false;
  S.quizIdx--;
  render();
};
S.nextQuestion = function() { // v41: 推进到计划中的下一题；计划出尽（已全部定级）则出结果
  if (!S._quizPlan) return;
  if (S.quizIdx < S._quizPlan.length - 1) { S.quizIdx++; render(); }
  else { finishAdaptiveQuiz(); }
};

S.calcResults = function() {
  const questions = ASSESSMENTS[S.role];
  const scores = Array(ROLES[S.role].skills.length).fill(0);
  questions.forEach((q, i) => { scores[q.dim] += q.scores[S.quizAnswers[i]]; });
  const dimCount = {};
  questions.forEach(q => { dimCount[q.dim] = (dimCount[q.dim]||0)+1; });
  Object.keys(dimCount).forEach(k => { scores[k] = Math.round(scores[k] / dimCount[k]); });
  S.quizScores = scores;
  S.view = 'results';
  render();
};

  const courses = getRoleCourses();

    const reqNames = (c.requires||[]).map(rid => {
      const rc = courses.find(x => x.id === rid);

  const c = getRoleCourses()[S.courseIdx];
  const ti = S.courseTaskIdx;
  const t = c.tasks[ti];
  const ans = document.getElementById('taskAnswer')?.value || '';
  if (!ans.trim()) { alert('请先完成任务描述'); return; }
  if (!S.courseProgress[c.id]) S.courseProgress[c.id] = {tasksDone:0};
  const prog = S.courseProgress[c.id];
  prog['taskAns'+ti] = ans;

  // P1.3: Auto-grade the answer
  const hintData = getTaskHint(c.id, ti);
  const refAnswer = hintData?.answer || '';
  const grade = gradeAnswer(ans, t.h, refAnswer);
  prog['taskGrade'+ti] = grade;
  prog['taskFeedback'+ti] = grade.summary;

  if (ti >= prog.tasksDone) prog.tasksDone = ti + 1;
  saveProgress();
  render();
};

let _voiceSynth = window.speechSynthesis;
let _voiceUtterance = null;
let _pptInterval = null;
let _subtitleTimer = null;

// P2.4: Smart Chinese sentence splitting
function splitChineseSentences(text) {
  if (!text || text.length < 80) return [text];
  var parts = [];
  var current = '';
  var i = 0;
  while (i < text.length) {
    current += text[i];
    // Split on Chinese punctuation
    if ('。！？；\n'.indexOf(text[i]) !== -1 && current.length > 20) {
      parts.push(current.trim());
      current = '';
    }
    // Force split if too long
    if (current.length > 120) {
      // Try to split at a comma
      var commaIdx = current.lastIndexOf('，');
      if (commaIdx > 20) {
        parts.push(current.substring(0, commaIdx+1).trim());
        current = current.substring(commaIdx+1);
      } else {
        parts.push(current.trim());
        current = '';
      }
    }
    i++;
  }
  if (current.trim()) parts.push(current.trim());
  return parts.length > 0 ? parts : [text];
}

function initPPT() {
  S.pptCurrentSlide = 0;
  S.voicePlaying = false;
  stopVoice();
  updatePPTUI();
  // Auto-start voice for slide 0
  setTimeout(function() { S.toggleVoice(); }, 500);
}

function stopVoice() {
  if (_voiceUtterance) { _voiceUtterance.onend = null; }
  _voiceSynth.cancel();
  if (_pptInterval) clearInterval(_pptInterval);
  S.voicePlaying = false;
  S.voicePaused = false;
}

S.toggleVoice = function() {
  if (S.voicePlaying && !S.voicePaused) { // pause
    _voiceSynth.pause();
    S.voicePaused = true;
    updateVoiceButton();
    return;
  }
  if (S.voicePaused) { // resume
    _voiceSynth.resume();
    S.voicePaused = false;
    updateVoiceButton();
    return;
  }
  // Start playing from current slide
  playCurrentSlide();
};

S.prevPPTSlide = function() {
  if (S.pptCurrentSlide > 0) {
    stopVoice();
    S.pptCurrentSlide--;
    updatePPTUI();
    if (S.voicePlaying) setTimeout(function() { playCurrentSlide(); }, 200);
  }
};

S.nextPPTSlide = function() {
  const slides = document.querySelectorAll('.ppt-slide');
  if (S.pptCurrentSlide < slides.length - 1) {
    stopVoice();
    S.pptCurrentSlide++;
    updatePPTUI();
    if (S.voicePlaying) setTimeout(function() { playCurrentSlide(); }, 200);
  }
};

S.setVoiceSpeed = function(rate) {
  S.voiceRate = parseFloat(rate);
};

function playCurrentSlide() {
  S.voicePlaying = true;
  S.voicePaused = false;
  updateVoiceButton();
  var c = getRoleCourses()?.[S.courseIdx];
  if (!c) return;
  const slides = getPPTSlides(c.id, '', '');
  if (!slides[S.pptCurrentSlide]) return;
  const rawNotes = slides[S.pptCurrentSlide].notes || '';
  // P2.4: Split long text into sentences for better TTS pacing
  const sentences = splitChineseSentences(rawNotes);
  const notes = sentences.join('。');
  S._currentSentences = sentences;
  S._currentSentenceIdx = 0;
  
  _voiceUtterance = new SpeechSynthesisUtterance(notes);
  _voiceUtterance.lang = 'zh-CN';
  _voiceUtterance.rate = S.voiceRate;
  _voiceUtterance.onend = function() {
    if (_subtitleTimer) clearInterval(_subtitleTimer);
    // P2.4: Save voice progress
    S._voiceSlideProgress = S._voiceSlideProgress || {};
    S._voiceSlideProgress[S.pptCurrentSlide] = true;
    // Auto advance to next slide
    const allSlides = document.querySelectorAll('.ppt-slide');
    if (S.pptCurrentSlide < allSlides.length - 1) {
      S.pptCurrentSlide++;
      updatePPTUI();
      playCurrentSlide();
    } else {
      S.voicePlaying = false;
      updateVoiceButton();
      updateSubtitle('课程语音播放完成，可进入关卡练习。');
    }
  };
  updateSubtitle(notes, S._currentSentences);
  _voiceSynth.speak(_voiceUtterance);
}

function updatePPTUI() {
  var slides = document.querySelectorAll('.ppt-slide');
  slides.forEach(function(s, i) { s.classList.toggle('active', i === S.pptCurrentSlide); });
  var counter = document.getElementById('slideCounter');
  if (counter) counter.textContent = (S.pptCurrentSlide+1) + '/' + slides.length;
  var prog = document.getElementById('voiceProgress');
  if (prog && slides.length > 1) prog.style.width = Math.round(S.pptCurrentSlide/(slides.length-1)*100) + '%';
  // P2.1: Check for in-course quiz trigger
  var c = getRoleCourses()?.[S.courseIdx];
  if (c) checkQuizTrigger(c.id);
  // P2.2: Update chapter markers
  updateChapterMarkers();
  // P2.2: Update transcript highlights
  updateTranscriptHighlight();
}

S.toggleTranscript = function() {
  S.transcriptOpen = !S.transcriptOpen;
  var panel = document.getElementById('transcriptPanel');
  var toggle = document.getElementById('transcriptToggle');
  if (panel) panel.classList.toggle('show', S.transcriptOpen);
  if (toggle) toggle.textContent = S.transcriptOpen ? '📜 收起字幕文本' : '📜 查看字幕文本';
};

function updateChapterMarkers() {
  var strip = document.getElementById('chapterStrip');
  if (!strip) return;
  var dots = strip.querySelectorAll('.chapter-dot');
  // Map slide to chapter index
  var chapterSlides = [0, 1, 2, 3, 4];
  dots.forEach(function(d, i) {
    d.classList.remove('active', 'current');
    if (S.pptCurrentSlide === chapterSlides[i]) d.classList.add('active');
    else if (S.pptCurrentSlide > chapterSlides[i]) d.classList.add('current');
  });
}

function updateTranscriptHighlight() {
  var entries = document.querySelectorAll('.transcript-entry');
  entries.forEach(function(e) {
    e.classList.toggle('active', parseInt(e.getAttribute('data-tslide')) === S.pptCurrentSlide);
  });
}

function updateSubtitle(text) {
  const bar = document.getElementById('subtitleBar');
  if (bar) bar.textContent = text;
  if (bar) bar.classList.remove('paused');
}

function updateVoiceButton() {
  const btn = document.getElementById('voicePlayBtn');
  if (!btn) return;
  if (S.voicePlaying && !S.voicePaused) { btn.textContent = '⏸'; }
  else { btn.textContent = '▶'; }
  const bar = document.getElementById('subtitleBar');
  if (bar) bar.classList.toggle('paused', S.voicePaused);
}

document.addEventListener('keydown', function(e) {
  if (S.view !== 'course') return;
  if (e.key === 'ArrowRight') { S.nextPPTSlide(); }
  else if (e.key === 'ArrowLeft') { S.prevPPTSlide(); }
  else if (e.key === ' ') { e.preventDefault(); S.toggleVoice(); }
  // P2.4: Skip voice / jump to next slide
  else if (e.key === 's' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    stopVoice();
    S.nextPPTSlide();
    if (S.voicePlaying) setTimeout(function() { playCurrentSlide(); }, 200);
  }
});

// ==================== INIT ====================
function bindEvents() {
  // Event delegation handler
  const app = document.getElementById('app');
  if (!app._bound) {
    app._bound = true;
    app.addEventListener('click', function(e) {
      let el = e.target;
      while (el && el !== app) {
        const action = el.getAttribute('data-action');
        if (action) {
          // Skip if element has inline onclick to avoid double-firing
          if (el.hasAttribute('onclick')) return;
          const id = el.getAttribute('data-id') || el.getAttribute('data-idx');
          const idx = parseInt(el.getAttribute('data-idx'));
          switch (action) {
            case 'selectIndustry': S.selectIndustry(id); break;
            case 'selectRole': S.selectRole(id); break;
            case 'startQuiz': S.startQuiz(); break;
            case 'answerQuiz': S.answerQuiz(idx); break;
            case 'retakeQuiz': S.retakeQuiz(); break;
            case 'exportReport': exportReport(); break;
            case 'shareReport': shareReport(); break;
            case 'prevQuestion': S.prevQuestion(); break;
            case 'nextQuestion': S.nextQuestion(); break;
            case 'loadEmployee': S.loadEmployee(idx); break;
            case 'goDashboard': S.goDashboard(); break;
            case 'goLearningMap': S.goLearningMap(); break;
            case 'goSchedule': S.goSchedule(); break;
            case 'openCourse': S.openCourse(idx); break;
            case 'openTask': S.openTask(); break;
            case 'submitTask': S.submitTask(); break;
            case 'prevTask': S.prevTask(); break;
            case 'nextTask': S.nextTask(); break;
            case 'finishCourse': S.finishCourse(); break;
            case 'startFinalQuiz': S.startFinalQuiz(); break;
            case 'submitFinal': S.submitFinal(); break;
            case 'saveAndFinish': S.saveAndFinish(); break;
            case 'reset': S.reset(); break;
            case 'goAdmin': S.goAdmin(); break;
            case 'goBack': S.goBack(); break;
            case 'logout': S.logout(); break;
            case 'toggleTaskHint': S.toggleTaskHint(el.getAttribute('data-cid'), parseInt(el.getAttribute('data-ti'))); break;
            case 'toggleTaskAnswer': S.toggleTaskAnswer(el.getAttribute('data-cid'), parseInt(el.getAttribute('data-ti'))); break;
            case 'toggleFinalHint': S.toggleFinalHint(idx); break;
            case 'loadAndGoDashboard': S.loadEmployee(idx); S.goDashboard(); break;
          }
          return;
        }
        el = el.parentElement;
      }
    });
  }
}
