{level:1,difficulty:"中阶",scenario:"场景：你要为公司的AI辅助开发建立安全规范。团队在使用公共AI工具（ChatGPT/Cursor/Copilot），需要防止数据泄露。",q:"AI辅助开发的数据安全策略？",opts:["四层防护：(1)「数据分级」→定义哪些数据绝对不能输入AI（生产密钥/客户PII/商业机密） (2)「工具分级」→核心代码用企业私有AI/非敏感代码可用公共AI (3)「流程嵌入」→代码提交前自动检查是否含敏感信息 (4)「安全意识」→定期安全培训+模拟钓鱼测试→建立安全文化","禁止使用公共AI工具","写一份安全使用指南","购买企业版AI工具","让大家自己注意就行"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI数据安全=分级+工具分级+流程检查+意识培养。不是禁用AI而是让AI安全地融入工作流。"},
{level:1,difficulty:"中阶",scenario:"场景：你在审查AI生成的代码时发现：AI使用了过时的加密算法(MD5)、拼接SQL、没有输入校验。你意识到AI可能引入安全风险。",q:"AI生成代码的安全审查策略？",opts:["五步安全审查：(1)「静态扫描」→自动化安全扫描工具检查AI生成的代码 (2)「模式识别」→AI识别不安全的编码模式(硬编码/拼接SQL/弱加密) (3)「依赖审查」→检查AI推荐的第三方库是否安全 (4)「运行时防护」→安全敏感的代码路径必须有运行时保护 (5)「持续学习」→将发现的安全问题反馈到AI的安全规则库","人工Code Review每一行","不让AI写安全敏感的代码","相信AI生成的代码","用安全扫描工具自动检查"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI代码安全审查=静态扫描+模式识别+依赖审查+运行时防护+持续学习。AI生成的代码需要「不信任原则」对待。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为公司的微服务架构设计统一的认证授权方案。涉及OAuth2.0/OIDC/JWT/API Key多种认证方式，200+服务。",q:"AI辅助设计统一认证授权架构？",opts:["四步设计：(1)AI分析现有服务的认证方式→评估迁移复杂度 (2)AI设计统一认证网关（OAuth2.0+OIDC）→支持SSO (3)AI设计细粒度授权模型（RBAC→ABAC→支持多租户） (4)AI生成JWT Token的设计规范（过期时间/刷新策略/Claims定义）→输出安全架构文档","每个服务自己管理认证","使用API Gateway统一的API Key","引入Keycloak等开源方案","用云厂商的IAM服务"],scores:[4, 0, 0, 0, 0],best:0,explain:"认证授权=现状分析+统一网关+授权模型+Token规范。200个服务不能有200种认证方式。"},
{level:1,difficulty:"中阶",scenario:"场景：公司准备通过SOC 2安全审计。作为技术负责人你需要确保：访问控制/数据加密/审计日志/变更管理都符合要求。",q:"AI辅助安全合规审计准备？",opts:["四步准备：(1)AI对照SOC 2标准→逐项检查现有实践→生成Gap Analysis (2)AI为每个Gap生成补救方案（如：补充审计日志→AI设计日志格式和保留策略） (3)AI生成审计证据包：访问控制矩阵/加密策略文档/变更管理流程 (4)AI模拟审计问题→准备回应话术","等审计来了再说","请外部安全咨询公司","参考其他公司的SOC 2报告","只准备最关键的部分"],scores:[4, 0, 0, 0, 0],best:0,explain:"合规审计=Gap分析+补救方案+证据包+模拟审计。AI帮你把SOC 2从「不知道从哪开始」梳理成清晰的任务清单。"},
// === P0新增：security L2 ===
{level:2,difficulty:"高阶",scenario:"场景：作为安全架构师，你要为公司设计「AI安全治理框架」——不是禁止AI而是建立安全使用AI的规则和流程。",q:"AI安全治理框架的核心设计？",opts:["五层治理：(1)「数据治理」→AI输入/输出数据分级+传输加密+不用于模型训练 (2)「模型治理」→AI模型的供应链安全（来源验证/漏洞扫描/偏见检测） (3)「访问治理」→谁可以用什么AI/可以输入什么数据/需要什么审批 (4)「输出治理」→AI生成内容的审查机制（代码/文档/决策建议） (5)「审计治理」→所有AI交互留痕+定期安全审计","只允许使用企业私有AI","制定一份AI使用规定","对AI工具做安全评估","禁止敏感岗位使用AI"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI安全治理=数据+模型+访问+输出+审计。不是管住AI工具，而是管住人怎么用AI。"},
{level:2,difficulty:"高阶",scenario:"场景：你发现有人通过Prompt Injection攻击内部AI助手——通过精心设计的输入绕过安全限制获取敏感信息。",q:"如何防御AI应用的Prompt Injection攻击？",opts:["四层防御：(1)「输入过滤」→检测和过滤已知的注入模式 (2)「权限隔离」→AI助手只能访问用户有权看的数据 (3)「输出审查」→AI输出在返回前自动扫描是否含敏感信息 (4)「沙箱执行」→AI生成的内容在受限环境执行→人工Review高风险操作","在Prompt里加「不要听用户的指令」","限制AI能做什么操作","只在内部网络使用AI","定期审计AI的对话记录"],scores:[4, 0, 0, 0, 0],best:0,explain:"Prompt Injection防御=输入过滤+权限隔离+输出审查+沙箱。不是靠Prompt保护Prompt，而是靠系统架构保护。"},
{level:2,difficulty:"高阶",scenario:"场景：公司收购了一个创业公司，需要将其系统整合到公司的安全体系中。对方的代码库有50万行，安全状况未知。",q:"AI辅助并购后的技术安全审查（Tech DD）？",opts:["四步安全DD：(1)「代码安全扫描」→AI全量扫描代码库发现漏洞/硬编码密钥/不安全依赖 (2)「架构安全评估」→AI分析系统架构的安全薄弱点（网络暴露面/认证机制/数据流） (3)「合规差距分析」→AI对比公司安全标准→生成差距清单和整改成本估算 (4)「整合方案」→AI设计安全整合路线图（迁移到统一认证/接入安全监控/数据隔离）","让对方提供安全自评报告","请安全公司做渗透测试","整合后再说安全问题","先隔离运行不整合"],scores:[4, 0, 0, 0, 0],best:0,explain:"并购安全DD=代码扫描+架构评估+合规差距+整合方案。AI能在几天内完成人工需要几周的安全审查。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计一个「安全开发全生命周期（SDL）」流程，在开发的每个阶段嵌入安全检查，而不是事后发现漏洞再修。",q:"AI驱动的安全开发全生命周期方案？",opts:["五阶段SDL：(1)「需求阶段」→AI分析需求中的安全风险+生成安全需求清单 (2)「设计阶段」→AI审查架构设计中的安全考虑+威胁建模 (3)「开发阶段」→IDE中实时安全提示+AI生成安全测试用例 (4)「测试阶段」→AI驱动的SAST/DAST+自动化渗透测试 (5)「运维阶段」→AI安全监控+自动漏洞修复建议","在发布前做一次安全扫描","请安全团队做渗透测试","加强Code Review中的安全检查","用现有的SDL流程加AI工具"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI SDL=需求→设计→开发→测试→运维全流程嵌入。不是在最后一公里才想起安全，而是从第一天就考虑安全。"},
{level:2,difficulty:"高阶",scenario:"场景：近年来供应链攻击激增（SolarWinds/log4j/xz utils）。作为安全负责人，你需要建立软件供应链安全防线。",q:"AI驱动的软件供应链安全方案？",opts:["五层供应链安全：(1)「来源验证」→AI验证所有依赖的来源+数字签名+SBOM(软件物料清单) (2)「行为监控」→AI监控依赖的运行时行为→检测异常（如不该有网络请求的库突然联网） (3)「漏洞预警」→AI持续监控依赖的CVE+自动评估影响范围 (4)「构建管道安全」→AI确保CI/CD管道的完整性和不可篡改 (5)「应急响应」→AI在发现供应链攻击时自动评估影响+生成应急方案","只用大厂维护的开源库","减少第三方依赖的数量","定期更新依赖版本","做一次依赖安全审计"],scores:[4, 0, 0, 0, 0],best:0,explain:"供应链安全=来源验证+行为监控+漏洞预警+管道安全+应急响应。现代软件90%是依赖，防线不能只防自己的代码。"},

strategy: [{level:0,difficulty:"初阶",scenario:"场景：CTO问：AI对研发工程师的工作方式最大的改变是什么？",q:"最佳回答？",opts:["A. AI让研发从「写代码」升级为「设计系统」：(1)重复代码由AI生成→工程师聚焦架构设计 (2)Code Review从人工到AI+人工 (3)调试从看日志到AI辅助根因分析 (4)文档从负担到自动生成→工程师的核心竞争力从「写得快」变为「想得深」","B. AI能替代初级程序员","C. AI让写代码更快","D. AI主要影响前端开发","E. 变化不大还是要写代码"],scores:[4,0,0,0,0],best:0,explain:"研发的战略转变：AI承担重复劳动，人的价值转移到架构设计和系统思维。核心能力从「执行力」到「判断力」。"},{level:1,difficulty:"中阶",scenario:"场景：公司要制定「AI Native研发体系」的建设路线图。你作为Tech Lead提出方案。",q:"最佳路线图？",opts:["A. 三阶段：(1)工具普及期-全员配置Cursor/Copilot，建立Prompt最佳实践 (2)流程嵌入期-AI嵌入Code Review/测试生成/文档编写流程 (3)能力升级期-AI辅助架构设计/性能优化/安全审查→建立团队AI能力度量体系","B. 一次性全面引入AI","C. 先观望等AI技术更成熟","D. 只给高级工程师用AI","E. 买最好的AI工具就行了"],scores:[4,0,0,0,0],best:0,explain:"AI Native研发体系=工具→流程→能力渐进升级。关键是建立度量体系，知道AI到底提升了什么。"},

{level:0,difficulty:"初阶",scenario:"场景：CEO在全员会上宣布：公司今年最重要的战略是「AI赋能业务增长」。作为研发你被要求提出AI如何赋能研发团队的方案。",q:"如何构建研发团队的AI战略叙事？",opts:["三步叙事：(1)「现状分析」→AI量化当前研发瓶颈（重复工作占比/交付周期/质量成本） (2)「AI杠杆」→标注AI最能产生10x效果的3个环节（代码生成/测试自动化/智能运维） (3)「价值故事」→用一个具体案例展示AI如何让开发效率提升+质量提升+开发者幸福感提升","就说AI能让研发更高效","列出AI能做的所有事情","等公司出了具体战略再跟进","参考大厂的AI实践照搬"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI战略叙事=现状量化+AI杠杆+价值故事。不是「AI能做什么」而是「AI能为我们解决什么」。"},
{level:0,difficulty:"初阶",scenario:"场景：你的团队Leader问你：我们团队用AI工具3个月了，你觉得AI改变了我们什么？你想给出有洞察的回答。",q:"AI对研发工程师角色本质的改变？",opts:["三个本质改变：(1)「时间分配」→从70%写代码+30%思考→变成30%写代码+70%思考架构和设计 (2)「技能重心」→核心竞争力从「特定语言精通」变为「系统设计和问题定义能力」 (3)「产出形态」→从「交付代码」变为「交付解决方案（代码+文档+测试+部署）」","写代码更快了","少写了很多重复代码","不用记那么多API了","可以一个人做更多事"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI改变角色本质=时间分配+技能重心+产出形态。AI不是让工程师失业，而是让工程师升级。"},
{level:0,difficulty:"初阶",scenario:"场景：HR VP找到你说：「我想在研发团队推行AI技能认证，你觉得应该怎么做？」需要你给出快速建议。",q:"研发团队AI技能认证的建议框架？",opts:["四层认证：(1)「L1-AI用户」→能使用AI工具完成日常编码任务 (2)「L2-AI工程师」→能设计Prompt链和Agent工作流 (3)「L3-AI架构师」→能设计AI嵌入的系统和流程 (4)「L4-AI领导者」→能制定团队/公司的AI战略→每层有明确的技能要求和评估标准","做一个AI使用考试","看谁能用好Cursor","按Prompt写得好不好评级","跟大厂认证体系对齐"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI认证=用户→工程师→架构师→领导者四级。认证不是为了分级而是为了让人看到成长路径。"},
{level:0,difficulty:"初阶",scenario:"场景：新CTO上任，在第一次技术全员会上问：「我们的技术团队在AI时代的核心竞争力应该是什么？」",q:"AI时代研发团队的核心竞争力？",opts:["三个核心竞争力：(1)「问题定义力」→AI能做执行但人定义「解决什么问题」 (2)「系统判断力」→AI能生成方案但人判断「哪个方案更好」 (3)「价值感知力」→AI能优化指标但人知道「什么对用户真正重要」→技术能力+业务理解+AI驾驭三位一体","深度学习最新的AI技术","能快速上手任何新技术","全栈开发能力","积累更多的技术经验"],scores:[4, 0, 0, 0, 0],best:0,explain:"核心竞争力=问题定义力+系统判断力+价值感知力。AI能做很多事但「决定做什么」永远是人。"},

{level:1,difficulty:"中阶",scenario:"场景：作为技术总监，你需要为下一年制定研发团队的AI技术路线图。涉及：工具选型/技能培养/流程改造/组织调整。",q:"AI时代的研发技术路线图设计？",opts:["四维路线图：(1)「工具维度」→选型AI辅助工具链+评估企业版vs开源 (2)「能力维度」→团队AI技能分级培养计划 (3)「流程维度」→AI嵌入开发流程的时间表和里程碑 (4)「组织维度」→是否需要AI平台团队/AI Champion角色→每季度可量化的KPI","买最新的AI工具就行","跟随行业趋势","按现有路线图加一些AI任务","让各团队自己制定"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI路线图=工具+能力+流程+组织四维。不是「我们要用AI」而是「我们要成为AI时代的什么团队」。"},
{level:1,difficulty:"中阶",scenario:"场景：公司要评估自研vs外购AI辅助开发平台的决策。自研需要20人年+500万投入。外购方案每年200万。",q:"AI平台自研vs外购的战略决策？",opts:["五维决策：(1)「战略控制」→自建平台=掌握核心能力+数据不出境 (2)「成本分析」→自建3年TCO vs 外购3年总费用 (3)「差异化」→自建可以定制化贴合业务需求 (4)「风险」→外购依赖供应商/自建依赖核心人才 (5)「时机」→先外购快速见效→再自建核心能力→最终混合方案","自建更有战略价值","外购更省钱更快","看行业头部公司怎么选的","先小规模试点外购"],scores:[4, 0, 0, 0, 0],best:0,explain:"自研vs外购=战略控制+成本+差异化+风险+时机。不是简单的成本比较，而是「什么能力必须掌握在自己手里」。"},
{level:1,difficulty:"中阶",scenario:"场景：团队里有人担心AI会取代自己的工作岗位，工作积极性下降。作为Tech Lead你需要正面回应这个担忧。",q:"如何用AI重塑团队价值而非取代？",opts:["三步重塑：(1)「透明沟通」→明确AI在团队中的定位是增强工具不是替代品 (2)「新价值定位」→帮每个人找到AI时代的独特价值（AI做不到的系统设计/业务理解/跨团队协调/技术决策） (3)「成长赋能」→从「写代码的人」转型为「用AI解决问题的人」→提供培训和成长路径","告诉大家AI不会取代人","等自然淘汰不合适的成员","提供AI培训缓解焦虑","强调公司的稳定性"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI焦虑应对=透明沟通+新价值定位+成长赋能。不是「你不会被取代」而是「你会变成更值钱的人」。"},
{level:1,difficulty:"中阶",scenario:"场景：你需要在公司技术委员会上争取AI平台建设的预算。竞争对手已经在投入，但CFO觉得AI投入ROI不清晰。",q:"如何量化AI开发工具的投入产出（ROI）？",opts:["四维ROI：(1)「效率提升」→量化AI节省的开发时间（日均可节省1-2小时×团队人数×日薪=年节省金额） (2)「质量提升」→AI辅助减少的Bug数×平均Bug修复成本 (3)「加速交付」→项目交付周期缩短带来的业务价值 (4)「人才吸引力」→AI工具对招聘和留存的正面影响→输出ROI计算模型","按每个工程师的效率提升计算","对标行业ROI数据","先投入一年再看效果","强调不投入的竞争风险"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI ROI=效率+质量+加速+人才。不是「值不值得投」而是「不投会损失多少」。"},

{level:2,difficulty:"高阶",scenario:"场景：作为CTO，你要面向董事会做「AI时代的研发战略」汇报。需要阐明：AI如何重塑研发、投入什么、预期回报、风险。",q:"面向董事会的AI研发战略汇报框架？",opts:["五页战略：(1)「为什么现在」→AI对研发的改变已从渐进变为颠覆 (2)「我们的定位」→成为[行业]内AI Native研发的先行者 (3)「三年路线图」→L1工具→L2流程→L3范式的渐进路径 (4)「投入与回报」→3年投入XXX万/预期效率提升XX%/交付周期缩短XX% (5)「风险与应对」→数据安全/人才流失/AI技术变化快的风险管理","展示AI工具的使用数据","对比竞品的AI投入","提出AI研发的预算需求","请咨询公司做战略报告"],scores:[4, 0, 0, 0, 0],best:0,explain:"董事会AI战略=Why+Positioning+Roadmap+ROI+Risk。不是说AI多厉害，是说我们应该成为什么。"},
{level:2,difficulty:"高阶",scenario:"场景：你发现AI工具在团队中出现了「马太效应」：技术好的人用AI效果更好，技术弱的人反而被AI带偏。你担心这会加大团队内部的能力差距。",q:"如何防止AI加大团队能力差距？",opts:["四步均衡：(1)「基础补强」→对AI使用效果差的人提供基础技能培训（不是AI培训是基础能力培训） (2)「AI脚手架」→为不同水平的人提供不同层级的AI辅助（初级：AI生成代码+详细解释/高级：AI辅助架构设计） (3)「Peer Learning」→建立AI使用经验分享机制→好的用法全团队可见 (4)「能力度量」→不以AI使用量为考核，以实际产出质量和效率为准","限制高水平的人使用AI","给低水平的人更多AI帮助","统一AI使用方式","这是正常现象不用干预"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI能力差距=基础补强+分级辅助+经验共享+能力度量。AI是放大器，好的人更好差的人更差，管理者的责任是提高下限。"},

{level:2,difficulty:"高阶",scenario:"场景：你要向CEO汇报：运营团队的AI化程度和投资回报。需要量化AI对运营提效的实际贡献。",q:"AI运营提效的ROI量化框架？",opts:["A. 四维ROI：(1)「效率维度」→AI节省的人力时间(小时)×人均时薪 (2)「效果维度」→AI优化带来的增量GMV/转化率提升 (3)「质量维度」→AI减少的运营事故/投诉 (4)「能力维度」→团队AI技能等级提升→输出AI运营Dashboard", "B. 算AI工具省了多少人力", "C. 对比用AI前后的数据", "D. 估算AI节省的时间", "E. 参考行业AI应用ROI"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI ROI=效率+效果+质量+能力四维。不是「AI带来了多少好处」而是「每投入1元AI，运营产出多少元」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计运营团队的「AI能力成长路径」：从不会用AI到成为AI Native运营团队。",q:"运营团队AI能力培养体系？",opts:["A. 五级成长：(1)L1-AI认知→了解AI能帮运营做什么 (2)L2-AI使用者→能用AI写文案/做数据分析 (3)L3-AI设计者→能设计AI运营工作流 (4)L4-AI策略者→用AI制定运营策略 (5)L5-AI领导者→驱动组织AI转型→每级有考核标准和晋升激励", "B. 全员AI培训课", "C. 让每个人自学AI", "D. 奖励AI用得好的", "E. 招AI背景的运营"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI能力=认知→使用→设计→策略→领导五级成长。不是「学会用AI」而是「成为AI时代的运营专家」。"},
{level:2,difficulty:"高阶",scenario:"场景：公司要建立一个「AI运营中台」——赋能所有业务线的运营团队，而非各业务线自建AI能力。",q:"AI运营中台的产品设计？",opts:["A. 四层中台：(1)「能力层」→AI文案/数据分析/用户画像/活动预测等通用AI能力 (2)「场景层」→把能力封装为业务场景模板（拉新活动/会员日/大促...） (3)「配置层」→运营可通过自然语言配置AI行为无需开发 (4)「度量层」→每个AI能力的调用量和效果可视化→持续优化中台能力", "B. 每个业务线自己建AI工具", "C. 统一买一个AI运营工具", "D. 做一个AI工具库供调用", "E. 招聘AI工程师嵌入各业务线"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI运营中台=能力+场景+配置+度量。不是「建个AI工具」而是「让运营像用Excel一样自然地用AI」。"},
{level:2,difficulty:"高阶",scenario:"场景：运营领域出现新范式——Agent驱动运营：AI Agent能自主执行运营任务（发Push/调策略/回复用户）。",q:"AI Agent自主运营的边界和治理？",opts:["A. 四层治理：(1)「权限边界」→Agent能做什么/不能做什么（能发Push但不能改动价格） (2)「决策分级」→低风险自动执行/中风险建议+人确认/高风险必须人决策 (3)「监控机制」→Agent所有操作留痕+异常行为自动熔断 (4)「效果闭环」→Agent执行效果持续评估→好的行为强化/不好的行为纠正", "B. 现在Agent不成熟不用考虑", "C. 让人监督所有Agent操作", "D. 只让Agent做数据分析不执行", "E. 先让Agent做简单的重复任务"],scores:[4, 0, 0, 0, 0],best:0,explain:"Agent治理=权限边界+决策分级+监控熔断+效果闭环。AI Agent运营不是「让它随便跑」而是「有边界的自主权」。"}
],
tools: [
{level:0,difficulty:"初阶",scenario:"场景：你要做一次用户调研：想知道用户为什么卸载App。之前靠人工电话/问卷效率低。",q:"AI辅助用户调研工具的选择和使用？",opts:["A. 三步调研：(1)AI设计调研问卷→基于用户行为数据自动个性化问题 (2)AI分析问卷/访谈录音→提取关键洞察和情感倾向 (3)AI生成调研报告→标注Top3用户痛点和改进建议", "B. 手动设计问卷发邮件", "C. 用问卷星模板", "D. APP内加反馈入口", "E. 看App Store评论"],scores:[4, 0, 0, 0, 0],best:0,explain:"用户调研=智能问卷+自动分析+洞察报告。AI让你从「筛200份问卷」变成「看AI生成的3个关键洞察」。"},
{level:0,difficulty:"初阶",scenario:"场景：你要做运营数据看板：监控DAU/留存/转化/收入等20+指标。之前是用Excel手动更新。",q:"AI辅助运营数据看板搭建？",opts:["A. 三步建看板：(1)AI连接数据源→自动识别关键运营指标 (2)AI生成实时数据看板→含自动异常标注 (3)AI配置预警规则→关键指标异常时自动Push告警+可能原因", "B. 用Excel做更新", "C. 买BI工具自己配", "D. 让数据团队帮忙做", "E. 只看几个核心指标"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据看板=自动连接+智能标注+异常告警。不是「看数据」而是「AI帮你发现数据里的问题」。"},
{level:0,difficulty:"初阶",scenario:"场景：你用的运营工具太多（推送/短信/邮件/社群/AB测试/数据分析→6个系统），每天在不同系统间切换。",q:"AI辅助运营工具整合与自动化？",opts:["A. 三步整合：(1)AI打通多平台数据→统一用户视图 (2)AI设计自动化工作流→触发条件→自动执行跨平台动作 (3)AI生成统一运营面板→在一个界面操作所有渠道", "B. 减少使用的工具数量", "C. 用Excel汇总各平台数据", "D. 安排专人负责工具操作", "E. 每个平台各用各的"],scores:[4, 0, 0, 0, 0],best:0,explain:"工具整合=统一数据+自动工作流+统一面板。不是「少用工具」而是「让工具之间能对话」。"},
{level:0,difficulty:"初阶",scenario:"场景：你想要做A/B测试优化App首页布局，但对A/B测试工具不熟悉。",q:"AI辅助设计A/B测试方案？",opts:["A. 三步AB测试：(1)AI分析页面→推荐可测试的元素和变体方案 (2)AI设计测试计划→样本量/时长/成功指标/统计方法 (3)AI自动分析结果→标注统计显著性+推荐胜出版本", "B. 直接改然后看数据变化", "C. 参考别人怎么做的", "D. 找UX设计师帮做", "E. 先小范围放新版本试试"],scores:[4, 0, 0, 0, 0],best:0,explain:"AB测试=方案推荐+测试设计+自动分析。不是「改了看看效果」而是「科学地证明哪个更好」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要选择一款「AI运营自动化平台」：市面上有10+产品，功能重叠但各有侧重。",q:"AI运营平台选型评估？",opts:["A. 五维评估：(1)「场景覆盖」→评估覆盖了哪些运营场景 (2)「AI能力」→内置AI的成熟度和可定制性 (3)「数据安全」→数据处理方式和合规性 (4)「集成能力」→与现有系统的对接难度 (5)「ROI」→量化预期收益和总拥有成本→输出选型矩阵", "B. 选功能最多的", "C. 选最便宜的", "D. 问同行用哪个", "E. 每个都试用一下"],scores:[4, 0, 0, 0, 0],best:0,explain:"平台选型=场景+AI能力+安全+集成+ROI五维。不是「选最好的」而是「选最适合我们的」。"},
{level:1,difficulty:"中阶",scenario:"场景：你策划了一个裂变活动，但担心被羊毛党刷。需要设计反作弊策略。",q:"AI辅助运营活动反作弊？",opts:["A. 四层反作弊：(1)AI识别异常行为模式→同一设备多账号/机器人行为 (2)AI设置动态风控阈值→根据实时数据调整 (3)AI标记可疑账号→自动降权或人工审核 (4)AI分析作弊手法→持续更新防刷规则", "B. 限制参与次数", "C. 活动结束后清理作弊数据", "D. 实名认证才能参与", "E. 减少活动奖励"],scores:[4, 0, 0, 0, 0],best:0,explain:"反作弊=异常识别+动态风控+自动降权+规则更新。不是「堵住漏洞」而是「AI持续对抗作弊手法」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要建立「运营自动化流水线」——把重复性运营工作（数据导出/报表生成/活动配置）自动化。",q:"AI+RPA运营自动化流水线设计？",opts:["A. 三步流水线：(1)AI识别重复性工作→评估自动化可行性和收益 (2)AI生成RPA脚本+自动化流程→对接各系统API (3)AI监控自动化执行→异常时自动告警+人工介入", "B. 招一个运营助理手动做", "C. 减少重复性工作", "D. 用Zapier/ifttt", "E. 逐步自动化最耗时的工作"],scores:[4, 0, 0, 0, 0],best:0,explain:"自动化流水线=识别+脚本生成+监控。不是「做了自动化」而是「AI帮你找到该自动化的，再帮你自动完成」。"},
{level:1,difficulty:"中阶",scenario:"场景：你在评估：运营团队应该用通用AI（ChatGPT）还是垂直运营AI工具？两者投入产出差别大。",q:"通用AI vs 垂直运营AI工具的选择策略？",opts:["A. 四步决策：(1)「任务分析」→70%通用任务用通用AI+Prompt即可 (2)「差异评估」→15%需要行业数据/私有模型的任务需要垂直工具 (3)「成本对比」→通用AI便宜但需要更多人工Prompt设计 (4)「策略」→以通用AI为主力+关键场景补充垂直工具", "B. 全用通用AI省钱", "C. 全用垂直工具效果好", "D. 看其他公司怎么选", "E. 两个都买先用着"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI工具选择=任务分析+差异评估+成本对比。不是「通用vs垂直」而是「通用的打底+垂直的攻坚」。"},
{level:2,difficulty:"高阶",scenario:"场景：作为运营VP，你要搭建「AI运营技术栈」：从底层数据到上层应用的技术架构决策。",q:"AI运营技术栈架构设计？",opts:["A. 五层技术栈：(1)「数据层」→CDP用户数据平台+数据湖 (2)「AI引擎层」→LLM/推荐/预测模型 (3)「能力层」→AI文案/AI分析/AI决策 (4)「编排层」→AI运营工作流引擎 (5)「应用层」→运营Dashboard+自动化执行→各层解耦可替换", "B. 买一个全家桶AI运营平台", "C. 基于开源AI自建", "D. 用云厂商AI服务组装", "E. 先搭起来再优化"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI技术栈=数据+AI引擎+能力+编排+应用五层。不是「买哪个产品」而是「搭什么样的技术底座」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要为AI运营工具建立效果评估体系：买的AI工具到底有没有用？怎么衡量？",q:"AI运营工具的持续评估框架？",opts:["A. 四维评估：(1)「使用率」→工具实际使用频率和深度 (2)「效率提升」→使用工具前后任务完成时间对比 (3)「效果提升」→工具直接贡献的业务指标提升 (4)「满意度」→运营人员对工具的NPS评分→建立工具健康度仪表盘+淘汰低效工具", "B. 看工具的使用数据", "C. 定期问运营人员好不好用", "D. 对比用工具前后的KPI", "E. 按合同到期评估一次"],scores:[4, 0, 0, 0, 0],best:0,explain:"工具评估=使用率+效率+效果+满意度。不是「买了就用」而是「持续衡量是否值得继续用」。"},
{level:2,difficulty:"高阶",scenario:"场景：运营AI工具越来越多（10+），团队出现「工具疲劳」：学不过来、不知道用哪个、切换成本高。",q:"如何整合碎片化的AI运营工具？",opts:["A. 三步整合：(1)「去重分析」→AI分析各工具的功能重叠度→剔除冗余工具 (2)「核心选型」→确定「最小AI工具集」覆盖80%场景 (3)「统一入口」→建立AI运营工作台→运营在一个界面使用所有AI能力→降低学习成本", "B. 只用最核心的3个工具", "C. 强制淘汰旧工具", "D. 培训团队每个工具都学", "E. 自己开发统一工具"],scores:[4, 0, 0, 0, 0],best:0,explain:"工具整合=去重+选型+统一入口。不是「工具越多越好」而是「人在一个地方完成所有AI操作」。"},
{level:2,difficulty:"高阶",scenario:"场景：你在评估自研vs外购AI运营平台的长期战略。外购3年500万，自研5年800万但有战略控制权。",q:"AI运营平台自研vs外购战略决策？",opts:["A. 五维决策：(1)「战略控制」→核心AI能力是否必须自有 (2)「差异化」→自研能否形成竞争壁垒 (3)「成本」→3-5年总拥有成本对比 (4)「风险」→外购的供应商锁定风险/自研的人才流失风险 (5)「路径」→先外购快速验证→关键能力逐步自研→混合模式", "B. 外购更省心", "C. 自研更有竞争力", "D. 看大公司怎么选", "E. 先做一年再决定"],scores:[4, 0, 0, 0, 0],best:0,explain:"自研vs外购=战略控制+差异化+成本+风险+路径。不是「钱的问题」而是「什么能力必须握在自己手里」。"},
{level:2,difficulty:"高阶",scenario:"场景：你需要向CFO申请500万AI运营工具预算。CFO说：我看到的AI都是成本，不是收益。",q:"如何用数据说服CFO投资AI运营？",opts:["A. 四步说服：(1)「现状量化」→当前运营效率痛点量化（重复工作占比/响应速度/人效对比） (2)「收益模型」→AI能节省多少人天×日薪+AI带来的增量收入 (3)「ROI时间表」→6个月/12个月/24个月的投资回收路径 (4)「同行对标」→行业内领先公司的AI运营投入和产出→用CFO的语言讲AI", "B. 强调不投AI会被淘汰", "C. 先小预算试点出效果", "D. 请CEO推动", "E. 找咨询公司出报告"],scores:[4, 0, 0, 0, 0],best:0,explain:"说服CFO=现状量化+收益模型+ROI时间表+同行对标。CFO不关心AI多厉害，只关心「投500万能省/赚多少」。"}
],
data: [
{level:0,difficulty:"初阶",scenario:"场景：老板要看上周运营数据。你需要在30分钟内从多个系统中导出数据并整理成报告。",q:"AI辅助快速生成运营周报？",opts:["A. 三步周报：(1)AI自动从各系统拉取本周关键数据 (2)AI生成结构化报告→标注同比/环比变化+异常指标红色高亮 (3)AI为每项变化补充一句话分析→你Review调整结论", "B. 手动从每个系统导数据", "C. 用上周模板改数据", "D. 让各渠道负责人各自汇报", "E. 只报核心数据不分析"],scores:[4, 0, 0, 0, 0],best:0,explain:"运营周报=自动拉取+结构化+异常标注。30分钟的周报变成3分钟Review。"},
{level:0,difficulty:"初阶",scenario:"场景：你的运营活动上线后效果不好。你想知道到底是曝光不够还是转化不行，但数据分散没法快速定位。",q:"AI辅助运营活动漏斗分析？",opts:["A. 三步漏斗：(1)AI拉取活动全链路数据（曝光→点击→参与→转化→分享） (2)AI自动标注转化率骤降的环节+对比历史均值 (3)AI生成问题诊断报告→推荐针对性优化方案", "B. 看最终转化率凭感觉判断", "C. 对比上次活动数据", "D. 问参与用户反馈", "E. 加大曝光看看能不能拉起来"],scores:[4, 0, 0, 0, 0],best:0,explain:"漏斗分析=全链路+断点标注+诊断方案。不是「看总转化率」而是「找到哪个环节掉了、为什么」。"},
{level:0,difficulty:"初阶",scenario:"场景：你要做用户分群运营：把100万用户分成不同群组给不同策略。之前是拍脑袋分。",q:"AI辅助用户分层分群？",opts:["A. 三步分群：(1)AI基于RFM模型自动分群→高价值/活跃/沉睡/流失 (2)AI叠加行为特征→价格敏感型/社交型/内容型 (3)AI为每个群组推荐差异化运营策略→生成分群运营计划", "B. 按消费金额分高/中/低", "C. 按注册时间分", "D. 只分活跃和不活跃", "E. 按用户标签手动分"],scores:[4, 0, 0, 0, 0],best:0,explain:"用户分群=RFM+行为特征+策略推荐。不是「拍脑袋分」而是「AI用数据科学地分，每种人都能精准触达」。"},
{level:0,difficulty:"初阶",scenario:"场景：你的社群运营有100个微信群，想知道哪些群活跃、哪些群冷清、群主表现如何。",q:"AI辅助社群运营数据分析？",opts:["A. 三步分析：(1)AI分析群聊数据→活跃度/话题/情感倾向 (2)AI标注异常群→广告刷屏/负面对话/沉寂群 (3)AI生成社群健康度报告→推荐需要干预的群和策略", "B. 看群成员数变化", "C. 让群主自评", "D. 抽查几个群", "E. 数消息量"],scores:[4, 0, 0, 0, 0],best:0,explain:"社群分析=活跃度+话题+健康度。不是「看群人数」而是「AI理解100个群里哪个需要你关注」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要预测下个月的DAU是多少，为资源规划做准备。之前是靠经验拍一个数。",q:"AI辅助运营指标预测？",opts:["A. 三步预测：(1)AI建立时间序列预测模型→基于2年历史数据 (2)AI标注可能影响预测的特殊事件（节日/大促/版本更新） (3)AI输出预测范围（乐观/基准/悲观）→含置信区间和关键假设", "B. 看最近趋势估计", "C. 按去年同期数据定", "D. 设一个保守的目标值", "E. 不做预测等活动结束再说"],scores:[4, 0, 0, 0, 0],best:0,explain:"指标预测=模型+事件修正+区间输出。不是「拍一个数」而是「基于数据的科学预测+置信区间」。"},
{level:1,difficulty:"中阶",scenario:"场景：你的运营活动效果在同类活动中属于什么水平？你需要对比行业benchmark来判断。",q:"AI辅助运营效果对标分析？",opts:["A. 三步对标：(1)AI收集行业公开数据→建立运营效果基准库 (2)AI对比自有数据与基准→标注优势和差距 (3)AI分析差距原因→推荐向行业领先者看齐的改进方向", "B. 和去年同期对比", "C. 问同行他们的数据", "D. 看行业报告的平均水平", "E. 只和团队历史最好成绩比"],scores:[4, 0, 0, 0, 0],best:0,explain:"对标分析=行业基准+差距标注+改进方向。不是「和自己比进步」而是「和行业标杆比差距」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要分析用户生命周期：从注册到流失的全过程，找出用户在哪个阶段流失最多。",q:"AI辅助用户生命周期分析？",opts:["A. 三步生命周期：(1)AI追踪用户从注册到流失的行为轨迹 (2)AI标注每个阶段的转化率和流失率→识别关键流失节点 (3)AI为每个流失节点生成干预策略→形成用户生命周期运营地图", "B. 看月留存率", "C. 分析流失用户特征", "D. 做用户调研问为什么离开", "E. 对比新老用户行为差异"],scores:[4, 0, 0, 0, 0],best:0,explain:"生命周期=行为轨迹+流失节点+干预策略。不是「看留存率」而是「找到用户在哪一步离开了、怎么拉回来」。"},
{level:1,difficulty:"中阶",scenario:"场景：你的运营数据中存在「虚假繁荣」：DAU很高但核心行为（下单/发帖）很低。需要洞察真实活跃度。",q:"AI辅助区分表面指标和核心指标？",opts:["A. 三步甄别：(1)AI建立指标健康度模型→区分虚荣指标和北极星指标 (2)AI分析用户行为深度→区分浅层活跃和深层活跃 (3)AI标注「指标偏离」→高DAU低核心行为→可能的刷量/推送过度→建议关注核心行为", "B. 只看DAU和GMV", "C. 核心指标和表面指标都看", "D. 减少看数据频率看趋势", "E. 关注所有指标"],scores:[4, 0, 0, 0, 0],best:0,explain:"指标甄别=健康度模型+行为深度+偏离标注。不是「数据涨了就好」而是「涨的是真实价值还是虚假繁荣」。"},
{level:2,difficulty:"高阶",scenario:"场景：作为运营数据负责人，你要从0搭建「运营数据体系」：从数据采集到决策支持的完整链路。",q:"运营数据体系的顶层设计？",opts:["A. 五层体系：(1)「采集层」→埋点规范+全渠道数据接入 (2)「存储层」→数仓分层ODS/DWD/DWS/ADS (3)「计算层」→实时+离线计算引擎 (4)「服务层」→统一数据API+看板 (5)「应用层」→AI驱动的决策支持→从数据到洞察全链路", "B. 买一套BI系统", "C. 搭一个数据看板", "D. 让数据团队统一管理", "E. 各业务线自行采集数据"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据体系=采集+存储+计算+服务+应用五层。不是「有数据看」而是「数据从产生到辅助决策的完整链路」。"},
{level:2,difficulty:"高阶",scenario:"场景：公司各业务线数据口径不一致：你的「活跃用户」定义和市场部的不一样。导致数据打架。",q:"AI辅助统一运营数据口径？",opts:["A. 三步统一：(1)AI分析各部门的数据定义差异→生成差异清单 (2)AI推荐统一口径方案→含具体计算逻辑和SQL (3)AI建立数据字典→所有指标有唯一权威定义→跨部门对齐", "B. 开会对齐数据口径", "C. 以运营数据为准", "D. 建一个统一指标文档", "E. 各用各的备注清楚"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据口径=差异分析+统一方案+数据字典。不是「我们说了算」而是「所有人用同一把尺子」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要建立「运营实验文化」→每个运营决策都基于实验数据而非经验。但团队没做过AB测试。",q:"AI驱动运营实验体系建设？",opts:["A. 四步实验：(1)AI设计实验框架→假设/变量/样本/指标/统计方法 (2)AI自动分析实验结果→标注统计显著性和实际意义 (3)AI将实验结果结构化存储→形成实验知识库 (4)AI在运营做决策时自动推荐相关实验结果→避免重复踩坑", "B. 强制重要决策都要做AB测试", "C. 引入AB测试工具", "D. 培养团队实验思维", "E. 先试点几个实验"],scores:[4, 0, 0, 0, 0],best:0,explain:"实验体系=框架+自动分析+知识库+智能推荐。不是「多做AB测试」而是「每次实验都是知识积累」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计一个「AI运营决策引擎」→把数据洞察自动转化为运营行动建议。",q:"AI运营决策引擎的设计？",opts:["A. 四层引擎：(1)「洞察层」→AI持续分析数据→发现异常和机会 (2)「推理层」→AI推理机会背后的原因和影响范围 (3)「建议层」→AI生成3-5个可执行方案→标注每个方案的预期效果和风险 (4)「执行层」→运营选择方案后→AI自动执行或生成执行计划", "B. 做一个数据看板让人自己看", "C. 定期出分析报告", "D. 设置数据预警", "E. AI自动执行优化"],scores:[4, 0, 0, 0, 0],best:0,explain:"决策引擎=洞察+推理+建议+执行四层。不是「给你看数据」而是「AI告诉你该做什么、做了会怎样」。"},
{level:2,difficulty:"高阶",scenario:"场景：作为数据运营负责人，你需要建立数据质量的度量和管理体系：数据不准，分析白费。",q:"AI驱动的数据质量治理？",opts:["A. 五维质量：(1)「完整性」→AI检查数据缺失率和缺失模式 (2)「准确性」→AI交叉验证多源数据的一致性 (3)「时效性」→AI检查数据延迟和新鲜度 (4)「唯一性」→AI检测重复数据和ID冲突 (5)「一致性」→AI检查跨系统数据口径→建立数据质量仪表盘+自动修复", "B. 定期检查数据质量", "C. 做一次数据清洗", "D. 统一数据录入规范", "E. 数据有问题时再修"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据治理=完整性+准确性+时效性+唯一性+一致性。不是「数据干净一次」而是「持续保证数据可信」。"}
],
content: [
{level:0,difficulty:"初阶",scenario:"场景：你要为一款新品写产品介绍页文案。需要突出卖点、差异化、使用场景，但不能太广告化。",q:"AI高效撰写产品介绍文案？",opts:["A. 三步写产品页：(1)AI分析产品特征→提取核心卖点和差异化 (2)AI生成3版不同风格文案（理性数据型/场景故事型/简洁卖点型） (3)你选最佳方向→AI展开为完整产品页+多平台适配版本", "B. 参考竞品产品页改写", "C. 让产品经理写", "D. 用一个模板套", "E. 外包给文案"],scores:[4, 0, 0, 0, 0],best:0,explain:"产品文案=卖点提取+多风格+平台适配。AI让你从「想怎么写」变成「选哪个方向」。"},
{level:0,difficulty:"初阶",scenario:"场景：你要写一篇公众号运营干货文章。每次构思+写+排版要半天。",q:"AI辅助公众号内容生产？",opts:["A. 三步生产：(1)AI分析热门选题→推荐本周值得写的3个话题 (2)AI生成文章大纲+填充初稿→你补充真实案例和观点 (3)AI优化标题/金句/排版→生成多平台分发版本", "B. 自己从头写到尾", "C. 翻译海外文章", "D. 找写手代写", "E. 写短一点减少工作量"],scores:[4, 0, 0, 0, 0],best:0,explain:"公众号=选题推荐+大纲初稿+优化排版。不是「不写了用AI」而是「AI做80%你注入20%的灵魂」。"},
{level:0,difficulty:"初阶",scenario:"场景：你要做一个促销活动页面。需要用有吸引力的文案把折扣描述清楚但不能太像清仓甩卖。",q:"AI辅助促销文案创作？",opts:["A. 三步促销文：(1)给AI促销规则→AI生成价值包装（不说打5折说「限时半价解锁」） (2)AI生成紧迫感文案（限时/限量/专属）但不虚假宣传 (3)AI生成FAQ→预判用户可能的疑问自动回答", "B. 写直白的打折信息", "C. 参考去年促销文案", "D. 让设计师配图写文案", "E. 突出价格优势"],scores:[4, 0, 0, 0, 0],best:0,explain:"促销文案=价值包装+紧迫感+FAQ。不是「说打折」而是「让用户觉得不买亏了」。"},
{level:0,difficulty:"初阶",scenario:"场景：你的社群每天要发早安/晚安问候和话题引导。坚持了3个月内容枯竭了。",q:"AI辅助社群内容持续输出？",opts:["A. 三步持续输出：(1)AI分析社群成员兴趣→生成话题日历（周一到周日不同主题） (2)AI根据话题日历每日自动生成互动内容草稿 (3)AI基于社群昨日互动情况→调整今日内容的切入角度→保持新鲜感", "B. 减少发内容频率", "C. 复用以前的内容", "D. 让群成员贡献内容", "E. 在网上找热门话题转发"],scores:[4, 0, 0, 0, 0],best:0,explain:"社群内容=话题日历+自动生成+动态调整。不是「灵感枯竭」而是「AI给你一个无限创意池」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为公司建立一个「内容中台」→所有运营人员共用的内容素材库和创作工具。",q:"AI驱动的运营内容中台设计？",opts:["A. 四层中台：(1)「素材库」→AI自动分类/标签化历史内容 (2)「创作工具」→AI辅助生成各类运营内容 (3)「品牌规范」→AI自动检查内容是否符合品牌调性 (4)「效果追踪」→AI分析内容效果→反馈优化创作→内容资产持续增值", "B. 建一个共享文件夹", "C. 只共享优质内容", "D. 让每个人自己存", "E. 买一个内容管理系统"],scores:[4, 0, 0, 0, 0],best:0,explain:"内容中台=素材库+创作工具+品牌规范+效果追踪。不是「有地方存内容」而是「内容变成可增值的资产」。"},
{level:1,difficulty:"中阶",scenario:"场景：你的运营内容在不同渠道（微信/抖音/小红书/B站）效果差异很大。需要理解每个平台的「内容语言」。",q:"AI辅助多平台内容策略？",opts:["A. 四步策略：(1)AI分析各平台高互动内容→提取每个平台的「内容DNA」（小红书重视觉+人设/抖音重节奏+钩子/微信重深度） (2)AI基于同一素材生成各平台适配版 (3)AI追踪各平台内容表现→持续优化适配策略 (4)建立平台内容手册", "B. 统一内容全平台发", "C. 聚焦效果最好的平台", "D. 一个平台一种内容团队", "E. 各平台用不同素材"],scores:[4, 0, 0, 0, 0],best:0,explain:"多平台策略=DNA分析+适配生成+效果追踪。不是「一个内容到处发」而是「每个平台说自己的语言」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要做内容营销的SEO/SEM优化。之前标题和关键词都是凭感觉写的。",q:"AI辅助内容SEO优化？",opts:["A. 三步SEO：(1)AI做关键词研究→推荐高搜索量低竞争的长尾词 (2)AI优化标题/H1/描述→嵌入目标关键词自然流畅 (3)AI分析Top10排名页面→反向推导内容策略→优化内容结构", "B. 堆砌关键词", "C. 找SEO服务商", "D. 参考排名靠前的标题", "E. 不特意做SEO"],scores:[4, 0, 0, 0, 0],best:0,explain:"SEO优化=关键词研究+自然嵌入+竞品分析。不是「堆关键词」而是「让搜索引擎和用户都觉得好」。"},
{level:1,difficulty:"中阶",scenario:"场景：你的运营文案经常出现「品牌调性不一致」：有人写得很随意、有人写得太正式。",q:"AI辅助建立品牌内容调性指南？",opts:["A. 三步调性：(1)AI分析品牌历史内容→提取品牌语言DNA（词汇/句式/语气/禁用词） (2)AI生成品牌内容调性指南→含各种场景的写法示例 (3)AI实时检查新内容是否符合调性→不符合的自动提示修改建议", "B. 老板统一审核所有文案", "C. 每个人凭感觉写", "D. 固定几个模板", "E. 参考大品牌的风格"],scores:[4, 0, 0, 0, 0],best:0,explain:"品牌调性=DNA提取+指南生成+实时检查。不是「大家注意分寸」而是「AI帮你守住品牌的语言边界」。"},
{level:2,difficulty:"高阶",scenario:"场景：作为内容运营负责人，你要建立「AI增强内容策略」→不止让AI辅助写，而是让AI驱动整个内容战略。",q:"AI驱动内容战略的设计？",opts:["A. 五环战略：(1)「数据洞察」→AI分析用户需求→发现内容缺口 (2)「选题策略」→AI基于缺口+趋势推荐内容方向 (3)「内容生产」→AI辅助+人注入判断力 (4)「智能分发」→AI个性化推荐到对的渠道对的时间 (5)「效果闭环」→AI分析内容效果→反哺选题和创作→内容飞轮", "B. 增加内容产出量", "C. 让AI写更多内容", "D. 聚焦在爆款内容上", "E. 每个渠道都做内容"],scores:[4, 0, 0, 0, 0],best:0,explain:"内容战略=洞察+选题+生产+分发+闭环五环。不是「多写内容」而是「AI让内容战略形成自增强飞轮」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要评估AI生成内容的真实价值：AI写100篇vs人写10篇，哪个对业务贡献更大？",q:"AI生成内容vs人工创作的价值衡量？",opts:["A. 四维衡量：(1)「覆盖度」→AI可以覆盖长尾场景人工做不了 (2)「质量」→AI内容需要人工注入洞察才有灵魂 (3)「效率」→AI提效但人需判断和优化 (4)「策略」→AI做广度覆盖+人工做深度爆款=最大化内容价值", "B. AI内容质量不如人工", "C. 优先保证人工内容质量", "D. 用AI内容补量", "E. 对AI内容做人工加工"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI vs人工=覆盖度+质量+效率+策略。不是「AI替代人写」而是「AI写广度+人写深度=最佳内容矩阵」。"},
{level:2,difficulty:"高阶",scenario:"场景：你的内容团队出现「AI依赖症」：离开AI写不出东西、AI生成什么就用什么不再思考。",q:"如何建立健康的人机内容协作模式？",opts:["A. 四步健康模式：(1)「先人后AI」→人先思考方向和核心观点→AI辅助展开 (2)「必改原则」→AI生成的内容必须有人的修改才算完成 (3)「AI营养标签」→标注内容中AI参与的部分→透明化 (4)「创意训练」→定期关闭AI做纯人工创作→保持创意肌肉", "B. 限制AI使用频率", "C. 只让高级运营用AI", "D. 加强人工审核", "E. 这是过渡阶段不用管"],scores:[4, 0, 0, 0, 0],best:0,explain:"人机协作=先人后AI+必改原则+透明标注+创意训练。不是「用不用AI」而是「AI是你的副驾驶不是自动驾驶」。"},
{level:2,difficulty:"高阶",scenario:"场景：AI生成的运营内容越来越多，用户开始分不清是人写的还是AI写的，信任度下降。",q:"AI内容时代的信任建立策略？",opts:["A. 四步信任：(1)「透明原则」→明确标注AI参与方式 (2)「人味注入」→在AI内容中保留人的案例/故事/观点 (3)「价值优先」→AI内容必须有独立价值（独到分析/整理/对比） (4)「质量门槛」→AI内容也要符合「如果是人写的会发吗」的标准", "B. 不告诉用户内容是AI生成的", "C. 减少AI生成内容", "D. 只让AI生成功能性内容", "E. 等用户习惯就好"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI信任=透明+人味+价值+质量。不是「藏着掖着」而是「让用户知道并接受AI是你的助手」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要用AI建立「内容智能工厂」→需求进来→AI自动选题/生成/审核/分发/追踪→人只需做关键决策。",q:"AI内容智能工厂的架构设计？",opts:["A. 五层工厂：(1)「需求层」→运营提自然语言需求 (2)「创作层」→AI多模型协作生成内容 (3)「审核层」→AI+人双重审核质量/合规/调性 (4)「分发层」→AI自动多渠道分发+个性化推荐 (5)「学习层」→AI分析每个内容的效果→持续优化创作模型", "B. 建一个内容生产流水线", "C. 让团队更高效使用AI", "D. 买AI内容工具", "E. 做一个AI内容助手"],scores:[4, 0, 0, 0, 0],best:0,explain:"内容工厂=需求+创作+审核+分发+学习五层。不是「AI帮忙写」而是「AI驱动的端到端内容生产线」。"}
],

{level:0,difficulty:"初阶",scenario:"场景：你需要做一个简单的活动H5页面（抽奖/转盘），但没有开发资源，排期要2周。",q:"运营如何用AI自己做活动页面？",opts:["A. 三步自建：(1)描述活动需求→AI生成HTML/CSS/JS代码 (2)AI配置抽奖逻辑+奖品库存管理 (3)AI生成数据埋点→部署到活动平台→测试后上线", "B. 等开发排期", "C. 用第三方活动工具", "D. 简化活动不需要H5", "E. 找外包做"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI自建页面=描述需求+生成代码+配置部署。运营也能在AI帮助下「不写一行代码」做出活动页。"},
{level:0,difficulty:"初阶",scenario:"场景：运营后台需要导出用户列表并给特定标签的用户发Push。这个操作每周要做5次只能手动。",q:"AI辅助运营后台自动化脚本？",opts:["A. 三步自动化：(1)描述「我要导出标签X的用户并群发Push」→AI生成脚本 (2)AI连接后台API→自动化执行 (3)AI设置定时任务→每周自动执行+结果通知", "B. 每次都手动操作", "C. 请开发写导出工具", "D. 减少群发频率", "E. 用Excel手动筛选"],scores:[4, 0, 0, 0, 0],best:0,explain:"后台自动化=需求描述+API脚本+定时任务。运营的重复操作交给AI脚本，每周省3小时。"},
{level:0,difficulty:"初阶",scenario:"场景：你的运营数据在多个系统中，每周需要手动把数据汇总到一个Excel。操作繁琐且容易出错。",q:"AI辅助数据自动化汇总？",opts:["A. 三步汇总：(1)AI识别各系统的数据API/导出格式 (2)AI生成数据汇总脚本→自动拉取+清洗+合并 (3)AI生成汇总报告→含可视化图表→定时自动执行", "B. 继续手动汇总", "C. 让实习生做", "D. 只汇总核心数据", "E. 找人写SQL查询"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据汇总=API识别+自动化脚本+可视化。AI让运营远离「Ctrl+C Ctrl+V」厄运。"},
{level:0,difficulty:"初阶",scenario:"场景：你策划的活动需要根据用户数据动态展示不同内容。你跟开发沟通需求经常理解错。",q:"AI辅助运营与开发的需求沟通？",opts:["A. 三步沟通：(1)AI把运营需求翻译为技术语言→含功能描述+数据字段+交互逻辑 (2)AI生成需求原型图+交互流程→开发一看就懂 (3)AI预判技术风险→标注可能的技术难点→提前对齐", "B. 写详细的需求文档", "C. 画流程图让开发看", "D. 面对面反复沟通", "E. 给几个竞品页面参考"],scores:[4, 0, 0, 0, 0],best:0,explain:"需求沟通=技术翻译+原型+风险预判。AI做运营和开发之间的「翻译官」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要持续优化App内的运营位（Banner/弹窗/浮层），但每次改动都要开发排期2周。",q:"AI+低代码实现运营位自主配置？",opts:["A. 三步自主：(1)AI设计运营位配置后台→运营可自主调整内容/样式/规则 (2)AI生成配置平台的代码→含预览和AB测试能力 (3)AI接入数据看板→运营可实时看到每个运营位的效果→自助优化", "B. 提前做好所有可能的配置", "C. 每次找开发改", "D. 减少运营位数量", "E. 用第三方SDK"],scores:[4, 0, 0, 0, 0],best:0,explain:"运营位自主=配置后台+预览AB测试+数据看板。让运营从「求开发改」变成「自己就能调」。"},
{level:1,difficulty:"中阶",scenario:"场景：你的运营活动需要对接多个系统（用户系统/支付/物流/优惠券），技术复杂度高。",q:"AI辅助运营活动的技术方案设计？",opts:["A. 三步方案：(1)AI分析活动需求→拆解为技术模块和接口清单 (2)AI设计系统交互流程→标注各模块的对接方式和异常处理 (3)AI评估开发工作量和技术风险→生成可执行的技术方案", "B. 让开发评估工作量", "C. 找技术Leader设计方案", "D. 参考上次活动的架构", "E. 减少对接系统"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术方案=需求拆解+接口设计+风险评估。AI让运营也能理解技术复杂度，合理管理预期。"},
{level:1,difficulty:"中阶",scenario:"场景：你管理的小程序/H5活动页出现线上Bug（按钮点不了/数据不更新），你需要快速定位问题。",q:"AI辅助运营活动Bug快速定位？",opts:["A. 三步定位：(1)把Bug描述+截图+报错信息给AI→AI分析可能的原因 (2)AI检查代码逻辑→定位Bug所在行 (3)AI生成修复方案→含验证步骤→确认后部署", "B. 找开发紧急修复", "C. 重启服务试试", "D. 回退到上一个版本", "E. 先用备用方案"],scores:[4, 0, 0, 0, 0],best:0,explain:"Bug定位=多信息分析+代码定位+修复方案。AI帮你把「开发说修不了」变成「AI告诉你问题在哪」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为运营团队建立「无代码/低代码」能力→让运营人员自建简单的运营工具。",q:"AI辅助运营团队低代码能力建设？",opts:["A. 四步建设：(1)「需求识别」→AI分析运营日常重复工作→找到适合低代码化的场景 (2)「工具选型」→AI推荐合适的低代码平台 (3)「模板建设」→AI生成常用运营工具模板库 (4)「赋能培训」→AI生成针对运营的培训材料→运营也能建工具", "B. 让开发建好所有工具", "C. 招一个会低代码的运营", "D. 培训运营学编程", "E. 只建最常用的几个工具"],scores:[4, 0, 0, 0, 0],best:0,explain:"低代码建设=需求识别+工具选型+模板库+赋能。不是「让运营学编程」而是「让运营能自己解决问题」。"},
{level:2,difficulty:"高阶",scenario:"场景：作为运营产品负责人，你要规划「运营技术平台」的技术架构→支撑全公司运营团队。",q:"运营技术平台的架构设计？",opts:["A. 五层平台：(1)「数据平台」→CDP+数据仓库+实时计算 (2)「能力平台」→AI能力/消息通道/规则引擎 (3)「业务平台」→活动/优惠券/会员/积分等业务系统 (4)「运营工作台」→统一运营操作界面 (5)「开放平台」→API化→业务线可自助接入", "B. 买市面上的运营平台", "C. 每个业务系统独立建设", "D. 基于开源项目搭建", "E. 先建最核心的再扩展"],scores:[4, 0, 0, 0, 0],best:0,explain:"运营平台=数据+能力+业务+工作台+开放五层。不是「一个系统」而是「支撑运营的数字基础设施」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要评估「AI是否能替代运营后台开发」→运营提需求，AI生成代码，运营自己上线？",q:"AI替代运营后台开发的可行性？",opts:["A. 四层可行性：(1)「简单页面」→AI可直接生成（活动页/数据看板/表单）→完全可以 (2)「中等复杂度」→AI生成+人工审核（含复杂逻辑/多系统对接）→可以但要Review (3)「高复杂度」→需要人工主导设计AI辅助编码→不能替代 (4)「策略」→AI让运营80%的简单需求自助化→开发聚焦复杂需求", "B. 运营后台很简单AI完全可以替代", "C. 运营后台很复杂AI替代不了", "D. 看具体需求复杂度", "E. 让AI生成开发Review"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI替代开发=分级可行性+策略。不是「能vs不能」而是「简单需求AI+运营自助，复杂需求开发主导」。"},
{level:2,difficulty:"高阶",scenario:"场景：运营活动经常出现高并发流量冲击（秒杀/抢券/大促），系统需要抗住10x流量。",q:"AI辅助运营活动高并发方案？",opts:["A. 四步高并发：(1)AI分析历史流量数据→预测本次活动峰值 (2)AI设计扩容方案→含CDN/缓存/限流/降级策略 (3)AI生成压测脚本→模拟真实流量 (4)AI监控实时流量→自动触发弹性扩容→防系统崩溃", "B. 提前多加服务器", "C. 用云厂商的弹性扩容", "D. 限制参与人数", "E. 参考上次大促方案"],scores:[4, 0, 0, 0, 0],best:0,explain:"高并发=预测+扩容+压测+实时监控。不是「多买服务器」而是「精准预估+自动弹性」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计运营系统的「可观测性」→不只是看系统有没有挂，而是看运营效果是否正常。",q:"AI驱动的运营系统可观测性？",opts:["A. 四层观测：(1)「技术指标」→响应时间/错误率/吞吐量 (2)「业务指标」→活动参与率/转化率/客单价 (3)「AI异常检测」→AI自动发现指标异常模式 (4)「智能报警」→不是所有异常都报警→AI判断是否值得关注", "B. 加监控大盘", "C. 配置告警规则", "D. 出现问题时排查", "E. 看核心业务指标就行"],scores:[4, 0, 0, 0, 0],best:0,explain:"可观测性=技术+业务+AI异常+智能报警。不是「加监控」而是「让AI帮你区分信号和噪音」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要建立运营系统的「灰度发布」能力→新功能/新活动先给5%用户，确认没问题再全量。",q:"AI驱动的运营灰度发布体系？",opts:["A. 四步灰度：(1)「用户分桶」→AI按用户特征均匀分桶确保统计有效性 (2)「自动对比」→AI实时对比灰度组和对照组的核心指标 (3)「自动决策」→AI判断灰度效果→通过/延长/回滚 (4)「经验积累」→每次灰度数据沉淀→下次灰度更快更准", "B. 找一批种子用户先试", "C. 小流量放出去看看效果", "D. 按地域灰度", "E. 不做灰度直接全量"],scores:[4, 0, 0, 0, 0],best:0,explain:"灰度发布=分桶+自动对比+自动决策+经验积累。不是「先放一点看看」而是「AI帮你科学地验证再全量」。"}

{level:0,difficulty:"初阶",scenario:"场景：你负责的每周运营数据报告要发给部门总监。之前都是手动整理2小时。",q:"AI自动化运营周报？",opts:["A. 三步自动化：(1)AI连接数据源自动拉取本周数据 (2)AI生成周报模板→自动填充数据+环比+异常标注 (3)你Review补充策略解读→5分钟完成", "B. 继续手动整理", "C. 减少周报内容", "D. 让BI帮忙出", "E. 改成双周报"],scores:[4, 0, 0, 0, 0],best:0,explain:"运营周报=自动拉取+模板填充+异常标注。2小时→5分钟。"},
{level:0,difficulty:"初阶",scenario:"场景：运营团队每天开10分钟站会，但效率低：有人讲太久、有人不知道说什么。",q:"AI优化运营团队站会？",opts:["A. 三步优化：(1)AI生成站会模板（昨日成果/今日计划/帮助需求→每人1分钟） (2)会前AI自动汇总各渠道昨日数据 (3)AI记录会议要点→自动生成TODO和负责人", "B. 取消站会", "C. 改成隔天站会", "D. 只核心成员参加", "E. 让大家发日报替代"],scores:[4, 0, 0, 0, 0],best:0,explain:"站会优化=模板+数据汇总+自动纪要。10分钟站会，高效不废话。"},

{level:0,difficulty:"初阶",scenario:"场景：运营活动上线后发现效果不及预期。需要快速决策：继续优化还是及时止损。",q:"AI辅助运营活动实时决策？",opts:["A. 三步决策：(1)AI实时分析活动数据→对比预期目标 (2)AI标注偏离最大的环节（曝光不足/点击率低/转化率低） (3)AI生成「继续优化」和「及时止损」两种方案的成本和预期→你决策", "B. 再观察几天", "C. 加大投放试试", "D. 马上停止", "E. 按原计划继续"],scores:[4, 0, 0, 0, 0],best:0,explain:"实时决策=数据对比+偏离定位+双方案。不是「凭感觉」而是「用数据辅助决策」。"},
{level:1,difficulty:"中阶",scenario:"场景：你管理着5个运营渠道（Push/短信/公众号/社群/企微），每个渠道独立运营不通气。",q:"AI协调多渠道运营工作流？",opts:["A. 三步协同：(1)AI建立统一运营日历→各渠道活动互相可见 (2)AI检测渠道间冲突→避免同一天对同一用户多次触达 (3)AI分析渠道协同效果→推荐最佳渠道组合", "B. 各渠道独立运营", "C. 统一一个渠道", "D. 减少渠道数量", "E. 每周对齐一次"],scores:[4, 0, 0, 0, 0],best:0,explain:"多渠道协同=统一日历+冲突检测+组合优化。不是「渠道越多越好」而是「1+1>2」。"},
{level:1,difficulty:"中阶",scenario:"场景：运营团队经常被临时需求打断（老板说做个活动/产品要推新功能）。计划内的项目延后。",q:"AI辅助运营需求优先级管理？",opts:["A. 三步管理：(1)AI评估每个需求的预期价值和紧急程度→生成优先级矩阵 (2)AI分析现有资源和排期→评估插入新需求的影响 (3)AI生成建议：哪个做/哪个推迟/哪个拒绝→供决策", "B. 谁急先做谁的", "C. 按提交时间排队", "D. 老板的需求优先", "E. 砍掉计划内项目做临时的"],scores:[4, 0, 0, 0, 0],best:0,explain:"优先级管理=价值评估+影响分析+决策建议。不是「谁声音大听谁」而是「什么对用户最有价值」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为运营团队建立SOP（标准操作流程）：活动上线/内容发布/数据复盘。",q:"AI辅助建立运营SOP？",opts:["A. 三步SOP：(1)AI分析历史优秀案例→提取最佳实践和关键步骤 (2)AI生成SOP文档→含Checklist/时间节点/责任人/异常处理 (3)AI生成SOP的执行检查工具→确保每次都按流程走", "B. 口头告诉大家怎么做", "C. 每个人自己写SOP", "D. 参考行业SOP模板", "E. 让最有经验的人写"],scores:[4, 0, 0, 0, 0],best:0,explain:"SOP建立=最佳实践提取+文档生成+执行检查。好SOP让新人也能做出老手的效果。"},
{level:1,difficulty:"中阶",scenario:"场景：运营团队扩到15人，沟通成本急剧上升：信息失真/重复工作/互相等待。",q:"AI优化运营团队沟通协作？",opts:["A. 三步优化：(1)AI分析团队沟通记录→找出信息断点和重复沟通 (2)AI建立信息同步机制→关键决策自动推送相关人员 (3)AI生成团队协作看板→每个人清楚进度", "B. 减少开会", "C. 用更好的协作工具", "D. 分组管理", "E. 多招小组长"],scores:[4, 0, 0, 0, 0],best:0,explain:"协作优化=沟通分析+信息同步+协作看板。靠「记得告诉谁」不行，靠「系统自动告知」。"},
{level:2,difficulty:"高阶",scenario:"场景：作为运营负责人，你要为30人团队设计「AI增强运营工作流」→AI嵌入日常运营每个环节。",q:"AI增强运营工作流的整体设计？",opts:["A. 五环工作流：(1)「洞察环」→AI自动发现机会 (2)「策略环」→AI推荐策略→人决策 (3)「执行环」→AI辅助内容/触达→人Review (4)「监控环」→AI实时监控→异常告警 (5)「复盘环」→AI自动复盘→人注入经验", "B. 每个环节加AI工具", "C. 先做AI辅助内容生产", "D. 引入AI决策支持", "E. 参考最佳实践推进"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI工作流=洞察+策略+执行+监控+复盘五环。AI不是某个环节的工具而是贯穿全流程的增强系统。"},
{level:2,difficulty:"高阶",scenario:"场景：运营团队和产品/技术之间经常「甩锅」：运营说功能不好用、产品说运营不会推。",q:"AI打破运营-产品-技术部门墙？",opts:["A. 三步破墙：(1)AI建立跨部门数据看板→三方看同一组数据 (2)AI将运营反馈自动翻译为产品需求 (3)AI自动追踪需求从提出到上线的全流程", "B. 多开跨部门会议", "C. 建立联合KPI", "D. 轮岗交流", "E. 老大出面协调"],scores:[4, 0, 0, 0, 0],best:0,explain:"跨部门协作=统一数据+自动翻译+透明追踪。部门墙的根源是信息不对称，AI打破壁垒。"},
{level:2,difficulty:"高阶",scenario:"场景：你要建立「运营实验文化」→每个运营动作都当作实验，有假设/验证/复盘。",q:"AI驱动运营实验文化建设？",opts:["A. 三步建文化：(1)「实验框架」→AI设计运营实验模板 (2)「实验结果」→AI自动分析→标注显著性 (3)「知识沉淀」→AI结构化存储实验结果→形成运营知识库", "B. 要求每次活动做复盘", "C. 引入AB测试工具", "D. 分享成功案例", "E. 设定实验KPI"],scores:[4, 0, 0, 0, 0],best:0,explain:"实验文化=框架+自动分析+知识沉淀。不是「多做AB测试」而是「每次行动都是一次学习」。"},
{level:2,difficulty:"高阶",scenario:"场景：你管理的运营预算500万/年，需要最大化投入产出。之前主要靠经验和历史数据分配。",q:"AI优化运营预算分配？",opts:["A. 三步优化：(1)AI分析历史各渠道/活动ROI→建立预算效率模型 (2)AI模拟不同分配方案效果 (3)AI动态调整→根据实时效果转移预算", "B. 按去年比例分配", "C. 集中在最有效的渠道", "D. 各渠道平均分配", "E. 按GMV贡献分配"],scores:[4, 0, 0, 0, 0],best:0,explain:"预算优化=效率模型+方案模拟+动态调整。每一分钱都花在回报最高的地方。"},
{level:2,difficulty:"高阶",scenario:"场景：你要为运营团队建立「知识管理体系」→防止人员流动导致经验流失。",q:"AI驱动的运营知识管理？",opts:["A. 四层知识：(1)「自动捕获」→AI从复盘/周报提取知识 (2)「结构化」→AI分类为案例库/方法论库/避坑库 (3)「智能检索」→自然语言搜索 (4)「主动推送」→做类似活动时AI推荐相关知识", "B. 让大家写Wiki", "C. 定期做经验分享", "D. 离职时必须交接", "E. 建共享文档库"],scores:[4, 0, 0, 0, 0],best:0,explain:"知识管理=自动捕获+结构化+智能检索+主动推送。不是「人写文档」而是「系统自动沉淀」。"}
],
security: [
{level:0,difficulty:"初阶",scenario:"场景：你在用公共AI写活动文案时不小心把用户真实姓名和手机号贴进去了。",q:"运营中数据安全基本规则？",opts:["A. 三条铁律：(1)绝不把用户个人数据输入公共AI (2)敏感数据脱敏后再用AI (3)建立数据分级制度→什么数据能用什么AI有明确规则", "B. 用的时候注意就行", "C. 只用企业版AI", "D. 不在AI里写数据", "E. 这是小事"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据安全铁律=不泄露+脱敏+分级。一次疏忽可能导致数据泄露和法律风险。"},
{level:0,difficulty:"初阶",scenario:"场景：活动中要做抽奖需用户授权手机号。需确保合规。",q:"运营活动中的数据合规要点？",opts:["A. 三步合规：(1)明确告知数据用途→用户主动同意 (2)数据最小化→只收集活动必需信息 (3)活动后告知用户数据是否删除→提供删除渠道", "B. 加上隐私政策链接", "C. 参考竞品做法", "D. 让法务审核", "E. 同意注册协议就默认可用"],scores:[4, 0, 0, 0, 0],best:0,explain:"活动合规=告知+最小化+可删除。用户需知道自己给了什么、为什么给、怎么收回。"},
{level:0,difficulty:"初阶",scenario:"场景：裂变活动被人利用漏洞刷了10万假用户。活动数据失真。",q:"AI辅助运营活动防刷？",opts:["A. 三步防刷：(1)AI定义正常用户行为→识别异常模式 (2)AI设风控规则→自动拦截 (3)AI实时监控→发现新刷量手段自动更新规则", "B. 活动后清理假数据", "C. 限制参与次数", "D. 不做裂变活动", "E. 人工审核"],scores:[4, 0, 0, 0, 0],best:0,explain:"活动防刷=模式识别+自动拦截+动态更新。好活动不怕人参与，怕被人「玩坏」。"},
{level:0,difficulty:"初阶",scenario:"场景：你想把活动用户数据用于精准营销。但不确定是否合规。",q:"用户数据的二次使用边界？",opts:["A. 三个边界：(1)只能在用户同意范围内使用 (2)新使用目的需重新获取同意 (3)共享第三方需明确告知→不确定时咨询法务", "B. 都是公司数据随便用", "C. 不泄露给外部就行", "D. 脱敏后可用", "E. 活动说明写了就行"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据二次使用=范围限制+重新同意+第三方告知。用户允许A不等于允许B。"},
{level:1,difficulty:"中阶",scenario:"场景：你的运营团队在使用AI工具，但公司没有AI使用安全规范。需建立。",q:"运营团队AI使用安全规范？",opts:["A. 三层规范：(1)「数据分级」→哪些不能输入AI (2)「工具分级」→公共AI能做什么/企业AI能做什么 (3)「审查机制」→AI内容发布前需检查什么", "B. 禁止使用公共AI", "C. 口头提醒", "D. 每人自己判断", "E. 参考互联网公司规范"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI安全规范=数据分级+工具分级+审查机制。知道什么能做、什么不能做。"},
{level:1,difficulty:"中阶",scenario:"场景：AI生成的文案「编造」了不存在的用户案例和虚假数据。",q:"AI生成内容的真实性审查？",opts:["A. 三步审查：(1)标注为「AI辅助生成」 (2)涉及事实/数据的内容→必须人工核验 (3)建立「AI内容审查Checklist」", "B. 不用AI写涉及事实的内容", "C. 相信AI内容", "D. 让同事看看", "E. AI内容不直接用"],scores:[4, 0, 0, 0, 0],best:0,explain:"内容审查=标注+核验+Checklist。AI会「编造」看起来很真的假信息。"},
{level:1,difficulty:"中阶",scenario:"场景：运营活动要用用户数据做个性化推荐。数据存在多个系统，权限管理混乱。",q:"运营数据权限管理方案？",opts:["A. 三步权限：(1)「最小权限」→每人只能访问必需数据 (2)「操作审计」→所有访问留痕 (3)「定期审查」→AI自动检查异常访问", "B. 所有人都有权限", "C. 按级别分配", "D. 用系统默认权限", "E. 需要时申请"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据权限=最小权限+操作审计+定期审查。不是「信任谁」而是「不需要就不给」。"},
{level:1,difficulty:"中阶",scenario:"场景：社群运营在朋友圈发了含用户订单截图的「战报」，虽打码但能看出部分信息。",q:"运营内容发布的隐私风险？",opts:["A. 三步防泄露：(1)建立「发布前审查清单」 (2)AI自动扫描待发布内容敏感信息 (3)团队隐私意识培训", "B. 打码就没事", "C. 提醒注意", "D. 不在朋友圈发", "E. 做事后检查"],scores:[4, 0, 0, 0, 0],best:0,explain:"发布审查=清单+AI扫描+意识培训。打码不等于安全，碎片能拼出完整画像。"},
{level:2,difficulty:"高阶",scenario:"场景：作为运营负责人，你要建立「运营数据安全体系」→覆盖收集/存储/使用/共享/删除全生命周期。",q:"运营数据安全体系的整体设计？",opts:["A. 五阶段安全：(1)「收集」→明确告知+最小化+同意 (2)「存储」→加密+权限+备份 (3)「使用」→脱敏+审批+审计 (4)「共享」→第三方评估+加密传输+合同约束 (5)「删除」→用户可请求删除+彻底清除验证", "B. 制定安全制度", "C. 使用加密技术", "D. 限制数据访问", "E. 定期安全检查"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据安全体系=全生命周期保护。数据从来到走的每一步都有保障。"},
{level:2,difficulty:"高阶",scenario:"场景：团队有人把公司内部数据（用户画像/活动策略/营收）发给外部合作伙伴但未经审批。",q:"运营数据外发的安全管理？",opts:["A. 三层管控：(1)「分级制度」→公开/内部/机密/绝密 (2)「审批流程」→机密以上需审批 (3)「技术管控」→DLP+AI监控异常外发", "B. 口头警告", "C. 禁止数据外发", "D. 签保密协议", "E. 只信任核心员工"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据外发=分级+审批+技术管控。制度+技术双重保障。"},
{level:2,difficulty:"高阶",scenario:"场景：公司要引入AI运营平台（供应商可访问部分数据）。如何评估第三方数据安全？",q:"第三方AI工具的数据安全评估？",opts:["A. 四步评估：(1)审查数据处理协议→确认数据不用于训练模型 (2)评估数据流向→确保不出境 (3)测试数据删除→确认能彻底删除 (4)建立持续监控→定期审查合规状态", "B. 选大厂的AI工具", "C. 签保密协议", "D. 只给脱敏数据", "E. 不做评估直接用"],scores:[4, 0, 0, 0, 0],best:0,explain:"第三方评估=协议审查+流向+删除验证+持续监控。不能「信任供应商」要「验证供应商」。"},
{level:2,difficulty:"高阶",scenario:"场景：AI生成的营销文案涉嫌虚假宣传（夸大产品效果）。",q:"AI生成内容的合规风险管控？",opts:["A. 三层管控：(1)「规则层」→建立AI内容合规规则库 (2)「审查层」→AI自动检查违规 (3)「审批层」→高风险内容须人工审批", "B. 不用AI生成营销内容", "C. 让人审核所有AI内容", "D. 只生成非营销内容", "E. AI生成后法务审核"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI内容合规=规则库+自动审查+人工审批。AI写的内容需过合规检查。"},
{level:2,difficulty:"高阶",scenario:"场景：作为运营VP，你需要向董事会证明运营数据安全可控。需建立量化度量体系。",q:"运营数据安全的量化度量？",opts:["A. 四维度量：(1)「防护度」→加密覆盖率/权限执行率 (2)「检测度」→异常发现时间/告警准确率 (3)「响应度」→泄露事件发现和响应时间 (4)「合规度」→审计通过次数和问题数→安全仪表盘", "B. 做一次安全审计", "C. 看有没有出事", "D. 对标行业标准", "E. 请外部安全评估"],scores:[4, 0, 0, 0, 0],best:0,explain:"安全度量=防护+检测+响应+合规四维。不是「感觉很安全」而是「数据证明安全」。"}

{level:0,difficulty:"初阶",scenario:"场景：CEO宣布：公司今年最重要战略是「AI赋能业务增长」。作为运营，你需提出AI如何赋能运营的方案。",q:"如何构建运营团队的AI战略叙事？",opts:["A. 三步叙事：(1)「现状分析」→量化当前运营瓶颈（重复工作/人效/响应速度） (2)「AI杠杆」→标注AI最能产生10x效果的3个环节 (3)「价值故事」→用具体案例展示AI如何提升运营效率+质量", "B. 就说AI能让运营更高效", "C. 列出AI能做的所有事", "D. 等公司出了战略再跟进", "E. 参考大厂AI实践"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI战略叙事=现状量化+AI杠杆+价值故事。不是「AI能做什么」而是「AI能帮我们解决什么」。"},
{level:0,difficulty:"初阶",scenario:"场景：团队Leader问：用AI工具3个月了，你觉得AI改变了什么？",q:"AI对运营角色本质的改变？",opts:["A. 三个本质改变：(1)「时间分配」→从70%执行+30%思考→30%执行+70%策略思考 (2)「技能重心」→核心竞争力从「文案能力」变为「策略设计和数据洞察」 (3)「产出形态」→从「交付内容」变为「交付增长」", "B. 写文案更快了", "C. 少做了很多重复工作", "D. 不用记那么多工具操作", "E. 可以一个人做更多事"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI改变运营本质=时间分配+技能重心+产出形态。AI不是让运营失业，是让运营升级为增长策略师。"},
{level:0,difficulty:"初阶",scenario:"场景：HR VP找到你说：想在运营团队推行AI技能认证，你觉得该怎么做？",q:"运营团队AI技能认证建议框架？",opts:["A. 四层认证：(1)L1-AI运营用户→能使用AI工具完成日常任务 (2)L2-AI运营专家→能设计Prompt和AI工作流 (3)L3-AI运营策略师→能用AI制定运营策略 (4)L4-AI运营领导者→能制定运营AI战略", "B. 做个AI使用考试", "C. 看谁能用好ChatGPT", "D. 按Prompt写得好不好评级", "E. 跟大厂对齐"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI认证=用户→专家→策略师→领导者四级。认证不是为了分级而是让人看到成长路径。"},
{level:0,difficulty:"初阶",scenario:"场景：新运营VP问：我们运营团队AI时代的核心竞争力应该是什么？",q:"AI时代运营团队的核心竞争力？",opts:["A. 三个竞争力：(1)「策略定义力」→AI能做执行但人定义「做什么策略」 (2)「用户洞察力」→AI能分析数据但人洞察「用户真正要什么」 (3)「增长判断力」→AI能优化指标但人知道「什么增长是健康的」", "B. 会用最新AI工具", "C. 快速上手任何新渠道", "D. 全栈运营能力", "E. 更多运营经验"],scores:[4, 0, 0, 0, 0],best:0,explain:"核心竞争力=策略+洞察+判断。AI能做很多但「决定做什么」永远是人。"},
{level:1,difficulty:"中阶",scenario:"场景：作为运营总监，你需为下一年制定运营团队AI技术路线图。",q:"AI时代运营技术路线图设计？",opts:["A. 四维路线图：(1)「工具」→AI工具选型+企业版vs开源 (2)「能力」→团队AI技能分级培养 (3)「流程」→AI嵌入运营流程的里程碑 (4)「组织」→AI Champion角色+组织调整→季度KPI", "B. 买最新AI工具", "C. 跟随行业趋势", "D. 现有路线图加AI任务", "E. 各团队自己定"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI路线图=工具+能力+流程+组织。不是「要用AI」而是「要成为什么样的AI运营团队」。"},
{level:1,difficulty:"中阶",scenario:"场景：团队里有人担心AI会取代岗位，工作积极性下降。你需正面回应。",q:"如何用AI重塑团队价值而非取代？",opts:["A. 三步重塑：(1)「透明沟通」→AI是增强工具非替代品 (2)「新价值定位」→帮每人找到AI时代的独特价值 (3)「成长赋能」→从「做运营的人」转型为「用AI做增长的人」", "B. 告诉大家AI不会取代人", "C. 等自然淘汰", "D. 提供AI培训", "E. 强调公司稳定性"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI焦虑=透明沟通+新价值定位+成长赋能。不是「你不会被取代」而是「你会变成更值钱的人」。"},
{level:1,difficulty:"中阶",scenario:"场景：你需向CFO申请AI运营工具预算，但CFO觉得ROI不清晰。",q:"如何量化AI运营工具的ROI？",opts:["A. 四维ROI：(1)「效率」→AI节省的人天×日薪 (2)「效果」→AI带来的增量GMV/转化率 (3)「质量」→减少的运营事故成本 (4)「人才」→降低的招聘成本+提升的留存", "B. 按效率提升计算", "C. 对标行业ROI", "D. 先投一年看效果", "E. 强调不投的风险"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI ROI=效率+效果+质量+人才。不是「值不值得投」而是「不投会损失多少」。"},
{level:1,difficulty:"中阶",scenario:"场景：你需在公司战略会上争取运营成为「AI转型先行部门」。如何论证？",q:"如何论证运营应成为AI转型先行部门？",opts:["A. 三个论证：(1)「高频需求」→运营日常重复性工作占比最高→AI提效最明显 (2)「快速验证」→运营AI效果可快速量化→为其他部门树立标杆 (3)「直接价值」→运营AI直接贡献用户增长和收入→ROI最快体现", "B. 运营是接触用户最多的部门", "C. 运营团队最愿意用AI", "D. 运营数据最多适合AI", "E. 竞争对手已经在做"],scores:[4, 0, 0, 0, 0],best:0,explain:"先行部门论证=高频+快速验证+直接价值。运营是最适合做AI转型试验田的部门。"},

{level:2,difficulty:"高阶",scenario:"场景：你发现AI工具在运营团队中出现「马太效应」：好的人更好，差的人更差。",q:"如何防止AI加大运营团队能力差距？",opts:["A. 四步均衡：(1)「基础补强」→对AI效果差的人提供基础能力培训 (2)「分级辅助」→不同水平提供不同层级AI辅助 (3)「Peer Learning」→建立AI使用经验分享机制 (4)「能力度量」→以产出质量和效率为准", "B. 限制高手用AI", "C. 给新手更多AI帮助", "D. 统一AI使用方式", "E. 这是正常现象不用管"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI能力差距=基础补强+分级辅助+经验共享+能力度量。AI是放大器，管理者的责任是提高下限。"},

{level:2,difficulty:"高阶",scenario:"场景：你要为未来3年运营组织设计「AI原生」架构。",q:"AI原生运营组织的架构设计？",opts:["A. 四层架构：(1)「AI平台团队」→建设内部AI运营平台 (2)「AI赋能团队」→嵌入各业务线的AI运营专家 (3)「角色升级」→运营→AI运营/内容→AI内容策略师 (4)「新角色」→Prompt工程师/AI运营工作流设计师→「金字塔」变「能力网络」", "B. 加一个AI部门", "C. 现有组织加AI培训", "D. 外包AI能力", "E. 等需要时再调"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI原生组织=平台团队+Champion+角色升级+新角色。不是加AI部门而是让AI渗透每个角色。"}

    {level:2,difficulty:"高阶",scenario:"向CEO证明AI销售系统ROI，需量化投资回报模型。",q:"AI销售系统的ROI量化框架？",opts:["A. 五维：(1)「效率」→人均跟进客户数提升×人均产值 (2)「转化」→赢单率提升带来的增量收入 (3)「周期」→销售周期缩短带来的现金流改善 (4)「成本」→减少的低效线索跟进成本 (5)「人才」→新人上手时间缩短+团队稳定性", "B. 看AI工具花了多少钱", "C. 对比用AI前后销售额", "D. 估算节省的工时", "E. 等一年后再看数据"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI销售ROI=效率+转化+周期+成本+人才。Sales的ROI必须用收入增量来证明。"},
    {level:2,difficulty:"高阶",scenario:"设计销售团队「AI-Native」能力模型：传统销售到AI增强销售的进化路径。",q:"销售团队AI能力成长路径？",opts:["A. 五级：(1)L1-AI认知者→了解AI能帮销售做什么 (2)L2-AI使用者→能用AI做拜访准备和话术 (3)L3-AI增强者→人机协同完成复杂销售 (4)L4-AI策略者→用AI制定大客户和竞争策略 (5)L5-AI领导者→用AI管理组织和制定战略", "B. 全员参加AI培训", "C. 用AI工具使用频率考核", "D. 只培训Top Sales", "E. 让销售自己摸索"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI能力=认知→使用→增强→策略→领导五级。不是被替代，是升级为AI增强的超级销售。"},
    {level:2,difficulty:"高阶",scenario:"AI Agent时代：AI能自主完成部分销售工作。如何设计人机分工？",q:"AI Agent销售人机分工设计？",opts:["A. 四层：(1)「AI自主区」→线索筛选/基础问答/会议安排→AI独立完成 (2)「AI辅助区」→需求分析/方案定制→AI生成+人审核 (3)「人机协作区」→大客户策略/谈判→人主导+AI支持 (4)「人独占区」→高层关系/危机处理→纯人完成", "B. 让AI全权负责", "C. 销售全靠人", "D. AI只做数据整理", "E. AI做初级销售人做高级"],scores:[4, 0, 0, 0, 0],best:0,explain:"人机分工=AI自主+辅助+协作+人独占。AI做它能做好的，人做只有人能做的。"},
    {level:2,difficulty:"高阶",scenario:"搭建「销售知识大脑」：汇聚Top Sales经验、话术、案例→新人快速复制。",q:"AI销售知识管理系统设计？",opts:["A. 四层：(1)「自动捕获」→从通话/邮件/CRM提取最佳实践 (2)「结构化」→分类为话术库/案例库/竞品库 (3)「智能推荐」→见客户前自动推荐相关知识包 (4)「持续进化」→分析高成交行为模式→自动更新", "B. 让Top Sales写文档", "C. 定期经验分享会", "D. 建共享文件夹", "E. 离职时交接"],scores:[4, 0, 0, 0, 0],best:0,explain:"知识管理=自动捕获+结构化+智能推荐+进化。不是人写文档，而是系统自动沉淀和进化。"}

  tools: [
    {level:0,difficulty:"初阶",scenario:"从LinkedIn/行业报告中找到某行业Top50潜在客户联系方式和关键信息。",q:"AI工具组合方案？",opts:["A. 三工具协同：(1)AI搜索行业报告→提取Top企业名单 (2)AI分析企业官网/年报→提取业务重点和需求 (3)结合CRM→生成潜在客户优先级排序和首次触达策略", "B. 手动在LinkedIn搜索", "C. 买企业名录", "D. 广撒网群发邮件", "E. 等市场部给线索"],scores:[4, 0, 1, 0, 0],best:0,explain:"潜客挖掘=行业扫描+需求分析+优先级排序。从盲目扫街到精准打击。"},
    {level:0,difficulty:"初阶",scenario:"为每次客户拜访做记录和下一步行动，目前靠脑子记+Excel+微信。",q:"AI辅助CRM工具使用？",opts:["A. 三步：(1)AI语音转写会议录音→自动提取决策人/预算/时间线/竞品 (2)自动填写CRM字段 (3)生成下一步行动建议+定时提醒→你只需Review", "B. 继续用Excel", "C. 让助理录入", "D. 手动写纪要", "E. 只记重要客户"],scores:[4, 0, 0, 1, 0],best:0,explain:"CRM使用=自动记录+智能填写+行动建议。AI帮你填，销售把时间花在客户身上。"},
    {level:0,difficulty:"初阶",scenario:"调研新行业的客户痛点，准备进入这个行业。",q:"AI辅助行业调研工具？",opts:["A. 三步：(1)AI搜索行业研报/新闻→提炼趋势和痛点 (2)分析典型企业问题和需求 (3)生成行业进入策略：目标客户画像+切入场景+竞品布局→输出调研报告", "B. 看几篇行业新闻", "C. 问行业内的人", "D. 买行业报告", "E. 凭感觉判断"],scores:[4, 0, 0, 1, 0],best:0,explain:"行业调研=研报分析+需求提炼+进入策略。AI让你一周内成为半个行业专家。"},
    {level:0,difficulty:"初阶",scenario:"要在多渠道(邮件/LinkedIn/微信/电话)触达客户，需批量和个性化。",q:"AI辅助多渠道销售工具选择？",opts:["A. 三步：(1)分析目标客群和触达场景→推荐工具组合 (2)对比各工具个性化能力和集成能力 (3)设计工具使用流程→从线索获取到首次触达到跟进", "B. 所有渠道手动", "C. 只用一个渠道", "D. 买最贵的工具", "E. 每个都试试"],scores:[4, 0, 0, 0, 0],best:0,explain:"工具选型=场景分析+能力对比+流程设计。好工具让一个销售同时运营5个渠道。"},
    {level:1,difficulty:"中阶",scenario:"评估Salesforce AI vs HubSpot AI vs 国内销售AI工具，需要系统选型。",q:"AI销售平台选型框架？",opts:["A. 五维：(1)「场景覆盖」→从线索到成交覆盖度 (2)「AI成熟度」→预测/推荐/自动化能力 (3)「集成能力」→与CRM/ERP/企微对接 (4)「数据安全」→客户数据处理方式 (5)「ROI」→预期赢单率提升×客单价→输出选型矩阵", "B. 选市场占有率最高", "C. 选最便宜", "D. 让IT部门决定", "E. 看同行用什么"],scores:[4, 0, 0, 0, 0],best:0,explain:"平台选型=场景+AI+集成+安全+ROI五维。选最适合你们销售模式的，不是选最好的。"},
    {level:1,difficulty:"中阶",scenario:"销售工具太多(CRM/邮件/企微/飞书/钉钉/会议/合同)，数据不互通。",q:"AI辅助销售工具整合？",opts:["A. 三步：(1)分析工具间数据流转→画出数据孤岛地图 (2)推荐整合方案→API对接/Zapier/统一工作台 (3)设计「销售工作台」→一个界面看到所有客户信息和下一步行动", "B. 减少工具数量", "C. 用一个全家桶", "D. 各用各的", "E. 手动复制粘贴"],scores:[4, 0, 0, 0, 0],best:0,explain:"工具整合=数据地图+整合方案+统一工作台。不要让销售在5个系统间切换。"},
    {level:1,difficulty:"中阶",scenario:"为销售团队引入「AI销售教练」：AI分析通话给改进建议。",q:"AI销售教练的选型和落地？",opts:["A. 四步：(1)先选3个销售试用2周→对比通话转化率 (2)明确录音知情同意和数据安全 (3)正向引导→建议聚焦「怎么做更好」而非「你做错了」 (4)收集采纳率和反馈→持续迭代", "B. 全员强制使用", "C. 只给新人用", "D. 买了直接用", "E. 让销售自己决定"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI销售教练=效果验证+隐私+正向引导+持续优化。关键是让销售觉得AI帮我，不是监控我。"},
    {level:1,difficulty:"中阶",scenario:"建立「销售技术栈」：选哪些AI工具、怎么组合、怎么培训。",q:"销售AI技术栈规划？",opts:["A. 四层：(1)「基础层」→CRM+沟通工具 (2)「增强层」→AI话术/智能推荐/会议纪要 (3)「数据层」→客户360视图+销售分析+预测 (4)「自动化层」→线索分配/跟进提醒/合同生成→分层渐进", "B. 一次性买齐", "C. 先买最便宜的", "D. 每人选自己喜欢的", "E. 等AI成熟再说"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术栈=基础+增强+数据+自动化。不是一次性全上，而是分层渐进的工程。"},
    {level:2,difficulty:"高阶",scenario:"作为销售VP，搭建整个销售组织的「AI技术底座」。",q:"销售AI技术架构设计？",opts:["A. 五层：(1)「数据平台层」→CDP+销售数据湖 (2)「AI引擎层」→预测+推荐+对话AI (3)「能力平台层」→AI获客/话术/教练/预测 (4)「应用层」→销售工作台+管理看板+移动端 (5)「集成层」→与CRM/ERP/飞书API对接", "B. 买销售AI全家桶", "C. 基于开源自建", "D. 用云厂商AI服务", "E. 先搭最核心的"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术架构=数据+引擎+能力+应用+集成。不是买个工具，是构建数字销售基础设施。"},
    {level:2,difficulty:"高阶",scenario:"评估自研vs外购销售AI平台的长期决策。",q:"自研vs外购的战略决策？",opts:["A. 五维：(1)「差异化」→自研能否形成独特销售壁垒 (2)「成本」→3-5年TCO对比 (3)「数据主权」→客户数据必须自主控制 (4)「迭代」→外购能否跟上AI发展 (5)「路径」→先外购验证→关键能力逐步自研→混合模式", "B. 外购省心", "C. 自研更有控制力", "D. 看大公司怎么选", "E. 先用外购两年"],scores:[4, 0, 0, 0, 0],best:0,explain:"自研vs外购=差异化+成本+数据主权+迭代+路径。销售数据是核心资产，数据主权重于一切。"},
    {level:2,difficulty:"高阶",scenario:"销售AI工具越来越多(话术/教练/预测/获客)，团队出现工具疲劳。",q:"如何整合碎片化销售AI工具？",opts:["A. 三步：(1)「去重分析」→AI分析功能重叠度→剔除冗余 (2)「核心选型」→确定最小AI工具集覆盖全流程 (3)「统一入口」→建立AI工作台→一个界面完成所有AI操作", "B. 只用最核心3个", "C. 强制淘汰旧工具", "D. 每人自己选", "E. 自己开发统一平台"],scores:[4, 0, 0, 0, 0],best:0,explain:"工具整合=去重+选型+统一入口。工具越多销售越痛苦，AI工作台是解法。"},
    {level:2,difficulty:"高阶",scenario:"为AI销售工具建立效果评估体系：哪些真正提升了赢单率。",q:"AI销售工具持续评估框架？",opts:["A. 四维：(1)「使用率」→销售实际使用频率和深度 (2)「赢单贡献」→使用前后赢单率变化 (3)「效率提升」→销售周期缩短+人均产出 (4)「满意度」→NPS评分→建立工具健康度仪表盘+定期淘汰", "B. 看工具使用数据", "C. 问销售好不好用", "D. 看投入产出比", "E. 每年评估一次"],scores:[4, 0, 0, 0, 0],best:0,explain:"工具评估=使用率+赢单贡献+效率+满意度。持续衡量每块钱的AI工具是否带来了赢单。"},
    {level:2,difficulty:"高阶",scenario:"向CFO申请800万销售AI预算，需ROI证明。",q:"如何用数据说服CFO投资？",opts:["A. 四步：(1)「现状量化」→人均客户数/赢单率/周期/新人上手时间 (2)「收益模型」→赢单率X%提升→增量收入Y (3)「ROI时间表」→6/12/24个月回收路径 (4)「对标」→行业领先公司AI销售投入产出", "B. 强调不投会被淘汰", "C. 先小预算试点", "D. 请CEO推动", "E. 找咨询公司出报告"],scores:[4, 0, 0, 0, 0],best:0,explain:"说服CFO=现状量化+收益模型+ROI+对标。CFO听得懂「800万投入带来3000万增量收入」。"}

  data: [
    {level:0,difficulty:"初阶",scenario:"手上有半年销售数据：线索量/转化率/客单价/成交周期/丢单原因，需找漏斗瓶颈。",q:"AI分析方案？",opts:["A. 上传数据→描述销售流程→AI分析：(1)各阶段转化率漏斗 (2)丢单归类和高频丢单节点 (3)高转化销售行为特征 (4)输出瓶颈节点+改进建议+预期提升", "B. 凭感觉判断", "C. 只看总成交额", "D. 每人自己分析", "E. 增加线索量试"],scores:[4, 0, 0, 0, 1],best:0,explain:"漏斗分析=阶段转化+丢因归类+行为特征。找到最好的销售在做哪些不同的事。"},
    {level:0,difficulty:"初阶",scenario:"做客户分层：哪些客户值得重点投入，哪些标准化维护。",q:"AI辅助客户分层和资源分配？",opts:["A. 三步：(1)基于历史数据建立价值评分模型(客单价/赢单概率/LTV) (2)分S/A/B/C四级 (3)每级推荐策略→S级总监亲跟+定制；C级标准化+AI辅助", "B. 按公司规模分", "C. 同样对待", "D. 看销售自己判断", "E. 按最近成交金额分"],scores:[4, 0, 0, 0, 0],best:0,explain:"客户分层=价值评分+分级+差异化。有限资源投给最有价值客户。"},
    {level:0,difficulty:"初阶",scenario:"预测本季度销售额，为管理层汇报准备。",q:"AI辅助销售预测？",opts:["A. 三步：(1)分析历史同期数据和当前Pipeline (2)标注高风险商机(停滞/竞品/决策人变化) (3)输出预测范围(乐观/基准/悲观)+每个商机成单概率", "B. 让销售报各自预测", "C. 按去年同期拍", "D. Pipeline金额加总", "E. 不做预测等季度结束"],scores:[4, 0, 0, 0, 0],best:0,explain:"销售预测=Pipeline分析+风险标注+概率区间。每个商机有多少概率成交，不是拍脑袋。"},
    {level:0,difficulty:"初阶",scenario:"分析丢单原因：上季度丢了30个商机，需提炼模式和教训。",q:"AI辅助丢单分析？",opts:["A. 三步：(1)分析丢单记录→归类(价格/功能/关系/时机/竞品) (2)标注高频丢单模式和关键节点 (3)生成改进建议→每种丢单的应对策略→形成「丢单防御手册」", "B. 大概总结原因", "C. 只关注大单", "D. 让销售自己复盘", "E. 不做这类型客户"],scores:[4, 0, 0, 0, 0],best:0,explain:"丢单分析=归类+模式+策略。不可怕，可怕的是每次都丢在同一个地方。"},
    {level:1,difficulty:"中阶",scenario:"做区域销售分析：华东vs华南vs华北，各区域特征和策略差异。",q:"AI辅助区域销售分析？",opts:["A. 三步：(1)分析各区域客户特征/赢单率/客单价/产品偏好 (2)标注独特销售模式和最佳实践 (3)生成区域策略建议→资源分配/目标/差异化策略", "B. 各区域自己分析", "C. 按销售额分配资源", "D. 全国统一策略", "E. 只关注差区域"],scores:[4, 0, 0, 0, 0],best:0,explain:"区域分析=特征+模式+策略。不同区域客户不一样，销售策略也应有差异。"},
    {level:1,difficulty:"中阶",scenario:"建立「销售数据看板」→实时反映团队销售状态和预警。",q:"AI辅助销售数据看板？",opts:["A. 四层：(1)「CEO视图」→总收入/增速/人效 (2)「VP视图」→Pipeline健康度/预测/区域对比 (3)「经理视图」→团队排名/商机进度/风险 (4)「销售视图」→我的Pipeline/下一步/完成率→AI自动预警", "B. 做Excel汇总", "C. 用CRM自带", "D. 只看总销售额", "E. 每周邮件汇总"],scores:[4, 0, 0, 0, 0],best:0,explain:"看板=四级视图+自动预警。不同角色看需要的数据，AI在问题出现前预警。"},
    {level:1,difficulty:"中阶",scenario:"分析「什么销售行为最可能导致成交」→提炼最佳实践。",q:"AI辅助销售行为分析？",opts:["A. 三步：(1)对比高/低成交销售行为(拜访频率/沟通方式/跟进节奏/方案质量) (2)识别与高成交强相关的行为模式 (3)生成「最佳行为手册」→让每个人复制Top Sales工作方式", "B. 问Top Sales", "C. 凭经验总结", "D. 看行业最佳实践", "E. 让经理观察"],scores:[4, 0, 0, 0, 0],best:0,explain:"行为分析=对比+模式+可复制化。好销售不一定能说清自己为什么好，AI能从数据中找到答案。"},
    {level:1,difficulty:"中阶",scenario:"做跨产品线交叉销售分析：买了A产品的客户还可能需要B和C。",q:"AI辅助交叉销售分析？",opts:["A. 三步：(1)分析历史购买数据→发现产品关联模式 (2)按客户画像推荐交叉销售组合 (3)生成交叉销售话术→「基于你在用A，建议考虑B因为...」", "B. 看到机会就推", "C. 所有客户推所有产品", "D. 等客户提需求", "E. 只推主产品"],scores:[4, 0, 0, 0, 0],best:0,explain:"交叉销售=关联分析+组合推荐+话术。基于数据的自然延伸，不是硬推。"},
    {level:2,difficulty:"高阶",scenario:"作为销售数据负责人，从0搭建「销售数据体系」→数据驱动决策。",q:"销售数据体系顶层设计？",opts:["A. 五层：(1)「采集层」→CRM/通话/邮件/会议全渠道接入 (2)「存储层」→销售数据仓库 (3)「计算层」→实时+离线计算 (4)「服务层」→统一API+看板 (5)「应用层」→AI销售决策→预测/推荐/预警", "B. 买BI系统", "C. 用CRM自带", "D. 让数据团队出报告", "E. 每人自己看"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据体系=采集+存储+计算+服务+应用。数据不只用来看的，是驱动决策的。"},
    {level:2,difficulty:"高阶",scenario:"销售预测准确率不高，CEO说：你的预测和实际差30%。",q:"AI提升销售预测准确率？",opts:["A. 四步：(1)分析历史预测偏差→找系统性偏差模式 (2)引入更多预测因子(行为数据/竞品/宏观) (3)建概率预测模型→输出概率分布而非单点 (4)持续跟踪预测vs实际→自动校准", "B. 让销售报更保守", "C. 多看几个类似项目", "D. 把预测权收归总部", "E. CEO要准就别预测"],scores:[4, 0, 0, 0, 0],best:0,explain:"预测准确率=偏差分析+多因子+概率模型+校准。不是预测更准，而是知道预测有多不准。"},
    {level:2,difficulty:"高阶",scenario:"建立「销售数据治理」体系：数据不准→预测不准→决策失误。",q:"销售数据治理核心抓手？",opts:["A. 四层：(1)「录入规范」→AI辅助CRM填写→减少人工错误 (2)「自动校验」→AI检查异常数据(不合理的close date/金额) (3)「审计追踪」→所有变更留痕 (4)「质量度量」→完整率/准确率仪表盘挂钩KPI", "B. 强制销售填完整", "C. 定期数据清洗", "D. 让数据团队管", "E. 数据不准不影响"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据治理=录入规范+校验+审计+度量。垃圾数据进→垃圾预测出。"},
    {level:2,difficulty:"高阶",scenario:"用数据驱动销售团队的日常决策，而非靠经验。",q:"如何建立数据驱动销售文化？",opts:["A. 四步：(1)「数据透明」→所有人都能看到自己数据和对标 (2)「决策数据化」→每个决策有数据支撑 (3)「AI辅助」→分析时提供建议 (4)「激励机制」→数据驱动行为计入考核→文化变革", "B. 每天看数据报表", "C. 培训数据思维", "D. 让分析师帮销售", "E. KPI和数据挂钩"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据驱动文化=透明+决策数据化+AI辅助+激励。不是看数据，是用数据做每个决定。"},
    {level:2,difficulty:"高阶",scenario:"设计「销售数据产品」→把数据能力封装为销售日常使用的工具。",q:"销售数据产品设计原则？",opts:["A. 五层：(1)「数据底座」→统一数据定义和口径 (2)「AI分析」→自动发现异常和机会 (3)「场景化」→每个场景有对应数据视图 (4)「行动建议」→不只展示数据，推荐下一步 (5)「反馈闭环」→结果回流→持续优化", "B. 做大屏给领导看", "C. 让销售自己查", "D. 买BI工具", "E. 先做数据采集"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据产品=底座+AI分析+场景化+行动建议+闭环。销售不缺数据，缺「下一步做什么」。"}
  ],
  content: [
    {level:0,difficulty:"初阶",scenario:"写冷启动开发信(Cold Email)给制造业CIO，过去打开率只有5%。",q:"AI辅助冷启动邮件？",opts:["A. 三步：(1)给AI客户背景→生成个性化开场无模板味 (2)生成「价值钩子」→一句话说明为什么值得读 (3)生成3版不同风格邮件→A/B测试打开率", "B. 用通用模板改名字", "C. 写很长很详细", "D. 重点介绍公司背景", "E. 直接推销产品"],scores:[4, 0, 0, 0, 0],best:0,explain:"冷启动邮件=个性化+价值钩子+A/B测试。AI让你从5%打开率提升到20%+。"},
    {level:0,difficulty:"初阶",scenario:"制作产品介绍PPT在客户面前演示，不是设计师做出来的很丑。",q:"AI辅助销售PPT？",opts:["A. 三步：(1)给AI卖点和痛点→生成PPT大纲 (2)为每章节生成文案+配图建议 (3)优化排版和视觉风格→输出可直接演示的PPT", "B. 用公司模板填内容", "C. 让市场部做", "D. 文字内容为主", "E. 外包给设计公司"],scores:[4, 0, 0, 0, 0],best:0,explain:"销售PPT=大纲+文案+排版优化。AI让非设计师也能做出专业演示。"},
    {level:0,difficulty:"初阶",scenario:"写结案复盘(Post-Mortem)，项目做完客户不满意，需专业总结和挽回。",q:"AI辅助销售结案复盘？",opts:["A. 三步：(1)分析项目全过程数据→标注关键决策和转折点 (2)生成复盘报告→成功经验/失败教训/改进建议 (3)生成给客户的「价值总结信」→强调已交付价值和下一步合作方向", "B. 大概写经验教训", "C. 只写成功经验", "D. 让项目经理写", "E. 不写复盘做下个"],scores:[4, 0, 0, 0, 0],best:0,explain:"结案复盘=全过程分析+结构化+客户价值总结。能把不满意客户变成下一单起点。"},
    {level:0,difficulty:"初阶",scenario:"写微信/企微日常客户跟进，每次写得很生硬客户不回。",q:"AI辅助客户跟进消息？",opts:["A. 三步：(1)分析客户关系阶段和上次内容→生成上下文连贯消息 (2)提供3种语气选择(正式/轻松/紧迫) (3)生成「下一步行动引导」→不说「在吗」而是「建议周三讨论X，您方便吗？」", "B. 发「在吗」", "C. 复制上次消息", "D. 只发产品资料", "E. 不跟进等回复"],scores:[4, 0, 0, 0, 0],best:0,explain:"跟进消息=上下文+语气适配+行动引导。从「在吗」变成「有价值地推动下一步」。"},
    {level:0,difficulty:"初阶",scenario:"需要为不同行业客户定制案例研究(Case Study)，展示同行业成功故事。",q:"AI辅助销售案例定制？",opts:["A. 三步：(1)AI从内部项目库匹配同行业案例→提取关键数据 (2)AI生成定制版案例→含该行业独特挑战+解决过程+量化成果 (3)AI调整案例角度→对准客户的行业痛点→增强说服力", "B. 用通用案例不管行业", "C. 让客户自己看案例", "D. 只讲技术案例", "E. 没有同行业案例就跳过"],scores:[4, 0, 0, 0, 0],best:0,explain:"案例定制=行业匹配+关键数据+角度调整。同行业案例的说服力是通用案例的5倍。"},
    {level:1,difficulty:"中阶",scenario:"建立「销售内容库」：案例/白皮书/行业报告/客户证言，供全团队使用。",q:"AI辅助销售内容库建设？",opts:["A. 四步：(1)从过往项目提取可复用案例和素材 (2)按行业/场景/痛点分类整理 (3)生成使用指南→每个素材适合什么阶段/对什么角色 (4)持续更新→新项目结束后自动提取新素材", "B. 每人存自己的", "C. 建共享文件夹", "D. 让市场部做", "E. 手动整理"],scores:[4, 0, 0, 0, 0],best:0,explain:"内容库=提取+分类+使用指南+持续更新。让新人也用Top Sales的弹药。"},
    {level:1,difficulty:"中阶",scenario:"为客户写定制化解决方案提案，50页需要3天。",q:"AI加速定制化提案？",opts:["A. 五步：(1)分析客户RFP→提取关键需求和评分标准 (2)生成提案大纲→每个需求有对应章节 (3)生成初稿→你注入行业洞察和差异化 (4)优化排版可视化 (5)生成执行摘要→决策层30秒读懂核心价值", "B. 用通用模板改", "C. 重点写技术部分", "D. 让方案团队写", "E. 熬夜3天手写"],scores:[4, 0, 0, 0, 0],best:0,explain:"定制提案=需求分析+大纲+初稿+排版+摘要。AI把3天压缩到1天，质量更高。"},
    {level:1,difficulty:"中阶",scenario:"销售团队微信/企微沟通质量参差不齐，需建立社交销售内容规范。",q:"AI辅助社交销售内容策略？",opts:["A. 三步：(1)分析高互动内容特征→提取「爆款基因」 (2)生成内容日历→每日/每周发什么 (3)生成模板库→早安/行业洞察/案例/产品更新→专业且有人情味", "B. 不发社交内容私聊", "C. 每天转发行业文章", "D. 让每人随心发", "E. 只发公司官方内容"],scores:[4, 0, 0, 0, 0],best:0,explain:"社交销售=特征分析+日历+模板库。社交是个人品牌放大器，不是广告牌。"},
    {level:1,difficulty:"中阶",scenario:"做在线研讨会(Webinar)获客：设计主题/邀请嘉宾/推广/跟进全流程。",q:"AI辅助研讨会全流程？",opts:["A. 五步：(1)分析目标客群痛点→推荐研讨会主题 (2)生成邀请嘉宾名单和话术 (3)生成推广文案和多渠道分发计划 (4)实时分析互动→标注高意向潜客 (5)生成会后跟进邮件→分层触达", "B. 选热门主题", "C. 重点做推广邀约", "D. 让市场部做", "E. 做完就结束"],scores:[4, 0, 0, 0, 0],best:0,explain:"研讨会=主题+邀约+推广+实时分析+跟进。不是办一场活动，是获客+培育全链路。"},
    {level:2,difficulty:"高阶",scenario:"作为销售赋能负责人，建立「AI驱动内容引擎」→持续生产高质量销售内容。",q:"AI驱动销售内容引擎设计？",opts:["A. 五层：(1)「洞察层」→AI分析市场趋势和痛点→发现内容缺口 (2)「生产层」→AI辅助生成各类销售内容 (3)「个性化层」→根据收件人定制 (4)「分发层」→选择最佳渠道和时机 (5)「优化层」→分析效果→持续迭代", "B. 让市场部统一生产", "C. 每人自己写", "D. 买内容外包", "E. 复用过往内容"],scores:[4, 0, 0, 0, 0],best:0,explain:"内容引擎=洞察+生产+个性化+分发+优化。让对的人在对的时间看到对的内容。"},
    {level:2,difficulty:"高阶",scenario:"衡量销售内容营销ROI。内容团队说产出100个线索但销售说质量不高。",q:"销售内容营销ROI衡量？",opts:["A. 五维：(1)「线索质量」→内容线索赢单率和客单价 vs 其他渠道 (2)「销售效率」→有内容支持后周期缩短 (3)「品牌」→曝光带来的品牌搜索量增加 (4)「成本」→生产 vs 外购成本 (5)「归因」→多触点归因→综合ROI", "B. 数线索数量", "C. 看阅读量", "D. 问销售满不满意", "E. 不做内容做广告"],scores:[4, 0, 0, 0, 0],best:0,explain:"内容ROI=线索质量+效率+品牌+成本+归因。不是多少阅读量，是多少收入。"},
    {level:2,difficulty:"高阶",scenario:"建立「销售叙事能力」：用故事而非功能列表来销售。",q:"AI辅助销售叙事(Storytelling)？",opts:["A. 四步：(1)从成功案例提取叙事模板→问题→挣扎→方案→成果 (2)生成叙事练习场景 (3)AI实时反馈→标注哪里打动人/哪里枯燥 (4)建叙事素材库→每个行业/场景有对应故事", "B. 让销售背案例", "C. 培训公众演讲", "D. 只讲功能", "E. 讲故事太虚"],scores:[4, 0, 0, 0, 0],best:0,explain:"销售叙事=模板+练习+反馈+素材库。人们忘记功能但记住故事。AI让每个销售讲出打动人心的故事。"},
    {level:2,difficulty:"高阶",scenario:"为销售团队建立「思想领导力」(Thought Leadership)内容体系。",q:"销售思想领导力建设？",opts:["A. 四层：(1)「议题设置」→AI分析趋势→提出独特观点 (2)「内容生产」→AI辅助生成观点文章/白皮书/演讲 (3)「多渠道分发」→AI选渠道和时机 (4)「影响力度量」→追踪带来的商机和品牌提升", "B. 让销售多发朋友圈", "C. 写几篇行业文章", "D. 让CEO当思想领袖", "E. 不需要做"],scores:[4, 0, 0, 0, 0],best:0,explain:"思想领导力=议题+内容+分发+度量。客户觉得你懂行业比懂产品更多时，销售就变容易了。"},
    {level:2,difficulty:"高阶",scenario:"AI生成高质量销售内容，但客户能「感觉」是AI写的，信任度下降。",q:"如何平衡AI内容和人情味？",opts:["A. 四步：(1)「AI打底+人注入灵魂」→AI结构初稿→人加真实故事和观点 (2)「透明标注」→明确告知AI参与部分 (3)「个性化layer」→针对具体客户做定制修改 (4)「人情味检查」→检测内容是否过于完美缺乏人性", "B. 不用AI写客户内容", "C. AI写了人不改", "D. 客户不会发现", "E. AI写得和人一样好"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI+人情味=AI打底+人注入灵魂+透明+个性化。客户买的不是完美内容，是和你这个人的信任关系。"}

  dev: [
    {level:0,difficulty:"初阶",scenario:"给客户做简单ROI计算器(Excel版)，不擅长Excel公式。",q:"AI辅助销售工具自制？",opts:["A. 三步：(1)描述计算逻辑→AI生成Excel公式或Google Sheets脚本 (2)生成使用说明→客户能自己用 (3)优化界面→让计算器看起来专业", "B. 让售前工程师做", "C. 用通用ROI模板", "D. 不做口头算", "E. 让客户自己算"],scores:[4, 0, 0, 0, 0],best:0,explain:"销售工具自制=描述逻辑+AI生成+优化界面。AI让销售也能做简单的客户工具。"},
    {level:0,difficulty:"初阶",scenario:"做客户拜访记录模板，每次拜访后填写方便团队共享。",q:"AI辅助销售文档模板？",opts:["A. 三步：(1)给AI拜访场景和目标→生成结构化记录模板 (2)生成使用指南→什么信息必须记录 (3)生成自动化版本→部分字段可从邮件/日历自动填充", "B. 用Word随便记", "C. 让助理设计", "D. 发会议纪要", "E. 不记录靠脑子"],scores:[4, 0, 0, 0, 0],best:0,explain:"销售模板=场景分析+结构化+自动化。让每次拜访信息都可复用。"},
    {level:0,difficulty:"初阶",scenario:"CRM有重复性操作(每周导出数据/批量更新商机阶段)，想自动化但不写代码。",q:"AI辅助销售流程自动化？",opts:["A. 三步：(1)描述重复操→AI推荐无代码工具(Zapier/Make/飞书) (2)生成自动化配置→按步骤设置 (3)生成异常处理规则→自动化失败时通知", "B. 继续手动", "C. 让IT部门做", "D. 减少重复操作", "E. 招自动化工程师"],scores:[4, 0, 0, 0, 0],best:0,explain:"销售自动化=描述+工具推荐+配置+异常处理。无代码时代，销售也能自动化自己的工作。"},
    {level:0,difficulty:"初阶",scenario:"客户要求看产品Demo环境，需快速搭建面向客户的演示环境。",q:"AI辅助Demo环境准备？",opts:["A. 三步：(1)给AI客户场景→推荐演示数据和环境配置 (2)生成演示脚本→一步步引导体验核心价值 (3)生成常见问题预案→提前准备客户可能问的", "B. 用生产环境演示", "C. 让售前搭建", "D. 只做PPT", "E. 让客户看视频"],scores:[4, 0, 0, 0, 0],best:0,explain:"Demo环境=配置+脚本+问题预案。好Demo是设计出来的，不是临场发挥。"},
    {level:0,difficulty:"初阶",scenario:"客户问你们产品API是否支持特定集成场景，你不懂技术术语。",q:"AI辅助销售应对技术对话？",opts:["A. 三步：(1)把客户技术问题给AI→AI翻译为你能懂的业务语言 (2)AI检索产品文档→找到对应功能或差距 (3)AI生成回复→既诚实又有建设性→不说不支持，说我们如何解决", "B. 让售前回答", "C. 说需要确认", "D. 说自己不懂技术", "E. 胡乱应答"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术对话=翻译+检索+建设性回复。AI是销售和技术之间的「翻译官」。"},
    {level:1,difficulty:"中阶",scenario:"为销售团队建立「报价和合同生成系统」，目前靠Word手动改。",q:"AI辅助报价/合同自动化？",opts:["A. 四步：(1)分析历史报价/合同→提取模板和变量 (2)生成智能报价配置器→输入参数自动生成报价 (3)生成合同风险检查→标注非常规条款 (4)生成审批流→不同金额自动走不同路径", "B. 继续用Word改", "C. 让法务做模板", "D. 外包第三方", "E. 只做标准报价"],scores:[4, 0, 0, 0, 0],best:0,explain:"报价合同=模板+配置器+风险检查+审批流。从2天缩短到10分钟。"},
    {level:1,difficulty:"中阶",scenario:"产品有API，客户需要技术集成。你得懂一点API才能和客户技术对话。",q:"AI辅助销售学技术(API/集成)？",opts:["A. 三步：(1)给AI产品API文档→生成「销售版API指南」不含代码只概念场景 (2)模拟客户技术团队提问→练习回答 (3)生成常见集成场景话术→能接住技术讨论", "B. 让售前负责技术", "C. 学编程", "D. 只看API文档", "E. 说我们不懂技术"],scores:[4, 0, 0, 0, 0],best:0,explain:"销售学技术=概念化+模拟+话术。不是变工程师，是能和技术买家对话。"},
    {level:1,difficulty:"中阶",scenario:"引进「AI销售助手」帮销售写邮件/做方案时实时获取信息。",q:"AI销售助手选型和落地？",opts:["A. 四步：(1)「需求分析」→分析销售日常高频信息需求 (2)「工具选型」→对比Copilot/文心/通义→选最适合 (3)「知识库建设」→产品文档/案例/竞品结构化供检索 (4)「培训」→生成使用场景卡片→真实场景学习", "B. 直接买Copilot", "C. 每人自己找工具", "D. 小范围试点", "E. 不需要助手"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI助手=需求+选型+知识库+培训。工具买到≠用起来，知识库是成败关键。"},
    {level:1,difficulty:"中阶",scenario:"做简单客户portal(登录查看进度/下载资料)，没开发资源。",q:"AI辅助销售自建客户门户？",opts:["A. 三步：(1)描述需求→AI推荐无代码工具(Glide/Bubble/飞书) (2)生成应用配置→按步骤搭建 (3)生成客户使用指南→快速上手", "B. 让IT部门做", "C. 不做门户", "D. 用微信发资料", "E. 外包开发"],scores:[4, 0, 0, 0, 0],best:0,explain:"客户门户=描述+无代码搭建+使用指南。无代码时代，销售也能搭建简单应用。"},
    {level:2,difficulty:"高阶",scenario:"作为销售技术负责人，规划「销售技术栈」3年路线图。",q:"销售技术栈规划框架？",opts:["A. 四层：(1)「现状评估」→评估当前技术使用成熟度和痛点 (2)「能力地图」→销售全流程能力需求→哪些可技术增强 (3)「路线图」→Year1基础/Year2增强/Year3自主智能 (4)「治理体系」→技术选型/数据安全/效果度量", "B. 买最流行技术", "C. 跟竞争对手做", "D. 每年加新工具", "E. 不做规划按需买"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术栈=现状+能力地图+路线图+治理。不是买工具，是系统性构建销售数字能力。"},
    {level:2,difficulty:"高阶",scenario:"评估销售技术ROI：过去2年投了300万但说不清带来多少收入。",q:"销售技术ROI评估框架？",opts:["A. 五维：(1)「效率」→销售人均产出提升 (2)「转化率」→技术赋能后赢单率变化 (3)「周期」→缩短带来的现金流改善 (4)「人才」→新人上手时间/流失率 (5)「体验」→NPS/CSAT提升→综合ROI模型", "B. 看销售额增长", "C. 算节省人力", "D. 和技术投入前对比", "E. ROI说不清"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术ROI=效率+转化+周期+人才+体验。不是花了多少钱，是带来了多少钱。"},
    {level:2,difficulty:"高阶",scenario:"销售团队对新技术有抵触：「老方法也卖得好」「学新技术太麻烦」。",q:"如何推动团队技术采用？",opts:["A. 四步：(1)「速赢示范」→选2-3人用新技术→做出成果→标杆效应 (2)「降低门槛」→AI生成3分钟上手指南 (3)「激励」→技术使用率挂钩业绩 (4)「陪伴支持」→AI陪伴式教练→真实场景学习", "B. 强制要求使用", "C. 多做培训", "D. 等老销售淘汰", "E. 不推按需使用"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术采用=速赢+低门槛+激励+陪伴。销售是实用主义者，看到效果才改变行为。"},
    {level:2,difficulty:"高阶",scenario:"AI销售工具数据分散各处，需建立「销售数据平台」统一管理。",q:"销售数据平台架构？",opts:["A. 五层：(1)「采集层」→各工具API对接 (2)「存储层」→销售数据湖 (3)「清洗层」→AI自动清洗标准化 (4)「服务层」→统一API供调用 (5)「应用层」→360视图/预测/推荐", "B. 手动导出", "C. 各工具各自存", "D. 买数据平台", "E. 先做采集"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据平台=采集+存储+清洗+服务+应用。数据散落10个工具里，价值无法释放。"},
    {level:2,difficulty:"高阶",scenario:"作为销售VP，制定「销售数字化转型」战略。",q:"销售数字化转型战略框架？",opts:["A. 五层：(1)「文化转型」→经验驱动到数据驱动 (2)「流程重设」→AI重新设计流程 (3)「技术底座」→统一平台 (4)「人才升级」→AI能力培养 (5)「度量体系」→可量化转型效果→战略路线图", "B. 买AI工具", "C. 培训用AI", "D. 跟行业实践", "E. 先数字化再转型"],scores:[4, 0, 0, 0, 0],best:0,explain:"数字化=文化+流程+技术+人才+度量。不是买AI工具，是重新定义销售的工作方式。"}

  workflow: [
    {level:0,difficulty:"初阶",scenario:"每天处理几十封客户邮件和微信，经常漏回复或回复不及时。",q:"AI辅助销售沟通管理？",opts:["A. 三步：(1)自动分类消息优先级→紧急/重要/常规 (2)生成回复草稿→你Review发送 (3)设置跟进提醒→确保不漏任何消息", "B. 按顺序回复", "C. 只回重要客户", "D. 让助理回复", "E. 不回复不重要的"],scores:[4, 0, 0, 0, 0],best:0,explain:"沟通管理=分类+草稿+提醒。AI让销售从被消息淹没到有条不紊。"},
    {level:0,difficulty:"初阶",scenario:"每天低效时间花在写日报/周报/客户跟进记录上，耽误真正销售时间。",q:"AI辅助销售日报/周报？",opts:["A. 三步：(1)AI从邮件/日历/CRM提取当天活动→自动生成日报 (2)标注关键进展和受阻商机 (3)汇总本周数据→生成周报含趋势分析", "B. 继续手写", "C. 只报流水账", "D. 让助理写", "E. 不写日报"],scores:[4, 0, 0, 0, 0],best:0,explain:"日报周报=自动提取+进展标注+趋势分析。2小时的写报告→5分钟Review。"},
    {level:0,difficulty:"初阶",scenario:"管理20+活跃商机，需要合理分配时间和优先跟进哪个。",q:"AI辅助商机优先级排序？",opts:["A. 三步：(1)AI分析每个商机的成单概率/金额/时间线→计算优先级分 (2)标注「今日必做」和「本周关键」行动 (3)动态调整→有新信息时自动重新排序", "B. 按金额排序", "C. 按最近跟进时间", "D. 按感觉走", "E. 先到先服务"],scores:[4, 0, 0, 0, 0],best:0,explain:"商机排序=概率+金额+时间线+动态调整。AI帮你把有限时间花在最可能成交的商机上。"},
    {level:0,difficulty:"初阶",scenario:"销售团队10人各有表单和流程，效率低。需建立统一SOP。",q:"AI辅助建立销售SOP？",opts:["A. 三步：(1)分析Top Sales行为→提取最佳实践和关键步骤 (2)生成SOP文档→含Checklist/时间节点/责任人 (3)生成执行检查工具→确保每次按流程走", "B. 口头告诉大家", "C. 每人自己写", "D. 参考行业模板", "E. 让最有经验的人写"],scores:[4, 0, 0, 0, 0],best:0,explain:"SOP=最佳实践提取+文档生成+执行检查。好SOP让新人做出老手的效果。"},
    {level:1,difficulty:"中阶",scenario:"管理5个销售渠道(直销/渠道/电销/在线/联盟)，各渠道独立运营不通气。",q:"AI协调多渠道销售工作流？",opts:["A. 三步：(1)建立统一销售看板→各渠道商机互相可见 (2)检测渠道冲突→同一客户被多渠道跟进时提醒 (3)分析渠道协同效果→推荐最佳渠道组合", "B. 各渠道独立", "C. 统一一个渠道", "D. 减少渠道", "E. 每周对齐一次"],scores:[4, 0, 0, 0, 0],best:0,explain:"多渠道协同=统一看板+冲突检测+组合优化。不是渠道越多越好，是1+1>2。"},
    {level:1,difficulty:"中阶",scenario:"销售团队常被临时需求打断(老板说推个东西/产品有个新功能)。计划延后。",q:"AI辅助销售优先级管理？",opts:["A. 三步：(1)评估每个需求价值和紧急度→生成优先级矩阵 (2)分析现有排期→评估插入新需求影响 (3)生成建议：哪个做/哪个推迟/哪个拒绝→供决策", "B. 谁急先做谁的", "C. 按提交时间排队", "D. 老板需求优先", "E. 砍计划内做临时"],scores:[4, 0, 0, 0, 0],best:0,explain:"优先级管理=价值评估+影响分析+决策建议。不是谁声音大听谁，是什么对收入最有价值。"},
    {level:1,difficulty:"中阶",scenario:"销售团队扩到15人，沟通成本上升：信息失真/重复工作/互相等待。",q:"AI优化销售团队协作？",opts:["A. 三步：(1)分析沟通记录→找出信息断点和重复沟通 (2)建立信息同步机制→关键决策自动推送 (3)生成协作看板→每个人清楚进度和依赖", "B. 减少开会", "C. 用更好协作工具", "D. 分组管理", "E. 多招小组长"],scores:[4, 0, 0, 0, 0],best:0,explain:"协作优化=沟通分析+同步机制+协作看板。靠「记得告诉谁」不行，靠「系统自动告知」。"},
    {level:1,difficulty:"中阶",scenario:"新销售入职后需要3-6个月才能独立，想加速上手。",q:"AI辅助销售新人培养？",opts:["A. 四步：(1)「知识导入」→AI生成产品知识+行业知识+销售方法论的学习路径 (2)「影子训练」→AI分析Top Sales通话→新人学习 (3)「实战模拟」→AI扮演客户→新人练习 (4)「反馈闭环」→AI分析新人通话→标注改进点", "B. 让老销售带", "C. 集中培训2周", "D. 看视频自学", "E. 直接上手边做边学"],scores:[4, 0, 0, 0, 0],best:0,explain:"新人培养=知识导入+影子训练+模拟+反馈。AI把3-6个月压缩到6-8周。"},
    {level:2,difficulty:"高阶",scenario:"作为销售负责人，为30人团队设计「AI增强销售工作流」→AI嵌入每个环节。",q:"AI增强销售工作流设计？",opts:["A. 五环：(1)「洞察环」→AI自动发现机会 (2)「策略环」→AI推荐策略→人决策 (3)「执行环」→AI辅助触达→人Review (4)「监控环」→AI实时监控→异常告警 (5)「复盘环」→AI自动复盘→人注入经验", "B. 每个环节加AI", "C. 先做AI辅助内容", "D. 引入决策支持", "E. 参考最佳实践"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI工作流=洞察+策略+执行+监控+复盘五环。AI不是某个环节的工具，是贯穿全流程的增强系统。"},
    {level:2,difficulty:"高阶",scenario:"销售和产品/技术常「甩锅」：销售说功能不好、产品说销售不会推。",q:"AI打破销售-产品-技术部门墙？",opts:["A. 三步：(1)建立跨部门数据看板→三方看同一组数据 (2)自动将销售反馈翻译为产品需求 (3)自动追踪需求从提出到上线的全流程", "B. 多开跨部门会议", "C. 建联合KPI", "D. 轮岗交流", "E. 老大出面协调"],scores:[4, 0, 0, 0, 0],best:0,explain:"跨部门协作=统一数据+自动翻译+透明追踪。部门墙根源是信息不对称。"},
    {level:2,difficulty:"高阶",scenario:"建立「销售实验文化」→每个销售动作都当做实验，有假设/验证/复盘。",q:"AI驱动销售实验文化？",opts:["A. 三步：(1)「实验框架」→AI设计实验模板 (2)「自动分析」→AI分析实验结果→标注显著性 (3)「知识沉淀」→AI结构化存储→形成销售知识库", "B. 要求每次做复盘", "C. 引入AB测试", "D. 分享成功案例", "E. 设实验KPI"],scores:[4, 0, 0, 0, 0],best:0,explain:"实验文化=框架+自动分析+知识沉淀。每次行动都是一次学习，持续进化。"},
    {level:2,difficulty:"高阶",scenario:"管理500万/年销售费用，需要最大化投入产出。",q:"AI优化销售预算分配？",opts:["A. 三步：(1)分析历史各渠道/活动ROI→建立预算效率模型 (2)模拟不同分配方案效果 (3)动态调整→根据实时效果转移预算", "B. 按去年比例", "C. 集中最有效渠道", "D. 各渠道平均", "E. 按GMV贡献"],scores:[4, 0, 0, 0, 0],best:0,explain:"预算优化=效率模型+模拟+动态调整。每一分钱花在回报最高的地方。"},

  security: [
    {level:0,difficulty:"初阶",scenario:"在公共AI写销售方案时不小心把客户真实信息和报价输入了。",q:"销售中数据安全基本规则？",opts:["A. 三条铁律：(1)绝不把客户个人数据输入公共AI (2)敏感数据脱敏后再用AI (3)建立数据分级→什么数据能用什么AI有明确规则", "B. 用的时候注意就行", "C. 只用企业版AI", "D. 不在AI写数据", "E. 这是小事"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据安全铁律=不泄露+脱敏+分级。一次疏忽可能导致数据泄露和法律风险。"},
    {level:0,difficulty:"初阶",scenario:"客户问竞品的价格和合同条款，能透露吗？",q:"竞品信息的合法边界？",opts:["A. 三个边界：(1)公开信息(官网/年报/新闻)→可以分析和讨论 (2)非公开信息(通过客户关系获得的竞品报价/合同)→不可以 (3)灰色地带(行业传闻/非正式渠道)→不引用→最好让法务确认", "B. 什么都能说", "C. 什么都不说", "D. 只说好的", "E. 别人都这么说"],scores:[4, 0, 0, 0, 0],best:0,explain:"竞品信息=公开可+非公开不可+灰色避。销售嘴上要有把门的。"},
    {level:0,difficulty:"初阶",scenario:"客户要求签独家协议时有排他条款，你可能不小心承诺超出权限的范围。",q:"AI辅助检查合同风险条款？",opts:["A. 三步：(1)AI扫描合同→标注非常规条款(SLA/知识产权/排他/赔偿) (2)对比公司标准模板→标注差异 (3)生成风险提示→哪些条款需要法务/管理层审批", "B. 自己看看就行", "C. 签字再说", "D. 让法务全看", "E. 相信客户"],scores:[4, 0, 0, 0, 0],best:0,explain:"合同检查=扫描+对比+风险提示。销售不该看的条款，AI帮你先标出来。"},
    {level:0,difficulty:"初阶",scenario:"AI生成销售材料时「编造」了不存在的客户案例和虚假数据。",q:"AI内容真实性审查？",opts:["A. 三步：(1)标注为「AI辅助生成」 (2)涉及事实/数据内容→必须人工核验 (3)建立「AI内容审查Checklist」→发布前检查清单", "B. 不用AI写事实内容", "C. 相信AI内容", "D. 让同事看看", "E. AI内容不直接用"],scores:[4, 0, 0, 0, 0],best:0,explain:"内容审查=标注+核验+Checklist。AI会编造看起来很真的假信息，销售有责任核实。"},
    {level:1,difficulty:"中阶",scenario:"销售团队使用AI工具但公司没有AI安全规范。",q:"销售团队AI使用安全规范？",opts:["A. 三层：(1)「数据分级」→什么数据不能输入AI (2)「工具分级」→公共AI能做什么/企业AI能做什么 (3)「审查机制」→AI内容发布前需检查什么", "B. 禁止用公共AI", "C. 口头提醒注意", "D. 每人自己判断", "E. 参考互联网公司"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI安全规范=数据分级+工具分级+审查机制。知道什么能做、什么不能做。"},
    {level:1,difficulty:"中阶",scenario:"销售CRM中有大量客户数据，权限管理混乱，有人能看到不属于自己的客户。",q:"销售数据权限管理？",opts:["A. 三步：(1)「最小权限」→每人只能访问自己客户和领导授权的 (2)「操作审计」→所有访问留痕 (3)「定期审查」→AI自动检查异常访问和权限泄露", "B. 所有人都有权限", "C. 按级别分配", "D. 用系统默认", "E. 需要时申请"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据权限=最小权限+操作审计+定期审查。不需要就不给，给了就追踪。"},
    {level:1,difficulty:"中阶",scenario:"销售在朋友圈发「签大单」战报，含客户logo和部分信息。",q:"销售内容发布的隐私风险？",opts:["A. 三步防泄露：(1)建「发布前审查清单」→什么能发什么不能 (2)AI自动扫描待发布内容中的敏感信息 (3)团队隐私意识培训→案例教育", "B. 打码就没事", "C. 提醒注意", "D. 不发朋友圈", "E. 事后检查"],scores:[4, 0, 0, 0, 0],best:0,explain:"发布审查=清单+AI扫描+培训。打码不等于安全，碎片能拼出完整客户画像。"},
    {level:1,difficulty:"中阶",scenario:"给客户做个性化推荐，想把A客户的数据作为案例展示给B客户。",q:"客户数据的二次使用边界？",opts:["A. 三个边界：(1)只能在前客户明确同意范围内使用 (2)新使用目的需重新获取同意 (3)共享第三方需明确告知→不确定时咨询法务→永远先问客户", "B. 都是公司数据随便用", "C. 不泄露外部就行", "D. 脱敏后可用", "E. 合同写了就行"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据二次使用=范围限制+重新同意+第三方告知。客户允许A不等于允许B。"},
    {level:2,difficulty:"高阶",scenario:"作为销售负责人，建立「销售数据安全体系」→覆盖收集/存储/使用/共享/删除全生命周期。",q:"销售数据安全体系设计？",opts:["A. 五阶段：(1)「收集」→最小化+明确告知+同意 (2)「存储」→加密+权限+备份 (3)「使用」→脱敏+审批+审计 (4)「共享」→第三方评估+加密传输+合同 (5)「删除」→客户可请求删除+彻底清除验证", "B. 制定安全制度", "C. 使用加密技术", "D. 限制数据访问", "E. 定期安全检查"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据安全体系=全生命周期保护。数据从来到走的每一步都有保障。"},
    {level:2,difficulty:"高阶",scenario:"团队有人把公司内部数据(客户画像/报价策略/营收)发给外部合作伙伴未审批。",q:"销售数据外发安全管理？",opts:["A. 三层：(1)「分级制度」→公开/内部/机密/绝密 (2)「审批流程」→机密以上需审批 (3)「技术管控」→DLP+AI监控异常外发", "B. 口头警告", "C. 禁止外发", "D. 签保密协议", "E. 只信任核心员工"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据外发=分级+审批+技术管控。制度+技术双重保障。"},
    {level:2,difficulty:"高阶",scenario:"加入AI销售平台（供应商可访问客户数据）。如何评估第三方数据安全？",q:"第三方AI工具数据安全评估？",opts:["A. 四步：(1)审查数据处理协议→确认数据不用于训练模型 (2)评估数据流向→确保合规和数据驻留 (3)测试数据删除→确认能彻底删除 (4)建立持续监控→定期审查合规状态", "B. 选大厂AI", "C. 签保密协议", "D. 只给脱敏数据", "E. 不做评估"],scores:[4, 0, 0, 0, 0],best:0,explain:"第三方评估=协议审查+流向+删除+监控。不能信任供应商，要验证供应商。"},
    {level:2,difficulty:"高阶",scenario:"AI生成销售文案涉嫌虚假宣传（夸大产品效果/暗示行业第一）。",q:"AI生成内容的合规风险管控？",opts:["A. 三层：(1)「规则层」→建立AI内容合规规则库(广告法/反不正当竞争) (2)「审查层」→AI自动检查违规(最/第一/绝对) (3)「审批层」→高风险内容人工审批→销售对自己的内容负最终责任", "B. 不用AI写营销内容", "C. 人审核所有", "D. 只写非营销", "E. AI写后法务审"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI合规=规则库+自动审查+人工审批。AI写的内容，销售负最终法律责任。"},
    {level:2,difficulty:"高阶",scenario:"作为销售VP，需向董事会证明销售数据安全可控，需量化度量体系。",q:"销售数据安全的量化度量？",opts:["A. 四维：(1)「防护度」→加密覆盖率/权限执行率 (2)「检测度」→异常发现时间/告警准确率 (3)「响应度」→泄露事件发现和响应时间 (4)「合规度」→审计通过次数/问题数→安全仪表盘", "B. 做一次安全审计", "C. 看有没有出事", "D. 对标行业标准", "E. 请外部评估"],scores:[4, 0, 0, 0, 0],best:0,explain:"安全度量=防护+检测+响应+合规。不是感觉很安全，是数据证明安全。"}

  strategy: [
    {level:0,difficulty:"初阶",scenario:"CEO宣布今年最重要战略是「AI赋能业务增长」。你需提出AI如何赋能销售。",q:"构建销售团队AI战略叙事？",opts:["A. 三步：(1)「现状量化」→当前销售瓶颈(赢单率/周期/人效) (2)「AI杠杆」→标注AI最产生10x效果的3个环节 (3)「价值故事」→用具体案例展示AI如何提升赢单率+客单价", "B. 说AI让销售更高效", "C. 列出AI能做的所有事", "D. 等公司出了战略再跟", "E. 参考大厂AI实践"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI战略叙事=现状量化+AI杠杆+价值故事。不是AI能做什么，是AI能帮销售解决什么。"},
    {level:0,difficulty:"初阶",scenario:"用AI工具3个月了，Leader问AI改变了什么？",q:"AI对销售角色本质的改变？",opts:["A. 三个本质改变：(1)「时间分配」→60%执行+40%思考→20%执行+80%策略思考 (2)「技能重心」→核心竞争力从「人际能力」变为「策略设计+数据洞察」 (3)「产出形态」→从「成交单数」变为「客户经营质量」", "B. 写邮件更快了", "C. 少做很多重复工作", "D. 不用记那么多产品信息", "E. 一个人能做更多"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI改变销售=时间+技能+产出。不是让销售失业，是让销售升级为增长顾问。"},
    {level:0,difficulty:"初阶",scenario:"HR VP想推行销售团队AI技能认证，你怎么建议？",q:"销售AI技能认证建议框架？",opts:["A. 四级：(1)L1-AI销售用户→能用AI做日常任务 (2)L2-AI销售专家→能设计Prompt和AI工作流 (3)L3-AI销售策略师→能用AI制定大客户策略 (4)L4-AI销售领导者→能制定AI销售战略", "B. 做AI使用考试", "C. 看谁用好ChatGPT", "D. 按Prompt写得好不好", "E. 跟大厂对齐"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI认证=用户→专家→策略师→领导者。认证不是分级，是让人看到成长路径。"},
    {level:0,difficulty:"初阶",scenario:"新销售VP问：AI时代我们销售团队核心竞争力是什么？",q:"AI时代的销售核心竞争力？",opts:["A. 三个竞争力：(1)「信任构建力」→AI能做触达但人构建深层信任关系 (2)「策略定义力」→AI能分析数据但人定义「进攻什么客户」 (3)「价值沟通力」→AI能写方案但人传达「为什么选我们」", "B. 会用最新AI工具", "C. 快速上手新产品", "D. 全栈销售能力", "E. 更多行业经验"],scores:[4, 0, 0, 0, 0],best:0,explain:"核心竞争力=信任+策略+价值沟通。AI能做很多，但「让客户信任你」永远是人。"},
    {level:1,difficulty:"中阶",scenario:"销售额增长但利润率下降。需分析根本原因并制定AI策略。",q:"AI辅助盈利性增长策略？",opts:["A. 四步：(1)AI分析各客户/产品/渠道的利润率→找出亏损源头 (2)标注高利润但投入不足的客户群 (3)生成「盈利增长地图」→哪些客户扩大/哪些优化/哪些放弃 (4)AI持续监控利润率→动态调整", "B. 只关注收入增长", "C. 砍掉所有低利润", "D. 提价", "E. 减少成本投入"],scores:[4, 0, 0, 0, 0],best:0,explain:"盈利增长=利润分析+机会标注+策略地图+动态调整。增长不是目的，盈利性增长才是。"},
    {level:1,difficulty:"中阶",scenario:"作为销售总监，为明年制定销售团队AI技术路线图。",q:"AI时代销售路线图设计？",opts:["A. 四维：(1)「工具」→AI销售工具选型+渐进引入 (2)「能力」→团队AI技能分级培养 (3)「流程」→AI嵌入销售流程的里程碑 (4)「组织」→AI Champion角色+考核→季度KPI", "B. 买最新AI工具", "C. 跟随行业趋势", "D. 现有路线图加AI", "E. 各团队自己定"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI路线图=工具+能力+流程+组织。不是要用AI，是要成为什么样的AI销售团队。"},
    {level:1,difficulty:"中阶",scenario:"团队里有人担心AI会取代销售岗位，工作积极性下降。",q:"如何用AI重塑销售价值而非取代？",opts:["A. 三步：(1)「透明沟通」→AI是增强工具非替代品 (2)「新价值定位」→帮每人找到AI时代的独特价值（关系/洞察/策略） (3)「成长赋能」→从「拿订单的人」转型为「客户增长顾问」", "B. 说AI不会取代人", "C. 等自然淘汰", "D. 提供AI培训", "E. 强调公司稳定"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI焦虑=透明+新定位+赋能。不是你不会被取代，是你会变成更值钱的人。"},
    {level:1,difficulty:"中阶",scenario:"公司战略会上争取销售成为「AI转型先行部门」，如何论证？",q:"如何论证销售应为AI转型先行部门？",opts:["A. 三个论证：(1)「收入驱动」→销售AI直接贡献收入增长→ROI最快体现 (2)「快速验证」→销售AI效果可快速量化→为其他部门树立标杆 (3)「战略必要」→竞争对手已在用→不转就落后", "B. 接触客户最多", "C. 销售最愿意用AI", "D. 销售数据最丰富", "E. 对手已经在做"],scores:[4, 0, 0, 0, 0],best:0,explain:"先行部门论证=收入驱动+快速验证+战略必要。销售AI的ROI最直接，应该最先做。"},

// Normalize course skills to [{s:index, w:weight}] format (backward compatible)
function normalizeSkills(skills) {
  if (!skills || !skills.length) return [{s:0,w:1}];
  if (typeof skills[0] === 'object' && 's' in skills[0]) return skills;
  return skills.map(s => ({s, w:1.0}));
}

// Get primary skill index (highest weight)
function getPrimarySkillIdx(course) {
  const skills = normalizeSkills(course.skills);
  let best = skills[0];
  for (let i = 1; i < skills.length; i++) {
    if (skills[i].w > best.w) best = skills[i];
  }
  return best.s;
}

// Compute weighted composite score from the 8-dim result
function getCourseCompositeScore(course) {
  const result = S._quizResult;
  const role = ROLES[S.role];
  const skills = normalizeSkills(course.skills);
  let totalW = 0, totalWS = 0;
  skills.forEach(sk => {
    const dimKey = (role && role.dimKeys && role.dimKeys[sk.s]) || null;
    let score = 0;
    if (dimKey && result && result.dimScores && result.dimScores[dimKey] !== undefined) {
      score = result.dimScores[dimKey];
    } else if (S.quizScores && S.quizScores[sk.s] !== undefined) {
      score = S.quizScores[sk.s];
    }
    totalW += sk.w;
    totalWS += score * sk.w;
  });
  return totalW > 0 ? totalWS / totalW : 0;
}

// Compute course priority factoring in: skill gap, industry weight, prerequisites
function getCoursePriority(course) {
  const compScore = getCourseCompositeScore(course);
  const basePriority = Math.max(0, 4 - compScore); // 0~4, higher = more urgent

  // Industry dimension multiplier: higher weight dims get more urgency when weak
  const weights = S._quizResult ? (S._quizResult.weights || getWeights(S.industry, S.role)) : getWeights(S.industry, S.role);
  const dimKey = (ROLES[S.role] && ROLES[S.role].dimKeys && ROLES[S.role].dimKeys[getPrimarySkillIdx(course)]) || null;
  let indBoost = 1.0;
  if (dimKey && weights && weights[dimKey] !== undefined) {
    indBoost = 0.7 + (weights[dimKey] / 100) * 0.6; // 0.7 ~ 1.3 range
  }

  // Prerequisite urgency: if prereq not done, boost this course
  let prereqBoost = 1.0;
  if (course.requires && course.requires.length) {
    const unmet = course.requires.filter(rid => !S.courseProgress[rid]?.done);
    if (unmet.length > 0) prereqBoost = 1.0 + unmet.length * 0.3;
  }

  // Combine: base priority × industry urgency × prereq factor
  return Math.round(basePriority * indBoost * prereqBoost * 100) / 100;
}

// Check if all prerequisites for a course are met
function prereqsMet(course) {
  if (!course.requires || !course.requires.length) return true;
  return course.requires.every(rid => S.courseProgress[rid]?.done);
}

      concepts:[{t:'提示词工程的本质',c:'提示词工程（Prompt Engineering）不是"跟AI好好说话"，而是结构化地表达需求。核心要素：角色设定（告诉AI它是谁）、任务描述（要做什么）、输出格式（怎么呈现）、约束条件（不能做什么）、示例（few-shot，给出范例）。好的提示词能提升AI产出质量30-50%。'},{t:'链式思维推理',c:'Chain-of-Thought（CoT）是让AI"逐步思考"的技巧。不要直接问结果，而是要求AI"先分析问题→拆解步骤→逐步推理→得出结论"。例如调试复杂bug时："分析错误日志→列出可能原因→逐个排查→给出结论和修复方案"。这种分步推理大幅提升复杂问题的准确率。'},{t:'Few-shot学习',c:'给AI提供2-5个"输入→期望输出"的范例，AI会模仿范例的风格和结构。例如，给出3个代码审查的范例（问题→严重级别→修复方案），之后AI会按照相同格式输出。Few-shot的关键是范例要覆盖不同类型的场景。'}],
