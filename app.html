const CPG_PM_QUIZ = {
prompt: [{level:0,difficulty:"初阶",scenario:"场景：你是洗发水产品经理，手上有过去12个月的电商评论（10万条），想用AI分析消费者对「控油」功效的真实评价。",q:"如何设计Prompt？",opts:["A. 设定「快消品消费者洞察分析师」→描述评论数据格式→要求：(1)控油相关的正面关键词和场景 (2)负面关键词和痛点 (3)对比竞品评价中的控油口碑 (4)输出产品改良方向和营销话术建议","B. 让AI统计「控油」出现次数","C. 只看好评不用分析差评","D. 做消费者调研问卷","E. 看竞品的宣传文案"],scores:[4,0,0,1,0],best:0,explain:"快消品评论分析=正面+负面+竞品对比+可执行建议。消费者的真实语言是最好的产品需求来源。"},{level:1,difficulty:"中阶",scenario:"场景：你要做新品概念测试：AI可以生成多个产品概念，但如何确保筛选出的概念最有市场潜力？",q:"Prompt策略？",opts:["A. 三轮筛选：(1)AI基于行业趋势+消费者洞察生成20个概念 (2)设定「快消品市场分析师」角色，按差异化/可传播性/目标人群匹配度/生产成本可行性四维度打分 (3)选取Top5用AI模拟不同消费者画像的反应","B. 让AI生成然后挑喜欢的","C. 做大规模消费者调研","D. 看竞品做什么我们做类似的","E. 让销售团队投票"],scores:[4,0,0,1,0],best:0,explain:"概念筛选=AI生成+多维度评分+模拟验证。AI帮你扩大选项池，但「什么能卖」的判断需要经验。"},{level:2,difficulty:"高阶",scenario:"场景：你要建立「AI驱动的爆品孵化体系」：从社媒洞察→新品概念→配方方向→包装与宣称→上市潜力预测的全链路。",q:"如何设计Prompt链支撑这套体系？",opts:["A. 5轮Prompt链：(1)社媒洞察师→从海量UGC提炼未被满足的需求（如油头但不想天天洗） (2)产品概念师→生成概念组合（功效/剂型/香型/人群） (3)配方顾问→基于成分趋势库提出配方方向与宣称支撑点 (4)合规顾问→设计包装方向并审核宣称（对照化妆品功效宣称管理办法） (5)上市预测师→用历史爆品模型评估概念潜力→每轮输出作为下一轮输入","B. 一次性让AI生成完整方案","C. 参考国际大牌的新品路径","D. 靠资深产品经理个人经验","E. 先做大规模消费者问卷再定"],scores:[4,0,1,0,0],best:0,explain:"爆品孵化=洞察→概念→配方→合规→预测的链式作业。快消功效宣称必须有依据且前置审核，否则上市后被要求整改代价巨大。"}],
tools: [{level:0,difficulty:"初阶",scenario:"场景：你要分析竞品新款沐浴露的定位策略。手上有：竞品电商页面、小红书种草笔记、抖音测评视频。",q:"最佳AI工具组合？",opts:["A. 三工具协同：(1)Claude分析电商页面→提取卖点和定价策略 (2)AI分析小红书/抖音内容→提取消费者关注点和情感倾向 (3)汇总→输出竞品定位地图+我们的差异化机会","B. 手动浏览各个平台做笔记","C. 只看电商价格和销量","D. 买一份市场调研报告","E. 关注竞品抖音号"],scores:[4,0,1,0,0],best:0,explain:"快消品竞品分析=电商+社交+视频多渠道交叉。AI让碎片化信息的整合效率提升10倍。"},{level:1,difficulty:"中阶",scenario:"场景：你要做新品上市前的定价策略。销量预测、价格弹性、促销效果、渠道利润分配都需要考虑。",q:"AI辅助定价方案？",opts:["A. 五步定价：(1)AI收集竞品价格带和促销数据 (2)AI分析历史价格-销量弹性 (3)AI按渠道(天猫/京东/抖音/线下)分别建模 (4)AI生成定价方案含促销节奏和利润预估 (5)人工结合品牌定位最终决策","B. 按成本加价率定价","C. 跟竞品定一样的价格","D. 让销售渠道定价","E. 高定价高促销"],scores:[4,0,0,0,0],best:0,explain:"快消品定价=竞品+弹性+渠道+品牌。AI帮你算清账，品牌定位你来掌舵。"},{level:2,difficulty:"高阶",scenario:"场景：你要搭建「社媒聆听+电商数据」双引擎的消费者洞察平台，覆盖微博/小红书/抖音内容与天猫/京东评价，支撑新品立项。",q:"如何用AI工具链搭建这个平台？",opts:["A. 四层工具链：(1)采集层-合规授权范围内接入社媒与电商评价数据 (2)分析层-Claude做主题聚类+情感分析+关键词共现（控油/蓬松等词与竞品交叉） (3)量化层-数据工具关联销量与声量，计算声量-销量弹性判断趋势真伪 (4)分发层-AI生成月度洞察报告（趋势发现/竞品动作/机会缺口）供产品与市场共享","B. 购买全套商业社媒监测软件","C. 安排专员每周手工刷热门笔记","D. 只分析天猫评价数据","E. 委托调研公司按季度出报告"],scores:[4,0,0,1,0],best:0,explain:"洞察平台=采集+聚类+声销关联+分发。单看社媒或单看电商都是盲人摸象，声量×销量交叉才能判断一个趋势是真需求还是营销泡沫。"}],
data: [{level:0,difficulty:"初阶",scenario:"场景：你有某SKU过去6个月的销售数据：各渠道日销量、价格、促销力度、库存、退货率。想知道什么时候该补货、什么时候该促销？",q:"AI数据分析方法？",opts:["A. 上传数据→描述业务场景→AI分析：(1)销量趋势和季节性 (2)促销对销量的真实拉动效果 (3)库存周转与促销的关联 (4)输出：补货建议时间表+促销时机推荐+滞销SKU预警","B. 看销量曲线凭经验判断","C. 按固定周期补货","D. 库存低了就补货","E. 让渠道自己管理库存"],scores:[4,0,0,0,1],best:0,explain:"快消品数据分析=趋势+促销效果+库存优化。AI帮你从「凭经验」到「看数据」。"},{level:1,difficulty:"中阶",scenario:"场景：你管理的产品线有50+SKU，想知道哪些该砍、哪些该加大投入。数据：销量、毛利、增长率、复购率、退货率。",q:"AI分析策略？",opts:["A. AI四象限分析：(1)AI按增长×利润四象限分类 (2)结合复购率和退货率识别「伪爆款」 (3)分析SKU间的替代关系避免砍错 (4)输出：裁减清单+主推清单+升级方向+预计对收入的综合影响","B. 砍掉销量最低的10个","C. 每个都保留一些","D. 让销售决定砍哪些","E. 看竞争对手有哪些SKU"],scores:[4,0,0,0,0],best:0,explain:"SKU优化=四象限+复购+替代关系。砍SKU简单，砍对SKU需要数据支撑。"},{level:2,difficulty:"高阶",scenario:"场景：新品上市满90天，管理层要决定是否放大生产与推广。你有分渠道日销、会员复购、竞品同期、社媒声量等数据。",q:"如何用AI做上市决策分析？",opts:["A. 五步决策模型：(1)AI构建新品健康度仪表盘（销量达成/复购率/退货率/声量/竞品对标） (2)拆解首购与复购：拉新看投放效率，复购看产品力（30天/60天复购曲线） (3)AI归因声量质量：爆发来自投放还是自发口碑（自然声量占比） (4)渠道诊断：各渠道ROI对比与同品蚕食检测 (5)输出加码/维持/调整的决策建议及投放补货预案","B. 看总销量达标就加大投入","C. 销量好就全面放大推广","D. 等满一年再系统复盘","E. 按经销商的订单量决策"],scores:[4,0,0,0,0],best:0,explain:"上市决策=健康度仪表盘+首复购拆解+声量归因+渠道诊断。复购率是新品的照妖镜——首购可以被投放买出来，复购才能证明产品力。"}],
content: [{level:0,difficulty:"初阶",scenario:"场景：你要为新品洗发水写电商详情页。需要：差异化卖点+成分故事+使用场景+用户证言。",q:"AI协作方式？",opts:["A. 四步共创：(1)给AI产品brief(成分/功效/目标人群)→AI生成20个卖点方向 (2)选出最佳方向→AI生成3版详情页文案(情感型/理性型/场景型) (3)AI生成配套的小红书种草文案 (4)人工注入品牌声音和合规审核","B. 让AI自由发挥写一篇","C. 找一个参考竞品的改写","D. 请文案团队写不用AI","E. 只列功能和成分表"],scores:[4,0,0,1,1],best:0,explain:"电商详情页=AI发散+人工聚焦。AI擅长量产选项，你擅长挑出最能打动消费者的那个。"},{level:1,difficulty:"中阶",scenario:"场景：头皮护理精华新品上市，需要同步产出电商详情页、小红书种草、抖音短视频与直播间脚本，心智要统一。",q:"如何用AI批量产出统一心智的内容？",opts:["A. 四步管线：(1)给AI产品brief（成分/功效/人群/头皮抗衰差异化主张）锁定核心心智 (2)AI搭建卖点大厦：1个主卖点+3个支撑点（成分机理/实验数据/使用场景） (3)AI分平台产出：详情页理性种草版/小红书真实测评体/抖音前三秒钩子脚本/直播间话术 (4)AI统一全渠道合规口径，功效词不越界→人工审核+宣称依据复核","B. 全权委托MCN机构制作","C. 各平台内容各写各的","D. 只做电商详情页其余后补","E. 直接改写对标爆品的文案"],scores:[4,0,0,0,0],best:0,explain:"内容矩阵=心智锁定+卖点大厦+多平台适配+合规统一。一致性来自一个主卖点反复锤，AI负责锁口径、分平台演绎。"},{level:2,difficulty:"高阶",scenario:"场景：品牌成立15周年要启动「品牌焕新」年度战役，从品牌主张到全线产品内容升级，需管理层拍板、代理公司协同执行。",q:"如何用AI打造战役级内容体系？",opts:["A. 六步战役引擎：(1)AI梳理品牌资产（历史主张/经典产品/用户语言）找焕新方向 (2)AI研究行业趋势与消费者代际变化（从成分党到情绪护肤） (3)AI生成新品牌主张候选并做逻辑推演供管理层决策 (4)展开战役内容矩阵：TVC脚本/平面KV文案/社媒话题/线下快闪主题 (5)AI扮演魔鬼代言人预演负面反应（成分焦虑/定价质疑）备好应对口径 (6)AI输出给代理商的统一内容brief与品牌语言规范","B. 委托4A公司出全套方案","C. 沿用旧主张只换新包装","D. 看竞品主张跟风升级","E. 让各产品线自行定义新主张"],scores:[4,0,0,0,1],best:0,explain:"品牌战役=资产盘点+趋势洞察+主张推演+内容矩阵+舆情预案。品牌主张最终必须人拍板，AI的价值是把候选与推演做扎实。"}],
dev: [{level:0,difficulty:"初阶",scenario:"场景：研发团队提议用AI生图工具（Midjourney等）直接产出新品包装设计稿（瓶型/标签/礼盒），你是PM要评估可行性与边界。",q:"如何用AI辅助评估？",opts:["A. 三步评估：(1)让AI对比传统设计流程与AI辅助设计的适用场景，明确AI擅长的概念发散与不擅长的结构工艺/合规落地 (2)让AI列出包装设计硬约束：瓶型模具成本/标签法规/条码/货架视觉 (3)综合输出：用AI做概念发散、人工与设计公司精修落地的混合流程建议","B. 直接同意让AI全自动出图定稿","C. 问AI「AI设计包装好不好」","D. 坚持设计必须人工不用AI","E. 先小范围试用AI出概念图"],scores:[4,0,0,1,2],best:0,explain:"AI包装设计=概念发散可行、交付落地受限。合规标识、模具工艺、条码是AI盲区，「AI发散+人工精修」的混合流程是当前最优解。"},{level:1,difficulty:"中阶",scenario:"场景：包装改版频繁（新法规/新卖点/新促销装），设计稿、法规审核、打样版本散落在各人电脑里，你要建一套「AI包装设计与合规审查」工作流。",q:"如何用AI写出可落地的工作流需求？",opts:["A. 四步法：(1)AI梳理包装设计全流程环节与法规要求（GB 7718标签通则等） (2)描述业务场景→AI设计工作流：AI概念出图→合规规则引擎初查（宣称词/字体字号/条码校验）→人审→多稿比选→打样版本管理 (3)AI输出PRD（角色权限/状态流转/接口） (4)用AI模拟设计师与合规专员评审，找出包装改版需重新送检等遗漏","B. 让设计团队自行搭建流程","C. 采购一套包装管理系统","D. 只做AI出图不管合规环节","E. 外包给软件公司定制开发"],scores:[4,0,0,0,0],best:0,explain:"包装数字化需求=流程+合规规则+版本管理。快消包装改版牵涉送检/备案等法定环节，合规初查和版本追溯是比AI出图更核心的需求。"},{level:2,difficulty:"高阶",scenario:"场景：集团要建「AI新品孵化中台」，把配方知识库、宣称素材、包装设计、法规审核、市场测试数据打通，缩短新品立项周期。",q:"如何用Prompt链设计中台方案？",opts:["A. 5轮Prompt链：(1)研发架构师→设计中台模块（配方库/宣称库/设计库/合规库/测试库）与数据模型 (2)知识工程师→设计RAG知识检索，让AI能回答某成分能否用、类似宣称有无先例 (3)合规专家→设计宣称自动审核规则（禁用词/依据要求） (4)产品经理→定义研发/设计/市场/法务各角色的使用流程与权限 (5)验收顾问→定义效果指标（立项周期缩短/合规返工率下降）→输出立项PRD","B. 一次性让AI写完整方案","C. 采购大型PLM系统","D. 先建个配方数据库再说","E. 维持各部门数据各自存放"],scores:[4,0,0,1,0],best:0,explain:"新品中台=模块设计+知识RAG+合规规则+流程权限+度量验收。快消新品大量时间耗在跨部门流转与查证，知识可检索是最大提速点。"}],
workflow: [{level:0,difficulty:"初阶",scenario:"场景：你每周需要出一份品类周报给管理层：含销售额、市场份额、新品表现、竞品动作。目前手工收集数据耗时3小时。",q:"AI自动化方案？",opts:["A. 搭建AI周报管线：(1)设定数据看板自动取数 (2)AI自动生成销量和市场份额的文字解读 (3)AI抓取竞品动向（新品/促销/社媒热度） (4)AI集成输出→你10分钟审核加评语","B. 继续手工做","C. 让数据分析师出报告","D. 缩减为月报","E. 只看销售额一个指标"],scores:[4,0,0,0,1],best:0,explain:"品类周报自动化=自动取数+AI解读+人工审核。从3小时→10分钟。"},{level:1,difficulty:"中阶",scenario:"场景：新品上市要协调研发/市场/供应链/电商多部门，目前靠微信群加Excel排期，包材定稿晚了一周都没人发现，经常错过档期。",q:"如何设计AI协同的新品上市流程？",opts:["A. 三阶段AI嵌入：(1)规划期-AI生成上市甘特图（配方锁定→包装定稿→量产→铺货→首发）并标注关键路径 (2)执行期-AI周度进度播报：自动汇总各部门更新，预警逾期项（如包材打样晚3天将影响上市5天） (3)复盘期-AI沉淀上市checklist与各部门交付物模板供下次复用→甘特图全员共享可见","B. 让AI替代项目经理做决策","C. 更换一套项目管理软件","D. 每周开长会逐项同步进度","E. 让供应链部门牵头推进"],scores:[4,0,0,0,0],best:0,explain:"上市协同=甘特图+进度预警+checklist沉淀。快消上市节点环环相扣，包材晚一周等于错过档期，预警比事后补救重要得多。"},{level:2,difficulty:"高阶",scenario:"场景：作为品类产品总监，你带10个PM覆盖个护/家清/美妆三条线，每年上百个新品与改版项目，要建立团队级「AI+新品开发」体系。",q:"如何设计可落地的团队AI工作体系？",opts:["A. 四层体系：(1)工具层-统一AI工作台（洞察/概念/文案/合规助手）与素材库 (2)流程层-在立项/概念/设计/合规/上市5个关卡嵌入AI检查点（立项AI预审市场依据、上市前AI合规终检） (3)知识层-沉淀爆品复盘库与翻车案例库（宣称被罚/动销失败/包装事故）供新项目检索 (4)度量层-追踪新品成功率与开发周期变化→季度复盘迭代","B. 鼓励每人自行探索AI用法","C. 采购一套新品管理软件","D. 单独设立AI创新实验室","E. 请外部顾问做一轮AI培训"],scores:[4,0,1,0,0],best:0,explain:"快消团队AI体系=工具+关卡+知识+度量。快消最大的浪费是重复踩坑，翻车案例库比成功方法论更值得优先沉淀。"}],
security: [{level:0,difficulty:"初阶",scenario:"场景：你想用公共AI分析竞品的配方成分表来推测其技术路线。这些配方信息是竞品公开在包装上的。",q:"需要注意什么？",opts:["A. 竞品公开信息分析是合法的，但注意：(1)仅使用公开信息，不要通过非公开渠道获取 (2)分析结果仅用于内部竞争策略 (3)不要用AI生成「某某竞品含有害成分」等不实信息 (4)配方推测结论需标注「基于公开信息分析」","B. 这样做不道德不应该做","C. 无所谓反正包装上都有","D. 让供应链去打听更准确","E. 用别的方法拿到更多配方信息"],scores:[4,0,0,0,0],best:0,explain:"竞品分析边界=公开信息OK+内部使用+不造谣+标注来源。合法竞争≠不正当竞争。"},{level:1,difficulty:"中阶",scenario:"场景：公司掌握千万级会员数据（手机号/地址/购买记录/肤质问卷），要做消费者洞察与精准营销，须满足个保法要求。",q:"如何设计数据合规使用方案？",opts:["A. 三线合规：(1)采集端-最小化收集+明示授权，营销/研发用途分别取得单独同意 (2)使用端-数据分级管控：敏感字段加密存储，营销触达不超授权范围，画像分析用脱敏数据 (3)管理端-建立数据安全制度+用户权利响应通道（查询/删除/撤回授权），与CRM/广告服务商签署数据处理协议","B. 会员数据可在集团内部自由共享","C. 注册时勾选同意即可随意营销","D. 购买第三方数据补充用户画像","E. 等出现投诉或处罚再整改"],scores:[4,0,0,0,0],best:0,explain:"快消会员数据=最小化+单独同意+分级管控。个保法下注册即同意不能覆盖后续营销场景，购买第三方数据与超范围触达都是高危动作。"},{level:2,difficulty:"高阶",scenario:"场景：集团要建「消费者数据平台CDP」支撑全域营销：打通电商/私域/门店的用户身份，做标签画像与精准投放。",q:"如何设计安全与合规架构？",opts:["A. 五层架构：(1)采集层-各渠道数据接入前做授权范围合规审查 (2)ID层-用隐私计算（匿名化/假名化）跨渠道打通，原始手机号不集中存储 (3)标签层-标签按敏感度分级，肤质/消费能力等敏感标签脱敏管理 (4)应用层-投放对接走安全屋或联邦方式，原始数据不出库 (5)治理层-用户授权中心（同意记录/撤回通道）+权限审计→定期合规审查","B. 把各渠道数据全部汇到一个库","C. 直接用手机号做主键打通","D. 原始标签直接对接广告平台","E. 整体外包给数据服务商处理"],scores:[4,0,0,0,0],best:0,explain:"CDP合规=隐私计算打通+标签分级+安全屋应用。跨渠道打通是价值核心也是合规最高风险点，用假名化标识而非原始手机号打通是行业正解。"}],
strategy: [{level:0,difficulty:"初阶",scenario:"场景：CEO问：AI对快消品行业最大的改变是什么？",q:"作为PM的最佳回答？",opts:["A. AI让快消品从「大规模标准化」走向「大规模个性化」：(1)消费者洞察-从问卷到海量社媒实时分析 (2)产品创新-从经验驱动到数据+AI驱动 (3)营销-从大众广告到AI千人千面 (4)供应链-从固定排产到AI预测驱动，全链路提效","B. AI让广告投放更精准","C. AI可以替代配方研发","D. AI主要影响电商渠道","E. 快消品不太需要AI"],scores:[4,0,0,0,0],best:0,explain:"快消品AI=洞察+创新+营销+供应链全链路。最大的变化是从「猜消费者要什么」到「知道消费者要什么」。"},{level:1,difficulty:"中阶",scenario:"场景：竞品上线「AI肤质检测」小程序（拍照测肤后推荐产品），配合KOL传播带来一波热度与销量。CEO问你跟不跟。",q:"你的战略级回答？",opts:["A. 不盲目跟进，三步分析：(1)拆解竞品功能：拍照测肤精度存疑，本质是获客与推荐钩子，还是真数据闭环 (2)评估自身：线下专柜与美容顾问是差异化资产，可做AI+顾问结合 (3)提出策略：小程序AI测肤作获客与导购工具，同时把真实肤质数据回流研发积累资产，深度需求由顾问服务承接","B. 马上开发一个同款小程序","C. 不做，拍照测肤不准是噱头","D. 找AI公司外包开发快速上线","E. 等竞品跑出数据再跟进"],scores:[4,0,0,1,0],best:0,explain:"AI功能跟进=竞品拆解+自身渠道优势+数据价值挖掘。测肤的长期价值不在营销噱头，而在积累真实肤质数据这一研发资产。"},{level:2,difficulty:"高阶",scenario:"场景：新锐品牌冲击、成分内卷、渠道碎片化，董事会要你提出未来3年AI驱动的美妆个护品牌战略。",q:"最能说服董事会的方案？",opts:["A. 「AI×产品力」双轮战略：(1)Year1-洞察轮：建社媒聆听+电商数据洞察中台，新品立项有据可依，提升命中率砍掉拍脑袋项目 (2)Year2-效率轮：AI贯穿研发/设计/合规/内容，新品周期缩短30%、内容成本降50% (3)Year3-个性化轮：AI测肤/定制护肤/私域智能运营，从卖标准品到千人千面服务→每阶段配投资额、KPI与竞品对标","B. 加大全域营销投放抢声量","C. 全线降价应对新锐冲击","D. 收购一两个新锐品牌","E. 重金自研美妆行业大模型"],scores:[4,0,0,1,0],best:0,explain:"美妆品牌战略=洞察→效率→个性化三段递进。成分内卷下真正的护城河是新品的命中率与开发速度，AI恰好同时作用于这两点。"}]
};

// ==================== 互联网×PM 测评数据 (v38) ====================
const INTERNET_PM_QUIZ = {
prompt: [{level:0,difficulty:"初阶",scenario:"场景：你是电商平台PM，手上有10万条商品评论和5万条售后工单，想用AI找出「退款率高」的真实原因。",q:"如何设计Prompt让AI成为电商体验分析师？",opts:["设定「电商用户体验分析师」角色→描述数据字段含义（评论/评分/退款原因/物流时效）→要求：(1)退款原因分类统计 (2)高退款商品的特征聚类 (3)评论情绪与退款的相关性 (4)输出Top3可改进的产品方向","把评论直接丢给AI让它总结","只统计差评数量","让AI预测哪个商品会退款","看竞品评论自己对比"],scores:[4,0,0,1,0],best:0,explain:"电商退款分析=角色+字段解释+多维输出。退款是体验的「结果」，要追溯评论情绪、物流、商品特征才能找到根因。"},
{level:1,difficulty:"中阶",scenario:"场景：你要让AI对比《蛋仔派对》《原神》《逆水寒》三款游戏的运营策略，指导新品立项。",q:"最佳Prompt设计？",opts:["分解为4个子任务：(1)产品结构对比（玩法/付费/社交） (2)运营节奏对比（版本/活动/赛季） (3)用户生态对比（创作者/社区/直播） (4)商业化对比（皮肤/月卡/抽卡）→最后汇总为立项建议","把三款游戏的资料都给AI让它总结","问AI「哪款游戏最赚钱」","只看App Store榜单排名","让运营团队各自写一份报告"],scores:[4,0,0,0,0],best:0,explain:"游戏竞品分析=玩法+运营+生态+商业化四维拆解。游戏产品成败在于「长线运营」，必须看用户生态而非单点数据。"},
{level:2,difficulty:"高阶",scenario:"场景：你要为社交平台设计「AI驱动的反内容劣质化」产品方案：涉及推荐分发、内容审核、创作者激励、商业化平衡。",q:"如何用多轮Prompt链完成？",opts:["5轮Prompt链：(1)内容生态分析师→定义劣质内容特征（标题党/搬运/低质图文） (2)推荐策略专家→设计质量分与推荐权重的联动机制 (3)审核风控专家→设计AI预审+人工复核分级体系 (4)创作者运营专家→设计优质内容激励方案 (5)商业化顾问→评估对广告/电商GMV的影响并给出平衡策略","一次性让AI写完整方案","直接调低劣质内容推荐权重","全部改为人工审核","参考抖音的做法照搬"],scores:[4,0,0,0,0],best:0,explain:"内容生态治理=特征定义→推荐联动→审核分级→创作者激励→商业平衡。牵一发动全身，必须链式思考。"}],
tools: [{level:0,difficulty:"初阶",scenario:"场景：你是电商运营PM，大促结束后需要快速复盘：各品类GMV、流量来源、转化率、退款率，数据散落在生意参谋/数据银行/Excel里。",q:"最佳AI工具使用方式？",opts:["上传各平台导出数据到Claude→设定「电商数据分析师」→要求：(1)自动合并去重 (2)按品类×渠道交叉分析 (3)识别「高流量低转化」和「高转化低流量」的品类 (4)生成一页式复盘报告","手动在Excel里做透视表","只看总GMV一个指标","等BI团队出正式报告","凭运营经验口头总结"],scores:[4,1,0,0,0],best:0,explain:"电商复盘=多源数据+AI交叉分析。AI能把3天的复盘压缩到30分钟，且交叉维度远超人工。"},
{level:1,difficulty:"中阶",scenario:"场景：游戏新版本上线后次日留存从40%掉到32%，你有漏斗数据（下载→注册→新手引导→首局→次日）、版本更新日志、用户反馈。",q:"如何用AI工具组合定位问题？",opts:["四步定位：(1)Claude分析漏斗各环节转化变化→锁定流失环节 (2)对比更新前后新手引导的改动点 (3)AI聚类用户反馈提取高频吐槽 (4)用数据分析工具验证假设→输出修复优先级","让运营凭经验猜原因","只看次日留存一个数","直接回滚版本","发问卷问玩家为什么流失"],scores:[4,0,0,0,1],best:0,explain:"游戏留存诊断=漏斗+版本diff+反馈聚类三线交叉。AI帮你把「玩家流失」从玄学变成可验证的工程问题。"},
{level:2,difficulty:"高阶",scenario:"场景：你要为社交产品搭建「AI驱动的用户分层运营」实验环境：数据仓库、标签体系、AB测试、触达通道。",q:"如何用AI工具链搭建？",opts:["工具链组合：(1)Claude设计数据模型和标签体系 (2)Cursor辅助写AB测试分流框架代码 (3)NotebookLM研究行业用户分层最佳实践 (4)Perplexity搜索增长工具选型→四者协同产出可落地方案","只用Claude做所有事","买一套现成的CDP系统","让数据团队独立搭建","先用Excel做用户分层"],scores:[4,0,0,1,0],best:0,explain:"用户分层平台=数据+标签+实验+触达四件套，多工具协同才能覆盖全链路。"}],
data: [{level:0,difficulty:"初阶",scenario:"场景：你负责电商App的转化率：首页曝光100万、商品点击30万、加购5万、支付3万。想找出最大提升空间。",q:"AI数据分析方法？",opts:["上传漏斗数据→AI分析：(1)各环节转化率对标行业基准 (2)按流量渠道拆分（搜索/推荐/广告/私域）找薄弱渠道 (3)按品类拆分找低效品类 (4)输出：优先级最高的2个优化动作+预期提升","只看整体转化率","让UI改版首页","加大广告投放","把支付流程改简单"],scores:[4,0,0,0,1],best:0,explain:"漏斗分析=环节对标+渠道×品类交叉。先定位「最痛的环节」再动手，避免瞎优化。"},
{level:1,difficulty:"中阶",scenario:"场景：游戏内购收入连续3个月下滑，你有付费数据、活跃数据、版本更新记录、竞品活动数据。",q:"如何用AI找到收入下滑根因？",opts:["五步分析：(1)AI拆分收入=付费人数×ARPPU×付费频次 (2)按付费档位分析流失群体（中小R还是大R） (3)关联版本更新与付费行为变化 (4)对比竞品活动节奏 (5)输出：根因假设Top3+对应运营动作（如恢复月卡权益/上新皮肤）","增加更多付费点","打更多折扣促销","看竞品怎么做照抄","只关注头部大R玩家"],scores:[4,0,0,0,0],best:0,explain:"游戏收入分析=拆解指标→分档位→关联版本→对标竞品。中小R才是收入基本盘，不能只盯大R。"},
{level:2,difficulty:"高阶",scenario:"场景：社交平台要设计「内容推荐质量评估体系」：既要DAU和时长，又要用户满意度和内容生态健康度。",q:"产品指标体系中如何平衡？",opts:["四层指标设计：(1)北极星-有效内容消费时长（剔除低质内容时长） (2)过程指标-推荐覆盖度/多样性/新颖性 (3)质量指标-负反馈率/举报率/跳出率 (4)生态指标-中小创作者流量占比/内容生命周期→用AI辅助定义每个指标的计算口径和阈值","只看DAU和人均时长","只看用户满意度调研","让推荐算法自己调","沿用短视频平台的标准指标"],scores:[4,0,0,0,0],best:0,explain:"推荐质量=北极星+过程+质量+生态四层。短视频的「时长」口径在社交产品必须剔除低质内容，否则会劣币驱逐良币。"}],
content: [{level:0,difficulty:"初阶",scenario:"场景：你要为电商新品（智能保温杯）写详情页：差异化卖点+场景化文案+用户证言。",q:"AI协作方式？",opts:["四步共创：(1)给AI产品brief（功能/材质/目标人群）→生成20个卖点方向 (2)选最佳方向→AI生成3版详情页（理性参数型/情感场景型/直播话术型） (3)AI生成配套的短视频脚本和买家秀征集文案 (4)人工注入品牌声音+合规审核","让AI自由发挥写一篇","参考竞品详情页改写","找外包文案团队写","只列参数表格"],scores:[4,0,0,1,1],best:0,explain:"电商详情页=AI发散+人工聚焦。AI量产选项，你挑最能打动目标人群的那个。"},
{level:1,difficulty:"中阶",scenario:"场景：游戏要做「新英雄上线」的营销内容矩阵：版本公告、角色故事、技能演示视频、社媒话题、玩家UGC活动。",q:"如何用AI批量产出并保持一致世界观？",opts:["五步管线：(1)先给AI输入游戏世界观和角色设定文档（锁定一致性） (2)AI生成英雄故事线和性格标签 (3)AI产出多平台文案（官网/微博/B站/公众号各一版） (4)AI生成视频脚本分镜 (5)设计UGC话题和激励规则→人工审核世界观细节","让每个平台各写各的","外包给营销公司","只发版本公告","用模板批量套用"],scores:[4,0,0,0,0],best:0,explain:"游戏内容管线=世界观锁定→故事→多平台适配→视频→UGC。世界观一致性是游戏IP的生命线，AI初稿+人工把关。"},
{level:2,difficulty:"高阶",scenario:"场景：社交平台要做「创作者生态白皮书」用于行业发声：数据洞察+趋势判断+平台理念+扶持计划。",q:"如何用AI打造有影响力的白皮书？",opts:["六步产出：(1)AI分析平台创作者数据提炼洞察（活跃度/收入分布/类型变迁） (2)AI研究行业报告和竞品动态 (3)按「行业趋势→平台数据→生态理念→扶持计划→案例」框架生成大纲 (4)AI逐章写初稿 (5)「魔鬼代言人」挑战观点找漏洞 (6)人工注入平台战略和真实案例→多轮打磨","找咨询公司代写","翻译国外平台白皮书","只写平台数据不写观点","用去年版本改数据"],scores:[4,0,0,0,0],best:0,explain:"生态白皮书=数据+趋势+理念+计划。行业发声既要数据厚度，更要有立场和观点。"}],
dev: [{level:0,difficulty:"初阶",scenario:"场景：研发团队提议用大模型重构搜索，替代现有Elasticsearch方案。你是PM需快速评估技术可行性和产品价值。",q:"AI辅助决策方式？",opts:["三步评估：(1)AI对比两种方案：ES vs 向量检索+大模型重排，列出准确率/延迟/成本/运维复杂度 (2)AI分析电商场景特殊需求：实时性（大促秒级索引）、同义词/错别字容错、个性化排序 (3)输出「渐进迁移」建议：先用混合检索增强ES，再逐步引入向量","直接相信研发的判断","做完整Demo再对比","跟风业界大模型搜索","让用户投票选方案"],scores:[4,0,0,2,0],best:0,explain:"技术决策=方案对比+场景分析+渐进策略。大促实时性要求决定了不能激进替换核心搜索。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为「游戏反外挂系统」写技术需求：涉及实时行为检测、机器学习模型、封禁策略、申诉流程。",q:"如何用AI写出研发能落地的需求？",opts:["四步法：(1)AI解释反外挂技术栈（客户端检测/服务端校验/行为模型/设备指纹） (2)描述业务场景→AI转化为技术约束（检测延迟<2s/误封率<0.1%） (3)AI按「功能需求+非功能需求+接口规范」生成初稿 (4)用AI模拟研发评审找出不可实现的表述","写成普通PRD让研发自己理解","把所有技术细节全写进需求","只写业务需求不写技术约束","让安全团队自己写"],scores:[4,0,0,0,0],best:0,explain:"反外挂需求=场景→技术转译+非功能约束（延迟/误封率）。误封率是产品生命线，必须量化。"},
{level:2,difficulty:"高阶",scenario:"场景：电商大促（双11）需要支撑瞬时百倍流量：秒杀、直播、满减、库存扣减。你负责产品技术方案评审。",q:"如何设计Prompt链完成高并发方案设计？",opts:["5轮Prompt链：(1)系统架构师→设计整体架构（CDN/网关/缓存/分库分表） (2)流量治理专家→设计限流/降级/熔断策略 (3)库存一致性专家→设计秒杀库存扣减方案（Redis+Lua/乐观锁） (4)数据工程师→设计大促数据链路（实时大屏/离线复盘） (5)压测顾问→设计容量评估和压测方案","一次性让AI写完整方案","参考淘宝公开技术文章","让研发团队自己设计","按日常架构扩容机器"],scores:[4,0,1,0,0],best:0,explain:"大促架构=架构→流量→库存→数据→压测五环。库存一致性是电商高并发的「魔鬼细节」，必须专门设计。"}],
workflow: [{level:0,difficulty:"初阶",scenario:"场景：你每天要汇总电商各业务线（自营/第三方/直播/跨境）的前一日GMV、订单、退款、库存数据。",q:"如何用AI自动化日报？",opts:["搭建AI日报引擎：(1)设计标准化日报模板（4业务线×5指标） (2)各数据源接入→AI自动提取计算 (3)AI标注异常（某业务线退款率突增标红） (4)生成含归因分析和建议的日报→你审核后发管理层群","继续手工做Excel日报","让各业务线自己汇报","只看总GMV一个指标","改成周报减少负担"],scores:[4,0,0,0,1],best:0,explain:"日报自动化=模板+AI提取+异常标注+人工审核。从1小时→5分钟，AI还擅长发现你注意不到的异常。"},
{level:1,difficulty:"中阶",scenario:"场景：你要推动游戏团队建立「AI嵌入版本评审」流程：需求评审、美术评审、数值评审目前各开各的会，效率低、口径不一。",q:"如何设计AI协同的评审体系？",opts:["三阶段嵌入：(1)评审前-AI预审PRD（逻辑漏洞/数值合理性/美术风格一致性） (2)评审中-AI实时结构化记录决议和争议点 (3)评审后-AI生成纪要+行动项+验收清单→跨专业评审打通，评审周期缩短30%","让AI替你做决策","只把会议纪要用AI生成","合并所有评审会","减少评审环节"],scores:[4,0,0,0,0],best:0,explain:"AI评审=前中后全流程。游戏评审最痛的是专业口径不一（数值/美术/玩法），AI预审先统一基线。"},
{level:2,difficulty:"高阶",scenario:"场景：你是互联网产品总监，要建立团队级「AI+增长」工作体系：5个PM，覆盖电商/游戏/社交三条产品线。",q:"如何设计可落地的AI工作体系？",opts:["四层体系：(1)工具层-按产品线配置AI工具矩阵（数据分析/AB测试/用户洞察） (2)流程层-在需求洞察/实验设计/复盘节点嵌入AI (3)知识层-共建「增长实验Prompt库」和失败案例库 (4)度量层-追踪AI使用对实验迭代速度的影响→季度复盘调整","每人自己摸索AI用法","买一套增长平台","设一个AI增长专员","发一份AI使用规范"],scores:[4,1,0,0,0],best:0,explain:"团队AI体系=工具+流程+知识+度量。互联网增长是实验驱动，AI要嵌进「假设→实验→学习」循环。"}],
security: [{level:0,difficulty:"初阶",scenario:"场景：你想用公共AI分析电商用户行为数据（含手机号、地址、浏览记录）来做用户画像。",q:"正确的做法是？",opts:["先用AI生成脱敏脚本→手机号/地址/设备ID全部脱敏→确认脱敏完整（K-匿名检查）→再用企业版AI分析脱敏数据→原始数据绝不上传公共AI","直接上传，数据量大AI公司不会关注","只删手机号就上传","把数据缩小到看不出来","让外包公司分析"],scores:[4,0,0,0,0],best:0,explain:"用户数据红线=先脱敏后上传+企业版AI。电商用户隐私受《个人信息保护法》严格保护，脱敏不彻底=违法。"},
{level:1,difficulty:"中阶",scenario:"场景：游戏平台要落实「未成年人防沉迷」与内容合规，涉及实名认证、时长限制、消费限额、社区内容审核。",q:"如何用AI合规地落地？",opts:["三线并行：(1)合规线-实名认证对接国家新闻出版署，AI辅助识别冒用成年人账号的行为模式 (2)内容线-AI预审+人工复核游戏内UGC（语音/文字/头像） (3)数据线-防沉迷数据留存与监管报送自动化→定期合规审计","只做实名认证就够","靠人工审核所有内容","让玩家自行承诺","等监管处罚再整改"],scores:[4,0,0,0,0],best:0,explain:"游戏合规=实名+内容审核+数据报送三线。防沉迷是强监管要求，AI只能辅助识别，合规责任在平台。"},
{level:2,difficulty:"高阶",scenario:"场景：社交平台要设计「AI内容审核系统」的安全架构：每日数亿条内容，需平衡漏检率、误伤率和成本。",q:"最佳架构设计？",opts:["四层架构：(1)召回层-AI多模型并行初筛（文本/图片/视频/音频）命中敏感池 (2)决策层-风险分+规则引擎分级处置（拦截/限流/人工） (3)人工层-高置信疑点进人工复核台，AI辅助提供上下文 (4)审计层-全流程留痕，定期用标注数据反哺模型→建立漏检/误伤双指标监控","全部用AI自动拦截","全部人工审核","只审核图片不审核文字","上线后不管效果"],scores:[4,0,0,0,0],best:0,explain:"内容审核=AI召回+分级处置+人工兜底+持续反哺。漏检和误伤是跷跷板，必须双指标监控。"}],
strategy: [{level:0,difficulty:"初阶",scenario:"场景：CEO问：AI对互联网行业最大的影响是什么？",q:"作为PM的最佳回答？",opts:["AI让互联网从「流量驱动」走向「智能驱动」：(1)推荐/搜索全面AI化让分发效率指数级提升 (2)内容生产成本骤降催生UGC-AIGC生态 (3)运营从「经验驱动」到「数据+AI实时决策」 (4)商业化的广告/电商/会员都开始按「人×场景」动态定价","AI能替代所有程序员","AI让获客成本更低","AI主要影响算法部门","AI是噱头短期无实际价值"],scores:[4,0,0,0,0],best:0,explain:"互联网PM的战略视角：AI不是单点功能，而是把「人找内容」变成「智能匹配」，重塑整个商业模式的成本结构。"},
{level:1,difficulty:"中阶",scenario:"场景：竞品电商App上线了「AI购物助手」（对话式导购+智能比价），用户使用率很高。CEO问要不要跟进。",q:"你的战略级回答？",opts:["不盲目跟进，三步分析：(1)AI拆解竞品功能：是真AI对话还是搜索包装？用户场景是「比价」还是「决策辅助」？ (2)评估自身优势：供应链、会员体系、直播生态 (3)提出差异化策略：「AI购物助手」嵌入我们已有的比价+直播+会员场景，先小范围灰度测试用户真实使用率","马上做一个一样的","不做，我们有直播优势","外包给AI公司做","等竞品验证后再跟进"],scores:[4,0,0,0,1],best:0,explain:"AI功能跟进=竞品拆解+自身优势+渐进灰度。对话式购物是入口之争，但转化要依赖已有的供应链和场景。"},

prompt: [{level:0,difficulty:"初阶",scenario:"场景：你是能源集团PM，手上有风电场过去2年的运行数据（发电量、风速、设备温度、故障记录），想用AI发现发电效率下降原因。",q:"如何设计Prompt让AI成为能源分析专家？",opts:["设定「风电运维数据分析师」角色→描述数据字段含义（机组编号/风速/功率曲线/故障代码）→要求：(1)按季节和时段分析发电量趋势 (2)识别效率偏离功率曲线的机组 (3)关联故障代码与发电损失 (4)输出维护优先级建议","把数据丢给AI让它自己看","只看总发电量变化","让AI预测明天发电量","问AI「风电怎么提效」"],scores:[4,0,0,0,0],best:0,explain:"能源数据分析=角色+字段解释+多维诊断。风电效率问题要结合功率曲线和设备健康度交叉分析。"},

{level:1,difficulty:"中阶",scenario:"场景：大型地产项目（综合体）需要评估「BIM+AI」的落地价值：设计审查、碰撞检测、施工进度、运维管理。",q:"如何用AI工具组合评估？",opts:["四工具协同：(1)BIM平台（Revit+AI插件）做碰撞检测和设计审查 (2)Claude分析施工进度数据识别延误风险 (3)GIS+AI分析项目区位和配套价值 (4)汇总生成「BIM+AI投入产出分析报告」→支撑立项决策","凭经验判断BIM值不值","直接买最贵的BIM平台","只做设计阶段BIM","让施工单位决定"],scores:[4,0,0,0,0],best:0,explain:"BIM评估=设计+施工+运维+区位四维。BIM+AI的价值在「全生命周期」，单阶段应用ROI有限。"},
{level:2,difficulty:"高阶",scenario:"场景：政务部门要搭建「AI辅助公文与材料智能写作」试点：政策解读、汇报材料、会议纪要、舆情简报。",q:"如何用AI工具链设计试点？",opts:["四层工具链：(1)私有化部署大模型（数据不出域） (2)知识库-RAG接入政策文件库和内部制度库 (3)应用层-公文写作/纪要生成/舆情分析三个试点场景 (4)管理端-权限管控+全程留痕+人工审核闭环→先跑通1个场景再推广","直接用公共版AI写公文","让外包公司开发全套系统","每个处室各用各的AI","等上级统一建设"],scores:[4,0,0,0,0],best:0,explain:"政务AI试点=私有化+知识库+场景化+管控闭环。数据不出域是底线，留痕审核是必须。"}],
data: [{level:0,difficulty:"初阶",scenario:"场景：能源集团有多个电厂的运行数据（发电量、煤耗、设备温度、停机时间），需要找出「煤耗偏高」的电厂和原因。",q:"AI数据分析方法？",opts:["上传数据→描述业务场景→AI分析：(1)各电厂煤耗对标（设计值/标杆值/历史值） (2)煤耗与负荷率/环境温度/设备状态的关联 (3)识别「异常机组」做深度诊断 (4)输出：降耗改进清单（燃烧优化/设备检修/负荷调度）","只看各厂总煤耗排名","让电厂各自写报告","按设计值直接考核","等能耗监测平台上线"],scores:[4,0,0,0,0],best:0,explain:"能源数据分析=对标+关联+诊断+改进。煤耗是能源集团的核心成本，AI帮你从「排名」到「归因」。"},
{level:1,difficulty:"中阶",scenario:"场景：地产项目开盘3个月去化率只有35%，你有来访数据、认筹数据、渠道数据、竞品项目数据。",q:"如何用AI找出滞销根因？",opts:["四步分析：(1)AI拆分去化漏斗（来访→认筹→签约）各环节转化 (2)按渠道分析来访质量（自然/中介/老带新） (3)对比竞品项目（定价/户型/优惠/卖点） (4)输出：根因假设Top3（定价偏高/户型错配/渠道乏力）+对应调整策略","降价促销冲量","增加中介佣金","换营销负责人","只看整体去化率"],scores:[4,0,0,0,0],best:0,explain:"地产去化诊断=漏斗+渠道+竞品对标。滞销往往是「产品-价格-客群」错配，不是单纯营销问题。"},
{level:2,difficulty:"高阶",scenario:"场景：政务大数据局要建设「城市运行数据治理平台」：跨部门数据汇聚、质量治理、共享开放、安全分级。",q:"如何设计AI辅助的数据治理方案？",opts:["五层方案：(1)汇聚层-多源数据接入（政务/物联网/视频） (2)治理层-AI自动质量检测（缺失/重复/异常）与标准化 (3)目录层-数据资源目录与血缘管理 (4)共享层-「数据可用不可见」隐私计算+分级授权 (5)运营层-数据质量KPI看板→AI辅助每层设计并自动生成治理报告","先建数据湖再说","让各部门报数据目录","买一套商业数据中台","只治理重点部门数据"],scores:[4,0,0,0,0],best:0,explain:"政务数据治理=汇聚→治理→目录→共享→运营闭环。「数据可用不可见」是破解数据共享顾虑的关键。"}],
content: [{level:0,difficulty:"初阶",scenario:"场景：你要为「智慧能源管理平台」写产品方案书：面向集团管理层和电厂客户，需体现价值和技术实力。",q:"AI协作方式？",opts:["四步共创：(1)给AI平台功能清单和客户案例→生成3个价值叙事方向（降本/安全/双碳） (2)选方向→AI生成方案书框架（行业痛点→方案架构→应用场景→客户价值） (3)AI逐章生成初稿→人工注入真实数据和案例 (4)AI统一风格并做「挑刺」审查逻辑漏洞","让AI自由发挥写一份","参考竞品方案书改写","找咨询公司代写","只写技术参数"],scores:[4,0,0,0,0],best:0,explain:"能源方案书=价值叙事+架构+场景+数据。B端方案书要「先讲价值再讲技术」，AI辅助构建叙事。"},
{level:1,difficulty:"中阶",scenario:"场景：地产项目要准备「一房一价」备案材料和市场分析报告：面向住建部门和银行，需数据严谨、口径统一。",q:"如何用AI高效产出合规材料？",opts:["四步流程：(1)AI整理周边竞品成交数据和本盘房源数据（去重/补全/口径统一） (2)AI按备案规则生成一房一价建议表和定价逻辑说明 (3)AI生成市场分析报告（供需/价格走势/竞品对标） (4)人工复核数据源和结论→确保与报备系统一致","手工整理几百套房源数据","让策划代理公司写","参考其他项目报告改","只提交价格表不写分析"],scores:[4,0,0,0,0],best:0,explain:"地产备案材料=数据口径统一+规则合规+报告支撑。AI降低整理工作量，但数据来源必须人工复核。"},
{level:2,difficulty:"高阶",scenario:"场景：你要在「双碳与能源转型」行业峰会上做主题演讲：听众是能源企业高管和政府部门领导。",q:"如何用AI打造有分量的演讲？",opts:["六步打造：(1)AI搜集最新双碳政策和行业数据（装机量/碳交易价格） (2)AI提炼3个核心观点+数据支撑 (3)「魔鬼代言人」挑战每个观点找反例 (4)AI构建「政策→技术→商业→案例」叙事框架 (5)AI优化语言节奏（政务场合用词审慎） (6)人工注入企业实践和领导讲话语境","让AI写稿直接念","讲企业产品宣传PPT","引用大量技术参数","只讲通用双碳趋势"],scores:[4,0,0,0,0],best:0,explain:"能源峰会演讲=政策+数据+观点+案例。政务场合用词必须审慎，AI辅助查证、人把握分寸。"}],
dev: [{level:0,difficulty:"初阶",scenario:"场景：研发团队提议用「AI视觉+IoT」替代人工巡检（变电站/管廊/工地），你是PM需评估技术可行性和ROI。",q:"AI辅助决策方式？",opts:["三步评估：(1)AI对比传统巡检vs AI视觉巡检（准确率/覆盖度/成本/误报率） (2)AI分析场景适配度：巡检点位密度/环境光照/设备识别难度 (3)AI估算ROI：减少人力成本×降低漏检风险→输出「分阶段试点」建议（先试点高风险点位）","直接相信研发提案","做完整POC再评估","全部点位一次性上","等标杆案例出现"],scores:[4,0,0,0,0],best:0,explain:"AI巡检评估=方案对比+场景适配+ROI。能源/工地场景环境恶劣，AI误报率是落地最大障碍，必须试点验证。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为「智慧工地」平台写技术需求：人员定位、塔吊监测、扬尘噪音、视频AI预警。",q:"如何用AI写出可落地的需求？",opts:["四步法：(1)AI解释各子系统技术要点（UWB定位/传感器/边缘计算） (2)描述工地场景→AI转化为技术约束（定位精度<1m/断网可用/防尘防水） (3)AI按「功能+非功能+接口」生成初稿（对接住建局监管平台） (4)用AI模拟施工方和监管方评审","写成普通PRD让研发理解","所有技术细节都写进去","只写业务需求","让设备厂商写需求"],scores:[4,0,0,0,0],best:0,explain:"智慧工地需求=场景→技术转译+现场约束（断网/粉尘/高温）。对接监管平台是政务属性，必须写清。"},
{level:2,difficulty:"高阶",scenario:"场景：能源集团要建设「集团级能源管理平台」：覆盖风电/光伏/火电/储能多业态，涉及实时数据、预测、调度。",q:"如何设计Prompt链完成平台架构设计？",opts:["5轮Prompt链：(1)能源架构师→设计多业态数据接入架构（OPC-UA/IEC 104/Modbus） (2)时序数据专家→设计时序库选型和数据治理 (3)预测算法专家→设计发电预测（功率/辐照/气象）模型体系 (4)调度优化专家→设计多能互补调度算法 (5)安全专家→设计等保三级+工控安全方案→每轮输出下轮输入","一次性让AI写完整方案","参考华为数字能源方案","让各业态各自建平台","先买商业平台再定制"],scores:[4,0,0,0,0],best:0,explain:"能源平台架构=接入→时序→预测→调度→安全五环。多业态数据协议繁杂，工控安全是红线。"}],
workflow: [{level:0,difficulty:"初阶",scenario:"场景：你每周要出「集团项目周报」：覆盖能源/地产/政务三条业务线的在建项目进度、资金、风险。",q:"AI自动化方案？",opts:["搭建AI周报管线：(1)定义周报模板（3业务线×进度/资金/风险/决策点） (2)各项目部用AI先填各自部分（从项目系统自动拉取） (3)汇总后AI统一口径+提炼「本周需集团决策的3件事」 (4)AI生成汇报版和详细版→你10分钟审核","手工收集各项目Excel","让各项目部各自汇报","缩成1页只报风险","只报进度不报资金"],scores:[4,0,0,0,0],best:0,explain:"项目周报自动化=模板+AI填充+口径统一+决策点提炼。集团周报的价值是「决策点」，不是数据罗列。"},
{level:1,difficulty:"中阶",scenario:"场景：地产集团要推动「AI嵌入方案评审」：设计、成本、营销、工程多部门评审，目前图纸意见分散、决策慢。",q:"如何设计AI协同的评审体系？",opts:["三阶段嵌入：(1)评审前-AI预审图纸和方案（规范符合性/成本合理性/风险点） (2)评审中-AI实时汇总各部门意见并归类冲突点 (3)评审后-AI生成决议清单（谁/何时/改什么）并追踪闭环→评审周期从2周压缩到1周","让AI替各部门做决策","只把纪要交给AI整理","合并各部门评审会","减少评审专业"],scores:[4,0,0,0,0],best:0,explain:"地产评审AI化=预审+汇总+闭环。跨部门意见冲突是评审慢的根因，AI先归类和标红冲突点。"},
{level:2,difficulty:"高阶",scenario:"场景：你是大型项目集团数字化总监，要建立「AI+项目管理」工作体系：多业态、多项目部、上千人协同。",q:"如何设计可落地的AI体系？",opts:["四层体系：(1)工具层-统一AI平台（私有化）+项目管理系统集成 (2)流程层-在立项/设计/招采/施工/验收节点嵌入AI（可研初稿/标书审查/进度预警） (3)知识层-沉淀「项目经验库」和造价/合同Prompt库 (4)度量层-追踪AI对项目周期和成本的影响→每季度复盘","每人自己探索AI用法","买一套项目管理软件","设一个AI专员岗位","发一份AI使用通知"],scores:[4,0,0,0,0],best:0,explain:"集团AI体系=平台+流程+知识+度量。大型项目知识复用的价值巨大（造价库/合同模板），AI让经验可检索。"}],
security: [{level:0,difficulty:"初阶",scenario:"场景：你想用公共AI分析电力设施运行数据（发电量、设备参数、故障记录）来优化运维策略。",q:"正确的做法是？",opts:["电力数据属于关键信息基础设施数据：先评估数据敏感级别→涉及电网拓扑/设备参数的数据严禁上传公共AI→用企业私有化AI或本地部署模型分析→必要时先脱敏（去除站点名称/坐标/产权信息）","直接上传分析没问题","只删掉电厂名称就上传","让设备厂商帮分析","数据量小应该没事"],scores:[4,0,0,0,0],best:0,explain:"能源数据安全：关键信息基础设施数据受《数据安全法》保护，电网拓扑等属于核心数据，必须私有化处理。"},
{level:1,difficulty:"中阶",scenario:"场景：政务项目要建设政务系统，涉及市民个人信息和部门业务数据，需通过等保三级和密评。",q:"合规建设要点？",opts:["三线并行：(1)安全线-等保三级建设（边界防护/审计/容灾）+商用密码应用改造 (2)数据线-数据分类分级+个保法合规（最小化收集/授权） (3)管理线-安全管理制度+人员培训+渗透测试→用AI辅助编制等保材料，但测评必须第三方","系统先上线后补测评","只做等保不碰密评","数据越多越好便于分析","让开发团队兼做安全"],scores:[4,0,0,0,0],best:0,explain:"政务合规=等保+密评+数据分级+管理制度四线。政务系统「未过测评先上线」是重大合规风险。"},
{level:2,difficulty:"高阶",scenario:"场景：能源集团要设计「生产控制大区与信息管理大区」的安全架构（等保+电力监控系统安全防护规定）。",q:"最佳架构设计？",opts:["五层防护：(1)网络层-生产控制大区与管理大区物理/逻辑隔离（横向隔离装置） (2)边界层-纵向加密认证（调度数据网） (3)主机层-工控主机白名单+补丁管理 (4)监测层-安全监测平台（入侵检测/日志审计） (5)管理层-安全运维中心+应急预案→AI用于日志分析和告警降噪，不直连控制区","两个大区直接打通便于管理","全部上云监控","只做边界防火墙","让AI直接控制设备"],scores:[4,0,0,0,0],best:0,explain:"电力安全=横向隔离+纵向加密+主机白名单+监测+管理五层。生产控制区必须物理隔离，AI只能用于监测分析。"}],
strategy: [{level:0,difficulty:"初阶",scenario:"场景：CEO问：AI对能源/地产/政务这类大型项目行业最大的影响是什么？",q:"作为PM的最佳回答？",opts:["AI让「全生命周期数字化」成为现实：(1)能源-发电预测/设备预测维护让「无人值守电站」成为可能 (2)地产-BIM+AI让设计施工运维全链路数字化 (3)政务-数据驱动让城市治理从「经验决策」到「科学决策」→共性：AI把重资产行业从「人海战术」推向「数据智能」","AI能替代工程师","AI让项目成本更低","AI主要影响IT部门","重资产行业不需要AI"],scores:[4,0,0,0,0],best:0,explain:"大型项目PM的视角：AI的价值不在「炫技」，而在让动辄百亿的项目「看得清、算得准、管得住」。"},
{level:1,difficulty:"中阶",scenario:"场景：国家推进「双碳」和「城市更新」政策，CEO问集团要不要加大AI投入布局智慧能源/智慧城市。",q:"你的战略级回答？",opts:["三步分析：(1)政策解读-AI梳理双碳/城市更新/数字政府政策要点和资金支持 (2)能力评估-集团在数据、场景、人才三方面的基础 (3)差异化定位-不追热点，选「能源数字化（降本）+政务数字化（合规）」两个有现金流的方向试点，用政策窗口期跑通商业模式","All-in智慧城市赛道","等政策明确再行动","全面对标华为/腾讯","只做能源不做政务"],scores:[4,0,0,0,0],best:0,explain:"政策响应=解读+能力评估+差异化定位。政策窗口期是机会也是陷阱，要选「有现金流」的方向切入。"},
{level:2,difficulty:"高阶",scenario:"场景：董事会要求你提出「未来3年AI驱动的集团数字化转型战略」：能源+地产+政务多业务协同。",q:"最能说服董事会的方案？",opts:["「一核两翼」战略：(1)核-统一数据底座：打通三业务线数据，建AI中台 (2)翼1-能源数字化：发电预测/预测维护/碳资产管理，3年降本X亿 (3)翼2-项目数字化：BIM+AI设计/智慧工地/智慧楼宇，从卖空间到卖服务→每阶段配投资、KPI、里程碑和风险预案","一次性重金建设AI中台","收购一家人工智能公司","三条业务线各自搞AI","等业界成熟方案再行动"],scores:[4,0,0,0,0],best:0,explain:"集团战略要：协同逻辑+量化KPI+渐进投资。「一核两翼」让数据底座支撑两个有现金流的业务方向。"}],

prompt: [{level:0,difficulty:"初阶",scenario:"场景：你需要在项目中集成一个REST API客户端。手上有第三方API文档（30页PDF），你需要快速理解接口并写出调用代码。",q:"如何用Prompt让AI最高效地完成任务？",opts:["A. 上传PDF→设定「高级后端工程师」角色→描述项目技术栈（Node.js+TypeScript）→要求：(1)提取所有接口的请求/响应格式 (2)生成带类型定义的API客户端代码 (3)添加错误处理和重试逻辑","B. 让AI读文档然后自己写代码","C. 把文档贴进去让AI总结","D. 只看几个主要接口先写着","E. 问AI「这个API怎么用」"],scores:[4,0,1,1,0],best:0,explain:"技术文档→代码的Prompt=角色+技术栈+结构化输出。带类型定义和错误处理的代码才是生产级的。"},{level:1,difficulty:"中阶",scenario:"场景：你要优化一个N+1查询的数据库性能问题。涉及复杂的ORM关系：User→Order→OrderItem→Product。需要AI帮你设计高效的查询方案。",q:"最佳Prompt策略？",opts:["A. 三步法：(1)描述数据模型和访问模式→AI分析N+1问题位置 (2)AI生成优化方案对比（eager loading/batch query/DataLoader/caching）(3)AI输出带benchmark注释的优化代码+迁移风险评估","B. 让AI直接写SQL替代ORM","C. 问AI「怎么优化数据库查询」","D. 把所有关联都改成lazy loading","E. 加更多索引解决问题"],scores:[4,0,0,0,1],best:0,explain:"性能优化Prompt=数据模型→问题分析→方案对比→代码输出。关键是展示完整的访问模式而非孤立查询。"},{level:2,difficulty:"高阶",scenario:"场景：CTO要求你用AI辅助完成微服务拆分的架构设计。现有单体应用（Java Spring），需拆分为5-8个微服务。涉及：数据拆分、通信模式、事务处理。",q:"Prompt链设计？",opts:["A. 4轮Prompt链：(1)「系统架构分析师」→理解现有单体架构→提取限界上下文 (2)「分布式系统专家」→设计服务边界+通信协议(同步/异步/事件驱动) (3)「数据架构师」→数据拆分策略(Saga/CQRS/Outbox) (4)「技术评审员」→评估方案的风险/复杂度/迁移成本","B. 一次性把所有需求描述给AI","C. 先参考Netflix的微服务架构","D. 让AI推荐开源微服务框架","E. 拆成越多服务越好"],scores:[4,0,1,0,0],best:0,explain:"架构设计Prompt链=理解现状→边界定义→技术方案→风险评估。微服务拆分最难的部分是数据，所以需要专门的「数据架构师」角色。"},

{level:0,difficulty:"初阶",scenario:"场景：你刚接手一个10万行的Java商城项目，没有任何文档，需要快速理解核心下单流程。",q:"如何用AI最高效地完成大型代码库解读？",opts:["四步法：(1)让AI生成项目架构图（模块依赖关系） (2)标注核心流程的入口方法（如下单API） (3)生成关键类的职责说明 (4)输出业务术语表→人工Review确认","随机挑几个Service文件让AI解释","把整个项目压缩上传让AI自己看","让AI直接生成项目文档","自己读代码然后让AI解释不懂的部分"],scores:[4, 1, 0, 2, 3],best:0,explain:"大型代码库解读=架构→流程入口→类职责→术语表四步走。AI擅长的就是把10万行代码浓缩成5页可消化文档。"},
{level:0,difficulty:"初阶",scenario:"场景：你需要为一个已有函数补充完整的单元测试（含正常/边界/异常场景），手写太慢且容易遗漏。",q:"如何用AI高效生成全面的单元测试？",opts:["三步法：(1)给AI函数代码→要求生成覆盖正常/边界/异常场景的测试骨架 (2)AI运行测试并修复编译错误 (3)你Review后让AI补充Mock和断言","让AI一次性为所有函数生成测试","告诉AI帮我写单元测试","让AI只生成Happy Path测试","不写测试直接让AI重构"],scores:[4, 0, 1, 2, 0],best:0,explain:"单元测试生成=骨架→运行修复→人工Review→补充Mock。关键是不让AI跳过边界和异常场景。"},
{level:0,difficulty:"初阶",scenario:"场景：你遇到一个复杂的Rust编译器错误（300字，含生命周期标注），看不懂。",q:"如何让AI帮你理解并修复编译错误？",opts:["三步法：(1)把完整错误贴给AI→要求用「初学者语言」逐行解释 (2)让AI给出3个可能的修复方案 (3)对每个方案解释为什么能修复→你选一个实施","把错误信息直接贴给AI说帮我修","把错误信息贴给AI让它解释意思","搜索错误信息的关键词找答案","忽略这个错误继续写"],scores:[4, 0, 1, 2, 0],best:0,explain:"复杂编译错误=AI初学解释→多方案→方案原理理解。Rust的生命周期错误特别适合让AI用比喻解释。"},
{level:0,difficulty:"初阶",scenario:"场景：你需要把一个Python 2.7的旧项目迁移到Python 3.11，有5000行代码，涉及字符串编码、print语句、迭代器变化。",q:"如何用AI辅助完成Python 2→3的迁移？",opts:["四步法：(1)让AI分析代码库标注所有不兼容点 (2)按模块生成迁移后的代码 (3)AI生成单元测试验证行为一致性 (4)你Review差异→重点检查字符串编码部分","用2to3工具自动迁移然后人工修","让AI一次性迁移整个项目","逐文件手工修改","不迁移，继续用Python 2.7"],scores:[4, 2, 0, 1, 0],best:0,explain:"Python迁移=AI标注不兼容点→按模块迁移→测试验证→人工重点Review编码部分。自动化工具只能做80%，剩下20%需要AI+人协作。"},

{level:1,difficulty:"中阶",scenario:"场景：你正在开发一个电商推荐引擎，需要根据用户历史行为数据（浏览/加购/购买）生成个性化推荐。你决定用Prompt链而非单次对话来完成。",q:"用Prompt链设计推荐引擎的最佳方式？",opts:["四步链：(1)「数据分析师」→分析用户行为模式提取偏好标签 (2)「算法顾问」→推荐协同过滤+内容的混合策略 (3)「代码生成器」→输出带注释的推荐算法伪代码 (4)「测试工程师」→生成A/B测试方案验证效果","一次性描述所有需求让AI生成完整代码","让AI参考Amazon的推荐算法直接实现","用一个长Prompt覆盖所有步骤","分两步：先分析数据再生成代码"],scores:[4, 0, 0, 1, 2],best:0,explain:"Prompt链=角色接力→分析→设计→实现→验证。每一步产出作为下一步输入，比单次对话可控10倍。"},
{level:1,difficulty:"中阶",scenario:"场景：你在做一个多人协作项目，不同团队成员用AI辅助写不同模块。你发现大家写的AI提示词质量参差不齐，导致AI输出风格和代码规范不一致。",q:"如何用Prompt模板提升团队AI协作效率？",opts:["建立团队Prompt模板库：(1)定义标准化角色卡（含技术栈/代码风格/命名规范） (2)制定Prompt检查清单（目标明确/上下文完整/输出格式指定） (3)建立Prompt Review机制→好的Prompt沉淀为模板","让每个人自己摸索Prompt","指定一个人统一用AI生成代码","禁止用AI写核心逻辑","只给高级开发者用AI工具"],scores:[4, 0, 0, 0, 1],best:0,explain:"Prompt模板化=角色卡+检查清单+Review机制。好的Prompt是团队资产，不是个人黑魔法。"},
{level:1,difficulty:"中阶",scenario:"场景：你正在重构一个支付模块，涉及多种支付渠道（微信/支付宝/银联）和复杂的状态机。每次和AI对话都需要解释一遍业务背景，效率很低。",q:"如何让AI记住项目上下文提高长线协作效率？",opts:["三步上下文管理：(1)建立项目上下文文档（架构说明/关键类图/业务规则/术语表）→每次新对话先喂这个文档 (2)用Git Pre-commit Hook自动更新上下文文档 (3)对话中让AI定期生成Session Summary→下次对话继续","每次重新描述一遍需求和背景","一个对话一直开着不要关","把所有代码一次性喂给AI","不用上下文管理，每次独立提问"],scores:[4, 0, 0, 1, 0],best:0,explain:"上下文管理=项目文档+自动更新+Session Summary。不让AI失忆，这是长线协作的基础设施。"},
{level:1,difficulty:"中阶",scenario:"场景：你写的AI Prompt效果不稳定——同一个Prompt有时输出很好有时很差，无法保证代码质量。你需要让Prompt输出更可靠。",q:"如何提升Prompt输出的稳定性和可靠性？",opts:["五步稳定化：(1)给AI「输出格式约束」→要求先输出思路再给代码 (2)加Few-shot示例→展示期望的输出结构 (3)要求自检→生成后自我Review检查点 (4)设定温度参数→代码生成用低temperature (5)如果输出不满意→用「Chain of Verification」让AI自我修正","多试几次选最好的","把Prompt写得更长更详细","换一个AI模型","接受不稳定性这是正常的"],scores:[4, 0, 1, 0, 0],best:0,explain:"Prompt稳定性=格式约束+示例+自检+参数控制+验证链。可靠输出不是靠运气而是靠工程化。"},

{level:2,difficulty:"高阶",scenario:"场景：作为Tech Lead，你要为团队建立「Prompt工程最佳实践」体系。团队有10人，涵盖前端/后端/数据/DevOps，每个人用AI的场景不同。",q:"如何设计团队的Prompt工程方法论？",opts:["四层体系：(1)基础层-通用Prompt原则(角色/上下文/约束/格式) (2)角色层-按岗位定制Prompt模板(前端/后端/数据/DevOps) (3)场景层-高频场景的Prompt SOP(Code Review/重构/测试/文档) (4)度量层-建立Prompt效果度量(一次通过率/修改轮次/代码采纳率)→持续优化","让大家分享好用的Prompt就行","找几个通用Prompt模板所有人通用","买Prompt管理工具的付费版","外包Prompt工程给咨询公司"],scores:[4, 0, 1, 0, 0],best:0,explain:"Prompt工程体系=通用原则+角色定制+场景SOP+效果度量。Prompt工程是团队肌肉不是个人技巧。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计一个「AI Agent」来自动化处理GitHub Issue——自动分类、分配负责人、甚至自动修复简单的Bug。这需要多个AI调用协同。",q:"如何设计多步骤AI Agent的Prompt编排？",opts:["五阶段Agent编排：(1)「分类器」→分析Issue类型(bug/feature/question)→路由 (2)「分析器」→对bug类Issue提取复现步骤和错误信息 (3)「规划器」→对可自动修复的生成修复计划 (4)「执行器」→生成代码修改并创建PR (5)「审查器」→自我Review代码变更是否合理→人工确认","用一个超长Prompt一次完成所有步骤","只做分类不自动修Bug","用LangChain这类框架不要手写Prompt","每个步骤用不同的AI模型"],scores:[4, 0, 0, 1, 1],best:0,explain:"Agent编排=路由→分析→规划→执行→审查。关键是每步有明确的输入/输出契约，Agent才能可靠协同。"},
{level:2,difficulty:"高阶",scenario:"场景：你发现团队成员越来越依赖AI写代码，但有些人的「AI依赖症」很严重——丧失了独立调试和架构设计的能力。作为Tech Lead你需要建立平衡。",q:"如何在团队中建立AI辅助与人能力的健康平衡？",opts:["三层平衡策略：(1)技能分级-AI负责重复/模板代码，人负责架构/安全/性能关键路径 (2)能力验证-定期「无AI日」确保核心能力不退化 (3)成长路径-从「AI执行者」（让AI写代码）→「AI设计者」（设计Prompt和架构）→「AI编排者」（编排多Agent协作）","减少AI使用保证人手工能力","放手让AI写所有代码","只让初级工程师用AI","组织培训教大家怎么用AI"],scores:[4, 0, 0, 0, 1],best:0,explain:"人机平衡=职责分级+能力验证+成长路径。目标不是不依赖AI，而是从「操作工」进化为「指挥家」。"},
{level:2,difficulty:"高阶",scenario:"场景：CTO要求你评估：公司应该自建AI辅助开发平台还是使用现有工具（Cursor/Copilot）？预算200万/年，团队100人。",q:"自建vs采购AI开发工具的决策Prompt？",opts:["四维决策Prompt：(1)「TCO分析师」→对比3年总成本（自建：人力+算力+维护 vs 采购：许可证费） (2)「安全合规官」→评估代码数据安全（自建：数据不出境 vs 采购：需确认数据处理协议） (3)「效率分析师」→对比开发效率提升（需POC数据） (4)「风险评估师」→评估方案的技术风险和维护负担→输出决策矩阵","直接用Cursor最便宜省事","自建更有掌控力","看竞品公司怎么选","先买一年Cursor试试再说"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI工具决策=成本+安全+效率+风险四维评估。决策Prompt的价值是把直觉判断变成结构化分析。"},

tools: [{level:0,difficulty:"初阶",scenario:"场景：你接手了一个遗留代码库（5万行Python），没有任何单元测试。需要快速理解核心逻辑并开始安全重构。",q:"AI工具组合的最佳用法？",opts:["A. 用Claude/Cursor分析代码库→生成模块依赖图和核心流程文档→AI辅助生成关键路径的单元测试→用测试保护重构","B. 逐行读代码直到理解","C. 直接开始重构遇到问题再改","D. 让AI重写整个代码库","E. 找原开发者做交接"],scores:[4,0,0,0,1],best:0,explain:"遗留代码接手=AI理解+文档化+测试保护+重构。测试是重构的安全网，AI帮你快速建立这张网。"},{level:1,difficulty:"中阶",scenario:"场景：团队要从JavaScript迁移到TypeScript。项目有200+文件，你作为Tech Lead需要评估工具和方案。",q:"AI辅助迁移方案？",opts:["A. 多工具协同：(1)用AI分析项目结构→识别迁移难点(动态类型/第三方库无类型) (2)AI生成分阶段迁移计划→从叶子模块开始 (3)Cursor辅助逐文件迁移 (4)AI自动生成缺失的类型声明","B. 一次性全部改为.ts","C. 用ts-migrate自动跑然后人工修","D. 只在新代码用TypeScript","E. 让每个开发者自己迁移"],scores:[4,0,2,0,0],best:0,explain:"大规模迁移=分析+计划+工具+自动化四件套。AI帮你做最枯燥的类型声明生成。"},

{level:0,difficulty:"初阶",scenario:"场景：你入职新公司，发现代码仓库里有200+个项目模块，每个模块的README质量不一。你需要快速建立技术全景图。",q:"AI工具组合快速理解大型代码仓库？",opts:["工具链：(1)Cursor/Claude加载项目→分析目录结构生成模块依赖图 (2)对每个核心模块让AI生成5句话职责摘要 (3)AI提取公共组件和工具库 (4)汇总为技术全景文档→人工Review","逐个模块看代码","找老员工问","只看自己负责的模块","等团队知识分享会"],scores:[4, 0, 1, 0, 0],best:0,explain:"代码库全景=AI分析+模块摘要+依赖图。200个模块AI能在1小时内搞定，手工人肉可能需要2周。"},
{level:0,difficulty:"初阶",scenario:"场景：你在配置一个新的微服务项目：需要选型技术栈、生成项目脚手架、配置CI/CD、设置代码规范。之前每次都要花半天。",q:"AI组合工具加速项目初始化？",opts:["四步初始化：(1)AI根据技术栈生成脚手架代码（含目录结构/配置文件） (2)AI生成Dockerfile和docker-compose (3)AI生成GitHub Actions CI配置 (4)AI生成ESLint/Prettier配置→一键启动","手动创建所有配置文件","从老项目复制粘贴配置","用create-react-app之类的CLI","让实习生配置"],scores:[4, 0, 1, 0, 0],best:0,explain:"项目初始化=脚手架+容器+CI+规范四合一。AI让项目初始化从半天→15分钟。"},
{level:0,difficulty:"初阶",scenario:"场景：你要把一段Python数据处理脚本重写为Go语言的高并发版本。Python版200行，你不太熟悉Go。",q:"AI工具辅助跨语言代码迁移？",opts:["三步迁移：(1)把Python代码给AI→生成Go版本+标注语言差异点 (2)AI解释Go特有的goroutine/channel如何替代Python的多线程 (3)AI生成单元测试验证两种实现输出一致→人工Review并发安全","自己学Go然后重写","找Go开发人员帮忙","继续用Python不迁移","用自动转译工具"],scores:[4, 0, 0, 0, 1],best:0,explain:"语言迁移=翻译+差异标注+测试验证。AI不仅翻译代码还解释「为什么这么写」，是学习新语言的最佳方式。"},
{level:0,difficulty:"初阶",scenario:"场景：生产环境部署后发现一个Bug，但本地无法复现。只有生产日志中有错误堆栈。",q:"AI辅助远程生产Bug调试？",opts:["三步远程调试：(1)把错误堆栈+相关代码给AI→分析可能原因 (2)AI生成「假设-验证」测试用例→你在生产灰度环境验证 (3)AI根据验证结果缩小范围→最终定位根因+修复方案","加更多日志重新部署等Bug复现","回滚到上个版本","在生产环境直接调试","忽略这个Bug等用户报告更多信息"],scores:[4, 0, 0, 0, 0],best:0,explain:"远程调试=堆栈分析+假设验证+渐进定位。AI帮你把「只能靠猜」变成「有方向的排查」。"},

{level:1,difficulty:"中阶",scenario:"场景：你的团队同时维护5个微服务，每个有独立的CI/CD流水线。每次改公共库需要手动更新所有服务，容易遗漏。",q:"如何用AI工具建立智能化CI/CD？",opts:["三步智能CI/CD：(1)AI分析依赖关系图→自动识别公共库变更影响的服务 (2)AI生成「影响分析报告」→列出需要更新的服务和测试 (3)AI更新所有受影响服务的依赖版本并触发测试→失败自动回滚","手动更新每个服务的依赖","把所有服务合并成单体","用Git Submodule管理公共库","发布公共库后发邮件通知"],scores:[4, 0, 0, 0, 0],best:0,explain:"智能CI/CD=依赖分析+影响评估+自动更新。AI从「需要人记得」升级为「系统自动追踪」。"},
{level:1,difficulty:"中阶",scenario:"场景：你发现系统有性能瓶颈但不确定在哪里。你有：APM监控数据、慢查询日志、JVM GC日志、网络延迟数据。数据很多但不知道从哪入手。",q:"AI工具组合进行系统性能诊断？",opts:["多层诊断：(1)AI分析APM数据→定位最慢的5个接口 (2)对最慢接口关联分析慢查询+GC+网络→找出瓶颈层 (3)AI生成每个瓶颈的优化方案（查询优化/缓存/连接池/代码重构）→按ROI排序","逐个服务压测找瓶颈","加更多硬件资源","重构所有慢的代码","只看数据库慢查询"],scores:[4, 0, 0, 0, 0],best:0,explain:"性能诊断=APM+慢查询+GC+网络交叉分析。AI能做到多维度关联分析，人眼很难同时看4个维度的数据。"},
{level:1,difficulty:"中阶",scenario:"场景：你评估引入一个新工具（如Grafana替代现有的监控方案）。需要对比：功能覆盖度/学习成本/社区支持/集成复杂度/成本。",q:"AI辅助技术工具选型评估？",opts:["五步评估：(1)AI收集两个工具的官方文档→对比功能矩阵 (2)AI搜索社区讨论→提取真实用户的痛点和好评 (3)AI评估与现有技术栈的集成难度 (4)AI生成迁移成本和风险分析 (5)输出决策建议+推荐迁移路径","选大家都在用的","看官网对比找答案","两个都部署试试","听供应商销售介绍"],scores:[4, 0, 0, 1, 0],best:0,explain:"工具选型=文档对比+社区验证+集成评估+风险分析。AI帮你把「听销售吹」升级为「看数据说话」。"},
{level:1,difficulty:"中阶",scenario:"场景：团队在使用Jira+GitHub+Slack三个工具，但信息分散——需求在Jira、代码在GitHub、讨论在Slack。需要建立信息关联。",q:"AI工具集成打通研发工具链？",opts:["三步集成：(1)AI通过API拉取三个工具的数据→建立关联（Jira Story↔GitHub PR↔Slack讨论） (2)AI自动在PR描述中添加关联的Jira链接和Slack讨论摘要 (3)AI生成每周项目仪表盘→展示每个需求的代码实现进度+讨论热度","手动在工具间复制粘贴链接","只用GitHub管理一切","每周开同步会口头对齐","买一个全能项目管理工具"],scores:[4, 0, 0, 0, 0],best:0,explain:"工具链集成=API拉取+关联建立+自动汇总。AI打破信息孤岛，让需求→代码→讨论一键追溯。"},

{level:2,difficulty:"高阶",scenario:"场景：作为平台工程负责人，你要设计公司内部的「开发者AI工作台」——集成AI辅助编码/审查/测试/文档/部署的一站式工具。",q:"AI驱动的开发者工作台核心设计原则？",opts:["四大设计原则：(1)上下文穿透-AI能自动获取当前项目上下文(Git/Issue/文档)，不需要人重复解释 (2)渐进式介入-AI从建议开始→人工确认→逐步自动化 (3)可观测性-每次AI操作的耗时/采纳率/质量评分可追踪 (4)安全边界-代码数据不出企业网络、敏感操作需人工审批","把Cursor/Copilot等热门工具集成到一个页面","做一个Web界面让开发者提问","买现成的DevOps平台","做一个AI聊天机器人"],scores:[4, 0, 0, 0, 0],best:0,explain:"开发工作台=上下文穿透+渐进介入+可观测性+安全边界。关键不是集成多少工具，而是AI能多大程度理解开发者意图。"},
{level:2,difficulty:"高阶",scenario:"场景：你负责评估团队中AI工具的实际ROI。CTO想知道：AI工具到底提升了多少开发效率？是否值得续费？",q:"如何设计AI工具ROI的度量体系？",opts:["四维ROI度量：(1)效率维度-PR从创建到合并的时间变化/AI辅助vs纯手工的开发时间对比 (2)质量维度-AI辅助代码的Bug率/Code Review发现的问题数变化 (3)学习维度-新人独立上手时间变化/技术栈切换的学习曲线 (4)满意度维度-开发者NPS/重复性工作占比变化→综合ROI报告","看代码提交量是否增加","问团队成员AI好不好用","对比买了AI和没买时的开发速度","参考其他公司的ROI数据"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI ROI度量=效率+质量+学习+满意度四维。不能用单一指标（如代码行数）衡量AI价值。"},
{level:2,difficulty:"高阶",scenario:"场景：公司开源了一个内部工具，需要建立社区运营体系：Issue管理/PR Review/文档维护/社区讨论。只有2个人负责。",q:"如何用AI工具自动化开源社区运营？",opts:["AI社区运营体系：(1)「Issue triager」→自动分类/标记重复/回复常见问题 (2)「PR Reviewer」→自动检查代码规范/运行测试/标注潜在问题 (3)「文档管家」→根据代码变更自动更新API文档 (4)「社区管家」→自动回复常见讨论/引导新贡献者→人工处理复杂问题","招募更多社区志愿者","只维护不运营","减少Issue和PR的响应要求","外包社区运营"],scores:[4, 0, 0, 0, 0],best:0,explain:"开源社区运营=Issue分类+PR审查+文档更新+社区互动。AI让2个人管出20个人的效果。"},
{level:2,difficulty:"高阶",scenario:"场景：CEO提出「All in AI」战略，要求所有研发流程嵌入AI。你作为平台负责人需要设计全流程AI嵌入方案，覆盖需求→设计→开发→测试→运维。",q:"设计端到端AI嵌入研发全流程的方案？",opts:["五阶段端到端：(1)需求阶段-AI分析需求文档→拆解任务+识别模糊点+生成验收标准 (2)设计阶段-AI生成技术方案草案→架构评审→输出ADR文档 (3)开发阶段-AI辅助编码+实时代码审查+自动文档 (4)测试阶段-AI生成测试用例+自动化测试+缺陷预测 (5)运维阶段-AI异常检测+根因分析+自动修复建议","在开发阶段引入AI编码工具就够了","按照现有流程在关键节点加AI","先试点一个环节再推广","买一套完整的AI DevOps平台"],scores:[4, 0, 0, 0, 0],best:0,explain:"端到端AI嵌入=需求→设计→开发→测试→运维全覆盖。AI不是某个环节的插件而是贯穿全流程的操作系统。"},
{level:2,difficulty:"高阶",scenario:"场景：你发现不同的AI工具（Cursor/Copilot/Claude/GPT）在不同场景下效果差异很大：Cursor适合重构，Claude擅长架构设计，Copilot适合补全。",q:"如何设计多AI工具的协同编排策略？",opts:["多AI协同架构：(1)「路由层」→根据任务类型自动选择最优AI(重构→Cursor, 架构→Claude, 补全→Copilot) (2)「编排层」→复杂任务分解为子任务→分配给不同AI→汇总结果 (3)「质量层」→让另一个AI审查AI生成的代码 (4)「学习层」→记录每次AI选择的效果→持续优化路由策略","全员统一用同一种AI工具","让开发者自己选喜欢的工具","只用最强的那个AI模型","购买企业版全家桶"],scores:[4, 0, 0, 0, 0],best:0,explain:"多AI协同=路由+编排+质量+学习。没有万能AI，但有最佳AI组合。关键是知道什么时候用哪个。"},
// === P0新增结束 ===
],
data: [{level:0,difficulty:"初阶",scenario:"场景：生产环境出现了API响应延迟飙升（P99从200ms升到2s）。你拿到了Nginx日志、应用日志和数据库慢查询日志。",q:"如何用AI快速定位问题？",opts:["A. 上传三类日志→描述系统架构（Nginx→Node.js→PostgreSQL）→要求：(1)按时间线关联分析 (2)找出延迟突变的精确时间点 (3)分析该时间点前后各层的异常模式 (4)输出根因假设Top3","B. 肉眼逐条看日志","C. 只查数据库慢查询","D. 重启服务试试","E. 逐个下线服务节点排查"],scores:[4,0,1,0,0],best:0,explain:"故障定位=多源日志+架构描述+时间线关联。AI擅长在海量日志中找出异常模式。"},{level:1,difficulty:"中阶",scenario:"场景：你要为系统建立性能基线和告警阈值。历史数据：6个月的CPU/内存/QPS/延迟/错误率时序数据。",q:"AI辅助方案？",opts:["A. 上传时序数据→AI分析：(1)识别周期性模式(按天/周) (2)计算各时段的正常波动范围 (3)基于3-sigma或IQR建议告警阈值 (4)标注历史异常点和根因→生成告警规则配置","B. 凭经验设置固定阈值","C. 只监控CPU和内存","D. 等出了事故再加监控","E. 用云厂商默认规则"],scores:[4,0,0,0,1],best:0,explain:"性能基线=时序分析+周期识别+异常检测。AI让阈值设定从「拍脑袋」到「数据驱动」。"},

{level:0,difficulty:"初阶",scenario:"场景：产品经理给了你一个Excel文件（5000行用户行为数据），要求你分析用户留存情况。你不擅长数据分析。",q:"AI辅助快速分析用户行为数据？",opts:["三步分析：(1)把Excel给AI→描述字段含义→AI识别数据质量问题(缺失/异常) (2)AI自动统计：DAU趋势/用户留存率/关键行为漏斗 (3)AI生成可视化图表建议+数据解读→你Review确认","自己用Python/Pandas分析","找数据分析师帮忙","只统计几个核心指标","把数据导入BI工具"],scores:[4, 0, 0, 1, 2],best:0,explain:"数据分析=数据清洗+指标计算+可视化。AI让不擅长数据的人也能快速产出分析报告。"},
{level:0,difficulty:"初阶",scenario:"场景：运维同事给你发送了昨天的Nginx访问日志（10万行），说「帮忙看看有没有异常访问」。你对日志格式不熟悉。",q:"AI辅助分析服务器日志？",opts:["三步日志分析：(1)把日志样本给AI→AI自动识别日志格式和各字段含义 (2)AI统计关键指标：QPS/状态码分布/Top URL/Top IP (3)AI标注异常模式：4xx/5xx突增/爬虫/攻击→输出分析报告","用grep/awk手动分析","部署ELK日志平台","让运维自己看","只查错误日志"],scores:[4, 0, 0, 0, 1],best:0,explain:"日志分析=格式识别+指标统计+异常标注。AI能自动理解日志格式，10万行分析只需几分钟。"},
{level:0,difficulty:"初阶",scenario:"场景：你要为下周的季度评审准备数据：提取Git仓库中本季度的代码变更统计、Jira中的Bug修复率、Code Review参与度。",q:"AI辅助多源数据汇总？",opts:["三步汇总：(1)AI通过Git API提取本季度commit统计（提交数/代码行数/文件变更） (2)AI通过Jira API提取Bug和Story数据 (3)AI交叉分析→输出开发效率报告（含个人贡献/团队趋势/改进建议）","手动从Git和Jira提取数据","估算一个大概数字","让大家填写周报汇总","每个工具单独看数据"],scores:[4, 0, 0, 0, 0],best:0,explain:"多源汇总=Git+Jira交叉分析。AI从数据提取到报告生成一条龙，零手工。"},
{level:0,difficulty:"初阶",scenario:"场景：数据库中有3年的订单数据（100万行），PM希望了解「哪些因素最能预测用户复购」。你有SQL查询权限但不会机器学习。",q:"AI辅助从数据中发现业务规律？",opts:["三步探索：(1)AI生成SQL查询→提取关键特征（购买频率/客单价/品类偏好/时间间隔） (2)AI用简单统计方法分析各特征与复购的相关性 (3)AI输出Top5复购预测因子+业务建议→你Review后和PM讨论","建一个机器学习模型","肉眼分析样本数据","让数据科学家团队做","做用户调研问他们为什么复购"],scores:[4, 0, 0, 1, 0],best:0,explain:"数据探索=特征提取+相关性分析+业务建议。AI让「数据驱动决策」不再是大数据团队的专利。"},

{level:1,difficulty:"中阶",scenario:"场景：你要设计一个实时数据监控大盘：展示核心业务指标（GMV/订单量/转化率）的实时变化，并在异常时自动告警。数据来自MySQL+Kafka+Redis。",q:"AI辅助设计实时数据监控系统？",opts:["四步设计：(1)AI分析数据源→设计数据流转架构（Kafka→Flink→ClickHouse→Grafana） (2)AI设计异常检测规则（基于历史数据的动态阈值） (3)AI生成SQL查询和Grafana Dashboard JSON (4)AI设计告警分级和升级策略","买现成的监控平台","用Prometheus+Grafana标准方案","只监控几个核心指标","让运维团队设计"],scores:[4, 0, 2, 0, 0],best:0,explain:"实时监控=数据流设计+异常检测+可视化+告警。AI帮你把业务需求转化为技术方案。"},
{level:1,difficulty:"中阶",scenario:"场景：数据分析师离职了，留下200行复杂的SQL查询（含窗口函数/CTE/子查询），你需要理解并维护这些查询。",q:"AI辅助理解复杂SQL查询？",opts:["三步理解：(1)把SQL给AI→逐段解释每个CTE/子查询/窗口函数的业务含义 (2)AI生成查询流程图→标注数据流和过滤条件 (3)AI标注性能瓶颈（全表扫描/缺失索引/笛卡尔积）→生成优化建议","逐行读SQL自己理解","重写所有查询","让DBA解释","跑一下看结果对不对就行"],scores:[4, 0, 0, 0, 0],best:0,explain:"SQL理解=逐段解释+流程图+性能分析。AI是24小时在线的高级DBA。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为公司搭建一个数据指标体系：从CEO关注的北极星指标逐层拆解到各业务的执行指标。涉及5个业务线。",q:"AI辅助数据指标体系设计？",opts:["四步构建：(1)AI分析公司业务模式→建议北极星指标（如GMV/DAU/NPS） (2)AI逐层拆解：一级指标→二级指标→三级指标→确保指标可量化/可归因/可行动 (3)AI标注指标间的因果关系（驱动/结果/预警） (4)输出指标体系文档+数据采集清单","各业务线自己定义指标","参考行业标准指标体系","从上到下自己拆","先定义几个关键指标慢慢完善"],scores:[4, 0, 0, 0, 1],best:0,explain:"指标体系=北极星+逐层拆解+因果标注。好的指标体系让公司「用同一套语言」讨论业务。"},
{level:1,difficulty:"中阶",scenario:"场景：你怀疑上周的推荐算法上线后影响了用户活跃度。你需要做一个A/B测试分析：实验组vs对照组的各项指标对比。",q:"AI辅助A/B测试数据分析？",opts:["完整A/B测试分析：(1)AI做样本量检验→确认实验组和对照组用户量足够 (2)AI做AA检验→确认分流没有偏差 (3)AI对核心指标做T检验→标注统计显著的结果 (4)AI对非显著指标做功效分析→判断是否需要更长时间观察→输出实验结论","看实验组指标是不是更好就行","比较两个组的平均值","等实验跑够时间再说","直接上线全量"],scores:[4, 0, 0, 1, 0],best:0,explain:"A/B分析=样本检验+分流验证+统计检验+功效分析。AI帮你避免「看着有差异但统计不显著」的决策陷阱。"},

{level:2,difficulty:"高阶",scenario:"场景：作为数据架构师，你要设计公司级的数据平台架构——支持实时+离线、结构化+非结构化、10TB日增量。",q:"AI辅助设计大数据平台架构？",opts:["四层架构设计：(1)「数据摄入层」→AI评估Kafka/Flink/Spark Streaming的适用场景 (2)「存储层」→AI对比ClickHouse/HBase/Iceberg的查询模式匹配 (3)「计算层」→AI设计批流一体方案 (4)「服务层」→AI设计统一查询网关→输出架构文档+成本预估","使用云厂商的标准数据平台方案","按5年前的架构设计","每个业务方自建数据管道","先用MySQL扛着后面再优化"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据平台架构=摄入+存储+计算+服务四层。AI帮你把「选什么技术」从拍脑袋变成数据驱动的技术选型。"},
{level:2,difficulty:"高阶",scenario:"场景：公司计划从「经验决策」转型为「数据驱动决策」。作为数据负责人，你需要制定数据文化建设的三年路线图。",q:"AI辅助设计数据驱动文化转型方案？",opts:["三阶段路线图：(1)基建期(0-12月)-建数据平台+指标体系+数据看板→让每个人看见数据 (2)习惯期(12-24月)-嵌入数据到日常决策流程+数据素养培训+建立数据质量责任制 (3)创新期(24-36月)-AI辅助数据分析全民化+数据产品化→数据成为核心竞争力","买最贵的数据分析平台","招聘更多数据分析师","CEO发邮件要求用数据决策","先做几个数据看板试试"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据文化转型=基建+习惯+创新三阶段。不是买工具能解决的，是「让人愿意用数据替代直觉」的系统工程。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计一个AI驱动的智能告警系统：从海量监控数据中自动发现异常，减少误报，并能给出根因分析和修复建议。",q:"AI驱动智能告警系统的核心设计？",opts:["智能告警四要素：(1)「异常检测」→用AI学习历史模式+动态阈值替代静态阈值 (2)「告警聚合」→AI自动归并相关告警防止告警风暴 (3)「根因分析」→AI关联多个监控维度定位根本原因 (4)「自愈」→对已知问题模式触发自动修复→未知问题上报告警+建议","设置敏感一点的告警阈值","所有异常都报警让人来判断","减少告警只保留严重问题","用开源的告警系统"],scores:[4, 0, 0, 0, 0],best:0,explain:"智能告警=动态阈值+聚合降噪+根因分析+自愈。从「半夜被误报告警叫醒」到「AI自动诊断修复」。"},
{level:2,difficulty:"高阶",scenario:"场景：CFO问：我们花在数据基础设施上的钱（500万/年）到底带来了什么业务价值？你作为数据负责人需要量化数据投资的ROI。",q:"如何设计数据平台价值的量化框架？",opts:["四维量化：(1)效率价值-数据查询/报表生成时间节省了多少人天 (2)决策价值-基于数据的决策（如定价/库存/营销）带来了多少增量收入/成本节约 (3)风险价值-数据监控提前发现的问题避免了多少损失 (4)创新价值-基于数据的新产品或功能贡献了多少收入","算每年省了多少人力成本","统计数据平台的使用量","对比有数据平台前后的业务指标","参考行业数据平台ROI标准"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据ROI=效率+决策+风险+创新四维价值。数据平台的价值不在「存了多少数据」而在「帮业务多赚/少亏了多少钱」。"},
{level:2,difficulty:"高阶",scenario:"场景：你在设计一个AI数据助手——让业务人员用自然语言提问（如「上周哪个品类卖得最好？」），系统自动转SQL查询并返回可视化结果。",q:"设计Text-to-SQL数据助手的核心挑战和方案？",opts:["四层方案：(1)「语义层」→建立自然语言到数据字段的映射（品类→category, 卖得好→revenue DESC） (2)「安全层」→限制只能查询有权限的表和字段→SQL注入防护 (3)「优化层」→AI生成SQL后自动加LIMIT/时间范围/索引提示 (4)「反馈层」→用户标记结果是否准确→持续优化语义映射","直接把用户问题发给AI写SQL","建好所有可能的查询模板","培训业务人员学SQL","做一个可视化拖拽查询界面"],scores:[4, 0, 0, 0, 0],best:0,explain:"Text-to-SQL=语义映射+安全+优化+反馈。核心不是把自然语言转SQL，而是让业务人员安全地自助查询。"},
// === P0新增结束 ===
],
content: [{level:0,difficulty:"初阶",scenario:"场景：你要为一个内部微服务写API文档。接口15个，需要包含：路径、参数、返回值、错误码、调用示例。",q:"AI辅助生成方案？",opts:["A. 把Controller代码喂给AI→AI提取所有接口→生成OpenAPI 3.0规范→同时输出Markdown文档+示例curl命令→人工补充业务说明","B. 手工写每个接口的文档","C. 只写主要接口的文档","D. 用Swagger自动生成裸文档","E. 让调用方自己看代码理解"],scores:[4,0,0,2,0],best:0,explain:"API文档生成=代码→OpenAPI→多格式输出。从代码自动提取保证文档与实现一致。"},{level:1,difficulty:"中阶",scenario:"场景：你要写一份技术方案评审文档（ADR-Architecture Decision Record），决策点：选用消息队列RabbitMQ vs Kafka。",q:"AI辅助ADR的方式？",opts:["A. 四步生成：(1)AI对比两个方案在吞吐量/延迟/消息持久化/运维复杂度/生态集成 (2)结合业务场景(订单处理10K TPS/事件溯源需求)做适配分析 (3)AI按ADR模板生成文档 (4)用AI模拟技术评审挑漏洞","B. 选大家都在用的那个","C. 直接写结论不给分析过程","D. 让架构师决定不用文档","E. 两个都用"],scores:[4,0,0,0,0],best:0,explain:"ADR=方案对比+场景适配+模板生成+评审挑战。好的技术决策值得好的文档来记录。"},

{level:0,difficulty:"初阶",scenario:"场景：你要为内部REST API写一份给第三方开发者看的接入文档。需要包含：认证方式/接口列表/请求示例/错误码/SDK示例。",q:"AI辅助生成高质量技术文档？",opts:["四步文档生成：(1)把接口代码和需求给AI→AI生成OpenAPI规范 (2)AI基于OpenAPI生成多语言SDK示例代码 (3)AI自动生成错误码对照表和Troubleshooting (4)AI生成Markdown文档→你用文档工具渲染发布","手写所有文档","用Swagger自动生成裸文档","只写主要接口的文档","让调用方自己看代码"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术文档=OpenAPI+多语言SDK+错误码+格式化发布。AI让文档从「没人想写」变成「自动生成只需Review」。"},
{level:0,difficulty:"初阶",scenario:"场景：你的开源项目Star到了1000但只有英文README。中国开发者社区要求中文文档。你有50个Markdown文件需要翻译。",q:"AI辅助技术文档多语言翻译？",opts:["三步翻译：(1)AI批量翻译Markdown文件→保持代码块和技术术语不翻译 (2)AI生成术语表→确保全文翻译一致（如middleware统一译作「中间件」） (3)AI检查翻译后的文档链接是否仍然有效→人工Review技术准确性","逐文件手动翻译","用Google翻译批量处理","只翻译最重要的几个文档","招募社区志愿者翻译"],scores:[4, 0, 0, 0, 1],best:0,explain:"文档翻译=批量翻译+术语一致性+链接检查。AI比通用翻译强在能识别代码和术语并保持不译。"},
{level:0,difficulty:"初阶",scenario:"场景：你要写一篇技术博客：分享团队从MySQL迁移到PostgreSQL的经验。有迁移笔记但不会组织成好文章。",q:"AI辅助技术博客写作？",opts:["三步写博客：(1)把迁移笔记和关键数据给AI→AI生成文章大纲（背景/动机/方案对比/踩坑/数据对比/总结） (2)AI按大纲填充内容→保留你的第一人称体验 (3)AI优化标题和段落结构→添加代码示例和对比表格→你Review调整语气","自己从头写","让AI写全文不改直接发","不写博客整理成内部文档就好","把笔记发上去不加工"],scores:[4, 0, 0, 0, 1],best:0,explain:"技术博客=大纲+填充+优化。AI做骨架和润色，人注入真实体验和技术判断。"},
{level:0,difficulty:"初阶",scenario:"场景：新来的PM不太懂技术，每次沟通需求时双方理解有偏差。你需要把技术方案用PM能理解的方式表达。",q:"AI辅助跨角色沟通（技术→非技术）？",opts:["三步沟通：(1)把技术方案给AI→要求用「非技术人员能理解的语言」重写 (2)AI标注需要PM决策的关键点（如「方案A成本低但扩展性差，方案B相反」） (3)AI生成决策辅助表格→列出每个选择的利弊→PM容易做出判断","让PM去学技术基础","只给结论不给分析过程","画架构图让PM看图理解","开长会逐条解释"],scores:[4, 0, 0, 0, 0],best:0,explain:"跨角色沟通=翻译+决策标注+辅助决策。AI帮你把「技术的语言」翻译成「业务的语言」。"},

{level:1,difficulty:"中阶",scenario:"场景：你的团队在写一份技术方案评审文档（ADR），涉及到微服务拆分方案。需要说服架构委员会批准5个新服务的建设。",q:"AI辅助撰写有说服力的技术方案文档？",opts:["四步说服力文档：(1)AI分析读者（架构委员会关注风险/成本/可维护性）→定制论据 (2)AI生成方案对比矩阵（单体vs微服务的量化对比） (3)AI预判可能的反对意见→提前准备反驳数据和论据 (4)AI生成执行路线图和风险缓解计划","按ADR模板套内容","写详细的技术实现方案","口头汇报不加文档","找CTO先私下沟通"],scores:[4, 0, 0, 0, 0],best:0,explain:"说服力文档=读者分析+对比矩阵+预判反驳+路线图。好的技术文档不是展示你会什么，而是让读者做出你想要的决策。"},
{level:1,difficulty:"中阶",scenario:"场景：你的项目要参加公司年度技术评审，需要准备一份5页的Executive Summary给VP级别领导。技术细节很多但领导只要关键信息。",q:"AI辅助撰写给高管的Executive Summary？",opts:["三步Exec Summary：(1)把你所有的技术文档给AI→要求提炼为「1页现状+1页成果+1页风险+1页下一步+1页资源需求」 (2)AI把技术指标翻译为业务价值（如「P99延迟降低50%」→「用户体验提升，预计减少10%用户流失」） (3)AI生成Executive Summary→每条不超过3句话","把技术方案精简一下发给领导","做一个详细PPT每页都讲","发完整的ADR文档","让直属Leader帮你汇报"],scores:[4, 0, 0, 0, 0],best:0,explain:"高管摘要=5页浓缩+技术→价值翻译+每点3句话。VP不需要知道技术怎么实现，需要知道值不值得投资源。"},
{level:1,difficulty:"中阶",scenario:"场景：你维护的API SDK文档有多个版本（v1/v2/v3），用户经常混淆版本差异。你需要建立清晰的版本化文档策略。",q:"AI辅助API文档版本管理？",opts:["三步版本化：(1)AI分析v1/v2/v3的API差异→生成Breaking Changes清单 (2)AI为每个版本生成独立文档+跨版本迁移指南 (3)AI自动添加版本标签和废弃警告→确保文档与代码版本同步","只维护最新版本文档","每个版本都手动复制一份文档","用Git分支管理版本文档","写一个版本号表让用户自己查"],scores:[4, 0, 0, 0, 0],best:0,explain:"版本化文档=差异分析+独立文档+迁移指南。用户不关心你的实现，只关心「从v2升级到v3要改什么」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要建立团队的「技术文档即代码」（Docs as Code）体系：文档用Markdown写、用Git管理、CI自动发布。之前大家习惯用Confluence。",q:"AI辅助设计Docs as Code体系？",opts:["四步构建：(1)AI设计文档仓库结构（架构决策/API文档/运维手册/新人指南） (2)AI生成CI流水线：Markdown→静态站点→自动部署 (3)AI制定文档规范：模板/检查清单/Review流程 (4)AI迁移已有Confluence文档到Markdown→建立文档与代码的关联","继续用Confluence","把文档都转成Word","让每个人自己决定写在哪","用Notion替代"],scores:[4, 0, 0, 0, 0],best:0,explain:"Docs as Code=仓库结构+CI发布+规范+迁移。文档版本和代码版本同步，再也不会「文档过期了」。"},

{level:2,difficulty:"高阶",scenario:"场景：你负责公司技术博客的品牌建设：希望公司博客成为行业内有影响力的技术品牌。目前博客阅读量很低。",q:"AI辅助技术内容品牌策略？",opts:["四步品牌建设：(1)AI分析行业热门话题和竞品内容→找到差异化定位 (2)AI基于团队技术优势→生成年度内容日历（含选题/目标读者/预期影响力） (3)AI优化SEO策略：关键词研究+标题优化+内链建设 (4)AI分析每篇文章的数据→持续优化内容策略","多发技术文章提高数量","翻译国外热门技术文章","让团队每周强制写一篇","花钱买流量推广"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术品牌=差异化定位+内容日历+SEO+数据驱动。好内容不是写出来的，是策略+执行+优化的结果。"},
{level:2,difficulty:"高阶",scenario:"场景：你要为公司建立「内部技术知识库」——把散落在个人脑中的隐性知识（调试技巧/架构决策/避坑记录）结构化沉淀下来。",q:"AI驱动知识库建设的核心设计？",opts:["四层知识库：(1)「知识捕获」→AI从Git Commit/Code Review/故障复盘自动提取知识点 (2)「知识组织」→AI自动分类/打标签/建立知识图谱 (3)「知识检索」→自然语言搜索「PostgreSQL连接池满了怎么办」→返回相关知识 (4)「知识保鲜」→AI定期检查知识是否过期→标记或更新","让大家把经验写在Wiki上","定期组织知识分享会","强制要求写文档","购买知识管理软件"],scores:[4, 0, 0, 0, 0],best:0,explain:"知识库=自动捕获+自动组织+智能检索+自动保鲜。不是「让人写」而是「自动采集」，不是「存放」而是「保鲜」。"},
{level:2,difficulty:"高阶",scenario:"场景：你的团队开发了一个内部AI平台，需要向全公司1000+非技术员工推广使用。大部分人对AI有恐惧或过高期望。",q:"AI辅助设计技术产品内部推广策略？",opts:["五步推广：(1)「用户画像」→分析不同岗位的AI使用场景和痛点 (2)「成功案例」→AI辅助生成各岗位的「Before/After」案例 (3)「渐进引导」→从最简单场景开始（如AI写邮件/总结文档）→逐步提升 (4)「消除恐惧」→AI生成FAQ回应常见担忧（取代工作？数据安全？） (5)「持续激励」→排行榜/积分/认证→形成使用习惯","全员强制使用","发一封推广邮件","做一次全员培训","先让感兴趣的部门试点"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术推广=用户画像+成功案例+渐进引导+消除恐惧+持续激励。推广AI不是传播技术而是改变行为。"},
{level:2,difficulty:"高阶",scenario:"场景：CTO要求你评估：公司技术文档应该用AI自动生成到什么程度？担心文档「太AI化」失去工程师的个人判断和权威性。",q:"如何界定AI生成技术文档的边界？",opts:["三层边界：(1)「AI辅助层」-AI生成文档初稿/格式/示例→工程师Review和注入个人判断→适合ADR/技术方案 (2)「AI主导层」-AI自动生成API文档/变更日志/代码注释→人只需抽查→适合格式化文档 (3)「人主导层」-人写核心判断/AI只做语法和风格润色→适合技术博客/对外演讲","全部让AI生成","全部人写不用AI","只允许AI生成草稿","看文档类型决定"],scores:[4, 0, 0, 0, 1],best:0,explain:"文档边界=三层分级(AI辅助/AI主导/人主导)。AI不是替代人写文档，而是把人的时间从格式化文档中解放出来做有判断力的内容。"},
{level:2,difficulty:"高阶",scenario:"场景：公司在快速发展期，新人3个月才上手、老员工离职带走大量隐性知识、跨团队协作靠口口相传。你要用AI+文档解决知识传递问题。",q:"AI驱动的组织知识管理体系设计？",opts:["五维知识管理：(1)「实时捕获」→AI从日常工作中自动提取知识点（Code Review/故障复盘/项目复盘） (2)「智能问答」→新人问「如何部署到生产环境」→AI从知识库回答 (3)「知识推荐」→AI根据正在做的工作推荐相关知识 (4)「专家地图」→AI建立「谁懂什么」的技能图谱 (5)「知识度量」→AI追踪知识覆盖率/新人上手时间/重复踩坑次数","做一个Wiki让大家写","建立Buddy制度老带新","强制文档化所有流程","减少人员流动"],scores:[4, 0, 0, 0, 0],best:0,explain:"知识管理=实时捕获+智能问答+主动推荐+专家地图+效果度量。AI让知识管理从「人找知识」变成「知识找人」。"},
// === P0新增结束 ===
],
dev: [{level:0,difficulty:"初阶",scenario:"场景：Code Review时发现一段复杂的业务逻辑，需要确认是否覆盖了所有边界条件（空值/并发/超时/异常）。",q:"AI辅助Code Review的方式？",opts:["A. 把代码和业务规则描述一起给AI→要求：(1)逐行分析逻辑正确性 (2)枚举未覆盖的边界条件 (3)标注潜在的并发问题 (4)生成对应的单元测试用例","B. 肉眼仔细看代码","C. 让写代码的人自己检查","D. 只看明显的语法错误","E. 跑一下看有没有Bug"],scores:[4,0,0,0,1],best:0,explain:"AI Code Review=代码+业务规则→逻辑分析+边界枚举+测试生成。AI不会疲劳，能把所有边界条件枚举出来。"},{level:1,difficulty:"中阶",scenario:"场景：团队要引入一个新的微服务框架。作为Tech Lead需要评估：学习曲线、性能基准、社区活跃度、与现有技术栈的兼容性。",q:"AI辅助技术选型方案？",opts:["A. 多维评估：(1)AI收集各框架的GitHub数据(star/issue/PR频率)→活跃度评分 (2)AI搜索技术博客→提取生产环境经验 (3)AI对比性能基准 (4)AI生成评估报告含推荐方案和迁移路径","B. 用团队最熟悉的框架","C. 看哪个框架Star最多","D. 每个都做POC","E. 让每个组员投票"],scores:[4,0,0,1,0],best:0,explain:"技术选型=社区数据+生产经验+性能基准+迁移评估。AI帮你从感性投票变成数据驱动决策。"},

{level:0,difficulty:"初阶",scenario:"场景：Code Review时发现一个200行的函数，逻辑复杂难以理解。你怀疑有Bug但看不出来。",q:"AI辅助理解复杂遗留代码？",opts:["三步理解：(1)把函数给AI→AI生成逐行注释和逻辑流程 (2)AI标注可能的问题点：边界条件缺失/空指针风险/并发问题 (3)AI生成重构方案：拆分为3-5个小函数+单元测试→你Review后实施","加更多注释自己理解","重写这个函数","找原作者解释","能跑就行不改了"],scores:[4, 0, 0, 0, 0],best:0,explain:"遗留代码=注释+风险标注+重构建议。AI帮你把「看都看不懂」变成「看懂还能改好」。"},
{level:0,difficulty:"初阶",scenario:"场景：你需要在项目中集成一个第三方支付SDK，但官方文档只有Java示例。你的项目是Python。",q:"AI辅助跨语言SDK集成？",opts:["三步集成：(1)把Java示例代码给AI→AI说明每个步骤的业务含义 (2)AI生成Python等价实现→标注语言差异（如异常处理/类型系统） (3)AI生成集成测试验证功能正确性→你Review适配项目代码规范","自己对照Java代码写Python版本","找Java同事帮忙写Python版","把Java SDK打包成微服务调用","换一个Python原生支持的支付渠道"],scores:[4, 0, 0, 0, 0],best:0,explain:"跨语言集成=理解原实现+等价翻译+测试验证。AI不仅能翻译代码还能解释为什么。"},
{level:0,difficulty:"初阶",scenario:"场景：你的前端页面在Chrome下正常但Safari下布局错乱。你不熟悉Safari的CSS兼容性问题。",q:"AI辅助浏览器兼容性调试？",opts:["三步调试：(1)把HTML/CSS和截图给AI→AI分析布局差异的根本原因 (2)AI列出Safari已知的CSS Bug和对应的workaround (3)AI生成兼容性修复方案→要求用CSS Feature Query做渐进增强","在Safari DevTools里调试","换一种布局方案","加浏览器检测做两套样式","只支持Chrome"],scores:[4, 0, 0, 0, 0],best:0,explain:"兼容性调试=差异分析+已知Bug匹配+渐进增强。AI有海量浏览器Bug库，比手动搜索高效得多。"},
{level:0,difficulty:"初阶",scenario:"场景：你的服务在凌晨3点突然OOM崩溃，JVM堆dump有500MB但你看不懂。",q:"AI辅助分析JVM内存问题？",opts:["三步分析：(1)把GC日志+堆dump摘要给AI→AI识别内存泄漏模式(Growing HashMap/未关闭的连接/缓存未设上限) (2)AI标注Top 10内存占用对象及其引用链 (3)AI生成修复方案（限制缓存大小/关闭资源/调整JVM参数）→验证后上线","重启服务临时解决","增大JVM堆内存","用VisualVM手动分析","加监控等下次再发生"],scores:[4, 0, 0, 1, 0],best:0,explain:"内存分析=泄漏模式识别+TOP对象+修复方案。500MB堆dump AI秒级分析，人工可能需要半天。"},

{level:1,difficulty:"中阶",scenario:"场景：你的Spring Boot项目启动需要5分钟，每次改一行代码也要等5分钟才能验证。你需要分析和优化启动速度。",q:"AI辅助应用启动性能优化？",opts:["四步优化：(1)AI分析启动日志→识别耗时Top 5阶段（Bean初始化/数据库连接/缓存预热） (2)AI给每个阶段优化建议（懒加载/并行初始化/连接池预热） (3)AI评估每个优化的风险（如懒加载可能影响首次请求） (4)生成优化实施计划→逐项验证效果","换更快的机器","用GraalVM Native Image","减少依赖的组件数量","开发者本地不启动完整应用"],scores:[4, 0, 0, 0, 1],best:0,explain:"启动优化=阶段分析+优化建议+风险评估+实施计划。AI帮你找到5分钟里最值得优化的那20秒。"},
{level:1,difficulty:"中阶",scenario:"场景：你接手了一个没有自动化测试的项目（10万行Java代码）。每次上线都心惊胆战。你需要快速建立测试覆盖。",q:"AI辅助快速建立测试体系？",opts:["四步建测试：(1)AI分析代码→按风险排序模块（核心业务/支付/用户认证优先） (2)AI为高风险模块自动生成单元测试+集成测试骨架 (3)AI配置JaCoCo覆盖率门槛→CI中强制检查 (4)AI生成测试覆盖率报告→标注未覆盖的关键路径→持续补充","从头手写所有测试","只给新代码写测试","请测试团队写自动化测试","先上线出了问题再补测试"],scores:[4, 0, 0, 0, 0],best:0,explain:"测试体系建设=风险排序+自动生成+覆盖率强制+持续补充。AI帮你从0测试到有安全网的开发体验。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为一个高并发接口做性能优化：当前QPS 1000，目标QPS 5000。涉及缓存策略/数据库查询/连接池/序列化。",q:"AI辅助高并发性能优化？",opts:["五步优化：(1)AI分析现有代码→标注性能瓶颈（N+1查询/同步阻塞/无缓存/大对象序列化） (2)AI生成多级优化方案（本地缓存→Redis缓存→DB优化→连接池调优） (3)AI评估每级优化的预期收益和实施风险 (4)AI生成压测方案→逐级验证 (5)AI监控上线后的性能指标→持续调优","加Redis缓存应该就够了","增大数据库连接池","把同步改异步","增加服务器数量"],scores:[4, 0, 0, 0, 0],best:0,explain:"性能优化=瓶颈分析+分级优化+收益评估+压测验证。从1000QPS到5000QPS不是加缓存就行的系统化工程。"},
{level:1,difficulty:"中阶",scenario:"场景：你作为Tech Lead要为新项目做技术选型。团队熟悉Java但新需求更适合Node.js。需要评估技术栈切换的利弊。",q:"AI辅助技术栈升级/切换决策？",opts:["四步决策：(1)AI对比两种技术栈在目标场景下的性能/生态/学习曲线/招人难度 (2)AI基于团队现有能力评估切换成本和风险 (3)AI生成渐进式迁移方案（混合架构→逐步替换） (4)AI生成决策矩阵→量化每个选项的3年TCO和业务风险","坚持用团队熟悉的Java","完全切换到Node.js","让团队投票决定","看行业趋势选主流技术"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术栈决策=对比分析+团队评估+迁移方案+TCO量化。技术选型不是「哪个更好」而是「哪个更适合我们」。"},

{level:2,difficulty:"高阶",scenario:"场景：作为首席架构师，你要为公司设计「AI First」的软件架构范式——不是把AI作为插件，而是让AI成为架构的核心设计原则。",q:"AI First软件架构的核心设计范式？",opts:["五大范式：(1)「意图驱动」→接口从「暴露API」变为「理解意图」 (2)「持续演进」→架构从「预设」变为「AI辅助持续重构」 (3)「人机协作」→代码审查/测试/文档由AI协同完成 (4)「自适应」→系统自动监控和调优而非人工运维 (5)「知识原生」→AI理解业务上下文而非仅执行指令","在现有架构上加AI API调用","用微服务架构+AI模型","全面转向无代码/低代码","重构所有服务为AI Native"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI First架构=意图驱动+持续演进+人机协作+自适应+知识原生。不是「加一个AI功能」，而是从架构层面重新思考软件怎么构建。"},
{level:2,difficulty:"高阶",scenario:"场景：公司要评估：核心业务系统是否应该用AI生成的代码？风险和收益如何权衡？这是架构委员会争论最激烈的话题。",q:"AI生成代码在核心系统中的适用边界？",opts:["四层适用边界：(1)「安全区」→AI生成测试/文档/格式化/样板代码→直接使用 (2)「监督区」→AI生成业务逻辑→必须人工Review+单元测试+集成测试 (3)「禁区」→安全/加密/支付/合规相关代码→人工编写+安全审计 (4)「渐进区」→AI生成后运行3个月无事故→从监督区迁移到安全区","核心系统不用AI生成的代码","所有代码都可以用AI生成","核心系统用AI但需要Code Review","先试点非核心系统"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI代码边界=安全区/监督区/禁区/渐进区。关键是「在什么条件下可以用」而不是「能不能用」的二元选择。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计一个「代码质量AI看门狗」——在每次PR合并前自动审查代码质量，不是检查格式而是检查设计和逻辑。",q:"AI代码审查看门狗的设计方案？",opts:["四层检查：(1)「设计层」→AI检查是否违反SOLID原则/在恰当的位置抽象 (2)「安全层」→AI检查OWASP Top 10漏洞（SQL注入/XSS/敏感信息泄露） (3)「性能层」→AI检查N+1查询/内存泄漏/不必要的对象创建 (4)「可维护层」→AI检查函数复杂度/命名清晰度/缺少注释的关键逻辑→生成审查报告","用ESLint/SonarQube检查就够了","加强人工Code Review","只检查安全漏洞","让写代码的人自己检查"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI审查=设计+安全+性能+可维护四层。不是替代人工Review而是让Reviewer关注AI检查不到的高层设计问题。"},
{level:2,difficulty:"高阶",scenario:"场景：你的200万行单体应用需要拆分为微服务。评估过用绞杀者模式(Strangler Fig)，但需要大量分析工作来确定服务边界。",q:"AI辅助单体拆分微服务的边界识别？",opts:["四步边界识别：(1)AI分析代码→提取限界上下文（按业务能力聚类相关代码） (2)AI分析数据库表→识别表之间的耦合度→建议数据拆分方案 (3)AI分析API调用链路→识别可独立部署的模块 (4)AI输出拆分方案：建议的服务边界+数据归属+通信协议→架构师Review确认","按现有的模块目录拆分","每个Controller拆成一个微服务","用领域驱动设计(DDD)方法手工分析","先拆最重要的部分"],scores:[4, 0, 0, 0, 0],best:0,explain:"微服务拆分=代码聚类+数据耦合+调用链+方案输出。AI能从代码层面量化耦合度，避免凭感觉拆分。"},
{level:2,difficulty:"高阶",scenario:"场景：CEO要求技术团队实现「AI驱动的自愈系统」——系统能在生产环境自动检测、诊断和修复80%的常见故障。",q:"自愈系统的AI技术方案设计？",opts:["五层自愈：(1)「检测层」→AI分析监控数据检测异常 (2)「诊断层」→AI关联日志/指标/事件→根因分析 (3)「决策层」→AI从已知修复手段中选择最优方案 (4)「执行层」→自动执行修复（重启服务/切换节点/回滚版本/限流降级） (5)「学习层」→每次故障诊断和修复进入知识库→下次更快更准","加更多监控和告警人工处理","做好容灾和备份","配置自动重启脚本","用Kubernetes的自动恢复机制"],scores:[4, 0, 0, 0, 0],best:0,explain:"自愈系统=检测+诊断+决策+执行+学习。不是简单的自动重启，而是从「发生了什么」到「为什么」到「怎么修」的完整闭环。"},

workflow: [{level:0,difficulty:"初阶",scenario:"场景：每天站会后需要整理：昨日完成/今日计划/阻塞项。目前手动整理耗时30分钟。",q:"如何用AI优化每日工作流？",opts:["A. 搭建AI日报管线：(1)Git Commit自动提取昨日变更摘要 (2)Jira/TAPD自动拉取任务状态 (3)AI合并生成日报草稿 (4)你审核修改→一键发送","B. 继续手工整理","C. 让每个人自己发日报然后汇总","D. 减少日报频率","E. 只记录完成的任务"],scores:[4,0,0,0,1],best:0,explain:"日报自动化=工具集成+AI汇总+人工审核。从30分钟→3分钟。"},{level:1,difficulty:"中阶",scenario:"场景：你们团队在做Sprint Planning，需要评估5个用户故事的开发工作量。故事描述模糊，跨多个模块。",q:"AI辅助工作量评估的方式？",opts:["A. 四步评估：(1)AI分析每个故事→拆解为技术子任务 (2)AI预估每个子任务复杂度(基于历史数据) (3)AI标注技术风险和依赖 (4)输出结构化评估→人工调整并确认","B. 让每个人凭经验估算","C. 按故事点数拍脑袋","D. 先做再说不用估","E. 只估简单的故事"],scores:[4,0,0,0,0],best:0,explain:"AI辅助估点=任务拆解+历史参照+风险标注。AI让估点从玄学变得有据可依。"},

{level:0,difficulty:"初阶",scenario:"场景：你每天收到30+封需要回复的技术邮件（Bug报告/问题咨询/跨团队协调），回复占用了大量时间。",q:"AI辅助高效处理技术邮件？",opts:["三步邮件工作流：(1)AI自动分类邮件（紧急/普通/可忽略）→生成每日摘要 (2)AI为每封邮件生成回复草稿→你Review调整后发送 (3)AI将邮件中的行动项自动创建Jira/GitHub Issue→跟踪到底","每天固定时间手动回复","设置自动回复模板","让团队成员分担","减少邮件的回复率"],scores:[4, 0, 0, 0, 0],best:0,explain:"邮件工作流=自动分类+回复草稿+行动项追踪。AI让你从邮件处理者变成邮件决策者。"},
{level:0,difficulty:"初阶",scenario:"场景：Sprint Planning会上，产品经理给了5个User Story但你发现需求描述不够具体，无法准确估算工作量。",q:"AI辅助需求澄清和工作量估算？",opts:["三步估算：(1)AI分析User Story→标注模糊点和遗漏的边界条件 (2)AI自动拆解为技术子任务→补充AC（Acceptance Criteria） (3)AI基于历史类似任务的数据→给出工作量参考范围→你根据复杂度调整","按照感觉估算","让开发自己报工时","先做再说","参考上一个Sprint的时间"],scores:[4, 0, 0, 0, 0],best:0,explain:"需求估算=模糊点标注+任务拆解+历史参照。AI让估点从「玄学」变成「有据可依的科学」。"},
{level:0,difficulty:"初阶",scenario:"场景：你需要为新加入的实习生制定一个月的上手计划：要学什么、按什么顺序、每个阶段的产出是什么。",q:"AI辅助制定新人上手计划？",opts:["三步上手计划：(1)AI分析项目技术栈→生成学习路径（环境搭建→代码规范→核心模块→第一个Bug Fix→第一个Feature） (2)AI生成每个阶段的Checklist和验收标准 (3)AI根据实习生的背景调整难度→输出个性化上手计划","让实习生看文档自己学","找老员工带一下就行","给几个简单Bug修一修","参加团队培训就行"],scores:[4, 0, 0, 0, 0],best:0,explain:"上手计划=学习路径+Checklist+个性调整。好的上手计划让新人一个月能干三个月的事。"},
{level:0,difficulty:"初阶",scenario:"场景：你参加了2小时的会议，讨论了5个议题，做了零散笔记。会后需要整理会议纪要和行动项发给参会者。",q:"AI辅助会议纪要生成？",opts:["三步会议纪要：(1)把会议录音转文字→AI提取关键讨论和决策点 (2)AI按议题分类→生成结构化纪要（议题/讨论要点/决策/行动项/负责人/DDL） (3)你Review确认→一键发送给参会者","凭记忆写会议纪要","整理手写笔记","让每个人自己记自己的部分","不开会发邮件沟通"],scores:[4, 0, 0, 0, 0],best:0,explain:"会议纪要=录音转写+关键提取+结构化输出。2小时的会议→5分钟Review纪要→3分钟发送。"},

{level:1,difficulty:"中阶",scenario:"场景：你的团队在使用Scrum但有各种问题：Sprint经常完不成、站会没人愿意说话、回顾会流于形式。需要改进敏捷实践。",q:"AI辅助团队敏捷实践改进？",opts:["四步改进：(1)AI分析过去3个Sprint的数据（完成率/Velocity变动/Burndown曲线）→诊断问题模式 (2)AI访谈团队成员→收集匿名反馈 (3)AI生成改进方案(A)调整Sprint长度→(B)优化站会形式→(C)引入健康度量 (4)AI跟踪改进效果→持续调整","换一种敏捷框架","加强Scrum Master的监督","减少Sprint的任务量","取消敏捷回到瀑布"],scores:[4, 0, 0, 0, 0],best:0,explain:"敏捷改进=数据诊断+匿名反馈+方案调整+效果跟踪。AI帮你从「Scrum走得对不对」变成「团队效率有没有提升」。"},
{level:1,difficulty:"中阶",scenario:"场景：多个团队在做一个大项目（20+人），缺乏统一的进度视图。每次同步会都要每个人汇报，效率很低且信息不准确。",q:"AI辅助跨团队项目进度管理？",opts:["三步进度管理：(1)AI自动从Git/Jira/Slack提取真实的进度数据（代码提交/PR合并/Story状态变更） (2)AI生成每周项目进度报告：实际进度vs计划/阻塞项/风险标记 (3)AI在同步会前自动生成「需要讨论的5件事」→会议从汇报会变成决策会","每个人每周发周报汇总","开更频繁的同步会","找一个专职项目经理","用Excel手工跟踪"],scores:[4, 0, 0, 0, 0],best:0,explain:"进度管理=自动采集+真实数据+聚焦决策。AI让你把同步会从「汇报会」变成「决策会」。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为团队建立「工程效率度量」体系：不只是看代码量，而是度量真正的开发效能。CTO要求可量化的效率数据。",q:"AI辅助工程效率度量体系设计？",opts:["四维度量：(1)「交付效率」→Lead Time(需求到上线)/Deploy Frequency/PR合并时间 (2)「代码质量」→Bug率/回滚率/代码重复率 (3)「协作效能」→Code Review响应时间/跨团队依赖等待时间 (4)「开发者体验」→AI分析开发者反馈→提取满意度趋势→输出效率仪表盘","统计代码行数","看每个人的Story Point","做一次效率调研","用GitHub自带的统计"],scores:[4, 0, 0, 0, 0],best:0,explain:"效率度量=交付+质量+协作+体验四维。不是「谁代码写得多」而是「谁让系统变得更好」。"},
{level:1,difficulty:"中阶",scenario:"场景：你的团队被一个紧急的线上故障打断了3天。故障修复后需要做复盘（Postmortem），但大家都很疲惫不想写。",q:"AI辅助故障复盘(Postmortem)？",opts:["四步复盘：(1)AI分析故障时间线的所有数据（监控/日志/聊天记录/代码变更）→重建故障全貌 (2)AI生成时间线+根因分析+影响范围评估 (3)AI标注流程中的改进点：为什么没早发现/为什么响应慢/为什么修复慢 (4)AI生成Action Items+负责人+DDL→跟踪到关闭","写一个简单的事故报告","口头复盘不写文档","只记录直接原因","等下次故障再一起复盘"],scores:[4, 0, 0, 0, 0],best:0,explain:"故障复盘=数据重建+时间线+改进点+Action跟踪。不是为了追责而是为了「不再发生第二次」。"},

{level:2,difficulty:"高阶",scenario:"场景：作为工程副总裁，你要在全公司推广「AI Native研发模式」——从传统开发模式转型为AI深度融合的开发模式。涉及200+工程师。",q:"AI Native研发转型的组织变革方案？",opts:["五阶段变革：(1)「觉醒期」→AI能力展示+成功案例传播→建立认知 (2)「试点期」→选2-3个团队深度试点+量化效果 (3)「推广期」→基于试点经验制定推广方案+AI Champion网络 (4)「制度化」→AI工具成为标准流程的一部分+度量体系 (5)「进化期」→持续优化AI工具链+探索新范式","买AI工具强制全员使用","等AI技术更成熟再说","让团队自愿采用","请咨询公司做转型方案"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI Native转型=觉醒+试点+推广+制度化+进化。不是部署工具就完事，是组织能力和文化的深层变革。"},
{level:2,difficulty:"高阶",scenario:"场景：你的团队分布在3个时区（北京/伦敦/硅谷），协作效率低下——等回复要半天、文档不同步、没有overlap时间开会。",q:"AI辅助分布式团队异步协作方案？",opts:["四步异步协作：(1)「AI进度同步」→每个成员结束工作时AI自动生成Day Summary→其他时区成员醒来即可看到 (2)「AI决策记录」→所有讨论和决策被AI自动结构化记录→不会遗漏 (3)「AI智能交接」→需要其他时区接手的工作自动生成上下文+待办清单 (4)「AI虚拟同步」→减少实时会议用AI生成的讨论文档替代","要求大家调整工作时间","减少跨时区团队的人数","每天固定时间全员在线开会","移到一个时区集中办公"],scores:[4, 0, 0, 0, 0],best:0,explain:"异步协作=AI进度同步+决策记录+智能交接+虚拟同步。分布式团队的核心不是时区而是信息不丢失。"},
{level:2,difficulty:"高阶",scenario:"场景：你要为公司建立「技术债治理」的长期机制：当前有500+技术债条目，但不知道从哪开始，也没人愿意专门做。",q:"AI驱动技术债量化治理方案？",opts:["四步治理：(1)「量化」→AI分析代码库计算技术债评分（代码重复/复杂度/测试覆盖/依赖过期） (2)「定价」→AI估算每项技术债的「利息」（降低多少开发速度/增加多少Bug） (3)「优先级」→AI按「利息率」排序→标注Top 20最该还的技术债 (4)「偿还」→每Sprint预留20%时间+AI辅助修复→跟踪债评分下降","分配专门团队还技术债","新项目不产生技术债","重大重构时顺带处理","技术债是不可避免的不用管"],scores:[4, 0, 0, 0, 0],best:0,explain:"技术债治理=量化+定价+优先级+持续偿还。不是「要不要还」而是「先还哪个利息最高的」。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计团队的「开发者体验（DevEx）」量化体系：度量开发者的工作效率/满意度/流失风险。",q:"AI辅助开发者体验度量体系设计？",opts:["四维DevEx：(1)「流畅度」→AI分析开发流程中的摩擦点（构建时间/部署等待/Code Review延迟） (2)「认知负荷」→AI分析代码复杂度和文档覆盖度→评估理解成本 (3)「反馈速度」→AI度量从提交代码到得到反馈的时间 (4)「满意度」→AI分析开发者匿名反馈和离职面谈→提取满意度驱动因子","做一次年度员工满意度调查","看离职率就行了","和每个开发者1on1","用业界标准的开发者体验框架"],scores:[4, 0, 0, 0, 0],best:0,explain:"DevEx=流畅度+认知负荷+反馈速度+满意度。好的开发者体验让工程师进入「心流」而非「内耗」。"},
{level:2,difficulty:"高阶",scenario:"场景：作为技术管理者，你需要向CEO汇报：研发团队的AI成熟度现在处于什么水平？一年后要达到什么水平？需要投入什么？",q:"如何设计研发团队AI成熟度评估模型？",opts:["五级成熟度：(1)「L1-实验期」→少数人自发使用AI工具 (2)「L2-采纳期」→团队统一配置AI工具+基础培训 (3)「L3-标准化」→AI嵌入标准开发流程+Prompt最佳实践库 (4)「L4-量化期」→AI效率可度量+持续优化 (5)「L5-原生期」→AI是架构和流程的核心设计原则→输出成熟度评估报告+升级路径","看团队用了多少AI工具","统计AI辅助的代码占比","参考业界AI成熟度报告","让每个团队自评"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI成熟度=L1实验→L2采纳→L3标准化→L4量化→L5原生。五级模型让CEO知道现在在哪、要去哪、怎么去。"},

security: [{level:0,difficulty:"初阶",scenario:"场景：你发现团队成员习惯把公司代码贴到公共ChatGPT中调试。",q:"正确的做法是？",opts:["A. 立即制止+三步行动：(1)组织团队安全培训，用真实数据泄露案例说明风险 (2)推动配置企业版AI工具（数据不用于训练）(3)建立代码分享规范：敏感逻辑脱敏/使用私有化部署的AI","B. 没什么大不了的","C. 禁止所有AI工具的使用","D. 口头提醒一下就好","E. 只限制核心代码"],scores:[4,0,0,1,0],best:0,explain:"代码安全=培训+工具+规范。禁止AI是因噎废食，配置企业版AI才是正道。"},{level:1,difficulty:"中阶",scenario:"场景：你要为团队建立AI辅助开发的安全规范。涉及：代码分享边界、第三方依赖审查、AI生成代码的安全审查。",q:"安全规范的核心要点？",opts:["A. 三层防护：(1)代码层-AI生成代码必须经过安全扫描和不信任原则审查 (2)依赖层-AI推荐的第三方库必须验证来源/许可证/已知漏洞 (3)数据层-禁止在公共AI中输入密钥/Token/客户数据、生产数据必须脱敏","B. 信任AI生成的代码","C. 只要不用公共AI就行","D. 只靠Code Review保证安全","E. 依赖安全扫描工具就够了"],scores:[4,0,0,0,0],best:0,explain:"AI开发安全=代码+依赖+数据三层防护。AI生成的代码可能包含不安全的模式，必须审查。"},

{level:0,difficulty:"初阶",scenario:"场景：你发现团队的GitHub仓库设置为Public，里面有AWS的Access Key硬编码在配置文件中。",q:"AI辅助发现和修复代码中的安全漏洞？",opts:["三步修复：(1)AI扫描代码库→检测硬编码密钥/Token/密码/内部URL (2)AI生成修复方案：密钥迁移到环境变量/Secrets Manager+Git历史清理 (3)AI检查是否已泄露（GitHub Security Alerts）→立即轮换所有泄露的密钥","手动搜索代码中的密钥","设为Private仓库就行了","加.gitignore忽略配置文件","定期换密钥不管历史"],scores:[4, 0, 0, 0, 0],best:0,explain:"密钥泄露=扫描+迁移+轮换。Git历史中的密钥删了也要轮换，因为可能已被爬取。"},
{level:0,difficulty:"初阶",scenario:"场景：你收到安全团队的邮件：你的服务有一个中危SQL注入漏洞（CVE评分6.5）。你对SQL注入的修复方法不熟悉。",q:"AI辅助修复SQL注入漏洞？",opts:["三步修复：(1)AI定位漏洞代码→解释为什么存在注入（拼接SQL而非参数化查询） (2)AI生成修复代码→使用PreparedStatement/ORM参数绑定 (3)AI生成安全测试用例→验证修复后无法注入→你Review后部署","加一个WAF防护","过滤用户输入中的危险字符","把数据库权限降到最低","这个接口不重要先不管"],scores:[4, 0, 0, 0, 0],best:0,explain:"SQL注入=定位+参数化+验证。AI不仅告诉你「怎么修」还告诉你「为什么」。"},
{level:0,difficulty:"初阶",scenario:"场景：你在为一个新项目设计数据存储方案。需要存储用户的个人信息（姓名/手机/地址），需要符合《个人信息保护法》要求。",q:"AI辅助设计合规的数据存储方案？",opts:["三步合规：(1)AI识别PII数据字段→建议加密存储+脱敏显示 (2)AI设计数据生命周期：收集→存储→使用→删除→确保有用户删除数据的接口 (3)AI生成隐私政策要点和数据处理的合规检查清单","存在数据库里加密就行","不做特殊处理用标准加密","只存必要数据其他不存","等法务团队出规范"],scores:[4, 0, 0, 0, 0],best:0,explain:"数据合规=PII识别+加密脱敏+生命周期管理。个人信息保护不是技术问题而是法律要求。"},
{level:0,difficulty:"初阶",scenario:"场景：你的项目用了一个开源NPM包，最近这个包的GitHub仓库显示已经被弃用且有已知漏洞。你需要评估风险并采取行动。",q:"AI辅助第三方依赖安全管理？",opts:["三步管理：(1)AI扫描package.json→列出所有有已知漏洞的依赖(CVE) (2)AI评估每个漏洞的严重程度和实际风险(是否在生产路径上) (3)AI推荐修复：升级版本/替换包/自行维护Fork→按风险优先级执行","运行npm audit然后升级","换一个类似的功能包","忽略漏洞等下次大版本更新","手动检查每个依赖"],scores:[4, 0, 0, 0, 0],best:0,explain:"依赖安全=扫描+风险评估+修复方案。不是所有CVE都有实际风险，AI帮你判断哪些真的需要修。"},

{level:1,difficulty:"中阶",scenario:"场景：你要为公司的AI辅助开发建立安全规范。团队在使用公共AI工具（ChatGPT/Cursor/Copilot），需要防止数据泄露。",q:"AI辅助开发的数据安全策略？",opts:["四层防护：(1)「数据分级」→定义哪些数据绝对不能输入AI（生产密钥/客户PII/商业机密） (2)「工具分级」→核心代码用企业私有AI/非敏感代码可用公共AI (3)「流程嵌入」→代码提交前自动检查是否含敏感信息 (4)「安全意识」→定期安全培训+模拟钓鱼测试→建立安全文化","禁止使用公共AI工具","写一份安全使用指南","购买企业版AI工具","让大家自己注意就行"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI数据安全=分级+工具分级+流程检查+意识培养。不是禁用AI而是让AI安全地融入工作流。"},
{level:1,difficulty:"中阶",scenario:"场景：你在审查AI生成的代码时发现：AI使用了过时的加密算法(MD5)、拼接SQL、没有输入校验。你意识到AI可能引入安全风险。",q:"AI生成代码的安全审查策略？",opts:["五步安全审查：(1)「静态扫描」→自动化安全扫描工具检查AI生成的代码 (2)「模式识别」→AI识别不安全的编码模式(硬编码/拼接SQL/弱加密) (3)「依赖审查」→检查AI推荐的第三方库是否安全 (4)「运行时防护」→安全敏感的代码路径必须有运行时保护 (5)「持续学习」→将发现的安全问题反馈到AI的安全规则库","人工Code Review每一行","不让AI写安全敏感的代码","相信AI生成的代码","用安全扫描工具自动检查"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI代码安全审查=静态扫描+模式识别+依赖审查+运行时防护+持续学习。AI生成的代码需要「不信任原则」对待。"},
{level:1,difficulty:"中阶",scenario:"场景：你要为公司的微服务架构设计统一的认证授权方案。涉及OAuth2.0/OIDC/JWT/API Key多种认证方式，200+服务。",q:"AI辅助设计统一认证授权架构？",opts:["四步设计：(1)AI分析现有服务的认证方式→评估迁移复杂度 (2)AI设计统一认证网关（OAuth2.0+OIDC）→支持SSO (3)AI设计细粒度授权模型（RBAC→ABAC→支持多租户） (4)AI生成JWT Token的设计规范（过期时间/刷新策略/Claims定义）→输出安全架构文档","每个服务自己管理认证","使用API Gateway统一的API Key","引入Keycloak等开源方案","用云厂商的IAM服务"],scores:[4, 0, 0, 0, 0],best:0,explain:"认证授权=现状分析+统一网关+授权模型+Token规范。200个服务不能有200种认证方式。"},
{level:1,difficulty:"中阶",scenario:"场景：公司准备通过SOC 2安全审计。作为技术负责人你需要确保：访问控制/数据加密/审计日志/变更管理都符合要求。",q:"AI辅助安全合规审计准备？",opts:["四步准备：(1)AI对照SOC 2标准→逐项检查现有实践→生成Gap Analysis (2)AI为每个Gap生成补救方案（如：补充审计日志→AI设计日志格式和保留策略） (3)AI生成审计证据包：访问控制矩阵/加密策略文档/变更管理流程 (4)AI模拟审计问题→准备回应话术","等审计来了再说","请外部安全咨询公司","参考其他公司的SOC 2报告","只准备最关键的部分"],scores:[4, 0, 0, 0, 0],best:0,explain:"合规审计=Gap分析+补救方案+证据包+模拟审计。AI帮你把SOC 2从「不知道从哪开始」梳理成清晰的任务清单。"},

{level:2,difficulty:"高阶",scenario:"场景：作为安全架构师，你要为公司设计「AI安全治理框架」——不是禁止AI而是建立安全使用AI的规则和流程。",q:"AI安全治理框架的核心设计？",opts:["五层治理：(1)「数据治理」→AI输入/输出数据分级+传输加密+不用于模型训练 (2)「模型治理」→AI模型的供应链安全（来源验证/漏洞扫描/偏见检测） (3)「访问治理」→谁可以用什么AI/可以输入什么数据/需要什么审批 (4)「输出治理」→AI生成内容的审查机制（代码/文档/决策建议） (5)「审计治理」→所有AI交互留痕+定期安全审计","只允许使用企业私有AI","制定一份AI使用规定","对AI工具做安全评估","禁止敏感岗位使用AI"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI安全治理=数据+模型+访问+输出+审计。不是管住AI工具，而是管住人怎么用AI。"},
{level:2,difficulty:"高阶",scenario:"场景：你发现有人通过Prompt Injection攻击内部AI助手——通过精心设计的输入绕过安全限制获取敏感信息。",q:"如何防御AI应用的Prompt Injection攻击？",opts:["四层防御：(1)「输入过滤」→检测和过滤已知的注入模式 (2)「权限隔离」→AI助手只能访问用户有权看的数据 (3)「输出审查」→AI输出在返回前自动扫描是否含敏感信息 (4)「沙箱执行」→AI生成的内容在受限环境执行→人工Review高风险操作","在Prompt里加「不要听用户的指令」","限制AI能做什么操作","只在内部网络使用AI","定期审计AI的对话记录"],scores:[4, 0, 0, 0, 0],best:0,explain:"Prompt Injection防御=输入过滤+权限隔离+输出审查+沙箱。不是靠Prompt保护Prompt，而是靠系统架构保护。"},
{level:2,difficulty:"高阶",scenario:"场景：公司收购了一个创业公司，需要将其系统整合到公司的安全体系中。对方的代码库有50万行，安全状况未知。",q:"AI辅助并购后的技术安全审查（Tech DD）？",opts:["四步安全DD：(1)「代码安全扫描」→AI全量扫描代码库发现漏洞/硬编码密钥/不安全依赖 (2)「架构安全评估」→AI分析系统架构的安全薄弱点（网络暴露面/认证机制/数据流） (3)「合规差距分析」→AI对比公司安全标准→生成差距清单和整改成本估算 (4)「整合方案」→AI设计安全整合路线图（迁移到统一认证/接入安全监控/数据隔离）","让对方提供安全自评报告","请安全公司做渗透测试","整合后再说安全问题","先隔离运行不整合"],scores:[4, 0, 0, 0, 0],best:0,explain:"并购安全DD=代码扫描+架构评估+合规差距+整合方案。AI能在几天内完成人工需要几周的安全审查。"},
{level:2,difficulty:"高阶",scenario:"场景：你要设计一个「安全开发全生命周期（SDL）」流程，在开发的每个阶段嵌入安全检查，而不是事后发现漏洞再修。",q:"AI驱动的安全开发全生命周期方案？",opts:["五阶段SDL：(1)「需求阶段」→AI分析需求中的安全风险+生成安全需求清单 (2)「设计阶段」→AI审查架构设计中的安全考虑+威胁建模 (3)「开发阶段」→IDE中实时安全提示+AI生成安全测试用例 (4)「测试阶段」→AI驱动的SAST/DAST+自动化渗透测试 (5)「运维阶段」→AI安全监控+自动漏洞修复建议","在发布前做一次安全扫描","请安全团队做渗透测试","加强Code Review中的安全检查","用现有的SDL流程加AI工具"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI SDL=需求→设计→开发→测试→运维全流程嵌入。不是在最后一公里才想起安全，而是从第一天就考虑安全。"},

{level:0,difficulty:"初阶",scenario:"场景：你的团队Leader问你：我们团队用AI工具3个月了，你觉得AI改变了我们什么？你想给出有洞察的回答。",q:"AI对研发工程师角色本质的改变？",opts:["三个本质改变：(1)「时间分配」→从70%写代码+30%思考→变成30%写代码+70%思考架构和设计 (2)「技能重心」→核心竞争力从「特定语言精通」变为「系统设计和问题定义能力」 (3)「产出形态」→从「交付代码」变为「交付解决方案（代码+文档+测试+部署）」","写代码更快了","少写了很多重复代码","不用记那么多API了","可以一个人做更多事"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI改变角色本质=时间分配+技能重心+产出形态。AI不是让工程师失业，而是让工程师升级。"},
{level:0,difficulty:"初阶",scenario:"场景：HR VP找到你说：「我想在研发团队推行AI技能认证，你觉得应该怎么做？」需要你给出快速建议。",q:"研发团队AI技能认证的建议框架？",opts:["四层认证：(1)「L1-AI用户」→能使用AI工具完成日常编码任务 (2)「L2-AI工程师」→能设计Prompt链和Agent工作流 (3)「L3-AI架构师」→能设计AI嵌入的系统和流程 (4)「L4-AI领导者」→能制定团队/公司的AI战略→每层有明确的技能要求和评估标准","做一个AI使用考试","看谁能用好Cursor","按Prompt写得好不好评级","跟大厂认证体系对齐"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI认证=用户→工程师→架构师→领导者四级。认证不是为了分级而是为了让人看到成长路径。"},

{level:1,difficulty:"中阶",scenario:"场景：作为技术总监，你需要为下一年制定研发团队的AI技术路线图。涉及：工具选型/技能培养/流程改造/组织调整。",q:"AI时代的研发技术路线图设计？",opts:["四维路线图：(1)「工具维度」→选型AI辅助工具链+评估企业版vs开源 (2)「能力维度」→团队AI技能分级培养计划 (3)「流程维度」→AI嵌入开发流程的时间表和里程碑 (4)「组织维度」→是否需要AI平台团队/AI Champion角色→每季度可量化的KPI","买最新的AI工具就行","跟随行业趋势","按现有路线图加一些AI任务","让各团队自己制定"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI路线图=工具+能力+流程+组织四维。不是「我们要用AI」而是「我们要成为AI时代的什么团队」。"},
{level:1,difficulty:"中阶",scenario:"场景：公司要评估自研vs外购AI辅助开发平台的决策。自研需要20人年+500万投入。外购方案每年200万。",q:"AI平台自研vs外购的战略决策？",opts:["五维决策：(1)「战略控制」→自建平台=掌握核心能力+数据不出境 (2)「成本分析」→自建3年TCO vs 外购3年总费用 (3)「差异化」→自建可以定制化贴合业务需求 (4)「风险」→外购依赖供应商/自建依赖核心人才 (5)「时机」→先外购快速见效→再自建核心能力→最终混合方案","自建更有战略价值","外购更省钱更快","看行业头部公司怎么选的","先小规模试点外购"],scores:[4, 0, 0, 0, 0],best:0,explain:"自研vs外购=战略控制+成本+差异化+风险+时机。不是简单的成本比较，而是「什么能力必须掌握在自己手里」。"},
{level:1,difficulty:"中阶",scenario:"场景：团队里有人担心AI会取代自己的工作岗位，工作积极性下降。作为Tech Lead你需要正面回应这个担忧。",q:"如何用AI重塑团队价值而非取代？",opts:["三步重塑：(1)「透明沟通」→明确AI在团队中的定位是增强工具不是替代品 (2)「新价值定位」→帮每个人找到AI时代的独特价值（AI做不到的系统设计/业务理解/跨团队协调/技术决策） (3)「成长赋能」→从「写代码的人」转型为「用AI解决问题的人」→提供培训和成长路径","告诉大家AI不会取代人","等自然淘汰不合适的成员","提供AI培训缓解焦虑","强调公司的稳定性"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI焦虑应对=透明沟通+新价值定位+成长赋能。不是「你不会被取代」而是「你会变成更值钱的人」。"},
{level:1,difficulty:"中阶",scenario:"场景：你需要在公司技术委员会上争取AI平台建设的预算。竞争对手已经在投入，但CFO觉得AI投入ROI不清晰。",q:"如何量化AI开发工具的投入产出（ROI）？",opts:["四维ROI：(1)「效率提升」→量化AI节省的开发时间（日均可节省1-2小时×团队人数×日薪=年节省金额） (2)「质量提升」→AI辅助减少的Bug数×平均Bug修复成本 (3)「加速交付」→项目交付周期缩短带来的业务价值 (4)「人才吸引力」→AI工具对招聘和留存的正面影响→输出ROI计算模型","按每个工程师的效率提升计算","对标行业ROI数据","先投入一年再看效果","强调不投入的竞争风险"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI ROI=效率+质量+加速+人才。不是「值不值得投」而是「不投会损失多少」。"},

{level:2,difficulty:"高阶",scenario:"场景：你发现AI工具在团队中出现了「马太效应」：技术好的人用AI效果更好，技术弱的人反而被AI带偏。你担心这会加大团队内部的能力差距。",q:"如何防止AI加大团队能力差距？",opts:["四步均衡：(1)「基础补强」→对AI使用效果差的人提供基础技能培训（不是AI培训是基础能力培训） (2)「AI脚手架」→为不同水平的人提供不同层级的AI辅助（初级：AI生成代码+详细解释/高级：AI辅助架构设计） (3)「Peer Learning」→建立AI使用经验分享机制→好的用法全团队可见 (4)「能力度量」→不以AI使用量为考核，以实际产出质量和效率为准","限制高水平的人使用AI","给低水平的人更多AI帮助","统一AI使用方式","这是正常现象不用干预"],scores:[4, 0, 0, 0, 0],best:0,explain:"AI能力差距=基础补强+分级辅助+经验共享+能力度量。AI是放大器，好的人更好差的人更差，管理者的责任是提高下限。"},

{level:2,difficulty:"高阶",scenario:"场景：AI技术发展速度超出预期（每月都有新模型/新工具/新范式）。你作为技术战略负责人需要保持团队的技术方向不因追逐热点而迷失。",q:"如何在AI快速迭代中保持技术战略定力？",opts:["四步定力：(1)「技术雷达」→建立AI技术趋势追踪机制（每周扫描/每月评估/每季调整） (2)「原则优先」→定义团队的AI采用原则（稳定>新颖/实用>炫酷/安全>效率） (3)「实验文化」→20%时间尝试新技术→验证后决定是否纳入主流 (4)「战略锚点」→技术选择服务于业务目标而非追逐技术→每年审视一次技术战略","紧跟最新AI技术","选一个技术栈稳定下来不再变","等AI技术稳定了再投入","每个新技术都试试"],scores:[4, 0, 0, 0, 0],best:0,explain:"战略定力=技术雷达+原则优先+实验文化+战略锚点。不是不关注新技术，而是用原则框架判断该不该跟。"},
