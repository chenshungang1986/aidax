      concepts:[{t:'互联网产品指标的三层结构',c:'互联网产品指标通常分三层：北极星指标（如电商GMV、游戏LTV、社交DAU）、核心驱动指标（转化率/客单价/留存率/时长）、过程指标（漏斗各环节/功能使用率/内容消费量）。PM要做的不是盯所有指标，而是建立"指标树"——北极星指标的变动能顺着树追到具体的过程环节。AI可以帮你自动做这个归因追踪。'},{t:'数据驱动的迭代决策',c:'产品迭代的决策有两种来源：用户反馈驱动（用户说想要X）和数据驱动（数据显示做X能提升Y%）。数据驱动的正确姿势：假设→小步实验（A/B测试）→数据分析→决策（放量/调整/回滚）。AI能加速这个闭环：自动设计实验、实时监控显著性、自动分析结果并给出下一步建议。注意：没有显著性的数据不能支撑决策，样本量不够的结论都是猜测。'}],
      steps:[{t:'第一步：指标体系校准',d:'确认当前产品的北极星指标和核心驱动指标，用AI检查指标口径是否统一（活跃怎么定义、转化怎么算、收入怎么归因），避免"同指标不同数"。'},{t:'第二步：数据异常归因',d:'设置AI监控规则：核心指标波动超过阈值自动告警。AI自动做维度拆解（渠道/版本/地区/设备/用户群），定位异常来自哪个细分，并推测可能原因。'},{t:'第三步：迭代方案与实验设计',d:'基于归因结果，用AI生成迭代方案：功能改动描述、预期效果、影响范围。设计A/B实验：实验组/对照组划分、样本量估算、实验时长、监控指标、停止规则。'},{t:'第四步：实验分析与决策',d:'实验结束后，用AI分析实验结果：核心指标是否显著提升、是否有副作用（其他指标下降）、哪个细分用户受益最大。输出放量/调整/回滚的决策建议。'}],
      cases:[{s:'场景：电商首页改版后GMV下降了12%',sol:'AI按维度拆解：按渠道看→搜索渠道转化率下降25%（推荐渠道持平）；按页面看→改版后首屏露出位置从"搜索框"变成"活动横幅"，搜索入口下沉到第二屏。用户找搜索框的成本变高，搜索型用户流失。决策：恢复搜索框首屏位置，活动横幅改为第二屏。改回后GMV恢复。'}],
      tools:[{n:'SQL/Python',d:'数据提取和分析'},{n:'神策/AB测试平台',d:'实验设计和监控'},{n:'Claude/GPT',d:'归因和策略分析'},{n:'Power BI/Tableau',d:'指标看板'}],
      tips:['没有显著性支撑的数据结论都是猜测——先问样本量够不够','指标波动先查口径再查原因——很多"异常"是统计口径变了','A/B测试要设停止规则——别等结果出来才想怎么判','改版影响要按维度拆解——总盘下降但某个维度上升，说明有结构性变化','数据决策要给"为什么"留证据——半年后复盘还能看懂当初为什么这么做'],
      quizzes:[
        {triggerSlide:2, q:'互联网产品指标体系的正确定义方式是？',opts:['只盯DAU一个数', '北极星指标→核心驱动指标→过程指标，建立指标树', '指标越多越全面', '每个部门各定各的'],ans:1, explain:'三层指标结构：北极星指标（GMV/LTV/DAU）→核心驱动指标（转化率/客单价/留存/时长）→过程指标（漏斗环节/功能使用率）。指标树让北极星变动能顺着树追到具体环节。'},
        {triggerSlide:4, q:'A/B实验结论能支撑决策的前提是？',opts:['实验组数据看起来高就行', '结果达到统计显著性，且没有副作用（其他指标下降）', '老板说可以就可以', '跑一天就够了'],ans:1, explain:'数据驱动的正确姿势：假设→小步实验→数据分析→决策。关键前提：结果显著（样本量足够）+无副作用（其他核心指标未受损）。没有显著性的结论都是猜测。'}
      ],
       },
    internet_pm4: { objectives:['学会用AI快速生成产品原型描述','掌握A/B实验方案的AI设计方法','能构建AI辅助的交互设计工作流'],
      concepts:[{t:'AI辅助原型设计的模式',c:'AI在原型设计中有三种角色：第一，灵感加速器——描述场景让AI生成信息架构和页面布局的多种方案；第二，细节完善器——AI检查原型的完整性（空状态/加载态/错误态/边界场景）；第三，规格翻译器——将设计稿转化为开发可读的交互说明。核心是"人在回路"：AI出方案、PM做判断。'},{t:'交互设计的完整性清单',c:'一个成熟的原型不能只有主流程，还要覆盖：空状态（没有数据时显示什么）、加载状态（数据加载中）、错误状态（请求失败/输入错误）、边界场景（超长文本/极端数据）、权限场景（未登录/无权限）。AI特别擅长补全这些"容易被遗忘"的状态设计——把主流程描述给它，让它生成所有异常状态的交互方案。'}],
      steps:[{t:'第一步：场景与目标定义',d:'明确要设计的功能：用户场景、业务目标、核心指标。用结构化描述（谁、在什么场景、想完成什么、现在卡在哪）。'},{t:'第二步：AI生成原型方案',d:'把场景描述给AI，让它生成2-3套信息架构和页面布局方案。每套方案包含：页面结构、核心元素、交互逻辑、适用场景。人工评估后选定方向。'},{t:'第三步：状态补全与细化',d:'让AI补全所有异常状态：空状态、加载态、错误态、边界场景、权限场景。然后细化交互细节：按钮文案、动效方向、反馈方式。'},{t:'第四步：实验设计与验收标准',d:'为功能设计A/B实验方案：实验变量、分组、样本量、时长、监控指标。同时用AI生成功能的验收标准和埋点需求清单。'}],
      cases:[{s:'场景：社交App要做"拍一拍"类轻互动功能',sol:'AI生成3套方案：1)消息列表直接双击头像（路径短但误触率高）；2)聊天页双击（自然但发现难）；3)长按弹菜单选择（功能丰富但操作重）。选定方案1后，AI补全状态设计：对方离线时显示"等你回来拍"、连续拍10次触发彩蛋、免打扰用户不提示。上线后日活互动率提升8%。'}],
      tools:[{n:'Figma/即时设计',d:'原型设计'},{n:'Claude/GPT',d:'方案生成和状态补全'},{n:'AB测试平台',d:'实验设计'},{n:'飞书文档',d:'PRD和交互说明'}],
      tips:['AI给3套方案你只选1套——选择题比填空题简单','原型评审时把AI生成的异常状态清单打印出来逐条过','按钮文案也是产品设计——AI可以批量生成A/B文案','"空状态"是产品体验的分水岭——新手产品空状态一片空白','把好的AI提示词沉淀成团队模板，新人也能输出高质量原型'],
      quizzes:[
        {triggerSlide:2, q:'AI在原型设计中最容易被忽视的价值是？',opts:['生成炫酷的视觉稿', '补全异常状态：空态/加载态/错误态/边界场景/权限场景', '替代设计师', '自动写代码'],ans:1, explain:'AI特别擅长补全"容易被遗忘"的状态设计：空状态、加载状态、错误状态、边界场景、权限场景。主流程人人会画，异常状态才是专业度的分水岭。'},
        {triggerSlide:4, q:'选择AI生成的原型方案时，PM的正确做法是？',opts:['全都要', 'AI出方案→PM做判断，选1套方向再细化', '让AI自己决定', '选最复杂的'],ans:1, explain:'核心是"人在回路"：AI出方案、PM做判断。让AI生成2-3套方向方案→人工选定→AI补全异常状态和细节→形成最终原型。'}
      ],
       },
    internet_pm5: { objectives:['学会用AI系统化追踪互联网竞品','掌握AI应用趋势的分析方法','能制定AI时代的产品战略路线图'],
      concepts:[{t:'互联网竞品分析的多层框架',c:'互联网竞品分析要分三个层次：产品层（功能对比、体验对比、定价对比——最表层）、商业层（商业模式、增长策略、用户结构——中层）、战略层（技术路线、AI应用、生态布局——深层）。大多数竞品分析停留在产品层，而真正的竞争差异在商业层和战略层。AI可以帮你穿透三层：自动抓取产品功能更新、分析商业模式的财务逻辑、研究竞品的AI投入和技术专利。'},{t:'AI时代的产品战略',c:'AI正在重新定义互联网产品的竞争要素：效率（AI把内容生产成本降到原来的1/10）、个性化（AI让千人千面从推荐扩展到全链路）、新交互（自然语言成为新UI）、新商业模式（AI订阅/按效果付费）。产品战略的核心问题是：我们的数据资产是什么、AI能用它做什么别人做不到的事、如何形成数据+AI的飞轮。'}],
      steps:[{t:'第一步：竞品雷达建立',d:'确定竞品清单（直接竞品+间接竞品+跨界潜在对手）和追踪维度：产品更新、用户增长、商业化动态、AI应用进展。设置AI定期抓取和汇总。'},{t:'第二步：AI深度对比分析',d:'用AI做三层对比：产品层（功能/体验/定价矩阵）、商业层（商业模式和增长策略拆解）、战略层（技术路线和AI布局）。输出差异化机会清单。'},{t:'第三步：AI趋势研究',d:'追踪AI技术对所在赛道的影响：大模型能力边界、AI应用落地案例、用户对AI产品的接受度变化。用AI生成趋势判断和机会窗口分析。'},{t:'第四步：产品战略路线图',d:'综合竞品+趋势+自身数据资产，用AI生成12个月产品战略：AI优先级（哪些环节先上AI）、数据飞轮设计（如何积累数据资产）、差异化定位（不跟竞品正面竞争的方向）。'}],
      cases:[{s:'场景：电商平台担心被AI购物助手颠覆',sol:'AI分析：大厂AI购物助手的优势是通用推荐（基于全网数据），但短板是不了解本平台用户的真实购买行为。我们的数据资产：本平台用户的行为轨迹、交易记录、评价体系——这些是任何通用AI拿不到的。战略：不跟通用AI比"什么都能推荐"，而是做"最懂你在这个平台买什么"的垂直AI导购，把数据飞轮转起来。'}],
      tools:[{n:'Claude/GPT',d:'竞品和趋势分析'},{n:'SimilarWeb/七麦数据',d:'流量和榜单监控'},{n:'天眼查/IT桔子',d:'竞品融资和布局'},{n:'行业报告',d:'AI应用趋势研究'}],
      tips:['竞品分析穿透三层——产品层只是冰山一角，战略层才是胜负手','AI时代的竞争是"数据×AI"的飞轮竞争——先想清楚数据从哪来','不要All-in跟风大厂AI功能——差异化定位才能活下来','竞品报告给管理层要一页纸——决策层要的是方向不是细节','每季度做一次AI应用趋势研究——这个领域半年就是一代'],
      quizzes:[
        {triggerSlide:2, q:'互联网竞品分析的正确层次是？',opts:['只比功能', '产品层+商业层+战略层——大多数竞争差异在商业和战略层', '只比价格', '只看融资额'],ans:1, explain:'三层竞品框架：产品层（功能/体验/定价——最表层）、商业层（商业模式/增长策略/用户结构）、战略层（技术路线/AI布局/生态）。真正的竞争差异在商业层和战略层。'},
        {triggerSlide:4, q:'AI时代互联网产品构建竞争壁垒的关键是？',opts:['买最好的AI模型', '数据资产+AI飞轮——用别人拿不到的独家数据训练差异化能力', '先抄竞品AI功能', '多投广告'],ans:1, explain:'AI时代竞争核心：你的数据资产是什么→AI能用它做别人做不到的事→形成数据+AI飞轮。通用AI能力大家都能买到，独家数据才是壁垒。'}
      ],
       },

    // 大型项目×PM
    mega_pm1: { objectives:['学会用AI分析招标文件与政策需求','掌握大型项目需求的系统化梳理方法','能生成规范的项目需求文档'],
      concepts:[{t:'大型项目需求的来源与特征',c:'大型项目（能源/地产/政务）的需求与互联网产品完全不同：需求来自招标文件、政策法规、上级规划、现场调研、专家评审——多源且互相约束。特征：周期长（项目3-5年）、干系人多（业主/监理/总包/分包/监管）、合规要求高（招投标法/资质/验收标准）。AI可以帮助PM把分散在多份文件中的需求统一结构化，并检查需求之间的冲突。'},{t:'招标文件的需求提取',c:'招标文件是大型项目的"需求圣经"：技术规格书（功能需求）、评分标准（权重需求——分数高的部分必须重点投入）、资质要求（门槛需求——不满足直接废标）、商务条款（合同需求——付款/工期/质保）。AI提取需求时要注意：提取+标注出处（每一条需求要能定位到原文）+检查矛盾（技术书和图纸不一致、评分项和功能要求冲突）。'}],
      steps:[{t:'第一步：文件输入与预处理',d:'收集项目相关文件：招标文件、可研报告、政策文件、现场调研记录。用AI做OCR和结构化提取，统一术语（不同文件可能用不同说法指同一件事）。'},{t:'第二步：AI需求提取与分类',d:'用AI从文件中提取需求条目，按类型分类：功能需求/性能需求/合规需求/交付需求。每条需求标注：来源文件、优先级（根据评分标准）、验收要点。'},{t:'第三步：冲突与风险检查',d:'用AI交叉检查需求冲突：技术方案与预算矛盾、工期与工作量不匹配、资质要求与团队现状差距。输出风险清单和需要澄清的问题列表（澄清函）。'},{t:'第四步：需求文档生成',d:'用AI生成规范的需求规格说明书：需求编号体系、功能需求清单、性能指标、合规要求对照表、验收标准。确保每条需求可追溯、可测试。'}],
      cases:[{s:'场景：光伏电站EPC项目招标文件需求整理',sol:'AI从200页招标文件中提取出137条需求，按评分权重排序发现：占比最高的不是光伏组件效率（10%），而是"同类项目业绩"（20%）和"智慧运维方案"（15%）。团队据此调整策略：补强智慧运维方案的技术细节+重点准备同类业绩证明材料，最终在竞标中胜出。'}],
      tools:[{n:'Claude/GPT',d:'需求提取和冲突检查'},{n:'飞书文档/语雀',d:'需求协同管理'},{n:'企业知识库',d:'历史项目经验复用'},{n:'思维导图工具',d:'需求结构梳理'}],
      tips:['大型项目需求必须"条条有出处"——无法追溯的需求等于没写','评分标准就是需求优先级——分数高的地方投入要匹配','AI提取需求后人工抽检20%——防止幻觉编造条目','需求冲突尽早发现——澄清函比变更单便宜十倍','建立项目术语表——让AI和团队用同一种语言'],
      quizzes:[
        {triggerSlide:2, q:'大型项目需求与互联网产品需求最大的区别是？',opts:['没有区别', '需求来自招标/政策/规划等多源文件且互相约束，周期长、干系人多、合规要求高', '需求更简单', '不需要用户研究'],ans:1, explain:'大型项目需求特征：多源（招标/政策/规划/调研）且互相约束、周期长（3-5年）、干系人多（业主/监理/总包/监管）、合规要求高（招投标法/资质/验收）。AI的价值是把分散需求结构化并检查冲突。'},
        {triggerSlide:4, q:'从招标文件提取需求时，最容易遗漏的是？',opts:['技术规格书内容', '评分标准对应的权重需求——分数高的部分必须重点投入', '公司名称', '项目地址'],ans:1, explain:'招标文件四类需求：技术规格书（功能）、评分标准（权重——决定投标策略）、资质要求（门槛——不满足直接废标）、商务条款（付款/工期/质保）。评分权重需求最容易被忽略但最影响中标。'}
      ],
       },
    mega_pm2: { objectives:['学会用AI分析大型项目的用户与场景','掌握B端/政企场景的研究方法','能生成场景化的需求清单'],
      concepts:[{t:'大型项目"用户"的复杂性',c:'大型项目的用户不是单一个体：业主方（投资决策者，关心ROI和风险）、运营方（日常使用者，关心好用和稳定）、监管方（合规监督者，关心安全和合规）、终端用户（能源消费者/购房者/办事群众，关心体验和服务）。PM必须分清"谁付钱、谁使用、谁监督"——三者的需求经常冲突，AI可以帮你把不同干系人的需求分别建模并找平衡点。'},{t:'现场调研与数据洞察的结合',c:'大型项目决策不能只看会议室汇报，还要看现场：能源项目要看运维人员的实际操作、地产项目要看购房者的真实决策路径、政务项目要看窗口办事的排队和材料。AI可以把现场调研的访谈记录、照片、录音转成结构化的洞察，再与系统数据（运行日志/办事数据/成交数据）交叉验证——"用户说的"和"数据说的"互相印证才可靠。'}],
      steps:[{t:'第一步：干系人识别与访谈',d:'识别项目的关键干系人：决策者/使用者/监督者/受益者。制定访谈提纲（当前做法/痛点/期望/约束）。用AI辅助整理访谈记录，提取关键诉求。'},{t:'第二步：现场调研与数据采集',d:'安排现场调研（运维现场/项目工地/服务窗口），收集一手观察。同时拉取系统数据（设备运行日志/办事记录/案场数据）作为定量佐证。'},{t:'第三步：AI交叉分析与场景梳理',d:'用AI把访谈诉求与数据证据交叉验证：哪些诉求有数据支撑（高置信）、哪些只是个别意见（低置信）、哪些数据揭示了用户没说的痛点（新发现）。整理出核心使用场景清单。'},{t:'第四步：场景化需求输出',d:'对每个核心场景，用AI生成需求条目：场景描述、用户角色、当前痛点、期望方案、验收标准、优先级。输出场景化需求文档供评审。'}],
      cases:[{s:'场景：智慧政务平台"一网通办"上线后使用率低',sol:'AI交叉分析：窗口访谈发现群众抱怨"线上提交材料反而更麻烦"（要拍照上传+现场还要再核原件）；系统数据显示线上申请完成率仅30%，但线下窗口办理量没降。结论：线上没有真正"减材料"，只是把窗口排队变成了上传等待。改进：对接电子证照库实现"免提交"——群众只需勾选已有证照。线上完成率提升到75%。'}],
      tools:[{n:'Claude/GPT',d:'访谈整理和交叉分析'},{n:'腾讯问卷/问卷星',d:'定量调研'},{n:'飞书多维表格',d:'诉求和场景管理'},{n:'录音转写工具',d:'访谈记录结构化'}],
      tips:['大型项目的"用户"是多方——先分清谁付钱、谁使用、谁监督','访谈诉求必须和数据交叉验证——"用户说的"和"数据说的"互相印证才可靠','现场调研不可替代——会议室里看不到真实的痛点','场景清单要聚焦——10个深度场景好过50个表面场景','需求文档要写"为什么"——政企项目评审专家会追问需求来源'],
      quizzes:[
        {triggerSlide:2, q:'大型项目分析"用户"时，必须分清的三方是？',opts:['老板/员工/客户', '谁付钱、谁使用、谁监督——业主方/运营方/监管方的需求经常冲突', '老人/青年/儿童', '甲方/乙方/监理'],ans:1, explain:'大型项目用户复杂：业主方（投资决策，关心ROI）、运营方（日常使用，关心好用）、监管方（合规监督，关心安全合规）、终端用户（关心体验）。分清谁付钱/谁使用/谁监督，分别建模再找平衡。'},
        {triggerSlide:4, q:'智慧政务平台线上使用率低的常见根因是？',opts:['群众不会用电脑', '线上没有真正减材料——只是把窗口排队变成了上传等待', '系统太先进', '宣传不够'],ans:1, explain:'线上办理"半吊子"是常见问题：仍要拍照上传+现场核原件→群众没省事。真正的改进是数据打通：对接电子证照库实现"免提交"，让线上真正比线下省事。'}
      ],
       },
    mega_pm3: { objectives:['学会用AI分析项目成本/进度/风险数据','掌握大型项目量化决策的方法','能构建项目数据看板与预警体系'],
      concepts:[{t:'大型项目三大量化主题',c:'大型项目的数据决策围绕三件事：成本（预算执行、造价偏差、结算风险）、进度（计划vs实际、关键路径、滞后环节）、风险（安全、质量、合规、资金）。这三者互相耦合：进度滞后→赶工→成本上升+质量风险。AI的价值是建立"项目数据驾驶舱"——把三者的数据拉通，自动识别耦合风险并预警。'},{t:'从数据到决策的分析框架',c:'项目数据不能只看报表，要看"偏差和趋势"：成本偏差率（预算vs实际，超支多少）、进度偏差率（计划vs实际，滞后多少）、趋势方向（是改善还是恶化）、根因分析（为什么偏）。AI可以做"偏差归因"——按分包/材料/人工/设计变更拆解成本超支的来源，按标段/工序/资源拆解进度滞后的原因。'},{t:'风险预警的信号设计',c:'好的项目预警不是"出事才报"，而是"信号出现就报"：成本方面——某材料价格连续上涨超阈值；进度方面——某关键工序连续3天低于计划产能；安全方面——某工地连续出现违规操作记录。AI可以设计这些预警信号并自动监控。'}],
      steps:[{t:'第一步：数据接入与口径统一',d:'接入项目数据源：成本台账、进度计划、质量检查、安全巡检。统一口径：成本科目、进度节点定义、风险等级标准。用AI做数据清洗和对账。'},{t:'第二步：AI偏差与趋势分析',d:'用AI定期分析：成本偏差（超支项TOP、趋势、归因）、进度偏差（滞后项TOP、关键路径影响）、质量安全（隐患趋势、重复性问题）。'},{t:'第三步：预警规则设计',d:'用AI辅助设计预警规则：阈值设定（参考行业标准+历史数据）、预警等级（黄/橙/红）、触发后的处置流程（通知谁、要求做什么、何时关闭）。'},{t:'第四步：决策建议与报告',d:'用AI生成月度项目决策报告：核心指标摘要、偏差与风险TOP5、根因分析、应对建议（赶工方案/成本控制/风险处置）。报告要能直接用于项目管理例会。'}],
      cases:[{s:'场景：大型地产项目进度连续2个月滞后，成本同步超支',sol:'AI归因发现：进度滞后主要集中在地下室结构工程（滞后21天），原因是混凝土供应不及时+冬季施工效率低；成本超支的60%来自赶工措施费（夜间施工人工费+临时租用设备）。方案：1)调整施工顺序（把不受混凝土影响的工序提前）；2)与商砼站签保障协议锁定供应；3)优化冬季施工方案减少窝工。实施后进度追回15天，赶工费用下降40%。'}],
      tools:[{n:'Claude/GPT',d:'偏差分析和报告生成'},{n:'Project/Primavera P6',d:'进度管理'},{n:'Power BI/Tableau',d:'项目看板'},{n:'广联达',d:'成本管理'}],
      tips:['项目数据决策的核心是"偏差+趋势+归因"——不是看报表是看为什么','进度和成本要拉通分析——滞后必然带来成本压力','预警要"信号出现就报"——等出大事再报就晚了','月度报告聚焦TOP5——管理层的注意力是稀缺资源','把行业经验沉淀为预警规则库——新项目直接复用'],
      quizzes:[
        {triggerSlide:2, q:'大型项目数据决策的三大量化主题是？',opts:['人/财/物', '成本（预算执行）/进度（计划vs实际）/风险（安全质量合规资金）', '设计/施工/验收', '招标/投标/中标'],ans:1, explain:'三大主题互相耦合：进度滞后→赶工→成本上升+质量风险。AI的价值是拉通三者数据，自动识别耦合风险并预警——建"项目数据驾驶舱"。'},
        {triggerSlide:4, q:'好的项目风险预警应该是？',opts:['出事后才通报', '信号出现就报——如材料连续涨价超阈值、关键工序连续低于产能', '每月月底汇总一次', '等领导问起才说'],ans:1, explain:'预警不是"出事才报"而是"信号出现就报"：材料价格连续上涨、关键工序连续低于计划、违规操作频发——这些先行信号出现时就要触发预警和处置流程。'}
      ],
       },
    mega_pm4: { objectives:['学会用AI生成项目方案与原型描述','掌握大型项目交付物的结构化方法','能设计可验收的实施方案'],
      concepts:[{t:'大型项目方案类交付物的类型',c:'大型项目的方案类交付物覆盖全生命周期：立项阶段（可研报告、项目建议书）、投标阶段（技术方案、实施方案）、建设阶段（设计方案、施工方案、集成方案）、验收阶段（测试方案、验收报告）。每一类都有固定的评审标准——投标方案评标专家看技术响应和评分点覆盖，可研报告评审专家看技术可行性和经济合理性。AI可以帮助生成初稿+对照评审标准自检。'},{t:'方案评审视角的设计',c:'写方案时先想"谁来评、怎么评"：投标方案→对照评分标准逐项响应（未响应=0分）；可研方案→论证技术可行+经济合理+风险可控；验收方案→可测试、可验证、可追溯。AI可以帮你做"评审预演"——把方案输入AI，模拟评审专家提问和挑刺，提前补强薄弱环节。'}],
      steps:[{t:'第一步：交付物框架定义',d:'明确方案类型和评审标准：投标方案→评分标准；可研报告→评审要点；实施方案→验收要求。用AI生成方案框架（章节结构+每章要点+评分点映射）。'},{t:'第二步：AI初稿生成',d:'把项目资料（需求、技术、约束）输入AI，按框架生成方案初稿。每章标注信息来源和待补充项，避免AI编造数据。'},{t:'第三步：评审预演与自检',d:'用AI模拟评审：对照评分标准逐项检查覆盖度（是否有未响应的评分点）、检查技术可行性和数据一致性、检查合规项（资质/业绩/工期）。输出整改清单。'},{t:'第四步：验收标准设计',d:'用AI将方案中的功能需求转化为可验收的测试项：测试方法、通过标准、证据要求。确保"方案写到的都能验到，验到的都写到了"。'}],
      cases:[{s:'场景：智慧能源监控平台技术方案投标',sol:'AI先对照评分标准做预演：发现"数据安全"评分点（10分）在方案里只有半页，而"平台功能"（25分）写了20页。评委视角：功能部分篇幅冗余但重点不突出，安全部分明显薄弱。整改：压缩功能篇幅聚焦差异化亮点（AI预警算法），扩充数据安全章节（等保三级+数据加密+灾备方案）。最终技术分排名第一。'}],
      tools:[{n:'Claude/GPT',d:'方案生成和评审预演'},{n:'Visio/ProcessOn',d:'架构图设计'},{n:'企业模板库',d:'交付物规范'},{n:'飞书文档',d:'方案协同'}],
      tips:['写方案先想"谁来评怎么评"——评分标准就是方案的写作大纲','AI初稿必须标注数据来源——不能让AI编造项目参数','评审预演是最便宜的试错——AI先帮你挨一轮骂','方案与验收标准必须一一对应——写到哪验到哪','优秀方案是"改"出来的——AI出初稿，人工改三遍'],
      quizzes:[
        {triggerSlide:2, q:'大型项目方案类交付物的核心写作原则是？',opts:['越长越好', '先想谁来评怎么评——评分标准就是方案写作大纲', '技术越深越好', '越漂亮越好'],ans:1, explain:'写方案先想评审视角：投标方案→对照评分标准逐项响应（未响应=0分）；可研→论证可行+经济+风险可控；验收→可测试可追溯。AI帮你做"评审预演"提前补强。'},
        {triggerSlide:4, q:'AI生成方案初稿后，PM最重要的自检动作是？',opts:['直接提交', '对照评分标准检查覆盖度+核实数据来源+检查合规项，输出整改清单', '只检查错别字', '让领导看'],ans:1, explain:'三查：评分标准覆盖度（未响应的评分点）、数据一致性（AI编造的数据要揪出来）、合规项（资质/业绩/工期声明）。输出整改清单逐项修改后再提交。'}
      ],
       },
    mega_pm5: { objectives:['学会用AI对标行业标杆企业','掌握双碳与数字化转型趋势的分析方法','能制定大型项目的战略规划'],
      concepts:[{t:'大型项目行业的战略对标框架',c:'能源/地产/政务领域的战略对标要看四个维度：技术路线（智慧能源的技术选择、绿色建筑的技术体系、数字政府的架构路线）、商业模式（能源服务化、地产运营化、政务平台化）、标杆案例（同行成功项目的做法和经验）、政策导向（双碳目标、房住不炒、数字政府规划）。AI可以系统化收集和分析这些维度的信息，输出对标差距清单。'},{t:'双碳与数字化转型的双主线',c:'当前大型项目行业有两条主线：双碳战略（能源行业是主战场、地产要绿色低碳、政务要绿色发展）和数字化转型（智慧能源/智慧工地/数字政府）。两条主线叠加产生大量项目机会：能源的虚拟电厂和碳资产管理、地产的绿色建筑和智慧社区、政务的一网统管和城市大脑。PM的战略工作是把公司能力与这两条主线的需求对接。'}],
      steps:[{t:'第一步：行业信息雷达',d:'建立行业追踪清单：政策文件（能源局/住建部/网信办）、标杆企业动态（国家电网/华能/保利/城投）、技术趋势（储能/氢能/BIM/CIM）、典型案例。用AI定期汇总。'},{t:'第二步：AI对标分析',d:'用AI做四维对标：技术路线对比、商业模式拆解、标杆案例研究、政策影响评估。输出"我们vs标杆"的差距清单和机会清单。'},{t:'第三步：战略主题研究',d:'用AI深入研究与公司相关的战略主题：双碳目标下的业务机会、数字化平台化转型路径、区域布局与政策红利。生成趋势判断。'},{t:'第四步：战略路线图输出',d:'用AI生成3年战略路线图：战略主题→阶段性目标→重点项目→资源需求→风险预案。确保战略可落地：每个重点项目有明确的客户、场景和商业模式。'}],
      cases:[{s:'场景：能源集团面对双碳转型压力，想找新业务方向',sol:'AI分析政策与市场：1)政策端——碳市场扩容、绿电交易试点、储能新政密集出台；2)市场端——工商业储能IRR已具经济性、虚拟电厂试点启动；3)能力端——集团有发电资产和电网资源，可切入"工商业储能投资运营+虚拟电厂聚合"。结论：以"源网荷储一体化"为核心布局新能源运营业务，先做2个试点项目跑通模式。'}],
      tools:[{n:'Claude/GPT',d:'战略分析和报告生成'},{n:'政府官网/行业协会',d:'政策动态'},{n:'行业报告',d:'趋势研究'},{n:'企业知识库',d:'内部能力盘点'}],
      tips:['战略对标看四维：技术路线/商业模式/标杆案例/政策导向','双碳+数字化是两条确定的主线——项目机会都从这里长出来','战略报告要"讲人话"——董事长和项目总都要能看懂','每个战略方向都要落到"客户+场景+商业模式"——空谈战略没有意义','半年review一次战略——行业变化太快，路线图要动态调整'],
      quizzes:[
        {triggerSlide:2, q:'能源/地产/政务行业战略对标的四个维度是？',opts:['价格/渠道/促销/服务', '技术路线/商业模式/标杆案例/政策导向', '规模/利润/增长/市值', '南方/北方/东部/西部'],ans:1, explain:'四维对标：技术路线（智慧能源/绿色建筑/数字政府的架构选择）、商业模式（服务化/运营化/平台化）、标杆案例（同行成功项目做法）、政策导向（双碳/房住不炒/数字政府）。'},
        {triggerSlide:4, q:'当前大型项目行业的两条战略主线是？',opts:['涨价与降价', '双碳战略（绿色低碳）+数字化转型（智慧化）——叠加产生大量项目机会', '国内与国外', '制造与服务'],ans:1, explain:'双主线：双碳（能源主战场/地产绿色低碳/政务绿色发展）+数字化（智慧能源/智慧工地/数字政府）。叠加机会：虚拟电厂、绿色建筑、城市大脑等。'}
      ],
       },

    // 运营
    ops1: { objectives:['建立AI驱动的内容生产流水线','学会用AI一个选题生成多平台适配内容','掌握AI标题优化和内容质量评估方法'],
      concepts:[{t:'AI内容生产的思维转变',c:'传统内容生产的瓶颈是人：一个人一天最多写3-4篇高质量内容。AI将瓶颈从"创作"转移到"策略"：你的核心工作变成"决定做什么内容"和"判断什么是好内容"，AI负责执行。这要求运营人员从"内容生产者"进化为"内容策略师"——决定选题方向、定义质量标准、把控品牌调性。'},{t:'多平台内容适配',c:'同一个主题在不同平台需要不同的表达方式：小红书要情绪化、口语化、带emoji；公众号要结构化、有深度、可收藏；抖音要抓眼球、前3秒定生死、口语化。AI可以理解这些风格差异，将一篇文章的材料转化为不同平台的适配内容。关键是给AI清晰的目标平台风格指南。'}],
      steps:[{t:'第一步：AI选题策划',d:'让AI分析近期热点趋势、你的目标用户兴趣、竞品的内容策略，生成10-20个选题建议。每个选题标注：目标用户群、预期阅读量、内容形式、与品牌调性的匹配度。'},{t:'第二步：内容大纲和初稿生成',d:'选定选题后，让AI生成内容大纲（文章结构、核心观点、支撑论据）。审核大纲后，让AI按大纲生成完整初稿。控制AI的输出长度和质量方向（专业深度/普适易懂）。'},{t:'第三步：多平台适配',d:'将核心内容交给AI，让它生成不同平台的版本。提供清晰的指令："将以下内容改写为小红书版本，风格：口语化、分点、带emoji、加入个人体验感、适合年轻女性用户。字数300以内。"'},{t:'第四步：标题A/B优化',d:'为同一篇文章，让AI生成10个不同风格的标题（悬念式、数字式、冲突式、情感式）。根据平台特性选择合适的标题，发布后根据数据反馈优化。'}],
      cases:[{s:'场景：一篇关于AI工具评测的文章，需要覆盖公众号和小红书',sol:'公众号版：深度评测、数据对比、购买建议，2000字，严肃专业风。小红书版：我的使用体验、3个最好用的功能、1个让我惊艳的细节，300字，emoji风，配表情包。AI一键转换，人工微调后双平台发布。'}],
      tools:[{n:'ChatGPT/Claude',d:'内容生成和多平台改写'},{n:'Jasper/Copy.ai',d:'营销文案AI'},{n:'Midjourney/DALL-E',d:'内容配图生成'},{n:'Notion AI',d:'内容管理和协作'}],
      tips:['AI生成的内容必须人工审核——事实准确性和品牌调性','建立平台的风格指南文档给AI参考，生成质量更高','选题比写作更重要——好的选题=成功的一半','标题要敢于A/B测试，数据说话而不是凭感觉','建立内容资产库，好的AI指令和模板要复用'],
      quizzes:[
        {triggerSlide:2, q:'AI内容生产的核心转变是什么？',opts:['AI完全替代人类写手', '运营从内容生产者进化为内容策略师', '不需要做选题了', '内容越长效果越好'],ans:1, explain:'AI将瓶颈从“创作”转移到“策略”。运营的核心工作变成决定做什么内容、判断什么是好内容——AI负责执行。这要求运营从生产者进化为策略师。'},
        {triggerSlide:4, q:'一个选题适配多平台时，给AI的关键指令应该包含？',opts:['只给核心内容让AI自由发挥', '品牌调性+平台风格+目标人群+字数范围+内容禁忌', '复制粘贴同一内容到所有平台', '只关注标题不关注内容'],ans:1, explain:'给AI的指令越具体越好：品牌人设+渠道风格（小红书口语化/公众号结构化/抖音抓眼球）+目标人群+字数范围+禁忌。这样才能生成真正适配各平台的内容。'}
      ],
       },
    ops2: { objectives:['建立运营数据分析的AI工作流','学会用AI识别增长瓶颈和机会','能自动生成高质量的运营分析报告'],
      concepts:[{t:'AI数据运营的闭环',c:'传统数据运营：月初定目标→手动拉数据→月末做总结。AI驱动的数据运营：实时数据监控→异常自动预警→AI分析根因→生成行动建议→追踪行动效果。这个闭环让运营决策从"月级别"缩短到"天级别"。'},{t:'指标体系的建立',c:'没有清晰指标体系的数据分析是盲目的。用AI辅助建立运营指标体系：北极星指标（核心目标）→一级指标（关键驱动因素）→二级指标（可执行细节）。例如：GMV（北极星）→流量/转化率/客单价（一级）→各渠道流量/各环节转化率/各品类客单价（二级）。'}],
      steps:[{t:'第一步：定义运营指标体系',d:'告诉AI你的业务模型和运营目标，让它生成指标体系方案。包含：核心指标定义、计算公式、数据来源、目标值建议、监控频率。'},{t:'第二步：搭建AI数据看板',d:'基于指标体系，让AI设计看板布局。包含：总览仪表盘（核心KPI）、流量漏斗（各渠道流量和转化）、用户分析（新老用户行为对比）、内容分析（各内容类型效果）、异常检测规则。'},{t:'第三步：AI自动分析和预警',d:'将定期数据交给AI分析：本周/本月数据变化→同比环比分析→发现异常指标→推测可能原因→给出行动建议。AI的输出越具体越好，不是"转化率下降了"而是"某渠道的注册转化率下降15%，可能是新版本表单增加了字段"。'},{t:'第四步：自动生成运营报告',d:'让AI根据数据自动生成日报/周报/月报。模板化输入，确保每次报告覆盖相同的维度，便于对比。报告要简短有力，一页纸说清关键。'}],
      cases:[{s:'场景：本周新增用户突然下降30%',sol:'将本周和上周的数据对比输入AI分析。AI自动分维度排查：各渠道新增变化→发现是信息流广告渠道下降（-50%）→进一步分析发现广告素材点击率下降（从3%降到1%）→推测素材疲劳→建议立即更换广告素材。从发现问题到定位原因到行动建议，10分钟完成。'}],
      tools:[{n:'百度统计/Google Analytics',d:'网站和App数据分析'},{n:'GrowingIO/神策',d:'用户行为分析'},{n:'ChatGPT Code Interpreter',d:'数据分析和报告生成'},{n:'飞书多维表格+AI',d:'运营数据协同管理'}],
      tips:['指标不是越多越好，10个核心指标比100个次要指标有用','差异分析时，先排查渠道和数据口径问题','AI分析需要你提供足够的数据上下文','日报看波动、周报看趋势、月报看战略','建立数据的版本管理，事后可以追踪分析变化'],
      quizzes:[
        {triggerSlide:2, q:'建立运营指标体系时，正确的层次结构是？',opts:['只看GMV一个指标', '北极星指标→一级指标（关键驱动）→二级指标（可执行细节）', '指标越多越好', '每个渠道独立设置不关联的指标'],ans:1, explain:'正确的指标体系：北极星指标（核心目标，如GMV）→一级指标（关键驱动，如流量/转化率/客单价）→二级指标（可执行细节，如各渠道流量/各环节转化率）。层次清晰才能追根溯源。'},
        {triggerSlide:4, q:'AI驱动的数据运营相比传统方式的优势是？',opts:['AI可以替代运营做所有决策', '决策周期从月级别缩短到天级别——实时监控+异常预警+AI分析根因', '不需要人工看数据了', '报告更长更详细'],ans:1, explain:'AI驱动的闭环：实时数据监控→异常自动预警→AI分析根因→生成行动建议→追踪行动效果。运营决策从月级别缩短到天级别。'}
      ],
       },
    ops3: { objectives:['学会用AI做活动创意发散和多方案生成','掌握AI辅助活动方案撰写的能力','能基于AI分析做活动效果预估和复盘'],
      concepts:[{t:'AI辅助活动策划的方法论',c:'活动策划的三个核心挑战：创意枯竭（想不到新玩法）、方案粗糙（细节考虑不周）、效果难测（投入产出看不清）。AI在三个环节都能补强：发散环节→AI能生成大量创意组合（节日+用户类型+玩法+奖品）；细化环节→AI能检查方案完备性（时间线、资源、风险）；评估环节→AI能基于历史数据预估效果。'},{t:'从创意到执行方案的转化',c:'AI不能替代你对用户和品牌的理解，但可以帮助你将创意转化为可执行的方案。输入：活动目标+目标用户+预算范围+时间节点→AI输出：活动玩法设计+用户旅程地图+资源需求清单+时间进度表+风险预案+效果预估模型。'}],
      steps:[{t:'第一步：创意发散',d:'给AI设定约束条件（预算、时间、目标用户、活动类型），让它生成10-20个创意方向。不急于筛选，先看组合可能性。第二步从10个中选出3-5个最可行的。'},{t:'第二步：方案细化',d:'对选中的创意，让AI生成详细方案。包含：活动规则、用户交互流程、奖品设计、推广计划、技术需求、法务审核点、应急预案。AI会提出你可能遗漏的细节。'},{t:'第三步：效果预估',d:'基于历史活动数据（转化率、参与率、ROI），让AI预估本次活动效果。给出乐观/中性/悲观三种预估，评估投入产出。'},{t:'第四步：活动复盘',d:'活动结束后，将数据输入AI做复盘。分析：目标达成率、各渠道效果对比、用户行为分析、意外发现、改进建议。形成标准复盘模板。'}],
      cases:[{s:'场景：618大促需要策划一场拉新活动，预算5万',sol:'先用AI创意发散：生成15个创意（抽奖、邀请裂变、新用户专享、签到打卡等）。筛选出3个：新用户首单礼+邀请有礼+大转盘抽奖。然后AI分别细化3个方案，团队讨论后选择"新用户首单礼+邀请有礼"组合方案。最后AI生成完整执行方案和效果预估。'}],
      tools:[{n:'ChatGPT/Claude',d:'创意发散和方案生成'},{n:'飞书/钉钉AI',d:'活动协同管理'},{n:'活动盒子等SaaS',d:'活动模板和数据分析'},{n:'Canva AI',d:'活动素材快速生成'}],
      tips:['活动要有明确的目标（拉新/促活/营收），避免"什么都想做"','创意阶段不要自我设限，AI帮你看到更多可能性','活动规则要简单——用户30秒内能理解','每次活动都要做数据复盘，积累经验和基线','关注ROI而不仅仅是参与人数'],
      quizzes:[
        {triggerSlide:2, q:'用AI做活动创意时，最有效的方法是什么？',opts:['让AI一次给一个方案', '让AI生成多方案+多角度创意供团队选择', '完全信任AI的方案不做讨论', '只做线上活动不做线下'],ans:1, explain:'AI擅长“发散思维”——从一个活动目标生成5-10个不同角度、不同形式的创意方案。团队从中选择最合适的，AI再深化细节。效率远高于从零脑暴。'},
        {triggerSlide:4, q:'活动复盘时AI最适合做什么？',opts:['替你做总结报告', '多维度对比分析：目标vs实际、不同渠道表现、用户分层效果、投入产出比', '只看最终GMV', '只关注失败忽略成功'],ans:1, explain:'AI可以快速做多维度对比：活动目标vs实际达成、各渠道转化效率、不同用户群的参与度差异、ROI分析。关键是用AI发现“哪里做对了可以复制”和“哪里需要改进”。'}
      ],
       },
    ops4: { objectives:['建立AI辅助的用户标签和分群体系','学会用AI设计用户分群运营策略','掌握AI个性化内容推送的方法'],
      concepts:[{t:'用户运营的精细化演进',c:'粗放运营时代：给所有人发一样的消息→千人一面。精细化运营时代：给不同群发不同的消息→千人千群。AI时代：给每个人发个性化的消息→千人千面。AI让个性化的成本降到几乎为零，关键是你能否定义好分群的逻辑和触发规则。'},{t:'标签体系的设计',c:'好的标签体系是精细化运营的基础。三类标签：属性标签（年龄、城市、职业）→不变；行为标签（访问频率、购买品类、活跃时段）→有时间窗口；预测标签（流失概率、LTV、偏好分类）→AI计算。AI可以帮助你从行为数据中提炼出有价值的标签组合。'},{t:'分群策略的AI优化',c:'传统分群靠经验（"高价值用户"怎么定义？）。AI可以基于数据聚类（K-Means等）发现自然的分群，找到人工可能忽略的用户模式。然后针对每个群设计差异化的运营策略。'}],
      steps:[{t:'第一步：设计标签体系',d:'与AI协作设计标签体系。告诉AI你的业务场景和用户类型，让它建议标签维度。覆盖：人口属性、行为特征、消费偏好、活跃度、风险指标。每个标签定义计算逻辑。'},{t:'第二步：AI发现用户分群',d:'将用户数据提供给AI（匿名化），让它用聚类算法发现自然分群。AI会输出：每群的人数、核心特征、行为差异。人工review后给每群命名和定性。'},{t:'第三步：分群运营策略设计',d:'为每个用户群设计运营策略：运营目标（拉新/激活/留存/变现）、内容策略（什么内容对这个群有吸引力）、触达方式（push/短信/邮件）、触达频率、禁扰规则。用AI辅助生成策略草案。'},{t:'第四步：AI个性化推送',d:'建立触发规则和模板库。例如："用户7天未活跃→推送个性化召回内容（AI根据用户历史兴趣生成）"。AI根据用户画像动态生成推送内容，而不是套固定模板。'}],
      cases:[{s:'场景：一个电商App有100万用户但活跃率持续下降',sol:'用AI做用户分群分析，发现4个群体：活跃买家（15%）→需维护；偶尔浏览（30%）→需激活；沉默用户（40%）→需召回；一次性用户（15%）→放弃。为"偶尔浏览"群体设计"猜你喜欢"个性化推荐push；为"沉默用户"设计大促召回优惠。'}],
      tools:[{n:'神策/GrowingIO',d:'用户行为分析和分群'},{n:'个推/极光',d:'个性化推送引擎'},{n:'火山引擎/阿里云',d:'推荐算法和个性化引擎'},{n:'ChatGPT',d:'分群策略和内容生成'}],
      tips:['分群是手段不是目的，分群是为了更好地服务用户','不要过度分群——群太少没意义，群太多难运营','标签要定期更新，用户行为是动态变化的','个性化不是"骚扰用户"，要控制触达频率','数据隐私是底线，确保用户数据合规使用'],
      quizzes:[
        {triggerSlide:2, q:'AI用户分群和传统RFM模型的主要区别是？',opts:['没有区别', 'AI可以从更多维度自动发现自然群体，而非预设分群标准', 'AI分群不需要数据', 'AI分群更慢'],ans:1, explain:'传统RFM基于三个预设维度（Recency/Frequency/Monetary）。AI可以综合行为、偏好、内容消费等多维数据，自动发现人工难以察觉的自然用户群体。'},
        {triggerSlide:4, q:'用户分群后最关键的步骤是？',opts:['给每个群体起个好听的名字', '制定差异化的运营策略——不同群体不同内容/不同渠道/不同时机', '给所有群体推同样的内容', '只要分好群就行'],ans:1, explain:'分群是为了差异化服务，不是为了贴标签。每个群体需要不同的：触达内容、触达渠道（push/短信/企微）、触达时机。好的策略=对的人+对的内容+对的时间。'}
      ],
       },
    ops5: { objectives:['识别运营流程中可自动化的环节','学会用AI设计自动化运营流程方案','掌握AI智能触发规则和条件分支的配置'],
      concepts:[{t:'运营自动化的本质',c:'运营自动化不是"让机器做所有事"，而是"把标准化的重复劳动交给机器，让人聚焦在创意和策略上"。适合自动化的场景：有明确触发条件（用户注册→发欢迎邮件）、处理量大（每天处理上千条）、规则清晰（if-else逻辑）。不适合自动化的：需要创意判断（活动策划）、需要情感交互（客诉处理）、策略制定（年度规划）。'},{t:'AI增强的自动化',c:'传统自动化：if-else规则引擎。AI增强的自动化：基于数据和用户行为的智能决策。例如：不只是"用户注册→发欢迎邮件"，而是"用户注册→AI判断用户来源和注册行为→选择最合适的欢迎内容→个性化发送→追踪效果→自动优化"。AI让自动化从"规则执行"进化为"智能运营"。'},{t:'自动化流程的设计原则',c:'设计自动化流程时遵循3C原则：Condition（触发条件要明确且可衡量）、Content（内容要个性化和有温度）、Control（要有监控和干预机制）。最常见的失败是：触发了但内容太通用（"尊敬的用户您好..."），或者误触发导致用户反感。'}],
      steps:[{t:'第一步：运营流程梳理',d:'用AI辅助梳理你当前所有的运营流程。列出：流程名称、触发条件、执行动作、当前耗时、是否可自动化、自动化优先级。AI会分析哪些流程最适合自动化。'},{t:'第二步：自动化方案设计',d:'对优先级最高的流程，让AI设计自动化方案。包含：触发条件定义（用户行为/时间/数据变化）、执行逻辑（if-else分支/多条件组合）、内容策略（模板+AI个性化）、渠道选择（push/短信/邮件/企微）、A/B测试方案。'},{t:'第三步：搭建自动化旅程',d:'选择一个自动化营销工具（如Convertlab/GrowingIO），按照AI设计的方案搭建自动化旅程。设置触发→等待→判断→执行→追踪的完整链路。'},{t:'第四步：持续优化',d:'自动化上线后，定期让AI分析效果数据。找出：哪些触发条件效果好、哪些内容点击率高、哪些环节流失严重。基于数据持续优化自动化规则和内容。'}],
      cases:[{s:'场景：新用户注册后的7天激活流程需要自动化',sol:'AI设计了一个7天自动化旅程：Day1-注册后立即发送个性化欢迎（根据注册来源选择内容）；Day3-如果未完成核心动作，推送功能引导教程；Day5-根据行为数据判断兴趣方向，推送相关内容；Day7-如果仍未活跃，触发人工跟进提醒。每个步骤都有A/B测试和效果追踪。」'}],
      tools:[{n:'Convertlab/神策',d:'营销自动化平台'},{n:'HubSpot/Marketo',d:'CRM+营销自动化'},{n:'飞书机器人/AI',d:'企业IM自动化'},{n:'Zapier/Make.com',d:'跨平台自动化连接'}],
      tips:['自动化不是"设置后就不管了"，需要持续监控和优化','触发条件要精确，避免误触发导致用户反感','内容要有温度——收到自动化消息时不能让用户觉得是机器人','建立自动化的效果追踪体系，用数据驱动优化','异常处理要完善——自动化出错时有fallback机制'],
      quizzes:[
        {triggerSlide:2, q:'运营流程自动化的第一步应该做什么？',opts:['直接购买自动化工具', '梳理现有流程，识别标准化、高频、规则清晰的环节', '把所有流程都自动化', '让AI自行决定自动化什么'],ans:1, explain:'自动化的第一步是流程梳理：哪些环节是标准化的、高频重复的、规则清晰的——这些最适合自动化。不是所有环节都需要自动化，有些需要人工判断和灵活性。'},
        {triggerSlide:4, q:'AI自动触发的用户运营策略，最重要的是什么？',opts:['触发越频繁越好', '精准的触发条件+个性化的推送内容+合理的触发频次上限', '对所有用户一视同仁', '只关注新用户不管老用户'],ans:1, explain:'好的自动化触发策略=精准触发（明确的用户行为→触发）+个性化内容（根据用户画像定制）+频次控制（避免骚扰用户）。三者缺一不可。'}
      ],
       },

    // 销售
    sales1: { objectives:['学会用AI从多维度构建客户画像','掌握AI客户意向评分的建模方法','能基于AI分析预判客户需求和购买时机'],
      concepts:[{t:'AI如何在B2B销售中重建客户理解',c:'B2B销售的挑战在于客户信息分散——CRM里的联系记录、微信里的对话、邮件里的往来、会议里的讨论，分散在不同的地方。AI可以将这些碎片化的信息整合起来，构建360度客户视图：基本信息→组织架构→决策链→历史互动→兴趣信号→风险信号。有了AI，销售可以花80%时间在"销售"上，而不是"查找信息"上。'},{t:'客户意向度的量化评估',c:'传统销售凭经验给客户贴标签："A类客户、B类客户"，标准主观且不一。AI可以从客观数据建立评分模型：活跃度（最近一次互动时间）、参与度（互动频率和深度）、需求匹配度（产品和客户痛点的匹配）、决策进度（进行到哪个阶段）、竞争态势（有几个竞品在争）。综合打分，给出量化的意向度评估。'},{t:'需求预判的时间窗口',c:'客户不会一直处于"要买"的状态。AI通过分析客户的公开信息（融资新闻、招聘动态、业务扩张信号）和私有互动数据（询问频率变化、关注话题的变化），可以预判客户的购买时间窗口。在窗口期主动联系，成功率远高于盲打。'}],
      steps:[{t:'第一步：整合客户数据',d:'将客户的所有接触点数据整合起来：CRM记录、邮件往来、会议纪要、微信沟通（脱敏后）。用AI做数据清洗和标准化，消除重复和不一致。'},{t:'第二步：AI生成客户画像',d:'让AI为每个重要客户生成画像报告：公司概况（规模、行业、发展阶段）、决策链分析（关键人物、影响者、决策者）、历史互动汇总（接触频率、关注问题、异议点）、需求匹配度、风险信号。'},{t:'第三步：意向评分和分层',d:'基于AI生成的画像，建立客户分层体系。结合量化的意向度评分和销售经验的判断，将客户分为：高热（本月可能成交）、温热（本季度可能成交）、低温（需要培育）、冷（暂时放弃）。'},{t:'第四步：动态监控和预警',d:'建立动态监控机制。当客户出现购买信号（如突然增加咨询频率、查询价格、比较竞品），AI自动提醒销售跟进。当客户沉默超过一定时间，AI提醒销售激活。'}],
      cases:[{s:'场景：手上有100个潜在客户，不知道优先跟谁',sol:'将100个客户的互动数据输入AI分析。AI从3个维度打分：1)需求匹配度（客户业务和我们的产品契合度）2)购买意向度（近期咨询频率和深度）3)成交阻碍（预算/决策链/竞品）。自动排序后，前20个客户贡献了80%的机会。销售聚焦在这20个客户后，成交率提升40%。'}],
      tools:[{n:'Salesforce Einstein',d:'CRM AI预测和评分'},{n:'HubSpot AI',d:'客户洞察和意向评分'},{n:'ChatGPT/Claude',d:'客户分析报告生成'},{n:'飞书AI+CRM',d:'客户协作和洞察'}],
      tips:['客户画像要动态更新，不要建完就不管了','意向评分模型需要定期校准——用成交数据反向验证','关注"隐性信号"：客户的高管变动、融资新闻、业务扩张','不要只看自己收集的数据，也要关注客户的公开信息','画像分析的最终目的是辅助销售决策，不是替代人的判断'],
      quizzes:[
        {triggerSlide:2, q:'AI构建客户画像的核心价值是？',opts:['替代销售跟客户沟通', '整合碎片化数据形成360度客户视图，精准把握需求', '自动成交', '减少客户接触'],ans:1, explain:'AI整合CRM/邮件/会议/行为日志等碎片化数据，构建包含决策链/痛点/沟通偏好/预算/成交概率的360度客户视图。销售基于此做精准判断而非猜测。'},
        {triggerSlide:4, q:'销售建立客户意向评分模型时，以下哪个是正确的做法？',opts:['只看客户的预算', '多维度评分（沟通频率/需求明确度/预算确认度/决策参与度）+用已知成交结果回测验证', '凭感觉打分', '分数低的直接放弃'],ans:1, explain:'科学的评分=多维度（沟通频率20%+需求明确度25%+预算确认度25%+决策参与度15%+竞品对比度15%）+历史数据回测验证模型准确率+持续优化权重。'}
      ],
       },
    sales2: { objectives:['学会用AI分析销售话术的优缺点','掌握AI生成个性化话术的方法','建立面向不同客户类型的标准化话术库'],
      concepts:[{t:'AI销售话术优化的科学方法',c:'传统话术优化靠资深销售的"感觉"。AI让话术优化变得可测量：录制/记录真实销售对话→AI分析话术的有效性→识别高转化率的话术模式→总结失败话术的共性→生成针对性优化建议。关键是建立一个"话术→效果"的反馈闭环。'},{t:'话术个性化vs标准化',c:'销售话术需要平衡标准化和个性化：标准化确保品牌一致性、降低新人上手难度；个性化提升客户体验、提高成交率。AI的解决方案是：以标准化话术框架为基础，根据客户类型（决策者/影响者/使用者）、行业、阶段动态调整内容和语气。'},{t:'异议处理的AI策略',c:'异议处理是销售最考验功力的环节。AI可以将常见客户异议分类（价格异议、需求异议、时机异议、信任异议、竞品异议），并为每类设计多个应对策略。关键是：先认同再转化（"您的担心我很理解"），用数据和案例论证（不是空口说"我们更好"），给客户选择权（不是强行说服）。'}],
      steps:[{t:'第一步：收集并分析话术数据',d:'将真实的销售对话记录（脱敏后）输入AI。让AI分析：哪些话术后客户有积极反应、哪些话术导致对话中断、不同客户类型的反应差异、异议处理的有效性排名。'},{t:'第二步：AI话术优化',d:'基于分析结果，让AI优化高频使用但效果不佳的话术。例如："价格贵"的应对，从"我们性价比高"改为"我理解您对成本的关注。我们帮XX公司通过提效降低了30%运营成本，要不我给您算一下您这边可能节省多少？"'},{t:'第三步：多版本话术生成',d:'为同一个销售场景，让AI生成3-5个不同风格的话术版本：数据导向版、关系导向版、价值导向版、FOMO（害怕错过）版。不同客户类型匹配合适的版本。'},{t:'第四步：建立话术知识库',d:'将优化后的话术整理成知识库，按场景和客户类型分类。新销售入职时可以快速上手。定期用最新数据更新话术库，保持时效性。'}],
      cases:[{s:'场景：客户说"你们的价格比XX贵30%"，销售不知道如何回应',sol:'AI分析后给出3种回应策略：1)价值锚定——"是的，因为我们的方案包括了XX功能，这块单独购买就要20%。2)ROI论证——"我帮您算一下，用我们的方案三个月可以节省的人力和时间成本，其实更划算。3)差异化对比——"我整理了一份我们和XX的详细对比，您看下这些差异对您重要吗？"'}],
      tools:[{n:'Gong/Chorus',d:'销售通话分析和AI话术洞察'},{n:'ChatGPT/Claude',d:'话术生成和优化'},{n:'飞书文档+AI',d:'话术库管理和团队共享'}],
      tips:['话术优化要用真实数据检验，不是凭感觉','最好的话术是"帮助客户看到价值"，不是"说服客户"','不同客户类型用不同话术——决策者关心ROI，使用者关心体验','异议处理的核心是先认同再转化，不要硬怼','话术库要保持更新，市场环境在变，客户需求也在变'],
      quizzes:[
        {triggerSlide:2, q:'AI生成销售话术时，最重要的输入是什么？',opts:['只给产品信息', '客户类型（角色/行业/痛点）+沟通阶段+品牌调性', '话术越长越好', '复制竞品的话术'],ans:1, explain:'好的AI话术=明确客户类型（理性决策者/技术评估者/最终用户？）+当前沟通阶段（破冰/方案/异议处理/催单？）+品牌调性。AI才能在正确场景生成正确话术。'},
        {triggerSlide:4, q:'处理客户异议时，最有效的策略是？',opts:['强硬说服客户', '先认同客户顾虑→再提供数据和案例→最后给出选择而非强迫', '直接降价', '忽略客户异议继续推销'],ans:1, explain:'异议处理三步：1) 先认同（“您的担心很合理”）→让客户感到被理解；2) 数据+案例（AI辅助收集和呈现）→建立可信度；3) 给选择空间→尊重客户决策权。'}
      ],
       },
    sales3: { objectives:['学会用AI从线索中识别高价值商机','掌握商机成交概率的AI预测方法','建立科学的商机分级管理和跟进策略'],
      concepts:[{t:'商机管理的本质',c:'商机管理不是简单的"把线索分成ABC三类"。真正的商机管理是：在正确的时间、用正确的方式、跟进正确的客户。AI帮助解决三个核心问题：哪些线索值得投入精力（商机识别）？每个商机有多大概率成交（成交预测）？每个商机下一步应该做什么（行动建议）？'},{t:'BANT商机评估框架的AI增强',c:'传统BANT框架：Budget（预算）、Authority（决策权）、Need（需求）、Timeline（时间）。AI可以帮你从对话中自动识别BANT信息：客户提到"下个月要做预算"→时间窗口信号；客户问"有没有XX功能"→需求匹配信号；客户说"要跟领导汇报"→决策链信号。AI捕捉这些信号比人工更全面。'},{t:'商机成交预测模型',c:'预测商机成交概率需要多维度数据：客户特征（行业、规模、阶段）、互动特征（接触时长、参与角色、讨论深度）、竞争特征（有几个竞品、竞品信息）、历史模式（类似客户的成交率）。AI综合这些维度给出概率预测和置信度。'}],
      steps:[{t:'第一步：商机识别和初步评分',d:'将所有的线索和初步接触信息输入AI。AI根据BANT框架和行业经验，给每个商机打分。重点关注Top20%的商机。'},{t:'第二步：深度商机分析',d:'对Top商机做深度分析：客户决策链画出、客户痛点详细描述、我们的解决方案匹配度、竞品态势评估、下一步行动计划。每个商机不超过一页纸的深度分析报告。'},{t:'第三步：成交预测和排序',d:'基于深度分析，AI给出成交概率预测（高/中/低）和对应的置信度。销售管理者基于预测结果分配团队精力和资源。'},{t:'第四步：商机动态管理',d:'建立商机的动态追踪机制。每周更新商机状态，AI自动分析变化趋势（哪些商机在推进、哪些在停滞、哪些有风险）。及时发现并处理停滞的商机。'}],
      cases:[{s:'场景：四个客户同时推进，但销售团队只有2个人，怎么分配？',sol:'用AI做商机评分排序：客户A（成交概率80%，金额50万）→优先；客户B（成交概率60%，金额100万）→需要重点攻克；客户C（成交概率50%，金额20万）→保持跟进；客户D（成交概率30%，金额200万）→需要找突破口后再说。基于评分，两人主攻A和B，C设置自动化跟进，D每周评估一次状态。'}],
      tools:[{n:'Salesforce Einstein',d:'商机评分和预测'},{n:'HubSpot Deal Pipeline',d:'商机Pipeline管理+AI'},{n:'Clari/People.ai',d:'AI商机和收入预测'}],
      tips:['商机评分模型要持续校准——用实际成交数据反向修正','重点商机要建立"作战地图"，清晰画出决策链','商机有生命周期，长期不推动的商机会"过期"','不要所有商机都平等对待——20%的商机贡献80%的收入','AI提供数据参考，最终判断还是要结合销售经验'],
      quizzes:[
        {triggerSlide:2, q:'AI商机评分的核心目的是？',opts:['拒绝所有低分商机', '合理分配精力，聚焦高价值高可行性商机', '完全依赖AI决策', '追求100%准确率'],ans:1, explain:'商机评分是为了让销售团队把有限精力投在最可能成交的商机上。低分商机仍需培育但不能占主力时间。评分永远不是100%准确，需要持续优化模型。'},
        {triggerSlide:4, q:'商机分级管理的最佳实践是？',opts:['所有商机一视同仁', 'ABCD分级：A级（本周重点跟进）、B级（下周跟进）、C级（持续培育）、D级（定期回顾）', '只跟进A级忽略其他', '只看金额不看其他'],ans:1, explain:'分级管理：A级（高意向+高价值→本周重点）、B级（中等→下周跟进）、C级（低意向→持续培育建关系）、D级（暂时无需求→每季度触达一次保持存在感）。'}
      ],
       },
    sales4: { objectives:['学会用AI清洗和标准化CRM数据','掌握用AI从CRM数据中生成客户分析报告','能基于CRM数据做销售预测和策略调整'],
      concepts:[{t:'CRM数据的三大价值层级',c:'CRM数据有三个使用层级：第一层-记录（存客户信息、联系记录）；第二层-分析（发现销售模式、客户特征）；第三层-预测（预测成交、识别风险、优化策略）。大多数团队停留在第一层。AI大幅降低了进入第二层和第三层的门槛，不需要数据分析师也能做。'},{t:'数据清洗——AI最务实的价值',c:'CRM最大的问题是数据质量：重复联系人、过时信息、不规范记录、缺失字段。AI可以在几分钟内完成人工需要几天才能完成的数据清洗工作：识别重复记录→建议合并规则→标准化字段格式→补全缺失信息→标注数据质量问题。数据干净了，后续分析才有意义。'}],
      steps:[{t:'第一步：AI数据质量诊断',d:'将CRM数据导出，让AI进行质量评估。输出：数据完整度报告（各字段的填充率）、重复率、格式规范度、时效性评估。了解当前CRM数据的"健康状态"。'},{t:'第二步：AI数据清洗',d:'根据诊断结果，让AI执行数据清洗：合并重复联系人、统一公司名称格式、标准化日期和金额字段、补全可推测的缺失信息、标记无法自动处理的问题。'},{t:'第三步：AI客户分析报告',d:'用清洗后数据让AI生成分析报告：客户行业分布、客户规模分布、区域分布、成交周期分析、赢单/输单原因分析、销售效率分析（从接触到成交的时间）。'},{t:'第四步：AI销售预测',d:'基于历史数据，让AI预测未来周期的销售情况。分析Pipeline的健康发展度，识别可能无法达成的目标。给出策略调整建议。'}],
      cases:[{s:'场景：CRM里有3000条联系人记录，但很多重复和过时了',sol:'将CRM数据导出CSV交给AI分析。AI识别出：800条重复记录（同一公司同一人，不同名片版本）、500条超过2年未更新的记录、200条公司名称格式不统一。AI给出清洗建议和操作步骤，预计3小时完成清洗（人工需要3天）。'}],
      tools:[{n:'Salesforce/HubSpot',d:'CRM平台+AI功能'},{n:'飞书多维表格',d:'轻量级CRM和数据管理'},{n:'ChatGPT Code Interpreter',d:'数据分析和报告生成'},{n:'Zapier/Make',d:'CRM数据自动化处理'}],
      tips:['CRM数据的价值=数据质量×分析深度，数据质量是基础','定期做数据健康检查（至少每季度一次）','销售预测要结合外部因素（市场变化、季节因素）','数据清洗是持续工作，不是一次性任务','好的CRM习惯从数据录入开始——制定团队录入规范'],
      quizzes:[
        {triggerSlide:2, q:'AI在CRM数据管理中最核心的价值是？',opts:['替代CRM系统', '从数据中提取洞察指导销售策略——客户行为模式/成交信号/流失风险', '只是数据录入工具', '删除不需要的数据'],ans:1, explain:'AI让CRM从“数据坟墓”变成“洞察引擎”——发现购买信号、预测流失风险、推荐最佳触达时机。关键不只是存数据，而是从数据中挖掘可行动的策略。'},
        {triggerSlide:4, q:'AI做销售预测时，哪个做法最不可取？',opts:['结合历史数据和当前Pipeline预测', '只看销售自己报的数字不做验证', '区分不同阶段的成交概率', '考虑季节性因素'],ans:1, explain:'AI销售预测 = 历史数据趋势 + 当前Pipeline各阶段转化率 + 季节性因素 + 团队产能。不能只看销售主观报的数字——乐观偏差是常见问题。'}
      ],
       },
    sales5: { objectives:['学会用AI生成结构化客户会议纪要','掌握AI自动提取行动项并生成跟进计划的方法','能用AI分析和优化跟进策略'],
      concepts:[{t:'会议纪要的认知升维',c:'传统会议纪要的问题是：每个人记得不一样、会后很难找到关键信息、行动项容易遗漏。AI可以：实时转录+识别说话人+提取关键决策+生成结构化纪要+自动分配行动项+追踪完成情况。会议纪要从"事后补的记录"变成"实时产生的资产"。'},{t:'客户跟进的科学方法',c:'跟进不只是"别忘了一周后给客户发消息"。科学的跟进包含：跟进内容（上次会议核心要点和待确认信息）、跟进时机（客户说了"下周"就是下周一，不是下周五）、跟进方式（邮件/电话/微信，根据客户偏好）、跟进目标（明确这次跟进要达成什么）。AI可以帮你记住这些细节并生成跟进内容。'},{t:'跟进节奏的最优策略',c:'跟进频率的艺术：太频繁→骚扰；太稀疏→被遗忘。AI可以基于客户阶段和互动历史推荐最优频率：初期联系（接近决策）→2-3天一次；中期推进→1周一次；长期培育→2周-1月一次。每次跟进要有新的价值（新信息、新案例、新方案），不是简单地问"您考虑得怎么样"。'}],
      steps:[{t:'第一步：AI实时会议转录和纪要生成',d:'使用AI会议工具（飞书妙记/讯飞听见/腾讯会议AI），实时录制和转录会议。AI自动生成纪要：会议时间/参与人/讨论主题/关键决策/行动项（含负责人和截止日期）/待确认事项。'},{t:'第二步：AI提取行动项',d:'让AI从会议纪要中提取结构化的行动项清单。每条行动项包含：任务描述、负责人、截止日期、优先级、依赖项。导出到CRM或项目管理工具中。'},{t:'第三步：AI生成跟进计划',d:'基于会议内容和行动项，让AI生成下次跟进的内容大纲：上次会议回顾、关键进展更新、待讨论问题、下一步建议。在实际跟进前快速过一遍，确保不遗漏。'},{t:'第四步：跟进策略优化',d:'定期回顾跟进数据：哪些客户的跟进节奏有效、哪些跟进内容效果好、跟进到成交的平均次数和时长。让AI分析优化建议。'}],
      cases:[{s:'场景：一周有8个客户会议，会议纪要总是拖到周末才补',sol:'使用AI会议工具实时转录。会后5分钟内AI自动生成纪要初稿，包含：会议时间、参会人、讨论摘要、3条关键决策、5条行动项（标注负责人和截止日期）。销售只需review修改2-3处，10分钟搞定8场会议的纪要。'}],
      tools:[{n:'飞书妙记',d:'实时转录+AI纪要'},{n:'腾讯会议AI',d:'会议录制和智能纪要'},{n:'Fireflies.ai',d:'AI会议助手'},{n:'Notion AI',d:'纪要和跟进计划管理'}],
      tips:['会议结束24小时内必须发出纪要——时效就是专业度','纪要要简洁：一页纸，重点标粗，行动项清晰','跟进前要看上次纪要和行动项——客户会看你是否用心','建立跟进模板库，不要让每次跟进都从零开始','关键会议后可以AI总结一份"客户沟通档案"给团队'],
      quizzes:[
        {triggerSlide:2, q:'AI生成客户会议纪要的最大优势是？',opts:['完全替代销售写纪要', '自动结构化提取：关键决策人表态+行动项+Deadline+异议点', '纪要越长越好', '只需记录会议时间'],ans:1, explain:'AI可以自动从会议中提取结构化信息：谁说了什么→行动项是什么→谁负责→什么时候完成→有什么异议→下一步是什么。销售只需审核而非从头写。'},
        {triggerSlide:4, q:'跟进策略优化的关键原则是？',opts:['频繁联系总能成交', '基于客户行为信号的精准跟进——识别购买意向升温的时机+个性化跟进内容', '每次跟进都一样', '只跟进新客户不管老客户'],ans:1, explain:'好的跟进=识别信号（客户打开方案/问了竞品/提到预算→购买意向升温）+个性化内容（根据客户当前阶段和兴趣点定制）+合理节奏（不骚扰也不冷落）。'}
      ],
       },

    // 人资
    hr1: { objectives:['学会用AI高效初筛和评估简历','掌握AI简历匹配度评分的实操方法','能基于AI分析优化招聘筛选标准'],
      concepts:[{t:'AI简历筛选的正确打开方式',c:'AI不是替代HR做招聘决策，而是帮HR从"看简历"这个体力活中解放出来。一个HR一天最多认真看100份简历，但AI可以在几秒钟内看完1000份并给出初步打分。HR的时间和判断力应该用在面试和候选人沟通上，而不是筛简历。核心原则：AI初筛（效率）+HR复核（质量）+AI辅助分析（深度）。'},{t:'AI简历评估的多维度方法',c:'AI评估简历不是简单的关键词匹配。好的评估应该包含：硬性条件（学历、经验年资、技能列表）、软性匹配（行业经验、项目类型、工具使用）、潜力信号（学习能力、成长速度、项目复杂度）、风险信号（频繁跳槽、职业空窗、技能陈旧）。综合打分而非单一维度筛选。'},{t:'避免AI筛选中的偏见',c:'AI筛选最大的风险是放大既有偏见。如果训练数据中"某学校毕业生"的通过率更高，AI可能会不公平地偏好该学校。解决方案：去掉敏感字段（姓名、性别、照片、年龄）后再让AI评估；用人reviewAI的决策模式；定期检查不同群体的通过率是否公平。'}],
      steps:[{t:'第一步：建立岗位评估标准',d:'与用人经理确认核心要求：必备条件（技能、经验、学历）、加分条件（行业背景、特定工具）、淘汰条件（不符合公司价值观、职业稳定性差）。将这些标准清晰描述。'},{t:'第二步：AI简历批处理',d:'将简历批量提供给AI，按照评估标准逐份打分。每份简历输出：综合评分、匹配度分析、亮点总结、风险提示、推荐理由。'},{t:'第三步：HR复核',d:'HR复核AI的评分结果，特别关注AI评分高但可能有隐藏问题的简历，以及AI评分低但可能有潜力的简历。写复核意见。'},{t:'第四步：筛选标准优化',d:'招聘一段时间后，回顾已入职员工的表现数据。让AI分析：入职后绩效好的人简历有什么共性？哪些筛选标准实际上与绩效无关？优化筛选标准。'}],
      cases:[{s:'场景：一个技术岗位收到了300份简历',sol:'不用AI的话，HR需要花3天来筛简历。用AI辅助：上午将简历导入→AI在10分钟内完成初筛评分→下午HRreviewTop50份简历→从中选出15位进入面试。从3天缩短到半天，而且筛选质量更高（AI不会疲劳导致后面看的简历标准变松）。'}],
      tools:[{n:'Moka/北森',d:'招聘系统+AI筛选'},{n:'Boss直聘AI',d:'智能匹配和推荐'},{n:'ChatGPT/Claude',d:'简历分析评估'},{n:'飞书招聘',d:'招聘流程管理和AI辅助'}],
      tips:['AI筛选是初筛工具，最终面试决策一定要有人做','去掉简历中的敏感字段再给AI评估，避免算法偏见','筛选标准要定期校准——看入职后表现反推筛选有效性','关注AI看不懂的"软信号"：创业经历、开源贡献、side project','招聘是双向选择——AI也应该帮你评估"候选人会接受offer吗"'],
      quizzes:[
        {triggerSlide:2, q:'AI简历筛选的正确应用方式是？',opts:['完全替代HR做最终决定', '高效初筛减少重复劳动，面试决策仍由HR把关', '自动发出Offer', '只看关键词匹配不看整体素质'],ans:1, explain:'AI擅长高效处理大量简历的初筛工作（关键词匹配/经验年限/技能覆盖），但面试决策和候选人关系建立仍需HR的专业判断。人机协作才是最佳实践。'},
        {triggerSlide:4, q:'建立AI简历筛选标准时最容易犯的错误是？',opts:['标准太宽泛', '以现有员工画像为唯一标准——容易固化偏见，排除多样化人才', '标准太具体', '参考行业标准'],ans:1, explain:'以现有团队为唯一筛选标准会固化偏见——“跟现有团队像”不等于“好”。应结合岗位能力模型+行业基准+多样化视角制定筛选标准，并定期审查标准的公平性。'}
      ],
       },
    hr2: { objectives:['学会用AI分析和优化现有JD','掌握用AI生成多风格多版本JD的方法','能基于投递数据用AI持续优化JD效果'],
      concepts:[{t:'AI时代的JD写作革命',c:'写好JD是招聘的第一步，也是最被低估的转化率优化。一个好的JD=精准触达目标人群+让候选人觉得"这就是我想要的"+筛掉不合适的。AI可以帮助：从"招聘需求"转化为"候选人的语言"（HR写的是"岗位职责"，候选人想看的是"我能做什么"）、生成多版本测试效果、优化JD的结构和关键词。'},{t:'JD的转化率思维',c:'JD不是内部文档，是"招聘广告"。用营销思维写JD：标题决定打开率、第一段决定继续阅读率、岗位亮点决定投递意愿。AI可以帮助设计"卖点"——不只是列条件，而是告诉候选人"加入我们你会获得什么"。'},{t:'AI定制化JD',c:'同一个岗位在不同平台需要不同长度的JD，面向不同层级的候选人需要不同的话术。AI可以根据发布渠道（猎聘/Boss/脉脉/官网）和候选人群（应届生/资深/高管），一键生成适配版本。不必从头重写。'}],
      steps:[{t:'第一步：AI诊断现有JD',d:'将现有JD输入AI，让它从候选人视角分析：标题是否吸引人、职责描述是否清晰、要求是否合理（还是要求太杂）、有没有体现公司文化和团队氛围。AI会标注问题和优化建议。'},{t:'第二步：AI优化JD',d:'基于诊断结果，让AI逐项优化：标题→突出核心卖点，职责→用"你会做什么"代替"你需要做什么"，要求→区分必备/加分，公司介绍→体现文化和价值观。'},{t:'第三步：多版本生成和测试',d:'让AI生成2-3个不同风格的版本：专业严谨版（适合猎聘/Boss）、活泼文化版（适合脉脉/官网）、极简版（适合朋友圈转发）。发布后追踪各版本投递量。'},{t:'第四步：JD效果持续优化',d:'追踪JD发布效果数据（曝光量→点击率→投递率→面试率），用AI分析哪些JD版本和措辞效果好。持续A/B测试和迭代。'}],
      cases:[{s:'场景：某个职位发布了2周，投递量远低于预期',sol:'将JD发给AI分析。AI发现问题：1)标题太通用（"Java开发工程师"改成"Java开发（负责核心交易系统）"）；2)要求太长像购物清单（12条要求→缩减到5条核心+3条加分）；3)没有体现亮点（加上"技术栈：Spring Cloud+ K8s+自研中间件"）。优化后三天内投递量翻倍。」'}],
      tools:[{n:'ChatGPT/Claude',d:'JD分析和生成'},{n:'Textio',d:'JD语言优化和偏见检测'},{n:'各大招聘平台',d:'JD效果数据分析'}],
      tips:['JD的第一读者是候选人，要用候选人的视角写','标题是JD的"广告位"，决定80%的点击率','要求要精简——每多一条要求，投递率下降5-10%','公司介绍要真诚，不要套话——"行业领先"不如"我们做了什么"','JD是活的文档，根据投递数据持续优化','拆成多条短语，每条15-30字；每周review一次JD数据'],
      quizzes:[
        {triggerSlide:2, q:'AI优化JD的关键思路是什么？',opts:['把JD写得更长', '数据驱动——分析投递数据+行业热门JD+候选人搜索行为，优化关键词和吸引力', '复制竞品JD', '只改排版不调内容'],ans:1, explain:'JD优化=投递数据分析（什么JD效果好）+行业对标（热门JD的关键词和结构）+候选人视角（搜索什么词、被什么吸引）。AI帮你批量分析，人做策略判断。'},
        {triggerSlide:4, q:'JD优化的效果需要通过什么来验证？',opts:['看谁写的JD更长', '投递量+候选人质量+面试转化率的综合数据', '只看投递量', '凭感觉判断'],ans:1, explain:'JD效果 = 投递量（看到的人多不多）× 候选人质量（来的人对不对）× 面试转化率（对的人愿不愿意面）。三个指标缺一不可。'}
      ],
       },
    hr3: { objectives:['学会用AI分析人才结构数据','掌握AI离职风险预测的方法','能基于业务发展用AI做人才需求规划'],
      concepts:[{t:'从HR到人才数据分析师',c:'传统HR做人才决策依赖经验和直觉。AI时代，HR需要具备数据思维：用数据描述人才现状（我们的人才结构是什么样的），用数据预测未来（谁会离职/我们需要什么样的人），用数据驱动决策（招聘/培训/晋升的资源怎么分配）。AI让数据分析的门槛从"需要数据分析师"降到"会用AI的HR都能做"。'},{t:'人才健康度仪表盘',c:'人才管理的核心指标：结构健康度（年龄/职级/技能/性别分布是否合理）、流动健康度（主动离职率vs被动离职率、关键人才留存率）、成长健康度（晋升率、技能提升速度、内部流动率）、文化健康度（敬业度、满意度、价值观匹配度）。AI可以帮你定期生成这个健康度报告。'}],
      steps:[{t:'第一步：AI人才结构分析',d:'将员工数据（脱敏后）输入AI分析：年龄和司龄分布、职级结构、技能分布热力图、部门人才密度、关键岗位后备率。AI会标注不健康的结构特征（如某层级断层）。'},{t:'第二步：AI离职风险预测',d:'让AI分析离职风险信号：近期绩效变化、请假频率、外网活跃度、薪酬竞争力、职业发展速度。综合给出离职风险评分。重点跟进高风险员工。'},{t:'第三步：AI人才需求规划',d:'基于公司业务规划，让AI预测未来6-12个月的人才需求。包含：需要新增的岗位、关键能力缺口、内部培养vs外部招聘建议、预算估算。'},{t:'第四步：人才策略制定',d:'基于前三步的分析结果，制定人才策略：招聘优先级、培训重点、薪酬调整方向、组织优化建议。AI生成策略草案，管理团队讨论确认。'}],
      cases:[{s:'场景：公司最近连续有骨干员工离职，管理层需要了解原因',sol:'将离职员工的访谈记录和在职员工的敬业度数据交给AI分析。AI识别出3个共性原因：1)晋升通道不清晰（70%的离职者提到）；2)薪酬低于市场水平（集中在工作3-5年的员工）；3)部分团队管理风格问题。HR基于此提出：建立职级体系、调整薪酬对标、对管理问题团队做管理辅导。'}],
      tools:[{n:'北森/盖雅',d:'HR数据分析系统'},{n:'飞书人事',d:'员工数据管理'},{n:'ChatGPT/Claude',d:'数据分析报告生成'},{n:'Tableau/帆软',d:'HR数据可视化'}],
      tips:['人才分析要以"可行动的建议"为输出，不只是数据呈现','离职预测不是制造恐慌，是帮助提前干预保留关键人才','数据分析要保护员工隐私——脱敏后再给AI','人才需求规划要跟业务部门确认，不是HR闭门造车','定期（每季度）做人才健康度检查，而不是等出了问题才分析'],
      quizzes:[
        {triggerSlide:2, q:'AI人才数据分析最核心的步骤是？',opts:['只看离职率一个指标', '定义清晰的评估维度（离职风险/绩效趋势/能力缺口/人才密度）并持续跟踪', '分析完就结束', '只看历史数据不看趋势'],ans:1, explain:'没有清晰的分析维度，数据分析就无的放矢。应从离职风险、绩效趋势、能力缺口、人才密度等维度定义指标体系并持续跟踪。'},
        {triggerSlide:4, q:'离职预测模型最需要避免的陷阱是？',opts:['模型准确率不够高', '只看内部数据忽略外部因素（行业薪资变化/竞品挖角/市场机会）', '预测太频繁', '样本数据太多'],ans:1, explain:'离职预测不能只看内因（满意度/绩效/司龄），也要看外因（行业薪资涨幅/竞品招聘动向/人才市场需求）。内部数据告诉你谁不爽，外部数据告诉你有没有更好的去处。'}
      ],
       },
    hr4: { objectives:['学会用AI诊断员工的培训需求','掌握用AI设计个性化培训方案的方法','建立AI辅助的培训效果评估体系'],
      concepts:[{t:'AI时代的培训范式转换',c:'传统培训：一刀切——所有人都上同样的课，不管你需要不需要。AI培训：千人千面——先评估每个人的能力短板，再推送针对性的学习内容，学完后评估效果，根据效果调整下一步学习计划。这就是这套培训系统在做的事情。培训从"一次性的活动"变成"持续的学习旅程"。'},{t:'培训需求的多源诊断',c:'培训需求不是HR拍脑袋定的。好的需求诊断来源于多个渠道：能力测评（可以是AI测评）、绩效数据（哪些能力不足导致绩效差距）、业务需求（公司未来需要什么能力）、员工意愿（员工自己想学什么）。AI可以综合分析这些数据源，生成培训需求优先级排序。'}],
      steps:[{t:'第一步：多源需求收集',d:'收集三个维度的数据：组织层（公司战略和业务重点需要的能力）、岗位层（各岗位的能力模型和要求）、个人层（员工的测评结果和绩效数据）。AI综合分析。'},{t:'第二步：AI诊断和优先级排序',d:'让AI交叉分析三个维度的需求，生成培训需求矩阵。标注：哪些能力是"急需+影响大"（优先培训）、哪些是"重要但可缓"（纳入计划）、哪些是"个人兴趣"（可选学习）。'},{t:'第三步：AI个性化方案设计',d:'为每个员工或每个岗位群体设计个性化培训方案。包含：学习目标、推荐课程、学习方式（线上/线下/混合）、时间安排、实践任务、效果评估方式。'},{t:'第四步：培训效果追踪和优化',d:'培训后追踪效果：知识掌握度（测验）、行为改变度（上级反馈）、业务影响力（绩效变化）。AI分析效果数据，优化后续培训方案。'}],
      cases:[{s:'场景：公司要全员提升AI技能，但不同岗位需要不同的培训内容',sol:'用AI分析各岗位的AI应用场景→设计5套差异化培训方案。研发学AI编程、产品学AI需求分析、运营学AI内容创作、销售学AI客户洞察、HR学AI简历筛选。每套方案包含：岗位专属课程+通用AI素养课+实践任务。这套系统本身就是这个思路的实现。'}],
      tools:[{n:'企业微信/飞书学习平台',d:'培训管理和学习追踪'},{n:'ChatGPT/Claude',d:'培训方案设计'},{n:'LMS系统',d:'学习管理平台'},{n:'AI培训系统（本系统）',d:'能力测评+课程推荐+效果评估'}],
      tips:['培训需求诊断要基于数据而非感觉——测评比问卷靠谱','个性化培训不是给每个人完全不同——是给每类人群有针对性的内容','培训效果的评估要看到"行为改变"，不只是"考了多少分"','最好的培训是有即时实践机会的培训——学了马上用','让业务部门参与培训方案设计，确保贴近真实工作场景'],
      quizzes:[
        {triggerSlide:2, q:'AI培训需求诊断和传统方式的区别是？',opts:['没有区别', 'AI可以综合绩效数据+能力评估+业务需求多维度诊断，而非凭感觉或问卷', 'AI不需要数据', '传统方式更好'],ans:1, explain:'传统培训需求诊断依赖问卷和主管判断。AI可以综合绩效数据（哪里出问题）、能力评估（缺什么技能）、业务方向（未来需要什么），形成客观、多维度的诊断。'},
        {triggerSlide:4, q:'培训效果评估应该关注什么？',opts:['只看满意度评分', '柯氏四级：反应（满意度）+学习（知识掌握）+行为（实际应用）+结果（业务改善）', '只关注出勤率', '培训结束就不用评估了'],ans:1, explain:'完整的培训评估=四级：反应层（学员满不满意）、学习层（学到了没有）、行为层（工作中用了吗）、结果层（业务指标改善了吗）。多数企业只做到前两层。'}
      ],
       },
    hr5: { objectives:['学会用AI诊断组织的效率瓶颈','掌握AI组织优化建议的生成和应用方法','建立数据驱动的人力效能管理体系'],
      concepts:[{t:'组织效能的AI诊断框架',c:'组织效能=战略清晰度×流程效率×人才匹配度×文化协同度。AI可以帮助诊断每个维度：战略清晰度（员工是否知道公司方向和自己的贡献）、流程效率（跨部门协作的时间成本、决策速度）、人才匹配度（人岗匹配率、关键岗位胜任度）、文化协同度（员工敬业度、价值观一致性）。'},{t:'从诊断到行动的转化',c:'诊断不是目的，改进才是。AI的组织诊断报告最有价值的部分不是"发现了什么"，而是"针对每个发现，建议的改进措施是什么"。每条改进建议要有：责任人、时间表、预期效果、衡量标准。让诊断结果可执行。'},{t:'人力效能的衡量体系',c:'传统HR的衡量指标是人头数、费用率——输入指标。现代人力效能要衡量的是输出指标：人均产值、关键人才保留率、招聘质量（入职后绩效）、培训ROI。AI可以帮助建立这些指标的计算和追踪体系。'}],
      steps:[{t:'第一步：组织效能数据收集',d:'收集组织效能相关数据：组织架构和汇报关系、流程文档和审批时效、人岗匹配数据、敬业度调研结果、关键流程的效率数据。'},{t:'第二步：AI多维度诊断',d:'将数据输入AI，从多个维度诊断：组织架构是否合理（管理层级、汇报链、控制跨度）、流程效率（跨部门协作的摩擦点、决策瓶颈）、人才匹配（关键岗位人才充足率、人岗匹配度）、文化健康度。'},{t:'第三步：AI生成优化建议',d:'让AI基于诊断结果生成优化建议。每条建议按ROI排序：哪些优化投入小见效快、哪些需要长期投入。形成优化路线图。'},{t:'第四步：建立效能看板',d:'设计人力效能数据看板。核心指标：人均产出、招聘质量指数、关键人才留存率、培训效果转化率、组织健康度评分。定期更新和review。'}],
      cases:[{s:'场景：公司从50人增长到200人，组织效率明显下降了',sol:'用AI做组织诊断：1)组织架构——管理层级从3层变成5层，决策变慢。建议：扁平化，合并职能重叠的团队。2)流程——原来适合50人的审批流程没有更新，现在需要5个审批。建议：建立分级授权机制。3)文化——新老员工融合不好。建议：建立导师制和跨团队项目。'}],
      tools:[{n:'飞书/钉钉',d:'组织协作数据分析'},{n:'北森/PeopleSoft',d:'HR系统和组织数据'},{n:'ChatGPT/Claude',d:'组织诊断报告'},{n:'SurveyMonkey/问卷星',d:'敬业度和文化调研'}],
      tips:['组织诊断要匿名收集真实反馈，员工才敢说实话','优化建议要聚焦——一次解决1-2个核心问题，不要全面铺开','组织效能的改善需要时间——做好3-6个月的时间预期','每次组织变动后要追踪效果，形成闭环','组织效能不是HR一个人的事——需要CEO和管理团队深度参与'],
      quizzes:[
        {triggerSlide:2, q:'AI组织诊断应从哪里入手？',opts:['直接做组织架构调整', '从数据中发现效率瓶颈：跨部门协作周期/决策层级/信息流通速度/人才配置效率', '只看员工满意度', '模仿标杆企业'],ans:1, explain:'AI可以从多个维度做组织诊断：跨部门项目周期（协作效率）、审批节点数（决策效率）、会议时间占比（沟通成本）、人才-业务匹配度（配置效率）。数据比感觉更客观。'},
        {triggerSlide:4, q:'组织优化推进的正确节奏是？',opts:['一步到位全面改革', '先诊断→试点1-2个部门→验证效果→逐步推广→持续优化', '只做数据不动组织', '照搬标杆企业的组织架构'],ans:1, explain:'组织变革应该循序渐进：诊断（AI找问题）→试点（选1-2个部门小范围验证）→效果评估（数据说话）→推广（成功经验复制）→持续优化（建立定期诊断机制）。'}
      ],
       },

    fin1: { objectives:["掌握AI驱动的财务归因分析方法", "学会用AI编制年度预算", "能构建情景化现金流预测模型"],
      concepts:[
        {t:"AI财务归因分析的正确姿势",c:"财务归因分析最忌讳\"一次性要结论\"——数据维度一多，AI直接给结论容易瞎猜。正确姿势是分步走：先让AI做多维拆解（按产品线/渠道/月份），定位差异最大的维度；再缩小范围让AI深入这一维度的明细；最后才让AI结合业务背景输出归因结论。每步的输入输出都清晰，结论才可信。"},
        {t:"预算编制的Prompt链",c:"预算不是拍一个总数，而是\"收入预测→成本测算→三表汇总\"的链条。用Prompt链：先让「预算分析师」按销量×价格×渠道结构做收入预测；再让「成本工程师」按产量做料工费测算；最后让「财务BP」汇总三表并标注假设。每一步的产出作为下一步输入，预算假设全程可追溯。"},
        {t:"情景化预测：比单一数字有用100倍",c:"财务预测最怕\"给一个精确但肯定错的数字\"。好的做法是构建乐观/基准/悲观三档情景（如大客户流失、原料涨价、政策变化），每档给出关键假设和结果区间。AI擅长生成情景矩阵并标注敏感性变量——让管理层看到\"如果X发生会怎样\"，而不是\"我觉得是X\"。"},
      ],
      steps:[
        {t:"第一步：数据准备与口径统一",d:"整理收入/成本/费用明细，统一口径（期间、币种、组织范围）。给AI说明每个字段的含义。数据要脱敏：客户名、合同价等敏感字段打码。"},
        {t:"第二步：AI多维归因分析",d:"让AI按产品线/渠道/月份拆解核心指标（如毛利），定位波动最大的维度，再深入明细找根因。输出：拆解表+Top差异清单+归因结论。"},
        {t:"第三步：AI预算编制",d:"用Prompt链生成年度预算：收入预测（销量×价格×渠道）→成本测算（料工费）→三表汇总（利润表/现金流/资产负债）。标注所有预算假设。"},
        {t:"第四步：情景预测与敏感性分析",d:"构建乐观/基准/悲观三档情景，让AI测算各档下的现金流和利润区间，标注关键敏感性变量（如回款周期、原料价）。输出资金缺口预警和应对建议。"},

        {s:"场景：CFO发现本季度毛利率下滑2.3%，要求你归因",sol:"你把三类数据交给AI：先让AI按产品线拆解，发现A产品线毛利下滑4.5%；再深入A产品线按月份拆解，发现6月下滑最严重；结合成本明细，AI定位到6月铝材采购价上涨12%（成本端），且A产品线7月刚做过一轮促销折价（售价端）。结论：成本上涨+主动促销双重影响，非结构性问题。CFO据此决定：对A产品线提价3%+锁价采购6个月。"},

    fin2: { objectives:["掌握AI自动对账的方法", "学会用AI生成报表自动化脚本", "理解RPA+AI财务自动化架构"],
      concepts:[
        {t:"AI对账：从\"人工匹配\"到\"差异分类\"",c:"对账的本质不是匹配（机器天生擅长），而是\"差异分类和处理\"。AI对账的正确用法：自动按金额+日期+摘要做匹配，然后对未匹配项分类——时间差（在途）、金额差异（手续费/汇率）、漏记错记（真异常）。让AI把5000行流水整理成\"匹配成功/待确认/异常\"三类，人工只处理真正异常的几十条。"},
        {t:"RPA+AI：财务自动化的黄金组合",c:"RPA负责\"取数和填表\"（抓取各系统数据、填模板），AI负责\"理解和判断\"（识别表结构差异、字段映射、勾稽校验）。RPA解决\"手\"，AI解决\"脑\"。组合起来：RPA定时抓子公司报表→AI识别格式差异并统一字段→RPA填集团模板→AI校验勾稽关系→异常标记通知财务复核。"},

      steps:[

        {t:"第二步：报表自动化脚本生成",d:"描述报表模板和数据结构，让AI生成Python/Excel VBA脚本：读取导出文件→清洗→计算→按模板格式输出。加入数据校验逻辑（合计一致性/空值/异常值）。"},

    fin3: { objectives:["掌握AI财报摘要的\"结论先行\"方法", "学会用AI撰写经营分析报告", "能构建路演财务问答库"],
      concepts:[
        {t:"财报摘要：先问对问题，再写答案",c:"管理层要的不是60页数据的浓缩，而是\"我该关注什么\"。正确做法：先让AI站在管理层视角列出\"这季度最该关注的5个问题\"（增长质量？现金流？毛利率？回款？），再针对每个问题给出数据和结论。结构上\"结论先行\"：亮眼表现→风险点→行动建议。"},
        {t:"经营分析报告的\"框架化写作\"",c:"好报告的骨架是固定的：概览→分业务线表现→成本与效率→现金流→风险→明年规划。用AI逐节填充，每个结论附数据支撑（\"收入增长15%，主要由B2C渠道贡献\"），再让AI检查数据一致性和逻辑自洽。报告的价值是\"每个结论都能被追问到底\"。"},
        {t:"路演问答库：AI模拟最苛刻的投资者",c:"准备路演不是把财报读一遍，而是预演投资者会怎么刁难你。用AI生成可能的问题库（利润下滑/现金流/应收/商誉/关联交易），对每个问题生成应答要点（事实+口径+引导），最后让AI扮演\"苛刻投资者\"反向挑战你的回答——比请朋友帮忙演练高效得多。"},
      ],
      steps:[
        {t:"第一步：数据提炼",d:"整理关键财务数据：收入/毛利/净利/现金流/关键比率/分业务线数据。明确期间口径。"},
        {t:"第二步：AI生成管理层视角问题",d:"让AI站在管理层角度列出本季度最该关注的5个问题，并给出每个问题对应的数据切片。人工调整问题优先级。"},
        {t:"第三步：AI撰写报告初稿",d:"按框架逐节生成：概览→分业务线→成本与效率→现金流→风险→规划。每节用\"结论+数据+图表建议\"结构。"},
        {t:"第四步：一致性校验与问答库",d:"让AI检查全文数据一致性和逻辑自洽，生成图表建议。再用AI构建路演问答库并模拟投资者反问，人工复核敏感口径。"},

    fin4: { objectives:["掌握AI税务风险扫描方法", "学会用AI解读新税收政策", "理解AI税务筹划的合规边界"],
      concepts:[
        {t:"税务风险扫描：发票→申报→优惠三维排查",c:"税务风险集中在三个环节：发票端（虚开/失控/进项异常）、申报端（数据不一致/漏报/错用税率）、优惠端（资格不符仍适用/资料不全）。AI可以按这三个维度做结构化扫描：发票异常检测（供应商集中/金额整百/开票频率异常）、申报表勾稽校验、优惠政策适用资格核对。"},
        {t:"新政策解读三步法",c:"政策解读最怕\"看了等于没看\"。三步法：1)让AI梳理政策的适用范围、生效时间、核心义务、违规后果（结构化摘要）；2)让AI对照公司业务逐条检查\"这条对我们适用吗？影响什么？\"；3)让AI输出待办清单（要改什么流程/要补什么资料/要关注什么时间点）。"},
        {t:"AI税务筹划的边界",c:"AI可以做：税收优惠适用分析（哪条政策我们符合）、业务模式税务影响测算（不同定价/架构的税负对比）、申报数据准确性检查。AI不能做：替你做\"激进避税\"方案——那不是筹划是风险。任何筹划建议必须标注法律依据和不确定性，重大事项咨询税务师。"},

        {t:"第二步：新政策解读",d:"上传最新税收政策文件，用三步法：结构化摘要（适用范围/义务/后果）→业务对照（适用点/影响）→待办清单（流程/资料/时间点）。"},
        {t:"第三步：合规筹划建议",d:"描述业务模式（销售/采购/跨境/用工结构），让AI在合规前提下给出税务优化方向（优惠适用/结构测算），每条标注法律依据和风险。"},
        {t:"第四步：人工复核与落地",d:"财务+税务师复核AI建议的条款引用和适用性，确认后落地。建立税务风险定期扫描机制（每季度）。"},

    fin5: { objectives:["掌握AI费用异常多维分析方法", "学会AI辅助审计抽样", "理解AI内控流程诊断"],
      concepts:[

      concepts:[
        {t:"采购数据安全：底价就是谈判筹码",c:"采购数据中历史底价、供应商折扣、成本构成是最敏感的信息——泄露直接损害谈判地位。安全基线：敏感数据分级（底价/折扣=最高级）、工具政策核查（数据是否用于训练/是否出境）、脱敏处理（底价打码/供应商匿名化）、权限最小化（仅相关采购员可见）。供应商提供的\"分析工具\"链接，一律拒绝——可能是数据采集陷阱。"},
        {t:"AI嵌入采购审批：人审异常，机审常规",c:"审批流程优化的方向不是\"取消审批\"，而是\"让AI处理80%常规件，人聚焦20%异常件\"。AI预审做三件事：完整性检查（规格/预算/比价依据是否齐全）、合理性检查（预算是否充足、是否重复采购、与历史价格比是否合理）、风险标记（新供应商/超预算/紧急采购）。预审通过自动流转，异常件转人工。"},
        {t:"采购舞弊的异常信号",c:"采购舞弊（回扣/关联交易/虚报）通常在数据上留痕：供应商集中度异常（某供应商占比骤升）、价格偏离（明显高于市场）、供应商与员工关联（同地址/同联系人/新注册）、审批绕过（频繁紧急采购规避比价）、质量容忍（不良率高的供应商仍在用）。AI用这些信号做组合检测，比单看一个指标有效得多。"},
      ],
      steps:[
        {t:"第一步：数据安全基线",d:"盘点采购敏感数据（底价/折扣/成本/供应商信息），建立分级和脱敏规则。核查所用AI工具的数据政策。"},
        {t:"第二步：AI审批流程设计",d:"设计AI预审规则：完整性（规格/预算/比价）、合理性（预算/重复采购/价格参照）、风险标记（新供应商/超预算/紧急）。常规件自动过，异常件转人工。"},
        {t:"第三步：舞弊异常检测",d:"让AI分析采购数据中的组合信号：供应商集中度/价格偏离/关联关系/紧急采购频率/质量容忍。输出异常案例清单供审计。"},
        {t:"第四步：制度与留痕",d:"完善采购制度（供应商准入/价格审批/关联交易申报），所有AI检测和审批过程留痕，定期审计。"},
      ],
      cases:[
        {s:"场景：供应商给采购员发来一个\"智能比价工具\"链接",sol:"采购员准备试试，你立即阻止：这个工具可能通过\"帮你比价\"采集你输入的底价和供应商数据回传，也可能植入恶意程序。正确做法：礼貌拒绝（\"我们使用公司批准的采购系统\"），用公司SRM+AI完成比价。同时把这个案例加入采购安全培训，提醒全员：供应商提供的工具/链接一律不用。"},
      ],
      tools:[
        {n:"企业版AI",d:"私有化数据安全分析"},
        {n:"审批系统（OA/SRM）",d:"AI预审嵌入"},
        {n:"数据分析工具",d:"舞弊信号检测"},
        {n:"企查查/天眼查",d:"供应商关联关系核查"},
      ],
      tips:["底价和折扣是最高级敏感数据", "供应商给的\"工具\"一律拒绝", "审批让AI审常规、人审异常", "舞弊检测要用组合信号而非单一指标", "所有流程留痕，审计可追溯"],
      quizzes:[
        {'triggerSlide':2, q:"收到供应商发来的\"比价工具\"链接，正确做法是？",'opts':["试试看挺好用", "礼貌拒绝，用公司批准的采购工具", "只输入非敏感报价", "用后删除记录"],'ans':1, 'explain':"供应商提供的工具可能采集你的底价数据回传或植入恶意程序。采购数据是谈判筹码，不能冒这个险。"},
        {'triggerSlide':4, q:"采购舞弊检测更有效的方式是？",'opts':["单看供应商数量", "组合信号：供应商集中度+价格偏离+员工关联+紧急采购频率+质量容忍", "只查大额采购", "等审计发现"],'ans':1, 'explain':"单一指标容易被绕过，组合信号（集中度+价格偏离+关联关系+紧急采购+质量容忍）才能识别舞弊模式。"},
      ],
       },

    po5: { objectives:["掌握AI需求预测建模方法", "学会供应商协同平台设计", "理解供应链韧性体系构建"],
      concepts:[
        {t:"需求预测：从\"拍脑袋\"到\"区间预测\"",c:"需求预测的目的不是算准一个数，而是给出\"合理区间+关键假设\"。方法：整合历史用量（趋势/季节）+BOM反向推算（销售预测×单耗）+安全库存与交期调整（净需求）+情景模拟（销售±10%/供应中断）。AI输出分物料预测区间，与业务对表校准。区间预测让备货决策有依据，也防\"过度备货\"。"},
        {t:"供应商协同平台：线上化→自动化→智能化",c:"协同平台的落地路径：1)线上化——供应商在线注册/接单/报交期/对账（替代邮件）；2)自动化——订单自动推送、交期异常自动预警；3)智能化——AI分析交期达成率、库存水位建议、产能预警。关键：先让核心供应商用起来，数据质量是智能化的前提。"},
        {t:"供应链韧性：四层防护体系",c:"韧性不是\"多备点货\"。四层体系：可视化（AI整合供应商-产能-库存-物流数据，实时掌握风险敞口）、预警（地缘/天气/供应商经营风险自动监控）、替代（多源替代方案：备选供应商/替代料/安全库存策略）、演练（AI模拟断供30/60/90天，评估影响并制定预案）。韧性的本质是\"知道风险在哪+有备用方案\"。"},
      ],
      steps:[
        {t:"第一步：数据整合",d:"整合历史采购数据（按物料/月份/产线）+销售预测+BOM单耗+安全库存/交期参数。"},
        {t:"第二步：AI需求预测",d:"AI建模：趋势+季节→BOM推算→净需求（含安全库存）→情景模拟。输出分物料预测区间+关键假设。与业务对表校准。"},
        {t:"第三步：协同平台设计",d:"设计供应商在线协同流程：接单→报交期→对账线上化，订单自动推送+交期异常预警。先推核心供应商。"},
        {t:"第四步：韧性体系构建",d:"建立四层韧性：可视化（风险敞口）→预警（经营/地缘/天气）→替代（多源方案）→演练（断供情景模拟）。输出应急预案。"},
      ],
      cases:[
        {s:"场景：地缘冲突导致某关键芯片交期从8周拉到30周",sol:"你有韧性体系：可视化层——AI盘点该芯片的供应商、库存、在途和下游消耗速度，算出\"现有库存还能撑10周\"；替代层——备选方案有两个：同规格替代料（需3周验证）和方案设计变更（需6周）；决策：立即启动替代料验证，同时向原供应商加急锁定未来6个月产能。AI模拟断供30周情景：验证期内不会停产。实际在11周时切换完成，无缝衔接。"},
      ],
      tools:[
        {n:"SRM/ERP",d:"采购与库存数据"},
        {n:"AI预测工具",d:"需求预测建模"},
        {n:"供应商协同平台",d:"在线协同与预警"},
        {n:"风险数据源（地缘/天气）",d:"供应风险监控"},
      ],
      tips:["预测给区间不给单点数字", "协同平台先让核心供应商用起来", "韧性=可视化+预警+替代+演练", "安全库存要按物料重要性和交期差异化设置", "断供演练每年至少一次"],
      quizzes:[
        {'triggerSlide':2, q:"AI需求预测更实用的输出是？",'opts':["一个精确数字", "分物料预测区间+关键假设+情景模拟", "上个月用量加5%", "只预测总金额"],'ans':1, 'explain':"需求预测=用量规律+BOM推算+安全库存+情景模拟。区间+假设让备货有依据，也防止过度备货。"},
        {'triggerSlide':4, q:"供应链韧性的核心是？",'opts':["多备库存", "可视化+预警+多源替代+断供演练四层体系", "多找几个供应商", "买供应链保险"],'ans':1, 'explain':"韧性=知道风险在哪（可视化预警）+有备用方案（多源替代）+验证过（断供演练）。多备货只是最粗放的应对。"},
      ],
       },

    legal1: { objectives:["掌握AI合同风险扫描方法", "学会批量存量合同检查", "能构建标准合同库"],
      concepts:[
        {t:"合同审查：先定\"风险清单\"，再让AI扫",c:"AI审查合同的前提是你有一份\"对己方不利条款清单\"：违约责任（违约金过高/无限责任）、付款条款（付款前置/无验收）、知识产权（归属不明/许可过宽）、终止条款（单方终止权/自动续期）、争议解决（管辖不利/适用法律）、保密条款（范围过宽/期限过长）。让AI逐项扫描，输出：条款位置+风险等级+修改建议（提供备选条款文本）。AI定位风险，律师决策。"},
        {t:"存量合同批量扫描",c:"存量合同（几百上千份）是风险洼地：历史模板不统一、条款随版本漂移。AI批量处理：OCR解析（扫描件）→结构化提取（要素/条款）→规则库扫描（风险模式）→输出风险清单（合同编号+条款位置+等级+建议）。人工抽检校准，按优先级处理高风险合同。"},
        {t:"标准合同库：法务提效的核心资产",c:"标准合同库=场景盘点（销售/采购/合作/保密/用工）→模板起草（含可配置条款：付款/交付/违约分级）→使用说明（什么场景用哪个模板/哪些可谈/底线条款）→律师审核定稿。业务自助调用，法务聚焦非标合同。模板库每年根据纠纷数据和法规变化更新。"},
      ],
      steps:[
        {t:"第一步：建立风险清单",d:"按合同类型（销售/采购/合作）整理\"对己方不利条款清单\"：违约/付款/知产/终止/争议/保密。明确每类的风险等级。"},
        {t:"第二步：AI单份合同审查",d:"上传合同，AI提取要素（当事人/标的/金额/付款/违约/争议）并按风险清单逐项扫描，输出：位置+等级+修改建议（含备选条款）。人工复核。"},
        {t:"第三步：存量批量扫描",d:"AI批量解析存量合同（OCR+结构化），按规则库扫描风险模式（知产归属/违约上限/自动续期/管辖），输出风险清单+优先级。人工抽检。"},
        {t:"第四步：标准合同库建设",d:"盘点高频交易场景，AI起草标准模板（含可配置条款+使用说明），律师审核定稿发布。业务自助调用，定期更新。"},
      ],
      cases:[
        {s:"场景：尽调发现公司有5000份存量合同，担心条款风险",sol:"你用AI批量扫描：OCR解析5000份合同→提取要素→按风险规则库扫描（知产归属、违约上限、自动续期、争议管辖）。一周内输出风险清单：238份合同有知产归属模糊条款、45份自动续期未设提醒、12份违约金比例异常。人工抽检100份确认准确率后，按风险等级处理：先修订Top50高风险合同，其余纳入到期续签时一并整改。"},
      ],
      tools:[
        {n:"合同AI平台",d:"合同审查与风险扫描"},
        {n:"OCR工具",d:"扫描件文本化"},
        {n:"ChatGPT/Claude",d:"条款分析与修改建议"},
        {n:"合同管理系统",d:"模板库与归档"},
      ],
      tips:["先定风险清单再让AI扫，否则AI不知道该看什么", "AI输出必须有条款位置，可回溯", "批量扫描后人工抽检校准", "标准合同库要配使用说明，否则业务不会用", "模板库每年根据纠纷数据更新"],
      quizzes:[
        {'triggerSlide':2, q:"AI合同审查的前提是？",'opts':["直接让AI判断合同能不能签", "先建立\"对己方不利条款清单\"再逐项扫描", "只看金额和付款条款", "让AI直接改合同"],'ans':1, 'explain':"AI审查=风险清单逐项扫描（违约/付款/知产/终止/争议/保密），输出位置+等级+修改建议。没有清单AI不知道该看什么。"},
        {'triggerSlide':4, q:"存量合同批量扫描的正确流程是？",'opts':["人工一份份翻", "AI批量解析→规则库扫描→风险清单+优先级→人工抽检", "只扫新合同", "抽几份看看"],'ans':1, 'explain':"批量扫描=OCR解析→结构化提取→风险规则扫描→输出清单（编号+位置+等级+建议），人工抽检校准后按优先级处理。"},
      ],
       },

    legal2: { objectives:["掌握AI法规解析三步法", "学会业务合规映射", "能生成整改方案与优先级"],
      concepts:[
        {t:"法规解析三步法：摘要→对照→待办",c:"读法规最怕\"看了等于没看\"。三步法：1)让AI结构化摘要——适用范围、生效时间、核心义务、违规后果、监管机构；2)让AI对照公司业务——\"这条对我们适用吗？我们哪些业务会受影响？\"；3)让AI输出待办清单——要改什么流程、补什么资料、关注什么时间点。每步人工核对法条原文引用，防AI幻觉。"},
        {t:"业务合规映射：把义务翻译成动作",c:"法规说的是义务，公司要做的是动作。映射示例：数据出境新规→\"个人信息出境前需安全评估\"→翻译成动作：梳理出境数据清单→评估是否触发安全评估→补签标准合同→向网信办备案。AI帮你把\"法规义务\"逐条翻译成\"业务动作+责任人+时限\"，形成合规差距清单。"},
        {t:"整改方案：按风险和成本排优先级",c:"合规差距不可能一次整改完，要排序：风险高+整改成本低的先做（如补签合同）；风险高+成本高的做计划（如系统改造）；风险低的按年度计划。AI生成整改方案时给出每项的\"风险等级×整改成本\"矩阵，法务据此排优先级和资源。"},
      ],
      steps:[
        {t:"第一步：AI法规摘要",d:"上传法规原文，AI梳理：适用范围/生效时间/核心义务/违规后果/监管机构。核对法条引用。"},
        {t:"第二步：业务对照",d:"描述公司相关业务流程（数据收集/存储/跨境/第三方共享），AI对照义务清单逐条检查\"是否适用/是否合规\"。"},
        {t:"第三步：差距清单",d:"AI输出合规差距清单：每条=法规义务+现状+差距+整改动作+责任人+时限。"},
        {t:"第四步：整改优先级",d:"AI按\"风险等级×整改成本\"矩阵排序，输出分阶段整改计划。法务确认后推动执行并跟踪。"},
      ],
      cases:[
        {s:"场景：《数据出境安全评估办法》生效，公司海外业务需评估",sol:"你用AI三步法：摘要——办法适用于向境外提供重要数据和个人信息的企业，需安全评估或标准合同备案；对照——公司有跨境员工数据（薪酬系统在境外服务器）和海外客户数据；差距清单——2项需评估、1项需补标准合同、1项需修改隐私政策。AI按风险×成本排序：先补标准合同（2周内），再启动安全评估（3个月计划）。执行后顺利过审。"},
      ],
      tools:[
        {n:"法规数据库（北大法宝/法规库）",d:"法条原文检索"},
        {n:"ChatGPT/Claude",d:"法规解析与业务对照"},
        {n:"企业版AI",d:"内部制度数据安全分析"},
        {n:"合规管理工具",d:"整改跟踪"},
      ],
      tips:["AI结论必须核对法条原文，防幻觉", "三步法：摘要→业务对照→待办清单", "整改按风险×成本排优先级", "把义务翻译成动作+责任人+时限", "合规差距清单要定期刷新"],
      quizzes:[
        {'triggerSlide':2, q:"法规解析三步法是什么？",'opts':["读一遍然后凭感觉", "结构化摘要（范围/义务/后果）→业务对照→待办清单", "让AI直接给结论", "只看新闻解读"],'ans':1, 'explain':"三步法：AI梳理适用范围/生效时间/核心义务/违规后果→对照公司业务找差距→输出待办清单（动作+责任人+时限）。"},
        {'triggerSlide':4, q:"合规整改的优先级应该按？",'opts':["领导关注度", "风险等级×整改成本矩阵", "先做容易的", "按法规章节顺序"],'ans':1, 'explain':"高风险的先做、成本低的先做。风险×成本矩阵让有限的合规资源用在刀刃上。"},
      ],
       },

    legal3: { objectives:["掌握合规风险量化评估方法", "学会AI治理框架设计", "能准备监管检查材料"],
      concepts:[
        {t:"合规风险量化：概率×影响",c:"合规风险不能只说\"有风险\"，要量化成\"发生概率×影响程度\"的风险矩阵。评估维度：法律义务（有哪些适用法规）、业务触点（公司业务哪里触发）、违规后果（罚款上限/业务禁令/声誉损失/负责人责任）、合规成本（系统改造/流程/本地顾问）。输出风险矩阵：红区（高概率高影响）优先治理，黄区计划治理，绿区持续监控。"},
        {t:"AI治理框架：让AI用得好也不出事",c:"公司用AI越多，越需要治理框架。五层：1)使用边界——哪些场景AI可参与（辅助建议）vs禁止（最终决策/对外承诺）；2)模型治理——AI建议可解释、可回测；3)数据治理——训练和使用数据合规；4)人工复核——高风险场景必须人确认；5)责任机制——AI建议出错的责任归属。落地为《公司AI使用规范》+敏感场景清单+培训。"},
        {t:"监管检查材料：口径一致是生命线",c:"监管检查最怕各部门口径不一致（\"你们数据存在哪\"\"谁负责安全评估\"答案五花八门）。准备方法：AI梳理检查要点（数据收集/存储/出境/用户权利/安全措施）→生成合规自述初稿（制度/执行/技术/整改）→AI预演检查官追问并生成应答要点→核对所有材料和证据一致性。统一口径+证据完整=从容应对。"},
      ],
      steps:[
        {t:"第一步：AI法律与业务盘点",d:"梳理适用法规（数据/劳动/税务/行业准入）和公司业务触点，AI逐项对照找适用点。"},
        {t:"第二步：风险量化矩阵",d:"AI评估每项风险的\"发生概率×影响\"（罚款/禁令/声誉/责任），输出红黄绿风险矩阵。"},
        {t:"第三步：AI治理框架",d:"设计五层AI治理：边界/模型/数据/复核/责任，落地为《公司AI使用规范》+敏感场景清单。"},
        {t:"第四步：监管检查准备",d:"AI生成合规自述初稿+追问预演+证据一致性核对，形成检查材料包。定期更新。"},
      ],
      cases:[
        {s:"场景：公司计划进入东南亚市场，需评估合规风险",sol:"你用AI评估：当地数据保护法（PDPA类）适用——公司要收集当地用户数据；劳动法——当地用工成本高；行业准入——需本地合作伙伴。AI量化：数据违规罚款上限为营业额2%（高影响）、本地用工合规成本中等、准入风险可通过合资解决。输出风险矩阵：数据合规为红区（先治理），用工为黄区（计划），准入为绿区（合资解决）。管理层据此决定：先完成数据合规改造再进入。"},

      quizzes:[

      concepts:[
        {t:"知产台账：从Excel到自动化",c:"传统知产台账靠手工登记，年费/续展/缴费容易遗漏——一个专利忘缴年费就失效。AI台账：批量解析登记（专利/商标/版权）→自动生成关键节点提醒（年费/续展/异议期限/诉讼时效）→风险标记（即将到期/被异议/被无效）。核心价值不是\"记下来\"，是\"不遗忘+预警\"。"},
        {t:"商标风险分析：注册前的必要功课",c:"商标注册前不做检索，可能\"注册即侵权\"或被驳回。AI分析：近似商标检索（相同/近似类别+近似名称）→在先权利评估（已注册/申请中/驰名商标）→注册成功率预判→规避建议（改名/换类别/共存协议）。注意：商标检索的近似判断有专业门槛，AI结论供参考，最终以商标局审查为准。"},
        {t:"维权工作流：时效是生命线",c:"知识产权维权（商标抢注/专利侵权/版权盗用）最怕错过期限：异议期3个月、无效宣告期5年、诉讼时效3年。AI工作流：监控（商标抢注/侵权线索自动监测）→评估（胜诉可能性：近似度/证据/在先权利）→文书生成（异议理由书/侵权警告函初稿）→时限管理（每个案件的关键期限自动提醒）。"},
      ],
      steps:[
        {t:"第一步：AI知产台账构建",d:"批量解析现有专利/商标/版权信息（申请号/权利日/缴费节点），AI生成结构化台账+到期提醒规则。"},
        {t:"第二步：商标风险分析",d:"拟注册商标提交AI：近似检索（类别+名称）→在先权利评估→注册成功率预判→规避建议。人工复核。"},
        {t:"第三步：侵权监控设计",d:"设计AI监控规则：商标抢注（新申请监测）、侵权线索（电商/市场监测）、版权盗用。触发阈值自动预警。"},
        {t:"第四步：维权工作流",d:"对每个维权案件：AI评估胜率→起草文书初稿→设置关键期限提醒（异议/无效/诉讼）→律师审核提交。"},
      ],
      cases:[
        {s:"场景：发现核心品牌商标在关联类别被抢注",sol:"你用AI快速响应：检索抢注商标的类别/状态/申请人→分析近似度和恶意证据（对方无实际使用、与我司商标高度近似、同一申请人多类抢注）→评估异议成功率（高）→AI起草异议理由书初稿（引证商标+在先使用证据+恶意抢注证据）→设置异议期限提醒（3个月内提交）。律师审核后按期提交，异议成功，商标局驳回抢注申请。"},

        {n:"知产管理系统",d:"台账与期限管理"},

      tips:["台账的价值是\"不遗忘+预警\"", "注册前必做商标检索，AI结论供参考", "维权时限是生命线，AI自动提醒", "异议文书先AI初稿再律师定稿", "监控规则要设阈值，避免信息过载"],
      quizzes:[

    legal5: { objectives:["掌握AI纠纷数据分析方法", "学会法务数据自动化", "能规划法务数字化路线"],
      concepts:[
        {t:"纠纷数据分析：从\"灭火\"到\"预防\"",c:"纠纷数据是法务的\"金矿\"：纠纷集中在哪些合同类型/条款/业务线？原因是什么？损失多少？AI分析路径：整合历史纠纷数据（类型/金额/原因/结果/损失）→多维度统计（按合同类型/条款/业务线/金额区间）→输出风险画像（\"销售合同付款条款引发60%纠纷\"）→推动整改（修订模板/强化审批/业务培训）。法务从\"事后灭火\"转向\"事前预防\"。"},
        {t:"法务数据自动化",c:"法务也有大量重复数据工作：周报统计（审批量/平均耗时/待办）、案件状态汇总、合规检查项跟踪。用AI：脚本自动汇总（从OA/Excel/案件系统）→生成法务周报（审批量/耗时/待办/风险件）→定时自动运行。从半天到10分钟。数据自动化的前提是数据在线（先用系统登记）。"},
        {t:"法务数字化三阶段",c:"法务数字化路线：1)线上化——合同/案件/知产台账线上管理（数据统一）；2)自动化——AI合同审查/风险扫描/到期提醒（事务自动化）；3)智能化——AI风险预警（舆情/诉讼/监管变化）+数据化决策支持。终极目标：法务BP嵌入业务（营销/采购/数据场景前置合规审查），从\"救火队\"变\"预防中心\"。"},
      ],
      steps:[
        {t:"第一步：纠纷数据整合",d:"整合历史纠纷数据（合同类型/金额/原因/结果/损失），统一字段口径，AI清洗分类。"},
        {t:"第二步：AI风险画像",d:"AI多维度统计（类型/条款/业务线/金额），输出风险画像（Top纠纷类型+共性原因+损失分布）+整改建议。"},
        {t:"第三步：法务数据自动化",d:"让AI生成脚本自动汇总合同审批/案件数据，生成法务周报模板，定时运行。"},
        {t:"第四步：数字化路线规划",d:"AI从线上化→自动化→智能化三阶段设计法务数字化路线图：现状盘点→优先级→投入估算→里程碑。"},
      ],
      cases:[
        {s:"场景：公司一年纠纷案件翻倍，管理层要求法务\"做点什么\"",sol:"你用AI做纠纷数据分析：按合同类型统计——销售合同占60%纠纷；按条款拆解——付款条款（逾期付款/付款条件模糊）占其中70%；按业务线——大客户事业部最集中。风险画像：销售合同的付款条款是纠纷最大来源。整改：1)修订销售合同付款条款模板（明确付款节点/验收标准/逾期利息）；2)对超信用额度的订单增加法务审批；3)业务培训。次年纠纷下降45%。"},
      ],
      tools:[

        {n:"ChatGPT/Claude",d:"数据分析与报告"},
        {n:"Python",d:"数据自动化脚本"},
        {n:"法务数字化平台",d:"合同/案件/知产一体化"},
      ],
      tips:["纠纷数据是金矿，先登记才能分析", "风险画像要落到整改动作", "周报自动化的前提是数据在线", "数字化分三阶段，别想一步到位", "终极目标是法务前置到业务决策前"],
      quizzes:[
        {'triggerSlide':2, q:"纠纷数据分析的最终目的是？",'opts':["统计纠纷数量", "识别风险画像（类型/条款/业务线）并推动整改预防", "让老板看报告", "追责业务部门"],'ans':1, 'explain':"纠纷分析=识别纠纷集中在哪些合同类型/条款/业务线→输出风险画像→推动模板修订/审批强化/培训。从灭火转向预防。"},
        {'triggerSlide':4, q:"法务数字化三阶段是？",'opts':["买系统→培训→上线", "线上化（数据统一）→自动化（AI事务处理）→智能化（风险预警+决策支持）", "先智能化再线上化", "外包给律所"],'ans':1, 'explain':"线上化让数据在线，自动化让AI处理重复事务，智能化让AI做风险预警和决策支持。循序渐进，数据是地基。"},

    // === AI 工具使用指南系列（v37） ===
    tool1: { objectives:['掌握Cursor三大交互模式：Tab补全、Chat对话、Composer多文件编辑','学会用代码库上下文与规则文件让AI理解你的项目规范','建立"AI优先"的开发工作流，把重复编码时间降低一半以上'],
      concepts:[{t:'AI优先编辑器与普通IDE的区别',c:'传统方式是"IDE+AI插件"——AI只是外挂，对项目一无所知。Cursor是AI优先（AI-first）的编辑器：代码库整个被索引进上下文，AI"看过"你的全部代码。这带来质变：它生成的代码会用你项目里已有的工具函数、遵循你的目录结构、引用你已有的类型定义，而不是"凭空想象"一个通用版本。选择Cursor的本质，是把AI从"问答工具"升级为"了解项目背景的结对程序员"。'},{t:'代码库上下文：Cursor效率的关键',c:'Cursor提供三种给AI喂上下文的方式：@文件/@目录（精确引用）、@Codebase（全库语义检索）、Chat自动关联当前打开的文件。上下文给得越准，生成质量越高。经验法则：小任务让AI自动关联即可；跨模块任务手动@相关文件；"找不到某功能在哪实现"的任务用@Codebase。很多抱怨"AI生成不准"的用户，问题都出在没给对上下文，而不是模型不行。'},{t:'Composer：从单文件到多文件',c:'普通Chat只改一个文件，Composer（Agent模式）可以一次跨多个文件工作：新建模块、同步修改调用方、更新相关测试。这是"从补全到架构"的跃迁——你可以用一句"把配置硬编码抽成独立模块并更新所有引用"完成过去半小时的手工重构。使用原则：任务边界要清晰、涉及文件要@明确、生成后逐文件review再接受。'}],
      steps:[{t:'第一步：安装与基础配置',d:'从cursor.com下载安装（支持导入VS Code的插件、主题和快捷键）。登录后选择模型。先做两件事：1)打开设置确认Tab补全已启用；2)在设置里关联常用项目目录，让代码库索引生效。前几次使用建议先用小项目练手，熟悉节奏后再用于正式工程。'},{t:'第二步：用Chat做对话式开发',d:'打开Chat（Ctrl+L），用自然语言描述需求："给这个模块加一个重试装饰器，最多3次，指数退避"。先让AI给方案再让它写代码；对生成的代码用"解释这段逻辑"验证理解；不满意时用"参考@utils/retry.ts的写法重写"定向修正。记住：Chat是讨论区，不是许愿池——一次只提一个明确任务。'},{t:'第三步：用Composer做多文件任务',d:'面对跨文件任务时切换到Composer（Ctrl+I）：@相关的2-3个文件，描述变更目标和边界（"只改数据层，不动接口签名"）。生成后Cursor会展示每个文件的diff，逐个review、可编辑再接受。养成习惯：大重构拆成多轮Composer，每轮一个关注点，出问题容易回滚。'},{t:'第四步：沉淀规则文件',d:'在项目根目录创建 .cursorrules 文件（或新版rules目录），写清：技术栈与版本、目录结构约定、命名规范、禁止事项（如"不要引入新依赖"）。规则文件对每次生成自动生效，相当于给AI一份"团队新人手册"。规则随项目演进持续维护，这是团队级提效的关键。'}],
      cases:[{s:'场景：团队新人接手一个10万行的遗留项目，不知道从哪里下手',sol:'用Cursor的@Codebase提问："用户登录鉴权流程涉及哪些文件？入口在哪？"AI检索出完整调用链并给出解释。新人再用Chat逐个模块请AI"解释这段代码的职责和潜在坑"，一天内建立了对项目的整体认知——过去这个熟悉过程通常需要一到两周。'},{s:'场景：要把项目里的硬编码文案全部抽成多语言资源文件',sol:'用Composer下达任务："扫描所有组件中的中文字符串，抽取到src/locales/zh.ts，用key引用替换，保持功能不变"。Composer分批完成40多个文件的替换，人工只需review其中5个有动态拼接的边界情况。手工完成同样的工作估计需要2天。'}],
      tools:[{n:'Cursor（本体）',d:'AI优先编辑器：Tab补全/Chat/Composer三模式'},{n:'.cursorrules',d:'项目规则文件，团队规范自动生效'},{n:'Cursor Tab',d:'行级/块级预测补全，写代码的主要提速来源'},{n:'@Codebase检索',d:'全库语义搜索，快速定位陌生代码'}],
      tips:['先给上下文再提要求：@文件/@目录比长篇文字描述更有效','Chat一次一个任务，Composer一次一个边界清晰的重构','生成代码必须review：重点看边界条件、错误处理和安全隐患','把团队规范写进.cursorrules，新人第一天就按规范生成代码','不要让AI直接改生产分支，diff确认后再合并','每月回顾一次自己的高频任务，把它们固化成提示词模板或规则'],
      quizzes:[
        {triggerSlide:2, q:'Cursor等AI优先编辑器相对"IDE+AI插件"的核心优势是？',opts:['界面更漂亮', '整个代码库被索引进上下文，AI了解项目背景后生成贴合项目的代码', '完全不需要人工审查', '价格更便宜'],ans:1, explain:'AI优先编辑器把代码库索引进上下文：生成的代码会用项目已有的工具函数、遵循目录结构、引用已有类型定义。AI从"通用问答工具"升级为"了解项目背景的结对程序员"。'},
        {triggerSlide:4, q:'用Composer完成多文件重构后，正确的做法是？',opts:['直接全部接受，AI很可靠', '逐文件review每个diff，确认无误再接受', '只看第一个文件', '先部署到生产环境测试'],ans:1, explain:'Composer会展示每个文件的diff，应逐个review、必要时修改后再接受。尤其关注接口签名变化、调用方遗漏和测试是否同步更新。大重构拆成多轮，出问题容易回滚。'}
      ],
       },
    tool2: { objectives:['掌握Claude长文档分析与结构化输出的核心方法','学会用Artifacts把对话产出变成可用的交付物','建立岗位专属的提示词模板库，让高频文书工作提效一半'],
      concepts:[{t:'长上下文：把"喂文档"变成生产力',c:'Claude的长上下文窗口可以一次处理数十页文档——这是多数人没用好的能力。正确姿势不是"帮我看看这个文档"，而是结构化任务："这是产品方案，请输出：1)一句话摘要 2)按章节的要点大纲 3)逻辑矛盾或缺失项 4)对目标读者的3条改进建议"。结构化的指令让AI输出直接可用，而不是让人再加工一遍。适用场景：标书分析、制度解读、竞品资料、会议记录、行业报告。'},{t:'Artifacts：从对话到交付物',c:'普通AI对话的产出是"聊天记录里的一段文字"，复制出来还要排版。Artifacts把产出变成独立的工作面板：代码可以直接预览运行、HTML页面可以交互演示、长文档可以独立编辑和迭代。工作方式从"聊天"变成"共同编辑一份文档"。对职场用户的价值：给老板演示一个交互原型，不需要写一行代码，让Claude生成一个可点击的HTML页面即可。'},{t:'提示词模板：把偶然变必然',c:'同样让AI写周报，有人得到模板化套话，有人得到结构清晰的干货——差别在提示词。结构化提示词五要素：角色（你是一位向CTO汇报的项目经理）、任务（写本周项目周报）、背景（本周完成了X、延期了Y）、格式（分进展/风险/下周计划三段）、约束（每段不超过3条、用数据说话）。把这五要素固化成岗位模板，每次只替换背景信息——这就是从"会用AI"到"用好AI"的分水岭。'}],
      steps:[{t:'第一步：账号准备与基础设置',d:'注册并登录Claude（claude.ai）。了解版本差异：免费版适合日常问答，Pro版解锁更强的模型与Artifacts高频使用。职场用户建议先用免费版跑通工作流，确认价值后再升级。'},{t:'第二步：长文档结构化分析',d:'把目标文档（PDF/Word文本）粘贴或上传到对话框，用结构化指令驱动："请分析这份文档，输出：1)核心结论（100字内）2)分章节要点 3)数据与论据的薄弱点 4)3条可执行的改进建议"。对比"帮我总结一下"的效果差异，体会指令结构的价值。'},{t:'第三步：用Artifacts产出交付物',d:'尝试让Claude创建一个Artifact："把刚才的分析做成一页HTML对比表"或"生成一个带筛选功能的周报模板页面"。在右侧面板直接查看、继续对话迭代（"把风险列标红""加一个汇总行"）。满意后导出或分享链接。'},{t:'第四步：沉淀岗位提示词模板库',d:'盘点你岗位上最高频的5项文书工作（周报/邮件/方案/纪要/通知），为每项写一个五要素模板（角色+任务+背景+格式+约束），存到笔记工具里。每次使用只更新"背景"段。一个月后你会拥有一个越用越顺手的个人AI资产库。'}],
      cases:[{s:'场景：产品经理要在2小时内消化一份60页的竞品白皮书并给管理层提结论',sol:'上传白皮书后用结构化指令让Claude输出：核心战略摘要、分章节要点、对标我方产品的差异点、3条应对建议。20分钟拿到初稿，人工用行业判断修正两处后成稿。过去同样的工作需要一个下午，且容易遗漏细节。'},{s:'场景：HR要为一次跨部门协调会写会议通知与议程',sol:'用提示词模板（角色：资深HRBP；任务：写会议通知+议程；背景：议题与参会方；格式：邮件正文+附件议程；约束：正文200字内、议程含时间分配），一次生成可用版本。之后每次只替换背景信息，2分钟完成同类工作。'}],
      tools:[{n:'Claude（claude.ai）',d:'对话式AI助手，长文档分析与结构化输出'},{n:'Artifacts',d:'交互式产出面板：代码预览/HTML演示/文档编辑'},{n:'Projects',d:'项目空间：上传资料库，对话自动关联背景'},{n:'个人提示词库',d:'Notion/备忘录存放岗位模板，随用随取'}],
      tips:['给AI的指令要结构化：摘要+大纲+问题+建议，比"帮我看看"有效十倍','长文档分析先跑通工作流，再考虑是否需要付费版','Artifacts适合做原型演示：不写代码也能给老板看交互效果','五要素提示词模板（角色/任务/背景/格式/约束）是文书提效的核心','敏感信息脱敏后再上传：删去客户名、金额、个人数据','让AI批判你的文档（找矛盾/缺数据）往往比让它夸你更有价值'],
      quizzes:[
        {triggerSlide:2, q:'让Claude分析长文档时，最有效的指令方式是？',opts:['"帮我看看这个文档"', '结构化任务：摘要+分章要点+薄弱点+改进建议', '一次问一百个问题', '只发文档不给任何指令'],ans:1, explain:'结构化指令（1.一句话摘要 2.分章节要点 3.逻辑矛盾或缺失项 4.改进建议）让AI输出直接可用。模糊的"帮我看看"只会得到泛泛而谈的总结，人还要再加工一遍。'},
        {triggerSlide:4, q:'结构化提示词的五个核心要素是？',opts:['表情符号、语气词、长度、emoji、感叹号', '角色+任务+背景+格式+约束', '只要把话说长', '角色+金额+日期+颜色+字体'],ans:1, explain:'五要素：角色（你是谁）、任务（要做什么）、背景（相关上下文）、格式（输出长什么样）、约束（不能超什么边界）。把这五要素固化成岗位模板，每次只替换背景——高频文书工作即可批量提效。'}
      ],
       },
    tool3: { objectives:['掌握Notion AI的三大高频场景：纪要整理、要点提炼、知识库生成','学会"大纲先行"的AI写作法，避免一次性生成的平庸产出','搭建团队知识库模板，让信息沉淀从个人习惯变成组织资产'],
      concepts:[{t:'知识库+AI：从"存起来"到"问出来"',c:'多数团队的知识管理死于检索：文档存了很多，但没人翻。Notion AI改变了使用方式——你不需要记住文档在哪，直接问："我们的报销流程是怎么规定的？"AI从知识库中检索并汇总答案。这让知识库的价值从"存档"变成"提问入口"。落地要点：知识库结构要清晰（分类+标题规范），AI检索才准；重要结论要写进页面而不是留在聊天记录里。'},{t:'大纲先行：AI写作的正确姿势',c:'让AI"直接写一篇周报"会得到四平八稳的套话。正确姿势是两步走：第一步让AI只生成大纲（"为项目复盘文档列一个大纲，含背景/进展/问题/下一步"）；人工调整大纲结构后，第二步让AI按定稿大纲逐节扩写。大纲是"结构决策"——必须人来把控；扩写是"体力活"——交给AI。先骨架后血肉，产出质量立刻上一个台阶。'},{t:'会议纪要自动化：会后10分钟出稿',c:'会议纪要是AI性价比最高的场景之一。三个关键动作：1)会上用录音转文字（或让成员速记要点）；2)会后将原始记录贴进Notion，用AI按"决议/行动项/负责人/截止时间/待确认"五栏结构化；3)人工核对行动项与负责人——AI偶尔会把"建议"误判为"决议"。10分钟完成过去40分钟的工作，而且格式统一、便于追踪。'}],
      steps:[{t:'第一步：环境准备',d:'注册Notion并创建工作空间。AI功能在付费计划中，团队建议先用1-2个账号试点跑通场景（纪要/周报/知识库），算清节省的时间后再决定团队采购。创建一个"AI工作台"页面，集中放置高频模板。'},{t:'第二步：AI整理会议纪要',d:'会后将原始记录（转写文本或速记）粘贴到页面，选中后点"Ask AI"，输入指令："将以上会议记录整理为结构化纪要，分五栏：决议、行动项（含负责人和截止时间）、分歧点、待确认问题、下次会议议程"。核对行动项后@相关成员，纪要自动触达责任人。'},{t:'第三步：要点提炼与续写',d:'对长文档使用"总结要点、提取行动项"；对半成品文档使用"续写这一段，保持前文语气"；对外发文档先让AI"以挑刺者视角找出逻辑漏洞"。把这三招组合成"提炼-续写-挑刺"流程，覆盖80%的文书场景。'},{t:'第四步：搭建团队知识库',d:'用数据库建立知识库骨架：分类（流程/规范/FAQ/案例）、标题规范（动词+对象，如"申请报销的操作流程"）、状态字段。把存量文档分批入库，让AI为每篇生成摘要填入摘要字段。日常使用入口：先问AI，答案附来源链接，新人也能自主获得答案。'}],
      cases:[{s:'场景：运营团队每周例会后的纪要整理占用了专员大量时间，且格式因人而异',sol:'上线"转写+AI结构化"流程后，会后10分钟出稿：决议、行动项、负责人、截止时间五栏齐全，格式统一。追踪效率提升的关键改变是行动项有了明确责任人与截止时间，例会决议的落地率从不到一半提升到九成以上。'},{s:'场景：公司制度散落在几十个Word文档里，员工遇到问题只会问HR',sol:'将制度文档批量迁入Notion知识库，AI生成每篇摘要并建立分类索引。之后员工直接在知识库提问："试用期考核标准是什么？"AI给出答案并附原文链接。HR同类咨询量下降六成，知识库成为真正的"第一入口"。'}],
      tools:[{n:'Notion + Notion AI',d:'知识库载体与AI整理/写作能力'},{n:'会议转写工具',d:'录音转文字，作为AI纪要的原料'},{n:'Notion数据库',d:'知识库骨架：分类/状态/摘要字段'},{n:'AI工作台页面',d:'集中存放高频模板，随用随取'}],
      tips:['让AI写长文前先让它出大纲：结构决策留给人，扩写交给AI','纪要的"行动项"必须人工核对负责人与截止时间','知识库标题用"动词+对象"命名，AI检索命中率更高','重要结论写进知识库页面，别留在聊天记录里蒸发','文档先让AI"挑刺"再外发：找逻辑漏洞比找错别字更有价值','团队试点1-2个账号跑通场景，用节省的时间说服预算'],
      quizzes:[
        {triggerSlide:2, q:'用AI写一篇高质量工作文档的正确流程是？',opts:['一句话让AI直接写完整篇', '先让AI出大纲→人工调整结构→再按大纲逐节扩写', '先写完全文再让AI压缩', '把任务拆给多个AI各写一段'],ans:1, explain:'大纲是"结构决策"必须人来把控，扩写是"体力活"交给AI。先骨架后血肉：一次性直接生成只会得到四平八稳的套话，两步走才能得到结构合理又有干货的产出。'},
        {triggerSlide:4, q:'AI整理会议纪要后，最需要人工核对的部分是？',opts:['文档格式和字体', '行动项与负责人——AI可能把"建议"误判为"决议"', '纪要的标题', '会议时间'],ans:1, explain:'AI偶尔会把讨论中的"建议"误判成"决议"、把参与讨论者误判为负责人。行动项直接驱动执行，必须人工核对后再@责任人发布。'}
      ],
       },
    tool4: { objectives:['掌握Midjourney提示词四要素结构，告别"抽卡式"生成','学会用风格参考和种子控制系列图的一致性','建立岗位提示词素材库，让视觉素材产出从外包变成自助'],
      concepts:[{t:'提示词四要素：主体+场景+风格+参数',c:'新手提示词只有主体（"一个女孩"），所以生成结果像抽奖。专业提示词是四要素组合：主体（穿卫衣的女孩，插兜，侧面）+场景（黄昏的城市天台，暖色逆光）+风格（日系胶片摄影，35mm，浅景深）+参数（--ar 3:4 --stylize 250）。每个要素都在收窄结果空间。经验法则：先从模仿成熟风格开始（把喜欢的图的提示词抄下来改），积累"要素词汇表"后再自由组合。'},{t:'风格一致性：系列图的量产方法',c:'营销场景经常需要"同一风格的6张图"（同一IP不同场景/系列产品图）。Midjourney的一致性工具：1)风格参考——把参考图喂给AI，后续生成自动继承画风；2)种子——固定随机种子后，微调提示词可以得到构图接近的变体；3)局部重绘——保住满意的部分只改局部。三者组合，把"碰运气"变成"可控制的生产流程"。'},{t:'迭代工作流：生成-评估-精修',c:'专业用户不是一次生成完美的，而是快速迭代出来的。标准循环：1)用简短提示词出4张探路，看方向对不对；2)方向对了用变体按钮深挖，偏了就改关键词重出；3)选出最佳的一张后精修——放大、局部重绘、加参数微调。每轮迭代只解决一个问题（构图/配色/细节），多轮收敛到满意结果。试图一次到位的提示词，往往又长又僵硬。'}],
      steps:[{t:'第一步：注册与出图',d:'登录Discord，加入Midjourney服务器（或在官网用网页版）。在绘图频道输入 /imagine 命令加提示词（建议先用中文想清楚，翻译成英文关键词——英文出图质量目前更好）。生成4张图：U键放大某张，V键生成它的变体。免费额度足够完成本课全部练习。'},{t:'第二步：写四要素提示词',d:'按"主体+场景+风格+参数"结构改写你的提示词。示例对比：弱——"产品海报"；强——"玻璃瓶精华液特写，实验室白色大理石台面，柔和顶光，极简商业摄影风格，--ar 3:4"。用你岗位的一个真实需求（海报/头图/插图）写3条不同风格的提示词，各生成一轮，对比四要素的收窄效果。'},{t:'第三步：控制风格一致性',d:'选定一张满意的图，用风格参考功能让后续6张图继承它的画风；再用种子参数固定构图基础，只改场景词，得到"同风格不同场景"的系列图。检验标准：把6张图放在一起，看起来像同一套物料。'},{t:'第四步：建立提示词素材库',d:'用表格工具建一个素材库：列包含"用途场景、提示词全文、风格关键词、参数、效果评分、配图"。每次产出好图就沉淀一行，失效风格标注淘汰。一个月后你会拥有岗位专属的"视觉配方手册"——新需求来时改两三个词就能出图，不再从零开始。'}],
      cases:[{s:'场景：市场部要为一期活动做6张不同场景的主视觉，外包报价8000元、周期一周',sol:'先用四要素提示词跑出满意的主视觉方向，再用风格参考+种子生成同风格的另外5张场景图，最后人工微调文字排版。两天内完成全套物料，成本只有订阅费。视觉一致性问题通过风格参考解决——这是纯外包模式最贵、AI自助模式最省的部分。'},{s:'场景：运营要做小红书封面图，每次风格都不同，账号视觉调性混乱',sol:'从历史数据里找出互动率最高的3张封面，分析其风格关键词（明亮/特写/大字标题），固化成提示词模板。之后所有封面用模板微调生成，账号视觉调性统一，粉丝认知度明显提升。'}],
      tools:[{n:'Midjourney',d:'AI图像生成，风格质感与美学表现突出'},{n:'Discord',d:'Midjourney的命令入口（或使用网页版）'},{n:'风格参考/种子',d:'控制系列图一致性的两大参数'},{n:'提示词素材库',d:'表格工具沉淀"视觉配方"，越用越准'}],
      tips:['提示词用英文写效果更好：先中文构思再翻译成关键词','四要素齐备再生成：主体+场景+风格+参数，缺一不可','迭代比完美重要：每轮只解决一个问题，多轮收敛','系列图用风格参考+种子控制一致性，别靠运气','好提示词要沉淀进素材库，失效的及时标注淘汰','商用图注意版权规则与人物肖像风险，敏感场景人工把关'],
      quizzes:[

// ── P2.3 Adaptive Content Engine ──
// Maps each course to its primary 8-dimension skill for adaptation
const COURSE_SKILL_MAP = {
  dev1:'dev', dev2:'dev', dev3:'dev', dev4:'prompt', dev5:'dev', dev6:'security',
  pm1:'prompt', pm2:'data', pm3:'data', pm4:'content', pm5:'strategy',
  ops1:'content', ops2:'data', ops3:'workflow', ops4:'data', ops5:'workflow',
  sales1:'data', sales2:'prompt', sales3:'data', sales4:'data', sales5:'workflow',
  hr1:'tools', hr2:'content', hr3:'data', hr4:'strategy', hr5:'strategy',
  // v39: 新岗位课程（财务/采购/法务）
  fin1:'data', fin2:'tools', fin3:'data', fin4:'security', fin5:'workflow',
  po1:'data', po2:'data', po3:'content', po4:'security', po5:'workflow',
  legal1:'content', legal2:'prompt', legal3:'security', legal4:'data', legal5:'strategy',
  // v37: AI工具指南系列
  tool1:'tools', tool2:'prompt', tool3:'workflow', tool4:'content', tool5:'dev'
};

function getAdaptationLevel(courseId) {
  if (!S.quizScores) return {level:'intermediate', score:60, skill:'general'};
  // PM industry courses: extract base course id (e.g., mfg_pm1 -> pm1)
  const baseId = courseId.includes('_') ? courseId.split('_').pop() : courseId;
  const skill = COURSE_SKILL_MAP[baseId] || COURSE_SKILL_MAP[courseId] || 'general';
  const score = S.quizScores[skill] || S._quizResult?.overall || 60;
  let level = 'intermediate';
  if (score < 45) level = 'beginner';
  else if (score >= 75) level = 'advanced';
  return {level, score: Math.round(score), skill};
}

function adaptContent(content, courseId) {
  if (!content) return null;
  const al = getAdaptationLevel(courseId);
  if (al.level === 'intermediate') { content._adaptLevel = al; return content; }
  const adapted = JSON.parse(JSON.stringify(content)); // deep clone
  adapted._adaptLevel = al;

  if (al.level === 'beginner') {
    // Expand concepts: add "前置知识" note to first concept
    if (adapted.concepts && adapted.concepts.length > 0) {
      const pre = '本维度是你的学习重点，建议放慢节奏，重点理解每个概念后再进入实操。';
      adapted.concepts[0].t = '【重点学习】' + adapted.concepts[0].t;
      adapted._beginnerHint = pre;
    }
    // Keep all steps (default is already detailed)
    adapted._adaptMode = 'beginner';
  } else if (al.level === 'advanced') {
    // Condense concepts: keep only ~half, add 进阶洞察
    if (adapted.concepts && adapted.concepts.length >= 2) {
      const kept = adapted.concepts.slice(Math.ceil(adapted.concepts.length/2));
      kept.unshift({t:'进阶洞察',c:'你的基础已扎实。以下内容聚焦高级应用场景和战略思维，可直接跳到感兴趣的章节。'});
      adapted.concepts = kept;
    }
    // Merge steps into summary
    if (adapted.steps && adapted.steps.length > 2) {
      const summary = adapted.steps.map((s,i) => (i+1)+'. '+s.t).join(' | ');
      adapted.steps = [{t:'快速回顾（点击展开全部）',d:summary + '。你已掌握基础，可直接进行关卡挑战。'}];
    }
    // Keep only multi-faceted cases
    if (adapted.cases && adapted.cases.length > 1) {
      adapted.cases = adapted.cases.slice(-1); // keep last (usually most complex)
    }
    adapted._adaptMode = 'advanced';
  }
  return adapted;
}

// Wrapper: get course content with adaptation
function getAdaptedContent(courseId) {
  const raw = getCourseContent(courseId);
  return adaptContent(raw, courseId);
}

// ==================== PPT SLIDE GENERATOR ====================
function getPPTSlides(courseId, courseTitle, courseDesc) {
  const c = getAdaptedContent(courseId);
  if (!c) return [];
  const al = c._adaptLevel || {level:'intermediate', score:60};
  const notes = (t) => t; // TTS reads the text directly
  const slides = [];
  // Slide 1: Cover with adaptation badge
  const badgeTxt = al.level === 'beginner' ? ' 🎯 初级适配·重点学习'
    : al.level === 'advanced' ? ' 🚀 高级适配·快速进阶' : '';
  const coverDesc = courseDesc + (c._beginnerHint ? ' | ' + c._beginnerHint : '');
  slides.push({type:'cover', blocks:[{el:'h1',txt:courseTitle + badgeTxt},{el:'p',txt:coverDesc}], notes:notes(courseTitle+'。'+courseDesc)});
  // Slide 2: Learning Objectives
  if (c.objectives) {
    slides.push({type:'content', title:{icon:'🎯',txt:'学习目标'}, blocks:c.objectives.map(o=>({el:'li',txt:o})), notes:notes('本课程的学习目标如下：'+c.objectives.join('。'))});
  }
  // Slide 3: Core Concept
  if (c.concepts && c.concepts.length) {
    const blocks = c.concepts.map(co=>({el:'h3p',title:co.t,txt:co.c.substring(0,200)+(co.c.length>200?'...':'')}));
    slides.push({type:'accent', title:{icon:'💡',txt:'核心概念'}, blocks, notes:notes('核心概念讲解：'+c.concepts.map(co=>co.t+'。'+co.c.substring(0,300)).join('。'))});
  }
  // Slide 4: Steps summary
  if (c.steps) {
    const blocks = c.steps.map((s,i)=>({el:'card',num:i+1,title:s.t,txt:s.d.substring(0,80)+'...'}));
    slides.push({type:'dark', title:{icon:'🛠',txt:'实操方法论'}, blocks, notes:notes('实操步骤：'+c.steps.map(s=>s.t+'。'+s.d.substring(0,200)).join('。'))});
  }
  // Slide 5: Summary & Next
  const tipsSummary = c.tips ? c.tips.slice(0,3).join('；') : '';
  slides.push({type:'summary', blocks:[{el:'h2',txt:'本章小结'},{el:'p',txt:tipsSummary || '请进入关卡练习检验学习成果'}], notes:notes('课程小结。'+tipsSummary+'现在请进入关卡练习，检验你的学习成果。')});
  return slides;
}

  fin1_0: {hints:['第一步：准备一份模拟经营数据（收入/成本/费用按产品线、渠道、月份展开）','第二步：让AI先做整体毛利变动，再按产品线/渠道/月份三层归因','第三步：让AI输出每层归因的量化贡献（金额+占比）和可行动结论'],answer:'【参考答案】\n1. 数据示例："我公司上半年毛利同比下滑8%，请按产品线（A/B/C）、渠道（线上/线下/经销）、月份三个维度拆解毛利变动原因，量化每个因素的贡献金额和占比"\n2. AI输出应包含：产品结构变化、价格变动、成本上涨（原料/人工）、渠道费用变化等归因项\n3. 人工复核：检查AI归因是否遗漏异常月份（如促销月/大促月），确认结论是否支持管理层决策'},
  fin1_1: {hints:['第一步：确定预算框架：收入预测→成本测算→三表汇总','第二步：给AI明确的业务假设（销量/单价/费用率/税率）','第三步：让AI输出三表并检查勾稽关系（利润表↔现金流↔资产负债表）'],answer:'【参考答案】\n1. 指令示例："我是某消费品公司财务，请按三步链编制2027年部门预算初稿：①收入预测（分产品、分季度）②成本与费用测算（按变动/固定分类）③三表汇总。假设：收入增速15%、毛利率45%、费用率30%、税率25%、回款周期60天"\n2. AI应输出分季度利润表、现金流表、资产负债表的简化版，并说明关键假设\n3. 检查要点：折旧摊销是否计入、应收应付变动是否影响现金流、预算与历史数据是否衔接'},
  fin1_2: {hints:['第一步：给AI历史12个月现金流数据与业务计划','第二步：让AI构建乐观/基准/悲观三情景（收入、回款、费用假设不同）','第三步：让AI输出月度资金缺口预警和融资建议'],answer:'【参考答案】\n1. 指令示例："基于我公司过去12个月现金流数据与明年业务计划，构建未来12个月现金流预测，输出三情景：乐观（收入+20%）、基准（+10%）、悲观（0%），标注每月资金缺口，并给出融资建议"\n2. AI应输出分月现金流表、资金缺口月份标注、建议的融资工具（短期借款/授信/应收账款融资）\n3. 复核：悲观情景下是否有安全垫，资金缺口峰值是否超出授信额度'},
  fin2_0: {hints:['第一步：准备银行流水与账面银行记录（导出为统一格式）','第二步：让AI按账户/金额/日期三要素自动匹配并标记差异','第三步：让AI对差异分类（未达账项/跨期/金额不符/漏记）并生成差异清单'],answer:'【参考答案】\n1. 数据示例：提供5笔银行流水和5条账面记录，其中含1笔未达账项、1笔金额不符\n2. 指令："请将以下银行流水与账面记录自动匹配，按账户+金额+日期三要素核对，输出：匹配成功项、差异项（分类：未达账项/跨期/金额不符/漏记）、差异清单表格"\n3. 复核：对AI分类的差异逐项确认，金额不符项需追查原始凭证，未达账项登记银行存款余额调节表'},
  fin2_1: {hints:['第一步：描述ERP导出数据的现状与目标报表格式','第二步：让AI生成Excel/VBA脚本（或Python脚本）实现自动加工','第三步：验证脚本对异常数据（空值/格式错误/重复行）的处理'],answer:'【参考答案】\n1. 指令示例："我每月从ERP导出销售明细（含客户/产品/日期/金额/税率），需要自动加工成固定格式的月度销售报表（按产品线汇总+同比环比），请生成Excel VBA脚本，要求：①自动清洗空值与重复行 ②按产品线汇总 ③自动生成同比环比 ④格式固定"\n2. AI输出VBA代码后，用一份模拟数据测试运行\n3. 测试要点：含空值行、含格式错误的日期、含重复行，确认脚本不报错且结果正确'},
  fin2_2: {hints:['第一步：梳理集团财务汇总流程现状（子公司报表→合并）','第二步：设计RPA抓取+AI字段映射+自动填模板的三段式流程','第三步：明确异常处理机制（映射失败/数据缺失时的人工介入点）'],answer:'【参考答案】\n1. 流程设计示例：①RPA定时抓取各子公司ERP导出的报表文件 ②AI识别各子公司报表字段并映射到集团统一口径（AI处理不同报表格式）③自动填入集团合并模板并标记无法映射字段 ④异常（格式变化/数据缺失）自动通知财务复核\n2. 输出应包含流程图、每步的工具选型、异常处理规则\n3. 复核：确认口径映射规则的维护机制（子公司科目调整时如何更新），保证合并数据准确性'},
  fin3_0: {hints:['第一步：整理关键财务数据（营收/利润/现金流/资产负债核心指标）','第二步：让AI按管理层关心的5个问题生成2页摘要','第三步：让AI标注数据来源与口径，人工复核关键数字'],answer:'【参考答案】\n1. 指令示例："以下是本公司Q3财务数据：营收3.2亿(+12%)、净利润2800万(-5%)、经营性现金流-800万、应收账款1.1亿(+30%)。请按管理层关心的5个问题生成2页摘要：①整体业绩如何 ②利润为什么下滑 ③现金流为何为负 ④应收账款风险 ⑤下季度展望与建议"\n2. AI输出摘要后，检查是否覆盖全部5个问题、数字是否与原文一致\n3. 复核：让AI指出数据中的异常信号（如应收增幅远超收入增幅），确认摘要逻辑严谨'},
  fin3_1: {hints:['第一步：确定经营分析报告框架：概览→业务线→成本→现金流→风险→规划','第二步：把各板块数据交给AI，让AI按框架撰写初稿','第三步：人工补充业务背景、行业对标，让AI统一风格与结论'],answer:'【参考答案】\n1. 指令示例："请按以下框架撰写我公司2026年度经营分析报告初稿：①经营概览 ②分业务线分析 ③成本结构分析 ④现金流分析 ⑤风险提示 ⑥明年规划建议。数据如下：……（提供营收/利润/成本/现金流数据）"\n2. AI初稿应包含数据表格、趋势判断、风险提示\n3. 人工升级：补充行业对比、战略解读，让AI按"结论先行"原则优化报告结构，输出终稿'},
  fin3_2: {hints:['第一步：整理公司资料（业务模式/财务数据/行业地位）','第二步：让AI预测投资人可能提问（估值/增长/风险/竞争）并生成应答要点','第三步：让AI反向挑战（扮演犀利投资人）补漏'],answer:'【参考答案】\n1. 指令示例："我公司是一家SaaS公司，年营收2亿、增速40%、毛利率75%、亏损3000万。请：①预测投资机构尽调时最可能提出的15个问题 ②对每个问题给出应答要点 ③扮演犀利投资人提出5个最难回答的追问"\n2. AI输出后检查：问题是否覆盖估值逻辑、增长可持续性、竞争壁垒、现金流与融资需求\n3. 对AI反向挑战出的问题，逐条补充应答口径，形成完整问答库'},
  fin4_0: {hints:['第一步：梳理公司业务模式与涉税环节（发票/申报/优惠政策）','第二步：让AI按发票管理、申报合规、优惠政策适用三个维度扫描风险','第三步：让AI对每个风险标注等级、政策依据与整改建议'],answer:'【参考答案】\n1. 指令示例："请按发票管理、申报合规、优惠政策适用三个维度，扫描我公司的税务合规风险点。业务模式：B2B销售+部分线上零售，年营收3亿，享受研发费用加计扣除"\n2. AI应输出风险清单：每项含风险描述、严重等级（高/中/低）、政策依据、整改建议\n3. 复核：重点确认高等级风险（如发票开具不合规、优惠适用条件不符）是否真实存在，制定整改计划'},
  fin4_1: {hints:['第一步：获取政策原文（上传文件或粘贴全文）','第二步：让AI梳理适用范围、核心义务、生效时间与过渡期','第三步：让AI对照公司业务评估影响并输出行动清单'],answer:'【参考答案】\n1. 指令示例："请解析这份税收政策文件：①适用对象与范围 ②核心义务与合规要求 ③生效时间与过渡期安排 ④对制造业企业的影响 ⑤应采取的合规行动清单"\n2. AI应输出结构化解析：义务清单、时间节点、影响评估\n3. 复核：核对AI引用的条款原文，确认影响评估贴合公司实际业务，按时间节点倒排执行计划'},
  fin4_2: {hints:['第一步：清晰描述公司业务模式（收入/成本/交易结构）','第二步：让AI在合规前提下给出税务优化建议（不涉及偷漏税）','第三步：让AI为每条建议标注政策依据与合规风险，人工复核'],answer:'【参考答案】\n1. 指令示例："我公司业务模式：母公司提供技术服务+子公司负责硬件销售，请在不违反税法的前提下，给出合法的税务优化建议（如业务架构、优惠政策适用、发票管理），每条建议标注政策依据与合规风险"\n2. AI应区分：可落地的筹划点（优惠政策/架构安排）vs 有风险的做法（不推荐项）\n3. 复核原则：一切建议以合规为前提，高风险做法一律不采纳，重大筹划咨询税务师确认'},
  fin5_0: {hints:['第一步：准备报销明细数据（部门/城市/职级/金额/类别）','第二步：让AI按多维度拆解并识别统计异常','第三步：让AI用具体规则（如3倍于均值）标记异常样本并说明理由'],answer:'【参考答案】\n1. 指令示例："请分析以下报销数据（含部门、城市、职级、金额、费用类别）：①按部门/城市/职级/类别多维拆解 ②计算各维度均值与分位数 ③标记显著异常样本（如超出同类均值3倍），说明标记理由"\n2. AI输出异常清单后，检查异常样本的合理性\n3. 人工核实：对标记样本查看原始凭证与审批记录，确认是业务需要还是可疑支出，形成核查报告'},
  fin5_1: {hints:['第一步：确定审计目标与风险维度（金额/频率/供应商/审批链）','第二步：让AI基于风险维度设计抽样方案（分层抽样+样本量）','第三步：让AI生成审计底稿框架（抽样表+测试记录模板）'],answer:'【参考答案】\n1. 指令示例："我要审计公司付款流程，请基于以下风险维度设计抽样方案：①按金额分层（>50万全查/10-50万抽30%/1-10万抽10%）②供应商集中度 ③审批链完整性。说明样本量计算逻辑，并生成审计底稿框架（抽样记录表+测试步骤+结论模板）"\n2. AI输出后检查：抽样是否覆盖高风险层、样本量是否可执行\n3. 执行：按抽样方案取数测试，将结果填入底稿，异常项扩大检查'},
  fin5_2: {hints:['第一步：描述财务关键流程（付款/报销/对账）的现状','第二步：让AI识别各环节的内控薄弱点（职责分离/审批/核对）','第三步：让AI输出改进建议并排优先级（风险×整改成本）'],answer:'【参考答案】\n1. 指令示例："请诊断以下三个财务流程的内控薄弱环节：①付款流程（申请→审批→出纳→复核）②报销流程（申请→审批→核销）③对账流程（银行/客户/供应商）。从职责分离、授权审批、独立核对、系统控制四个维度分析，输出薄弱点清单与改进建议，按风险×整改成本排优先级"\n2. AI应输出：薄弱点清单、对应的风险等级、改进建议、优先级排序\n3. 复核：对高优先级建议制定整改计划（如付款与记账职责分离），跟踪落地'},
  legal1_0: {hints:['第一步：准备一份模拟合同文本','第二步：让AI提取合同要素（主体/标的/价款/期限/违约责任）','第三步：让AI按"对己方不利条款"清单逐项审查并输出修改建议'],answer:'【参考答案】\n1. 指令示例："请审查以下合同，输出：①合同要素提取（双方主体、标的、价款、履行期限、违约责任、争议解决）②按风险清单逐项审查：验收标准是否明确、付款节点是否合理、违约责任是否对等、保密与知产条款、单方解除权、争议管辖 ③每条风险给出修改建议文本（可直接回填合同）"\n2. 检查AI是否覆盖全部关键条款、修改建议是否具体可操作\n3. 复核：对违约责任、争议解决等重大条款人工把关，确保符合公司立场'},
  legal1_1: {hints:['第一步：明确存量合同扫描范围与数量','第二步：让AI设计批量扫描方案（风险关键词/条款模式识别）','第三步：让AI输出风险合同清单与优先级'],answer:'【参考答案】\n1. 指令示例："请设计批量扫描500份存量合同的方案：①重点风险条款：知识产权归属、违约上限、自动续期、单方解约、数据条款、管辖条款 ②扫描方法：关键词+条款模式识别，区分"缺失/不利/模糊"三类风险 ③输出：风险合同清单（按风险等级排序）、高频风险条款统计、优先处理建议（如自动续期合同需立即处理）"\n2. 检查扫描维度是否覆盖核心风险\n3. 执行：抽样验证AI识别准确率，按优先级处理高风险合同'},
  legal1_2: {hints:['第一步：确定标准合同类型（销售/采购/服务）与业务场景','第二步：让AI起草标准模板（含可配置条款）','第三步：让AI输出使用说明（条款配置指引+风险提示）'],answer:'【参考答案】\n1. 指令示例："请起草一份销售合同标准模板，要求：①必备条款齐全（标的/价款/交付/验收/付款/违约责任/保密/知产/争议解决）②可配置条款用【】标注并给出选项（如付款方式：预付30%+到货70% 或 月结30天）③含使用说明：每条款的填写指引、对己方有利的默认选项、需法务审核的特殊情形"\n2. 检查模板是否覆盖业务场景、可配置项是否清晰\n3. 复核：模板经业务与法务会签后发布，建立版本管理，定期修订'},
  legal2_0: {hints:['第一步：获取法规原文（上传或粘贴）','第二步：让AI梳理适用范围/核心义务/违规后果/生效时间','第三步：让AI输出合规行动清单与时间节点'],answer:'【参考答案】\n1. 指令示例："请解析以下法规原文，输出：①适用对象与范围 ②核心义务清单（逐条）③违规的法律后果 ④生效时间与过渡期安排 ⑤对企业的影响评估 ⑥合规行动清单（按时间节点排序）"\n2. 检查AI解析是否忠实于原文、有无遗漏关键条款\n3. 复核：对照原文核对义务清单，标注与公司业务直接相关的条款，形成执行计划'},
  legal2_1: {hints:['第一步：清晰描述公司一项业务流程','第二步：让AI对照法规义务清单逐项映射找差距','第三步：让AI输出合规差距清单（条款/现状/差距/整改）'],answer:'【参考答案】\n1. 指令示例："我公司业务流程：APP收集用户手机号用于会员营销，涉及《个人信息保护法》。请：①列出该业务应履行的法定义务（告知同意/最小必要/删除机制等）②逐项对照我们的现状（收集即注册即同意、未区分营销同意）③输出差距清单：条款、现状、差距、整改建议、优先级"\n2. 检查映射是否完整、整改建议是否可落地\n3. 复核后制定整改计划，明确责任部门与完成时限'},
  legal2_2: {hints:['第一步：基于差距清单设计整改方案（流程/合同/技术措施）','第二步：让AI分模块生成整改方案并评估成本与优先级','第三步：让AI输出整改路线图（阶段/责任人/验收标准）'],answer:'【参考答案】\n1. 指令示例："基于以下合规差距清单（用户告知不足/数据出境未评估/第三方合同缺DPA条款），请设计整改方案：①流程整改：注册流程增加单独同意弹窗 ②合同整改：补充数据处理协议（DPA）模板 ③技术措施：数据加密、最小化收集、删除机制。每项给出：实施方式、成本评估、优先级（高/中/低）、责任部门，并输出整体整改路线图（分阶段+验收标准）"\n2. 检查方案是否覆盖全部差距、成本估算是否合理\n3. 复核后立项推进，建立整改台账跟踪闭环'},

  legal3_2: {hints:['第一步：确定监管检查场景与要求','第二步：让AI生成合规自述报告初稿（盘点/制度/执行/成效）','第三步：让AI预演监管追问并准备应答材料'],answer:'【参考答案】\n1. 指令示例："请帮我准备一份面向监管检查的合规自述报告初稿：①公司合规组织与制度 ②重点合规领域执行情况（数据/消保/外包）③自查发现与整改 ④下一步计划。同时扮演监管人员，针对报告提出10个尖锐追问，并给出应答要点与支撑材料清单"\n2. 检查报告结构是否清晰、数据是否真实准确\n3. 复核：对AI预演的追问逐条准备材料，确保口径统一、材料齐备'},

  legal4_2: {hints:['第一步：设计商标抢注应对流程（发现→评估→行动）','第二步：让AI评估各条路径胜率（异议/无效/诉讼/协商）','第三步：让AI输出时限管理表与证据清单'],answer:'【参考答案】\n1. 指令示例："我公司核心商标被他人抢注（尚在公告期），请设计应对工作流：①发现与评估：确认抢注主体与恶意证据（抢注人批量注册/抢注后联系出售）②行动路径对比：异议、无效宣告、协商转让、诉讼——评估各路径的胜率/成本/周期 ③文书要点：异议理由（恶意抢注/在先使用）与证据清单 ④时限管理表：各程序的法定期限（异议期3个月等）"\n2. 检查时限与程序是否符合法律规定\n3. 执行：按评估结果启动最优路径，跟踪时限与进展'},
