text-anchor=\"middle\"><tspan x=\"200.0\">四个必答方向</tspan></text><g data-k=\"量级：备多少谁负责\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">量级：备多少谁负责</tspan></text></g><g data-k=\"折算：搜索怎么变成件数\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">折算：搜索怎么变成件数</tspan></text></g><g data-k=\"时间差：45 天提前期\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">时间差：45 天提前期</tspan></text></g><g data-k=\"退出：产线怎么停\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">退出：产线怎么停</tspan></text></g></svg>", "d": 67.61}, {"t": "通过标准：把「赌」变成「试」", "n": "三段式在这里的写法略有不同。结论要给分批方案，不是单一数字；依据要给推算链条，每一步都能被质疑；边界要包含退出条件和责任归属。特别说一下责任：「压货责任谁背」这个问题，最差的答法是「这是数据组给的数」，第二差是「大家一起判断的」。正确的答法是：决策是谁提的，责任就是谁的，同时说清复盘时怎么区分「判断偏差」和「执行问题」。这一句能让对话从对抗变成协作，因为对方真正怕的不是亏钱，是亏了钱说不清是谁的责任。最后一句实操：谈完当场把分批方案写成三行发给他，写明首批数量、第二批触发条件、退出方式。口头共识过两天就变形，落到文字上才算数。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"结论是分批方案\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论是分批方案</tspan></text></g><g data-k=\"依据是推算链条\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">依据是推算链条</tspan></text></g><g data-k=\"边界含退出条件\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">边界含退出条件</tspan></text></g><g data-k=\"责任归属说清不推诿\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任归属说清不推诿</tspan></text></g></svg>", "d": 63.89}], "deliverable": {"type": "doc", "name": "趋势判别卡", "rubric": ["量级可推算", "分批可执行", "责任说清"], "acceptance": "四问都能给出量级推算过程、分批方案与证伪条件，且明确承认压货责任的归属"}, "spar": {"role": "供应链总监", "persona": "管过十年备货，最怕「趋势」两个字；只问数字和周期，听到「大概」就皱眉，口头禅是「压谁的库存」「提前期你算过吗」", "mustAsk": ["你说趋势起来了，那到底要备多少？3 万件压三个月，这个责任谁背？", "你的数是从搜索指数推的，可搜索涨了不一定买，凭什么折算成件数？", "面料提前期 45 天，等你验证完趋势，旺季都过了，这个时间差怎么处理？", "如果第 4 周数据不对，你怎么退？已经开的产线能停吗？"]}, "exemplar": "（总监问：你让我备 3 万件，压三个月谁负责？）\n\n结论：我不要求一次备 3 万件，我要求分两批：首批 8000 件锁 3 周产能，第二批看第 4 周数据再定。\n依据：搜索指数同比 +112%，但支付买家数只 +8%、商详点击率 -3%，三个数不同向，说明需求还没有真正落成成交。按现有转化率 2.6% 反推，搜索增量对应的可承接订单约 6000–9000 件，所以首批 8000 件是「验证需求」的量，不是「押注趋势」的量。\n边界：我不用第三方销量估算做依据，那部分我标了待核实；如果第 4 周支付买家数同比没到 15%，第二批取消，首批按现有动销消化，最多压 5 周。压货责任我认——首批的决策是我提的，如果错了，复盘时我写明是我的判断偏差，不是计划岗执行问题。", "task": "把《趋势判别卡》拿到「供应链总监」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《趋势判别卡》。现在要让它通过「供应链总监」这一关。\n【对手的立场】管过十年备货，最怕「趋势」两个字；只问数字和周期，听到「大概」就皱眉，口头禅是「压谁的库存」「提前期你算过吗」。\n【他一定会追问】「你说趋势起来了，那到底要备多少？3 万件压三个月，这个责任谁背？」 / 「你的数是从搜索指数推的，可搜索涨了不一定买，凭什么折算成件数？」 / 「面料提前期 45 天，等你验证完趋势，旺季都过了，这个时间差怎么处理？」\n【场景】你说「供应链总监质疑你的趋势判断」，对方立刻回一句：你说趋势起来了，那到底要备多少？3 万件压三个月，这个责任谁背？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["备货量给出推算链条（搜索增量 × 转化率 × 承接系数），而不是直接报一个数", "方案分两批并写明触发条件（第 4 周哪个指标到多少才开第二批）", "提前期问题有具体应对（面料预订、半成品、可改款），不回避", "明确说出「错了谁承担」，且不把责任推给计划岗或数据组"]}]}, {"id": "M2", "title": "M2 AI 辅助需求与用户研究", "dims": ["insight", "product", "data"], "units": [{"id": "M2U1", "tier": "basic", "step": "understand", "title": "购物路径与流失节点", "video": {"dur": "3.9min", "script": ["没有拆到节点，你所有的优化都会变成「把页面整体再改一遍」这种没人敢批的方案", "四段漏斗（曝光→商详→加购→支付）+ 节点归因三问", "某家居店商详到加购只有 6.8%，把「加购」按钮上方的运费说明挪走后回升到 9.2%"]}, "ppt": {"method": "四段漏斗（曝光→商详→加购→支付）+ 节点归因三问", "case": "某家居店商详到加购只有 6.8%，把「加购」按钮上方的运费说明挪走后回升到 9.2%", "demo": "同一组漏斗数算两遍：先算整体转化，再按新老客拆开，看结论怎么变"}, "objective": "能把一条成交路径拆成节点、算出各节点流失率，并说出哪个节点值得先动", "transfer": "把本周主推 SKU 的四段漏斗数拉出来算一遍，标出流失最大的节点发给数据组复核", "vslides": [{"t": "开场：一条路径拆四段，问题才落地", "n": "用户从看到你到付钱，中间隔着好几道门。零售电商的路径通常拆四段：曝光到商详、商详到加购、加购到结算、结算到支付。每一段都有人走掉，你要做的是算出每一段走了多少，而不是盯着最后一个转化率。为什么必须拆？因为「整体转化 2.6%」这个数不能指导任何动作：它是四个数的乘积，你根本不知道哪一段出了问题。拆开之后才可能出现这种判断——曝光到商详 8%，商详到加购 6.8%，加购到结算 62%，结算到支付 88%。问题显然在第二段，因为其他三段都在行业常见区间，只有它低。这一段拆解，就是你后面所有优化动作的靶子。没有靶子，方案就只能写「整体优化体验」。顺带说一句：拆漏斗时最好两个人各算一遍，算出两个数就说明口径没对齐，先对齐再谈优化。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四段漏斗</tspan></text><g data-k=\"曝光\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">曝光</tspan></text></g><g data-k=\"商详\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">商详</tspan></text></g><g data-k=\"加购\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">加购</tspan></text></g><g data-k=\"结算\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">结算</tspan></text></g><g data-k=\"支付\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">支付</tspan></text></g></svg>", "d": 77.95}, {"t": "具体动作：口径先对齐，再看流失", "n": "算之前先把三个口径钉死。第一，分母用谁：商详转化要看商详 UV，不是曝光 UV；用错分母，你会把「曝光质量差」误判成「商详没说服力」。第二，UV 怎么去重：同一人一天进三次商详算一次还是三次，两种算法结论能差一倍，公司内部必须只认一种。第三，时间窗口：当日转化和 7 日转化完全不是一回事，尤其客单价高的品类，用户会拖几天再买。口径定完，再看两个指标：相对流失率（这一段走掉的百分比）和绝对流失人数。有些段落率看着不差，但基数大，走掉的人比低转化段落多得多——先做哪个，要算「挽回 1 个百分点能带回多少人」，而不是只看率的高低。举个具体量级：商详到加购 6.8%，走掉的人上万；结算到支付 88%，走掉的只有几百。前者才值得动。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 分母：商详 UV 不是曝光 UV\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 分母：商详 UV 不是曝光 UV</tspan></text></g><g data-k=\"② UV 去重口径全公司统一\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② UV 去重口径全公司统一</tspan></text></g><g data-k=\"③ 窗口：当日 vs 7 日分开看\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 窗口：当日 vs 7 日分开看</tspan></text></g><g data-k=\"④ 排序：挽回 1 个点能带回多少人\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 排序：挽回 1 个点能带回多少人</tspan></text></g></svg>", "d": 76.63}, {"t": "边界：漏斗能告诉你「哪漏」，不能告诉你「为什么漏」", "n": "漏斗的极限在这里：它只反映结果，不反映原因。第二段低，可能是价格没竞争力、可能是库存显示缺货、可能是运费到结算才冒出来、也可能只是加购按钮被一个弹窗挡住。四种原因对应四种完全不同的方案，而漏斗一个都答不了。要定位原因，得靠行为日志和可用性测试：看用户在这一页停留多久、滑到哪个位置离开、点了什么又退回去。还有一个常见错法：把行业均值当目标。行业均值来自不同客单价、不同品类的混合样本，你追它没有意义；真正该比的是你自己上一版、以及同一品类里你认可的那一家。最后提醒一句：漏斗是诊断工具，不是结论。它只负责告诉你去哪儿挖，不负责告诉你挖到什么。补一句实操：把漏斗数放诊断表第一屏，后面每条假设都注明「对应第几段」，评审一眼看得出你在解决哪个节点。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"漏斗只答「哪漏」不答「为什么」\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">漏斗只答「哪漏」不答「为什么」</tspan></text></g><g data-k=\"原因靠行为日志与可用性测试\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">原因靠行为日志与可用性测试</tspan></text></g><g data-k=\"别拿行业均值当目标\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">别拿行业均值当目标</tspan></text></g><g data-k=\"只和自己上一版、可信同类比\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只和自己上一版、可信同类比</tspan></text></g></svg>", "d": 77.42}], "deliverable": {"type": "sheet", "name": "漏斗诊断表", "rubric": ["口径正确", "节点定位", "假设可验"], "acceptance": "四段漏斗每段给出人数、转化率与分母口径，并对最大流失节点给三条可验证的假设"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】四段漏斗（曝光→商详→加购→支付）+ 节点归因三问\n【为什么重要】没有拆到节点，你所有的优化都会变成「把页面整体再改一遍」这种没人敢批的方案\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["四段漏斗的分子分母写清楚（如加购率 = 加购人数 ÷ 商详 UV，不是 ÷ 曝光 UV），口径错即判错", "能指出最大流失节点，并说明是「相对流失」还是「绝对流失」（率高但基数小，不等于值得做）", "对最大流失节点给出三条互不重复的假设，每条写明验证需要的数据", "能说出一条「漏斗看不出、必须靠行为日志才能判断」的原因，不把漏斗当万能"]}, {"id": "M2U2", "tier": "basic", "step": "demo", "title": "用 AI 做用户分群画像", "video": {"dur": "3.4min", "script": ["分群的价值不在分出几个人群，而在每个人群背后有一个能被验证的假设", "会话摘要 → 流失节点 / 原因假设 / 证据强度 → 分群 → 三条待验证假设", "「优选生活馆」一周 8 条会话记录（含加购未付、比价、优惠券失效、跨端切换）"]}, "ppt": {"method": "会话摘要 → 流失节点 / 原因假设 / 证据强度 → 分群 → 三条待验证假设", "case": "「优选生活馆」一周 8 条会话记录（含加购未付、比价、优惠券失效、跨端切换）", "demo": "WorkBuddy 内跑一遍：先判节点与假设，再让模型分群，最后自己剔掉证据不足的假设"}, "objective": "能把 8 条脱敏会话记录整理成「流失节点 + 原因假设 + 证据强度」，并说清哪些要靠数据验证", "transfer": "从后台拉一周的会话记录按这套字段过一遍，把三条最强假设写成取数需求发给数据组", "vslides": [{"t": "演示准备：会话记录不是故事，是证据链", "n": "运营给你 8 条会话记录：谁从哪进来、看了几页、在哪一页停住、最后有没有付钱。看着像流水账，其实每条都指向一个具体节点。麻烦在于它们混着四种情况：有的是真流失（走到结算又走了），有的是正常决策（移动端加购、第二天 PC 端下单），有的是产品问题（券不可叠加），还有的是供给问题（热门规格缺货）。你要做的第一件事是把每条按五档节点定位：首页、列表、商详、结算、支付。定位完你才会发现，8 条里真正卡在结算的有 2 条，卡在商详的有 4 条——不同节点对应完全不同的动作，混在一起谈「转化低」等于什么都没说。这 8 条如果混在一起算，你只能得出「转化不好」这个结论，而它不能指导任何一个具体动作。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入：流水账</tspan></text><g data-k=\"8 条会话：入口 / 页数 / 停留 / 终点\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条会话：入口 / 页数 / 停留 / 终点</tspan></text></g><g data-k=\"混着：真流失 / 正常决策 / 产品问题 / 供给问题\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">混着：真流失 / 正常决策 / 产品问题 / 供给问题</tspan></text></g><g data-k=\"先定节点，再谈假设\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">先定节点，再谈假设</tspan></text></g></svg>", "d": 67.87}, {"t": "三个字段定生死：节点、假设、证据强度", "n": "节点从五档里选，选不出来说明这条记录信息不够，要标注「信息不足」而不是硬猜。假设必须指向一个可查的事实，比如「运费在结算页才出现」「两个 SKU 价格差没在详情页体现」「热门规格显示缺货」，这种假设能拿去查表；写成「体验不好」「页面不够吸引人」，就没法验证，也没法改。证据强度分三档：日志能直接证实（用户确实点了缺货规格）、需要补数据（要拿客服工单交叉）、只是猜测。第三档不能进分群结论——这是这一节最硬的规矩，因为它决定了你后面会不会拿着猜测去要研发排期。最后一个字段是验证方式：查哪张表、看哪个指标。写不出来，说明这条假设还没到能用的程度。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三个字段</tspan></text><g data-k=\"节点（五档）\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">节点（五档）</tspan></text></g><g data-k=\"假设（可查的事实）\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">假设（可查的事实</tspan><tspan x=\"200.0\" dy=\"14.950000000000001\">）</tspan></text></g><g data-k=\"证据（三档）\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">证据（三档）</tspan></text></g></svg>", "d": 66.41}, {"t": "模型的活：分群；人的活：挡住过度解读", "n": "字段齐了，模型做三件事：把条目分组、给每组一条假设、指出哪几条证据不足。它最常犯的错有三个。第一，把「跨端下单」判成流失，其实那是正常决策周期，客单价越高越常见。第二，给你一个行业均值当参照，比如「行业加购未付率 65%」，这个数没有来源，写进汇报就是雷。第三，替你下优先级，说「优先做 B 组」——优先级要算影响面和成本，它没有成本数据。所以你的输出应该是：四组人群 + 每组的验证方式 + 明确写出「本批次没有支付页数据，这个节点不下结论」。最后这句最值钱，它让别人知道你的结论边界在哪。另外，模型倾向于给每组一个「完美解释」，你要做的是把解释降级成假设，并标上「待验证」三个字。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">模型做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人来做</tspan></text><g data-k=\"分组 / 给假设 / 标证据不足\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">分组 / 给假设 / 标证据</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">不足</tspan></text></g><g data-k=\"定优先级 / 补行业数据 / 判正常流失\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">定优先级 / 补行业数据 /</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\"> 判正常流失</tspan></text></g></svg>", "d": 67.08}], "deliverable": {"type": "sheet", "name": "用户分群表（含假设与验证方式）", "rubric": ["节点判定", "假设质量", "验证方式"], "acceptance": "8 条会话每条都判了流失节点与原因假设；分群不超过 4 组，每组带一条可验证假设"}, "demo": {"ref": "■ 四组人群（8 条全部纳入）\n\nA 组｜价格犹豫型（S02、S05）\n共同特征：都在商详页反复进出、比较过至少两个 SKU，最终未加购。\n假设：商详页缺少「同款不同规格的价格差」对照，用户在两个 SKU 之间来回切。\n验证：查这两个 SKU 的商详跳出率与规格切换次数，7 天出结论。\n\nB 组｜运费意外型（S01、S07）\n共同特征：都走到结算页才离开，且停留时间集中在结算页前 20 秒。\n假设：运费在结算页才出现，超出预期导致放弃。\n验证：查结算页离开率与「运费」相关客服工单量，对比包邮门槛调整前后。\n\nC 组｜库存与规格型（S03、S06）\n共同特征：都在商详页看了规格后离开，其中一条明确触发了缺货提示。\n假设：热门规格缺货，用户不愿换规格。\n验证：查缺货 SKU 的商详 UV 与加购率，对比有货 SKU。\n\nD 组｜跨端比价型（S04、S08）\n共同特征：移动端加购、PC 端下单，中间隔了 1 天以上。\n假设：用户在等券或等比价，属于正常决策周期，不需要干预。\n验证：查跨端用户 7 日转化率是否高于单端用户。\n\n■ 建议：优先做 B 组，因为它影响所有客单价低于包邮门槛的订单。\n■ 补充：行业平均加购未付率约 65%，我们 72% 高于均值，说明整体偏弱。", "fix": ["「行业平均加购未付率约 65%」整句删掉——素材里没有这条数据，行业均值不能编", "「优先做 B 组」改成「B 组影响面最大（所有低于包邮门槛的订单），但需先确认运费提示位置」，不直接下优先级", "D 组「不需要干预」改成「待验证：若 7 日转化不高于单端，则说明确实流失」，避免把假设写成结论", "补一条：8 条会话里没有一条覆盖「支付页失败」，这个节点本批次无数据，不能下判断"], "judge": "判断依据：假设能不能被一张表验证；有没有把「正常决策周期」误判成流失；有没有用行业均值替代自家数据；结论有没有超出这 8 条能支撑的范围", "sheet": {"situ": "你拿到「优选生活馆」一周 8 条脱敏会话记录：只有行为与页面轨迹，没有用户身份。运营想知道「人到底卡在哪一步」，但 8 条里混着真流失、正常决策、产品问题和供给问题，你要先把它们分开，再谈分群。", "ask": "① 逐条判：卡在哪个节点、最可能的原因是什么、证据有多强、下一步查什么；② 用你的表请 AI 分群并给每组一条可验证假设；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 把用户分成最多 4 组，每组给条目编号与共同特征；② 每组给一条可验证假设，写明查哪张表、看哪个指标；③ 指出哪几条不该纳入流失统计。禁止补充表中没有的数据与行业均值。", "mats": [{"id": "S01", "src": "会话 · 移动端新客", "text": "入口：首页推荐位 → 商详 3 屏 → 加购 → 结算页\n结算页停留 18 秒后退出，未提交订单。"}, {"id": "S02", "src": "会话 · 移动端", "text": "入口：搜索「四件套 200×230」→ 商详\n在两个 SKU 之间来回切换 6 次，停留 96 秒，未加购。"}, {"id": "S03", "src": "会话 · 移动端新客", "text": "入口：列表页 → 商详「云感四件套」\n点开规格「1.8m 灰」，页面弹出「该规格暂时缺货」，随后离开。"}, {"id": "S04", "src": "会话 · 跨端", "text": "入口：移动端加购，停留 40 秒后退出\n次日从 PC 端登录，完成下单支付（同一账号）。"}, {"id": "S05", "src": "会话 · 移动端", "text": "入口：首页 → 商详\n详情页停留 210 秒，滚动到底部，看了评价区与规格表，未加购即离开。"}, {"id": "S06", "src": "会话 · 移动端", "text": "入口：活动页 → 商详 → 加购 → 结算\n结算页点击「使用优惠券」，页面提示「首单券不可与满减叠加」，随即退出。"}, {"id": "S07", "src": "会话 · 移动端", "text": "入口：搜索 → 商详 → 加购 → 结算 → 支付页\n在支付页返回两次后退出，未选择任何支付方式。"}, {"id": "S08", "src": "会话 · 移动端", "text": "入口：类目页\n连续浏览 5 页共 60 个商品，点击 0 次，离开。"}], "cols": [{"k": "node", "name": "卡在哪个节点", "hint": "五档节点；已完成的选「非流失」", "type": "chips", "w": 2, "tags": ["首页", "列表", "商详", "结算", "支付", "非流失"]}, {"k": "hyp", "name": "最可能的原因", "hint": "从词表里选", "type": "chips", "w": 3, "tags": ["运费未明示", "规格缺货", "价格对比中", "券不可叠加", "跨端决策中", "信息不足怕买错", "支付方式缺失", "价格带不匹配"]}, {"k": "ev", "name": "证据强度", "hint": "强（日志直接可见）/ 中 / 弱（只是推测）", "type": "chips", "w": 2, "tags": ["强", "中", "弱"]}, {"k": "verify", "name": "下一步查什么", "hint": "选一个能落地的查法", "type": "chips", "w": 3, "tags": ["查退出率", "查工单量", "查库存接口", "查 7 日转化", "查支付分布"]}], "key": {"S01": {"node": "结算", "hyp": "运费未明示", "ev": "中", "verify": "查工单量"}, "S02": {"node": "商详", "hyp": "价格对比中", "ev": "中", "verify": "查退出率"}, "S03": {"node": "商详", "hyp": "规格缺货", "ev": "强", "verify": "查库存接口"}, "S04": {"node": "非流失", "hyp": "跨端决策中", "ev": "强", "verify": "查 7 日转化"}, "S05": {"node": "商详", "hyp": "信息不足怕买错", "ev": "中", "verify": "查退出率"}, "S06": {"node": "结算", "hyp": "券不可叠加", "ev": "强", "verify": "查工单量"}, "S07": {"node": "支付", "hyp": "支付方式缺失", "ev": "弱", "verify": "查支付分布"}, "S08": {"node": "列表", "hyp": "价格带不匹配", "ev": "弱", "verify": "查退出率"}}, "notes": {"S04·node": "这条不是流失：用户次日在 PC 端下单了。判成流失会把流失率算虚，这类客单价越高的品类越常见——它属于正常决策周期", "S03·node": "卡在商详，不是列表：用户在商详点开规格才发现缺货，说明列表页没有做缺货提示，这也正是「答案在产品页，问题在列表页」的典型", "S05·hyp": "停留 210 秒、滑到底、还看了评价区，这更像「信息不足怕买错」；价格犹豫的典型特征是反复在两三个 SKU 之间切换，像 S02", "S07·ev": "只有一条、也没说缺哪个支付方式，证据只能是「弱」；弱证据不能进 P0，要先查支付方式分布", "S06·ev": "页面明确提示「不可叠加」，日志与文案都可见，属「强」——这类可以直接改", "S01·ev": "停在结算页 18 秒就走了，但不能直接证明是运费；要拿客服工单里「运费」类关键词做交叉，所以只能是「中」", "S02·verify": "价格犹豫最直接的查法是商详跳出率 + 规格切换次数，不必先查工单"}, "delta": [{"op": "删", "frm": "模型补的「行业平均加购未付率约 65%，我们 72% 高于均值」", "to": "整句删除", "why": "素材里没有这条数据；行业均值必须来自可引用报告或自家看板", "kw": ["行业", "均值", "65", "平均", "参考"]}, {"op": "改", "frm": "「优先做 B 组（运费）」直接下了优先级", "to": "「B 组影响面最大，但需先确认运费提示位置是否在结算页」", "why": "影响面可以推断，优先级要算成本与依赖，模型没有这两项数据", "kw": ["优先", "先验证", "影响面", "成本"]}, {"op": "改", "frm": "D 组写「不需要干预」", "to": "「待验证：若跨端用户 7 日转化不高于单端，则确属流失」", "why": "把假设写成结论，是这类分析最常见的越界", "kw": ["待验证", "7 日", "正常决策", "跨端"]}, {"op": "改", "frm": "S04 被算进流失样本", "to": "S04 移出流失样本，单列为「跨端决策」", "why": "它已经成交了；混进流失会让 8 条的分母和占比全错", "kw": ["S04", "非流失", "跨端", "剔除", "已完成"]}, {"op": "补", "frm": "（模型没写）", "to": "末尾写一句「本批次无支付失败与售后节点数据，这两段不下结论」", "why": "把边界写出来，别人才知道你的结论能覆盖到哪", "kw": ["不覆盖", "无数据", "支付失败", "边界"]}], "refsheet": "S01｜结算｜运费未明示｜中｜查工单量\nS02｜商详｜价格对比中｜中｜查退出率\nS03｜商详｜规格缺货｜强｜查库存接口\nS04｜非流失｜跨端决策中｜强｜查 7 日转化\nS05｜商详｜信息不足怕买错｜中｜查退出率\nS06｜结算｜券不可叠加｜强｜查工单量\nS07｜支付｜支付方式缺失｜弱｜查支付分布\nS08｜列表｜价格带不匹配｜弱｜查退出率\n\n四处容易判错的：\n· S04 是「非流失」：次日 PC 端下单了，混进流失样本会让占比全错。\n· S03 卡在商详不是列表：问题出在列表页没提示缺货，但用户是在商详才发现的。\n· S05 是「信息不足怕买错」不是「价格对比中」：价格犹豫的典型是反复切 SKU。\n· S07 只有一条且没说缺哪个支付方式，只能算「弱」，不能进 P0。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」一周内的 8 条脱敏会话记录（已去掉用户 ID、手机号、地址，只留行为与页面）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 把用户分成最多 4 组，每组给出条目编号与共同特征；② 每组给一条可验证的假设，写明需要哪张表、看哪个指标；③ 指出哪些条目证据不足、不能进结论。禁止补充表中没有的数据。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】会话摘要 → 流失节点 / 原因假设 / 证据强度 → 分群 → 三条待验证假设\n【参考案例】「优选生活馆」一周 8 条会话记录（含加购未付、比价、优惠券失效、跨端切换）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」一周内的 8 条脱敏会话记录（已去掉用户 ID、手机号、地址，只留行为与页面）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 把用户分成最多 4 组，每组给出条目编号与共同特征；② 每组给一条可验证的假设，写明需要哪张表、看哪个指标；③ 指出哪些条目证据不足、不能进结论。禁止补充表中没有的数据。", "rubric": ["每条会话的流失节点从固定五档里选（首页/列表/商详/结算/支付），不写「浏览过程中」这类模糊说法", "原因假设必须指向一个可查的事实（运费未明示、库存显示缺货、券不可叠加），不写「体验不好」", "证据强度按「日志能直接证实 / 需补数据 / 只是猜测」三档分，猜测档不得进分群结论", "每组人群带一条验证方式（查哪张表、看哪个指标、多久出结论），缺验证方式不计分"]}, {"id": "M2U3", "tier": "basic", "step": "todo", "title": "产出《用户分层与旅程地图》", "video": {"dur": "3.3min", "script": ["旅程地图最常见的失败是画得很漂亮、但没有一个数字，评审看完不知道该改哪里", "四段路径 × 三层信息（行为 / 情绪 / 假设）+ 分层依据", "「优选生活馆」新客首单旅程地图（含 3 个流失点与对应验证动作）"]}, "ppt": {"method": "四段路径 × 三层信息（行为 / 情绪 / 假设）+ 分层依据", "case": "「优选生活馆」新客首单旅程地图（含 3 个流失点与对应验证动作）", "demo": "地图骨架 + 一份填好的样例（每段都有数据、假设、验证方式）"}, "objective": "能产出一份带节点数据与假设清单的用户旅程地图，每个流失点都挂着验证动作", "transfer": "把地图里三条待验证假设转成取数需求发出，一周后回来把结论补进同一张图", "vslides": [{"t": "任务说明：地图要有数字，不然就是插画", "n": "旅程地图这个交付物，很多团队做着做着就变成了插画：一条弯弯曲曲的线，几个小人，几朵情绪云。评审看完只会说「挺好看」，然后没有任何动作。要让它变成能推动事的材料，每一段必须挂三样东西：行为、数据、假设。行为是用户在这一页干什么（滑到哪、点了什么、停了多久），数据是这一段的转化率与人数，假设是「为什么在这里走」。三段都要有，缺一段这张图就只是示意图。这一节还要你写一个分层依据：为什么按新老客分而不是按品类分，理由必须是一组对比数据，不是「大家都这么分」。还有一层：分层维度最好不超过两个，分得太细每组样本都很少，结论反而不稳。分层维度越多，验证成本越高，一周内根本跑不完。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 分层依据（带对比数据）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 分层依据（带对比数据）</tspan></text></g><g data-k=\"② 四段行为 + 指标\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 四段行为 + 指标</tspan></text></g><g data-k=\"③ 三个流失点 × 三条假设\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 三个流失点 × 三条假设</tspan></text></g><g data-k=\"④ 验证动作（表/指标/时间/人）\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 验证动作（表/指标/时间/人）</tspan></text></g><g data-k=\"⑤ 不覆盖范围\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 不覆盖范围</tspan></text></g></svg>", "d": 68.35}, {"t": "假设怎么写才叫假设", "n": "一条合格的假设，长这样：「运费在结算页才出现，超出心理预期」。它有主语（运费）、有机制（结算页才出现）、有可查的痕迹（客服工单 21 条/周）。不合格的写法：「结算页体验不好」「用户不信任我们」。区别在哪？前者能直接拿去查表，后者只能再讨论一轮。每组假设写三条，是为了避免你自己锁定一个答案。三条里至少有一条要跳出「页面问题」——很多流失根本不是页面，是库存、是时效、是价格带。只写页面问题的人，做出来的方案永远是改文案。三条假设还要标证据强度，弱的就老实写弱，别靠语气词撑。写假设时把「可能」换成「我判断」——前者是躲，后者是承担，评审更愿意把资源给承担的人。每条假设后面跟一句「查哪张表」，假设才算落了地。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">一条假设的三段</tspan></text><g data-k=\"现象\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">现象</tspan></text></g><g data-k=\"机制\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">机制</tspan></text></g><g data-k=\"可查的痕迹\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可查的痕迹</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 68.98}, {"t": "验证动作是把图变成待办的关键", "n": "每条假设后面挂一个验证动作，写四样：查哪张表、看哪个指标、多久出结论、谁负责。例子：「查结算页退出率 + 运费相关工单，7 天，数据分析岗」。四样缺一样，这条动作就会烂在文件里。最后一个部分很容易被跳过：本批次不覆盖什么。支付失败、售后旅程、老客复购——这些不是不重要，是本批次没数据。明确写出来，一是让别人知道你的结论边界，二是给自己留一条下次做的话题。地图的价值不在覆盖全，而在每一段都站得住。地图做完别只发文档，配一页「三个流失点 + 三条验证 + 一周后回来对账」，否则没人会翻到第三页。一页纸的传播力，远大于一份写得很细的文档。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每条假设挂四要素\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条假设挂四要素</tspan></text></g><g data-k=\"不要全是页面问题\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不要全是页面问题</tspan></text></g><g data-k=\"弱者写弱不硬撑\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">弱者写弱不硬撑</tspan></text></g><g data-k=\"末尾写清不覆盖范围\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">末尾写清不覆盖范围</tspan></text></g></svg>", "d": 62.64}], "deliverable": {"type": "doc", "name": "用户分层与旅程地图", "rubric": ["分层有依据", "节点有数据", "假设可验证"], "acceptance": "一张能指到具体节点的地图：四段都有转化率、三个流失点各带三条假设与验证动作"}, "practice": {"steps": ["定分层依据：按新老客还是按品类，写清为什么这么分（如新客首单流失率是老客 3 倍）", "画四段路径：每段写行为（用户在这页做什么）、关键指标（该段转化率与人数）", "标流失点：每段挑一个最大流失点，写「现象 + 三条假设 + 证据强度」", "写验证动作：每条假设对应查哪张表、看哪个指标、多久出结论、责任人岗位", "写不覆盖范围：本批次缺哪些节点的数据（如支付失败、售后），明确不下结论"], "exemplar": "【用户分层与旅程地图 · 新客首单】产品：优选生活馆　周期：10/19–10/25\n\n■ 一、分层依据\n按「新客 / 老客」分层，不用品类分层。理由：同期数据显示新客首单转化 1.8%，老客复购转化 4.2%，差 2.4 个百分点，问题集中在首单；按品类分反而看不出差异（四件套 2.1% / 被芯 2.3%）。\n口径：新客 = 首次下单用户；转化 = 支付人数 ÷ 商详 UV；窗口 = 当日 + 7 日两个口径都记。\n\n■ 二、四段路径（新客）\n1. 曝光→商详：商详 UV 12,400，点击率 6.2%（曝光 20 万）\n2. 商详→加购：加购 843 人，加购率 6.8%\n3. 加购→结算：进入结算 610 人，结算率 72.4%\n4. 结算→支付：支付 225 人，支付率 36.9%（新客当日）\n注：支付率是四段里最低的一段，且低于老客同段 61.2%。\n\n■ 三、三个流失点（现象 + 假设 + 证据强度）\n流失点 1｜结算→支付（最大流失，385 人离开）\n现象：结算页平均停留 34 秒，退出集中在「提交订单」按钮点击后的加载期。\n假设 A：运费在结算页才出现，超出心理预期（证据：强，客服工单「运费」类 21 条/周）\n假设 B：新客首单券默认不勾选，用户以为没优惠（证据：中，需查券核销率）\n假设 C：支付方式里没有用户常用的那个（证据：弱，需查支付方式分布）\n\n流失点 2｜商详→加购（加购率 6.8%，低于自家老客 9.1%）\n假设 A：规格选择区在首屏之下，用户没看到（证据：中，需看滚动深度）\n假设 B：热门规格缺货但未在列表页提示（证据：强，缺货 SKU 商详 UV 占比 28%）\n假设 C：详情页无克重与尺寸实测，用户怕买错（证据：中，承接 M1 洞察结论）\n\n流失点 3｜曝光→商详（点击率 6.2%，低于同品类自家 7.8%）\n假设 A：首图未体现「可机洗」这一核心卖点（证据：弱，需做主图 A/B）\n假设 B：价格带高于类目主流，点击意愿低（证据：中，需类目价格分布）\n假设 C：人群定向偏宽，曝光质量差（证据：中，需分渠道看点击率）\n\n■ 四、验证动作\n1. 假设 A（运费）：查结算页退出率 + 运费相关工单，7 天，责任人：数据分析\n2. 假设 B（首单券）：查首单券核销率与勾选率，5 天，责任人：会员运营\n3. 流失点 2 假设 B（缺货）：查缺货 SKU 商详 UV 与加购率对比，5 天，责任人：类目运营\n4. 流失点 3 假设 A（主图）：做 7 天主图 A/B，责任人：内容运营\n\n■ 五、本批次不覆盖\n支付失败与风控拦截（无日志权限）；售后与退货旅程（属另一条链路）；老客复购旅程（本批次只做首单）。以上四项本图不下结论。"}, "task": "产出《用户分层与旅程地图》：定分层依据：按新老客还是按品类，写清为什么这么分（如新客首单流失率是老客 3 倍）；画四段路径：每段写行为（用户在这页做什么）、关键指标（该段转化率与人数）；标流失点：每段挑一个最大流失点，写「现象 + 三条假设 + 证据强度」；写验证动作：每条假设对应查哪张表、看哪个指标、多久出结论、责任人岗位；写不覆盖范围：本批次缺哪些节点的数据（如支付失败、售后），明确不下结论", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M2 AI 辅助需求与用户研究」模块，你要交付的是《用户分层与旅程地图》。\n【场景】业务侧这周的诉求是：旅程地图最常见的失败是画得很漂亮、但没有一个数字，评审看完不知道该改哪里。参考做法：「优选生活馆」新客首单旅程地图（含 3 个流失点与对应验证动作）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（四段路径 × 三层信息（行为 / 情绪 / 假设）+ 分层依据），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《用户分层与旅程地图》填写模板】\n\n■ 1. 定分层依据：按新老客还是按品类，写清为什么这么分（如新客首单流失率是老客 3 倍）\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 画四段路径：每段写行为（用户在这页做什么）、关键指标（该段转化率与人数）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 标流失点：每段挑一个最大流失点，写「现象 + 三条假设 + 证据强度」\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 写验证动作：每条假设对应查哪张表、看哪个指标、多久出结论、责任人岗位\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写不覆盖范围：本批次缺哪些节点的数据（如支付失败、售后），明确不下结论\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【用户分层与旅程地图 · 新客首单】产品：优选生活馆　周期：10/19–10/25\n\n■ 一、分层依据\n按「新客 / 老客」分层，不用品类分层。理由：同期数据显示新客首单转化 1.8%，老客复购转化 4.2%，差 2.4 个百分点，问题集中在首单；按品类分反而看不出差异（四件套 2.1% / 被芯 2.3%）。\n口径：新客 = 首次下单用户；转化 = 支付人数 ÷ 商详 UV；窗口 = 当日 + 7 日两个口径都记。\n\n■ 二、四段路径（新客）\n1. 曝光→商详：商详 UV 12,400，点击率 6.2%（曝光 20 万）\n2. 商详→加购：加购 843 人，加购率 6.8%\n3. 加购→结算：进入结算 610 人，结算率 72.4%\n4. 结算→支付：支付 225 人，支付率 36.9%（新客当日）\n注：支付率是四段里最低的一段，且低于老客同段 61.2%。\n\n■ 三、三个流失点（现象 + 假设 + 证据强度）\n流失点 1｜结算→支付（最大流失，385 人离开）\n现象：结算页平均停留 34 秒，退出集中在「提交订单」按钮点击后的加载期。\n假设 A：运费在结算页才出现，超出心理预期（证据：强，客服工单「运费」类 21 条/周）\n假设 B：新客首单券默认不勾选，用户以为没优惠（证据：中，需查券核销率）\n假设 C：支付方式里没有用户常用的那个（证据：弱，需查支付方式分布）\n\n流失点 2｜商详→加购（加购率 6.8%，低于自家老客 9.1%）\n假设 A：规格选择区在首屏之下，用户没看到（证据：中，需看滚动深度）\n假设 B：热门规格缺货但未在列表页提示（证据：强，缺货 SKU 商详 UV 占比 28%）\n假设 C：详情页无克重与尺寸实测，用户怕买错（证据：中，承接 M1 洞察结论）\n\n流失点 3｜曝光→商详（点击率 6.2%，低于同品类自家 7.8%）\n假设 A：首图未体现「可机洗」这一核心卖点（证据：弱，需做主图 A/B）\n假设 B：价格带高于类目主流，点击意愿低（证据：中，需类目价格分布）\n假设 C：人群定向偏宽，曝光质量差（证据：中，需分渠道看点击率）\n\n■ 四、验证动作\n1. 假设 A（运费）：查结算页退出率 + 运费相关工单，7 天，责任人：数据分析\n2. 假设 B（首单券）：查首单券核销率与勾选率，5 天，责任人：会员运营\n3. 流失点 2 假设 B（缺货）：查缺货 SKU 商详 UV 与加购率对比，5 天，责任人：类目运营\n4. 流失点 3 假设 A（主图）：做 7 天主图 A/B，责任人：内容运营\n\n■ 五、本批次不覆盖\n支付失败与风控拦截（无日志权限）；售后与退货旅程（属另一条链路）；老客复购旅程（本批次只做首单）。以上四项本图不下结论。", "rubric": ["分层依据写出对比数据（如新客首单转化 1.8% vs 老客 4.2%），只写「按新老客分」不计分", "四段路径每段都有该段转化率与人数，缺一段数据按未写完计", "三个流失点各给三条假设，且至少一条是「供给问题」（库存/规格/时效），不能全是页面问题", "每条假设都挂验证动作（表名 + 指标 + 出结论时间 + 责任人岗位），缺责任人扣分"]}, {"id": "M2U4", "tier": "basic", "step": "spar", "title": "用户研究负责人挑战你的样本", "video": {"dur": "3.2min", "script": ["样本这一关过不去，后面所有洞察都会被当成轶事；但硬撑样本量，反而更快崩", "挑战清单：样本量 / 抽样偏差 / 结论外推 / 与定性访谈的关系", "「8 条会话你就敢分群？」——两种答法的差别在有没有说清外推边界"]}, "ppt": {"method": "挑战清单：样本量 / 抽样偏差 / 结论外推 / 与定性访谈的关系", "case": "「8 条会话你就敢分群？」——两种答法的差别在有没有说清外推边界", "demo": "陪练对话界面说明（把分群表粘进系统提示词，让对手按你的条目发问）"}, "objective": "能在用户研究负责人 4 轮追问下，说清样本量、抽样方式与结论外推的边界", "transfer": "把陪练里被问住的样本问题补进研究方案模板，下次拉数据前先过一遍", "vslides": [{"t": "陪练说明：她只问一件事——这结论能推多远", "n": "用户研究负责人和品牌总监不一样。品牌总监关心值不值得投钱，她关心的只有一件事：你的结论能推到哪儿。她的四把刀是：样本怎么来的、这是用户说的还是你推的、能覆盖多少人、下一步怎么验证。这一关最容易犯的错是硬撑——8 条会话非要说成「用户普遍」。她一听就知道你在撑，接着就会问「样本怎么抽的」，你就彻底被动了。正确的做法是把定位讲清楚：这 8 条是用来提假设的，不是用来下结论的；结论要靠全量数据来验。你把这句话先说出口，她反而会认真听你后面的假设。她的判断标准其实很简单：你说的话后面有没有跟一个验证动作。有，就是研究；没有，就是轶事。这一条她不会明说，但每一轮追问都在测它。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">她的三问</tspan></text><g data-k=\"样本\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">样本</tspan></text></g><g data-k=\"假设 vs 结论\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">假设 vs 结论</tspan></text></g><g data-k=\"外推边界\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">外推边界</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 63.89}, {"t": "四个方向，每个都指向「你说的话有多少分量」", "n": "第一问样本来源：哪一周、哪个入口、抽了多少条、怎么抽的。答不上来就等于没有研究。第二问证据类型：这是用户原话，还是你从行为日志推的？行为推断可以说，但必须标明是推断。第三问覆盖：四组人群加起来覆盖多少用户，占比算过没有；没算过就老实说没算。第四问优先级规则：全量数据和定性访谈冲突时以哪个为准。这一问最能看出专业度——正确答法是「全量定方向、定性解释原因」，两条腿走路，而不是挑对自己有利的那个。她还会追问「这个样本怎么抽的」——随机、分层、方便抽样，三种的结论强度差得很远，你要能报出自己用的哪种。答不上来，前面说得再漂亮也会被打回。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四个必答方向</tspan></text><g data-k=\"样本：怎么抽的\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">样本：怎么抽的</tspan></text></g><g data-k=\"证据：原话还是推断\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">证据：原话还是推断</tspan></text></g><g data-k=\"覆盖：占比多少\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">覆盖：占比多少</tspan></text></g><g data-k=\"冲突：以哪个为准\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">冲突：以哪个为准</tspan></text></g></svg>", "d": 64.37}, {"t": "通过标准：把「轶事」升级成「研究设计」", "n": "三段式在这里要突出「区分」。结论段要说清这份材料是什么性质（提假设用），依据段要给出可核对的全量数据（工单量、退货原因分布这类），边界段要给下一步验证设计。特别提醒：不要为了显得严谨，把 8 条硬凑成百分比，那是最容易被抓住的破绽。真正的专业感来自一句话——「我这 8 条能提出四类假设，验证要靠 30 天全量打标加 5 个定性访谈，两者不一致时以全量数据为准」。这句话一出，对方就知道你懂研究是怎么做的。再补一个细节：说「8 条」的时候主动报出它是「一周、自然流量、未做配额」的方便样本，比等她问出来值钱得多。主动交代局限，是专业和心虚的分界线。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"先说清材料性质\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">先说清材料性质</tspan></text></g><g data-k=\"证据分「原话」与「推断」\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">证据分「原话」与「推断」</tspan></text></g><g data-k=\"给全量数据做锚\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给全量数据做锚</tspan></text></g><g data-k=\"下一步验证设计写具体\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">下一步验证设计写具体</tspan></text></g></svg>", "d": 62.04}], "deliverable": {"type": "doc", "name": "用户分层与旅程地图", "rubric": ["样本说清", "假设与结论分开", "验证设计"], "acceptance": "四问都能区分「假设」与「结论」，说清抽样方式与外推边界，并给出下一步验证设计"}, "spar": {"role": "用户研究负责人", "persona": "做过八年用研，最恨「我观察了几个用户」；开口先问样本怎么来的，再问结论能推多远，最后一定追问「你打算怎么验证」", "mustAsk": ["8 条会话你就敢分群？样本怎么来的，能代表谁？", "你说「运费导致流失」，这是用户说的还是你从行为推的？用户原话在哪？", "这四组人群加起来能覆盖多少用户？占比你算过吗？", "如果全量数据和你的分群结论不一致，你以哪个为准？为什么？"]}, "exemplar": "（问：8 条会话你就敢分群？这是轶事不是研究。）\n\n结论：这 8 条不是用来分群的，是用来提假设的；分群结论我标了「待验证」，没有写进任何决策建议。\n依据：8 条来自同一周、同一入口的自然流量抽样，覆盖 4 类路径（价格犹豫 / 运费意外 / 缺货 / 跨端），我的用法是「每类找出一条可查的痕迹」——比如 B 组指向运费，对应客服工单 21 条/周，这条工单量是全量数据，不是 8 条里的推论。\n边界：我不把这 8 条折算成比例，也不外推到全量用户；下一步按你的建议做两件事：① 拉 30 天全量会话按同样四类打标，看占比；② 对 B 组做 5 个用户的定性访谈，确认运费是不是真的在结算页才被看到。如果两件事结论不一致，以全量数据为准，访谈只用来解释原因。", "task": "把《用户分层与旅程地图》拿到「用户研究负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《用户分层与旅程地图》。现在要让它通过「用户研究负责人」这一关。\n【对手的立场】做过八年用研，最恨「我观察了几个用户」；开口先问样本怎么来的，再问结论能推多远，最后一定追问「你打算怎么验证」。\n【他一定会追问】「8 条会话你就敢分群？样本怎么来的，能代表谁？」 / 「你说「运费导致流失」，这是用户说的还是你从行为推的？用户原话在哪？」 / 「这四组人群加起来能覆盖多少用户？占比你算过吗？」\n【场景】你说「用户研究负责人挑战你的样本」，对方立刻回一句：8 条会话你就敢分群？样本怎么来的，能代表谁？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["主动说明样本来源与规模（哪一周、哪个入口、多少条），并承认不足以外推", "每条判断都能区分「这是假设」还是「这是结论」，不把行为推断说成用户原话", "能说出下一步验证设计（全量打标 / 定性访谈 / A/B），并说明各自解决什么问题", "面对「以哪个为准」时给出明确规则（全量优先、定性解释原因），不含糊"]}, {"id": "M2U5", "tier": "adv", "step": "understand", "title": "复购驱动因素挖掘", "video": {"dur": "3.6min", "script": ["复购是零售最贵的指标，也是最容易被误诊的指标——很多团队把它当成商品问题去改", "复购四因：商品力 / 履约体验 / 关系资产 / 场景唤醒 + 可影响性判断", "某家纺店复购率从 22% 掉到 17%，最后定位到「场景唤醒缺失」而非商品问题"]}, "ppt": {"method": "复购四因：商品力 / 履约体验 / 关系资产 / 场景唤醒 + 可影响性判断", "case": "某家纺店复购率从 22% 掉到 17%，最后定位到「场景唤醒缺失」而非商品问题", "demo": "同一组复购数按四因拆两遍：先按品类，再按首单来源，看结论差异"}, "objective": "能用「复购四因」拆解复购率变化，并判断哪一因是可被产品动作影响的", "transfer": "把本店复购率按四因拆一遍，挑一个可影响的因素写成一条实验假设发到项目群", "vslides": [{"t": "开场：复购掉下来，先别急着改商品", "n": "复购率是零售最贵的指标：拉一个新客的成本通常是维护一个老客的三到五倍。所以复购一掉，会议室里第一反应往往是「商品不行了」。但复购至少由四件事共同决定。第一，商品力：东西好不好用，直接决定他会不会再买同类。第二，履约体验：发货快不快、包装有没有破损、退换麻不麻烦。第三，关系资产：他有没有会员身份、有没有积分、有没有被分层运营。第四，场景唤醒：换季、补货周期、节庆，有没有人在对的时间提醒他。这四因里，只有第三和第四是产品团队能直接动的，第一属选品与供应链，第二属仓配。搞不清是哪一因，你的方案就只能写「提升商品力」，然后没人接。所以复购诊断的第一步不是看数，是先认领问题归属：这一因归谁管、谁签字。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">复购四因</tspan></text><g data-k=\"商品力：好不好用\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">商品力：好不好用</tspan></text></g><g data-k=\"履约：快不快、麻烦不麻烦\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">履约：快不快、麻烦不麻烦</tspan></text></g><g data-k=\"关系资产：会员/积分/分层\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">关系资产：会员/积分/分层</tspan></text></g><g data-k=\"场景唤醒：在对的时间提醒\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">场景唤醒：在对的时间提醒</tspan></text></g></svg>", "d": 71.86}, {"t": "具体动作：每一因配一组数据", "n": "商品力看两样：退货原因分布、差评主题占比。如果退货集中在「与描述不符」，那不是商品差，是内容误导；如果集中在「起球」「掉色」，才是商品问题。履约看时效达成率与破损率，按仓拆。关系资产看会员渗透率（会员数 ÷ 成交用户数）与会员复购差（会员复购率减非会员），差得越小说明会员体系没起作用。场景唤醒看触达打开率与唤醒后 7 日复购率，还要看触达时机是否卡在补货周期上——家纺的补货周期通常按换季算，一年两到三次，你在第四个月推是浪费。四组数摆在一起，才能判断哪一因是主因。四组数里只有一组明显异常，那就是主因；四组都平，多半是口径变了或者分层没做对。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"商品力：退货原因 + 差评主题\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">商品力：退货原因 + 差评主题</tspan></text></g><g data-k=\"履约：时效达成 + 破损率（按仓）\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">履约：时效达成 + 破损率（按仓）</tspan></text></g><g data-k=\"关系资产：会员渗透 + 会员复购差\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">关系资产：会员渗透 + 会员复购差</tspan></text></g><g data-k=\"场景唤醒：打开率 + 时机是否卡周期\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">场景唤醒：打开率 + 时机是否卡周期</tspan></text></g></svg>", "d": 65.9}, {"t": "边界：三处容易误判", "n": "第一处，口径不统一。全店复购 17% 和同品类复购 34% 是两个世界，跨部门吵架多半是口径没对齐；先把「复购 = 同品类 90 天内二次购买」这类定义写进文档。第二处，把「没复购」当「不想复购」。有些品类天然低频（大家电三五年一次），复购率低是结构性的，你去优化它等于白干；该看的是「同品类内升级购买」或「关联品类交叉」。第三处，用整体复购率掩盖分层差异。整体 17%，可能新客 8%、老客 45%，那两个群体的动作完全不同。所以复购诊断的输出不该是一个数，而是四因各自的判断 + 分层后的差异 + 一句「哪一因我们能动、找谁动」。还有一个小坑：复购窗口别一改再改。这个月用 90 天、下个月换 180 天，趋势图就断了，谁也看不出变化。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"先统一复购口径\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">先统一复购口径</tspan></text></g><g data-k=\"低频品类别硬做复购\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">低频品类别硬做复购</tspan></text></g><g data-k=\"必须分层看，别只看整体\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">必须分层看，别只看整体</tspan></text></g><g data-k=\"输出要写「我们能动哪一因」\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">输出要写「我们能动哪一因」</tspan></text></g></svg>", "d": 75.65}], "deliverable": {"type": "sheet", "name": "复购诊断表", "rubric": ["四因拆解", "依据充分", "可影响性"], "acceptance": "能把复购变化拆到四个因素上，每个给出判断依据，并标出哪一项产品团队能影响"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】复购四因：商品力 / 履约体验 / 关系资产 / 场景唤醒 + 可影响性判断\n【为什么重要】复购是零售最贵的指标，也是最容易被误诊的指标——很多团队把它当成商品问题去改\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["四个因素各有对应的判断数据（商品力看退货原因与差评主题、履约看时效达成、关系资产看会员渗透、场景唤醒看触达打开率）", "能指出「哪一因不是产品团队能动的」（如商品力属选品/供应链），并说明该找谁", "至少给出一条可被产品动作影响的假设，并写出验证指标与观察窗口", "能说清复购率口径（同品类复购 / 全店复购、90 天 / 180 天），口径不同结论完全不同"]}, {"id": "M2U6", "tier": "adv", "step": "demo", "title": "用 AI 做需求优先级排序", "video": {"dur": "3.3min", "script": ["优先级排序最难的不是排出顺序，而是能对没排上的人说清为什么", "四列打分（影响面 / 实现成本 / 依赖 / 证据来源）→ 排序 → 写明「不做」的理由", "「优选生活馆」8 条待排需求（客服 3 条、运营 3 条、数据 1 条、老板 1 条）"]}, "ppt": {"method": "四列打分（影响面 / 实现成本 / 依赖 / 证据来源）→ 排序 → 写明「不做」的理由", "case": "「优选生活馆」8 条待排需求（客服 3 条、运营 3 条、数据 1 条、老板 1 条）", "demo": "WorkBuddy 内跑一遍：先给每条定四列，再让模型排序，最后自己调顺序并说明理由"}, "objective": "能把 8 条来源不同的需求按「影响面 / 成本 / 依赖」排序，并说清每条排序的依据强度", "transfer": "用这套四列把手上需求池过一遍，把 P0 的三条发给研发负责人确认成本估算", "vslides": [{"t": "演示准备：8 条需求，4 个来源，互相打架", "n": "这一批需求来自四个方向：客服提了 3 条（都是工单高频问题）、运营提了 3 条（大促相关）、数据提了 1 条（埋点缺失）、老板提了 1 条（同行有这个功能）。它们互相打架，因为研发这个季度只有 20 人日。你要做的不是选哪个好听，而是让每条都进同一张表：影响面多少、成本多少、依赖谁、证据来自哪。四个字段定完，排序才有依据；否则排序就变成了「谁嗓门大谁先上」。特别提醒一句：老板提的那条未必该排最后，但也未必该排第一，取决于它的影响面能不能量化。还有一个隐形约束：这 20 人日不全给你，埋点和修 bug 通常要占三到四成，排之前先问研发要一个真实可用额度。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"8 条需求：客服 3 / 运营 3 / 数据 1 / 老板 1\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条需求：客服 3 / 运营 3 / 数据 1 / 老板 1</tspan></text></g><g data-k=\"约束：本季度 20 人日\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：本季度 20 人日</tspan></text></g><g data-k=\"四列打分 → 排序 → 明写不做\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">四列打分 → 排序 → 明写不做</tspan></text></g></svg>", "d": 62.11}, {"t": "四列怎么填才算数", "n": "影响面必须数字化：多少用户、多少订单、多少工单/周。写「影响较大」等于没写。成本用人日，并且注明是谁估的——研发估的和产品估的差一倍很常见。依赖列最容易漏：需要中台接口、需要法务口径、需要设计稿，这些不写清，排进 P0 也会卡住。证据来源写到能被查到：工单系统里搜哪个关键词、哪张看板、谁的原话。四列填完你会发现一件有意思的事：有些需求影响面很大但证据很弱（老板那条常常如此），有些证据很强但影响面小（客服单条工单）。这时候排序规则就出来了——先看证据强度，再看影响面除以成本。还有一处细节：证据分三档——工单或看板能直接查到、需要补一次数据、只有口头。弱证据不是不能做，是不能占 P0。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四列打分表</tspan></text><g data-k=\"影响面：多少用户/订单/工单\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">影响面：多少用户/订单/工单</tspan></text></g><g data-k=\"成本：人日 + 谁估的\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">成本：人日 + 谁估的</tspan></text></g><g data-k=\"依赖：谁要先动\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">依赖：谁要先动</tspan></text></g><g data-k=\"证据：哪里能查到\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">证据：哪里能查到</tspan></text></g></svg>", "d": 71.14}, {"t": "模型会替你做两件不该做的事", "n": "第一件，它会给你一个行业基准，比如「结算页优化平均提升 8%-12%」，用来支撑排序。这个数没有来源、没有口径，一旦被问「哪份报告」，整张表就废了。第二件，它会替你下结论「P0 三条优先」，但它没有依赖数据——真正会卡住的往往是依赖，不是优先级。所以你的动作是：把依赖列补全，把待补证据的需求降级，然后自己重排一次顺序，并在会上说清「为什么这条排后面」。「不做的理由」这一节一定要写，它是给没排上的人看的：不是忘了你，是这个季度成本拿不下来。最后一点：排序结果发出去时，同时给每个提需求的人发一份「本期不做」清单并附重启条件，能省掉后面两周的追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">模型做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人来做</tspan></text><g data-k=\"排序建议 / 分组归类\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">排序建议 / 分组归类</tspan></text></g><g data-k=\"补依赖 / 降待补证据的级 / 写不做的理由\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">补依赖 / 降待补证据的级</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\"> / 写不做的理由</tspan></text></g></svg>", "d": 63.36}], "deliverable": {"type": "doc", "name": "需求优先级清单（含不做清单）", "rubric": ["四列完整", "排序有据", "不做的理由"], "acceptance": "8 条需求每条都有四列判定与排序理由；P0 不超过 3 条，且每条 P0 都有证据来源"}, "demo": {"ref": "■ 排序结果（P0 / P1 / P2）\n\nP0-1｜结算页运费前置提示（来源：客服工单 21 条/周；影响面：新客结算 385 人/周；成本：前端 3 人日；依赖：无）\nP0-2｜缺货规格在列表页提示（来源：缺货 SKU 商详 UV 占 28%；影响面：约 3400 UV/周；成本：前端 2 人日 + 中台接口；依赖：中台库存接口）\nP0-3｜首单券默认勾选（来源：会员运营；影响面：待补券核销率；成本：前端 1 人日；依赖：无）\n\nP1-1｜规格选择区上移（影响面：加购率 6.8% 待提升；成本：前端 2 人日；依赖：需设计稿）\nP1-2｜主图 A/B 测试能力（来源：内容运营；成本：需实验平台；依赖：实验平台排期）\nP1-3｜支付方式补充（证据：弱，需先查支付方式分布）\n\nP2-1｜售后旅程改造（成本：跨三团队，季度内不可完成）\nP2-2｜会员等级体系重构（依赖：会员中心重构，未立项）\n\n■ 建议：P0 三条优先，因为都在结算与商详两个高流失节点，且成本都在 3 人日内。\n■ 补充：行业数据显示结算页优化平均可提升转化 8%-12%，建议尽快上线。", "fix": ["「行业数据平均提升 8%-12%」删掉——没有来源的区间估算，进汇报就是雷", "P0-3「首单券默认勾选」影响面还是「待补」，不能排进 P0；改为「先补券核销率，达标再进 P0」", "把「建议 P0 三条优先」改成按依赖排序：P0-2 依赖中台接口，要先确认排期，否则会卡住", "补一节「本期不做」的明确理由：P2-1 跨三团队，P2-2 依赖未立项，写在清单里让对方知道不是忘了"], "judge": "判断依据：影响面有没有数字；依赖有没有写清；P0 是否都拿得出证据；有没有把「待补证据」的需求硬排进 P0；不做的理由是否具体", "sheet": {"situ": "本季度研发只有 20 人日，你手上有 8 条需求，来自客服、运营、数据和老板。每条都有人催，你要给出一张能摆到会上的排序表——包括哪几条这季度不做。", "ask": "① 逐条判：需求来自谁、影响面多大、成本多少、依赖谁、排到哪一档；② 用你的表请 AI 给排序与理由；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 给出排序（P0/P1/P2）并说明每条的排序依据；② 指出哪几条证据不足、应先补证据；③ 列出本期建议不做的需求与理由。\n禁止编造未给出的影响面或成本数字，也不要引用没有出处的行业提升区间。", "mats": [{"id": "R1", "src": "客服提报", "text": "结算页运费太晚出现，用户看到运费就跑了。工单关键词「运费」21 条/周，涉及新客结算流出约 385 人/周。"}, {"id": "R2", "src": "数据提报", "text": "缺货 SKU 在列表页没有提示，用户点进商详才发现。缺货 SKU 商详 UV 占 28%，约 3400 UV/周。"}, {"id": "R3", "src": "运营提报", "text": "新客首单券默认不勾选，很多人不知道有券。券核销率与勾选率目前没人算过。"}, {"id": "R4", "src": "数据提报", "text": "规格选择区在首屏之下，用户看不到。加购率 6.8%，目标提到 9%，需设计稿。"}, {"id": "R5", "src": "运营提报", "text": "想做主图 A/B 测试，但没有实验平台，目前只能手工替换对比。"}, {"id": "R6", "src": "客服提报", "text": "有用户反映支付方式不全，但工单只有 4 条，也没说缺哪个渠道。"}, {"id": "R7", "src": "客服提报", "text": "售后改期要联系客服，用户希望自助改。工单 15 条/周，需动履约系统。"}, {"id": "R8", "src": "老板提报", "text": "竞品有会员等级体系，我们也该有，涉及会员中心重构，目前未立项。"}], "cols": [{"k": "src", "name": "谁提的", "hint": "来源本身是证据强度的一部分", "type": "chips", "w": 2, "tags": ["客服", "运营", "数据", "老板"]}, {"k": "face", "name": "影响面", "hint": "能算出数字就选数字，算不出选「无法量化」", "type": "chips", "w": 3, "tags": ["新客结算 385 人/周", "缺货 SKU 3400 UV/周", "加购率 6.8%→9%", "工单 15 条/周", "无法量化"]}, {"k": "cost", "name": "成本", "hint": "按人日档位估", "type": "chips", "w": 2, "tags": ["1 人日", "2-3 人日", "5 人日以上", "跨团队"]}, {"k": "dep", "name": "依赖", "hint": "谁要先动；没有就选「无」", "type": "chips", "w": 2, "tags": ["无", "中台接口", "设计稿", "实验平台", "未立项"]}, {"k": "pri", "name": "排到哪一档", "hint": "P0 ≤ 3 条；证据不足放「待补证据」", "type": "chips", "w": 2, "tags": ["P0", "P1", "P2", "待补证据"]}], "key": {"R1": {"src": "客服", "face": "新客结算 385 人/周", "cost": "2-3 人日", "dep": "无", "pri": "P0"}, "R2": {"src": "数据", "face": "缺货 SKU 3400 UV/周", "cost": "2-3 人日", "dep": "中台接口", "pri": "P0"}, "R3": {"src": "运营", "face": "无法量化", "cost": "1 人日", "dep": "无", "pri": "待补证据"}, "R4": {"src": "数据", "face": "加购率 6.8%→9%", "cost": "2-3 人日", "dep": "设计稿", "pri": "P1"}, "R5": {"src": "运营", "face": "无法量化", "cost": "5 人日以上", "dep": "实验平台", "pri": "P2"}, "R6": {"src": "客服", "face": "无法量化", "cost": "2-3 人日", "dep": "中台接口", "pri": "待补证据"}, "R7": {"src": "客服", "face": "工单 15 条/周", "cost": "跨团队", "dep": "无", "pri": "P1"}, "R8": {"src": "老板", "face": "无法量化", "cost": "跨团队", "dep": "未立项", "pri": "P2"}}, "notes": {"R3·pri": "影响面「没人算过」就不能排 P0——先补券核销率，达标再进；直接排 P0 会在评审会上被问「能带来多少单」而答不上来", "R8·pri": "老板提的不等于优先：影响面无法量化、依赖未立项、成本跨团队，只能 P2。但理由要写进清单，会上要能说清「不是不做，是这季度做不了」", "R7·cost": "要动履约系统，属跨团队协作，不是「5 人日」能覆盖的估算", "R2·dep": "依赖中台库存接口，必须先确认排期；不确认就只能退化成文案提示，效果差一半", "R5·pri": "实验平台是前置能力，这条需求单独上线没有意义，所以排 P2，但要写重启条件", "R1·face": "385 人/周是结算环节流出的新客数，不是全部新客，写影响面时别夸大成「影响全部新客」", "R4·dep": "规格区上移必须先有设计稿，没有设计稿研发不动手，这是最容易漏的依赖"}, "delta": [{"op": "删", "frm": "模型补的「行业数据显示结算页优化可提升转化 8%-12%」", "to": "整句删除", "why": "没有来源、没有口径的区间估算；一旦被问「哪份报告」整张表就废了", "kw": ["行业", "8%", "12%", "平均", "提升"]}, {"op": "改", "frm": "R3 首单券被排进 P0", "to": "R3 降为「待补证据」：先补券核销率与勾选率", "why": "影响面都没有数字的需求不能占 P0 名额，P0 只有 3 个坑", "kw": ["待补", "证据", "P0", "核销率"]}, {"op": "改", "frm": "「P0 三条优先，因为都在高流失节点」", "to": "按依赖重排：R2 依赖中台接口，需先确认排期，否则会卡住", "why": "真正会拖垮 P0 的是依赖，不是优先级高低", "kw": ["依赖", "中台", "排期", "卡住"]}, {"op": "补", "frm": "（模型没写）", "to": "补一节「不做清单」：每条写成本/证据/依赖理由与重启条件", "why": "没有这一节，被砍的人会一直来问；有重启条件，团队才认这个排序", "kw": ["不做", "重启条件", "砍", "理由"]}, {"op": "补", "frm": "（模型没写）", "to": "补一张依赖地图：依赖谁、最晚确认时间、卡住的后果", "why": "依赖没有时间点就等于没有依赖，会上没人会去追", "kw": ["依赖地图", "最晚", "后果", "时间点"]}], "refsheet": "R1｜客服｜新客结算 385 人/周｜2-3 人日｜无｜P0\nR2｜数据｜缺货 SKU 3400 UV/周｜2-3 人日｜中台接口｜P0\nR3｜运营｜无法量化｜1 人日｜无｜待补证据\nR4｜数据｜加购率 6.8%→9%｜2-3 人日｜设计稿｜P1\nR5｜运营｜无法量化｜5 人日以上｜实验平台｜P2\nR6｜客服｜无法量化｜2-3 人日｜中台接口｜待补证据\nR7｜客服｜工单 15 条/周｜跨团队｜无｜P1\nR8｜老板｜无法量化｜跨团队｜未立项｜P2\n\n四处最容易判错的：\n· R3 / R6 都是「待补证据」不是 P0：影响面算不出来的需求不能占 P0 名额。\n· R8 是老板提的，但仍然 P2：影响面无法量化 + 依赖未立项 + 跨团队成本。\n· R7 成本是「跨团队」不是「5 人日」：动履约系统，人日估不出来。\n· R2 虽然是 P0，但依赖中台接口，排期没确认前不能承诺上线时间。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」本季度 8 条待排需求（含来源、影响面、成本估算、依赖）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 给出排序并说明每条的排序依据；② 指出哪几条证据不足、应先补证据再排；③ 列出本期建议不做的需求及理由。禁止编造未给出的影响面或成本数字。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】四列打分（影响面 / 实现成本 / 依赖 / 证据来源）→ 排序 → 写明「不做」的理由\n【参考案例】「优选生活馆」8 条待排需求（客服 3 条、运营 3 条、数据 1 条、老板 1 条）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」本季度 8 条待排需求（含来源、影响面、成本估算、依赖）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 给出排序并说明每条的排序依据；② 指出哪几条证据不足、应先补证据再排；③ 列出本期建议不做的需求及理由。禁止编造未给出的影响面或成本数字。", "rubric": ["每条需求的「影响面」用数字表达（影响多少用户 / 多少订单 / 多少工单），不写「影响较大」", "「依赖」列必须写清是否需要别的团队先动（如中台接口、法务口径），没有依赖写「无」", "P0 不超过 3 条，且每条 P0 的证据来源可追溯（工单量、数据看板、老板原话）", "至少写 2 条「本期不做」并给出理由（成本过高 / 证据不足 / 依赖未解决），不能只排做的不排不做的"]}, {"id": "M2U7", "tier": "adv", "step": "todo", "title": "产出《需求优先级清单》", "video": {"dur": "3.4min", "script": ["一份好的优先级文档，能让被砍掉的人也认可这个排序——靠的是依据，不是权力", "四列打分（影响面/成本/依赖/证据）+ 依赖地图 + 不做清单 + 复盘节奏", "「优选生活馆」Q4 需求池 12 条，20 人日约束下排出 P0/P1/P2"]}, "ppt": {"method": "四列打分（影响面/成本/依赖/证据）+ 依赖地图 + 不做清单 + 复盘节奏", "case": "「优选生活馆」Q4 需求池 12 条，20 人日约束下排出 P0/P1/P2", "demo": "清单骨架 + 一份填好的样例（含被砍掉的 5 条与理由）"}, "objective": "能产出一份带四列打分、依赖地图与不做清单的需求优先级文档，P0 每条可追溯", "transfer": "把这份清单发给研发负责人做一次成本复核，把依赖项提前一个月提给对应团队", "vslides": [{"t": "任务说明：清单要给被砍的人看", "n": "这份清单有两个读者：研发负责人要按它排期，被砍掉需求的人要按它接受「这季度不做」。所以它不能只有排序，还要有理由。结构是这样：第一节把 12 条需求列全，四列打分；第二节给出 P0/P1/P2 与理由；第三节依赖地图，写最晚确认时间；第四节待补证据；第五节不做清单，每条写重启条件；第六节复盘节奏。第三节和第五节是很多人会跳过的，但恰恰是这两节决定了清单能不能落地——依赖没确认，P0 也会卡住；没有重启条件，被砍的人会一直来问。格式上还有个要求：表格控制在一屏放得下，别做成一页装不完的 Excel，会上没人会滚动看你的第 9 行。一屏能看完的表，才有在会上被讨论的可能。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 12 条 × 四列\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 12 条 × 四列</tspan></text></g><g data-k=\"② P0/P1/P2（≤3 条 P0）\"><g><circle cx=\"42\" cy=\"66.33333333333333\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"70.83333333333333\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"70.8\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② P0/P1/P2（≤3 条 P0）</tspan></text></g><g data-k=\"③ 依赖地图 + 最晚确认时间\"><g><circle cx=\"42\" cy=\"90.66666666666666\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"95.16666666666666\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"95.2\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 依赖地图 + 最晚确认时间</tspan></text></g><g data-k=\"④ 待补证据\"><g><circle cx=\"42\" cy=\"115.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"119.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"119.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 待补证据</tspan></text></g><g data-k=\"⑤ 不做清单 + 重启条件\"><g><circle cx=\"42\" cy=\"139.33333333333331\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"143.83333333333331\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"143.8\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 不做清单 + 重启条件</tspan></text></g><g data-k=\"⑥ 复盘节奏\"><g><circle cx=\"42\" cy=\"163.66666666666666\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"168.16666666666666\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑥</text></g><text x=\"70.0\" y=\"168.2\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑥ 复盘节奏</tspan></text></g></svg>", "d": 68.88}, {"t": "为什么埋点能进 P0", "n": "举个反直觉的例子：埋点补全这种「不直接赚钱」的需求，在这份清单里排进了 P0。理由是它是前置项——没有埋点，后面规格上移、搜索纠错这两条的验收都做不了，你上线了也不知道有没有用。判断一个需求该不该进 P0，看三件事：它是不是其他需求的前置、它的证据是否可追溯、它的人日是否可控。三条都满足，即使不直接产生 GMV 也该排前面。反过来，老板提的会员重构排进 P2，不是因为不重要，是 15 人日占满整季且依赖未立项——这个理由要写在清单里，而不是在会上口头解释。再补一条判断标准：一条需求既不是前置项、证据又只有口头，这季度就不该占坑，无论谁提的。这一条最得罪人，但也最省事——省掉后面每一次解释。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">P0 的三个条件</tspan></text><g data-k=\"是否前置项\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">是否前置项</tspan></text></g><g data-k=\"证据可追溯\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">证据可追溯</tspan></text></g><g data-k=\"人日可控\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">人日可控</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 69.84}, {"t": "依赖与重启条件：清单的两条命脉", "n": "依赖地图要写三样：依赖谁、最晚什么时候确认、卡住的后果。写「后果」是为了让对方知道这不是走流程——比如「中台接口 10/31 前不确认，缺货提示就只能退化成文案提示」，这句话能让对方真的去看排期。重启条件是不做清单的核心：不是「暂不做」，而是「什么条件下重新考虑」。比如会员重构写「会员中心立项且 Q1 有 10 人日」，支付方式写「工单量升到 15 条/周」。有了这个条件，被砍的需求就有了明确的回归路径，团队也不会觉得你在拍脑袋。复盘节奏一定要写进清单：双周一次、超期即重排。没有这一条，清单发出去就变成历史文件。节奏本身就是约束力，缺了它，清单只是一份记录。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"依赖写最晚确认时间\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">依赖写最晚确认时间</tspan></text></g><g data-k=\"写清卡住的后果\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写清卡住的后果</tspan></text></g><g data-k=\"不做清单带重启条件\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不做清单带重启条件</tspan></text></g><g data-k=\"双周复盘、超期即重排\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">双周复盘、超期即重排</tspan></text></g></svg>", "d": 63.65}], "deliverable": {"type": "doc", "name": "需求优先级清单", "rubric": ["打分完整", "排序共识", "依赖前置"], "acceptance": "一份能拿去开会的清单：12 条都有四列、P0 ≤3、依赖有最晚确认时间、不做清单有重启条件"}, "practice": {"steps": ["列全需求并标来源：客服/运营/数据/老板/竞品，来源本身是证据强度的一部分", "四列打分：影响面给数字、成本给人日与估算人、依赖写谁先动、证据写哪张表能查到", "排 P0/P1/P2：P0 不超过 3 条且证据必须可追溯；证据不足的一律进「待补证据」", "画依赖地图：标出跨团队依赖与最晚确认时间，写清卡住的后果", "写不做清单：每条写理由（成本/证据/依赖）与「什么条件下会重新考虑」"], "exemplar": "【需求优先级清单 · Q4】产品：优选生活馆　约束：本季度 20 人日　编制：产品经理\n\n■ 一、需求池（12 条，含来源）\n| 编号 | 需求 | 来源 | 影响面 | 成本（人日） | 依赖 | 证据 |\n| R1 | 结算页运费前置提示 | 客服 | 新客结算 385 人/周 | 3（前端估） | 无 | 工单「运费」21 条/周 |\n| R2 | 缺货规格列表页提示 | 数据 | 缺货 SKU 商详 3400 UV/周 | 2 + 中台 | 中台库存接口 | 缺货 SKU UV 占比 28% |\n| R3 | 首单券默认勾选 | 运营 | 待补（券核销率未知） | 1 | 无 | 运营口头，待补 |\n| R4 | 规格选择区上移 | 数据 | 加购率 6.8% → 目标 9% | 2 + 设计 | 设计稿 | 滚动深度数据 |\n| R5 | 主图 A/B 能力 | 运营 | 曝光 20 万/周 | 5 | 实验平台 | 无（实验能力缺失本身是证据） |\n| R6 | 支付方式补充 | 客服 | 待补（支付分布未知） | 2 | 支付中台 | 工单 4 条/周（弱） |\n| R7 | 售后自助改期 | 客服 | 工单 15 条/周 | 6 | 履约系统 | 工单关键词可查 |\n| R8 | 会员等级重构 | 老板 | 会员 1.2 万 | 15 | 会员中心（未立项） | 竞品有 |\n| R9 | 详情页埋点补全 | 数据 | 影响所有分析 | 3 | 无 | 现有埋点缺失清单 |\n| R10 | 大促预热页模板 | 运营 | 大促预估 +8% 曝光 | 4 | 无 | 去年大促复盘 |\n| R11 | 搜索纠错提示 | 运营 | 无结果率 9.2% | 4 | 搜索中台 | 无结果率看板 |\n| R12 | 评价晒图激励 | 运营 | 评价率 3.1% | 5 | 无 | 评价率看板 |\n\n■ 二、排序结果\nP0（3 条）：R1 运费前置、R2 缺货提示、R9 埋点补全\nP1（5 条）：R4 规格上移、R7 售后改期、R11 搜索纠错、R12 晒图激励、R10 预热模板\nP2（4 条）：R3 首单券、R5 实验平台、R6 支付方式、R8 会员重构\n合计约 19 人日，留 1 人日 buffer。\n理由：R9 排进 P0 看起来不直接赚钱，但没有它，R4 和 R11 的验收都做不了埋点，属于前置项。\n\n■ 三、依赖地图（最晚确认时间）\n1. R2 依赖中台库存接口：10/31 前需确认排期；卡住的后果是缺货提示做不了，只能退化成文案提示。\n2. R4 依赖设计稿：11/5 前交付；卡住的后果是 P1 整体后移一周。\n3. R5 依赖实验平台：11/15 前排期；卡住的后果是主图 A/B 只能手工比，结论不可信。\n\n■ 四、待补证据（补齐再议）\nR3 首单券：需券核销率与勾选率，5 天，会员运营。\nR6 支付方式：需支付方式分布，3 天，数据分析。\n\n■ 五、不做清单（本季度）\nR8 会员等级重构：15 人日占满整季，且依赖会员中心立项；重新考虑条件——会员中心立项且 Q1 有 10 人日。\nR5 主图 A/B：实验平台未就绪；重新考虑条件——平台 11/15 前排期到位。\nR10 大促预热模板：本季无大促；重新考虑条件——Q1 大促排期确认后提前 6 周启动。\nR12 晒图激励：影响面（评价率 3.1%）与本季目标（首单转化）不同向；重新考虑条件——首单转化达标后启动。\nR6 支付方式：证据太弱（4 条工单）；重新考虑条件——工单量升至 15 条/周或支付分布显示缺口超 20%。\n\n■ 六、复盘节奏\n双周一次，看三件事：P0 是否按期上线、依赖是否按期确认、待补证据是否补齐。超期一次即重排，不往后拖。责任人：产品经理；参与：研发负责人、数据分析。"}, "task": "产出《需求优先级清单》：列全需求并标来源：客服/运营/数据/老板/竞品，来源本身是证据强度的一部分；四列打分：影响面给数字、成本给人日与估算人、依赖写谁先动、证据写哪张表能查到；排 P0/P1/P2：P0 不超过 3 条且证据必须可追溯；证据不足的一律进「待补证据」；画依赖地图：标出跨团队依赖与最晚确认时间，写清卡住的后果；写不做清单：每条写理由（成本/证据/依赖）与「什么条件下会重新考虑」", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M2 AI 辅助需求与用户研究」模块，你要交付的是《需求优先级清单》。\n【场景】业务侧这周的诉求是：一份好的优先级文档，能让被砍掉的人也认可这个排序——靠的是依据，不是权力。参考做法：「优选生活馆」Q4 需求池 12 条，20 人日约束下排出 P0/P1/P2。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（四列打分（影响面/成本/依赖/证据）+ 依赖地图 + 不做清单 + 复盘节奏），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《需求优先级清单》填写模板】\n\n■ 1. 列全需求并标来源：客服/运营/数据/老板/竞品，来源本身是证据强度的一部分\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 四列打分：影响面给数字、成本给人日与估算人、依赖写谁先动、证据写哪张表能查到\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 排 P0/P1/P2：P0 不超过 3 条且证据必须可追溯；证据不足的一律进「待补证据」\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 画依赖地图：标出跨团队依赖与最晚确认时间，写清卡住的后果\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写不做清单：每条写理由（成本/证据/依赖）与「什么条件下会重新考虑」\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【需求优先级清单 · Q4】产品：优选生活馆　约束：本季度 20 人日　编制：产品经理\n\n■ 一、需求池（12 条，含来源）\n| 编号 | 需求 | 来源 | 影响面 | 成本（人日） | 依赖 | 证据 |\n| R1 | 结算页运费前置提示 | 客服 | 新客结算 385 人/周 | 3（前端估） | 无 | 工单「运费」21 条/周 |\n| R2 | 缺货规格列表页提示 | 数据 | 缺货 SKU 商详 3400 UV/周 | 2 + 中台 | 中台库存接口 | 缺货 SKU UV 占比 28% |\n| R3 | 首单券默认勾选 | 运营 | 待补（券核销率未知） | 1 | 无 | 运营口头，待补 |\n| R4 | 规格选择区上移 | 数据 | 加购率 6.8% → 目标 9% | 2 + 设计 | 设计稿 | 滚动深度数据 |\n| R5 | 主图 A/B 能力 | 运营 | 曝光 20 万/周 | 5 | 实验平台 | 无（实验能力缺失本身是证据） |\n| R6 | 支付方式补充 | 客服 | 待补（支付分布未知） | 2 | 支付中台 | 工单 4 条/周（弱） |\n| R7 | 售后自助改期 | 客服 | 工单 15 条/周 | 6 | 履约系统 | 工单关键词可查 |\n| R8 | 会员等级重构 | 老板 | 会员 1.2 万 | 15 | 会员中心（未立项） | 竞品有 |\n| R9 | 详情页埋点补全 | 数据 | 影响所有分析 | 3 | 无 | 现有埋点缺失清单 |\n| R10 | 大促预热页模板 | 运营 | 大促预估 +8% 曝光 | 4 | 无 | 去年大促复盘 |\n| R11 | 搜索纠错提示 | 运营 | 无结果率 9.2% | 4 | 搜索中台 | 无结果率看板 |\n| R12 | 评价晒图激励 | 运营 | 评价率 3.1% | 5 | 无 | 评价率看板 |\n\n■ 二、排序结果\nP0（3 条）：R1 运费前置、R2 缺货提示、R9 埋点补全\nP1（5 条）：R4 规格上移、R7 售后改期、R11 搜索纠错、R12 晒图激励、R10 预热模板\nP2（4 条）：R3 首单券、R5 实验平台、R6 支付方式、R8 会员重构\n合计约 19 人日，留 1 人日 buffer。\n理由：R9 排进 P0 看起来不直接赚钱，但没有它，R4 和 R11 的验收都做不了埋点，属于前置项。\n\n■ 三、依赖地图（最晚确认时间）\n1. R2 依赖中台库存接口：10/31 前需确认排期；卡住的后果是缺货提示做不了，只能退化成文案提示。\n2. R4 依赖设计稿：11/5 前交付；卡住的后果是 P1 整体后移一周。\n3. R5 依赖实验平台：11/15 前排期；卡住的后果是主图 A/B 只能手工比，结论不可信。\n\n■ 四、待补证据（补齐再议）\nR3 首单券：需券核销率与勾选率，5 天，会员运营。\nR6 支付方式：需支付方式分布，3 天，数据分析。\n\n■ 五、不做清单（本季度）\nR8 会员等级重构：15 人日占满整季，且依赖会员中心立项；重新考虑条件——会员中心立项且 Q1 有 10 人日。\nR5 主图 A/B：实验平台未就绪；重新考虑条件——平台 11/15 前排期到位。\nR10 大促预热模板：本季无大促；重新考虑条件——Q1 大促排期确认后提前 6 周启动。\nR12 晒图激励：影响面（评价率 3.1%）与本季目标（首单转化）不同向；重新考虑条件——首单转化达标后启动。\nR6 支付方式：证据太弱（4 条工单）；重新考虑条件——工单量升至 15 条/周或支付分布显示缺口超 20%。\n\n■ 六、复盘节奏\n双周一次，看三件事：P0 是否按期上线、依赖是否按期确认、待补证据是否补齐。超期一次即重排，不往后拖。责任人：产品经理；参与：研发负责人、数据分析。", "rubric": ["每条需求四列齐全，影响面必须有数字（用户数/订单数/工单量），写「较大」不计分", "P0 不超过 3 条，且每条 P0 的证据来源能指到具体看板或工单关键词", "依赖地图标出至少 2 条跨团队依赖，每条写最晚确认时间与卡住的后果", "不做清单每条写「什么条件下重新考虑」（如成本降到 2 人日 / 证据补齐），只写「暂不做」不计分"]}, {"id": "M2U8", "tier": "adv", "step": "spar", "title": "技术负责人挑战需求可行性", "video": {"dur": "3.3min", "script": ["技术负责人的每一次追问，本质上都在问：这个范围里有没有可以不做的东西", "挑战清单：范围能否再切 / 依赖是否真实 / 降级方案 / 验收口径", "「整条链路都要改？」——把需求切成三次上线后，工时从 15 人日降到 6 人日"]}, "ppt": {"method": "挑战清单：范围能否再切 / 依赖是否真实 / 降级方案 / 验收口径", "case": "「整条链路都要改？」——把需求切成三次上线后，工时从 15 人日降到 6 人日", "demo": "陪练对话界面说明（把优先级清单粘进系统提示词，让对手按你的依赖发问）"}, "objective": "能在技术负责人 4 轮追问下，把需求拆成可独立上线的范围，并说清降级方案与验收口径", "transfer": "把 P0 里最容易被质疑的那条按「最小可上线范围」重写一遍，发给研发确认工时", "vslides": [{"t": "陪练说明：他问的每一句都在找「可以不做的东西」", "n": "技术负责人不是来否你的需求，他是来找范围的。他问「能不能砍」不是不想做，是季度排期就那么多，你能砍一半，这事就能进；砍不动，就只能排队。他的四句话几乎固定：范围能不能切、依赖有没有落实、只做一半有没有意义、验收看什么。这一关的核心能力是「切需求」——把一个 15 人日的需求切成 2 人日的第一次上线，而且第一次上线单独看也有价值。做不到这一点，你的需求就会永远停在「下季度再说」。反过来说，如果你能主动砍掉一半范围，他通常会把剩下的部分提前排——这就是技术负责人给资源的真实逻辑。他要的不是你把事做大，而是你能把事做小还站得住；范围越小，他越敢给排期。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他给的三道关</tspan></text><g data-k=\"切范围\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">切范围</tspan></text></g><g data-k=\"坐实依赖\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">坐实依赖</tspan></text></g><g data-k=\"定验收\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">定验收</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 63.12}, {"t": "怎么切：按「用户是否感知到」切", "n": "切需求有三个常用维度。第一，按页面切：先在一个页面做，验证有效再铺开。第二，按人群切：先对新客做，老客不动。第三，按数据链路切：先做展示，后做计算。这个案例用的是第三种——运费金额本来要等结算页才算，但其实购物车页就能用现有接口估出来，这样完全不动结算链路，2 人日搞定。切的时候守一条原则：第一次上线要能独立产生用户可感知的变化，否则切了也白切。像「只把字段加上、页面不展现」这种切法，用户感知不到，验证不了，等于没做。切的时候还要注意：第一次上线最好能独立回滚，出问题十分钟能关掉，他才敢让你上。回滚开关最好在需求文档里就写成一节，而不是上线前临时补。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三种切法</tspan></text><g data-k=\"按页面切：先一页\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">按页面切：先一页</tspan></text></g><g data-k=\"按人群切：先新客\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">按人群切：先新客</tspan></text></g><g data-k=\"按链路切：先展示后计算\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">按链路切：先展示</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\">后计算</tspan></text></g></svg>", "d": 68.95}, {"t": "依赖要坐实，验收要能算账", "n": "说「接口应该有」是最容易被当场否掉的一句。正确说法是：「我确认过运费模板接口返回 estimated_freight 字段，和后端小王对过，能直接用」。依赖坐实的标准是能报出接口名或字段名 + 谁确认的。最后是验收：写清指标、基线、目标、观察窗口、不达标怎么办。比如「运费工单量从 21 条/周降到 10 条以下，观察 14 天；若没降，说明问题不在运费，我撤回判断」。这句话会让技术负责人放心，因为它说明你不是在赌，你有退路。最后提醒：别用「我保证这次能提升 10%」换资源。他听过太多保证，他要的是「错了怎么退」。把退路写清楚反而更容易拿到资源，因为你把风险从他身上接了过来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"接口报到字段名\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">接口报到字段名</tspan></text></g><g data-k=\"说清谁确认过\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">说清谁确认过</tspan></text></g><g data-k=\"验收有基线有窗口\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">验收有基线有窗口</tspan></text></g><g data-k=\"不达标有撤回动作\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不达标有撤回动作</tspan></text></g></svg>", "d": 67.46}], "deliverable": {"type": "doc", "name": "需求优先级清单", "rubric": ["范围可切", "依赖坐实", "验收可量化"], "acceptance": "四问都能给出切分后的范围、真实可用的接口依据、降级方案与可量化的验收口径"}, "spar": {"role": "技术负责人", "persona": "带过多年交易链路，最烦「整条链路都要改」；只问范围、依赖、能不能降级，口头禅是「这个不动行不行」「接口谁给你」", "mustAsk": ["这条要动结算链路，15 人日，这个季度排不进去，能不能砍？", "你说运费要提前展示，那运费怎么算？接口有吗，谁给你？", "如果只做一半，用户看到运费还是不下单，你怎么办？", "验收看什么？工单量掉多少算成功，掉不下来算谁的？"]}, "exemplar": "（问：这条需求要动结算链路，15 人日，你这个季度排不进去，能不能砍？）\n\n结论：能砍成两次上线。第一次只做「运费在购物车页展示预计金额」，不动结算链路，2 人日；第二次等结算改版时顺带做。\n依据：结算页退出集中在提交订单后的加载期，但运费金额是在更早的购物车页就能算出来的——只要商品重量和收货地区有值，购物车页就能给「预计运费」。这条不需要动结算，用的是现有运费模板接口，我确认过接口有返回 estimated_freight 字段。\n边界：第一次上线不含「包邮门槛凑单提示」，那部分依赖促销引擎，我放到第二次；验收口径是购物车页运费展示率与「运费」工单量，观察 14 天，若工单量没降，说明不是运费问题，我撤回这个判断，回去查支付方式。", "task": "把《需求优先级清单》拿到「技术负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《需求优先级清单》。现在要让它通过「技术负责人」这一关。\n【对手的立场】带过多年交易链路，最烦「整条链路都要改」；只问范围、依赖、能不能降级，口头禅是「这个不动行不行」「接口谁给你」。\n【他一定会追问】「这条要动结算链路，15 人日，这个季度排不进去，能不能砍？」 / 「你说运费要提前展示，那运费怎么算？接口有吗，谁给你？」 / 「如果只做一半，用户看到运费还是不下单，你怎么办？」\n【场景】你说「技术负责人挑战需求可行性」，对方立刻回一句：这条要动结算链路，15 人日，这个季度排不进去，能不能砍？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能把需求切成两次上线，并说明第一次的最小范围（哪些明确不做）", "依赖不写「应该有了」，要写出接口名或字段名，并说明谁确认过", "给出「只做一半仍然可能有价值」的理由，或者老实说「只做一半没意义，必须一起上」", "验收口径可量化（工单量从多少降到多少、观察几天），并说明不达标时怎么处理"]}]}, {"id": "M3", "title": "M3 AI 辅助 PRD 与产品定义", "dims": ["content", "prompt", "data"], "units": [{"id": "M3U1", "tier": "basic", "step": "understand", "title": "一句话需求 → 结构化 PRD", "video": {"dur": "3.6min", "script": ["老板的一句话，不能直接当需求；结构化才防返工", "PRD 骨架图（背景 / 目标 / 范围 / 指标）", "「提升详情页转化」从一句话到一页 PRD"]}, "ppt": {"method": "PRD 骨架图（背景 / 目标 / 范围 / 指标）", "case": "「提升详情页转化」从一句话到一页 PRD", "demo": "PRD 骨架对照卡：每节回答一个问题"}, "objective": "能判断一句话需求缺哪几项信息，并补成目标 / 范围 / 指标都可衡量的需求描述", "transfer": "把手头最近一条口头需求按五节骨架重写，发给提需求的人确认一次再开工", "vslides": [{"t": "开场：一句话不是需求", "n": "老板走过来说，详情页转化不行，改一下吧。这句话听起来是需求，其实只是一个方向。它至少藏着五个没定的问题：改哪个类目的详情页、现在的转化到底是多少、差是相对同行还是相对上个月、具体改哪一块、多久要看到变化。这五个问题里任何一个没定，研发就只能靠猜，猜错就返工。拆完别自己闷着改，拿着这五个问题回去跟提需求的人对一次。十分钟能省两周——返工几乎都发生在没对过的地方。PRD 的价值不在于写得长，而在于把这句话里的「未定」一条条钉死。判断一份 PRD 合不合格，有个很实用的标准：研发能不能在完全不问你、也不开会的情况下开工？能，就是合格的 PRD；不能，那就是一份会议纪要。见过最典型的一份：三行字写了「优化详情页、提升转化」，研发做了两周，交付时老板说「我说的不是这个页面」——两周的成本，全花
