个 SKU 转化腰斩；大促后一周整体回落 20%；支付失败率翻了近四倍；新客首单掉了 2 个点；还有个品类转化涨了 30%。听着都很急，但实际上这一周里至少有两条根本不用管，还有一条你绝对不能直接改产品。为什么？因为埋点刚升级过，全站掉 18% 很可能是统计口径变了；大促后回落 20% 去年也是一样，那是节奏不是问题。判断顺序错了，你会把人日全花在假问题上。顺序应该是：先判这条数可不可信，再判它重不重要，最后才谈怎么归因。判错的成本是整天的人日。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"8 条异动：渠道 / 全站 / 页面 / 价格 / 支付 / 分群\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条异动：渠道 / 全站 / 页面 / 价格 / 支付 / 分群</tspan></text></g><g data-k=\"混着真问题、口径变化、季节回落、样本过小\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">混着真问题、口径变化、季节回落、样本过小</tspan></text></g><g data-k=\"先判真假，再谈归因\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">先判真假，再谈归因</tspan></text></g></svg>", "d": 69.67}, {"t": "四列判定：真假、维度、证据、首动作", "n": "第一列判真假，只有三档：真下降、假信号、样本不足。假信号还要写明类型——口径（埋点改了、指标定义变了）、节奏（大促后回落、节假日）、样本（基数太小波动大）。第二列给真问题定维度：渠道质量、页面转化、价格、供给、支付通道，维度定错，方案就全错。第三列证据强度，日志能直接看出来的算强，要交叉验证的算中。第四列首动作，这一列最能看出专业度：假信号的首动作一定是「先查口径或等样本」，不是「改页面」；真问题的首动作才是「查明细、做实验」。这四列不是流程，是防止你在一个假信号上开一整天会。顺序对了，半天就能定下来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四列判定</tspan></text><g data-k=\"真假（三档）\"><rect x=\"18.0\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"56.8\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"56.8\">真假（三档</tspan><tspan x=\"56.8\" dy=\"14.950000000000001\">）</tspan></text></g><g data-k=\"维度（五类）\"><rect x=\"113.5\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.2\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.2\">维度（五类</tspan><tspan x=\"152.2\" dy=\"14.950000000000001\">）</tspan></text></g><g data-k=\"证据（强/中/弱）\"><rect x=\"209.0\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.8\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.8\">证据（强/</tspan><tspan x=\"247.8\" dy=\"14.950000000000001\">中/弱）</tspan></text></g><g data-k=\"首动作\"><rect x=\"304.5\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"343.2\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"343.2\">首动作</tspan></text></g></svg>", "d": 62.54}, {"t": "模型的活与人的活：它能归因，不能替你判断真假", "n": "字段齐了，模型很擅长做归因：给你三条可能原因、按可能性排序、指出哪条最值得先查。但它有两个死穴。第一，它不知道你的埋点刚改过——除非你告诉它，否则它会把口径变化当成真实下降，然后给你一套改页面的方案，方案写得很专业，方向全错。第二，它喜欢补行业基准，比如「行业平均转化 2.8%，我们略低属正常波动」，这个数没有来源，而且「正常波动」这四个字会让你放过真正的问题。所以你要做的是：把上下文（埋点改版、大促节奏、样本量）写进表里喂给它，然后由你来判真假，它只负责归因和排优先级。还有一个坑：它默认「环比下降就是问题」，而零售的季节性波动经常比真实问题更大。季节性判断要先看去年同期。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">模型做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人来做</tspan></text><g data-k=\"归因 / 排可能性 / 给查法\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">归因 / 排可能性 / 给查</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">法</tspan></text></g><g data-k=\"判真假 / 补上下文 / 挡行业基准\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">判真假 / 补上下文 / 挡</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">行业基准</tspan></text></g></svg>", "d": 71.38}], "deliverable": {"type": "sheet", "name": "异动归因表", "rubric": ["真假判定", "归因维度", "首动作"], "acceptance": "8 条异动每条都判了真假与首动作；假信号写清是哪一类，真问题写清证据强度"}, "demo": {"ref": "■ 异动判定（8 条）\n\nD01｜信息流渠道 UV +40%、支付转化 0.8%（其余渠道 2.6%）\n判定：真问题（渠道质量）｜证据：强｜首动作：查渠道定向与素材，必要时降预算\n\nD02｜全站转化 -18%，同期埋点 SDK 刚升级\n判定：假信号（口径）｜证据：强｜首动作：先对埋点版本做数据校验，别急着改页面\n\nD03｜商详→加购 -3.1 个点，同期上线强制登录弹窗\n判定：真问题（页面）｜证据：强｜首动作：查弹窗曝光与关闭率，做一次关闭实验\n\nD04｜某 SKU 转化 -52%，价格上调 15%\n判定：真问题（价格）｜证据：中（需看竞品同期价格）｜首动作：拉竞品价格对照\n\nD05｜大促后一周转化 -20%，去年同期同样回落 19%\n判定：假信号（节奏）｜证据：强｜首动作：不做动作，记录为季节性\n\nD06｜支付失败率 1.2% → 4.5%，集中在某银行通道\n判定：真问题（支付通道）｜证据：强｜首动作：联系通道方，先切备用通道\n\nD07｜新客首单转化 -2 点，老客持平\n判定：真问题（分层）｜证据：中｜首动作：按来源渠道拆新客，定位是否投放结构变化\n\nD08｜某品类转化 +30%，同期仅 40 单\n判定：样本不足｜证据：强（样本小是确定的）｜首动作：等样本到 200 单再看\n\n■ 结论：8 条里真问题 4 条、假信号 2 条、样本不足 1 条、分层 1 条。\n■ 建议：优先处理 D02 口径问题，因为它会让后面所有分析都不可信。\n■ 补充：行业平均转化率 2.8%，我们 2.6% 略低，属于正常波动。", "fix": ["「行业平均转化率 2.8%」整句删掉——素材里没有这个数，也没有可比口径", "D04「需看竞品同期价格」保留，但补一句「若竞品未同步调价，则确认为价格敏感」——把验证条件写实", "D08 从「真问题」口径里挪出来，单列为「样本不足」，不要和建议一起排序", "把「优先处理 D02」的理由写清：口径问题会污染后续所有归因，不是它影响最大，而是它最靠前"], "judge": "判断依据：有没有把埋点改版当真实下降；有没有拿 40 单下结论；假信号的动作是不是「先查口径」而不是「改产品」；结论有没有编造行业基准", "sheet": {"situ": "双十一刚过一周，看板一片红绿，运营把 8 条异动丢给你。里面混着真问题、埋点改版造成的假下降、季节性回落、还有只有 40 单的小样本。你要先判哪条值得动，再谈怎么归因。", "ask": "① 逐条判：这是真下降、假信号还是样本不足；归到哪个维度；证据多强；第一步干什么；② 用你的表请 AI 归因并排优先级；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 判断每条是真下降、假信号还是样本不足，说明依据；② 对真下降给出归因维度与第一步动作；③ 指出哪一条是被总量掩盖的。\n禁止补充表中没有的数据，也不要引用没有出处的行业基准。", "mats": [{"id": "D01", "src": "渠道看板", "text": "信息流渠道：UV 环比 +40%，支付转化 0.8%；其余渠道合计支付转化 2.6%。\n该渠道历史转化 2.1%（近 90 天）。"}, {"id": "D02", "src": "全站看板", "text": "全站支付转化环比 -18%，从 2.9% 掉到 2.4%。\n同期埋点 SDK 从 v3 升级到 v4，升级时间与下跌起点同一天。"}, {"id": "D03", "src": "页面看板", "text": "商详→加购环比 -3.1 个点。\n同期商详页上线了强制登录弹窗，弹窗曝光率 92%。"}, {"id": "D04", "src": "单品看板", "text": "某 SKU 支付转化 -52%，该 SKU 一周前零售价上调 15%。\n竞品同期价格未核实。"}, {"id": "D05", "src": "全站看板", "text": "大促后一周全站转化 -20%。\n去年同期同样回落 19%，今年大促时间与去年相差两天。"}, {"id": "D06", "src": "支付看板", "text": "支付失败率从 1.2% 升到 4.5%，其中 82% 失败集中在某一家银行的通道。"}, {"id": "D07", "src": "分群看板", "text": "新客首单支付转化 -2 个点，老客复购转化持平（波动在 0.1 点内）。\n同期投放渠道结构从搜索为主转为信息流为主。"}, {"id": "D08", "src": "品类看板", "text": "某新品类支付转化 +30%（从 1.0% 到 1.3%）。\n该品类本周支付订单数 40 单。"}], "cols": [{"k": "real", "name": "这是什么", "hint": "真下降 / 假信号（分口径与节奏）/ 样本不足", "type": "chips", "w": 3, "tags": ["真下降", "假信号·口径", "假信号·节奏", "样本不足"]}, {"k": "dim", "name": "归到哪个维度", "hint": "从词表里选", "type": "chips", "w": 3, "tags": ["渠道质量", "页面转化", "价格", "供给库存", "支付通道", "分群结构", "统计口径", "季节节奏", "样本规模"]}, {"k": "ev", "name": "证据强度", "hint": "强 / 中 / 弱", "type": "chips", "w": 2, "tags": ["强", "中", "弱"]}, {"k": "act", "name": "第一步做什么", "hint": "假信号的第一步一定是查数据", "type": "chips", "w": 3, "tags": ["查埋点口径", "查渠道定向", "查页面改动", "拉竞品价格", "对比去年同期", "等样本变大", "联系支付通道", "按来源拆新客"]}], "key": {"D01": {"real": "真下降", "dim": "渠道质量", "ev": "强", "act": "查渠道定向"}, "D02": {"real": "假信号·口径", "dim": "统计口径", "ev": "强", "act": "查埋点口径"}, "D03": {"real": "真下降", "dim": "页面转化", "ev": "强", "act": "查页面改动"}, "D04": {"real": "真下降", "dim": "价格", "ev": "中", "act": "拉竞品价格"}, "D05": {"real": "假信号·节奏", "dim": "季节节奏", "ev": "强", "act": "对比去年同期"}, "D06": {"real": "真下降", "dim": "支付通道", "ev": "强", "act": "联系支付通道"}, "D07": {"real": "真下降", "dim": "分群结构", "ev": "中", "act": "按来源拆新客"}, "D08": {"real": "样本不足", "dim": "样本规模", "ev": "强", "act": "等样本变大"}}, "notes": {"D02·real": "埋点升级当天开始掉，先查口径。假信号的第一动作永远是查数据，不是改产品——你要是先去改页面，两周后会发现白改，还找不到原因", "D05·real": "去年同期同样回落 19%，这是节奏不是问题。判成真问题，你每个月都要白改一次", "D08·real": "40 单的 +30% 是噪声，样本到 200 单再看。这类异动最容易让人兴奋，也最容易白高兴", "D01·dim": "该渠道历史转化 2.1%，现在 0.8%，是渠道质量不是页面——同一个落地页在其他渠道是 2.6%", "D07·dim": "新客掉、老客平，归「分群结构」，要去拆新客来源；别一上来就归到「全站转化」", "D06·dim": "82% 集中在单一通道，归「支付通道」，不是全站支付体验；这也是最能马上修的一个", "D04·ev": "价格上调 15% 但没看竞品同期价，证据只能算「中」——竞品没涨，才能确认是价格敏感"}, "delta": [{"op": "删", "frm": "模型补的「行业平均转化率 2.8%，我们略低属正常波动」", "to": "整句删除", "why": "没有可比口径的基准，而且「正常波动」四个字会让你放过真正的问题", "kw": ["行业", "2.8", "平均", "正常波动"]}, {"op": "改", "frm": "D08 被写成「新品类表现优异，建议加大投入」", "to": "D08 列为「样本不足」，等订单到 200 单再判断", "why": "40 单的波动是噪声；拿噪声去要预算，等于给自己埋雷", "kw": ["样本", "40 单", "等", "噪声"]}, {"op": "改", "frm": "「优先处理影响最大的 D01」", "to": "优先处理 D02（口径），因为它会让后续所有归因都不可信", "why": "优先级不只看影响面，还要看「不修它会不会污染其他结论」", "kw": ["口径", "污染", "靠前", "先修"]}, {"op": "改", "frm": "D04 直接写「价格敏感，建议回调价格」", "to": "D04 补验证条件：若竞品未同步调价，才确认为价格敏感", "why": "只有一个变量变化不足以定因果，要排除外部同向变化", "kw": ["竞品", "验证", "条件", "排除"]}, {"op": "补", "frm": "（模型没写）", "to": "补一条：整体转化持平但新客在跌、老客在涨，属于被总量掩盖", "why": "只看总量会漏掉结构性变化，而结构性变化往往才是真问题", "kw": ["掩盖", "分层", "新客", "结构"]}], "refsheet": "D01｜真下降｜渠道质量｜强｜查渠道定向\nD02｜假信号·口径｜统计口径｜强｜查埋点口径\nD03｜真下降｜页面转化｜强｜查页面改动\nD04｜真下降｜价格｜中｜拉竞品价格\nD05｜假信号·节奏｜季节节奏｜强｜对比去年同期\nD06｜真下降｜支付通道｜强｜联系支付通道\nD07｜真下降｜分群结构｜中｜按来源拆新客\nD08｜样本不足｜样本规模｜强｜等样本变大\n\n四处最容易判错的：\n· D02 不是真下降：埋点升级当天开始掉的，先查口径，别急着改页面。\n· D05 不是真下降：去年同期同样回落 19%，那是节奏，判错会让你每月白改一次。\n· D08 不是「表现优异」：40 单的 +30% 是噪声，等样本到 200 单。\n· D04 证据只算「中」：价格上调是事实，但竞品同期价没核实，不能直接定因为价格。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」双十一后一周的指标异动整理表（每条含维度、变化幅度、上下文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判断每条是真下降、假信号还是样本不足，并说明依据；② 对真下降的给出归因维度与第一步动作；③ 指出哪一条是被总量掩盖的。禁止补充表中没有的数据，也不要给出没有来源的行业基准。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】异动四列判定（维度 / 真假 / 证据 / 首动作）+ 假信号三类（口径/样本/节奏）\n【参考案例】「优选生活馆」双十一后一周 8 条指标异动（含埋点改版、样本过小、季节回落）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」双十一后一周的指标异动整理表（每条含维度、变化幅度、上下文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判断每条是真下降、假信号还是样本不足，并说明依据；② 对真下降的给出归因维度与第一步动作；③ 指出哪一条是被总量掩盖的。禁止补充表中没有的数据，也不要给出没有来源的行业基准。", "rubric": ["每条都判了「真下降 / 假信号 / 样本不足」，三类不能混为一谈（假信号要写明是哪一类：口径、样本、节奏）", "真问题要指出归因维度（渠道/页面/价格/供给/支付），且给出证据强度", "假信号的第一动作必须是「先查口径/等样本/对比去年同期」，不是直接改产品", "至少一条识别出「被总量掩盖」的情况（整体没变但某渠道大变），并说明掩盖关系"]}, {"id": "M4U3", "tier": "basic", "step": "todo", "title": "产出《增长诊断与行动清单》", "video": {"dur": "3.1min", "script": ["增长诊断的价值是让你敢说「这三件事这周不做」，而不只是列出十件可以做的事", "四乘数拆解 → 异动归因 → 动作清单（对象/预期/验收/负责人）", "「优选生活馆」Q4 增长诊断：三条动作、两条不动作、一条待验证"]}, "ppt": {"method": "四乘数拆解 → 异动归因 → 动作清单（对象/预期/验收/负责人）", "case": "「优选生活馆」Q4 增长诊断：三条动作、两条不动作、一条待验证", "demo": "清单骨架 + 一份填好的样例（每条动作带基线与观察窗口）"}, "objective": "能产出一份带拆解、归因与动作的增长诊断清单，每条动作都有基线与验收指标", "transfer": "把清单里前两条动作的本周基线数补上，发给增长负责人排到下周的实验位", "vslides": [{"t": "任务说明：清单要能说「这周不做」", "n": "增长诊断最常见的失败，是列了十几条「可以做」，然后没人做。原因不是没资源，是没优先级，也没说清哪条不用做。所以这份清单的结构要反过来：先拆解，再归因，然后只留三条动作，最后单独一节写「不动作」。三条动作的上限不是拍脑袋，是因为一个团队两周内能认真跑完并读出结论的实验，大概就三条；再多就变成全都做一半。不动作那一节同样重要：它把「假信号」和「样本不足」从待办里摘出去，让团队不用每天在群里问「那个 -18% 到底怎么回事」。清单里还要写清动作之间的相互影响，否则两个指标一涨一跌，你在会上解释不了。优先级只留三条，是纪律不是建议。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 四乘数拆解\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 四乘数拆解</tspan></text></g><g data-k=\"② 三个异动归因\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 三个异动归因</tspan></text></g><g data-k=\"③ 动作清单（≤3 条）\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 动作清单（≤3 条）</tspan></text></g><g data-k=\"④ 不动作清单（带复查日期）\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 不动作清单（带复查日期）</tspan></text></g><g data-k=\"⑤ 影响与依赖\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 影响与依赖</tspan></text></g></svg>", "d": 61.61}, {"t": "每条动作都要带基线与窗口", "n": "一条能排期的动作，长这样：对象（信息流投放，占 UV 41%）、预期（转化从 0.8% 回到 1.8% 以上）、验证指标（该渠道支付转化率）、观察窗口（7 天）、责任人（投放运营）。这里最容易漏的是基线：没有「从多少到多少」，两周后你无法判断有没有效。第二个容易漏的是窗口：7 天和 14 天结论可能相反，因为第一周有新鲜效应。第三个是责任人写到岗位，不写「大家一起」。最后提醒一句：动作之间会互相打架，比如提客单价的满减会压转化率，这类相互影响必须写在清单里，否则你在会上解释不清为什么两个指标一个涨一个跌。一个经验值：观察窗口不要短于 7 天，周内波动会盖住真实效果。窗口写清，等于给复盘定了日期。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">一条动作的五件套</tspan></text><g data-k=\"对象\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">对象</tspan></text></g><g data-k=\"基线→预期\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">基线→预期</tspan></text></g><g data-k=\"验证指标\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">验证指标</tspan></text></g><g data-k=\"观察窗口\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">观察窗口</tspan></text></g><g data-k=\"责任人\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">责任人</tspan></text></g></svg>", "d": 68.18}, {"t": "不动作也是一种决策，要留下复查日期", "n": "不动作清单写三样：判定类别（假信号·口径 / 假信号·节奏 / 样本不足）、理由（一句话）、复查日期。复查日期是这份清单的良心：写了大促后回落是节奏，那就写清 11/25 回来看；写了样本不足，就写清样本到 200 单时回来看。没有复查日期，「不动作」就变成了「忘了」。还有一条纪律：口径类假信号在数据组校验结论出来之前，不做任何产品动作——因为基线数据本身可能是错的，你改了也读不出效果。这条纪律能省掉大量白工。不动作的条目也要有责任人，谁负责到期回来看，否则日期写了也没人执行。复查日期一到，必须有人当场回答。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"判定类别写清楚\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">判定类别写清楚</tspan></text></g><g data-k=\"理由一句话\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">理由一句话</tspan></text></g><g data-k=\"复查日期必写\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">复查日期必写</tspan></text></g><g data-k=\"口径未校验前不做产品动作\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">口径未校验前不做产品动作</tspan></text></g></svg>", "d": 59.11}], "deliverable": {"type": "doc", "name": "增长诊断与行动清单", "rubric": ["拆解完整", "动作可验收", "不做有理由"], "acceptance": "一份能直接排期的清单：拆解有数、归因有维度、动作有基线与窗口、不做的有理由"}, "practice": {"steps": ["拆解：四乘数各自前后值 + 贡献百分点，标出被掩盖项与行业增速参照", "异动归因：挑 3 个最大异动，判真假（真/假信号/样本不足），真问题给归因维度", "动作清单：每条写对象、预期变化、验证指标、观察窗口、责任人岗位", "不动作清单：写清哪几条判定为假信号或样本不足，以及下次回来看的时间", "风险与依赖：动作之间是否互相影响，是否需要数据组先给口径"], "exemplar": "【增长诊断与行动清单 · Q4 首月】产品：优选生活馆　周期：10/19–11/15　编制：产品经理\n\n■ 一、GMV 四乘数拆解（环比上月）\nUV：18.2 万 → 21.5 万（+18%），贡献 +18 个点\n转化率：2.9% → 2.6%（-9%），贡献 -9 个点\n客单价：186 元 → 227 元（+22%），贡献 +22 个点\n复购频次：1.12 → 1.13（+1%），贡献 +1 个点\n净效应：+32 个点 → 实际 GMV 增长 12%（差额来自乘数相互抵扣与口径差异）\n被掩盖项：客单价上涨主要来自满 299 减 50，同期转化率下降 9% 说明门槛劝退了一部分人。\n行业参照：类目大盘同期增速约 15%（来源：平台行业月报 10 月刊），我们 12% 低于大盘。\n\n■ 二、三个最大异动的归因\n1. 信息流渠道 UV +40%、支付转化 0.8%（其余渠道 2.6%）→ 真问题·渠道质量。证据强（同渠道历史转化 2.1%）。\n2. 全站转化 -18%，同期埋点 SDK 升级 → 假信号·口径。证据强（升级当天开始掉）。\n3. 商详→加购 -3.1 点，同期上线强制登录弹窗 → 真问题·页面。证据强（弹窗曝光率 92%）。\n\n■ 三、动作清单（3 条）\nA1｜信息流渠道降预算并换定向\n对象：信息流投放（占 UV 41%）｜预期：转化从 0.8% 回到 1.8% 以上｜验证指标：该渠道支付转化率｜观察窗口：7 天｜责任人：投放运营\nA2｜登录弹窗做关闭实验\n对象：商详页弹窗｜预期：加购率从 6.8% 回到 8.5%｜验证指标：加购率、登录成功率｜观察窗口：14 天｜责任人：产品经理 + 前端\nA3｜满减门槛做一档对照\n对象：满 299 减 50 改为 259 减 40｜预期：转化率回升 4 个点、客单价下降不超过 8%｜验证指标：转化率、客单价、GMV｜观察窗口：14 天｜责任人：运营 + 数据\n\n■ 四、不动作清单（2 条）\nN1｜大促后一周转化回落 20%：判定为节奏（去年同期回落 19%）。复查日期：11/25。\nN2｜某品类转化 +30% 但仅 40 单：样本不足。复查日期：样本到 200 单时（预计 12/5）。\nN3｜全站 -18%：假信号（口径），已交数据组校验，校验结论出来前不做产品动作。\n\n■ 五、动作间影响与依赖\nA3 会压低客单价，可能抵消 A1 带来的增量，因此 A3 期间只看「转化率 + GMV」双指标，不看客单价单项。\n依赖：N3 的埋点校验结论（数据组，11/2 前）——若口径问题成立，A1/A2 的基线要用校验后的数重算。\n\n■ 六、本期不覆盖\n不评估品牌广告的长期影响（无归因模型）；不做跨品类联合分析（样本不足）。"}, "task": "产出《增长诊断与行动清单》：拆解：四乘数各自前后值 + 贡献百分点，标出被掩盖项与行业增速参照；异动归因：挑 3 个最大异动，判真假（真/假信号/样本不足），真问题给归因维度；动作清单：每条写对象、预期变化、验证指标、观察窗口、责任人岗位；不动作清单：写清哪几条判定为假信号或样本不足，以及下次回来看的时间；风险与依赖：动作之间是否互相影响，是否需要数据组先给口径", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M4 AI 驱动数据分析与增长决策」模块，你要交付的是《增长诊断与行动清单》。\n【场景】业务侧这周的诉求是：增长诊断的价值是让你敢说「这三件事这周不做」，而不只是列出十件可以做的事。参考做法：「优选生活馆」Q4 增长诊断：三条动作、两条不动作、一条待验证。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（四乘数拆解 → 异动归因 → 动作清单（对象/预期/验收/负责人）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《增长诊断与行动清单》填写模板】\n\n■ 1. 拆解：四乘数各自前后值 + 贡献百分点，标出被掩盖项与行业增速参照\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 异动归因：挑 3 个最大异动，判真假（真/假信号/样本不足），真问题给归因维度\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 动作清单：每条写对象、预期变化、验证指标、观察窗口、责任人岗位\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 不动作清单：写清哪几条判定为假信号或样本不足，以及下次回来看的时间\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 风险与依赖：动作之间是否互相影响，是否需要数据组先给口径\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【增长诊断与行动清单 · Q4 首月】产品：优选生活馆　周期：10/19–11/15　编制：产品经理\n\n■ 一、GMV 四乘数拆解（环比上月）\nUV：18.2 万 → 21.5 万（+18%），贡献 +18 个点\n转化率：2.9% → 2.6%（-9%），贡献 -9 个点\n客单价：186 元 → 227 元（+22%），贡献 +22 个点\n复购频次：1.12 → 1.13（+1%），贡献 +1 个点\n净效应：+32 个点 → 实际 GMV 增长 12%（差额来自乘数相互抵扣与口径差异）\n被掩盖项：客单价上涨主要来自满 299 减 50，同期转化率下降 9% 说明门槛劝退了一部分人。\n行业参照：类目大盘同期增速约 15%（来源：平台行业月报 10 月刊），我们 12% 低于大盘。\n\n■ 二、三个最大异动的归因\n1. 信息流渠道 UV +40%、支付转化 0.8%（其余渠道 2.6%）→ 真问题·渠道质量。证据强（同渠道历史转化 2.1%）。\n2. 全站转化 -18%，同期埋点 SDK 升级 → 假信号·口径。证据强（升级当天开始掉）。\n3. 商详→加购 -3.1 点，同期上线强制登录弹窗 → 真问题·页面。证据强（弹窗曝光率 92%）。\n\n■ 三、动作清单（3 条）\nA1｜信息流渠道降预算并换定向\n对象：信息流投放（占 UV 41%）｜预期：转化从 0.8% 回到 1.8% 以上｜验证指标：该渠道支付转化率｜观察窗口：7 天｜责任人：投放运营\nA2｜登录弹窗做关闭实验\n对象：商详页弹窗｜预期：加购率从 6.8% 回到 8.5%｜验证指标：加购率、登录成功率｜观察窗口：14 天｜责任人：产品经理 + 前端\nA3｜满减门槛做一档对照\n对象：满 299 减 50 改为 259 减 40｜预期：转化率回升 4 个点、客单价下降不超过 8%｜验证指标：转化率、客单价、GMV｜观察窗口：14 天｜责任人：运营 + 数据\n\n■ 四、不动作清单（2 条）\nN1｜大促后一周转化回落 20%：判定为节奏（去年同期回落 19%）。复查日期：11/25。\nN2｜某品类转化 +30% 但仅 40 单：样本不足。复查日期：样本到 200 单时（预计 12/5）。\nN3｜全站 -18%：假信号（口径），已交数据组校验，校验结论出来前不做产品动作。\n\n■ 五、动作间影响与依赖\nA3 会压低客单价，可能抵消 A1 带来的增量，因此 A3 期间只看「转化率 + GMV」双指标，不看客单价单项。\n依赖：N3 的埋点校验结论（数据组，11/2 前）——若口径问题成立，A1/A2 的基线要用校验后的数重算。\n\n■ 六、本期不覆盖\n不评估品牌广告的长期影响（无归因模型）；不做跨品类联合分析（样本不足）。", "rubric": ["四乘数拆解含前后值与贡献百分点，缺一项按未写完计", "每条动作写清「预期变化 + 验证指标 + 观察窗口」，只有动作没有指标的项不计分", "不动作清单至少 2 条，每条写判定类别（假信号/样本不足）与复查日期", "至少指出一处动作间的相互影响（如提客单价会压转化率），并说明怎么监控"]}, {"id": "M4U4", "tier": "basic", "step": "spar", "title": "增长负责人挑战你的诊断", "video": {"dur": "3.2min", "script": ["增长负责人不看你分析得多细，只看你敢不敢为「砍预算」这类动作负责", "挑战清单：归因证据 / 收益预期 / 优先级 / 为什么不做", "「你说信息流渠道质量差，那砍掉预算后 GMV 谁补？」——三种答法的区别"]}, "ppt": {"method": "挑战清单：归因证据 / 收益预期 / 优先级 / 为什么不做", "case": "「你说信息流渠道质量差，那砍掉预算后 GMV 谁补？」——三种答法的区别", "demo": "陪练对话界面说明（把诊断清单粘进系统提示词，让对手按你的数发问）"}, "objective": "能在增长负责人 4 轮追问下，说清归因证据、动作预期收益与不做某事的理由", "transfer": "把陪练里被问住的那一问补进诊断清单的风险节，下次汇报前先自答一遍", "vslides": [{"t": "陪练说明：他只关心砍完之后谁补", "n": "增长负责人和品牌总监的区别在于：品牌总监问「值不值得投」，增长负责人问「砍了谁补」。他背 GMV 指标，任何减少流量的建议在他耳朵里都是风险。所以这一关不是考你的分析深度，是考你敢不敢为动作的后果负责。四种问法几乎固定：砍了谁补、是渠道问题还是页面问题、三条动作能带回多少 GMV、不做的如果继续掉怎么办。你要准备的也不是更多分析，而是三个数：单位 UV 的产出、可承接的增量空间、不成立时的止损线。他要的不是更细的分析，而是你能在三十秒内报出这三个数；报不出来，他就默认你没算过。这三个数是：单位 UV 产出、可承接增量、止损线。报得出来，他才愿意往下谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他一定会问的四句</tspan></text><g data-k=\"砍了谁补\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">砍了谁补</tspan></text></g><g data-k=\"能不能排除自己\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">能不能排</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">除自己</tspan></text></g><g data-k=\"带回多少\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">带回多少</tspan></text></g><g data-k=\"不成立怎么办\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">不成立怎</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">么办</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.11}, {"t": "排除替代解释：这是最见功力的一问", "n": "「转化 0.8% 是渠道问题还是落地页问题」——这一问非常狠，因为两个解释对应完全相反的动作：渠道问题砍预算，页面问题改页面。排除办法有三。第一，看同渠道不同落地页的表现：如果同一渠道换一个落地页转化就上去了，那是页面问题。第二，看该渠道的停留时长与跳出率：渠道质量差通常伴随极短停留和高跳出。第三，做小流量对照：同一素材、两个落地页，一周就能分辨。答这一问时，说清你用了哪两种对照，比给一个结论更可信。如果你确实排除不了，就老实说「目前排除不了，我用一周对照实验来定」，比硬给一个原因强。说「排除不了」不丢分，硬编一个原因才丢分。诚实比圆滑有用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三种排除法</tspan></text><g data-k=\"同渠道换落地页\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">同渠道换落地页</tspan></text></g><g data-k=\"停留时长与跳出率\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">停留时长与跳出率</tspan></text></g><g data-k=\"同素材双落地页对照\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">同素材双落地页对</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\">照</tspan></text></g></svg>", "d": 64.87}, {"t": "算账与退路：让他敢批的理由", "n": "算账要给单位经济：这个渠道每 1 万 UV 贡献多少 GMV，搜索渠道同样 1 万 UV 是多少，两个数一摆，账就清楚了。退路要给止损线：挪 30% 预算，两周后如果总 GMV 掉超过 5%，就挪回来。这两样加起来，他才敢批——因为最坏结果可控。最后是「不做」的条目：不要硬扛，给触发条件，比如「大促后回落如果第三周还没恢复，我就推翻节奏判断，按真问题处理」。承认自己的判断有失效条件，是这一关最容易加分的地方。别说「我保证」，说「我用两周验证，不成立就退回来」——前者是口号，后者是可执行的承诺。他批方案，本质上是在给一个可控的风险签字。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"单位 UV 产出算出来\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">单位 UV 产出算出来</tspan></text></g><g data-k=\"预算挪动分批不一次砍\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">预算挪动分批不一次砍</tspan></text></g><g data-k=\"给止损线\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给止损线</tspan></text></g><g data-k=\"不做的条目给触发条件\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不做的条目给触发条件</tspan></text></g></svg>", "d": 61.92}], "deliverable": {"type": "doc", "name": "增长诊断与行动清单", "rubric": ["收益算得出", "替代解释排除", "退路清楚"], "acceptance": "四问都能给出数字化的预期、可排除的替代解释，以及「不成立时怎么退」的方案"}, "spar": {"role": "增长负责人", "persona": "背着 GMV 指标，最听不得「砍预算」三个字；习惯连问三句「依据呢」「能补回来吗」「不成立怎么办」，只对能算账的方案松口", "mustAsk": ["你说信息流质量差，砍了预算 GMV 缺口谁补？", "转化 0.8% 是渠道问题还是落地页问题？你怎么排除是自己的页面没接住？", "这三条动作加起来，你预期能带回多少 GMV？给我一个数", "那两条「不做」的，如果下周数据继续掉，你还坚持不做吗？"]}, "exemplar": "（问：你说信息流渠道质量差，砍了预算，GMV 缺口谁补？）\n\n结论：我不建议一次砍完，建议先砍 30%，把省下的预算挪到搜索渠道，两周后看总 GMV 不看单渠道。\n依据：信息流渠道占 UV 41%，支付转化 0.8%，是其余渠道 2.6% 的三分之一；按当前客单价 227 元算，这个渠道每带来 1 万 UV 只贡献约 1.8 万元 GMV，同样 1 万 UV 在搜索渠道是 5.9 万元。挪 30% 预算的预期是总 GMV 不降、转化率回升 0.3 个点。\n边界：这个判断有两个前提——一是搜索渠道能承接增量（当前搜索 UV 占比只有 12%，有空间）；二是信息流转化低是定向问题而不是落地页问题，我用 7 天素材与定向对照来验证。如果不成立，我把预算挪回来，损失是两周的部分流量，可接受。", "task": "把《增长诊断与行动清单》拿到「增长负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《增长诊断与行动清单》。现在要让它通过「增长负责人」这一关。\n【对手的立场】背着 GMV 指标，最听不得「砍预算」三个字；习惯连问三句「依据呢」「能补回来吗」「不成立怎么办」，只对能算账的方案松口。\n【他一定会追问】「你说信息流质量差，砍了预算 GMV 缺口谁补？」 / 「转化 0.8% 是渠道问题还是落地页问题？你怎么排除是自己的页面没接住？」 / 「这三条动作加起来，你预期能带回多少 GMV？给我一个数」\n【场景】你说「增长负责人挑战你的诊断」，对方立刻回一句：你说信息流质量差，砍了预算 GMV 缺口谁补？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["收益预期给到量级（如「挪 30% 预算，预期总 GMV 不降、转化回升 0.3 点」），不给「应该会好」", "能区分「渠道质量」与「落地页承接」两种解释，并说出用什么对照来排除", "对「不做」的条目给出触发条件（数据掉到什么程度就改主意），而不是硬扛", "所有数字都能说出口径（UV 怎么算、转化分子分母是什么）"]}, {"id": "M4U5", "tier": "adv", "step": "understand", "title": "NL2SQL 的边界与正确使用", "video": {"dur": "3.3min", "script": ["自然语言查数最危险的地方不是查不出来，是查出来一个看着对的错数", "三步用法（问口径 → 出 SQL → 抽查核对）+ 三类典型错误", "AI 写出的 SQL 用了「订单表金额」，与财务口径差 7%，原因是未扣退款"]}, "ppt": {"method": "三步用法（问口径 → 出 SQL → 抽查核对）+ 三类典型错误", "case": "AI 写出的 SQL 用了「订单表金额」，与财务口径差 7%，原因是未扣退款", "demo": "同一问题换三种问法，看生成的 SQL 差在哪"}, "objective": "能用 NL2SQL 拿到可核对的数，并说出它给错数的三类典型情形与校验办法", "transfer": "挑一条本周要用的数据，用 NL2SQL 跑一遍再手工核对一次，把差异记进数据字典", "vslides": [{"t": "开场：它能写出语法正确的错 SQL", "n": "自然语言查数听起来很美：问一句话，SQL 就出来了，数也出来了。问题在于，它写出来的 SQL 语法几乎总是对的，但口径可能全错——而你还看不出来。举个最常见的例子：你问「上个月四件套的销售额」，它可能用订单表的金额字段加总，没扣退款；财务口径是支付金额减退款，两者能差 7%。7% 在大盘量级上就是几十万，你拿着这个数去开会，被财务当场纠正一次，后面所有分析都没人信了。所以 NL2SQL 的正确用法不是「让它查数」，而是「让它写草稿，你来核对口径」。它省的是写 SQL 的时间，不是省你判断口径的责任。正确的心态是把它当一个刚入职的分析师：SQL 会写，业务不懂。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">一个真实的口径差</tspan></text><g data-k=\"问：上个月四件套销售额\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">问：上个月四件套销售额</tspan></text></g><g data-k=\"它回：SUM(订单表.amount) → 未扣退款，差 7%\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">它回：SUM(订单表.amount)  → 未扣退款，差 7%</tspan></text></g><g data-k=\"正确：支付金额 − 退款金额，且排除测试单\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">正确：支付金额 − 退款金额，且排除测试单</tspan></text></g></svg>", "d": 64.37}, {"t": "三步用法：先定口径，再放它写，最后必须抽查", "n": "第一步，把口径写进问题里：指标定义（分子分母）、时间口径（下单时间还是支付时间）、维度（按品类还是按 SKU）、排除条件（退款、测试单、员工单、赠品）。这四项不写，它一定给你一个「合理但不对」的数。第二步，让它出 SQL，并要求它同时输出「这段 SQL 的假设」——比如「假设金额字段为支付金额，未扣退款」，这句话能让你三秒发现口径问题。第三步，抽查：抽 10 条明细手工验算，或者和已有看板交叉比对；两个数差超过 2% 就必须查到差在哪。这三步做完，你拿到的数才敢进汇报。抽查不用多，10 条明细足够发现口径级问题；关键是每条都要手算一遍分子分母。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 口径四要素写进提问\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 口径四要素写进提问</tspan></text></g><g data-k=\"② 要它同时输出假设\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 要它同时输出假设</tspan></text></g><g data-k=\"③ 抽 10 条明细验算\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 抽 10 条明细验算</tspan></text></g><g data-k=\"④ 与已有看板交叉比对\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 与已有看板交叉比对</tspan></text></g></svg>", "d": 66.0}, {"t": "三类典型错误与各自的发现办法", "n": "第一类，口径错：字段选错（订单金额 vs 支付金额）、时间口径错（下单 vs 支付）、未排除退款。发现办法是对比财务或已有看板，差 2% 以上必查。第二类，表连错：一对多关联导致行数翻倍，销售额虚高。发现办法是先看明细行数对不对，再对总量。第三类，去重错：同一用户一天多次下单，UV 口径没去重，转化率被低估。发现办法是拿一个已知的小样本手工算一遍。最后一条纪律：NL2SQL 的结果不要直接贴进对外材料，它适合做探索和初筛，正式口径的数必须走数据组或已经校验过的看板。把每次核对出的差异记进数据字典，下次就不用重复踩同一个坑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"口径错：对比看板差 2% 必查\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">口径错：对比看板差 2% 必查</tspan></text></g><g data-k=\"表连错：先看行数再看总量\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">表连错：先看行数再看总量</tspan></text></g><g data-k=\"去重错：小样本手工算\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">去重错：小样本手工算</tspan></text></g><g data-k=\"正式口径走数据组\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">正式口径走数据组</tspan></text></g></svg>", "d": 66.62}], "deliverable": {"type": "doc", "name": "取数核对记录", "rubric": ["口径写全", "校验到位", "结论不越界"], "acceptance": "能写出一个完整取数请求（口径 + 时间 + 维度 + 排除条件），并对结果做一次抽样核对"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三步用法（问口径 → 出 SQL → 抽查核对）+ 三类典型错误\n【为什么重要】自然语言查数最危险的地方不是查不出来，是查出来一个看着对的错数\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["取数请求包含四项：指标定义（分子分母）、时间窗口与口径（下单/支付）、维度、排除条件（退款/测试单/员工单）", "能说出至少两类 NL2SQL 常见错误（口径错、表连错、去重错），并给出各自的发现办法", "对结果做一次抽样核对：抽 10 条明细手工验算，或与已有看板交叉比对", "明确写出「本次结果不用于什么」（如不用于财务对账），不越界使用"]}, {"id": "M4U6", "tier": "adv", "step": "demo", "title": "用 AI 辅助 AB 实验设计", "video": {"dur": "3.4min", "script": ["一个设计错的实验，比不跑实验更糟——它会给你一个可以引用但错误的结论", "实验五要素（假设/主指标/分流/时长/护栏）+ 六类常见缺陷", "「优选生活馆」主图 A/B：样本 200 UV、跑 3 天、只看 GMV，结论不可用"]}, "ppt": {"method": "实验五要素（假设/主指标/分流/时长/护栏）+ 六类常见缺陷", "case": "「优选生活馆」主图 A/B：样本 200 UV、跑 3 天、只看 GMV，结论不可用", "demo": "WorkBuddy 内跑一遍：先判缺陷，再让模型给修法，最后自己定最小可行版本"}, "objective": "能判断 8 个实验设计能否上线跑，并说清每个缺陷的修法与最小可行版本", "transfer": "把手上要跑的实验按这五要素过一遍，把缺护栏指标的那条补上再提交评审", "vslides": [{"t": "演示准备：8 个实验，只有 1 个能直接跑", "n": "这一批 8 个实验设计，看名字都很正经：主图 A/B、按钮文案、价格测试。但摊开看，只有 1 个能直接上线跑。第一个，每组 200 UV、跑 3 天——这个样本量连噪声都分不出来，跑出来的差异全是随机波动。第二个，用 GMV 做主指标还跨着大促跑，大促本身的波动比实验效应大十倍。第三个，按用户 ID 取模分流，但新客老客混在一起，而这两群人的基线差 2.4 个点，等于把人群差异算成了实验效应。还有两个是结构性问题：一个没有对照组，一个同时改了两个变量。这两类加样本也救不回来。判定顺序建议：先看有没有对照，再看变量是不是只有一个，最后才看样本够不够。顺序错了，你会先纠结样本，却放过没有对照这种硬伤。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"8 个实验：主图 / 文案 / 价格 / 分流方式\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 个实验：主图 / 文案 / 价格 / 分流方式</tspan></text></g><g data-k=\"问题：样本不足、指标错、分流不均、无对照、变量混杂\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">问题：样本不足、指标错、分流不均、无对照、变量混杂</tspan></text></g><g data-k=\"只有 1 个能直接跑\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">只有 1 个能直接跑</tspan></text></g></svg>", "d": 68.09}, {"t": "判定的三档：为什么「无对照」不能判需修改", "n": "判定分三档，界线在「能不能通过调整参数救回来」。样本不足、时长不够、指标选错、缺护栏，这四类都能救：加样本、延时长、换指标、补护栏，改完就能跑，属于「需修改」。分流不均要靠分层，也能救，但要注意它是偏差不是噪声——加样本只会让偏差更精确，不会消失。而「无对照组」和「变量混杂」是结构性问题：没有对照，你无法归因；同时改两个变量，你分不清是哪个起作用。这两类加多少样本都没用，只能重做设计，所以判「不可跑」。把这条界线讲清楚，你的评审表才有说服力。样本不足是最常见的缺陷，也是最容易被放过的——因为它不影响「看起来专业」。这类缺陷最容易被放过，因为它的外表最像专业。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三档判定的界线</tspan></text><g data-k=\"加样本/延时长能救\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">加样本/延时长</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">能救</tspan></text></g><g data-k=\"分层能救但要防偏差\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">分层能救但要防</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">偏差</tspan></text></g><g data-k=\"无对照/变量混杂只能重做\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">无对照/变量混</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">杂只能重做</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 68.9}, {"t": "样本量要能算，不能凭感觉", "n": "「样本不够」这句话没有说服力，要给算式：按当前转化率 2.6%，想检出 10% 的相对提升（即 2.6% 到 2.86%），每组大约需要 1.2 万 UV；按日 UV 4000 算，至少 7 天，考虑到周内波动要覆盖两个周末，建议跑 14 天。这样一算，运营自己就知道该等多久，不会每天来问「能不能提前看结果」。还有一条常被忽略：实验期间不要叠加其他改动。你在跑主图实验的同时改了价格，结果就没法解释。所以实验排期表要标出「锁定期」，锁定期内这个页面不进其他需求。实验上线前把结论标准写死（提升多少才推全），避免结果出来后按心情解读。标准要提前写在文档里，而不是结果出来之后再商量。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"样本需求给算式\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">样本需求给算式</tspan></text></g><g data-k=\"覆盖两个周末\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">覆盖两个周末</tspan></text></g><g data-k=\"实验期设锁定期\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">实验期设锁定期</tspan></text></g><g data-k=\"护栏指标不能省\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">护栏指标不能省</tspan></text></g></svg>", "d": 65.62}], "deliverable": {"type": "sheet", "name": "实验设计评审表", "rubric": ["缺陷识别", "修法可行", "判定明确"], "acceptance": "8 个实验每条都判了可跑/需修改/不可跑，需修改的写清改法与改后样本需求"}, "demo": {"ref": "■ 实验判定（8 个）\n\nX01｜主图 A/B，每组 200 UV，跑 3 天\n判定：需修改｜缺陷：样本不足 + 时长不够｜修法：按当前转化 2.6%，检出 10% 相对提升需每组约 1.2 万 UV，按日 UV 4000 计需 7 天以上，建议延到 14 天覆盖两个周末\n\nX02｜用 GMV 做主指标，跑 3 天（跨大促）\n判定：需修改｜缺陷：指标选错｜修法：主指标换支付转化率，GMV 作参考；大促期间停跑或分段分析\n\nX03｜按用户 ID 取模分流，新老客混在一起\n判定：需修改｜缺陷：分流不均（新老客基线差 2.4 点）｜修法：按「新客/老客」分层后层内随机\n\nX04｜结算页按钮文案改版，跑 14 天，覆盖两个周末\n判定：可跑｜缺陷：无（需补一条护栏指标：退款率）\n\nX05｜同时跑 6 组实验，每组都看显著性\n判定：需修改｜缺陷：多重比较｜修法：主实验只留 1 个，其余排队；或用更严的显著性阈值\n\nX06｜只设转化率一个指标，无护栏\n判定：需修改｜缺陷：缺护栏指标｜修法：加退款率、客服工单量、支付失败率三个护栏\n\nX07｜全量放开 100% 流量改版，无对照组\n判定：不可跑｜缺陷：无对照组｜修法：留 10% 对照组，否则无法归因\n\nX08｜实验组同时改价格与主图\n判定：不可跑｜缺陷：变量混杂｜修法：拆成两个实验串行跑\n\n■ 结论：可跑 1 个、需修改 5 个、不可跑 2 个。\n■ 建议：优先修 X03 的分流问题，因为它会让结论系统性偏向新客。\n■ 补充：行业经验是主图实验平均可提升点击率 15%-25%，建议大胆试。", "fix": ["「行业经验提升 15%-25%」删掉——没有来源的经验区间会让人对结果产生错误预期", "X01 的样本需求写成可复算的算式（按 2.6% 基线、检出 10% 相对提升推算每组约 1.2 万 UV），不写「样本不够」", "X04 判「可跑」的同时必须补护栏指标，不能因为设计完整就放过；改成「可跑，但需补退款率护栏」", "「优先修 X03」的理由写清：分流不均会让结论系统性偏向新客，属于偏差不是噪声，不能靠加样本解决"], "judge": "判断依据：有没有把「无对照组」「变量混杂」判成需修改（这两类是结构性缺陷，加样本也救不了）；样本需求是否可复算；可跑的实验是否补了护栏；有没有编造行业提升区间", "sheet": {"situ": "本季度要跑一批实验，运营和产品各提了几条。你把它们摊在桌上发现：有的样本量根本不够，有的主指标选错，有的没有对照组，还有一个同时改了两个变量。实验设计评审会明天上午开，你要先给出判定。", "ask": "① 逐个判：缺陷属于哪一类、能不能上线跑、怎么改；② 用你的表请 AI 给修法与样本需求；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 判定每个实验可跑 / 需修改 / 不可跑；② 指出缺陷类型并给修法；③ 指出哪个实验即使跑出显著结果也不能采信，为什么。\n禁止编造样本量基准或行业提升幅度。", "mats": [{"id": "X01", "src": "运营提报 · 主图实验", "text": "主图 A/B 两组，每组 200 UV，跑 3 天，看点击率差异。\n当前商详支付转化基线 2.6%，日 UV 约 4000。"}, {"id": "X02", "src": "运营提报 · 页面改版", "text": "结算页改版 A/B，主指标用 GMV，跑 3 天，时间正好跨大促。"}, {"id": "X03", "src": "产品提报 · 推荐位", "text": "推荐位排序 A/B，按用户 ID 取模分流，新客与老客混在同一池子里。\n新客支付转化 1.8%，老客 4.2%。"}, {"id": "X04", "src": "产品提报 · 按钮文案", "text": "结算页按钮文案改版，A/B 各 50% 流量，跑 14 天，覆盖两个完整周末，留存 10% 对照组。"}, {"id": "X05", "src": "增长提报 · 多实验并行", "text": "同一时间跑 6 组实验（主图、价格、推荐位、优惠券、文案、排序），每组都单独看显著性。"}, {"id": "X06", "src": "运营提报 · 优惠券", "text": "优惠券门槛调整 A/B，只设「支付转化率」一个指标，没设其他观测指标。"}, {"id": "X07", "src": "运营提报 · 首页改版", "text": "首页改版直接全量放开 100% 流量，不做对照组，上线后与「上月同期」比。"}, {"id": "X08", "src": "产品提报 · 价格测试", "text": "同一实验组内同时调整零售价与主图，观察转化变化。"}], "cols": [{"k": "flaw", "name": "缺陷类型", "hint": "设计完整就选「无明显缺陷」", "type": "chips", "w": 3, "tags": ["样本量不足", "指标选错", "分流不均", "多重比较", "缺护栏指标", "无对照组", "变量混杂", "无明显缺陷"]}, {"k": "verdict", "name": "能不能跑", "hint": "可跑 / 需修改 / 不可跑", "type": "chips", "w": 2, "tags": ["可跑", "需修改", "不可跑"]}, {"k": "fix", "name": "怎么改", "hint": "给一个能落地的改法", "type": "chips", "w": 3, "tags": ["扩大样本", "延长时长", "换主指标", "按层级分流", "加护栏指标", "减少并行实验", "保留对照组", "拆成两个实验", "无需修改"]}], "key": {"X01": {"flaw": "样本量不足", "verdict": "需修改", "fix": "扩大样本"}, "X02": {"flaw": "指标选错", "verdict": "需修改", "fix": "换主指标"}, "X03": {"flaw": "分流不均", "verdict": "需修改", "fix": "按层级分流"}, "X04": {"flaw": "无明显缺陷", "verdict": "可跑", "fix": "无需修改"}, "X05": {"flaw": "多重比较", "verdict": "需修改", "fix": "减少并行实验"}, "X06": {"flaw": "缺护栏指标", "verdict": "需修改", "fix": "加护栏指标"}, "X07": {"flaw": "无对照组", "verdict": "不可跑", "fix": "保留对照组"}, "X08": {"flaw": "变量混杂", "verdict": "不可跑", "fix": "拆成两个实验"}}, "notes": {"X01·flaw": "按 2.6% 基线、想检出 10% 的相对提升，每组约需 1.2 万 UV；200 UV 连噪声都分不出来", "X04·verdict": "这个设计本身是完整的：有对照、跑够两周、覆盖两个周末。护栏指标属于上线前常规补齐，不构成阻塞，所以判「可跑」", "X07·verdict": "没有对照组就无法归因，加多少样本都救不回来——这类是结构性缺陷，只能重做", "X08·verdict": "同时改价格和主图，分不清是哪个起作用；也是结构性问题，必须拆开串行跑", "X03·flaw": "新客基线 1.8%、老客 4.2%，混在一个池子里取模，等于把人群差异算成了实验效应；这类偏差加样本只会更精确，不会消失", "X05·flaw": "6 组同时看显著性，至少有一组「显著」几乎必然发生，这是多重比较问题，不是发现", "X02·flaw": "GMV 在大促期波动比实验效应大得多，主指标应换成支付转化率，GMV 只做参考"}, "delta": [{"op": "删", "frm": "模型补的「行业经验主图实验可提升点击率 15%-25%」", "to": "整句删除", "why": "没有来源的经验区间，会让你对结果产生错误预期，也让评审质疑整份文档", "kw": ["行业", "15", "25", "经验", "提升"]}, {"op": "改", "frm": "X01 只写「样本不足，建议扩大」", "to": "给出算式：按 2.6% 基线检出 10% 相对提升，每组约需 1.2 万 UV，按日 4000 UV 需 7 天以上", "why": "不给算式，运营明天还会来问「能不能先看一半的结果」", "kw": ["算式", "1.2", "样本需求", "算", "推算"]}, {"op": "改", "frm": "X07/X08 被判成「需修改」", "to": "判「不可跑」：无对照与变量混杂是结构性缺陷，加样本无救", "why": "三档判定的界线在「能不能靠调参数救回来」，救不回来就不能浪费流量", "kw": ["结构性", "对照", "混杂", "无救", "不可跑"]}, {"op": "补", "frm": "（模型没写）", "to": "补一条「结论标准提前写死」：提升多少才推全，谁签字", "why": "不提前定标准，结果出来就会按心情解读，实验白跑", "kw": ["标准", "推全", "提前", "签字"]}, {"op": "补", "frm": "（模型没写）", "to": "补一条「实验锁定期」：实验期间该页面不进其他需求", "why": "实验期叠加其他改动，结论无法解释，这也是最常见的翻车方式", "kw": ["锁定", "叠加", "期间", "其他需求"]}], "refsheet": "X01｜样本量不足｜需修改｜扩大样本\nX02｜指标选错｜需修改｜换主指标\nX03｜分流不均｜需修改｜按层级分流\nX04｜无明显缺陷｜可跑｜无需修改\nX05｜多重比较｜需修改｜减少并行实验\nX06｜缺护栏指标｜需修改｜加护栏指标\nX07｜无对照组｜不可跑｜保留对照组\nX08｜变量混杂｜不可跑｜拆成两个实验\n\n四处最容易判错的：\n· X04 是唯一「可跑」的：有对照、跑够两周、覆盖两个周末，护栏属于上线前补齐。\n· X07 / X08 是「不可跑」不是「需修改」：无对照、变量混杂，加样本救不回来。\n· X03 是偏差不是噪声：新老客基线差 2.4 个点，加样本只会让偏差更精确。\n· X05 的「显著」不是发现：6 组同时看显著性，出现假阳性几乎必然。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」本季度 8 个实验设计（含假设、主指标、分流方式、时长）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每个实验能否上线跑（可跑/需修改/不可跑）；② 指出缺陷类型并给修法；③ 指出哪个实验即使跑出显著结果也不能采信，为什么。禁止编造样本量或提升幅度的行业基准。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】实验五要素（假设/主指标/分流/时长/护栏）+ 六类常见缺陷\n【参考案例】「优选生活馆」主图 A/B：样本 200 UV、跑 3 天、只看 GMV，结论不可用\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」本季度 8 个实验设计（含假设、主指标、分流方式、时长）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每个实验能否上线跑（可跑/需修改/不可跑）；② 指出缺陷类型并给修法；③ 指出哪个实验即使跑出显著结果也不能采信，为什么。禁止编造样本量或提升幅度的行业基准。", "rubric": ["每条实验都判了「可跑 / 需修改 / 不可跑」三档之一，不能只写「建议优化」", "缺陷要具体到类型（样本不足/指标选错/分流不均/时长不够/多重比较/缺护栏/无对照/变量混杂）", "需修改的给出修法（如延长到 14 天、按用户分层分流、加退款率做护栏），不写「再想想」", "至少一条判为「不可跑」并说明理由（变量混杂或无对照组这类结构性问题）"]}, {"id": "M4U7", "tier": "adv", "step": "todo", "title": "产出《数据看板需求文档》", "video": {"dur": "3.3min", "script": ["看板做出来没人用，八成不是因为不好看，是因为口径和业务理解不一致", "指标字典（定义/分子分母/口径）+ 维度与筛选 + 刷新与异常 + 使用场景", "「优选生活馆」增长看板：12 个指标、三张表、两个口径争议"]}, "ppt": {"method": "指标字典（定义/分子分母/口径）+ 维度与筛选 + 刷新与异常 + 使用场景", "case": "「优选生活馆」增长看板：12 个指标、三张表、两个口径争议", "demo": "文档骨架 + 一份填好的样例（含口径争议的裁决记录）"}, "objective": "能产出一份可开发的看板需求文档，指标口径、维度、刷新与异常处理都写到可实现", "transfer": "把看板需求文档发给数据组做一次口径评审，把有争议的两个指标当场定下来", "vslides": [{"t": "任务说明：先写场景，再写指标", "n": "看板需求文档最常见的写法是一上来就列 30 个指标，做完上线，三个月后没人打开。原因不是图不好看，是指标没有对应决策。所以这份文档第一节必须写使用场景：谁在什么会上看哪几个数、看完做什么决定。写不出决定的指标，直接删掉。比如「品牌曝光量」很常见，但没有任何人会因为曝光量变化去改动作，它就不该进看板。第二节才是指标字典，每个指标要写到分子分母，这一节决定数据组能不能直接开发——你写得模糊，他们就会带着问题来问三轮，项目拖两周。指标数量控制在 12 个以内，超过这个数，看板就变成了数据仓库的截图。12 个指标是经验上限，不是目标。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 使用场景（谁看、看完做什么）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 使用场景（谁看、看完做什么）</tspan></text></g><g data-k=\"② 指标字典（分子/分母/口径/排除）\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 指标字典（分子/分母/口径/排除）</tspan></text></g><g data-k=\"③ 维度与下钻\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 维度与下钻</tspan></text></g><g data-k=\"④ 刷新与异常处理\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 刷新与异常处理</tspan></text></g><g data-k=\"⑤ 口径争议与裁决\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 口径争议与裁决</tspan></text></g></svg>", "d": 63.6}, {"t": "指标字典要写到「能直接写 SQL」的程度", "n": "一个指标写法示范：支付转化率 = 支付成功人数 ÷ 商详 UV；分子排除退款后取消的订单，分母是浏览过任意商详页的去重用户；时间按支付时间归集；排除测试账号、员工账号、赠品单。这四项写全，数据组照着就能写，不会来回问。少写一项的后果很具体：不写「排除赠品单」，大促赠品一多，转化率就飙，你会误判活动效果。另外每个指标都要写清与财务或已有报表的差异说明——差异是正常的，但不能是未知的，未知的差异每次开会都要吵一遍。维度要写清默认视角，否则每个人打开都自己调筛选，看到的不是同一张图。默认视角要写进文档，不能靠口口相传。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">指标四要素</tspan></text><g data-k=\"定义\"><rect x=\"18.0\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"56.8\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"56.8\">定义</tspan></text></g><g data-k=\"分子 / 分母\"><rect x=\"113.5\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.2\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.2\">分子 / 分母</tspan></text></g><g data-k=\"时间口径\"><rect x=\"209.0\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.8\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.8\">时间口径</tspan></text></g><g data-k=\"排除条件\"><rect x=\"304.5\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"343.2\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"343.2\">排除条件</tspan></text></g></svg>", "d": 62.88}, {"t": "口径争议要当场裁决，不要留给下次", "n": "「支付转化率按支付日还是下单日归集」这种争议，在看板项目里几乎必然出现。财务要下单日（与收入确认对齐），增长要支付日（贴近投放效果）。文档里必须有一节记录争议与裁决：双方主张、最终口径、裁决人、日期。裁决之后写进文档，下次不再吵。还有一处容易被忽略：口径变更要留版本说明，旧口径数据保留 90 天，否则趋势图会断，谁也说不清那段下跌是真实的还是口径变了。最后是刷新与异常：默认 T+1，大促才做小时级；数据断流时页面要显示「数据截至何时」，不要显示空图表——空图表会被当成「业务归零」。上线前拿 12 个指标跟现有报表逐个比对，差 2% 以上必须解释清楚。解释不清就先不上线，别让看板一开始就带着争议。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"争议当场裁决并记录\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">争议当场裁决并记录</tspan></text></g><g data-k=\"旧口径数据保留 90 天\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">旧口径数据保留 90 天</tspan></text></g><g data-k=\"断流显示截止时间\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">断流显示截止时间</tspan></text></g><g data-k=\"验收要跟现有报表比对\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">验收要跟现有报表比对</tspan></text></g></svg>", "d": 71.81}], "deliverable": {"type": "doc", "name": "数据看板需求文档", "rubric": ["口径可开发", "场景明确", "争议有裁决"], "acceptance": "一份数据组能直接开发的文档：每个指标有分子分母、每个维度有下钻路径、争议有裁决记录"}, "practice": {"steps": ["写使用场景：谁在什么会上看哪几个数、看完做什么决定（没有场景的指标不进看板）", "写指标字典：每个指标的定义、分子、分母、时间口径、排除条件，逐条写清", "写维度与筛选：按渠道/品类/新老客拆，说明默认视角与下钻层级", "写刷新与异常：更新频率、延迟容忍、数据断流的兜底提示", "写口径争议与裁决：列出与业务/财务有分歧的指标，写清最终口径与裁决人"], "exemplar": "【数据看板需求文档 · 增长看板 v1】需求方：产品经理　开发方：数据组　评审：增长负责人、财务\n\n■ 一、使用场景（谁看、看完做什么）\n场景 1｜每周一增长周会：看「四乘数趋势 + 渠道转化对比」，决定本周预算在各渠道的分配。\n场景 2｜每双周实验复盘：看「实验组对照 + 护栏指标」，决定实验推全还是回滚。\n场景 3｜每月经营会：看「GMV 拆解 + 客单价结构」，决定下月主推价格带。\n不进看板的指标：品牌曝光量（无对应决策）、页面停留时长（当前无人使用）。\n\n■ 二、指标字典（12 个，节选 4 个）\n1. 支付转化率\n　定义：支付成功人数 ÷ 商详 UV\n　分子：当日支付成功去重用户数（排除退款后取消的订单）\n　分母：当日浏览过任意商详页的去重用户数\n　时间口径：按支付时间归集；跨日支付按下单日归属（口径争议见第五节）\n　排除：测试账号、员工账号、赠品单\n2. 客单价\n　定义：支付金额 ÷ 支付订单数\n　口径：支付金额含运费、不含平台补贴；与财务口径的差异在第五节说明\n3. 加购率：加购人数 ÷ 商详 UV，加购去重按「同一用户同一 SKU 计一次」\n4. 复购率：90 天内同品类二次及以上支付用户数 ÷ 90 天内有支付用户数\n\n■ 三、维度与筛选\n默认视角：近 30 天、全渠道、全品类，对比上期（环比）与去年同期（同比）。\n下钻层级：渠道 → 品类 → SKU；人群 → 新客/老客 → 会员等级。\n筛选项：渠道、品类、新老客、终端（移动/PC）、活动标记。\n\n■ 四、刷新与异常\nT+1 更新，每日 08:00 前完成；大促期间 T+0 小时级（仅 6 个核心指标）。\n数据断流：页面顶部提示「数据截至 X 月 X 日 08:00」，不显示空图表。\n口径变更：任何指标口径调整需在页面留「版本说明」，保留旧口径数据 90 天以便回溯。\n\n■ 五、口径争议与裁决\n争议 1｜支付转化率按「支付日」还是「下单日」归集。\n　财务主张按下单日（与收入确认对齐），增长主张按支付日（更贴近投放效果）。\n　裁决：看板主口径用「支付日」，同时提供「下单日」切换；裁决人：增长负责人，10/28。\n争议 2｜客单价是否含运费。\n　裁决：看板含运费（用户实际支付），对外汇报需注明；与财务对账时用不含运费口径，差额单独列示。\n　裁决人：财务 BP，10/29。\n\n■ 六、验收与交付\n验收：12 个指标在预发环境与现有报表比对，差异 >2% 需逐项说明原因。\n交付：看板地址 + 指标字典文档 + 一节 30 分钟的口径培训（面向运营与增长）。\n责任人：数据组（开发）、产品经理（口径与验收）。"}, "task": "产出《数据看板需求文档》：写使用场景：谁在什么会上看哪几个数、看完做什么决定（没有场景的指标不进看板）；写指标字典：每个指标的定义、分子、分母、时间口径、排除条件，逐条写清；写维度与筛选：按渠道/品类/新老客拆，说明默认视角与下钻层级；写刷新与异常：更新频率、延迟容忍、数据断流的兜底提示；写口径争议与裁决：列出与业务/财务有分歧的指标，写清最终口径与裁决人", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M4 AI 驱动数据分析与增长决策」模块，你要交付的是《数据看板需求文档》。\n【场景】业务侧这周的诉求是：看板做出来没人用，八成不是因为不好看，是因为口径和业务理解不一致。参考做法：「优选生活馆」增长看板：12 个指标、三张表、两个口径争议。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（指标字典（定义/分子分母/口径）+ 维度与筛选 + 刷新与异常 + 使用场景），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《数据看板需求文档》填写模板】\n\n■ 1. 写使用场景：谁在什么会上看哪几个数、看完做什么决定（没有场景的指标不进看板）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写指标字典：每个指标的定义、分子、分母、时间口径、排除条件，逐条写清\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写维度与筛选：按渠道/品类/新老客拆，说明默认视角与下钻层级\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 写刷新与异常：更新频率、延迟容忍、数据断流的兜底提示\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写口径争议与裁决：列出与业务/财务有分歧的指标，写清最终口径与裁决人\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【数据看板需求文档 · 增长看板 v1】需求方：产品经理　开发方：数据组　评审：增长负责人、财务\n\n■ 一、使用场景（谁看、看完做什么）\n场景 1｜每周一增长周会：看「四乘数趋势 + 渠道转化对比」，决定本周预算在各渠道的分配。\n场景 2｜每双周实验复盘：看「实验组对照 + 护栏指标」，决定实验推全还是回滚。\n场景 3｜每月经营会：看「GMV 拆解 + 客单价结构」，决定下月主推价格带。\n不进看板的指标：品牌曝光量（无对应决策）、页面停留时长（当前无人使用）。\n\n■ 二、指标字典（12 个，节选 4 个）\n1. 支付转化率\n　定义：支付成功人数 ÷ 商详 UV\n　分子：当日支付成功去重用户数（排除退款后取消的订单）\n　分母：当日浏览过任意商详页的去重用户数\n　时间口径：按支付时间归集；跨日支付按下单日归属（口径争议见第五节）\n　排除：测试账号、员工账号、赠品单\n2. 客单价\n　定义：支付金额 ÷ 支付订单数\n　口径：支付金额含运费、不含平台补贴；与财务口径的差异在第五节说明\n3. 加购率：加购人数 ÷ 商详 UV，加购去重按「同一用户同一 SKU 计一次」\n4. 复购率：90 天内同品类二次及以上支付用户数 ÷ 90 天内有支付用户数\n\n■ 三、维度与筛选\n默认视角：近 30 天、全渠道、全品类，对比上期（环比）与去年同期（同比）。\n下钻层级：渠道 → 品类 → SKU；人群 → 新客/老客 → 会员等级。\n筛选项：渠道、品类、新老客、终端（移动/PC）、活动标记。\n\n■ 四、刷新与异常\nT+1 更新，每日 08:00 前完成；大促期间 T+0 小时级（仅 6 个核心指标）。\n数据断流：页面顶部提示「数据截至 X 月 X 日 08:00」，不显示空图表。\n口径变更：任何指标口径调整需在页面留「版本说明」，保留旧口径数据 90 天以便回溯。\n\n■ 五、口径争议与裁决\n争议 1｜支付转化率按「支付日」还是「下单日」归集。\n　财务主张按下单日（与收入确认对齐），增长主张按支付日（更贴近投放效果）。\n　裁决：看板主口径用「支付日」，同时提供「下单日」切换；裁决人：增长负责人，10/28。\n争议 2｜客单价是否含运费。\n　裁决：看板含运费（用户实际支付），对外汇报需注明；与财务对账时用不含运费口径，差额单独列示。\n　裁决人：财务 BP，10/29。\n\n■ 六、验收与交付\n验收：12 个指标在预发环境与现有报表比对，差异 >2% 需逐项说明原因。\n交付：看板地址 + 指标字典文档 + 一节 30 分钟的口径培训（面向运营与增长）。\n责任人：数据组（开发）、产品经理（口径与验收）。", "rubric": ["每个指标都写到分子分母与时间口径，缺一项该指标不计入", "每个指标都标注使用场景（哪个会、谁看、看完做什么决定），没有场景的指标要删掉", "至少写 1 处口径争议及裁决结果（谁定的、依据是什么），不能只列指标", "写清刷新频率与数据断流时的兜底（页面提示 / 上次成功时间），不能默认「实时」"]}, {"id": "M4U8", "tier": "adv", "step": "spar", "title": "数据负责人挑战看板口径", "video": {"dur": "3.2min", "script": ["口径说不清，看板就是吵架现场；口径说清了，看板才是决策工具", "挑战清单：口径来源 / 分子分母 / 争议裁决 / 变更管理", "「你说转化率 2.6%，财务说是 2.4%，谁对？」——口径差 0.2 点背后的三种原因"]}, "ppt": {"method": "挑战清单：口径来源 / 分子分母 / 争议裁决 / 变更管理", "case": "「你说转化率 2.6%，财务说是 2.4%，谁对？」——口径差 0.2 点背后的三种原因", "demo": "陪练对话界面说明（把看板文档粘进系统提示词，让对手按你的指标发问）"}, "objective": "能在数据负责人 4 轮追问下，说清看板每个指标的口径来源、争议裁决与变更管理", "transfer": "把有争议的两个指标写成裁决记录，发给数据负责人与财务各确认一次再进开发", "vslides": [{"t": "陪练说明：他只要一个能复算的口径", "n": "数据负责人不关心你的分析结论，他关心这个数能不能被别人复算出来。所以他的问题全在口径上：分子分母是什么、去重怎么算、异常单排没排、跟财务对得上吗、以后怎么改。这一关最忌讳说「差不多」「大概 2.5 左右」——在他这里，0.2 个点就是几十万营收的差别。正确的姿态是：主动承认存在两套口径，说清差异来源和量级，然后给出管理机制。你越早说「两个都对，差在这两处」，他越把你当同行。他问「去重怎么算」时，你要能立刻说出「同一用户同一天多次浏览算一次」；这种细节答不上来，前面说的都没人信。去重规则是口径里最容易被含糊过去的一项。这是口径里最容易漏的一环。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他一定会问的四句</tspan></text><g data-k=\"分子分母\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">分子分母</tspan></text></g><g data-k=\"去重规则\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">去重规则</tspan></text></g><g data-k=\"异常单\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">异常单</tspan></text></g><g data-k=\"与财务差异\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">与财务差</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">异</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.62}, {"t": "差异要能归因到具体来源", "n": "同一个指标差 0.2 个点，来源通常就三处：归集日期（下单日 vs 支付日）、口径范围（含不含赠品/测试单）、金额定义（含不含运费/补贴）。要能说出每一处贡献多少：比如跨日支付影响 0.1 点、赠品单影响 0.1 点。说不出量级，就说明你还没查透。查的办法很简单：抽 200 条明细，用两套口径各算一遍，差额自然分解出来。这一步做完，你在会上就能一句话化解争议：「差 0.2 点是跨日支付和赠品单，我抽 200 条核过」。差异还要往业务影响上落一句：0.2 个点在当前量级是每月多少万，对方才知道该不该较真。把点数换算成钱，是最有效的沟通方式。换算成钱，讨论就从感觉变成账。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"归集日期差（下单/支付）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">归集日期差（下单/支付）</tspan></text></g><g data-k=\"口径范围（赠品/测试/员工单）\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">口径范围（赠品/测试/员工单）</tspan></text></g><g data-k=\"金额定义（含不含运费）\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">金额定义（含不含运费）</tspan></text></g><g data-k=\"查法：抽 200 条两套口径各算一遍\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">查法：抽 200 条两套口径各算一遍</tspan></text></g></svg>", "d": 65.4}, {"t": "变更管理：口径是会变的，机制要提前定", "n": "口径不可能永远不变，业务一变，口径就得跟着调。所以文档里要写清三件事：任何口径变更留版本说明（谁改的、为什么、影响哪些指标）；旧口径数据保留 90 天，保证趋势图能接上；变更需数据负责人与需求方共同签字。这三条听着像流程负担，实际是保护你自己——没有版本说明，三个月后没人说得清那条下跌是业务真的掉了还是口径变了。最后一条纪律：看板上永远给「口径差异」留一行，把与财务的差额明示出来，比藏起来强得多。口径文档要跟着看板一起交付，不能只交图不交字典——字典才是这个看板能活过三个月的原因。图会过时，字典不会。交付字典，等于交付可复算性。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"变更留版本说明\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">变更留版本说明</tspan></text></g><g data-k=\"旧数据保 90 天\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">旧数据保 90 天</tspan></text></g><g data-k=\"双方签字\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">双方签字</tspan></text></g><g data-k=\"看板明示口径差异\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">看板明示口径差异</tspan></text></g></svg>", "d": 64.18}], "deliverable": {"type": "doc", "name": "数据看板需求文档", "rubric": ["口径可复算", "差异可解释", "变更可管理"], "acceptance": "四问都能给出可复算的口径、与财务差异的归因，以及变更管理机制"}, "spar": {"role": "数据负责人", "persona": "管数据仓库多年，最烦「口径差不多」；一开口就问分子分母，接着追问「跟财务对得上吗」，最后一定问「口径变了怎么管」", "mustAsk": ["你说转化率 2.6%，财务说是 2.4%，到底谁对？差在哪？", "这个指标的分子分母你怎么定义的？去重按什么算？", "赠品单、测试单、员工单排除了吗？不排除会偏多少？", "口径以后要改，怎么管？旧数据怎么办，趋势图会不会断？"]}, "exemplar": "（问：你说转化率 2.6%，财务说是 2.4%，到底谁对？）\n\n结论：两个都对，但口径不同——我们按支付日归集且含赠品单，财务按下单日且排除赠品单。\n依据：差 0.2 个点来自两处：① 跨日支付的归属日期不同，影响约 0.1 点（大促期间尤其明显）；② 赠品单在分母里被算进了商详 UV，但没算进分子，压低约 0.1 点。这两处我都用 10 月的明细抽过 200 条核对，能对上。\n边界：看板主口径保留「支付日 + 含赠品」，因为它贴近投放效果；但对外汇报和对账一律用财务口径，两套口径的差额在看板上单列一行「口径差异」，每月对一次。变更管理我会写进文档：口径改动留版本说明、旧数据保留 90 天，任何变更需你和我共同签字。", "task": "把《数据看板需求文档》拿到「数据负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《数据看板需求文档》。现在要让它通过「数据负责人」这一关。\n【对手的立场】管数据仓库多年，最烦「口径差不多」；一开口就问分子分母，接着追问「跟财务对得上吗」，最后一定问「口径变了怎么管」。\n【他一定会追问】「你说转化率 2.6%，财务说是 2.4%，到底谁对？差在哪？」 / 「这个指标的分子分母你怎么定义的？去重按什么算？」 / 「赠品单、测试单、员工单排除了吗？不排除会偏多少？」\n【场景】你说「数据负责人挑战看板口径」，对方立刻回一句：你说转化率 2.6%，财务说是 2.4%，到底谁对？差在哪？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能说清与财务口径差异的具体来源（归集日期、赠品单、是否含运费），并给量级", "分子分母与去重规则说得出（同一用户同一天多次浏览算一次），不含糊带过", "能说出不排除异常单会偏多少（量级即可），而不是只说「会排除」", "变更管理给出机制：版本说明、旧数据保留期、谁签字"]}]}, {"id": "M5", "title": "M5 AI 嵌入研发协同与运营", "dims": ["workflow", "content", "product"], "units": [{"id": "M5U1", "tier": "basic", "step": "understand", "title": "模糊需求 → 验收用例", "video": {"dur": "3.5min", "script": ["需求里每个模糊形容词，最后都会变成一次线上事故或一场扯皮", "验收三要素（前置条件 / 操作步骤 / 预期结果）+ 五类必测（正常/异常/边界/权限/性能）", "「列表页要快」改写成「首屏 P75 ≤1.5 秒，弱网 3G 下 ≤3 秒」才可测"]}, "ppt": {"method": "验收三要素（前置条件 / 操作步骤 / 预期结果）+ 五类必测（正常/异常/边界/权限/性能）", "case": "「列表页要快」改写成「首屏 P75 ≤1.5 秒，弱网 3G 下 ≤3 秒」才可测", "demo": "同一句话的三种改写：不可测 / 半可测 / 可测，看差别在哪"}, "objective": "能把一句模糊需求改写成带前置条件、操作步骤与预期结果的验收用例", "transfer": "把手上最模糊的那条需求按三要素重写一遍，发给测试同学确认能否照着测", "vslides": [{"t": "开场：形容词是需求的敌人", "n": "「列表页加载要快」「大促期间要稳定」「交互要友好」——这三句话在需求文档里很常见，但它们都不是需求，是愿望。为什么？因为测试同学拿到它写不出用例，研发做完了也没法判断有没有达标，上线后出问题也没法界定是不是 bug。一句需求要变成可执行的东西，必须过一道翻译：把形容词换成数字或具体行为。快是多少毫秒、在什么网络条件下、看哪个百分位；稳定是多少可用性、错误率上限多少；友好是点了之后出现什么。这一步不做，后面所有环节都在猜，猜的结果就是返工。所以验收用例不是测试同学的事，是你在写需求时就要交的东西。我在评审会上见过最省事的做法：把这几条形容词需求念一遍，当场让提需求的人在纸上写数字，写不出来的就先不排期，这一招下来，三条里通常有一条当场被撤。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">把愿望翻译成需求</tspan></text><g data-k=\"形容词\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">形容词</tspan></text></g><g data-k=\"阈值 / 具体行为\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">阈值 / 具体行为</tspan></text></g><g data-k=\"可判定用例\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可判定用例</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 78.12}, {"t": "三要素：前置、步骤、预期", "n": "一条能照着测的用例，只有三段。第一段前置条件：在什么状态下开始测，比如「已登录、购物车有 2 件商品、其中 1 件库存为 0」。第二段操作步骤：按顺序做什么，一步一个动作，不要合并。第三段预期结果：做完之后应该看到什么，要写成可判定的状态——出现什么文案、按钮是灰的还是可点的、数据库里什么字段变成什么值。三要素里最容易漏的是前置，漏了它，测试同学要花半天造数据；第二容易漏的是预期写成「正常显示」，这句话等于没写。写完以后做一次换人测试：把前置和步骤给另一个组的测试同学，让他照着做一遍，全程只问了一个问题就算过关，问了三个以上说明你还没写清。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 前置：从什么状态开始\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 前置：从什么状态开始</tspan></text></g><g data-k=\"② 步骤：一步一个动作\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 步骤：一步一个动作</tspan></text></g><g data-k=\"③ 预期：可判定的状态\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 预期：可判定的状态</tspan></text></g></svg>", "d": 64.44}, {"t": "五类必测：只写正常流程等于没测", "n": "任何一条需求，至少要覆盖五类场景里的三类。第一类正常路径：一切顺利时走通。第二类异常路径：断网、接口超时、库存为 0、支付失败，这一类最容易漏，也最容易出事故。第三类边界值：数量为 0、为 1、为上限、超上限；库存 1 件两人同时下单就是典型。第四类权限：没登录、登录了但角色不对、跨店访问别人的数据。第五类性能：并发多少、响应多少毫秒。写用例时先问一句「这条需求最坏会怎么坏」，把那个场景写成一条用例，比写十条正常流程都有用。这五类不必每条需求都开五条用例，但至少要有三类，并且必须包含最坏的那个场景。用例数量不是考核项，漏掉的那一类才是事故的来源。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五类必测</tspan></text><g data-k=\"正常\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">正常</tspan></text></g><g data-k=\"异常\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">异常</tspan></text></g><g data-k=\"边界\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">边界</tspan></text></g><g data-k=\"权限\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">权限</tspan></text></g><g data-k=\"性能\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">性能</tspan></text></g></svg>", "d": 67.42}], "deliverable": {"type": "doc", "name": "验收用例集", "rubric": ["三要素齐", "异常覆盖", "判定明确"], "acceptance": "能把 5 条模糊需求改写成可测用例，每条含前置、步骤、预期，并覆盖至少一个异常路径"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】验收三要素（前置条件 / 操作步骤 / 预期结果）+ 五类必测（正常/异常/边界/权限/性能）\n【为什么重要】需求里每个模糊形容词，最后都会变成一次线上事故或一场扯皮\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["每条用例都有前置条件、操作步骤、预期结果三段，缺一段按未写完计", "模糊形容词（快、稳定、友好、流畅）必须替换成可测量的阈值或具体行为", "至少覆盖一条异常路径（断网、超时、并发、库存为 0），不能只写正常流程", "预期结果写成「可被判定的状态」（出现什么文案、按钮什么状态、数据什么值），不写「体验良好」"]}, {"id": "M5U2", "tier": "basic", "step": "demo", "title": "用 AI 把需求改写成验收用例", "video": {"dur": "3.6min", "script": ["把不可测的需求放进开发排期，等于把扯皮推迟到上线前一天", "三档判定（可测/需澄清/不可测）+ 缺项归类（时机/预期/阈值/数据/权限）", "「支持改收货地址」缺触发时机，「系统要稳定」缺阈值，两条都不能直接开发"]}, "ppt": {"method": "三档判定（可测/需澄清/不可测）+ 缺项归类（时机/预期/阈值/数据/权限）", "case": "「支持改收货地址」缺触发时机，「系统要稳定」缺阈值，两条都不能直接开发", "demo": "WorkBuddy 内跑一遍：先判档，再让模型补用例，最后自己核预期是否可判定"}, "objective": "能把 8 条口语化需求逐条判成可测/需澄清/不可测，并指出缺的是哪一项", "transfer": "把这次判成「不可测」的需求整理成一页，发给提需求的人请他补判定标准", "vslides": [{"t": "演示准备：8 条需求，只有 3 条能直接开发", "n": "这 8 条需求都是提需求的人的原话：「支持用户改收货地址」「列表页加载要快」「优惠券不能叠加」「点一下就能收藏」「报表要能导出 Excel」「库存为 0 时按钮置灰」「大促期间系统要稳定」「只有店长能改价格」。听着都能做，但真正能直接进开发的只有 3 条。为什么？「改收货地址」没说已发货怎么办，做出来大概率返工；「要快」没有阈值，测试同学写不出用例；「要稳定」更是完全没有判定标准——什么叫稳定，99% 还是 99.99%，差一个数量级。你要做的是三档判定：可测、需澄清、不可测。这三档的界线不是难度，是有没有判定标准。判档这件事最好在需求评审会上当场做，别等排期定了再发现做不了。判档这件事最忌讳拖到排期会现场做，那时候没人愿意承认自己的需求写不清。提前一天发出去，对方还有时间补。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"8 条口语需求：改地址 / 快 / 叠加 / 收藏 / 导出…\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条口语需求：改地址 / 快 / 叠加 / 收藏 / 导出…</tspan></text></g><g data-k=\"能直接开发：3 条\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">能直接开发：3 条</tspan></text></g><g data-k=\"需澄清 3 条、不可测 2 条\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">需澄清 3 条、不可测 2 条</tspan></text></g></svg>", "d": 79.44}, {"t": "三档判定的界线：有没有判定标准", "n": "可测的标准很简单：三要素齐，测试同学拿到能直接写脚本。需澄清是方向清楚但缺一项——可能缺触发时机（什么时候能改地址）、缺预期（收藏后按钮变什么）、缺数据准备（用什么账号测）。不可测是连判定标准都没有：「要稳定」「要好用」「要流畅」，这类不是需求，是情绪。三档里最容易误判的是把「需澄清」当「可测」——因为方向太清楚了，你会默认对方和你想的一样。实践中的检验办法只有一句：请测试同学照着写一条用例，写不出来就是没达标。还有一个自查办法：把用例交给不了解这个需求的人，他能不能照着执行——能，才算写清。另外提醒一句：判「不可测」不等于否定这条需求，它的方向可能是对的，只是还没到能开发的颗粒度，别在评审会上把它说成「这个做不了」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三档的界线</tspan></text><g data-k=\"可测：三要素齐\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">可测：三要素齐</tspan></text></g><g data-k=\"需澄清：方向清楚缺一项\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">需澄清：方向清</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">楚缺一项</tspan></text></g><g data-k=\"不可测：没有判定标准\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">不可测：没有判</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">定标准</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 74.11}, {"t": "模型的活与人的活：它补用例，你补规则", "n": "字段判完，模型很擅长把「需澄清」补成完整用例——它会自动补上前置、步骤、预期，写得像模像样。但这里有个陷阱：它会替你把业务规则也定了。比如 Q01，它会直接写「已发货不可修改，需拒收后重新下单」，这个规则本身可能是对的，但不是它该定的，也不是你该定的——这是履约和客服的政策。所以提示词里要写死「禁止替需求方补业务规则」。你的活是三件事：判档、指出缺哪一项、把需要确认的问题列成一张清单发给对应的人。清单不需要长，八条以内，每条写「问谁、问什么、什么时候要答复」。这张清单最好当场发出去，会议纪要里带上日期，否则澄清会一直挂着。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">模型做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人来做</tspan></text><g data-k=\"补用例三要素 / 找缺项\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">补用例三要素 / 找缺项</tspan></text></g><g data-k=\"定业务规则 / 确认阈值依据 / 找谁确认\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">定业务规则 / 确认阈值依</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">据 / 找谁确认</tspan></text></g></svg>", "d": 64.2}], "deliverable": {"type": "sheet", "name": "需求可测性评审表", "rubric": ["判定准确", "缺项具体", "用例可执行"], "acceptance": "8 条需求每条都有判定与缺项标注；不可测的写清要补什么，可测的写出三要素"}, "demo": {"ref": "■ 可测性判定（8 条）\n\nQ01｜支持用户改收货地址 → 需澄清（缺触发时机）\n　缺：未发货 / 已发货 / 已签收三种状态分别怎么处理，谁承担运费差。\n　补成：未发货可改、已发货不可改只能拒收，写明运费规则即可测。\n\nQ02｜列表页加载要快 → 不可测（缺阈值）\n　缺：多快算快、什么网络条件、看哪个百分位。\n　补成：4G 下首屏 P75 ≤1.5 秒，弱网 3G ≤3 秒。\n\nQ03｜优惠券不能叠加 → 可测\n　用例：前置=账户有 2 张可用券；步骤=结算页依次勾选两张；预期=第二张置灰并提示「不可与同类券同用」。\n\nQ04｜用户点一下就能收藏 → 需澄清（缺预期结果）\n　缺：收藏后按钮变成什么、在哪能看到收藏列表、能否取消。\n\nQ05｜报表要能导出 Excel → 需澄清（缺预期结果）\n　缺：导出哪些列、金额含不含运费、单次上限多少行。\n\nQ06｜库存为 0 时按钮置灰 → 可测\n　用例：前置=某 SKU 库存调为 0；步骤=进商详页；预期=「立即购买」置灰且显示「暂时缺货」。\n\nQ07｜大促期间系统要稳定 → 不可测（缺阈值）\n　缺：可用性目标、错误率上限、并发峰值。\n　补成：大促峰值并发 5000，可用性 ≥99.9%，5xx 错误率 ≤0.5%。\n\nQ08｜只有店长能改价格 → 可测\n　用例：前置=普通运营账号；步骤=进入商品编辑页尝试改价；预期=价格字段只读并提示「无权限」。\n\n■ 结论：可测 3 条、需澄清 3 条、不可测 2 条。\n■ 建议：不可测的 2 条打回需求方，补齐后再排期。\n■ 补充：行业实践是需求评审前完成 80% 用例设计，建议全面推行。", "fix": ["「行业实践 80%」删掉——没有来源的比例，写进评审材料只会被追问", "Q01 的补充建议里，把「写明运费规则」改成「需需求方确认：运费差由谁承担」，规则不能由我替他定", "Q02/Q07 只给阈值不够，补一句「阈值由谁定、依据是什么」（可参考竞品或历史峰值），否则阈值也是拍的", "给全部「需澄清」项加一列「找谁确认 + 什么时候」，否则澄清会无限期挂着"], "judge": "判断依据：有没有把「快」「稳定」判成可测；缺项是否指到具体那一项；补的建议是否落到可执行；有没有替需求方补业务规则", "sheet": {"situ": "需求评审会前，运营、客服、门店各提了几条需求，都是原话，没写成文档。排期会已经定在后天，你得先过一遍：哪些能直接进开发、哪些必须回去问清楚、哪些根本没法定标准。判完还要把清单发给提需求的人。", "ask": "① 8 条需求逐条判三档（可测 / 需澄清 / 不可测），并指出缺的是哪一项；② 用你的表请 AI 补用例、给补法；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 判定每条可测 / 需澄清 / 不可测；② 指出缺的是哪一项；③ 对可测的写出三要素用例，对不可测的写出「补成什么样就可测」；④ 列出需要找谁确认、什么时候要答复。\n禁止替需求方补业务规则（规则只能由他确认），禁止编造行业人日或开发工时。", "mats": [{"id": "Q01", "src": "客服提 · 原话", "text": "支持用户改收货地址。"}, {"id": "Q02", "src": "运营提 · 原话", "text": "列表页加载要快。"}, {"id": "Q03", "src": "运营提 · 原话", "text": "优惠券不能叠加使用。"}, {"id": "Q04", "src": "产品提 · 原话", "text": "用户点一下就能收藏商品。"}, {"id": "Q05", "src": "财务提 · 原话", "text": "报表要能导出 Excel。"}, {"id": "Q06", "src": "仓储提 · 原话", "text": "库存为 0 时购买按钮置灰。"}, {"id": "Q07", "src": "技术提 · 原话", "text": "大促期间系统要稳定。"}, {"id": "Q08", "src": "门店提 · 原话", "text": "只有店长能改价格。"}], "cols": [{"k": "q", "name": "判定", "hint": "只有三档，别写「基本可测」", "type": "chips", "w": 3, "tags": ["可测", "需澄清", "不可测"]}, {"k": "miss", "name": "缺的是哪一项
