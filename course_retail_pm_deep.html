", "hint": "三要素齐就选第一个", "type": "chips", "w": 3, "tags": ["不缺（三要素齐）", "触发时机", "预期结果", "阈值标准", "数据准备", "权限角色"]}, {"k": "act", "name": "补成什么就可测", "hint": "选一条最直接的补法", "type": "chips", "w": 3, "tags": ["三种发货状态下分别能不能改", "给出首屏 P75 时间上限", "三要素齐，无需补充", "写明点击后按钮状态与收藏入口", "写明导出列、金额口径与行数上限", "写明并发峰值与可用性目标", "写明哪些角色可改、可改哪些字段"]}], "key": {"Q01": {"q": "需澄清", "miss": "触发时机", "act": "三种发货状态下分别能不能改"}, "Q02": {"q": "不可测", "miss": "阈值标准", "act": "给出首屏 P75 时间上限"}, "Q03": {"q": "可测", "miss": "不缺（三要素齐）", "act": "三要素齐，无需补充"}, "Q04": {"q": "需澄清", "miss": "预期结果", "act": "写明点击后按钮状态与收藏入口"}, "Q05": {"q": "需澄清", "miss": "预期结果", "act": "写明导出列、金额口径与行数上限"}, "Q06": {"q": "可测", "miss": "不缺（三要素齐）", "act": "三要素齐，无需补充"}, "Q07": {"q": "不可测", "miss": "阈值标准", "act": "写明并发峰值与可用性目标"}, "Q08": {"q": "需澄清", "miss": "权限角色", "act": "写明哪些角色可改、可改哪些字段"}}, "notes": {"Q01·q": "方向很清楚，容易误判成「可测」；但未发货、已发货、已签收三种状态的处理完全不同，缺的是触发时机这一项，不是难度问题", "Q02·q": "「快」不是需求，是情绪。没有网络条件、没有百分位、没有上限，测试同学写不出用例", "Q07·q": "「稳定」同样没有判定标准：可用性 99% 还是 99.99%，差两个数量级，并发峰值也没给，压测方案都排不出来", "Q04·q": "收藏这个动作本身谁都懂，所以最容易被当成可测；缺的是点击后按钮变成什么、收藏列表在哪进——没有预期结果就无法判定", "Q05·q": "导出 Excel 技术上没有难度，但导出哪些列、金额含不含运费、单次上限多少行都没定，缺的是预期结果", "Q08·q": "权限类需求最常见的漏项：没说除店长外还有哪些角色、能改的是零售价还是活动价，这属于权限角色缺项"}, "delta": [{"op": "删", "frm": "模型补的一句「参照行业实践，同类需求平均开发 3 人日」", "to": "整句删除", "why": "没有来源的人日估算会被直接质疑，还会让人误以为排期已经谈过", "kw": ["行业", "人日", "3 人日", "平均开发", "实践"]}, {"op": "改", "frm": "Q01 的补法写成「已发货不可修改，需拒收后重新下单」", "to": "改成「需客服与履约确认：已发货/已签收分别怎么处理、运费差由谁承担」", "why": "这是履约和客服的政策，不是 PM 能替需求方定的规则；写死了就是越权", "kw": ["确认", "履约", "客服", "政策", "谁承担"]}, {"op": "改", "frm": "Q02 / Q07 只给一个阈值就完事", "to": "补一句「阈值由谁定、依据是什么（历史峰值或竞品实测）」", "why": "拍出来的阈值和「要快」一样不可执行，评审时一样会被打回", "kw": ["依据", "谁定", "历史", "峰值", "竞品"]}, {"op": "补", "frm": "（模型没写）", "to": "给全部「需澄清」项加一列「找谁确认 + 什么时候答复」", "why": "不写责任人和时限，澄清会一直挂着，排期到了还是没人回答", "kw": ["找谁", "确认", "什么时候", "答复", "时限"]}], "refsheet": "Q01｜需澄清｜触发时机｜三种发货状态下分别能不能改\nQ02｜不可测｜阈值标准｜给出首屏 P75 时间上限\nQ03｜可测｜不缺（三要素齐）｜三要素齐，无需补充\nQ04｜需澄清｜预期结果｜写明点击后按钮状态与收藏入口\nQ05｜需澄清｜预期结果｜写明导出列、金额口径与行数上限\nQ06｜可测｜不缺（三要素齐）｜三要素齐，无需补充\nQ07｜不可测｜阈值标准｜写明并发峰值与可用性目标\nQ08｜需澄清｜权限角色｜写明哪些角色可改、可改哪些字段\n\n三处最容易判错的：\n· Q01 方向太清楚，容易被判成「可测」——缺的是三种发货状态的处理，属触发时机缺项。\n· Q04 / Q05 技术上都没难度，但都没有预期结果，仍是「需澄清」。\n· 只有 Q03 / Q06 是可以直接进开发的：前置、步骤、预期三段都齐。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」本周 8 条口语化需求（提需求的人原话）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条是可测、需澄清还是不可测；② 指出缺的是哪一项；③ 对可测的写出三要素用例，对不可测的写出「补成什么样就可测」。禁止替需求方补业务规则（规则只能由他确认）。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三档判定（可测/需澄清/不可测）+ 缺项归类（时机/预期/阈值/数据/权限）\n【参考案例】「支持改收货地址」缺触发时机，「系统要稳定」缺阈值，两条都不能直接开发\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」本周 8 条口语化需求（提需求的人原话）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条是可测、需澄清还是不可测；② 指出缺的是哪一项；③ 对可测的写出三要素用例，对不可测的写出「补成什么样就可测」。禁止替需求方补业务规则（规则只能由他确认）。", "rubric": ["每条只判三档之一（可测 / 需澄清 / 不可测），不能写「基本可测」这类模糊档", "需澄清的必须指出缺哪一项（触发时机 / 预期结果 / 阈值 / 数据准备 / 权限角色），泛泛写「需补充」不计分", "不可测的要给出一条「补成什么样就可测」的具体建议（如「给出 P75 响应时间上限」）", "判为可测的至少写出一条三要素用例，缺预期结果不算"]}, {"id": "M5U3", "tier": "basic", "step": "todo", "title": "产出《上线检查清单》", "video": {"dur": "3.4min", "script": ["上线事故八成不是代码写错，而是清单上少了一行——而那一行从来没人写过", "四类检查（数据/配置/回滚/观察）+ 每条带责任人与验收方式", "某次大促上线漏了「优惠券库存」，开卖 12 分钟券被领空，损失一场活动"]}, "ppt": {"method": "四类检查（数据/配置/回滚/观察）+ 每条带责任人与验收方式", "case": "某次大促上线漏了「优惠券库存」，开卖 12 分钟券被领空，损失一场活动", "demo": "清单骨架 + 一份填好的样例（含回滚演练记录）"}, "objective": "能产出一份可执行的上线检查清单，覆盖数据、配置、回滚与观察四类，每条有责任人", "transfer": "用这份清单对一次最近的上线做复盘，把漏掉的项补进团队模板", "vslides": [{"t": "任务说明：清单是给凌晨两点用的人看的", "n": "上线检查清单有个特点：真正用它的人，是在晚上十一点、几百个并发进来的时候，一边看监控一边翻它。所以清单不能写成原则，要写成动作：「关闭 promo_preheat_v2」「撤回价格表用备份快照」，这种一句话能被执行的话。四类内容缺一不可。数据类管「改了什么、怎么确认改对了」；配置类管「开关、库存、限购这些容易漏的东西」；回滚类管「错了怎么退、多久退完」；观察类管「上线后盯着哪三个数」。很多人只写前两类，因为前两类是「做事」，后两类是「兜底」——但事故恰恰都发生在兜底上。清单的另一条原则是：只写当晚能执行的动作，不写需要提前三天准备的事。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 数据类\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 数据类</tspan></text></g><g data-k=\"② 配置类\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 配置类</tspan></text></g><g data-k=\"③ 回滚类\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 回滚类</tspan></text></g><g data-k=\"④ 观察类\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 观察类</tspan></text></g><g data-k=\"⑤ 沟通类\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 沟通类</tspan></text></g></svg>", "d": 62.86}, {"t": "配置类是重灾区，一条一条列", "n": "零售场景的上线事故，八成都出在配置上，而不是代码。券库存配错了、限购没开、灰度比例写成 100%、活动时间多写一个零、某个仓的库存没同步——这些在代码评审里永远看不见。所以配置类要一条一条列，每条写三项：默认值、生效时间、验证方式。「满 299 减 50 配 5000 张」是默认值；「22:00 手动打开」是生效时间；「后台券剩余量与配置一致」是验证方式。第三项最容易被省，但没有它，你只是「以为配对了」。验证方式最好能用测试账号实操一遍，比如「连下 3 单看第 3 单是否被拦」。配置项最好让两个人各念一遍，念的人不看屏幕、听的人对后台——这招抓到过好几次错。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"券库存 / 限购 / 灰度比例\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">券库存 / 限购 / 灰度比例</tspan></text></g><g data-k=\"每条写默认值 + 生效时间\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条写默认值 + 生效时间</tspan></text></g><g data-k=\"每条写验证方式\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条写验证方式</tspan></text></g><g data-k=\"能用测试账号实操一遍\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">能用测试账号实操一遍</tspan></text></g></svg>", "d": 64.39}, {"t": "回滚要演练，不能只写步骤", "n": "回滚这一节，写四样：触发条件、步骤、耗时、数据修复。触发条件要量化：「支付失败率 >2%」而不是「出问题时」；步骤要具体到开关名和备份快照；耗时必须写，因为它决定了你能不能在窗口期内退回来；数据修复最容易被忽略——配置退回去了，但已经产生的订单、已经发的券怎么办，这一条不写，回滚只完成了一半。还有一件事：回滚要演练。演习一次你会发现，实际耗时往往是预估的两倍，某个开关的权限不在你手上，备份快照的恢复脚本没人跑过。演练记录写进清单，比写十句「确保可回滚」有用。演练完把实测耗时写在清单第一行，值班的人一眼就能看到最坏要多久。还有一点：演练至少安排一次在非工作时间做，因为真正的故障基本都发生在没人加班的时候，白天的演练测不出人手够不够。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">回滚四件套</tspan></text><g data-k=\"触发条件\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">触发条件</tspan></text></g><g data-k=\"步骤\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">步骤</tspan></text></g><g data-k=\"耗时\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">耗时</tspan></text></g><g data-k=\"数据修复\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">数据修复</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 74.42}], "deliverable": {"type": "doc", "name": "上线检查清单", "rubric": ["四类齐全", "责任到岗", "可回滚"], "acceptance": "一份能照着执行的上线清单：每类≥2 条、每条有责任岗位与验证方式、含一次回滚演练记录"}, "practice": {"steps": ["数据类：本次涉及的数据变更（表结构/字段/初始值/迁移），写清谁执行、怎么验证", "配置类：开关、阈值、券库存、限购、灰度比例，逐条列出默认值与生效时间", "回滚类：回滚触发条件、回滚步骤、回滚耗时、回滚后数据如何修复", "观察类：上线后看哪三个指标、看多久、谁看、什么情况触发回滚", "沟通类：谁通知谁（运营/客服/仓配）、什么时候通知、话术给谁"], "exemplar": "【上线检查清单 · 双十一预热活动页】版本 v2.3　上线时间：10/31 22:00　负责人：产品经理\n\n■ 一、数据类（2 条）\n1. 活动商品表新增 promo_tag 字段（varchar 16，默认 null）\n　执行：数据组张工｜验证：抽查 10 个 SKU 的 promo_tag 与运营配置表一致｜时间：22:00 前\n2. 预热价写入价格表，覆盖 128 个 SKU\n　执行：数据组张工｜验证：抽 5 个 SKU 核对前后端价格一致、且不高于日常价｜时间：22:30 前\n\n■ 二、配置类（3 条）\n1. 预热页开关 promo_preheat_v2：默认关闭，22:00 手动打开｜责任人：产品经理｜验证：打开后首页出现入口\n2. 优惠券库存：满 299 减 50 配 5,000 张，满 599 减 120 配 1,200 张｜责任人：运营｜验证：后台券剩余量与配置一致\n3. 限购：每用户每 SKU 限 2 件｜责任人：运营｜验证：用测试账号连下 3 单，第 3 单被拦\n\n■ 三、回滚类（2 条）\n1. 触发条件：预热页 UV 转化低于日常 50%，或支付失败率 >2%，或价格错误投诉 ≥3 条\n2. 回滚步骤：① 关闭 promo_preheat_v2 ② 撤回价格表（用备份快照）③ 券库存冻结（停止发放）\n　预计耗时：配置回滚 3 分钟，价格回滚 10 分钟\n　数据修复：已下单用户保留原价，差额由运营在 48 小时内补券\n　演练记录：10/29 15:00 在预发环境演练一次，实际耗时 4 分 20 秒（配置）+ 8 分钟（价格）\n\n■ 四、观察类（3 条）\n1. 预热页 UV → 商详点击率（基线 18%）：低于 12% 触发排查｜观察 2 小时｜责任人：数据分析\n2. 支付失败率（基线 1.2%）：高于 2% 触发回滚｜观察 2 小时｜责任人：数据分析\n3. 客服工单「价格不对」类（基线 0 条/小时）：≥3 条/小时触发回滚｜观察 4 小时｜责任人：客服主管\n\n■ 五、沟通类（2 条）\n1. 22:00 上线后 10 分钟内通知客服主管与仓配值班，附活动规则一页纸｜责任人：产品经理\n2. 客服话术更新：价格疑问统一回复「以订单页价格为准，差额可补券」｜责任人：客服主管\n\n■ 六、本次不覆盖\n不做流量压测（预热页复用去年架构，已压过）；不含海外站（本期不参与）。"}, "task": "产出《上线检查清单》：数据类：本次涉及的数据变更（表结构/字段/初始值/迁移），写清谁执行、怎么验证；配置类：开关、阈值、券库存、限购、灰度比例，逐条列出默认值与生效时间；回滚类：回滚触发条件、回滚步骤、回滚耗时、回滚后数据如何修复；观察类：上线后看哪三个指标、看多久、谁看、什么情况触发回滚；沟通类：谁通知谁（运营/客服/仓配）、什么时候通知、话术给谁", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M5 AI 嵌入研发协同与运营」模块，你要交付的是《上线检查清单》。\n【场景】业务侧这周的诉求是：上线事故八成不是代码写错，而是清单上少了一行——而那一行从来没人写过。参考做法：某次大促上线漏了「优惠券库存」，开卖 12 分钟券被领空，损失一场活动。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（四类检查（数据/配置/回滚/观察）+ 每条带责任人与验收方式），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《上线检查清单》填写模板】\n\n■ 1. 数据类：本次涉及的数据变更（表结构/字段/初始值/迁移），写清谁执行、怎么验证\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 配置类：开关、阈值、券库存、限购、灰度比例，逐条列出默认值与生效时间\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 回滚类：回滚触发条件、回滚步骤、回滚耗时、回滚后数据如何修复\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 观察类：上线后看哪三个指标、看多久、谁看、什么情况触发回滚\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 沟通类：谁通知谁（运营/客服/仓配）、什么时候通知、话术给谁\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【上线检查清单 · 双十一预热活动页】版本 v2.3　上线时间：10/31 22:00　负责人：产品经理\n\n■ 一、数据类（2 条）\n1. 活动商品表新增 promo_tag 字段（varchar 16，默认 null）\n　执行：数据组张工｜验证：抽查 10 个 SKU 的 promo_tag 与运营配置表一致｜时间：22:00 前\n2. 预热价写入价格表，覆盖 128 个 SKU\n　执行：数据组张工｜验证：抽 5 个 SKU 核对前后端价格一致、且不高于日常价｜时间：22:30 前\n\n■ 二、配置类（3 条）\n1. 预热页开关 promo_preheat_v2：默认关闭，22:00 手动打开｜责任人：产品经理｜验证：打开后首页出现入口\n2. 优惠券库存：满 299 减 50 配 5,000 张，满 599 减 120 配 1,200 张｜责任人：运营｜验证：后台券剩余量与配置一致\n3. 限购：每用户每 SKU 限 2 件｜责任人：运营｜验证：用测试账号连下 3 单，第 3 单被拦\n\n■ 三、回滚类（2 条）\n1. 触发条件：预热页 UV 转化低于日常 50%，或支付失败率 >2%，或价格错误投诉 ≥3 条\n2. 回滚步骤：① 关闭 promo_preheat_v2 ② 撤回价格表（用备份快照）③ 券库存冻结（停止发放）\n　预计耗时：配置回滚 3 分钟，价格回滚 10 分钟\n　数据修复：已下单用户保留原价，差额由运营在 48 小时内补券\n　演练记录：10/29 15:00 在预发环境演练一次，实际耗时 4 分 20 秒（配置）+ 8 分钟（价格）\n\n■ 四、观察类（3 条）\n1. 预热页 UV → 商详点击率（基线 18%）：低于 12% 触发排查｜观察 2 小时｜责任人：数据分析\n2. 支付失败率（基线 1.2%）：高于 2% 触发回滚｜观察 2 小时｜责任人：数据分析\n3. 客服工单「价格不对」类（基线 0 条/小时）：≥3 条/小时触发回滚｜观察 4 小时｜责任人：客服主管\n\n■ 五、沟通类（2 条）\n1. 22:00 上线后 10 分钟内通知客服主管与仓配值班，附活动规则一页纸｜责任人：产品经理\n2. 客服话术更新：价格疑问统一回复「以订单页价格为准，差额可补券」｜责任人：客服主管\n\n■ 六、本次不覆盖\n不做流量压测（预热页复用去年架构，已压过）；不含海外站（本期不参与）。", "rubric": ["四类（数据/配置/回滚/观察）每类至少 2 条，缺一类按未写完计", "每条写清责任岗位与验证方式（谁执行、怎么确认成功），只写事项不写人的不计分", "回滚部分含触发条件、步骤、预计耗时与数据修复方案，四项缺一不可", "观察部分写明三个指标、观察时长与回滚阈值，不写「持续关注」"]}, {"id": "M5U4", "tier": "basic", "step": "spar", "title": "运维负责人挑战你的上线方案", "video": {"dur": "3.1min", "script": ["运维不关心你的功能多漂亮，只关心出事了能不能在十分钟内退回上一个状态", "挑战清单：回滚触发 / 回滚耗时 / 数据修复 / 值班责任", "「你说可回滚，几分钟能退回来？数据谁修？」——三种答法的区别"]}, "ppt": {"method": "挑战清单：回滚触发 / 回滚耗时 / 数据修复 / 值班责任", "case": "「你说可回滚，几分钟能退回来？数据谁修？」——三种答法的区别", "demo": "陪练对话界面说明（把上线清单粘进系统提示词，让对手按你的回滚项发问）"}, "objective": "能在运维负责人 4 轮追问下，说清回滚触发条件、耗时与数据修复责任", "transfer": "把陪练里定下的三个回滚阈值写进发布单，上线前让运维值班签字确认", "vslides": [{"t": "陪练说明：他只信演练过的数字", "n": "运维负责人的问题永远是四个：几分钟退回来、数据怎么办、谁有权按按钮、出事了谁在一线。这四个问题背后是同一个担心——凌晨两点出事的时候，你写的那份清单能不能真的被执行。所以他对「可回滚」这三个字免疫，他要的是「配置 3 分钟、价格 10 分钟，演练过，实测 4 分 20 秒」。你报不出实测值，他就在心里给你标一个「没演练过」，然后要求你加人值守。这一关不是考技术，是考你有没有认真对待「错了怎么办」这件事。他会看你的清单里有没有写「谁在一线」——出事那一刻需要一个人在群里说清现状与下一步，这个人不能是「大家」。夜班出事的第一分钟靠的是清单不是记忆，清单是给状态最差的那个人准备的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他的四问</tspan></text><g data-k=\"几分钟退回来\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">几分钟退</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">回来</tspan></text></g><g data-k=\"数据怎么处置\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">数据怎么</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">处置</tspan></text></g><g data-k=\"谁能按按钮\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">谁能按按</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">钮</tspan></text></g><g data-k=\"谁在一线\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">谁在一线</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 63.07}, {"t": "数据处置：最容易被回避的一问", "n": "「已经成交的订单按错误价卖的，退还是不退」——这一问很多人都答不利索。退，会引发二次投诉和信任损伤；不退，用户觉得被占便宜。正确答法是分档：差额在可承受范围内（比如单均 30 元以内），保留原价、48 小时内补券，责任在运营；如果错误价格低于成本线，那就不是补券问题，要立刻紧急下架，并且这个动作通常需要更高权限的人签。关键是把「谁承担、什么时候、走什么流程」说清楚，而不是含糊地说「会妥善处理」。补券成本也要提前算：几十单和几千单是完全不同的决策，最好写明「超过 X 单就升级到更高层决策」。补券的钱从活动预算出还是从客服口径出，要提前定下来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 小额差额：保留原价 + 补券\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 小额差额：保留原价 + 补券</tspan></text></g><g data-k=\"② 低于成本线：紧急下架 + 上报\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 低于成本线：紧急下架 + 上报</tspan></text></g><g data-k=\"③ 说清谁承担、多久完成\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 说清谁承担、多久完成</tspan></text></g></svg>", "d": 63.98}, {"t": "权限与降级：凌晨两点能不能按到那个按钮", "n": "回滚权限是最现实的问题：开关在谁手上、那个人凌晨两点能不能被叫醒、他有没有权限。很多团队的回滚开关只有一个人有权限，而那个人在休假。所以清单里要写清「主责 + 备份」两个人，以及非工作时间的触达方式。最后是全量与局部：不是所有问题都要全量回滚。如果只有某个渠道、某个地区受影响，局部降级（关掉那个渠道的入口）比全量回滚更快、影响更小。判断依据两条：影响面多大、涉不涉及资金。涉及资金的一律从严，宁可全量退。把回滚开关的权限清单贴在发布单上、附两个人手机号，比写「保持通讯畅通」有用得多。权限清单比流程文档更贴近实战。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"主责 + 备份两人\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">主责 + 备份两人</tspan></text></g><g data-k=\"非工作时间怎么触达\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">非工作时间怎么触达</tspan></text></g><g data-k=\"局部降级优先于全量\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">局部降级优先于全量</tspan></text></g><g data-k=\"涉资金从严\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">涉资金从严</tspan></text></g></svg>", "d": 60.41}], "deliverable": {"type": "doc", "name": "上线检查清单", "rubric": ["耗时实测", "数据处置", "权限清楚"], "acceptance": "四问都能给出实测耗时、数据处置方案、权限归属与局部降级策略"}, "spar": {"role": "运维负责人", "persona": "值过无数个大促夜班，最烦「应该能回滚」；只问四件事：几分钟退回来、数据怎么办、谁有权按那个按钮、出事了谁在一线", "mustAsk": ["你说可回滚，几分钟能退回来？演练过吗，实测多少？", "已经成交的订单按错误价卖的，你退还是不退？谁来补这个差？", "回滚开关的权限在谁手上？凌晨两点你能按到吗？", "如果只是部分用户受影响，你全量回滚还是局部降级？怎么判断？"]}, "exemplar": "（问：你说可回滚，几分钟能退回来？数据谁修？）\n\n结论：配置 3 分钟内可退，价格表 10 分钟内可退，已经产生的订单不退，由运营补券兜底。\n依据：配置是开关级别，app_config 表改一个字段即可生效，10/29 预发演练实测 4 分 20 秒；价格表用分钟级备份快照，恢复脚本演练过，实测 8 分钟。这两项都写进了发布单第 3 节。\n边界：我不承诺「零数据影响」。10 分钟窗口内可能有几十单按错误价格成交，这部分我不回滚订单——回滚订单会引发二次投诉，正确做法是保留原价、48 小时内补券，责任在运营；如果错误价格低于成本线，那就不是补券问题，我会立刻联系你走紧急下架流程，那个流程我没有权限，需要你签。", "task": "把《上线检查清单》拿到「运维负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《上线检查清单》。现在要让它通过「运维负责人」这一关。\n【对手的立场】值过无数个大促夜班，最烦「应该能回滚」；只问四件事：几分钟退回来、数据怎么办、谁有权按那个按钮、出事了谁在一线。\n【他一定会追问】「你说可回滚，几分钟能退回来？演练过吗，实测多少？」 / 「已经成交的订单按错误价卖的，你退还是不退？谁来补这个差？」 / 「回滚开关的权限在谁手上？凌晨两点你能按到吗？」\n【场景】你说「运维负责人挑战你的上线方案」，对方立刻回一句：你说可回滚，几分钟能退回来？演练过吗，实测多少？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["回滚耗时给的是演练实测值（分/秒），不是「大概几分钟」", "说清已成交订单怎么处理（保留/补差/退款），并指明谁承担", "明确回滚权限在谁手上，以及非工作时间怎么触达那个人", "能区分全量回滚与局部降级，并给出判断依据（影响面多少、是否涉及资金）"]}, {"id": "M5U5", "tier": "adv", "step": "understand", "title": "营销自动化编排", "video": {"dur": "3.3min", "script": ["自动化最大的风险不是不生效，是生效了但停不下来——把用户推到退订", "链路五段（触发 → 判断 → 动作 → 等待 → 退出）+ 三条防打扰规则", "加购未付 2 小时推券，转化 6.8%；同一用户 72 小时内最多触达 2 次，退订率降一半"]}, "ppt": {"method": "链路五段（触发 → 判断 → 动作 → 等待 → 退出）+ 三条防打扰规则", "case": "加购未付 2 小时推券，转化 6.8%；同一用户 72 小时内最多触达 2 次，退订率降一半", "demo": "同一条链路加不加退出规则，效果差在哪"}, "objective": "能画出一条可执行的营销自动化链路，并说清每个触发点的条件和退出规则", "transfer": "选一个正在手工做的触达动作，画出它的触发条件与退出规则，发给运营确认", "vslides": [{"t": "开场：自动化不是发消息，是编排一段路径", "n": "很多人把营销自动化理解成「定时发券」，那不叫自动化，叫群发。真正的编排是一条有判断的路径：用户做了某个动作触发进来，系统判断他属于哪类人，给他对应的动作，等一段时间看反应，再决定下一步或者退出。五段缺一不可。触发要具体到事件与时间窗——「加购后 2 小时未支付」是触发，「用户有兴趣」不是。判断决定给他哪条分支：新客给首单券，老客给复购券。动作要写清渠道与内容，短信还是站内信，文案说什么。等待是给用户反应时间，2 小时和 24 小时效果完全不同。退出最容易被忘：他买了要退出，他退订要退出，触达次数到上限也要退出。少了退出，这条链路就会一直追着人跑。五段里最容易写漏的是「退出」——因为写链路的人满脑子都是「怎么把人拉回来」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">链路五段</tspan></text><g data-k=\"触发\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">触发</tspan></text></g><g data-k=\"判断\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">判断</tspan></text></g><g data-k=\"动作\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">动作</tspan></text></g><g data-k=\"等待\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">等待</tspan></text></g><g data-k=\"退出\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">退出</tspan></text></g></svg>", "d": 74.9}, {"t": "三条防打扰规则：这是自动化的底线", "n": "第一条，触达上限。同一个人在一个周期内最多被触达几次，写死在系统里，比如 72 小时内最多 2 次。这一条不是可选项，因为链路一多，用户可能同时被三条链路追着发消息。第二条，优先级与互斥。多条链路同时命中一个人时，谁优先？通常按「离成交最近」排：加购未付高于浏览未加购，高于静默唤醒。命中高优先级后，低优先级的消息不再发。第三条，熔断。退订率、投诉率超过阈值就停发，并且要有明确的人有权按停。这三条写在链路图旁边，比链路本身更重要。频控要写进系统，不能靠人记；靠人记的规则，链路一多必然失效。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 触达上限：72 小时 ≤2 次\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 触达上限：72 小时 ≤2 次</tspan></text></g><g data-k=\"② 优先级互斥：离成交最近优先\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 优先级互斥：离成交最近优先</tspan></text></g><g data-k=\"③ 熔断：退订率超阈值即停，谁有权停\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 熔断：退订率超阈值即停，谁有权停</tspan></text></g></svg>", "d": 61.37}, {"t": "边界：自动化会把小错放大", "n": "手工发消息出错，影响一次；自动化出错，会连续错一整晚。常见放大有三种。第一，人群包写错：把「已支付」写成「未支付」，一夜之间给所有买过的人发催付。第二，变量缺失：文案里的「亲爱的 {昵称}」昵称是空的，变成「亲爱的 ，」。第三，时区与时间：凌晨三点推送，退订率会翻倍。所以上线前必须做三件事：小流量试跑（1% 人群，跑一轮）、文案变量兜底（空值显示什么）、发送时段限制（比如只在 9 点到 21 点发）。这三件事每件都很小，但少了任何一件，都可能让一次活动变成一次事故。这三件事成本都很低，但它们决定了自动化是「提效」还是「添乱」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"小流量试跑 1% 再放量\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">小流量试跑 1% 再放量</tspan></text></g><g data-k=\"文案变量要有兜底\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">文案变量要有兜底</tspan></text></g><g data-k=\"限制发送时段\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">限制发送时段</tspan></text></g><g data-k=\"人群包上线前双人核对\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">人群包上线前双人核对</tspan></text></g></svg>", "d": 62.09}], "deliverable": {"type": "doc", "name": "自动化链路图", "rubric": ["链路完整", "退出明确", "防打扰"], "acceptance": "给出一条完整链路（触发/判断/动作/等待/退出），并写出防打扰上限与熔断条件"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】链路五段（触发 → 判断 → 动作 → 等待 → 退出）+ 三条防打扰规则\n【为什么重要】自动化最大的风险不是不生效，是生效了但停不下来——把用户推到退订\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["链路五段齐全：触发条件（具体到行为与时间窗）、人群判断、动作（渠道+内容）、等待时长、退出规则", "触发条件必须是可被系统识别的事件（如「加购后 2 小时未支付」），不写「用户有兴趣时」", "退出规则至少两条：达成目标退出（已支付）、触达上限退出（N 次/周期）", "写出熔断条件（如退订率超过阈值即停发），并说明谁有权停"]}, {"id": "M5U6", "tier": "adv", "step": "demo", "title": "用 AI 生成活动玩法与文案", "video": {"dur": "3.3min", "script": ["文案出问题不是改一句话的事，是整场活动被下架、还要留记录备查", "合规四查（绝对化 / 价格真实 / 功效宣称 / 诱导）+ 三档判定与改写", "「全网最低价」与「7 天见效」两条被法务打回，「买二送一」可用但赠品要写明"]}, "ppt": {"method": "合规四查（绝对化 / 价格真实 / 功效宣称 / 诱导）+ 三档判定与改写", "case": "「全网最低价」与「7 天见效」两条被法务打回，「买二送一」可用但赠品要写明", "demo": "WorkBuddy 内跑一遍：先判违规类型，再让模型改写，最后自己核价格依据"}, "objective": "能判断 8 条活动文案能不能上线，把违规表述改成可用表达，且不越权下法律结论", "transfer": "把本季活动文案按这套判一遍，把判为禁用的三条整理给法务确认", "vslides": [{"t": "演示准备：8 条文案里 3 条不能上线", "n": "这一批文案是运营写好的活动文案，读起来都很带劲：「全网最低价，买贵退差」「限时 3 天，恢复原价 599」「7 天改善睡眠」「分享给 3 位好友解锁折扣」。带劲的原因，恰恰是它们踩线的地方——绝对化用语、虚构原价、功效宣称、诱导分享，这四类是最常见的。还有两条看着没问题，其实要附条件：「前 100 名 5 折」必须写清名额统计口径，否则纠纷必来；「清仓价」要能证明真的是清库存，原价成交记录要留档。你要做的不是改几个字，是把这 8 条过一遍三档判定，并给出能直接替换上线的文案。判定顺序建议：先看有没有绝对化承诺，再看价格有没有依据，最后看有没有功效或诱导。判定顺序错了容易漏项。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四类高频踩线</tspan></text><g data-k=\"绝对化用语\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">绝对化用语</tspan></text></g><g data-k=\"价格不实\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">价格不实</tspan></text></g><g data-k=\"功效宣称\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">功效宣称</tspan></text></g><g data-k=\"诱导分享/私下交易\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">诱导分享/私下交易</tspan></text></g></svg>", "d": 67.92}, {"t": "三档判定与「附条件的可用」", "n": "可用、需修改、禁用三档，界线在「改文案能不能解决」。禁用是文案本身立不住：说「全网最低」没有任何修改能救，因为它是绝对化承诺；说「7 天改善睡眠」也不行，因为功效没有检测依据。需修改是方向可以，表达要收：把「加客服微信领券」改成「关注会员领券」，同样发券，但不脱离平台。最微妙的是「可用但附条件」——比如「买二送一」，文案没问题，但活动页必须写明赠品规格和数量上限，否则用户会理解成「买两件正装送一件正装」。所以判定表里要有一列「附加条件」，这一列比判定本身更容易被忽略。还有一类是「看起来能用其实要资质」：比如「抗菌」「除螨」需要检测报告，属于附条件可用。这一类最容易漏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三档的界线</tspan></text><g data-k=\"禁用：文案立不住\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">禁用：文案立不</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">住</tspan></text></g><g data-k=\"需修改：表达要收\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">需修改：表达要</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">收</tspan></text></g><g data-k=\"可用：但要附条件\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可用：但要附条</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">件</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 69.89}, {"t": "你的边界：标疑点，不下结论", "n": "模型会主动给你法条编号，比如「违反广告法第九条」，甚至给你一个「建议直接下架」的结论。这两样都不能用。原因很实在：法条适用是法务的判断，你说错了要担责，说对了也不是你的功劳；而且在会上被法务纠正一次，你后面所有合规建议的信用都会打折。正确写法是：这一条属于「绝对化用语疑点，建议法务确认后替换」，替代文案我已经准备好。你交付的是「判定 + 替代文案 + 所需依据」，法务交付的是「结论」。这条分界线守住，你在合规评审会上才站得住。一条实操：把替代文案和原文案并排给法务，他只需判断「这个替换行不行」，效率会高很多。并排给最省事。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"不写法条编号\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不写法条编号</tspan></text></g><g data-k=\"不下法律结论\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不下法律结论</tspan></text></g><g data-k=\"替代文案要能直接上线\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">替代文案要能直接上线</tspan></text></g><g data-k=\"价格类写清所需依据\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">价格类写清所需依据</tspan></text></g></svg>", "d": 61.3}], "deliverable": {"type": "sheet", "name": "活动文案合规评审表", "rubric": ["违规识别", "改写可用", "不越权定性"], "acceptance": "8 条文案每条都有违规类型与判定，禁用的给出替代文案，需修改的写清改哪里"}, "demo": {"ref": "■ 文案判定（8 条）\n\nA01｜「全网最低价，买贵退差」→ 禁用（绝对化用语 + 无法履行的承诺）\n　替代：「同款商品若低于本店到手价，可申请差价补偿（限同款同规格，凭截图）」\n\nA02｜「限时 3 天，倒计时结束恢复原价 599」→ 禁用（价格不实：599 从未成交过）\n　替代：「活动价 399，活动时间 10/28–10/30」（不提原价，或提供真实成交记录后再提）\n\nA03｜「添加客服微信领 50 元券」→ 需修改（诱导私下交易，且脱离平台留痕）\n　替代：「关注店铺会员，领 50 元新客券」\n\nA04｜「买二送一，赠品为同款小样 30ml」→ 可用（需在活动页写明赠品规格与数量上限）\n\nA05｜「7 天改善睡眠，一觉到天亮」→ 禁用（功效宣称，家纺类目无检测依据）\n　替代：「亲肤面料，透气不闷汗」（改为可验证的物理属性）\n\nA06｜「分享给 3 位好友，解锁专属折扣」→ 需修改（诱导分享）\n　替代：「邀请好友成为会员，双方各得 20 元券」（改为会员权益，不强制分享解锁）\n\nA07｜「前 100 名下单享 5 折」→ 需修改（需明示名额统计口径与截止方式）\n　替代：「前 100 名下单享 5 折，按支付成功时间排序，额满即止，页面实时公示剩余名额」\n\nA08｜「清仓价 199，售完即止」→ 可用（需确认确为清库存，保留原价成交记录备查）\n\n■ 结论：可用 2 条、需修改 3 条、禁用 3 条。\n■ 建议：禁用三条全部替换后再上线。\n■ 补充：这三条都涉嫌违反《广告法》第九条与《价格法》第十四条，建议直接下架。", "fix": ["「涉嫌违反《广告法》第九条与《价格法》第十四条」删掉——法条编号与定性是法务结论，PM 只标疑点", "A01 的替代文案里补上「限同款同规格」的边界，否则「买贵退差」本身又是一个新承诺", "A02 增加一句「若要提原价，需提供近 30 天真实成交记录」——把依据要求写实，而不是简单说不许提", "A08 判「可用」要附条件：需运营确认确为清库存，并留档原价成交记录，不能直接放行"], "judge": "判断依据：有没有引用法条编号或替法务定性；替代文案能不能直接上线；价格类有没有指出所需依据；「可用」的是否附了条件", "sheet": {"situ": "大促活动页明天要提审，运营把 8 条文案发到了群里，每条后面都标了「已自检」。你扫了一遍，发现「已自检」大概等于「读起来很带劲」。法务今天下午才有空，你得先把判定和替代文案准备好。", "ask": "① 8 条文案逐条判三档（可用 / 需修改 / 禁用），并标出违规类型；② 用你的表请 AI 给替代文案与所需依据；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 判定每条可用 / 需修改 / 禁用，并指出问题类型；② 对需修改与禁用的给出可直接上线的替代文案；③ 指出哪些需要什么依据才能用，以及「可用」项要附什么条件。\n不要引用具体法条编号，也不要替我下法律结论。", "mats": [{"id": "A01", "src": "活动页主标题", "text": "全网最低价，买贵退差。"}, {"id": "A02", "src": "倒计时模块", "text": "限时 3 天，倒计时结束恢复原价 599。\n（备注：该商品近 90 天实际成交价为 399–429，599 从未成交过）"}, {"id": "A03", "src": "券领取入口", "text": "添加客服微信领 50 元优惠券。"}, {"id": "A04", "src": "组合装卖点", "text": "买二送一，赠品为同款小样 30ml。"}, {"id": "A05", "src": "家纺类目详情页", "text": "7 天改善睡眠，一觉到天亮。"}, {"id": "A06", "src": "分享模块", "text": "分享给 3 位好友，解锁专属折扣。"}, {"id": "A07", "src": "限量模块", "text": "前 100 名下单享 5 折。"}, {"id": "A08", "src": "清仓专区", "text": "清仓价 199，售完即止。"}], "cols": [{"k": "vio", "name": "违规类型", "hint": "没问题就选最后一项", "type": "chips", "w": 3, "tags": ["绝对化用语", "价格不实", "功效宣称", "诱导分享", "诱导私下交易", "无明显问题"]}, {"k": "verdict", "name": "判定", "hint": "可用 / 需修改 / 禁用", "type": "chips", "w": 2, "tags": ["可用", "需修改", "禁用"]}, {"k": "fix", "name": "处理动作", "hint": "选一条能直接落地改的", "type": "chips", "w": 3, "tags": ["删掉绝对化表述", "提供真实成交记录后再提原价", "改为平台内领券，不引向私域", "写明赠品规格与数量上限", "改为可验证的物理属性", "改为会员权益，不强制分享", "写明名额口径与公示方式", "附条件：确认清库存并留档原价记录"]}], "key": {"A01": {"vio": "绝对化用语", "verdict": "禁用", "fix": "删掉绝对化表述"}, "A02": {"vio": "价格不实", "verdict": "禁用", "fix": "提供真实成交记录后再提原价"}, "A03": {"vio": "诱导私下交易", "verdict": "需修改", "fix": "改为平台内领券，不引向私域"}, "A04": {"vio": "无明显问题", "verdict": "可用", "fix": "写明赠品规格与数量上限"}, "A05": {"vio": "功效宣称", "verdict": "禁用", "fix": "改为可验证的物理属性"}, "A06": {"vio": "诱导分享", "verdict": "需修改", "fix": "改为会员权益，不强制分享"}, "A07": {"vio": "无明显问题", "verdict": "需修改", "fix": "写明名额口径与公示方式"}, "A08": {"vio": "无明显问题", "verdict": "可用", "fix": "附条件：确认清库存并留档原价记录"}}, "notes": {"A04·verdict": "文案本身立得住，所以判「可用」，但必须附条件：活动页要写明赠品规格与数量上限，否则用户会理解成「买两件正装送一件正装」", "A08·verdict": "同样属于「可用但附条件」：需运营确认确为清库存，并留档原价成交记录备查；不附条件直接放行，事后无法自证", "A07·verdict": "文案没有绝对化表述，但「前 100 名」不给统计口径一定会起纠纷，所以要判「需修改」而不是「可用」", "A02·vio": "备注里写了：近 90 天真实成交价 399–429，599 从未成交。以从未成交过的价格作「原价」，属于价格不实，不是「表述不当」", "A05·vio": "家纺类目没有对应检测依据，「改善睡眠」属于功效宣称；换成可验证的物理属性（面料、克重、透气率）才立得住", "A03·vio": "券本身没问题，问题在「加客服微信」——交易与发券脱离平台，既不留痕也难追溯"}, "delta": [{"op": "删", "frm": "模型给的结论「以上三条涉嫌违反《广告法》第九条与《价格法》第十四条」", "to": "整段删除，改为「A01/A02/A05 属合规疑点，建议法务确认后替换」", "why": "法条适用是法务的判断，PM 写条文号和定性，说错了要担责，说对了也不加分", "kw": ["广告法", "第九条", "价格法", "第十四条", "违反", "涉嫌违反"]}, {"op": "改", "frm": "A01 的替代文案只写「买贵退差」", "to": "补边界：「同款商品若低于本店到手价，可申请差价补偿（限同款同规格，凭截图）」", "why": "不给范围和凭证要求，「买贵退差」本身就是一个新的、无法履行的承诺", "kw": ["同款", "同规格", "边界", "凭证", "截图"]}, {"op": "改", "frm": "A02 只写「不许提原价」", "to": "改成「若要提原价，需提供近 30 天真实成交记录」", "why": "把依据要求写实，运营才知道怎么补救；一句「不许提」只会换来下一次偷偷提", "kw": ["30 天", "成交记录", "依据", "真实"]}, {"op": "补", "frm": "（模型没写）", "to": "给 A08 加附条件：需运营确认确为清库存，并留档原价成交记录", "why": "「清仓价」是价格主张，没有留档就无法自证，出了投诉只能认", "kw": ["清库", "留档", "附条件", "成交记录"]}], "refsheet": "A01｜绝对化用语｜禁用｜删掉绝对化表述\nA02｜价格不实｜禁用｜提供真实成交记录后再提原价\nA03｜诱导私下交易｜需修改｜改为平台内领券，不引向私域\nA04｜无明显问题｜可用｜写明赠品规格与数量上限\nA05｜功效宣称｜禁用｜改为可验证的物理属性\nA06｜诱导分享｜需修改｜改为会员权益，不强制分享\nA07｜无明显问题｜需修改｜写明名额口径与公示方式\nA08｜无明显问题｜可用｜附条件：确认清库存并留档原价记录\n\n三处最容易判错的：\n· A04 / A08 判「可用」但都要附条件——不附条件的可用，等于给未来埋纠纷。\n· A07 文案没问题却要判「需修改」：名额口径不写清，纠纷必来。\n· A03 的问题不在券，在「加微信」——交易脱离平台，不留痕。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」本季活动文案 8 条（原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条可用 / 需修改 / 禁用，并指出问题类型；② 对需修改与禁用的给出可直接上线的替代文案；③ 指出哪些需要什么依据才能用。不要引用具体法条编号，也不要替我下法律结论。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】合规四查（绝对化 / 价格真实 / 功效宣称 / 诱导）+ 三档判定与改写\n【参考案例】「全网最低价」与「7 天见效」两条被法务打回，「买二送一」可用但赠品要写明\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」本季活动文案 8 条（原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条可用 / 需修改 / 禁用，并指出问题类型；② 对需修改与禁用的给出可直接上线的替代文案；③ 指出哪些需要什么依据才能用。不要引用具体法条编号，也不要替我下法律结论。", "rubric": ["每条只判三档（可用 / 需修改 / 禁用），并写明违规类型（绝对化用语/价格不实/功效宣称/诱导分享/诱导私下交易/无明显问题）", "禁用的必须给出一条可直接上线的替代文案，只写「建议修改」不计分", "价格类问题要指出「需要什么依据」（原价成交记录、比价范围），不是只说「价格要真实」", "不替法务下法律结论：写「疑点，待法务确认」，不写「违反广告法第几条」"]}, {"id": "M5U7", "tier": "adv", "step": "todo", "title": "产出《营销自动化编排方案》", "video": {"dur": "3.5min", "script": ["自动化方案写不好，最常见的结局是上线第一晚就把老客全打扰一遍", "链路图（触发/判断/动作/等待/退出）+ 人群与频控 + 熔断 + 灰度", "加购未付链路：2 小时推券、24 小时提醒、72 小时退出，转化 6.8%、退订率 0.4%"]}, "ppt": {"method": "链路图（触发/判断/动作/等待/退出）+ 人群与频控 + 熔断 + 灰度", "case": "加购未付链路：2 小时推券、24 小时提醒、72 小时退出，转化 6.8%、退订率 0.4%", "demo": "方案骨架 + 一份填好的样例（含频控矩阵与灰度计划）"}, "objective": "能产出一份可落地的自动化编排方案，含链路、人群、频控、熔断与灰度计划", "transfer": "先挑一条链路按方案上线跑两周，把触达上限与熔断阈值写进系统配置", "vslides": [{"t": "任务说明：方案要能直接配置，不是流程图", "n": "自动化编排方案最常见的废稿，是一张漂亮的流程图加一句「提升复购」。它没法配置：触发条件写在图上，但没说时间窗；人群分了，但没说优先级；链路有三条，但没人管它们会不会同时打到同一个人。一份能落地的方案要有五节。链路节，每条五段写全，触发必须带时间窗。人群与分支节，说清每类给什么、为什么不给别的。频控矩阵节，把所有链路摆在一张表里，标出同一个人 72 小时最多收几条、谁优先。熔断节，写阈值和谁有权停。灰度节，写放量节奏和每档看什么指标。还有一节容易被省：不覆盖什么。写清本期不做哪些链路，能避免会上被问「为什么不做新客首单」。不覆盖写得越清楚，会上越少扯皮。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 链路（五段齐）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 链路（五段齐）</tspan></text></g><g data-k=\"② 人群与分支\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 人群与分支</tspan></text></g><g data-k=\"③ 频控矩阵\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 频控矩阵</tspan></text></g><g data-k=\"④ 熔断\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 熔断</tspan></text></g><g data-k=\"⑤ 灰度计划\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 灰度计划</tspan></text></g></svg>", "d": 69.65}, {"t": "频控矩阵：多条链路并存时的唯一秩序", "n": "只要自动化链路超过两条，就一定会出现同一个人被多条链路同时命中的情况。比如一个用户加购未付，同时又满足静默唤醒条件——两条链路都会想给他发消息。没有频控矩阵，他就会在同一天收到两张券加两条短信，然后退订。矩阵要回答三个问题：总量上限是多少（72 小时 2 次、30 天 6 次）、优先级怎么排（离成交越近越优先）、互斥怎么执行（高优先级命中后，低优先级顺延还是取消）。还有一条常被忽略：不同渠道要单独限额，短信 7 天最多 1 条，站内信可以多但计入总频控。矩阵最好画成表格贴在方案第一页，配置的人照着填，比读一段文字可靠。表格比文字可靠。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">频控矩阵四要素</tspan></text><g data-k=\"总量上限\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">总量上限</tspan></text></g><g data-k=\"优先级顺序\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">优先级顺序</tspan></text></g><g data-k=\"互斥执行方式\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">互斥执行方式</tspan></text></g><g data-k=\"渠道单独限额\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">渠道单独限额</tspan></text></g></svg>", "d": 64.56}, {"t": "熔断与灰度：把「出事」变成「可控」", "n": "熔断写三样：阈值、谁有权停、停后多久复盘。阈值要具体（退订率 >1.5%、投诉 >5 条/天、短信失败率 >20%），不能写「效果不好就停」。谁有权停要落到两个人，因为凌晨出问题时主责可能在睡觉。灰度是分三档放量，每档都要有进入下一档的条件：1% 跑 3 天看退订率，10% 跑 7 天看净增量，50% 跑 14 天看频控是否被击穿。全程保留 10% 对照组——没有对照组，你永远说不清增长是你的消息带来的，还是季节带来的。上线第一周每天核对触达日志，看有没有人被重复触达——这是唯一能发现配置错的办法。日志是唯一真相。还有一条：所有链路的触达内容都要能追溯到模板版本，不然出了问题，连发出去的是哪一版都说不清，复盘只能靠猜。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"熔断有阈值与两个人\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">熔断有阈值与两个人</tspan></text></g><g data-k=\"灰度三档有放量条件\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">灰度三档有放量条件</tspan></text></g><g data-k=\"全程留 10% 对照组\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">全程留 10% 对照组</tspan></text></g><g data-k=\"上线首周每天核对触达日志\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">上线首周每天核对触达日志</tspan></text></g></svg>", "d": 78.46}], "deliverable": {"type": "doc", "name": "营销自动化编排方案", "rubric": ["链路可执行", "频控不打架", "灰度有节奏"], "acceptance": "一份能直接配置上线的方案：链路五段齐、频控矩阵覆盖全部链路、熔断与灰度有明确阈值"}, "practice": {"steps": ["写链路：每条链路画五段，触发条件写到事件与时间窗，退出写至少两条", "写人群与分支：按新老客/会员等级分，说明每类给什么动作、为什么不给别的", "写频控矩阵：列出所有链路，标出同一个人 72 小时内最多收到几条、优先级怎么排", "写熔断：退订率/投诉率的阈值、谁有权停、停多久复盘", "写灰度：1% → 10% → 50% 的放量节奏，每档看什么指标、多久进下一档"], "exemplar": "【营销自动化编排方案 · 老客复购 v1】产品：优选生活馆　上线：11/5　负责人：产品经理\n\n■ 一、链路（3 条）\n链路 A｜加购未付\n　触发：加购事件后 2 小时未支付，且未在 72 小时内被触达过\n　判断：新客 → 首单券 20 元；老客 → 复购券 30 元（满 299 可用）\n　动作：站内信 + 短信（仅新客发短信，老客只发站内信）\n　等待：24 小时后未支付 → 再发一次站内提醒（不重复发券）\n　退出：已支付 / 已退订 / 触达达上限 / 商品失效\n\n链路 B｜浏览未加购（高意向）\n　触发：同一 SKU 24 小时内浏览 ≥3 次，且未加购\n　判断：会员等级 ≥V2 → 给专属客服入口；其余 → 给该 SKU 的对比测评内容\n　动作：站内推送（不发文短信）\n　等待：48 小时\n　退出：已加购 / 已退订 / 触达达上限\n\n链路 C｜静默唤醒\n　触发：距上次支付 ≥75 天，且当前无进行中订单\n　判断：历史客单价 ≥300 → 高价值唤醒（专属券 50 元）；<300 → 通用券 15 元\n　动作：短信（仅 1 次）+ 站内信\n　等待：7 天\n　退出：已支付 / 已退订 / 触达达上限 / 距离上次唤醒 <30 天\n\n■ 二、频控矩阵\n同一用户 72 小时内最多 2 次触达，30 天内最多 6 次。\n优先级：A（加购未付）> B（浏览未加购）> C（静默唤醒）。\n互斥规则：高优先级链路命中后，低优先级链路当次不发，顺延到下个周期。\n短信额度：同一用户 7 天内最多 1 条短信，站内信不限（但计入总频控）。\n\n■ 三、熔断\n阈值：单链路退订率 >1.5%，或投诉量 >5 条/天，或短信发送失败率 >20%。\n谁有权停：产品经理为主责，运营值班为备份，均有权限在后台一键停链路。\n停后：24 小时内拉一次原因分析，72 小时内给复盘结论与整改动作。\n\n■ 四、灰度计划\n第 1 档：1% 人群（约 1200 人），跑 3 天，看退订率、转化率、失败率；退订率 ≤0.5% 进下一档。\n第 2 档：10% 人群，跑 7 天，看复购转化对比（与未触达对照组比）；提升 ≥1.5 个点进下一档。\n第 3 档：50% 人群，跑 14 天，看频控是否被击穿、客服工单是否增加。\n全程保留 10% 对照组，用于计算净增量。\n\n■ 五、风险与不覆盖\n风险 1：人群包与会员等级数据 T+1，可能触达刚升等级的用户 → 用「会员等级变更后 24 小时内不触发」规避。\n风险 2：三条链路同时命中 → 由频控矩阵拦截，但需上线后第一周每天核对触达日志。\n本期不覆盖：新客首单链路（等 A 链路稳定后再做）、跨品类推荐（无推荐位资源）。"}, "task": "产出《营销自动化编排方案》：写链路：每条链路画五段，触发条件写到事件与时间窗，退出写至少两条；写人群与分支：按新老客/会员等级分，说明每类给什么动作、为什么不给别的；写频控矩阵：列出所有链路，标出同一个人 72 小时内最多收到几条、优先级怎么排；写熔断：退订率/投诉率的阈值、谁有权停、停多久复盘；写灰度：1% → 10% → 50% 的放量节奏，每档看什么指标、多久进下一档", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M5 AI 嵌入研发协同与运营」模块，你要交付的是《营销自动化编排方案》。\n【场景】业务侧这周的诉求是：自动化方案写不好，最常见的结局是上线第一晚就把老客全打扰一遍。参考做法：加购未付链路：2 小时推券、24 小时提醒、72 小时退出，转化 6.8%、退订率 0.4%。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（链路图（触发/判断/动作/等待/退出）+ 人群与频控 + 熔断 + 灰度），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《营销自动化编排方案》填写模板】\n\n■ 1. 写链路：每条链路画五段，触发条件写到事件与时间窗，退出写至少两条\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写人群与分支：按新老客/会员等级分，说明每类给什么动作、为什么不给别的\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写频控矩阵：列出所有链路，标出同一个人 72 小时内最多收到几条、优先级怎么排\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 写熔断：退订率/投诉率的阈值、谁有权停、停多久复盘\n   ‣ 提示：给出阈值、观察窗口、触发后的第一动作。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写灰度：1% → 10% → 50% 的放量节奏，每档看什么指标、多久进下一档\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【营销自动化编排方案 · 老客复购 v1】产品：优选生活馆　上线：11/5　负责人：产品经理\n\n■ 一、链路（3 条）\n链路 A｜加购未付\n　触发：加购事件后 2 小时未支付，且未在 72 小时内被触达过\n　判断：新客 → 首单券 20 元；老客 → 复购券 30 元（满 299 可用）\n　动作：站内信 + 短信（仅新客发短信，老客只发站内信）\n　等待：24 小时后未支付 → 再发一次站内提醒（不重复发券）\n　退出：已支付 / 已退订 / 触达达上限 / 商品失效\n\n链路 B｜浏览未加购（高意向）\n　触发：同一 SKU 24 小时内浏览 ≥3 次，且未加购\n　判断：会员等级 ≥V2 → 给专属客服入口；其余 → 给该 SKU 的对比测评内容\n　动作：站内推送（不发文短信）\n　等待：48 小时\n　退出：已加购 / 已退订 / 触达达上限\n\n链路 C｜静默唤醒\n　触发：距上次支付 ≥75 天，且当前无进行中订单\n　判断：历史客单价 ≥300 → 高价值唤醒（专属券 50 元）；<300 → 通用券 15 元\n　动作：短信（仅 1 次）+ 站内信\n　等待：7 天\n　退出：已支付 / 已退订 / 触达达上限 / 距离上次唤醒 <30 天\n\n■ 二、频控矩阵\n同一用户 72 小时内最多 2 次触达，30 天内最多 6 次。\n优先级：A（加购未付）> B（浏览未加购）> C（静默唤醒）。\n互斥规则：高优先级链路命中后，低优先级链路当次不发，顺延到下个周期。\n短信额度：同一用户 7 天内最多 1 条短信，站内信不限（但计入总频控）。\n\n■ 三、熔断\n阈值：单链路退订率 >1.5%，或投诉量 >5 条/天，或短信发送失败率 >20%。\n谁有权停：产品经理为主责，运营值班为备份，均有权限在后台一键停链路。\n停后：24 小时内拉一次原因分析，72 小时内给复盘结论与整改动作。\n\n■ 四、灰度计划\n第 1 档：1% 人群（约 1200 人），跑 3 天，看退订率、转化率、失败率；退订率 ≤0.5% 进下一档。\n第 2 档：10% 人群，跑 7 天，看复购转化对比（与未触达对照组比）；提升 ≥1.5 个点进下一档。\n第 3 档：50% 人群，跑 14 天，看频控是否被击穿、客服工单是否增加。\n全程保留 10% 对照组，用于计算净增量。\n\n■ 五、风险与不覆盖\n风险 1：人群包与会员等级数据 T+1，可能触达刚升等级的用户 → 用「会员等级变更后 24 小时内不触发」规避。\n风险 2：三条链路同时命中 → 由频控矩阵拦截，但需上线后第一周每天核对触达日志。\n本期不覆盖：新客首单链路（等 A 链路稳定后再做）、跨品类推荐（无推荐位资源）。", "rubric": ["每条链路五段齐全，触发条件写到「事件 + 时间窗」，缺时间窗按未写完计", "频控矩阵覆盖本方案所有链路，写清同人 72 小时上限与优先级顺序", "熔断写三样：阈值、谁有权停、停后多久复盘", "灰度写三档放量节奏，每档标注观察指标与进入下一档的条件"]}, {"id": "M5U8", "tier": "adv", "step": "spar", "title": "运营总监挑战你的编排", "video": {"dur": "3.7min", "script": ["运营总监不会因为「链路很完整」就批，他要知道多出来的 GMV 有多少是你带来的", "挑战清单：净增量 / 打扰成本 / 链路冲突 / 叫停机制", "「发了这么多消息，多卖的真是消息带来的吗？」——三种答法的区别"]}, "ppt": {"method": "挑战清单：净增量 / 打扰成本 / 链路冲突 / 叫停机制", "case": "「发了这么多消息，多卖的真是消息带来的吗？」——三种答法的区别", "demo": "陪练对话界面说明（把编排方案粘进系统提示词，让对手按频控与灰度发问）"}, "objective": "能在运营总监 4 轮追问下，说清自动化对 GMV 的净增量、打扰成本与叫停机制", "transfer": "把陪练里算的净增量口径写成实验设计一页，发给运营总监确认后再放量", "vslides": [{"t": "陪练说明：他要的是净增量，不是触达量", "n": "运营总监和前面几位都不同。他既背 GMV 又怕品牌被骂，所以你报「发了 12 万条消息、转化 6.8%」，他第一反应是「那本来就会买的人算进去了吗」。这一关的核心只有一个词：净增量。净增量只能用对照组算——触达组转化减对照组转化，乘以人数和客单价，才是你带来的。拿触达人群的绝对转化率当增量，是最容易被当场拆穿的说法。他还会问三件事：打扰成本多少、链路打架怎么办、什么时候停。这三问都在测你是不是真的想过后果。他不是反对自动化，是反对「说不清效果的自动化」；把净增量和成本两侧都说清，他通常会先给一个小额度让你跑。他要的不是完美方案，是可控的试。答这类问题有个固定顺序：先说净增量怎么算，再说打扰成本折成多少钱，最后说什么时候停。顺序对了，他就不会一路追问下去。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他的四问</tspan></text><g data-k=\"净增量（对照组）\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">净增量（</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">对照组）</tspan></text></g><g data-k=\"打扰成本\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">打扰成本</tspan></text></g><g data-k=\"链路冲突\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">链路冲突</tspan></text></g><g data-k=\"叫停机制\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">叫停机制</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 78.38}, {"t": "打扰成本要能折算成钱", "n": "「会尽量少发」在他那里不算回答。要折算：当前退订率 0.4%，触达 1.2 万人就是 48 人退订；按历史复购价值（客单价 × 年复购次数 × 毛利率）折，约 1.1 万元。这个数摆出来，他才能判断「65 万增量换 1.1 万损失」值不值。折算不需要很精确，量级对就行，但必须给。同时要说清熔断线：退订率超过 1.5% 自动停发，这条比任何承诺都管用，因为它把最坏情况封住了。打扰成本不只看退订，还要看投诉与品牌口碑——投诉进工单、工单进考核，这层虽难量化，但要主动点出来。口碑这层，往往后面才追上来。折算时把口径写在数字旁边：客单价取近 90 天成交、毛利率取财务口径，避免他反问「这个数哪来的」，一个说不清来源的数字会让整段结论打折。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"退订人数 × 复购价值 = 打扰成本\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">退订人数 × 复购价值 = 打扰成本</tspan></text></g><g data-k=\"示例：48 人 × 230 元 ≈ 1.1 万元\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">示例：48 人 × 230 元 ≈ 1.1 万元</tspan></text></g><g data-k=\"熔断线：退订率 &gt;1.5% 自动停\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">熔断线：退订率 &gt;1.5% 自动停</tspan></text></g></svg>", "d": 74.9}, {"t": "链路冲突与叫停：把「万一」提前说完", "n": "三条链路同时命中一个人，这在自动化里是常态，不是例外。答这一问要说清优先级（离成交越近越优先）和互斥执行（高优先级命中后低优先级顺延，而不是取消，避免用户被彻底漏掉）。叫停机制要答到三层：什么阈值停（退订率、投诉量、失败率）、谁有权停（主责 + 备份两人）、停了之后怎么恢复（复盘结论出来、整改动作上线、重启走一次小流量灰度）。把「万一」提前说完，他反而会觉得你靠谱。如果他问「能不能再快一点放量」，别硬顶，给折中：加到 20% 并观察 10 天，用更密的监控换更快的节奏。折中方案比硬顶更容易被接受。最后记住一句：所有承诺都要能落到监控上，说不出盯哪个指标、谁看、多久看一次，就等于没承诺。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"优先级 + 顺延而非取消\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">优先级 + 顺延而非取消</tspan></text></g><g data-k=\"阈值 / 权限 / 恢复三层\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">阈值 / 权限 / 恢复三层</tspan></text></g><g data-k=\"恢复要再走灰度\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">恢复要再走灰度</tspan></text></g><g data-k=\"承认净增量有前提条件\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">承认净增量有前提条件</tspan></text></g></svg>", "d": 69.14}], "deliverable": {"type": "doc", "name": "营销自动化编排方案", "rubric": ["净增量可算", "打扰成本量化", "叫停机制"], "acceptance": "四问都能给出对照口径的净增量、打扰成本的量化折算，以及明确的叫停与恢复机制"}, "spar": {"role": "运营总监", "persona": "背着 GMV 又怕品牌被骂，最反感「发得多所以卖得多」；习惯连问「净增量怎么算」「打扰成本多少」「链路打架怎么办」，只认对照组数据", "mustAsk": ["发了这么多消息，多卖的真是消息带来的吗？你怎么证明？", "退订和投诉算过没有？为了这点增量把人赶走值吗？", "三条链路同时命中一个用户，谁先发？会不会同一天收到两张券？", "什么情况下你会主动停掉这条链路？停了之后多久能恢复？"]}, "exemplar": "（问：发了这么多消息，多卖的真是消息带来的吗？）\n\n结论：不完全，所以我在方案里留了 10% 对照组，净增量只对照组差值算，不按触达人群绝对转化算。\n依据：A 链路触达人群 30 天复购率 14.2%，未触达对照组 11.8%，差值 2.4 个点；按触达 1.2 万人、客单价 227 元算，净增量约 65 万元。这是扣除「本来就会买的人」之后的数。\n边界：这个数有两个前提——一是对照组与新客结构无差异（我用分层后随机分流保证）；二是这 30 天内没有大促，否则差值里会混进活动效应。打扰成本我按退订率折算：当前退订率 0.4%，1.2 万人里约 48 人退订，按历史复购价值算，损失约 1.1 万元，远低于净增量；但退订率一旦超过 1.5%，我会自动熔断停发。", "task": "把《营销自动化编排方案》拿到「运营总监」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《营销自动化编排方案》。现在要让它通过「运营总监」这一关。\n【对手的立场】背着 GMV 又怕品牌被骂，最反感「发得多所以卖得多」；习惯连问「净增量怎么算」「打扰成本多少」「链路打架怎么办」，只认对照组数据。\n【他一定会追问】「发了这么多消息，多卖的真是消息带来的吗？你怎么证明？」 / 「退订和投诉算过没有？为了这点增量把人赶走值吗？」 / 「三条链路同时命中一个用户，谁先发？会不会同一天收到两张券？」\n【场景】你说「运营总监挑战你的编排」，对方立刻回一句：发了这么多消息，多卖的真是消息带来的吗？你怎么证明？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["净增量明确说明用对照组差值算，不拿触达人群的绝对转化率当增量", "打扰成本给出量化折算（退订人数 × 复购价值），不是只说「会尽量少发」", "链路冲突说清优先级与互斥执行方式（顺延还是取消）", "叫停机制含阈值、谁有权停、停后多久复盘与恢复条件"]}]}, {"id": "M6", "title": "M6 电商合规与安全下的 AI 用法", "dims": ["security", "content", "data"], "units": [{"id": "M6U1", "tier": "basic", "step": "understand", "title": "数据四档：能不能出域", "video": {"dur": "3.6min", "script": ["数据出域没有「下次注意」，只有一次事故和一份记录", "四档分级（公开 / 内部 / 敏感 / 禁止）+ 可识别性组合测试 + 三个处置动作（聚合 / 脱敏 / 内网）", "「地区到区 + 年龄段 + 下单时间 + 商品」四个内部字段拼起来能认出是谁，就要按敏感处理"]}, "ppt": {"method": "四档分级（公开 / 内部 / 敏感 / 禁止）+ 可识别性组合测试 + 三个处置动作（聚合 / 脱敏 / 内网）", "case": "「地区到区 + 年龄段 + 下单时间 + 商品」四个内部字段拼起来能认出是谁，就要按敏感处理", "demo": "同一条订单记录的四种判法：哪种能用、哪种一次就算事故"}, "objective": "能把手上要用的字段逐个判成公开/内部/敏感/禁止四档，并说出每一档能不能出域", "transfer": "拿一张本周要用的数据表，把字段逐个标级别，标到「能出域的只剩几列」为止", "vslides": [{"t": "四档分级：判的是能不能定位到人", "n": "先说一句容易被忽略的前提：分级判的不是字段名，是这条数据能不能定位到具体某个人。四档是这样分的。公开级：商品标题、类目、公开售价、公开评价正文，这类发给任何模型都行。内部级：日销、库存水位、毛利、活动排期，不涉及个人，但泄露出去是商业损失，通常要求聚合后再用。敏感级：手机号、收货地址、订单号、客服聊天记录、健康与偏好标签，这些能直接或间接定位到人。禁止级：身份证号、银行卡号与安全码、账号密码、未成年人信息，一律不出域，就算在企业内网也要授权并留痕。四档里最容易判错的是「内部」和「敏感」的边界——很多人以为不写名字就不算个人数据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四档与出域规则</tspan></text><g data-k=\"公开 · 可出域\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">公开 · 可出域</tspan></text></g><g data-k=\"内部 · 聚合后可用\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">内部 · 聚合后可用</tspan></text></g><g data-k=\"敏感 · 脱敏或内网\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">敏感 · 脱敏或内网</tspan></text></g><g data-k=\"禁止 · 不出域\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">禁止 · 不出域</tspan></text></g></svg>", "d": 66.6}, {"t": "组合测试：四个无害字段拼起来就成了个人信息", "n": "为什么「内部」和「敏感」的边界这么容易判错？因为判断习惯是逐列看，而风险发生在列与列之间。举个例子：地区（精确到区）+ 年龄段 + 下单时间（精确到小时）+ 商品名称，这四个字段单独看都属于内部级，谁都不觉得有问题；但拼在一起，你们部门三十个人里能唯一确定是谁买的——这就已经是个人信息了。所以分级要做一次组合测试：把准备一起发出去的字段摊开，问自己「拿这四个条件去翻订单，能翻出几个人」，如果答案是 1 到 2 个，就要按敏感处理。这条测试不需要技术背景，五秒钟就能做完，但绝大多数事故是因为没做。另一个高频漏项是「推断标签」：模型根据浏览行为推出的「孕期」「高消费」「即将流失」，这些不是用户填的，但同样能定位到人，一样算敏感。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">组合测试</tspan></text><g data-k=\"逐列看：都不敏感\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">逐列看：都不敏</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">感</tspan></text></g><g data-k=\"组合看：能唯一确定\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">组合看：能唯一</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">确定</tspan></text></g><g data-k=\"按敏感处理\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">按敏感处理</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 73.1}, {"t": "三个处置动作与一条留痕", "n": "判完级别，处置只有三个动作，按顺序试。第一步问能不能聚合：把个体变成统计量，「孕期人群占比 3.2%」而不是「某用户处于孕期」，聚合后通常就能出域。第二步不能聚合就脱敏：删除或不可逆替换，手机号换成用户 ID 的哈希、地址只留到市、订单号截断。注意「不可还原」这四个字：把手机号中间四位换成 0000 不算脱敏，只有一万种可能，穷举就回来了。第三步还不行就走内网模型：确实需要个体明细的，用企业内网部署的模型，出域等于零。三步都不行，就不要做这一步——绝大多数「必须用原始数据」的说法，其实是没想过替代方案。最后一条是留痕：谁、什么时候、把哪一档数据、发给了哪个模型、返回了什么，要有一条记录。出事的时候，这条记录是你唯一能自证的东西，也是合规官第一个要看的东西。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三个处置动作</tspan></text><g data-k=\"聚合：个体 → 统计量\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">聚合：个体 → 统</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">计量</tspan></text></g><g data-k=\"脱敏：删除 / 不可逆替换\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">脱敏：删除 / 不</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">可逆替换</tspan></text></g><g data-k=\"内网：出域 = 0\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">内网：出域 = 0</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 78.7}], "deliverable": {"type": "sheet", "name": "数据分级表", "rubric": ["级别判对", "组合能识别", "处置可执行"], "acceptance": "能对一张真实表逐列标级别，并给出每列的处置动作与最小字段集，禁止级一律不出域"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】四档分级（公开 / 内部 / 敏感 / 禁止）+ 可识别性组合测试 + 三个处置动作（聚合 / 脱敏 / 内网）\n【为什么重要】数据出域没有「下次注意」，只有一次事故和一份记录\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["每个字段只标一档（公开 / 内部 / 敏感 / 禁止），并写明这一档能不能出域", "至少做一次「组合测试」：把几个看着无害的字段拼起来，判断能否定位到具体某个人", "敏感级写明去掉哪些字段、用什么方式（删除 / 哈希 / 截断），只写「已脱敏」不计分", "禁止级一律判为不出域，并给出替代做法（改用聚合量或不使用这一步）"]}, {"id": "M6U2", "tier": "basic", "step": "demo", "title": "用 AI 做脱敏与最小化", "video": {"dur": "3.4min", "script": ["脱敏做错不是「不严谨」，是把一整张用户表送出了公司", "逐条判级（公开/内部/敏感/禁止）+ 处置动作（原样/去标识/聚合/不出域）+ 最小字段三列", "订单明细里的手机号必须删，但「类目 + 金额」才是这次分析真正要用的两列"]}, "ppt": {"method": "逐条判级（公开/内部/敏感/禁止）+ 处置动作（原样/去标识/聚合/不出域）+ 最小字段三列", "case": "订单明细里的手机号必须删，但「类目 + 金额」才是这次分析真正要用的两列", "demo": "WorkBuddy 内跑一遍：先判级与处置，再让模型做清洗，最后自己核能不能还原"}, "objective": "能把 8 条原始记录逐条判级、给出处置动作，并写出这次分析真正需要的最小字段", "transfer": "用这张表把本周要外发的数据过一遍，把判为禁止级的两条从清单里删掉", "vslides": [{"t": "演示准备：8 条记录里有 2 条一步都不能错", "n": "这 8 条是本周要外发的数据：订单明细、客服聊天、商品评价、退货申请、商品参数、用户标签、店铺日报、支付回调日志。它们看起来都「只是业务数据」，但里面有两条是碰都不能碰的：一条带完整身份证号，一条带银行卡号后四位和交易流水号。这两条不是「脱敏后可以发」，是「这一步改用聚合量」——因为身份证号和卡号属于不可逆的强标识，任何脱敏手段都不该在外部模型上试。剩下六条里，三条是敏感级、一条内部、两条公开。你要做的是逐条判级、给出处置动作，并写出这一步分析真正需要的最小字段。判级错了，后面所有动作都白做；最小字段写不出来，说明你还没想清这次到底要模型干什么。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"8 条：订单 / 客服 / 评价 / 退货 / 参数 / 标签 / 日报 / 支付日志\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条：订单 / 客服 / 评价 / 退货 / 参数 / 标签 / 日报 / 支付日</tspan><tspan x=\"52.0\" dy=\"15.4\">志</tspan></text></g><g data-k=\"禁止级 2 条（身份证、卡号）\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">禁止级 2 条（身份证、卡号）</tspan></text></g><g data-k=\"敏感 3 条 · 内部 1 条 · 公开 2 条\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">敏感 3 条 · 内部 1 条 · 公开 2 条</tspan></text></g></svg>", "d": 65.93}, {"t": "三处最容易判错的地方", "n": "第一处：把「不写名字」当成「不敏感」。评价正文是公开的，昵称和城市不是——同一条记录里不同字段的级别可以不一样，所以判级要判到字段，不能判到整条。第二处：把敏感级判成「脱敏后可用」就完事，不写用什么方式。写成「已脱敏」等于没写，因为哈希和截断的安全性差一个量级：截断的订单号可以靠时间顺序推回来，哈希不能。第三处：把禁止级也按敏感级处理。敏感级脱敏后可以出域，禁止级不行——这是量变到质变的界线，不是谨慎程度的差别。还有一处是推断标签：模型从浏览行为推出来的「孕期」「高消费」「即将流失」，用户从没填过，但它们一样能定位到人，一样算敏感。这四条错法里，出现任何一条，整份清单都要重做。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 判到字段，不判到整条\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 判到字段，不判到整条</tspan></text></g><g data-k=\"② 写清脱敏方式，不写「已脱敏」\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 写清脱敏方式，不写「已脱敏」</tspan></text></g><g data-k=\"③ 禁止级 ≠ 敏感级\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 禁止级 ≠ 敏感级</tspan></text></g><g data-k=\"④ 推断标签也算敏感\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 推断标签也算敏感</tspan></text></g></svg>", "d": 68.9}, {"t": "模型的活与人的活：它清洗，你定最小字段", "n": "字段判完，模型很擅长做清洗：把昵称替换成「用户A」、把地址截到市、把手机号换成哈希，做得又快又整齐。但有两件事它做不了。一是最小字段——它会本能地保留所有列，因为「信息越全判断越准」，这句话在模型视角是对的，在合规视角是错的；最小字段只能你来定，方法是对每个字段问一句「删掉它，这次的结论会变吗」，不会变就删。二是不可还原的判断——它给的哈希方案对不对、盐值会不会跟着数据一起发出去、截断后的字段能不能靠其他列推回来，这些要你自己核。所以提示词里要写死两句话：禁止建议整表上传；脱敏方式必须写明是否可还原。最后交出去的是三列——级别、处置、最小字段，一页纸就够，但每一格都要经得起追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">模型做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人来做</tspan></text><g data-k=\"批量清洗 / 替换 / 截断 / 生成脱敏脚本\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">批量清洗 / 替换 / 截断</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">/ 生成脱敏脚本</tspan></text></g><g data-k=\"定最小字段 / 判可还原性 / 决定哪一步不做\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">定最小字段 / 判可还原性</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\"> / 决定哪一步不做</tspan></text></g></svg>", "d": 69.94}], "deliverable": {"type": "sheet", "name": "数据使用清单（字段级）", "rubric": ["级别判对", "处置正确", "字段最小化"], "acceptance": "8 条素材都有级别、处置动作与最小字段；禁止级一律不出域；去标识的写明不可还原"}, "demo": {"ref": "■ 数据判定（8 条）\n\nR01｜订单明细（手机号 + 收货地址 + 订单号 + 类目 + 金额）→ 敏感\n　处置：删手机号与收货地址，订单号换成用户 ID 哈希；只留 类目 + 金额。\n\nR02｜客服聊天（昵称 +「我怀孕了能用吗」）→ 敏感（健康信息）\n　处置：去昵称；健康表述做泛化（孕期 → 特殊人群），只留 问题描述 + 客服结论。\n\nR03｜商品评价（昵称 + 城市 + 起球抱怨正文）→ 公开（文本本体）\n　处置：去昵称与城市后可用；正文本身是公开内容，可原样给模型。\n\nR04｜退货申请（完整身份证号 + 退货理由）→ 禁止\n　处置：身份证号整段删除、不得出域；只保留退货理由。\n\nR05｜商品参数（品名 + 克重 + 面料成分 + 售价）→ 公开\n　处置：原样可用，无需处理。\n\nR06｜用户标签（孕期 / 糖尿病 / 价格敏感）→ 敏感（健康 + 推断标签）\n　处置：聚合后才可用，如「孕期人群占比 3.2%」，不出个体标签。\n\nR07｜店铺日报（商家名 + 日销 + 库存）→ 内部\n　处置：商家名换成「店铺 A」；数值保留但对外只用区间。\n\nR08｜支付回调日志（卡号后四位 + 交易流水号）→ 禁止\n　处置：不得出域；分析改用聚合后的支付成功率。\n\n■ 结论：禁止 2 条、敏感 3 条、内部 1 条、公开 2 条。\n■ 建议：为提升分析准确率，建议把订单明细整表上传（含手机号），模型对完整数据判断更准。", "fix": ["「建议整表上传（含手机号）」整句删掉——这句话本身就是本课要防的那次事故", "R03 模型判「公开，可原样使用」，要改成「去标识后可用」：正文是公开的，昵称与城市不是", "R06 只写「聚合」不够，要写清聚合口径（按什么分组、单组最小样本量多少，避免小样本反推个人）", "R02 的「孕期 → 特殊人群」要说清这是替换不是删除，替换后仍要检查上下文能不能反推"], "judge": "判断依据：级别有没有判错（尤其把敏感判成内部）；处置是否落到具体去掉哪个字段、用什么方式；禁止级有没有被判成「脱敏后可用」；最小字段是否真的最小；有没有留下「整表上传」这类建议", "sheet": {"situ": "本周要用模型跑一遍评价洞察。数据组把 8 条样本记录发给了你，说「都是业务数据，你看着用」。你翻了一遍，里面有带手机号和收货地址的订单、有带完整身份证号的退货单、还有一条支付回调日志带着卡号后四位。这些不能整段发给模型——但哪条能发、哪条要脱敏、哪条一步都不能做，得你判。", "ask": "① 8 条记录逐条判级（公开 / 内部 / 敏感 / 禁止），给出处置动作与最小字段；② 用你的表请 AI 做清洗与改写；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 判定每条的级别与处置动作；② 给出具体的脱敏方式并说明是否可还原；③ 写出这一步分析真正需要的最小字段；④ 指出哪几条组合起来仍能定位到具体某个人。\n禁止建议「整表上传以提高准确率」，也不要替我下法律结论。", "mats": [{"id": "R01", "src": "订单明细 · ods_order_item", "text": "用户 M** ｜ 138****6621 ｜ 杭州市西湖区文三路 **** 号 3 幢 502 ｜ SO2026-10-8821\n类目：家纺-四件套 ｜ 实付 399.00 ｜ 下单时间 10-27 21:14"}, {"id": "R02", "src": "客服聊天记录 · ods_cs_chat", "text": "昵称：小* ｜ 「我怀孕 5 个月了，这款面料的可以用吗？会不会有味道？」\n客服回复：亲，A 类婴幼儿标准，孕妇可用，建议先通风晾晒。"}, {"id": "R03", "src": "商品评价 · ods_review", "text": "昵称：L** ｜ 城市：成都\n「四件套洗了两次就起球，详情页写着抗起球，有点失望。物流倒是很快。」"}, {"id": "R04", "src": "退货申请 · ods_return", "text": "退货人身份证号：3301061992********** ｜ 退货理由：尺码不合适\n附注：已寄回，单号 SF7732******"}, {"id": "R05", "src": "商品参数表 · ods_item_attr", "text": "品名：全棉四件套 1.8m ｜ 克重 220g/㎡ ｜ 面料 100% 棉 ｜ 售价 399.00"}, {"id": "R06", "src": "用户标签 · ods_user_tag", "text": "标签：孕期 / 有糖尿病史 / 价格敏感 ｜ 来源：浏览与购买行为推断\n（用户从未填写过健康信息，标签由模型推断生成）"}, {"id": "R07", "src": "店铺日报 · dws_shop_daily", "text": "店铺：杭州****家纺旗舰店 ｜ 日销 12.8 万 ｜ 库存 3,240 件 ｜ 动销率 18%"}, {"id": "R08", "src": "支付回调日志 · ods_pay_callback", "text": "卡号后四位 6621 ｜ 交易流水号 2026102700142**** ｜ 金额 399.00 ｜ 状态 SUCCESS"}], "cols": [{"k": "lv", "name": "级别", "hint": "四档：公开 / 内部 / 敏感 / 禁止", "type": "chips", "w": 3, "tags": ["公开", "内部", "敏感", "禁止"]}, {"k": "act", "name": "处置动作", "hint": "选一个能直接执行的动作", "type": "chips", "w": 3, "tags": ["原样可用", "去标识后可用", "聚合后可用", "不得出域"]}, {"k": "min", "name": "这次真正需要的字段", "hint": "最小字段集，越少越好", "type": "chips", "w": 3, "tags": ["只需类目与金额", "只需问题描述与结论", "只需评价正文", "只需商品属性", "只需人群规模与占比", "只需数值区间", "不得使用"]}], "key": {"R01": {"lv": "敏感", "act": "去标识后可用", "min": "只需类目与金额"}, "R02": {"lv": "敏感", "act": "去标识后可用", "min": "只需问题描述与结论"}, "R03": {"lv": "公开", "act": "去标识后可用", "min": "只需评价正文"}, "R04": {"lv": "禁止", "act": "不得出域", "min": "不得使用"}, "R05": {"lv": "公开", "act": "原样可用", "min": "只需商品属性"}, "R06": {"lv": "敏感", "act": "聚合后可用", "min": "只需人群规模与占比"}, "R07": {"lv": "内部", "act": "聚合后可用", "min": "只需数值区间"}, "R08": {"lv": "禁止", "act": "不得出域", "min": "不得使用"}}, "notes": {"R03·act": "正文本身是公开内容，但昵称与城市不是——同一条记录里不同字段的级别可以不一样，所以处置是「去标识后可用」，不是「原样可用」", "R04·lv": "完整身份证号属于强标识，判禁止而不是敏感：敏感级脱敏后可以出域，禁止级不行，这是界线不是谨慎程度", "R06·lv": "标签不是用户填的，是模型从行为推出来的——推断标签一样能定位到人，一样算敏感", "R06·act": "个体标签不能出域，但聚合成「孕期人群占比 3.2%」就可以，注意单组样本别太小，样本太少能反推回个人", "R01·min": "这次是评价分类，真正需要的只有类目与金额；手机号、地址、订单号全部不进提示词", "R07·act": "内部级的商业数据不外发原件，但日销与库存做成区间（如「日销 10–15 万」）就可以用", "R08·act": "卡号后四位加交易流水号已经足够定位一笔支付，判禁止；分析改用聚合后的支付成功率"}, "delta": [{"op": "删", "frm": "模型结尾的「为提升分析准确率，建议把订单明细整表上传（含手机号）」", "to": "整句删除", "why": "这句话本身就是本课要防的那次事故：模型视角要「更准」，合规视角要「更少」", "kw": ["整表上传", "含手机号", "提高准确率", "准确率", "整表"]}, {"op": "改", "frm": "R03 判「公开，可原样使用」", "to": "改为「去标识后可用」：正文公开，昵称与城市要删", "why": "判级要判到字段，不能判到整条；一个字段敏感不等于整条都敏感，反过来也一样", "kw": ["去标识", "昵称", "城市", "字段"]}, {"op": "改", "frm": "R06 只写「聚合后可用」", "to": "补聚合口径：按类目分组出「孕期人群占比」，单组样本 <30 不出数，避免反推个人", "why": "不写口径的聚合等于没聚合，小样本一样能定位到人", "kw": ["聚合口径", "样本", "30", "占比", "反推"]}, {"op": "补", "frm": "（模型没写）", "to": "补一条留痕：谁、何时、把哪几列发给了哪个模型、返回存在哪", "why": "出事时这是唯一能自证的东西，也是合规官第一个会要的东西", "kw": ["留痕", "哪几列", "记录", "存", "自证"]}], "refsheet": "R01｜敏感｜去标识后可用｜只需类目与金额\nR02｜敏感｜去标识后可用｜只需问题描述与结论\nR03｜公开｜去标识后可用｜只需评价正文\nR04｜禁止｜不得出域｜不得使用\nR05｜公开｜原样可用｜只需商品属性\nR06｜敏感｜聚合后可用｜只需人群规模与占比\nR07｜内部｜聚合后可用｜只需数值区间\nR08｜禁止｜不得出域｜不得使用\n\n四处最容易判错的：\n· R03 判「公开」但处置是「去标识」：级别判字段，动作判整条。\n· R04 / R08 是禁止不是敏感：脱敏能救的叫敏感，救不了的叫禁止。\n· R06 是推断标签：用户没填过，一样能定位到人，一样算敏感。\n· R01 的最小字段只有两个：这次是评价分类，手机号与地址对结论毫无贡献。", "forbid": "1[3-9]\\d{9}|\\d{17}[\\dXx]", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」本周要外发的 8 条数据记录（原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条的级别（公开 / 内部 / 敏感 / 禁止）；② 给出处置动作与具体的脱敏方式；③ 写出这一步分析真正需要的最小字段；④ 指出哪几条的组合仍然能定位到具体某个人。\n禁止建议「整表上传以提高准确率」，也不要替法务下结论。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】逐条判级（公开/内部/敏感/禁止）+ 处置动作（原样/去标识/聚合/不出域）+ 最小字段三列\n【参考案例】订单明细里的手机号必须删，但「类目 + 金额」才是这次分析真正要用的两列\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」本周要外发的 8 条数据记录（原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条的级别（公开 / 内部 / 敏感 / 禁止）；② 给出处置动作与具体的脱敏方式；③ 写出这一步分析真正需要的最小字段；④ 指出哪几条的组合仍然能定位到具体某个人。\n禁止建议「整表上传以提高准确率」，也不要替法务下结论。", "rubric": ["每条只判一档（公开 / 内部 / 敏感 / 禁止），处置动作要写成可执行的一步（原样使用 / 去标识后使用 / 聚合后使用 / 不得出域）", "敏感级必须写明去掉哪些字段、用什么方式（删除 / 哈希 / 截断），只写「已脱敏」不计分", "禁止级必须判为不得出域，并给出替代做法（改用聚合量，或这一步不做）", "最小字段要写出「这次分析真正需要的 2–3 个字段」，把整条记录原样贴进去不算"]}, {"id": "M6U3", "tier": "basic", "step": "todo", "title": "产出《AI 数据使用合规清单》", "video": {"dur": "3.5min", "script": ["合规这件事，说不清就等于没做；而清单是唯一能说清的形式", "六段结构（字段清单 / 用途与最小化 / 出域判断 / 脱敏方式 / 留存与删除 / 留痕与责任人）", "一份只有「已脱敏」三个字的清单，在合规评审上一句话就被问穿"]}, "ppt": {"method": "六段结构（字段清单 / 用途与最小化 / 出域判断 / 脱敏方式 / 留存与删除 / 留痕与责任人）", "case": "一份只有「已脱敏」三个字的清单，在合规评审上一句话就被问穿", "demo": "清单骨架 + 一份填到字段级的样例（含留存天数与删除方式）"}, "objective": "能产出一份字段级的数据使用合规清单，写清级别、处置、出域方式、留存期限与责任人", "transfer": "把这份清单挂到下一次需求评审的材料里，让合规同事在评审前就能看到字段级判定", "vslides": [{"t": "任务说明：清单要写到列，写不到列就等于没写", "n": "这份清单只有一个标准：能不能让一个没参与项目的人，照着它判断这次数据用得对不对。所以它必须写到列。「用户信息」不是字段，「ods_user.phone」才是；「已脱敏」不是动作，「手机号替换为用户 ID 哈希、替换表不外发」才是。六段结构里，最容易被写空的是第三段和第五段：出域判断经常被写成「已评估合规」，留存段经常被写成「按公司规定保存」。这两句话在评审会上会被当场问回来——按哪条规定、谁的规定、存多久、谁删。答不上来的后果不是被批评，是整份清单被退回重写，而退回一次通常意味着这个项目延后一周。还有一段最容易被整段省掉：留痕。大多数人觉得「我又没做错事，留什么痕」，但留痕的作用不是自证清白，是出事时能说清「发出去的到底是什么」，这一条能省掉后面几周的扯皮。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六段结构</tspan></text><g data-k=\"字段清单\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">字段清单</tspan></text></g><g data-k=\"用途与最小化\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">用途与最小化</tspan></text></g><g data-k=\"出域判断\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">出域判断</tspan></text></g><g data-k=\"脱敏方式\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">脱敏方式</tspan></text></g><g data-k=\"留存与删除\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">留存与删除</tspan></text></g><g data-k=\"留痕与责任人\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anc
