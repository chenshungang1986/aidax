hor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">留痕与责任人</tspan></text></g></svg>", "d": 77.4}, {"t": "最小化那一段：删掉一个字段要有理由", "n": "第二段看起来最好写，其实最容易糊弄过去。写「只用了必要字段」不算；要写清三件事：这次模型要做什么、必需的是哪几个字段、删掉了哪些并说明为什么删。为什么一定要写「为什么删」？因为评审时对方会问「金额为什么不能用」，你要能答「这次是评价分类，金额对分类结论没有贡献」，而不是「感觉不该给」。判断方法还是那一句：逐个字段问「删掉它，结论会变吗」。另外提醒一句，最小化不等于越少越好——如果删掉类目导致分类准确率大幅下降，那类目就是必需字段，要在清单里说明它是必需的，而不是为了显得谨慎把它也删掉。合规不是把数据删光，是每一个字段都有站得住的理由。这一点在评审时尤其明显：字段少但理由全的清单，通常一次就过；字段多但理由空的清单，会被逐条问下去。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 模型要做什么（一句话）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 模型要做什么（一句话）</tspan></text></g><g data-k=\"② 必需字段（2–3 个，列名）\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 必需字段（2–3 个，列名）</tspan></text></g><g data-k=\"③ 删掉的字段 + 删的理由\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 删掉的字段 + 删的理由</tspan></text></g></svg>", "d": 72.05}, {"t": "留存与留痕：出事后唯一能自证的东西", "n": "留存段要回答四个问题：存在哪（路径）、存多久（天数）、谁能看（人名或岗位）、到期怎么删（谁执行、怎么登记）。四个里最常被漏的是最后两个，而它们恰恰是审计时最先查的。删除要写清是「删除」还是「归档」，归档等于没删。留痕段要回答的是另一个问题：发出去的那一刻，发的是什么。写法很朴素——时间、发送人、发给了哪个模型、发了哪几列、返回了什么、存在哪。一行字就够，但它决定了出问题时你是「能说清」还是「说不清」。还有一个实操建议：把这份清单的版本号和复审周期写进第一行，字段一变就升版本，别让它变成一份写完就没人再打开的文件。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"存在哪 / 存多久\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">存在哪 / 存多久</tspan></text></g><g data-k=\"谁能看（到人）\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">谁能看（到人）</tspan></text></g><g data-k=\"到期谁删、怎么登记\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">到期谁删、怎么登记</tspan></text></g><g data-k=\"发出那一刻发了什么\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">发出那一刻发了什么</tspan></text></g></svg>", "d": 60.91}], "deliverable": {"type": "doc", "name": "AI 数据使用合规清单", "rubric": ["字段到列", "出域明确", "留存与责任人落地"], "acceptance": "六段齐全、字段级到列、每段都有可核对的数字或名字（天数/人名/表名），不含「已评估」「妥善处理」这类空话"}, "practice": {"steps": ["字段清单：字段名、取自哪张表、这一列的级别（公开/内部/敏感/禁止），逐列写，不写「用户信息」这类笼统说法", "用途与最小化：这一步要模型做什么、必需的是哪 2–3 个字段、多余字段删掉并写明为什么删", "出域判断：走外部模型 / 企业内网模型 / 不出域，三选一，并写一句理由（不写「已评估」）", "脱敏与聚合方式：具体规则（手机号→用户 ID 哈希、地址→只留到市、金额→区间），并写明是否可还原", "留存与删除：提示词与返回结果存在哪、存多久、谁有权限看、到期用什么方式删", "留痕与责任人：谁审、谁签、出问题找谁，以及这份清单的复审周期"], "exemplar": "【AI 数据使用合规清单 · 评价洞察周报】版本 v1.0　提出人：产品经理　复审周期：每季度\n\n■ 一、字段清单（逐列标级）\n1. order_item.category_l1　取自 ods_order_item　级别：公开\n2. order_item.pay_amount　取自 ods_order_item　级别：内部（商业敏感）\n3. review.content　取自 ods_review　级别：公开（文本本体）\n4. review.nickname　取自 ods_review　级别：敏感（可定位到人）\n5. review.city　取自 ods_review　级别：敏感（与昵称组合可定位）\n6. user.phone　取自 ods_user　级别：敏感　→ 本次不使用\n7. user.id_card　取自 ods_user_verify　级别：禁止　→ 本次不使用\n\n■ 二、用途与最小化\n模型要做的事：把 2000 条评价按「面料起球 / 物流时效 / 尺码 / 客服响应」四类归类，并给每类一句改进建议。\n必需字段只有三个：review.content、order_item.category_l1、review.star。\n删除：nickname、city、phone、pay_amount、id_card 全部不进提示词。\n删除理由：分类任务只需要文本与类目，昵称与城市对结论无贡献，金额与本次任务无关。\n\n■ 三、出域判断\n走外部模型（WorkBuddy）。理由：处理后只剩公开级文本与类目，昵称、城市、金额、身份证均已剔除，不构成个人信息出域；若后续需要按城市分析，改为内网模型 + 城市聚合到「华东/华南」两级。\n\n■ 四、脱敏与聚合方式\n1. review.nickname → 统一替换为「用户A/B/C…」，替换表只存在本地，不随提示词外发。\n2. review.city → 删除；若必须保留，聚合到「华东/华南/华北」三档，单档样本 <30 条不外发（避免小样本反推）。\n3. 以上均不可还原：替换表与外发数据物理分离，外发文件不含用户 ID 映射。\n\n■ 五、留存与删除\n1. 提示词与返回结果存本地 /data/ai/2026-11/，保留 90 天。\n2. 权限：产品经理 1 人可读，数据组 1 人可读，其余无权限。\n3. 到期删除：90 天后由数据组张工执行删除，删除后在清单第 6 段登记日期与执行人。\n4. 模型侧：使用不留存会话的模式，返回结果不做二次训练（服务条款已确认）。\n\n■ 六、留痕与责任人\n审批：合规 李工（签字日期 11/02）｜执行：产品经理 本人｜数据抽取：数据组 张工\n留痕记录：11/02 产品经理向 WorkBuddy 发送 2000 条评价（仅 content/category/star 三列），返回分类结果 1 份，已存本地，记录人：产品经理。\n复审：每季度一次；字段或用途变化时即时复审并升版本号。\n异常上报：发现疑似个人信息残留，立即停止使用并报合规 李工，24 小时内出说明。"}, "task": "产出《AI 数据使用合规清单》：字段清单：字段名、取自哪张表、这一列的级别（公开/内部/敏感/禁止），逐列写，不写「用户信息」这类笼统说法；用途与最小化：这一步要模型做什么、必需的是哪 2–3 个字段、多余字段删掉并写明为什么删；出域判断：走外部模型 / 企业内网模型 / 不出域，三选一，并写一句理由（不写「已评估」）；脱敏与聚合方式：具体规则（手机号→用户 ID 哈希、地址→只留到市、金额→区间），并写明是否可还原；留存与删除：提示词与返回结果存在哪、存多久、谁有权限看、到期用什么方式删；留痕与责任人：谁审、谁签、出问题找谁，以及这份清单的复审周期", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M6 电商合规与安全下的 AI 用法」模块，你要交付的是《AI 数据使用合规清单》。\n【场景】业务侧这周的诉求是：合规这件事，说不清就等于没做；而清单是唯一能说清的形式。参考做法：一份只有「已脱敏」三个字的清单，在合规评审上一句话就被问穿。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（六段结构（字段清单 / 用途与最小化 / 出域判断 / 脱敏方式 / 留存与删除 / 留痕与责任人）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《AI 数据使用合规清单》填写模板】\n\n■ 1. 字段清单：字段名、取自哪张表、这一列的级别（公开/内部/敏感/禁止），逐列写，不写「用户信息」这类笼统说法\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 用途与最小化：这一步要模型做什么、必需的是哪 2–3 个字段、多余字段删掉并写明为什么删\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 出域判断：走外部模型 / 企业内网模型 / 不出域，三选一，并写一句理由（不写「已评估」）\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 脱敏与聚合方式：具体规则（手机号→用户 ID 哈希、地址→只留到市、金额→区间），并写明是否可还原\n   ‣ 提示：每条原始信息后面括号标注来源编号（如「原话#2」），可回查。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 留存与删除：提示词与返回结果存在哪、存多久、谁有权限看、到期用什么方式删\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 留痕与责任人：谁审、谁签、出问题找谁，以及这份清单的复审周期\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 7. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【AI 数据使用合规清单 · 评价洞察周报】版本 v1.0　提出人：产品经理　复审周期：每季度\n\n■ 一、字段清单（逐列标级）\n1. order_item.category_l1　取自 ods_order_item　级别：公开\n2. order_item.pay_amount　取自 ods_order_item　级别：内部（商业敏感）\n3. review.content　取自 ods_review　级别：公开（文本本体）\n4. review.nickname　取自 ods_review　级别：敏感（可定位到人）\n5. review.city　取自 ods_review　级别：敏感（与昵称组合可定位）\n6. user.phone　取自 ods_user　级别：敏感　→ 本次不使用\n7. user.id_card　取自 ods_user_verify　级别：禁止　→ 本次不使用\n\n■ 二、用途与最小化\n模型要做的事：把 2000 条评价按「面料起球 / 物流时效 / 尺码 / 客服响应」四类归类，并给每类一句改进建议。\n必需字段只有三个：review.content、order_item.category_l1、review.star。\n删除：nickname、city、phone、pay_amount、id_card 全部不进提示词。\n删除理由：分类任务只需要文本与类目，昵称与城市对结论无贡献，金额与本次任务无关。\n\n■ 三、出域判断\n走外部模型（WorkBuddy）。理由：处理后只剩公开级文本与类目，昵称、城市、金额、身份证均已剔除，不构成个人信息出域；若后续需要按城市分析，改为内网模型 + 城市聚合到「华东/华南」两级。\n\n■ 四、脱敏与聚合方式\n1. review.nickname → 统一替换为「用户A/B/C…」，替换表只存在本地，不随提示词外发。\n2. review.city → 删除；若必须保留，聚合到「华东/华南/华北」三档，单档样本 <30 条不外发（避免小样本反推）。\n3. 以上均不可还原：替换表与外发数据物理分离，外发文件不含用户 ID 映射。\n\n■ 五、留存与删除\n1. 提示词与返回结果存本地 /data/ai/2026-11/，保留 90 天。\n2. 权限：产品经理 1 人可读，数据组 1 人可读，其余无权限。\n3. 到期删除：90 天后由数据组张工执行删除，删除后在清单第 6 段登记日期与执行人。\n4. 模型侧：使用不留存会话的模式，返回结果不做二次训练（服务条款已确认）。\n\n■ 六、留痕与责任人\n审批：合规 李工（签字日期 11/02）｜执行：产品经理 本人｜数据抽取：数据组 张工\n留痕记录：11/02 产品经理向 WorkBuddy 发送 2000 条评价（仅 content/category/star 三列），返回分类结果 1 份，已存本地，记录人：产品经理。\n复审：每季度一次；字段或用途变化时即时复审并升版本号。\n异常上报：发现疑似个人信息残留，立即停止使用并报合规 李工，24 小时内出说明。", "rubric": ["字段清单落到列名与来源表，出现「用户信息」「相关数据」这类笼统说法按未写计", "出域判断三选一（外部模型 / 内网模型 / 不出域），并给理由；只写「已评估合规」不计分", "脱敏方式写成可执行的规则，并明确是否可还原（可还原的按未达标计）", "留存段要有天数与删除方式、责任人段要有人名或岗位，缺一项按未写完计"]}, {"id": "M6U4", "tier": "basic", "step": "spar", "title": "合规官挑战你的数据清单", "video": {"dur": "3.4min", "script": ["合规官不反对你用数据，他反对的是「说不清用了什么、发去了哪里」", "挑战清单：字段级别 / 出域依据 / 留存删除 / 停用能力", "「你去掉手机号，剩下的组合还能不能认出他？」——这一问能问穿八成的清单"]}, "ppt": {"method": "挑战清单：字段级别 / 出域依据 / 留存删除 / 停用能力", "case": "「你去掉手机号，剩下的组合还能不能认出他？」——这一问能问穿八成的清单", "demo": "陪练对话界面说明（把数据清单粘进系统提示词，让对手按你写的字段逐条发问）"}, "objective": "能在合规官 4 轮追问下，说清字段级别、出域依据、留存删除与停用能力", "transfer": "把陪练里被问住的三个问题补进清单，再找合规同事过一遍签字", "vslides": [{"t": "陪练说明：他只信「能证明」，不信「已经做了」", "n": "合规官和前面几位都不同：他不关心你的分析做得多漂亮，也不打算阻止你用数据。他只关心一件事——你能不能证明你做的和你说的是一回事。所以「我们已经脱敏了」在他那里等于没说，「手机号替换为用户 ID 哈希、替换表不外发、外发文件只有三列」才算一句话。他的四个问题分别是：剩下的组合还能不能认出人、出域谁批的、结果存多久谁删、明天让你停你多久能停干净。这四问合起来是一件事：这份数据从进到出，每一个环节是否可追溯。答这类问题有一个通用结构：先说结论，再说你验证过什么，最后说哪一部分你保证不了、需要他拍。装作什么都能保证，是这类对话里最快失去信任的方式。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他的四问</tspan></text><g data-k=\"还能认出人吗\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">还能认出</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">人吗</tspan></text></g><g data-k=\"谁批的 / 留痕在哪\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">谁批的 /</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">留痕在哪</tspan></text></g><g data-k=\"存多久 / 谁删\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">存多久 /</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">谁删</tspan></text></g><g data-k=\"多久能停干净\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">多久能停</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">干净</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 63.86}, {"t": "组合可识别性：要用验证方法说话", "n": "第一问几乎所有人都会答「不会」，但真正的答案是「我做过测试」。测试方法很朴素：拿外发的那几列，加上你手上有但没有外发的列，去订单表里翻，看能翻出几个人。翻出 1 到 2 个就是能识别，翻出 9 个以上基本安全。这个测试不需要技术背景，二十分钟能做完，但做完之后你的回答性质就变了——从「我认为」变成「我验证过」。还要主动说边界：与外部数据集关联后的重识别风险，不是 PM 能判断的，这一层要明确交给他。主动交出去，比被他问出来好得多。另外准备一个后备方案：如果他认为金额区间还不够粗，你能不能改成只留类目？能改、改了会损失什么，这两句要提前想好。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 拿外发列去订单表翻人\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 拿外发列去订单表翻人</tspan></text></g><g data-k=\"② 翻出 1–2 人 = 能识别\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 翻出 1–2 人 = 能识别</tspan></text></g><g data-k=\"③ 主动交出重识别风险\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 主动交出重识别风险</tspan></text></g></svg>", "d": 60.34}, {"t": "留存、删除与停用：把「能停」证明给他看", "n": "第二问考的是留痕：谁批的、发出去的是哪几列、存在哪。这一问没法临场编，必须有记录——一条时间、发送人、模型、列名、返回结果存放路径的记录就够。第三问考的是留存：存多久、谁能看、到期谁删、是真删还是归档。归档等于没删，这句话一定要说清。第四问最狠：明天让你停，你多久能停干净。标准答法是给时间和验证方式：停用入口关掉 + 历史文件删除 + 模型侧会话清理，两小时内完成，验证方式是让数据组按原条件再查一次，返回空。说不出验证方式，就等于没停。这一问还有个变种：如果发现要停的是外发出去的文件，你怎么确认对方那边也删了——这种时候只能靠合同条款，所以我会在事前就把这条写进服务约定，而不是等出了事再去找人。这三问背后是同一个要求：你的清单不能只是「计划」，要能被执行、被验证。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"留痕：时间 / 人 / 列 / 路径\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">留痕：时间 / 人 / 列 / 路径</tspan></text></g><g data-k=\"留存：天数 + 真删\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">留存：天数 + 真删</tspan></text></g><g data-k=\"停用：耗时 + 怎么验证\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">停用：耗时 + 怎么验证</tspan></text></g><g data-k=\"保证不了的交给合规拍\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">保证不了的交给合规拍</tspan></text></g></svg>", "d": 82.15}], "deliverable": {"type": "doc", "name": "AI 数据使用合规清单", "rubric": ["字段级回答", "验证方法", "停用可执行"], "acceptance": "四问都能给出字段级判定、验证方法、留痕位置与停用耗时，且不越权替合规下结论"}, "spar": {"role": "数据合规官", "persona": "看过太多「已脱敏」三个字，只信字段级判定与删除记录；不问你有没有做，只问你能不能证明做了", "mustAsk": ["你去掉手机号，剩下的字段组合还能不能认出具体某个人？怎么验证的？", "这些数据发到外部模型，谁批的？留痕在哪，能证明发出去的就是这三列吗？", "结果存在哪、存多久、到期谁删？删除是真删还是归档？", "如果明天要求你立刻停用这份数据，你多久能停干净、怎么确认停干净了？"]}, "exemplar": "（问：你去掉手机号，剩下的组合还能不能认出他？）\n\n结论：会。这次外发的三列里，类目 + 金额 + 评价文本，如果再带上城市，我们内部能认出 1 到 2 个人，所以城市这一列我已经删了，现在外发只有类目、金额区间、评价正文三列，我认为不足以定位到人。\n依据：上周做过一次组合测试，用「区 + 商品类目 + 下单小时」去翻订单表，三十人的部门里能唯一确定 1 人；把金额改成区间（每 100 元一档）、去掉城市之后，同条件能翻出 9 人以上，已经超过可识别范围。这次外发的是评价分类任务，城市对分类结论没有贡献，所以直接删掉，没有做聚合。\n边界：我不能保证绝对不可识别。如果外发数据与外部其他数据集做关联，理论上仍存在重识别风险，这一层超出我的判断能力，需要你确认是否要求做差分隐私或直接改用内网模型。另外「金额区间」这个口径是我定的，如果合规要求更粗（比如只留类目），我明天就能改，但分析结论的颗粒度会下降，这个取舍需要你拍。", "task": "把《AI 数据使用合规清单》拿到「数据合规官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《AI 数据使用合规清单》。现在要让它通过「数据合规官」这一关。\n【对手的立场】看过太多「已脱敏」三个字，只信字段级判定与删除记录；不问你有没有做，只问你能不能证明做了。\n【他一定会追问】「你去掉手机号，剩下的字段组合还能不能认出具体某个人？怎么验证的？」 / 「这些数据发到外部模型，谁批的？留痕在哪，能证明发出去的就是这三列吗？」 / 「结果存在哪、存多久、到期谁删？删除是真删还是归档？」\n【场景】你说「合规官挑战你的数据清单」，对方立刻回一句：你去掉手机号，剩下的字段组合还能不能认出具体某个人？怎么验证的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["回答落到字段名或列名，不写「用户信息」「相关数据」这类笼统说法", "组合可识别性要给验证方法（怎么翻、翻出几个人），不是「应该不会」", "留痕要能说清位置与内容（发了哪几列、存在哪），只说「有记录」不计分", "停用能力给出耗时与确认方式（怎么验证真的停了），并说明无法保证的部分由谁确认"]}, {"id": "M6U5", "tier": "adv", "step": "understand", "title": "刷单、假评、违禁词：三类风险", "video": {"dur": "3.6min", "script": ["风控里最贵的不是漏判，是误杀——把真实用户判成刷单，损失的是口碑", "三类风险（交易作弊 / 内容风险 / 账号风险）+ 刷单五个信号组合判断 + 筛查与定性的分工", "同一收货地址 37 个账号下单 + 评价文本相似度 0.9，两条放在一起才够定性"]}, "ppt": {"method": "三类风险（交易作弊 / 内容风险 / 账号风险）+ 刷单五个信号组合判断 + 筛查与定性的分工", "case": "同一收货地址 37 个账号下单 + 评价文本相似度 0.9，两条放在一起才够定性", "demo": "同一批异常信号的三种处理：只看一条 vs 看组合 vs 看证据链"}, "objective": "能区分交易作弊、内容风险与账号风险三类，并说清哪些靠 AI 筛查、哪些必须人定性", "transfer": "把上周判过的一个「疑似刷单」案例按信号组合重看一遍，判断当时证据够不够", "vslides": [{"t": "三类风险：先分类，再谈处置", "n": "电商风控看起来杂，归到三类就清楚了。第一类交易作弊：刷单、刷评、薅羊毛、恶意退款，目的是套补贴或做数据，损失是钱和排名可信度。第二类内容风险：违禁词、绝对化用语、功效宣称、低俗与侵权图片、贬低同行，损失是下架、罚款和品牌。第三类账号风险：撞库、盗号、异常登录、批量注册，损失是用户资产和后续所有作弊的入口。为什么要先分类？因为三类的处置动作完全不同：交易作弊要冻结与追款，内容风险要下架与改写，账号风险要验证与限流。分类错了，处置一定错——把一条功效宣称当成刷单去封店，是最典型的误伤。分类还有第二个作用：它决定了你要看哪些数据，交易类看订单与设备，内容类看文本与图片，账号类看登录与行为序列。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类风险</tspan></text><g data-k=\"交易作弊 刷单 / 刷评 / 薅羊毛\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">交易作弊　刷单 /</tspan><tspan x=\"72.7\" dy=\"14.950000000000001\"> 刷评 / 薅羊毛</tspan></text></g><g data-k=\"内容风险 违禁 / 绝对化 / 功效\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">内容风险　违禁 /</tspan><tspan x=\"200.0\" dy=\"14.950000000000001\"> 绝对化 / 功效</tspan></text></g><g data-k=\"账号风险 撞库 / 盗号 / 批量注册\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">账号风险　撞库 /</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\"> 盗号 / 批量注册</tspan></text></g></svg>", "d": 74.4}, {"t": "刷单的五个信号：单看一条都不算证据", "n": "判断刷单不能靠一个信号，要靠组合。五个最常用：一是收货地址集中，几十个账号用同一个地址或同一栋楼；二是下单时间异常，正常用户下单是分散的，刷单常常集中在几分钟内；三是账号年龄短且只买这一个商品；四是评价文本高度相似，改几个字的模板；五是转化与退款脱节，转化率突然翻倍但退款率也高。这五条里任何一条单独出现都可能有无辜解释——公司采购、家人代买、真实团购都能造成地址集中。所以纪律是：至少两个互相独立的信号，才能进人工复核；涉及封禁的，要三个以上加证据链。这里的「互相独立」很关键：地址集中和收货人姓名相似，其实是同一个原因造成的，不能算两条。判断独立性问一句「这两条会不会是同一件事引起的」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 地址集中\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 地址集中</tspan></text></g><g data-k=\"② 下单时间聚集\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 下单时间聚集</tspan></text></g><g data-k=\"③ 新号只买一件\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 新号只买一件</tspan></text></g><g data-k=\"④ 评价文本雷同\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 评价文本雷同</tspan></text></g><g data-k=\"⑤ 转化高但退款也高\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 转化高但退款也高</tspan></text></g></svg>", "d": 72.41}, {"t": "AI 的边界：它筛，人定，规则管", "n": "模型在这件事上非常有用，但用处只有一个：把一万条缩到五十条。它擅长模式识别——文本相似度、时间聚集、地址聚类，做得比人快几个数量级。它不擅长两件事：定性，和承担后果。「这个账号是刷单」是一个会伤害真实用户的判断，必须由人看证据链后下；而处罚动作要有明文规则，不能凭模型分数。所以正确的分工是三层：模型做筛查打分，人做定性复核，规则决定处置强度。还有一条底线：任何处罚都要有申诉通道，且申诉要能被人看到，不能落到一个没人看的邮箱里。误杀的成本常被低估——一个真实用户被误判封号，损失的不只是他这一单，是他身边所有人的信任。这也是为什么涉资金、涉封号、涉未成年人的结论，一律不许只凭模型输出。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三层分工</tspan></text><g data-k=\"模型筛查：一万 → 五十\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">模型筛查：一万</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">→ 五十</tspan></text></g><g data-k=\"人工定性：看证据链\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">人工定性：看证</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">据链</tspan></text></g><g data-k=\"规则处置：按强度分级\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">规则处置：按强</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">度分级</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.45}], "deliverable": {"type": "doc", "name": "风险图谱与处置口径", "rubric": ["三类不混", "信号组合", "不定性越权"], "acceptance": "能对一批异常给出信号组合、定性结论与处置动作，并写明哪些结论不能只靠模型下"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三类风险（交易作弊 / 内容风险 / 账号风险）+ 刷单五个信号组合判断 + 筛查与定性的分工\n【为什么重要】风控里最贵的不是漏判，是误杀——把真实用户判成刷单，损失的是口碑\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["能把风险归到三类之一（交易作弊 / 内容风险 / 账号风险），不把内容问题当交易问题处理", "定性结论至少给两个互相独立的信号，单一信号不能作为处罚依据", "写明处置动作的强度（提示 / 限流 / 拦截 / 封禁）与对应证据要求，跳级处置不算", "明确哪些结论必须人工复核（涉资金、涉封号、涉未成年人），不能只凭模型输出"]}, {"id": "M6U6", "tier": "adv", "step": "demo", "title": "用 AI 做合规词库拦截", "video": {"dur": "3.5min", "script": ["词库能拦住说错的话，拦不住做错的事——剩下那一层只能靠规则和人工", "词库分层（绝对化 / 功效 / 医疗 / 价格不实 / 贬低比较）+ 三档动作（自动拦截 / 人工复核 / 放行）", "「抗菌率 99.9%」词库拦得住，但「扫码加微信领赠品」词库一个字都拦不住"]}, "ppt": {"method": "词库分层（绝对化 / 功效 / 医疗 / 价格不实 / 贬低比较）+ 三档动作（自动拦截 / 人工复核 / 放行）", "case": "「抗菌率 99.9%」词库拦得住，但「扫码加微信领赠品」词库一个字都拦不住", "demo": "WorkBuddy 内跑一遍：先判命中哪类词库，再让模型改写，最后自己核依据够不够"}, "objective": "能把 8 条商品文案逐条判出命中哪类词库、该走哪种拦截动作，并识别出词库拦不住的那类问题", "transfer": "把本季被判为自动拦截的三条文案整理给运营，同步提出词库里缺的那一类", "vslides": [{"t": "演示准备：词库能拦三条，拦不住的那条才是重点", "n": "这 8 条文案是运营写好的商品与活动文案。其中三条会被词库直接拦下：「全网最低价」命中绝对化用语库，「治疗失眠」命中医疗用语库，「比某品牌更耐用 3 倍」命中贬低比较类库。这三条没什么争议，词库一过就红。真正需要你判断的是另外五条：「抗菌率 99.9%」「0 糖 0 卡」词库能识别但拦不了，因为它们缺的不是表述而是依据，只能走人工复核；「原价 899 现价 299」要看有没有真实成交记录；「A 类婴幼儿标准」有检测报告就能用；而「扫码加微信领赠品」——词库里一个字都命中不了，但它的问题比前面三条都大。这就是词库的本质：它只能拦「说错的话」，拦不住「做错的事」。你要做的是三档动作，并指出词库之外还缺哪条规则。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"8 条文案：绝对化 / 医疗 / 功效 / 价格 / 贬低 / 无命中\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条文案：绝对化 / 医疗 / 功效 / 价格 / 贬低 / 无命中</tspan></text></g><g data-k=\"词库能直接拦：3 条\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">词库能直接拦：3 条</tspan></text></g><g data-k=\"能识别但拦不了：3 条 · 词库零命中：2 条\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">能识别但拦不了：3 条 · 词库零命中：2 条</tspan></text></g></svg>", "d": 69.84}, {"t": "三档动作：能拦的拦，拦不了的转人，别硬拦", "n": "三档动作的界线在「能不能靠一句话解决」。自动拦截是文案本身立不住，改一句话就能上线：「全网最低价」改成「活动价 299，活动时间 10/28–11/03」，同一句话把绝对化变成了可核对的事实。人工复核是文案没错但依据没到：「抗菌率 99.9%」不是不能写，是必须先有检测报告；这种如果硬拦，运营会绕过去继续写，反而更危险。放行是文案与依据都齐：有检测报告编号且在有效期内，就可以放。这里有个容易犯的错：把「能识别」当成「能判断」。词库识别的是词，判断依据的是文件，这两件事之间隔着一个复核动作；少了这个动作，词库就会变成「谁写得巧谁过」的游戏。还有一条实操：自动拦截的三条必须同时给替代文案，否则运营会自己改一版更糟的回来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 自动拦截：改一句话即可上线\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 自动拦截：改一句话即可上线</tspan></text></g><g data-k=\"② 人工复核：文案没错，依据没到\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 人工复核：文案没错，依据没到</tspan></text></g><g data-k=\"③ 放行：文案与依据都齐\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 放行：文案与依据都齐</tspan></text></g></svg>", "d": 72.14}, {"t": "词库的盲区：它考用语，不考行为", "n": "「扫码加微信领赠品」为什么词库拦不住？因为词库里没有一个词是有问题的——扫码很正常、加微信很正常、领赠品也很正常。问题出在行为上：交易与发券被引到了平台之外，既不留痕也难追溯。这一类问题靠加词解决不了，只能另立规则，判断条件要写成行为描述：「文末出现站外联系方式或引导加好友的表述」，而不是加一个词「微信」。同理还有「赠品规格不明」「名额口径不明」，都不是用词问题。所以一份真正能用的合规体系是两层：词库管用语，规则管行为，人工管边界。你要交的判定表里，至少要有这么一行是「无明显命中但需复核」，并写清补什么规则——这一行比前面三条拦截更能说明你懂这套东西在哪儿会失效。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">词库能管</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">词库管不了</tspan></text><g data-k=\"判用语：绝对化 / 功效 / 医疗 / 价格 / 贬低\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">判用语：绝对化 / 功效 /</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\"> 医疗 / 价格 / 贬低</tspan></text></g><g data-k=\"判行为：站外交易 / 赠品不明 / 名额不明\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">判行为：站外交易 / 赠品</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">不明 / 名额不明</tspan></text></g></svg>", "d": 67.92}], "deliverable": {"type": "sheet", "name": "合规词库与拦截动作表", "rubric": ["命中判准", "动作分级", "识别词库盲区"], "acceptance": "8 条文案都有命中词库、拦截动作与处置；至少指出一条词库拦不住的问题并给出补充规则"}, "demo": {"ref": "■ 文案判定（8 条）\n\nT01｜「全网最低价，错过再等一年」→ 绝对化用语库（全网最低、错过再等一年）\n　动作：自动拦截｜替代：「活动价 299，活动时间 10/28–11/03」\n\nT02｜「治疗失眠，改善睡眠质量」→ 医疗用语库（治疗、失眠）\n　动作：自动拦截｜替代：「亲肤面料，透气不闷汗」（改为可验证的物理属性）\n\nT03｜「抗菌率 99.9%，抑菌防螨」→ 功效宣称库（抗菌率、抑菌、防螨）\n　动作：人工复核｜处置：需提供检测报告编号与检测机构，缺一不可上线\n\nT04｜「0 糖 0 卡，减脂必备」→ 功效宣称库（0 糖、减脂）\n　动作：人工复核｜处置：需营养成分表支持「0 糖」「0 卡」的判定口径，否则改写\n\nT05｜「比某品牌更耐用 3 倍」→ 贬低比较类库（比…更、3 倍）\n　动作：自动拦截｜替代：「面料克重 220g，高于同类常规 180g」（改为可核对的事实）\n\nT06｜「原价 899，现价 299」→ 价格不实库（原价）\n　动作：人工复核｜处置：需提供近 30 天真实成交记录，无记录则删掉「原价」表述\n\nT07｜「A 类婴幼儿标准纯棉四件套」（附检测报告编号）→ 无明显命中\n　动作：放行｜处置：保留检测报告编号，页面可查\n\nT08｜「扫码加微信领赠品」→ 无明显命中\n　动作：人工复核｜处置：词库拦不住，属交易脱离平台，需人工判断并改为平台内领券\n\n■ 结论：自动拦截 3 条、人工复核 4 条（其中 1 条词库零命中）、放行 1 条。\n■ 建议：以上三条涉嫌违反《广告法》第九条，建议直接下架并追责运营。", "fix": ["「涉嫌违反《广告法》第九条，建议直接下架并追责运营」整段删掉——法条与定性是法务的结论，追责更不是 PM 的权限", "T07 判「放行」要附条件：检测报告编号必须真实可查、且报告在有效期内，不能只凭页面写了编号就放行", "T08 归到「无明显命中」是对的，但要说清这是词库的结构性盲区——它考的是行为不是用语，需要另立规则而不是加词", "T06 只写「需提供成交记录」不够，要写清没有记录时的替代动作（删掉「原价」二字，只讲现价与活动期）"], "judge": "判断依据：有没有引法条或替法务定性；自动拦截的三条有没有给出可直接替换的文案；「无明显命中」的两条有没有被直接放行；词库盲区有没有被识别出来并给出规则方向", "sheet": {"situ": "运营把这季的 8 条商品与活动文案提交审核，附了一句「都在词库里过了一遍」。你把命中的和没命中的分开看，发现一个尴尬的情况：词库命中率挺高，但有一类问题它一个字都拦不住。审核结论今天要出，明天就上架。", "ask": "① 8 条文案逐条判命中哪类词库、该走哪种拦截动作；② 用你的表请 AI 给替换文案与依据要求；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 判定每条命中哪类词库并指出触发词；② 给出拦截动作；③ 对需要改写的给出可直接上线的替代文案；④ 指出哪几条词库拦不住、要补什么行为规则。\n不要引用具体法条编号，也不要替我下法律结论。", "mats": [{"id": "T01", "src": "商品主标题", "text": "全网最低价，错过再等一年。"}, {"id": "T02", "src": "商详页卖点", "text": "治疗失眠，改善睡眠质量。"}, {"id": "T03", "src": "详情页参数区", "text": "抗菌率 99.9%，抑菌防螨。\n（未附检测报告，页面也未标注检测机构）"}, {"id": "T04", "src": "食品类目卖点", "text": "0 糖 0 卡，减脂必备。"}, {"id": "T05", "src": "对比图配文", "text": "比某品牌更耐用 3 倍。"}, {"id": "T06", "src": "活动页价格模块", "text": "原价 899，现价 299。\n（近 30 天实际成交价为 299–349，899 从未成交）"}, {"id": "T07", "src": "母婴系列标题", "text": "A 类婴幼儿标准纯棉四件套。\n（页面已附检测报告编号与检测机构，报告在有效期内）"}, {"id": "T08", "src": "详情页文末", "text": "扫码加微信领赠品。"}], "cols": [{"k": "lib", "name": "命中词库", "hint": "词库一个字都没命中就选最后一项", "type": "chips", "w": 3, "tags": ["绝对化用语库", "功效宣称库", "医疗用语库", "价格不实库", "贬低比较类库", "无明显命中"]}, {"k": "act", "name": "拦截动作", "hint": "三档：自动拦截 / 人工复核 / 放行", "type": "chips", "w": 2, "tags": ["自动拦截", "人工复核", "放行"]}, {"k": "fix", "name": "处置", "hint": "选一条能直接落地的处置", "type": "chips", "w": 3, "tags": ["删词后改为活动价与活动期", "删除医疗用语，改为物理属性", "补检测报告编号后可用", "补成分依据后可用", "删掉比较，改为可核对的数据", "补成交记录，无则删原价", "附条件放行：报告编号可查", "改平台内领券，不走站外"]}], "key": {"T01": {"lib": "绝对化用语库", "act": "自动拦截", "fix": "删词后改为活动价与活动期"}, "T02": {"lib": "医疗用语库", "act": "自动拦截", "fix": "删除医疗用语，改为物理属性"}, "T03": {"lib": "功效宣称库", "act": "人工复核", "fix": "补检测报告编号后可用"}, "T04": {"lib": "功效宣称库", "act": "人工复核", "fix": "补成分依据后可用"}, "T05": {"lib": "贬低比较类库", "act": "自动拦截", "fix": "删掉比较，改为可核对的数据"}, "T06": {"lib": "价格不实库", "act": "人工复核", "fix": "补成交记录，无则删原价"}, "T07": {"lib": "无明显命中", "act": "放行", "fix": "附条件放行：报告编号可查"}, "T08": {"lib": "无明显命中", "act": "人工复核", "fix": "改平台内领券，不走站外"}}, "notes": {"T08·lib": "词库里没有一个词有问题：扫码正常、加微信正常、领赠品也正常。问题出在行为上——交易被引到了平台之外，这类只能另立行为规则，加词没用", "T03·act": "词库能识别「抗菌率」，但拦不了它，因为缺的不是表述而是依据，硬拦只会让运营换个说法绕过去", "T07·act": "有检测报告编号且在有效期内就能放行，但必须附条件：编号要真实可查，报告要覆盖文案里的表述", "T06·lib": "「原价」进的是价格不实库，不是绝对化库——判词库要看触发词，不要凭感觉归类", "T05·fix": "替代文案要给可核对的事实（克重 220g vs 同类常规 180g），不要改成「更耐用」的同义表述"}, "delta": [{"op": "删", "frm": "模型结论「以上三条涉嫌违反《广告法》第九条，建议直接下架并追责运营」", "to": "整段删除，改为「T01/T02/T05 属合规疑点，建议按拦截动作处理」", "why": "法条与定性是法务的结论，追责更不是 PM 的权限；写错要担责，写对也不加分", "kw": ["广告法", "第九条", "违反", "追责", "下架"]}, {"op": "改", "frm": "T07 判「无明显命中，放行」就结束", "to": "补附条件：报告编号真实可查、报告在有效期内、且报告覆盖文案里的全部表述", "why": "「A 类婴幼儿标准」是事实主张，没有可查依据的放行等于给未来埋投诉", "kw": ["附条件", "有效期", "可查", "覆盖", "编号"]}, {"op": "改", "frm": "T08 归到「无明显命中」后不再处理", "to": "明确这是词库的结构性盲区：它考用语不考行为，需要另立一条行为规则", "why": "词库零命中最危险——它给人的错觉是「已审过、没问题」", "kw": ["盲区", "行为", "规则", "不考", "结构性"]}, {"op": "补", "frm": "（模型没写）", "to": "补一条行为规则：「文末出现站外联系方式或引导加好友的表述」一律转人工", "why": "这类问题靠加词解决不了，只能把判断条件写成行为描述", "kw": ["站外", "行为规则", "加好友", "转人工", "联系方式"]}], "refsheet": "T01｜绝对化用语库｜自动拦截｜删词后改为活动价与活动期\nT02｜医疗用语库｜自动拦截｜删除医疗用语，改为物理属性\nT03｜功效宣称库｜人工复核｜补检测报告编号后可用\nT04｜功效宣称库｜人工复核｜补成分依据后可用\nT05｜贬低比较类库｜自动拦截｜删掉比较，改为可核对的数据\nT06｜价格不实库｜人工复核｜补成交记录，无则删原价\nT07｜无明显命中｜放行｜附条件放行：报告编号可查\nT08｜无明显命中｜人工复核｜改平台内领券，不走站外\n\n四处最容易判错的：\n· T08 词库零命中，却是这一批里风险最大的一条——它考的是行为不是用语。\n· T03 能识别但拦不住：缺的是依据不是表述，硬拦会让运营换个说法绕过去。\n· T07 是「可用但附条件」：编号可查、在有效期内、报告覆盖文案里的表述。\n· T06 进的是价格不实库：判词库看触发词，不看感觉。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」本季 8 条商品与活动文案（原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条命中哪类词库，并指出触发词；② 给出拦截动作（自动拦截 / 人工复核 / 放行）；③ 对需要改写的给出可直接上线的替代文案；④ 指出哪几条词库拦不住、需要补什么规则。\n不要引用具体法条编号，也不要替我下法律结论。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】词库分层（绝对化 / 功效 / 医疗 / 价格不实 / 贬低比较）+ 三档动作（自动拦截 / 人工复核 / 放行）\n【参考案例】「抗菌率 99.9%」词库拦得住，但「扫码加微信领赠品」词库一个字都拦不住\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」本季 8 条商品与活动文案（原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条命中哪类词库，并指出触发词；② 给出拦截动作（自动拦截 / 人工复核 / 放行）；③ 对需要改写的给出可直接上线的替代文案；④ 指出哪几条词库拦不住、需要补什么规则。\n不要引用具体法条编号，也不要替我下法律结论。", "rubric": ["每条只判一类词库（绝对化 / 功效 / 医疗 / 价格不实 / 贬低比较 / 无明显命中），并给出触发判断的那几个词", "拦截动作分三档（自动拦截 / 人工复核 / 放行），自动拦截的必须能直接替换上线，只写「建议修改」不计分", "「无明显命中」却仍有风险的，必须标为人工复核，并说明词库为什么拦不住", "至少指出一条「词库之外」的风险（如诱导脱离平台交易、赠品规格不明），并给出一条可加入规则库的判断条件"]}, {"id": "M6U7", "tier": "adv", "step": "todo", "title": "产出《内容安全与风控规范》", "video": {"dur": "3.4min", "script": ["规范的价值不在写得全，在于出事时有人知道下一步找谁", "五节结构（适用范围 / 词库分层 / 处置动作与时效 / 误杀与申诉 / 追责与回写）", "一份没写申诉通道的规范，执行三个月后会被运营绕过去"]}, "ppt": {"method": "五节结构（适用范围 / 词库分层 / 处置动作与时效 / 误杀与申诉 / 追责与回写）", "case": "一份没写申诉通道的规范，执行三个月后会被运营绕过去", "demo": "规范骨架 + 一份填到「谁在几小时内处理」的样例"}, "objective": "能产出一份可执行的内容安全与风控规范，覆盖范围、词库分层、处置动作、误杀申诉与追责", "transfer": "把这份规范的前两节发给运营负责人对一遍，确认哪些玩法是本期明确不放开的", "vslides": [{"t": "任务说明：规范的每一节都要有人", "n": "一份能用的内容安全规范，判断标准只有一个：出了事，随便抓一个人来看，他能不能照着自己往下走。所以每一节都要有人、有时限、有出口。适用范围要逐项列明，不能写「所有对外内容」——直播口播要不要实时审、达人 brief 归谁审、用户评价改不改写，这三件事的答案完全不同，写笼统了等于都不管。词库分层要给真实例子，光写「绝对化用语」没人知道边界在哪，写「全网最低、国家级、错过再等一年」才知道。处置动作要有时效，2 小时和 2 天是两个体系。最容易被整节省掉的是误杀与申诉——但没有申诉通道的规范，执行三个月就会被绕过去，因为运营发现「被拦了就没人管」，于是自己找路子。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五节结构</tspan></text><g data-k=\"适用范围\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">适用范围</tspan></text></g><g data-k=\"词库分层\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">词库分层</tspan></text></g><g data-k=\"处置与时效\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">处置与时效</tspan></text></g><g data-k=\"误杀与申诉\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">误杀与申诉</tspan></text></g><g data-k=\"追责与回写\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">追责与回写</tspan></text></g></svg>", "d": 62.83}, {"t": "行为类规则要单列：词库拦不住的那一层", "n": "规范里最容易漏的是第七类：行为类规则。词库管的是用语，而很多问题出在行为上——「扫码加微信领赠品」每个词都没问题，问题是交易被引到了平台之外；「前 100 名 5 折」每个词也没问题，问题是名额口径没写。这一类如果硬塞进词库，会得到一堆误杀；正确做法是单列一层行为规则，判断条件写成行为描述：「文末出现站外联系方式」「赠品规格未标注」「限量未写统计口径」。这样审核岗拿到的是判断题而不是猜谜。每条行为规则还要写清证据要求：站外联系方式看截图，赠品规格看活动页，名额口径看后台配置。写清证据，复核才有时效可言；不写证据，2 小时的时限就是空话。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 词库层：管用语（可自动拦）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 词库层：管用语（可自动拦）</tspan></text></g><g data-k=\"② 行为层：管做法（转人工复核）\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 行为层：管做法（转人工复核）</tspan></text></g><g data-k=\"③ 证据层：每条规则配证据要求\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 证据层：每条规则配证据要求</tspan></text></g></svg>", "d": 65.09}, {"t": "申诉与回写：让规范能被纠正", "n": "申诉这一节的作用不是照顾运营情绪，是让规范自己能被纠正。要写四件事：谁有权临时放行、放行留什么记录、申诉走哪个入口、多久答复。为什么必须有临时放行权？因为词库一定会误杀——「无糖」在食品类目是可用表述，在别处就可能是功效宣称；没有放行权，审核岗只能一刀切，切久了运营就会绕。放行要留记录，否则放行权本身就成了新的风险点。答复时长要写死，超时默认放行并计入考核，这条比任何承诺都有效。最后一节是回写：新玩法从发现到入库多久、谁执行、谁验收。没有回写机制，词库会一年比一年旧，旧到没人看。本期明确不做的事也要写进规范——写清「本期不做直播实时审核，用 10% 人工抽检代替」，比含糊承诺更能让人信任这份文件。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"谁有权临时放行\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">谁有权临时放行</tspan></text></g><g data-k=\"放行必须留记录\"><g><circle cx=\"30\" cy=\"80\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 80 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"84.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">放行必须留记录</tspan></text></g><g data-k=\"申诉答复时长（超时默认放行）\"><g><circle cx=\"30\" cy=\"108\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 108 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"113.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">申诉答复时长（超时默认放行）</tspan></text></g><g data-k=\"新玩法几日内入库\"><g><circle cx=\"30\" cy=\"137\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 137 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"141.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">新玩法几日内入库</tspan></text></g><g data-k=\"本期明确不做什么\"><g><circle cx=\"30\" cy=\"165\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 165 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"170.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">本期明确不做什么</tspan></text></g></svg>", "d": 73.49}], "deliverable": {"type": "doc", "name": "内容安全与风控规范", "rubric": ["范围写清", "动作有时效", "申诉与回写闭环"], "acceptance": "五节齐全；每档动作都有时限与执行人；申诉有入口与答复时长；词库有维护人与更新周期"}, "practice": {"steps": ["适用范围：管哪些内容（商品标题 / 详情 / 评价 / 直播口播 / 客服话术 / 达人 brief），逐项写明在不在范围内", "词库分层：绝对化用语 / 功效宣称 / 医疗用语 / 价格不实 / 贬低比较 / 低俗与侵权，每层给 2 个真实例子与维护人", "处置动作与时效：自动拦截 / 人工复核 / 放行三档，各自写清触发条件、处理时限与执行人", "误杀与申诉：谁有权临时放行、放行要留什么记录、用户或运营申诉走哪个入口、多久答复", "追责与回写：违规归属怎么判、复盘频率、新出现的玩法多久进词库、谁对词库准确性负责"], "exemplar": "【内容安全与风控规范 · 家纺类目】版本 v1.0　负责人：产品经理　生效日期：11/05　复审：每季度\n\n■ 一、适用范围（逐项列明）\n1. 商品标题与卖点（含主图文字）：在范围内，上线前必过。\n2. 商详页图文与参数表：在范围内，AI 初筛 + 人工终审。\n3. 活动页与优惠券文案：在范围内，上线前必过。\n4. 直播口播脚本：在范围内，但只做上线前脚本审，不做实时审（本期能力不足，见第五节）。\n5. 客服快捷话术：在范围内，季度抽检，不全量审。\n6. 达人 brief 与素材：在范围内，由商务在签订前提交审核，未提交不予结算。\n7. 用户评价内容（UGC）：只做违规词拦截，不做改写，用户原话不改。\n\n■ 二、词库分层（维护人：运营 王工；更新周期：每月一次）\n1. 绝对化用语库：全网最低、最好、第一、国家级、错过再等一年。\n2. 功效宣称库：抗菌率、抑菌、防螨、零甲醛、改善睡眠。→ 需检测报告方可用。\n3. 医疗用语库：治疗、治愈、缓解症状、医用级。→ 一律不允许。\n4. 价格不实库：原价、划线价、清仓价、限时秒杀。→ 需近 30 天成交记录。\n5. 贬低比较类库：比某品牌更、高于同类 N 倍。→ 改为可核对的事实数据。\n6. 低俗与侵权库：涉黄涉暴、他人商标与明星肖像。→ 一律不允许。\n7. 行为类规则（词库拦不住，单列）：站外联系方式、引导加好友、赠品规格未写、名额口径未写。\n\n■ 三、处置动作与时效\n1. 自动拦截：命中第 1/3/5 类词库 → 系统直接拦下，不允许提交；执行人：系统；时效：即时。\n2. 人工复核：命中第 2/4 类，或命中行为类规则 → 转内容审核岗，2 小时内出结论（大促期 4 小时）。\n 执行人：内容审核 李工；复核不通过需回填理由，运营据此改写后重提。\n3. 放行：依据齐全（检测报告编号 + 有效期 + 报告与文案表述一致）→ 审核岗直接放行，留档报告编号。\n\n■ 四、误杀与申诉\n1. 临时放行权：类目运营负责人 1 人 + 内容审核主管 1 人，仅限「依据齐全但词库误命中」的情形。\n2. 放行记录：必须在审核系统填写「放行理由 + 依据文件编号」，无记录视为违规放行。\n3. 申诉入口：运营在审核系统内提交申诉，24 小时内答复；超时未答复默认放行，并计入审核岗考核。\n4. 用户侧申诉：用户举报处理结果有异议，由客服转内容审核，48 小时内答复。\n\n■ 五、追责与回写\n1. 违规归属：文案由谁提交谁负责；审核未拦住由审核岗负责；依据造假由提交人与其主管共同负责。\n2. 复盘：每月一次，统计拦截数、复核通过率、误杀申诉数与平均答复时长四个数。\n3. 词库回写：新出现的违规玩法，从发现到入库不超过 5 个工作日，由运营 王工执行、产品经理验收。\n4. 本期明确不做：直播实时审核（无实时语音识别能力）、UGC 语义改写（不做用户原话改写）。\n 这两项列入下季度评估，本期以人工抽检代替，抽检比例 10%。"}, "task": "产出《内容安全与风控规范》：适用范围：管哪些内容（商品标题 / 详情 / 评价 / 直播口播 / 客服话术 / 达人 brief），逐项写明在不在范围内；词库分层：绝对化用语 / 功效宣称 / 医疗用语 / 价格不实 / 贬低比较 / 低俗与侵权，每层给 2 个真实例子与维护人；处置动作与时效：自动拦截 / 人工复核 / 放行三档，各自写清触发条件、处理时限与执行人；误杀与申诉：谁有权临时放行、放行要留什么记录、用户或运营申诉走哪个入口、多久答复；追责与回写：违规归属怎么判、复盘频率、新出现的玩法多久进词库、谁对词库准确性负责", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M6 电商合规与安全下的 AI 用法」模块，你要交付的是《内容安全与风控规范》。\n【场景】业务侧这周的诉求是：规范的价值不在写得全，在于出事时有人知道下一步找谁。参考做法：一份没写申诉通道的规范，执行三个月后会被运营绕过去。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（五节结构（适用范围 / 词库分层 / 处置动作与时效 / 误杀与申诉 / 追责与回写）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《内容安全与风控规范》填写模板】\n\n■ 1. 适用范围：管哪些内容（商品标题 / 详情 / 评价 / 直播口播 / 客服话术 / 达人 brief），逐项写明在不在范围内\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 词库分层：绝对化用语 / 功效宣称 / 医疗用语 / 价格不实 / 贬低比较 / 低俗与侵权，每层给 2 个真实例子与维护人\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 处置动作与时效：自动拦截 / 人工复核 / 放行三档，各自写清触发条件、处理时限与执行人\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 误杀与申诉：谁有权临时放行、放行要留什么记录、用户或运营申诉走哪个入口、多久答复\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 追责与回写：违规归属怎么判、复盘频率、新出现的玩法多久进词库、谁对词库准确性负责\n   ‣ 提示：每条改进项都要带责任人与时限，否则不算通过。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【内容安全与风控规范 · 家纺类目】版本 v1.0　负责人：产品经理　生效日期：11/05　复审：每季度\n\n■ 一、适用范围（逐项列明）\n1. 商品标题与卖点（含主图文字）：在范围内，上线前必过。\n2. 商详页图文与参数表：在范围内，AI 初筛 + 人工终审。\n3. 活动页与优惠券文案：在范围内，上线前必过。\n4. 直播口播脚本：在范围内，但只做上线前脚本审，不做实时审（本期能力不足，见第五节）。\n5. 客服快捷话术：在范围内，季度抽检，不全量审。\n6. 达人 brief 与素材：在范围内，由商务在签订前提交审核，未提交不予结算。\n7. 用户评价内容（UGC）：只做违规词拦截，不做改写，用户原话不改。\n\n■ 二、词库分层（维护人：运营 王工；更新周期：每月一次）\n1. 绝对化用语库：全网最低、最好、第一、国家级、错过再等一年。\n2. 功效宣称库：抗菌率、抑菌、防螨、零甲醛、改善睡眠。→ 需检测报告方可用。\n3. 医疗用语库：治疗、治愈、缓解症状、医用级。→ 一律不允许。\n4. 价格不实库：原价、划线价、清仓价、限时秒杀。→ 需近 30 天成交记录。\n5. 贬低比较类库：比某品牌更、高于同类 N 倍。→ 改为可核对的事实数据。\n6. 低俗与侵权库：涉黄涉暴、他人商标与明星肖像。→ 一律不允许。\n7. 行为类规则（词库拦不住，单列）：站外联系方式、引导加好友、赠品规格未写、名额口径未写。\n\n■ 三、处置动作与时效\n1. 自动拦截：命中第 1/3/5 类词库 → 系统直接拦下，不允许提交；执行人：系统；时效：即时。\n2. 人工复核：命中第 2/4 类，或命中行为类规则 → 转内容审核岗，2 小时内出结论（大促期 4 小时）。\n 执行人：内容审核 李工；复核不通过需回填理由，运营据此改写后重提。\n3. 放行：依据齐全（检测报告编号 + 有效期 + 报告与文案表述一致）→ 审核岗直接放行，留档报告编号。\n\n■ 四、误杀与申诉\n1. 临时放行权：类目运营负责人 1 人 + 内容审核主管 1 人，仅限「依据齐全但词库误命中」的情形。\n2. 放行记录：必须在审核系统填写「放行理由 + 依据文件编号」，无记录视为违规放行。\n3. 申诉入口：运营在审核系统内提交申诉，24 小时内答复；超时未答复默认放行，并计入审核岗考核。\n4. 用户侧申诉：用户举报处理结果有异议，由客服转内容审核，48 小时内答复。\n\n■ 五、追责与回写\n1. 违规归属：文案由谁提交谁负责；审核未拦住由审核岗负责；依据造假由提交人与其主管共同负责。\n2. 复盘：每月一次，统计拦截数、复核通过率、误杀申诉数与平均答复时长四个数。\n3. 词库回写：新出现的违规玩法，从发现到入库不超过 5 个工作日，由运营 王工执行、产品经理验收。\n4. 本期明确不做：直播实时审核（无实时语音识别能力）、UGC 语义改写（不做用户原话改写）。\n 这两项列入下季度评估，本期以人工抽检代替，抽检比例 10%。", "rubric": ["适用范围逐项列明管不管（含直播口播、客服话术、达人 brief），只写「所有对外内容」按未写计", "三档动作各自写明触发条件、处理时限（小时）与执行岗位，缺时限按未写完计", "必须有误杀与申诉一节：写清谁有权临时放行、留什么记录、申诉入口与答复时长", "词库要有维护人与更新周期，并写一条「新玩法多久内入库」的机制，不写「持续优化」"]}, {"id": "M6U8", "tier": "adv", "step": "spar", "title": "法务挑战你的内容规范", "video": {"dur": "3.2min", "script": ["法务不要求你懂法条，只要求你说清「哪类表述不允许、为什么、谁在管」", "挑战清单：依据 / 覆盖 / 误杀处置 / 词库维护", "「你这条规范依据是什么？别给我条文，告诉我哪类表述不允许、为什么」"]}, "ppt": {"method": "挑战清单：依据 / 覆盖 / 误杀处置 / 词库维护", "case": "「你这条规范依据是什么？别给我条文，告诉我哪类表述不允许、为什么」", "demo": "陪练对话界面说明（把规范粘进系统提示词，让对手按你的词库逐条找漏洞）"}, "objective": "能在法务 4 轮追问下，说清规范依据、覆盖范围、误杀处置与词库维护机制，且不越权下法律结论", "transfer": "把陪练里法务点出的两个覆盖漏洞补进规范，再请他签字确认本期版本", "vslides": [{"t": "陪练说明：他要的是依据，不是条文", "n": "法务和合规官不一样：合规官问「你能不能证明」，法务问「你凭什么这么定」。所以「我们参照了相关法律法规」这句话在他那里是负分——既没信息量，又像在装懂。正确的答法是把依据落在事实上：过去 12 个月被平台驳回 47 次、被投诉 19 起，按原因分组之后，前三类就是词库的前三层。这样你说的每一句都能追到一个案例编号，他就有得判断了。他的四个问题是：依据是什么、覆盖全没全、误杀了怎么办、词库谁维护。这四个问题其实是在检查同一件事——这份规范是「照着业务长出来的」，还是「网上抄的模板」。抄的模板一问就露：覆盖永远写「所有对外内容」，申诉永远写「按规定处理」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他的四问</tspan></text><g data-k=\"依据是什么\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">依据是什</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">么</tspan></text></g><g data-k=\"覆盖全没全\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">覆盖全没</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">全</tspan></text></g><g data-k=\"误杀怎么办\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">误杀怎么</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">办</tspan></text></g><g data-k=\"词库谁维护\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">词库谁维</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">护</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 61.42}, {"t": "覆盖要问到边界，边界要自己交出来", "n": "第二问是四问里最容易翻车的。「所有对外内容」这种答法，他会立刻追问直播口播算不算、客服话术算不算、达人 brief 算不算、用户评价算不算。这四项的答案本来就不一样：口播是实时流，本期大概率只能做脚本审；客服话术量大，只能抽检；达人 brief 归商务提审，是个利益冲突环节；用户评价是 UGC，只能拦违规词、不能改写。主动把这些说清，比等他问出来好得多。策略是：把「覆盖」答成一张清单，每项写审核方式与强度，再把其中做不到的两项主动交出来，问他要不要设成硬闸门。这不是示弱——法务最怕的是「看起来全覆盖」的规范，因为那种规范出事时没人兜底。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 口播：脚本审，非实时\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 口播：脚本审，非实时</tspan></text></g><g data-k=\"② 客服话术：季度抽检\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 客服话术：季度抽检</tspan></text></g><g data-k=\"③ 达人 brief：商务提审（有冲突）\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 达人 brief：商务提审（有冲突）</tspan></text></g><g data-k=\"④ UGC：只拦词，不改写\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ UGC：只拦词，不改写</tspan></text></g></svg>", "d": 61.9}, {"t": "兜底与维护：让规范能活下去", "n": "后两问考的是这份规范能不能活过三个月。误杀处置要有四件：谁有权放行（具体到岗位，最好两个人）、放行留什么痕（理由 + 依据编号）、申诉走哪个入口、多久答复（写死小时数，超时默认放行）。第四件最容易被省，但没有时限的申诉等于没有申诉。词库维护要给到人和周期：谁维护、多久更一次、新玩法几日内入库。再补一句本期明确不做什么——这句话在法务眼里是加分项，因为它说明你知道自己的边界在哪。最后一条纪律要自己守住：不要用「已通过法务审核」当挡箭牌去推动有风险的玩法，那句话一旦说出口，后面所有判断的责任就都转移了，而转移出去的责任，会在出事时原样回来。这也是我在规范第一页写清「本期不做什么」的原因——把边界写在纸上，比事后解释省力得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"放行权到岗位（两人）\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">放行权到岗位（两人）</tspan></text></g><g data-k=\"留痕：理由 + 依据编号\"><g><circle cx=\"30\" cy=\"80\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 80 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"84.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">留痕：理由 + 依据编号</tspan></text></g><g data-k=\"申诉时限（超时默认放行）\"><g><circle cx=\"30\" cy=\"108\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 108 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"113.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">申诉时限（超时默认放行）</tspan></text></g><g data-k=\"词库维护人与周期\"><g><circle cx=\"30\" cy=\"137\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 137 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"141.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">词库维护人与周期</tspan></text></g><g data-k=\"本期明确不做什么\"><g><circle cx=\"30\" cy=\"165\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 165 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"170.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">本期明确不做什么</tspan></text></g></svg>", "d": 69.62}], "deliverable": {"type": "doc", "name": "内容安全与风控规范", "rubric": ["依据可追溯", "覆盖到边界", "兜底与维护落地"], "acceptance": "四问都能给出可追溯的依据、覆盖清单、放行与申诉机制、词库维护人与周期，并主动交出已知漏洞"}, "spar": {"role": "法务", "persona": "不要求 PM 懂法条，只讨厌两点：拿条文装懂，和把「已审核」当挡箭牌；他的问题永远指向「依据、覆盖、兜底、维护」四件事", "mustAsk": ["你这条规范的依据是什么？别给我条文，告诉我哪类表述不允许、为什么", "覆盖全了吗？直播口播、客服话术、达人 brief、用户评价在不在里面？", "误杀了怎么办？谁有权放行，放行留痕吗，运营申诉找谁、多久答复？", "词库谁维护、多久更新一次？出现新玩法，多久能进库？"]}, "exemplar": "（问：你这条规范依据是什么？别给我条文，告诉我哪类表述不允许、为什么。）\n\n结论：三类表述不允许、两类附条件可用。不允许的是医疗用语（治疗、治愈、医用级）、绝对化承诺（全网最低、国家级、错过再等一年）、贬低同行（比某品牌更耐用 3 倍）；附条件的是功效宣称（抗菌率、防螨，需检测报告）与价格表述（原价、清仓价，需近 30 天成交记录）。\n依据：不是法条，是我们近 12 个月被平台驳回与被投诉的实际记录——驳回原因里出现最多的是这三类，共 47 次；投诉集中在「抗菌率」与「原价」两类，共 19 起。我把这些记录按原因分了组，词库就是照这个分组建的，每一条都能追到具体案例编号。\n边界：我能说清「哪类表述过去出过问题」，说不清「这类表述在法律上是否一定不允许」——这是你的判断。另外有两处我主动交出来：一是直播口播本期只做脚本审、不做实时审，这是个已知漏洞；二是达人 brief 由商务提审，商务有动力放水，这个环节我没有制约手段。这两处要不要设成硬闸门，需要你定。", "task": "把《内容安全与风控规范》拿到「法务」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《内容安全与风控规范》。现在要让它通过「法务」这一关。\n【对手的立场】不要求 PM 懂法条，只讨厌两点：拿条文装懂，和把「已审核」当挡箭牌；他的问题永远指向「依据、覆盖、兜底、维护」四件事。\n【他一定会追问】「你这条规范的依据是什么？别给我条文，告诉我哪类表述不允许、为什么」 / 「覆盖全了吗？直播口播、客服话术、达人 brief、用户评价在不在里面？」 / 「误杀了怎么办？谁有权放行，放行留痕吗，运营申诉找谁、多久答复？」\n【场景】你说「法务挑战你的内容规范」，对方立刻回一句：你这条规范的依据是什么？别给我条文，告诉我哪类表述不允许、为什么 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["依据用「过去出过什么问题 + 记录在哪」来说，不引具体条文编号，也不写「符合法律法规」这类空话", "覆盖回答要逐项点名（直播口播 / 客服话术 / 达人 brief / 用户评价），并说明每一项的审核方式与强度", "误杀处置写清放行权归属、留痕内容、申诉入口与答复时长，缺答复时长按未答计", "词库维护给到人与周期，并给出新玩法的入库时限；主动指出自己规范里的已知漏洞"]}]}, {"id": "M7", "title": "M7 综合实战：从 0 到 1 设计一款零售电商产品", "dims": ["product", "workflow", "analysis"], "units": [{"id": "M7U1", "tier": "basic", "step": "understand", "title": "立项：机会与合规双校验", "video": {"dur": "3.2min", "script": ["立项错一次，后面所有聪明都白搭；而最常见的错，是只校验了机会没校验合规", "机会三问（真痛 / 够多 / 能做出差异）+ 合规四查（数据 / 出域 / 内容 / 模式）+ 四象限决策", "「用订单数据做人群包卖给品牌方」机会成立，但模式本身不可行，属于第二象限"]}, "ppt": {"method": "机会三问（真痛 / 够多 / 能做出差异）+ 合规四查（数据 / 出域 / 内容 / 模式）+ 四象限决策", "case": "「用订单数据做人群包卖给品牌方」机会成立，但模式本身不可行，属于第二象限", "demo": "同一个想法在四个象限里的四种结论：做、改、不做、放弃"}, "objective": "能用机会成立与合规可行两个维度，把一个想法判进四个象限之一，并说出对应动作", "transfer": "把手头正在推的一个想法画进四象限，把「机会成立但合规不可行」的那一项标出来", "vslides": [{"t": "机会成立的三个条件", "n": "一个想法值得立项，要同时满足三个条件，缺一个都不成立。第一，有人真的痛：不是「可能会用」，是已经在用笨办法解决——客服每天手工回答尺码问题、运营每天手工导表算毛利，这种才是真痛。第二，痛的人够多且能触达：一百个人的痛做不成生意，除非你能低成本找到那一百个人。第三，我们能做出差异：这件事别人做不了、或做得没我们好，理由可以是数据、供应链、履约能力，但不能是「我们更努力」。三问里最容易糊弄的是第三问，因为「我们服务更好」听起来永远成立，实际上等于什么都没说。判断方法很土：如果你的差异点竞争对手明天就能抄走，那它不算差异，只算投入。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 有人真的痛（已经在用笨办法）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 有人真的痛（已经在用笨办法）</tspan></text></g><g data-k=\"② 痛的人够多且能触达\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 痛的人够多且能触达</tspan></text></g><g data-k=\"③ 我们能做出差异（且抄不走）\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 我们能做出差异（且抄不走）</tspan></text></g></svg>", "d": 61.18}, {"t": "合规四查：立项时最容易跳过的一关", "n": "合规不是上线前才做的一道手续，它有四项在立项阶段就必须过。第一查数据从哪来：这个想法依赖的数据，我们有吗、有使用权吗、拿得到吗——很多想法死在这一查，因为它假设了一份不存在的用户数据。第二查能不能出域：要用外部模型，就得先判这四档数据能不能发出去。第三查内容会不会踩线：涉及功效、价格、医疗表述的，从第一天就要按词库设计，而不是写完再改。第四查模式本身合不合规：这一查最容易被忽略，因为它跟技术无关——比如把订单数据做成人群包对外售卖，技术上完全可行，模式上立不住。四查的顺序不能换，因为越往后改动成本越高：数据没有可以换数据源，模式不行只能换想法。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合规四查</tspan></text><g data-k=\"数据从哪来\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">数据从哪来</tspan></text></g><g data-k=\"能不能出域\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">能不能出域</tspan></text></g><g data-k=\"内容会不会踩线\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">内容会不会踩线</tspan></text></g><g data-k=\"模式本身合规吗\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">模式本身合规吗</tspan></text></g></svg>", "d": 65.11}, {"t": "四象限：最危险的是「机会成立但合规不可行」", "n": "把机会和合规各画一条轴，得到四个象限。机会成立 + 合规可行：立项，按正常流程走。机会成立 + 合规不可行：改模式，这是最难也最值钱的一格——因为它有数据支持，团队都想做，只有你看到那条红线；改模式的方向通常是换数据源、换交付形态（卖洞察不卖明细）、换对象（对内不对外）。机会不成立 + 合规可行：不做，这一格最好判断，也最容易被老板的偏好推翻。两边都不成立：放弃。最危险的不是第四象限，是第二象限，因为它的否决成本最高——你说「不能做」，别人会说「数据都在，为什么不能做」。所以第二象限的结论不能只说「不行」，必须给出改模式的具体路径，把「不行」变成「这样才行」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四象限决策</tspan></text><g data-k=\"机会成立 + 合规可行 → 立项\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"78.0\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">机会成立 +</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\"> 合规可行</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">→ 立项</tspan></text></g><g data-k=\"机会成立 + 合规不可行 → 改模式\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"78.8\" font-size=\"12.2\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">机会成立 +</tspan><tspan x=\"152.8\" dy=\"15.86\">合规不可行</tspan><tspan x=\"152.8\" dy=\"15.86\"> → 改模式</tspan></text></g><g data-k=\"机会不成立 → 不做\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">机会不成</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">立 → 不做</tspan></text></g><g data-k=\"都不成立 → 放弃\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">都不成立 →</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\"> 放弃</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 66.91}], "deliverable": {"type": "doc", "name": "立项双校验结论", "rubric": ["三问有据", "四查不跳", "象限与动作对应"], "acceptance": "能对三个想法各自给出机会三问与合规四查的结论，并落进四象限、写出对应动作"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】机会三问（真痛 / 够多 / 能做出差异）+ 合规四查（数据 / 出域 / 内容 / 模式）+ 四象限决策\n【为什么重要】立项错一次，后面所有聪明都白搭；而最常见的错，是只校验了机会没校验合规\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["机会三问每问都要给依据（谁痛、多少人、我们凭什么做出差异），只写「市场很大」不计分", "合规四查逐项过（数据从哪来 / 能不能出域 / 内容会不会踩线 / 模式本身合不合规），跳项按未做完计", "结论必须落进四象限之一，并写出对应动作（做 / 改模式 / 不做 / 放弃）", "对「机会成立但合规不可行」要给出改模式的具体方向，不能只写「有合规风险，暂缓」"]}, {"id": "M7U2", "tier": "basic", "step": "demo", "title": "用 AI 跑通竞品与机会扫描", "video": {"dur": "3.5min", "script": ["机会清单最容易变成愿望清单，区别只在于每条后面有没有可验证的下一步", "依据分级（公开可核 / 内部数据 / 第三方报告 / 无来源）+ 三档机会判定 + 下一步验证动作", "「达人直播说除螨率 99%」不是机会，是合规风险；「尺码咨询占工单 31%」才是机会"]}, "ppt": {"method": "依据分级（公开可核 / 内部数据 / 第三方报告 / 无来源）+ 三档机会判定 + 下一步验证动作", "case": "「达人直播说除螨率 99%」不是机会，是合规风险；「尺码咨询占工单 31%」才是机会", "demo": "WorkBuddy 内跑一遍：先判依据与机会，再让模型出机会清单，最后自己核数据来源"}, "objective": "能把 8 条竞品与市场信号判成机会成立/需验证/不成立，并标出依据类型与下一步验证动作", "transfer": "把这批信号里判为「需验证」的三条排进下周的用户访谈提纲", "vslides": [{"t": "演示准备：8 条信号里只有 2 条是真机会", "n": "这 8 条信号来自不同地方：竞品页面、评价原文、行业报告、客服工单、小红书笔记、管理层口述。它们混在一起看，每条都像机会；按依据分级看，只有 2 条站得住。竞品物流差评占 22%，这是能抓数据核实的；客服工单里尺码咨询占 31%、退货第一位是尺码，这是我们自己的数据，最硬。剩下三条要先验证：行业报告的渗透率要先核口径，小红书的收纳痛要先确认有没有购买意向，竞品降价要先判断是不是清库存。还有三条根本不是机会：达人直播说的除螨率是合规风险，管理层提的工厂直供没有数据，加购未付的催付短信——用户 62% 自己就下单了，打扰成本高于收益。你要做的是逐条判依据、判机会，并给每条一个能执行的下一步。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"8 条：竞品页 / 评价 / 报告 / 工单 / 笔记 / 口述\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条：竞品页 / 评价 / 报告 / 工单 / 笔记 / 口述</tspan></text></g><g data-k=\"真机会 2 条：物流差评、尺码咨询\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">真机会 2 条：物流差评、尺码咨询</tspan></text></g><g data-k=\"需验证 3 条 · 不成立 3 条\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">需验证 3 条 · 不成立 3 条</tspan></text></g></svg>", "d": 72.12}, {"t": "依据分级：把「听说」和「可核」分开", "n": "依据分四级，级别决定了这条信号能承多重。第一级公开页面可核：竞品主图、价格、评价原文，你自己去翻就能验证，最硬也最容易过期。第二级内部数据：工单、退货原因、加购转化，别人拿不到，最有差异化，但要小心口径——客服工单里的「尺码咨询」是按什么分的类，如果分类是人手工打的，31% 这个数就要打折。第三级第三方报告：最容易被误用，因为报告的数字看起来最权威，但你不核样本量和口径就引用，评审会上被问一句就塌。第四级无来源口头信息：达人说的、同事听说的、群里转的，这一级只能当「待验证的线索」，不能进机会清单。分级不是为了严谨好看，是为了让你知道哪条能今天拍、哪条要先去查。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">依据强度</tspan></text><g data-k=\"公开页面可核\"><text x=\"24.0\" y=\"61.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">公开页面可核</tspan></text><rect x=\"150\" y=\"51\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"51\" width=\"210.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"352.0\" y=\"64\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">最硬·易过期</text></g></g><g data-k=\"内部数据\"><text x=\"24.0\" y=\"101.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">内部数据</tspan></text><rect x=\"150\" y=\"91\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"91\" width=\"168.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"310.0\" y=\"104\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">最差异化·防口径</text></g></g><g data-k=\"第三方报告\"><text x=\"24.0\" y=\"141.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">第三方报告</tspan></text><rect x=\"150\" y=\"131\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"131\" width=\"94.5\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"236.5\" y=\"144\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">需核口径</text></g></g><g data-k=\"无来源口述\"><text x=\"24.0\" y=\"181.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">无来源口述</tspan></text><rect x=\"150\" y=\"171\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"171\" width=\"37.8\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"179.8\" y=\"184\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">只当线索</text></g></g></svg>", "d": 70.06}, {"t": "下一步动作：机会清单的每条后面都要有它", "n": "一份机会清单和一个愿望清单的区别，只在每条后面有没有可执行的下一步。下一步有三种：抓数据量化（去抓 3 家竞品近 90 天物流差评占比，7 天出表）、用户访谈（抽 20 条评论做访谈，确认是收纳痛还是内容好看）、小范围灰度（尺码助手先上 5% 流量，2 周看咨询降幅）。三种的适用场景不同：已有数据雏形用抓数据，只有情绪表达用访谈，方案清晰但效果不确定用灰度。写下一步时一定要带时间和数量，写「进一步调研」等于没写。还有一条纪律：不要在一张清单里混放「机会」和「风险」。达人直播那个除螨率，是我们的合规风险提示，把它塞进机会清单会让整份材料失焦——分开列，各自去找各自的负责人。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三种下一步</tspan></text><g data-k=\"抓数据量化：有雏形\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">抓数据量化：有</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">雏形</tspan></text></g><g data-k=\"用户访谈：只有情绪\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">用户访谈：只有</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">情绪</tspan></text></g><g data-k=\"小范围灰度：方案清晰\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">小范围灰度：方</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">案清晰</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 67.63}], "deliverable": {"type": "sheet", "name": "竞品与机会清单", "rubric": ["依据标清", "判定不吹", "下一步可执行"], "acceptance": "8 条信号都有依据类型、机会判定与下一步动作；无来源的一律不进机会清单"}, "demo": {"ref": "■ 信号判定（8 条）\n\nS01｜竞品主图打「72 小时发货」，近 30 天物流类差评占 22% → 评价原文可核 / 机会成立\n　下一步：抓 3 家竞品近 90 天物流差评占比，7 天内出对比表。\n\nS02｜达人直播口播「除螨率 99%」，详情页无检测报告 → 无来源口头信息 / 不成立\n　下一步：转合规评估——这是我们的合规风险提示，不是机会。\n\nS03｜行业报告：家纺线上渗透率 32%，年增 4 个点 → 第三方报告（需查口径）/ 需验证\n　下一步：核口径后再引用（样本量 / 统计范围 / 年份），核不出来就不进机会清单。\n\nS04｜客服工单：尺码咨询占 31%，退货原因第一位是尺码 → 内部数据 / 机会成立\n　下一步：小范围灰度测试尺码助手，2 周看咨询量降幅。\n\nS05｜小红书笔记「四件套收纳麻烦」点赞 2.3 万，评论无购买意向 → 公开页面可核 / 需验证\n　下一步：抽 20 条评论做访谈，确认是「收纳痛」还是「内容好看」。\n\nS06｜竞品同款降价 30%，我方价格高出 45% → 公开页面可核 / 需验证\n　下一步：抓 30 天价格与销量曲线，判断是否清库存行为。\n\nS07｜「做自有工厂直供」（管理层提出），无任何数据支撑 → 无来源口头信息 / 不成立\n　下一步：放弃——建厂与备货成本远高于本期收益，除非有履约数据支撑。\n\nS08｜内部数据：加购未付用户 62% 在 24 小时内自行下单 → 内部数据 / 不成立\n　下一步：放弃催付短信——用户本就会买，打扰成本高于收益。\n\n■ 结论：机会成立 2 条、需验证 3 条、不成立 3 条。\n■ 建议：据测算家纺线上市场明年将达 4800 亿，建议全面加大投入抢占份额。", "fix": ["「明年将达 4800 亿，建议全面加大投入」整句删掉——编造的市场规模是最容易被当场问穿的一句话", "S03 引用渗透率前必须先核口径（样本量/统计范围/年份），否则这个数字在评审会上等于没有", "S02 判「不成立」要写清它是「合规风险提示」而不是「机会」，两件事不能混在一张清单里", "S06 只写「竞品降价」不够，要补一句判断依据（是否清库存：看降价后销量是否放大、是否伴随断码）"], "judge": "判断依据：依据类型有没有标错（把达人说法当公开数据）；无来源的有没有被判成机会成立；「机会成立」的三条有没有可执行的下一步；有没有编造市场规模或竞品内部数据", "sheet": {"situ": "立项前要做一轮机会扫描。你手上有 8 条信号，来源各不相同：竞品页面截图、评价原文、一份行业报告、客服工单、小红书笔记、还有两条是开会时听来的。它们混在一起看每条都像机会，但真正能拿去做立项的没几条。", "ask": "① 8 条信号逐条标依据类型、判机会成立度、给下一步动作；② 用你的表请 AI 出机会清单；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 判定每条的依据类型；② 判成机会成立 / 需验证 / 不成立并给理由；③ 给出下一步验证动作、周期与判断标准；④ 指出哪几条其实是合规风险而不是机会。\n禁止编造市场规模、增速或竞品内部数据。", "mats": [{"id": "S01", "src": "竞品页面 + 评价原文", "text": "竞品 A 主图打「72 小时发货」标识。\n近 30 天该商品评价里，物流类差评占 22%（共 186 条评价）。"}, {"id": "S02", "src": "达人直播口播", "text": "某达人在直播里说「这款四件套除螨率 99%，过敏体质闭眼入」。\n（详情页未附检测报告，页面也未标注检测机构）"}, {"id": "S03", "src": "行业报告 · 第 12 页", "text": "「家纺品类线上渗透率 32%，较去年提升 4 个百分点。」\n（报告未标注样本量、统计范围与调研年份）"}, {"id": "S04", "src": "客服工单 · 内部", "text": "近 90 天工单：尺码类咨询占 31%，为第一位。\n退货原因第一位为「尺码不合适」，占退货量的 28%。"}, {"id": "S05", "src": "小红书笔记", "text": "笔记「四件套收纳太麻烦」点赞 2.3 万，收藏 8,400。\n评论区 120 条，无一条提及购买链接或购买意向。"}, {"id": "S06", "src": "竞品价格页", "text": "竞品 B 同款四件套从 519 降至 359，降幅 30%。\n我方同款售价 529，高出 45%。"}, {"id": "S07", "src": "管理层会议口述", "text": "「我们应该做自有工厂直供，把中间环节砍掉。」\n（无成本测算、无履约数据、无供应商评估）"}, {"id": "S08", "src": "内部数据 · 加购转化", "text": "加购未支付用户中，62% 在 24 小时内自行完成下单。\n（来源：埋点事件 add_cart 与 pay_success，9 月全月）"}], "cols": [{"k": "ev", "name": "依据类型", "hint": "能自己去核的才算可核", "type": "chips", "w": 3, "tags": ["公开页面可核", "评价原文可核", "内部数据", "第三方报告（需查口径）", "无来源口头信息"]}, {"k": "op", "name": "机会判定", "hint": "机会成立 / 需验证 / 不成立", "type": "chips", "w": 2, "tags": ["机会成立", "需验证", "不成立"]}, {"k": "nx", "name": "下一步动作", "hint": "选一个能在两周内做完的", "type": "chips", "w": 3, "tags": ["抓公开数据量化", "做用户访谈", "小范围灰度测试", "核口径后再引用", "放弃：成本高于收益", "放弃：已有替代方案", "转合规评估（不是机会）"]}], "key": {"S01": {"ev": "评价原文可核", "op": "机会成立", "nx": "抓公开数据量化"}, "S02": {"ev": "无来源口头信息", "op": "不成立", "nx": "转合规评估（不是机会）"}, "S03": {"ev": "第三方报告（需查口径）", "op": "需验证", "nx": "核口径后再引用"}, "S04": {"ev": "内部数据", "op": "机会成立", "nx": "小范围灰度测试"}, "S05": {"ev": "公开页面可核", "op": "需验证", "nx": "做用户访谈"}, "S06": {"ev": "公开页面可核", "op": "需验证", "nx": "抓公开数据量化"}, "S07": {"ev": "无来源口头信息", "op": "不成立", "nx": "放弃：成本高于收益"}, "S08": {"ev": "内部数据", "op": "不成立", "nx": "放弃：已有替代方案"}}, "notes": {"S02·op": "达人说的除螨率既无可核依据，也不该是我们跟进的方向——它首先是我们的合规风险提示，不是机会；混进机会清单会让整份材料失焦", "S03·op": "不标的渗透率不能直接引用；报告没写样本量、统计范围、调研年份，这三个口径核不出来，这个数字在评审会上等于没有", "S05·op": "2.3 万点赞说明内容好看，但评论里没有购买意向，只能判需验证——去访谈确认是「收纳痛」还是「内容好看」，这是两门完全不同的生意", "S08·op": "62% 的用户自己就会下单，说明「用户忘了买」这个假设不成立；催付短信的打扰成本高于收益，这类信号最常见的误判是把它当成一个待做需求", "S07·op": "口述方向没有成本测算与履约数据，只能判不成立；判「需验证」会让你被迫去做一轮注定算不过账的调研", "S01·ev": "竞品主图与评价原文都能自己去翻，属可核级别里最硬的一档，缺点是会过期，所以下一步是抓 90 天数据做表，而不是直接立项"}, "delta": [{"op": "删", "frm": "模型结尾的「据测算家纺线上市场明年将达 4800 亿，建议全面加大投入抢占份额」", "to": "整句删除", "why": "编造的市场规模是最容易被当场问穿的一句话，而且一旦被问穿，前面所有判断都会被怀疑", "kw": ["4800", "亿", "市场规模", "测算", "抢占"]}, {"op": "改", "frm": "S03 直接引用「线上渗透率 32%」作为机会依据", "to": "改为「待核口径」：先确认样本量、统计范围与调研年份，核不出来就不进机会清单", "why": "第三方数字看着最权威，但口径不清的数字比没有数字更危险", "kw": ["口径", "样本", "年份", "统计范围", "待核"]}, {"op": "改", "frm": "S02 判「不成立」后不再处理", "to": "补一句「转合规评估」：这是我们自己的合规风险提示，要单独列，不进机会清单", "why": "机会清单和风险清单必须分开，混在一起两边都没人负责", "kw": ["合规", "风险提示", "单独", "分开"]}, {"op": "补", "frm": "（模型没写）", "to": "每条「机会成立」补上验证周期与判断标准（如「7 天出表，差评占比高于 15% 才算机会成立」）", "why": "没有判断标准的机会，验证完之后还是各说各话", "kw": ["判断标准", "周期", "7 天", "才算", "阈值"]}], "refsheet": "S01｜评价原文可核｜机会成立｜抓公开数据量化\nS02｜无来源口头信息｜不成立｜转合规评估（不是机会）\nS03｜第三方报告（需查口径）｜需验证｜核口径后再引用\nS04｜内部数据｜机会成立｜小范围灰度测试\nS05｜公开页面可核｜需验证｜做用户访谈\nS06｜公开页面可核｜需验证｜抓公开数据量化\nS07｜无来源口头信息｜不成立｜放弃：成本高于收益\nS08｜内部数据｜不成立｜放弃：已有替代方案\n\n四处最容易判错的：\n· S02 不是机会，是合规风险提示——两件事必须分开列。\n· S05 高赞不等于有需求：评论里没有购买意向，只能判需验证。\n· S08 的 62% 说明「用户忘了买」这个假设不成立，别把它做成需求。\n· S01 是最硬的一条，但它会过期，所以下一步是抓 90 天数据，不是直接立项。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」本周收集到的 8 条竞品与市场信号（原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条的依据类型；② 判成机会成立 / 需验证 / 不成立并给理由；③ 给出下一步验证动作与验证周期；④ 指出哪几条其实是合规风险而不是机会。\n禁止编造市场规模、增速或竞品内部数据。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】依据分级（公开可核 / 内部数据 / 第三方报告 / 无来源）+ 三档机会判定 + 下一步验证动作\n【参考案例】「达人直播说除螨率 99%」不是机会，是合规风险；「尺码咨询占工单 31%」才是机会\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」本周收集到的 8 条竞品与市场信号（原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条的依据类型；② 判成机会成立 / 需验证 / 不成立并给理由；③ 给出下一步验证动作与验证周期；④ 指出哪几条其实是合规风险而不是机会。\n禁止编造市场规模、增速或竞品内部数据。", "rubric": ["每条信号标注依据类型（公开页面可核 / 内部数据 / 第三方报告 / 无来源口头信息），缺标按未做完计", "无来源口头信息不得判为「机会成立」，最多判「需验证」，并写明去查什么", "判为「机会成立」的至少给一个可执行的下一步（抓数据量化 / 访谈 / 灰度测试）", "第三方报告必须写明要核的口径（样本、口径定义、时间范围），直接引用数字不计分"]}, {"id": "M7U3", "tier": "basic", "step": "todo", "title": "产出《产品立项书（含合规）》", "video": {"dur": "3.5min", "script": ["立项书不是写给自己的，是写给要给你资源的人看的", "六段结构（机会 / 方案与差异 / 指标与验证 / 合规 / 不做清单 / 里程碑与投入）", "一份没有「不做清单」的立项书，会在第一次评审就被问「那你还做什么」"]}, "ppt": {"method": "六段结构（机会 / 方案与差异 / 指标与验证 / 合规 / 不做清单 / 里程碑与投入）", "case": "一份没有「不做清单」的立项书，会在第一次评审就被问「那你还做什么」", "demo": "立项书骨架 + 一份填到指标口径与合规动作的样例"}, "objective": "能产出一份含合规章节的产品立项书，写清机会、模式、指标、合规与不做清单", "transfer": "用这份立项书去和至少两个部门对一遍，把他们对「不做清单」的意见记下来", "vslides": [{"t": "任务说明：立项书要能回答「凭什么给你资源」", "n": "立项书不是给自己理思路的，是给要给你资源的人看的。所以他们只关心四件事：这个机会是真的吗、你凭什么做得成、要花多少、什么时候能看到结果。六段结构就是照这四件事排的。机会段最容易写虚，「市场空间巨大」这种话没有任何信息量，要写「近 90 天 4.2 万单里首次购买占 63%，工单中尺码类 31%」——有分母、有时间范围、有来源。指标段最容易漏口径，写「提升转化率」不算，要写分子分母和统计周期，否则做完之后谁都能说自己赢了。合规段最容易被整段省略，但这一节恰恰是评审委员会最可能一票否决的地方。不做清单最少人写，但它最能说明你想清楚了。写的时候按「谁要看这份文件」排顺序：评审委员会先看第二节与第六节，技术与运营会最先翻第四节，而第一节的数字会被反复引用，所以每个数都要能追到表名与时间范围。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六段结构</tspan></text><g data-k=\"机会\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">机会</tspan></text></g><g data-k=\"方案与差异\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">方案与差异</tspan></text></g><g data-k=\"指标与验证\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">指标与验证</tspan></text></g><g data-k=\"合规\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">合规</tspan></text></g><g data-k=\"不做清单\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">不做清单</tspan></text></g><g data-k=\"里程碑与投入\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">里程碑与投入</tspan></text></g></svg>", "d": 82.75}, {"t": "指标与验证：把结论标准提前写死", "n": "指标段有三样东西不能少：北极星指标、护栏指标、结论标准。北极星只选一个，选那个「如果它涨了，说明这件事成了」的指标——尺码助手的北极星是尺码类工单率，不是转化率，因为转化率受价格和流量影响太大，证明不了是这个组件起的作用。护栏指标至少一个，用来防「赢了指标输了体验」：工单降了但退货率升了，那就是把问题从客服挪到了售后。结论标准最容易漏，也最要命：达到什么程度放量、没达到怎么办，必须在开跑前写死。不提前写，结果出来那天就会按心情解读，实验白跑。写结论标准还有一个附带好处：评审时委员会看到你有明确的下车条件，给资源的意愿会高很多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 北极星：一个，与这件事直接相关\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 北极星：一个，与这件事直接相关</tspan></text></g><g data-k=\"② 护栏：至少一个，防赢了指标输体验\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 护栏：至少一个，防赢了指标输体验</tspan></text></g><g data-k=\"③ 结论标准：达到什么放量、没达到怎么办\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 结论标准：达到什么放量、没达到怎么办</tspan></text></g></svg>", "d": 63.1}, {"t": "不做清单：这一节最能证明你想清楚了", "n": "大多数人写立项书会省掉不做清单，觉得写了显得格局小。恰恰相反：一份没有「不做」的立项书，评审时第一个问题就是「那你还做什么」，第二个问题是「你的边界在哪」。不做清单要写具体，写「本期不做 AI 拍照识别床垫尺寸，因为识别准确率不足以支撑推荐，误判成本由我们承担」，而不是「视资源情况再定」。四条左右最合适，覆盖三种类型：技术上做不好的、范围上会混淆变量的、合规上过不去的。第三种尤其要写——比如「不做用户尺寸档案，涉及长期留存个人信息，本期无合规方案」，这一条会让评审委员会的人立刻信任你，因为它说明你在立项阶段就把合规当约束，而不是当手续。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"技术上做不好的（写清为什么）\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">技术上做不好的（写清为什么）</tspan></text></g><g data-k=\"范围上会混淆变量的\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">范围上会混淆变量的</tspan></text></g><g data-k=\"合规上过不去的（本期无方案）\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">合规上过不去的（本期无方案）</tspan></text></g><g data-k=\"不做 ≠ 以后不做，写清触发条件\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不做 ≠ 以后不做，写清触发条件</tspan></text></g></svg>", "d": 63.89}], "deliverable": {"type": "doc", "name": "产品立项书（含合规）", "rubric": ["机会有据", "指标可验", "合规与不做清单"], "acceptance": "六段齐全；指标有口径与验证方式；合规四项逐条写；不做清单≥3 条；里程碑含卡点与签字人"}, "practice": {"steps": ["机会：谁痛、痛在哪、现在怎么解决的、痛的人有多少（
