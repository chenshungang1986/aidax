. 文案与表达：同一卖点出多版表达、按「痛点—证据—利益」排序。上线前须过广告法词表。\n3. 会议纪要与待办转写：内部会议录音转文字后整理。录音不外传，只传文字。\n4. 取数逻辑：用自然语言描述口径，让 AI 写 SQL 骨架。执行必须在数仓内，AI 不接触数据行。\n\n■ 三、脱敏与复核动作\n1. 脱敏三步：删身份字段 → 保结构字段 → 提示词写明「不得索取或推断个人信息」。\n2. 复核人：文案类由法务复核禁用词；数据类由数据合规复核口径；对外材料由部门负责人签字。\n3. 不通过怎么退回：复核意见写进同一份文档的批注，修改后重新走一遍，不口头放行。\n\n■ 四、留痕与问责\n1. 留痕：每次分析的脱敏前后样本存 `产品部/AI使用记录/YYYY-MM`，保留 6 个月。\n2. 回滚：发现对外材料含未脱敏信息，2 小时内下架并同步渠道；24 小时内出书面说明。\n3. 问责：直接操作人为第一责任人，复核人为第二责任人；owner：产品部负责人。\n4. 复核节奏：每月抽查 5 份记录，抽查结果进部门月度复盘。"}, "task": "产出《部门 AI 使用规范草稿》：先写禁止清单：列出三类绝对不能贴的数据字段；再写允许清单：列出三类可以直接用 AI 的低风险场景；写复核动作：哪些输出必须人复核、复核人是谁、不通过怎么退回；写问责与留痕：事故怎么追溯、记录存哪里、多久内回滚", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M0 导论：零售电商 PM 的 AI 机会与红线」模块，你要交付的是《部门 AI 使用规范草稿》。\n【场景】业务侧这周的诉求是：没有明文规范的团队，风险由最不谨慎的那个人决定。参考做法：某电商中台的 AI 使用规范（一页纸，贴在工位旁）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（规范草案四段式（允许清单 / 禁止清单 / 复核动作 / 问责与留痕）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《部门 AI 使用规范草稿》填写模板】\n\n■ 1. 先写禁止清单：列出三类绝对不能贴的数据字段\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 再写允许清单：列出三类可以直接用 AI 的低风险场景\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写复核动作：哪些输出必须人复核、复核人是谁、不通过怎么退回\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 写问责与留痕：事故怎么追溯、记录存哪里、多久内回滚\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【模拟电商品牌 Y 产品部 · AI 使用规范（草稿 v0.1）】拟稿：产品经理　评审：合规/法务/数据　生效：待评审通过\n\n■ 一、禁止清单（出现即停，不得例外）\n1. 含手机号、收货地址、身份证号、支付流水号的原始数据，任何情况下不进公开大模型。\n2. 供货价、合同条款、返点比例等商务敏感信息，不进任何外部工具。\n3. 未脱敏的用户原话（含昵称、头像、订单号）不得整段粘贴；引用时只保留「类目 + 主题 + 极性」。\n4. 不得让 AI 输出对竞品经营状况的定性判断（销量、库存、资金），只做公开信息对比。\n触发条件：以上任一项出现在待贴材料里 → 停止操作，按第三节脱敏后再继续。\n\n■ 二、允许清单（低风险，可直接用）\n1. 公开页面信息整理：竞品活动页、平台规则页 → 结构化对比表。产出用于内部讨论。\n2. 文案与表达：同一卖点出多版表达、按「痛点—证据—利益」排序。上线前须过广告法词表。\n3. 会议纪要与待办转写：内部会议录音转文字后整理。录音不外传，只传文字。\n4. 取数逻辑：用自然语言描述口径，让 AI 写 SQL 骨架。执行必须在数仓内，AI 不接触数据行。\n\n■ 三、脱敏与复核动作\n1. 脱敏三步：删身份字段 → 保结构字段 → 提示词写明「不得索取或推断个人信息」。\n2. 复核人：文案类由法务复核禁用词；数据类由数据合规复核口径；对外材料由部门负责人签字。\n3. 不通过怎么退回：复核意见写进同一份文档的批注，修改后重新走一遍，不口头放行。\n\n■ 四、留痕与问责\n1. 留痕：每次分析的脱敏前后样本存 `产品部/AI使用记录/YYYY-MM`，保留 6 个月。\n2. 回滚：发现对外材料含未脱敏信息，2 小时内下架并同步渠道；24 小时内出书面说明。\n3. 问责：直接操作人为第一责任人，复核人为第二责任人；owner：产品部负责人。\n4. 复核节奏：每月抽查 5 份记录，抽查结果进部门月度复盘。", "rubric": ["禁止清单精确到字段名（手机号/收货地址/订单号/支付流水/供货价），不写「敏感数据」这种笼统词", "允许清单 ≥3 条，每条写清适用场景与产出用途，能让人照着用而不用再问", "复核动作写明「谁复核、看什么、不通过怎么退回」，不是一个「需审核」就完事", "有留痕与回滚：记录存哪、存多久、错误输出多久内撤回，且写明 owner"]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "业务 VP 质疑「AI 会不会让团队失控」", "video": {"dur": "3.6min", "script": ["向上汇报 AI 提效，最怕答不出「出了事怎么办」", "向上沟通三件套（结论 / 依据 / 边界）", "VP 的三个真实担忧：数据、质量、人"]}, "ppt": {"method": "向上沟通三件套（结论 / 依据 / 边界）", "case": "VP 的三个真实担忧：数据、质量、人", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "objective": "能在 VP 三轮追问下用「结论—依据—边界」答出风险兜底，不回避也不空谈", "transfer": "把陪练里被追问最狠的那个问题，写进汇报材料第 2 页的「风险与兜底」", "vslides": [{"t": "陪练说明：VP 只问三件事", "n": "接下来是向上沟通的陪练，对手是业务 VP。他关心三件事：省多少钱、出了事谁负责、团队会不会废掉。技术细节他不听，你讲得越细他越怀疑。回答的基本结构是结论、依据、边界：先给一句能记住的结论，再给可核算的依据，最后主动划出你不承诺的部分。尤其注意最后一条——主动说「这件事我不敢保证零风险，但我保证有拦截点和留痕」，比拍胸脯说「绝对没问题」可信得多，因为 VP 见过太多拍胸脯的项目。他真正在测的不是你对 AI 有多懂，而是你有没有想过失败的样子：出错的概率有多大、错了能多快发现、发现后怎么收场。这三个问题答得清楚，他反而更愿意给你空间。还有一点要提前想好：他不会只问一次，第二遍通常会换个问法追问同一件事，看你是不是背稿。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">向上沟通三件套</tspan></text><g data-k=\"结论一句话\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">结论一句话</tspan></text></g><g data-k=\"依据可核算\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">依据可核算</tspan></text></g><g data-k=\"边界主动划\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">边界主动划</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 70.54}, {"t": "他会问什么：四个高频问题", "n": "四个高频问题。第一，提效一年省多少人力，这个数怎么算出来的？第二，AI 出了错客户投诉到你那，我找谁，流程哪一步能拦住？第三，团队会不会变懒，新人还学不学基本功？第四，下个月真出事，你这套规范能证明我们尽到管理责任吗？第一问的坑是拍脑袋报大数，正确做法是给可核算口径：三个人每周各花三小时写周报，压到四十分钟，一年折多少工时，然后说明这是估算、试点后会实测。第三问要给出动作而不是态度。第二问的正确答法是直接报拦截点：文案过广告法词表由法务拦、口径类结论由数据合规拦、对外材料由部门负责人签字拦，三道里任意一道都能在客户看到之前把错误截下来。第三问要诚实：新人确实容易跳过基本功，所以规范里要写死一条——先用自己手写一版，再拿 AI 产出对照，差异写进复盘。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"省多少人力、口径怎么算\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">省多少人力、口径怎么算</tspan></text></g><g data-k=\"出错时谁负责、哪一步能拦\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">出错时谁负责、哪一步能拦</tspan></text></g><g data-k=\"团队会不会变懒、怎么防\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">团队会不会变懒、怎么防</tspan></text></g><g data-k=\"出事后能不能证明尽责\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">出事后能不能证明尽责</tspan></text></g></svg>", "d": 79.97}, {"t": "通过标准：不吹、不躲、可落地", "n": "放行标准：数字有口径、拦截点具体、责任到岗、留痕拿得出。四项里最容易失分的是「责任人」——回答「我会负责」是无效答案，VP 要的是流程上的名字：文案谁签、数据谁核、对外材料谁批。也不要为了过关承诺「零风险」，那会让整份方案失去可信度。你的目标不是说服 VP 相信 AI 万能，而是让他相信：这件事有人管、有流程拦、出了事查得到。做到这三点，预算和试点空间自然会给。最后一句话很关键：把你的承诺缩到能兑现的范围——不承诺不出错，只承诺错误在部门内被发现、在客户之前被拦住。这句话比任何技术方案都更能让 VP 签字。走到这一步，你已经把「要不要用 AI」的讨论，变成了「怎么管着用」的讨论，性质完全不同。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"提效口径可核算\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">提效口径可核算</tspan></text></g><g data-k=\"拦截点写清谁看什么\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">拦截点写清谁看什么</tspan></text></g><g data-k=\"责任落到岗位\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任落到岗位</tspan></text></g><g data-k=\"不承诺零风险但承诺可追溯\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不承诺零风险但承诺可追溯</tspan></text></g></svg>", "d": 67.18}], "deliverable": {"type": "skill", "name": "部门 AI 使用规范草稿", "rubric": ["口径可核算", "拦截点清楚", "责任可落地"], "acceptance": "四个问题都能用「结论—依据—边界」回答：给得出可核算的口径、说得出拦截点、拿得出规范与留痕"}, "spar": {"role": "业务 VP", "persona": "关心结果与风险，不关心技术细节；对「提效」这两个字天然怀疑，会反复要数字", "mustAsk": ["你说的提效，一年能省多少人力？这个数怎么算出来的？", "AI 出了错，客户投诉到我这，我找谁？流程上哪一步能拦住？", "团队会不会变懒？新人还学不学基本功？", "如果下个月出事，你这套规范能证明我们尽到了管理责任吗？"]}, "exemplar": "（VP 问：你说的提效，一年能省多少人力，这个数怎么算出来的）\n\n结论：按当前 3 人试点算，一年约省 240 个工时，折 0.15 个人力——数字不大，但每个数都能复算。\n依据：周报从 3 小时压到 40 分钟，3 人 × 48 周 = 省 96 小时；差评归因从 5 小时压到 1 小时，同口径 = 省 192 小时。两个数都是试点实测，不是我拍的。\n边界：这两个数只在试点范围成立，扩到全组要重测；另外我不敢承诺不出错，我能承诺的是三道拦截——文案过法务词表、口径过数据复核、对外材料我签字，错误在到客户之前能被截下来。", "task": "把《部门 AI 使用规范草稿》拿到「业务 VP」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《部门 AI 使用规范草稿》。现在要让它通过「业务 VP」这一关。\n【对手的立场】关心结果与风险，不关心技术细节；对「提效」这两个字天然怀疑，会反复要数字。\n【他一定会追问】「你说的提效，一年能省多少人力？这个数怎么算出来的？」 / 「AI 出了错，客户投诉到我这，我找谁？流程上哪一步能拦住？」 / 「团队会不会变懒？新人还学不学基本功？」\n【场景】你说「业务 VP 质疑「AI 会不会让团队失控」」，对方立刻回一句：你说的提效，一年能省多少人力？这个数怎么算出来的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["提效数字有口径（几人×几小时×几周，折成人力），并说明这是估算还是实测", "能指出至少两个具体拦截点（谁在流程哪一步看什么），不是「我们会加强审核」", "回答「团队变懒」时给出可执行动作（如新人必须先手写一遍再对照 AI 产出）", "能说明规范 + 留痕如何证明管理尽责，且不夸大（不承诺「零风险」）"]}]}, {"id": "M1", "title": "M1 用 AI 做市场与消费者洞察", "dims": ["insight", "data", "prompt"], "units": [{"id": "M1U1", "tier": "basic", "step": "understand", "title": "社媒 / 评价 / 趋势三类信号", "video": {"dur": "3.8min", "script": ["洞察做错的成本不在分析本身，而在你拿着一类信号的结论去回答了另一类信号才能回答的问题", "信号三分法：评价（自家、细、滞后）/ 社媒（外部、快、偏）/ 趋势（大盘、稳、粗）", "某家纺品牌把 30 天评价与社媒词频交叉，发现「洗后结块」只在评价里出现"]}, "ppt": {"method": "信号三分法：评价（自家、细、滞后）/ 社媒（外部、快、偏）/ 趋势（大盘、稳、粗）", "case": "某家纺品牌把 30 天评价与社媒词频交叉，发现「洗后结块」只在评价里出现", "demo": "同一问题分别用评价与社媒各答一遍，看结论差在哪"}, "objective": "能按「回答什么问题」把三类洞察信号归类，并说出各自的取数口径与致命局限", "transfer": "把手上正在做的洞察课题写成一句话，标清它该用哪类信号回答，发给数据组确认取数口径", "vslides": [{"t": "开场：先定信号，再谈工具", "n": "做洞察最容易犯的错，是先打开工具再想问题。你真正要先问的是：这个问题该由哪一类信号来回答。零售电商手上能用的信号只有三类。第一类是评价与问大家，来自你自己店铺，结构化、粒度细、能指到具体属性，但它只覆盖已经买过的人，而且是滞后反馈——用户是收到货、用过一阵才写的。第二类是社媒与内容平台，来自外部，更新快，能先看到新场景、新人群、新用法，但发帖的不是你的用户，噪音大、样本偏。第三类是趋势与大盘，搜索指数、平台榜单、行业报告，告诉你这个品类在涨还是在退、现在是不是旺季，但粒度粗，看不到个体差异。三类不是互相替代，而是分工：先想清楚问题属于哪一类，再去取对应的信号。这一节把这个分工钉死，后面两节讲各自怎么取、哪里会骗你。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类信号回答三类问题</tspan></text><g data-k=\"评价：哪里不满意\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">评价：哪里不满意</tspan></text></g><g data-k=\"社媒：有什么新需求\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">社媒：有什么新需</tspan><tspan x=\"200.0\" dy=\"14.950000000000001\">求</tspan></text></g><g data-k=\"趋势：品类在涨还是在退\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">趋势：品类在涨还</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\">是在退</tspan></text></g></svg>", "d": 74.42}, {"t": "具体动作：每类取到什么程度才算够", "n": "评价类取三样：主题、情感、属性。做法是导出近 30 天评价，先删掉手机号、订单号、地址这些字段，只留品类、评分、文本；再按主题打标，比如面料、尺码、物流、客服、包装、性价比；然后数每个主题的提及次数与负向占比，负向占比超过 15% 的主题优先处理，这个阈值是为了把「偶发抱怨」和「系统性问题」分开。问大家要单独看，那里是购买前的疑问，和评价不是一回事。社媒类先做词频与共现，再人工抽样 30 条验证：词频找反复出现的名词，共现看它总和什么词一起出现，抽样是为了排除「一个博主自说自话」。趋势类看同比不看环比，看搜索指数不看单条爆款——同比能剔掉季节性，单条爆款只能说明有个内容火了，说明不了品类在涨。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"评价：主题 × 情感 × 属性\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">评价：主题 × 情感 × 属性</tspan></text></g><g data-k=\"社媒：词频 × 共现 + 抽 30 条\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">社媒：词频 × 共现 + 抽 30 条</tspan></text></g><g data-k=\"趋势：同比 + 搜索指数\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">趋势：同比 + 搜索指数</tspan></text></g><g data-k=\"阈值：负向占比 &gt;15% 才动\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">阈值：负向占比 &gt;15% 才动</tspan></text></g></svg>", "d": 78.12}, {"t": "边界：三类会骗你的地方", "n": "第一个坑，拿社媒热帖当整体趋势。一条一万赞的帖子，可能来自一个两万人的小众圈层，放进八百万用户里就是噪声。识别办法是看它有没有在你自己的评价或搜索词里出现第二条独立证据；两条独立信号同向，才值得往上报。第二个坑，用评价样本推整体。肯写评价的人本身就是满意度偏高或偏低的极端用户，沉默的大多数不发声，退货用户更不评价——这叫幸存者偏差。所以评价能告诉你「问题长什么样」，不能告诉你「问题有多大比例」；要算比例，回去查退货原因、客服工单这些全量数据。第三个坑，只看近 30 天做年度判断。服装看季节、家纺看装修季、食品看节庆，30 天窗口正好落在换季上，你会把季节波动读成趋势。要做趋势判断，至少拉 12 个月同比。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"热帖要有第二条独立证据\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">热帖要有第二条独立证据</tspan></text></g><g data-k=\"评价只答「长什么样」，不答「多大比例」\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">评价只答「长什么样」，不答「多大比例」</tspan></text></g><g data-k=\"算比例回去查退货原因与工单\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">算比例回去查退货原因与工单</tspan></text></g><g data-k=\"趋势判断至少 12 个月同比\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">趋势判断至少 12 个月同比</tspan></text></g></svg>", "d": 73.9}], "deliverable": {"type": "doc", "name": "信号取数单", "rubric": ["归类正确", "口径可执行", "局限说清"], "acceptance": "给出一个课题的三类信号取数方案：每类写明取哪张表/哪个平台、看什么字段、什么情况下不采信"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】信号三分法：评价（自家、细、滞后）/ 社媒（外部、快、偏）/ 趋势（大盘、稳、粗）\n【为什么重要】洞察做错的成本不在分析本身，而在你拿着一类信号的结论去回答了另一类信号才能回答的问题\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三类信号各自的「回答什么问题」能对上号：评价答「哪里不满意」、社媒答「有什么新需求」、趋势答「品类在涨还是在退」，不能混", "每类说清取数口径：评价按「主题 × 情感 × 属性」、社媒按「词频 × 共现 + 抽样 30 条验证」、趋势按「同比 + 搜索指数」，说得出具体字段或入口", "每类各举一个会误导人的场景（圈层噪声 / 幸存者偏差 / 季节性），并说出你用什么办法识别", "自检题全对；收获写到一个正在做的课题上，不写「了解了三类信号」这类空话"]}, {"id": "M1U2", "tier": "basic", "step": "demo", "title": "用 AI 做电商评论情感与需求聚类", "video": {"dur": "3.3min", "script": ["聚类算法不会替你判断哪条评价根本不该进样本，而这一步错了，后面所有占比都是假的", "脱敏评价 → 按「本品/主题/情感/可行动性」四字段整理 → AI 聚类 → 人工剔噪", "「优选生活馆」云感四件套上市 3 周的 8 条评价（含刷单疑似与离题咨询）"]}, "ppt": {"method": "脱敏评价 → 按「本品/主题/情感/可行动性」四字段整理 → AI 聚类 → 人工剔噪", "case": "「优选生活馆」云感四件套上市 3 周的 8 条评价（含刷单疑似与离题咨询）", "demo": "WorkBuddy 内跑一遍：先整理字段，再让模型按主题聚类，最后自己剔掉不可用条目"}, "objective": "能把 8 条混着隐私、刷单、离题的原始评价整理成可分析的字段，并说清哪几条不能进样本", "transfer": "把手上任意一份评价导出按这套字段过一遍，把「不能进样本」的条目单独存一页，发给运营确认", "vslides": [{"t": "演示准备：这 8 条评价没有一条是干净的", "n": "运营发给你的是原始导出：8 条评价，带昵称、手机号、订单号、城市。里面混了四种东西。第一，两条是旧款的评价，用户买的是去年那版四件套，跟这次新品不是一回事。第二，有一条疑似刷单：三个不同昵称，句式一模一样，「好评，质量很好，物流很快，值得购买」，没有一个字提到实际使用。第三，有一条根本不是评价，是问能不能开专票。第四，剩下几条才是真反馈：起球、偏薄、尺寸偏大、客服耐心。你要做的不是把它们一起丢给模型聚类——那样出来的占比一定是错的。你要先做四列判定：是否本品、主题、情感、可行动性。这一节就把这四列填完，然后才让模型上场。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入：脏数据</tspan></text><g data-k=\"8 条原始评价：含昵称/手机号/订单号/城市\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条原始评价：含昵称/手机号/订单号/城市</tspan></text></g><g data-k=\"混入：2 条旧款 + 1 条刷单疑似 + 1 条离题\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">混入：2 条旧款 + 1 条刷单疑似 + 1 条离题</tspan></text></g><g data-k=\"先判定四列，再聚类\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">先判定四列，再聚类</tspan></text></g></svg>", "d": 65.33}, {"t": "四列判定：每一列都有判错的方式", "n": "第一列「是否本品」，看评价里有没有提到本次上新的具体卖点，比如云感、某批次、新包装；只提「四件套」而没提新特性的，一律按既有品处理，宁可错杀。第二列「主题」，从固定词表里选，不要自己造词——造词的结果是每条一个主题，聚不起来。第三列「情感」，负、中、正三档；提要求（希望加个尺寸表）算中性，不算负向，否则差评率口径会被污染。第四列「可行动性」，这是最容易被跳过的一列：能直接改的（详情页加克重）、需要内部数据的（起球要查质检报告）、不可用的（刷单疑似、非商品问题）。三档要分清，因为后面排优先级全靠它——把「需要内部数据」的写成「能直接改」，你就会给研发提一个自己都没验证的需求。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四列判定框架</tspan></text><g data-k=\"是否本品\"><rect x=\"18.0\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"56.8\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"56.8\">是否本品</tspan></text></g><g data-k=\"主题（固定词表）\"><rect x=\"113.5\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.2\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.2\">主题（固定</tspan><tspan x=\"152.2\" dy=\"14.950000000000001\">词表）</tspan></text></g><g data-k=\"情感（负/中/正）\"><rect x=\"209.0\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.8\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.8\">情感（负/</tspan><tspan x=\"247.8\" dy=\"14.950000000000001\">中/正）</tspan></text></g><g data-k=\"可行动性（三档）\"><rect x=\"304.5\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"343.2\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"343.2\">可行动性（</tspan><tspan x=\"343.2\" dy=\"14.950000000000001\">三档）</tspan></text></g></svg>", "d": 68.83}, {"t": "模型的活与人的活：分界线在哪", "n": "整理完字段，模型做三件事：聚类、数条目、给方向。它不该做三件事：补数据、下定性结论、替你决定优先级。所以提示词里必须写死「禁止补充表中没有的数据」。模型最常犯的毛病是顺手补一个行业均值，比如「同类目退货率约 25%」，这个数字看着专业，实际是编的，一旦进了汇报材料，被业务问一句「哪份报告」就当场塌掉。第二个毛病是把一条说成「大量」「普遍」，8 条样本里 1 条起球，它能写成「起球问题集中」。第三个毛病是越权定性，把「疑似刷单」直接写成「存在刷单行为」，那是风控的结论，不是你的。你交出去的东西应该是：聚类结果 + 剔除清单 + 每条方向的依据强度 + 还缺哪些数据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">模型做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人来做</tspan></text><g data-k=\"聚类 / 数条目 / 给方向 （含依据强度）\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">聚类 / 数条目 / 给方向</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">（含依据强度）</tspan></text></g><g data-k=\"补行业数据 / 定性刷单 / 定优先级 （这些留给人）\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"87.0\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">补行业数据 / 定性刷单 /</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\"> 定优先级</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">（这些留给人）</tspan></text></g></svg>", "d": 65.35}], "deliverable": {"type": "sheet", "name": "评价整理表（含剔除清单）", "rubric": ["字段判定", "剔噪依据", "结论边界"], "acceptance": "8 条评价每格都有判定，其中「不可用」的条目写明理由；聚出的主题不超过 5 个且互不重叠"}, "demo": {"ref": "■ 主题聚类（共 8 条，纳入统计 6 条）\n\n1. 面料与耐用性（2 条：E01 起球、E08 耐用）　负向 1 条\n2. 与描述不符（1 条：E02 偏薄）　负向 1 条\n3. 规格匹配（1 条：E07 尺寸偏大）　负向 1 条\n4. 售后与开票（1 条：E05 专票咨询）　中性\n5. 服务体验（1 条：E06 客服耐心）　正向\n\n■ 建议剔除\nE04：三条昵称不同但句式完全一致、无任何具体使用信息，疑似刷单，不计入好评率。\nE03 / E08：评价对象是旧款四件套，不是本次新品，不纳入新品洞察。\n\n■ 三条优化方向\n1. 详情页补充克重与厚度实测值（依据强度：中，来自 E02）\n2. 规格表增加「床垫厚度适配」一列（依据强度：中，来自 E07）\n3. 起球问题需内部核对本批次面料检测报告后再定（依据强度：弱，仅 1 条）\n\n■ 补充：同类目床品退货率约 25%，本品高于行业均值，建议优先处理起球。", "fix": ["「同类目床品退货率约 25%」整句删掉——素材里没有这条数据，行业均值不能编；要引用必须注明是哪份报告哪一年", "把「起球占主要问题」改成「起球仅 1 条，占比需退货原因数据核对」——8 条里的 1 条推不出占比", "「疑似刷单」只写成「句式雷同、建议提交风控复核」，不替风控下刷单结论", "补一段「还缺哪些内部数据」：退货原因分布、该批次面料质检报告、旧款与新品的克重差"], "judge": "判断依据：有没有出现素材里没有的频次或比例；有没有把旧款评价混进新品；有没有替风控或法务下结论；每条方向能不能指回具体条目编号", "sheet": {"situ": "「优选生活馆」云感四件套上市三周，运营把后台导出的 8 条评价原样发给你，带昵称、手机号、订单号、城市。里面混着去年的旧款评价、一条疑似刷单、一条问发票的，还有两条其实是同一件事。你要用它出一版「新品体验优化方向」。", "ask": "① 把这 8 条按框架整理成结构化字段：先判是不是本品，再定主题、情感、能不能行动；② 用你整理好的表请 AI 做主题聚类、给三条优化方向；③ 拿回初稿后自己动手改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 按主题聚类，最多 5 类，给出每类条目编号与条数；② 指出哪几条不该纳入统计、理由是什么；③ 给三条优化方向，每条注明依据强度（强/中/弱）以及对应条目编号。禁止补充表中没有的数据，不确定的地方写「需内部数据」。", "mats": [{"id": "E01", "src": "评价导出 · 第 1 行", "text": "陈** ｜ 138****5540 ｜ SO2026-09-7714 ｜ 苏州\n云感四件套洗了一次，枕套边上就起球了，客服说是我洗衣机的问题。"}, {"id": "E02", "src": "评价导出 · 第 2 行", "text": "匿名用户\n比想象中薄很多，页面图看着挺厚实，收到像床单一样。"}, {"id": "E03", "src": "评价导出 · 第 3 行", "text": "许* ｜ 137****9021 ｜ 宁波\n第三次回购了，之前那款更厚实。这次买的云感款手感软，但确实薄。"}, {"id": "E04", "src": "评价导出 · 第 4 行（同句式共 3 条）", "text": "好评，质量很好，物流很快，值得购买。\n（同一句式在导出表里出现 3 次，昵称各不相同，无任何具体使用信息）"}, {"id": "E05", "src": "评价导出 · 第 5 行", "text": "周** ｜ 139****3388\n麻烦问下能开专票吗？公司报销要 13 个点的。"}, {"id": "E06", "src": "评价导出 · 第 6 行", "text": "匿名用户\n客服小美很有耐心，帮我改了三次收货时间。"}, {"id": "E07", "src": "评价导出 · 第 7 行", "text": "钱** ｜ 136****1120 ｜ 1.8 米床\n1.8 米的床买了 200×230，被边垂到地上拖地，尺寸表里没写床垫厚度，白买了。"}, {"id": "E08", "src": "评价导出 · 第 8 行", "text": "冯** ｜ 135****7766\n去年买的那套用了一年没起球，这次给爸妈又买了一套。"}], "cols": [{"k": "own", "name": "是不是本品", "hint": "本品 = 本次上市的云感新款", "type": "chips", "w": 2, "tags": ["本品（云感新款）", "既有品（其他款）"]}, {"k": "topic", "name": "主题", "hint": "从词表里选，别自己造词", "type": "chips", "w": 3, "tags": ["面料与耐用性", "与描述不符", "规格匹配", "售后与开票", "客服响应", "无有效信息"]}, {"k": "sent", "name": "情感", "hint": "负 / 中 / 正；提要求算中", "type": "chips", "w": 2, "tags": ["负", "中", "正"]}, {"k": "act", "name": "可行动性", "hint": "能直接改 / 需内部数据 / 不可用", "type": "chips", "w": 3, "tags": ["能直接改", "需内部数据", "不可用"]}, {"k": "quote", "name": "一句原话（照抄，已脱敏）", "hint": "照抄连续一段 ≥6 字，把昵称、手机号、订单号、城市去掉", "type": "text", "w": 3, "tags": []}], "key": {"E01": {"own": "本品（云感新款）", "topic": "面料与耐用性", "sent": "负", "act": "需内部数据"}, "E02": {"own": "本品（云感新款）", "topic": "与描述不符", "sent": "负", "act": "能直接改"}, "E03": {"own": "本品（云感新款）", "topic": "与描述不符", "sent": "负", "act": "需内部数据"}, "E04": {"own": "本品（云感新款）", "topic": "无有效信息", "sent": "正", "act": "不可用"}, "E05": {"own": "本品（云感新款）", "topic": "售后与开票", "sent": "中", "act": "能直接改"}, "E06": {"own": "本品（云感新款）", "topic": "客服响应", "sent": "正", "act": "不可用"}, "E07": {"own": "本品（云感新款）", "topic": "规格匹配", "sent": "负", "act": "能直接改"}, "E08": {"own": "既有品（其他款）", "topic": "面料与耐用性", "sent": "正", "act": "不可用"}}, "notes": {"E03·own": "这条看着像老客评价、很多人直接判「既有品」剔掉——但正文明确说了「这次买的云感款…确实薄」，它同时是 E02 的第二条独立证据。剔掉它，你就把唯一的交叉验证丢了，依据强度只能停在「弱」", "E04·act": "三条同句式、一个字没提实际使用，不能进好评率统计。但报告里也不许写「存在刷单」，那是风控的结论，你只能写「已提交风控复核」", "E05·sent": "用户在问能不能开专票，没有情绪，判「中」。判成负向，开票咨询就会污染差评率口径", "E06·act": "夸客服是有效信息，能当话术素材，但对「商品改进」不可用。这一列的「不可用」指的是进不了改商品的清单，不是这条评价没用", "E01·act": "1 条起球不足以下定性结论，但也不能写「能直接改」——你得先去要本批次面料质检报告，所以是「需内部数据」。这一列最容易全填「能直接改」", "E08·own": "「去年买的那套」明确是旧款，剔除；但它说明复购意愿强，可以在报告里单列一句，不进新品统计", "E07·topic": "主问题是尺寸表缺床垫厚度，归「规格匹配」；不要归到「与描述不符」，那是厚薄问题"}, "delta": [{"op": "改", "frm": "「用户普遍反映起球严重」（模型把 1 条说成普遍）", "to": "「素材中 E01 一条提到起球，占比需退货原因数据核对」", "why": "8 条里 1 条推不出占比，写「普遍」等于编频次，评审一问「几条」就塌", "kw": ["频次", "普遍", "反复", "占比", "几条", "数量", "一条"]}, {"op": "删", "frm": "模型顺手补的「同类目床品退货率约 25%，本品高于行业均值」", "to": "整句删除", "why": "素材里没有这条数据。行业均值必须来自自家看板或可引用报告，否则是给方案埋雷", "kw": ["行业均值", "退货率", "25", "行业平均", "行业"]}, {"op": "改", "frm": "「存在刷单行为」（模型直接定性）", "to": "「E04 三条句式雷同、无使用信息，已提交风控复核」", "why": "刷单认定是风控的职责，PM 越权定性要担责", "kw": ["刷单", "风控", "定性", "复核", "越权"]}, {"op": "改", "frm": "「建议全店详情页改版」", "to": "「先改本 SKU 第二屏：加克重与厚度实测」", "why": "6 条样本撑不起全店改版；范围收窄才批得下来，也才验证得了", "kw": ["范围", "全店", "改版", "一个", "先改", "收窄"]}, {"op": "补", "frm": "模型把 E03 当成老客评价排除", "to": "保留 E03 作为 E02 的第二条独立证据，依据强度由「弱」升「中」", "why": "两条独立条目同向，才够得上「中」；这条最容易被当噪声扔掉", "kw": ["E03", "第二条", "交叉", "证据", "独立"]}, {"op": "补", "frm": "（模型没写）", "to": "单独一段「还缺哪些内部数据」：退货原因分布、本批次质检报告、旧款克重", "why": "缺这一段，三条方向排不出先后，交上去只能被退", "kw": ["内部数据", "质检", "退货原因", "缺", "克重"]}], "refsheet": "E01｜本品｜面料与耐用性｜负｜需内部数据｜原话：洗了一次，枕套边上就起球了\nE02｜本品｜与描述不符｜负｜能直接改｜原话：比想象中薄很多\nE03｜本品｜与描述不符｜负｜需内部数据｜原话：这次买的云感款手感软，但确实薄\nE04｜本品｜无有效信息｜正｜不可用｜原话：好评，质量很好，物流很快（三条同句式）\nE05｜本品｜售后与开票｜中｜能直接改｜原话：麻烦问下能开专票吗\nE06｜本品｜客服响应｜正｜不可用｜原话：客服小美很有耐心\nE07｜本品｜规格匹配｜负｜能直接改｜原话：尺寸表里没写床垫厚度\nE08｜既有品｜面料与耐用性｜正｜不可用｜原话：去年买的那套用了一年没起球\n\n四处容易判错的：\n· E03 不能剔：它和 E02 说的是同一件事（薄），是唯一的第二条独立证据，剔掉就只剩「弱」。\n· E04 是「不可用」不是「正向好評」：三条同句式、无使用信息，进统计会把好评率拉假。\n· E05 / E06 都不是负向：一个是问开票、一个是夸客服，判成负会污染差评率口径。\n· E08 是唯一要剔的：评的是去年旧款，进新品统计就是样本混用。", "forbid": "1[3-9]{1}\\d{2}[\\*x]{4}\\d{4}|1[3-9]\\d{9}|SO\\d{4}-\\d{2}-\\d{4}", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」云感四件套上市三周的评价整理表（已脱敏，不含手机号、订单号与地址）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 按主题聚类，最多 5 类，给出每类条目编号与条数；② 指出哪几条不该纳入统计，理由是什么；③ 给出三条优化方向，每条注明依据强度（强/中/弱）。禁止补充表中没有的数据。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】脱敏评价 → 按「本品/主题/情感/可行动性」四字段整理 → AI 聚类 → 人工剔噪\n【参考案例】「优选生活馆」云感四件套上市 3 周的 8 条评价（含刷单疑似与离题咨询）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」云感四件套上市三周的评价整理表（已脱敏，不含手机号、订单号与地址）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 按主题聚类，最多 5 类，给出每类条目编号与条数；② 指出哪几条不该纳入统计，理由是什么；③ 给出三条优化方向，每条注明依据强度（强/中/弱）。禁止补充表中没有的数据。", "rubric": ["每条都判了「本品 / 既有品」，既有品评价不得混进新品洞察（本品指本次上市的新款）", "刷单疑似（句式雷同、无具体使用信息）判为不可用，而不是当作好评统计", "可行动性分三档：能直接改 / 需内部数据 / 不可用，不能一律写「能改」", "原话照抄且已脱敏：手机号、订单号、昵称、城市都要去掉，残留即判错"]}, {"id": "M1U3", "tier": "basic", "step": "todo", "title": "产出《品类消费者洞察报告》", "video": {"dur": "3.6min", "script": ["洞察报告的价值不在结论多漂亮，而在别人能不能顺着你的编号回到原始条目，验证你说的是真的", "样本说明 → 主题分布 → 三条结论（带依据强度）→ 待补数据 → 行动建议", "「优选生活馆」云感四件套上市首月洞察报告（含被剔除的 4 条与理由）"]}, "ppt": {"method": "样本说明 → 主题分布 → 三条结论（带依据强度）→ 待补数据 → 行动建议", "case": "「优选生活馆」云感四件套上市首月洞察报告（含被剔除的 4 条与理由）", "demo": "报告骨架 + 一份填好的样例（含样本量、口径与剔除说明）"}, "objective": "能产出一份带样本量、口径与剔除说明的品类洞察报告，且每条结论都有条目编号可回查", "transfer": "本周内把报告里「需内部数据」的 3 项列成取数需求，发给数据组并抄送主管确认", "vslides": [{"t": "任务说明：报告是给别人挑刺用的", "n": "这份报告只有一个用途：让品牌总监和运营能顺着你的编号回到原始条目，确认你说的不是感觉。所以结构上先立规矩。第一节样本说明，必须写三个数字：总条数、纳入统计条数、剔除几条。剔除的要分类说清楚：刷单疑似几条、旧款几条、离题几条。这一节看着枯燥，却是整份报告里最容易被追问的地方——业务会问「你凭什么剔掉这条」，你答不上来，后面所有结论都要打折扣。第二节主题分布，用固定词表，列 3 到 5 个主题，每个主题给条目数和负向条数，并且明确写分母是多少。分母不写，别人就会拿你的条数当比例用，一个 1 条的问题会被读成普遍问题。这三节的顺序不要动，评审看报告就是按这个顺序找信息的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 样本说明（3 个数字）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 样本说明（3 个数字）</tspan></text></g><g data-k=\"② 主题分布（含分母）\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 主题分布（含分母）</tspan></text></g><g data-k=\"③ 三条结论 + 依据强度\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 三条结论 + 依据强度</tspan></text></g><g data-k=\"④ 待补数据\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 待补数据</tspan></text></g><g data-k=\"⑤ 行动建议\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 行动建议</tspan></text></g></svg>", "d": 69.38}, {"t": "结论怎么写才不算拍脑袋", "n": "每条结论后面加两个东西：依据强度和条目编号。强度分三档：强，是两条以上独立条目同向，或者有全量数据支撑；中，是单条明确具体、能对上产品事实；弱，是只有一条且无法验证，这种必须写「待验证」，不能直接给行动。编号是给回查用的，写「E02、E07，中」，评审时对方可以直接翻到那一条。还有一个自检动作：结论里不许出现你没有数据支撑的比例词，「大部分」「多数」「约三成」这类词，要么给出分母，要么删掉。还有一条：一段结论里不要塞三个以上数字，数字多了反而没人记得住你到底要说什么。8 条样本的洞察报告，最诚实的写法是「样本量不足以计算类目级占比，本报告只做定性判断」——这句话写上去不掉分，反而是专业度的体现。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每条结论的三件套</tspan></text><g data-k=\"条目编号\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">条目编号</tspan></text></g><g data-k=\"依据强度\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">依据强度</tspan></text></g><g data-k=\"结论一句话\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">结论一句话</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 73.87}, {"t": "待补数据与行动建议：把球踢出去", "n": "第三节写完结论，第四节一定要写「还缺什么」。缺什么不是自我批评，是让对方知道你的结论边界在哪，也是把你的下一步变成别人的待办。每一项写三样：数据名、找哪个岗位要、什么时候要。写「数据组」不算，要写到人。第五节行动建议只写两周内能动的：改详情页、加规格列、补客服话术。每条写清改动对象、责任人岗位、验收口径。验收口径要能被第三方检验，比如「抽 20 个 SKU 核对描述与实物一致」，而不是「体验提升」。报告发出前把「不覆盖」那一节再读一遍，凡是被那句话排除的内容，正文里一句都不能出现。最后加一节「本报告不覆盖的部分」，把法务、风控、大盘判断明确排除，这一句能挡住 80% 的越权追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"待补数据 ×3：数据名 / 岗位 / 时间\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">待补数据 ×3：数据名 / 岗位 / 时间</tspan></text></g><g data-k=\"行动只写两周内能动的\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">行动只写两周内能动的</tspan></text></g><g data-k=\"每条带验收口径\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条带验收口径</tspan></text></g><g data-k=\"末尾写清「不覆盖什么」\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">末尾写清「不覆盖什么」</tspan></text></g></svg>", "d": 69.89}], "deliverable": {"type": "doc", "name": "品类消费者洞察报告", "rubric": ["样本口径", "结论可回查", "行动可验收"], "acceptance": "一份能进评审会的报告：样本口径清楚、每条结论可回到条目编号、待补数据有责任岗位、行动建议可验收"}, "practice": {"steps": ["写样本说明：取哪个时间段、多少条、剔除了几条及理由（刷单疑似/旧款/离题各自几条）", "写主题分布：按固定词表列 3–5 个主题，每个主题给条目数与负向条数，注明分母", "写三条结论：每条后标依据强度（强/中/弱）与对应条目编号，弱依据必须写「待验证」", "写待补数据：列出支撑结论还缺的内部数据（退货原因、质检报告、旧款对比），标明找谁要", "写行动建议：只写能在两周内动的，每条写清改动对象、责任人岗位、验收口径"], "exemplar": "【品类消费者洞察报告 · 云感四件套】产品经理　周期：上市首月（9/22–10/21）\n\n■ 一、样本说明\n导出评价 8 条；纳入统计 6 条；剔除 2 条。\n剔除明细：① 刷单疑似 1 条（E04：三个昵称句式完全一致、无使用信息，已提交风控复核）；② 旧款评价 1 条（E08：评价对象为去年款，另 E03 虽提到「老款更厚」但含新品对比信息，保留并单列）。\n口径：负向 = 明确表达不满且提出具体缺陷；提要求（希望加尺寸表）记为中性。分母 = 纳入统计条数 6。\n\n■ 二、主题分布（分母 6）\n1. 面料与耐用性：2 条（E01 起球、E03 与老款对比），负向 1 条，负向占比 17%\n2. 与描述不符：1 条（E02 偏薄），负向 1 条，17%\n3. 规格匹配：1 条（E07 尺寸偏大），负向 1 条，17%\n4. 售后与开票：1 条（E05 专票咨询），中性\n5. 服务体验：1 条（E06 客服耐心），正向\n\n■ 三、三条结论（带依据强度）\n1. 用户对「厚薄」的预期与实物存在偏差，详情页缺克重与厚度实测。（E02，中）\n2. 规格表未覆盖床垫厚度，导致按推荐尺寸买回偏大。（E07，中）\n3. 起球在 1 条中出现，是否系统性问题待验证。（E01，弱——待质检报告）\n注：样本量 6 条不足以计算类目级占比，本报告只做定性判断，不出百分比结论。\n\n■ 四、待补数据\n1. 近 90 天退货原因分布（含「面料起球」二级原因）——找数据组张工，10/31 前\n2. 本批次面料质检报告（起球等级、克重实测）——找供应链李工，10/31 前\n3. 旧款与新品的克重差（用于判断「老款更厚」是否成立）——找商品部王工，11/3 前\n\n■ 五、行动建议（两周内可动）\n1. 详情页第二屏加「克重 / 厚度实测」模块，文案口径以质检报告为准，未出报告前不上线。责任人：商品内容运营　验收：模块上线后 14 天，该类负向提及占比下降\n2. 规格表增加「床垫厚度适配」一列（≤20cm / 20–30cm / >30cm）。责任人：类目运营　验收：抽 20 个 SKU 核对描述与实物一致\n3. 客服话术补一条「起球处理流程」，先解答不承诺。责任人：客服主管　验收：抽 30 通会话无违规承诺\n\n■ 六、本报告不覆盖的部分\n不判断是否构成虚假宣传（法务）；不评估刷单规模（风控）；不推算品类大盘（无数据源）。"}, "task": "产出《品类消费者洞察报告》：写样本说明：取哪个时间段、多少条、剔除了几条及理由（刷单疑似/旧款/离题各自几条）；写主题分布：按固定词表列 3–5 个主题，每个主题给条目数与负向条数，注明分母；写三条结论：每条后标依据强度（强/中/弱）与对应条目编号，弱依据必须写「待验证」；写待补数据：列出支撑结论还缺的内部数据（退货原因、质检报告、旧款对比），标明找谁要；写行动建议：只写能在两周内动的，每条写清改动对象、责任人岗位、验收口径", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M1 用 AI 做市场与消费者洞察」模块，你要交付的是《品类消费者洞察报告》。\n【场景】业务侧这周的诉求是：洞察报告的价值不在结论多漂亮，而在别人能不能顺着你的编号回到原始条目，验证你说的是真的。参考做法：「优选生活馆」云感四件套上市首月洞察报告（含被剔除的 4 条与理由）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（样本说明 → 主题分布 → 三条结论（带依据强度）→ 待补数据 → 行动建议），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《品类消费者洞察报告》填写模板】\n\n■ 1. 写样本说明：取哪个时间段、多少条、剔除了几条及理由（刷单疑似/旧款/离题各自几条）\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写主题分布：按固定词表列 3–5 个主题，每个主题给条目数与负向条数，注明分母\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写三条结论：每条后标依据强度（强/中/弱）与对应条目编号，弱依据必须写「待验证」\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 写待补数据：列出支撑结论还缺的内部数据（退货原因、质检报告、旧款对比），标明找谁要\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写行动建议：只写能在两周内动的，每条写清改动对象、责任人岗位、验收口径\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【品类消费者洞察报告 · 云感四件套】产品经理　周期：上市首月（9/22–10/21）\n\n■ 一、样本说明\n导出评价 8 条；纳入统计 6 条；剔除 2 条。\n剔除明细：① 刷单疑似 1 条（E04：三个昵称句式完全一致、无使用信息，已提交风控复核）；② 旧款评价 1 条（E08：评价对象为去年款，另 E03 虽提到「老款更厚」但含新品对比信息，保留并单列）。\n口径：负向 = 明确表达不满且提出具体缺陷；提要求（希望加尺寸表）记为中性。分母 = 纳入统计条数 6。\n\n■ 二、主题分布（分母 6）\n1. 面料与耐用性：2 条（E01 起球、E03 与老款对比），负向 1 条，负向占比 17%\n2. 与描述不符：1 条（E02 偏薄），负向 1 条，17%\n3. 规格匹配：1 条（E07 尺寸偏大），负向 1 条，17%\n4. 售后与开票：1 条（E05 专票咨询），中性\n5. 服务体验：1 条（E06 客服耐心），正向\n\n■ 三、三条结论（带依据强度）\n1. 用户对「厚薄」的预期与实物存在偏差，详情页缺克重与厚度实测。（E02，中）\n2. 规格表未覆盖床垫厚度，导致按推荐尺寸买回偏大。（E07，中）\n3. 起球在 1 条中出现，是否系统性问题待验证。（E01，弱——待质检报告）\n注：样本量 6 条不足以计算类目级占比，本报告只做定性判断，不出百分比结论。\n\n■ 四、待补数据\n1. 近 90 天退货原因分布（含「面料起球」二级原因）——找数据组张工，10/31 前\n2. 本批次面料质检报告（起球等级、克重实测）——找供应链李工，10/31 前\n3. 旧款与新品的克重差（用于判断「老款更厚」是否成立）——找商品部王工，11/3 前\n\n■ 五、行动建议（两周内可动）\n1. 详情页第二屏加「克重 / 厚度实测」模块，文案口径以质检报告为准，未出报告前不上线。责任人：商品内容运营　验收：模块上线后 14 天，该类负向提及占比下降\n2. 规格表增加「床垫厚度适配」一列（≤20cm / 20–30cm / >30cm）。责任人：类目运营　验收：抽 20 个 SKU 核对描述与实物一致\n3. 客服话术补一条「起球处理流程」，先解答不承诺。责任人：客服主管　验收：抽 30 通会话无违规承诺\n\n■ 六、本报告不覆盖的部分\n不判断是否构成虚假宣传（法务）；不评估刷单规模（风控）；不推算品类大盘（无数据源）。", "rubric": ["样本说明含三个数字：总条数、纳入统计条数、剔除条数与理由分类，缺一个按未写完计", "每条结论后面都标了依据强度与条目编号（如「E01、E07，中」），没有编号的结论不计分", "待补数据至少 2 项，每项写清数据名 + 找哪个岗位要 + 什么时候要，缺责任岗位不计分", "行动建议每条含改动对象（详情页/规格表/客服话术）+ 验收口径（如「无结果率 ≤5%」），不写「优化体验」这类动作"]}, {"id": "M1U4", "tier": "basic", "step": "spar", "title": "品牌总监挑战你的洞察结论", "video": {"dur": "3.2min", "script": ["洞察能不能变成预算，取决于你在被追问时是往回收还是往前顶；往回收一句话，整个项目就没了", "挑战清单：样本代表性 / 结论强度 / 预算依据 / 竞品对比", "总监问「就 6 条评价你让我改详情页？」——两种答法的差别"]}, "ppt": {"method": "挑战清单：样本代表性 / 结论强度 / 预算依据 / 竞品对比", "case": "总监问「就 6 条评价你让我改详情页？」——两种答法的差别", "demo": "陪练对话界面说明（把报告粘进系统提示词，让对手按你的条目发问）"}, "objective": "能在品牌总监 4 轮追问下，说清样本边界、结论强度与预算依据，不把定性判断说成定量结论", "transfer": "把陪练里被问到卡壳的那一问补进下次汇报的第一页，汇报前先自己答一遍再进会议室", "vslides": [{"t": "陪练说明：他会用两句话把你逼到底", "n": "品牌总监这个角色的特点是不听过程，只听结论和代价。他的两把刀是「所以呢」和「那要花多少钱」。你说「用户反馈厚薄有偏差」，他回「所以呢」；你说「建议优化详情页」，他回「要多少预算、占不占研发排期」。这一关考的不是你的分析能力，是你对自己结论边界的诚实度。很多人在这里犯同一个错：为了让结论听起来更有分量，把 6 条说成「大量用户反映」。他一追问样本，你就崩了，后面说什么他都不信。正确的姿势是先把边界亮出来——这 6 条不支持改整个详情页——然后再说它支持什么。想清楚这一点再去准备，你会发现要准备的不是话术，是三个数：样本量、依据强度、最小投入。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每轮都要能指回去</tspan></text><g data-k=\"他的问题\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">他的问题</tspan></text></g><g data-k=\"你的结论\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">你的结论</tspan></text></g><g data-k=\"条目编号\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">条目编号</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.57}, {"t": "他会问什么：四个方向都会问到", "n": "第一问必然是样本：「就 6 条，能代表多少人」。这一问答不好，后面全废。第二问是证据：「这是用户原话还是你的解读」，他要的是编号和原句。第三问是代价：「多少预算、占不占排期」，他要的是最小可行动作。第四问是横向：「竞品有没有这问题、别人怎么写的」，考你有没有做过功课。四问背后是同一个逻辑：他要判断这件事值不值得投钱，而你要证明的是「用很小的成本验证一个具体假设」，不是「我要做一个大项目」。把定位想清楚，四问的答法就统一了。他提问的顺序可能会打乱，逻辑不变：他要在这五分钟里判断，这件事值不值得从别人手里挪一份资源给你。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四个必答方向</tspan></text><g data-k=\"样本：6 条代表谁\"><rect x=\"18.0\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"56.8\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"56.8\">样本：6 条</tspan><tspan x=\"56.8\" dy=\"14.950000000000001\">代表谁</tspan></text></g><g data-k=\"证据：原话在哪条\"><rect x=\"113.5\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.2\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.2\">证据：原话</tspan><tspan x=\"152.2\" dy=\"14.950000000000001\">在哪条</tspan></text></g><g data-k=\"代价：多少钱多少排期\"><rect x=\"209.0\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.8\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.8\">代价：多少</tspan><tspan x=\"247.8\" dy=\"14.950000000000001\">钱多少排期</tspan></text></g><g data-k=\"横向：竞品怎么写\"><rect x=\"304.5\" y=\"44.0\" width=\"77.5\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"343.2\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"343.2\">横向：竞品</tspan><tspan x=\"343.2\" dy=\"14.950000000000001\">怎么写</tspan></text></g></svg>", "d": 60.1}, {"t": "通过标准：三段式答完才算过", "n": "每一轮都按「结论一句话 + 依据带编号 + 边界说清」来答。结论要具体到动作，比如「先加一个克重模块」；依据要能指回条目，比如「E02、E03 两条同向」；边界要主动划，比如「我不拿这 6 条算比例，如果退货数据不支持我就撤回」。三个都给了，他才会往下问，因为你的话有边界、可验证、不吹。反过来，一轮里只有结论没依据，他会追「凭什么」；只有依据没边界，他会追「那你打算怎么办」；有边界但没动作，他会追「所以你到底要什么」。三段式不是话术，是让他能在三句话内判断要不要给你资源。如果他四问问完还是不给，通常会丢一句「再看看吧」，这时候不要争，问一句「那我补哪份数据您就能定」，把僵局变成一个带条件的待办。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"结论具体到动作\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论具体到动作</tspan></text></g><g data-k=\"依据报到条目编号\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">依据报到条目编号</tspan></text></g><g data-k=\"边界自己先划\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">边界自己先划</tspan></text></g><g data-k=\"要资源时说清最小投入\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">要资源时说清最小投入</tspan></text></g></svg>", "d": 68.4}], "deliverable": {"type": "doc", "name": "品类消费者洞察报告", "rubric": ["样本边界", "结论可追溯", "投入产出"], "acceptance": "四问都能给出「结论 + 条目编号 + 边界」三段式回答，且不把 6 条样本说成比例结论"}, "spar": {"role": "品牌总监", "persona": "做过十年品牌，只认数据和钱；听不得「用户觉得」，一听到形容词就打断，习惯用「所以呢」「那要花多少钱」两句话把人逼到底", "mustAsk": ["就 6 条评价，你让我改详情页？这 6 条能代表多少人？", "你说「预期偏差」，这是用户的原话还是你的解读？原话在哪一条？", "改详情页要占多少预算和排期？我凭什么把这个钱给你而不是给直播？", "竞品同类产品有没有这个问题？别人怎么写的，你看过吗？"]}, "exemplar": "（总监问：就 6 条评价，你让我改详情页？）\n\n结论：这 6 条不支持我改整个详情页，但支持我先验证一个假设——厚薄预期偏差。\n依据：E02 明确写「比想象中薄，和图差很多」，E03 拿老款对比说「老款更厚」，两条独立条目同向，指向同一件事：详情页没有克重和厚度实测，用户只能靠图猜。这不是满意度问题，是信息缺失问题。\n边界：我不拿这 6 条算比例，也不建议全店改版。我建议先做一件事：详情页第二屏加一个克重模块，两周后用该类负向提及占比做验证；同时 10/31 前拿到退货原因分布和质检报告，如果退货里「起球」占比超过 15%，我再提面料批次排查的需求。预算这边我只要一个内容运营的半天工时，不占研发排期。", "task": "把《品类消费者洞察报告》拿到「品牌总监」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《品类消费者洞察报告》。现在要让它通过「品牌总监」这一关。\n【对手的立场】做过十年品牌，只认数据和钱；听不得「用户觉得」，一听到形容词就打断，习惯用「所以呢」「那要花多少钱」两句话把人逼到底。\n【他一定会追问】「就 6 条评价，你让我改详情页？这 6 条能代表多少人？」 / 「你说「预期偏差」，这是用户的原话还是你的解读？原话在哪一条？」 / 「改详情页要占多少预算和排期？我凭什么把这个钱给你而不是给直播？」\n【场景】你说「品牌总监挑战你的洞察结论」，对方立刻回一句：就 6 条评价，你让我改详情页？这 6 条能代表多少人？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["被问样本代表性时，主动承认样本量不足以下比例结论，并说明报告只做定性判断（不硬撑）", "每条判断都能报出条目编号（E02、E03）与原话片段，而不是复述自己的解读", "被问预算时给出最小可行动作与投入量级（半天工时 / 不占研发排期），而不是要一个大改版", "被问竞品时承认没看过就当场给出核实动作（今天看哪几家、看哪几屏），不编造竞品做法"]}, {"id": "M1U5", "tier": "adv", "step": "understand", "title": "趋势信号与「噪声」辨别", "video": {"dur": "3.5min", "script": ["趋势判断错的代价不是写错一页 PPT，而是让公司提前半年备了一个卖不动的货盘", "噪声三分：圈层噪声 / 平台机制噪声 / 口径噪声 + 四问判别法", "「中古家居」搜索指数翻倍，实际成交只涨 8%——三种解释各对了一半"]}, "ppt": {"method": "噪声三分：圈层噪声 / 平台机制噪声 / 口径噪声 + 四问判别法", "case": "「中古家居」搜索指数翻倍，实际成交只涨 8%——三种解释各对了一半", "demo": "同一组数据做同比 / 环比 / 分人群三刀，看结论怎么变"}, "objective": "能用四问判别法把一个「上升趋势」拆成真需求、平台机制或季节性，并给出证伪路径", "transfer": "挑一个最近被同事当成趋势的说法，用这四问写一张判别卡，发到项目群让大家补证据", "vslides": [{"t": "开场：翻倍的曲线可能什么都不代表", "n": "先看一个真实场景。某类目「中古家居」的搜索指数半年翻倍，会议室里所有人都在说这是下一个风口。但把三个数摆在一起就不一样了：搜索指数同比 +112%，该类目支付买家数同比 +8%，商品详情页点击率同比 -3%。搜索涨、成交不涨、点击还跌，说明什么？说明进来的人多了，但没人真的买——这更像内容平台把一个话题炒起来了，而不是需求真的起来了。趋势判断的第一步不是看涨幅，是看这条曲线背后是谁在动。同样一条上升线，可能是真需求、可能是平台给了流量、也可能只是统计口径变了。这三种情况对应的动作完全不同：真需求要备货，平台机制要抢窗口，口径变化什么都不用做。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">同一类目三个数（同比）</tspan></text><g data-k=\"搜索指数\"><text x=\"24.0\" y=\"61.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">搜索指数</tspan></text><rect x=\"150\" y=\"51\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"51\" width=\"210.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"352.0\" y=\"64\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">+112%</text></g></g><g data-k=\"支付买家数\"><text x=\"24.0\" y=\"101.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">支付买家数</tspan></text><rect x=\"150\" y=\"91\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"91\" width=\"46.2\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"188.2\" y=\"104\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">+8%</text></g></g><g data-k=\"商详点击率\"><text x=\"24.0\" y=\"141.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">商详点击率</tspan></text><rect x=\"150\" y=\"131\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"131\" width=\"25.2\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"167.2\" y=\"144\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">-3%</text></g></g></svg>", "d": 66.65}, {"t": "三类噪声：各有各的识别特征", "n": "第一类，圈层噪声。特征是发帖人高度集中，两三个博主撑起大部分互动，评论区是同一批人来回聊。识别办法是看发帖人分布和买家地域分布——如果讨论集中在一线城市的设计师圈子，而你的成交主力在三四线，这个趋势跟你没关系。第二类，平台机制噪声。特征是时间点对得上平台的运营动作：话题活动、流量扶持、榜单推荐。识别办法是拉平台侧的活动日历做对照，或者看自然流量与推荐流量的比例。第三类，口径噪声。指数的统计口径常常包含品类词漂移，比如「中古」被大量用在二手奢侈品上，跟家居没关系；也可能是分母变了，比如平台把某个子类目并进了大盘。识别办法是把词表拉出来看头部搜索词，五个词里有三个跑偏，这个指数就不能用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类噪声的识别特征</tspan></text><g data-k=\"圈层噪声：发帖人集中\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">圈层噪声：发帖人</tspan><tspan x=\"72.7\" dy=\"14.950000000000001\">集中</tspan></text></g><g data-k=\"机制噪声：对得上活动日历\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">机制噪声：对得上</tspan><tspan x=\"200.0\" dy=\"14.950000000000001\">活动日历</tspan></text></g><g data-k=\"口径噪声：词表跑偏或分母变\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">口径噪声：词表跑</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\">偏或分母变</tspan></text></g></svg>", "d": 74.18}, {"t": "四问判别法：问完再决定要不要动", "n": "第一问，谁在搜。看搜索人群的地域、设备、新老客占比，跟你现有客群重合多少。重合低于三成，先当圈子话题看。第二问，搜了之后干了什么。看搜索到商详的点击率、商详到加购的转化率，两段都在涨才算需求进来。第三问，成交在谁身上。看支付买家数是涨还是平，以及增量来自新客还是老客复购；新客为主且客单价接近，才是新增需求。第四问，这个窗口有多长。看去年同期有没有同样的波动，有就是季节性。四问里只要有两问答不上来，结论就只能写成假设，不能写进备货计划。最后给你一条硬规矩：任何趋势结论，必须同时给出证伪条件——「如果 8 周内支付买家数同比没到 15%，这个判断作废」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 谁在搜（人群重合度）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 谁在搜（人群重合度）</tspan></text></g><g data-k=\"② 搜完干了什么（两段转化）\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 搜完干了什么（两段转化）</tspan></text></g><g data-k=\"③ 成交在谁身上（新客/老客）\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 成交在谁身上（新客/老客）</tspan></text></g><g data-k=\"④ 窗口多长（去年同比）\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 窗口多长（去年同比）</tspan></text></g></svg>", "d": 69.07}], "deliverable": {"type": "doc", "name": "趋势判别卡", "rubric": ["噪声归类", "证伪路径", "观察窗口"], "acceptance": "给一个趋势说法，能拆出它属于哪类噪声、列出证伪所需的两条反向证据，并说明观察窗口"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】噪声三分：圈层噪声 / 平台机制噪声 / 口径噪声 + 四问判别法\n【为什么重要】趋势判断错的代价不是写错一页 PPT，而是让公司提前半年备了一个卖不动的货盘\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三类噪声各有具体判别特征：圈层（发帖人集中、互动高但转化低）、机制（平台流量倾斜/话题运营）、口径（指数≠成交、含品类词漂移）", "至少给出两条反向证据的取数方式（如「该类目支付买家数同比」「搜索词→商详的点击率」），并说明去哪取", "观察窗口写到具体长度与剔除规则（如 8 周、剔除大促 3 天），不写「持续观察」", "能说出一个自己曾误判的趋势例子，并指出当时漏了哪一问"]}, {"id": "M1U6", "tier": "adv", "step": "demo", "title": "用 AI 监控竞品上新与价格节奏", "video": {"dur": "3.4min", "script": ["竞品监控最容易出的事不是分析错，而是把不该拿到的价格写进了汇报材料", "公开信息分级（公开页 / 需登录 / 商业秘密）→ AI 摘要 → 节奏表（只写公开字段）", "三家竞品近两周的上新与调价记录（含爬虫抓的会员价与内部渠道价）"]}, "ppt": {"method": "公开信息分级（公开页 / 需登录 / 商业秘密）→ AI 摘要 → 节奏表（只写公开字段）", "case": "三家竞品近两周的上新与调价记录（含爬虫抓的会员价与内部渠道价）", "demo": "WorkBuddy 内跑一遍：先判来源可用性，再让模型出节奏表，最后自己剔掉禁用条目"}, "objective": "能把 8 条来源不同的竞品信息分成「可用 / 需授权 / 禁用」，并给出只依赖公开信息的监控口径", "transfer": "按这套分类把手上竞品监控表重做一版，把「需授权」的条目单独列给法务确认能不能用", "vslides": [{"t": "演示准备：这 8 条信息有一半不能用", "n": "运营给你 8 条竞品动态。听起来都是「网上看到的」，实际来源差别很大。第一条，竞品店铺的公开详情页，标价 299，谁都能看，这条能用。第二条，会员价 259，要登录会员账号才看得到，这是未授权获取，不能用。第三条，供应商告诉你的供货价 168，那是商业秘密，绝对不能用，用了还可能担责。第四条，第三方工具估算的月销 8000+，口径不明，拿来做参考可以，写进汇报不行。第五条，直播间口播价，没有页面留痕，明天就复核不了。你要做的第一件事不是分析，是给每条打一个来源标签：公开页 / 需登录 / 商业秘密。打错一个，整张表都可能被推翻。来源标签标错，后面所有分析都建在流沙上——这正是要先判来源、后做分析的原因。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">来源三档</tspan></text><g data-k=\"公开页：可用\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">公开页：可用</tspan></text></g><g data-k=\"需登录：未授权\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">需登录：未授权</tspan></text></g><g data-k=\"商业秘密：禁用\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">商业秘密：禁用</tspan></text></g></svg>", "d": 73.94}, {"t": "只让公开字段进表，其余进「已排除」", "n": "整理完来源，模型只做一件事：把公开页条目按周排成节奏表。字段就四个：商品、公开标价、活动形式、可见时间点。为什么只有四个？因为再多就要开始推测了。销量、库存、投放预算这些公开页看不到，第三方工具的估算口径又不透明，一律不进表。剩下不能用的条目不要删掉，单独放一节「已排除条目及原因」，写清每条为什么不能用：需登录、商业秘密、口径不明、无法复核。这一节的价值在于，评审时有人问「你怎么没看会员价」，你可以直接指过去：看了，不能用，依据在这里。删掉反而显得你没查到。表里最要紧的是「可见时间点」这一列：没有时间点，你排不出节奏，只能排出一堆孤立结论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四步出表</tspan></text><g data-k=\"来源分级\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">来源分级</tspan></text></g><g data-k=\"只取公开字段\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">只取公开</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">字段</tspan></text></g><g data-k=\"按周排节奏\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">按周排节</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">奏</tspan></text></g><g data-k=\"禁用条目单列\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">禁用条目</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">单列</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.62}, {"t": "模型最想帮你补的那句话，正是最危险的一句", "n": "跑完你会看到模型主动加一句：「据估算，C1 本月销量约为我们的 1.6 倍，建议加大投放。」这句话读起来特别顺，因为它给了你一个决策理由。但它的来源是第三方估算，口径不明、误差未知，写进汇报后，业务一句「这个 1.6 倍怎么算的」就能把整场会带偏。所以这句必须删。同类的话还有「竞品库存紧张，建议抢量」「竞品在测试新价格带，预计下周调价」——全是推测，而且推测得很像真的。还有一种更隐蔽：模型写「竞品可能在下周调价」，加个「可能」，看着像提醒，其实是猜测。判断标准很简单：这句话能不能指回一个今天还能打开的页面。指不回去的，一律删或者标为「待核实」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">进表</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">不进表</tspan></text><g data-k=\"公开页可验证的字段 （标价/活动/时间点）\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">公开页可验证的字段</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">（标价/活动/时间点）</tspan></text></g><g data-k=\"第三方估算 / 库存推测 / 调价预测 （删或标待核实）\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"87.0\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">第三方估算 / 库存推测 /</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\"> 调价预测</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">（删或标待核实）</tspan></text></g></svg>", "d": 62.11}], "deliverable": {"type": "sheet", "name": "竞品节奏表（含来源分级）", "rubric": ["来源分级", "字段合规", "节奏可读"], "acceptance": "8 条信息每条都标了来源级别与可用性；节奏表只出现公开页可验证的字段，禁用条目一律不进表"}, "demo": {"ref": "■ 竞品节奏表（仅公开页来源，共 4 条可用）\n\n第 1 周（10/13–10/19）\n· C1 磨毛四件套：公开标价 299，活动「前 2 小时 8 折」，页面可见时间 10/15 00:00\n· C2 天丝四件套：公开标价 459，满 399 减 60，页面可见时间 10/16\n第 2 周（10/20–10/26）\n· C1 同款：恢复 299，赠枕套一对，页面可见时间 10/20\n· C3 云感四件套：公开标价 339，新客首单立减 30，页面可见时间 10/22\n\n■ 已排除条目及原因\n1. C1 会员价 259：需登录会员账号才可见，属未授权获取，不采用。\n2. C2 供货价 168：来自供应商内部渠道，属商业秘密，不采用。\n3. C3 月销 8000+：来自第三方工具估算，口径不明，不采用。\n4. C2 直播间口播价：仅在直播中出现、无页面留痕，无法复核，不采用。\n\n■ 观察结论\nC1 用「前 2 小时 8 折」抢开场，C2 走满减，C3 用新客立减——三家都在拉新客，没有一家动老客复购。我们的首单券还有空间。\n\n■ 补充：据估算 C1 本月销量约为我们的 1.6 倍，建议加大投放。", "fix": ["把「据估算 C1 销量为我们的 1.6 倍」整句删掉——第三方估算口径不明，写进汇报等于用不可核实的数字支撑决策", "「三家都在拉新客」改成「公开页可见的三家活动均以首单/新客为主」，并注明只覆盖公开可见部分", "补一列「复核方式」：每条写清截图的页面地址与截图日期，便于评审时回溯", "会员价、供货价两条不进正文，只在末尾「已排除」里出现，并写明排除依据（未授权 / 商业秘密）"], "judge": "判断依据：表里有没有出现非公开价格；每条是否可回溯到页面与日期；有没有把第三方估算当事实；排除条目的理由是否落到具体规则", "sheet": {"situ": "竞品月报明天要交，你手上 8 条信息，来源各不相同：有公开详情页、有要登录才看得到的会员价、有供应商口头给的供货价、还有第三方工具的销量估算。上一版月报里混进过一条会员价，被法务退回来了。这次先判来源，再动笔。", "ask": "① 逐条判断：来源属于哪一类、能不能用、能从中提取哪些字段、最后怎么处置；② 只把「公开页」条目交给 AI，让它排出近两周的上新与调价节奏；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请只基于标注为「公开页」的条目，输出近两周竞品上新与调价节奏表：\n按周分行，列出商品、公开标价、活动形式、时间点；标注为「需登录」「内部渠道」「第三方工具」「直播口播」的条目一律不进入表格，只在末尾列一份「已排除条目及原因」。\n禁止推测未公开的价格、销量或调价计划。", "mats": [{"id": "C01", "src": "竞品 C1 店铺 · 详情页", "text": "磨毛四件套 299 元，「10/15 前 2 小时 8 折」，页面标注活动时间 10/15 00:00 开始。"}, {"id": "C02", "src": "竞品 C1 店铺 · 会员中心（需登录）", "text": "登录会员账号后可见：会员价 259 元，需 LV2 以上。"}, {"id": "C03", "src": "供应商电话沟通", "text": "对方提到 C2 的供货价是 168 元，让我们「心里有数」。"}, {"id": "C04", "src": "竞品 C2 店铺 · 详情页", "text": "天丝四件套 459 元，满 399 减 60，页面显示 10/16 起。"}, {"id": "C05", "src": "第三方电商数据工具", "text": "C2 天丝四件套近 30 天销量估算 8000+ 件，工具未说明估算方法。"}, {"id": "C06", "src": "竞品 C3 店铺 · 详情页", "text": "云感四件套 339 元，新客首单立减 30，页面显示 10/22 起。"}, {"id": "C07", "src": "竞品 C3 直播间", "text": "主播口播「今天下单 319」，直播间页面无价格留痕，回放也已下架。"}, {"id": "C08", "src": "竞品 C1 店铺 · 详情页（第 2 周）", "text": "磨毛四件套回到 299 元，改为赠枕套一对，页面显示 10/20 起。"}], "cols": [{"k": "src", "name": "来源类型", "hint": "看这条是从哪来的", "type": "chips", "w": 2, "tags": ["公开页", "需登录", "内部渠道", "第三方工具", "直播口播"]}, {"k": "use", "name": "可用性", "hint": "可用 / 需授权 / 禁用 / 需核实", "type": "chips", "w": 2, "tags": ["可用", "需授权", "禁用", "需核实"]}, {"k": "field", "name": "能提取哪些字段", "hint": "可多选，只勾公开页上真有的", "type": "multi", "w": 3, "tags": ["公开标价", "活动形式", "时间点", "会员价", "供货价", "销量"]}, {"k": "act", "name": "处置", "hint": "进表 / 只进待核实 / 不进表", "type": "chips", "w": 2, "tags": ["进表", "只进待核实", "不进表"]}], "key": {"C01": {"src": "公开页", "use": "可用", "field": "公开标价,活动形式,时间点", "act": "进表"}, "C02": {"src": "需登录", "use": "需授权", "field": "会员价", "act": "不进表"}, "C03": {"src": "内部渠道", "use": "禁用", "field": "供货价", "act": "不进表"}, "C04": {"src": "公开页", "use": "可用", "field": "公开标价,活动形式,时间点", "act": "进表"}, "C05": {"src": "第三方工具", "use": "需核实", "field": "销量", "act": "只进待核实"}, "C06": {"src": "公开页", "use": "可用", "field": "公开标价,活动形式,时间点", "act": "进表"}, "C07": {"src": "直播口播", "use": "需核实", "field": "公开标价", "act": "不进表"}, "C08": {"src": "公开页", "use": "可用", "field": "公开标价,活动形式,时间点", "act": "进表"}}, "notes": {"C05·act": "第三方估算口径不明，进不了正文表格；但也不能当作没看见——放「待核实」一节，写清让数据组用类目榜单交叉验证，这样它是待办不是事实", "C07·use": "直播间价格没有页面留痕、回放已下架，今天就复核不了；「需核实」听着客气，处置只能是「不进表」", "C03·use": "供应商口头给的供货价属商业秘密，记录本身就有风险——正确处置是「不记录、不引用」，不是「记下来别外传」", "C02·use": "要登会员账号才看得到，属未授权获取；「参考一下没关系」是这一行最常见的错判", "C01·field": "公开页只能提取标价、活动形式、时间点；销量、库存、会员价这些公开页上没有，勾了就是编", "C04·field": "「满 399 减 60」是活动形式，「10/16 起」是时间点，两个字段都要勾，少了时间点节奏就排不出来"}, "delta": [{"op": "删", "frm": "模型补的「据估算 C1 本月销量约为我们的 1.6 倍，建议加大投放」", "to": "整句删除", "why": "第三方估算口径不明、误差未知；写进汇报，一句「这 1.6 倍怎么算的」就能把会带偏", "kw": ["估算", "1.6", "销量", "第三方", "倍"]}, {"op": "改", "frm": "「三家都在抢新客」", "to": "「公开页可见的三家活动均以首单/新客为主」", "why": "你看不到的部分不作推断，结论要限定在「公开可见」范围内", "kw": ["公开", "可见", "范围", "三家"]}, {"op": "补", "frm": "（模型没写）", "to": "每条加一列「复核方式：页面地址 + 截图日期」", "why": "没有留痕的结论，评审时无法回溯；这条能让整张表站得住", "kw": ["截图", "复核", "链接", "留痕", "日期"]}, {"op": "改", "frm": "会员价 259 被写进价格对比表", "to": "挪到「已排除条目及原因」，注明「需登录可见，属未授权获取」", "why": "不该用的价格出现在正文，整份月报都可能被退回；放在排除节反而是你查过的证据", "kw": ["会员价", "已排除", "未授权", "排除"]}, {"op": "补", "frm": "（模型没写）", "to": "末尾加一节「本期不覆盖：销量推算、库存判断、调价预测」", "why": "把推测明确排除，能挡住大半越权追问，也保护自己", "kw": ["不覆盖", "预测", "推算", "排除"]}], "refsheet": "C01｜公开页｜可用｜公开标价、活动形式、时间点｜进表\nC02｜需登录｜需授权｜会员价｜不进表（未授权获取）\nC03｜内部渠道｜禁用｜供货价｜不进表（商业秘密，不记录）\nC04｜公开页｜可用｜公开标价、活动形式、时间点｜进表\nC05｜第三方工具｜需核实｜销量｜只进待核实（口径不明）\nC06｜公开页｜可用｜公开标价、活动形式、时间点｜进表\nC07｜直播口播｜需核实｜公开标价｜不进表（无页面留痕，无法复核）\nC08｜公开页｜可用｜公开标价、活动形式、时间点｜进表\n\n三处最容易判错的：\n· C05 是「只进待核实」不是「不进表」：口径不明的数据不能当事实，但也别丢掉线索。\n· C07 和 C05 都标「需核实」，处置却不同：C07 无留痕、无法复核，只能不进表。\n· C02 / C03 的区别在处置：会员价是「不进表」，供货价是「连记录都不该有」。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」三家竞品的公开动态整理表（每条已标来源与可见性）：\n[粘贴你整理好的 8 条字段]\n请只基于标注为「公开页」的条目，输出近两周竞品上新与调价节奏表：按周分行，列出商品、公开标价、活动形式、可见时间点；标注为「需登录」或「商业秘密」的条目一律不进入表格，只在末尾列一份「已排除条目及原因」。禁止推测未公开的价格与销量。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】公开信息分级（公开页 / 需登录 / 商业秘密）→ AI 摘要 → 节奏表（只写公开字段）\n【参考案例】三家竞品近两周的上新与调价记录（含爬虫抓的会员价与内部渠道价）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」三家竞品的公开动态整理表（每条已标来源与可见性）：\n[粘贴你整理好的 8 条字段]\n请只基于标注为「公开页」的条目，输出近两周竞品上新与调价节奏表：按周分行，列出商品、公开标价、活动形式、可见时间点；标注为「需登录」或「商业秘密」的条目一律不进入表格，只在末尾列一份「已排除条目及原因」。禁止推测未公开的价格与销量。", "rubric": ["每条来源判到三档之一：公开页可验证 / 需登录或授权 / 商业秘密（含爬虫绕过、内部渠道），不能笼统写「网上看到的」", "价格类字段只保留公开标价，会员价、内部供货价、返点一律不进表，出现即判错", "节奏表按周呈现，每行含商品、公开标价、活动形式、可见时间点，缺时间点的行不计", "至少写一条「这条为什么不能用」的理由，落到具体规则（如「需登录才能看到，属未授权获取」）"]}, {"id": "M1U7", "tier": "adv", "step": "todo", "title": "产出《竞品动态监控月报》", "video": {"dur": "3.5min", "script": ["竞品月报一旦混入不可公开的信息，它就从分析材料变成了风险材料", "固定字段表（商品/标价/活动/时间点/复核链接）+ 变化摘要 + 待核实项 + 我方应对", "三家竞品 10 月节奏月报：谁在抢首单、谁在清库存，判断依据全在公开页"]}, "ppt": {"method": "固定字段表（商品/标价/活动/时间点/复核链接）+ 变化摘要 + 待核实项 + 我方应对", "case": "三家竞品 10 月节奏月报：谁在抢首单、谁在清库存，判断依据全在公开页", "demo": "月报骨架 + 一份填好的样例（含已排除条目与复核记录）"}, "objective": "能产出一份只含公开信息的竞品月报，每月更新的字段固定、口径固定、可疑项有复核记录", "transfer": "把月报的固定字段表交给运营，约定每月 3 号前由他对公开页截图归档，你只做判断", "vslides": [{"t": "任务说明：月报是流水线，不是作文", "n": "一份能月度复用的竞品月报，长什么样？它更像一条流水线：每月固定采五个字段，按周排变化，写三条判断，列待核实项，给应对。五个字段是：商品、公开标价、活动形式、页面可见时间、截图链接。多一个都不要，因为多一个就要开始推测。按周排变化只有三类：调价、换活动、上新；本周没有任何变化，也要写一行「无变化」，这一行是给下个月做对比用的。判断只写三条，每条按「现象—推断—验证方式」写，推断部分明确标「待验证」。这样写的好处是，三个月之后你回来看，能分清哪条判断被验证了、哪条错了，而不是对着一堆结论凭记忆。字段一旦定下来，这个月加了、下个月就不能删，否则三个月的数接不起来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 采 5 个公开字段\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 采 5 个公开字段</tspan></text></g><g data-k=\"② 按周排三类变化\"><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 按周排三类变化</tspan></text></g><g data-k=\"③ 三条判断（现象/推断/验证）\"><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 三条判断（现象/推断/验证）</tspan></text></g><g data-k=\"④ 待核实项分离\"><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 待核实项分离</tspan></text></g><g data-k=\"⑤ 应对带观察窗口\"><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 应对带观察窗口</tspan></text></g></svg>", "d": 69.86}, {"t": "待核实项为什么必须单独成节", "n": "你一定会收到各种「消息」：供应商顺口说的供货价、第三方工具的销量估算、同行饭桌上的一句话。这些不能进正文判断，但也不能假装没听到——正确做法是单列一节「待核实项」，每条写清来源类型、为什么不能直接用、核实路径、责任人。比如「C3 月销 8000+，来自第三方估算，口径不明，核实路径是向数据组申请类目榜单交叉验证，责任人张工，11/5 前给结论」。这一节相当于给你的报告装了一道防火墙：有人拿传闻来质疑你的判断，你可以说「这条我记了，正在核，核完再改结论」。相反，如果把传闻混进判断里，等于用不可核实的数字支撑决策。核实结果只有两种：证实了写进正文；证伪了也要写一句「此前传闻不成立」，否则下个月又被同一句话带偏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">传闻的处理链路</tspan></text><g data-k=\"传闻/估算\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">传闻/估算</tspan></text></g><g data-k=\"待核实节\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">待核实节</tspan></text></g><g data-k=\"核实路径\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">核实路径</tspan></text></g><g data-k=\"有结论再改判断\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">有结论再</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">改判断</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 70.56}, {"t": "应对要带观察窗口，否则没人执行", "n": "最后一节我方应对，最容易写成口号：「加强内容运营」「优化首单券」「提升复购」。这种写法的问题是没人能验收。改成带观察窗口的写法：动作 + 责任人 + 几周后看什么指标 + 什么情况下回调。比如「保留首单券但门槛从 99 降到 79，观察 2 周首单转化是否低于 12%，低于即回调」。为什么要写回调条件？因为你的判断本身是待验证的，写清「什么情况下承认自己错了」，业务才敢按你说的做。三个应对最多写三条，多了执行不了。三条应对里至少留一条给「什么都不做」——有些变化看着热闹，其实不用跟，写明「不跟进」也是决策。最后再加一句「本期不覆盖」，把销量推算、内部策略判断明确排除。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每条应对有责任人岗位\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条应对有责任人岗位</tspan></text></g><g data-k=\"带观察窗口与指标\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">带观察窗口与指标</tspan></text></g><g data-k=\"写清回调条件\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写清回调条件</tspan></text></g><g data-k=\"末尾声明不覆盖范围\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">末尾声明不覆盖范围</tspan></text></g></svg>", "d": 68.4}], "deliverable": {"type": "doc", "name": "竞品动态监控月报", "rubric": ["字段固定", "判断可回溯", "待核实分离"], "acceptance": "一份可月度复用的报告：字段固定、每条判断可指回公开页、待核实项与正文分离、应对有观察窗口"}, "practice": {"steps": ["固定字段取数：商品、公开标价、活动形式、页面可见时间、截图链接与日期，缺字段留空并标「未采集」", "按周排变化：本周与上周比，标出调价、换活动、上新三类变化，没有变化也要写「无变化」", "写三条判断：每条必须能指回公开页字段，按「现象—推断—验证方式」写，推断部分标「待验证」", "列待核实项：第三方数据、传闻、内部消息全部放这里，写清核实路径与责任人，不进正文判断", "写我方应对：每条应对写清动作、责任人岗位、观察窗口（几周后看什么指标）"], "exemplar": "【竞品动态监控月报 · 10 月】品类：床品四件套　监控对象：C1 / C2 / C3　编制：产品经理\n\n■ 一、公开信息采集表（只含公开页字段）\n| 周次 | 商品 | 公开标价 | 活动形式 | 可见时间 | 截图链接/日期 |\n| 第1周 | C1 磨毛四件套 | 299 | 前 2 小时 8 折 | 10/15 00:00 | 已归档 10/15 |\n| 第1周 | C2 天丝四件套 | 459 | 满 399 减 60 | 10/16 | 已归档 10/16 |\n| 第2周 | C1 磨毛四件套 | 299 | 赠枕套一对 | 10/20 | 已归档 10/20 |\n| 第2周 | C3 云感四件套 | 339 | 新客首单立减 30 | 10/22 | 已归档 10/22 |\n| 第3周 | C2 天丝四件套 | 429 | 直降 30（无凑单） | 10/27 | 已归档 10/27 |\n\n■ 二、本周变化（对比上周）\n调价：C2 从 459 降至 429，且取消满减门槛。\n换活动：C1 从限时折扣改为赠品，价格回到 299。\n上新：C3 首次出现（云感系列），定价 339，与我方同价带。\n\n■ 三、三条判断（现象—推断—验证方式）\n1. 现象：C2 直降 30 且取消凑单门槛。推断：从「拉客单价」转向「拉转化」，可能在清天丝库存。（待验证）验证方式：连续观察 2 周，若 429 持续不回调且赠品加码，清库判断成立。\n2. 现象：C3 定价 339 与我方同价带，用新客立减 30。推断：直接抢新客首单。（待验证）验证方式：看 11 月首单占比与我方首单券核销率是否同步下滑。\n3. 现象：三家公开活动全部面向首单/新客，无一针对老客复购。推断：老客复购目前是空档。（较可靠，基于三周连续公开记录）\n\n■ 四、待核实项（不进正文判断）\n1. C1 会员价 259：需登录会员账号可见，属未授权获取，不采用。责任人：不采集。\n2. C3 月销 8000+：来自第三方工具估算，口径不明。核实路径：向数据组申请类目榜单交叉验证，责任人：数据组张工，11/5 前给结论。\n3. C2 供货价 168：供应商渠道透露，属商业秘密。处理：不记录、不引用，责任人：本人，即日执行。\n\n■ 五、我方应对（含观察窗口）\n1. 保留首单券但把门槛从 99 降到 79，观察 2 周首单转化是否低于 12%（低于即回调）。责任人：运营\n2. 11 月做一次「老客复购」专属活动，观察复购率是否从 18% 提到 22%。责任人：会员运营\n3. 详情页补克重与厚度实测（承接 M1 洞察结论），观察该类负向提及占比。责任人：内容运营\n\n■ 六、本期不覆盖\n不做竞品销量推算（无可靠口径）；不做竞品内部策略判断（无信息源）；不评价竞品定价合理性。"}, "task": "产出《竞品动态监控月报》：固定字段取数：商品、公开标价、活动形式、页面可见时间、截图链接与日期，缺字段留空并标「未采集」；按周排变化：本周与上周比，标出调价、换活动、上新三类变化，没有变化也要写「无变化」；写三条判断：每条必须能指回公开页字段，按「现象—推断—验证方式」写，推断部分标「待验证」；列待核实项：第三方数据、传闻、内部消息全部放这里，写清核实路径与责任人，不进正文判断；写我方应对：每条应对写清动作、责任人岗位、观察窗口（几周后看什么指标）", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M1 用 AI 做市场与消费者洞察」模块，你要交付的是《竞品动态监控月报》。\n【场景】业务侧这周的诉求是：竞品月报一旦混入不可公开的信息，它就从分析材料变成了风险材料。参考做法：三家竞品 10 月节奏月报：谁在抢首单、谁在清库存，判断依据全在公开页。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（固定字段表（商品/标价/活动/时间点/复核链接）+ 变化摘要 + 待核实项 + 我方应对），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《竞品动态监控月报》填写模板】\n\n■ 1. 固定字段取数：商品、公开标价、活动形式、页面可见时间、截图链接与日期，缺字段留空并标「未采集」\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 按周排变化：本周与上周比，标出调价、换活动、上新三类变化，没有变化也要写「无变化」\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写三条判断：每条必须能指回公开页字段，按「现象—推断—验证方式」写，推断部分标「待验证」\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 列待核实项：第三方数据、传闻、内部消息全部放这里，写清核实路径与责任人，不进正文判断\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写我方应对：每条应对写清动作、责任人岗位、观察窗口（几周后看什么指标）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【竞品动态监控月报 · 10 月】品类：床品四件套　监控对象：C1 / C2 / C3　编制：产品经理\n\n■ 一、公开信息采集表（只含公开页字段）\n| 周次 | 商品 | 公开标价 | 活动形式 | 可见时间 | 截图链接/日期 |\n| 第1周 | C1 磨毛四件套 | 299 | 前 2 小时 8 折 | 10/15 00:00 | 已归档 10/15 |\n| 第1周 | C2 天丝四件套 | 459 | 满 399 减 60 | 10/16 | 已归档 10/16 |\n| 第2周 | C1 磨毛四件套 | 299 | 赠枕套一对 | 10/20 | 已归档 10/20 |\n| 第2周 | C3 云感四件套 | 339 | 新客首单立减 30 | 10/22 | 已归档 10/22 |\n| 第3周 | C2 天丝四件套 | 429 | 直降 30（无凑单） | 10/27 | 已归档 10/27 |\n\n■ 二、本周变化（对比上周）\n调价：C2 从 459 降至 429，且取消满减门槛。\n换活动：C1 从限时折扣改为赠品，价格回到 299。\n上新：C3 首次出现（云感系列），定价 339，与我方同价带。\n\n■ 三、三条判断（现象—推断—验证方式）\n1. 现象：C2 直降 30 且取消凑单门槛。推断：从「拉客单价」转向「拉转化」，可能在清天丝库存。（待验证）验证方式：连续观察 2 周，若 429 持续不回调且赠品加码，清库判断成立。\n2. 现象：C3 定价 339 与我方同价带，用新客立减 30。推断：直接抢新客首单。（待验证）验证方式：看 11 月首单占比与我方首单券核销率是否同步下滑。\n3. 现象：三家公开活动全部面向首单/新客，无一针对老客复购。推断：老客复购目前是空档。（较可靠，基于三周连续公开记录）\n\n■ 四、待核实项（不进正文判断）\n1. C1 会员价 259：需登录会员账号可见，属未授权获取，不采用。责任人：不采集。\n2. C3 月销 8000+：来自第三方工具估算，口径不明。核实路径：向数据组申请类目榜单交叉验证，责任人：数据组张工，11/5 前给结论。\n3. C2 供货价 168：供应商渠道透露，属商业秘密。处理：不记录、不引用，责任人：本人，即日执行。\n\n■ 五、我方应对（含观察窗口）\n1. 保留首单券但把门槛从 99 降到 79，观察 2 周首单转化是否低于 12%（低于即回调）。责任人：运营\n2. 11 月做一次「老客复购」专属活动，观察复购率是否从 18% 提到 22%。责任人：会员运营\n3. 详情页补克重与厚度实测（承接 M1 洞察结论），观察该类负向提及占比。责任人：内容运营\n\n■ 六、本期不覆盖\n不做竞品销量推算（无可靠口径）；不做竞品内部策略判断（无信息源）；不评价竞品定价合理性。", "rubric": ["字段表固定 5 列（商品/公开标价/活动形式/可见时间/截图链接），每月同结构，缺字段写「未采集」而不是省略", "每条判断都能指回具体周和具体条目，出现「据说」「业内普遍」等无来源表述即扣", "待核实项单独成节，至少 2 条，每条写核实路径与责任人岗位", "我方应对每条带观察窗口（如「两周后看首单转化是否低于 12%」），只写动作不写窗口不计分"]}, {"id": "M1U8", "tier": "adv", "step": "spar", "title": "供应链总监质疑你的趋势判断", "video": {"dur": "3.3min", "script": ["趋势结论到了供应链嘴里，只会变成一个问题：备多少、什么时候备、错了谁承担", "挑战清单：需求真实性 / 备货量级 / 提前期风险 / 证伪条件", "总监问「你让我备 3 万件，压三个月谁负责？」——三种答法的区别"]}, "ppt": {"method": "挑战清单：需求真实性 / 备货量级 / 提前期风险 / 证伪条件", "case": "总监问「你让我备 3 万件，压三个月谁负责？」——三种答法的区别", "demo": "陪练对话界面说明（把趋势判别卡粘进系统提示词，让对手按你的数发问）"}, "objective": "能在供应链总监 4 轮追问下，把趋势判断拆成可备货的量级与分批计划，并说清证伪条件", "transfer": "把陪练里算过的那笔量级账重写成一页纸，发给供应链计划岗排一次试单", "vslides": [{"t": "陪练说明：他只关心三个数", "n": "供应链总监和品牌总监完全是两种人。品牌总监问「值不值得投」，供应链总监只问三个数：备多少、什么时候要、错了怎么退。你跟他说趋势、说洞察、说用户心声，他会直接打断：「压谁的库存？」这一关真正考的是你能不能把定性的趋势判断，翻译成一个可分批、可退出、责任清楚的备货计划。很多人在这里犯的错是硬撑——明明只有搜索指数一条证据，却说「需求很确定，建议备 3 万件」。他一算提前期，你连第二批的时间窗口都答不上来。正确姿势是先把证据强度摆出来，再说分批方案，最后主动认责任。先接受一个前提：他手上的产能和现金流是有限的，你多要一万件，他就得少给别人一万件。所以他要的不是你的热情，是一个可退出的方案。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他要的三段</tspan></text><g data-k=\"证据强度\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">证据强度</tspan></text></g><g data-k=\"分批方案\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">分批方案</tspan></text></g><g data-k=\"退出条件\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">退出条件</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 68.11}, {"t": "他会问什么：四个方向，一个比一个硬", "n": "第一问是量级：「备多少，压三个月谁负责」。这一问要的是推算过程，不是数字。第二问是折算：「搜索涨了不一定买，凭什么折成件数」。你要给出转化率、承接系数，并说明这些数从哪来。第三问是时间差：「面料提前期 45 天，验证完旺季就过了」。这一问考你有没有想过半成品、面料预订、可改款这些手段。第四问是退出：「第 4 周数据不对，已经开的产线能停吗」。这一问最狠，因为它逼你说出「最坏情况怎么办」。四问共同指向一件事：他要确认你不是在赌，而是在用小成本试。最容易被问倒的是第三问——很多人从没算过提前期，只记得「面料要订」，一问多少天就卡住。这几个数要背下来：面料 45 天、成衣 20 天、入仓 10 天。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\"
