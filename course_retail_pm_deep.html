<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 配音走 CDN：提前建连，省掉首段 100–300ms 的 DNS/TLS 时间 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<title>零售电商 × 产品经理 AI 实战 · 深版课程（M0/M1/M2/M3/M4/M5/M6/M7 · 64 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex:none}
  header h1{font-size:17px;font-weight:700;white-space:nowrap}
  header h1 span{display:none}   /* 课程副标题（样板间/单元数/行业机构产品）默认不显示：学员只需要课程名 */
  /* 顶栏只留三样：课程名、一条进度条、一个设置入口 */
  .hp{flex:1;height:5px;background:#e8eefb;border-radius:99px;overflow:hidden;max-width:560px;min-width:70px}
  .hp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1a5cff,#4f8bff);border-radius:99px;transition:width .35s}
  .gear{margin-left:auto;width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;font-size:15px;line-height:1}
  .gear:hover{border-color:var(--blue);color:var(--blue)}
  .cfg-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .cfg-row label{color:var(--mut);width:40px;flex:none}
  .cfg-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .cfg-sep{border:none;border-top:1px solid var(--line);margin:13px 0}
  .cfg-label{display:flex;align-items:center;gap:8px;text-align:left;font-size:12px;font-weight:700;color:var(--blue-d);margin:14px 0 5px;letter-spacing:.02em}
  .cfg-hint{text-align:left;font-size:11.8px;color:var(--mut);line-height:1.65;margin:3px 0 2px}
  .cfg-row label{width:auto;min-width:66px}
  .cfg-note{font-size:11.5px;color:#8a6d1f;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 9px;line-height:1.6;margin:6px 0}
  .ident-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#eef4ff;border:1px solid #c7d9ff;color:var(--blue-d);border-radius:999px;padding:3px 10px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;flex:1;min-height:0}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  /* 模块头改为两层：标题独占一行（两行截断），进度/短板/测验标签下移一行，
     避免标签把标题挤成「M1 写出第一句好…」这种半句话。 */
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;background:#fbfcff}
  .mod-h .mh-top{display:flex;gap:7px;align-items:flex-start}
  .mod-h .mh-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
  .mod-h .mid{flex-shrink:0}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  /* 模块标题：原来代码里写死 slice(0,12) 会把标题砍成半句（如「M1 写出第一句好用的提」），
     改为最多两行、超出加省略号，标题完整可读且不撑破左栏。 */
  .mod-h .mtitle{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;word-break:break-word}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  /* 单元标题原来写死 slice(0,11)，长标题被切成半句；改为单行省略，完整语义优先 */
  .unit .ut{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vwrap{position:relative}
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  /* 底部留出字幕条的高度：字幕是「占位」而不是「盖住」PPT 最后一行 */
  .vp .stage{position:absolute;inset:0;overflow:hidden;background:#eef2f7;pointer-events:none;--k:1}
  /* ===== v161 吉利式 PPT 版式：1600×900 画布，所有尺寸乘 --k 等比缩放 ===== */
  .slide{position:absolute;inset:0;display:none;flex-direction:column;text-align:left;color:#1a2430;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .slide.on{display:flex}
  /* ---- 内页：白底 + 顶栏色条 + 左上定位 + 大标题 + 画面 + 右下署名 ---- */
  .slide.sl{background:#fff;padding:calc(52px*var(--k)) calc(74px*var(--k)) calc(92px*var(--k))}
  .slide.sl:before{content:'';position:absolute;left:0;top:0;right:0;height:calc(6px*var(--k));
    background:linear-gradient(90deg,#0a3d91,#3b7bff 62%,rgba(59,123,255,0))}
  .sl-kick{flex:none;font-size:calc(19px*var(--k));letter-spacing:.14em;color:#4c6d99;font-weight:600}
  .sl-h{flex:none;margin:calc(14px*var(--k)) 0 0;font-size:calc(42px*var(--k));line-height:1.3;
    font-weight:800;color:#0a3d91;letter-spacing:.01em;max-width:calc(1420px*var(--k))}
  .sl-h b{position:relative;z-index:0;font-weight:800}
  .sl-h b:after{content:'';position:absolute;left:-3px;right:-3px;bottom:calc(4px*var(--k));
    height:calc(12px*var(--k));background:rgba(120,175,235,.40);z-index:-1}
  .sl-band{flex:none;margin-top:calc(18px*var(--k));background:#eef4fb;
    border-left:calc(5px*var(--k)) solid #0a3d91;padding:calc(13px*var(--k)) calc(20px*var(--k));
    font-size:calc(25px*var(--k));font-weight:600;color:#12406f;line-height:1.5;
    border-radius:0 calc(8px*var(--k)) calc(8px*var(--k)) 0;max-width:calc(1452px*var(--k))}
  .sl-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    margin-top:calc(10px*var(--k))}
  .sl-body svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  .sl-tag{position:absolute;right:calc(74px*var(--k));bottom:calc(100px*var(--k));background:#0a3d91;color:#fff;
    font-size:calc(15px*var(--k));letter-spacing:.04em;padding:calc(5px*var(--k)) calc(13px*var(--k));
    border-radius:calc(3px*var(--k))}
  /* v217 主讲老师介绍页 */
  .tc-wrap{position:relative;z-index:1;display:flex;align-items:center;gap:calc(82px*var(--k));width:100%;height:100%}
  .tc-photo{flex:0 0 calc(520px*var(--k));height:calc(700px*var(--k));border-radius:calc(18px*var(--k));
    overflow:hidden;background:#12294a;border:1px solid rgba(255,255,255,.18);
    box-shadow:0 calc(20px*var(--k)) calc(60px*var(--k)) rgba(0,0,0,.28)}
  .tc-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .tc-body{flex:1;min-width:0}
  .tc-kick{font-size:calc(21px*var(--k));font-weight:600;letter-spacing:.12em;color:#9dc4ee}
  .tc-name{margin:calc(18px*var(--k)) 0 0;font-size:calc(76px*var(--k));font-weight:800;color:#fff;line-height:1.2}
  .tc-title{margin-top:calc(10px*var(--k));font-size:calc(28px*var(--k));color:rgba(255,255,255,.72);font-weight:600}
  .tc-line{width:calc(120px*var(--k));height:calc(3px*var(--k));background:#6fb0ff;margin:calc(30px*var(--k)) 0}
  .tc-points{display:flex;flex-direction:column;gap:calc(15px*var(--k))}
  .tc-points div{display:flex;gap:calc(16px*var(--k));align-items:flex-start}
  .tc-points b{font-size:calc(19px*var(--k));font-weight:800;color:#7db8f2;line-height:1.6;flex:0 0 auto}
  .tc-points span{font-size:calc(23px*var(--k));font-weight:600;color:rgba(255,255,255,.93);line-height:1.6}
  .tc-sign{margin-top:calc(34px*var(--k));font-size:calc(17px*var(--k));color:rgba(255,255,255,.5);letter-spacing:.06em}
  @media(max-width:900px){.tc-wrap{gap:calc(30px*var(--k))}.tc-photo{flex-basis:calc(380px*var(--k))}.tc-name{font-size:calc(56px*var(--k))}}
  /* ---- 封面 / 结束页：深蓝渐变 + 右下圆环 ---- */
  .slide.cv{background:linear-gradient(122deg,#07182b 0%,#0d2c4e 46%,#1a4b84 100%);color:#fff;overflow:hidden;
    justify-content:flex-start;padding:calc(104px*var(--k)) calc(100px*var(--k)) calc(96px*var(--k))}
  .slide.cv:after{content:'';position:absolute;right:calc(-190px*var(--k));top:calc(150px*var(--k));
    width:calc(780px*var(--k));height:calc(780px*var(--k));border:1px solid rgba(255,255,255,.10);
    border-radius:50%;pointer-events:none}
  .cv-main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;width:100%}
  .cv-kick{flex:none;display:flex;align-items:center;font-size:calc(21px*var(--k));font-weight:600;
    letter-spacing:.06em;color:#9dc4ee}
  .cv-kick i{display:block;width:calc(34px*var(--k));height:calc(2px*var(--k));
    background:rgba(157,196,238,.55);margin:0 calc(16px*var(--k))}
  .cv-h{flex:none;margin:calc(26px*var(--k)) 0 0;font-weight:800;line-height:1.26;letter-spacing:.01em;
    color:#fff;max-width:calc(1300px*var(--k))}
  .cv-h b{font-weight:800;color:#8ec5ff}
  .cv-sub{flex:none;margin:calc(26px*var(--k)) 0 0;font-size:calc(25px*var(--k));
    color:rgba(255,255,255,.74);font-weight:500;line-height:1.6;max-width:calc(1180px*var(--k))}
  .cv-pts{flex:none;margin-top:calc(46px*var(--k));display:grid;grid-template-columns:repeat(3,1fr);
    gap:calc(18px*var(--k));width:100%;max-width:calc(1400px*var(--k))}
  .cv-pt{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
    border-radius:calc(10px*var(--k));padding:calc(20px*var(--k)) calc(22px*var(--k));
    display:flex;gap:calc(14px*var(--k));align-items:flex-start}
  .cv-pt b{font-size:calc(20px*var(--k));font-weight:800;color:#7db8f2;line-height:1.5;flex:0 0 auto}
  .cv-pt span{font-size:calc(21px*var(--k));font-weight:600;color:rgba(255,255,255,.92);line-height:1.5}
  /* 封面左下署名块：补住下半部留白，与吉利封面同位置同信息量 */
  .cv-note{position:absolute;left:calc(100px*var(--k));bottom:calc(150px*var(--k));z-index:1;
    font-size:calc(17px*var(--k));line-height:1.75;color:rgba(255,255,255,.55);letter-spacing:.04em}
  .cv-note i{display:block;font-style:normal;color:rgba(255,255,255,.8);font-weight:600;
    letter-spacing:.12em;margin-bottom:calc(8px*var(--k))}
  .cv-note div{display:flex;gap:calc(16px*var(--k))}
  .cv-note b{font-weight:600;color:rgba(255,255,255,.42);min-width:calc(74px*var(--k))}
  .cv-note span{color:rgba(255,255,255,.7)}
  .cv-foot{position:absolute;left:calc(100px*var(--k));right:calc(100px*var(--k));bottom:calc(70px*var(--k));
    z-index:2;display:flex;align-items:center;justify-content:space-between;
    padding-top:calc(18px*var(--k));border-top:1px solid rgba(255,255,255,.14)}
  .cv-credit{font-size:calc(17px*var(--k));color:rgba(255,255,255,.68);letter-spacing:.06em}
  .cv-no{margin-left:auto;font-size:calc(32px*var(--k));font-weight:800;color:rgba(255,255,255,.9);letter-spacing:.04em}
  .cv-no em{font-size:calc(17px*var(--k));font-style:normal;font-weight:600;
    color:rgba(255,255,255,.45);margin-left:calc(7px*var(--k))}
  /* ---- 结束页 ---- */
  .ce-mark{flex:none;display:flex;align-items:center;font-size:calc(21px*var(--k));
    font-weight:700;letter-spacing:.14em;color:#8ec5ff}
  .ce-mark:before{content:'';width:calc(46px*var(--k));height:calc(2px*var(--k));
    background:#8ec5ff;margin-right:calc(16px*var(--k))}
  .cv-end .cv-h{margin-top:calc(18px*var(--k))}
  .ce-pts{flex:none;margin-top:calc(28px*var(--k));width:calc(940px*var(--k))}
  .ce-lab{font-size:calc(18px*var(--k));font-weight:600;color:rgba(255,255,255,.45);
    letter-spacing:.14em;margin-bottom:calc(10px*var(--k))}
  .ce-pt{display:flex;gap:calc(16px*var(--k));align-items:flex-start;padding:calc(12px*var(--k)) 0;
    border-bottom:1px solid rgba(255,255,255,.09)}
  .ce-pt b{font-size:calc(19px*var(--k));font-weight:800;color:#7db8f2;flex:0 0 auto;line-height:1.6}
  .ce-pt span{font-size:calc(24px*var(--k));font-weight:600;color:rgba(255,255,255,.94);line-height:1.5}
  .ce-nx{flex:none;margin-top:calc(26px*var(--k));display:inline-flex;align-items:center;
    gap:calc(14px*var(--k));max-width:calc(1240px*var(--k))}
  .ce-nx i{font-style:normal;background:rgba(142,197,255,.18);color:#8ec5ff;font-size:calc(17px*var(--k));
    font-weight:700;padding:calc(6px*var(--k)) calc(14px*var(--k));border-radius:calc(4px*var(--k));flex:0 0 auto}
  .ce-nx-t{min-width:0}
  .ce-nx-t b{display:block;font-size:calc(22px*var(--k));color:rgba(255,255,255,.9);font-weight:600;line-height:1.45}
  .ce-wm{position:absolute;right:calc(64px*var(--k));bottom:calc(150px*var(--k));z-index:0;
    font-size:calc(300px*var(--k));font-weight:800;line-height:1;letter-spacing:-.05em;
    color:rgba(255,255,255,.055);pointer-events:none}
  /* ---- 段圆点：加深色胶囊底，深色封面和白底内页上都看得见 ---- */
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  /* 高亮跟讲解走：未讲到的条目压暗，讲到的那一项亮起（.k-on 由播放器逐项切换） */
  /* 白底上 .25 会把未讲到的条目压成看不见，取 .45：仍是「先暗后亮」，但不丢信息 */
  .slide.spot [data-k]{opacity:.45;transition:opacity .25s ease}
  .slide.spot [data-k].k-on{opacity:1;filter:drop-shadow(0 0 7px rgba(150,190,255,.9)) brightness(1.06)}
  /* 字幕：永远只有一行，超出省略；不吃掉画面（stage 已为它留了 60px） */
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 70%,rgba(0,0,0,0) 100%);color:#fff;font-size:17px;font-weight:600;line-height:1.35;padding:12px 20px 10px;min-height:0;display:block;text-align:center;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes capin{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
  .cap.swap{animation:capin .16s ease-out}
  @media (max-width:620px){
    .vp .stage{padding:0}
    .cap{font-size:13.5px;padding:8px 10px 6px;letter-spacing:0}
    .vbar{gap:7px}.play{padding:7px 12px;font-size:12.5px}.time{font-size:11.5px}
    /* 答案行在窄屏上改成自然折行：flex 会把「→ 标准答案」整体挤到下一行，读起来断得莫名其妙 */
    .anshd{display:block}
    .anshit{margin-left:0;display:block;margin-top:3px}
    .opb{margin-right:5px}
  }
  /* 窄屏：1600 画布缩到手机上字会糊，这里把字号放大、次要元素让位 */
  @media (max-width:620px){
    .cv-pts,.cv-note,.sl-tag{display:none}
    .cv-kick,.sl-kick{font-size:calc(30px*var(--k))}
    .cv-sub{font-size:calc(34px*var(--k))}

    s=s||{};
    if(!s.user&&!s.name) return '';
    if(s.role==='admin') return 'admin';
    /* v163：与企业账号同一套规则 —— 同一个 CO 账号多人用时按人分桶 */
    if(s.role==='ent'){
      /* v164：与企业账号同一套规则 —— 一个登录账号一份记录 */
      if(s.loginId) return 'ent:acct:'+s.loginId;
      return 'ent:'+(s.companyId||s.company||'');
    }
    if(s.loginType==='user'&&s.loginId) return 'user:'+s.loginId;
    if(s.loginType==='guest'&&s.loginId) return 'guest:'+(s.company||'')+':'+(s.phone||'')+':'+s.loginId;
    if(s.phone) return 'guest:'+(s.company||'')+':'+s.phone;
    if(s.loginId) return 'user:'+s.loginId;
    return '';
  }
  function myEmp(s){
    var es=J('ai_training_employees',[]); if(!Array.isArray(es)||!es.length) return null;
    var k=ownerKeyOf(s); if(!k) return null;
    var mine=es.filter(function(e){ return e && (e.ownerKey||'')===k; });
    if(mine.length) return mine[mine.length-1];
    /* 管理员本就可见全部档案，兜底给他最近一条；其他账号一律返回 null（显示空态，不泄漏） */
    if(s&&s.role==='admin') return es[es.length-1]||null;
    return null;
  }
  function mods(){ try{ return (typeof COURSE!=='undefined'&&COURSE&&COURSE.modules)||[]; }catch(e){ return []; } }
  function pg(){ try{ return (typeof prog!=='undefined'&&prog)||{units:{}}; }catch(e){ return {units:{}}; } }
  function stOf(u){ var p=pg(); return (p.units&&p.units[u.id])||{}; }
  function stat(){
    var ms=mods(),total=0,done=0,sc=0,scn=0;
    ms.forEach(function(m){ (m.units||[]).forEach(function(u){
      total++; var st=stOf(u);
      if(st.done) done++;
      if(typeof st.score==='number'){ sc+=st.score; scn++; }
    }); });
    return {total:total,done:done,pct:total?Math.round(done/total*100):0,avg:scn?Math.round(sc/scn):null};
  }
  function mins(u){ var d=(u&&u.video&&u.video.dur)||''; var m=String(d).match(/([\d.]+)/); return m?parseFloat(m[1]):0; }
  function plan(n){
    var out=[]; mods().forEach(function(m){ (m.units||[]).forEach(function(u){
      if(out.length>=n) return; if(!stOf(u).done) out.push({m:m,u:u});
    }); }); return out;
  }
  function pctBar(p){ return '<div class="lc-bar"><i style="width:'+Math.min(100,Math.max(0,p))+'%"></i></div>'; }

  function render(){
    var s=sess(), nm=(s.name||s.user||''), co=s.company||'', emp=myEmp(s), st=stat();
    var logged=!!(s&&(s.user||s.name));
    var roleTxt=(emp&&ROLE[emp.role])||'', indTxt=(emp&&IND[emp.industry])||'';
    var isGuest=(s&&s.loginType==='guest');
    var who=logged?(isGuest?(s.company||nm||'游客'):(nm||'已登录')):'未登录';
    var sub=!logged?'未登录 · 记录只存这台设备'
      :(isGuest?'游客身份 · 记录只存这台设备'
      :([co,roleTxt&&indTxt?(roleTxt+' × '+indTxt):(roleTxt||indTxt)].filter(Boolean).join(' · ')||'记录只存这台设备'));
    var h='<div class="lc-top"><div class="lc-av'+(logged?'':' guest')+'">'+(logged?esc(who).slice(0,1):'游')+'</div>'
      +'<div style="min-width:0"><div class="lc-hn">'+esc(who)+'</div><div class="lc-hm">'+esc(sub)+'</div></div>'
      +'<button class="lc-x" onclick="lcClose()" aria-label="关闭">✕</button></div><div class="lc-bd">';

    /* ① 最近测评 */
    var emTxt=(!logged?'本机记录':'')+((emp&&emp.date)?((logged?'':' · ')+esc(emp.date)):'');
    h+='<div class="lc-sec"><div class="lc-st">我的测评<em>'+emTxt+'</em></div>';
    if(emp){
      var qs=Array.isArray(emp.quizScores)?emp.quizScores:[];
      var base=(emp._baseResult&&typeof emp._baseResult.pct==='number')?emp._baseResult.pct:null;
      var skills=SKILL[emp.role]||[];
      var avg=qs.length?Math.round(qs.reduce(function(a,b){return a+(+b||0);},0)/qs.length*10)/10:null;
      h+='<div class="lc-grid">'
        +'<div class="lc-num"><b>'+(base!=null?base+'<small>%</small>':'—')+'</b><span>基础素养</span></div>'
        +'<div class="lc-num"><b>'+(avg!=null?avg+'<small>/4</small>':'—')+'</b><span>岗位能力均值</span></div>'
        +'<div class="lc-num"><b>'+(typeof emp.finalScore==='number'?emp.finalScore:'—')+'</b><span>结课测验</span></div></div>';
      var weak=[];
      qs.forEach(function(v,i){ if(typeof v==='number' && v<=1 && skills[i]) weak.push(skills[i]); });
      if(weak.length) h+='<div style="margin-top:9px">'+weak.slice(0,4).map(function(w){ return '<span class="lc-weak">短板 · '+esc(w)+'</span>'; }).join('')+'</div>';
      h+='<div class="lc-line" style="margin-top:8px">测评用于定学习起点；短板项对应的课程在等你的学习地图里已前置。</div>';
    } else {
      h+='<div class="lc-empty">还没有测评记录。先花 8 分钟测一次，课程会按你的短板排顺序，而不是从头刷到尾。<a href="app.html" style="color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap">去测一测 →</a></div>';
    }
    h+='</div>';

    /* ② 本课进度 */
    h+='<div class="lc-sec"><div class="lc-st">本课进度<em>'+(st.total||'—')+' 单元</em></div>'
      +pctBar(st.pct)
      +'<div class="lc-line"><b>'+st.pct+'%</b> · 已完成 <b>'+st.done+'</b> / '+st.total+' 单元'
      +(st.avg!=null?' · 练习均分 <b>'+st.avg+'</b>':'')+'</div></div>';

    /* ③ 接下来学什么 */
    var nx=plan(3), sum=0; nx.forEach(function(x){ sum+=mins(x.u); });
    h+='<div class="lc-sec"><div class="lc-st">接下来学什么<em>'+(nx.length?'约 '+Math.max(1,Math.round(sum))+' 分钟':'')+'</em></div>';
    if(nx.length){
      nx.forEach(function(x,i){
        h+='<div class="lc-item" onclick="lcGo(\''+x.u.id+'\')">'
          +'<span class="u'+(i===0?' next':'')+'">'+(i===0?'下一步':x.u.id)+'</span>'
          +'<span class="t">'+esc(x.u.title)+'</span>'
          +'<span class="d">'+(mins(x.u)?Math.round(mins(x.u))+' 分':'')+'</span></div>';
      });
    } else {
      h+='<div class="lc-empty">这门课的单元都过了。可以回学习地图看下一门，或重看任意一节的演示。</div>';
    }
    h+='</div></div>';

    /* 底部出口 */
    h+='<div class="lc-foot"><a class="lc-btn" href="app.html">学习地图 / 我的记录</a>'
      +'<button class="lc-btn pri" onclick="lcNext()">继续学习</button>'
      +(logged?'<button class="lc-btn danger" onclick="lcLogout()" title="退出登录">退出</button>':'')+'</div>';
    return h;
  }

  window.lcOpen=function(){
    if(typeof _axWatch==='function'&&_axWatch()) return;   // v162：换人了，等重载完再说
    document.getElementById('lc-body').innerHTML=render();
    document.getElementById('lc-mask').classList.add('on');
    document.getElementById('lc-drawer').classList.add('on');
  };
  window.lcClose=function(){
    document.getElementById('lc-mask').classList.remove('on');
    document.getElementById('lc-drawer').classList.remove('on');
  };
  window.lcGo=function(uid){
    lcClose();
    try{ if(typeof openUnit==='function'){ openUnit(uid); return; } }catch(e){}
    try{ prog.cur=uid; openUnit(uid); }catch(e){}
  };
  window.lcNext=function(){
    var nx=plan(1);
    if(nx.length){ lcGo(nx[0].u.id); }
    else { lcClose(); try{ if(typeof toast==='function') toast('这门课的单元都完成了'); }catch(e){} }
  };
  window.lcLogout=function(){
    if(!confirm('退出后学习进度仍留在这台设备上，但下次要重新登录。确定退出？')) return;
    try{ localStorage.removeItem('ai_training_session'); }catch(e){}
    location.href='app.html';
  };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') lcClose(); });

  /* 顶栏账号 chip 随登录态刷新（切号回来不用刷新页面） */
  function paint(){
    var s=sess(), nm=s.name||s.user||'';
    var av=document.getElementById('lc-av'), tx=document.getElementById('lc-nm');
    if(!av) return;
    if(nm){ av.textContent=nm.slice(0,1); av.classList.remove('guest'); tx.textContent=nm.length>6?nm.slice(0,6)+'…':nm; }
    else { av.textContent='游'; av.classList.add('guest'); tx.textContent='我的学习'; }
  }
  paint();
  window.addEventListener('storage',function(e){ if(e.key==='ai_training_session') paint(); });
  try{ new MutationObserver(paint).observe(document.body,{childList:true,subtree:false}); }catch(e){}
})();
</script>
<!--LC:END-->
</body>
