给出估算方法与来源）", "方案与差异：我们做什么、和现有做法比差异在哪、这个差异为什么抄不走", "指标与验证：北极星指标 + 两个护栏指标，写清口径与验证方式（灰度几成、看几天）", "合规：数据从哪来、能不能出域、内容会不会踩线、模式本身是否可行，四项逐条写", "不做清单：本期明确不做什么（至少 3 条），并写清为什么不做", "里程碑与投入：三个阶段各交付什么、需要几个人日、卡点在哪、谁签字"], "exemplar": "【产品立项书 · 尺码助手】版本 v1.0　提出人：产品经理　评审日期：11/08　签字：待评审委员会\n\n■ 一、机会\n谁痛：买四件套的首次购买用户，尤其是不确定尺寸的租房人群与送礼人群。\n痛在哪：不知道该买 1.5m 还是 1.8m，买错要退换，退换一次平均 7 天。\n现在怎么解决：看详情页尺寸表（文字表格）+ 问客服。客服工单里尺码类占 31%，是第一位。\n多少人痛：近 90 天订单 4.2 万单，其中首次购买占 63%，工单中尺码类 31%，推算每月约 2,700 单涉及尺码咨询；退货原因第一位是尺码，占退货量的 28%（数据来源：ods_return，9–10 月）。\n\n■ 二、方案与差异\n做什么：在商详页加一个「输入床垫尺寸 + 使用人数」的推荐组件，输出建议规格与理由，可一键加入购物车。\n差异：不是通用尺寸表，而是按床垫实际尺寸反推（多数用户只知道床垫尺寸，不知道被套规格）。\n为什么抄不走：依赖我们自己的退货原因数据做校准；竞品拿不到我们的退货口径，做出来只能给通用建议。\n\n■ 三、指标与验证\n北极星：尺码类客服工单量（口径：工单分类=尺码，按自然周统计，除以当周订单数）。\n护栏 1：退货率（口径：退货单量/支付订单量，按周）；护栏 2：商详页跳出率（防止组件拖慢加载）。\n验证方式：5% 流量灰度 14 天，与 5% 对照组比；目标工单率下降 ≥20%，退货率不上升 0.5 个点。\n结论标准：达到目标则放量到 50%，未达到则回滚并复盘；标准提前写死，不看事后心情。\n\n■ 四、合规（四项逐条）\n1. 数据来源：仅用 ods_return 的退货原因（已脱敏，无用户标识）与商品尺寸参数，均为内部数据。\n2. 能否出域：不外发。如需模型辅助推荐，只把「床垫尺寸 + 使用人数 + 商品规格表」发外部模型， 不含任何用户标识，属公开级与内部级。\n3. 内容：组件文案不出现「最适合」「绝对合适」等绝对化表述，只给建议与理由，附「建议仅供参考」。\n4. 模式：推荐结果不构成购买承诺，不做「买错包退」承诺（那是履约政策，需另行申请）。\n\n■ 五、不做清单\n1. 不做 AI 拍照识别床垫尺寸——识别准确率不足以支撑推荐，误判成本由我们承担。\n2. 不做跨类目推荐（被套/枕套/床笠）——本期只验证尺码这一个假设，避免变量混杂。\n3. 不做用户尺寸档案——涉及长期留存个人信息，本期无合规方案。\n4. 不做买错包退——属履约政策变更，不在产品立项范围内。\n\n■ 六、里程碑与投入\n阶段一（11/08–11/15）：规格表结构化 + 推荐规则，2 人日，卡点：尺寸参数数据不全（缺 12 个 SKU）。\n阶段二（11/16–11/25）：组件开发 + 5% 灰度，6 人日，卡点：商详页性能预算（组件需 ≤100ms）。\n阶段三（11/26–12/09）：14 天灰度观察 + 结论，卡点：大促期流量波动影响对照组可比性。\n投入合计：8 人日（产品 2 / 前端 4 / 数据 2）。签字：评审委员会 3 人（产品 / 技术 / 运营）。"}, "task": "产出《产品立项书（含合规）》：机会：谁痛、痛在哪、现在怎么解决的、痛的人有多少（给出估算方法与来源）；方案与差异：我们做什么、和现有做法比差异在哪、这个差异为什么抄不走；指标与验证：北极星指标 + 两个护栏指标，写清口径与验证方式（灰度几成、看几天）；合规：数据从哪来、能不能出域、内容会不会踩线、模式本身是否可行，四项逐条写；不做清单：本期明确不做什么（至少 3 条），并写清为什么不做；里程碑与投入：三个阶段各交付什么、需要几个人日、卡点在哪、谁签字", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M7 综合实战：从 0 到 1 设计一款零售电商产品」模块，你要交付的是《产品立项书（含合规）》。\n【场景】业务侧这周的诉求是：立项书不是写给自己的，是写给要给你资源的人看的。参考做法：一份没有「不做清单」的立项书，会在第一次评审就被问「那你还做什么」。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（六段结构（机会 / 方案与差异 / 指标与验证 / 合规 / 不做清单 / 里程碑与投入）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《产品立项书（含合规）》填写模板】\n\n■ 1. 机会：谁痛、痛在哪、现在怎么解决的、痛的人有多少（给出估算方法与来源）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 方案与差异：我们做什么、和现有做法比差异在哪、这个差异为什么抄不走\n   ‣ 提示：按「结论 → 依据 → 行动」三段写。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 指标与验证：北极星指标 + 两个护栏指标，写清口径与验证方式（灰度几成、看几天）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 合规：数据从哪来、能不能出域、内容会不会踩线、模式本身是否可行，四项逐条写\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 不做清单：本期明确不做什么（至少 3 条），并写清为什么不做\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 里程碑与投入：三个阶段各交付什么、需要几个人日、卡点在哪、谁签字\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 7. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【产品立项书 · 尺码助手】版本 v1.0　提出人：产品经理　评审日期：11/08　签字：待评审委员会\n\n■ 一、机会\n谁痛：买四件套的首次购买用户，尤其是不确定尺寸的租房人群与送礼人群。\n痛在哪：不知道该买 1.5m 还是 1.8m，买错要退换，退换一次平均 7 天。\n现在怎么解决：看详情页尺寸表（文字表格）+ 问客服。客服工单里尺码类占 31%，是第一位。\n多少人痛：近 90 天订单 4.2 万单，其中首次购买占 63%，工单中尺码类 31%，推算每月约 2,700 单涉及尺码咨询；退货原因第一位是尺码，占退货量的 28%（数据来源：ods_return，9–10 月）。\n\n■ 二、方案与差异\n做什么：在商详页加一个「输入床垫尺寸 + 使用人数」的推荐组件，输出建议规格与理由，可一键加入购物车。\n差异：不是通用尺寸表，而是按床垫实际尺寸反推（多数用户只知道床垫尺寸，不知道被套规格）。\n为什么抄不走：依赖我们自己的退货原因数据做校准；竞品拿不到我们的退货口径，做出来只能给通用建议。\n\n■ 三、指标与验证\n北极星：尺码类客服工单量（口径：工单分类=尺码，按自然周统计，除以当周订单数）。\n护栏 1：退货率（口径：退货单量/支付订单量，按周）；护栏 2：商详页跳出率（防止组件拖慢加载）。\n验证方式：5% 流量灰度 14 天，与 5% 对照组比；目标工单率下降 ≥20%，退货率不上升 0.5 个点。\n结论标准：达到目标则放量到 50%，未达到则回滚并复盘；标准提前写死，不看事后心情。\n\n■ 四、合规（四项逐条）\n1. 数据来源：仅用 ods_return 的退货原因（已脱敏，无用户标识）与商品尺寸参数，均为内部数据。\n2. 能否出域：不外发。如需模型辅助推荐，只把「床垫尺寸 + 使用人数 + 商品规格表」发外部模型， 不含任何用户标识，属公开级与内部级。\n3. 内容：组件文案不出现「最适合」「绝对合适」等绝对化表述，只给建议与理由，附「建议仅供参考」。\n4. 模式：推荐结果不构成购买承诺，不做「买错包退」承诺（那是履约政策，需另行申请）。\n\n■ 五、不做清单\n1. 不做 AI 拍照识别床垫尺寸——识别准确率不足以支撑推荐，误判成本由我们承担。\n2. 不做跨类目推荐（被套/枕套/床笠）——本期只验证尺码这一个假设，避免变量混杂。\n3. 不做用户尺寸档案——涉及长期留存个人信息，本期无合规方案。\n4. 不做买错包退——属履约政策变更，不在产品立项范围内。\n\n■ 六、里程碑与投入\n阶段一（11/08–11/15）：规格表结构化 + 推荐规则，2 人日，卡点：尺寸参数数据不全（缺 12 个 SKU）。\n阶段二（11/16–11/25）：组件开发 + 5% 灰度，6 人日，卡点：商详页性能预算（组件需 ≤100ms）。\n阶段三（11/26–12/09）：14 天灰度观察 + 结论，卡点：大促期流量波动影响对照组可比性。\n投入合计：8 人日（产品 2 / 前端 4 / 数据 2）。签字：评审委员会 3 人（产品 / 技术 / 运营）。", "rubric": ["机会段的「多少人痛」要给估算方法与来源，直接写「市场空间巨大」不计分", "北极星指标必须带口径（分子分母、统计周期），护栏指标至少一个（退货率 / 投诉率 / 客服工单量）", "合规四项（数据来源 / 出域 / 内容 / 模式）逐条写，缺一项按未完成计", "不做清单至少 3 条且写明不做的理由，写「视资源情况再定」不算"]}, {"id": "M7U4", "tier": "basic", "step": "spar", "title": "评审委员会挑战你的立项", "video": {"dur": "3.4min", "script": ["委员会不怀疑你的热情，他们怀疑的是你把资源投进去之后能不能拿回结果", "挑战清单：机会依据 / 差异可持续 / 投入产出 / 合规底线", "「这个差异，竞品三个月能不能抄走？」——这一问决定资源给不给你"]}, "ppt": {"method": "挑战清单：机会依据 / 差异可持续 / 投入产出 / 合规底线", "case": "「这个差异，竞品三个月能不能抄走？」——这一问决定资源给不给你", "demo": "陪练对话界面说明（把立项书粘进系统提示词，让对手按你的六段逐条发问）"}, "objective": "能在评审委员会 4 轮追问下，说清机会依据、差异可持续性、投入产出与合规底线", "transfer": "把陪练里被问住的两个问题补进立项书第五节，再把它提交给评审委员会", "vslides": [{"t": "陪练说明：他只给「算得清」的项目资源", "n": "评审委员会由三个人组成，各自关心不同的东西：产品关心机会真假，技术关心能不能做出来、会不会留坑，运营关心上线后谁背指标。但他们共同的问题是三个——机会是真的吗、差异能撑多久、这 8 人日值不值。这三问有个共同点：都能用数字回答，也都不能用态度回答。说「用户反馈很多」不如说「工单里尺码类占 31%，每月 2,700 单」；说「我们有先发优势」不如说「校准数据能撑两个换季周期，之后差距会缩小」；说「资源够用」不如说「挤掉的是推荐位改版，那边预期提升 3%，这边预期工单降 20%」。答这类问题最忌讳的是把不确定说成确定，委员会见过太多这种，一旦发现你在撑，后面所有数字都会被怀疑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">委员会的四问</tspan></text><g data-k=\"机会是真的吗\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">机会是真</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">的吗</tspan></text></g><g data-k=\"差异能撑多久\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">差异能撑</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">多久</tspan></text></g><g data-k=\"这 8 人日值不值\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">这 8 人日</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">值不值</tspan></text></g><g data-k=\"合规怎么改\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">合规怎么</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">改</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 67.63}, {"t": "差异的可持续期：说清「多久被抄走」反而更可信", "n": "第二问几乎所有人都会答「抄不走」，而真正的答法是「三个月能抄走表面，抄不走校准数据，但两年后差距会缩小」。为什么主动说会被抄？因为委员会的人见过太多项目死在「我们不可替代」这句判断上，你主动给出期限，说明你算过，可信度立刻不一样。回答结构是三段：哪部分可复制（组件本身，两周）、哪部分不可复制（数据校准）、可持续多久（两个换季周期）。第三段最重要，也最少人答。给出期限之后，紧接着要给应对：窗口期内换什么——换工单成本下降、换退货率下降、换一个可以复用的数据资产。把「差异」答成「窗口」，比答成「壁垒」更让人放心，因为你没有在赌未来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 哪部分可复制（说清多快）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 哪部分可复制（说清多快）</tspan></text></g><g data-k=\"② 哪部分不可复制（数据/口径）\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 哪部分不可复制（数据/口径）</tspan></text></g><g data-k=\"③ 可持续多久（给期限）\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 可持续多久（给期限）</tspan></text></g><g data-k=\"④ 窗口期内换什么\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 窗口期内换什么</tspan></text></g></svg>", "d": 62.4}, {"t": "机会成本与合规变更：把「麻烦」提前认领", "n": "第三问是很多人答不上来的：这 8 人日挤掉了什么。资源永远有限，委员会问这句不是在刁难，是在确认你有没有全局视角。标准答法是把被挤掉的需求说出来，给两边的预期收益，然后把取舍交回去：「挤掉的是推荐位改版，那边预期提升 3%，这边预期工单降 20%，但工单降的是成本、推荐位涨的是 GMV，两者的换算口径需要你定。」这句说完通常会被追问「那你自己倾向哪个」，准备好答案——倾向于能先拿到数据的那一个，因为它能减少下一轮的不确定性。第四问考的是合规的弹性：你说本期不外发，但后面要接大模型怎么办。要给出改哪一步、谁来批、改完需要多久。这一问答得清，委员会会认为你的合规不是写来应付的；答成「到时候再说」，前面三段都会被重新审视。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"被挤掉的是哪个需求\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">被挤掉的是哪个需求</tspan></text></g><g data-k=\"两边收益给数（哪怕不等价）\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">两边收益给数（哪怕不等价）</tspan></text></g><g data-k=\"换算口径交给委员会拍\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">换算口径交给委员会拍</tspan></text></g><g data-k=\"合规变更：改哪步 / 谁批 / 多久\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">合规变更：改哪步 / 谁批 / 多久</tspan></text></g></svg>", "d": 72.43}], "deliverable": {"type": "doc", "name": "产品立项书（含合规）", "rubric": ["依据到数", "差异有期限", "成本与合规交代清"], "acceptance": "四问都能给出数据来源、差异持续时间、机会成本对比与合规变更方案"}, "spar": {"role": "评审委员会", "persona": "由产品、技术、运营三人组成，不关心想法多漂亮，只关心三件事：机会是不是真的、差异能撑多久、这 8 人日投进去能不能拿回结果", "mustAsk": ["你说用户痛，依据是什么？多少人痛，这个数怎么来的？", "这个差异，竞品三个月能不能抄走？抄走之后你还剩什么？", "8 人日的机会成本是什么？挤掉的那个需求，收益比这个低吗？", "合规那一段你说「不外发」，如果后面要接大模型，你准备怎么改？"]}, "exemplar": "（问：这个差异，竞品三个月能不能抄走？）\n\n结论：抄得走表面的组件，抄不走校准数据。三个月内他们能做出一个「输入床垫尺寸给建议」的组件，但给不出准确的建议，因为他们没有我们的退货原因口径。\n依据：这个组件本身两周就能做出来，代码不是壁垒。真正起作用的是校准——我们近 90 天 4.2 万单的退货原因里，尺码占 28%，这批数据能反推「哪个规格组合会退」，竞品只能拿到自己的退货数据，而他们的类目结构与尺码标准和我们不同源，模型迁移过来会偏。所以我们的差异是数据校准，可持续期大约是两个换季周期，因为尺码痛点随季节和品类变。\n边界：我不认为这是长期壁垒。如果竞品从今年双十一开始积累同类数据，明年这个时候差距会缩小到可以忽略。所以我的建议是把它当成一个 12 个月的窗口，用它换工单成本下降和退货率下降，不要把它写进长期战略。另外这 8 人日的机会成本要算清：它挤占的是推荐位改版的排期，这个取舍需要你拍，我只能给出两边的预期收益。", "task": "把《产品立项书（含合规）》拿到「评审委员会」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《产品立项书（含合规）》。现在要让它通过「评审委员会」这一关。\n【对手的立场】由产品、技术、运营三人组成，不关心想法多漂亮，只关心三件事：机会是不是真的、差异能撑多久、这 8 人日投进去能不能拿回结果。\n【他一定会追问】「你说用户痛，依据是什么？多少人痛，这个数怎么来的？」 / 「这个差异，竞品三个月能不能抄走？抄走之后你还剩什么？」 / 「8 人日的机会成本是什么？挤掉的那个需求，收益比这个低吗？」\n【场景】你说「评审委员会挑战你的立项」，对方立刻回一句：你说用户痛，依据是什么？多少人痛，这个数怎么来的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["机会依据要给出分母与来源（多少单、多少工单、哪张表），不写「用户反馈很多」", "差异要说明可持续期（几个月/几个季度）与被抄走后的应对，不写「我们有先发优势」", "机会成本要说出被挤掉的具体需求与两边收益对比，不写「资源够用」", "合规变更方案要给到「如果接外部模型，改哪一步、谁来批」，不写「到时候再说」"]}, {"id": "M7U5", "tier": "adv", "step": "understand", "title": "PRD 到交付的全链路整合", "video": {"dur": "3.5min", "script": ["链路的价值不在图好看，在于每个交接点都有人签、都有东西可查", "五环节（立项 / PRD / 研发 / 上线 / 复盘）+ 四个交接物 + 四道闸门", "上线闸门缺了「回滚演练记录」，前面所有环节做得再好也可能一夜归零"]}, "ppt": {"method": "五环节（立项 / PRD / 研发 / 上线 / 复盘）+ 四个交接物 + 四道闸门", "case": "上线闸门缺了「回滚演练记录」，前面所有环节做得再好也可能一夜归零", "demo": "同一份需求在链路上五个环节的形态变化：从一句话到一份复盘"}, "objective": "能把立项到复盘的五个环节串成一条链路，并指出每两个环节之间的交接物与闸门", "transfer": "用这条链路给自己在做的项目画一张图，标出当前卡在哪道闸门上", "vslides": [{"t": "五个环节与四个交接物", "n": "从一句话到一个可复盘的结果，链路只有五个环节：立项、PRD、研发、上线、复盘。每个环节之间有一个交接物，交接物不对，后面全歪。立项到 PRD 之间是立项书，它决定了「做什么、不做什么」；PRD 到研发之间是验收用例，它决定了「做完怎么算做完」；研发到上线之间是上线检查清单，它决定了「出事怎么退」；上线到复盘之间是数据快照，它决定了「结论能不能算数」。这四样东西有一个共同点：它们都不是给自己看的，是给下一个环节的人看的。所以判断一份交接物合不合格，方法很简单——把下一个环节的人找来，让他照着做一遍，做不下去就是不合格。这条测试比任何评审标准都有效，因为它不需要争论标准，只需要看对方能不能动手。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五个环节</tspan></text><g data-k=\"立项\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">立项</tspan></text></g><g data-k=\"PRD\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">PRD</tspan></text></g><g data-k=\"研发\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">研发</tspan></text></g><g data-k=\"上线\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">上线</tspan></text></g><g data-k=\"复盘\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">复盘</tspan></text></g></svg>", "d": 72.1}, {"t": "四道闸门：不通过要退回哪一步", "n": "链路上有四道闸门，每一道的作用不是「走流程」，而是「拦住不该往下走的东西」。立项评审拦的是「机会不成立或合规不可行」；需求评审拦的是「不可测的需求」；上线评审拦的是「回滚不了、监控没有的变更」；复盘评审拦的是「没有结论的复盘」。每道闸门要写三样：通过条件（具体到可核对）、签字人（岗位，不是「领导」）、不通过时退回哪一步。第三样最容易被忽略，但没有它，闸门就变成了橡皮章——不通过之后没人知道该回去改什么。还有一条实战经验：闸门的通过条件最好用「有没有那份东西」来表述，比如「有验收用例且覆盖至少一个异常路径」，比「需求清晰」好判一百倍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四道闸门</tspan></text><g data-k=\"立项评审\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">立项评审</tspan></text></g><g data-k=\"需求评审\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">需求评审</tspan></text></g><g data-k=\"上线评审\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">上线评审</tspan></text></g><g data-k=\"复盘评审\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">复盘评审</tspan></text></g></svg>", "d": 59.88}, {"t": "复盘：唯一的产出是回写清单", "n": "复盘的产出物只有一个：回写清单。写清这一轮哪个判断错了、错在哪、下一轮改哪条规则，回写到哪份文档里。没有回写清单的复盘，等于开了一次会。还有一条：复盘要在上线后 14 天做，不要拖到季度末，拖久了人的记忆会自动把失败归因成外部原因，那时候写出来的回写清单全是「流量波动」「大促影响」，没有一条是能改的。「总结经验、继续努力」不是结论，「预估工时偏低 40%，原因是漏算了联调，下轮联调按 2 人日固定计入」才是结论。复盘还要带数据快照：上线前后的工单率、退货率、转化率，口径必须和立项书里写的完全一致——口径一变，结论就没法比，这也是为什么指标段要提前写死口径。最后一个动作是把它放进链路：回写清单要落到具体文档的具体段落，落到人，落到下一次评审的检查项里。落不到文档的回写，三周后就没人记得了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"哪个判断错了\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">哪个判断错了</tspan></text></g><g data-k=\"错在哪（具体原因）\"><g><circle cx=\"30\" cy=\"80\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 80 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"84.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">错在哪（具体原因）</tspan></text></g><g data-k=\"下一轮改哪条规则\"><g><circle cx=\"30\" cy=\"108\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 108 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"113.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">下一轮改哪条规则</tspan></text></g><g data-k=\"回写到哪份文档的哪一段\"><g><circle cx=\"30\" cy=\"137\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 137 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"141.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">回写到哪份文档的哪一段</tspan></text></g><g data-k=\"落到谁\"><g><circle cx=\"30\" cy=\"165\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 165 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"170.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">落到谁</tspan></text></g></svg>", "d": 79.13}], "deliverable": {"type": "doc", "name": "端到端链路图与闸门清单", "rubric": ["交接物齐", "闸门有条件", "责任到人"], "acceptance": "能画出五环节与四个交接物，并给每道闸门写出通过条件与签字人"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】五环节（立项 / PRD / 研发 / 上线 / 复盘）+ 四个交接物 + 四道闸门\n【为什么重要】链路的价值不在图好看，在于每个交接点都有人签、都有东西可查\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["五个环节（立项 / PRD / 研发 / 上线 / 复盘）齐全，且每两个环节之间写明交接物是什么", "四道闸门（立项评审 / 需求评审 / 上线评审 / 复盘评审）各有明确的通过条件，不写「评审通过」", "每道闸门写明签字人（岗位）与不通过时的处理方式（退回哪一步）", "复盘环节要有产出物（结论 + 回写清单），只写「总结经验」不计分"]}, {"id": "M7U6", "tier": "adv", "step": "demo", "title": "用 AI 整合一份发布说明", "video": {"dur": "3.3min", "script": ["发布说明是唯一一份会被外部看到的东西，它上面每句话都要能兜得住", "归属判定（背景/改动/影响/回滚/口径/不写入）+ 三档质量判定（可用/需补/需删）", "「预计提升 GMV 20%（行业经验）」与「已通过法务审核」两句，都必须删"]}, "ppt": {"method": "归属判定（背景/改动/影响/回滚/口径/不写入）+ 三档质量判定（可用/需补/需删）", "case": "「预计提升 GMV 20%（行业经验）」与「已通过法务审核」两句，都必须删", "demo": "WorkBuddy 内跑一遍：先归段与判定，再让模型整合成文，最后自己删掉越权与无源表述"}, "objective": "能把 8 条散落素材判出该放进发布说明的哪一段、要不要删改，并整合成一份可对外发布的说明", "transfer": "用这套判定把上次的发布说明重写一遍，把「已通过法务审核」这类表述删掉", "vslides": [{"t": "演示准备：8 条素材里 3 条必须删掉", "n": "这 8 条素材来自不同同事：产品写目标、技术写改动、运营写预估、测试写回滚、数据写口径、商务写竞品。它们各自在自己那份文档里都没问题，但放进一份对外的发布说明就不一样了。三条必须删：「预计 GMV 提升 20%（行业经验）」是无来源的预估，「已通过法务审核，无任何合规风险」是越权结论，「据竞品内部人士透露」既无来源又涉他人内部信息。三条可以原样用：改动内容、影响范围、回滚实测耗时——它们都是可核对的事实。还有两条要补：目标要量化、口径差异要说清差多少。这个比例很典型：一份素材堆里，真正能对外说的不到一半。你要做的是逐条归段、判质量，再整合成文。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g data-k=\"8 条：目标 / 改动 / 预估 / 影响 / 回滚 / 口径 / 竞品\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 条：目标 / 改动 / 预估 / 影响 / 回滚 / 口径 / 竞品</tspan></text></g><g data-k=\"可原样用 3 条（都是可核对事实）\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">可原样用 3 条（都是可核对事实）</tspan></text></g><g data-k=\"需补 2 条 · 必须删 3 条\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">需补 2 条 · 必须删 3 条</tspan></text></g></svg>", "d": 67.18}, {"t": "三档判定：可用、需补、需删", "n": "三档的界线在「这句话有没有人能兜住」。「新增面料成分与克重展示」是事实，谁都兜得住，可用。「目标是让体验更顺畅」方向对但没法核对，需补——补成「首屏 P75 ≤1.5 秒」。「预计提升 20%（行业经验）」没人兜得住，因为「行业经验」不是来源，需删。这里有个细节要注意：删掉不等于什么也不说。删掉预估之后要补一句可对外的事实表述——「上线后以 14 天数据评估效果」，把预期换成承诺的方法，既不失语也不越界。还有一类最隐蔽：口径类素材，比如「支付成功率改为按下单口径统计」。它本身没错，但对外不写清差多少，就等于给未来留了个坑——三个月后有人拿两个口径的数对不上，会回头找你。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 可用：事实，有人能兜住\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 可用：事实，有人能兜住</tspan></text></g><g data-k=\"② 需补：方向对但没法核对\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 需补：方向对但没法核对</tspan></text></g><g data-k=\"③ 需删：没人能兜住（无源/越权）\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 需删：没人能兜住（无源/越权）</tspan></text></g></svg>", "d": 64.61}, {"t": "模型的活与人的活：它整合，你删句", "n": "素材判完，模型的整合能力很强：把五段拼成一篇通顺的说明、统一语气、补过渡句，几分钟就出来，比人写得整齐。但它有两个稳定的毛病。第一，它喜欢加「保险句」——「本版本已通过法务审核」「符合相关法律法规要求」，这类句子在它看来是让文本更完整，在合规视角是给自己挖坑：一旦某条被驳回，这句话就是最直接的证据。第二，它会把删掉的预估悄悄加回来，换成「预计将带来显著提升」——没说数字，但同样是承诺。所以整合完必须做一次「删句」：把所有形容词式的承诺、所有越权结论、所有无来源数字找出来删掉。最后一步是核对：整合稿里的每一句，都要能在判定表里找到对应的一条「可用」。找不到的，就是模型自己加的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">模型做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人来做</tspan></text><g data-k=\"拼段 / 统一语气 / 补过渡 / 出初稿\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">拼段 / 统一语气 / 补过</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">渡 / 出初稿</tspan></text></g><g data-k=\"删保险句 / 删越权结论 / 核每句有出处\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">删保险句 / 删越权结论 /</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\"> 核每句有出处</tspan></text></g></svg>", "d": 68.42}], "deliverable": {"type": "sheet", "name": "发布说明", "rubric": ["归属正确", "该删就删", "整合可对外"], "acceptance": "8 条素材都有归属段与质量判定；无来源与越权表述一律删除；整合稿与判定表一一对应"}, "demo": {"ref": "■ 素材判定（8 条）\n\nP01｜「本次改版目标是让购物体验更顺畅」→ 背景与目标 / 需补\n　补：目标要量化，改为「首屏加载 P75 ≤1.5 秒，商详页跳出率下降 5%」。\n\nP02｜「新增面料成分与克重展示」→ 本次改动 / 可用\n　原文保留。\n\nP03｜「预计 GMV 提升 20%（行业经验）」→ 不写入 / 需删除\n　删：无来源的行业经验值。替代：「本次改版上线后，将以 14 天数据评估效果」。\n\nP04｜「影响 128 个 SKU、3 个仓」→ 影响范围 / 可用\n　原文保留。\n\nP05｜「已通过法务审核，无任何合规风险」→ 不写入 / 需删除\n　删：越权结论。替代：「文案已按词库规则过审，检测报告编号已在页面标注」。\n\nP06｜「回滚：配置 3 分钟内、价格表 8 分钟内，均为演练实测」→ 上线与回滚 / 可用\n　原文保留。\n\nP07｜「支付成功率改为按下单口径统计，与财务口径不一致」→ 数据与口径 / 需补\n　补：写清两个口径的差异与影响，如「差异约 1.2 个点，历史数据不回溯」。\n\nP08｜「据竞品内部人士透露，对方下月做同款活动」→ 不写入 / 需删除\n　删：无来源且涉他人内部信息。替代：不在对外说明中出现。\n\n■ 结论：可用 3 条、需补 2 条、需删除 3 条。\n■ 建议：发布说明开头加一句「本版本已通过法务审核，符合相关法律法规要求」，让外部放心。", "fix": ["「本版本已通过法务审核，符合相关法律法规要求」整句删掉——这是越权结论，且一旦某条被驳回，这句话就是最直接的证据", "P03 删掉之后不能什么也不说，要补一句可对外的事实：「上线后以 14 天数据评估效果」，把预期换成承诺的方法", "P07 的「口径不一致」必须写清差多少（约 1.2 个点）以及是否回溯历史，否则对外说明等于留了个坑", "P08 删掉是对的，但要在内部备注里留一句「来源不可核，已按不可用处理」，否则下次还会有人再提一遍"], "judge": "判断依据：有没有把无来源预估与越权结论判成「可用」；「需补」有没有写清补什么；整合稿里是否还残留「已通过法务审核」「预计提升 X%」这类表述；被删的条目有没有给替代表述", "sheet": {"situ": "明天要发版本，运营催着要一份对外的发布说明。素材是六个同事各自发来的：产品写了目标、技术写了改动、运营写了预估、测试写了回滚、数据写了口径、商务写了竞品动态。这些内容在自己那份文档里都没问题，但拼成一份对外说明，有几条必须删掉。", "ask": "① 8 条素材逐条判该放进发布说明的哪一段、能不能用；② 用你的表请 AI 整合成文；③ 拿回初稿后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 判定每条该放进哪一段；② 判可用 / 需补 / 需删并说明理由；③ 把可用的素材整合成一份对外的发布说明；④ 列出被删掉的每一条与替代表述。\n不要写「已通过法务审核」这类越权结论，也不要保留无来源的预估数字。", "mats": [{"id": "P01", "src": "产品 · 目标段", "text": "本次改版目标是让购物体验更顺畅。"}, {"id": "P02", "src": "技术 · 改动清单", "text": "新增面料成分与克重展示，商详页参数区新增两个字段。"}, {"id": "P03", "src": "运营 · 效果预估", "text": "预计 GMV 提升 20%（依据：行业经验）。"}, {"id": "P04", "src": "技术 · 影响范围", "text": "影响 128 个 SKU、3 个仓，不涉及历史订单数据。"}, {"id": "P05", "src": "运营 · 合规口径", "text": "本版本已通过法务审核，无任何合规风险。"}, {"id": "P06", "src": "测试 · 回滚说明", "text": "回滚：配置 3 分钟内生效，价格表 8 分钟内恢复，均为演练实测。"}, {"id": "P07", "src": "数据 · 口径变更", "text": "支付成功率改为按下单口径统计，与财务口径不一致。"}, {"id": "P08", "src": "商务 · 竞品动态", "text": "据竞品内部人士透露，对方下月将做同款活动。"}], "cols": [{"k": "sec", "name": "放进哪一段", "hint": "对外的发布说明只分这几段", "type": "chips", "w": 3, "tags": ["背景与目标", "本次改动", "影响范围", "上线与回滚", "数据与口径", "不写入"]}, {"k": "q", "name": "质量判定", "hint": "这三档看「有没有人兜得住」", "type": "chips", "w": 3, "tags": ["可直接用", "需补数据或口径", "需删除（无来源或越权）"]}, {"k": "fx", "name": "处置", "hint": "选一个具体处置", "type": "chips", "w": 3, "tags": ["原文保留", "补上口径与来源后写入", "删掉，改为事实陈述", "移到内部备注"]}], "key": {"P01": {"sec": "背景与目标", "q": "需补数据或口径", "fx": "补上口径与来源后写入"}, "P02": {"sec": "本次改动", "q": "可直接用", "fx": "原文保留"}, "P03": {"sec": "不写入", "q": "需删除（无来源或越权）", "fx": "删掉，改为事实陈述"}, "P04": {"sec": "影响范围", "q": "可直接用", "fx": "原文保留"}, "P05": {"sec": "不写入", "q": "需删除（无来源或越权）", "fx": "删掉，改为事实陈述"}, "P06": {"sec": "上线与回滚", "q": "可直接用", "fx": "原文保留"}, "P07": {"sec": "数据与口径", "q": "需补数据或口径", "fx": "补上口径与来源后写入"}, "P08": {"sec": "不写入", "q": "需删除（无来源或越权）", "fx": "移到内部备注"}}, "notes": {"P03·q": "「行业经验」不是来源，20% 这个数没人能兜住；删掉后要补一句可对外的事实表述，比如「上线后以 14 天数据评估效果」", "P05·q": "「已通过法务审核」是越权结论，而且一旦某条被驳回，这句话就是最直接的证据；可对外的表述是「文案已按词库规则过审，检测报告编号已在页面标注」", "P08·fx": "这条不只是无来源，还涉及他人内部信息；删掉之后在内部备注里留一句「来源不可核，已按不可用处理」，否则下次还会有人再提一遍", "P07·q": "口径本身没错，但不写清差多少、是否回溯历史，三个月后对不上数就会回头找你；要补「差异约 1.2 个点，历史数据不回溯」", "P01·q": "「更顺畅」没法核对，属需补——补成「首屏加载 P75 ≤1.5 秒，跳出率下降 5%」"}, "delta": [{"op": "删", "frm": "模型建议在开头加「本版本已通过法务审核，符合相关法律法规要求」", "to": "整句删除", "why": "越权结论：法务结论只能由法务出，而且这句话会把某一条被驳回变成「我们说过没问题」", "kw": ["法务审核", "符合相关法律法规", "放心", "已通过"]}, {"op": "改", "frm": "P03 删掉后就什么也不提", "to": "补一句可对外的事实：「上线后以 14 天数据评估效果」", "why": "删掉预估不等于放弃表达，把预期换成承诺的方法，既不失语也不越界", "kw": ["14 天", "评估", "上线后", "承诺"]}, {"op": "改", "frm": "P07 只写「与财务口径不一致」", "to": "补清差异幅度与是否回溯：「差异约 1.2 个点，历史数据不回溯」", "why": "不写差多少，等于给未来留了个坑：三个月后有人拿两个口径的数对不上", "kw": ["1.2", "回溯", "差异", "点"]}, {"op": "补", "frm": "（模型没写）", "to": "整合完做一次「逐句核出处」：每句都要能在判定表里找到一条「可直接用」", "why": "模型会把删掉的预估换个说法加回来，比如「预计将带来显著提升」——没数字，但同样是承诺", "kw": ["核出处", "逐句", "显著", "加回来"]}], "refsheet": "P01｜背景与目标｜需补数据或口径｜补上口径与来源后写入\nP02｜本次改动｜可直接用｜原文保留\nP03｜不写入｜需删除（无来源或越权）｜删掉，改为事实陈述\nP04｜影响范围｜可直接用｜原文保留\nP05｜不写入｜需删除（无来源或越权）｜删掉，改为事实陈述\nP06｜上线与回滚｜可直接用｜原文保留\nP07｜数据与口径｜需补数据或口径｜补上口径与来源后写入\nP08｜不写入｜需删除（无来源或越权）｜移到内部备注\n\n四处最容易判错的：\n· P03 / P05 / P08 都必须删：无来源的预估、越权的法律结论、他人的内部信息。\n· 删掉不等于不说话：P03 删完要补「上线后以 14 天数据评估效果」。\n· P07 口径没错但要补差多少——不写清，三个月后对不上数。\n· P01 的「更顺畅」没法核对，属需补，不属于可用。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」本次发布的 8 条素材（来自不同同事，原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条该放进发布说明的哪一段；② 判可用 / 需补 / 需删并说明理由；③ 把可用的素材整合成一份对外的发布说明；④ 列出被删掉的每一条与替代表述。\n不要写「已通过法务审核」这类越权结论，也不要保留无来源的预估数字。"}, "task": "按框架把 8 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】归属判定（背景/改动/影响/回滚/口径/不写入）+ 三档质量判定（可用/需补/需删）\n【参考案例】「预计提升 GMV 20%（行业经验）」与「已通过法务审核」两句，都必须删\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」本次发布的 8 条素材（来自不同同事，原文）：\n[粘贴你整理好的 8 条字段]\n请基于上表：① 判定每条该放进发布说明的哪一段；② 判可用 / 需补 / 需删并说明理由；③ 把可用的素材整合成一份对外的发布说明；④ 列出被删掉的每一条与替代表述。\n不要写「已通过法务审核」这类越权结论，也不要保留无来源的预估数字。", "rubric": ["每条素材判出归属段（背景与目标 / 本次改动 / 影响范围 / 上线与回滚 / 数据与口径 / 不写入），混段按错计", "无来源的预估数字、越权的法律结论，一律判「需删除」并给出可对外的事实表述", "「需补」的必须写清补什么（口径 / 来源 / 时间范围），只写「需完善」不计分", "整合稿不得出现「已通过法务审核」「预计提升 X%」这类表述，出现即视为未完成"]}, {"id": "M7U7", "tier": "adv", "step": "todo", "title": "产出《端到端产品方案（含合规）》", "video": {"dur": "3.4min", "script": ["方案的价值在被人执行，而执行的前提是每一步都有人、有物、有退回的地方", "六段结构（链路与交接物 / 闸门与签字 / 指标口径 / 合规动作 / 风险与预案 / 复盘与回写）", "一份没写「不通过退回哪一步」的闸门清单，执行两次就会失效"]}, "ppt": {"method": "六段结构（链路与交接物 / 闸门与签字 / 指标口径 / 合规动作 / 风险与预案 / 复盘与回写）", "case": "一份没写「不通过退回哪一步」的闸门清单，执行两次就会失效", "demo": "方案骨架 + 一份填到签字人与回写位置的样例"}, "objective": "能产出一份端到端产品方案（含合规），把链路、闸门、指标口径与复盘机制写全", "transfer": "用这份方案对一次真实项目做复盘，把缺的闸门补进团队流程", "vslides": [{"t": "任务说明：方案是给执行的人看的，不是给领导看的", "n": "端到端方案最常见的写法，是把五个环节画成一张漂亮的流程图，每格写一句「输出 PRD」，然后结束。这种方案没法执行，因为它没回答执行者最需要的三个问题：我这一步做完交给谁、交的东西长什么样、交不过去退回到哪。所以六段结构里，第一段和第二段必须写到「人」和「物」。写到人，意味着有具体岗位接手；写到物，意味着有具体文档可查。第三段指标口径看起来最枯燥，但它决定了三个月后你的结论算不算数——口径没写清，做完之后谁都能说自己赢了。第六段回写最容易被省，但它是整个链路唯一让组织变强的地方：不复盘的团队，第二年会在同一个地方再摔一次。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六段结构</tspan></text><g data-k=\"链路与交接物\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">链路与交接物</tspan></text></g><g data-k=\"闸门与签字\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">闸门与签字</tspan></text></g><g data-k=\"指标口径\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">指标口径</tspan></text></g><g data-k=\"合规动作\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">合规动作</tspan></text></g><g data-k=\"风险与预案\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">风险与预案</tspan></text></g><g data-k=\"复盘与回写\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">复盘与回写</tspan></text></g></svg>", "d": 61.1}, {"t": "闸门要能退回：不写退回哪一步，闸门就是橡皮章", "n": "四道闸门里，最容易被写坏的是「不通过怎么办」。写「评审不通过则整改」，等于没写——整改什么、改完给谁看、什么时候重审，全都没说。正确写法是写清退回哪一步：「需求评审不通过，退回 PRD 补用例，补完当天可重审」。这样写有两个好处：被退回的人知道该干什么，评审的人也知道自己不是在做无意义的否决。还有一个技巧：通过条件尽量写成「有没有那份东西」，而不是「质量好不好」——「有验收用例且覆盖至少一个异常路径」比「需求清晰」好判一百倍，因为它不需要争论。第四个闸门（复盘评审）最容易被跳过，但它是唯一一个能防止同类问题再发生的闸门，宁可少开一次周会，也别省这一次。还有个小技巧：闸门的通过条件写成清单形式，附在评审通知里，评审时逐条打勾，比开会讨论快得多，也少了临场争论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 通过条件：有没有那份东西\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 通过条件：有没有那份东西</tspan></text></g><g data-k=\"② 签字人：岗位，不是「领导」\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 签字人：岗位，不是「领导」</tspan></text></g><g data-k=\"③ 不通过：退回哪一步、何时重审\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 不通过：退回哪一步、何时重审</tspan></text></g></svg>", "d": 77.4}, {"t": "风险与回写：把「万一」写成触发信号", "n": "风险段最容易写成许愿：「可能存在技术风险，需加强把控」。有效的写法是给触发信号和预案——数据不全的触发信号是「灰度前仍缺 12 个 SKU」，预案是「先用 116 个上线，缺的走人工兜底」；大促流量波动的触发信号是「两组流量差异 >15%」，预案是「暂停灰度，节后重跑」。触发信号要能被监控看到，预案要能在当天执行，这两条不满足，写了也没用。最后一段是回写：结论回写到哪份文档的哪一段。这一步看着琐碎，但它是把一次项目变成组织能力的唯一动作。写法要具体到章节——「若工单率降幅 <10%，回写到《立项书》第一节并标注假设不成立」，这种程度的回写才会真的被执行。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每条风险有触发信号（监控能看到）\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条风险有触发信号（监控能看到）</tspan></text></g><g data-k=\"每条风险有当天能执行的预案\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条风险有当天能执行的预案</tspan></text></g><g data-k=\"回写到具体文档的具体章节\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">回写到具体文档的具体章节</tspan></text></g><g data-k=\"回写落到人，并进下次评审检查项\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">回写落到人，并进下次评审检查项</tspan></text></g></svg>", "d": 64.44}], "deliverable": {"type": "doc", "name": "端到端产品方案（含合规）", "rubric": ["交接物到人", "闸门可退回", "口径与回写落地"], "acceptance": "六段齐全；每个环节有交接物与人；闸门有不通过处理；指标有口径与来源；风险有触发信号"}, "practice": {"steps": ["链路与交接物：五个环节各交付什么、交接给谁、下一环节拿它做什么", "闸门与签字：四道闸门的通过条件、签字岗位、不通过时退回哪一步", "指标口径：北极星与护栏指标的分子分母、统计周期、数据表来源，以及口径变更的审批方式", "合规动作：数据来源与出域、内容审核、留痕与留存，逐条写清由谁在哪一步执行", "风险与预案：至少三条主要风险（技术/供应/合规），每条给触发信号与预案", "复盘与回写：复盘时看哪几个数、结论回写到哪份文档的哪一段、落到谁"], "exemplar": "【端到端产品方案 · 尺码助手】版本 v1.0　负责人：产品经理　生效：11/08　复审：上线后 30 天\n\n■ 一、链路与交接物\n1. 立项 → PRD：交接物《立项书 v1.0》，接收人 技术负责人（评估可行性）与运营负责人（认领指标）。\n2. PRD → 研发：交接物《PRD + 验收用例集》，接收人 前端负责人与测试负责人；测试据此写脚本，写不出即退回。\n3. 研发 → 上线：交接物《上线检查清单 + 回滚演练记录》，接收人 运维值班；无演练记录不予排期。\n4. 上线 → 复盘：交接物《上线前后 14 天数据快照》，接收人 数据分析；口径以本方案第三节为准。\n\n■ 二、闸门与签字\n1. 立项评审：通过条件=有机会依据与合规四项；签字 评审委员会 3 人；不通过退回「机会重估」。\n2. 需求评审：通过条件=每条需求有验收用例且覆盖一个异常路径；签字 技术负责人 + 测试负责人；\n 不通过退回「PRD 补用例」。\n3. 上线评审：通过条件=回滚演练记录（含实测耗时）+ 三个观察指标与阈值；签字 运维值班 + 产品经理；\n 不通过退回「清单补充」，当天不排期。\n4. 复盘评审：通过条件=有结论与回写清单；签字 产品经理 + 运营负责人；不通过退回「补数据快照」。\n\n■ 三、指标口径\n北极星：尺码类工单率 = 工单分类为「尺码」的工单量 ÷ 当周支付订单量，按自然周（周一至周日），来源 ods_cs_ticket 与 ods_order，统计口径由数据分析 王工维护。\n护栏 1：退货率 = 退货单量 ÷ 支付订单量，按周，来源 ods_return；护栏 2：商详页跳出率，按周，来源 dws_page_traffic。\n口径变更：任何口径调整需产品经理与数据分析双方确认，并在本方案升版本号，历史数据不回溯时须注明。\n\n■ 四、合规动作\n1. 数据来源：退货原因与商品尺寸参数（内部级）；不涉及个人信息字段。\n2. 出域：仅「床垫尺寸 + 使用人数 + 商品规格表」可发外部模型（公开级），用户标识一律不发。\n3. 内容审核：组件文案过词库（绝对化/功效/价格三类），由内容审核 李工 2 小时内出结论。\n4. 留痕与留存：提示词与返回结果存本地 /data/ai/2026-11/，保留 90 天，到期由数据组 张工删除并登记。\n\n■ 五、风险与预案\n1. 数据不全（缺 12 个 SKU 尺寸参数）：触发信号=灰度前仍缺；预案=先用 116 个 SKU 上线，缺的走人工兜底。\n2. 大促期流量波动导致对照组不可比：触发信号=两组流量差异 >15%；预案=暂停灰度，节后重跑。\n3. 组件拖慢商详加载：触发信号=首屏 P75 上升 >200ms；预案=组件异步加载，仍超则回滚组件入口。\n4. 合规：文案被判绝对化（触发信号=审核拦截 ≥1 条）；预案=当天改写，不带病上线。\n\n■ 六、复盘与回写\n复盘看四个数：尺码工单率、退货率、跳出率、组件点击率，均为上线前后各 14 天，口径见第三节。\n结论回写：① 若工单率降幅 <10%，回写到《立项书》第一节「机会」并标注假设不成立；\n② 若退货率上升，回写到本方案第五节风险 4 并新增触发信号；\n③ 若组件点击率 <8%，回写到《PRD》交互章节，说明入口位置需重估。\n回写责任人：产品经理；落地位置：对应文档的具体章节；下次评审检查项：上轮回写是否已落地。"}, "task": "产出《端到端产品方案（含合规）》：链路与交接物：五个环节各交付什么、交接给谁、下一环节拿它做什么；闸门与签字：四道闸门的通过条件、签字岗位、不通过时退回哪一步；指标口径：北极星与护栏指标的分子分母、统计周期、数据表来源，以及口径变更的审批方式；合规动作：数据来源与出域、内容审核、留痕与留存，逐条写清由谁在哪一步执行；风险与预案：至少三条主要风险（技术/供应/合规），每条给触发信号与预案；复盘与回写：复盘时看哪几个数、结论回写到哪份文档的哪一段、落到谁", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M7 综合实战：从 0 到 1 设计一款零售电商产品」模块，你要交付的是《端到端产品方案（含合规）》。\n【场景】业务侧这周的诉求是：方案的价值在被人执行，而执行的前提是每一步都有人、有物、有退回的地方。参考做法：一份没写「不通过退回哪一步」的闸门清单，执行两次就会失效。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（六段结构（链路与交接物 / 闸门与签字 / 指标口径 / 合规动作 / 风险与预案 / 复盘与回写）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《端到端产品方案（含合规）》填写模板】\n\n■ 1. 链路与交接物：五个环节各交付什么、交接给谁、下一环节拿它做什么\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 闸门与签字：四道闸门的通过条件、签字岗位、不通过时退回哪一步\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 指标口径：北极星与护栏指标的分子分母、统计周期、数据表来源，以及口径变更的审批方式\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 合规动作：数据来源与出域、内容审核、留痕与留存，逐条写清由谁在哪一步执行\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 风险与预案：至少三条主要风险（技术/供应/合规），每条给触发信号与预案\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 复盘与回写：复盘时看哪几个数、结论回写到哪份文档的哪一段、落到谁\n   ‣ 提示：按「结论 → 依据 → 行动」三段写。\n   ‣ 我的填写：____________________________________________\n\n■ 7. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【端到端产品方案 · 尺码助手】版本 v1.0　负责人：产品经理　生效：11/08　复审：上线后 30 天\n\n■ 一、链路与交接物\n1. 立项 → PRD：交接物《立项书 v1.0》，接收人 技术负责人（评估可行性）与运营负责人（认领指标）。\n2. PRD → 研发：交接物《PRD + 验收用例集》，接收人 前端负责人与测试负责人；测试据此写脚本，写不出即退回。\n3. 研发 → 上线：交接物《上线检查清单 + 回滚演练记录》，接收人 运维值班；无演练记录不予排期。\n4. 上线 → 复盘：交接物《上线前后 14 天数据快照》，接收人 数据分析；口径以本方案第三节为准。\n\n■ 二、闸门与签字\n1. 立项评审：通过条件=有机会依据与合规四项；签字 评审委员会 3 人；不通过退回「机会重估」。\n2. 需求评审：通过条件=每条需求有验收用例且覆盖一个异常路径；签字 技术负责人 + 测试负责人；\n 不通过退回「PRD 补用例」。\n3. 上线评审：通过条件=回滚演练记录（含实测耗时）+ 三个观察指标与阈值；签字 运维值班 + 产品经理；\n 不通过退回「清单补充」，当天不排期。\n4. 复盘评审：通过条件=有结论与回写清单；签字 产品经理 + 运营负责人；不通过退回「补数据快照」。\n\n■ 三、指标口径\n北极星：尺码类工单率 = 工单分类为「尺码」的工单量 ÷ 当周支付订单量，按自然周（周一至周日），来源 ods_cs_ticket 与 ods_order，统计口径由数据分析 王工维护。\n护栏 1：退货率 = 退货单量 ÷ 支付订单量，按周，来源 ods_return；护栏 2：商详页跳出率，按周，来源 dws_page_traffic。\n口径变更：任何口径调整需产品经理与数据分析双方确认，并在本方案升版本号，历史数据不回溯时须注明。\n\n■ 四、合规动作\n1. 数据来源：退货原因与商品尺寸参数（内部级）；不涉及个人信息字段。\n2. 出域：仅「床垫尺寸 + 使用人数 + 商品规格表」可发外部模型（公开级），用户标识一律不发。\n3. 内容审核：组件文案过词库（绝对化/功效/价格三类），由内容审核 李工 2 小时内出结论。\n4. 留痕与留存：提示词与返回结果存本地 /data/ai/2026-11/，保留 90 天，到期由数据组 张工删除并登记。\n\n■ 五、风险与预案\n1. 数据不全（缺 12 个 SKU 尺寸参数）：触发信号=灰度前仍缺；预案=先用 116 个 SKU 上线，缺的走人工兜底。\n2. 大促期流量波动导致对照组不可比：触发信号=两组流量差异 >15%；预案=暂停灰度，节后重跑。\n3. 组件拖慢商详加载：触发信号=首屏 P75 上升 >200ms；预案=组件异步加载，仍超则回滚组件入口。\n4. 合规：文案被判绝对化（触发信号=审核拦截 ≥1 条）；预案=当天改写，不带病上线。\n\n■ 六、复盘与回写\n复盘看四个数：尺码工单率、退货率、跳出率、组件点击率，均为上线前后各 14 天，口径见第三节。\n结论回写：① 若工单率降幅 <10%，回写到《立项书》第一节「机会」并标注假设不成立；\n② 若退货率上升，回写到本方案第五节风险 4 并新增触发信号；\n③ 若组件点击率 <8%，回写到《PRD》交互章节，说明入口位置需重估。\n回写责任人：产品经理；落地位置：对应文档的具体章节；下次评审检查项：上轮回写是否已落地。", "rubric": ["五个环节每个都要写明交接物与接收人，只写「输出 PRD」不写交给谁按未写完计", "四道闸门的通过条件要可核对（有没有那份东西），并写明不通过退回哪一步", "指标口径写到分子分母与来源表，口径变更要写审批人", "复盘段要写清回写到哪份文档的哪一段、落到谁，不写「持续优化」"]}, {"id": "M7U8", "tier": "adv", "step": "spar", "title": "CEO 挑战你的端到端方案", "video": {"dur": "3.2min", "script": ["CEO 不缺方案，缺的是有人在说「能做成」的同时，也说清「做不成会怎样」", "挑战清单：价值与成本 / 最坏情况 / 组织依赖 / 复盘承诺", "「这个项目最坏会坏成什么样，你多久能知道？」——这一问考的是你有没有想过失败"]}, "ppt": {"method": "挑战清单：价值与成本 / 最坏情况 / 组织依赖 / 复盘承诺", "case": "「这个项目最坏会坏成什么样，你多久能知道？」——这一问考的是你有没有想过失败", "demo": "陪练对话界面说明（把方案粘进系统提示词，让对手按你的六段挑最薄的一处问）"}, "objective": "能在 CEO 4 轮追问下，说清价值与成本、最坏情况、组织依赖与复盘承诺，且不承诺做不到的事", "transfer": "把陪练里没答好的那一问补成一段话，写进下次汇报的第一页", "vslides": [{"t": "陪练说明：他不缺方案，缺说清失败的人", "n": "CEO 的问题和评审委员会不一样。委员会关心这件事能不能成，CEO 关心的是成了值多少、不成亏多少。所以他问的四件事是：值多少钱、最坏什么样、离了谁做不成、做完怎么知道对错。这四个问题有个共同点：都在问「边界」。他不指望你说「一定成」，他怕的是你只说「一定成」。答这类对话有一条铁律：所有承诺都要能落到监控或金额上。说「效果会不错」是零信息，说「工单率降 20%，按每单客服成本 6 元算，一年省 19 万，投入 8 人日约 1.2 万」才是一个能被他拿去决策的句子。反过来，说「最坏就是效果不好」也不行，要说出最坏的具体形态和发现时间。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">CEO 的四问</tspan></text><g data-k=\"值多少钱\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">值多少钱</tspan></text></g><g data-k=\"最坏什么样 / 多久知道\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"78.0\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">最坏什么</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">样 / 多久</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">知道</tspan></text></g><g data-k=\"离了谁做不成\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">离了谁做</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">不成</tspan></text></g><g data-k=\"怎么知道对错\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">怎么知道</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">对错</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.62}, {"t": "价值与成本：换算成他能决策的单位", "n": "第一问最常见的失败答法是给百分比。「工单率降 20%」对他来说不是价值，是中间指标；要换算成钱：每月 2,700 单尺码咨询，每单客服成本约 6 元，降 20% 就是每月省 3,240 元，一年约 3.9 万。成本侧也一样，8 人日按内部计价折约 1.2 万，挤掉的是推荐位改版。这样一算，投入产出比就出来了，他能直接判断值不值。换算时要注意两个坑：一是不要用「行业平均客单价」这类外来的数，用自己后台的；二是把不确定的部分标出来——比如「退货率下降带来的收益我没算进去，因为退货成本涉及二次物流，口径还没统一」，主动标出没算的部分，比硬凑一个总数更可信。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 中间指标换成钱（单量 × 单价）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 中间指标换成钱（单量 × 单价）</tspan></text></g><g data-k=\"② 成本给人日 + 折算金额\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 成本给人日 + 折算金额</tspan></text></g><g data-k=\"③ 挤掉了什么，两边对比\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 挤掉了什么，两边对比</tspan></text></g><g data-k=\"④ 没算的部分主动标出\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 没算的部分主动标出</tspan></text></g></svg>", "d": 62.57}, {"t": "最坏情况与依赖：把「停」写进方案", "n": "第二问考的是你有没有想过失败。答法三要素：最坏的具体形态（不是「效果不好」，是「拖慢商详页导致大促转化下降」）、发现时间（第 3 天，因为首屏 P75 上升 200ms 就报警）、谁按停止键（运维值班可直接回滚，不用等我）。第三样最关键——如果停止权在你手上，而你那天在飞机上，这个预案等于不存在。第三问考组织依赖：这件事离了谁做不成。要具体到环节和人，并给备份方案，比如「尺寸参数依赖数据组张工，他休假时由李工接，交接文档在方案第五节」。答「团队能力足够」是最差的答法，因为它回避了问题。第四问是复盘判据：什么结果说明我错了、错了改什么。这一问答得好，前面三问的可信度都会跟着上来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"最坏形态要具体（不是「效果不好」）\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">最坏形态要具体（不是「效果不好」）</tspan></text></g><g data-k=\"发现时间 + 报警阈值\"><g><circle cx=\"30\" cy=\"80\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 80 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"84.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">发现时间 + 报警阈值</tspan></text></g><g data-k=\"谁有权按停止键（不能只有你）\"><g><circle cx=\"30\" cy=\"108\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 108 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"113.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">谁有权按停止键（不能只有你）</tspan></text></g><g data-k=\"关键环节 + 备份人\"><g><circle cx=\"30\" cy=\"137\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 137 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"141.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">关键环节 + 备份人</tspan></text></g><g data-k=\"什么结果说明我错了\"><g><circle cx=\"30\" cy=\"165\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 165 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"170.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">什么结果说明我错了</tspan></text></g></svg>", "d": 67.32}], "deliverable": {"type": "doc", "name": "端到端产品方案（含合规）", "rubric": ["价值到金额", "最坏与止损", "依赖与复盘"], "acceptance": "四问都能给出金额与成本、最坏情况与发现时间、关键人依赖与备份、复盘判据与改动项"}, "spar": {"role": "CEO", "persona": "只问四件事：值不值、最坏什么样、离了谁做不成、做完你怎么知道对错；不喜欢听「应该没问题」，喜欢听「什么条件下我会停」", "mustAsk": ["这个项目到底值多少钱？成本是多少？别给我百分比，给我数", "最坏会坏成什么样？你多久能知道？谁来按那个停止的按钮？", "这件事离了谁做不成？那个人如果下个月走了怎么办？", "做完之后你怎么知道是对的？如果错了，你会改什么？"]}, "exemplar": "（问：这个项目最坏会坏成什么样，你多久能知道？）\n\n结论：最坏的情况不是效果没达到，是组件拖慢商详页导致大促期整体转化下降。我在上线第 3 天就能知道——只要首屏 P75 上升超过 200ms 就触发回滚，这个阈值在方案里写死了。\n依据：三条风险里，效果不达标是可接受的（工单率降幅 <10% 就回写立项书、标注假设不成立），因为它只损失 8 人日；真正不能接受的是拖慢主链路，那是全局损失。所以我把监控放在最前面：首屏 P75、跳出率、组件加载耗时三个指标，上线后前 72 小时每小时看一次，由运维值班盯，超出阈值直接回滚组件入口，不需要等我确认。\n边界：我不能承诺「零影响」，也不能承诺大促期间一定稳。大促流量是平时的 6 倍，灰度 5% 在峰值时段的样本仍然有限，可能出现灰度看不出、全量才暴露的问题。所以我的建议是大促期间只保持 5% 灰度、不放量，节后再推全量——这个节奏会推迟一个月见到结论，需要你确认是否接受。如果不接受，我需要加一个人专门盯峰值时段的监控。", "task": "把《端到端产品方案（含合规）》拿到「CEO」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《端到端产品方案（含合规）》。现在要让它通过「CEO」这一关。\n【对手的立场】只问四件事：值不值、最坏什么样、离了谁做不成、做完你怎么知道对错；不喜欢听「应该没问题」，喜欢听「什么条件下我会停」。\n【他一定会追问】「这个项目到底值多少钱？成本是多少？别给我百分比，给我数」 / 「最坏会坏成什么样？你多久能知道？谁来按那个停止的按钮？」 / 「这件事离了谁做不成？那个人如果下个月走了怎么办？」\n【场景】你说「CEO 挑战你的端到端方案」，对方立刻回一句：这个项目到底值多少钱？成本是多少？别给我百分比，给我数 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["价值与成本给到金额或人日，不写「提升显著」「投入可控」", "最坏情况要写出具体形态、发现时间与止损动作，并指明谁有权按停止键", "关键人依赖要点名环节与备份方案，不写「团队能力足够」", "复盘判据要写清「什么结果说明我错了、错了改什么」，不写「持续优化」"]}]}]};

const STORE='aidax_retail_pm_v1';
let prog = loadProg();
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE))||{units:{},quizzes:{}}; }catch(e){ return {units:{},quizzes:{}}; } }
function saveProg(){ try{ localStorage.setItem(STORE, JSON.stringify(prog)); }catch(e){} syncMapProgress(); }

// 主站 URL 参数：?m=MX 深链定位模块；?weak=a,b 测评弱维（用于个性化高亮）。与主站进度 key 解耦又互通。
const UP=new URLSearchParams(location.search);
const WEAK=(UP.get('weak')||'').split(',').map(s=>s.trim()).filter(Boolean);
const DEEP_MODULE=UP.get('m')||'';

// 把学习进度回写主站（localStorage 同源共享），主站监听 storage 事件实时刷新。
// A6：不再只写「模块全通关」一个布尔值——逐单元写 done/watched/score，并给模块完成度 pct 与均分，
// 主站学习地图才能显示「做了几单元、得了多少分」，而不是要么 0% 要么 100%。
function syncMapProgress(){
  try{
    const key='ai_training_progress';
    let cp={}; try{ cp=JSON.parse(localStorage.getItem(key))||{}; }catch(_){}
    const xp=totalXP();
    COURSE.modules.forEach((m,mi)=>{
      // cid 用模块编号（M3→m3），不用数组下标：样板间/子集课程里下标会错位（M3 变 m1），
      // 主站学习地图按 retail_pm_m3 取进度，对不上就永远显示 0%。
      const cid='retail_pm_m'+String(m.id||('M'+mi)).replace(/^M/,'');
      const units={}; let doneCnt=0, scoreSum=0, scoreCnt=0, taskCnt=0;
      m.units.forEach(u=>{
        const st=prog.units[u.id]||{};
        if(st.done) doneCnt++;
        if(st.taskDone) taskCnt++;
        if(typeof st.score==='number'){ scoreSum+=st.score; scoreCnt++; }
        units[u.id]={done:!!st.done, watched:!!st.watched,
                     score:(typeof st.score==='number')?st.score:null};
      });
      const allDone=(doneCnt===m.units.length);
      const prev=cp[cid]||{};
      cp[cid]=Object.assign({},prev,{
        done:allDone, pct:Math.round(doneCnt/m.units.length*100),
        doneCount:doneCnt, unitCount:m.units.length,
        units:(Object.keys(units).length?units:prev.units||null),
        avgScore:(scoreCnt?Math.round(scoreSum/scoreCnt):null),
        xp:xp, updatedAt:Date.now()
      });
      if(allDone && !prev.completedAt) cp[cid].completedAt=Date.now();
    });
    localStorage.setItem(key, JSON.stringify(cp));
  }catch(_){}
}

/* ===================== 管理员预览模式 =====================
   开启方式：URL 带 ?admin=1 或 ?preview=1，或点击页头「管理员预览」开关。
   作用：顶部显示横幅，练习/陪练/测验标注为可选，结算可跳过测试直接标记已观看。
   对学员（未开启）流程零影响。 */
const ADMIN_KEY='aidax_retail_pm_admin';
function isAdmin(){
  try{
    const p=new URLSearchParams(location.search);
    if(p.has('admin')||p.has('preview')){ try{localStorage.setItem(ADMIN_KEY,'1');}catch(e){} return true; }
    return localStorage.getItem(ADMIN_KEY)==='1';
  }catch(e){ return false; }
}
let ADMIN=isAdmin();
function toggleAdmin(){
  ADMIN=!ADMIN;
  try{ localStorage.setItem(ADMIN_KEY, ADMIN?'1':'0'); }catch(e){}
  applyAdminUI();
  if(prog.cur && findUnit(prog.cur)) openUnit(prog.cur);
}
function applyAdminUI(){
  const tg=document.getElementById('admin-toggle');
  if(tg) tg.textContent='管理员预览：'+(ADMIN?'开':'关');
  const bn=document.getElementById('admin-banner');
  if(bn) bn.style.display=ADMIN?'block':'none';
}
function refreshProg(){
  const u=Object.values(prog.units).filter(x=>x&&x.done).length;
  const tot=(typeof COURSE!=='undefined'&&COURSE.modules)?COURSE.modules.reduce((a,m)=>a+m.units.length,0):64;
  const pct=Math.round(u/(tot||64)*100);
  const q=Object.values(prog.quizzes).filter(Boolean).length;
  const sc=prog.scores? Object.values(prog.scores).filter(v=>typeof v==='number').length : 0;
  /* 顶栏只留一条进度条：具体数字收进设置面板 / 侧边栏，学员一眼看「走了多远」就够 */
  const bar=document.getElementById('prog-bar');
  if(bar){ bar.style.width=Math.max(pct?3:0,pct)+'%'; bar.parentNode.title='已完成 '+u+' / '+tot+' 单元'; }
  const set=function(id,v){ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('prog-done',u); set('prog-total',tot); set('prog-pct',pct+'%');
  set('prog-quiz',q); set('prog-mods',(COURSE.modules||[]).length);
  set('prog-score',sc); set('prog-xp',totalXP()); set('admin-units',tot);
}

let _cloudClient=null, _cloudModel=null, _cloudErr='';
function cloudClient(){
  if(_cloudClient) return _cloudClient;
  if(typeof WorkBuddyCloud==='undefined' || !WorkBuddyCloud.createWorkBuddyCloud){ _cloudErr='SDK未加载'; return null; }
  try{
    _cloudClient=WorkBuddyCloud.createWorkBuddyCloud({endpoint:CLOUD_CFG.endpoint, publishableKey:CLOUD_CFG.publishableKey});
  }catch(e){ _cloudErr=(e&&e.message)||String(e); return null; }
  return _cloudClient;
}
async function cloudModel(){
  if(_cloudModel) return _cloudModel;
  const c=cloudClient(); if(!c) return null;
  try{
    const list=await c.llm.models.list();
    const m=(list||[]).find(x=>x && x.disabled!==true);
    if(m && m.id){ _cloudModel=m.id; _cloudErr=''; return m.id; }
    _cloudErr='云端暂无可用模型';
  }catch(e){
    _cloudErr=(e&&e.error&&e.error&&e.error.code)?e.error.code:((e&&e.message)||String(e));
  }
  return null;
}
const CLOUD_FALLBACK_SYS='你是 AIDAX 企业 AI 实训课程的内嵌陪练教练。回答简洁具体、面向真实业务场景；需要真实数据的地方明确标出待填，绝不编造数字。';
async function cloudChat(messages, opts){
  const c=cloudClient(); if(!c) throw new Error(_cloudErr||'SDK未加载');
  const model=await cloudModel(); if(!model) throw new Error(_cloudErr||'云端无可用模型');
  const msgs=(messages||[]).slice();
  if(!msgs.length || msgs[0].role!=='system') msgs.unshift({role:'system',content:CLOUD_FALLBACK_SYS});
  let out='';
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),45000);
  try{
    const stream=await c.llm.chat.completions.create({
      model:model, messages:msgs, stream:true,
      temperature:(opts&&opts.temperature)||0.6,
      signal:ctl.signal
    });
    for await (const ch of stream){
      const d=ch&&ch.choices&&ch.choices[0]&&ch.choices[0].delta;
      if(d && d.content) out+=d.content;
    }
  } finally { clearTimeout(tm); }
  if(!out.trim()) throw new Error('云端返回空回复');
  return out.trim();
}

function llmEndpoint(){
  if(LLM.state==='direct' && LLM.key){
    return {url:'https://api.deepseek.com/chat/completions',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+LLM.key}};
  }
  return {url:LLM.base.replace(/\/$/,'')+'/chat', headers:{'Content-Type':'application/json'}};
}
async function llmChat(messages, opts){
  /* 优先通道 C（学员零配置）；仅在直连模式下跳过 */
  if(LLM.state!=='direct'){
    try{ return await cloudChat(messages, opts); }catch(e){ /* 继续降级 */ }
  }
  const ep=llmEndpoint();
  const body=Object.assign({model:'deepseek-chat',messages:messages,temperature:0.6,max_tokens:700},opts||{});
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), 25000);
  try{
    const r=await fetch(ep.url,{method:'POST',headers:ep.headers,body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('HTTP '+r.status+' '+t.slice(0,120)); }
    const j=await r.json();
    const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!c) throw new Error('空回复');
    return String(c).trim();
  } finally { clearTimeout(tm); }
}
async function llmProbe(silent){
  let st='off';
  try{ const m=await cloudModel(); if(m) st='cloud'; }catch(e){}
  if(st==='off'){

      const r=await fetch(LLM.base.replace(/\/$/,'')+'/ping',{cache:'no-store'});
      if(r.ok) st='proxy';
    }catch(e){}
  }
  if(st==='off' && LLM.key){
    try{
      const r=await fetch('https://api.deepseek.com/models',{headers:{'Authorization':'Bearer '+LLM.key}});
      if(r.ok) st='direct';
    }catch(e){}
  }
  LLM.state=st; paintLlm();

  return st;
}

      +(weakHit?'<span class="mweak" style="font-size:11px;color:#dc2626;border:1px solid #fecaca;background:#fef2f2;border-radius:6px;padding:0 5px;cursor:default;white-space:nowrap">📌 短板</span>':'')
      +'<span class="mquiz" style="'+(passed?'color:#166534;border-color:#86efac;background:#ecfdf5':'')+'">'+(passed?'\u2713 测验':'\uD83D\uDCDD 测验')+'</span>';
    const body=document.createElement('div'); body.className='mod-b';
    m.units.forEach(u=>{
      const el=document.createElement('div');
      el.className='unit'+(prog.cur===u.id?' active':'')+((prog.units[u.id]&&prog.units[u.id].done)?' done':'');
      el.innerHTML='<span>'+u.title.slice(0,11)+'</span><span class="st">'+STEP_LABEL[u.step]+'</span>';
      el.onclick=()=>openUnit(u.id);
      body.appendChild(el);
    });
    mod.appendChild(hd); mod.appendChild(body);
    hd.onclick=()=>mod.classList.toggle('open');
    hd.querySelector('.mquiz').onclick=ev=>{ ev.stopPropagation(); openQuiz(m.id); };
    sb.appendChild(mod);
  });
  const ft=document.createElement('div'); ft.className='sb-foot';
  ft.innerHTML='<button class="sb-cap" onclick="openScore(\'capstone\')">\uD83C\uDFC1 结业产出物评审</button>';
  sb.appendChild(ft);
  const act=sb.querySelector('.unit.active');
  if(act && act.scrollIntoView) act.scrollIntoView({block:'nearest'});
}

/* ===================== 单元主页 ===================== */
let CUR=null;   /* 当前单元播放器句柄，切换单元时先 stop */
let CHECK=null; /* 多邻国式分步通关状态：{uid, idx, steps} */
/* 配音预取：手机上点播放到出声要等 CDN 拉一段（1–2 秒），很像「点了没反应」。
   只把字节拉进浏览器 HTTP 缓存，不新建音频实例、不参与播放。
   注意必须放在全局作用域：renderUnit（进单元预热第一段）在播放器外面也要用它。 */
function prefetchAud(u){
  if(!u) return;
  try{ if(window.fetch) fetch(u,{mode:'no-cors',cache:'force-cache'}).catch(function(){}); }catch(e){}
}

function findUnit(uid){ for(const m of COURSE.modules){ const u=m.units.find(x=>x.id===uid); if(u) return {m,u}; } return null; }
function flatUnits(){ const a=[]; COURSE.modules.forEach(m=>m.units.forEach(u=>a.push(u))); return a; }
function nextUnit(uid){ const a=flatUnits(), i=a.findIndex(x=>x.id===uid); return i>=0&&i+1<a.length?a[i+1]:null; }
function prevUnit(uid){ const a=flatUnits(), i=a.findIndex(x=>x.id===uid); return i>0?a[i-1]:null; }

function toggleSb(){
  const sb=document.querySelector('.sidebar'); if(sb) sb.classList.toggle('open');
}
function closeSb(){
  const sb=document.querySelector('.sidebar'); if(sb) sb.classList.remove('open');
}
function openUnit(uid){
  prog.cur=uid; saveProg(); renderUnit(uid); renderSidebar();
  const mn=document.getElementById('main'); if(mn) mn.scrollTop=0;
  /* 手机上选完单元就把目录收起来：目录是为了选单元，不是用来一直占屏幕的 */
  if(window.innerWidth<=860) closeSb();
}

function renderUnit(uid){
  if(CUR){ try{CUR.stop();}catch(e){} CUR=null; }
  const f=findUnit(uid); if(!f) return;
  const {m,u}=f;
  CHECK={uid:uid, idx:resumeIdx(uid), steps:buildSteps(u)};
  const mn=document.getElementById('main');
  mn.innerHTML='<div class="stepper" id="stepper"></div><div class="cp" id="cp"></div>';
  if(mn) mn.scrollTop=0;
  renderCheckpoint();
  /* 进单元就把第一段配音拉进来（用户看「学完你能做到」的几秒正好用来缓冲） */
  const _aud=(typeof AUDIO!=='undefined'&&AUDIO[uid])||[];
  if(_aud[0]) prefetchAud(_aud[0]);
}

/* ===== 多邻国式分步通关 ===== */
function buildSteps(u){
  /* 三步制：看视频 → 做任务 → 结算。
     以前凡是有 deliverable 的单元都多插一步「交付物与陪练」，结果**理解型单元**
     （纯方法论、课上根本没有 AI 工具演示）也会弹「▶ 开始实战（复制陪练指令）」，
     点进去是一个没有靶子的空壳陪练——学员练两次就不信陪练了。
     现在：理解/演示环节做完自检与记录直接结算；产出与陪练只在「我要做 / 陪练」环节里。 */
  return [{key:'watch',icon:'\uD83D\uDCFA',title:'看视频'},
          {key:'task',icon:'\uD83D\uDCDD',title:'做任务'},
          {key:'settle',icon:'\uD83C\uDFC1',title:'结算'}];
}
function resumeIdx(uid){
  const st=prog.units[uid]||{};
  if(!st.watched) return 0;
  if(!st.taskDone) return 1;
  return 2;
}
function renderStepper(){
  const el=document.getElementById('stepper'); if(!el||!CHECK) return;
  const pct=CHECK.steps.length>1? Math.round(CHECK.idx/(CHECK.steps.length-1)*100):0;
  let h='';
  CHECK.steps.forEach((s,i)=>{
    const cls='st'+(i===CHECK.idx?' cur':'')+(i<CHECK.idx?' done':'');
    const ck=i<CHECK.idx?'✓':'';
    h+='<span class="'+cls+'"'+(i<CHECK.idx?' onclick="jumpStep('+i+')" style="cursor:pointer" title="回到这一步"':'')+'><span class="si">'+s.icon+'</span>'+s.title+(ck?' <span class="ck">'+ck+'</span>':'')+'</span>';
  });
  h+='<span class="sbar"><i style="width:'+pct+'%"></i></span>';
  el.innerHTML=h;
}
function renderCheckpoint(){
  if(!CHECK) return;
  if(CUR){ try{CUR.stop();}catch(e){} CUR=null; }
  const {uid}=CHECK;
  const f=findUnit(uid); if(!f) return;
  const {m,u}=f;
  const step=CHECK.steps[CHECK.idx];
  const cp=document.getElementById('cp');
  const mins=(unitSec(u)/60/RATE_DEF).toFixed(1);
  const ui=m.units.indexOf(u);
  if(step.key==='watch'){

    cp.innerHTML='<div class="cp-head"><div class="cp-title">\uD83D\uDCFA 视频讲解</div>'

      + objBox(u)
      +'<div class="card"><h3>\uD83C\uDFAC 视频讲解<span class="h3lnk" onclick="openSparChat(\''+uid+'\')">边看边问 ›</span></h3>'
      +'<div class="vwrap" id="p-wrap">'
      +'<div class="vp"><div class="stage" id="p-stage"></div><div class="dots" id="p-dots"></div>'
      +'<div class="cap" id="p-sub">点击播放，字幕与人声同步</div></div>'
      +'<div class="vbar"><button class="play" id="p-play">\u25B6 播放</button>'
      +'<div class="seek" id="p-seek"><div class="fill"></div><div class="knob"></div></div>'
      +'<span class="time" id="p-time">0:00 / 0:00</span>'
      +'<button class="pbtn" id="p-rate" title="倍速播放（默认 '+RATE_DEF+'\u00D7）">'+RATE_DEF+'\u00D7</button>'
      +'<button class="pbtn" id="p-fs" title="全屏观看">\u26F6 全屏</button></div>'
      +'</div>'
      +'<div class="aud-note" id="p-note"></div></div>'
      +'<details class="cp-notes"><summary>\uD83D\uDCCC 本课要点（讲义）</summary>'
      +'<div class="kv"><b>方法论：</b>'+sub(u.ppt.method)+'</div>'
      +'<div class="kv"><b>案例：</b>'+sub(u.ppt.case)+'</div>'
      +'<div class="kv"><b>演示要点：</b>'+sub(u.ppt.demo)+'</div></details>'
      +'<details class="cp-notes"><summary>\uD83D\uDDDE\uFE0F 本单元怎么学</summary>'+guideCard(uid,m,u,prog.units[uid]||{})+'</details>'
      +'<div class="cp-actions">'
      +'<button class="btn" onclick="setWatched(\''+uid+'\')">✓ 我看完了，下一步 →</button>'
      +'</div>';
    const aud=(AUDIO[uid]||null);
    const note=document.getElementById('p-note');
    if(note) note.textContent = aud? '配音：火山引擎豆包真人声（'+aud.length+' 段）' : '配音：本机语音合成';
    CUR=makePlayer(uid,u.vslides,aud);
  } else if(step.key==='task'){
    cp.className='cp';
    cp.innerHTML='<div class="cp-head"><div class="cp-title">\uD83D\uDCDD 做任务</div>'
      +'<div class="cp-sub">'+STEP_LABEL[u.step]+'环节 · '+STEP_HINT[u.step]+'</div></div>'
      +'<div id="act-area"></div>';
    renderActivity(u,uid);
  } else if(step.key==='deliv'){
    /* 已取消独立的「交付物与陪练」步骤：产出/陪练都留在「做任务」里，避免理解型单元被迫做空壳陪练。
       这里保留兜底，防止旧进度里残留的 deliv 序号把页面渲染成空白。 */
    cp.className='cp';
    cp.innerHTML='<div class="cp-head"><div class="cp-title">\uD83D\uDCE6 交付物</div></div>'
      + delivStrip(u)
      +'<div class="cp-actions"><button class="btn" onclick="setDelivSeen(\''+uid+'\')">继续 →</button></div>';
  } else {
    cp.className='cp centered settle';
    const st=prog.units[uid]||{};
    const nx=nextUnit(uid);
    const score=st.score||0;
    cp.innerHTML='<div style="font-size:40px">\uD83C\uDF89</div>'
      +'<div class="cp-title" style="margin-top:6px">本单元通关</div>'
      +'<div class="cp-score">+'+score+' 分</div>'
      +'<p style="font-size:13px;color:#5b7a63">你已完成「'+sub(u.title)+'」，累计积分 '+totalXP()+' 分。</p>'
      + trBox(u)
      /* 任务做完就地把标准答案放出来：哪几格选项判对、AI 输出该删/改/补哪几处。
         情景题单元才需要（理解型单元只有选择题和收获，那边自带解析）。 */
      + ((shOf(u)&&st.taskDone)?('<details class="ansbox" open><summary>\uD83D\uDCD6 标准答案 · 逐格对答 + 模型输出该改哪几处</summary>'+shRefHtml(u)+'</details>'):'')
      +'<div class="cp-actions">'
      +(nx?'<button class="btn ok" onclick="openUnit(\''+nx.id+'\')">继续下一个单元 →</button>':'<button class="btn ok" onclick="openUnit(\'M0U1\')">回到起点重学</button>')
      +'</div>'
      +'<div style="margin-top:10px;font-size:12.6px">'
      +((u.step==='todo'||u.step==='spar')?'<span class="lnk" onclick="openScore(\''+uid+'\')">请 AI 评审官给这份产出打分 ›</span>　':'')
      +'<span class="lnk" onclick="replayUnit(\''+uid+'\')">再练一遍本单元 ›</span></div>';
  }
  renderStepper();
}
function jumpStep(i){ if(!CHECK) return; if(i>=CHECK.idx) return; CHECK.idx=i; renderCheckpoint(); }
function advCheck(){ if(!CHECK) return; if(CHECK.idx<CHECK.steps.length-1){ CHECK.idx++; renderCheckpoint(); } else { renderCheckpoint(); } }
function prevCheck(){ if(!CHECK) return; if(CHECK.idx>0){ CHECK.idx--; renderCheckpoint(); } }
function setWatched(uid){ const st=prog.units[uid]||{}; prog.units[uid]=Object.assign({},st,{watched:true}); saveProg(); if(CUR){try{CUR.stop();}catch(e){}CUR=null;} advCheck(); }
function setDelivSeen(uid){ const st=prog.units[uid]||{}; prog.units[uid]=Object.assign({},st,{delivSeen:true}); saveProg(); advCheck(); }
function totalXP(){ let s=0; for(const k in prog.units){ const u=prog.units[k]; if(u&&u.done) s+=(u.score||0); } return s; }
function replayUnit(uid){ const st=prog.units[uid]||{}; prog.units[uid]=Object.assign({},st,{watched:false,taskDone:false,delivSeen:false,done:false,acts:{},score:0,detail:[]}); saveProg(); refreshProg(); renderSidebar(); openUnit(uid); }

/* ===================== P1：可运行产出物卡片 + 真·AI 陪练（路线①） ===================== */
function delivBadge(t){
  const map={skill:'skill',agent:'agent',workflow:'workflow',kb:'kb'};
  const k=map[t]||'skill';
  return '<span class="badge '+k+'">'+(map[t]||t||'产出')+'</span>';
}
/* 可测学习目标 / 行为转化提示：老课程没有这两个字段，函数返回空串即不渲染，向后兼容。 */
function objBox(u){
  if(!u||!u.objective) return '';
  return '<div class="objbox"><span class="ob-t">\uD83C\uDFAF 学完你能做到</span>'+esc(sub(u.objective))+'</div>';
}
function trBox(u){
  if(!u||!u.transfer) return '';
  return '<div class="trbox"><span class="tb-t">\uD83D\uDE80 回工位第一件事（48 小时内）</span>'+esc(sub(u.transfer))+'</div>';
}
/* A2：模板 / 范例的统一取值口。
   历史上这里取的是 d.templateText / d.exemplarText，而构建器从未写过这两个字段
   （模板在 u.template，范例在 u.practice.exemplar），结果「查看范例」按钮压根不渲染、
   陪练提示词恒为「（暂无范例）」。现在统一从单元对象取，两处旧字段仅作历史兼容。 */
function artTexts(u){
  var d=(u&&u.deliverable)||null;
  // 优先级：交付物上内联的正文（金融课由 build_full_course.py 内联完整模板/范例）
  //        → 单元级 template / practice.exemplar / exemplar（course_kit 生成的课）
  var tpl=(d&&d.templateText)||(u&&u.template)||'';
  var ex=(d&&d.exemplarText)||(u&&u.practice&&u.practice.exemplar)||(u&&u.exemplar)||'';
  return {tpl:tpl, ex:ex};
}
/* 模板里常自带一整套「参考样式」（8 项工作 + 耗时 + 红线 + 责任人，够得上一份完整答案）。
   把它当模板摆出来，学员就会整段贴回输入框。这里把它拆出来单列为范例：
   骨架负责「照着填」，范例负责「照着看颗粒度」，两件事不混在一屏。 */
function splitTplSample(tpl){
  const s=sub(tpl||'');
  const m=s.match(/^[ \t]*(?:■[ \t]*)?(参考样式|参考范例|参考答案|示例|样例|范例)[ \t]*[（(:：]/m);
  if(!m || m.index<0) return {skel:s, sample:''};
  return {skel:s.slice(0,m.index).trim(), sample:s.slice(m.index).trim()};
}
/* 交付物摘要条：只回答「交什么、按什么验收、评审看哪三条」。
   独立「交付物与陪练」步骤取消后，这三行信息并进「做任务」页顶部，不再单独占一屏。 */
function delivStrip(u){
  const d=u&&u.deliverable;
  if(!d||typeof d!=='object'||!d.name) return '';
  const rub=(d.rubric&&d.rubric.length)? d.rubric.join(' \u00B7 ') : '';
  const bcls=(d.type==='agent')?'agent':(d.type==='workflow')?'workflow':(d.type==='kb')?'kb':'skill';
  return '<div class="dstrip">'
    +'<div class="ds-h"><b>交这个：'+esc(d.name)+'</b>'+(d.type?('<span class="badge '+bcls+'">'+esc(d.type)+'</span>'):'')+'</div>'
    +(d.acceptance?('<div class="ds-a">验收：'+esc(d.acceptance)+'</div>'):'')
    +(rub?('<div class="ds-r">评审看：'+esc(rub)+'</div>'):'')
    +'</div>';
}
function openArt(kind,uid){
  const f=findUnit(uid); if(!f) return;
  const d=f.u.deliverable; if(!d) return;
  const A=artTexts(f.u);
  const text = kind==='tpl'? A.tpl : A.ex;
  const title = kind==='tpl'? ('模板 · '+d.name) : ('范例 · '+d.name);
  const box=document.getElementById('art-box');
  box.innerHTML='<h3 style="text-align:left">'+esc(title)+'</h3>'
    +'<div class="art-body">'+esc(text||'（内容缺失）')+'</div>'
    +'<div class="acts"><button class="btn" onclick="copyArt(\''+kind+'\',\''+uid+'\')">\uD83D\uDCCB 复制全文</button><button class="btn ghost" onclick="closeArt()">关闭</button></div>';
  document.getElementById('art-modal').classList.add('on');
}
function copyArt(kind,uid){
  const f=findUnit(uid); if(!f) return;
  const A=artTexts(f.u);
  copyText(kind==='tpl'? A.tpl : A.ex);
}
function closeArt(){ document.getElementById('art-modal').classList.remove('on'); }
function buildSparPrompt(u,m,d){
  const STEP_LABEL={understand:'理解',demo:'演示',practice:'我要做',spar:'陪练'};
  const stepLabel=STEP_LABEL[u.step]||u.step||'学习';
  const DIM_NAME={prompt:'提示词工程',tools:'AI工具实战',data:'AI数据分析与决策',content:'AI内容创作',
                  dev:'AI辅助开发',workflow:'AI协同工作流',security:'AI安全与合规',strategy:'AI战略思维'};
  const dims=(m.dims&&m.dims.length)? m.dims.map(function(k){return DIM_NAME[k]||k;}).join('、') : 'AI 通用能力';
  let rub=(d&&d.rubric&&d.rubric.length)? d.rubric.join('、')
        : (u.rubric? (Array.isArray(u.rubric)? u.rubric.join('、') : u.rubric) : '完整性、可用性、红线合规');
  const acc=(d&&d.acceptance)? d.acceptance : '产出可独立带回工作使用';
  const A=artTexts(u);
  const tpl=A.tpl||'（本单元无特定模板）';
  const ex=A.ex||'（暂无范例）';
  const brief=(u.brief||'').slice(0,600);
  const task=(u.task||'').slice(0,400);
  const dn=(d? (d.type+' —— 《'+d.name+'》') : '本单元产出');
  const L=[];
  L.push('# 角色');
  L.push('你是「'+META.courseTag+' · '+m.title+' ·（'+stepLabel+'环节）《'+u.title+'》」的专属 AI 陪练（资深带教导师）。');
  L.push('学员正在学习，并要亲手产出：'+dn+'。');
  L.push('');
  L.push('# 你的使命');
  L.push('用苏格拉底式引导，帮助学员**自己**把这份产出做出来，而不是替他写。最终学员的产出要能对照下方验收标准打到「通过」。');
  L.push('');
  L.push('# 学员背景（本单元）');
  L.push('- 行业：'+CUSTOM.industry+'；岗位：'+META.roleLabel);
  L.push('- 能力维度：'+dims);
  if(brief) L.push('- 单元要点：'+brief);
  if(task)  L.push('- 本单元任务：'+task);
  L.push('- 产出模板（引导学员按此结构填）：见「模板」');
  L.push('- 合格范例（仅作对照，禁止直接给学员照搬）：见「范例」');
  L.push('');
  L.push('# 陪练工作流');
  L.push('1. 先澄清：问学员当前理解、卡点（一次只问一个关键问题）。');
  L.push('2. 带拆解：把《'+(d?d.name:'本单元产出')+'》拆成 3–5 个可执行子任务，先让学员说思路。');
  L.push('3. 让动手：要求学员产出具体段落/字段，不接受泛泛而谈。');
  L.push('4. 评与改：对照验收标准与 rubric 给 0–100 分 + Top3 改进项，明确「通过 / 待改进」。');
  L.push('5. 通关：达标后总结这份产出可直接带回工作用的要点。');
  L.push('');
  L.push('# 评分标准（rubric）');
  L.push(rub);
  L.push('');
  L.push('# 验收标准');
  L.push(acc);
  L.push('');
  L.push('# 模板');
  L.push(tpl);
  L.push('');
  L.push('# 范例（仅作对照，禁止直接照搬给学员）');
  L.push(ex);
  L.push('');
  L.push('# 红线（必须遵守）');
  META.redlines.forEach(function(x){ L.push('- '+x); });
  L.push('- 全程中文，语气像资深带教导师，给具体、可执行的反馈。');
  return L.join('\n');
}
function openSparAI(uid, silent){
  const f=findUnit(uid); if(!f) return;
  const m=f.m, u=f.u, d=u.deliverable||null;
  const prompt=buildSparPrompt(u,m,d);
  window.__sparPrompt=prompt;
  copyText(prompt); // 进入即自动复制
  if(silent){ launchWorkBuddy(); toast('\uD83E\uDD4A 陪练指令已复制，粘到 WorkBuddy 就能开练'); return; }
