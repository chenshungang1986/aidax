<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>零售电商 × 产品经理 AI 实战 · 深版课程（M0/M1/M2/M3/M4/M5/M6/M7 · 64 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex:none}
  header h1{font-size:17px;font-weight:700;white-space:nowrap}
  header h1 span{display:none}   /* 课程副标题（样板间/单元数/行业机构产品）默认不显示：学员只需要课程名 */
  /* 顶栏只留三样：课程名、一条进度条、一个设置入口 */
  .hp{flex:1;height:5px;background:#e8eefb;border-radius:99px;overflow:hidden;max-width:560px;min-width:70px}
  .hp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1a5cff,#4f8bff);border-radius:99px;transition:width .35s}
  .gear{margin-left:auto;width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;font-size:15px;line-height:1}
  .gear:hover{border-color:var(--blue);color:var(--blue)}
  .cfg-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .cfg-row label{color:var(--mut);width:40px;flex:none}
  .cfg-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .cfg-sep{border:none;border-top:1px solid var(--line);margin:13px 0}
  .cfg-label{display:flex;align-items:center;gap:8px;text-align:left;font-size:12px;font-weight:700;color:var(--blue-d);margin:14px 0 5px;letter-spacing:.02em}
  .cfg-hint{text-align:left;font-size:11.8px;color:var(--mut);line-height:1.65;margin:3px 0 2px}
  .cfg-row label{width:auto;min-width:66px}
  .cfg-note{font-size:11.5px;color:#8a6d1f;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 9px;line-height:1.6;margin:6px 0}
  .ident-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#eef4ff;border:1px solid #c7d9ff;color:var(--blue-d);border-radius:999px;padding:3px 10px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;flex:1;min-height:0}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center;background:#fbfcff}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vwrap{position:relative}
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  /* 底部留出字幕条的高度：字幕是「占位」而不是「盖住」PPT 最后一行 */
  .vp .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px 60px;pointer-events:none}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#eaf0ff}
  .slide.on{display:flex}
  .slide h4{font-size:16px;margin:0 0 6px;color:#fff;flex:none}
  .slide svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  /* 高亮跟讲解走：未讲到的条目压暗，讲到的那一项亮起（.k-on 由播放器逐项切换） */
  .slide.spot [data-k]{opacity:.25;transition:opacity .25s ease}
  .slide.spot [data-k].k-on{opacity:1;filter:drop-shadow(0 0 7px rgba(150,190,255,.9)) brightness(1.06)}
  /* 字幕：永远只有一行，超出省略；不吃掉画面（stage 已为它留了 60px） */
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 70%,rgba(0,0,0,0) 100%);color:#fff;font-size:17px;font-weight:600;line-height:1.35;padding:12px 20px 10px;min-height:0;display:block;text-align:center;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes capin{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
  .cap.swap{animation:capin .16s ease-out}
  @media (max-width:620px){
    .vp .stage{padding:8px 8px 46px}
    .cap{font-size:13.5px;padding:8px 10px 6px;letter-spacing:0}
    .vbar{gap:7px}.play{padding:7px 12px;font-size:12.5px}.time{font-size:11.5px}
    /* 答案行在窄屏上改成自然折行：flex 会把「→ 标准答案」整体挤到下一行，读起来断得莫名其妙 */
    .anshd{display:block}
    .anshit{margin-left:0;display:block;margin-top:3px}
    .opb{margin-right:5px}
  }
  .dots{position:absolute;top:9px;left:12px;display:flex;gap:5px;justify-content:flex-start}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
  .dots i.on{background:#fff}
  .vbar{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
  .play{background:var(--blue);color:#fff;border:none;padding:8px 17px;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600;white-space:nowrap}
  .seek{flex:1;min-width:160px;height:8px;border-radius:6px;background:#e4eaf7;position:relative;cursor:pointer;touch-action:none}
  .seek .fill{height:100%;background:var(--blue);border-radius:6px;width:0;pointer-events:none}
  .seek .knob{position:absolute;top:-4px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-left:-7px;left:0;pointer-events:none}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .pbtn{background:#fff;color:var(--blue-d);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.1}
  .pbtn:hover{border-color:var(--blue);color:var(--blue)}
  /* 全屏：把「画面 + 控制条」一起放进去，否则全屏后没法暂停/拖进度 */
  #p-wrap:fullscreen,#p-wrap:-webkit-full-screen{background:#070d1c;display:flex;flex-direction:column;justify-content:center;padding:10px 3vw 14px;border-radius:0;box-sizing:border-box}
  #p-wrap:fullscreen .vp,#p-wrap:-webkit-full-screen .vp{width:100%;height:calc(100% - 58px);aspect-ratio:auto;border-radius:0}
  #p-wrap:fullscreen .cap,#p-wrap:-webkit-full-screen .cap{font-size:23px;padding:16px 28px 12px}
  #p-wrap:fullscreen .vbar,#p-wrap:-webkit-full-screen .vbar{padding:0 2px}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .aud-note{font-size:12px;color:var(--mut);margin-top:5px}
  textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;background:#fcfdff}
  input.tin{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fcfdff}
  .btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:13.2px;margin:6px 6px 0 0}
  .btn.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
  .btn.ok{background:var(--green)}
  .btn[disabled]{background:#c9d3e6;cursor:not-allowed;border-color:#c9d3e6;color:#fff}
  .wb{background:#0e1530;color:#dce6ff;border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;line-height:1.7}
  .wb .me{color:#ffd98a}.wb .ai{color:#9be8b0}.wb .hl-line{color:#fff;font-weight:600}
  .chat{display:flex;flex-direction:column;gap:9px;margin:6px 0}
  .bub{max-width:82%;padding:9px 12px;border-radius:11px;font-size:13.3px;white-space:pre-wrap}
  .bub.ai{background:#eef4ff;color:var(--blue-d);align-self:flex-start}
  .bub.me{background:var(--blue);color:#fff;align-self:flex-end}
  .bub.sys{background:#f1f4fa;color:var(--mut);align-self:center;font-size:12px;max-width:100%}
  .qs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .qbtn{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.4px;cursor:pointer}
  .qbtn:hover{border-color:var(--blue);color:var(--blue)}
  .done-card{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:18px;text-align:center}
  .done-card h3{font-size:19px;color:#166534;margin-bottom:4px}
  .cp-score{font-size:30px;font-weight:800;color:#16a34a;margin:6px 0}
  .tag-done{display:inline-block;background:var(--green);color:#fff;font-size:12px;padding:1px 9px;border-radius:20px;margin-left:6px}
  /* 题干 / 模板 / 评分 */
  .ip{border-left:4px solid var(--blue)}
  .ip-task{font-size:14.5px;font-weight:700;margin:2px 0 8px;color:var(--txt)}
  .brief{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.1px;white-space:pre-wrap;line-height:1.78;color:#28345a}
  .tpl{background:#0e1530;color:#d7e3ff;border-radius:11px;padding:13px 15px;font-size:12.6px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  details>summary{cursor:pointer;font-size:13.3px;color:var(--blue-d);font-weight:600;margin:10px 0 6px;list-style:none;display:flex;align-items:center;gap:6px}
  details>summary::-webkit-details-marker{display:none}
  details>summary:before{content:"\25B8";transition:transform .15s;display:inline-block}
  details[open]>summary:before{transform:rotate(90deg)}
  .rub{list-style:none;font-size:13px;color:var(--mut);margin:4px 0}
  .rub li{padding:2px 0 2px 20px;position:relative}
  .rub li:before{content:"\25CB";position:absolute;left:2px;color:#c3ccdf}
  /* ===== 演示环节 · 情景题（素材 + 填写框架） ===== */
  .shsitu{background:#f1f5fd;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 13px;font-size:13.3px;line-height:1.8;color:#28345a;white-space:pre-wrap}
  .shask{font-size:12.9px;color:var(--mut);line-height:1.85;margin:8px 0 4px;white-space:pre-wrap}
  .shbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--mut);margin:12px 0 8px;flex-wrap:wrap}
  .shcard{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fff}
  .shhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.2px;color:var(--mut);margin-bottom:7px}
  .shhead b{color:var(--blue);font-size:12.6px;font-family:ui-monospace,Menlo,monospace}
  .shmat{font-size:13.2px;line-height:1.8;white-space:pre-wrap;background:#f7f9fd;border-radius:7px;padding:9px 11px;margin-bottom:9px;color:#1f2a44}
  .shc{margin-top:7px}
  .shrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .shrow>.shc{flex:1 1 200px;min-width:0}
  .shc>label{display:block;font-size:12.2px;color:var(--mut);margin-bottom:5px}
  .shtags{display:flex;flex-wrap:wrap;gap:5px}
  .shtag{font-size:12.3px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:#fff;user-select:none;color:#3b4763;transition:.12s}
  .shtag:hover{border-color:#b9caf0}
  .shtag.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .shin{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;color:var(--txt)}
  .shin:focus{outline:none;border-color:var(--blue)}
  .shstep{margin-top:18px;padding-top:15px;border-top:1px dashed var(--line)}
  .shstep>b{display:block;font-size:13.4px;margin-bottom:8px;color:var(--txt)}
  .shstep.lock{opacity:.45;pointer-events:none}
  .shref{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px;padding:11px 13px;margin-top:14px}
  .shref>.hd{font-size:13px;font-weight:700;color:#166534;margin-bottom:6px}
  /* 陪练材料卡：把上一节产出带进这一关 */
  .matbox{border:1px solid #dbe4f5;background:#f6f9ff;border-radius:10px;padding:10px 12px;margin:12px 0}
  .matbox .mhd{font-size:13px;font-weight:700;color:#1d4ed8}
  .matbox .mname{font-size:12.8px;color:var(--txt);margin-top:4px;font-weight:600}
  .matbox .mhint{font-size:12.4px;color:var(--mut);margin-top:4px;line-height:1.6}
  .matbox .mact{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12.5px}
  .matbox details{margin-top:7px}
  .matbox textarea{min-height:96px;margin-top:6px}
  /* 标准答案：逐格对答 + 模型输出该改哪几处 */
  .ansrow{border:1px solid #e6e9f0;border-radius:9px;padding:8px 10px;margin-bottom:7px;background:#fff}
  .ansrow.bad{border-color:#fecdd3;background:#fff7f8}
  .ansrow.good{border-color:#d7ead9;background:#f8fdf9}
  .anshd{font-size:12.6px;line-height:1.75;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
  .ansid{font-weight:700;color:#1f2b45}
  .ansg{color:#8f9ab0}
  .answ{color:#166534;font-weight:700}
  .ansy{color:#be123c;font-weight:700}
  .answhy{font-size:12px;color:#5a6580;margin-top:4px;line-height:1.6}
  .anshit{margin-left:auto;font-size:11.5px;color:#8f9ab0;white-space:nowrap}
  .anscov{font-size:12.5px;color:#3d6b4a;margin:0 0 8px}
  .opb{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:700}
  .opb.cut{background:#fee2e2;color:#be123c}
  .opb.fix{background:#fef3c7;color:#92400e}
  .opb.add{background:#dbeafe;color:#1d4ed8}
  .ansbox{border:1px solid #dbe4f6;background:#fbfcff;border-radius:10px;padding:8px 12px;margin-top:12px;text-align:left}
  .ansbox>summary{cursor:pointer;font-size:13px;font-weight:700;color:#1a5cff}
  .ansbox .shref{margin-top:10px}
  .dtxt{font-size:12.5px;line-height:1.85;white-space:pre-wrap;border-radius:8px;padding:10px 12px;margin:6px 0;color:#243050;font-family:inherit}
  .rub li.ok{color:#166534}
  .rub li.ok:before{content:"\25CF";color:var(--green)}
  .rub li span.hint{color:#b4682a;font-size:12px}
  .bar{height:9px;background:#e4eaf7;border-radius:6px;overflow:hidden;margin:7px 0 3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1a5cff,#4d8bff);transition:width .3s}
  /* 测验 */
  .qz-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:9px 0;background:#fff}
  .qz-item .q{font-size:13.8px;font-weight:600;margin-bottom:7px}
  .qz-item .op{padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13.2px;border:1px solid transparent}
  .qz-item .op:hover{background:#f5f8ff}
  .qz-item .op.right{background:var(--green-bg);color:#166534;border-color:#86efac}
  .qz-item .op.wrong{background:#fff1f2;color:#be123c;border-color:#fecdd3}
  .qz-item .tip{font-size:12.5px;color:var(--mut);display:none;margin-top:6px}
.qz-item .op.sel{background:#eef4ff;border-color:#93b4f0;color:#1d4ed8;font-weight:600}
.qz-item .op.sel:hover{background:#e6eeff}
.qz-item .op.picked{box-shadow:inset 0 0 0 2px #94a3b8}
.qz-submit{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.qz-submit .prog{font-size:12.5px;color:var(--mut)}

const COURSE = {"id": "retail_pm", "role": "pm", "customization": {"industry": "零售电商", "company": "模拟电商品牌 Y", "product": "优选生活馆"}, "modules": [{"id": "M0", "title": "M0 导论：零售电商 PM 的 AI 机会与红线", "dims": ["security", "workflow"], "units": [{"id": "M0U1", "tier": "basic", "step": "understand", "title": "零售电商 PM 的 6 类 AI 机会与 3 条红线", "video": {"dur": "3.7min", "script": ["零售电商 PM 同时背 GMV、转化与合规三本账，是 AI 落地最容易见效也最容易出事的岗位", "六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）", "某美妆电商用 AI 把周报从 6 小时压到 40 分钟"]}, "ppt": {"method": "六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）", "case": "某美妆电商用 AI 把周报从 6 小时压到 40 分钟", "demo": "红线对照卡：把「贴用户订单明细进公开 AI」标记为高危"}, "objective": "能画出自己岗位的 AI 机会—红线对照表，并挑出 3 项本周就能动手的切入点", "transfer": "回工位 48 小时内，从最占时间的一件事里选一个 AI 切入点，写清「AI 出初稿、我把关什么」，发给主管", "vslides": [{"t": "开场：零售电商 PM 为什么是落点", "n": "在电商里，同时背 GMV、转化率和合规风险三个指标的岗位，基本就是产品经理。你既听得懂运营的大促节奏，也讲得清供应链的履约约束，所以 AI 在零售落地时，最先产生价值的地方往往不在算法团队，而在你每天要交的那些东西上：活动方案、竞品对比、周报、需求文档。判断一个环节值不值得上 AI，只问一句：这件事是不是「读一堆材料、出一版初稿、再做几组对比」？如果是，AI 能替你干掉前面这些苦活，你留下判断和拍板；如果不是，比如定价、选品、招商谈判，AI 帮到你的上限就是整理材料。这一节给你两样东西：一张能对着自己工作勾选的机会地图，和三条越线就不能上线的硬红线。这一章后面七节，都会围绕这张图和三条线展开。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">零售电商 PM 的位置</tspan></text><g data-k=\"懂用户\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">懂用户</tspan></text></g><g data-k=\"懂货盘\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">懂货盘</tspan></text></g><g data-k=\"懂成本\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">懂成本</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.57}, {"t": "六类 AI 机会：逐条对应日常痛点", "n": "机会拆成六类，每一类都对应一件具体的事。一，洞察：把近 30 天几千条商品评论按主题聚类，提炼 Top5 差评原因，原来要读一整天，现在十分钟出初稿。二，研究：把浏览、加购、下单的行为路径拼成四到六个用户分层，替代手工拉表。三，设计：详情页卖点排序、活动玩法文案、利益点表达，先出五版再挑。四，分析：漏斗拆解与复购归因，把「转化掉了」变成「哪一步掉了、掉了几个点」。五，协同：库存与活动的联动检查、跨部门需求对齐纪要。六，合规：把广告法禁用词、价格标示规则逐条比对文案。这六类加起来，通常占掉零售 PM 六成以上的时间；先挑占时最多、且错了也不致命的那一类开始，别一上手就碰定价。顺序错了，第一次尝试失败就会让人得出「AI 没用」的结论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六类 AI 机会</tspan></text><g data-k=\"洞察\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">洞察</tspan></text></g><g data-k=\"研究\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">研究</tspan></text></g><g data-k=\"设计\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">设计</tspan></text></g><g data-k=\"分析\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">分析</tspan></text></g><g data-k=\"协同\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">协同</tspan></text></g><g data-k=\"合规\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">合规</tspan></text></g></svg>", "d": 81.19}, {"t": "三条红线：越线就别上线", "n": "红线三条，条条都硬。第一，数据不裸奔：用户订单、手机号、收货地址、精确定位这类个人信息，不许贴进公开大模型；要分析就先脱敏到「样本 A + 品类 + 情感极性」这个粒度。第二，不替人决策：定价、选品、坑位分配、供应商取舍，最终签字的人必须写在方案里，AI 只出建议和依据。第三，可解释可追溯：每个结论能说清来自哪份数据、哪次访谈、哪个看板，出问题能回放过程。这三条不是为了限制你，而是让 AI 的产出敢进评审会、敢给上级看。守住它们，你的提效才是可复用的；守不住，一次事故就足以把团队全年的 AI 尝试全部叫停。下一节我们就把同一份用户数据，用踩线和守线两种方式各跑一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"数据不裸奔：订单与隐私不进公开模型\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据不裸奔：订单与隐私不进公开模型</tspan></text></g><g data-k=\"不替人决策：签字的人写进方案\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替人决策：签字的人写进方案</tspan></text></g><g data-k=\"可解释可追溯：结论能指回依据\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">可解释可追溯：结论能指回依据</tspan></text></g></svg>", "d": 68.9}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["机会识别", "红线判定", "可执行性"], "acceptance": "粘贴任意 PM 交付物，能输出三类红线风险清单与修改建议，且不越权下合规判断"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）\n【为什么重要】零售电商 PM 同时背 GMV、转化与合规三本账，是 AI 落地最容易见效也最容易出事的岗位\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["能说清「读材料→出初稿→做对比」这类活为什么可以交给 AI，而「定取舍→担责任」不能（各举一个自己岗位的例子）", "六类机会里至少命中三类，且每一类能对上一件本周真实做过的事，不是复述概念", "三条红线能各自说出一个具体越线场景（含数据字段名或决策动作），而不是只报红线名字", "自检题全对；收获写成一句能马上动手的话（含时间点或对象），不写「学到了很多」"]}, {"id": "M0U2", "tier": "basic", "step": "demo", "title": "同一份用户数据：踩红线 vs 守红线", "video": {"dur": "3.6min", "script": ["绝大多数风险不是 AI 不可靠，而是人随手把不该外传的东西贴了出去", "踩红线 / 守红线对照演示（同一份用户评价两种处理方式）", "「优选生活馆」改版复盘材料（含真实用户订单片段）"]}, "ppt": {"method": "踩红线 / 守红线对照演示（同一份用户评价两种处理方式）", "case": "「优选生活馆」改版复盘材料（含真实用户订单片段）", "demo": "WorkBuddy 内跑一遍脱敏后的评价洞察生成"}, "objective": "能独立完成一次「脱敏 + 只给结构化字段」的 AI 调用，并说清整段粘贴的 4 个具体风险", "transfer": "把手上含用户信息的材料按可贴 / 需脱敏 / 禁止贴分三类，先删掉第三类再问 AI", "vslides": [{"t": "演示准备：一份含用户隐私的数据", "n": "我们开始演示。手上是一份「优选生活馆」的改版复盘，里面附带了用户评价的原始记录：用户昵称、手机号、收货城市，还有一条带订单号的退换货记录。在做任何 AI 操作之前，先看一眼它属于什么级别的数据，这一步是习惯，不是形式。电商数据里，身份与交易是最高敏的两类，只要出现手机号、收货地址、订单号、支付流水中的任意一项，这份材料就不能整段往外贴。接下来三分钟你会看到同一条业务诉求的两种做法：一种是把原始材料整段贴进公开模型，另一种是只给结构化字段。两者都能拿到洞察，区别在数据有没有出域。演示里的材料做了替换，姓名、手机号、订单号都是构造值，但字段结构和你手上的真实材料完全一致，所以你在这看到的风险点可以直接对上自己的工作。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示数据预览</tspan></text><g data-k=\"原始评价片段\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">原始评价片段</tspan></text></g><g data-k=\"用户：小* 手机：138****\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">用户：小*  手机：138****</tspan></text></g><g data-k=\"订单号：SO2026**** 退换原因：尺码\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">订单号：SO2026**** 退换原因：尺码</tspan></text></g></svg>", "d": 74.09}, {"t": "踩红线：整段粘贴到公开大模型", "n": "先模拟最常见的错误操作：把整段评价，连同手机号和订单号，一起粘贴到公开的聊天窗口。它会给出很漂亮的洞察，效率看起来很高。但代价是这些数据已经离开企业边界，而且通常是不可撤回的——你删掉对话，不代表对方不留存。个人信息保护法下，未脱敏的订单与联系方式属于个人信息，出事后一般走两条线：监管侧处罚，和企业侧问责到人。更现实的问题是责任链：一旦这份材料被转发，你无法证明脱敏前后的一致性。便利和风险在这里是同步放大的，所以这一步不能靠自觉，要靠流程卡住——把「能不能贴」做成一张字段清单，而不是每次凭感觉判断。这张清单其实只要四行：身份、位置、交易、商务条款，逐行问一句「这行数据能不能出这个门」，答案立刻清楚。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩红线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">代价</tspan></text><g data-k=\"整段贴入公开模型 答得漂亮、风险出域\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">整段贴入公开模型</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">答得漂亮、风险出域</tspan></text></g><g data-k=\"身份与订单随文本离开企业边界\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">身份与订单随文本离开企</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">业边界</tspan></text></g></svg>", "d": 72.82}, {"t": "守红线：脱敏 + 只给结构化字段", "n": "换个做法。先把昵称换成「样本 A」，手机号与订单号整体删除，只保留结构字段：商品类目、评价主题、情感极性、提及场景。然后用这条提示词请 AI 基于给定字段归纳方向，并要求它标出哪些结论缺内部数据、不能定。同样拿到可用洞察，数据却一步都没出域。守红线的手法就是三步：脱敏到字段级、字段最小化、提示词里把边界写死——最后这一步最容易被忽略，而它恰恰决定了 AI 会不会顺手替你「补」出几个看起来很专业的数字。记住一件事：AI 并不知道自己越界，它只会尽力把你递给它的材料用得更好，所以边界必须由你在递材料之前划好。下面这份实跑样例，就是按这三步跑出来的真实结果和人工修正记录。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">守红线三步</tspan></text><g data-k=\"脱敏到字段\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">脱敏到字段</tspan></text></g><g data-k=\"字段最小化\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">字段最小化</tspan></text></g><g data-k=\"提示词写死边界\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">提示词写死边界</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 67.32}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["脱敏完整", "边界写死", "人工修正"], "acceptance": "能产出《AI 红线自检》并通过本单元评分要点"}, "demo": {"ref": "■ 三条体验优化方向（仅基于给定公开语义，全程未使用订单、手机号、地址）\n\n1. 尺码决策支持不足\n · 现象：服装通勤类的评价里反复出现「偏小」「和图片差一码」这类表述。\n · 建议：详情页在尺码栏下方加「身高体重 → 建议尺码」对照，并放三条同体型买家原话。\n · 依据强度：弱（仅语义频次，未接退货数据）\n\n2. 大促期发货预期落差\n · 现象：出现「页面写 48 小时，实际等到第五天」一类表达，情绪集中在催单。\n · 建议：预售/大促页面把发货时效按仓分开展示，超时自动推送进度。\n · 依据强度：弱（缺发货达标率）\n\n3. 组合装利益点表达不清\n · 现象：用户对「第二件半价」与「满 199 减 50」哪个更划算存在疑问。\n · 建议：组合装页面直接给出「折合单价」与同款单买对比。\n · 依据强度：中（页面可自查，不依赖内部数据）\n\n■ 需要补充内部数据才能定的结论\n · 方向 1 的优先级：需要按 SKU 的退货率与退货原因分布，才能判断尺码问题占退货的几成。\n · 方向 2 是否成立：需要各仓发货时效达标率与催单工单量。\n · 方向 3 的收益：需要组合装的加购转化与客单对比。\n\n⚠ 需人工确认：频次最高的是哪一条，我无法从给定语义里给出真实计数。", "fix": ["把「反复出现」改成「需要真实计数才能排序」，并显式写明此处没有计数——AI 很容易把定性印象说成「提及最多」，这是最典型的编造。", "给每条结论标了「依据强度」，把「建议」和「结论」分开——不带强度标注的建议，进评审会会被当成结论追问，一问就塌。", "删掉了 AI 顺手补的行业平均值（如「服装退货率约三成」），这类数字必须来自自家数据，否则就是给方案埋雷。", "没有让 AI 判断是否违反广告法——那是法务/合规的结论，课程里只保留「标记疑点」的动作。"], "judge": "判断依据：有没有出现没有来源的频次或比例；有没有把建议写成结论；有没有标出「需要内部数据才能定」的部分；有没有越权下合规定性", "sheet": {"situ": "你是「优选生活馆」的产品经理。大促刚结束，运营把这周的用户评价原样发给了你——每条都带着昵称、手机号、订单号和收货城市。你要用它出一版体验优化方向，但这些原始记录，一条都不能整段发给模型。", "ask": "① 先把 6 条评价按框架整理成结构化字段，顺手把不该外发的部分去掉；② 用你整理好的字段请 AI 给三条优化方向；③ 拿回初稿后自己动手改，改了哪几处要写清楚。", "gen": "请基于以上字段，归纳 3 条可落地的体验优化方向。每条按「现象 → 建议 → 依据强度」三段写，\n依据强度只填 强 / 中 / 弱；再单独列一段「还缺哪些内部数据才能定优先级」。\n不要给出任何没有来源的频次、比例或行业均值——不确定的地方直接写「需内部数据」。", "mats": [{"id": "R01", "src": "评价导出 · 第 1 行", "text": "M** ｜ 138****6621 ｜ SO2026-10-8821 ｜ 杭州\n四件套洗了两次就起球，详情页明明写着「抗起球」，这算不算虚假宣传？"}, {"id": "R02", "src": "评价导出 · 第 2 行", "text": "小* ｜ 139****0733 ｜ 成都\n预售页面写 48 小时发货，我等到第五天才发出，催了三次客服才回一句。"}, {"id": "R03", "src": "评价导出 · 第 3 行", "text": "匿名用户\n「第二件半价」和「满 199 减 50」到底哪个更划算，我算了半天没算明白，页面能不能直接给个折合单价。"}, {"id": "R04", "src": "评价导出 · 第 4 行", "text": "阿* ｜ 137****2288 ｜ 武汉\n尺码偏小。我 165cm/55kg 按页面推荐买 M，穿不上，换 L 又等了一周。"}, {"id": "R05", "src": "评价导出 · 第 5 行", "text": "L**\n客服响应是真的快，晚上十点问都有人回，这点比上次好多了。"}, {"id": "R06", "src": "评价导出 · 第 6 行", "text": "匿名用户\n希望详情页把面料成分和克重写清楚，现在只写「亲肤面料」，看不出和别家差在哪。"}], "cols": [{"k": "topic", "name": "主题归类", "hint": "这条在说什么问题", "type": "chips", "w": 3, "tags": ["面料起球", "物流时效", "组合装利益点", "尺码", "客服响应", "商品信息完整度"]}, {"k": "sent", "name": "情感", "hint": "负 / 中 / 正", "type": "chips", "w": 2, "tags": ["负", "中", "正"]}, {"k": "pii", "name": "含哪些敏感信息", "hint": "可以多选；没有就选「无」", "type": "multi", "w": 3, "tags": ["无", "手机号", "订单号", "收货信息"]}, {"k": "quote", "name": "一句原话（照抄，已脱敏）", "hint": "从原文里照抄连续一段，至少 6 个字，把手机号订单号城市去掉", "type": "text", "w": 2, "tags": []}], "key": {"R01": {"topic": "面料起球", "sent": "负", "pii": "手机号,订单号,收货信息"}, "R02": {"topic": "物流时效", "sent": "负", "pii": "手机号,收货信息"}, "R03": {"topic": "组合装利益点", "sent": "中", "pii": "无"}, "R04": {"topic": "尺码", "sent": "负", "pii": "手机号,收货信息"}, "R05": {"topic": "客服响应", "sent": "正", "pii": "无"}, "R06": {"topic": "商品信息完整度", "sent": "中", "pii": "无"}}, "notes": {"R03·sent": "用户在提要求（希望直接给折合单价），没有一句指责 → 中。判成负会污染差评率口径", "R06·sent": "同 R03：这是在提需求，不是差评 → 中", "R05·topic": "夸的是客服响应速度，属「客服响应」，不是商品本身的问题", "R01·pii": "这一条三种都有：昵称+手机号+订单号 SO2026-10-8821+杭州，是最不能外发的一条", "R02·pii": "有手机号 + 成都，正文没有订单号 —— 敏感类型按「出现了哪几类」算，不按条数算", "R01·topic": "「起球」对应「面料起球」；写成「质量问题」那是个筐，归不了优先级", "R04·topic": "主问题是尺码偏小，物流等一周是次生抱怨，不要归到物流时效"}, "delta": [{"op": "改", "frm": "「尺码问题反复出现」（模型把 1 条说成反复）", "to": "「素材中 R04 提到尺码偏小，占比需退货数据核对」", "why": "素材只有 1 条，写成「反复出现」等于编频次，评审一问「几条」就塌", "kw": ["频次", "反复", "计数", "几条", "占比", "数量"]}, {"op": "改", "frm": "三条建议只写「建议…」，不给强度", "to": "每条后面标「依据强度：强 / 中 / 弱」", "why": "建议和结论要分开；不标强度，建议进评审会就会被当成结论追问", "kw": ["依据强度", "强度", "强弱"]}, {"op": "删", "frm": "模型顺手补的行业均值，如「服装类目退货率约三成」", "to": "整句删除", "why": "素材里没有这条数据。行业均值必须来自自家看板或可引用报告，否则是给方案埋雷", "kw": ["行业均值", "退货率", "三成", "平均值"]}, {"op": "删", "frm": "模型对「抗起球」是否构成虚假宣传下的定性结论", "to": "只写「疑点，待法务/合规判断」", "why": "广告法合规定性是法务结论，PM 越权定性要担责", "kw": ["广告法", "法务", "合规", "虚假宣传", "定性"]}, {"op": "补", "frm": "（模型没写）", "to": "单独一段「还缺哪些内部数据才能定优先级」", "why": "缺这一段，三条方向排不出先后，交上去只能被退", "kw": ["内部数据", "缺", "补充数据", "看板"]}, {"op": "补", "frm": "（模型没写）", "to": "写明输入已脱敏到「样本 + 主题 + 情感 + 一句脱敏原话」", "why": "数据一旦出域不可撤回；把脱敏动作写进材料，才证明这一步你做过", "kw": ["脱敏", "手机号", "订单号", "隐私", "样本 A"]}], "refsheet": "R01｜主题：面料起球｜情感：负｜敏感信息：手机号、订单号、收货信息｜原话：洗了两次就起球\nR02｜主题：物流时效｜情感：负｜敏感信息：手机号、收货信息｜原话：预售页面写 48 小时发货，我等到第五天\nR03｜主题：组合装利益点｜情感：中｜敏感信息：无｜原话：到底哪个更划算，我算了半天没算明白\nR04｜主题：尺码｜情感：负｜敏感信息：手机号、收货信息｜原话：尺码偏小\nR05｜主题：客服响应｜情感：正｜敏感信息：无｜原话：客服响应是真的快\nR06｜主题：商品信息完整度｜情感：中｜敏感信息：无｜原话：把面料成分和克重写清楚\n\n注意三处容易判错的：\n· R03 / R06 是「中」不是「负」——用户在提要求，没有情绪指责，归到负向会污染差评率口径。\n· R05 是唯一一条正向评价，正好可以当对比样本，但它的主题不是「商品」而是「服务」。\n· 敏感信息这一列不是按条数算，是按出现的类型算：R01 三种都有，R02/R04 是手机号 + 收货信息。", "forbid": "1[3-9]{1}\\d{2}[\\*x]{4}\\d{4}|1[3-9]\\d{9}|SO\\d{4}-\\d{2}-\\d{4}", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」的用户评价洞察要点（已脱敏，不含任何个人订单与联系方式）：\n[粘贴评价聚类结果]\n请基于给定的公开语义归纳，给出三条可落地的体验优化方向，并明确标出哪些结论需要我补充内部转化数据后才能定。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】踩红线 / 守红线对照演示（同一份用户评价两种处理方式）\n【参考案例】「优选生活馆」改版复盘材料（含真实用户订单片段）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」的用户评价洞察要点（已脱敏，不含任何个人订单与联系方式）：\n[粘贴评价聚类结果]\n请基于给定的公开语义归纳，给出三条可落地的体验优化方向，并明确标出哪些结论需要我补充内部转化数据后才能定。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U3", "tier": "basic", "step": "todo", "title": "画一张你的 AI 提效地图", "video": {"dur": "3.6min", "script": ["提效方案失败的第一步，往往是连自己这周到底做了什么都列不全", "提效地图模板（工作项 / AI 切入点 / 红线标注）", "「优选生活馆」项目组提效地图样例（8 项工作 × 三列）"]}, "ppt": {"method": "提效地图模板（工作项 / AI 切入点 / 红线标注）", "case": "「优选生活馆」项目组提效地图样例（8 项工作 × 三列）", "demo": "地图填写操作指引（先列工作再标 AI 点）"}, "objective": "能产出一张不少于 8 个工作项的提效地图，每项标清 AI 切入点与红线状态", "transfer": "本月从地图里挑 2 个试点跑起来，动手前让主管在红线那一列签字确认", "vslides": [{"t": "任务说明：先把事实列全", "n": "这一节是实操。打开空白文档，把你本周做过的所有工作列出来，尽量列到八项以上，包括写活动方案、跑转化数据、开会、对文档这些看起来琐碎的部分，并且给每一项标上大致的耗时。不要先判断哪个能用 AI，先把事实列全——列不全，后面的地图就是空谈。判断标准很朴素：如果一项工作占了你每周两小时以上，它就必须出现在这张表里。经验上，零售 PM 一周的时间大头通常落在「读数据、写材料、对齐人」三件事上，而其中最耗时的往往不是写，是读和找。举个具体的：一次大促复盘，材料可能来自四个地方——生意参谋的漏斗、客服工单摘要、退货原因分布、活动页埋点，真正写方案只占两小时，找齐材料并对齐口径能吃掉一整天。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 列出本周 8 项主要工作\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列出本周 8 项主要工作</tspan></text></g><g data-k=\"② 每一项标注耗时与三列信息\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 每一项标注耗时与三列信息</tspan></text></g><g data-k=\"③ 排序并选出 2 项试点\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 排序并选出 2 项试点</tspan></text></g></svg>", "d": 70.08}, {"t": "三项标注：能不能、用在哪、是否触红线", "n": "每一行填三列。第一列，这项工作能不能用 AI；第二列，如果能，用在哪一步，是读材料、生成初稿还是做对比，而且必须写到「读哪份材料、产出什么」这个粒度；第三列，这一步是否触红线，涉及用户隐私、交易数据还是成本数据。第三列最容易被跳过，却最关键。判定标准很简单：只要数据可能来自真实用户或真实合同，就先按敏感处理，写明脱敏到什么字段、由谁复核。把「红线未通过」当成一种正常结论写进去，它不会让你显得保守，反而会让主管相信你真的想过风险。另一个实用技巧：给每一行补一列「预计省下的时间」，哪怕只是粗估。因为下周你要拿这张表去说服主管投入时间，一份没有降幅数字的地图，通常没人愿意看第二眼。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每行填三列</tspan></text><g data-k=\"能否用 AI\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">能否用 AI</tspan></text></g><g data-k=\"用在哪一步\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">用在哪一步</tspan></text></g><g data-k=\"是否触红线\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">是否触红线</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 72.58}, {"t": "产出与分享：先排序，再选两个试点", "n": "最后把地图整理成一页发给直属主管。先按「耗时降幅」排序，再在耗时最高的几项里剔除红线未通过的，剩下的就是你的试点清单——只选两项，别贪多。每项写清验收口径，比如「Top5 差评归因与我人工读一百条的重合不少于三条」，这样一周后你能自己判断成没成，而不是感觉好像快了一点。地图里至少保留一项明确标注红线未通过，这反而让你更可信：一份全是绿灯的提效方案，通常说明写它的人根本没想过风险。最后提醒一句：这张地图是给你自己用的，不是拿去评奖的，所以宁可写得糙一点，也要写真实耗时——虚报的耗时会让你选错试点，最后浪费的还是你下周的时间。下面给你一份填完的范例，注意它连「暂缓」的两项都老老实实写进去了，因为暂缓也是一种结论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"工作项不少于 8 项且带耗时\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">工作项不少于 8 项且带耗时</tspan></text></g><g data-k=\"每项写到「读什么、产出什么」\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项写到「读什么、产出什么」</tspan></text></g><g data-k=\"至少一项标为红线未通过、暂缓\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">至少一项标为红线未通过、暂缓</tspan></text></g><g data-k=\"结尾两个试点带验收口径\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结尾两个试点带验收口径</tspan></text></g></svg>", "d": 71.64}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["覆盖度", "可执行性", "红线标注"], "acceptance": "一张能贴到工位旁的地图：≥8 项工作、每项有耗时与 AI 切入点、≥1 项明确标为红线未通过、选出 2 项下周试点"}, "practice": {"steps": ["列出你本周 8 项主要工作，每项标注耗时（小时）", "对每项填：AI 能帮哪一步 / 用什么工具 / 产出能到什么完成度", "标红线：数据敏感级别、是否需要人复核、责任写谁", "按「耗时 × 风险」排序，选出下周就要试的 2 项"], "exemplar": "【本周工作 × AI 提效地图】角色：优选生活馆 产品经理　周期：10/20–10/24\n\n■ 1. 竞品大促玩法对比（6h/周）\n　AI 切入：把三家公开活动页要点整理成表格，输出「玩法/门槛/赠品/时效」四列初稿\n　完成度：结构可到 80%，判断需我做　数据级别：公开　红线：只用公开页，不买数据包\n　人复核：我　耗时预估：6h → 1.5h\n\n■ 2. 近 30 天差评归因（5h/周）\n　AI 切入：评论按主题聚类，提炼 Top5，标出各主题代表原话\n　完成度：聚类可用，频次需我从后台核对　数据级别：含用户原话（不含身份）\n　红线：不贴昵称/订单号，先脱敏到「类目+主题+极性」\n　人复核：我 + 客服主管　耗时预估：5h → 1h\n\n■ 3. 详情页卖点改版（4h/周）\n　AI 切入：同一卖点出五版表达，按「痛点—证据—利益」排序\n　完成度：文案可用，合规词需替换　数据级别：内部\n　红线：广告法禁用词由法务终审，我不下结论\n　人复核：法务　耗时预估：4h → 2h\n\n■ 4. 周报（3h/周）\n　AI 切入：把本周三份数据看板摘要 + 会议纪要拼成周报初稿\n　完成度：结构可用，结论必须我自己写　数据级别：内部\n　红线：GMV 等对外口径不写进 AI，只写同比/环比方向　人复核：我　耗时预估：3h → 0.5h\n\n■ 5. 活动库存联动检查（3h/周）\n　AI 切入：按活动坑位清单核对可售库存与备货周期，输出风险行\n　完成度：清单可用　数据级别：内部（含供货价）\n　红线：供货价不外传，AI 只给「是否够卖」的判断，不碰成本测算\n　人复核：我 + 供应链　耗时预估：3h → 1h\n\n■ 6. 跨部门需求对齐会（2h/周）\n　AI 切入：会议纪要转结构化待办，带责任人与截止日\n　完成度：可用　数据级别：内部　红线：无　人复核：我　耗时预估：2h → 0.5h\n\n■ 7. 会员复购名单筛选（2h/周）\n　AI 切入：按 RFM 分层口径写出取数逻辑（SQL 骨架），我在数仓跑\n　完成度：逻辑可用，取数必须我执行　数据级别：含个人信息\n　红线：名单不出域，AI 只看字段名不看数据行 ← 本项红线未通过，暂缓\n　人复核：数据合规　耗时预估：暂不上 AI\n\n■ 8. 供应商报价比对（2h/周）\n　AI 切入：报价单脱敏后做差异表\n　完成度：表格可用　数据级别：敏感（商务条款）\n　红线：合同价不外传 ← 本项红线未通过，暂缓　人复核：采购\n\n【下周试点 2 项】1) 差评归因（验收：Top5 与我人工读 100 条结论重合 ≥3 条）2) 周报（验收：初稿可用率 ≥70%，我改写 ≤15 分钟）\n【责任人】本人；复盘时间：下周五 17:00"}, "task": "产出《个人 AI 提效地图》：列出你本周 8 项主要工作，每项标注耗时（小时）；对每项填：AI 能帮哪一步 / 用什么工具 / 产出能到什么完成度；标红线：数据敏感级别、是否需要人复核、责任写谁；按「耗时 × 风险」排序，选出下周就要试的 2 项", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M0 导论：零售电商 PM 的 AI 机会与红线」模块，你要交付的是《个人 AI 提效地图》。\n【场景】业务侧这周的诉求是：提效方案失败的第一步，往往是连自己这周到底做了什么都列不全。参考做法：「优选生活馆」项目组提效地图样例（8 项工作 × 三列）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提效地图模板（工作项 / AI 切入点 / 红线标注）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《个人 AI 提效地图》填写模板】\n\n■ 1. 列出你本周 8 项主要工作，每项标注耗时（小时）\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 对每项填：AI 能帮哪一步 / 用什么工具 / 产出能到什么完成度\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 标红线：数据敏感级别、是否需要人复核、责任写谁\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 按「耗时 × 风险」排序，选出下周就要试的 2 项\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【本周工作 × AI 提效地图】角色：优选生活馆 产品经理　周期：10/20–10/24\n\n■ 1. 竞品大促玩法对比（6h/周）\n　AI 切入：把三家公开活动页要点整理成表格，输出「玩法/门槛/赠品/时效」四列初稿\n　完成度：结构可到 80%，判断需我做　数据级别：公开　红线：只用公开页，不买数据包\n　人复核：我　耗时预估：6h → 1.5h\n\n■ 2. 近 30 天差评归因（5h/周）\n　AI 切入：评论按主题聚类，提炼 Top5，标出各主题代表原话\n　完成度：聚类可用，频次需我从后台核对　数据级别：含用户原话（不含身份）\n　红线：不贴昵称/订单号，先脱敏到「类目+主题+极性」\n　人复核：我 + 客服主管　耗时预估：5h → 1h\n\n■ 3. 详情页卖点改版（4h/周）\n　AI 切入：同一卖点出五版表达，按「痛点—证据—利益」排序\n　完成度：文案可用，合规词需替换　数据级别：内部\n　红线：广告法禁用词由法务终审，我不下结论\n　人复核：法务　耗时预估：4h → 2h\n\n■ 4. 周报（3h/周）\n　AI 切入：把本周三份数据看板摘要 + 会议纪要拼成周报初稿\n　完成度：结构可用，结论必须我自己写　数据级别：内部\n　红线：GMV 等对外口径不写进 AI，只写同比/环比方向　人复核：我　耗时预估：3h → 0.5h\n\n■ 5. 活动库存联动检查（3h/周）\n　AI 切入：按活动坑位清单核对可售库存与备货周期，输出风险行\n　完成度：清单可用　数据级别：内部（含供货价）\n　红线：供货价不外传，AI 只给「是否够卖」的判断，不碰成本测算\n　人复核：我 + 供应链　耗时预估：3h → 1h\n\n■ 6. 跨部门需求对齐会（2h/周）\n　AI 切入：会议纪要转结构化待办，带责任人与截止日\n　完成度：可用　数据级别：内部　红线：无　人复核：我　耗时预估：2h → 0.5h\n\n■ 7. 会员复购名单筛选（2h/周）\n　AI 切入：按 RFM 分层口径写出取数逻辑（SQL 骨架），我在数仓跑\n　完成度：逻辑可用，取数必须我执行　数据级别：含个人信息\n　红线：名单不出域，AI 只看字段名不看数据行 ← 本项红线未通过，暂缓\n　人复核：数据合规　耗时预估：暂不上 AI\n\n■ 8. 供应商报价比对（2h/周）\n　AI 切入：报价单脱敏后做差异表\n　完成度：表格可用　数据级别：敏感（商务条款）\n　红线：合同价不外传 ← 本项红线未通过，暂缓　人复核：采购\n\n【下周试点 2 项】1) 差评归因（验收：Top5 与我人工读 100 条结论重合 ≥3 条）2) 周报（验收：初稿可用率 ≥70%，我改写 ≤15 分钟）\n【责任人】本人；复盘时间：下周五 17:00", "rubric": ["工作项 ≥8 条，且每条都有耗时数字（小时）；只写「跟进需求」这类笼统词的按未填计", "每条都有明确的 AI 切入点，写到「读哪份材料、产出什么」这个粒度，写「用 AI 提效」不算", "每条都标了数据敏感级别（公开/内部/含个人信息），含个人信息的必须写明脱敏动作", "结尾选出 2 项下周试点，并写明试点验收口径与责任人"]}, {"id": "M0U4", "tier": "basic", "step": "spar", "title": "合规官挑战你的提效地图", "video": {"dur": "3.6min", "script": ["合规官的职责不是让你过，而是找出你地图里越过红线的那几个点", "合规挑战清单（数据 / 决策 / 可追溯）", "典型越线写法 vs 合规写法（贴订单号 vs 脱敏字段）"]}, "ppt": {"method": "合规挑战清单（数据 / 决策 / 可追溯）", "case": "典型越线写法 vs 合规写法（贴订单号 vs 脱敏字段）", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "objective": "能在合规官 4 轮追问下，逐条答出数据来源、最小化动作与责任边界", "transfer": "把陪练里被问住的那 2 个问题补进部门检查清单，下次评审会前先自查一遍", "vslides": [{"t": "陪练说明：合规官会挑你的地图", "n": "接下来进入陪练。你的对手是数据合规官，他的职责不是让你过，而是找出你地图里越过红线的点。他会按数据、决策、可追溯三个维度逐一追问，而且会追到具体字段名。你不需要准备得完美，但必须准备好一条：被问到数据来源时，能说清它从哪来、有没有脱敏、有没有留痕。这一问通常决定成败。提醒一句：不要试图用「行业内都这么干」来回答合规问题，他听过的这种话比你多，而且这类回答会直接被记成「认知不清」。他心里其实是有一份依据的：公司的数据分级办法、个人信息保护法里的告知同意条款、平台的商家数据规范。你要做的不是背条款，而是能指到「我这一步落在哪条规则下、我做了什么动作」，指得到就过，指不到就要回去补。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合规官的追问框架</tspan></text><g data-k=\"数据来源\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">数据来源</tspan></text></g><g data-k=\"授权与留痕\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">授权与留痕</tspan></text></g><g data-k=\"可追溯\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可追溯</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 69.36}, {"t": "他会问什么：四个高频问题", "n": "先剧透四个高频问题。第一，地图里哪几项的数据含手机号、收货地址或订单号，脱敏到哪一层？第二，你说的「公开来源」怎么证明是公开的，谁留了证据？第三，AI 给错建议导致上错活动，责任链怎么走，谁是签字人？第四，如果监管来查，你能拿出哪份记录证明每次分析都做过脱敏？把答案提前写在地图的备注里，陪练时就不会被问倒。注意第三问的陷阱：回答「大家一起负责」等于没回答，必须落到岗位。提前准备答案，比现场发挥靠谱得多。第二问尤其容易失分：很多人回答「网上都能看到」，这在他听来等于「你没留证」。正确答法是给一个可复查的动作——保存抓取时的页面截图、记下日期与页面地址，存进部门共享目录，需要时能当场翻出来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"数据含不含个人信息、脱敏到哪层\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">数据含不含个人信息、脱敏到哪层</tspan></text></g><g data-k=\"公开来源怎么证明、谁留证\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">公开来源怎么证明、谁留证</tspan></text></g><g data-k=\"责任链与签字人是谁\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">责任链与签字人是谁</tspan></text></g><g data-k=\"脱敏记录存在哪里\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">脱敏记录存在哪里</tspan></text></g></svg>", "d": 68.9}, {"t": "通过标准：四条都答上才放行", "n": "放行标准很明确：数据来源能说清、责任主体到岗、AI 输出只做辅助、留痕证据拿得出。陪练里如果答案被判定通过，你会拿到放行标记；答不上来就回去补。补的过程本身就是学习，比听十遍课有用：大多数人不是不知道要脱敏，而是不知道自己那份数据里到底有哪些字段算个人信息。目标是拿到一张经得起合规挑战的地图，而不是让陪练说两句好话。这一关过了，你后面所有 AI 用法都有了护身符。更实际的好处是：这张「已过合规」的地图，可以直接拿去申请工具预算或试点名额，因为主管最怕的不是花钱，是花完钱出事。准备好这四个答案再去开评审会，通常一次就能过。如果某一条实在答不上来，别硬编，直接说「这一项我还没想到，我会在周三之前补一份脱敏记录给合规确认」——承认缺口并给出补齐时间，比临时编一个答案安全得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"数据来源说清到字段\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据来源说清到字段</tspan></text></g><g data-k=\"责任主体到岗位\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任主体到岗位</tspan></text></g><g data-k=\"AI 仅作辅助不终审\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">AI 仅作辅助不终审</tspan></text></g><g data-k=\"留痕证据拿得出\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">留痕证据拿得出</tspan></text></g></svg>", "d": 78.14}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["数据来源", "责任边界", "证据留存"], "acceptance": "四个维度都能给出可执行答案：数据来源与脱敏层级、授权与证据留存、责任人与签字点、AI 输出的复核动作"}, "spar": {"role": "数据合规官", "persona": "严谨、只认制度，追问数据来源与授权链条，回答含糊就往下追一层", "mustAsk": ["这张地图里，哪几项的数据含手机号、收货地址或订单号？脱敏到哪一层？", "你说的「公开来源」怎么证明是公开的？谁留了这个证据？", "AI 给错建议导致上错活动，责任链怎么走？谁是签字人？", "如果监管来查，你能拿出哪份记录证明每次分析都做过脱敏？"]}, "exemplar": "（合规官问：地图里哪几项的数据含手机号、收货地址或订单号，脱敏到哪一层）\n\n结论：8 项里有 2 项含个人信息、1 项含商务敏感信息，这 3 项的原始数据我都没让进 AI。\n依据：第 2 项「差评归因」的原料是用户评价，含昵称与订单号，我删掉身份字段，只留「类目 + 主题 + 极性」，脱敏前后各存一份样本在 产品部/AI使用记录/202610，可以随时调出来比对。\n边界：第 7 项「会员复购名单」我只让 AI 写取数逻辑（SQL 骨架），名单本身不出数仓，这项我标了红线未通过、暂缓；至于是否构成个人信息处理，这个判断不归我下，我请数据合规签字确认。", "task": "把《个人 AI 提效地图》拿到「数据合规官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《个人 AI 提效地图》。现在要让它通过「数据合规官」这一关。\n【对手的立场】严谨、只认制度，追问数据来源与授权链条，回答含糊就往下追一层。\n【他一定会追问】「这张地图里，哪几项的数据含手机号、收货地址或订单号？脱敏到哪一层？」 / 「你说的「公开来源」怎么证明是公开的？谁留了这个证据？」 / 「AI 给错建议导致上错活动，责任链怎么走？谁是签字人？」\n【场景】你说「合规官挑战你的提效地图」，对方立刻回一句：这张地图里，哪几项的数据含手机号、收货地址或订单号？脱敏到哪一层？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每问到一项数据，能当场说出字段名、脱敏层级与来源渠道，不说「大概都是公开的」", "至少指出一项确实需要暂缓或降级用法的工作，并说明卡在哪一步", "明确签字人是谁（岗位而非「领导」），并说清 AI 输出在流程里的位置（建议/初稿/终审）", "能说出一份留痕的东西：脱敏记录、来源截图、评审纪要中的任意两种，且知道存在哪里"]}, {"id": "M0U5", "tier": "adv", "step": "understand", "title": "组织级 AI 落地路线与数据治理", "video": {"dur": "3.6min", "script": ["个人提效只是起点，真正拉开差距的是把打法固化到电商项目流程里", "落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）", "某电商中台 AI 提效治理框架（三层评审会）"]}, "ppt": {"method": "落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）", "case": "某电商中台 AI 提效治理框架（三层评审会）", "demo": "治理机制清单模板（数据 / 模型 / 输出三层）"}, "objective": "能说出组织级落地的三阶段特征，并判断自己团队此刻处在哪个阶段、依据是什么", "transfer": "跟主管对一次「我们现在在第几阶段」，三个阶段各举一个现状例子，别只报结论", "vslides": [{"t": "从个人到组织：为什么需要治理", "n": "个人用 AI 提效很快，但一旦十个人各贴各的订单数据，风险就不再可控，而且事故往往在你不知道的地方发生。组织级落地的第一件事，是把「能贴什么、不能贴什么」变成明文规则，而不是靠每个人自觉。判断一个团队有没有真治理，看三个信号：有没有一份字段级的数据分级清单、有没有对 AI 输出做复核的动作、有没有明确的问责归属。治理不是给创新踩刹车，而是让创新能长期跑下去不翻车——因为一次事故之后，通常是一刀切的全面禁用，那才是真正的刹车。治理的第一份产物往往不是制度文档，而是一张字段清单；第二份是复核动作，谁看、看什么。这两样东西凑齐了，才轮得到讨论要不要买平台。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">治理三角</tspan></text><g data-k=\"规则\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">规则</tspan></text></g><g data-k=\"审计\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">审计</tspan></text></g><g data-k=\"问责\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">问责</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.06}, {"t": "落地三阶段：试点 → 嵌入 → 量化", "n": "落地分三阶段。试点阶段，挑一个低风险场景跑通，比如公开评论洞察，衡量标准是「耗时降了多少、返工几次」。嵌入阶段，把 AI 步骤写进 PRD 模板和复盘模板——这一步才是真正的分水岭，因为写进模板意味着不走 AI 反而更麻烦。量化阶段，用同一套口径统计提效与事故率，比如「周报平均耗时」「AI 输出被返工的比例」。很多团队卡在第二步：把 AI 当玩具而不是当流程，于是永远停在个别积极分子的个人收益上，一旦他调岗，能力就归零。流程化才是真正的能力沉淀。量化阶段的指标不用多，三个够用：单份材料的平均耗时、AI 初稿被返工的比例、口径错误导致的返工次数。前两个看效率，第三个看质量，缺了第三个，提效就会以精度下降为代价而没人发现。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 试点低风险场景\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 试点低风险场景</tspan></text></g><g data-k=\"② 嵌进 PRD/复盘模板\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 嵌进 PRD/复盘模板</tspan></text></g><g data-k=\"③ 量化提效与事故率\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 量化提效与事故率</tspan></text></g></svg>", "d": 72.91}, {"t": "三层治理清单怎么写", "n": "治理清单写三层。数据层：哪些字段禁止外传、脱敏到什么粒度、谁能批准例外；模型层：哪些结论必须人复核、复核人写谁、复核不通过怎么退回；输出层：对外材料谁签字、错误如何回滚、多久内必须撤回。每层都要有 owner、触发条件和检查频次，缺一项就是一张贴在墙上没人看的纸。写完你会得到一份可直接在部门会上过的清单，比任何口号都管用。落地形态建议做成两样：工位旁的一页纸（员工看的）和月度抽查表（管理者看的）。前者回答「我这一步能不能做」，后者回答「这个月有没有人越线」，两者都不超过一页，才有人真的用。还有一件常被忽略的事：这套东西得有人牵头。一个愿意改模板的业务负责人，比一个专职的 AI 专员管用得多，因为他能直接动流程。下一节的演示单元，我们会用竞品监控这个最容易被「顺手越线」的场景，把清单里的边界真正跑一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三层治理清单</tspan></text><g data-k=\"数据分级\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">数据分级</tspan></text></g><g data-k=\"输出复核\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">输出复核</tspan></text></g><g data-k=\"问责归属\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">问责归属</tspan></text></g><g data-k=\"触发条件\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">触发条件</tspan></text></g><g data-k=\"回滚动作\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">回滚动作</tspan></text></g><g data-k=\"检查频次\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">检查频次</tspan></text></g></svg>", "d": 79.42}], "deliverable": {"type": "doc", "name": "AI 治理清单", "rubric": ["三层齐全", "触发条件", "责任人明确"], "acceptance": "给出你团队可落地的三层治理清单，含数据分级、输出复核、问责归属与触发条件"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）\n【为什么重要】个人提效只是起点，真正拉开差距的是把打法固化到电商项目流程里\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三层（数据/模型/输出）都有条目，每层至少 2 条，且不是「加强管理」这类口号", "每条都写了触发条件（什么时候这条生效），例如「贴入含手机号的字段时」", "每条都有 owner（岗位）与检查频次（每次/每周/每月）", "至少一条写清事故回滚动作：错了怎么撤回、多久内撤回"]}, {"id": "M0U6", "tier": "adv", "step": "demo", "title": "用 AI 做竞品监控的合规边界", "video": {"dur": "3.8min", "script": ["竞品监控价值大，但一脚踩进对方后台或买来的数据包就违规了", "公开来源 vs 内部数据边界演示（价格/上新/玩法）", "「优选生活馆」竞品公开页监控（仅用公开信息）"]}, "ppt": {"method": "公开来源 vs 内部数据边界演示（价格/上新/玩法）", "case": "「优选生活馆」竞品公开页监控（仅用公开信息）", "demo": "WorkBuddy 内跑一遍「只喂公开页」的竞品摘要"}, "objective": "能用只含公开字段的提示词跑完一次竞品价格与上新监控，并说明主动放弃了哪些信息", "transfer": "把「不采什么」写进竞品监控模板第一行，下次直接套用，不再临时判断", "vslides": [{"t": "演示准备：只准备公开素材", "n": "这次演示只准备公开素材：竞品在官网、电商平台旗舰店、公开活动页里能直接看到的价格、玩法和上新节奏。不准备任何需要登录、付费或对方后台才能拿到的数据，也不买第三方爬来的数据包。范围之外还有个度的问题：日常盯三到五个直接竞品、每周固定看一次就够，大促前两周再改成每天看。竞品一多，表会长到没人看，反而失去意义。边界先划清，演示才不会走偏。竞品监控的合规起点，不是「我怎么拿到更多数据」，而是「我用公开信息能做出多专业的判断」。顺便说一句：公开信息的天花板比大多数人以为的高——价格带、玩法结构、上新节奏、页面表达，这四样做扎实，已经足够支撑一次像样的策略讨论。一份合格的竞品监控产出通常就两样东西：一张带页面证据的对比表，和三条能落到自己动作上的策略判断。前者证明你没瞎猜，后者证明你做了思考。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"仅公开可访问页面\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">仅公开可访问页面</tspan></text></g><g data-k=\"不含登录/付费数据\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不含登录/付费数据</tspan></text></g><g data-k=\"不买第三方数据包\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不买第三方数据包</tspan></text></g></svg>", "d": 85.58}, {"t": "守边界：让 AI 只吃公开字段", "n": "把公开页要点喂给 AI，并明确要求它归纳价格带、主推玩法、上新节奏三类信息，同时标注哪些信息属于登录或付费范围、不在本次分析内。关键在于提示词里就把边界写死，而不是事后删——事后删你不知道它偷偷用了什么。还要加一条：不许由折扣力度反推对方经营状况，这类推断既没有依据，也可能构成对同行的不当评价。下面是按这个提示词真跑出来的结果，以及人在这份结果上做的四处修正，请重点看第二处：主动列出「不在本次范围」的信息。这一段看着像免责声明，其实是整份输出里最值钱的部分——它让读的人立刻知道你的结论边界在哪，也让合规看到一个「知道自己不知道什么」的人。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">守边界三步</tspan></text><g data-k=\"公开页要点\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">公开页要点</tspan></text></g><g data-k=\"提示词写死边界\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">提示词写死边界</tspan></text></g><g data-k=\"带证据的对比表\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">带证据的对比表</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 64.61}, {"t": "踩线警示：买数据包的下场", "n": "反过来，如果图省事买了第三方爬取的竞品订单数据包，哪怕只是看趋势，也已经踩线：数据来源不明，可能侵犯对方商业秘密，也可能本身就是非法获取的个人信息。一旦出事，责任是买的人扛，不是卖数据包的人。还有一个更隐蔽的坑：让 AI 去「估算」对方销量。它一定会给你一个像模像样的数字，而这个数字最终会出现在你的汇报里，成为别人质疑你专业性的第一个把手。守住「只用公开信息、只做策略判断」这两条，你的监控结论才敢写进汇报。上一节的实跑样例里，那三条策略判断就是这么来的：每一条都能指回表格里的某个单元格，没有一句是「我觉得」。交出去之前可以用一句话自查：这份材料如果被竞品看到，我能不能坦然解释每一行的来源？能，就可以发；有一行说不清，就先删掉再发。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">代价</tspan></text><g data-k=\"买来的竞品数据包 看似省事\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">买来的竞品数据包</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">看似省事</tspan></text></g><g data-k=\"来源不明、责任你扛\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">来源不明、责任你扛</tspan></text></g></svg>", "d": 75.17}], "deliverable": {"type": "doc", "name": "AI 治理清单", "rubric": ["来源合规", "字段边界", "结论标注"], "acceptance": "能产出《AI 治理清单》并通过本单元评分要点"}, "demo": {"ref": "■ 竞品公开信息摘要（来源：三家旗舰店公开商品页 + 公开活动页，抓取日期 10/24）\n\n· 竞品 A：主力价格带 89–169 元｜玩法「第二件半价（限同款）」｜每周二固定上新 3–5 款\n 页面证据：活动页 banner + 商品详情\n· 竞品 B：主力价格带 129–259 元｜玩法「满 199 减 50（跨类目凑单）」｜大促前集中上 12 款\n 页面证据：店铺首页公告\n· 竞品 C：双档定价，59 元引流款 + 199 元利润款｜玩法「前 1 小时付定金膨胀 3 倍」｜月更，跟平台节点\n 页面证据：预售页定金规则\n\n■ 明确不在本次范围内的信息\n · 竞品 A/B/C 的实际销量、库存深度：需登录商家后台或第三方数据服务，属付费/非公开信息，本次不采。\n · 竞品的成交价格（券后实付）：需实测下单，涉及账号与个人信息，本次不做。\n · 竞品的供应商与成本结构：非公开，且可能构成商业秘密，本次不推断。\n\n■ 可落地的三条判断（不含对竞品经营状况的定性）\n1. 竞品 A 用「同款第二件半价」锁复购，我们的组合装策略与之正面冲突，建议大促主推位错开同日。\n2. 竞品 C 用低价引流款拉新，其利润款定价 199 元与我们的主力款重叠，需核对我们的利益点表达是否够硬。\n3. 三家都在大促前 7 天集中上新，我们的上新节奏可以提前到 T-10，避开素材挤压。\n\n⚠ 需人工确认：以上价格带来自公开页标价，未验证券后实付；玩法的实际执行强度需活动期内复核。", "fix": ["把「可直接抓取」改成「抓取日期 + 具体页面证据」——合规检查第一个问的就是「你从哪看到的、什么时候」，没有时间戳的结论不可追溯。", "主动列出「不在本次范围」的三类信息，并说明为什么（付费/需登录/涉商业秘密）——这一段比结论更值钱，它证明边界是你划的，不是你没想到。", "删掉 AI 顺手推断的「竞品 A 库存压力大」（由折扣力度反推经营状况），这类推断既无依据，也可能构成对同行的不当评价。", "把结论从「竞品 A 打不过我们」改成「策略冲突点 + 建议动作」，去掉对自己有利的定性判断。"], "judge": "判断依据：来源是否带时间与页面证据；是否主动划出不可采范围；有没有由折扣反推经营状况；结论是策略建议还是胜负判断", "sheet": {"situ": "竞品周报明天要交，你手上只有 6 条来源各不相同的信息。上一任就是因为「朋友给了个后台截图」被合规约谈过，这次你要先判断每一条到底能不能用。", "ask": "① 逐条判断：这是什么信息、来源属于哪一类、能不能直接用；② 把能用的那几条整理完，请 AI 归纳价格带 / 玩法 / 上新节奏；③ 自己改一版，把不可采的部分明确写成「不在本次范围」。", "gen": "请只基于以上标为「可直接用」的公开信息，归纳三家竞品的价格带、主推玩法、上新节奏，\n再给出 3 条我们自己能落地的策略调整建议。开头先单独列一段「不在本次范围的信息及原因」。\n不要由折扣力度反推对方经营状况，也不要对竞品做胜负评价。", "mats": [{"id": "R01", "src": "竞品 A 旗舰店 · 商品详情页（公开）", "text": "活动价 89 元起，主力 SKU 集中在 89–169 元区间；页面标注「保价 30 天」。"}, {"id": "R02", "src": "竞品 A 店铺活动页 banner（公开）", "text": "第二件半价，限同款同色；活动时间 10/20–11/11。"}, {"id": "R03", "src": "竞品 B 店铺首页公告（公开）", "text": "「大促前 10 天集中上新 12 款」，并附了上新日历图。"}, {"id": "R04", "src": "某电商数据服务 · 付费版后台", "text": "竞品 A 近 30 天销量 2.3 万件，环比 +18%；该数据需订阅 ¥3800/年。"}, {"id": "R05", "src": "前同事发来的竞品 C 商家后台截图", "text": "竞品 C 主力款当前库存深度 1200 件，预计 14 天售罄。"}, {"id": "R06", "src": "行业交流群里流传的 Excel", "text": "竞品 B 的代工厂报价 38 元/件，含面料与加工，不含包装。"}], "cols": [{"k": "kind", "name": "信息类型", "hint": "这是一条什么信息", "type": "chips", "w": 2, "tags": ["价格带", "玩法", "上新节奏", "销量", "库存", "成本"]}, {"k": "src", "name": "来源类型", "hint": "按获取方式判", "type": "chips", "w": 3, "tags": ["公开页", "需登录", "付费", "商业秘密"]}, {"k": "usable", "name": "能不能直接用", "hint": "能写进周报的，只有一种", "type": "chips", "w": 3, "tags": ["可直接用", "禁止使用"]}, {"k": "quote", "name": "一句原句证据（照抄 + 日期）", "hint": "照抄原文里的关键一句，并写抓取/收到日期", "type": "text", "w": 2, "tags": []}], "key": {"R01": {"kind": "价格带", "src": "公开页", "usable": "可直接用"}, "R02": {"kind": "玩法", "src": "公开页", "usable": "可直接用"}, "R03": {"kind": "上新节奏", "src": "公开页", "usable": "可直接用"}, "R04": {"kind": "销量", "src": "付费", "usable": "禁止使用"}, "R05": {"kind": "库存", "src": "需登录", "usable": "禁止使用"}, "R06": {"kind": "成本", "src": "商业秘密", "usable": "禁止使用"}}, "notes": {"R04·src": "要订阅才能看的数据服务，你不是订阅方/无授权 → 付费", "R04·usable": "买的是别人违规拿到的数据，责任在你 → 禁止使用", "R05·src": "他人商家后台截图，需要登录且无授权 → 需登录", "R05·usable": "朋友给你 ≠ 对方授权你，写进周报就是把风险写进周报", "R06·src": "群内流转表格、来源不明，且属对方成本结构 → 商业秘密", "R02·kind": "「第二件半价」是玩法，不是价格带 —— 价格带看 R01 的 89–169 元", "R03·kind": "「大促前 10 天集中上新 12 款」是上新节奏", "R04·kind": "2.3 万件、环比 +18% 都是销量口径，不是库存"}, "delta": [{"op": "删", "frm": "「竞品 A 近 30 天销量 2.3 万件，约为我们的 3 倍」", "to": "删除，改为「销量类数据不在本次范围」", "why": "R04 是付费数据服务、你无授权，把它写进周报责任在你", "kw": ["销量", "2.3", "付费", "授权", "数据服务"]}, {"op": "删", "frm": "由「第二件半价」反推「对方利润被压缩、现金流紧张」", "to": "删除", "why": "玩法不等于经营状况，属于无依据推断，上会必被追问", "kw": ["利润", "现金流", "经营", "反推", "推断"]}, {"op": "删", "frm": "「竞品 C 库存仅 1200 件，14 天售罄」", "to": "删除", "why": "他人后台截图、无授权，写进周报可能构成侵犯商业秘密", "kw": ["库存", "1200", "后台", "截图", "商业秘密"]}, {"op": "改", "frm": "开头直接进结论", "to": "开头补一段「不在本次范围的信息及原因」，逐条对应 R04 / R05 / R06", "why": "只写「不含」不写原因，等于没做合规判断", "kw": ["不在本次范围", "范围", "原因"]}, {"op": "补", "frm": "（模型没写）", "to": "每条结论后面标来源与抓取日期（R01 公开商品页 · 10/24）", "why": "周报要能回溯到原文；没有日期和来源的结论不能进周报", "kw": ["日期", "来源", "抓取", "截取"]}], "refsheet": "R01｜价格带｜公开页｜可直接用｜「活动价 89 元起，主力 SKU 集中在 89–169 元」\nR02｜玩法｜公开页｜可直接用｜「第二件半价，限同款同色」\nR03｜上新节奏｜公开页｜可直接用｜「大促前 10 天集中上新 12 款」\nR04｜销量｜付费｜禁止使用｜需订阅 ¥3800/年，来源非公开\nR05｜库存｜需登录｜禁止使用｜他人后台截图，无授权、可能构成侵犯商业秘密\nR06｜成本｜商业秘密｜禁止使用｜群内流转表格，来源不明，属对方商业秘密\n\n判断口径只有一条：这条信息，对方是否主动对公众公开了。\n公开页 = 对方自己挂出来给所有人看的，可以直接引用；\n付费数据服务 = 你没有授权，买的是「别人违规拿到的」，责任在你；\n后台截图 = 最常见的踩线方式，朋友给你不等于对方授权你；\n群里的 Excel = 来源不明 + 属商业秘密，写进周报就是把风险写进周报。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」三个竞品的公开商品页与活动页链接摘要（均为公开可访问内容）：\n[粘贴公开页要点]\n请归纳它们的价格带、主推玩法与上新节奏，并标注哪些信息需要登录或付费才能获取、不在本次分析范围内。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】公开来源 vs 内部数据边界演示（价格/上新/玩法）\n【参考案例】「优选生活馆」竞品公开页监控（仅用公开信息）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」三个竞品的公开商品页与活动页链接摘要（均为公开可访问内容）：\n[粘贴公开页要点]\n请归纳它们的价格带、主推玩法与上新节奏，并标注哪些信息需要登录或付费才能获取、不在本次分析范围内。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U7", "tier": "adv", "step": "todo", "title": "写一份部门 AI 使用规范草稿", "video": {"dur": "3.6min", "script": ["没有明文规范的团队，风险由最不谨慎的那个人决定", "规范草案四段式（允许清单 / 禁止清单 / 复核动作 / 问责与留痕）", "某电商中台的 AI 使用规范（一页纸，贴在工位旁）"]}, "ppt": {"method": "规范草案四段式（允许清单 / 禁止清单 / 复核动作 / 问责与留痕）", "case": "某电商中台的 AI 使用规范（一页纸，贴在工位旁）", "demo": "规范草案撰写指引（先写禁止清单，再写允许清单）"}, "objective": "能写出含允许 / 禁止 / 复核 / 问责四段、每段都有触发条件的部门 AI 使用规范草稿", "transfer": "草稿拿给部门里最不谨慎的那个人看，问「按这个你能照做吗」，改到他说能", "vslides": [{"t": "任务说明：先写禁止，再写允许", "n": "这一节要产出的是一页纸，不是一份制度汇编。顺序很重要：先写禁止清单，再写允许清单。原因是团队里绝大多数风险来自「不知道什么不能碰」，而不是「故意违规」。禁止清单要精确到字段名——写「敏感数据不得外传」等于没写，写「手机号、收货地址、订单号、支付流水、供货价」才有约束力。允许清单反而是给效率兜底的：如果只写禁止，团队会退回到不用 AI，你的规范就变成了阻止落地的文件。两份清单一正一反，中间夹着复核动作，这张纸才能既保安全又保效率。见过不少团队的规范只写禁止，结果不是更安全，而是大家悄悄用、出事更没人知道——因为明面上的使用量归零，风险反而转到了暗处。你要的是「敢用且用对」，不是「不敢用」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 禁止清单（精确到字段）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 禁止清单（精确到字段）</tspan></text></g><g data-k=\"② 允许清单（照做即可用）\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 允许清单（照做即可用）</tspan></text></g><g data-k=\"③ 复核动作与退回\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 复核动作与退回</tspan></text></g><g data-k=\"④ 留痕、回滚与问责\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 留痕、回滚与问责</tspan></text></g></svg>", "d": 71.14}, {"t": "四段式：每段都要有触发条件", "n": "四段的内容分别是：禁止清单、允许清单、复核动作、留痕与问责。每一段都必须带触发条件——什么时候这条规则生效。比如「待贴材料里出现手机号 → 停止操作、按脱敏三步处理」；「文案要上线 → 先过广告法词表、由法务复核」。没有触发条件的规则，等于把判断权又还给了每个人的自觉。另外提醒一个常见坑：复核动作不要写成「需审核」，要写清谁审、审什么、不通过怎么退回。否则复核会退化成一句口头「我看过了」，出事时谁也说不清。合格的复核动作长这样：文案上线前由法务对照禁用词表逐条过，不过的用批注写清改哪句、改完重走一遍流程，不口头放行。另外，复核人最好是能对后果负责的人，而不是顺手抓一个同事签字——签了字却看不懂内容，等于没有复核。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">规范四段式</tspan></text><g data-k=\"禁止清单\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">禁止清单</tspan></text></g><g data-k=\"允许清单\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">允许清单</tspan></text></g><g data-k=\"复核与退回\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">复核与退</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">回</tspan></text></g><g data-k=\"留痕与问责\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">留痕与问</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">责</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 76.18}, {"t": "怎么写才有人真的用", "n": "最后一个判断标准：这份规范能不能贴到工位旁，让人在两分钟内查到「我现在这一步能不能做」。做法是控制在一页、用短句、把最常遇到的三件事放在最前面。写完后做一次自测：拿本周你做过的三件 AI 相关的事，逐条对照规范，看能不能明确判定「可以/不可以/需要脱敏后可以」。如果有一件判不出来，说明规范还有缺口。这份草稿的标准流程是：你写 → 合规与法务评审 → 部门会通过 → 生效并纳入月度抽查。排版上把三条最狠的禁令放在最顶部、加粗、单独成段，因为人在赶时间的时候只会看前三行。下面附了一份填完的范例，可以直接照着改成你部门的版本。改的时候保留四段结构，把里面的字段名换成你们实际用的字段，就基本可用了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"一页纸，两分钟内能查到结论\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">一页纸，两分钟内能查到结论</tspan></text></g><g data-k=\"禁止清单精确到字段名\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">禁止清单精确到字段名</tspan></text></g><g data-k=\"每条都有触发条件与 owner\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条都有触发条件与 owner</tspan></text></g><g data-k=\"拿本周三件事能逐条判定\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">拿本周三件事能逐条判定</tspan></text></g></svg>", "d": 68.4}], "deliverable": {"type": "skill", "name": "部门 AI 使用规范草稿", "rubric": ["禁止清单", "复核动作", "可执行性"], "acceptance": "一页纸能贴到工位旁的规范：四段齐全、每条有触发条件与 owner、禁止清单精确到字段名"}, "practice": {"steps": ["先写禁止清单：列出三类绝对不能贴的数据字段", "再写允许清单：列出三类可以直接用 AI 的低风险场景", "写复核动作：哪些输出必须人复核、复核人是谁、不通过怎么退回", "写问责与留痕：事故怎么追溯、记录存哪里、多久内回滚"], "exemplar": "【模拟电商品牌 Y 产品部 · AI 使用规范（草稿 v0.1）】拟稿：产品经理　评审：合规/法务/数据　生效：待评审通过\n\n■ 一、禁止清单（出现即停，不得例外）\n1. 含手机号、收货地址、身份证号、支付流水号的原始数据，任何情况下不进公开大模型。\n2. 供货价、合同条款、返点比例等商务敏感信息，不进任何外部工具。\n3. 未脱敏的用户原话（含昵称、头像、订单号）不得整段粘贴；引用时只保留「类目 + 主题 + 极性」。\n4. 不得让 AI 输出对竞品经营状况的定性判断（销量、库存、资金），只做公开信息对比。\n触发条件：以上任一项出现在待贴材料里 → 停止操作，按第三节脱敏后再继续。\n\n■ 二、允许清单（低风险，可直接用）\n1. 公开页面信息整理：竞品活动页、平台规则页 → 结构化对比表。产出用于内部讨论。\n2
