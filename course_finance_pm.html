<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>金融 + 产品经理 AI 实战 · 课程播放器（B-2）</title>
<style>

    --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  header{padding:16px 24px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:700}
  header .tag{font-size:12px;color:var(--blue);background:var(--blue-bg);padding:3px 10px;border-radius:20px}
  .scenario{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .scenario label{font-size:12px;color:var(--text2)}
  .scenario input{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;width:120px}
  .layout{display:flex;height:calc(100vh - 73px)}
  .sidebar{width:280px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:12px}
  .module{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .module-head{padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .module-head .dot{font-size:11px;color:var(--text2)}
  .module-body{display:none;padding:0 8px 8px}
  .module.open .module-body{display:block}
  .tier-label{font-size:11px;color:var(--text2);padding:6px 6px 2px;font-weight:600}
  .unit{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit .step{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--bg);color:var(--text2);flex-shrink:0}
  .unit.active .step{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:24px 32px}
  .crumb{font-size:12px;color:var(--text2);margin-bottom:6px}
  .utitle{font-size:22px;font-weight:700;margin-bottom:4px}
  .umeta{font-size:13px;color:var(--text2);margin-bottom:18px}
  .umeta .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px;margin-right:6px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:8px 14px;cursor:pointer;font-size:14px;color:var(--text2);border-bottom:2px solid transparent}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
  .panel{display:none;animation:fade .2s}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h3{font-size:15px;margin-bottom:10px;color:var(--blue-d);display:flex;align-items:center;gap:8px}
  .card .badge{font-size:11px;background:var(--amber-bg);color:var(--amber);padding:2px 8px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:6px 0 6px 20px;position:relative}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .ppt-page{border:1px dashed var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:#fcfdff}
  .ppt-page .pg{font-size:11px;color:var(--blue);font-weight:700;letter-spacing:.5px}
  .ppt-page .pg.case{color:var(--amber)} .ppt-page .pg.demo{color:var(--green)}
  textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px;resize:vertical;background:#fcfdff}
  .btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;margin-top:8px}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .deliver{background:var(--green-bg);border:1px solid #bbf7d0;color:#166534;padding:10px 14px;border-radius:8px;font-size:14px;margin-top:8px}
  details.ex{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:10px;background:#fcfdff}
  summary{cursor:pointer;font-weight:600;color:var(--blue-d);font-size:14px}
  .note{font-size:12px;color:var(--text2);background:var(--amber-bg);border:1px solid #fde68a;padding:10px 14px;border-radius:8px}
  footer{padding:14px 24px;font-size:12px;color:var(--text2);background:#fff;border-top:1px solid var(--border)}
</style>
</head>

/* ============ 渲染逻辑 ============ */
const STEP_LABEL = { understand:'理解', demo:'演示', todo:'我要做', spar:'陪练' };
let cur = null;

function fill(s){
  if(typeof s!=='string') return s;
  const ind=document.getElementById('f-industry').value.trim()||'消费金融';
  const com=document.getElementById('f-company').value.trim()||'模拟银行 X';
  const pro=document.getElementById('f-product').value.trim()||'闪电贷';
  return s.replace(/\{\{industry\}\}/g,ind).replace(/\{\{company\}\}/g,com).replace(/\{\{product\}\}/g,pro);
}

function buildSidebar(){
  const sb=document.getElementById('sidebar'); sb.innerHTML='';
  COURSE.modules.forEach((m,mi)=>{
    const mod=document.createElement('div'); mod.className='module'+(mi===0?' open':'');
    mod.innerHTML=`<div class="module-head"><span>${m.id}</span> ${fill(m.title)} <span class="dot">${m.dims.join('·')}</span></div>`;
    const body=document.createElement('div'); body.className='module-body';
    ['basic','adv'].forEach(tier=>{
      const tl=document.createElement('div'); tl.className='tier-label';
      tl.textContent = tier==='basic'?'入门档 (U1–U4)':'进阶档 (U5–U8)';
      body.appendChild(tl);
      m.units.filter(u=>u.tier===tier).forEach(u=>{
        const el=document.createElement('div'); el.className='unit'; el.dataset.uid=u.id;
        el.innerHTML=`<span class="step">${STEP_LABEL[u.step]}</span> ${fill(u.title)}`;
        el.onclick=()=>openUnit(m,u);
        body.appendChild(el);
      });
    });
    mod.querySelector('.module-head').onclick=()=>mod.classList.toggle('open');
    mod.appendChild(body); sb.appendChild(mod);
  });
}

function openUnit(m,u){
  cur={m,u};
  document.querySelectorAll('.unit').forEach(e=>e.classList.toggle('active',e.dataset.uid===u.id));
  const cr=document.getElementById('crumb');
  cr.textContent=`${m.id} · ${u.tier==='basic'?'入门档':'进阶档'} · ${STEP_LABEL[u.step]}`;
  const t=document.getElementById('utitle'); t.textContent=fill(u.title);
  document.getElementById('umeta').innerHTML=
    `<span class="chip">维度 ${m.dims.join('·')}</span><span class="chip">视频约 ${u.video.dur}</span>`;
  renderTabs(u);
}

function renderTabs(u){
  const tabs=document.getElementById('tabs'); const panels=document.getElementById('panels');
  const defs=[['video','🎬 视频'],['ppt','📑 PPT 课件']];
  if(u.step==='demo') defs.push(['demo','🤖 WorkBuddy 演示脚本']);
  if(u.step==='todo') defs.push(['practice','✅ 练习卡 + 示范']);
  if(u.step==='spar') defs.push(['spar','🎯 陪练（角色+必问）']);
  tabs.innerHTML=defs.map((d,i)=>`<div class="tab ${i===0?'active':''}" data-t="${d[0]}">${d[1]}</div>`).join('');
  panels.innerHTML=defs.map((d,i)=>`<div class="panel ${i===0?'active':''}" data-p="${d[0]}">${renderPanel(u,d[0])}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    panels.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    panels.querySelector(`.panel[data-p="${t.dataset.t}"]`).classList.add('active');
  });
}

function renderPanel(u,key){
  if(key==='video'){
    return `<div class="card"><h3>视频脚本 <span class="badge">约 ${u.video.dur}·生产中</span></h3>
      <ul class="li">${u.video.script.map(s=>`<li>${fill(s)}</li>`).join('')}</ul>
      <div class="note">视频生产管线在 B-5 接入（PPT 排版 + 火山引擎豆包配音），此处先放脚本供跟拍/跟练。</div></div>`;
  }
  if(key==='ppt'){
    const p=u.ppt;
    return `<div class="card"><h3>平台内 H5 课件（三页）</h3>
      <div class="ppt-page"><div class="pg">方法论页</div>${fill(p.method)}</div>
      <div class="ppt-page"><div class="pg case">案例页</div>${fill(p.case)}</div>
      <div class="ppt-page"><div class="pg demo">演示实操页</div>${fill(p.demo)}</div></div>`;
  }
  if(key==='demo'){
    const d=u.demoScript;
    return `<div class="card"><h3>WorkBuddy 演示脚本</h3>
      <ul class="li">${d.steps.map(s=>`<li>${fill(s)}</li>`).join('')}</ul>
      <p style="font-size:13px;color:var(--text2);margin:8px 0 4px">复制以下提示词到 WorkBuddy 复现演示：</p>
      <textarea readonly id="dlg">${fill(d.prompt)}</textarea>
      <button class="btn" onclick="copy('dlg')">复制提示词</button></div>`;
  }
  if(key==='practice'){
    const p=u.practice;
    return `<div class="card"><h3>练习步骤卡</h3>
      <ul class="li">${p.steps.map(s=>`<li>${fill(s)}</li>`).join('')}</ul>
      <details class="ex"><summary>查看产出物示范（exemplar）</summary>
      <div style="white-space:pre-wrap;margin-top:8px;font-size:13px">${fill(p.exemplar)}</div></details>
      ${u.deliverable?`<div class="deliver">📦 本单元带走物：${fill(u.deliverable)}</div>`:''}</div>`;
  }
  if(key==='spar'){
    const s=u.spar;
    const sys=`你是「${s.role}」，在金融产品经理 AI 实训中担任陪练。\n当前任务：${fill(u.title)}。\n学员需交付：${fill(u.deliverable||'本单元产出')}。\n请基于你的角色视角（${s.persona}）挑战学员，重点追问：\n${s.mustAsk.map(q=>'· '+q).join('\n')}\n当学员回答达到"完整性/可用性/合规"三维度要求时给予通过，并说明通过/未通过理由。`;
    return `<div class="card"><h3>陪练角色：${s.role}</h3>
      <p style="font-size:13px;color:var(--text2)">角色设定：${s.persona}</p>
      <p style="font-weight:600;margin:8px 0 4px">必问清单（挑战到通过）：</p>
      <ul class="li">${s.mustAsk.map(q=>`<li>${q}</li>`).join('')}</ul>
      <p style="font-size:13px;color:var(--text2);margin:8px 0 4px">复制完整陪练提示词（角色+任务+rubric）到 WorkBuddy（B-4 将直连 DeepSeek API 自动注入），即可开始真实陪练：</p>
      <textarea readonly id="slg">${sys}</textarea>
      <button class="btn" onclick="copy('slg')">复制陪练提示词</button>
      ${u.deliverable?`<div class="deliver">📦 本单元带走物：${fill(u.deliverable)}</div>`:''}</div>`;
  }
  return '';
}

function copy(id){
  const el=document.getElementById(id); el.select();
  navigator.clipboard.writeText(el.value).then(()=>{
    const b=event.target; const t=b.textContent; b.textContent='已复制 ✓';
    setTimeout(()=>b.textContent=t,1500);
  });
}

['f-industry','f-company','f-product'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{ buildSidebar(); if(cur) openUnit(cur.m,cur.u); });
});

buildSidebar();
openUnit(COURSE.modules[0], COURSE.modules[0].units[0]);
</script>
