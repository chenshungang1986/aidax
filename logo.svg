<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Main nodes forming "A" shape -->
  <circle cx="16" cy="18" r="6" fill="url(#g1)"/>
  <circle cx="32" cy="6" r="6" fill="url(#g1)"/>
  <circle cx="48" cy="18" r="6" fill="url(#g1)"/>
  <circle cx="32" cy="30" r="6" fill="url(#g1)"/>
  <circle cx="32" cy="42" r="5" fill="url(#g2)"/>
  
  <!-- Connection lines -->
  <line x1="16" y1="18" x2="32" y2="6" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="6" x2="48" y2="18" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="18" x2="32" y2="30" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="18" x2="32" y2="30" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="30" x2="32" y2="42" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Orbit ring -->
  <circle cx="32" cy="18" r="21" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.3"/>
  
  <!-- Small satellites -->
  <circle cx="8" cy="8" r="3" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="56" cy="8" r="3" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="56" cy="28" r="2.5" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="8" cy="28" r="2.5" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="32" cy="50" r="2" fill="#ddd6fe" opacity="0.4"/>
  
  <!-- Lines to satellites -->
  <line x1="16" y1="18" x2="8" y2="8" stroke="#c4b5fd" stroke-width="1" opacity="0.35"/>
  <line x1="48" y1="18" x2="56" y2="8" stroke="#c4b5fd" stroke-width="1" opacity="0.35"/>
  <line x1="32" y1="42" x2="32" y2="50" stroke="#ddd6fe" stroke-width="1" opacity="0.3"/>
  
  <!-- Text: AI达学 -->
  <text x="68" y="28" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" font-size="22" fill="#1e293b" letter-spacing="-0.5">AI达学</text>
  
  <!-- Text: AIDAX — 企业AI学习一站式服务 -->
  <text x="68" y="46" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="10.5" fill="#94a3b8" letter-spacing="1.5">AIDAX · 企业AI学习一站式服务</text>
</svg>