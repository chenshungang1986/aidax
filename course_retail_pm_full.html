<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>零售电商 × 产品经理 AI 实战 · 完整学习课程（M0–M7 · 64 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7}
  header{padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:700}
  header h1 span{font-size:12px;font-weight:500;color:var(--mut);margin-left:8px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;height:calc(100vh - 62px)}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center;background:#fbfcff}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  .vp .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#eaf0ff}
  .slide.on{display:flex}
  .slide h4{font-size:16px;margin:0 0 6px;color:#fff;flex:none}
  .slide svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.72) 55%,rgba(0,0,0,0) 100%);color:#fff;font-size:19px;font-weight:500;line-height:1.5;padding:20px 28px 16px;min-height:70px;display:block;text-align:center;letter-spacing:.4px;text-shadow:0 2px 6px rgba(0,0,0,.95)}
  .dots{position:absolute;top:11px;left:0;right:0;display:flex;gap:6px;justify-content:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
  .dots i.on{background:#fff}
  .vbar{display:flex;align-items:center;gap:12px;margin-top:9px}
  .play{background:var(--blue);color:#fff;border:none;padding:8px 17px;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600;white-space:nowrap}
  .seek{flex:1;height:8px;border-radius:6px;background:#e4eaf7;position:relative;cursor:pointer}
  .seek .fill{height:100%;background:var(--blue);border-radius:6px;width:0}
  .seek .knob{position:absolute;top:-4px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-left:-7px;left:0}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .aud-note{font-size:12px;color:var(--mut);margin-top:5px}
  textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;background:#fcfdff}
  input.tin{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fcfdff}
  .btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:13.2px;margin:6px 6px 0 0}
  .btn.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
  .btn.ok{background:var(--green)}
  .btn[disabled]{background:#c9d3e6;cursor:not-allowed;border-color:#c9d3e6;color:#fff}
  .wb{background:#0e1530;color:#dce6ff;border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;line-height:1.7}
  .wb .me{color:#ffd98a}.wb .ai{color:#9be8b0}.wb .hl-line{color:#fff;font-weight:600}
  .chat{display:flex;flex-direction:column;gap:9px;margin:6px 0}
  .bub{max-width:82%;padding:9px 12px;border-radius:11px;font-size:13.3px;white-space:pre-wrap}
  .bub.ai{background:#eef4ff;color:var(--blue-d);align-self:flex-start}
  .bub.me{background:var(--blue);color:#fff;align-self:flex-end}
  .bub.sys{background:#f1f4fa;color:var(--mut);align-self:center;font-size:12px;max-width:100%}
  .qs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .qbtn{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.4px;cursor:pointer}
  .qbtn:hover{border-color:var(--blue);color:var(--blue)}
  .done-card{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:18px;text-align:center}
  .done-card h3{font-size:19px;color:#166534;margin-bottom:4px}
  .cp-score{font-size:30px;font-weight:800;color:#16a34a;margin:6px 0}
  .tag-done{display:inline-block;background:var(--green);color:#fff;font-size:12px;padding:1px 9px;border-radius:20px;margin-left:6px}
  /* 题干 / 模板 / 评分 */
  .ip{border-left:4px solid var(--blue)}
  .ip-task{font-size:14.5px;font-weight:700;margin:2px 0 8px;color:var(--txt)}
  .brief{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.1px;white-space:pre-wrap;line-height:1.78;color:#28345a}
  .tpl{background:#0e1530;color:#d7e3ff;border-radius:11px;padding:13px 15px;font-size:12.6px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  details>summary{cursor:pointer;font-size:13.3px;color:var(--blue-d);font-weight:600;margin:10px 0 6px;list-style:none;display:flex;align-items:center;gap:6px}
  details>summary::-webkit-details-marker{display:none}
  details>summary:before{content:"\25B8";transition:transform .15s;display:inline-block}
  details[open]>summary:before{transform:rotate(90deg)}
  .rub{list-style:none;font-size:13px;color:var(--mut);margin:4px 0}
  .rub li{padding:2px 0 2px 20px;position:relative}
  .rub li:before{content:"\25CB";position:absolute;left:2px;color:#c3ccdf}
  .rub li.ok{color:#166534}
  .rub li.ok:before{content:"\25CF";color:var(--green)}
  .rub li span.hint{color:#b4682a;font-size:12px}
  .bar{height:9px;background:#e4eaf7;border-radius:6px;overflow:hidden;margin:7px 0 3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1a5cff,#4d8bff);transition:width .3s}
  /* 测验 */
  .qz-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:9px 0;background:#fff}
  .qz-item .q{font-size:13.8px;font-weight:600;margin-bottom:7px}
  .qz-item .op{padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13.2px;border:1px solid transparent}
  .qz-item .op:hover{background:#f5f8ff}
  .qz-item .op.right{background:var(--green-bg);color:#166534;border-color:#86efac}
  .qz-item .op.wrong{background:#fff1f2;color:#be123c;border-color:#fecdd3}
  .qz-item .tip{font-size:12.5px;color:var(--mut);display:none;margin-top:6px}
  .modal{position:fixed;inset:0;background:rgba(8,16,40,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:16px;padding:24px 26px;max-width:520px;width:100%;text-align:center;max-height:86vh;overflow-y:auto;position:relative}
  .modal .box h3{font-size:19px;margin-bottom:4px;color:var(--txt)}
  .modal .box p{font-size:13.4px;color:var(--mut);margin:6px 0 14px}
  .modal .box .acts{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .modal .box.wide{max-width:800px;text-align:left}
  .art-body{white-space:pre-wrap;font-size:12.4px;line-height:1.62;background:#f6f8fc;border:1px solid #e2e8f5;border-radius:10px;padding:14px 16px;max-height:58vh;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .deliv{border:1px solid #e2e8f5;border-left:4px solid #2f6bff;background:#fbfcff;border-radius:12px;padding:14px 16px;margin-top:12px}
  .deliv .dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .deliv .dname{font-weight:700;font-size:15px}
  .badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
  .badge.skill{background:#2f6bff}.badge.agent{background:#7c3aed}.badge.workflow{background:#0e9f6e}.badge.kb{background:#d97706}
  .deliv .dacc{font-size:12.8px;color:var(--mut);margin:6px 0 10px;line-height:1.55}
  .deliv .rub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .deliv .rub .chip2{font-size:11.5px;background:#eef2fb;color:#274690;padding:2px 9px;border-radius:999px}
  .score-ta{width:100%;min-height:160px;box-sizing:border-box;margin-top:10px;padding:12px 14px;border:1px solid #d7e0f2;border-radius:10px;font-size:13px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;background:#fff;color:#1a2233}
  .score-ta:focus{outline:none;border-color:#2f6bff;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
  .score-inp{width:110px;padding:8px 10px;border:1px solid #d7e0f2;border-radius:8px;font-size:14px}
  .cap-entry{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:5px 12px;border:1px solid #2f6bff;color:#2f6bff;background:#f3f7ff;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
  .cap-entry:hover{background:#e6efff}
  .deliv .dacts{display:flex;gap:8px;flex-wrap:wrap}
  .mclose{position:absolute;top:10px;right:14px;font-size:18px;color:var(--mut);cursor:pointer}
  .fm{text-align:left;font-size:13px}
  .fm label{display:block;font-size:12.6px;color:var(--mut);margin:10px 0 4px}
  .fm .note{font-size:12.2px;color:var(--mut);background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;line-height:1.7}
  .fm code{background:#eef2fb;border-radius:4px;padding:1px 5px;font-size:12px}
  /* ===== 学习指引 ===== */
  .guide{border:1px solid #cfe0ff;background:linear-gradient(135deg,#f3f8ff,#eef4ff);border-radius:13px;padding:13px 16px;margin:4px 0 12px;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .guide h3{font-size:14px;color:var(--blue-d);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .guide .g-ctx{font-size:12.4px;color:var(--mut);margin-bottom:8px}
  .g-steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .g-step{display:inline-flex;align-items:center;gap:5px;font-size:12.2px;padding:4px 10px;border-radius:999px;border:1px solid #d7e3ff;background:#fff;color:var(--mut)}
  .g-step.cur{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:700}
  .g-step.done{background:#eafaf0;border-color:#9fe0bd;color:#166534}
  .g-path{list-style:none;margin:8px 0 2px;padding:0}
  .g-path li{font-size:13px;line-height:1.85;color:#28345a;padding-left:22px;position:relative}
  .g-path li:before{content:"▢";position:absolute;left:4px;color:var(--blue)}
  .g-path li.lead:before{content:"▶";color:var(--blue-d);font-weight:700}
  .g-next{font-size:12.7px;color:var(--blue-d);background:#fff;border:1px dashed #b9d0ff;border-radius:9px;padding:9px 11px;margin-top:8px;line-height:1.7}
  .g-next b{color:var(--blue-d)}
  /* ===== 反馈气泡 + 弹窗（参考测评设计） ===== */
  #lf-fab{position:fixed;right:18px;bottom:18px;z-index:150;display:flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(26,92,255,.35)}
  #lf-fab:hover{background:var(--blue-d)}
  #lf-modal .box{max-width:560px;text-align:left}
  .lf-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .lf-head h3{font-size:17px;margin:0}
  .lf-close{margin-left:auto;font-size:22px;color:var(--mut);background:none;border:none;cursor:pointer;line-height:1}
  .lf-meta{font-size:12.3px;color:var(--mut);background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;line-height:1.6;margin-bottom:10px}
  .lf-label{font-size:12.8px;color:var(--blue-d);font-weight:600;margin:12px 0 6px}
  .lf-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .lf-type{padding:9px 4px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;text-align:center;transition:.15s}
  .lf-type .ti{font-size:18px;display:block;margin-bottom:3px}
  .lf-type.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
  .lf-cat-row,.lf-sev-row{display:flex;gap:7px;flex-wrap:wrap}
  .lf-cat,.lf-sev{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12.6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .lf-cat.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
  .lf-sev.on{background:var(--amber);color:#fff;border-color:var(--amber)}
  .lf-media-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .lf-media-row button{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12.8px;cursor:pointer}
  .lf-media-row button:hover{border-color:var(--blue);color:var(--blue-d)}
  .lf-preview{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .lf-thumb-wrap{position:relative;display:inline-block}
  .lf-preview img{max-width:130px;max-height:110px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
  .lf-preview .lf-file{font-size:12px;background:#f1f4fa;border-radius:8px;padding:4px 9px;color:var(--mut)}
  .lf-drop{border:1.5px dashed var(--line);border-radius:10px;padding:10px;text-align:center;font-size:12.3px;color:var(--mut);margin-top:8px}
  .lf-drop.over{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
  /* 图片放大灯箱 */
  .lb-mask{position:fixed;inset:0;background:rgba(8,12,24,.82);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:24px}
  .lb-mask img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .lb-close{position:absolute;top:16px;right:22px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer;line-height:1}
  /* 内嵌 AI 陪练抽屉 */
  .spar-modal .box{width:min(560px,94vw);height:min(76vh,720px);display:flex;flex-direction:column;padding:0;overflow:hidden}
  .spar-hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#f8faff}
  .spar-hd h3{font-size:15px;margin:0}
  .spar-hd .sub{font-size:11.8px;color:var(--mut);margin-top:2px}
  .spar-hd .x{margin-left:auto;font-size:22px;color:var(--mut);background:none;border:none;cursor:pointer;line-height:1}
  .spar-body{flex:1;overflow:auto;padding:12px 14px;background:#fff}
  .spar-msg{margin-bottom:10px;display:flex}
  .spar-msg.me{justify-content:flex-end}
  .spar-msg .b{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.4px;line-height:1.65;white-space:pre-wrap}
  .spar-msg.ai .b{background:#f1f4fa;color:#1a2233;border-top-left-radius:3px}
  .spar-msg.me .b{background:var(--blue);color:#fff;border-top-right-radius:3px}
  .spar-msg.sys .b{background:#fff8e6;color:#8a5a00;font-size:12.4px;border:1px solid #f0dca8;max-width:100%}
  .spar-typing{font-size:12.4px;color:var(--mut);padding:4px 2px}
  .spar-ft{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:#fbfcfe}

  .spar-status{font-size:11.8px;color:var(--mut);padding:0 12px 8px;background:#fbfcfe}
  .spar-status .on{color:#166534;font-weight:600}

  .lf-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

  .lf-report{white-space:pre-wrap;font-size:12.4px;background:#0e1530;color:#d7e3ff;border-radius:10px;padding:12px 14px;max-height:230px;overflow:auto;margin-top:10px;font-family:ui-monospace,Consolas,monospace;line-height:1.6}
  @media(max-width:560px){.lf-type-grid{grid-template-columns:repeat(2,1fr)}}

  /* ===== 多邻国式分步通关 ===== */

  .stepper .sbar{flex:1;height:6px;background:#e4eaf7;border-radius:6px;overflow:hidden;min-width:44px}
  .stepper .sbar i{display:block;height:100%;background:var(--green);transition:width .3s}
  .cp{max-width:680px;margin:0 auto}
  .cp-head{margin:2px 0 10px}
  .cp-title{font-size:19px;font-weight:800}
  .cp-sub{font-size:12.6px;color:var(--mut);margin-top:2px;line-height:1.6}
  .cp-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .cp-notes{margin:10px 0}

  .settle{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:26px 20px}
  .settle .cp-score{font-size:34px;font-weight:800;color:#16a34a;margin:8px 0}

const COURSE = {"id": "retail_pm", "role": "pm", "customization": {"industry": "零售电商", "company": "模拟电商品牌 Y", "product": "优选生活馆"}, "modules": [{"id": "M0", "title": "M0 导论：零售电商 PM 的 AI 机会与红线", "units": [{"id": "M0U1", "tier": "basic", "step": "understand", "title": "零售电商 PM 的 6 类 AI 机会与 3 条红线", "video": {"dur": "8min", "script": ["零售电商 PM 同时背 GMV、转化与合规三本账，是 AI 落地最容易见效也最容易出事的岗位", "六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）", "某美妆电商用 AI 把周报从 6 小时压到 40 分钟"]}, "ppt": {"method": "六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）", "case": "某美妆电商用 AI 把周报从 6 小时压到 40 分钟", "demo": "红线对照卡：把「贴用户订单明细进公开 AI」标记为高危"}, "vslides": [{"t": "开场：零售电商 PM 为什么是落点", "n": "在电商里，最清楚用户想要什么、也最清楚一单生意成本结构的人，通常是产品经理。你既听得懂运营的节奏，也讲得清供应链的约束。所以 AI 在电商落地时，最先产生价值的地方往往不是算法团队，而是你的日常产出。这一节只谈两件事：AI 能替你在哪几个环节干活，以及哪三条线你绝对不能踩。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">零售电商 PM 的位置</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">懂用户</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">懂货盘</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">懂成本</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "六类 AI 机会：逐条对应日常痛点", "n": "把你的工作拆成六类机会。第一类是洞察，比如评论情感与趋势扫描；第二类是研究，比如把用户行为变成分层画像；第三类是设计，比如详情页与活动玩法；第四类是分析，比如转化漏斗与复购归因；第五类是协同，比如营销自动化与库存联动；第六类是合规，比如个保法条款比对。这六件事加起来，占掉你六成以上的时间。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六类 AI 机会</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">洞察</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">研究</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">设计</tspan></text></g><g class=\"hl\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">分析</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">协同</tspan></text></g><g><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">合规</tspan></text></g></svg>"}, {"t": "三条红线：越线就别上线", "n": "红线只有三条，条条都硬。第一条，数据不裸奔，用户订单、手机号、地址这类个人信息不能贴进公开大模型；第二条，不替人决策，定价、选品取舍的最终责任人必须写清楚是人；第三条，可解释可追溯，AI 给的结论要能说清依据、也能回放过程。守住这三条，你才谈得上长期提效。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据不裸奔，用户订单与隐私不进公开模型</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替人决策，责任主体写清楚</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">可解释可追溯，依据与过程能回放</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "粘贴任意 PM 交付物，能输出三类红线风险清单与修改建议，且不越权下合规判断"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】六类机会矩阵图 + 红线三原则清单（每张机会卡标注「AI 能帮 / 人要把关」）\n【为什么重要】零售电商 PM 同时背 GMV、转化与合规三本账，是 AI 落地最容易见效也最容易出事的岗位\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M0U2", "tier": "basic", "step": "demo", "title": "同一份用户数据：踩红线 vs 守红线", "video": {"dur": "8min", "script": ["绝大多数风险不是 AI 不可靠，而是人随手把不该外传的东西贴了出去", "踩红线 / 守红线对照演示（同一份用户评价两种处理方式）", "「优选生活馆」改版复盘材料（含真实用户订单片段）"]}, "ppt": {"method": "踩红线 / 守红线对照演示（同一份用户评价两种处理方式）", "case": "「优选生活馆」改版复盘材料（含真实用户订单片段）", "demo": "WorkBuddy 内跑一遍脱敏后的评价洞察生成"}, "vslides": [{"t": "演示准备：一份含用户隐私的数据", "n": "我们开始演示。手上是一份「优选生活馆」的改版复盘，里面附带了用户评价的原始记录：用户昵称、手机号、收货城市、还有一条带订单号的退换货记录。在做任何 AI 操作之前，先看一眼它属于什么级别的数据。这一步是习惯，不是形式。电商数据里，身份与交易是最高敏的两类。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示数据预览</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">原始评价片段</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">用户：小*  手机：138****</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">订单号：SO2026**** 退换原因：尺码</tspan></text></g></svg>"}, {"t": "踩红线：整段粘贴到公开大模型", "n": "先模拟最常见的错误操作：把整段评价，连同手机号和订单号，一起粘贴到公开的聊天窗口。它会给出很漂亮的洞察，效率看起来很高。但代价是这些数据已经离开企业边界。个保法下，未脱敏的订单与联系方式属于个人信息，随手外传通常对应监管处罚而不是内部批评。便利和风险在这里同步放大。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩红线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">风险</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">整段贴入公开模型</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">答得漂亮、风险留在门外</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">用户身份与订单随文本一</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">起出域</tspan></text></g></svg>"}, {"t": "守红线：脱敏 + 只给结构化字段", "n": "换个做法。先把昵称换成「样本 A」，手机号与订单号整体删除，只保留结构字段：商品类目、评价主题、情感极性、提及频次。然后用这条提示词请 AI 基于给定字段归纳方向，并明确要求它不得索取任何个人信息。同样拿到可用洞察，数据却一步都没出域。守红线的手法就是这三步：脱敏、最小化、显式约束。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">守红线三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">脱敏</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">最小化字段</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">提示词显式约束</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《AI 红线自检》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」的用户评价洞察要点（已脱敏，不含任何个人订单与联系方式）：\n[粘贴评价聚类结果]\n请基于给定的公开语义归纳，给出三条可落地的体验优化方向，并明确标出哪些结论需要我补充内部转化数据后才能定。"}, "task": "在 WorkBuddy 里把「踩红线 / 守红线对照演示（同一份用户评价两种处理方式）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】踩红线 / 守红线对照演示（同一份用户评价两种处理方式）\n【参考案例】「优选生活馆」改版复盘材料（含真实用户订单片段）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」的用户评价洞察要点（已脱敏，不含任何个人订单与联系方式）：\n[粘贴评价聚类结果]\n请基于给定的公开语义归纳，给出三条可落地的体验优化方向，并明确标出哪些结论需要我补充内部转化数据后才能定。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U3", "tier": "basic", "step": "todo", "title": "画一张你的 AI 提效地图", "video": {"dur": "8min", "script": ["提效方案失败的第一步，往往是连自己这周到底做了什么都列不全", "提效地图模板（工作项 / AI 切入点 / 红线标注）", "「优选生活馆」项目组提效地图样例（8 项工作 × 三列）"]}, "ppt": {"method": "提效地图模板（工作项 / AI 切入点 / 红线标注）", "case": "「优选生活馆」项目组提效地图样例（8 项工作 × 三列）", "demo": "地图填写操作指引（先列工作再标 AI 点）"}, "vslides": [{"t": "任务说明：先把事实列全", "n": "这一节是实操。打开空白文档，把你本周做过的所有工作列出来，尽量列到八项以上，包括写活动方案、跑转化数据、开会、对文档这些看起来琐碎的部分。不要先判断哪个能用 AI，先把事实列全。列不全，后面的地图就是空谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列出本周 8 项主要工作</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 每一项标注三列</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 汇成一张可分享的地图</tspan></text></svg>"}, {"t": "三项标注：能不能、用在哪、是否触红线", "n": "每一行填三列。第一列，这项工作能不能用 AI；第二列，如果可以，用在哪一步，是读材料、生成初稿还是做对比；第三列，这一步是否触红线，涉及用户隐私、交易数据还是成本数据。第三列最容易被跳过，却最关键。判定标准很简单：只要数据可能来自真实用户，就先按敏感处理。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每行填三列</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">能否用 AI</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">用在哪一步</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">是否触红线</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "产出与分享：一张图胜过一页汇报", "n": "最后把地图整理成一页，发给直属主管。目的有两个：让主管看到你在用系统性方法提效，也把个人经验沉淀成团队规范。注意地图里至少要有一项标注为红线未通过，这反而让你更可信。一份全是绿灯的提效方案，通常说明写它的人根本没想过风险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">工作项不少于 8 项</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项都有用 AI 的具体环节</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">至少一项明确标注风险判定</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《个人 AI 提效地图》并通过本单元评分要点"}, "practice": {"steps": ["列出你本周 8 项主要工作", "对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线", "用模板汇成一张地图"], "exemplar": "工作项：竞品价格监控｜AI 切入：自动抓公开价盘做差异表｜红线：仅用公开来源 工作项：详情页复盘｜AI 切入：预读评价提 3 个痛点｜红线：不贴订单与用户数据"}, "task": "产出《个人 AI 提效地图》：列出你本周 8 项主要工作；对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线；用模板汇成一张地图", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M0 导论：零售电商 PM 的 AI 机会与红线」模块，你要交付的是《个人 AI 提效地图》。\n【场景】业务侧这周的诉求是：提效方案失败的第一步，往往是连自己这周到底做了什么都列不全。参考做法：「优选生活馆」项目组提效地图样例（8 项工作 × 三列）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提效地图模板（工作项 / AI 切入点 / 红线标注）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《个人 AI 提效地图》填写模板】\n\n■ 1. 列出你本周 8 项主要工作\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 用模板汇成一张地图\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   工作项：竞品价格监控｜AI 切入：自动抓公开价盘做差异表｜红线：仅用公开来源 工作项：详情页复盘｜AI 切入：预读评价提 3 个痛点｜红线：不贴订单与用户数据", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M0U4", "tier": "basic", "step": "spar", "title": "合规官挑战你的提效地图", "video": {"dur": "8min", "script": ["合规官的职责不是让你过，而是找出你地图里越过红线的那几个点", "合规挑战清单（数据 / 决策 / 可追溯）", "典型越线写法 vs 合规写法（贴订单号 vs 脱敏字段）"]}, "ppt": {"method": "合规挑战清单（数据 / 决策 / 可追溯）", "case": "典型越线写法 vs 合规写法（贴订单号 vs 脱敏字段）", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "vslides": [{"t": "陪练说明：合规官会挑你的地图", "n": "接下来进入陪练。你的对手是数据合规官，他的职责不是让你过，而是找出你地图里越过红线的点。他会按数据、决策、可追溯三个维度逐一追问。你不需要准备得完美，但必须准备好一条：被问到数据来源时，能说清它从哪来、有没有脱敏、有没有用户授权。这一问通常决定成败。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合规官的追问框架</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">数据来源</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">授权链条</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可追溯</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "他会问什么：三个高频问题", "n": "先剧透三个高频问题。第一，这项 AI 用法涉及的数据里有没有用户手机号或订单号？第二，如果 AI 给了错误建议，责任和可追溯链条怎么定？第三，有没有人最终决策的卡点？把答案提前写在地图备注里，陪练时你就不会被问倒。提前准备答案，比现场发挥靠谱得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">涉及的数据是否含用户个人信息</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">AI 出错时的责任与追溯链条</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">有没有人最终决策的卡点</tspan></text></svg>"}, {"t": "通过标准：三条都答上才放行", "n": "放行标准很明确：数据来源能说清、责任主体到人、AI 输出只做辅助不做终裁。陪练里如果答案被判定通过，你会拿到放行标记；答不上来就回去补。补的过程本身就是学习，比听十遍课有用。目标是拿到一张经得起合规挑战的地图，而不是让陪练说好话。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据来源说清</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任主体到人</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">AI 输出仅作辅助</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《个人 AI 提效地图》并通过本单元评分要点"}, "spar": {"role": "数据合规官", "persona": "严谨、只认制度，追问数据来源与授权链条", "mustAsk": ["这项 AI 用法涉及的数据里有没有用户手机号或订单号？", "如果 AI 给了错误建议，责任和可追溯链条怎么定？", "有没有「人最终决策」的卡点？"]}, "task": "把《个人 AI 提效地图》拿到「数据合规官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《个人 AI 提效地图》。现在要让它通过「数据合规官」这一关。\n【对手的立场】严谨、只认制度，追问数据来源与授权链条。\n【他一定会追问】「这项 AI 用法涉及的数据里有没有用户手机号或订单号？」 / 「如果 AI 给了错误建议，责任和可追溯链条怎么定？」 / 「有没有「人最终决策」的卡点？」\n【场景】你说「合规官挑战你的提效地图」，对方立刻回一句：这项 AI 用法涉及的数据里有没有用户手机号或订单号？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M0U5", "tier": "adv", "step": "understand", "title": "组织级 AI 落地路线与数据治理", "video": {"dur": "8min", "script": ["个人提效只是起点，真正拉开差距的是把打法固化到电商项目流程里", "落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）", "某电商中台 AI 提效治理框架（三层评审会）"]}, "ppt": {"method": "落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）", "case": "某电商中台 AI 提效治理框架（三层评审会）", "demo": "治理机制清单模板（数据 / 模型 / 输出三层）"}, "vslides": [{"t": "从个人到组织：为什么需要治理", "n": "个人用 AI 提效很快，但一旦十个人各贴各的订单数据，风险就不可控。组织级落地的第一件事，是把「能贴什么、不能贴什么」变成明文规则，而不是靠每个人自觉。治理不是给创新踩刹车，而是让创新能长期跑下去不翻车。这一步从列清单开始，不是从买平台开始。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">治理三角</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">规则</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">审计</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">问责</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "落地三阶段：试点 → 嵌入 → 量化", "n": "落地分三阶段。试点阶段，挑一个低风险场景跑通，比如公开评论洞察；嵌入阶段，把 AI 步骤写进 PRD 模板和复盘模板；量化阶段，用同一套口径统计提效与事故率。很多团队卡在第二步——把 AI 当玩具而不是当流程。流程化才是真正的能力沉淀。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 试点低风险场景</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 嵌入 PRD/复盘模板</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 量化提效与事故</tspan></text></svg>"}, {"t": "三层治理清单怎么写", "n": "治理清单写三层。数据层：哪些字段禁止外传、脱敏到什么粒度；模型层：哪些结论必须人复核、复核人写谁；输出层：对外材料谁签字、错误如何回滚。每层都要有 owner 和触发条件。写完你会得到一张可贴在工位旁的清单，比任何口号都管用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三层治理清单</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">数据分级</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">输出复核</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">问责归属</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">触发条件</tspan></text></g></svg>"}], "deliverable": {"type": "doc", "name": "AI 治理清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "给出你团队可落地的三层治理清单，含数据分级、输出复核、问责归属"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】落地三阶段路线图 + 治理三角（规则 / 审计 / 问责）\n【为什么重要】个人提效只是起点，真正拉开差距的是把打法固化到电商项目流程里\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M0U6", "tier": "adv", "step": "demo", "title": "用 AI 做竞品监控的合规边界", "video": {"dur": "8min", "script": ["竞品监控价值大，但一脚踩进对方后台或买来的数据包就违规了", "公开来源 vs 内部数据边界演示（价格/上新/玩法）", "「优选生活馆」竞品公开页监控（仅用公开信息）"]}, "ppt": {"method": "公开来源 vs 内部数据边界演示（价格/上新/玩法）", "case": "「优选生活馆」竞品公开页监控（仅用公开信息）", "demo": "WorkBuddy 内跑一遍「只喂公开页」的竞品摘要"}, "vslides": [{"t": "演示准备：只准备公开素材", "n": "这次演示只准备公开素材：竞品在官网、电商平台旗舰店、公开公众号里能直接看到的价格、玩法和上新节奏。不准备任何需要登录、付费或对方后台才能拿到的数据。边界先划清，演示才不会走偏。竞品监控的合规起点，就是用公开信息做出专业判断。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">仅公开可访问页面</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不含登录/付费数据</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不买第三方数据包</tspan></text></svg>"}, {"t": "守边界：让 AI 只吃公开字段", "n": "把公开页要点喂给 AI，并明确要求它归纳价格带、主推玩法、上新节奏三类信息，同时标注哪些信息属于登录或付费范围、不在本次分析内。AI 给出的对比表既专业又干净。关键在提示词里就把边界写死，而不是事后删。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">守边界三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">公开页要点</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">提示词写死边界</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">合规对比表</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "踩线警示：买数据包的下场", "n": "反过来，如果图省事买了第三方爬取的竞品订单数据包，哪怕只是看趋势，也已经踩线：数据来源不明、可能侵犯对方商业秘密。一旦出事，责任是买的人扛，不是卖数据包的人。守住「只用公开信息」这一条，你的监控结论才敢写进汇报。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">代价</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">买来的竞品数据包</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">看似省事</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">来源不明、责任你扛</tspan></text></g></svg>"}], "deliverable": {"type": "skill", "name": "AI 治理清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《AI 治理清单》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」三个竞品的公开商品页与活动页链接摘要（均为公开可访问内容）：\n[粘贴公开页要点]\n请归纳它们的价格带、主推玩法与上新节奏，并标注哪些信息需要登录或付费才能获取、不在本次分析范围内。"}, "task": "在 WorkBuddy 里把「公开来源 vs 内部数据边界演示（价格/上新/玩法）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】公开来源 vs 内部数据边界演示（价格/上新/玩法）\n【参考案例】「优选生活馆」竞品公开页监控（仅用公开信息）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」三个竞品的公开商品页与活动页链接摘要（均为公开可访问内容）：\n[粘贴公开页要点]\n请归纳它们的价格带、主推玩法与上新节奏，并标注哪些信息需要登录或付费才能获取、不在本次分析范围内。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U7", "tier": "adv", "step": "todo", "title": "写一份部门 AI 使用规范草稿", "video": {"dur": "8min", "script": ["规范不写出来，就等于没有规范；写出来，团队才有共同底线", "规范模板（适用范围 / 禁止项 / 复核 / 问责）", "「模拟电商品牌 Y」电商产品组 AI 使用规范样例"]}, "ppt": {"method": "规范模板（适用范围 / 禁止项 / 复核 / 问责）", "case": "「模拟电商品牌 Y」电商产品组 AI 使用规范样例", "demo": "规范填写操作指引（先列禁止项再列流程）"}, "vslides": [{"t": "任务说明：从禁止项写起", "n": "这节动手写规范。别从「鼓励使用」写起，先从禁止项写起——人更容易记住不能做什么。列出至少 5 条，必须覆盖数据外传、越权决策、第三方数据包这三类高频风险。禁止项越具体越好，写「不得粘贴含订单号的评价」比写「注意数据安全」管用十倍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列 5 条禁止项</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 写 3 条必复核场景</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 补问责与上报</tspan></text></svg>"}, {"t": "必复核场景：把「人把关」落到人", "n": "接着写必须人复核的场景。至少 3 条：促销力度方案由运营负责人复核、对外口径由品牌复核、涉及成本的结论由财务复核。每条都要写「谁复核」，不能写「相关同事」。复核人写具体角色，问责才不会悬空。这是规范里最有价值的一栏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">必复核三要素</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">谁复核</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">复核什么</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">留痕</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "问责与上报：最后一块拼图", "n": "最后补问责归属与事故上报路径。明确：AI 产出出错，第一责任人是使用人，不是模型；发现越线立即上报给合规接口人，不上报算二次违规。把上报路径写成一句话，比如「飞书@合规 + 截图留证」。规范写完，你才有底气把它贴进团队群。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">第一责任人是使用人</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">越线立即上报</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">上报路径一句话写清</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "部门 AI 使用规范草稿", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《部门 AI 使用规范草稿》并通过本单元评分要点"}, "practice": {"steps": ["列出 5 条禁止项（含数据外传与越权决策）", "写出 3 条必须人复核的场景与复核人", "补上问责归属与事故上报路径"], "exemplar": "禁止项：① 不贴用户订单/手机号 ② 不替业务做终裁定价 ③ 不买第三方数据包 复核：促销力度方案由运营负责人复核；对外口径由品牌复核"}, "task": "产出《部门 AI 使用规范草稿》：列出 5 条禁止项（含数据外传与越权决策）；写出 3 条必须人复核的场景与复核人；补上问责归属与事故上报路径", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M0 导论：零售电商 PM 的 AI 机会与红线」模块，你要交付的是《部门 AI 使用规范草稿》。\n【场景】业务侧这周的诉求是：规范不写出来，就等于没有规范；写出来，团队才有共同底线。参考做法：「模拟电商品牌 Y」电商产品组 AI 使用规范样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（规范模板（适用范围 / 禁止项 / 复核 / 问责）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《部门 AI 使用规范草稿》填写模板】\n\n■ 1. 列出 5 条禁止项（含数据外传与越权决策）\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写出 3 条必须人复核的场景与复核人\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 补上问责归属与事故上报路径\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   禁止项：① 不贴用户订单/手机号 ② 不替业务做终裁定价 ③ 不买第三方数据包 复核：促销力度方案由运营负责人复核；对外口径由品牌复核", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "业务 VP 质疑「AI 会不会让团队失控」", "video": {"dur": "8min", "script": ["向上汇报不是表决心，而是用治理机制证明「失控有兜底」", "价值-风险答辩清单（提效 / 管控 / 兜底）", "VP 典型质疑 vs 你的回应脚本"]}, "ppt": {"method": "价值-风险答辩清单（提效 / 管控 / 兜底）", "case": "VP 典型质疑 vs 你的回应脚本", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "vslides": [{"t": "陪练说明：VP 不会问技术", "n": "你的对手是业务 VP。他不懂提示词，只关心两件事：AI 能不能多卖货、出事谁负责。所以答辩别讲原理，讲结果和兜底。你准备的不是一份技术文档，而是一张「投入-产出-兜底」三栏表。让他看到风险有兜，他才会放行。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">VP 的关注点</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">GMV 换算</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">风险兜底</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">量化监控</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "他会问什么：三连击", "n": "剧透三连击。第一，AI 提效能换算成多少 GMV 或人天？第二，一旦出错谁兜得住、怎么兜？第三，给一个可量化的监控指标。提前把这三问的答案写成数字，比任何形容词都有力。比如「详情页复盘从 3 天压到 4 小时，等价每周省 1.5 人天」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">提效能换算成多少 GMV/人天</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">出错谁兜底、怎么兜</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">给一个可量化监控指标</tspan></text></svg>"}, {"t": "通过标准：用数字收尾", "n": "放行标准：提效有数字、兜底有 owner、监控有阈值。陪练里如果你的回答能落到这三个数字，VP 就放行；如果还在讲「AI 很强大」，他就会打断。记住，向上汇报的成败不在你多懂 AI，而在你多懂他的账本。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">提效有数字</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">兜底有 owner</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">监控有阈值</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "部门 AI 使用规范草稿", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《部门 AI 使用规范草稿》并通过本单元评分要点"}, "spar": {"role": "业务 VP", "persona": "结果导向、怀疑新事物，只关心 GMV 与风险是否可控", "mustAsk": ["AI 提效到底能换算成多少 GMV 或人天？", "一旦出错，谁兜得住、怎么兜？", "你能给我一个可量化的监控指标吗？"]}, "task": "把《部门 AI 使用规范草稿》拿到「业务 VP」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《部门 AI 使用规范草稿》。现在要让它通过「业务 VP」这一关。\n【对手的立场】结果导向、怀疑新事物，只关心 GMV 与风险是否可控。\n【他一定会追问】「AI 提效到底能换算成多少 GMV 或人天？」 / 「一旦出错，谁兜得住、怎么兜？」 / 「你能给我一个可量化的监控指标吗？」\n【场景】你说「业务 VP 质疑「AI 会不会让团队失控」」，对方立刻回一句：AI 提效到底能换算成多少 GMV 或人天？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M1", "title": "M1 用 AI 做市场与消费者洞察", "units": [{"id": "M1U1", "tier": "basic", "step": "understand", "title": "社媒 / 评价 / 趋势三类信号", "video": {"dur": "8min", "script": ["不是所有洞察都来自评价；分不清信号类型，结论就会张冠李戴", "三类信号来源图 + 各自适合回答的问题", "某食品品牌用 AI 把社媒声量变成选品信号"]}, "ppt": {"method": "三类信号来源图 + 各自适合回答的问题", "case": "某食品品牌用 AI 把社媒声量变成选品信号", "demo": "信号-问题对照卡：每类信号对应一个 PM 决策"}, "vslides": [{"t": "开场：洞察不是「看评论」", "n": "说到消费者洞察，很多人第一反应是去翻评论。但评论只是三类信号里的一种。真正能支撑选品和定价的，是社媒声量、电商评价、行业趋势三路信号合起来看。单看任何一路都会偏：评论讲体验、社媒讲态度、趋势讲方向。先分清它们各自回答什么问题，才不会把态度当事实。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类信号</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">社媒声量</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">电商评价</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">行业趋势</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "每类信号回答什么问题", "n": "社媒声量回答「大家现在在聊什么」，适合发现新场景和情绪拐点；电商评价回答「买过的人哪里不满」，适合找体验痛点和复购阻碍；行业趋势回答「大方向往哪走」，适合定明年选品赛道。把问题和信号一一对应，你的洞察才有针对性，不会拿到一堆词云却用不上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">信号-问题映射</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">社媒→聊什么</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">评价→哪里痛</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">趋势→往哪走</tspan></text></g></svg>"}, {"t": "踩坑：用错信号的典型后果", "n": "常见的错是用社媒热度代替销量判断，结果上了一款「大家都在骂」的网红品；或用评价代替趋势，错过品类升级窗口。信号类型错配，结论再漂亮也是错的。这一节结束时，你要能拿到一张「问题→信号」对照卡，贴在调研前。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">错配</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">后果</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">用社媒热度代替销量</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">上了被骂的网红品</tspan></text></g></svg>"}], "deliverable": {"type": "skill", "name": "信号来源清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "给一个业务问题，能判断该用哪类信号、为什么"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三类信号来源图 + 各自适合回答的问题\n【为什么重要】不是所有洞察都来自评价；分不清信号类型，结论就会张冠李戴\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M1U2", "tier": "basic", "step": "demo", "title": "用 AI 做电商评论情感与需求聚类", "video": {"dur": "8min", "script": ["评价是金矿，但人肉看 200 条只会记得最刺眼的两条", "脱敏评价 → AI 聚类 → 需求主题表", "「优选生活馆」近 30 天 200 条评价（已脱敏）"]}, "ppt": {"method": "脱敏评价 → AI 聚类 → 需求主题表", "case": "「优选生活馆」近 30 天 200 条评价（已脱敏）", "demo": "WorkBuddy 内跑一遍评价聚类提示词"}, "vslides": [{"t": "演示准备：一份脱敏评价集", "n": "演示数据是一份「优选生活馆」近 30 天 200 条评价，已经脱敏——没有昵称、没有订单号、只有文本和星级。脱敏是前提，不是选项。准备好后，我们不是让 AI 写感想，而是让它做结构化归纳：情感极性 + 主题聚类 + 频次。这一步把「看评论」升级成「读数据」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示数据预览</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">200 条评价（已脱敏）</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">星级 1-5</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">文本 + 主题候选</tspan></text></g></svg>"}, {"t": "跑聚类：三步拿到主题表", "n": "把评价贴进去，用这条提示词要求 AI 做情感判断并按主题聚类，输出「主题/频次/典型原话/优化方向」四列。几十秒后你拿到一张表：比如「尺码偏小」提及 38 次、「物流慢」27 次。频次本身就是优先级——你不用再靠记忆挑痛点，让数字替你排。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">聚类三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">情感判断</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">主题聚类</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">频次排序</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "结果怎么用：从表到动作", "n": "拿到主题表后，按频次排前三条就是本季度体验优化的候选。注意只选能落到产品动作的主题，比如改详情页尺码表、换物流合作方，而不是「大家希望更便宜」这种无法单点优化的。好的洞察表末尾一定带「可落地方向」一列，否则只是又一次词云。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">按频次排前三条</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只选可单点优化</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">末尾带落地方向</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "信号来源清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《信号来源清单》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」近 30 天 200 条已脱敏的电商评价（不含任何用户个人信息）：\n[粘贴评价文本]\n请做情感极性判断，并将负面评价按「主题」聚类，输出：主题 / 提及频次 / 典型原话（不打标签到个人）/ 可落地优化方向。"}, "task": "在 WorkBuddy 里把「脱敏评价 → AI 聚类 → 需求主题表」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】脱敏评价 → AI 聚类 → 需求主题表\n【参考案例】「优选生活馆」近 30 天 200 条评价（已脱敏）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」近 30 天 200 条已脱敏的电商评价（不含任何用户个人信息）：\n[粘贴评价文本]\n请做情感极性判断，并将负面评价按「主题」聚类，输出：主题 / 提及频次 / 典型原话（不打标签到个人）/ 可落地优化方向。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M1U3", "tier": "basic", "step": "todo", "title": "产出《品类消费者洞察报告》", "video": {"dur": "8min", "script": ["洞察不写成报告，就等于没做——别人看不见、没法决策", "报告模板（信号来源 / 主题 / 频次 / 动作）", "「优选生活馆」品类洞察报告样例（3 页）"]}, "ppt": {"method": "报告模板（信号来源 / 主题 / 频次 / 动作）", "case": "「优选生活馆」品类洞察报告样例（3 页）", "demo": "报告填写操作指引（先填信号来源再填结论）"}, "vslides": [{"t": "任务说明：报告是交付物不是笔记", "n": "这节动手写报告。先纠正一个认知：报告是给选品和运营看的交付物，不是你的学习笔记。所以它必须能直接当决策依据。结构固定为四块：信号来源、Top 主题与频次、典型原话、可落地动作。少一块，报告就不完整，别人就得来回问你。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 信号来源与体量</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② Top5 主题+频次</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 每条给动作</tspan></text></svg>"}, {"t": "先填信号来源：可信度从这儿来", "n": "第一块写信号来源与体量。明确写了「评价 200 条 + 社媒 50 条」的报告，比写「综合多方反馈」的可信度高十倍。来源写不清，后面的结论再漂亮也站不住。这一栏是报告的地基，地基歪了上面全歪。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">先填来源</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">来源</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">体量</tspan></text></g><g>
