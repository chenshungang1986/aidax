height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">依据?</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">补词机制?</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">误杀救济?</tspan></text></svg>"}, {"t": "通过标准：依据全覆盖", "n": "放行标准：禁词有依据、覆盖有补机制、误杀有救济。陪练里这三样都答上，规范过关。记住，法务是你的合规闸门，他签字的规范才敢对外。和他对齐，AI 内容才安全。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">禁词有依据</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">覆盖有补</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">误杀有救济</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "内容安全与风控规范", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《内容安全与风控规范》并通过本单元评分要点"}, "spar": {"role": "法务", "persona": "严谨、只认法律依据与全覆盖", "mustAsk": ["这条禁词的监管依据是什么？", "新出现的违规句式怎么补？", "误杀正常文案怎么救济？"]}, "task": "把《内容安全与风控规范》拿到「法务」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《内容安全与风控规范》。现在要让它通过「法务」这一关。\n【对手的立场】严谨、只认法律依据与全覆盖。\n【他一定会追问】「这条禁词的监管依据是什么？」 / 「新出现的违规句式怎么补？」 / 「误杀正常文案怎么救济？」\n【场景】你说「法务挑战你的内容规范」，对方立刻回一句：这条禁词的监管依据是什么？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M7", "title": "M7 综合实战：从 0 到 1 设计一款零售电商产品", "units": [{"id": "M7U1", "tier": "basic", "step": "understand", "title": "立项：机会与合规双校验", "video": {"dur": "8min", "script": ["只讲机会不讲合规的立项，上线即整改", "立项双校验图（机会成立 / 合规可行）", "某「临期食品特卖」产品立项评审"]}, "ppt": {"method": "立项双校验图（机会成立 / 合规可行）", "case": "某「临期食品特卖」产品立项评审", "demo": "双校验对照卡"}, "vslides": [{"t": "开场：立项要过两道关", "n": "一个产品想法要立项，得先过两道关：机会成立（有没有需求、能不能赚钱）、合规可行（数据/资质/宣传是否过关）。很多人只讲机会不讲合规，结果上线即整改、甚至下架。双校验是立项的第一道纪律。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">立项双校验</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"175.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"105.5\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.5\">机会成立</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"175.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"294.5\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"294.5\">合规可行</tspan></text></g><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "两关怎么过", "n": "机会关看需求规模、付费意愿、竞争格局；合规关看数据来源、所需资质、宣传边界。两关都过才立项，任一不过先打回。把两关写成一张校验表，立项评审就不再被「我觉得行」带偏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">两关内容</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">机会→需求/付费/竞争</tspan></text></g><g class=\"hl\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">合规→数据/资质/宣传</tspan></text></g></svg>"}, {"t": "踩坑：合规后置", "n": "真实踩坑：某特卖产品先上线后补资质，被监管约谈下架，前期投入全废。正确做法是合规前置到立项。合规后置的代价，往往是整个项目归零。双校验表写清，立项才稳。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩坑</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">后果</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">合规后置上线</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">约谈下架归零</tspan></text></g></svg>"}], "deliverable": {"type": "skill", "name": "立项双校验", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "给一个产品想法，能同时过机会校验与合规校验"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】立项双校验图（机会成立 / 合规可行）\n【为什么重要】只讲机会不讲合规的立项，上线即整改\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M7U2", "tier": "basic", "step": "demo", "title": "用 AI 跑通竞品与机会扫描", "video": {"dur": "8min", "script": ["立项前先用公开信息验证，别急着押资源", "公开信息 → AI 扫描 → 机会清单", "「优选生活馆」所在赛道机会扫描（仅公开）"]}, "ppt": {"method": "公开信息 → AI 扫描 → 机会清单", "case": "「优选生活馆」所在赛道机会扫描（仅公开）", "demo": "WorkBuddy 内跑一遍机会扫描提示词"}, "vslides": [{"t": "演示准备：仅公开信息", "n": "演示素材是「优选生活馆」赛道的公开信息：行业报告摘要、竞品公开页、社媒公开讨论。全部公开，不含任何内部或用户隐私数据。立项前的机会扫描，公开信息通常够用，边界清才能写进立项书。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" strok \" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "结果怎么用：人做聚焦", "n": "拿到机会清单后，人工聚焦一个最匹配团队能力的点，并核对合规注意项是否可解。AI 不懂你的资源与资质，聚焦和合规判断必须人做。聚焦后转成立项草稿。记住，AI 给机会、人定可行，边界就在这。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">AI 出机会</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">人做聚焦</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">核对合规</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "立项双校验", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《立项双校验》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」所在赛道的公开信息（行业报告摘要、竞品公开页、社媒公开讨论）：\n[粘贴公开信息]\n请归纳需求缺口、竞争格局与 3 个可切入的机会点，并标注每个机会点的合规注意项。"}, "task": "在 WorkBuddy 里把「公开信息 → AI 扫描 → 机会清单」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】公开信息 → AI 扫描 → 机会清单\n【参考案例】「优选生活馆」所在赛道机会扫描（仅公开）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」所在赛道的公开信息（行业报告摘要、竞品公开页、社媒公开讨论）：\n[粘贴公开信息]\n请归纳需求缺口、竞争格局与 3 个可切入的机会点，并标注每个机会点的合规注意项。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M7U3", "tier": "basic", "step": "todo", "title": "产出《产品立项书（含合规）》", "video": {"dur": "8min", "script": ["立项书不写合规，等于埋下上线即整改的雷", "立项书模板（机会 / 模式 / 合规 / 指标）", "「优选生活馆」立项书样例"]}, "ppt": {"method": "立项书模板（机会 / 模式 / 合规 / 指标）", "case": "「优选生活馆」立项书样例", "demo": "立项书填写操作指引（先机会再合规）"}, "vslides": [{"t": "任务说明：立项书是契约", "n": "这节动手写立项书。立项书是和产品、研发、合规之间的契约，所以四块：机会、模式、指标、合规。写完它，各部门对齐「做什么、为什么、红线在哪」。契约写清，执行才不跑偏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 机会</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 模式指标</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 合规页</tspan></text></svg>"}, {"t": "先机会：立项的地基", "n": "第一块写需求规模和付费意愿，用公开数据或小规模验证支撑，别只写「市场很大」。机会这栏是立项地基，地基虚了项目就飘。写清了，后面模式和合规才有锚。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">先写机会</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">需求规模</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">付费意愿</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">验证</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "合规页：立项书的灵魂", "n": "最后单列合规页：数据来源、所需资质、宣传边界。比如食品特卖要流通资质、禁「最低价」绝对化宣称、用户数据脱敏。没有合规页的立项书，上线即整改。合规页是灵魂，写清红线，项目才走得远。立项书交出去，评审才有据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">机会有验证</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">模式指标清</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">合规页单列</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "产品立项书（含合规）", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《产品立项书（含合规）》并通过本单元评分要点"}, "practice": {"steps": ["写明需求规模与付费意愿（机会）", "写明商业模式与核心指标", "单列合规页：数据/资质/宣传边界"], "exemplar": "机会：临期特卖信息不对称｜模式：B2C 特卖，GMV 抽佣 合规：食品流通资质、禁「最低价」宣称、数据脱敏"}, "task": "产出《产品立项书（含合规）》：写明需求规模与付费意愿（机会）；写明商业模式与核心指标；单列合规页：数据/资质/宣传边界", "brief": "【你的角色】你是「模拟电商品牌 Y」负责「优选生活馆」的零售电商产品经理。本单元属于「M7 综合实战：从 0 到 1 设计一款零售电商产品」模块，你要交付的是《产品立项书（含合规）》。\n【场景】业务侧这周的诉求是：立项书不写合规，等于埋下上线即整改的雷。参考做法：「优选生活馆」立项书样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（立项书模板（机会 / 模式 / 合规 / 指标）），以及上面场景中描述的业务信息。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《产品立项书（含合规）》填写模板】\n\n■ 1. 写明需求规模与付费意愿（机会）\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写明商业模式与核心指标\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 单列合规页：数据/资质/宣传边界\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   机会：临期特卖信息不对称｜模式：B2C 特卖，GMV 抽佣 合规：食品流通资质、禁「最低价」宣称、数据脱敏", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M7U4", "tier": "basic", "step": "spar", "title": "评审委员会挑战你的立项", "video": {"dur": "8min", "script": ["评审委员会管资源，他会逼你把机会说到可验证", "立项答辩清单（机会 / 模式 / 合规）", "典型反驳 vs 你的回应（需求伪命题 / 资质缺失）"]}, "ppt": {"method": "立项答辩清单（机会 / 模式 / 合规）", "case": "典型反驳 vs 你的回应（需求伪命题 / 资质缺失）", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "vslides": [{"t": "陪练说明：他挑的是可验证", "n": "对手是评审委员会。他管资源，所以你的立项必须机会可验证、资质可解、宣传有边界。讲不清这些，他会把立项打回重做。答辩前把需求验证方式写进立项书。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">评审的关注</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">机会可验</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">资质可解</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">宣传有界</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "他会问什么：三连击", "n": "剧透三连击。第一，需求是真命题还是伪命题，怎么验证（小规模测？）？第二，所需资质现在有没有、多久能拿？第三，宣传边界写清了吗、会不会踩广告法？把这三问变成立项书的「评审备注」，委员会自然放行。先讲验证，再讲资源。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">需求可验?</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">资质可解?</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">宣传有界?</tspan></text></svg>"}, {"t": "通过标准：机会可验证", "n": "放行标准：机会有验证方式、资质有获取路径、宣传有边界。陪练里这三样都答上，立项过关。记住，评审委员会是你的资源闸门，他签字的项目才拨得到人。和他对齐，立项才落地。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">机会可验</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">资质可解</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">宣传有界</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "产品立项书（含合规）", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《产品立项书（含合规）》并通过本单元评分要点"}, "spar": {"role": "评审委员会", "persona": "审慎、只认可验证机会与可解合规", "mustAsk": ["需求是真命题还是伪命题，怎么验证？", "所需资质现在有没有、多久能拿？", "宣传边界写清了吗，会不会踩广告法？"]}, "task": "把《产品立项书（含合规）》拿到「评审委员会」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《产品立项书（含合规）》。现在要让它通过「评审委员会」这一关。\n【对手的立场】审慎、只认可验证机会与可解合规。\n【他一定会追问】「需求是真命题还是伪命题，怎么验证？」 / 「所需资质现在有没有、多久能拿？」 / 「宣传边界写清了吗，会不会踩广告法？」\n【场景】你说「评审委员会挑战你的立项」，对方立刻回一句：需求是真命题还是伪命题，怎么验证？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M7U5", "tier": "adv", "step": "understand", "title": "PRD 到交付的全链路整合", "video": {"dur": "8min", "script": ["单点做得好不够，链路断一处全盘皆输", "全链路图（立项→PRD→研发→上线→复盘）", "「优选生活馆」从立项到上线的关键里程碑"]}, "ppt": {"method": "全链路图（立项→PRD→研发→上线→复盘）", "case": "「优选生活馆」从立项到上线的关键里程碑", "demo": "里程碑对照卡：每阶段的交付与闸门"}, "vslides": [{"t": "开场：链路比单点重要", "n": "一个模块学得好，不代表能交付完整产品。真实交付是链路：立项→PRD→研发→上线→复盘，每段都有交付物和闸门。链路断在任何一处，全盘皆输。所以这一节练的是把前面学的串成一条不断线的链路。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">全链路</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">立项</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">PRD</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">研发</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">上线</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">复盘</tspan></text></g></svg>"}, {"t": "每阶段的闸门", "n": "立项的闸门是双校验过；PRD 的闸门是研发答辩过；研发的闸门是验收用例过；上线的闸门是检查清单过；复盘的闸门是数据归因过。每阶段结束都有一道闸，闸门不过不进下一阶段。闸是链路的保险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五道闸</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">立项→双校验</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">PRD→答辩</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">研发→用例</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">上线→清单</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">复盘→归因</tspan></text></g></svg>"}, {"t": "踩坑：跳闸赶进度", "n": "常见错是跳闸赶进度：PRD 没答辩就研发、检查清单没写就上线。跳一次闸省三天，埋的雷可能炸三个月。正确做法是闸门不跳、进度靠并行而非省略。链路纪律守住，交付才稳。跳闸的诱惑，是 PM 最大的敌人。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">错配</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">后果</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">跳闸赶进度</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">雷炸三个月</tspan></text></g></svg>"}], "deliverable": {"type": "doc", "name": "全链路里程碑", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "给一个产品目标，能画出含闸门的全链路里程碑"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】全链路图（立项→PRD→研发→上线→复盘）\n【为什么重要】单点做得好不够，链路断一处全盘皆输\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M7U6", "tier": "adv", "step": "demo", "title": "用 AI 整合一份发布说明", "video": {"dur": "8min", "script": ["发布说明是把内部成果翻译成外部价值的最后一关", "模块产出 → AI 整合 → 发布说明", "「优选生活馆」上线发布说明草案"]}, "ppt": {"method": "模块产出 → AI 整合 → 发布说明", "case": "「优选生活馆」上线发布说明草案", "demo": "WorkBuddy 内跑一遍发布说明提示词"}, "vslides": [{"t": "演示准备：模块要点", "n": "演示素材是「优选生活馆」各模块的上线要点和指标目标，内部信息、不含隐私。准备好后，我们让 AI 把零散模块整合为面向用户的发布说明。整合类任务在内部用 AI 高效，PM 把关语气与合规。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示数据预览</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">模块要点</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">指标目标</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">内部信息</tspan></text></g></svg>"}, {"t": "跑整合：从要点到说明", "n": "把要点贴进去，要求 AI 整合为用户价值、核心功能、使用路径、注意事项，语气专业不浮夸，并标需合规复核的措辞。几十秒后你拿到发布说明草案。AI 出的是结构，人把关的是价值提炼和合规措辞。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">整合三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">模块要点</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">AI 整合</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">发布说明</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "结果怎么用：人把关价值与合规", "n": "拿到草案后，人工提炼用户价值（别只列功能）、复核合规措辞（去绝对化）。AI 不懂你的品牌调性和监管口径，这两步必须人做。定稿后发布说明才敢对外。记住，AI 给结构、人定价值，边界就在这。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">AI 出结构</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">人提价值</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">复核合规</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "全链路里程碑", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《全链路里程碑》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「优选生活馆」各模块的上线要点与指标目标（内部信息）：\n[粘贴模块要点]\n请整合成一份面向用户的发布说明：用户价值、核心功能、使用路径、注意事项，语气专业不浮夸，并标注需合规复核的措辞。"}, "task": "在 WorkBuddy 里把「模块产出 → AI 整合 → 发布说明」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】模块产出 → AI 整合 → 发布说明\n【参考案例】「优选生活馆」上线发布说明草案\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】用户数据不裸奔（订单/手机号/地址不出域）· 不替人决策（定价/选品留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「优选生活馆」各模块的上线要点与指标目标（内部信息）：\n[粘贴模块要点]\n请整合成一份面向用户的发布说明：用户价值、核心功能、使用路径、注意事项，语气专业不浮夸，并标注需合规复核的措辞。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M7U7", "tier": "adv", "step": "todo", "title": "产出《端到端产品方案（含合规）》", "video": {"dur": "8min", "script": ["终验交付物：把全课程串成一份能上会的方案", "方案模板（链路 / 闸门 / 合规 / 复盘）", "「优选生活馆」端到端方案样例"]}, "ppt": {"method": "方案模板（链路 / 闸门 / 合规 / 复盘）", "case": "「优选生活馆」端到端方案样例", "demo": "方案填写操作指引（先链路再合规）"}, "vslides": [{"t": "任务说明：这是终验交付", "n": "这节动手写终验交付物——端到端方案。它把全课程串成一份能上会的文档，所以四块：链路与闸门、各阶段交付物与责任人、合规页、复盘设计。写完它，你证明自己能把课上的能力整合交付。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 链路闸门</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 交付责任</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 合规复盘</tspan></text></svg>"}, {"t": "先链路：方案的骨架", "n": "第一块画全链路和每道闸门，链路是方案骨架。骨架画清，各阶段交付物才有挂靠点。比如立项过双校验、PRD 过答辩。链路这栏是骨架，骨架歪了方案就散。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">先画链路</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">链路</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">闸门</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">挂靠</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "合规与复盘：方案的压轴", "n": "最后合规页贯穿全链路（数据脱敏、宣传边界、资质前置），复盘设计写清归因指标。合规不是某一阶段的事，是整条链路的底色；复盘让下一轮更准。这两栏是方案压轴，写清才叫端到端。方案交出去，就是你的毕业作品。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">链路闸门清</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" const STORE='aidax_retail_pm_v1';
let prog = loadProg();
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE))||{units:{},quizzes:{}}; }catch(e){ return {units:{},quizzes:{}}; } }
function saveProg(){ try{ localStorage.setItem(STORE, JSON.stringify(prog)); }catch(e){} syncMapProgress(); }

// 主站 URL 参数：?m=MX 深链定位模块；?weak=a,b 测评弱维（用于个性化高亮）。与主站进度 key 解耦又互通。
const UP=new URLSearchParams(location.search);
const WEAK=(UP.get('weak')||'').split(',').map(s=>s.trim()).filter(Boolean);
const DEEP_MODULE=UP.get('m')||'';

// 把「模块 8 单元全部通关」回写主站学习地图进度（localStorage 同源共享），主站监听 storage 事件实时刷新。
function syncMapProgress(){
  try{
    const key='ai_training_progress';
    let cp={}; try{ cp=JSON.parse(localStorage.getItem(key))||{}; }catch(_){}
    COURSE.modules.forEach((m,mi)=>{
      const cid='retail_pm_m'+mi;
      const allDone=m.units.every(u=>prog.units[u.id]&&prog.units[u.id].done);
      if(allDone) cp[cid]=Object.assign({},cp[cid],{done:true,completedAt:Date.now()});
    });
    localStorage.setItem(key, JSON.stringify(cp));
  }catch(_){}
}

/* ===================== 管理员预览模式 =====================
   开启方式：URL 带 ?admin=1 或 ?preview=1，或点击页头「管理员预览」开关。
   作用：顶部显示横幅，练习/陪练/测验标注为可选，结算可跳过测试直接标记已观看。
   对学员（未开启）流程零影响。 */
const ADMIN_KEY='aidax_retail_pm_admin';
function isAdmin(){
  try{
    const p=new URLSearchParams(location.search);
    if(p.has('admin')||p.has('preview')){ try{localStorage.setItem(ADMIN_KEY,'1');}catch(e){} return true; }
    return localStorage.getItem(ADMIN_KEY)==='1';
  }catch(e){ return false; }
}
let ADMIN=isAdmin();
function toggleAdmin(){
  ADMIN=!ADMIN;
  try{ localStorage.setItem(ADMIN_KEY, ADMIN?'1':'0'); }catch(e){}
  applyAdminUI();
  if(prog.cur && findUnit(prog.cur)) openUnit(prog.cur);
}
function applyAdminUI(){
  const tg=document.getElementById('admin-toggle');
  if(tg) tg.textContent='管理员预览：'+(ADMIN?'开':'关');
  const bn=document.getElementById('admin-banner');
  if(bn) bn.style.display=ADMIN?'block':'none';
}
function refreshProg(){
  const u=Object.values(prog.units).filter(x=>x&&x.done).length;
  const q=Object.values(prog.quizzes).filter(Boolean).length;

let _cloudClient=null, _cloudModel=null, _cloudErr='';
function cloudClient(){
  if(_cloudClient) return _cloudClient;
  if(typeof WorkBuddyCloud==='undefined' || !WorkBuddyCloud.createWorkBuddyCloud){ _cloudErr='SDK未加载'; return null; }
  try{
    _cloudClient=WorkBuddyCloud.createWorkBuddyCloud({endpoint:CLOUD_CFG.endpoint, publishableKey:CLOUD_CFG.publishableKey});
  }catch(e){ _cloudErr=(e&&e.message)||String(e); return null; }
  return _cloudClient;
}
async function cloudModel(){
  if(_cloudModel) return _cloudModel;
  const c=cloudClient(); if(!c) return null;
  try{
    const list=await c.llm.models.list();
    const m=(list||[]).find(x=>x && x.disabled!==true);
    if(m && m.id){ _cloudModel=m.id; _cloudErr=''; return m.id; }
    _cloudErr='云端暂无可用模型';
  }catch(e){
    _cloudErr=(e&&e.error&&e.error&&e.error.code)?e.error.code:((e&&e.message)||String(e));
  }
  return null;
}
const CLOUD_FALLBACK_SYS='你是 AIDAX 企业 AI 实训课程的内嵌陪练教练。回答简洁具体、面向真实业务场景；需要真实数据的地方明确标出待填，绝不编造数字。';
async function cloudChat(messages, opts){
  const c=cloudClient(); if(!c) throw new Error(_cloudErr||'SDK未加载');
  const model=await cloudModel(); if(!model) throw new Error(_cloudErr||'云端无可用模型');
  const msgs=(messages||[]).slice();
  if(!msgs.length || msgs[0].role!=='system') msgs.unshift({role:'system',content:CLOUD_FALLBACK_SYS});
  let out='';
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),45000);
  try{
    const stream=await c.llm.chat.completions.create({
      model:model, messages:msgs, stream:true,
      temperature:(opts&&opts.temperature)||0.6,
      signal:ctl.signal
    });
    for await (const ch of stream){
      const d=ch&&ch.choices&&ch.choices[0]&&ch.choices[0].delta;
      if(d && d.content) out+=d.content;
    }
  } finally { clearTimeout(tm); }
  if(!out.trim()) throw new Error('云端返回空回复');
  return out.trim();
}

function llmEndpoint(){
  if(LLM.state==='direct' && LLM.key){
    return {url:'https://api.deepseek.com/chat/completions',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+LLM.key}};
  }
  return {url:LLM.base.replace(/\/$/,'')+'/chat', headers:{'Content-Type':'application/json'}};
}
async function llmChat(messages, opts){
  /* 优先通道 C（学员零配置）；仅在直连模式下跳过 */
  if(LLM.state!=='direct'){
    try{ return await cloudChat(messages, opts); }catch(e){ /* 继续降级 */ }
  }
  const ep=llmEndpoint();
  const body=Object.assign({model:'deepseek-chat',messages:messages,temperature:0.6,max_tokens:700},opts||{});
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), 25000);
  try{
    const r=await fetch(ep.url,{method:'POST',headers:ep.headers,body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('HTTP '+r.status+' '+t.slice(0,120)); }
    const j=await r.json();
    const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!c) throw new Error('空回复');
    return String(c).trim();
  } finally { clearTimeout(tm); }
}

}

/* ===================== 播放器（字幕与真人声对齐；高亮讲到才闪三下） ===================== */
function makePlayer(uid, slides, aud){
  const stage=document.getElementById('p-stage'), subEl=document.getElementById('p-sub'), dots=document.getElementById('p-dots'),
        seek=document.getElementById('p-seek'), timeEl=document.getElementById('p-time'), playBtn=document.getElementById('p-play');
  let cur=0, playing=false, mode=null, audio=null, ttsTimer=null, ttsPulse=null, ttsStart=0, pulsedIdx=-1, ttsGuard=null;
  const dur=slides.map(s=>Math.max(2, sub(s.n).length*0.205)); /* 0.205 s/字 = 豆包实测 4.9 字/秒 */
  const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;};
  const total=()=>dur.reduce((a,b)=>a+b,0);
  function linesOf(i){ const n=sub(slides[i].n); return n.split(/(?<=[。！？；\n])/).map(x=>x.trim()).filter(Boolean); }
  function setCaption(i,frac){
    const n=sub(slides[i].n), ls=linesOf(i), spoken=frac*Math.max(1,n.length);
    let acc=0,k=0;
    for(let x=0;x<ls.length;x++){ acc+=ls[x].length; if(spoken<acc){k=x;break;} k=x; }
    subEl.textContent=ls[k];
  }
  function updateSeek(){
    let start=0; for(let k=0;k<cur;k++) start+=dur[k];
    let local=0,d=dur[cur]||1;
    if(mode==='audio'&&audio){ local=audio.currentTime; d=audio.duration||d; }
    else if(mode==='tts'){ local=(performance.now()-ttsStart)/1000; }
    const g=start+Math.min(local,d), frac=total()?g/total():0;
    seek.querySelector('.fill').style.width=(frac*100)+'%';
    seek.querySelector('.knob').style.left=(frac*100)+'%';
    timeEl.textContent=fmt(g)+' / '+fmt(total());
  }
  function pulseNow(){
    const s=stage.querySelectorAll('.slide')[cur]; if(!s) return;
    const h=s.querySelector('.hl'); if(!h) return;
    h.classList.remove('pulse'); void h.offsetWidth; h.classList.add('pulse');
    setTimeout(()=>h.classList.remove('pulse'),2600);
  }
  function maybePulse(i,frac){ if(pulsedIdx!==i && frac>=0.34){ pulsedIdx=i; pulseNow(); } }
  function render(){
    stage.innerHTML=''; dots.innerHTML='';
    slides.forEach((s,i)=>{
      const d=document.createElement('div'); d.className='slide'+(i===cur?' on':'');
      d.innerHTML='<h4>'+sub(s.t)+'</h4>'+sub(s.s);
      stage.appendChild(d);
      const dot=document.createElement('i'); if(i===cur)dot.className='on'; dots.appendChild(dot);
    });
  }
  /* 完全无语音环境：按估算时长滚筒式推进，保证画面一定会走 */
  function clockSlide(i){
    mode='tts'; ttsStart=performance.now();
    setCaption(i,0); updateSeek();
    clearInterval(ttsTimer); ttsTimer=setInterval(updateSeek,200);
    clearInterval(ttsPulse); ttsPulse=setInterval(()=>{ maybePulse(i,(performance.now()-ttsStart)/1000/(dur[i]||1)); },150);
    clearTimeout(ttsGuard);
    ttsGuard=setTimeout(()=>{ if(playing&&mode==='tts'&&cur===i) advance(); }, Math.round((dur[i]+1)*1000));
  }
  function ttsSlide(i){
    var sup=true;
    try{ sup=!!(typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined'); }catch(e){ sup=false; }
    if(!sup){ clockSlide(i); return; }
    var u2;
    try{ u2=new SpeechSynthesisUtterance(sub(slides[i].n)); }catch(e){ clockSlide(i); return; }
    mode='tts'; ttsStart=performance.now();
    u2.lang='zh-CN'; u2.rate=1;
    u2.onboundary=e=>{ const n=sub(slides[i].n), before=n.slice(0,e.charIndex); let acc=0,k=0;
      for(let x=0;x<linesOf(i).length;x++){ acc+=linesOf(i)[x].length; if(before.length<acc){k=x;break;} k=x; }
      const f=before.length/Math.max(1,n.length); setCaption(i,f); maybePulse(i,f); updateSeek(); };
    u2.onend=()=>{ if(playing) advance(); };
    try{ speechSynthesis.cancel(); speechSynthesis.speak(u2); }catch(e){ clockSlide(i); return; }
    setCaption(i,0); updateSeek();
    clearInterval(ttsTimer); ttsTimer=setInterval(updateSeek,200);
    clearInterval(ttsPulse); ttsPulse=setInterval(()=>{ maybePulse(i,(performance.now()-ttsStart)/1000/(dur[i]||1)); },150);
    /* 语音静默失败兜底：到估算时长还没在播报，就自动翻页，避免永久卡住 */
    clearTimeout(ttsGuard);
    ttsGuard=setTimeout(()=>{
      if(!playing||mode!=='tts'||cur!==i) return;
      let sp=false; try{ sp=!!(speechSynthesis.speaking||speechSynthesis.pending); }catch(e){}
      if(!sp) advance();
    }, Math.round((dur[i]+1.5)*1000));
  }
  function playSlide(i){
    cur=i; render(); pulsedIdx=-1; clearInterval(ttsPulse); clearTimeout(ttsGuard);
    if(aud&&aud[i]){
      mode='audio'; audio=new Audio(aud[i]);
      audio.onloadedmetadata=()=>{ if(audio.duration) dur[i]=audio.duration; updateSeek(); };
      audio.onended=()=>{ if(playing) advance(); };
      audio.ontimeupdate=()=>{ if(mode==='audio'){ const f=(audio.currentTime)/(audio.duration||dur[i]); setCaption(i,f); maybePulse(i,f); updateSeek(); } };
      /* 音频真的加载不出来时降级本机语音，绝不静默跳过（静默跳过会表现为「点了没反应」） */
      audio.onerror=()=>{ if(playing&&mode==='audio'){ try{audio.pause();}catch(e){} ttsSlide(i); } };
      const pr=audio.play();
      if(pr&&pr.catch) pr.catch(()=>{ if(playing&&mode==='audio'&&!(audio.duration>0)) ttsSlide(i); });
      setCaption(i,0); updateSeek();
    }else{ ttsSlide(i); }
  }
  function advance(){ const ni=cur+1; if(ni>=slides.length){ stop(); subEl.textContent='本节讲解结束，可继续下方环节活动'; return; } playSlide(ni); }
  function stop(){ playing=false; if(audio){try{audio.pause();}catch(e){}} try{speechSynthesis.cancel();}catch(e){} clearInterval(ttsTimer); clearInterval(ttsPulse); clearTimeout(ttsGuard); if(playBtn) playBtn.textContent='\u25B6 播放'; }
  function play(){ if(playing){ stop(); return; } playing=true; if(playBtn) playBtn.textContent='\u23F8 暂停'; playSlide(cur<0?0:cur); }
  playBtn.onclick=play;
  seek.addEventListener('pointerdown',ev=>{
    const r=seek.getBoundingClientRect(); let frac=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
    let g=frac*total(),acc=0,idx=0;
    for(let k=0;k<slides.length;k++){ if(acc+dur[k]>g){idx=k;break;} acc+=dur[k]; idx=k; }
    stop(); playSlide(idx);
    if(mode==='audio'&&audio) audio.currentTime=Math.min(g-acc,(audio.duration||dur[idx])-0.05);
    updateSeek();
  });
  render();   /* 进入单元先渲染第一页，避免一片黑让人误以为播放器坏了 */
  updateSeek();
  return {stop:stop, play:play};
}

/* ---------- 问题 3：分数由行为算出来，点按钮不能凭空拿分 ---------- */
function actsOf(uid){ return (prog.units[uid]&&prog.units[uid].acts)||{}; }
function setAct(uid,k,v){
  const st=prog.units[uid]||{}; const a=Object.assign({},st.acts||{});
  a[k]=v; prog.units[uid]=Object.assign({},st,{acts:a}); saveProg();
}
const BOUNDARY_RE=/不确定|待确认|留给|由.{1,6}(判断|决定|确认)|需要.{0,4}确认|不能替|边界|存疑|风险|我会补|降级/;
const EVID_RE=/[0-9０-９]|数据|口径|来源|条款|原文|看板|访谈|样本|比例|百分比|%|频次|制度|办法|规则/;
const PLAN_RE=/责任人|负责人|时间|节点|下周|本周|月底|排期|截止|owner|上线|交付|deadline/i;

function computeUnit(uid){
  const f=findUnit(uid); if(!f) return {ok:false,score:0,detail:[],need:'单元不存在'};
  const u=f.u, a=actsOf(uid), R=[]; let s=0, need='';
  if(u.step==='understand'){
    const b=bankOf(uid);
    if(b){
      const bc=bankCorrect(uid);
      const pass=Math.ceil(b.length*0.8);
      const qzScore=Math.round(60*bc.n/b.length);
      s+=qzScore;
      R.push({k:'练习答对 '+bc.n+'/'+bc.total+'（需 ≥'+pass+'）',ok:bc.n>=pass,hint:'答错的题看解析后重选，选对为止'});
      if(bc.n<pass) need='练习题至少要答对 '+pass+' 题（当前 '+bc.n+' 题）';
    } else {
      const q=!!a.quiz;
      s+=q?60:0;
      R.push({k:'自检题答对',ok:q,hint:'答案落在「AI 补结构与措辞、判断与取舍留给人」这条线上'});
      if(!q) need='先答对上面的自检题';
    }
    const nr=scoreNoteText(a.note||'');
    s+=nr.score;
    nr.detail.forEach(function(d){ R.push(d); });
    if(!need && nr.score<20) need='收获要写具体：说清能用在你的哪个项目/指标上，并写出下一步要验证什么';
  } else if(u.step==='demo'){
    const ran=!!a.ran, rec=(a.rec||'').trim(), chk=!!a.checked;
    /* 演示记录按质量判，不看字数：可用/不可用 + 人工修正 + 可复用句式，三要素 */
    const usable=/(可用|能用|直接用|采纳|保留|没问题|符合预期|准确)/.test(rec);
    const unusable=/(不可用|不能采信|不对|有误|编造|幻觉|偏差|失真|要改|需人工|不采纳|错误)/.test(rec);
    const fixed=/(我改了|修正|调整|补充|人工核对|复核|替换|删掉|重写|改成)/.test(rec);
    const reuse=/(以后|下次|复用|固定句式|模板化|沉淀|通用|以后都)/.test(rec);
    const recScore=(usable?12:0)+(unusable?14:0)+(fixed?12:0)+(reuse?12:0);
    R.push({k:'跑通一遍（复制提示词或用模型跑）',ok:ran,hint:'点「复制提示词」或「用模型跑一遍」都算'});
    R.push({k:'指出哪部分可用',ok:usable,hint:'写明 AI 输出里哪些可以直接用'});
    R.push({k:'指出哪部分不可用',ok:unusable,hint:'写明 AI 输出里哪些不能采信（幻觉/偏差/口径错）'});
    R.push({k:'写了你的人工修正',ok:fixed,hint:'写明你改了什么、为什么改'});
    R.push({k:'沉淀出可复用句式/模板',ok:reuse,hint:'写一句下次还能直接用的提示词或句式'});
    R.push({k:'确认已人工核对结果',ok:chk,hint:'勾选下方复选框'});
    s=(ran?30:0)+Math.min(50,recScore)+(chk?20:0);
    if(!ran) need='先跑一遍（复制提示词或用模型跑）';
    else if(recScore<38) need='演示记录要写清：哪部分可用、哪部分不可用、你做了什么人工修正、沉淀出什么可复用句式（当前 '+recScore+'/50）';
    else if(!chk) need='勾选「我已人工核对过模型结果」';
  } else if(u.step==='todo'){
    const t=(a.work||'').trim();
    if(!t){ R.push({k:'提交产出内容',ok:false,hint:'按模板逐节填写后提交'}); need='先按模板写出你的产出并提交'; }
    else { const r=scoreWorkText(u,t); r.need=r.need||''; return r; }
  } else if(u.step==='spar'){
    const rounds=a.rounds||0, best=a.best||0, bd=!!a.boundary;
    R.push({k:'完成 ≥3 轮真实对话',ok:rounds>=3,hint:'陪练至少追问满 3 轮'});
    R.push({k:'≥2 轮给出了可追溯依据',ok:best>=2,hint:'回答里要出现数字/条款/口径/来源'});
    R.push({k:'划出责任边界',ok:bd,hint:'说清哪部分你不下结论、交给谁'});
    s=(rounds>=3?40:Math.min(39,rounds*13))+Math.min(35,best*18)+(bd?25:0);
    if(rounds<3) need='陪练还要继续（已完成 '+rounds+' 轮，至少 3 轮）';
    else if(best<2) need='至少 2 轮答案里要有具体依据（数字/条款/口径）';
    else if(!bd) need='说清哪部分结论你不下、留给谁判断';
  }
  s=Math.max(0,Math.min(100,Math.round(s)));
  return {ok:!need && s>=60, score:s, detail:R, need:need};
}

/* ===================== 真实评分引擎（v3）：按「评分标准」逐项判，不看字数 =====================
   五个维度各占分：结构完整性 20 / 评分要点覆盖 24 / 有据可依 20 / 红线意识 18 / 可执行 18
   另有三条反灌水惩罚：照抄模板、重复注水、过短。每项都给出「差在哪、怎么改」。 */
const STOPWords=/^(我们|你们|他们|可以|应该|需要|必须|这个|那个|这些|那些|进行|通过|使用|如何|什么|以及|然后|如果|因为|所以|但是|一个|没有|就是|自己|对于|关于|并且|或者|可能|已经|还有|不会|只是|这样|那样|一下|一些|很多|非常|比较|目前|现在|未来|首先|其次|最后|综上|例如|比如|其中|内容|情况|方式|方法|结果|过程|目标|能力|系统|平台|团队|公司|部门|流程|场景|环节|部分|方面|相关|主要|重要|有效|直接|实际|基本|整体|具体|明确|完成|提供|实现|提升|优化|支持|管理|分析|设计|开发|评估|判断|说明|描述|列出|包含|基于|根据|结合|利用|帮助|确保|保证|满足|达到|避免|减少|增加|提高|降低|控制|监控|跟踪|反馈|沟通|协作|推进|落地|执行|实施|交付|上线|运营|维护|更新|调整|改进|完善|建立|构建|搭建|制定|编写|整理|汇总|输出|生成|展示|查看|选择|确认|审核|审批|验证|测试|检查|排查|处理|解决|应对|防范|预防|规避|工作|问题|方案|数据|用户|客户|产品|业务)$/;
function cjkTerms(s){
  const out=[]; const runs=(s||'').match(/[\u4e00-\u9fa5]{2,8}/g)||[];
  runs.forEach(function(w){
    for(let L=2;L<=4;L++){ for(let i=0;i+L<=w.length;i++){ const t=w.substr(i,L); if(!STOPWords.test(t)) out.push(t); } }
  });
  return Array.from(new Set(out));
}
/* 从本单元的 rubric / deliverable.rubric 取「评分标准」条目 */
function rubricItemsOf(u){
  let items=(u.rubric&&u.rubric.length)?u.rubric.slice():[];
  const d=u.deliverable;
  if(d&&d.rubric&&d.rubric.length) items=items.concat(d.rubric);
  if(!items.length) items=['结构完整','有据可依','红线意识','可执行'];
  return Array.from(new Set(items)).slice(0,6);
}
/* 量化数字：必须带单位/量纲，纯数字不算 */
function qualifiedNumbers(t){
  const re=/([0-9０-９]+(?:\.[0-9]+)?)\s*(%|％|个百分点|万|亿|千|元|笔|条|个|次|人|天|周|月|年|日|号|分钟|小时|版|条|款|份|轮|倍|Q[1-4]|季度)/g;
  const m=(t||'').match(re)||[]; return Array.from(new Set(m)).length;
}
function hasSource(t){ return /(来源|口径|取自|来自|依据|条款|原文|看板|报表|访谈|样本|问卷|系统导出|统计区间|数据范围)/.test(t||''); }
function hasRisk(t){ return /(风险|红线|合规|监管|泄露|出域|越权|隐私|敏感|误导|幻觉|偏差|失真|不可信|未授权|投诉|处罚)/.test(t||''); }
function hasMitigation(t){ return /(规避|脱敏|审批|授权|复核|留痕|兜底|备份|限定|不输出|人工确认|降级|回退|加密|去标识|最小化|权限收|双人)/.test(t||''); }
function hasOwner(t){ return /(责任人|负责人|owner|Owner|由[^，。；\n]{1,10}(负责|跟进|确认|拍板|决策)|牵头|归属|对接人)/.test(t||''); }
function hasTime(t){ return /([0-9]+\s*(天|周|月|日|个工作日|季度)|下周|本周|月底|季末|Q[1-4]|截止|deadline|排期|里程碑|上线时间|交付时间|T\+[0-9])/.test(t||''); }
function hasAcceptance(t){ return /(验收|验收标准|验收口径|判定标准|达标|通过标准|衡量指标|成功标准|OKR|KPI|指标口径)/.test(t||''); }
/* 反灌水：与模板重合度、句子重复率 */
function dupRatio(t){
  const lines=(t||'').split(/\n/).map(x=>x.trim()).filter(x=>x.length>=8);
  if(lines.length<2) return 0;
  const uniq=new Set(lines); return 1-uniq.size/lines.length;
}
function templateOverlap(t,tpl){
  if(!tpl) return 0;
  const A=new Set(cjkTerms(tpl)); if(!A.size) return 0;
  let hit=0; A.forEach(function(w){ if((t||'').indexOf(w)>=0) hit++; });
  return hit/A.size;
}
function sectionCount(t){
  return (t||'').split(/\n/).map(x=>x.trim())
    .filter(x=>x.length>=10 && /^([■□•\-*·]|[一二三四五六七八九十]+[、.）)]|[0-9]+[、.）)]|#{1,4}\s|\*\*)/.test(x)).length;
}
function scoreWorkText(u,t){
  t=(t||'').trim();
  const R=[]; let total=0;
  const tpl=sub(u.template||'');

  /* ① 结构完整性 20 */
  const secs=sectionCount(t);
  const tplSecs=Math.max(3, sectionCount(tpl));
  const secScore = secs>=tplSecs?20 : (secs>=Math.max(2,tplSecs-1)?14 : (secs>=2?9 : (secs>=1?4:0)));
  total+=secScore;
  R.push({k:'结构完整性',got:secScore,full:20,ok:secScore>=14,
    hint: secs>=tplSecs ? ('模板 '+tplSecs+' 个小节都已填写') : ('模板有 '+tplSecs+' 个小节，当前只识别出 '+secs+' 节，缺的部分要补')});

  /* ② 评分要点覆盖 24（逐条比对本单元 rubric） */
  const items=rubricItemsOf(u);
  let hitItems=0; const missNames=[];
  items.forEach(function(it){
    const terms=cjkTerms(it);
    const need=Math.min(3, Math.max(1, Math.ceil(terms.length*0.18)));
    let c=0; for(let i=0;i<terms.length && c<need;i++){ if(t.indexOf(terms[i])>=0) c++; }
    if(c>=need) hitItems++; else missNames.push(it.slice(0,14));
  });
  const covScore=Math.round(24*hitItems/items.length);
  total+=covScore;
  R.push({k:'评分要点覆盖（'+hitItems+'/'+items.length+'）',got:covScore,full:24,ok:hitItems>=Math.ceil(items.length*0.6),
    hint: hitItems>=items.length?('全部评分要点都有体现') : ('未体现：'+missNames.join('；'))});

  /* ③ 有据可依 20 */
  const qn=qualifiedNumbers(t), src=hasSource(t);
  const evScore = (qn>=2?20 : (qn===1?12 : (src?13:0)));
  total+=evScore;
  R.push({k:'有据可依',got:evScore,full:20,ok:evScore>=12,
    hint: qn>=2?('已给出 '+qn+' 处带单位的数据') : ('需要 ≥2 处「数字+单位」（如 通过率 62%、3 个工作日、样本 12000 笔），当前 '+qn+' 处')});

  /* ④ 红线意识 18：必须同时有风险 + 规避动作 */
  const rk=hasRisk(t), mt=hasMitigation(t);
  const riskScore = (rk&&mt)?18 : (rk||mt)?9 : 0;
  total+=riskScore;
  R.push({k:'红线意识',got:riskScore,full:18,ok:riskScore===18,
    hint: (rk&&mt)?('已指出风险并给出规避动作') : rk?('指出了风险，但没写规避动作（脱敏/审批/人工复核等）') : mt?('写了规避动作，但没说清风险点在哪') : ('需写明「风险点 + 规避动作」')});

  /* ⑤ 可执行 18 */
  const ow=hasOwner(t), tm=hasTime(t), ac=hasAcceptance(t);
  const actScore = (ow&&tm&&ac)?18 : ((ow&&tm)||(ow&&ac)||(tm&&ac))?12 : (ow||tm||ac)?6 : 0;
  total+=actScore;
  R.push({k:'可执行',got:actScore,full:18,ok:actScore>=12,
    hint: (ow&&tm&&ac)?('责任人/时间/验收标准齐全') : ('缺：'+[!ow?'责任人':null,!tm?'时间节点':null,!ac?'验收标准':null].filter(Boolean).join('、'))});

  /* ---- 反灌水惩罚 ---- */
  const pen=[];
  const ov=templateOverlap(t,tpl);
  if(ov>0.62 && t.length<900){ total-=25; pen.push('疑似直接照抄模板（重合度 '+Math.round(ov*100)+'%），请替换成你自己的内容'); }
  const dr=dupRatio(t);
  if(dr>0.3){ total-=15; pen.push('存在重复/注水段落（重复率 '+Math.round(dr*100)+'%）'); }
  if(t.length<120){ total=Math.min(total,35); pen.push('内容过短（'+t.length+' 字），未达到一份交付物的基本篇幅'); }
  total=Math.max(0,Math.min(100,Math.round(total)));

  const detail=R.map(function(x){ return {k:x.k+'　'+x.got+'/'+x.full+' 分', ok:x.ok, hint:x.hint}; });
  pen.forEach(function(p){ detail.push({k:'扣分项：'+p, ok:false, hint:''}); });

  const weak=R.filter(function(x){return !x.ok;}).sort(function(a,b){return (a.full-a.got)-(b.full-b.got);}).slice(0,3);
  let need='';
  if(total<60){
    need='得分 '+total+' 分，未达 60 分通关线。优先补强：'+weak.map(function(x){return x.k;}).join('、')
        +'。\n例如：'+weak[0].hint;
  }
  return {ok:total>=60, score:total, detail:detail, need:need, dims:R};
}

function previewScore(uid,elId){
  const el=document.getElementById(elId); if(!el) return;
  const r=computeUnit(uid);
  const det=r.detail.map(d=>'<li class="'+(d.ok?'ok':'')+'">'+esc(d.k)+(d.ok?'':' <span class="hint">（'+esc(d.hint||'')+'）</span>')+'</li>').join('');
  el.innerHTML='<div class="kv" style="margin-top:10px"><b>预估得分：'+r.score+' 分</b>'
   +'<div class="bar"><i style="width:'+r.score+'%"></i></div>'
   +'<ul class="rub">'+det+'</ul>'
   +(r.need?'<div style="font-size:12.6px;color:#be123c">还差：'+esc(r.need)+'</div>':'<div style="font-size:12.6px;color:#166534">已达通关线（60 分），可以结算。</div>')
   +'</div>';
}

function submitTask(uid){
  if(ADMIN){
    const st=prog.units[uid]||{};
    prog.units[uid]=Object.assign({},st,{taskDone:true,done:true,score:st.score||60,detail:[{k:'管理员预览模式：已标记完成',ok:true}],acts:st.acts||{}});
    saveProg(); refreshProg(); renderSidebar();
    advCheck(); return true;
  }
  const r=computeUnit(uid);
  if(!r.ok){
    alert('还不能结算：\n\n'+(r.need||'请先完成上方环节活动')+'\n\n当前预估 '+r.score+' 分，通关线 60 分。');
    return false;
  }
  const st=prog.units[uid]||{};
  const prev=st.score||0;
  prog.units[uid]=Object.assign({},st,{taskDone:true,done:true,score:Math.max(prev,r.score),detail:r.detail,acts:st.acts||{}});
  saveProg(); refreshProg(); renderSidebar();
  advCheck(); return true;
}

/* 收获笔记评分：不看字数，看是否具体、是否有下一步、是否分点 */
function scoreNoteText(t){
  t=(t||'').trim();
  const R=[]; let s=0;
  const concrete=/(我的|本部门|我们团队|手上|我负责|这个项目|这款产品|我们的客户|指标|流程|场景|客户群)/.test(t);
  const next=/(待查|不确定|还需要|下一步|打算|准备|去验证|去确认|再补|要问)/.test(t);
  const secs=(t.split(/\n/).filter(x=>x.trim().length>=6).length);
  const conclusion=/(结论|记住|学到|明白了|关键|要点|也就是说)/.test(t);
  s += concrete?15:0; s += next?15:0; s += secs>=2?10:(secs===1?5:0);
  R.push({k:'落到具体工作（提到你的场景/项目/指标）',ok:concrete,hint:'写清这件事能用在你的哪个具体项目或指标上'});
  R.push({k:'写出下一步或待确认项',ok:next,hint:'补一句「我还不确定/下一步要验证的是…」'});
  R.push({k:'分点写（≥2 行）',ok:secs>=2,hint:'按 1) 2) 3) 分点写'});
  if(t.length<40){ s=Math.min(s,10); R.push({k:'内容过短（'+t.length+' 字）',ok:false,hint:'至少写清一句结论 + 一句用法'}); }
  return {score:Math.min(40,s),detail:R};
}

async function sparChatSend(){
  if(SPAR_CHAT.busy) return;
  const ta=document.getElementById('spar-chat-input'); if(!ta) return;
  const t=ta.value.trim(); if(!t){ return; }
  const uid=SPAR_CHAT.uid||prog.cur;
  const f=findUnit(uid); if(!f) return;
  const u=f.u;
  ta.value='';
  sparChatBubble('me',t);
  SPAR_CHAT.msgs.push({role:'user',content:t});

  /* 计入本单元进度：轮次 / 有据回答 / 责任边界 */
  let tr=(parseInt(actsOf(uid).cRounds||0,10)||0)+1;
  let bs=parseInt(actsOf(uid).best||0,10)||0;
  let bd=actsOf(uid).boundary?true:false;
  const evid=EVID_RE.test(t) && (/[0-9\uFF10-\uFF19]/.test(t) || /条款|原文|口径|来源|访谈|看板/.test(t));
  if(evid) bs++;
  if(BOUNDARY_RE.test(t)) bd=true;
  setAct(uid,'cRounds',tr); setAct(uid,'best',bs); setAct(uid,'boundary',bd?1:0);

  const btn=document.getElementById('spar-chat-send');
  SPAR_CHAT.busy=true; if(btn){ btn.disabled=true; btn.textContent='…'; }
  const body=document.getElementById('spar-chat-body');
  const typing=document.createElement('div'); typing.className='spar-typing'; typing.textContent='陪练正在思考…';
  if(body){ body.appendChild(typing); body.scrollTop=body.scrollHeight; }

  let reply=null, src='';
  if((typeof llmReady==='function')&&llmReady()){
    try{
      reply=await llmChat(SPAR_CHAT.msgs.slice(-13),{temperature:0.75,max_tokens:260});
      src='model';
    }catch(e){ reply=null; }
  }
  if(!reply){
    try{ reply=localSparReply(u,t,tr-1); }catch(e){ reply='（本地追问引擎不可用）你可以把问题复制到 WorkBuddy 里继续问。'; }
    src='local';
  }
  try{ typing.remove(); }catch(e){}
  sparChatBubble('ai',(src==='local'?'【本地追问引擎】':'')+reply);
  SPAR_CHAT.msgs.push({role:'assistant',content:reply});
  SPAR_CHAT.busy=false; if(btn){ btn.disabled=false; btn.textContent='发送'; }
  try{ ta.focus(); }catch(e){}
}

function sparSystem(u){
  const m=u.spar||{};
  return '你是一场企业内训里的角色扮演评审，此刻扮演「'+sub(m.role||'评审')+'」。'
   +'你的立场：'+sub(m.persona||'只认依据与制度')+'。'
   +'学员刚完成《'+sub(u.deliverable||'本单元产出')+'》，你是来挑它的漏洞的。'
   +'\n硬性要求：'
   +'\n1) 每次只说一段话、只问一个问题，全文不超过 70 字，口语化，像现场评审，禁止使用列表、编号和标题。'
   +'\n2) 必须引用学员上一句话里的具体词汇或原话片段来追问，让他知道你真的听了。'
   +'\n3) 若学员给出了可追溯依据（具体数字、文件条款、口径、访谈编号），先用一句话认可那一处，再往更狠的一层追问：这个前提不成立怎么办、边界在哪、口径对得上吗。'
   +'\n4) 若学员只是表态、复述问题或说空话，直接点破，并要求他给出数据或条款。'
   +'\n5) 你一定会问到这些方向：'+(m.mustAsk||[]).map(x=>sub(x)).join('；')+'。'
   +'\n6) 不要编造不存在的制度条款，需要引用时用「贵行的数据分级办法」这类通称。'
   +'\n只输出你要说的那一句话，不要有任何前缀说明。';
}
function anchorOf(t){
  const s=t.replace(/\s+/g,'');
  const re=/《[^》]{1,10}》|第[0-9０-９]+条|[0-9１-９]+(?:\.[0-9]+)?%|[0-9０-９]+(个|条|项|份|处|类)|不下结论|边界|口径|看板|访谈|PII|脱敏|原文第/g;
  const m=s.match(re);
  if(m && m[0]){
    const i=s.indexOf(m[0]);
    return s.slice(Math.max(0,i), i+m[0].length+8).slice(0,18);
  }
  return s.slice(0,14);
}
function localSparReply(u,t,rounds){
  const role=sub(u.spar.role);
  const anchor=anchorOf(t);
  const hasNum=/[0-9０-９]/.test(t), hasEvid=EVID_RE.test(t), bd=BOUNDARY_RE.test(t);
  const arr=u.spar.mustAsk||[];
  const q=arr[rounds % Math.max(1,arr.length)] || '你的依据是什么？';
  if(!hasEvid){
    return '（'+role+'）你说「'+anchor+'\u2026」\u2014\u2014 我听到的是立场，不是依据。这条结论落在哪份文件、哪张看板、哪组数据上？说得出出处，我们才谈得下去。';
  }
  if(!hasNum){
    return '（'+role+'）「'+anchor+'\u2026」方向对了，但你给的是说法不是数。具体到多少、覆盖哪些产品、口径怎么定义的？';
  }
  if(!bd){
    return '（'+role+'）「'+anchor+'\u2026」这一处我暂时认。那我问下一层：如果这条依据本身不成立，你的结论要不要降级？哪部分你不敢下结论、要交给谁？';
  }
  return '（'+role+'）「'+anchor+'\u2026」有数、有出处、也划了边界，这条我认。最后再确认一件事：'+sub(q);
}
async function sendSpar(){
  if(sparBusy) return;
  const ta=document.getElementById('spar-text'); if(!ta) return;
  const t=ta.value.trim();
  if(!t){ alert('先写点内容再发送'); return; }
  const f=findUnit(prog.cur); if(!f||!f.u.spar) return;
  const u=f.u;
  addBubble('me',t); ta.value='';
  sparHist.push({role:'user',content:t});
  flow.tries++;
  const evid=EVID_RE.test(t) && (/[0-9０-９]/.test(t) || /条款|原文|口径|来源|访谈|看板/.test(t));
  if(evid) flow.best++;
  if(BOUNDARY_RE.test(t)) flow.boundary=true;
  setAct(prog.cur,'rounds',flow.tries);
  setAct(prog.cur,'best',flow.best);
  setAct(prog.cur,'boundary',flow.boundary?1:0);

  sparBusy=true; ta.disabled=true;
  const btnText='\u2026'; let reply=null, src='';
  if(llmReady()){
    try{
      const msgs=[{role:'system',content:sparSystem(u)}].concat(sparHist.slice(-12));
      reply=await llmChat(msgs,{temperature:0.75,max_tokens:220});
      src='model';
    }catch(e){ reply=null; }
  }
  if(!reply){ reply=localSparReply(u,t,flow.tries-1); src='local'; }
  sparBusy=false; ta.disabled=false; try{ ta.focus(); }catch(e){}
  addBubble('ai',reply);
  sparHist.push({role:'assistant',content:reply});

  const st=document.createElement('div'); st.className='kv';
  st.style.cssText='color:var(--mut);font-size:12.4px';
  st.textContent='第 '+flow.tries+' 轮 · 有据回答 '+flow.best+' 次 · '+(flow.boundary?'已划边界':'尚未提到边界')+' · '+(src==='model'?'由云端模型实时生成':'本地追问引擎（未接入模型）');
  const host=document.getElementById('spar-out');
  if(host){ host.innerHTML=''; host.appendChild(st); }

  const r=computeUnit(prog.cur);
  if(r.ok){
    setAct(prog.cur,'passed',1);
    addBubble('sys','\u2705 陪练通过：'+flow.tries+' 轮、'+flow.best+' 次给出依据'+(flow.boundary?'、已划清责任边界':'')+'。');
    finishUnit(prog.cur);
  } else if(flow.tries>=3){
    addBubble('sys','距离通关还差：'+r.need);
  }
}

function pickQ(i){
  const cur=QUIZ[qzState.mid][qzState.idx], n=qzState.idx;
  qzState.picked[n]=i; cur.picked=i;
  document.querySelectorAll('#quiz-box .op').forEach(el=>el.classList.remove('right','wrong'));
  document.getElementById('op'+i).classList.add(i===cur.a?'right':'wrong');
  const tip=document.getElementById('qz-tip'); tip.style.display='block';
  tip.innerHTML=(i===cur.a?'\u2705 正确。':'\u274C 正确答案：'+esc(sub(cur.opts[cur.a]))+'\u3000')+esc(sub(cur.tip));
}
function nextQ(){
  const qs=QUIZ[qzState.mid];
  if(qzState.picked[qzState.idx]===null){ alert('请先选择一个答案'); return; }
  if(qzState.idx<qs.length-1){ qzState.idx++; renderQuiz(); return; }
  const right=qzState.picked.filter((p,i)=>p===qs[i].a).length;
  const pct=Math.round(right/qs.length*100);
  prog.quizzes[qzState.mid]=pct>=60;
  saveProg(); refreshProg(); renderSidebar();
  const mods=COURSE.modules, mi=mods.findIndex(m=>m.id===qzState.mid);

  const box=document.getElementById('quiz-box');
  box.innerHTML='<div class="mclose" onclick="closeQuiz()">\u2715</div>'
    +'<h3>'+(pct>=60?'\uD83C\uDF89 模块通关':'\uD83D\uDCCC 再补一补')+'</h3>'
    +'<p>得分 <b style="color:var(--blue-d);font-size:20px">'+right+' / '+qs.length+'</b>（'+pct+'%）· 你已完成「'+qzState.mid+' '+mods[mi].title.slice(0,12)+'」的学习闭环。</p>'
    +'<div class="acts">'
    +(nextMid?'<button class="btn ok" onclick="closeQuiz();openUnit(\''+nextMid.units[0].id+'\')">进入 '+nextMid.id+' '+nextMid.title.slice(0,8)+' \u2192</button>'

/* ===================== 反馈（参考测评设计：FB_TYPE/FB_CAT/FB_SEV + 自动归类） ===================== */
const FB_TYPE = {text:{n:'文字',i:'✍️'}, image:{n:'截图',i:'🖼️'}, audio:{n:'语音',i:'🎙️'}, video:{n:'录屏',i:'🎬'}};
const FB_CAT  = {bug:{n:'功能缺陷',i:'🐞'}, feat:{n:'功能建议',i:'💡'}, ux:{n:'体验问题',i:'😣'}, other:{n:'其他',i:'💬'}};
const FB_SEV  = {high:'高',mid:'中',low:'低'};
function classifyFeedback(text){
  text=(text||'')+'';

  q.forEach(function(doc){
    pushFeedbackToCloud(doc,function(s){
      if(s) ok++;
      if(--left<=0) done&&done(ok,q.length);
    });
  });
}
/* 手动诊断：串起 mint → 建连 → 读表，把真实结果展示出来 */
function fbSelfTest(){
  var out=document.getElementById('lf-box');
  out.innerHTML='<div class="lf-head"><span style="font-size:20px">🔧</span><h3>云端连通性自检</h3><button class="lf-close" onclick="closeFb()">×</button></div>'
    +'<div id="selftest-out" class="lf-report" style="min-height:120px">正在检测…</div>'
    +'<div class="lf-foot"><button class="btn" onclick="copyText(document.getElementById(\'selftest-out\').textContent)">复制结果</button><button class="btn ghost" onclick="openFb()">返回反馈</button></div>';
  var o=document.getElementById('selftest-out'); var L=[];
  function p(s){ L.push(s); o.textContent=L.join('\n'); }
  var cfg=window.AIDAX_CONFIG;
  p('① SDK：'+(typeof window.supabase!=='undefined' && window.supabase.createClient ? '已加载 ✅' : '未加载 ❌（vendor/supabase-js.umd.js 未生效）'));
  p('② 配置：'+(cfg&&cfg.supabaseUrl?cfg.supabaseUrl:'缺失'));
  FB_DIAG=[];
  finMintToken(function(ok,err){
    p('③ 签发令牌：'+(ok?'成功 ✅':'失败 ❌ '+(err||'')));
    if(!ok){ p('\n诊断日志：\n'+fbDiagText()); return; }
    try{
      var c=finClient(finJwt());
      p('④ 建连：成功 ✅');
      c.from('feedback').select('id').limit(1).then(function(res){
        p('⑤ 读表：'+(res.error?('失败 ❌ '+res.error.message):'成功 ✅（RLS 放行）'));
        p('\n诊断日志：\n'+fbDiagText());
      }).catch(function(e){ p('⑤ 读表异常：'+(e.message||e)); p('\n诊断日志：\n'+fbDiagText()); });
    }catch(e){ p('④ 建连失败：'+e.message); p('\n诊断日志：\n'+fbDiagText()); }
  });
}
