fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">定位</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">PRD 要点</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">核心指标</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "定位要写清区别", "n": "定位最忌讳写成我们提供更好的金融服务。要写成针对谁、解决什么问题、和现有方案比区别在哪。区别通常来自三个角度：人群更细分、场景更具体、流程更短。把区别写到一个具体角度，定位才算成立。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">人群细分明确</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">场景具体</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">与现有方案有区别</tspan></text></svg>"}, {"t": "核心指标要能驱动决策", "n": "核心指标选一个北极星加两个护栏。北极星选那个能代表产品价值的指标，比如月度放款笔数；护栏选风险和质量相关的，比如逾期率和投诉率。护栏的作用是防止你为了冲北极星把风险冲垮，这一条在金融产品上尤其重要。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">指标体系</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">北极星</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">护栏一</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">护栏二</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}]}, {"id": "M7U4", "tier": "basic", "step": "spar", "title": "立项评审", "video": {"dur": "8min", "script": ["陪练：立项评审挑战价值与可行"]}, "ppt": {"method": "评审单（价值/可行/度量）", "case": "典型被挑战点", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "立项评审", "persona": "看价值与可行", "mustAsk": ["这产品解决谁的真问题？", "资源/风控能撑吗？", "上线后怎么度量？"]}, "deliverable": "最小方案（已过立项）", "task": "把《最小方案（已过立项）》拿到「立项评审」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《最小方案（已过立项）》。现在要让它通过「立项评审」这一关。\n【对手的立场】看价值与可行。\n【他一定会追问】「这产品解决谁的真问题？」 / 「资源/风控能撑吗？」 / 「上线后怎么度量？」\n【场景】你说「立项评审」，对方立刻回一句：这产品解决谁的真问题？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：立项评审挑战价值与可行", "n": "陪练对手是立项评审，他只挑战两件事：这件事的价值有多大，以及以现有资源能不能做成。他会在台上直接问你为什么不先做别的，以及如果只给两个人三个月你怎么排。这两个问题没有标准答案，但需要有清晰的取舍逻辑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">评审三问</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">价值</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">可行</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">取舍</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "应答示范：价值与可行都要有数", "n": "价值部分要给出量化，比如目标人群规模、当前痛点频次、预计可提升的转化；可行部分要给出排期和人力的硬约束，比如两个人三个月，先做申请到审批这一段，放款流程放到二期。两个都含糊，评审大概率不通过。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">价值：规模 + 频次 + 预期提升</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">可行：人力 + 排期 + 分期</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">风险：最坏情况与兜底</tspan></text></svg>"}, {"t": "答辩到放行", "n": "通过标准是三个问题都能落到具体数字或具体排期，而不是方向正确这类表态。方向正确是最贵的一句话，因为它从来没有错，也就无法被执行。陪练结束后，把被问倒的问题补进方案，这份方案的可信度会上一个台阶。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">价值有量化</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">可行有排期</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风险有兜底</tspan></text></svg>"}]}, {"id": "M7U5", "tier": "adv", "step": "understand", "title": "跨模块整合与治理", "video": {"dur": "8min", "script": ["整合各模块产出的顺序", "规模化：模板化与复用", "治理：红线贯穿全流程"]}, "ppt": {"method": "整合图（模块→全案）", "case": "全案结构", "demo": "整合清单"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】整合图（模块→全案）\n【为什么重要】整合各模块产出的顺序\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "跨模块整合的顺序", "n": "整合顺序会影响效率，建议按这个来：先定用户与场景，再定需求与分层，然后写 PRD，接着补风控与埋点，最后做监控和治理。顺序错了，你会反复返工，比如先写 PRD 再回头补用户分层，PRD 里所有需求都要重写一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">整合顺序</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">用户场景</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">需求分层</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">PRD</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">风控埋点</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">监控治理</tspan></text></g></svg>"}, {"t": "规模化：模板化与复用", "n": "把这次的产出模板化，下次做同类产品直接复用。可复用的零件包括：PRD 六段式模板、提示词库、合规检查清单、监控告警模板、复盘改进项清单。这些零件的价值会在第五个项目上显现出来，因为那时候你几乎不用重新想结构。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">PRD 模板已沉淀</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">提示词库已整理</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">检查清单可复用</tspan></text></svg>"}, {"t": "治理：红线贯穿全流程", "n": "治理的关键是让红线在每个环节都有检查点，而不是在最开始培训一次就完事。建议至少四个检查点：立项时判数据级别，PRD 评审时过风控与合规，上线前走检查清单，上线后做定期抽检。四个点缺一个，制度就会慢慢失效。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 立项判级别</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 评审过合规</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 上线前清单</tspan></text><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 上线后抽检</tspan></text></svg>"}]}, {"id": "M7U6", "tier": "adv", "step": "demo", "title": "带风控+合规的完整全案", "video": {"dur": "8min", "script": ["演示：补全风控与合规章节", "WorkBuddy 整合为可汇报全案"]}, "ppt": {"method": "全案结构（定位/PRD/风控/合规/数据）", "case": "「{{product}}」全案", "demo": "WorkBuddy 演示"}, "demoScript": {"steps": ["整合各模块产出", "补风控合规"], "prompt": "请把以下「{{product}}」各模块产出整合为一份可汇报全案，重点补全风控与合规章节。\n[粘贴]"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「全案结构（定位/PRD/风控/合规/数据）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】全案结构（定位/PRD/风控/合规/数据）\n【参考案例】「{{product}}」全案\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n请把以下「{{product}}」各模块产出整合为一份可汇报全案，重点补全风控与合规章节。 [粘贴]", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：补全风控与合规章节", "n": "演示把前面的方案补全成可汇报全案。这次补两块内容：一是风控章节，包括额度规则、拒答规则和例外处理；二是合规章节，包括披露清单、适当性评估和数据处理的说明。先把它需要的输入准备好。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：最小方案 + 风控口径</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：全案两章</tspan></text></g></svg>"}, {"t": "全案的写法与结构", "n": "看输出的全案结构：概述、市场与用户、产品方案、风控策略、合规与数据、指标与实验、上线计划、风险与对策八个部分。你只需要关注两章：风控和合规。风控那章要写清规则的触发条件与例外，合规那章要写清披露项与评估依据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">全案输出</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">风控策略 / 合规与数据</tspan></text></g></svg>"}, {"t": "到人、到时、到依据", "n": "全案最后要补三样：每件事的责任人、每个时间节点、每条结论的依据。这三样补完，这份方案就可以直接上会。很多人做方案卡在最后一公里，就是因为这三样是组织信息，而不是写作问题，需要你去问、去确认、去写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任人到具体角色</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">时间点可验证</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论有依据</tspan></text></svg>"}]}, {"id": "M7U7", "tier": "adv", "step": "todo", "title": "交付可汇报全案", "video": {"dur": "8min", "script": ["任务：含风控/合规/数据的全案"]}, "ppt": {"method": "全案模板（八段全覆盖）", "case": "样例全案", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["整合成稿", "补风控合规", "排汇报逻辑"], "exemplar": "全案=定位+PRD+风控策略+合规清单+数据指标+路线图。"}, "spar": null, "deliverable": "可汇报产品全案", "task": "产出《可汇报产品全案》：整合成稿；补风控合规；排汇报逻辑", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「综合实战：从 0 到 1 设计金融产品」模块，你要交付的是《可汇报产品全案》。\n【场景】业务侧这周的诉求是：任务：含风控/合规/数据的全案。参考做法：样例全案。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（全案模板（八段全覆盖）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《可汇报产品全案》填写模板】\n\n■ 1. 整合成稿\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 补风控合规\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 排汇报逻辑\n   ‣ 提示：按「结论 → 依据 → 行动」三段写。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   全案=定位+PRD+风控策略+合规清单+数据指标+路线图", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：交付可汇报全案", "n": "实操环节。交付一份可汇报的全案，覆盖八个部分，其中风控、合规、指标三部分必须写深。判断标准：一份材料， someone 能照着做， someone 能照着查， someone 能照着汇报。达不到这三 someone，就还没交付。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">全案四块</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">产品</tspan></text></g><g class=\"hl\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">风控</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">合规</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">指标</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "自检：三 somebody 测试", "n": "自检时换个身份看：如果你是研发，能不能知道该做什么；如果你是合规，能不能答出检查项；如果你是高管，能不能听懂价值。三个视角都成立才算过关。自己写的时候永远觉得清楚，这个错觉是所有方案交付失败的第一步。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">研发视角无歧义</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">合规视角有依据</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">高管视角有结论</tspan></text></svg>"}, {"t": "留痕与版本", "n": "全案定稿要带版本号、决策摘要和评审记录，并归档。三个月后回看，你能知道为什么这么定、谁定的、依据是什么。这份留痕在金融行业里不是加分项，而是职业安全。做久了你会发现，能留下痕迹的方案，才是在组织里真正产生影响的方案。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 版本号与摘要</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 评审记录归档</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 决策依据可回查</tspan></text></svg>"}]}, {"id": "M7U8", "tier": "adv", "step": "spar", "title": "高管汇报", "video": {"dur": "8min", "script": ["陪练：高管汇报答辩"]}, "ppt": {"method": "汇报骨架（价值/ROI/风险）", "case": "高分汇报结构", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "高管", "persona": "结果导向", "mustAsk": ["一句话说清这产品价值？", "ROI 与风险？", "为什么现在做？"]}, "deliverable": "全案（已过汇报）", "task": "把《全案（已过汇报）》拿到「高管」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《全案（已过汇报）》。现在要让它通过「高管」这一关。\n【对手的立场】结果导向。\n【他一定会追问】「一句话说清这产品价值？」 / 「ROI 与风险？」 / 「为什么现在做？」\n【场景】你说「高管汇报」，对方立刻回一句：一句话说清这产品价值？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：高管汇报答辩", "n": "最后一节陪练，对手是高管。他只给你三分钟，关心三件事：这事值不值得做、风险能不能兜住、需要什么资源。汇报要先给结论，再给三到五条支撑，最后提资源需求。超过三分钟还没说到结论，他就会打断你。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">高管三问</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">值不值得</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">风险兜底</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">需要资源</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "汇报结构与应答策略", "n": "结构是：一句话结论加三条支撑加一条资源需求。三条支撑各一句，带数字或带依据。资源需求要具体，比如需要两名研发加一个季度，而不是需要些支持。凡是含糊的资源请求，在会上基本都会被压回去。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">结论先行一句</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">三条支撑各一句</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"star /* ===================== 模型接入层（DeepSeek） =====================
   两个通道：
   A 本地代理（推荐）——node tools/deepseek_proxy.cjs，Key 只存在进程环境变量，
     不落文件、不进 HTML；页面只访问 http://127.0.0.1:3000/chat
   B 直连（备用）——临时填入 Key，仅存本机 localStorage，直连 api.deepseek.com
   任何一路不可用时自动降级到本地规则引擎，功能不中断。 */
let LLM = (function(){
  try{ return JSON.parse(localStorage.getItem('aidax_llm'))||{}; }catch(e){ return {}; }
})();
LLM.base = LLM.base || 'http://127.0.0.1:3000';
LLM.key  = LLM.key  || '';
LLM.state = 'unknown';           /* unknown | proxy | direct | off */
function saveLlm(){ try{ localStorage.setItem('aidax_llm', JSON.stringify({base:LLM.base,key:LLM.key})); }catch(e){} }

function llmEndpoint(){
  if(LLM.state==='direct' && LLM.key){
    return {url:'https://api.deepseek.com/chat/completions',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+LLM.key}};
  }
  return {url:LLM.base.replace(/\/$/,'')+'/chat', headers:{'Content-Type':'application/json'}};
}
async function llmChat(messages, opts){
  const ep=llmEndpoint();
  const body=Object.assign({model:'deepseek-chat',messages:messages,temperature:0.6,max_tokens:700},opts||{});
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), 25000);
  try{
    const r=await fetch(ep.url,{method:'POST',headers:ep.headers,body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('HTTP '+r.status+' '+t.slice(0,120)); }
    const j=await r.json();
    const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!c) throw new Error('空回复');
    return String(c).trim();
  } finally { clearTimeout(tm); }
}
async function llmProbe(silent){
  let st='off';
  try{
    const r=await fetch(LLM.base.replace(/\/$/,'')+'/ping',{cache:'no-store'});
    if(r.ok) st='proxy';
  }catch(e){}
  if(st==='off' && LLM.key){
    try{
      const r=await fetch('https://api.deepseek.com/models',{headers:{'Authorization':'Bearer '+LLM.key}});
      if(r.ok) st='direct';
    }catch(e){}
  }
  LLM.state=st; paintLlm();
  if(!silent && st==='off') openLlm();
  return st;
}
function paintLlm(){
  const b=document.getElementById('llm-badge'); if(!b) return;
  const t=document.getElementById('llm-text');
  b.classList.remove('on','off');
  if(LLM.state==='proxy'){ b.classList.add('on'); t.textContent='DeepSeek 已连接（本地代理）'; }
  else if(LLM.state==='direct'){ b.classList.add('on'); t.textContent='DeepSeek 已连接（直连）'; }
  else if(LLM.state==='off'){ b.classList.add('off'); t.textContent='模型未连接 · 点此接入'; }
  else { t.textContent='模型未检测'; }
}
function llmReady(){ return LLM.state==='proxy' || LLM.state==='direct'; }

async function saveLlmForm(){
  LLM.base=document.getElementById('llm-base').value.trim()||'http://127.0.0.1:3000';
  LLM.key=document.getElementById('llm-key').value.trim();
  saveLlm();

/* ===================== 播放器（字幕与真人声对齐；高亮讲到才闪三下） ===================== */
function makePlayer(uid, slides, aud){
  const stage=document.getElementById('p-stage'), subEl=document.getElementById('p-sub'), dots=document.getElementById('p-dots'),
        seek=document.getElementById('p-seek'), timeEl=document.getElementById('p-time'), playBtn=document.getElementById('p-play');
  let cur=0, playing=false, mode=null, audio=null, ttsTimer=null, ttsPulse=null, ttsStart=0, pulsedIdx=-1, ttsGuard=null;
  const dur=slides.map(s=>Math.max(2, sub(s.n).length*0.205)); /* 0.205 s/字 = 豆包实测 4.9 字/秒 */
  const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;};
  const total=()=>dur.reduce((a,b)=>a+b,0);
  function linesOf(i){ const n=sub(slides[i].n); return n.split(/(?<=[。！？；\n])/).map(x=>x.trim()).filter(Boolean); }
  function setCaption(i,frac){
    const n=sub(slides[i].n), ls=linesOf(i), spoken=frac*Math.max(1,n.length);
    let acc=0,k=0;
    for(let x=0;x<ls.length;x++){ acc+=ls[x].length; if(spoken<acc){k=x;break;} k=x; }
    subEl.textContent=ls[k];
  }
  function updateSeek(){
    let start=0; for(let k=0;k<cur;k++) start+=dur[k];
    let local=0,d=dur[cur]||1;
    if(mode==='audio'&&audio){ local=audio.currentTime; d=audio.duration||d; }
    else if(mode==='tts'){ local=(performance.now()-ttsStart)/1000; }
    const g=start+Math.min(local,d), frac=total()?g/total():0;
    seek.querySelector('.fill').style.width=(frac*100)+'%';
    seek.querySelector('.knob').style.left=(frac*100)+'%';
    timeEl.textContent=fmt(g)+' / '+fmt(total());
  }
  function pulseNow(){
    const s=stage.querySelectorAll('.slide')[cur]; if(!s) return;
    const h=s.querySelector('.hl'); if(!h) return;
    h.classList.remove('pulse'); void h.offsetWidth; h.classList.add('pulse');
    setTimeout(()=>h.classList.remove('pulse'),2600);
  }
  function maybePulse(i,frac){ if(pulsedIdx!==i && frac>=0.34){ pulsedIdx=i; pulseNow(); } }
  function render(){
    stage.innerHTML=''; dots.innerHTML='';
    slides.forEach((s,i)=>{
      const d=document.createElement('div'); d.className='slide'+(i===cur?' on':'');
      d.innerHTML='<h4>'+sub(s.t)+'</h4>'+sub(s.s);
      stage.appendChild(d);
      const dot=document.createElement('i'); if(i===cur)dot.className='on'; dots.appendChild(dot);
    });
  }
  /* 完全无语音环境：按估算时长滚筒式推进，保证画面一定会走 */
  function clockSlide(i){
    mode='tts'; ttsStart=performance.now();
    setCaption(i,0); updateSeek();
    clearInterval(ttsTimer); ttsTimer=setInterval(updateSeek,200);
    clearInterval(ttsPulse); ttsPulse=setInterval(()=>{ maybePulse(i,(performance.now()-ttsStart)/1000/(dur[i]||1)); },150);
    clearTimeout(ttsGuard);
    ttsGuard=setTimeout(()=>{ if(playing&&mode==='tts'&&cur===i) advance(); }, Math.round((dur[i]+1)*1000));
  }
  function ttsSlide(i){
    var sup=true;
    try{ sup=!!(typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined'); }catch(e){ sup=false; }
    if(!sup){ clockSlide(i); return; }
    var u2;
    try{ u2=new SpeechSynthesisUtterance(sub(slides[i].n)); }catch(e){ clockSlide(i); return; }
    mode='tts'; ttsStart=performance.now();
    u2.lang='zh-CN'; u2.rate=1;
    u2.onboundary=e=>{ const n=sub(slides[i].n), before=n.slice(0,e.charIndex); let acc=0,k=0;
      for(let x=0;x<linesOf(i).length;x++){ acc+=linesOf(i)[x].length; if(before.length<acc){k=x;break;} k=x; }
      const f=before.length/Math.max(1,n.length); setCaption(i,f); maybePulse(i,f); updateSeek(); };
    u2.onend=()=>{ if(playing) advance(); };
    try{ speechSynthesis.cancel(); speechSynthesis.speak(u2); }catch(e){ clockSlide(i); return; }
    setCaption(i,0); updateSeek();
    clearInterval(ttsTimer); ttsTimer=setInterval(updateSeek,200);
    clearInterval(ttsPulse); ttsPulse=setInterval(()=>{ maybePulse(i,(performance.now()-ttsStart)/1000/(dur[i]||1)); },150);
    /* 语音静默失败兜底：到估算时长还没在播报，就自动翻页，避免永久卡住 */
    clearTimeout(ttsGuard);
    ttsGuard=setTimeout(()=>{
      if(!playing||mode!=='tts'||cur!==i) return;
      let sp=false; try{ sp=!!(speechSynthesis.speaking||speechSynthesis.pending); }catch(e){}
      if(!sp) advance();
    }, Math.round((dur[i]+1.5)*1000));
  }
  function playSlide(i){
    cur=i; render(); pulsedIdx=-1; clearInterval(ttsPulse); clearTimeout(ttsGuard);
    if(aud&&aud[i]){
      mode='audio'; audio=new Audio(aud[i]);
      audio.onloadedmetadata=()=>{ if(audio.duration) dur[i]=audio.duration; updateSeek(); };
      audio.onended=()=>{ if(playing) advance(); };
      audio.ontimeupdate=()=>{ if(mode==='audio'){ const f=(audio.currentTime)/(audio.duration||dur[i]); setCaption(i,f); maybePulse(i,f); updateSeek(); } };
      /* 音频真的加载不出来时降级本机语音，绝不静默跳过（静默跳过会表现为「点了没反应」） */
      audio.onerror=()=>{ if(playing&&mode==='audio'){ try{audio.pause();}catch(e){} ttsSlide(i); } };
      const pr=audio.play();
      if(pr&&pr.catch) pr.catch(()=>{ if(playing&&mode==='audio'&&!(audio.duration>0)) ttsSlide(i); });
      setCaption(i,0); updateSeek();
    }else{ ttsSlide(i); }
  }
  function advance(){ const ni=cur+1; if(ni>=slides.length){ stop(); subEl.textContent='本节讲解结束，可继续下方环节活动'; return; } playSlide(ni); }
  function stop(){ playing=false; if(audio){try{audio.pause();}catch(e){}} try{speechSynthesis.cancel();}catch(e){} clearInterval(ttsTimer); clearInterval(ttsPulse); clearTimeout(ttsGuard); if(playBtn) playBtn.textContent='\u25B6 播放'; }
  function play(){ if(playing){ stop(); return; } playing=true; if(playBtn) playBtn.textContent='\u23F8 暂停'; playSlide(cur<0?0:cur); }
  playBtn.onclick=play;
  seek.addEventListener('pointerdown',ev=>{
    const r=seek.getBoundingClientRect(); let frac=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
    let g=frac*total(),acc=0,idx=0;
    for(let k=0;k<slides.length;k++){ if(acc+dur[k]>g){idx=k;break;} acc+=dur[k]; idx=k; }
    stop(); playSlide(idx);
    if(mode==='audio'&&audio) audio.currentTime=Math.min(g-acc,(audio.duration||dur[idx])-0.05);
    updateSeek();
  });
  render();   /* 进入单元先渲染第一页，避免一片黑让人误以为播放器坏了 */
  updateSeek();
  return {stop:stop, play:play};
}

/* ---------- 问题 3：分数由行为算出来，点按钮不能凭空拿分 ---------- */
function actsOf(uid){ return (prog.units[uid]&&prog.units[uid].acts)||{}; }
function setAct(uid,k,v){
  const st=prog.units[uid]||{}; const a=Object.assign({},st.acts||{});
  a[k]=v; prog.units[uid]=Object.assign({},st,{acts:a}); saveProg();
}
const BOUNDARY_RE=/不确定|待确认|留给|由.{1,6}(判断|决定|确认)|需要.{0,4}确认|不能替|边界|存疑|风险|我会补|降级/;
const EVID_RE=/[0-9０-９]|数据|口径|来源|条款|原文|看板|访谈|样本|比例|百分比|%|频次|制度|办法|规则/;
const PLAN_RE=/责任人|负责人|时间|节点|下周|本周|月底|排期|截止|owner|上线|交付|deadline/i;

function computeUnit(uid){
  const f=findUnit(uid); if(!f) return {ok:false,score:0,detail:[],need:'单元不存在'};
  const u=f.u, a=actsOf(uid), R=[]; let s=0, need='';
  if(u.step==='understand'){
    const q=!!a.quiz, note=(a.note||'').trim(), nOk=note.length>=10;
    R.push({k:'自检题答对',ok:q,hint:'答案落在「AI 补结构与措辞、判断与取舍留给人」这条线上'});
    R.push({k:'写下可落地的收获（≥10 字）',ok:nOk,hint:'按模板写满三小节'});
    s=(q?60:0)+(nOk?40:(note.length>0?15:0));
    if(!q) need='先答对上面的自检题';
    else if(!nOk) need='在文本框里写下你的收获（至少 10 字）';
  } else if(u.step==='demo'){
    const ran=!!a.ran, rec=(a.rec||'').trim(), recOk=rec.length>=30, chk=!!a.checked;
    R.push({k:'跑通一遍（复制提示词或用模型跑）',ok:ran,hint:'点「复制提示词」或「用模型跑一遍」都算'});
    R.push({k:'写下演示记录（≥30 字）',ok:recOk,hint:'模板 4 小节至少填满 2 节'});
    R.push({k:'确认已人工核对结果',ok:chk,hint:'勾选下方复选框'});
    s=(ran?45:0)+(recOk?35:(rec.length>0?14:0))+(chk?20:0);
    if(!ran) need='先跑一遍（复制提示词或用模型跑）';
    else if(!recOk) need='填写演示记录（至少 30 字）';
    else if(!chk) need='勾选「我已人工核对过模型结果」';
  } else if(u.step==='todo'){
    const t=(a.work||'').trim();
    if(!t){ R.push({k:'提交产出内容',ok:false,hint:'按模板逐节填写后提交'}); need='先按模板写出你的产出并提交'; }
    else { const r=scoreWorkText(u,t); r.need=r.need||''; return r; }
  } else if(u.step==='spar'){
    const rounds=a.rounds||0, best=a.best||0, bd=!!a.boundary;
    R.push({k:'完成 ≥3 轮真实对话',ok:rounds>=3,hint:'陪练至少追问满 3 轮'});
    R.push({k:'≥2 轮给出了可追溯依据',ok:best>=2,hint:'回答里要出现数字/条款/口径/来源'});
    R.push({k:'划出责任边界',ok:bd,hint:'说清哪部分你不下结论、交给谁'});
    s=(rounds>=3?40:Math.min(39,rounds*13))+Math.min(35,best*18)+(bd?25:0);
    if(rounds<3) need='陪练还要继续（已完成 '+rounds+' 轮，至少 3 轮）';
    else if(best<2) need='至少 2 轮答案里要有具体依据（数字/条款/口径）';
    else if(!bd) need='说清哪部分结论你不下、留给谁判断';
  }
  s=Math.max(0,Math.min(100,Math.round(s)));
  return {ok:!need && s>=60, score:s, detail:R, need:need};
}

function scoreWorkText(u,t){
  const nums=(t.match(/[0-9０-９]/g)||[]).length;
  const evid=EVID_RE.test(t), risk=/风控|合规|红线|数据|脱敏|验收|监控|异常|依赖|权限|隐私|披露/.test(t), plan=PLAN_RE.test(t);
  const secs=Math.min(4, t.split(/\n/).filter(x=>x.trim().length>=6).length);
  const R=[
    {k:'结构完整：按模板小节填写（≥4 个小节）',ok:secs>=4,hint:'按模板的 ■ 小节一行一节写，当前识别到 '+secs+' 节'},
    {k:'有据可依：出现具体数字 / 来源 / 口径',ok:(nums>=2||evid),hint:'至少 2 个数字，或写明数据来源与口径'},
    {k:'红线意识：指出风险并给规避动作',ok:risk,hint:'写明可能触线的环节 + 你的规避动作'},
    {k:'可执行：写明责任人或时间节点',ok:plan,hint:'补上责任人 / 时间节点'}
  ];
  let s=secs>=4?28:(secs>=3?20:(secs>=2?12:6));
  if(nums>=2||evid) s+=26;
  if(risk) s+=24;
  if(plan) s+=22;
  let need='';
  if(s<60){
    const lack=R.filter(x=>!x.ok).map(x=>x.k.split('：')[0]);
    need='得分 '+s+' 分，未达 60 分门槛。请补强：'+lack.join('、');
  }
  return {ok:s>=60, score:Math.min(100,s), detail:R, need:need};
}

function previewScore(uid,elId){
  const el=document.getElementById(elId); if(!el) return;
  const r=computeUnit(uid);
  const det=r.detail.map(d=>'<li class="'+(d.ok?'ok':'')+'">'+esc(d.k)+(d.ok?'':' <span class="hint">（'+esc(d.hint||'')+'）</span>')+'</li>').join('');
  el.innerHTML='<div class="kv" style="margin-top:10px"><b>预估得分：'+r.score+' 分</b>'
   +'<div class="bar"><i style="width:'+r.score+'%"></i></div>'
   +'<ul class="rub">'+det+'</ul>'
   +(r.need?'<div style="font-size:12.6px;color:#be123c">还差：'+esc(r.need)+'</div>':'<div style="font-size:12.6px;color:#166534">已达通关线（60 分），可以结算。</div>')
   +'</div>';
}

function finishUnit(uid){
  if(ADMIN){
    const st=prog.units[uid]||{};
    prog.units[uid]=Object.assign({},st,{done:true,score:st.score||60,detail:[{k:'管理员预览模式：已标记观看（未计分）',ok:true}],acts:st.acts||{}});
    saveProg(); refreshProg(); renderUnit(uid); renderSidebar();
    return true;
  }
  const r=computeUnit(uid);
  if(!r.ok){
    alert('还不能结算：\n\n'+(r.need||'请先完成上方环节活动')+'\n\n当前预估 '+r.score+' 分，通关线 60 分。');
    return false;
  }
  const st=prog.units[uid]||{};
  const prev=st.score||0;
  prog.units[uid]=Object.assign({},st,{done:true,score:Math.max(prev,r.score),detail:r.detail,acts:st.acts||{}});
  saveProg(); refreshProg(); renderUnit(uid); renderSidebar();
  return true;
}

function addBubble(who,text){

function sparSystem(u){
  const m=u.spar||{};
  return '你是一场企业内训里的角色扮演评审，此刻扮演「'+sub(m.role||'评审')+'」。'

   +'\n2) 必须引用学员上一句话里的具体词汇或原话片段来追问，让他知道你真的听了。'
   +'\n3) 若学员给出了可追溯依据（具体数字、文件条款、口径、访谈编号），先用一句话认可那一处，再往更狠的一层追问：这个前提不成立怎么办、边界在哪、口径对得上吗。'
   +'\n4) 若学员只是表态、复述问题或说空话，直接点破，并要求他给出数据或条款。'
   +'\n5) 你一定会问到这些方向：'+(m.mustAsk||[]).map(x=>sub(x)).join('；')+'。'
   +'\n6) 不要编造不存在的制度条款，需要引用时用「贵行的数据分级办法」这类通称。'
   +'\n只输出你要说的那一句话，不要有任何前缀说明。';
}
function anchorOf(t){
  const s=t.replace(/\s+/g,'');
  const re=/《[^》]{1,10}》|第[0-9０-９]+条|[0-9１-９]+(?:\.[0-9]+)?%|[0-9０-９]+(个|条|项|份|处|类)|不下结论|边界|口径|看板|访谈|PII|脱敏|原文第/g;
  const m=s.match(re);
  if(m && m[0]){
    const i=s.indexOf(m[0]);
    return s.slice(Math.max(0,i), i+m[0].length+8).slice(0,18);
  }
  return s.slice(0,14);
}
function localSparReply(u,t,rounds){
  const role=sub(u.spar.role);
  const anchor=anchorOf(t);
  const hasNum=/[0-9０-９]/.test(t), hasEvid=EVID_RE.test(t), bd=BOUNDARY_RE.test(t);
  const arr=u.spar.mustAsk||[];
  const q=arr[rounds % Math.max(1,arr.length)] || '你的依据是什么？';
  if(!hasEvid){
    return '（'+role+'）你说「'+anchor+'\u2026」\u2014\u2014 我听到的是立场，不是依据。这条结论落在哪份文件、哪张看板、哪组数据上？说得出出处，我们才谈得下去。';
  }
  if(!hasNum){
    return '（'+role+'）「'+anchor+'\u2026」方向对了，但你给的是说法不是数。具体到多少、覆盖哪些产品、口径怎么定义的？';
  }
  if(!bd){
    return '（'+role+'）「'+anchor+'\u2026」这一处我暂时认。那我问下一层：如果这条依据本身不成立，你的结论要不要降级？哪部分你不敢下结论、要交给谁？';
  }
  return '（'+role+'）「'+anchor+'\u2026」有数、有出处、也划了边界，这条我认。最后再确认一件事：'+sub(q);
}
async function sendSpar(){
  if(sparBusy) return;
  const ta=document.getElementById('spar-text'); if(!ta) return;
  const t=ta.value.trim();
  if(!t){ alert('先写点内容再发送'); return; }
  const f=findUnit(prog.cur); if(!f||!f.u.spar) return;
  const u=f.u;
  addBubble('me',t); ta.value='';
  sparHist.push({role:'user',content:t});
  flow.tries++;
  const evid=EVID_RE.test(t) && (/[0-9０-９]/.test(t) || /条款|原文|口径|来源|访谈|看板/.test(t));
  if(evid) flow.best++;
  if(BOUNDARY_RE.test(t)) flow.boundary=true;
  setAct(prog.cur,'rounds',flow.tries);
  setAct(prog.cur,'best',flow.best);
  setAct(prog.cur,'boundary',flow.boundary?1:0);

  sparBusy=true; ta.disabled=true;
  const btnText='\u2026'; let reply=null, src='';
  if(llmReady()){
    try{
      const msgs=[{role:'system',content:sparSystem(u)}].concat(sparHist.slice(-12));
      reply=await llmChat(msgs,{temperature:0.75,max_tokens:220});
      src='model';
    }catch(e){ reply=null; }
  }
  if(!reply){ reply=localSparReply(u,t,flow.tries-1); src='local'; }
  sparBusy=false; ta.disabled=false; try{ ta.focus(); }catch(e){}
  addBubble('ai',reply);
  sparHist.push({role:'assistant',content:reply});

  const st=document.createElement('div'); st.className='kv';
  st.style.cssText='color:var(--mut);font-size:12.4px';
  st.textContent='第 '+flow.tries+' 轮 · 有据回答 '+flow.best+' 次 · '+(flow.boundary?'已划边界':'尚未提到边界')+' · '+(src==='model'?'由 DeepSeek 实时生成':'本地追问引擎（未接入模型）');
  const host=document.getElementById('spar-out');
  if(host){ host.innerHTML=''; host.appendChild(st); }

  const r=computeUnit(prog.cur);
  if(r.ok){
    setAct(prog.cur,'passed',1);
    addBubble('sys','\u2705 陪练通过：'+flow.tries+' 轮、'+flow.best+' 次给出依据'+(flow.boundary?'、已划清责任边界':'')+'。');
    finishUnit(prog.cur);
  } else if(flow.tries>=3){
    addBubble('sys','距离通关还差：'+r.need);
  }
}

/* ===================== 模块测验（问题 4：能打开） ===================== */
let qzState=null;
function openQuiz(mid){
  const qs=QUIZ[mid]; if(!qs) return;
  qzState={mid:mid, idx:0, picked:new Array(qs.length).fill(null)};
  renderQuiz();
  document.getElementById('quiz-modal').classList.add('on');
}
function renderQuiz(){
  const qs=QUIZ[qzState.mid], cur=qs[qzState.idx];
  const box=document.getElementById('quiz-box');
  const mi=COURSE.modules.findIndex(m=>m.id===qzState.mid);
  box.innerHTML='<div class="mclose" onclick="closeQuiz()">\u2715</div>'
    +'<h3>'+qzState.mid+' 模块测验</h3>'
    +'<p>'+esc(COURSE.modules[mi].title)+' · 第 '+(qzState.idx+1)+' / '+qs.length+' 题</p>'
    +'<div class="qz-item"><div class="q">'+sub(cur.q)+'</div>'
    +cur.opts.map((o,i)=>'<div class="op" id="op'+i+'" onclick="pickQ('+i+')">'+esc(sub(o))+'</div>').join('')
    +'<div class="tip" id="qz-tip"></div></div>'
    +'<div class="acts"><button class="btn" onclick="nextQ()">'+(qzState.idx===qs.length-1?'提交并查看得分':'下一题')+'</button></div>';
}
function pickQ(i){
  const cur=QUIZ[qzState.mid][qzState.idx], n=qzState.idx;
  qzState.picked[n]=i; cur.picked=i;
  document.querySelectorAll('#quiz-box .op').forEach(el=>el.classList.remove('right','wrong'));
  document.getElementById('op'+i).classList.add(i===cur.a?'right':'wrong');
  const tip=document.getElementById('qz-tip'); tip.style.display='block';
  tip.innerHTML=(i===cur.a?'\u2705 正确。':'\u274C 正确答案：'+esc(sub(cur.opts[cur.a]))+'\u3000')+esc(sub(cur.tip));
}
function nextQ(){
  const qs=QUIZ[qzState.mid];
  if(qzState.picked[qzState.idx]===null){ alert('请先选择一个答案'); return; }
  if(qzState.idx<qs.length-1){ qzState.idx++; renderQuiz(); return; }
  const right=qzState.picked.filter((p,i)=>p===qs[i].a).length;
  const pct=Math.round(right/qs.length*100);
  prog.quizzes[qzState.mid]=pct>=60;
  saveProg(); refreshProg(); renderSidebar();
  const mods=COURSE.modules, mi=mods.findIndex(m=>m.id===qzState.mid);
  const nextMid=mods[mi+1];
  const box=document.getElementById('quiz-box');
  box.innerHTML='<div class="mclose" onclick="closeQuiz()">\u2715</div>'
    +'<h3>'+(pct>=60?'\uD83C\uDF89 模块通关':'\uD83D\uDCCC 再补一补')+'</h3>'
    +'<p>得分 <b style="color:var(--blue-d);font-size:20px">'+right+' / '+qs.length+'</b>（'+pct+'%）· 你已完成「'+qzState.mid+' '+mods[mi].title.slice(0,12)+'」的学习闭环。</p>'
    +'<div class="acts">'
    +(nextMid?'<button class="btn ok" onclick="closeQuiz();openUnit(\''+nextMid.units[0].id+'\')">进入 '+nextMid.id+' '+nextMid.title.slice(0,8)+' \u2192</button>'
             :'<button class="btn ok" onclick="closeQuiz();openUnit(\'M0U1\')">回到起点重学一轮</button>')
    +'<button class="btn ghost" onclick="openQuiz(\''+qzState.mid+'\')">再练一遍本模块</button>'
    +'</div>'
    +(pct<60?'<p style="color:#be123c">未达 60%，建议先回看单元视频与课件再重测。</p>':'');
}
function closeQuiz(){ document.getElementById('quiz-modal').classList.remove('on'); }

/* 点遮罩关闭弹窗 */
['quiz-modal','llm-modal'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('click',ev=>{ if(ev.target===el) el.classList.remove('on'); });
});

/* ===================== 启动（问题 8：回到上次所在的单元与模块） ===================== */
['cfg-industry','cfg-company','cfg-product'].forEach(id=>{
  const k=id.slice(4); document.getElementById(id).value=CUSTOM[k];
});
applyAdminUI(); renderSidebar(); refreshProg();
// 深链：?m=MX 直接进入该模块首单元（来自主站学习地图的模块点击）
let _start = (prog.cur && findUnit(prog.cur)) ? prog.cur : 'M0U1';
if (DEEP_MODULE) {
  const dm = COURSE.modules.find(m=>m.id===DEEP_MODULE);
  if (dm && dm.units.length) _start = dm.units[0].id;
}
openUnit(_start);
paintLlm();
llmProbe(true);
</script>
