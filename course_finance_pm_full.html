 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 删除无效用例</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 合并重复覆盖</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 标注优先级</tspan></text></svg>"}]}, {"id": "M5U4", "tier": "basic", "step": "spar", "title": "研发挑需求漏洞", "video": {"dur": "8min", "script": ["陪练：研发挑字段/异常/性能漏洞"]}, "ppt": {"method": "挑洞单（字段/异常/性能/并发）", "case": "典型漏写项", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "研发", "persona": "抠可行性边界", "mustAsk": ["这字段哪来？", "异常分支写了？", "性能/并发要求？"]}, "deliverable": "验收用例（已过研发）", "task": "把《验收用例（已过研发）》拿到「研发」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《验收用例（已过研发）》。现在要让它通过「研发」这一关。\n【对手的立场】抠可行性边界。\n【他一定会追问】「这字段哪来？」 / 「异常分支写了？」 / 「性能/并发要求？」\n【场景】你说「研发挑需求漏洞」，对方立刻回一句：这字段哪来？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：研发挑漏洞", "n": "陪练对手是资深研发，他不关心需求写得好不好看，只关心能不能做、做出来会出什么问题。他会挑三类漏洞：字段定义不全、异常分支缺失、性能和并发下的表现。被挑中不要急着解释，先记录，因为每一条都是真实的实现风险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">研发三挑</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">字段</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">异常</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">性能</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频问题与应答", "n": "三个高频问题。第一，这个字段空了怎么办，你要回答默认值和校验规则。第二，并发提交怎么处理，你要说清幂等键或唯一约束。第三，最慢的一步耗时多少，你要给出预估和降级方案。这三个问题在每个项目上都会出现，提前准备好答案就能省掉很多往返。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">字段为空给默认值与校验</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">并发提交用幂等键唯一约束</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">慢接口给预算与降级</tspan></text></svg>"}, {"t": "改到无漏洞才放行", "n": "通过标准就是三类问题都有明确答案，且没有遗漏关键字段。研发不会因为你说是小问题就放过，他会提醒你小问题在量级大时也会变成大问题。这个环节结束后，你的需求文档质量会明显提升，因为阶段性地补完了所有含糊的地方。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">字段定义完整</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">异常分支明确</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">性能有预算</tspan></text></svg>"}]}, {"id": "M5U5", "tier": "adv", "step": "understand", "title": "监控告警与运营看板", "video": {"dur": "8min", "script": ["监控三层：业务/系统/模型", "告警：阈值/趋势/突变三类", "异常定位的分诊思路"]}, "ppt": {"method": "监控框架（指标/阈值/响应）", "case": "「{{product}}」监控看板", "demo": "告警规则模板"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】监控框架（指标/阈值/响应）\n【为什么重要】监控三层：业务/系统/模型\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "监控三层：业务、系统、模型", "n": "线上监控要分三层。业务层看转化率、通过率这些结果指标；系统层看接口耗时和错误率；模型层看输出分布漂移和拒绝率变化。只监控系统层，你知道服务活着但不知道业务在掉；只看业务层，你发现问题了却不知道是哪一层坏的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">监控三层</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">业务层</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">系统层</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">模型层</tspan></text></g><g class=\"hl\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">告警</tspan></text></g></svg>"}, {"t": "告警的三种类型", "n": "告警不要只看阈值，要有三类。阈值类，比如通过率低于某个值；趋势类，比如连续三小时缓慢下滑，这类最容易被发现；突变类，比如错误率瞬间跳升，通常意味着发布引入问题。三类各配一条最关键的指标，别把告警做成噪音，没人看的告警等于没有。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类告警</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">阈值告警</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">趋势告警</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">突变告警</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "异常定位的分诊思路", "n": "出问题时按固定顺序分诊：先看发布记录，因为大部分事故来自变更；再看系统层指标，判断是服务问题还是依赖问题；再看业务层，判断影响面；最后看日志定位到具体请求。这个顺序能让你在最短时间内缩小范围。分诊顺序是经验，不是理论，练熟它比什么都重要。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">先看发布记录</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">再分系统还是业务</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">最后日志定位请求</tspan></text></svg>"}]}, {"id": "M5U6", "tier": "adv", "step": "demo", "title": "配一条关键指标告警", "video": {"dur": "8min", "script": ["演示：定义自动通过率告警规则", "WorkBuddy 输出触发条件+响应"]}, "ppt": {"method": "告警规则结构（条件/级别/响应）", "case": "通过率跌幅告警", "demo": "WorkBuddy 演示"}, "demoScript": {"steps": ["定指标", "让 WorkBuddy 出规则"], "prompt": "为「{{product}}」设计一条监控告警：当自动通过率连续 1h 跌幅>10% 时告警，给出触发条件与响应动作。"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「告警规则结构（条件/级别/响应）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】告警规则结构（条件/级别/响应）\n【参考案例】通过率跌幅告警\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n为「{{product}}」设计一条监控告警：当自动通过率连续 1h 跌幅>10% 时告警，给出触发条件与响应动作", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：定义一条关键指标告警", "n": "演示定义自动审批通过率的告警规则。我们要定四件事：指标是什么、触发条件是什么、观察窗口多久、告警后谁来响应。四件事里最容易漏的是观察窗口，因为没有窗口的单点告警会被偶发抖动频繁触发。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">指标：自动审批通过率</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：定义触发与响应</tspan></text></g></svg>"}, {"t": "触发条件加观察窗口", "n": "看输出。它给出：当自动审批通过率连续三十分钟低于百分之五十五时触发告警，级别为 P2，通知值班研发与产品。这里关键是三十分钟这个窗口，它过滤了偶发抖动。凡是只写低于某值不写持续时间的告警规则，上线后大概率会变成噪音。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">告警规则</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">指标 + 阈值 + 窗口 + 级别 + 响应人</tspan></text></g></svg>"}, {"t": "响应动作要落到人", "n": "告警规则最后要写清响应动作：谁先看、看什么、多久内没处理升级给谁。没有升级路径的告警，在深夜几乎等于没告警。金融产品的告警尤其要写清升级路径，因为涉及资金时，响应时间本身就是风险指标之一。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">响应人有名字</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有升级路径</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有处理时限</tspan></text></svg>"}]}, {"id": "M5U7", "tier": "adv", "step": "todo", "title": "写运营监控方案", "video": {"dur": "8min", "script": ["任务：指标+阈值+响应成方案"]}, "ppt": {"method": "方案模板（指标/阈值/响应/升级）", "case": "样例方案", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["选指标", "定阈值", "写响应"], "exemplar": "指标：自动通过率。阈值：跌幅>10%/1h 或 <基线 2σ。响应：暂停策略+人工排查。"}, "spar": null, "deliverable": "运营监控方案", "task": "产出《运营监控方案》：选指标；定阈值；写响应", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「AI 嵌入研发协同与运营」模块，你要交付的是《运营监控方案》。\n【场景】业务侧这周的诉求是：任务：指标+阈值+响应成方案。参考做法：样例方案。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（方案模板（指标/阈值/响应/升级）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《运营监控方案》填写模板】\n\n■ 1. 选指标\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 定阈值\n   ‣ 提示：给出阈值、观察窗口、触发后的第一动作。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写响应\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   指标：自动通过率。阈值：跌幅>10%/1h 或 <基线 2σ。响应：暂停策略+人工排查", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：写运营监控方案", "n": "实操环节。产出一份运营监控方案，包含三层监控指标、告警规则表、异常响应流程三块。三层监控每层至少给两个指标，告警规则至少给三条，响应流程要写清角色和时限。三块齐全才算一份能落地的方案。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">方案三块</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">指标</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">告警规则</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">响应流程</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "指标要选能行动的", "n": "选指标有一条原则：选那些异常时你能做点什么的。通过率下降你能调整策略或排查依赖，但整体用户数下降你除了上报没有动作。前者适合进监控，后者适合进日报。监控指标过多会让响应者麻痹，宁可少而准，不要多而全。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">异常时可采取动作</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">指标有负责人</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">阈值有依据</tspan></text></svg>"}, {"t": "响应流程要有闭环", "n": "响应流程要形成一个闭环：发现、定位、止损、复盘，每步都要有时间要求和责任人。止损这一步最容易被省略，但线上出问题时，先止血再查因是第一位。方案里要写清止损手段，比如灰度回滚或降级策略，没有止损手段的方案等于没写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">发现：告警接收</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">定位：分诊顺序</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">止损：回滚或降级</tspan></text><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">复盘：48 小时内</tspan></text></svg>"}]}, {"id": "M5U8", "tier": "adv", "step": "spar", "title": "线上事故复盘", "video": {"dur": "8min", "script": ["陪练：事故复盘追根因与监控缺口"]}, "ppt": {"method": "复盘单（时间线/根因/改进）", "case": "典型复盘记录", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "事故复盘", "persona": "追根因", "mustAsk": ["监控为什么没提前抓？", "阈值设错还是没设？", "下次怎么防？"]}, "deliverable": "监控方案（已过复盘）", "task": "把《监控方案（已过复盘）》拿到「事故复盘」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《监控方案（已过复盘）》。现在要让它通过「事故复盘」这一关。\n【对手的立场】追根因。\n【他一定会追问】「监控为什么没提前抓？」 / 「阈值设错还是没设？」 / 「下次怎么防？」\n【场景】你说「线上事故复盘」，对方立刻回一句：监控为什么没提前抓？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：事故复盘追根因", "n": "陪练场景是线上事故复盘。复盘的核心不是追责，而是找出流程缺陷。对手会逼你区分两类问题：直接原因和根本原因。直接原因是某个请求失败，根本原因是为什么没有监控到它、为什么没有止损手段、为什么这次变更没有灰度。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">复盘三层</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">直接原因</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">根本原因</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">流程缺口</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问与应答", "n": "三个高频追问。第一，为什么监控没发现，你要指出监控缺口。第二，为什么没有灰度，你要指出变更流程缺口。第三，为什么止损花了这么久，你要指出响应流程缺口。三个问题的答案都指向流程，而不是某个人。复盘中说人的地方越少， Improvement 才越有效。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">监控缺口在哪</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">变更流程缺灰度吗</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">止损路径卡在哪</tspan></text></svg>"}, {"t": "复盘产出要能落地", "n": "复盘的产出是改进项清单，每条有动作、责任人和时限，且必须闭环。只写一句加强重视的复盘等于没复盘。这个环节结束后，你的方案里会多出几项实实在在的改进，这就是它的价值。线上事故不可怕，可怕的是每次事故都白发生一次。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">改进项有动作与责任人</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有时限</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">已排入迭代</tspan></text></svg>"}]}]}, {"id": "M6", "title": "金融合规与安全下的 AI 用法", "dims": ["security"], "units": [{"id": "M6U1", "tier": "basic", "step": "understand", "title": "金融数据分级与 AI 红线", "video": {"dur": "8min", "script": ["数据三级：公开/内部/敏感（含 PII）", "AI 红线：敏感不出域、不贴 PII 到公开 AI", "最小化和脱敏原则"]}, "ppt": {"method": "数据分级图 + 红线三原则", "case": "客户信息分级示例", "demo": "分级自查卡"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】数据分级图 + 红线三原则\n【为什么重要】数据三级：公开/内部/敏感（含 PII）\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "数据三级：公开、内部、敏感", "n": "合规的起点是给数据分级，只有分好级才知道哪些能带出去。公开级可以随便用，比如行业政策和公开报道；内部级只在机构内流通，比如内部评审材料和策略规则；敏感级包含客户身份信息和交易信息，比如姓名、手机号、身份证、账户流水。三级之间不能混用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">数据三级</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">公开级</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">内部级</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">敏感级</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "红线：敏感不出域、不贴 PII", "n": "两条硬红线。第一，敏感级数据不出机构边界，不能进入任何外部大模型服务，包括免费的和按量付费的。第二，任何场景都不要粘贴包含个人信息的原始文本，哪怕对方号称不留存。原因是你无法验证服务方的留存策略，也无法承担泄露后的后果。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">敏感数据不出机构边界</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不粘贴含 PII 的原始文本</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">免费与付费一视同仁</tspan></text></svg>"}, {"t": "最小化与脱敏原则", "n": "如果必须让 AI 处理含客户信息的内容，走三步：先删，把姓名手机号地址整体删掉；再替换，用客户甲这类占位代替；最后最小化，只保留完成任务必需的结构字段。这三步做完，通常就能拿到可安全出域的文本。养成习惯比记规则更重要，因为风险几乎都发生在随手一贴的那一刻。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">脱敏三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">删除</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">替换</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">最小化</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}]}, {"id": "M6U2", "tier": "basic", "step": "demo", "title": "「安全用 AI」规范样例", "video": {"dur": "8min", "script": ["演示：给若干场景判级", "WorkBuddy 输出 安全/需脱敏/禁止 + 理由"]}, "ppt": {"method": "规范样例（场景/级别/理由）", "case": "「{{product}}」用 AI 场景判级", "demo": "WorkBuddy 演示"}, "demoScript": {"steps": ["列场景", "让 WorkBuddy 判级"], "prompt": "请对以下 AI 使用场景判级（安全/需脱敏/禁止），并给理由：①贴用户姓名给 AI 写话术 ②用脱敏字段让 AI 摘要 ③把内部风控规则贴公开 AI。"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「规范样例（场景/级别/理由）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】规范样例（场景/级别/理由）\n【参考案例】「{{product}}」用 AI 场景判级\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n请对以下 AI 使用场景判级（安全/需脱敏/禁止），并给理由：①贴用户姓名给 AI 写话术 ②用脱敏字段让 AI 摘要 ③把内部风控规则贴公开 AI", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：给若干场景判级", "n": "演示如何给场景判级。我们列了五个场景： summarize 一份公开行业报告、把客户投诉文本摘要后转给主管、把内部风控规则贴给 AI 让它优化、把脱敏后的申请字段交给模型分析、把整份含手机号的 PRD 贴给公开助手。逐个判级并说明理由。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">5 个场景逐一判级</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">公开 / 内部 / 敏感</tspan></text></g></svg>"}, {"t": "输出安全、需脱敏、禁止三档", "n": "提示词要求给每个场景判三档之一，并写明理由。它给出的结果大致是：公开报告属安全档；客户投诉文本属需脱敏档，需要先去除身份信息；内部风控规则属需脱敏档，因为规则本身含业务秘密且可能反推客户信息；脱敏后的字段属安全档；含手机号的 PRD 属禁止档。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三档判级</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">安全 / 需脱敏 / 禁止 + 理由</tspan></text></g></svg>"}, {"t": "看它的理由是否站得住", "n": "重点检查理由，而不是档位。它把内部风控规则判为需脱敏而不是禁止，理由是规则不含个人信息，这个判断是对的，因为规则本身可以脱敏使用。但它没有提示规则可能反推客户群体特征，这一层你要补。凡是涉及内部规则的场景，都要多想一步反推风险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">档位有理由</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">补充反推风险提示</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">无 PII 残留</tspan></text></svg>"}]}, {"id": "M6U3", "tier": "basic", "step": "todo", "title": "写岗位 AI 红线清单", "video": {"dur": "8min", "script": ["任务：列出本岗位 AI 场景并判级", "固化成红线清单"]}, "ppt": {"method": "清单模板（场景/级别/动作）", "case": "样例清单", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["列场景", "逐条判级", "固化清单"], "exemplar": "禁止：贴 PII 到公开 AI。需脱敏：用户对话摘要。安全：用内部脱敏数据做训练摘要。"}, "spar": null, "deliverable": "岗位 AI 红线清单", "task": "产出《岗位 AI 红线清单》：列场景；逐条判级；固化清单", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「金融合规与安全下的 AI 用法」模块，你要交付的是《岗位 AI 红线清单》。\n【场景】业务侧这周的诉求是：任务：列出本岗位 AI 场景并判级。参考做法：样例清单。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（清单模板（场景/级别/动作）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《岗位 AI 红线清单》填写模板】\n\n■ 1. 列场景\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 逐条判级\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 固化清单\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   禁止：贴 PII 到公开 AI。需脱敏：用户对话摘要。安全：用内部脱敏数据做训练摘要", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：写岗位 AI 红线清单", "n": "实操环节。为你的岗位写一份 AI 红线清单，覆盖三类场景：可以安全用 AI 的、必须脱敏后才能用的、完全禁止的。每类至少两条，每条写场景说明和判定依据。这份清单是后续合规审计的基础材料，所以要写得具体，不要写口号。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三档清单</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">安全</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">需脱敏</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">禁止</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "每条都要写场景和依据", "n": "每条写三列：场景、数据级别、依据。依据要能指向具体风险，比如客户手机号属于个人身份信息，进入外部服务即构成出域。写成一句为了安全所以谨慎，等于没写。审计时看的就是依据，因为只有可追溯的依据才能在执行中被判对错。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">场景明确到具体操作</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">标注数据级别</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">依据可追溯</tspan></text></svg>"}, {"t": "清单要能贴在工位上", "n": "清单定稿后打印或贴在协作区，同时放进入职培训材料。它的用途不是存档，而是在每个人随手一贴之前拦住他。真正有效的红线制度靠的是可见和易得，而不是厚度。清单越短越容易被遵守，控制在十条以内。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 打印张贴</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 纳入培训</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 控制在十条内</tspan></text></svg>"}]}, {"id": "M6U4", "tier": "basic", "step": "spar", "title": "合规审计", "video": {"dur": "8min", "script": ["陪练：审计挑遗漏场景"]}, "ppt": {"method": "审计单（数据/模型/外包）", "case": "典型遗漏：模型输出缓存", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "合规审计", "persona": "逐条核验", "mustAsk": ["这条覆盖模型输出缓存吗？", "跨境/外包场景写了？", "违规怎么上报？"]}, "deliverable": "红线清单（已过审计）", "task": "把《红线清单（已过审计）》拿到「合规审计」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《红线清单（已过审计）》。现在要让它通过「合规审计」这一关。\n【对手的立场】逐条核验。\n【他一定会追问】「这条覆盖模型输出缓存吗？」 / 「跨境/外包场景写了？」 / 「违规怎么上报？」\n【场景】你说「合规审计」，对方立刻回一句：这条覆盖模型输出缓存吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：审计挑遗漏场景", "n": "陪练对手是合规审计人员，他不看你的清单写得多全，只看有没有遗漏。他的典型问法是：这个场景你为什么判了安全？以及，如果有人在这个环节把内容发到群里会怎样。前者考你的依据，后者考你的边界意识。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">审计三问</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">依据在哪</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">边界在哪</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">遗漏在哪</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频问题与应答", "n": "三个高频问题。第一，你凭什么认为这个场景不含敏感信息，你要给出字段级判断。第二，有没有例外情形，比如数据量很大时是否可能反推，你要主动承认并给出约束。第三，出了事你的清单能拦住吗，你要诚实回答清单的边界。态度诚实往往比回答巧妙更让审计接受。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">字段级判断依据</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">主动承认例外并约束</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">诚实说明清单边界</tspan></text></svg>"}, {"t": "补完到放行", "n": "通过标准是清单覆盖你岗位的主要场景，且每条都有依据和例外说明。审计不会要求你一次做到完美，但会要求你把未知的地方变成已知。把这一轮补进去的条目更新进清单，这份清单会变得更实用，也可能成为部门的第一份模板。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">覆盖主要场景</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">依据与例外齐备</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">清单已更新</tspan></text></svg>"}]}, {"id": "M6U5", "tier": "adv", "step": "understand", "title": "监管报送与可解释", "video": {"dur": "8min", "script": ["监管报送的材料要求与频率", "模型可解释：特征重要性/决策依据", "算法审计要点"]}, "ppt": {"method": "报送框架（材料/频率/口径）", "case": "「{{product}}」报送清单", "demo": "可解释模板"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】报送框架（材料/频率/口径）\n【为什么重要】监管报送的材料要求与频率\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "监管报送的材料与频率", "n": "监管报送是刚性动作，材料通常包含业务数据、风控指标、模型说明和自查报告，频率按季或按年，重大事项随时报。写报送材料的最大坑是口径与内部报表不一致，监管拿到的数和你们内部看板对不上，这在检查时会被直接要求说明。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">报送四部分</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">数据</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">指标</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">模型说明</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">自查报告</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "可解释：特征重要性与决策依据", "n": "涉及模型的报送，必须能说清模型为什么这么决策。至少要给三样：主要特征及其重要性、单次决策的Top 依据、以及拒绝或通过的规则回退路径。写不出这几样，模型在监管视角里就是黑箱，而黑箱在金融场景通常等于不允许上线。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">可解释三样</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">特征重要性</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">单次决策依据</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">回退路径</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "算法审计要点", "n": "算法审计通常看四件事：样本是否代表性、特征是否有歧视性、指标是否覆盖弱势群体、以及是否有定期复检机制。四件里最容易被忽略的是第三件，因为它不会给自己带来损失，但在公平性上非常关键。提前自查一遍，比被检查时补材料轻松得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">样本代表性</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">特征无歧视性</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">弱势群体指标</tspan></text><g><circle cx=\"30\" cy=\"154.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">定期复检机制</tspan></text></svg>"}]}, {"id": "M6U6", "tier": "adv", "step": "demo", "title": "AI 辅助监管报送材料", "video": {"dur": "8min", "script": ["演示：脱敏数据→WorkBuddy 起草报送", "强调：结论由人定"]}, "ppt": {"method": "报送材料结构（摘要/数据/说明）", "case": "报送草稿样例", "demo": "WorkBuddy 演示"}, "demoScript": {"steps": ["给脱敏数据", "让 WorkBuddy 起草"], "prompt": "基于以下脱敏后的「{{product}}」运营数据，起草一份监管报送材料草稿（仅结构化整理，结论由人工定）。\n[粘贴]"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「报送材料结构（摘要/数据/说明）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】报送材料结构（摘要/数据/说明）\n【参考案例】报送草稿样例\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n基于以下脱敏后的「{{product}}」运营数据，起草一份监管报送材料草稿（仅结构化整理，结论由人工定）。 [粘贴]", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：脱敏数据起草报送材料", "n": "演示用脱敏数据起草报送材料。输入是某产品的季度运营数据，已做字段替换：不涉及客户身份，只有金额区间、笔数、通过率、逾期率这几类聚合值。这一步先做脱敏，再交给 WorkBuddy 起草，顺序不能反。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：脱敏聚合数据</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">无 PII，仅统计量</tspan></text></g></svg>"}, {"t": "结论由人定，AI 只起草", "n": "提示词要求它起草季度自查报告，格式按监管要求的目录结构，措辞客观，不夸大、不承诺、不下不实结论。它的输出可以当作初稿，但三处必须人改：所有结论性表述、所有具体承诺、所有引用数字是否与报送口径一致。AI 起草的边界就在这里，起草文字，不担责任。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">起草输出</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目录式初稿 / 措辞客观</tspan></text></g></svg>"}, {"t": "报送前的三道自检", "n": "报送前必须过三道：第一，所有数字与报送口径逐条核对；第二，所有结论性表述有依据；第三，模型说明部分是否完整，包含特征重要性。这三道走完并留痕，报送才算完成。留痕这一条看起来是形式，但在检查时它是最有价值的东西。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数字核对口径</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论有依据</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">模型说明完整</tspan></text></svg>"}]}, {"id": "M6U7", "tier": "adv", "step": "todo", "title": "出合规检查清单", "video": {"dur": "8min", "script": ["任务：覆盖 {{product}} 的合规检查清单"]}, "ppt": {"method": "清单模板（项/证据要求）", "case": "样例清单", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["列合规点", "转检查项", "附证据要求"], "exemplar": "□ 用户授权留痕 □ 模型决策可解释 □ 数据最小化 □ 审计日志开启"}, "spar": null, "deliverable": "合规检查清单", "task": "产出《合规检查清单》：列合规点；转检查项；附证据要求", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「金融合规与安全下的 AI 用法」模块，你要交付的是《合规检查清单》。\n【场景】业务侧这周的诉求是：任务：覆盖 {{product}} 的合规检查清单。参考做法：样例清单。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（清单模板（项/证据要求）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《合规检查清单》填写模板】\n\n■ 1. 列合规点\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 转检查项\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 附证据要求\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   □ 用户授权留痕 □ 模型决策可解释 □ 数据最小化 □ 审计日志开启", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：出合规检查清单", "n": "实操环节。为 {{product}} 出一份合规检查清单，覆盖至少六个检查项，每项写检查内容、判定标准和整改建议。清单要能被非合规岗位的人使用，所以判定标准必须写成人能看懂的一对一判断，而不是合规术语。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四类合规要点</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">披露</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">适当性</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">反欺诈</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">留痕</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "检查项要能答对或答错", "n": "写检查项有一条技巧：一个好的检查项应该只有两种答案，能对或不能对。比如利率是否在显著位置披露，能对或不能对；而流程是否规范就不是一个检查项，因为它无法判定。写完一遍自己念一遍，凡是念出来不知道答什么的，就改写或者删掉。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">判定标准明确</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">非合规人员可用</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">整改建议可执行</tspan></text></svg>"}, {"t": "清单要和上线节点挂钩", "n": "清单完成后，把它挂到上线前的检查节点上，明确谁在什么时点签。没有挂到节点的清单只是文档，不会被执行。金融产品上线前的合规检查通常逐项签字，这个动作的价值不在于形式，而在于把责任固定下来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 明确检查时点</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 明确签字人</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 未过不发布</tspan></text></svg>"}]}, {"id": "M6U8", "tier": "adv", "step": "spar", "title": "监管检查", "video": {"dur": "8min", "script": ["陪练：监管按条文问话"]}, "ppt": {"method": "迎检话术（依据/保障/责任）", "case": "样例问答", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "监管", "persona": "按条文问", "mustAsk": ["这条材料依据哪条法规？", "数据怎么保的？", "出问题谁负责？"]}, "deliverable": "检查清单（已过监管）", "task": "把《检查清单（已过监管）》拿到「监管」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《检查清单（已过监管）》。现在要让它通过「监管」这一关。\n【对手的立场】按条文问。\n【他一定会追问】「这条材料依据哪条法规？」 / 「数据怎么保的？」 / 「出问题谁负责？」\n【场景】你说「监管检查」，对方立刻回一句：这条材料依据哪条法规？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：监管按条文问话", "n": "陪练对手扮演监管检查人员，他按条文逐条问，问完不给中间评价。他的特点是不接受解释，只要求你指到具体条款和具体证据。凡是回答我们一直这么做的，都会被追问是否有制度依据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">检查三要素</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">条文</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">证据</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">制度</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频条文问答", "n": "三个高频问题。第一，利率与费用是否在申请环节显著披露，你要能指出页面位置和留存截图。第二，是否做了适当性评估，你要给出评估规则和例外处理。第三，模型决策是否可解释，你要给出单次决策依据的展示位置。三个问题都要指到具体位置，不能只说我们有制度。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">指到页面位置与截图</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">给出评估规则与例外</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">给出依据展示路径</tspan></text></svg>"}, {"t": "答不上来就当场记录", "n": "陪练环节里答不上来的问题会被记录在案，对应的是检查发现。回去补完之后再来过一遍。这种被当场记录的压力是真实的，但也正因如此，检查前的自查才有意义。真正准备好的人，问什么都能指到地方，那份笃定是练出来的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条都有制度依据</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条都有证据位置</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">缺口已整改</tspan></text></svg>"}]}]}, {"id": "M7", "title": "综合实战：从 0 到 1 设计金融产品", "dims": ["prompt", "tools", "data", "content", "dev", "workflow", "security", "strategy"], "units": [{"id": "M7U1", "tier": "basic", "step": "understand", "title": "0→1 金融产品方法论", "video": {"dur": "8min", "script": ["0→1 五步：机会→立项→PRD→上线→复盘", "每步的关键交付物回顾", "AI 在各步的杠杆点"]}, "ppt": {"method": "方法论图（五步 + 交付物）", "case": "信贷产品从 0 到 1 路径", "demo": "步骤检查表"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】方法论图（五步 + 交付物）\n【为什么重要】0→1 五步：机会→立项→PRD→上线→复盘\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "0 到 1 的五步", "n": "综合实战这一模块，我们把前面的内容串起来。从零到一设计一款金融产品分五步：找机会、做立项、写 PRD、上线的闭环、事后复盘。每步都有明确的交付物，下一步的输入就是上一步的交付物，中间不能跳步，跳步会在后面以更高的代价还回来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五步路径</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">机会</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">立项</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">PRD</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">上线</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">复盘</tspan></text></g></svg>"}, {"t": "每步的关键交付物", "n": "五步的交付物分别是：机会说明、立项材料、PRD 与验收、上线检查清单与监控、复盘报告。任何一步缺交付物，后面的步骤都会返工。判断自己有没有走完一步，只看交付物是否存在且能被别人看懂，不看自己是不是想过了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">机会说明可评审</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">PRD 含风控与埋点</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">复盘有改进项</tspan></text></svg>"}, {"t": "AI 在各步的杠杆点", "n": "AI 在五步里的杠杆点分别是：机会阶段做竞品扫描与政策解读，立项阶段生成一页纸方案，PRD 阶段扩骨架并补埋点，上线阶段起草监控与检查清单，复盘阶段整理事故与改进项。同样是 AI，用在哪一步决定了他是在提效还是在制造返工。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五步杠杆点</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">扫描</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">一页纸</tspan></text></g><g class=\"hl\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">PRD 骨架</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">清单</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">复盘</tspan></text></g></svg>"}]}, {"id": "M7U2", "tier": "basic", "step": "demo", "title": "模拟产品立项到 PRD 全流程", "video": {"dur": "8min", "script": ["演示：串起前面模块产出", "WorkBuddy 整合为简版方案"]}, "ppt": {"method": "全流程图（模块→产出映射）", "case": "「{{product}}」全流程", "demo": "WorkBuddy 演示"}, "demoScript": {"steps": ["选场景", "串联产出"], "prompt": "请把以下「{{product}}」从机会识别到 PRD 串成一份简版方案，复用前面模块的方法。\n[粘贴要点]"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「全流程图（模块→产出映射）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】全流程图（模块→产出映射）\n【参考案例】「{{product}}」全流程\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n请把以下「{{product}}」从机会识别到 PRD 串成一份简版方案，复用前面模块的方法。 [粘贴要点]", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：串起全流程", "n": "演示把前面模块的产出串成一条线：先用竞品扫描找到 {{product}} 赛道的机会，用一页纸立项，再用 PRD 模板产出最小版本，补齐风控与埋点，最后起草上线检查清单和监控方案。每一步都复用前面沉淀的模板，而不是重新开始。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：前面模块全部产出</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：一条完整链</tspan></text></g></svg>"}, {"t": "让 WorkBuddy 整合为简版方案", "n": "提示词要求它按立项材料的结构整合，输出四块：市场机会、目标与范围、风控要点、上线检查项。它给出的输出可读性不错，但有三处要你补：数字口径、责任人和时间节点。凡是属于组织的约束，AI 一律给不出，只能由你来填。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">整合输出</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">机会 / 范围 / 风控 / 检查项</tspan></text></g></svg>"}, {"t": "整合不是拼接，是取舍", "n": "整合这一步真正的难度不在格式，而在取舍：哪些机会放进本期，哪些放弃，哪些观察。取舍要连理由一起写，因为三个月后有人会问为什么当时没做。这个动作能让你的方案显得清醒，而不是像一份许愿清单。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">取舍有理由</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">本期范围已封口</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">观察项已列出</tspan></text></svg>"}]}, {"id": "M7U3", "tier": "basic", "step": "todo", "title": "交付最小产品方案", "video": {"dur": "8min", "script": ["任务：定位+PRD+指标成方案"]}, "ppt": {"method": "方案模板（定位/PRD/指标）", "case": "样例最小方案", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["写定位", "出最小 PRD", "定指标"], "exemplar": "定位：年轻客群小额周转。PRD：申请+风控预筛+额度。指标：3 分钟出额、通过率≥30%。"}, "spar": null, "deliverable": "最小产品方案", "task": "产出《最小产品方案》：写定位；出最小 PRD；定指标", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「综合实战：从 0 到 1 设计金融产品」模块，你要交付的是《最小产品方案》。\n【场景】业务侧这周的诉求是：任务：定位+PRD+指标成方案。参考做法：样例最小方案。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（方案模板（定位/PRD/指标）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《最小产品方案》填写模板】\n\n■ 1. 写定位\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 出最小 PRD\n   ‣ 提示：按「结论 → 依据 → 行动」三段写。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 定指标\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   定位：年轻客群小额周转。PRD：申请+风控预筛+额度。指标：3 分钟出额、通过率≥30%", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：交付最小产品方案", "n": "实操环节。交付一份最小产品方案，包含定位、PRD 要点、核心指标三块。定位写清楚给谁解决什么问题、与现有方案的区别；PRD 要点用六段式；核心指标一项北极星加两个护栏。三块都能在十分钟内讲完，说明它是最小版本。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">方案三块</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#
