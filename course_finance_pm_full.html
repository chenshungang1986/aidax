<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融 × 产品经理 AI 实战 · 完整学习课程（M0–M7 · 64 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7}
  header{padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:700}
  header h1 span{font-size:12px;font-weight:500;color:var(--mut);margin-left:8px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;height:calc(100vh - 62px)}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center;background:#fbfcff}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  .vp .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#eaf0ff}
  .slide.on{display:flex}
  .slide h4{font-size:16px;margin:0 0 6px;color:#fff;flex:none}
  .slide svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.72) 55%,rgba(0,0,0,0) 100%);color:#fff;font-size:19px;font-weight:500;line-height:1.5;padding:20px 28px 16px;min-height:70px;display:block;text-align:center;letter-spacing:.4px;text-shadow:0 2px 6px rgba(0,0,0,.95)}
  .dots{position:absolute;top:11px;left:0;right:0;display:flex;gap:6px;justify-content:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
  .dots i.on{background:#fff}
  .vbar{display:flex;align-items:center;gap:12px;margin-top:9px}
  .play{background:var(--blue);color:#fff;border:none;padding:8px 17px;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600;white-space:nowrap}
  .seek{flex:1;height:8px;border-radius:6px;background:#e4eaf7;position:relative;cursor:pointer}
  .seek .fill{height:100%;background:var(--blue);border-radius:6px;width:0}
  .seek .knob{position:absolute;top:-4px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-left:-7px;left:0}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .aud-note{font-size:12px;color:var(--mut);margin-top:5px}
  textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;background:#fcfdff}
  input.tin{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fcfdff}
  .btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:13.2px;margin:6px 6px 0 0}
  .btn.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
  .btn.ok{background:var(--green)}
  .btn[disabled]{background:#c9d3e6;cursor:not-allowed;border-color:#c9d3e6;color:#fff}
  .wb{background:#0e1530;color:#dce6ff;border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;line-height:1.7}
  .wb .me{color:#ffd98a}.wb .ai{color:#9be8b0}.wb .hl-line{color:#fff;font-weight:600}
  .chat{display:flex;flex-direction:column;gap:9px;margin:6px 0}
  .bub{max-width:82%;padding:9px 12px;border-radius:11px;font-size:13.3px;white-space:pre-wrap}
  .bub.ai{background:#eef4ff;color:var(--blue-d);align-self:flex-start}
  .bub.me{background:var(--blue);color:#fff;align-self:flex-end}
  .bub.sys{background:#f1f4fa;color:var(--mut);align-self:center;font-size:12px;max-width:100%}
  .qs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .qbtn{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.4px;cursor:pointer}
  .qbtn:hover{border-color:var(--blue);color:var(--blue)}
  .done-card{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:18px;text-align:center}
  .done-card h3{font-size:19px;color:#166534;margin-bottom:4px}
  .cp-score{font-size:30px;font-weight:800;color:#16a34a;margin:6px 0}
  .tag-done{display:inline-block;background:var(--green);color:#fff;font-size:12px;padding:1px 9px;border-radius:20px;margin-left:6px}
  /* 题干 / 模板 / 评分 */
  .ip{border-left:4px solid var(--blue)}
  .ip-task{font-size:14.5px;font-weight:700;margin:2px 0 8px;color:var(--txt)}
  .brief{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.1px;white-space:pre-wrap;line-height:1.78;color:#28345a}
  .tpl{background:#0e1530;color:#d7e3ff;border-radius:11px;padding:13px 15px;font-size:12.6px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  details>summary{cursor:pointer;font-size:13.3px;color:var(--blue-d);font-weight:600;margin:10px 0 6px;list-style:none;display:flex;align-items:center;gap:6px}
  details>summary::-webkit-details-marker{display:none}
  details>summary:before{content:"\25B8";transition:transform .15s;display:inline-block}
  details[open]>summary:before{transform:rotate(90deg)}
  .rub{list-style:none;font-size:13px;color:var(--mut);margin:4px 0}
  .rub li{padding:2px 0 2px 20px;position:relative}
  .rub li:before{content:"\25CB";position:absolute;left:2px;color:#c3ccdf}
  .rub li.ok{color:#166534}
  .rub li.ok:before{content:"\25CF";color:var(--green)}
  .rub li span.hint{color:#b4682a;font-size:12px}
  .bar{height:9px;background:#e4eaf7;border-radius:6px;overflow:hidden;margin:7px 0 3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1a5cff,#4d8bff);transition:width .3s}
  /* 测验 */
  .qz-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:9px 0;background:#fff}
  .qz-item .q{font-size:13.8px;font-weight:600;margin-bottom:7px}
  .qz-item .op{padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13.2px;border:1px solid transparent}
  .qz-item .op:hover{background:#f5f8ff}
  .qz-item .op.right{background:var(--green-bg);color:#166534;border-color:#86efac}
  .qz-item .op.wrong{background:#fff1f2;color:#be123c;border-color:#fecdd3}
  .qz-item .tip{font-size:12.5px;color:var(--mut);display:none;margin-top:6px}
  .modal{position:fixed;inset:0;background:rgba(8,16,40,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:16px;padding:24px 26px;max-width:520px;width:100%;text-align:center;max-height:86vh;overflow-y:auto;position:relative}
  .modal .box h3{font-size:19px;margin-bottom:4px;color:var(--txt)}
  .modal .box p{font-size:13.4px;color:var(--mut);margin:6px 0 14px}
  .modal .box .acts{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .mclose{position:absolute;top:10px;right:14px;font-size:18px;color:var(--mut);cursor:pointer}
  .fm{text-align:left;font-size:13px}
  .fm label{display:block;font-size:12.6px;color:var(--mut);margin:10px 0 4px}
  .fm .note{font-size:12.2px;color:var(--mut);background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;line-height:1.7}
  .fm code{background:#eef2fb;border-radius:4px;padding:1px 5px;font-size:12px}
  @media(max-width:860px){.layout{flex-direction:column}.sidebar{width:100%;max-height:36vh;border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>金融 × 产品经理 AI 实战<span>完整学习课程 M0–M7 · 64 单元</span></h1>
  <div class="scn">
    <label>行业</label><input id="cfg-industry">
    <label>机构</label><input id="cfg-company">
    <label>产品</label><input id="cfg-product">
    <button onclick="applyCustom()">应用</button>
  </div>
  <div class="llm" id="llm-badge" onclick="openLlm()"><i></i><span id="llm-text">模型未检测</span></div>
  <div class="prog">已完成 <b id="prog-done">0</b> / 64 单元 · 模块测验通过 <b id="prog-quiz">0</b> / 8 · <b id="prog-pct">0%</b></div>
  <button id="admin-toggle" class="admin-toggle" onclick="toggleAdmin()">管理员预览：关</button>
</header>
<div id="admin-banner" class="admin-banner" style="display:none">🔓 管理员预览模式已开启：可直接观看全部 64 单元视频，练习 / 陪练 / 测验均为可选，无需完成即可标记已观看。</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="quiz-modal"><div class="box" id="quiz-box"></div></div>
<div class="modal" id="llm-modal"><div class="box fm" id="llm-box"></div></div>

<script>
/* ===================== 课程数据（构建时注入） ===================== */
const COURSE = {"id": "fin_pm", "role": "pm", "customization": {"industry": "消费金融", "company": "模拟银行 X", "product": "闪电贷"}, "modules": [{"id": "M0", "title": "导论：金融 PM 的 AI 机会与红线", "dims": ["strategy", "security"], "units": [{"id": "M0U1", "tier": "basic", "step": "understand", "title": "金融 PM 的 6 类 AI 机会与 3 条红线", "video": {"dur": "8min", "script": ["开场：为什么金融 PM 是 AI 落地最关键的角色之一（既要懂业务又要懂做产品）", "6 类机会：洞察/研究/设计/分析/协同/合规，逐一对应日常痛点", "3 条红线：数据不出域、不替人决策、可解释可追溯 —— 任何 AI 用法都不能越过"]}, "ppt": {"method": "六类机会矩阵图 + 红线三原则清单（每张机会卡标注\"AI 能帮/人要把关\"）", "case": "某消费金融团队用 AI 把竞品监控周期从 2 周压到 1 天", "demo": "红线对照卡：把\"贴客户数据进公开 AI\"标记为高危"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】六类机会矩阵图 + 红线三原则清单（每张机会卡标注\"AI 能帮/人要把关\"）\n【为什么重要】开场：为什么金融 PM 是 AI 落地最关键的角色之一（既要懂业务又要懂做产品）\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "开场：金融 PM 为什么是关键角色", "n": "先说一个事实：金融行业里，最懂业务痛点、也最需要把方案落到系统上的人，往往就是产品经理。你既听得懂风控的口径，也讲得清用户的诉求。所以 AI 在金融机构落地时，最先产生价值的地方往往不是后台系统，而是你的日常产出。这一节我们不谈概念，只谈两件事：AI 到底能替你在哪几个环节干活，以及哪三条线你绝对不能踩。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">金融 PM 的位置</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">懂业务</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">懂产品</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">能落地</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "六类 AI 机会：逐条对应日常痛点", "n": "我把 PM 的工作拆成六类机会。第一类是洞察，比如竞品动向、政策变化；第二类是研究，比如把访谈录音变成结构化需求；第三类是设计，比如快速出原型描摹和文案；第四类是分析，比如把数据变成一句话结论；第五类是协同，比如会议纪要与任务拆分；第六类是合规，比如条款比对与红线自查。你会发现，这六件事加起来，占掉了你百分之六十以上的时间。AI 的杠杆就在这六处。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六类 AI 机会</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">洞察</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">研究</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">设计</tspan></text></g><g class=\"hl\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">分析</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">协同</tspan></text></g><g><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">合规</tspan></text></g></svg>"}, {"t": "三条红线：越线就别上线", "n": "红线只有三条，但每一条都硬。第一条，数据不出域，敏感客户信息不能贴到公开的大模型里；第二条，不替人决策，授信、定价这类判断的最终责任人必须写清楚是人；第三条，可解释可追溯，AI 给出的结论要能说清依据、也能回放过程。这三条不是限制，而是你能长期用 AI 的前提。守住它，你才谈得上提效。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据不出域，敏感信息不进公开模型</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替人决策，责任主体写清楚</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">可解释可追溯，依据与过程能回放</tspan></text></svg>"}]}, {"id": "M0U2", "tier": "basic", "step": "demo", "title": "同一需求：踩红线 vs 守红线", "video": {"dur": "8min", "script": ["演示准备：一份含客户信息的产品需求", "踩红线：整段粘贴到公开大模型 → 演示数据泄露风险", "守红线：本地脱敏 + 仅给结构化字段 → 安全拿到 AI 辅助"]}, "ppt": {"method": "红线判定三步法（识别敏感/脱敏/最小化）", "case": "需求文档脱敏前后对比示例（姓名/手机号/身份证 → 字段占位）", "demo": "WorkBuddy 脱敏操作截图位（粘贴→AI 返回脱敏版）"}, "demoScript": {"steps": ["打开 WorkBuddy，新建会话", "粘贴「{{product}} 产品需求（已脱敏字段）」", "输入提示词要求 AI 仅基于给定字段给建议"], "prompt": "你是金融产品经理的 AI 助手。以下是「{{product}}」已脱敏的产品需求字段：\n[粘贴脱敏后的需求]\n请仅基于以上字段，给出 3 条产品优化建议，不得要求补充任何敏感个人信息。"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「红线判定三步法（识别敏感/脱敏/最小化）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】红线判定三步法（识别敏感/脱敏/最小化）\n【参考案例】需求文档脱敏前后对比示例（姓名/手机号/身份证 → 字段占位）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是金融产品经理的 AI 助手。以下是「{{product}}」已脱敏的产品需求字段： [粘贴脱敏后的需求] 请仅基于以上字段，给出 3 条产品优化建议，不得要求补充任何敏感个人信息", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示准备：一份含客户信息的需求", "n": "我们开始演示。手上有一份「{{product}}」的产品需求，里面有客户姓名、手机号、行政区划，还有一句身份证字段说明。在做任何 AI 操作之前，先看一眼它属于什么级别的数据。这一步是习惯，不是形式。很多风险不是因为AI不可靠，而是因为人随手就把东西贴出去了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示数据预览</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">原始需求片段</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">客户姓名：张某某  手机：138****</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">所属机构：{{company}}</tspan></text></g></svg>"}, {"t": "踩红线：整段粘贴到公开大模型", "n": "现在模拟一个最常见的错误操作：把整段需求，连同客户姓名和手机号，一起粘贴到公开的聊天窗口里。你会看到它确实能给出很漂亮的回答，效率看起来很高。但代价是，这些数据已经离开了你的机构边界，进入了第三方。金融行业里，这一条通常直接对应监管处罚，而不是内部批评。便利和风险在这里是成正比放大的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩红线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">风险</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">整段贴入公开模型</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">答得漂亮、风险留在门外</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">敏感字段随文本一起出域</tspan></text></g></svg>"}, {"t": "守红线：脱敏 + 只给结构化字段", "n": "换个做法。先把姓名换成客户甲，手机号去掉中间四位，只保留结构字段：产品类型、申请金额区间、审批规则要点、当前转化率。然后用这条提示词请 AI 基于给定字段给出建议，并明确要求它不得索取任何个人信息。同样拿到了可用的建议，数据却没有任何出域。这就是守红线的完整手法：脱敏、最小化、显式约束，三步缺一不可。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">守红线三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">脱敏</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">最小化字段</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">提示词显式约束</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}]}, {"id": "M0U3", "tier": "basic", "step": "todo", "title": "画一张你的 AI 提效地图", "video": {"dur": "8min", "script": ["任务说明：把你岗位的高频工作列出来", "给每项标注：能否用 AI、用在哪一步、是否触红线", "产出一张可分享的提效地图"]}, "ppt": {"method": "提效地图模板（工作项 / AI 切入点 / 红线标注）", "case": "「{{product}}」团队提效地图样例（8 项工作 × 三列）", "demo": "地图填写操作指引（先列工作再标 AI 点）"}, "demoScript": null, "practice": {"steps": ["列出你本周 8 项主要工作", "对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线", "用模板汇成一张地图"], "exemplar": "工作项：竞品周报｜AI 切入：自动汇总公开信息并摘要｜红线：仅用公开来源，不贴内部数据\n工作项：需求评审｜AI 切入：预读 PRD 提 3 个漏洞｜红线：不涉及客户 PII"}, "spar": null, "deliverable": "个人 AI 提效地图", "task": "产出《个人 AI 提效地图》：列出你本周 8 项主要工作；对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线；用模板汇成一张地图", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「导论：金融 PM 的 AI 机会与红线」模块，你要交付的是《个人 AI 提效地图》。\n【场景】业务侧这周的诉求是：任务说明：把你岗位的高频工作列出来。参考做法：「{{product}}」团队提效地图样例（8 项工作 × 三列）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提效地图模板（工作项 / AI 切入点 / 红线标注）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《个人 AI 提效地图》填写模板】\n\n■ 1. 列出你本周 8 项主要工作\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 对每项填：AI 能帮哪一步 / 用什么工具 / 是否触红线\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 用模板汇成一张地图\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   工作项：竞品周报｜AI 切入：自动汇总公开信息并摘要｜红线：仅用公开来源，不贴内部数据 工作项：需求评审｜AI 切入：预读 PRD 提 3 个漏洞｜红线：不涉及客户 PII", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务说明：画出你自己的提效地图", "n": "这一节是实操。请你打开空白文档，把你本周做过的所有工作列出来，尽量列到八项以上，包括写需求、跑数据、开会、对文档这些平时被看作日常琐事的部分。不要先判断哪个能用 AI，先把事实列全。列不全，后面的地图就是空谈，这是很多人做提效方案失败的第一步。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列出本周 8 项主要工作</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 每一项标注三列</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 汇成一张可分享的地图</tspan></text></svg>"}, {"t": "三项标注：能不能、用在哪、是否触红线", "n": "每一行填三列。第一列，这项工作能不能用 AI；第二列，如果可以，用在哪一步，是读材料、整理格式，还是生成初稿；第三列，这一步是否触红线，涉及客户信息、是否影响授信决策。第三列最容易被跳过，却是最重要的那一列。判定标准很简单：只要这一步的数据可能来自真实客户，就要先按敏感处理。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每行填三列</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">能否用 AI</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">用在哪一步</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">是否触红线</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "产出与分享：一张图胜过一页汇报", "n": "最后把地图整理成一页，发给你的直属主管。目的有两个：一是让主管看到你已经在用系统性方法提效，二是让部门能把个人经验沉淀成团队规范。注意地图里至少要有一项标注为红线未通过，这反而会让你显得更可信。一份全是绿灯的提效方案，通常意味着写它的人根本没想过风险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">工作项不少于 8 项</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项都有用 AI 的具体环节</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">至少一项明确标注风险判定</tspan></text></svg>"}]}, {"id": "M0U4", "tier": "basic", "step": "spar", "title": "合规官挑战你的提效地图", "video": {"dur": "8min", "script": ["陪练说明：合规官会挑你地图里越过红线的点", "目标：把每条红线标注补全，让合规官放行"]}, "ppt": {"method": "合规挑战清单（数据/决策/可追溯）", "case": "典型越线写法 vs 合规写法（贴 PII vs 脱敏字段）", "demo": "陪练对话界面说明（在 WorkBuddy 内粘贴系统提示词）"}, "demoScript": null, "practice": null, "spar": {"role": "合规官", "persona": "严谨、只认制度，追问数据来源与可追溯性", "mustAsk": ["这项 AI 用法涉及的数据是否可能包含客户个人信息？", "如果 AI 给了错误建议，责任与可追溯链条怎么定？", "有无\"人最终决策\"的卡点？"]}, "deliverable": "个人 AI 提效地图（已通过合规挑战）", "task": "把《个人 AI 提效地图（已通过合规挑战）》拿到「合规官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《个人 AI 提效地图（已通过合规挑战）》。现在要让它通过「合规官」这一关。\n【对手的立场】严谨、只认制度，追问数据来源与可追溯性。\n【他一定会追问】「这项 AI 用法涉及的数据是否可能包含客户个人信息？」 / 「如果 AI 给了错误建议，责任与可追溯链条怎么定？」 / 「有无\"人最终决策\"的卡点？」\n【场景】你说「合规官挑战你的提效地图」，对方立刻回一句：这项 AI 用法涉及的数据是否可能包含客户个人信息？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：合规官会挑你的地图", "n": "接下来进入陪练。你的对手是合规官，他的职责不是让你过，而是找出你地图里越过红线的点。他会按数据、决策、可追溯三个维度逐一追问。你不需要准备得很完美，但需要准备好一条：被问到数据来源时，必须能说清楚它从哪来、有没有脱敏。这一问通常就决定了成败。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合规官的追问框架</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">数据来源</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">决策归属</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可追溯</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "他会问什么：三个高频问题", "n": "这里先剧透三个高频问题。第一，这项 AI 用法涉及的数据是否可能包含客户个人信息？第二，如果 AI 给了错误建议，责任和可追溯链条怎么定？第三，有没有人最终决策的卡点？把这三个问题的答案提前写在你地图的备注里，陪练时你就不会被问倒。提前准备答案，比现场 improvisation 靠谱得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">涉及的数据是否含客户个人信息</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">AI 出错时的责任与追溯链条</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">有没有人最终决策的卡点</tspan></text></svg>"}, {"t": "通过标准：三条都答上才放行", "n": "放行的标准很明确：数据来源能说清、责任主体到人、AI 输出只做辅助不做终裁。陪练里如果你的答案被判定为通过，就可以获得放行标记；如果答不上来，系统会让你回去补。补的这个过程本身就是学习，比听十遍课有用。目标是拿到一张通过合规挑战的地图，而不是让陪练说好话。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据来源说清</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任主体到人</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">AI 输出仅作辅助</tspan></text></svg>"}]}, {"id": "M0U5", "tier": "adv", "step": "understand", "title": "组织级 AI 落地路线与治理", "video": {"dur": "8min", "script": ["从个人提效到团队落地：试点→推广→治理", "ROI 怎么度量（效率/质量/风险三类指标）", "人机协同治理：谁定规则、谁审计"]}, "ppt": {"method": "落地三阶段路线图 + 治理三角（规则/审计/问责）", "case": "某银行 AI 提效治理框架（三层委员会）", "demo": "治理机制清单模板（数据/模型/输出三层）"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】落地三阶段路线图 + 治理三角（规则/审计/问责）\n【为什么重要】从个人提效到团队落地：试点→推广→治理\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "从个人提效到组织落地", "n": "前四个单元讲的是个人。但真正拉开车队差距的是组织级落地，它有三个阶段：试点、推广、治理。试点阶段只选一到两个场景，把成败标准定死；推广阶段把有效打法固化成模板和提示词库；治理阶段建立规则、审计和问责机制。跳过试点直接推广，几乎是必然失败。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">组织落地三阶段</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">试点</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">推广</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">治理</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "ROI 怎么度量：三类指标", "n": "老板问投入产出，你需要三类指标。效率类，比如原来两周的竞品监控现在多久；质量类，比如 PRD 一次性通过率提升了多少；风险类，比如合规拦截次数、数据事件数。三类都要有数字，因为只报效率会显得片面，只报风险又会显得没产出。三张卡片摆在桌上，汇报时才站得住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">ROI 三类指标</tspan></text><text x=\"24.0\" y=\"61.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">效率：监控周期</tspan></text><rect x=\"150\" y=\"51\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g class=\"hl\"><rect x=\"150\" y=\"51\" width=\"172.2\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"314.2\" y=\"64\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">2周 → 1天</text></g><text x=\"24.0\" y=\"101.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">质量：一次通过率</tspan></text><rect x=\"150\" y=\"91\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"91\" width=\"130.2\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"272.2\" y=\"104\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">+18%</text></g><text x=\"24.0\" y=\"141.0\" font-size=\"12.0\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"24.0\">风险：合规拦截</tspan></text><rect x=\"150\" y=\"131\" width=\"210\" height=\"16\" rx=\"8\" fill=\"#0f1a3a\"/><g><rect x=\"150\" y=\"131\" width=\"63.0\" height=\"16\" rx=\"8\" fill=\"#1a5cff\"/><text x=\"205.0\" y=\"144\" font-size=\"11\" fill=\"#fff\" text-anchor=\"end\">7 起</text></g></svg>"}, {"t": "人机协同治理：谁定规则，谁审计", "n": "治理要解决三个问题：规则谁定、输出谁审、出问题谁负责。建议的最小配置是：一个跨部门小组定红线，一个角色做输出抽检，每个决策点都写明最终责任人。没有这三件事，AI 用得越久，组织越混乱。记住一个经验规则：凡是能被写降低风险规则的环节，最先做治理，而不是等出事后补丁。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">治理三角</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">规则：谁定</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">审计：谁检</tspan></text></g><g class=\"hl\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"121.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">问责：谁担</tspan></text></g></svg>"}]}, {"id": "M0U6", "tier": "adv", "step": "demo", "title": "模拟银行 PM 团队提效方案", "video": {"dur": "8min", "script": ["演示：把 M0U3 的个人地图合并成团队方案", "加入治理机制与试点节奏"]}, "ppt": {"method": "团队提效方案结构（机会/路线/治理）", "case": "「{{company}}」PM 团队方案节选（脱敏）", "demo": "WorkBuddy 生成团队方案演示（粘贴 3 份个人地图）"}, "demoScript": {"steps": ["汇总 3 份个人提效地图", "让 WorkBuddy 归纳共性机会与风险", "补治理机制与试点排期"], "prompt": "以下是 3 位「{{product}}」产品经理的 AI 提效地图摘要：\n[粘贴]\n请归纳共性机会、共性风险，并给出试点排期与治理机制建议，输出一页团队方案。"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「团队提效方案结构（机会/路线/治理）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】团队提效方案结构（机会/路线/治理）\n【参考案例】「{{company}}」PM 团队方案节选（脱敏）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是 3 位「{{product}}」产品经理的 AI 提效地图摘要： [粘贴] 请归纳共性机会、共性风险，并给出试点排期与治理机制建议，输出一页团队方案", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：把三份个人地图合成团队方案", "n": "这一节演示如何把三个人的地图合并成一份团队方案。我们准备三份匿名地图，分别来自信贷、风控和运营岗。合并时不要简单相加，先找共性机会，也就是三个人都认同、且能做在同一处的高价值动作，这类动作收益最大。再把重复项合并，把冲突项单独列出。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">输入：三份地图</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">03 份个人地图</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">共性机会 · 重复项 · 冲突项</tspan></text></g></svg>"}, {"t": "让 WorkBuddy 归纳与排期", "n": "把三份摘要贴进 WorkBuddy，提示词要求它做四件事：归纳共性机会、合并重复项、标出风险冲突项、给出试点排期。它会输出一页团队方案。注意看它给出的排期是否按收益和风险排序，如果它按输入顺序排，说明提示词里没写约束，你需要补上\"按收益风险排序\"这一句。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">提示词输出</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">共性机会 / 重复项 / 风险 / 排期</tspan></text></g></svg>"}, {"t": "补上治理机制，方案才完整", "n": "AI 给的是骨架，人补的是治理。团队方案最后必须有三块：红线条款、抽检机制、责任人清单。缺这三块，方案在评审时会直接被打回，因为评审问的从来不是效率有多少，出事谁负责。这一步不需要多复杂，但必须是人写，而且写清楚。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">红线条款明确</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">抽检机制到人</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任人清单齐备</tspan></text></svg>"}]}, {"id": "M0U7", "tier": "adv", "step": "todo", "title": "写一页部门 AI 规划", "video": {"dur": "8min", "script": ["任务：站部门负责人视角输出一页纸", "含机会 / 路线 / 风险三块"]}, "ppt": {"method": "一页纸规划模板（机会/路线/风险）", "case": "规划样例（脱敏）：3 机会 + 季度路线 + 3 风险", "demo": "填写指引（先机会后风险）"}, "demoScript": null, "practice": {"steps": ["选 3 个最高价值机会", "写试点路线（季度）", "列 3 类风险与对策"], "exemplar": "机会：竞品监控自动化、PRD 智能初稿、监管简报摘要\n路线：Q1 试点 PRD 初稿→Q2 推广→Q3 治理固化\n风险：数据泄露(脱敏)、幻觉(人审)、合规(红线条款)"}, "spar": null, "deliverable": "部门 AI 规划一页纸", "task": "产出《部门 AI 规划一页纸》：选 3 个最高价值机会；写试点路线（季度）；列 3 类风险与对策", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「导论：金融 PM 的 AI 机会与红线」模块，你要交付的是《部门 AI 规划一页纸》。\n【场景】业务侧这周的诉求是：任务：站部门负责人视角输出一页纸。参考做法：规划样例（脱敏）：3 机会 + 季度路线 + 3 风险。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（一页纸规划模板（机会/路线/风险）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《部门 AI 规划一页纸》填写模板】\n\n■ 1. 选 3 个最高价值机会\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写试点路线（季度）\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 列 3 类风险与对策\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   机会：竞品监控自动化、PRD 智能初稿、监管简报摘要 路线：Q1 试点 PRD 初稿→Q2 推广→Q3 治理固化 风险：数据泄露(脱敏)、幻觉(人审)、合规(红线条款)", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：站部门负责人视角写一页", "n": "这次角色互换，你是部门负责人，要向更高层汇报。一页纸，只放三块：机会、路线、风险。关键在于取舍，你只能挑三个最高价值的机会，那些想放进去却放不下的，就明确写进观察清单。一页纸里什么都有的方案，等于什么都没说。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">挑 3 个最高价值机会</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">写季度试点路线</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">列 3 类风险与对策</tspan></text></svg>"}, {"t": "机会怎么写：带数字才有分量", "n": "每个机会的写法固定为公式：场景加现状痛点加预期收益加依据。比如竞品监控周期现状两周，预期压到一天，依据是我们已验证过一次。凡是写不出依据的机会，都只是想法。评审最反感的是那种听起来很美、但没有一条Evidence的机会。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">机会四段式</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">场景</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">现状痛点</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">预期收益</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">依据</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "风险怎么写：三类风险配对策", "n": "风险只写三类：数据泄露、结论失真、合规越界。每一类后面必须跟一个具体对策，比如数据泄露对应脱敏流程，结论失真对应人工抽检。写风险不是为了显得谨慎，而是让决策层看到你已经想清楚最坏情况。没有对策的风险描述，会被直接理解为没想清楚。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据泄露 → 脱敏与最小字段</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论失真 → 人工抽检与留痕</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">合规越界 → 红线清单与审批</tspan></text></svg>"}]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "高管答辩：追问 ROI 与风险", "video": {"dur": "8min", "script": ["陪练说明：高管只关心 ROI、战略对齐、风险", "被问倒就回去补，直到放行"]}, "ppt": {"method": "高管答辩高频问题清单（ROI/战略/风险）", "case": "高分回答 vs 低分回答对照", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "高管", "persona": "结果导向、不耐烦、逼你算清账", "mustAsk": ["这事的 ROI 怎么算、多久回本？", "和部门战略哪条对齐？", "最坏风险是什么、你准备怎么兜？"]}, "deliverable": "部门 AI 规划一页纸（已通过答辩）", "task": "把《部门 AI 规划一页纸（已通过答辩）》拿到「高管」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《部门 AI 规划一页纸（已通过答辩）》。现在要让它通过「高管」这一关。\n【对手的立场】结果导向、不耐烦、逼你算清账。\n【他一定会追问】「这事的 ROI 怎么算、多久回本？」 / 「和部门战略哪条对齐？」 / 「最坏风险是什么、你准备怎么兜？」\n【场景】你说「高管答辩：追问 ROI 与风险」，对方立刻回一句：这事的 ROI 怎么算、多久回本？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：高管只问三件事", "n": "高管不看过程，只看结果。他关心的只有三件事：这事的投入产出怎么算、和部门战略哪一条对齐、最坏的风险是什么。你的回答要短，先给结论再给理由。超过三句话还没说清重点，高管就会打断你，而打断之后你很难再拿回节奏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">高管关注点</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">ROI 怎么算</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">和战略哪条对齐</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">最坏风险</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问与应答示范", "n": "这里给三个高频追问和应答示范。追问一，多久回本，你可以回答试点周期一个季度，若达预期则全年推广，测算依据是两项节省的人工工时。追问二，战略对齐，回答对应部门年度降本增效目标中的第二项。追问三，最坏风险，回答是模型给出偏误结论，对策是人工终裁加抽检。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">多久回本 + 测算依据</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">对应战略第几条</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">最坏风险 + 兜底对策</tspan></text></svg>"}, {"t": "被问倒就补，直到放行", "n": "陪练环节里，高管会连续追问，直到你说服他或者被问倒。被问倒不丢人，回去补数据再来是标准动作。真正要避免的是同一类问题反复答错，那说明你的方案本身没想清楚。目标是拿到高管的口头放行，这比任何文档都重要。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">先给结论再给理由</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每个结论都有测算依据</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风险必须配兜底</tspan></text></svg>"}]}]}, {"id": "M1", "title": "用 AI 做金融业务与监管洞察", "dims": ["prompt", "data"], "units": [{"id": "M1U1", "tier": "basic", "step": "understand", "title": "金融监管信息源与 AI 解读边界", "video": {"dur": "8min", "script": ["央行/金管总局/行业协会三大信息源及其更新频率", "AI 能做的：归纳、摘要、比对；不能做的：替合规下结论", "为什么\"AI 说合规\"不等于\"真合规\""]}, "ppt": {"method": "监管信息源地图 + 解读边界框（归纳✓ / 下结论✗）", "case": "一条新规从发布到落地的信息链路", "demo": "边界自查卡（这条是归纳还是结论？）"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】监管信息源地图 + 解读边界框（归纳✓ / 下结论✗）\n【为什么重要】央行/金管总局/行业协会三大信息源及其更新频率\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "三大信息源与更新节奏", "n": "做监管洞察，先要知道去哪找。三大信息源是人民银行、金融监管总局和行业协会，三者定位不同：央行偏货币政策与宏观要求，金管总局偏机构和业务监管，行业协会偏自律规则与最佳实践。更新节奏也不同，有的随文发布，有的按季度。你的简报里必须标明来源和发布时间，否则它就是没有出处的信息。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三大信息源</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">央行</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">金融监管总局</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">行业协会</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "AI 能做什么，不能做什么", "n": "AI 在这个场景里能做四件事：归纳要点、跨份比对、提取时间表、生成简报初稿。但它不能做一件事：替合规下结论。原因是 AI 不理解你机构的特定约束，也不承担法律责任。你把归纳和结论混在一句话里，这份简报就废了，因为看的人会以为结论已经合规。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">AI 的边界</tspan></text><g><rect x=\"50.0\" y=\"56.0\" width=\"140.0\" height=\"92.0\" rx=\"10\" fill=\"#1a5cff\" stroke=\"#7aa2ff\" stroke-width=\"2\"/><text x=\"120.0\" y=\"97.6\" font-size=\"12.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"120.0\">归纳 · 摘要 · 比对 ·</tspan><tspan x=\"120.0\" dy=\"16.25\">初稿</tspan></text></g><g><rect x=\"210.0\" y=\"56.0\" width=\"140.0\" height=\"92.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"280.0\" y=\"105.8\" font-size=\"12.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"280.0\">下合规结论</tspan></text></g></svg>"}, {"t": "为什么 AI 说合规不等于真合规", "n": "很多团队踩过一个坑：把一份材料丢给 AI，它回复\"本方案符合监管要求\"，团队就照做，结果检查时被认定为不合规。问题在于 AI 没有你的业务事实，它的判断是基于概率的语言生成，而不是基于你的数据。正确做法是：把合规判断写成人负责的独立环节，AI 只在前面做信息归集。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">高风险</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">正确做法</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI 回复\"符合监管要求\"</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">没有依据的合规结论不可</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">引用</tspan></text></g></svg>"}]}, {"id": "M1U2", "tier": "basic", "step": "demo", "title": "新规 → 结构化简报", "video": {"dur": "8min", "script": ["演示：把一份模拟新规贴入 WorkBuddy", "按 影响范围/产品动作/时间表 三段输出", "强调：结论留白，由人定"]}, "ppt": {"method": "简报四段式（背景/影响/动作/时间表）", "case": "「{{industry}}」新规简报样例（脱敏）", "demo": "WorkBuddy 简报演示（粘贴→结构化）"}, "demoScript": {"steps": ["粘贴模拟新规要点", "要求按 影响范围/产品动作/时间表 输出", "检查是否越界下结论"], "prompt": "你是合规研究员。请把以下「{{industry}}」监管新规要点整理成简报：影响范围、需产品做的动作、时间表。不得自行下合规结论，仅归纳材料。\n[粘贴]"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「简报四段式（背景/影响/动作/时间表）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】简报四段式（背景/影响/动作/时间表）\n【参考案例】「{{industry}}」新规简报样例（脱敏）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是合规研究员。请把以下「{{industry}}」监管新规要点整理成简报：影响范围、需产品做的动作、时间表。不得自行下合规结论，仅归纳材料。 [粘贴]", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：贴入一份模拟新规", "n": "演示开始。我们手上有一段模拟的监管新规要点，涉及个人贷款信息展示与披露要求。先把原文完整贴入 WorkBuddy，不要截断，也不要附上一句请你判断是否合规。很多人在这一句上翻车，因为你等于直接把判断权交给了模型。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：新规原文段落</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">不含任何机构与客户信息</tspan></text></g></svg>"}, {"t": "按三段式输出简报", "n": "提示词这样写：你是金融行业研究员，请把材料整理成简报，格式固定为影响范围、需产品做的动作、时间表三段，不得自行给出合规结论，仅归纳材料。你会发现输出立刻变得可用，因为它被结构框住了。结构就是提示词里的约束，缺了它，AI 会自由发挥成一大段概述。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">结构化输出</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">影响范围 / 产品动作 / 时间表</tspan></text></g></svg>"}, {"t": "点评：结论留白，人来做", "n": "看输出的两处细节。第一，时间表里它写的是按文件规定执行，没有替你确认日期，这是对的；第二，动作描述里它写的是建议评估，没有替你承诺上线时间，这也是对的。凡是它替你下判断的地方，你都要改回留白，然后填你自己确认过的结论。留白不是缺陷，是责任边界。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">来源与时间标明</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论留白由人填</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">动作可执行可验收</tspan></text></svg>"}]}, {"id": "M1U3", "tier": "basic", "step": "todo", "title": "生成你行业的政策简报", "video": {"dur": "8min", "script": ["任务：选本行业一条新规产出简报", "自检：是否守住\"不替合规下结论\"边界"]}, "ppt": {"method": "简报模板（四段式）", "case": "样例：消费金融个贷披露新规", "demo": "填写指引（先摘原文再归纳）"}, "demoScript": null, "practice": {"steps": ["选本行业一条新规", "按四段式产出", "自检不越界"], "exemplar": "影响：{{industry}} 个贷额度披露要求收紧。动作：PRD 增加披露字段。时间表：Q2 前。"}, "spar": null, "deliverable": "政策解读简报模板 + 提示词", "task": "产出《政策解读简报模板 + 提示词》：选本行业一条新规；按四段式产出；自检不越界", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「用 AI 做金融业务与监管洞察」模块，你要交付的是《政策解读简报模板 + 提示词》。\n【场景】业务侧这周的诉求是：任务：选本行业一条新规产出简报。参考做法：样例：消费金融个贷披露新规。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（简报模板（四段式）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《政策解读简报模板 + 提示词》填写模板】\n\n■ 1. 选本行业一条新规\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 按四段式产出\n   ‣ 提示：按「结论 → 依据 → 行动」三段写。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 自检不越界\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   影响：{{industry}} 个贷额度披露要求收紧。动作：PRD 增加披露字段。时间表：Q2 前", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：选一条新规产出简报", "n": "这一节实操。请你从自己行业的一条新规或自律要求出发，按四段式产出简报：背景、影响范围、产品动作、时间表。选那条最近让你团队最难受的规定，痛点越真，简报越有说服力。别挑那种已经执行很久的老规则，那没有新增信息量。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">简报四段式</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">背景</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">影响范围</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">产品动作</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">时间表</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "自检：有没有替合规下结论", "n": "写完自检一遍，重点看有没有三类越界表述。第一类是本方案符合监管要求，这是直接下结论；第二类是不论如何都能通过，这是过度承诺；第三类是建议立即上线，这是替业务定节奏。这三句任何一句出现，都要改写成可验证的陈述，比如在新披露字段上线前完成整改。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">删掉\"符合监管要求\"类表述</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">删掉\"一定能通过\"类承诺</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">时间改为可验证节点</tspan></text></svg>"}, {"t": "把提示词一起沉淀下来", "n": "简报做完后，把这次用的提示词原样复制到文档里，标注适用场景。下次同类任务直接复用，你的产出效率会稳定在一个水平线上，而不是每次靠临场想。团队里提示词沉淀得越多，个人经验才越容易变成组织资产。一个只会自己在那摸索的人，效率提升是有天花板的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">简报成稿</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">提示词已沉淀</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">自检表已通过</tspan></text></svg>"}]}, {"id": "M1U4", "tier": "basic", "step": "spar", "title": "合规官挑简报漏洞", "video": {"dur": "8min", "script": ["陪练：合规官挑你越界或遗漏的条款", "改到放行"]}, "ppt": {"method": "简报评审单（越界/遗漏/依据）", "case": "越界写法：\"本条合规\" → 应改为\"需合规确认\"", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "合规官", "persona": "抠\"是否替合规下结论\"", "mustAsk": ["这条是你归纳还是 AI 替合规下的结论？", "遗漏了哪些适用产品？", "时间表依据哪条原文？"]}, "deliverable": "政策简报（已过合规）", "task": "把《政策简报（已过合规）》拿到「合规官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《政策简报（已过合规）》。现在要让它通过「合规官」这一关。\n【对手的立场】抠\"是否替合规下结论\"。\n【他一定会追问】「这条是你归纳还是 AI 替合规下的结论？」 / 「遗漏了哪些适用产品？」 / 「时间表依据哪条原文？」\n【场景】你说「合规官挑简报漏洞」，对方立刻回一句：这条是你归纳还是 AI 替合规下的结论？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：合规官挑简报漏洞", "n": "陪练开始。合规官会拿着你的简报，从三个角度挑毛病：有没有越界下结论、有没有遗漏关键条款、有没有给出引用依据。他会先问你的判断依据在哪，再问如果不改会怎样。你要提前准备好引用原文的位置，光说我觉得不太对，在他那里是完全无效的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">评审三看</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">越界</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">遗漏</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">依据</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "三类高频问题与应答", "n": "这里列出他最可能问的三类问题。第一，你这条判断的依据是哪一条原文，你要给出段落位置。第二，这条要求对你们产品是否不适用，你要先判断是否适用再谈动作。第三，整改的时间表谁确认，你要说清最终责任人。提前想好答案，现场才不会慌。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">判断依据在哪一条原文</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">对我方产品是否适用</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">整改时间表谁确认</tspan></text></svg>"}, {"t": "改到放行才算过", "n": "陪练不会因为你态度好就放行。它会逐条挑，直到你的简报满足三个条件：所有结论都能指到原文、所有动作都有责任人、所有时间节点都可验证。改动的次数会被记录，这也是你之后复盘时看自己成长的地方。别追求一次通过，追求最终通过。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论可指到原文</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">动作有责任人</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">时间节点可验证</tspan></text></svg>"}]}, {"id": "M1U5", "tier": "adv", "step": "understand", "title": "竞品监控与市场扫描框架", "video": {"dur": "8min", "script": ["监控框架：产品动作/定价/渠道/舆情四个维度", "信号源：官网/公告/应用商店/媒体", "扫描频率与告警阈值设定"]}, "ppt": {"method": "竞品监控框架（四维度 + 信号源）", "case": "信贷赛道监控看板样例", "demo": "监控清单模板"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】竞品监控框架（四维度 + 信号源）\n【为什么重要】监控框架：产品动作/定价/渠道/舆情四个维度\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "监控四个维度", "n": "竞品监控不是一个动作，是四个维度同时看：产品动作，比如上新、改额度；定价，比如利率和费用的调整；渠道，比如流量投放与合作方变化；舆情，比如用户评价和媒体说法。只看产品动作会漏掉定价调整，只看舆情会被带节奏。四维度都要有固定入口。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">监控四维度</tspan
