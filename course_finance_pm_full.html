></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">产品动作</tspan></text></g><g class=\"hl\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">定价</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">渠道</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">舆情</tspan></text></g></svg>"}, {"t": "信号源与采集方式", "n": "信号源同样有四大类：官网与公告，权威但慢；应用商店更新说明，快但杂；招采与招聘公告，能预示动作；媒体报道与用户评价，能预警口碑。每类选一两个固定入口就够了，重点是每天看同一个地方。监控的价值不来自渠道多，而来自看得多勤。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><rect x=\"18.0\" y=\"42.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"84.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">官网公告</tspan></text></g><g><rect x=\"112.5\" y=\"42.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"84.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">应用商店</tspan></text></g><g><rect x=\"207.0\" y=\"42.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"84.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">招聘/招采</tspan></text></g><g class=\"hl\"><rect x=\"301.5\" y=\"42.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"84.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">媒体评价</tspan></text></g><path d=\"M100.5 81.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 81.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 81.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "频率与告警阈值", "n": "频率建议工作日 daily 看，周汇总，月出报告。告警阈值要先定再监控，比如竞品利率下调超过一个百分点触发提醒，或者应用商店更新说明里出现优化审批流程这类词触发提醒。没有阈值的监控等于每天看一份新闻，看多了自然会麻木。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">竞品利率下调 &gt; 1 个百分点 → 告警</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">更新说明提及关键功能 → 告警</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每周汇总一次</tspan></text></svg>"}]}, {"id": "M1U6", "tier": "adv", "step": "demo", "title": "监控 3 家竞品动向", "video": {"dur": "8min", "script": ["演示：让 WorkBuddy 汇总 {{product}} 赛道 3 家竞品", "输出 动作/亮点/风险 列表"]}, "ppt": {"method": "监控月报结构（逐家 + 横向对比）", "case": "「{{product}}」赛道 3 家对比样例", "demo": "WorkBuddy 演示（仅用公开源）"}, "demoScript": {"steps": ["列出 3 家竞品", "让 WorkBuddy 汇总近况", "核对是否仅用公开信息"], "prompt": "请基于公开信息，汇总 「{{product}}」 赛道 3 家竞品近一季度动向，按\"动作/亮点/风险\"列表。仅用公开来源。"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「监控月报结构（逐家 + 横向对比）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】监控月报结构（逐家 + 横向对比）\n【参考案例】「{{product}}」赛道 3 家对比样例\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n请基于公开信息，汇总 「{{product}}」 赛道 3 家竞品近一季度动向，按\"动作/亮点/风险\"列表。仅用公开来源", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：汇总三家竞品动向", "n": "这一节演示如何把三家竞品的动向汇总成一页。我们先准备三家竞品在本月的公开动作：一家下调了最低利率，一家上新了联合贷产品，一家更换了合作渠道。把它们整理成一段结构化文本，作为提示词的输入材料。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：三家竞品本月公开动作</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">含利率 / 产品 / 渠道变化</tspan></text></g></svg>"}, {"t": "输出动作、亮点、风险三列", "n": "提示词要求按三列输出：竞品的每个动作是什么、对你们的亮点在哪、风险在哪。它的价值不是替你下判断，而是把散落的信息按统一格式摊平，方便你扫一眼找到要处理的那一条。凡是它替你下的判断，都要你自己复核一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">汇总输出</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">动作 / 亮点 / 风险 三列对照</tspan></text></g></svg>"}, {"t": "把结论变成自己的行为", "n": "汇总的终点必须是动作，不是报告。看哪家下调了利率，你要立刻判断是否需要调整自家定价策略；看哪家换了渠道，你要评估是否需要跟进投放。报告写完没人看，是因为写的人没在里面写自己的动作。每次汇总至少给三条你自己要做的动作，这份报告才算成立。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条竞品动作都有对应判断</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">至少三条我方待办动作</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">下周复看</tspan></text></svg>"}]}, {"id": "M1U7", "tier": "adv", "step": "todo", "title": "产出竞品监控月报模板", "video": {"dur": "8min", "script": ["任务：做一份可复用的月报模板", "定义维度 + 本期数据 + 固化结构"]}, "ppt": {"method": "月报模板（维度/数据/结论占位）", "case": "样例：月度竞品月报", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["定监控维度", "填本期数据", "固化成模板"], "exemplar": "维度：产品动作/定价/渠道。本期：A 降息、B 上新、C 静默。结论占位：待 PM 研判。"}, "spar": null, "deliverable": "竞品监控月报模板", "task": "产出《竞品监控月报模板》：定监控维度；填本期数据；固化成模板", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「用 AI 做金融业务与监管洞察」模块，你要交付的是《竞品监控月报模板》。\n【场景】业务侧这周的诉求是：任务：做一份可复用的月报模板。参考做法：样例：月度竞品月报。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（月报模板（维度/数据/结论占位）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《竞品监控月报模板》填写模板】\n\n■ 1. 定监控维度\n   ‣ 提示：给出阈值、观察窗口、触发后的第一动作。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 填本期数据\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 固化成模板\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   维度：产品动作/定价/渠道。本期：A 降息、B 上新、C 静默。结论占位：待 PM 研判", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：做一份可复用的月报模板", "n": "这一节实操，产出物是一个可以每月直接复用的月报模板。它必须包含三部分：固定的维度定义、本期数据填写位、结论与待办区。任何一份只能用一次的模板都是没做好的模板。模板的意义就在于省掉你每次重新想结构的那部分时间。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">月报三块</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">维度定义</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">本期数据位</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">结论与待办</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "维度定义要能填，也要能比", "n": "维度定义要满足两个条件：填得进去，也比得出来。填得进去指的是每一项都能从公开信息里找到；比得出来指的是每一项都有上期数值可对。凡是没法比的项目，要么删掉，要么改成只对本期有效。月报的价值来自对比，只有本期没有对比的月报，读者看一眼就会跳过。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项都可从公开信息获取</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项都有上期数值可比</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">指标口径固定不随意改</tspan></text></svg>"}, {"t": "固化结构，形成习惯", "n": "模板定稿后放在团队共享位置，注明版本和更新日期。下次更新时只改数据区和结论区，结构一律不动。三个月后你会拿到一条完整的趋势线，那才是这份模板真正的价值。很多人做月报坚持不下来，原因基本都一样：每次都是重新开始。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 固定结构不重写</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 只填数据区与结论</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 每月同日更新</tspan></text></svg>"}]}, {"id": "M1U8", "tier": "adv", "step": "spar", "title": "战略负责人复盘", "video": {"dur": "8min", "script": ["陪练：战略负责人追问取舍与威胁判断"]}, "ppt": {"method": "复盘问题单（威胁/取舍/投入）", "case": "样例复盘记录", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "战略负责人", "persona": "看趋势与取舍", "mustAsk": ["这 3 家谁对我们威胁最大？", "我们该跟哪条？", "资源投哪最值？"]}, "deliverable": "竞品月报（已过复盘）", "task": "把《竞品月报（已过复盘）》拿到「战略负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《竞品月报（已过复盘）》。现在要让它通过「战略负责人」这一关。\n【对手的立场】看趋势与取舍。\n【他一定会追问】「这 3 家谁对我们威胁最大？」 / 「我们该跟哪条？」 / 「资源投哪最值？」\n【场景】你说「战略负责人复盘」，对方立刻回一句：这 3 家谁对我们威胁最大？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：战略负责人的视角", "n": "陪练的对手换成了战略负责人，他关心的是取舍和威胁判断。他不问细节，只问这件事对你们的战略意味着什么、你们的应对取舍是什么、最大的威胁来自哪。回答要先给判断再加证据，不要反过来讲一堆过程。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三个必问题</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">战略含义</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">我们怎么取舍</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">最大威胁</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "追问示例与应答框架", "n": "三个典型追问。第一，竞品降价说明这个赛道在打价格战，你怎么看，你的回答要给出赛道判断和你方的差异化位置。第二，如果对方继续压价，你们的底线在哪，你要给出可执行的定价策略而不是态度。第三，这个变化对你们今年目标的影响，你要给出量化影响和补救措施。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">赛道判断 + 差异化位置</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">极端情形下的定价底线</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">对目标影响的量化</tspan></text></svg>"}, {"t": "复盘到放行", "n": "陪练会连续追问，直到你的判断链完整：有判断、有依据、有取舍、有兜底。被问倒就回去补，补完再来。这个环节结束后，你对这条赛道的理解会明显深一层，因为所有含糊的地方都被追问过了。含糊的地方被追问，本身就是最好的学习。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有判断也有依据</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有取舍也有底线</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有量化也有兜底</tspan></text></svg>"}]}]}, {"id": "M2", "title": "AI 辅助需求与用户研究", "dims": ["prompt", "tools", "data"], "units": [{"id": "M2U1", "tier": "basic", "step": "understand", "title": "访谈→洞察方法与 AI 角色", "video": {"dur": "8min", "script": ["研究方法链：转录→编码→聚类→需求点", "AI 在转录/编码/聚类中的角色与省时点", "边界：AI 不做\"需求真伪\"判断，人定"]}, "ppt": {"method": "研究流程图（人做设计/AI做机械/人做判断）", "case": "一段访谈从录音到需求点的链路", "demo": "边界卡（哪些让 AI / 哪些人做）"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】研究流程图（人做设计/AI做机械/人做判断）\n【为什么重要】研究方法链：转录→编码→聚类→需求点\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "研究方法链：从录音到需求点", "n": "做用户研究有一条固定链路：先听录音，再把录音切成有意义的话，这一步叫编码；然后把编码结果聚成类目，这叫聚类；最后把类目翻译成产品能用的需求点。很多人卡的不是第一步，而是最后一步，因为从用户原话到产品语言，中间需要你做翻译，而翻译永远是人的工作。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">方法链</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">转录</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">编码</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">聚类</tspan></text></g><g class=\"hl\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">需求点</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "AI 在链条上的省时点", "n": "AI 能接手的是前两步的大部分工作：把二十分钟录音转成文字，把文字按主题切段并打标。这两步原本要花两三个小时，现在十分钟能过一遍。但聚类这一步要小心，AI 会按词频聚类，而用户的真实动机常常藏在反话和犹豫里，所以它聚出来的类目需要你重读一遍才敢用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">AI 与人怎么分工</tspan></text><g><rect x=\"50.0\" y=\"56.0\" width=\"140.0\" height=\"92.0\" rx=\"10\" fill=\"#1a5cff\" stroke=\"#7aa2ff\" stroke-width=\"2\"/><text x=\"120.0\" y=\"105.8\" font-size=\"12.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"120.0\">转录 · 初编码</tspan></text></g><g><rect x=\"210.0\" y=\"56.0\" width=\"140.0\" height=\"92.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"280.0\" y=\"105.8\" font-size=\"12.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"280.0\">聚类判断 · 需求真伪</tspan></text></g></svg>"}, {"t": "边界：需求真伪只能人定", "n": "有一条不能让：AI 不做需求真伪判断。用户说希望更快，可能只是想少填表；说希望有客服，可能真正想要的是失败时能自证清白。判断这句话背后是不是真需求，需要你知道业务背景和用户处境，这是 AI 给不了的东西。把这条划清，你的研究报告才不会被人一句这不真实就推翻。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">AI 能做的部分</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">人把守的部分</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI 聚出类目并给出频次</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">需求真伪由人判断</tspan></text></g></svg>"}]}, {"id": "M2U2", "tier": "basic", "step": "demo", "title": "1 段访谈 → 画像 + 需求点", "video": {"dur": "8min", "script": ["演示：把 1 段 {{product}} 用户访谈贴入", "WorkBuddy 做开放式编码并给画像+3 需求点", "演示：要求回贴证据原文"]}, "ppt": {"method": "编码方法（开放式→轴向→需求点）", "case": "「{{product}}」用户画像样例", "demo": "WorkBuddy 编码演示（粘贴访谈）"}, "demoScript": {"steps": ["粘贴 1 段访谈", "要求输出画像+需求点", "要求标注证据原文"], "prompt": "你是用户研究员。请对以下「{{product}}」用户访谈做开放式编码，归纳用户画像与 3 个需求点，标注证据原文。\n[粘贴]"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「编码方法（开放式→轴向→需求点）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】编码方法（开放式→轴向→需求点）\n【参考案例】「{{product}}」用户画像样例\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是用户研究员。请对以下「{{product}}」用户访谈做开放式编码，归纳用户画像与 3 个需求点，标注证据原文。 [粘贴]", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：一段真实的访谈切片", "n": "演示开始。我们有一段关于「{{product}}」的用户访谈，大约三百字，用户描述了自己在申请时遇到的一次失败经历。原始材料很乱，有口语、有重复、有跑题，这很正常。把它完整复制出来，包括那些不流畅的地方，因为那恰恰是情绪所在。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">访谈原始片段</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">\"上礼拜我又试了一次还是没过…\"</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">\"我不知道到底差哪里\"</tspan></text></g></svg>"}, {"t": "开放式编码 → 画像 + 需求点", "n": "提示词这样写：你是一名金融产品研究员，请对以下访谈做开放式编码，输出三样内容：一是用户的画像推定，二是三条最能代表他诉求的原话引用，三是三条产品可动作的需求点。注意要求它给原话引用，不给它的话，它很容易编一句听起来很像用户说的话，那会很危险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">编码输出</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">画像 · 原话引用 · 3 条需求点</tspan></text></g></svg>"}, {"t": "回贴证据：第 2 步的关键动作", "n": "拿到结果后做一步校验：把输出里的原话引用回贴到原文，确认每一句都真实存在。你会发现少数引用是它自己组织出来的，虽然通顺但不是用户说的。这一步叫证据校验，是用户研究里最容易被省掉也最不应该省的动作。省掉它，你后面的所有结论都会变得不可信。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条引用都能回贴原文</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">引用带上下文页码</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">需求点可落到产品动作</tspan></text></svg>"}]}, {"id": "M2U3", "tier": "basic", "step": "todo", "title": "3 段访谈 → 画像 + 需求池", "video": {"dur": "8min", "script": ["任务：处理 3 段访谈", "产出 1 张画像 + 1 个需求池"]}, "ppt": {"method": "需求池模板（需求/证据/优先级/状态）", "case": "样例需求池（5 条）", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["逐段编码", "汇总画像", "建需求池"], "exemplar": "画像：28 岁白领、怕拒贷、嫌慢。需求：进度透明、快速反馈、被拒有原因。"}, "spar": null, "deliverable": "用户画像 + 需求池", "task": "产出《用户画像 + 需求池》：逐段编码；汇总画像；建需求池", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「AI 辅助需求与用户研究」模块，你要交付的是《用户画像 + 需求池》。\n【场景】业务侧这周的诉求是：任务：处理 3 段访谈。参考做法：样例需求池（5 条）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（需求池模板（需求/证据/优先级/状态）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《用户画像 + 需求池》填写模板】\n\n■ 1. 逐段编码\n   ‣ 提示：每条原始信息后面括号标注来源编号（如「原话#2」），可回查。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 汇总画像\n   ‣ 提示：每条原始信息后面括号标注来源编号（如「原话#2」），可回查。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 建需求池\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   画像：28 岁白领、怕拒贷、嫌慢。需求：进度透明、快速反馈、被拒有原因", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：处理三段访谈", "n": "这一节实操。三段访谈，分别来自新客、老客和曾被拒的用户，这是三种典型样本。目标产出一张画像加一个需求池。注意不要三段各写一份画像，那是三份流水账；要写成一份画像加一组需求，需求按优先级排。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类样本</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">新客</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">老客</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">被拒用户</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "产出一张画像加一个需求池", "n": "画像写五件事：身份、核心场景、当前做法、最痛的一步、使用意愿。需求池每条写三列：需求描述、目标用户、判断依据。判断依据必须回贴 interview 编号，没有编号的需求在后续评审里会被直接质疑。带编号的需求池，才是在会上能站住的需求池。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">画像含五要素</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">需求带目标用户</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条需求标注访谈编号</tspan></text></svg>"}, {"t": "合并去重，找出共性", "n": "三段访谈处理完，把它们并排放在一起找共性。如果有超过两个样本提到同一个痛点，它的优先级就应该往前放；如果只有一个样本提到，先放进观察区。这个动作叫频次排序，是需求池排序里最朴素也最有效的一种方法。别用感觉排序，评审现场感觉是最站不住的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① ≥2 样本提到的痛点排前面</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 单点痛点进观察区</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 按频次给出优先级</tspan></text></svg>"}]}, {"id": "M2U4", "tier": "basic", "step": "spar", "title": "用户深挖需求", "video": {"dur": "8min", "script": ["陪练：用户反问\"你真懂我吗\"", "逼你把需求挖到真实动机"]}, "ppt": {"method": "深挖清单（动机/场景/阻力）", "case": "表层需求 vs 真实动机", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "用户", "persona": "真实、爱反问", "mustAsk": ["你这个需求是真痛点还是你想的？", "我说的场景你覆盖了吗？", "我为什么要信你这功能？"]}, "deliverable": "用户画像+需求池（已过用户）", "task": "把《用户画像+需求池（已过用户）》拿到「用户」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《用户画像+需求池（已过用户）》。现在要让它通过「用户」这一关。\n【对手的立场】真实、爱反问。\n【他一定会追问】「你这个需求是真痛点还是你想的？」 / 「我说的场景你覆盖了吗？」 / 「我为什么要信你这功能？」\n【场景】你说「用户深挖需求」，对方立刻回一句：你这个需求是真痛点还是你想的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：他不会认可你写的画像", "n": "陪练里的用户会直接质疑你。他会问一句：你真的懂我吗？这个角色设计要求他必须追到真实动机，而不是停在表层诉求。他会在你给出画像之后追问动机链条，比如你说用户想要更快，他会问快是为了什么。三轮追问之内你必须说到动机的那一层，否则就判定为没懂他。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">动机链条</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">表层诉求</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">真实场景</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">深层动机</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问与破法", "n": "三个高频追问。第一，你凭什么说用户在意这个，你要给出访谈原话编号。第二，他上次失败后为什么还留在这里，你要说清留存原因。第三，对你来说最痛的到底是哪一步，你要能指出一个具体步骤而不是笼统地说流程长。这三个问题答不上来，说明研究还没做透。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">凭什么：给出原话编号</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">为什么留存：说清留存原因</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">最痛一步：指到具体步骤</tspan></text></svg>"}, {"t": "挖到动机才放行", "n": "通过标准是：你的画像能解释他一次真实的选择行为，并且能指出他未说出口的顾虑。仅仅复述他说过的话是通不过的。陪练结束后，你会拿到一份更贴合真实用户的画像，这是这一节真正的收获。研究做得深不深，看的就是你能不能被追问三次还站得住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">画像能解释一次真实选择</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">指出未说出口的顾虑</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条依据可追溯</tspan></text></svg>"}]}, {"id": "M2U5", "tier": "adv", "step": "understand", "title": "定量+定性混合与分层", "video": {"dur": "8min", "script": ["定性建假设、定量验假设的逻辑", "用户分层：按价值/行为/风险三维", "旅程地图的作用与画法"]}, "ppt": {"method": "分层框架（三维）+ 旅程地图结构", "case": "信贷用户分层样例", "demo": "分层模板"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】分层框架（三维）+ 旅程地图结构\n【为什么重要】定性建假设、定量验假设的逻辑\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "定性建假设，定量验假设", "n": "很多人混用定性定量，结果两头不靠。正确的分工是：定性用来建立假设，样本少但深；定量用来验证假设，样本多但浅。你不能拿十五个用户的访谈去拍板要不要上一千万预算的功能，也不能只看漏斗数据就说不清用户为什么走。顺序是定性先行，定量跟进。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">混合研究路径</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">定性：建假设</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">假设</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">定量：验假设</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "用户分层：价值、行为、风险", "n": "分层建议按三个维度同时看：价值维度看贡献，行为维度看使用频率和路径，风险维度看逾期或投诉倾向。只按价值分层会高估低价值高风险人群，只按行为分层会忽略潜在流失。三维交叉后，典型分层通常是四到六个，超过六个就没有决策意义了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三维分层</tspan></text><g><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">价值</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">行为</tspan></text></g><g class=\"hl\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">风险</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">=</tspan></text></g></svg>"}, {"t": "旅程地图：把痛点画在路径上", "n": "旅程地图的作用是让痛点有位置。横轴是用户路径的几个阶段，纵轴是情绪与顾虑，把你在访谈里听到的痛点按阶段填进去。画的时候要标出失败点和犹豫点，这两处通常就是产品机会。一张画得好的旅程地图，比十页研究报告更能让研发理解问题在哪。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">主旅程四段</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">认知</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">申请</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">审批</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">用后</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}]}, {"id": "M2U6", "tier": "adv", "step": "demo", "title": "千人画像聚类 → 分层", "video": {"dur": "8min", "script": ["演示：把多份画像贴入做聚类", "输出分层：名称/特征/规模感/核心需求"]}, "ppt": {"method": "聚类输出格式（层卡）", "case": "「{{product}}」三层聚类样例", "demo": "WorkBuddy 聚类演示"}, "demoScript": {"steps": ["粘贴多份画像", "要求聚类分层"], "prompt": "以下为「{{product}}」用户画像若干，请做聚类分层，每层给名称/特征/规模感/核心需求。\n[粘贴]"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「聚类输出格式（层卡）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】聚类输出格式（层卡）\n【参考案例】「{{product}}」三层聚类样例\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下为「{{product}}」用户画像若干，请做聚类分层，每层给名称/特征/规模感/核心需求。 [粘贴]", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：多份画像聚类", "n": "这一节演示把多份画像聚成几个分层。我们准备八份画像，每份有标签、场景、痛点和诉求，格式统一。聚类的难点不是算法，而是命名：分层名字要业务能听懂，不能叫用户群 A 和用户群 B，那等于没命名。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：8 份画像</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">标签 / 场景 / 痛点 / 诉求</tspan></text></g></svg>"}, {"t": "分层输出：名称、特征、规模感、核心需求", "n": "提示词要求输出四列：分层名称、典型特征、规模感判断、核心需求。规模感这一列最容易出问题，AI 会给一个没有依据的百分比。你要把它改成印象判断，比如占比估计在两成上下，然后在会上明确说明这是估算，不是数据。含糊的数字最容易在复盘时被翻出来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">分层输出</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">名称 / 特征 / 规模感 / 核心需求</tspan></text></g></svg>"}, {"t": "命名要能被业务听懂", "n": "分层命名有三个标准：一听就知道是谁，比如首次借款的小额应急族；一听就知道场景，比如额度不够的翻新族；绝对不要用技术化的标签做名字。命名一旦确定，后面所有投放、文案、策略都基于它展开，名字含糊会让后续所有动作都跟着含糊。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">名字一听就知道是谁</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">名字含使用场景</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">规模感标注为估算</tspan></text></svg>"}]}, {"id": "M2U7", "tier": "adv", "step": "todo", "title": "建用户分层 + 旅程地图", "video": {"dur": "8min", "script": ["任务：产出分层 + 主旅程", "标痛点与机会点"]}, "ppt": {"method": "旅程模板（阶段/触点/情绪/痛点）", "case": "样例：申请→放款旅程", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["定层", "画主旅程", "标痛点与机会"], "exemplar": "层：急用型/比价型/观望型。旅程：认知→申请→等待→使用→续借。痛点：等待无反馈。"}, "spar": null, "deliverable": "用户分层 + 旅程地图", "task": "产出《用户分层 + 旅程地图》：定层；画主旅程；标痛点与机会", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「AI 辅助需求与用户研究」模块，你要交付的是《用户分层 + 旅程地图》。\n【场景】业务侧这周的诉求是：任务：产出分层 + 主旅程。参考做法：样例：申请→放款旅程。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（旅程模板（阶段/触点/情绪/痛点）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《用户分层 + 旅程地图》填写模板】\n\n■ 1. 定层\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 画主旅程\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 标痛点与机会\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   层：急用型/比价型/观望型。旅程：认知→申请→等待→使用→续借。痛点：等待无反馈", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：产出分层加主旅程", "n": "实操环节。产出两份东西：一份用户分层说明，一份主旅程地图。分层说明包含分层名称、判据、核心需求与规模感；主旅程地图包含四个阶段、每个阶段的痛点与机会点。两份都要能直接放进下一节的评审材料里。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">两件产出</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">分层说明</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">主旅程</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">机会点</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "痛点与机会点的写法", "n": "痛点写成用户语句加影响，比如审批被拒后不知道原因，导致二次申请流失；机会点写成动作加预期，比如失败页增加原因说明与预计可重试时间，预期降低二次申请流失。两者的区别是痛点讲现状，机会点讲动作和预期收益。写成一大段现象的，都不是合格的写法。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">痛点含影响与数据</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">机会点含动作与预期</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">按阶段归位</tspan></text></svg>"}, {"t": "分层和旅程要能对得上", "n": "最后检查一件事：每一个痛点都要能挂到某一层用户的具体阶段上，找不到归属的痛点要剔除或降级。挂不上的痛点通常来自你自己的猜测而不是用户。把这一关守住，你的研究材料在评审时才不会被问倒，因为每一条都有出处和位置。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 痛点挂到具体分层</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 挂在具体阶段</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 无归属的降为观察</tspan></text></svg>"}]}, {"id": "M2U8", "tier": "adv", "step": "spar", "title": "焦点小组", "video": {"dur": "8min", "script": ["陪练：焦点小组多角色质疑分层与旅程"]}, "ppt": {"method": "焦点问题单（层代表/流失点/机会）", "case": "样例焦点记录", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "焦点小组", "persona": "多人视角", "mustAsk": ["这层划分你站哪类用户？", "旅程里哪步最易流失？", "机会点排序理由？"]}, "deliverable": "分层+旅程（已过焦点）", "task": "把《分层+旅程（已过焦点）》拿到「焦点小组」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《分层+旅程（已过焦点）》。现在要让它通过「焦点小组」这一关。\n【对手的立场】多人视角。\n【他一定会追问】「这层划分你站哪类用户？」 / 「旅程里哪步最易流失？」 / 「机会点排序理由？」\n【场景】你说「焦点小组」，对方立刻回一句：这层划分你站哪类用户？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：焦点小组的多角色质疑", "n": "陪练场景换成了焦点小组，同时出现三类角色：激进的用户会挑战你的分层假设，理性的用户会追问数据，反对者会直接否定你的机会点。你的任务是在五分钟内回应全部质疑，并且不陷入争论。关键不是让所有人认同你，而是让所有人知道你的依据在哪。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类质疑者</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">激进用户</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">理性用户</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">反对者</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "回应原则：先认，再据，后取舍", "n": "回应有一个固定套路。先承认对方指出的事实，比如你说得对，我们的样本确实偏新客；再给出依据，比如这部分占我们访谈的四成；最后落在取舍上，比如所以我们把它单独拆成一层。先认再据后取舍，能让你的立场显得可靠，而不是像在辩解。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">先认事实</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">再给依据</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">最后落取舍</tspan></text></svg>"}, {"t": "被质疑到放行为止", "n": "放行标准有两条：一是每个质疑都能指到依据来源，二是你的机会点没有被推翻。被推翻的机会点要主动降级到观察区，而不是嘴硬保留。这个动作会让你在团队里的可信度更高，因为大家会发现你讲的是真的。陪练里别怕被推翻，怕的是你根本不认。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">质疑都能指到依据</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">机会点未被推翻</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">被推翻项已降级</tspan></text></svg>"}]}]}, {"id": "M3", "title": "AI 辅助 PRD 与产品定义", "dims": ["content", "tools", "dev"], "units": [{"id": "M3U1", "tier": "basic", "step": "understand", "title": "PRD 是什么，AI 能/不能写什么", "video": {"dur": "8min", "script": ["PRD 六段式：背景/目标/范围/功能/非功能/验收", "AI 写骨架、人定判断 —— 边界讲清", "为什么 AI 不能替你定业务优先级"]}, "ppt": {"method": "PRD 六段式结构图 + AI 边界框（写骨架/不写判断）", "case": "一份好的最小 PRD 长什么样", "demo": "边界自查清单"}, "demoScript": null, "practice": null, "spar": null, "deliverable": null, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】PRD 六段式结构图 + AI 边界框（写骨架/不写判断）\n【为什么重要】PRD 六段式：背景/目标/范围/功能/非功能/验收\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"], "vslides": [{"t": "PRD 六段式：一套共享语言", "n": "这一节讲 PRD。我们统一用六段式：背景、目标、范围、功能、非功能、验收。这六段不是格式要求，而是对应六个角色最关心的问题。背景回答为什么做，目标回答做成什么样，范围划清做什么和不做什么，功能讲怎么实现，非功能讲性能与安全，验收定义怎么算做对。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六段式</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">背景</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">目标</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">范围</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">功能</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "AI 写骨架，人定判断", "n": "用 AI 写 PRD 的正确姿势是：让它按六段式填骨架，你负责填判断。背景里的业务事实要你给，目标里的数字要你定，范围里的不做要你去争，验收里的口径要你和产品负责人对齐，AI 能做的是把语言通顺、把结构补完整。把它当打字员，别当决策者。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">分工边界</tspan></text><g><rect x=\"50.0\" y=\"56.0\" width=\"140.0\" height=\"92.0\" rx=\"10\" fill=\"#1a5cff\" stroke=\"#7aa2ff\" stroke-width=\"2\"/><text x=\"120.0\" y=\"105.8\" font-size=\"12.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"120.0\">补结构与措辞</tspan></text></g><g><rect x=\"210.0\" y=\"56.0\" width=\"140.0\" height=\"92.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"280.0\" y=\"97.6\" font-size=\"12.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"280.0\">定数字 · 定范围 · 定</tspan><tspan x=\"280.0\" dy=\"16.25\">口径</tspan></text></g></svg>"}, {"t": "为什么 AI 不能替你定优先级", "n": "AI 不知道你们今年的资源约束，也不知道谁在等这个需求，更不承担上线后的后果。它给出的优先级通常是通用最佳实践，放在你的具体处境里可能完全错。优先级是资源分配问题，而资源分配永远要人来定。你在这一段上偷懒，后面所有的返工都会找回来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">高风险</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">正确分工</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI 给：按通用最佳实践</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">排序</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">人来定：按资源与战略排</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">序</tspan></text></g></svg>"}]}, {"id": "M3U2", "tier": "basic", "step": "demo", "title": "一句话需求 → 结构化 PRD", "video": {"dur": "8min", "script": ["演示：「{{company}} 想做 {{product}}」一句话", "WorkBuddy 扩成六段式 PRD", "点评：哪些该人工确认"]}, "ppt": {"method": "需求展开提示词结构（角色/格式/约束）", "case": "「{{product}}」PRD 节选（脱敏）", "demo": "WorkBuddy 生成 PRD 截图位"}, "demoScript": {"steps": ["打开 WorkBuddy，新建「PRD 助手」会话", "输入一句话需求 + 行业/公司/产品占位", "要求按六段式输出"], "prompt": "你是资深金融产品经理。请用 PRD 六段式（背景/目标/范围/功能/非功能/验收）把下面需求展开：\n行业={{industry}}，公司={{company}}，产品={{product}}\n需求：「想做一个线上{{product}}，用户申请后能快速出额度。」\n功能部分先给 3 个核心功能即可，标注哪些需人工确认。"}, "practice": null, "spar": null, "deliverable": null, "task": "在 WorkBuddy 里把「需求展开提示词结构（角色/格式/约束）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】需求展开提示词结构（角色/格式/约束）\n【参考案例】「{{product}}」PRD 节选（脱敏）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是资深金融产品经理。请用 PRD 六段式（背景/目标/范围/功能/非功能/验收）把下面需求展开： 行业={{industry}}，公司={{company}}，产品={{product}} 需求：「想做一个线上{{product}}，用户申请后能快速出额度。」 功能部分先给 3 个核心功能即可，标注哪些需人工确认", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"], "vslides": [{"t": "演示：一句话需求进场", "n": "演示开始。业务方丢来一句话：{{company}}想要一个 {{product}}，要快，放款要快。这句话里有三个模糊词：快、放款、要好。把它直接扩成 PRD，你会发现每一段都在猜。这就是最小 PRD 存在的意义，它不追求周全，只追求能对齐。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示输入</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">业务方一句话</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">{{company}} 想要一个 {{product}}</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">\"要快，放款要快\"</tspan></text></g></svg>"}, {"t": "扩成六段式 PRD", "n": "提示词要求按六段式输出，并给出三条硬约束：目标必须含可测数字，范围必须同时写做与不做，验收必须可埋点。看它的输出：目标里出现了三分钟出额度，范围里同时列了做线上申请和不做线下面签，验收里给了时长和通过率。这三条约束一加，草稿立刻可从用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">最小 PRD</tspan></text><g><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#9be8b0\" text-anchor=\"start\"><tspan x=\"52.0\">AI</tspan></text></g><g><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">背景 / 目标 / 范围 / 功能 / 验收</tspan></text></g></svg>"}, {"t": "点评：哪几处必须人工确认", "n": "这份草稿有四处要你确认。第一，三分钟这个数字是否包含风控决策时间；第二，不做人工复核全流程，是否与合规要求冲突；第三，通过率百分之六十的口径从哪来；第四，异常流程也就是拒贷和超时怎么处理，AI 通常不会主动写。这四处全是人的责任。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数字口径确认</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">与合规要求核对</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">异常流程补齐</tspan></text></svg>"}]}, {"id": "M3U3", "tier": "basic", "step": "todo", "title": "产出你的「最小 PRD」", "video": {"dur": "8min", "script": ["任务：用模板产出背景+目标+3 核心功能", "不必追求完整，先走通闭环"]}, "ppt": {"method": "最小 PRD 模板（背景/目标/3 功能/验收）", "case": "「{{product}}」最小 PRD 样例", "demo": "填写指引"}, "demoScript": null, "practice": {"steps": ["填「我的场景」行业/公司/产品", "写 1 句背景 + 1 句目标", "列 3 个核心功能（含 1 句验收口径）"], "exemplar": "背景：{{company}} 想用 {{product}} 服务无抵押小额消费客群。\n目标：申请到出额度 ≤ 3 分钟，首月授信通过率 ≥ 30%。\n核心功能：① 线上申请（身份证+活体）② 实时风控预筛（自动拒/转人工）③ 额度试算（输入收入给预估额度）。验收：3 功能均可演示。"}, "spar": null, "deliverable": "最小 PRD", "task": "产出《最小 PRD》：填「我的场景」行业/公司/产品；写 1 句背景 + 1 句目标；列 3 个核心功能（含 1 句验收口径）", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的金融产品经理。本单元属于「AI 辅助 PRD 与产品定义」模块，你要交付的是《最小 PRD》。\n【场景】业务侧这周的诉求是：任务：用模板产出背景+目标+3 核心功能。参考做法：「{{product}}」最小 PRD 样例。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（最小 PRD 模板（背景/目标/3 功能/验收）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（只用脱敏或公开信息）· 不替人下结论（判断留给人）· 可解释可追溯（每个结论能指回依据）。", "template": "【《最小 PRD》填写模板】\n\n■ 1. 填「我的场景」行业/公司/产品\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写 1 句背景 + 1 句目标\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 列 3 个核心功能（含 1 句验收口径）\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   背景：{{company}} 想用 {{product}} 服务无抵押小额消费客群。 目标：申请到出额度 ≤ 3 分钟，首月授信通过率 ≥ 30%。 核心功能：① 线上申请（身份证+活体）② 实时风控预筛（自动拒/转人工）③ 额度试算（输入收入给预估额度）。验收：3 功能均可演示", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"], "vslides": [{"t": "任务：产出你的最小 PRD", "n": "实操环节。用六段式模板产出一份最小 PRD，包含背景、目标和三个核心功能。不追求完整，先走通闭环。判断标准很简单：另外一个人看了之后，能在两小时内判断出要不要做，以及做成什么样算成功。达不到这个标准，就是还没写完。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">最小 PRD 三块</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">背景</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">目标</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">3 个核心功能</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "目标必须带数字", "n": "目标段的写法固定为：谁、在多长时间内、完成什么动作、达到什么结果。比如工薪族在申请到额度这一段的三分钟内完成授信并看到可用额度。四要素缺一个就不可测。写完自己读一遍，如果换个人看不懂做到什么程度，就重写，直到能用埋点验证。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">可测目标四要素</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">谁</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">时间</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">动作</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">结果</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "范围必须写不做", "n": "范围段最关键也最容易被忽略，它要同时写做和不做。做的一栏写清楚这个版本要做的事，不做的一栏写清这个版本明确排除的事。经验是优先写不做，因为做会越加越多，而每一条不做都是一次刹车。没有不做的范围，评审会变成无限加需求的现场。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">范围双栏</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"175.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"105.5\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.5\">做：线上申请 · 自动预审</tspan></text></g><g class=\"hl\"><rect x=\"207.0\" y=\"52.0\" width=\"175.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"294.5\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"294.5\">不做：线下面签 · 人工复核</tspan></text></g><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}]}, {"id": "M3U4", "tier": "basic", "step": "spar", "title": "评审挑 3 个尖锐问题", "video": {"dur": "8min", "script": ["陪练说明：内部评审专挑逻辑漏洞与边界", "改到评审放行"]}, "ppt": {"method": "PRD 评审检查单（完整/自洽/边界）", "case": "典型被挑战点（指标无主/功能冲突/异常缺失）", "demo": "陪练对话说明"}, "demoScript": null, "practice": null, "spar": {"role": "内部评审", "persona": "挑剔、爱问\"如果…怎么办\"", "mustAsk": ["目标和指标怎么度量、谁来认？", "这 3 个功能之间有无冲突或遗漏？", "异常/边界场景（拒贷、超时）PRD 写了吗？"]}, "deliverable": "最小 PRD（已通过评审）", "task": "把《最小 PRD（已通过评审）》拿到「内部评审」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《最小 PRD（已通过评审）》。现在要让它通过「内部评审」这一关。\n【对手的立场】挑剔、爱问\"如果…怎么办\"。\n【他一定会追问】「目标和指标怎么度量、谁来认？」 / 「这 3 个功能之间有无冲突或遗漏？」 / 「异常/边界场景（拒贷、超时）PRD 写了吗？」\n【场景】你说「评审挑 3 个尖锐问题」，对方立刻回一句：目标和指标怎么度量、谁来认？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"], "vslides": [{"t": "陪练说明：内部评审专挑漏洞", "n": "陪练角色是内部评审会的评审人，他的职责是挑逻辑漏洞和边界情况。他不会问你这个功能好不好用，会问你三件事：依赖什么还没定、异常怎么办、上线后怎么验证。这三个问题对应研发、风控和测试三方，任何一个答不上来，评审就不会放行。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">评审三问</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">依赖未定</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">异常路径</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">验证方式</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频尖锐问题与应答", "n": "这里列三个高频问题。第一，额度模型还没定，你的目标三分钟怎么保证，应答是先确定决策缓存方案，再谈时间。第二，如果风控拒绝，页面怎么处理，应答是给原因分类加预计可重试时间。第三，怎么证明这次改动有效，应答是给出埋点方案与观察窗口。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\
