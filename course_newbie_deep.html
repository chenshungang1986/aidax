<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 配音走 CDN：提前建连，省掉首段 100–300ms 的 DNS/TLS 时间 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<title>新人小白 × 应届生 · AI 职场基础 深版（M0/M1/M2/M3/M4/M5/M6/M7 · 64 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex:none}
  header h1{font-size:17px;font-weight:700;white-space:nowrap}
  header h1 span{display:none}   /* 课程副标题（样板间/单元数/行业机构产品）默认不显示：学员只需要课程名 */
  /* 顶栏只留三样：课程名、一条进度条、一个设置入口 */
  .hp{flex:1;height:5px;background:#e8eefb;border-radius:99px;overflow:hidden;max-width:560px;min-width:70px}
  .hp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1a5cff,#4f8bff);border-radius:99px;transition:width .35s}
  .gear{margin-left:auto;width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;font-size:15px;line-height:1}
  .gear:hover{border-color:var(--blue);color:var(--blue)}
  .cfg-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .cfg-row label{color:var(--mut);width:40px;flex:none}
  .cfg-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .cfg-sep{border:none;border-top:1px solid var(--line);margin:13px 0}
  .cfg-label{display:flex;align-items:center;gap:8px;text-align:left;font-size:12px;font-weight:700;color:var(--blue-d);margin:14px 0 5px;letter-spacing:.02em}
  .cfg-hint{text-align:left;font-size:11.8px;color:var(--mut);line-height:1.65;margin:3px 0 2px}
  .cfg-row label{width:auto;min-width:66px}
  .cfg-note{font-size:11.5px;color:#8a6d1f;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 9px;line-height:1.6;margin:6px 0}
  .ident-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#eef4ff;border:1px solid #c7d9ff;color:var(--blue-d);border-radius:999px;padding:3px 10px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;flex:1;min-height:0}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  /* 模块头改为两层：标题独占一行（两行截断），进度/短板/测验标签下移一行，
     避免标签把标题挤成「M1 写出第一句好…」这种半句话。 */
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;background:#fbfcff}
  .mod-h .mh-top{display:flex;gap:7px;align-items:flex-start}
  .mod-h .mh-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
  .mod-h .mid{flex-shrink:0}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  /* 模块标题：原来代码里写死 slice(0,12) 会把标题砍成半句（如「M1 写出第一句好用的提」），
     改为最多两行、超出加省略号，标题完整可读且不撑破左栏。 */
  .mod-h .mtitle{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;word-break:break-word}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  /* 单元标题原来写死 slice(0,11)，长标题被切成半句；改为单行省略，完整语义优先 */
  .unit .ut{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vwrap{position:relative}
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  /* 底部留出字幕条的高度：字幕是「占位」而不是「盖住」PPT 最后一行 */
  .vp .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px 60px;pointer-events:none}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#eaf0ff}
  .slide.on{display:flex}
  .slide h4{font-size:16px;margin:0 0 6px;color:#fff;flex:none}
  .slide svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  /* 高亮跟讲解走：未讲到的条目压暗，讲到的那一项亮起（.k-on 由播放器逐项切换） */
  .slide.spot [data-k]{opacity:.25;transition:opacity .25s ease}
  .slide.spot [data-k].k-on{opacity:1;filter:drop-shadow(0 0 7px rgba(150,190,255,.9)) brightness(1.06)}
  /* 字幕：永远只有一行，超出省略；不吃掉画面（stage 已为它留了 60px） */
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 70%,rgba(0,0,0,0) 100%);color:#fff;font-size:17px;font-weight:600;line-height:1.35;padding:12px 20px 10px;min-height:0;display:block;text-align:center;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes capin{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
  .cap.swap{animation:capin .16s ease-out}
  @media (max-width:620px){
    .vp .stage{padding:8px 8px 46px}
    .cap{font-size:13.5px;padding:8px 10px 6px;letter-spacing:0}
    .vbar{gap:7px}.play{padding:7px 12px;font-size:12.5px}.time{font-size:11.5px}
    /* 答案行在窄屏上改成自然折行：flex 会把「→ 标准答案」整体挤到下一行，读起来断得莫名其妙 */
    .anshd{display:block}
    .anshit{margin-left:0;display:block;margin-top:3px}
    .opb{margin-right:5px}
  }
  .dots{position:absolute;top:9px;left:12px;display:flex;gap:5px;justify-content:flex-start}
  /* 缓冲反馈：点播放后立刻给「在加载」的确定感，别让人以为按钮坏了。
     配音约 200–350KB，慢网下要 2–18 秒才能出第一声。 */
  .pbuf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:9px;
        background:rgba(8,16,40,.82);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;
        backdrop-filter:blur(6px);z-index:5;pointer-events:none;white-space:nowrap}
  .pbuf.on{display:flex}
  .pbuf i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.28);border-top-color:#fff;
          animation:pbspin .8s linear infinite;flex:none}
  @keyframes pbspin{to{transform:rotate(360deg)}}
  @media (max-width:620px){.pbuf{font-size:12px;padding:8px 13px;gap:7px}}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
  .dots i.on{background:#fff}
  .vbar{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
  .play{background:var(--blue);color:#fff;border:none;padding:8px 17px;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600;white-space:nowrap}
  .seek{flex:1;min-width:160px;height:8px;border-radius:6px;background:#e4eaf7;position:relative;cursor:pointer;touch-action:none}
  .seek .fill{height:100%;background:var(--blue);border-radius:6px;width:0;pointer-events:none}
  .seek .knob{position:absolute;top:-4px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-left:-7px;left:0;pointer-events:none}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .pbtn{background:#fff;color:var(--blue-d);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.1}
  .pbtn:hover{border-color:var(--blue);color:var(--blue)}
  /* 全屏：把「画面 + 控制条」一起放进去，否则全屏后没法暂停/拖进度 */
  #p-wrap:fullscreen,#p-wrap:-webkit-full-screen{background:#070d1c;display:flex;flex-direction:column;justify-content:center;padding:10px 3vw 14px;border-radius:0;box-sizing:border-box}
  #p-wrap:fullscreen .vp,#p-wrap:-webkit-full-screen .vp{width:100%;height:calc(100% - 58px);aspect-ratio:auto;border-radius:0}
  #p-wrap:fullscreen .cap,#p-wrap:-webkit-full-screen .cap{font-size:23px;padding:16px 28px 12px}
  #p-wrap:fullscreen .vbar,#p-wrap:-webkit-full-screen .vbar{padding:0 2px}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .aud-note{font-size:12px;color:var(--mut);margin-top:5px}
  textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;background:#fcfdff}
  input.tin{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fcfdff}
  .btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:13.2px;margin:6px 6px 0 0}
  .btn.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
  .btn.ok{background:var(--green)}
  .btn[disabled]{background:#c9d3e6;cursor:not-allowed;border-color:#c9d3e6;color:#fff}
  .wb{background:#0e1530;color:#dce6ff;border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;line-height:1.7}
  .wb .me{color:#ffd98a}.wb .ai{color:#9be8b0}.wb .hl-line{color:#fff;font-weight:600}
  .chat{display:flex;flex-direction:column;gap:9px;margin:6px 0}
  .bub{max-width:82%;padding:9px 12px;border-radius:11px;font-size:13.3px;white-space:pre-wrap}
  .bub.ai{background:#eef4ff;color:var(--blue-d);align-self:flex-start}
  .bub.me{background:var(--blue);color:#fff;align-self:flex-end}
  .bub.sys{background:#f1f4fa;color:var(--mut);align-self:center;font-size:12px;max-width:100%}
  .qs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .qbtn{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.4px;cursor:pointer}
  .qbtn:hover{border-color:var(--blue);color:var(--blue)}
  .done-card{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:18px;text-align:center}
  .done-card h3{font-size:19px;color:#166534;margin-bottom:4px}
  .cp-score{font-size:30px;font-weight:800;color:#16a34a;margin:6px 0}
  .tag-done{display:inline-block;background:var(--green);color:#fff;font-size:12px;padding:1px 9px;border-radius:20px;margin-left:6px}
  /* 题干 / 模板 / 评分 */
  .ip{border-left:4px solid var(--blue)}
  .ip-task{font-size:14.5px;font-weight:700;margin:2px 0 8px;color:var(--txt)}
  .brief{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.1px;white-space:pre-wrap;line-height:1.78;color:#28345a}
  .tpl{background:#0e1530;color:#d7e3ff;border-radius:11px;padding:13px 15px;font-size:12.6px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  details>summary{cursor:pointer;font-size:13.3px;color:var(--blue-d);font-weight:600;margin:10px 0 6px;list-style:none;display:flex;align-items:center;gap:6px}
  details>summary::-webkit-details-marker{display:none}
  details>summary:before{content:"\25B8";transition:transform .15s;display:inline-block}
  details[open]>summary:before{transform:rotate(90deg)}
  .rub{list-style:none;font-size:13px;color:var(--mut);margin:4px 0}
  .rub li{padding:2px 0 2px 20px;position:relative}
  .rub li:before{content:"\25CB";position:absolute;left:2px;color:#c3ccdf}
  /* ===== 演示环节 · 情景题（素材 + 填写框架） ===== */
  .shsitu{background:#f1f5fd;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 13px;font-size:13.3px;line-height:1.8;color:#28345a;white-space:pre-wrap}
  .shask{font-size:12.9px;color:var(--mut);line-height:1.85;margin:8px 0 4px;white-space:pre-wrap}
  .shbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--mut);margin:12px 0 8px;flex-wrap:wrap}
  .shcard{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fff}
  .shhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.2px;color:var(--mut);margin-bottom:7px}
  .shhead b{color:var(--blue);font-size:12.6px;font-family:ui-monospace,Menlo,monospace}
  .shmat{font-size:13.2px;line-height:1.8;white-space:pre-wrap;background:#f7f9fd;border-radius:7px;padding:9px 11px;margin-bottom:9px;color:#1f2a44}
  .shc{margin-top:7px}
  .shrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .shrow>.shc{flex:1 1 200px;min-width:0}
  .shc>label{display:block;font-size:12.2px;color:var(--mut);margin-bottom:5px}
  .shtags{display:flex;flex-wrap:wrap;gap:5px}
  .shtag{font-size:12.3px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:#fff;user-select:none;color:#3b4763;transition:.12s}
  .shtag:hover{border-color:#b9caf0}
  .shtag.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .shin{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;color:var(--txt)}
  .shin:focus{outline:none;border-color:var(--blue)}
  .shstep{margin-top:18px;padding-top:15px;border-top:1px dashed var(--line)}
  .shstep>b{display:block;font-size:13.4px;margin-bottom:8px;color:var(--txt)}
  .shstep.lock{opacity:.45;pointer-events:none}
  .shref{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px;padding:11px 13px;margin-top:14px}
  .shref>.hd{font-size:13px;font-weight:700;color:#166534;margin-bottom:6px}
  /* 陪练材料卡：把上一节产出带进这一关 */
  .matbox{border:1px solid #dbe4f5;background:#f6f9ff;border-radius:10px;padding:10px 12px;margin:12px 0}
  .matbox .mhd{font-size:13px;font-weight:700;color:#1d4ed8}
  .matbox .mname{font-size:12.8px;color:var(--txt);margin-top:4px;font-weight:600}
  .matbox .mhint{font-size:12.4px;color:var(--mut);margin-top:4px;line-height:1.6}
  .matbox .mact{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12.5px}
  .matbox details{margin-top:7px}
  .matbox textarea{min-height:96px;margin-top:6px}
  /* 标准答案：逐格对答 + 模型输出该改哪几处 */
  .ansrow{border:1px solid #e6e9f0;border-radius:9px;padding:8px 10px;margin-bottom:7px;background:#fff}
  .ansrow.bad{border-color:#fecdd3;background:#fff7f8}
  .ansrow.good{border-color:#d7ead9;background:#f8fdf9}
  .anshd{font-size:12.6px;line-height:1.75;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
  .ansid{font-weight:700;color:#1f2b45}
  .ansg{color:#8f9ab0}
  .answ{color:#166534;font-weight:700}
  .ansy{color:#be123c;font-weight:700}
  .answhy{font-size:12px;color:#5a6580;margin-top:4px;line-height:1.6}
  .anshit{margin-left:auto;font-size:11.5px;color:#8f9ab0;white-space:nowrap}
  .anscov{font-size:12.5px;color:#3d6b4a;margin:0 0 8px}

<script>

const COURSE = {"id": "newbie_grad", "role": "graduate", "customization": {"industry": "通用职场", "company": "你所在的团队", "product": "日常工作"}, "modules": [{"id": "M0", "title": "M0 入职第一周：AI 能做什么、不能做什么", "dims": ["prompt", "tools", "security"], "units": [{"id": "M0U1", "tier": "basic", "step": "understand", "title": "三类活能交，三类活不能交", "video": {"dur": "3.3min", "script": ["第一周最该建立的是预期——AI 能替你搬砖，不能替你签字", "任务三分法：能交 / 只能打草稿 / 不能交（每类配一句判据）", "新人把整份周报丢给 AI，交上去被退回重写"]}, "ppt": {"method": "任务三分法：能交 / 只能打草稿 / 不能交（每类配一句判据）", "case": "新人把整份周报丢给 AI，交上去被退回重写", "demo": "三分法对照卡：把 8 件日常事各自归位"}, "objective": "能把自己岗位的活分成「能交给 AI / 只能打草稿 / 不能交」三类，并各举一个本周真实例子", "transfer": "回工位挑一件本周做过的事，写清「AI 出哪一段、我改哪一段」，发给带你的师傅看一眼", "vslides": [{"t": "开场：先别急着用，先分清哪段能交", "n": "入职第一周，你手上其实没什么大活，多半是整理资料、写周报、记纪要、找竞品信息这类事。这些活恰好是 AI 最擅长的，但也是最容易出事的：交上去的东西署的是你的名字。所以第一件事不是学提示词，而是把活分清楚。一条最省事的判据：这段活如果做错了，后果是「不好看」还是「要担责」？只是不好看的，AI 可以出整段；要担责的，AI 只能出草稿。这一节给你一张三分卡，往后八节课都在这张卡上做加法。判断的时候别想太复杂，就问两句话：这件事有没有标准答案？错了谁签字？两个问题答完，归类基本就出来了。很多新人第一周就栽在这里：把 AI 写的整份周报直接发出去，主管一问「这个数据哪来的」就答不上。不是能力问题，是顺序反了——先分清边界，再谈效率。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">AI 最擅长的三件事</tspan></text><g data-k=\"整理\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">整理</tspan></text></g><g data-k=\"起草\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">起草</tspan></text></g><g data-k=\"校对\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">校对</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 70.9}, {"t": "能交：有标准答案、错了只是不好看", "n": "第一类能整段交给 AI。特征是有明确输入、有标准形状、错了顶多被说一句「写得糙」。比如把会议录音转成要点、把一堆链接整理成表格、把长文压缩成三百字摘要、把中英混排的格式统一、按模板套一封通知邮件。这类活的共同点是：你其实知道好结果长什么样，只是懒得一个字一个字敲。判断标准很简单——如果同事交给你一份，你能一眼看出对不对，那这份活就能交给 AI。注意「能交」不等于「不用看」：交上去之前你必须通读一遍，删掉它自作聪明补的内容。最常见的自作聪明有三种：补一个你没说过的数字、加一句你没授权的承诺、把「可能」改成「一定」。这三种在正式文档里都是硬伤。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">可以整段交给 AI 的活</tspan></text><g data-k=\"转要点\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">转要点</tspan></text></g><g data-k=\"整表格\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">整表格</tspan></text></g><g data-k=\"压缩摘要\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">压缩摘要</tspan></text></g><g data-k=\"统一格式\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">统一格式</tspan></text></g><g data-k=\"套模板\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">套模板</tspan></text></g><g data-k=\"改语气\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">改语气</tspan></text></g></svg>", "d": 61.73}, {"t": "只能打草稿与不能交：差别在谁签字", "n": "第二类是只能打草稿。特征是有判断成分，但结论还需要你确认。比如周报里的「本周问题与下周计划」、竞品分析的「所以我们要不要跟进」、方案里的「建议先做哪个」。AI 可以给你三个版本让你挑，但选哪个、为什么选，必须是你写的。第三类完全不能交：涉及真实数据的对外数字、涉及人的评价与考核、涉及合同的承诺条款、涉及合规判断的定性。这四类有个共同点——错了要有人担责，而那个人是你。把这条记牢，你就不会在第一周犯那种「AI 写了我就交了」的错。还有一条容易忽略的：交之前问自己一句「这段话我敢不敢在会上念出来」。不敢，就还没到能交的程度。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">只能打草稿</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">不能这么做</tspan></text><g data-k=\"AI 出三版 → 我选一版并说清为什么\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI 出三版 → 我选一版并</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">说清为什么</tspan></text></g><g data-k=\"AI 出一版 → 我直接交\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">AI 出一版 → 我直接交</tspan></text></g></svg>", "d": 62.42}], "deliverable": {"type": "skill", "name": "AI 任务三分卡", "rubric": ["分类准确", "判据清楚", "例子真实"], "acceptance": "能说出三类活各自的判据，并为自己岗位各举 2 个例子，例子要落到具体动作"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】任务三分法：能交 / 只能打草稿 / 不能交（每类配一句判据）\n【为什么重要】第一周最该建立的是预期——AI 能替你搬砖，不能替你签字\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三类活各举 2 个自己岗位的例子，不能只复述课上例子", "每类都说得出判据：为什么这条属于「能交」而不是「只能打草稿」", "「不能交」那一类里至少有一条涉及钱、人、合规或对外承诺", "自检题全对；收获写成一句能马上动手的话，不写「学到了很多」"]}, {"id": "M0U2", "tier": "basic", "step": "demo", "title": "配齐你的第一套工具箱", "video": {"dur": "3.4min", "script": ["工具不在多，在于每一类有一个你闭着眼也能用起来的", "四类工具矩阵（对话写作 / 配图 / 视频 / 表格数据）+ 每类一个避坑点", "新人注册了十几个工具，结果一个都没用熟"]}, "ppt": {"method": "四类工具矩阵（对话写作 / 配图 / 视频 / 表格数据）+ 每类一个避坑点", "case": "新人注册了十几个工具，结果一个都没用熟", "demo": "WorkBuddy 内跑一遍「四类各选一」的选型提示词"}, "objective": "能跑通一次「四类工具各选一个」的选型对话，并说清每一类各有 1 个不该交给它做的事", "transfer": "今天就挑其中一类，用它把一件真实小事跑完一遍，把提示词存进备忘录", "vslides": [{"t": "演示准备：为什么按四类分，而不是按名字记", "n": "很多人一上来就问「哪个 AI 最好用」，这个问题没有答案，因为「好用」取决于你要干什么。更实用的分法是按产出物分四类：写字和问答一类、出图一类、出视频一类、处理表格一类。四类各挑一个用熟，比注册二十个强得多。为什么不按名字记？因为工具换得太快，去年好用的今年可能收费了、改版了、甚至关停了，但「我要一张图」「我要一段视频」这个需求不会变。按需求记，你换工具的时候不用重新学。这里还有一个新人常忽略的前提：先问一句公司有没有统一采购的工具。有些公司对数据出域有硬规定，你自己注册的账号可能根本不能用，白折腾一天。所以演示的第一步不是打开工具，是问清楚边界，再动手。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">按产出物分四类</tspan></text><g data-k=\"对话写作\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">对话写作</tspan></text></g><g data-k=\"配图\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">配图</tspan></text></g><g data-k=\"短视频\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">短视频</tspan></text></g><g data-k=\"表格数据\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">表格数据</tspan></text></g></svg>", "d": 68.71}, {"t": "跑提示词：每类只给一个，且要说不该做什么", "n": "把提示词贴进 WorkBuddy 跑一遍。三个要求：每类只推荐一个、说明最适合新人的用法、说明一件不该交给它做的事。第三条最关键——知道「别用它做什么」，比知道「它能做什么」更能让你少踩坑。演示里我特意加了「国内可以直接打开用」这个约束，不加的话它会给你一堆注册不了的海外服务，你在第一天就卡在注册上。还加了「不要推荐需要企业采购的」，因为你个人买不了。跑完你会拿到一张四行表，每一行都有三行说明：用法、坑、不该做。这张表不用背，存进备忘录，下次要交东西时翻一眼就够了。注意一个细节：AI 给的「坑」往往是通用坑，比如「注意隐私」，这种话没用。你要自己补一句具体的，比如「这个工具会把你的对话拿去训练，别贴真实客户名」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与产出</tspan></text><g data-k=\"输入：一句选型需求 + 四条约束\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一句选型需求 + 四条约束</tspan></text></g><g data-k=\"输出：四行表（类别/推荐/用法/坑/不该做）\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输出：四行表（类别/推荐/用法/坑/不该做）</tspan></text></g><g data-k=\"目标：一张能存进备忘录的工具箱\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：一张能存进备忘录的工具箱</tspan></text></g></svg>", "d": 67.66}, {"t": "人工收口：先跑通一件真实的小事", "n": "拿到表之后别急着全部注册。今天只挑一类，用它把一件真实的小事跑完——比如把昨天那段会议录音整理成要点。跑通一次，你对工具的理解会超过看十篇测评。跑完把提示词原样存下来，那就是你的第一份资产。下一次遇到同类活，改两个词就能复用。用熟一个再换下一个，这是新人最快的上手路径，也是唯一不会半途而废的路径。判断「用熟了」有个标准：不看教程也能在三十秒内交出可用结果，并且知道它哪里会出错。达不到这个标准，先别学下一个。还有一个动作别省：跑完之后记一行笔记，写清「这次它哪里不对、我怎么改的」。攒够十条，你就有了自己的一份避坑清单，比任何测评都准。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"只挑一类，今天跑通\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只挑一类，今天跑通</tspan></text></g><g data-k=\"用真实材料，不用示例\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">用真实材料，不用示例</tspan></text></g><g data-k=\"把提示词原样存下来\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">把提示词原样存下来</tspan></text></g></svg>", "d": 65.26}], "deliverable": {"type": "skill", "name": "个人 AI 工具箱", "rubric": ["选型合理", "避坑清楚", "真实跑通"], "acceptance": "能产出《个人 AI 工具箱》并通过本单元评分要点"}, "demo": {"ref": "■ 四类工具选型（面向职场新人，均可用免费额度起步）\n\n| 类别 | 推荐 | 最适合新人的用法 | 最容易踩的坑 | 不该交给它做 |\n|---|---|---|---|---|\n| 对话写作 | 通用对话类助手 | 把会议录音转文字后，让它整理成「结论 + 待办」两段 | 它会自动补上你没说过的数字 | 替你判断谁该负责哪件事 |\n| 配图 | 文生图工具 | 做汇报封面、内部通知配图 | 图里的中文字经常是错的 | 做对外正式海报（字体与品牌规范过不了） |\n| 短视频 | 数字人口播工具 | 把一段 200 字说明转成 30 秒口播 | 语速默认偏快，听起来像赶时间 | 做需要真人出镜的对外宣传 |\n| 表格数据 | 表格类 AI 助手 | 把乱格式的名单整理成统一列 | 它会「猜」缺失值，猜完不告诉你 | 做对外的财务口径核算 |\n\n■ 给新人的使用顺序建议\n1. 先把「对话写作」用熟，它覆盖你 70% 的日常。\n2. 需要交图再学配图，需要交视频再学短视频。\n3. 表格类放在最后，因为它的错误最不容易被发现。\n\n⚠ 提醒：以上是通用建议，具体到你公司可能已有统一采购的工具，先问一声再注册。", "fix": ["把「推荐 1 个」改成「推荐 1 个 + 说明适用边界」——只给名字不给边界，新人会拿它去干不该干的事。", "给每一类都补了「不该交给它做」这一列。AI 自己不会主动说「这事别找我」，这一列必须人来补。", "删掉了 AI 顺手写的「月费 99 元起」这类价格——它编的，价格必须自己去官网看。", "把「国内可用」写进提示词。不写的话它会推荐一批打不开的服务，新人第一天就卡在注册上。"], "judge": "判断依据：有没有给出「不该交给它做」；有没有出现未经核实的价格与版本号；推荐是否真能打开用；有没有提醒先问公司是否已有统一工具", "sheet": {"situ": "你入职市场部第三天。师傅说「先把工具配起来」，把部门群和公告里翻到的 6 条消息转给了你——有人推荐、有人踩过坑、还有一条是公司刚发的通知。你要从中整理出一张四类选型表，每类只留一个，并写清每类「不该交给它做的事」。", "ask": "① 先把 6 条消息逐条判定：它属于哪类依据、对应哪一类工具、提示了什么不能做的事；② 再按「对话写作 / 配图 / 短视频 / 表格数据」四类各定一个，写成选型表；③ 把整理表交给模型补全说明，拿回后自己改，改了哪几处要写清楚。", "gen": "请基于以上整理表：① 按「对话写作 / 配图 / 短视频 / 表格数据」四类各定一个工具；② 每个工具写三行：最适合新人的用法、一个最容易踩的坑、一件不该交给它做的事；③ 在表头写出公司规则带来的硬约束。\n不要写「已通过安全审核」这类越权结论，也不要给具体价格——价格我自己去官网看。", "mats": [{"id": "T01", "src": "部门群 · 设计组小周", "text": "配图用 XX 就行，免费额度够用，做内部通知封面挺快。但图里的中文字经常是错的，别指望它写字，字我都是后期加的。"}, {"id": "T02", "src": "公司公告 · 11/01 发布", "text": "关于 AI 工具使用的通知：对外发布物料须使用已采购的 XX 平台；个人注册的工具不得上传客户信息、合同内容与未公开经营数据。"}, {"id": "T03", "src": "部门群 · 运营小李", "text": "说个教训：上个月我把客户名单贴进某个免费工具让它分类，第二天就收到一堆推销电话。别学我，名单这东西老实点。"}, {"id": "T04", "src": "部门群 · 实习生小陈", "text": "求助：会议录音两个多小时，我要整理成纪要，手打得三个小时。有没有办法先转成文字再整理？我怕直接贴进去太长它处理不了。"}, {"id": "T05", "src": "入职培训笔记 · 第 3 页", "text": "对话类工具适合：改写、摘要、列提纲、按模板套格式。不适合：查最新价格、判断是否违规、给你公司内部数据。"}, {"id": "T06", "src": "某视频工具 · 订阅页", "text": "免费版导出带水印，数字人形象只有 3 个；付费去水印，商用需另签授权。"}], "cols": [{"k": "type", "name": "这是哪类依据", "hint": "工具推荐 / 使用规则 / 踩坑案例 / 需求线索", "type": "chips", "w": 2, "tags": ["工具推荐", "使用规则", "踩坑案例", "需求线索"]}, {"k": "cat", "name": "对应哪一类", "hint": "四类之一；不是工具就选「不适用」", "type": "chips", "w": 2, "tags": ["对话写作", "配图", "短视频", "表格数据", "不适用"]}, {"k": "limit", "name": "它提示了哪件不能做的事", "hint": "选最贴近原文的一条", "type": "chips", "w": 3, "tags": ["别让它写图中文字", "客户信息与合同不能外传", "不能查最新价格或判合规", "免费版带水印、形象少", "两小时录音要先分段", "这只是公司规定不是工具", "配色需要人工调", "数字由我自己核对"]}, {"k": "action", "name": "你据此怎么做", "hint": "选一个你能立刻执行的动作", "type": "chips", "w": 3, "tags": ["配图只出图，文字人工加", "名单只在内部工具处理", "对外物料先确认已采购平台", "先转文字再按议题切段", "只用于改写/摘要/列提纲", "对外视频走已采购平台", "先试免费额度再决定", "只用于内部封面"]}], "key": {"T01": {"type": "工具推荐", "cat": "配图", "limit": "别让它写图中文字", "action": "配图只出图，文字人工加"}, "T02": {"type": "使用规则", "cat": "不适用", "limit": "客户信息与合同不能外传", "action": "对外物料先确认已采购平台"}, "T03": {"type": "踩坑案例", "cat": "不适用", "limit": "客户信息与合同不能外传", "action": "名单只在内部工具处理"}, "T04": {"type": "需求线索", "cat": "对话写作", "limit": "两小时录音要先分段", "action": "先转文字再按议题切段"}, "T05": {"type": "使用规则", "cat": "对话写作", "limit": "不能查最新价格或判合规", "action": "只用于改写/摘要/列提纲"}, "T06": {"type": "工具推荐", "cat": "短视频", "limit": "免费版带水印、形象少", "action": "对外视频走已采购平台"}}, "notes": {"T02·cat": "这是公司规则，不是某类工具 → 不适用。填成「对话写作」等于把制度当成工具", "T03·type": "这是别人踩过的坑，不是规则条文 → 踩坑案例。填「使用规则」会漏掉它最有价值的部分：真实后果", "T03·cat": "它没说哪类工具，说的是「任何免费工具都别贴名单」→ 不适用", "T04·type": "这是同事提出的需求，不是工具推荐 → 需求线索。最容易判错的一条", "T05·cat": "它讲的是对话类工具的能力边界 → 对话写作", "T06·cat": "订阅页讲的是视频工具的限制 → 短视频"}, "delta": [{"op": "删", "frm": "模型在选型表下面补了一句「以上工具均已通过公司安全审核」", "to": "整句删除", "why": "越权结论：安全审核结论不由你出，而且 T02 明确说对外物料只能用已采购平台，这句话会把违规写成合规", "kw": ["已通过", "安全审核", "合规", "放心使用"]}, {"op": "改", "frm": "模型的「配图」一行写「推荐 XX，效果专业」", "to": "改成「推荐 XX，用于内部封面；图内文字必须人工加」", "why": "不提中文字会错，新人第一次交图就会带着错别字上墙", "kw": ["中文字", "人工加", "内部", "封面"]}, {"op": "补", "frm": "模型漏掉了 T02 这条公司规则", "to": "在表头补一行硬约束：「对外物料走已采购平台；个人工具不传客户信息与未公开数据」", "why": "规则必须写在表的最上面，否则表越漂亮越容易带着违规去执行", "kw": ["已采购", "硬约束", "客户信息", "未公开"]}, {"op": "改", "frm": "模型把 T04 归成了「工具推荐」", "to": "改成「需求线索」——它说明的是场景需求（长录音要先转文字再分段），不是推荐某个工具", "why": "线索和推荐混在一起，选型表就会多出一个不该有的类目", "kw": ["需求线索", "长录音", "分段", "场景"]}], "refsheet": "T01｜工具推荐｜配图｜图内中文字会错，不能让它写字｜配图只出图，文字后期人工加\nT02｜使用规则｜不适用｜个人工具不得上传客户信息与未公开数据｜先确认公司已采购平台再注册\nT03｜踩坑案例｜不适用｜客户名单贴进免费工具会外泄｜名单只在内部工具里处理\nT04｜需求线索｜对话写作｜两小时录音不能整段贴，要先转文字再分段｜先转写，按议题切段再喂\nT05｜使用规则｜对话写作｜不能查最新价格、不能判断是否违规｜只用于改写、摘要、列提纲\nT06｜工具推荐｜短视频｜免费版带水印、形象只有 3 个、商用需授权｜对外视频走已采购平台\n\n四条最容易判错的：\n· T03 是踩坑案例，不是规则条文——它的价值在「真实后果」，别只记成「不许贴」。\n· T03 / T02 的类别都是「不适用」：它们约束所有工具，不对应某一类。\n· T04 是需求线索，不是工具推荐——最常被填错的一条。\n· T02 是公司规则，必须写在表头，不能和工具推荐并列成一行。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "我是刚入职的职场新人，日常主要做周报、会议纪要、竞品资料整理和简单汇报。请按「对话写作 / 配图 / 短视频 / 表格数据」四类，每类只推荐 1 个国内可以直接打开用、免费额度够新人用的工具，并给出三行说明：最适合新人的一个用法、一个最容易踩的坑、一件绝对不该交给它做的事。用表格输出，不要推荐需要企业采购的。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】四类工具矩阵（对话写作 / 配图 / 视频 / 表格数据）+ 每类一个避坑点\n【参考案例】新人注册了十几个工具，结果一个都没用熟\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n我是刚入职的职场新人，日常主要做周报、会议纪要、竞品资料整理和简单汇报。请按「对话写作 / 配图 / 短视频 / 表格数据」四类，每类只推荐 1 个国内可以直接打开用、免费额度够新人用的工具，并给出三行说明：最适合新人的一个用法、一个最容易踩的坑、一件绝对不该交给它做的事。用表格输出，不要推荐需要企业采购的。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U3", "tier": "basic", "step": "todo", "title": "画你的第一张 AI 提效地图", "video": {"dur": "3.3min", "script": ["提效计划失败的第一步，往往是连自己这一周到底在忙什么都没列全", "提效地图模板（工作项 / 耗时 / AI 帮哪一步 / 不交给它什么）", "一位新人入职两周后的地图样例（8 项 × 四列）"]}, "ppt": {"method": "提效地图模板（工作项 / 耗时 / AI 帮哪一步 / 不交给它什么）", "case": "一位新人入职两周后的地图样例（8 项 × 四列）", "demo": "填写指引：先列事实，再判断，最后排序"}, "objective": "能产出一张不少于 8 个工作项的提效地图，每项写清 AI 帮哪一步、哪一步不交给它", "transfer": "本周内从地图里挑 1 项试跑，动手前把地图发给师傅，请他在「不交给它」那列确认一下", "vslides": [{"t": "第一步：先把事实列全，别急着判断", "n": "打开一个空白文档，把这一周做过的事全列出来，争取列到八项。包括看起来琐碎的：找资料、回消息、整理表格、改格式、开会记笔记。别在这一步就判断「这个能不能用 AI」，先把事实列全。列不全，后面的地图就是空谈——很多人以为自己一周就干了三件事，真列出来往往是十几件。这里有个小技巧：翻一遍你的聊天记录和邮件，按时间顺序往回看，比坐着回忆准得多。列的时候顺手估个耗时，不用精确，半小时一档就够。为什么强调耗时？因为下周要挑试点，挑的依据就是「哪件最费时间」，光靠印象会挑错。还有一个信号值得留意：那些你一想到就烦的活，往往就是最该交给 AI 的活，烦通常来自重复劳动。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 翻聊天记录与邮件，按时间列\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 翻聊天记录与邮件，按时间列</tspan></text></g><g data-k=\"② 每项估个耗时\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 每项估个耗时</tspan></text></g><g data-k=\"③ 先列全，不判断\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 先列全，不判断</tspan></text></g></svg>", "d": 69.67}, {"t": "第二步：每行填三列，第三列最容易被跳过", "n": "每一行填三列。第一列，耗时。第二列，AI 能帮到哪一步——要具体到动作，比如「把录音转成要点初稿」，而不是「帮忙整理」。第三列，哪一步绝对不交给它——这一列最容易被跳过，却最能防止你出事。写第三列的方法很简单：问自己「这一段如果 AI 写错了，我会不会被骂」。会，就写进来。举个真实的例子：纪要里的责任人那一栏，AI 经常把「谁提到这件事」当成「谁负责」，你直接交上去，第二天就有人来找你。还有一个细节：第二列不要写成「全程用 AI」，绝大多数活只有某一步适合交给它，写「全程」说明你还没想清楚。写「哪一步」，比写「能不能」有用得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每行填三列</tspan></text><g data-k=\"工作项 + 耗时\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">工作项 + 耗时</tspan></text></g><g data-k=\"AI 帮到哪一步\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">AI 帮到哪一步</tspan></text></g><g data-k=\"哪一步不交给它\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">哪一步不交给它</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 61.2}, {"t": "第三步：只挑两项，本周就跑", "n": "地图写完不要摊子铺太大。只挑两项本周就试，优先挑「耗时长、错了也不致命」的。比如会议纪要和竞品整理，都比写周报安全。试的时候留一份对照：AI 的原始输出、你改过的版本，两份都存着。周末拿给师傅看，请他只看一件事——你改的那些地方，改对了没有。这一步的价值不在提效，而在于让师傅知道你在用方法做事，也知道你清楚边界在哪。新人第一周最容易被记住的，往往不是干得快，而是「这人有分寸」。另外提醒一句：不要拿还没试过的地图去要资源、要预算。地图是你自己的工具，不是汇报材料；拿它去汇报，容易被追问「提效多少」，而你根本还没跑。地图建议两周更新一次，等跑出真实数据再改第二版。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"只挑 1–2 项，本周就试\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只挑 1–2 项，本周就试</tspan></text></g><g data-k=\"优先「耗时 + 安全」\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">优先「耗时 + 安全」</tspan></text></g><g data-k=\"AI 原稿与修改稿都留\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">AI 原稿与修改稿都留</tspan></text></g></svg>", "d": 66.79}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["覆盖度", "颗粒度", "边界意识"], "acceptance": "一张能贴在工位旁的地图：≥8 项、每项有耗时与 AI 切入点、≥3 项写明「不交给它」的理由、选出 1–2 项本周试点"}, "practice": {"steps": ["列出本周 8 项主要工作，每项标上大概耗时（小时）", "对每项填：AI 能帮到哪一步（写到「读哪份材料、产出什么」）", "对每项填：哪一步绝对不交给 AI，为什么", "按「耗时 × 敢不敢试」排序，选出本周就要试的 1–2 项"], "exemplar": "【本周工作 × AI 提效地图】姓名：小林　岗位：市场部新人　周期：11/02–11/06\n\n■ 1. 整理上周竞品活动页（4h/周）\n　AI 能帮：把三家公开活动页的要点整理成「玩法 / 门槛 / 赠品 / 时效」四列\n　不交给它：判断哪家打法值得跟——这要我结合自家客单价说，AI 不知道我们的成本\n　本周试：周二下午，用三家公开页跑一遍，产出表给师傅看\n\n■ 2. 写周报（3h/周）\n　AI 能帮：把五条工作记录扩写成「进展 / 问题 / 下周计划」三段初稿\n　不交给它：本周问题那一段。问题怎么写、写到什么程度，涉及对上级的表述，我自己写\n　耗时预估：3h → 1h\n\n■ 3. 会议纪要（2h/次，每周约 2 次）\n　AI 能帮：录音转文字 → 整理成「结论 / 待办 / 责任人」三段\n　不交给它：责任人那一栏。AI 经常把「谁提到」当成「谁负责」，必须我核对\n　耗时预估：2h → 0.5h\n\n■ 4. 行业资料搜集（3h/周）\n　AI 能帮：给 5 个公开来源，让它按「观点 / 数据 / 出处」列表\n　不交给它：判断哪个数据可信——来源可信度要我自己点开看\n　红线：只搜公开信息，公司内部数据一个字都不贴\n\n■ 5. 整理客户名单（1h/周）\n　AI 能帮：把格式乱的名单统一成「公司 / 联系人 / 职位」三列\n　不交给它：整份名单不能贴进公开 AI，因为有手机号。我只贴脱敏后的「公司 + 行业」两列\n　红线：含手机号与邮箱的原始表不进任何外部工具\n\n■ 6. 做汇报配图（1h/周）\n　AI 能帮：按「主题 + 风格」生成封面图\n　不交给它：图里的文字。生成图的中文字经常错，文字我后期自己加\n　耗时预估：1h → 0.3h\n\n■ 7. 回复常规咨询邮件（1.5h/周）\n　AI 能帮：按「收到 / 答复 / 下一步」结构出草稿\n　不交给它：涉及价格和交期的答复，这两项必须查过系统再回\n　红线：报价与合同条款不交给 AI 起草\n\n■ 8. 学习产品资料（2h/周）\n　AI 能帮：把 20 页产品说明压缩成 10 条要点，标出我看不懂的术语\n　不交给它：判断哪些是重点——重点取决于我这个岗位要做什么\n　耗时预估：2h → 0.5h\n\n■ 本周试点（选 2 项）\n　试点 1：会议纪要（周三例会）→ 试完把「AI 版纪要 + 我改过的版本」一起给师傅看\n　试点 2：竞品活动页（周二下午）→ 试完把四列表发给师傅，请他看有没有漏项\n\n■ 自检\n　☑ 8 项都有耗时\n　☑ 3 项以上写了「不交给它」及理由\n　☑ 含手机号的那一项单独标了红线\n　☑ 两项试点都有具体时间"}, "task": "产出《个人 AI 提效地图》：列出本周 8 项主要工作，每项标上大概耗时（小时）；对每项填：AI 能帮到哪一步（写到「读哪份材料、产出什么」）；对每项填：哪一步绝对不交给 AI，为什么；按「耗时 × 敢不敢试」排序，选出本周就要试的 1–2 项", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M0 入职第一周：AI 能做什么、不能做什么」模块，你要交付的是《个人 AI 提效地图》。\n【场景】业务侧这周的诉求是：提效计划失败的第一步，往往是连自己这一周到底在忙什么都没列全。参考做法：一位新人入职两周后的地图样例（8 项 × 四列）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提效地图模板（工作项 / 耗时 / AI 帮哪一步 / 不交给它什么）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《个人 AI 提效地图》填写模板】\n\n■ 1. 列出本周 8 项主要工作，每项标上大概耗时（小时）\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 对每项填：AI 能帮到哪一步（写到「读哪份材料、产出什么」）\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 对每项填：哪一步绝对不交给 AI，为什么\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 按「耗时 × 敢不敢试」排序，选出本周就要试的 1–2 项\n   ‣ 提示：给出排序依据（频次 / 影响面 / 成本），不要只给结果。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【本周工作 × AI 提效地图】姓名：小林　岗位：市场部新人　周期：11/02–11/06\n\n■ 1. 整理上周竞品活动页（4h/周）\n　AI 能帮：把三家公开活动页的要点整理成「玩法 / 门槛 / 赠品 / 时效」四列\n　不交给它：判断哪家打法值得跟——这要我结合自家客单价说，AI 不知道我们的成本\n　本周试：周二下午，用三家公开页跑一遍，产出表给师傅看\n\n■ 2. 写周报（3h/周）\n　AI 能帮：把五条工作记录扩写成「进展 / 问题 / 下周计划」三段初稿\n　不交给它：本周问题那一段。问题怎么写、写到什么程度，涉及对上级的表述，我自己写\n　耗时预估：3h → 1h\n\n■ 3. 会议纪要（2h/次，每周约 2 次）\n　AI 能帮：录音转文字 → 整理成「结论 / 待办 / 责任人」三段\n　不交给它：责任人那一栏。AI 经常把「谁提到」当成「谁负责」，必须我核对\n　耗时预估：2h → 0.5h\n\n■ 4. 行业资料搜集（3h/周）\n　AI 能帮：给 5 个公开来源，让它按「观点 / 数据 / 出处」列表\n　不交给它：判断哪个数据可信——来源可信度要我自己点开看\n　红线：只搜公开信息，公司内部数据一个字都不贴\n\n■ 5. 整理客户名单（1h/周）\n　AI 能帮：把格式乱的名单统一成「公司 / 联系人 / 职位」三列\n　不交给它：整份名单不能贴进公开 AI，因为有手机号。我只贴脱敏后的「公司 + 行业」两列\n　红线：含手机号与邮箱的原始表不进任何外部工具\n\n■ 6. 做汇报配图（1h/周）\n　AI 能帮：按「主题 + 风格」生成封面图\n　不交给它：图里的文字。生成图的中文字经常错，文字我后期自己加\n　耗时预估：1h → 0.3h\n\n■ 7. 回复常规咨询邮件（1.5h/周）\n　AI 能帮：按「收到 / 答复 / 下一步」结构出草稿\n　不交给它：涉及价格和交期的答复，这两项必须查过系统再回\n　红线：报价与合同条款不交给 AI 起草\n\n■ 8. 学习产品资料（2h/周）\n　AI 能帮：把 20 页产品说明压缩成 10 条要点，标出我看不懂的术语\n　不交给它：判断哪些是重点——重点取决于我这个岗位要做什么\n　耗时预估：2h → 0.5h\n\n■ 本周试点（选 2 项）\n　试点 1：会议纪要（周三例会）→ 试完把「AI 版纪要 + 我改过的版本」一起给师傅看\n　试点 2：竞品活动页（周二下午）→ 试完把四列表发给师傅，请他看有没有漏项\n\n■ 自检\n　☑ 8 项都有耗时\n　☑ 3 项以上写了「不交给它」及理由\n　☑ 含手机号的那一项单独标了红线\n　☑ 两项试点都有具体时间", "rubric": ["工作项 ≥8 条，每条有耗时数字；只写「跟进事项」这类笼统词的按未填计", "AI 切入点写到「读哪份材料、产出什么」这个粒度，写「用 AI 提效」不算", "至少 3 条写明「哪一步不交给它」并给理由，理由要落到「错了谁担责」", "结尾选出 1–2 项本周试点，写明什么时候试、试完拿什么给师傅看"]}, {"id": "M0U4", "tier": "basic", "step": "spar", "title": "主管问「你打算怎么用 AI」", "video": {"dur": "3.3min", "script": ["这是新人第一周最常被问的一题，答得好与差只差一个结构", "回答三段式（结论 → 具体例子 → 边界）", "高分回答与低分回答对照（有例子 vs 只表态）"]}, "ppt": {"method": "回答三段式（结论 → 具体例子 → 边界）", "case": "高分回答与低分回答对照（有例子 vs 只表态）", "demo": "陪练对话说明（把系统提示词贴进 WorkBuddy）"}, "objective": "能在主管 3 轮追问下，用具体例子说清自己打算怎么用 AI、哪一步不交给它", "transfer": "把陪练里答得最差的那一问重写一遍，下次一对一沟通时主动讲给主管", "vslides": [{"t": "陪练说明：主管要的是例子，不是态度", "n": "接下来进入陪练，你的对手是直属主管。这一类问题他每周都会问一次，最烦听到「我会积极拥抱 AI」这种话。他要的是三样东西：哪件事、省了多少时间、你改了什么。所以上场前先想好一个真实的例子，越具体越好。如果没有特别亮眼的例子也不要紧，哪怕只是把一次会议纪要整理快了半小时，只要你说得出细节，就比空话强。提醒一点：不要编数字。主管对你的工作量有基本判断，你说「效率提升三倍」，他第一反应是「那你现在很闲？」。说实话反而安全。还有一层心理准备：他问这个问题，多半不是因为好奇，而是在判断「这个人能不能放手让他自己干」。你的答案要让他在心里给你贴一个「有分寸」的标签，而不是「很积极」的标签。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">回答三段式</tspan></text><g data-k=\"先给结论\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">先给结论</tspan></text></g><g data-k=\"再给例子\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">再给例子</tspan></text></g><g data-k=\"最后划边界\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">最后划边界</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 66.41}, {"t": "他会追什么：三个必问", "n": "三个问题几乎必问。第一，具体提在哪件事上，省了多少时间。第二，你改过哪些地方。第三，有没有哪类活你故意不让它做。前两问考的是你有没有真跑过，第三问考的是你有没有分寸。第三问最容易答砸——很多人为了显得积极，会说「都可以交给它」，这一句就把分寸全丢了。正确答法是给一条具体的：含客户手机号的名单不贴、报价不交给它起草。答完你会发现主管的表情会松一下，因为他确认了你不会给他惹事。第二问也有讲究：说「改了几个字」等于没改，要说清改的是哪一栏、为什么那一栏不能信 AI。比如「责任人那一栏我全核了一遍，它把提到名字的人都当成负责人」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"提在哪件事、省多少时间\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">提在哪件事、省多少时间</tspan></text></g><g data-k=\"你改了哪几处\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">你改了哪几处</tspan></text></g><g data-k=\"哪类活故意不让它做\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">哪类活故意不让它做</tspan></text></g></svg>", "d": 64.54}, {"t": "最刁的一问：如果我让你把客户名单丢进去", "n": "还有一问是压力测试：「如果我让你把客户名单丢进去分析呢？」这不是让你抗命，是看你会不会守住底线。答法是三步：先说我理解你要的是分析结果，再说名单里有手机号不能进外部工具，最后给替代方案——我可以只给「公司 + 行业」两列，或者用公司已采购的内部工具。这样既没顶撞，也没松口。这一问答好了，主管以后会把更要紧的活交给你，因为他知道你有边界感。守不住的人，通常也拿不到需要判断力的活。最后补一句心态：陪练里被问住是好事，说明你发现了一个真实的漏洞。把被问住的那一问记下来，回去补，比在这里一路顺风有用得多。下次进陪练前，先把这一问的答案写在纸上念一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">过关答法</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">两种都失分</tspan></text><g data-k=\"理解需求 + 说明风险 + 给替代方案\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">理解需求 + 说明风险 +</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">给替代方案</tspan></text></g><g data-k=\"直接照做 / 硬顶回去\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">直接照做 / 硬顶回去</tspan></text></g></svg>", "d": 64.78}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["例子具体", "改动说清", "边界明确"], "acceptance": "三个维度都答得出：具体到事的例子（含时间对比）、自己改动的具体位置、明确说出的边界与理由"}, "spar": {"role": "直属主管", "persona": "不看表态只看例子，会追问「具体哪件事、省了多少时间、哪一步你改的」", "mustAsk": ["你说的用 AI 提效，具体提在哪件事上？省了多少时间？", "AI 给你的东西，你改过哪些地方？举个具体的", "有没有哪类活你故意不让它做？为什么？", "如果我让你把客户名单丢进去分析，你怎么回我？"]}, "exemplar": "（主管问：你说的「用 AI 提效」，具体提在哪？）\n\n结论：我现在只在两件事上用，会议纪要和竞品资料整理，其他还在看。\n依据：上周三的例会，我把录音转成文字后让它整理成「结论 / 待办」两段，原来要一个半小时，这次二十分钟，改的地方主要是责任人那一栏——它把提到名字的人都算成了负责人，我一个个核对过。竞品那件事是把三家公开活动页整理成四列表，省了翻页的时间，但哪家值得跟我们没让它判断。\n边界：含客户手机号的名单我不贴进去，只给脱敏后的公司和行业；报价和交期这两类答复也不让它起草，必须查过系统我自己回。这两条我写在工位那张纸上了。", "task": "把《个人 AI 提效地图》拿到「直属主管」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《个人 AI 提效地图》。现在要让它通过「直属主管」这一关。\n【对手的立场】不看表态只看例子，会追问「具体哪件事、省了多少时间、哪一步你改的」。\n【他一定会追问】「你说的用 AI 提效，具体提在哪件事上？省了多少时间？」 / 「AI 给你的东西，你改过哪些地方？举个具体的」 / 「有没有哪类活你故意不让它做？为什么？」\n【场景】你说「主管问「你打算怎么用 AI」」，对方立刻回一句：你说的用 AI 提效，具体提在哪件事上？省了多少时间？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["回答里有至少一个真实的事，说得出「原来多久、现在多久」，不是「效率提升明显」", "说得出自己改过哪一处、为什么改，改的位置要具体到栏目或句子", "主动说出至少一类不交给 AI 的活，并给理由（错了谁担责）", "被问到「把客户名单丢进去」时，能明确拒绝并给出替代做法，不含糊其辞"]}, {"id": "M0U5", "tier": "adv", "step": "understand", "title": "人机分工四象限：判断强度 × 材料量", "video": {"dur": "3.3min", "script": ["三分法告诉你哪些能交，四象限告诉你同一件活里哪一段能交", "四象限图（材料多判断少 / 材料多判断多 / 材料少判断少 / 材料少判断多）", "同一份竞品分析，拆成「资料整理」与「要不要跟」两段，前者交给 AI"]}, "ppt": {"method": "四象限图（材料多判断少 / 材料多判断多 / 材料少判断少 / 材料少判断多）", "case": "同一份竞品分析，拆成「资料整理」与「要不要跟」两段，前者交给 AI", "demo": "四象限定位卡（拿 5 项任务各定一次位）"}, "objective": "能用「判断强度 × 材料量」四象限给任意一项任务定位，并说出该交给 AI 的哪一段", "transfer": "拿四象限给自己岗位的 5 项任务各定一次位，把结论写进上一节那张地图", "vslides": [{"t": "为什么三分法还不够", "n": "上一节的三分法有个局限：它把整件事当成一个整体来判断，但真实的活往往是混合的。比如「做一份竞品分析」，里面既有翻二十个页面的苦活，也有「所以我们要不要跟进」的判断。前者能整段交，后者一点都不能交。如果你只会整体判断，结论要么是「这个能交」然后把判断也交了出去，要么是「这个不能交」于是连苦活也自己扛。前一种会出事，后一种会累死。所以需要第二把尺子：把任务拆开，一段一段看。这一节就给你这把尺子，只有两个维度，很好记，但用起来能省掉大量判断时间。拆的时候有个原则：按「动作」拆，不按「话题」拆。同一份竞品分析里，「收集」和「下结论」是两个动作，不是一个话题。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">两个维度就够了</tspan></text><g data-k=\"材料量\"><rect x=\"18.0\" y=\"52.0\" width=\"175.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"105.5\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.5\">材料量</tspan></text></g><g data-k=\"判断强度\"><rect x=\"207.0\" y=\"52.0\" width=\"175.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"294.5\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"294.5\">判断强度</tspan></text></g><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.88}, {"t": "四象限：材料多判断少是最肥的一块", "n": "横轴是材料量，纵轴是判断强度，四个格子。第一格，材料多、判断少：读一堆东西出个初稿，这是 AI 最肥的一块，能整段交。第二格，材料多、判断也多：比如竞品分析里「要不要跟」，AI 能帮你把材料摆齐，但结论你写。第三格，材料少、判断少：比如把一句话改个说法，随手就交。第四格，材料少、判断重：比如「这个方案推不推」，材料就两页，但权重很大，这一格 AI 基本帮不上，最多帮你列出反方观点。给任务定位时先问「材料有多少」，再问「错了谁担责」，四格就出来了。定位完再看一眼：你现在花时间最多的活落在哪一格？多半是第一格，那正是最该动手的地方。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">人机分工四象限</tspan></text><g data-k=\"材料多 · 判断少 → 整段交\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"74.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">材料多 · 判断少</tspan><tspan x=\"72.7\" dy=\"14.950000000000001\">→ 整段交</tspan></text></g><g data-k=\"材料多 · 判断多 → 交材料、我下结论\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"67.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">材料多 · 判断多</tspan><tspan x=\"200.0\" dy=\"14.950000000000001\">→ 交材料、我下结</tspan><tspan x=\"200.0\" dy=\"14.950000000000001\">论</tspan></text></g><g data-k=\"材料少 · 判断少 → 随手交\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"74.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">材料少 · 判断少</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\">→ 随手交</tspan></text></g><g data-k=\"材料少 · 判断重 → 只让它列反方\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"153.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">材料少 · 判断重</tspan><tspan x=\"72.7\" dy=\"14.950000000000001\">→ 只让它列反方</tspan></text></g></svg>", "d": 66.34}, {"t": "三个常见误判，都是把第二格当成第一格", "n": "新人最容易犯三个错，本质都是把「材料多判断也多」错当成「材料多判断少」。第一个，让 AI 直接给「建议主推哪个卖点」，它会给得很像样，但那是基于通用常识，不是基于你家用户的真实反馈。第二个，让它判断「这份数据说明什么」，它会把相关性说成因果。第三个，让它写「对这位同事的评价」，这一格根本不该碰。识别方法很简单：只要你发现自己想问「所以到底该怎么办」，那一段就在第二格或第四格，结论必须你来。还有一条更实用的判断：如果这段结论将来要被追责，那它一定不在第一格。反过来，如果这段活你只是想省点打字时间，那多半就在第一格，放心交。判断完把结果写进地图，别只在脑子里过一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"让它定卖点优先级 → 错\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">让它定卖点优先级 → 错</tspan></text></g><g data-k=\"让它解释数据因果 → 错\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">让它解释数据因果 → 错</tspan></text></g><g data-k=\"让它评价人 → 根本不该碰\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">让它评价人 → 根本不该碰</tspan></text></g></svg>", "d": 68.59}], "deliverable": {"type": "skill", "name": "任务分工四象限", "rubric": ["拆分合理", "定位准确", "完成度说明"], "acceptance": "能把一项复合任务拆成至少 3 段，每段在四象限里定位，并说明交给 AI 的那段产出到什么完成度"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】四象限图（材料多判断少 / 材料多判断多 / 材料少判断少 / 材料少判断多）\n【为什么重要】三分法告诉你哪些能交，四象限告诉你同一件活里哪一段能交\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["能把一项真实任务拆成 ≥3 段，不是笼统说「这件事能用 AI」", "每段都能说清属于哪个象限，判断依据是材料量与判断强度，不是感觉", "对交给 AI 的那一段，说得出产出能到什么完成度（如结构可用、结论待定）", "至少指出一段「材料多但判断也重」的活，说明为什么只能半交"]}, {"id": "M0U6", "tier": "adv", "step": "demo", "title": "把一件杂活拆成 AI 能接的步骤链", "video": {"dur": "3.4min", "script": ["不会拆的人只能整件交给 AI，结果拿到一份看着像样、实际不能用的东西", "四段拆解法（收材料 → 出结构 → 填内容 → 人收口）", "「整理一份行业简报」从 6 小时压到 1.5 小时"]}, "ppt": {"method": "四段拆解法（收材料 → 出结构 → 填内容 → 人收口）", "case": "「整理一份行业简报」从 6 小时压到 1.5 小时", "demo": "WorkBuddy 内跑「收材料 + 出结构」两段，人做后两段"}, "objective": "能把一件复合杂活拆成 4 段步骤链，标注每段谁做，并真跑通其中交给 AI 的两段", "transfer": "挑本周最烦的一件杂活，按四段拆一次，把拆解表发给师傅请他挑一段让你试", "vslides": [{"t": "演示准备：一件典型的复合杂活", "n": "这次演示的活是「整理一份行业简报，下周部门周会用」。它是典型的复合任务：要搜材料、要定结构、要填空、还要给出启示。整件交给 AI，你会拿到一份看着很完整、但每句话都不敢用的东西；完全自己做，六个小时就没了。正确的做法是拆成四段：收材料、出结构、填内容、人收口。前两段 AI 能接，第三段半接，第四段只能你来。为什么按这四段拆？因为这四段的「错法」不一样：收材料错在漏、出结构错在缺块、填内容错在编、收口错在越权。错法不同，验收方式就不同，能让 AI 干的和不能让它干的也就分开了。拆完把四段写成一行贴在任务旁边，跑的时候照着走。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四段拆解法</tspan></text><g data-k=\"收材料\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">收材料</tspan></text></g><g data-k=\"出结构\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">出结构</tspan></text></g><g data-k=\"填内容\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">填内容</tspan></text></g><g data-k=\"人收口\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">人收口</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 64.27}, {"t": "跑前两段：只让它做结构，不让它下判断", "n": "提示词里我做了两个限制。第一，只做结构和填空，不许给经营建议——不加这句，它一定会顺手告诉你「建议加大补贴」。第二，凡是不确定的数字一律写「待核实」，不许估算。第二句特别重要，AI 默认会为了「完整」而编数字，一个「约 12%」看起来无害，进了周会就是事故。跑完你会看到初稿里有好几个「待核实」，这不是缺陷，这是它诚实的表现。你真正要做的，是带着这几个空去查，而不是让它填满。还有一个技巧：把材料分两次给它。先给结构要求，看它列的字段够不够；确认结构之后再贴材料。一次全给它，它会边想结构边编内容，两件事都做不好。结构那一步只让它列字段，不要让它先写正文，否则它会边写边改结构。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：一段公开材料 + 四块结构要求\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一段公开材料 + 四块结构要求</tspan></text></g><g data-k=\"约束：不许给建议 / 不确定写待核实\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：不许给建议 / 不确定写待核实</tspan></text></g><g data-k=\"产出：骨架 + 带空位的初稿\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：骨架 + 带空位的初稿</tspan></text></g></svg>", "d": 70.15}, {"t": "人工收口：后两段才是你的价值", "n": "接下来两段是人做的。第三段填内容：把「待核实」逐个查掉，查不到的就在周会上说明「这项拿不到」。第四段收口：把「对我们的启示」写成你自己的判断，并写明需要谁确认。这一段是整份简报唯一有价值的部分，也是最不能交出去的部分。对比一下：AI 帮你省的是前三小时翻材料，你花的一小时是在做判断。这才是正确的分工比例——不是让它替你思考，是让它替你把材料摆齐，好让你有脑力思考。判断这一段做好了，别人记住的是你的观点；做不好，别人记住的是一份「看着挺全但没有结论」的简报。两者的差别，不在 AI 用得多好，在你有没有收口。收口那一段建议不超过三百字，写长了说明还没想清楚。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"把「待核实」逐个查掉\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">把「待核实」逐个查掉</tspan></text></g><g data-k=\"启示自己写，标明确认人\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">启示自己写，标明确认人</tspan></text></g><g data-k=\"查不到的当场说明\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">查不到的当场说明</tspan></text></g></svg>", "d": 70.13}], "deliverable": {"type": "skill", "name": "任务步骤链拆解表", "rubric": ["拆解完整", "责任清晰", "真跑通"], "acceptance": "能产出《任务步骤链拆解表》并通过本单元评分要点"}, "demo": {"ref": "■ 简报结构骨架（可直接套用）\n\n一、市场规模\n · 字段：本期 GMV 口径 / 同比 / 环比 / 数据来源与统计周期\n二、主要玩家动作\n · 字段：玩家 / 动作类型（补贴·上新·履约）/ 覆盖区域 / 时间 / 出处链接\n三、政策与舆情\n · 字段：发文主体 / 要点一句话 / 影响面（消费者·团长·平台）/ 生效时间\n四、对我们的启示\n · 字段：判断 / 依据 / 建议动作 / 需要谁确认\n\n■ 初稿（基于你给的公开信息）\n\n一、市场规模\n · 本期 GMV：待核实（你给的材料里没有口径说明）\n · 同比/环比：待核实\n · 来源：你提供的 2 篇报道，统计周期不一致，已标出\n\n二、主要玩家动作\n · 玩家 A：区域补贴，覆盖华东 3 城，11 月 1 日起 —— 出处：报道 1\n · 玩家 B：上新自有品牌，全国 —— 出处：报道 2\n · 玩家 C：待补充（材料中仅提及，无具体动作）\n\n三、政策与舆情\n · 发文主体：某地市场监管部门\n · 要点：社区团购价格行为提示\n · 影响面：团长端为主\n · 生效时间：待核实\n\n四、对我们的启示\n · 判断：本周期主要变化集中在履约侧，不在价格侧\n · 依据：玩家 A 的补贴集中在配送时效，未直接降价\n · 建议动作：跟进履约成本对比\n · 需要谁确认：供应链负责人\n\n⚠ 我无法确认的部分：GMV 口径、政策生效时间、玩家 C 的具体动作。", "fix": ["把「建议动作：加大补贴」删掉——AI 顺手给了个经营建议，这不是它能定的，也不是我这个新人能定的。", "给每一块都补了「需要谁确认」字段。原来只有「启示」，没有确认人，交上去会被问「这谁定的」。", "把两篇统计周期不一致的报道单独标出来，而不是取平均。AI 默认会把不同口径的数字放在一起算。", "保留了大量「待核实」而不是让 AI 估算。它一开始自动补了三个百分比，全部删掉，宁可空着。"], "judge": "判断依据：有没有出现无来源的数字；有没有把「启示」写成结论；口径不一致有没有被指出；每一块有没有明确确认人", "sheet": {"situ": "周四上午，师傅转来一条需求：「周五部门周会要一份社区团购行业简报，你来整理，15 分钟讲完，别超过 8 页。」你手上只有 6 份零散材料——一条群消息、两篇公开报道、上周的简报模板、师傅的一句提醒、和你自己的时间记录。你要把它拆成「收材料 / 出结构 / 填内容 / 人收口」四段，标清每段谁做。", "ask": "① 把 6 份材料逐份归到它该被用在哪一段，并标出这一段谁做；② 写清这份材料在那一段变成什么产出；③ 标出这一段最容易出的错，作为你自己交稿前的检查点。", "gen": "请基于以上拆解表：① 按四段给出每一步的具体动作与产出；② 标出哪几步必须人做、哪几步 AI 可以整段做；③ 写一张交稿前的检查清单，每条不超过一行。\n不要给经营建议，不要估算任何没有来源的数字。", "mats": [{"id": "W01", "src": "部门群 · 师傅", "text": "周五上午 10 点周会，给你 15 分钟，讲三件事：市场有什么变化、对手在做什么、我们该关注什么。别超过 8 页，页数多了讲不完。"}, {"id": "W02", "src": "公开报道 A · 11/01", "text": "某社区团购平台在华东 3 城推出履约时效补贴，11 月 1 日起生效，主打「次日达」，未披露补贴金额与单量。"}, {"id": "W03", "src": "公开报道 B · 10/30", "text": "某平台上新自有品牌，覆盖全国，涉及粮油与日化两个类目，报道未披露销售数据与铺货门店数。"}, {"id": "W04", "src": "上周简报 · 部门共享盘", "text": "结构为四块：市场规模 / 主要玩家动作 / 政策与舆情 / 对我们的启示，共 6 页，每块 1–2 页，最后一页是结论与建议动作。"}, {"id": "W05", "src": "部门群 · 师傅补充", "text": "提醒一句：上周那份简报被问住了，因为写了「预计增长 20%」但说不出处。这次凡是拿不准的数字，直接写「待核实」，别估。"}, {"id": "W06", "src": "我的日程 · 本周", "text": "周三下午 14:00–16:00 空，周四上午 9:00–12:00 空，周五 8:30 前要交初稿，9:30 打印，10:00 开会。"}], "cols": [{"k": "stage", "name": "用在哪一段", "hint": "收材料 / 出结构 / 填内容 / 人收口", "type": "chips", "w": 2, "tags": ["收材料", "出结构", "填内容", "人收口"]}, {"k": "who", "name": "谁做", "hint": "AI 能整段做 / 我 + AI 协作 / 只能我来", "type": "chips", "w": 2, "tags": ["AI", "我+AI", "我"]}, {"k": "out", "name": "变成什么产出", "hint": "选最贴近这份材料用途的一条", "type": "chips", "w": 3, "tags": ["定 8 页上限与三块内容", "摘时间/区域/动作三要素", "摘动作并标出数据缺口", "套出四块字段骨架", "定「不确定写待核实」的规矩", "排出收集/成稿/核数时间", "写成完整分析段落", "顺手生成配图"]}, {"k": "risk", "name": "这一段最容易出的错", "hint": "选最可能让你返工的一条", "type": "chips", "w": 3, "tags": ["照搬模板页数讲不完", "顺手写分析或编补贴金额", "把「未披露」当成「没有」", "让 AI 顺便写正文会改乱结构", "留了一个估算数字", "忘了留核数时间", "漏掉政策与舆情块", "页码编号错"]}], "key": {"W01": {"stage": "出结构", "who": "我", "out": "定 8 页上限与三块内容", "risk": "照搬模板页数讲不完"}, "W02": {"stage": "收材料", "who": "我+AI", "out": "摘时间/区域/动作三要素", "risk": "顺手写分析或编补贴金额"}, "W03": {"stage": "收材料", "who": "我+AI", "out": "摘动作并标出数据缺口", "risk": "把「未披露」当成「没有」"}, "W04": {"stage": "出结构", "who": "AI", "out": "套出四块字段骨架", "risk": "让 AI 顺便写正文会改乱结构"}, "W05": {"stage": "填内容", "who": "我", "out": "定「不确定写待核实」的规矩", "risk": "留了一个估算数字"}, "W06": {"stage": "人收口", "who": "我", "out": "排出收集/成稿/核数时间", "risk": "忘了留核数时间"}}, "notes": {"W01·stage": "需求里的「15 分钟、8 页、讲三件事」定的是结构 → 出结构。归到「收材料」就丢了页数约束", "W01·who": "页数与讲解重点要人定，AI 不知道周会节奏 → 我", "W04·who": "模板是现成的，照着套字段是纯机械活 → AI 可以整段做", "W05·stage": "「不确定写待核实」是填内容阶段的规矩，不是结构问题 → 填内容", "W06·stage": "时间安排属于交付前的收口动作 → 人收口。最容易被漏掉的一条", "W06·who": "排期只有你自己知道哪段时间真的空 → 我"}, "delta": [{"op": "删", "frm": "模型在「对我们的启示」里写了「预计下季度社区团购将增长 20% 以上」", "to": "整句删除，改为「待核实：本期无公开口径数据」", "why": "无来源预估正是上周被问住的点，W05 已经点名要求不估", "kw": ["预计", "20%", "增长", "待核实"]}, {"op": "改", "frm": "模型把 W01 归到「收材料」，理由是「这是需求信息」", "to": "改成「出结构」——它定的是页数、时长与三块内容，属于结构约束", "why": "归错段会导致结构阶段没人负责，最后交出来 12 页讲不完", "kw": ["出结构", "8 页", "15 分钟", "三件事"]}, {"op": "补", "frm": "模型漏掉了 W06 时间记录", "to": "在「人收口」补一条：周三收集、周四成稿、周五 8:30 前核数字", "why": "不排期，前两段做得再好也会卡在最后一晚", "kw": ["排期", "周三", "周四", "8:30"]}, {"op": "改", "frm": "模型给 W02/W03 各写了一整段分析", "to": "收材料阶段只摘三要素：时间 / 区域 / 动作；分析留到填内容", "why": "收材料阶段写分析，等于把判断提前做了，后面就没有可改的余地", "kw": ["三要素", "时间", "区域", "动作"]}], "refsheet": "W01｜出结构｜我｜定下 8 页上限与三块内容｜最容易错：照搬模板页数，讲不完\nW02｜收材料｜我+AI｜摘出时间 / 区域 / 动作三要素｜最容易错：顺手写分析、编补贴金额\nW03｜收材料｜我+AI｜摘出动作与缺口（未披露销售数据）｜最容易错：把「未披露」当成「没有」\nW04｜出结构｜AI｜按模板出四块字段骨架｜最容易错：让 AI 顺便写正文，结构会被改乱\nW05｜填内容｜我｜定「不确定写待核实」的规矩，逐条核｜最容易错：留一个估算数字\nW06｜人收口｜我｜排期：周三收集、周四成稿、周五 8:30 核数｜最容易错：忘了留核数时间\n\n四条最容易判错的：\n· W01 是结构约束（页数/时长/三块），不是材料 → 出结构。\n· W05 是填内容阶段的规矩，不是结构问题。\n· W06 最容易被当成「与简报无关」而漏掉，但它决定你能不能按时交。\n· 收材料阶段只摘要素，不写分析——判断要留到填内容阶段做。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "我要整理一份「社区团购」行业的周度简报，给部门周会用。请只做两件事：第一，按「市场规模 / 主要玩家动作 / 政策与舆情 / 对我们的启示」四块，给出这份简报的结构骨架，每块列出需要填哪几个字段；第二，基于我接下来贴的公开信息，把每一块填成初稿。凡是你不确定的数字，一律写「待核实」，不要估算。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】四段拆解法（收材料 → 出结构 → 填内容 → 人收口）\n【参考案例】「整理一份行业简报」从 6 小时压到 1.5 小时\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n我要整理一份「社区团购」行业的周度简报，给部门周会用。请只做两件事：第一，按「市场规模 / 主要玩家动作 / 政策与舆情 / 对我们的启示」四块，给出这份简报的结构骨架，每块列出需要填哪几个字段；第二，基于我接下来贴的公开信息，把每一块填成初稿。凡是你不确定的数字，一律写「待核实」，不要估算。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U7", "tier": "adv", "step": "todo", "title": "写一份「我的岗位 AI 使用清单」", "video": {"dur": "3.3min", "script": ["把边界写下来贴在桌边，比记在脑子里可靠——忙起来的时候人是不会想起边界的", "清单三段式（整段交 / 半交 / 不交）+ 每段一句判据 + 一个替代做法", "一位运营新人贴在工位旁的清单（12 项 × 三类）"]}, "ppt": {"method": "清单三段式（整段交 / 半交 / 不交）+ 每段一句判据 + 一个替代做法", "case": "一位运营新人贴在工位旁的清单（12 项 × 三类）", "demo": "清单模板与填写示例"}, "objective": "能产出一份岗位 AI 使用清单，把日常任务分成整段交 / 半交 / 不交三类并各给一条判据", "transfer": "把清单精简成一页发给师傅，请他在「不交」那一栏签字确认，再贴到工位旁", "vslides": [{"t": "为什么要把清单写在纸上", "n": "你可能会想，这些道理我都懂，何必写下来。因为忙起来的时候人是不会想起边界的。周五下午五点，主管催你要一份名单分析，你手上正好有一份带手机号的表，这时候脑子里那点「应该脱敏」的念头很容易被「先交了再说」盖过去。一张贴在桌边的纸，能在那一秒拦住你。这不是形式主义，这是给未来的自己设一道物理屏障。清单不需要漂亮，一页 A4，能一眼看到「不交」那一栏就够。还有一层作用：清单也是你跟别人沟通的工具。同事来借工具、来问「这个能不能贴」，你指一下纸就行，不用每次重新解释。边界写在纸上，就变成了团队共识；只存在脑子里，就只是你一个人的坚持。清单不用一次写完，先把这周碰到的活补进去，两周就能成形。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 列 10–12 项日常任务\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列 10–12 项日常任务</tspan></text></g><g data-k=\"② 归三类\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 归三类</tspan></text></g><g data-k=\"③ 每类写判据\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 每类写判据</tspan></text></g></svg>", "d": 67.18}, {"t": "三类怎么写：判据要能判新任务", "n": "三类的判据要写成能判新任务的样子。整段交的判据是「有标准形状、错了只是不好看、我能一眼看出对不对」。半交的判据是「有判断成分、结论我定、我说得清为什么」。不交的判据是「错了要担责，或涉及个人信息、对外承诺、合规定性」。写完拿一条新任务试一下：如果按判据能三秒归位，说明写对了；如果还要想半天，说明判据太虚，得改。别写「视情况而定」，那等于没写。还有一条实用建议：把每一类里最高频的那一项排在最前面。清单不是给人看的文件，是给自己用的工具，用的时候第一眼看到的应该是你每天都会碰到的那几件事。排在后面的可以简写，只留关键词。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类的判据</tspan></text><g data-k=\"整段交 有标准形状，一眼能验\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"106.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">整段交</tspan><tspan x=\"72.7\" dy=\"14.950000000000001\">有标准形状，一眼</tspan><tspan x=\"72.7\" dy=\"14.950000000000001\">能验</tspan></text></g><g data-k=\"半交 有判断，结论我定\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"114.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">半交</tspan><tspan x=\"200.0\" dy=\"14.950000000000001\">有判断，结论我定</tspan></text></g><g data-k=\"不交 要担责 / 涉隐私 / 涉承诺\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"148.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"106.5\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">不交</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\">要担责 / 涉隐私 /</tspan><tspan x=\"327.3\" dy=\"14.950000000000001\"> 涉承诺</tspan></text></g></svg>", "d": 64.27}, {"t": "「不交」一定要给替代做法", "n": "光写「不用 AI」是没用的，因为活还是得干，最后你还是会想办法。所以每一项「不交」都要写一个替代做法：脱敏后再给、用公司内部工具、查系统自己写、标疑点交法务。写替代做法的过程，其实是在给自己留后路——你证明了这件事不用 AI 也能完成，才不会在赶时间的时候破例。最后一步，把清单发给师傅确认，请他在「不交」那一栏补一条他见过的坑。他补的那一条，往往比你写十条都有用。为什么？因为他是从事故里学的，你是从原理上推的，事故的记忆永远比原理更硬。确认完记得写上日期和确认人，这张纸才算真的生效。过一个月回头看一次，把用熟的项划掉，把新踩的坑补上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每项「不交」都有替代做法\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项「不交」都有替代做法</tspan></text></g><g data-k=\"发给师傅补一条真实坑\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">发给师傅补一条真实坑</tspan></text></g><g data-k=\"贴到工位旁，一页内\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">贴到工位旁，一页内</tspan></text></g></svg>", "d": 66.7}], "deliverable": {"type": "skill", "name": "岗位 AI 使用清单", "rubric": ["分类准确", "判据可判", "替代方案"], "acceptance": "一页纸清单：≥10 项任务分三类、每类有判据、「不交」项都有替代做法、经师傅确认"}, "practice": {"steps": ["列 10–12 项你岗位的日常任务，按发生频率排序", "把每项归到三类：整段交 / 半交 / 不交", "给每一类写一句判据（为什么这项在这一类）", "对「不交」的每一项，写出一个替代做法（不给 AI 那怎么做）", "精简到一页，发给师傅确认后贴到工位旁"], "exemplar": "【我的岗位 AI 使用清单】市场部新人 · 小林 · 2026-11-02\n\n■ 一、整段交（AI 出成品，我通读后可用）\n　判据：有标准形状，错了只是不好看，我能一眼看出对不对。\n　1. 会议录音转文字并整理成「结论 / 待办」两段\n　2. 把一堆公开链接整理成「标题 / 来源 / 要点」三列表\n　3. 长文压缩成 300 字摘要\n　4. 中英混排的格式统一\n　5. 按固定模板套一封内部通知邮件\n　6. 把产品说明里的术语列成一张解释表\n\n■ 二、半交（AI 出草稿或选项，我改后定稿）\n　判据：有判断成分，但结论要我来定，且我能说清为什么这么定。\n　7. 周报的「进展」与「下周计划」两段 —— AI 扩写，我改事实与措辞\n　8. 竞品活动的四列对比表 —— AI 填表，我判断哪家值得跟\n　9. 汇报 PPT 的页面结构 —— AI 出大纲，我调顺序与取舍\n　10. 客户常见问题的答复草稿 —— AI 出结构，价格与交期我查系统后填\n\n■ 三、不交（一点都不给，或只给脱敏后的片段）\n　判据：错了要有人担责，而那个人是我；或涉及个人信息、对外承诺、合规定性。\n　11. 含客户手机号 / 邮箱的原始名单\n　　　替代做法：只导出「公司 + 行业」两列再给 AI；或直接在公司内部工具里做\n　12. 报价单、合同条款、对外承诺的交付时间\n　　　替代做法：查系统 → 找主管确认 → 自己写，AI 只用来检查错别字\n　13. 对同事的工作评价、绩效相关表述\n　　　替代做法：不写。这类内容不进任何文档，只在当面沟通时说\n　14. 涉及是否违反广告法 / 平台规则的定性判断\n　　　替代做法：标出疑点，交法务或平台运营确认，我不下结论\n\n■ 我给自己定的三条铁律\n　① 含手机号、地址、订单号的原始材料，一个字都不贴进外部工具\n　② 凡是「建议 / 结论 / 评价」这类词开头的内容，必须是我写的\n　③ 交上去之前通读一遍，删掉 AI 自己补的数字\n\n■ 确认记录\n　2026-11-03 已发给师傅（王姐）看过，她在「不交」三类上补了一条：\n　「客户的合同扫描件也不要贴，哪怕是脱敏的」。已加到第 11 项。"}, "task": "产出《岗位 AI 使用清单》：列 10–12 项你岗位的日常任务，按发生频率排序；把每项归到三类：整段交 / 半交 / 不交；给每一类写一句判据（为什么这项在这一类）；对「不交」的每一项，写出一个替代做法（不给 AI 那怎么做）；精简到一页，发给师傅确认后贴到工位旁", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M0 入职第一周：AI 能做什么、不能做什么」模块，你要交付的是《岗位 AI 使用清单》。\n【场景】业务侧这周的诉求是：把边界写下来贴在桌边，比记在脑子里可靠——忙起来的时候人是不会想起边界的。参考做法：一位运营新人贴在工位旁的清单（12 项 × 三类）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（清单三段式（整段交 / 半交 / 不交）+ 每段一句判据 + 一个替代做法），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《岗位 AI 使用清单》填写模板】\n\n■ 1. 列 10–12 项你岗位的日常任务，按发生频率排序\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 把每项归到三类：整段交 / 半交 / 不交\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 给每一类写一句判据（为什么这项在这一类）\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 对「不交」的每一项，写出一个替代做法（不给 AI 那怎么做）\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 精简到一页，发给师傅确认后贴到工位旁\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【我的岗位 AI 使用清单】市场部新人 · 小林 · 2026-11-02\n\n■ 一、整段交（AI 出成品，我通读后可用）\n　判据：有标准形状，错了只是不好看，我能一眼看出对不对。\n　1. 会议录音转文字并整理成「结论 / 待办」两段\n　2. 把一堆公开链接整理成「标题 / 来源 / 要点」三列表\n　3. 长文压缩成 300 字摘要\n　4. 中英混排的格式统一\n　5. 按固定模板套一封内部通知邮件\n　6. 把产品说明里的术语列成一张解释表\n\n■ 二、半交（AI 出草稿或选项，我改后定稿）\n　判据：有判断成分，但结论要我来定，且我能说清为什么这么定。\n　7. 周报的「进展」与「下周计划」两段 —— AI 扩写，我改事实与措辞\n　8. 竞品活动的四列对比表 —— AI 填表，我判断哪家值得跟\n　9. 汇报 PPT 的页面结构 —— AI 出大纲，我调顺序与取舍\n　10. 客户常见问题的答复草稿 —— AI 出结构，价格与交期我查系统后填\n\n■ 三、不交（一点都不给，或只给脱敏后的片段）\n　判据：错了要有人担责，而那个人是我；或涉及个人信息、对外承诺、合规定性。\n　11. 含客户手机号 / 邮箱的原始名单\n　　　替代做法：只导出「公司 + 行业」两列再给 AI；或直接在公司内部工具里做\n　12. 报价单、合同条款、对外承诺的交付时间\n　　　替代做法：查系统 → 找主管确认 → 自己写，AI 只用来检查错别字\n　13. 对同事的工作评价、绩效相关表述\n　　　替代做法：不写。这类内容不进任何文档，只在当面沟通时说\n　14. 涉及是否违反广告法 / 平台规则的定性判断\n　　　替代做法：标出疑点，交法务或平台运营确认，我不下结论\n\n■ 我给自己定的三条铁律\n　① 含手机号、地址、订单号的原始材料，一个字都不贴进外部工具\n　② 凡是「建议 / 结论 / 评价」这类词开头的内容，必须是我写的\n　③ 交上去之前通读一遍，删掉 AI 自己补的数字\n\n■ 确认记录\n　2026-11-03 已发给师傅（王姐）看过，她在「不交」三类上补了一条：\n　「客户的合同扫描件也不要贴，哪怕是脱敏的」。已加到第 11 项。", "rubric": ["任务 ≥10 项，按频率排序，高频项排在前面", "三类各有判据，判据要能拿来判新任务，不是「视情况而定」", "「不交」那一类的每一项都写了替代做法，不能只写「不用 AI」", "清单控制在一页内，且已发给师傅确认（写明发给谁、什么时候）"]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "部门经理质疑「会不会把数据带出去」", "video": {"dur": "3.3min", "script": ["经理不怕你用 AI，怕的是你用完之后没人说得清数据去了哪", "安全应答三件套（哪些不碰 / 怎么脱敏 / 出了事怎么查）", "「我只是问了一句」vs「我说清了字段与留痕」两种回答的差别"]}, "ppt": {"method": "安全应答三件套（哪些不碰 / 怎么脱敏 / 出了事怎么查）", "case": "「我只是问了一句」vs「我说清了字段与留痕」两种回答的差别", "demo": "陪练说明：他会追到字段级"}, "objective": "能在部门经理 3 轮质疑下，用清单与留痕证明自己的 AI 用法不会把公司数据带出去", "transfer": "把陪练里被问住的问题补进清单的「不交」栏，下次部门会前先自查一遍", "vslides": [{"t": "陪练说明：他怕的不是 AI，是说不清", "n": "这一关的对手是部门经理。他其实不反对你用 AI，他怕的是一件事：出问题的时候，没人说得清数据去了哪。所以他的问法会很直接——「数据不就出去了吗」。这时候千万别急着表忠心说「我很注意的」，那句话在他听来等于什么都没说。你要给的是一张能对上号的东西：哪些不碰、依据是什么、留了什么痕。这三样摆出来，他的疑虑基本就消了。他追问的深度会到字段级，所以提前把字段名想清楚，别现场回忆。还有一个心理准备：他可能会连着问三个「那要是……」，这不是刁难，是在做压力测试。每答一个「那要是」，你就多证明一层你真的想过。答不上来的当场说「这条我回去查一下制度」，比硬编安全。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">安全应答三件套</tspan></text><g data-k=\"哪些不碰\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">哪些不碰</tspan></text></g><g data-k=\"依据谁定\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">依据谁定</tspan></text></g><g data-k=\"留了什么痕\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-w
