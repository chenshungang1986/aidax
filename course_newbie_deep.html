eight=\"700\"><tspan x=\"326.0\">留了什么痕</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.64}, {"t": "三个必答：范围、依据、留痕", "n": "第一，范围。要说得出具体类别：手机号、邮箱、收货地址、订单号、合同原文、未发布的经营数据。第二，依据。这个判断不是你拍的，要能指到一个来源：公司的数据分级办法、入职培训讲的那一页、或者你问过的信息安全同事。第三，留痕。说清楚你存了什么——脱敏前后的对照表、贴出去的原文截图、存在哪个共享目录。三样都能当场说出来的新人，经理会放心把更复杂的活交给他。反过来，只会说「我没有乱贴」的人，通常下次就被要求「所有 AI 操作先报备」，那才是真的麻烦。说清楚不是为了免责，是为了继续被信任。还有个小动作很加分：把留痕目录的路径直接发给他，随时能点开看。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"不碰的类别要具体到字段\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不碰的类别要具体到字段</tspan></text></g><g data-k=\"依据要指到制度或人\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">依据要指到制度或人</tspan></text></g><g data-k=\"留痕要说得清存哪\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">留痕要说得清存哪</tspan></text></g></svg>", "d": 61.66}, {"t": "最容易被问倒的一问：你敢教别人吗", "n": "最后一问通常是这样：「我要你把这套做法教给部门其他人，你敢不敢？」这一问考的不是胆量，是你有没有把方法收敛成可复制的东西。答「敢」但说不清教什么，等于没答。正确答法是给一个不超过三条的最小做法：一，含个人信息的原始表一律不贴；二，只贴已对外发布或脱敏后的内容；三，每次贴之前截一张图存进共享目录。三条，谁都能记住，也谁都能检查。能收敛到三条，说明你真的想明白了；收不敛，说明你还在凭感觉。顺便说一句：这一关过了，你在这家公司的 AI 使用权限通常会比别人大一圈，因为你是那个「说得清」的人。反过来，说不清的人会被要求每步报备，那才最耗时间。守住这一关，后面才有得谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">可复制</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">等于没教</tspan></text><g data-k=\"三条能落地的最小做法\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">三条能落地的最小做法</tspan></text></g><g data-k=\"「大家注意一下数据安全」\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">「大家注意一下数据安全</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">」</tspan></text></g></svg>", "d": 71.11}], "deliverable": {"type": "skill", "name": "岗位 AI 使用清单", "rubric": ["范围清楚", "依据可指", "留痕具体"], "acceptance": "四个问题都答得出：不碰的范围、判断依据的来源、留痕的具体形式、可复制给别人的最小做法"}, "spar": {"role": "部门经理", "persona": "关心风险外溢与责任归属，会追到具体字段和留痕，回答含糊就往下一层追", "mustAsk": ["你把公司的东西贴进那些工具，数据不就出去了吗？", "哪些能贴、哪些不能，你这个判断是按什么定的？谁说的算？", "如果真出了事，你能拿出什么证明你做过脱敏？", "我要你把这套做法教给部门其他人，你敢不敢？"]}, "exemplar": "（经理问：你把公司的东西贴进那些工具，数据不就出去了吗）\n\n结论：含个人信息的原始材料我一个字都没贴，其余只贴到「可以公开」这一层。\n依据：我这份清单里第 11 项开始是不交的，含手机号、邮箱、订单号的名单一律不进外部工具，要用就只导出公司和行业两列。上周整理名单时我就是这么做的，脱敏后的表和原表都存在部门共享盘，文件名带日期，可以随时比对。另外像产品说明这种内部资料，我只贴已经对外发布的那一版。\n边界：哪些算「内部资料」、贴到什么程度算安全，这个判断我不自己下，我按公司数据分级办法来，看不懂就问信息安全同事。真出了事，我这边能拿出三次记录：贴了什么、什么时候贴的、脱敏前后的对照。", "task": "把《岗位 AI 使用清单》拿到「部门经理」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《岗位 AI 使用清单》。现在要让它通过「部门经理」这一关。\n【对手的立场】关心风险外溢与责任归属，会追到具体字段和留痕，回答含糊就往下一层追。\n【他一定会追问】「你把公司的东西贴进那些工具，数据不就出去了吗？」 / 「哪些能贴、哪些不能，你这个判断是按什么定的？谁说的算？」 / 「如果真出了事，你能拿出什么证明你做过脱敏？」\n【场景】你说「部门经理质疑「会不会把数据带出去」」，对方立刻回一句：你把公司的东西贴进那些工具，数据不就出去了吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能当场说出「不碰」的具体类别（含手机号、订单号、合同原文等），不是笼统说「敏感数据」", "判断依据能指向一个具体来源（公司制度、数据分级办法、问过谁），不是「我自己觉得」", "留痕说得具体：存什么、存在哪、能证明什么，能拿出至少两种", "被要求教给别人时，能给出一个不超过三条的最小做法，而不是「大家注意点」"]}]}, {"id": "M1", "title": "M1 写出第一句好用的提示词", "dims": ["prompt", "content", "tools"], "units": [{"id": "M1U1", "tier": "basic", "step": "understand", "title": "四要素：一句话说清你要什么", "video": {"dur": "3.3min", "script": ["提示词写不好，问题几乎都不在词藻，在于四件事没交代清楚", "四要素模板（对象 / 任务 / 材料 / 格式）+ 反例对照", "「帮我写个周报」与「给部门经理写本周周报，三段落，每段不超过三句」的差别"]}, "ppt": {"method": "四要素模板（对象 / 任务 / 材料 / 格式）+ 反例对照", "case": "「帮我写个周报」与「给部门经理写本周周报，三段落，每段不超过三句」的差别", "demo": "四要素拆解卡：把一句抱怨改写成一条提示词"}, "objective": "能用四要素（给谁看 / 做什么 / 用什么材料 / 要什么格式）改写一句模糊需求", "transfer": "把手上最常做的一类活写成一条四要素提示词，发给同组同事让他照着跑一遍", "vslides": [{"t": "为什么你觉得 AI 不好用", "n": "新人最常见的抱怨是「AI 写的东西太空」。但你回头看自己发的那句话——「帮我写个周报」——它确实只能给你空的东西。它不知道你给谁看、不知道你这周做了什么、不知道要几段。这四件事没说，它只能拿最通用的模板填一遍，于是你看到一篇谁都能用的周报。提示词不是咒语，它的本质是把「你脑子里的默认前提」写出来。你的默认前提是「当然是给经理看的、当然只写三件事」，但 AI 没有这些默认。写提示词时最该问自己一句：这句话我发给一个新来的实习生，他能照着做对吗？不能，说明还缺东西。这个判断标准比任何模板都好用。你会发现，把默认前提写出来这件事，本身就是一次想清楚的过程。特别是你以为理所当然的那几条，往往就是最该写出来的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四要素</tspan></text><g data-k=\"给谁看\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">给谁看</tspan></text></g><g data-k=\"做什么\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">做什么</tspan></text></g><g data-k=\"用什么材料\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">用什么材</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">料</tspan></text></g><g data-k=\"要什么格式\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">要什么格</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">式</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.16}, {"t": "四要素逐条拆：每一条缺失会怎样", "n": "第一，给谁看。缺了它，语气和详略全错——给经理要结论先行，给同事可以直接列清单。第二，做什么。缺了它，它可能给你三个方向各写一段，而你要的是一份完整的。第三，用什么材料。缺了它，它会编。这一条最致命，因为编出来的东西看起来最像样。第四，要什么格式。缺了它，你会拿到一大段没法直接用的文字，还得自己拆。四条里最容易被跳过的是第三和第四，因为大家觉得「材料它自己会找」「格式差不多就行」。恰恰是这两条决定了产出能不能直接用。补这两条花的力气，比事后改省得多。记住这个优先级：材料比格式重要，格式比语气重要，语气最后再调。按这个顺序补，你会发现改动量一次比一次小。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"给谁看 → 决定语气与详略\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">给谁看 → 决定语气与详略</tspan></text></g><g data-k=\"做什么 → 决定产出边界\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">做什么 → 决定产出边界</tspan></text></g><g data-k=\"用什么材料 → 决定会不会编\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">用什么材料 → 决定会不会编</tspan></text></g><g data-k=\"要什么格式 → 决定能不能直接用\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">要什么格式 → 决定能不能直接用</tspan></text></g></svg>", "d": 65.74}, {"t": "一个可以照抄的句式", "n": "把四要素串起来，句式大概是这样：你是（角色），请基于我给的（材料），为（对象）产出（什么东西），格式要求是（几段/几列/多少字），凡是材料里没有的信息一律标注「待补充」，不要自行补充。最后那半句是护身符，一定要加。它把「不知道就说不知道」写进了指令里，能挡掉大部分编造。这句话你不需要每次重写，把它存在备忘录里，用的时候改三个空：角色、对象、格式。改完就是一条能用的提示词。练到第三遍你会发现，写提示词的时间从五分钟降到三十秒，而产出质量反而更稳。三十秒改三个空，这个习惯值得你第一周就养成。养成之后，你写提示词的速度会比同事快一倍，质量还更稳。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">照抄这个句式</tspan></text><g data-k=\"你是（角色）\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">你是（角色）</tspan></text></g><g data-k=\"基于我给的（材料）\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">基于我给的（材料）</tspan></text></g><g data-k=\"为（对象）产出（东西）\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">为（对象）产出（东西）</tspan></text></g><g data-k=\"格式：（几段/几列/多少字）\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">格式：（几段/几列/多少字）</tspan></text></g></svg>", "d": 64.56}], "deliverable": {"type": "skill", "name": "四要素提示词卡", "rubric": ["四要素齐全", "缺失后果说清", "可复用"], "acceptance": "能把一句模糊需求改写成含四要素的提示词，并说出每一要素缺失时会发生什么"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】四要素模板（对象 / 任务 / 材料 / 格式）+ 反例对照\n【为什么重要】提示词写不好，问题几乎都不在词藻，在于四件事没交代清楚\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["改写后的提示词四要素齐全，且每项都能在句子里指出来", "能说出至少两项要素缺失时 AI 会怎么跑偏（不是「效果不好」）", "提示词里给出了输出的形状（几段、几列、多少字），不是只有「详细一点」", "自检题全对；收获写成一句能马上用的话"]}, {"id": "M1U2", "tier": "basic", "step": "demo", "title": "从一句抱怨到一条能用的提示词", "video": {"dur": "3.4min", "script": ["提示词的价值不在第一次跑对，在于它能被你复用十次", "三步改造法（补对象 → 补材料 → 补格式）", "实习生把「帮我总结会议」改成一条能直接用的提示词"]}, "ppt": {"method": "三步改造法（补对象 → 补材料 → 补格式）", "case": "实习生把「帮我总结会议」改成一条能直接用的提示词", "demo": "WorkBuddy 内跑一遍会议记录整理，对照 AI 原稿与人改稿"}, "objective": "能把一句口头需求跑成一条可复用提示词，并指出 AI 输出里哪三处必须人来定", "transfer": "挑一件本周要交的东西，用四要素句式跑一遍，把提示词和产出一起存进备忘录", "vslides": [{"t": "演示准备：一句真实的抱怨", "n": "这次演示的起点是一句真实的抱怨：「会开完两小时，纪要写不出来，写出来还被说漏了重点。」对应的原始需求是「帮我总结一下会议」。这句话里四要素一个都没有，所以它只能给你一段谁都能用的摘要。我们要做的是三步改造：先补对象（给没参会的同事看），再补材料（贴会议记录原文），最后补格式（结论三条、待办三列、存疑单列）。三步补完，同一条需求就变成了能反复用的提示词。注意顺序：先补对象，因为它决定后面所有的详略；很多人一上来就调格式，结果格式很漂亮、内容还是不对。还有一点：三步补完别急着跑，先自己念一遍，念着别扭的地方通常就是还没说清的地方。念不通的地方，AI 也一定读不通。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三步改造法</tspan></text><g data-k=\"补对象\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">补对象</tspan></text></g><g data-k=\"补材料\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">补材料</tspan></text></g><g data-k=\"补格式\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">补格式</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 66.17}, {"t": "跑一遍：把边界写死在提示词里", "n": "提示词里我加了一句关键的：记录里没写责任人或时间的，填「待确认」和「待定」，不要推断。这一句是整条提示词的重点。不加它，AI 会非常积极地帮你把空填满——它会把提到名字的人排成责任人，把「下周三」算成一个具体日期。这些填补看起来让纪要更完整，实际上是给未来埋雷：三天后有人拿着纪要说「这活不是我负责的」。跑完你会看到责任人大片是「待确认」，这不是它偷懒，这是它守规矩。你要做的是拿着这份空表去找会议主持人确认，而不是让它猜。另外提醒：这份空表交给谁确认，要在表头写清楚，否则它会一直在你手上堆着。写清确认人还有一层好处：责任落到具体的人，不会变成「我以为你会看」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：会议记录原文（含口语、打断）\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：会议记录原文（含口语、打断）</tspan></text></g><g data-k=\"约束：缺信息填待确认，不许推断\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：缺信息填待确认，不许推断</tspan></text></g><g data-k=\"产出：结论 + 待办三列 + 存疑单列\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：结论 + 待办三列 + 存疑单列</tspan></text></g></svg>", "d": 65.28}, {"t": "人工收口：三处必须你来定", "n": "跑完有三处必须人来定。第一，结论的取舍——记录里有七件事，哪三件算结论，取决于你们团队这周的重点。第二，责任人——只能去问，不能猜。第三，存疑项怎么处理——是会上再问一次，还是先按某一版执行，这个决定有代价，得你来担。这三处定完，纪要从「一份整理」变成「一份可以据此行动的记录」。区别在哪？前者只是省了打字时间，后者能减少三次来回确认。新人做纪要最容易忽略第三处，把存疑项删掉当作没看见，结果一周后问题还是爆发，而且没人记得当初提过。这也是为什么同样的工具、两个人用出来的东西完全不一样——差别在收口那一步。收口做得好，别人记住的是你的判断；收口省掉，别人记住的是一份没结论的材料。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"结论取舍你来定\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论取舍你来定</tspan></text></g><g data-k=\"责任人去问、不猜\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任人去问、不猜</tspan></text></g><g data-k=\"存疑项要跟进，不能删\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">存疑项要跟进，不能删</tspan></text></g></svg>", "d": 71.62}], "deliverable": {"type": "skill", "name": "可复用提示词", "rubric": ["要素完整", "边界写死", "真实跑通"], "acceptance": "能产出《可复用提示词》并通过本单元评分要点"}, "demo": {"ref": "■ 结论（3 条）\n1. 双十一预热方案确定按 A 版执行，主推组合装。\n2. 素材交付时间从 11/08 提前到 11/05。\n3. 客服话术需在 11/04 前完成培训。\n\n■ 待办清单\n| 事项 | 责任人 | 截止时间 |\n|---|---|---|\n| 出组合装详情页初稿 | 待确认 | 11/05 |\n| 客服话术培训 | 待确认 | 11/04 |\n| 预热素材终审 | 待确认 | 11/03 |\n\n■ 存疑项\n· 「素材这块谁来跟」——会上提到两个人名，但没明确谁负责。\n· 「下周三之前」——未说明是 11/04 还是 11/11。\n· 预算数字只提到「按上次的来」，未给具体金额。\n\n（说明：责任人多数为空，因原始记录中只出现「谁提到」而非「谁负责」。）", "fix": ["把 AI 自己补的两个责任人删掉——它把「提到名字的人」当成了负责人，这是纪要里最容易出事的错。", "把「下周三」改成「待确认」，并在存疑项里写清两种可能的日期，而不是替会议定一个。", "补了「谁提到 ≠ 谁负责」这句说明，让读的人知道空白是刻意的，不是漏了。", "删掉了 AI 加的「会议气氛融洽、讨论充分」这类评价——纪要只记事实与决定，不记感受。"], "judge": "判断依据：责任人有没有被推断；时间含糊处有没有标出来；有没有出现记录里没有的评价性描述；存疑项是否单列而非混在结论里", "sheet": {"situ": "周会上，师傅当着大家的面说：「你们提需求能不能说清楚点，我每次都要猜。」会后你在群里翻到 6 条同事发过的口头需求——都是那种「帮我弄一下」的说法。师傅让你做一件事：把每条需求最缺的那块补齐，并给它一个能用的输出形状。", "ask": "① 逐条判出它最缺的是四要素里的哪一个；② 给它定一个合适的输出形状；③ 指出如果不补这一块，最后会出什么具体的错。", "gen": "请基于以上整理表：① 把 6 条口头需求各补成一条四要素提示词；② 每条标出「补了哪一块、为什么这一块最关键」；③ 对含个人信息的条目单独标红线。\n不要替提问的人假设受众，不要在没有材料的情况下编造内容。", "mats": [{"id": "N01", "src": "部门群 · 运营小周", "text": "小林，帮我写个周报，我这边有点来不及了。"}, {"id": "N02", "src": "部门群 · 主管", "text": "把昨天那个会我发的录音整理一下，谢谢。"}, {"id": "N03", "src": "私聊 · 同事阿May", "text": "这份 40 页的行业报告，你帮我看看讲了啥。"}, {"id": "N04", "src": "部门群 · 行政", "text": "帮我写个通知，明天下午团建。"}, {"id": "N05", "src": "私聊 · 同事老刘", "text": "这段话你帮我改改，别写得那么生硬。"}, {"id": "N06", "src": "部门群 · 销售小陈", "text": "这些都整理成表格发我。"}], "cols": [{"k": "miss", "name": "最缺哪个要素", "hint": "只选最关键的那一个", "type": "chips", "w": 2, "tags": ["给谁看", "做什么", "用什么材料", "要什么格式"]}, {"k": "fmt", "name": "该给它什么输出形状", "hint": "选一个最贴合场景的", "type": "chips", "w": 3, "tags": ["三段式（进展/问题/计划）", "要点清单", "一段话改写", "三列表格"]}, {"k": "risk", "name": "不补会出什么具体的错", "hint": "选最可能发生的那个", "type": "chips", "w": 3, "tags": ["写成谁都能用的空话", "整理成逐字稿没人看", "把附录数据当成结论", "通知里缺时间地点", "语气太硬像在命令", "把手机号一起输出"]}], "key": {"N01": {"miss": "给谁看", "fmt": "三段式（进展/问题/计划）", "risk": "写成谁都能用的空话"}, "N02": {"miss": "要什么格式", "fmt": "要点清单", "risk": "整理成逐字稿没人看"}, "N03": {"miss": "做什么", "fmt": "要点清单", "risk": "把附录数据当成结论"}, "N04": {"miss": "用什么材料", "fmt": "一段话改写", "risk": "通知里缺时间地点"}, "N05": {"miss": "给谁看", "fmt": "一段话改写", "risk": "语气太硬像在命令"}, "N06": {"miss": "要什么格式", "fmt": "三列表格", "risk": "把手机号一起输出"}}, "notes": {"N01·miss": "「写个周报」最缺的是给谁看——给主管要结论先行，给同事可列清单，详略差一倍", "N02·miss": "「整理一下」最缺的是要什么格式：纪要 / 要点清单 / 逐字稿，三者产出完全不同", "N03·miss": "「看看讲了啥」最缺的是做什么：提炼要点？找风险？判断要不要跟？先定任务边界", "N03·risk": "不定任务就让它总结，它常把附录里的假设数据当成正文结论", "N04·miss": "通知缺的是材料：时间、地点、集合方式、要不要带东西，一个都没给", "N06·miss": "「整理成表格」最缺格式：几列、哪几个字段、要不要联系人职位", "N06·risk": "不指定字段，它会把原表所有列都输出，包括手机号。这条要单独加红线"}, "delta": [{"op": "改", "frm": "模型把 N03 的缺口判成「用什么材料」", "to": "改成「做什么」——材料已经给了（那份报告），缺的是要提炼还是找风险", "why": "缺口判错，补的方向就错；补一份材料回来并不能让这条需求变清楚", "kw": ["做什么", "提炼", "找风险", "材料已给"]}, {"op": "补", "frm": "模型漏掉了 N06 的红线提示", "to": "在 N06 后面补一句：整理前先删手机号与邮箱，或只给「公司+职位」两列", "why": "「整理成表格」这类需求最容易顺手把敏感字段一起输出，必须单独标", "kw": ["手机号", "邮箱", "脱敏", "两列"]}, {"op": "删", "frm": "模型建议给 N01「加一句让 AI 自己判断受众」", "to": "整句删除，改成「由提问的人明确受众」", "why": "受众判断属于业务信息，AI 猜不出来；写成让 AI 判断会得到一份四平八稳的稿子", "kw": ["受众", "提问的人", "判断", "四平八稳"]}], "refsheet": "N01｜给谁看｜三段式（进展/问题/计划）｜写成谁都能用的空话\nN02｜要什么格式｜要点清单｜整理成逐字稿没人看\nN03｜做什么｜要点清单｜把附录数据当成结论\nN04｜用什么材料｜一段话改写｜通知里缺时间地点\nN05｜给谁看｜一段话改写｜语气太硬像在命令\nN06｜要什么格式｜三列表格｜把手机号一起输出\n\n四条最容易判错的：\n· N03 材料已经给了（那份报告），缺的是「做什么」——别一看「看看」就判成缺材料。\n· N02「整理一下」缺的是格式，不是对象：纪要、要点、逐字稿三种产物完全不同。\n· N06 除了缺格式，还带一条红线：不指定字段就会连手机号一起输出。\n· N05 的「别太生硬」听起来像格式要求，其实缺的是受众——对内对外语气标准不同。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的会议记录助手。请基于我贴的会议记录，为没参会的同事整理一份纪要，格式要求：① 结论 3 条以内，每条一句话；② 待办清单，每行含「事项 / 责任人 / 截止时间」三列；③ 存疑项单列一节，只写「哪句话没听清或没定」，不要替我判断。\n凡是记录里没写责任人或时间的，责任人一栏填「待确认」，时间填「待定」，不要推断。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三步改造法（补对象 → 补材料 → 补格式）\n【参考案例】实习生把「帮我总结会议」改成一条能直接用的提示词\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的会议记录助手。请基于我贴的会议记录，为没参会的同事整理一份纪要，格式要求：① 结论 3 条以内，每条一句话；② 待办清单，每行含「事项 / 责任人 / 截止时间」三列；③ 存疑项单列一节，只写「哪句话没听清或没定」，不要替我判断。\n凡是记录里没写责任人或时间的，责任人一栏填「待确认」，时间填「待定」，不要推断。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M1U3", "tier": "basic", "step": "todo", "title": "给自己手头的事写 3 条提示词", "video": {"dur": "3.2min", "script": ["提示词不是一次性对话，能被复用十次的那条才有价值", "提示词卡模板（场景 / 提示词原文 / 适用边界 / 已知失效情况）", "一位新人一周内攒下的 3 张提示词卡"]}, "ppt": {"method": "提示词卡模板（场景 / 提示词原文 / 适用边界 / 已知失效情况）", "case": "一位新人一周内攒下的 3 张提示词卡", "demo": "提示词卡填写指引"}, "objective": "能产出 3 条可直接复用的提示词，每条含四要素并标注适用场景与失效条件", "transfer": "把 3 条提示词存进手机备忘录并命名，下次做同类活时直接调用，不再从零想", "vslides": [{"t": "第一步：只挑真做过一次以上的活", "n": "挑哪三类活来写提示词？标准只有一个：这件事你这周做过一次以上。只做过一次的活写不出好提示词，因为你还没见过它的变数。比如会议纪要你这周做了两次，就知道它有哪些坑：责任人不清、时间含糊、有人打断导致记录断裂。这些坑正是提示词里要写的约束。反过来说，如果你挑了一件从没做过的活，写出来的提示词一定是通用模板，跑一次就发现不对。这一步的产出不是三条提示词，是三张「有具体坑的提示词」。坑写得越具体，这条提示词越值钱。顺便说一个信号：如果你写这条时一次坑都想不起来，说明这类活你做得太少，先做三次再来写。三次是个门槛：第一次手生，第二次发现变数，第三次才知道要约束什么。这四件事按顺序补，补完再跑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 挑这周做过 ≥2 次的活\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 挑这周做过 ≥2 次的活</tspan></text></g><g data-k=\"② 写下你踩过的坑\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 写下你踩过的坑</tspan></text></g><g data-k=\"③ 把坑变成约束句\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 把坑变成约束句</tspan></text></g></svg>", "d": 69.0}, {"t": "第二步：每条都必须写「什么时候不管用」", "n": "这一栏最容易被跳过，但它决定你敢不敢用。写「适用边界」的方法是问自己：这条提示词在什么情况下会给我错的东西？比如会议纪要那条，纯口头没录音的会就不适用，因为它会把你的回忆和事实混在一起。长文提炼那条，聊天记录不适用，因为上下文断裂容易断章取义。写清楚边界，你下次用的时候会先想一下「这次符合条件吗」，这一想就避免了大半事故。不写边界的人，往往是在某次翻车之后才明白这条提示词有适用范围，代价比较大。还有个反例：有人把边界写成「不适合复杂场景」，这种话等于没写，因为「复杂」谁都能说自己不复杂。边界要用「在什么条件下它会给我错的东西」来写，而不是用难度来写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"写清什么情况下不管用\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写清什么情况下不管用</tspan></text></g><g data-k=\"写清会错成什么样\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写清会错成什么样</tspan></text></g><g data-k=\"用之前先对一遍条件\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">用之前先对一遍条件</tspan></text></g></svg>", "d": 64.49}, {"t": "第三步：把失效记录攒起来", "n": "每条提示词下面留一栏「已知失效」，每次跑完发现新问题就补一条。这一栏的写法要具体：不是「有时候不准」，而是「它把提到名字的人当成负责人，我核了三遍才发现」。攒到五条，你对这条提示词的理解就超过任何教程。这也是新人最快建立个人方法论的路径——不是学更多技巧，是把每次踩的坑记下来。一个月后回看，你会发现很多坑是重复的，那说明你的提示词该更新了。更新的方式不是重写，是在约束句里再加一句。如果一个月后失效记录一条没增加，也要警惕：要么你没在用，要么你没在核产出。核产出这件事花不了几分钟，但不核的话，错了你也不知道。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">一张卡的四栏</tspan></text><g data-k=\"场景命名：会议纪要-给未参会同事\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">场景命名：会议纪要-给未参会同事</tspan></text></g><g data-k=\"提示词原文（可直接复制）\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">提示词原文（可直接复制）</tspan></text></g><g data-k=\"适用边界 / 已知失效\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">适用边界 / 已知失效</tspan></text></g><g data-k=\"每月回看，删掉不用的\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">每月回看，删掉不用的</tspan></text></g></svg>", "d": 61.22}], "deliverable": {"type": "skill", "name": "个人提示词卡（3 条）", "rubric": ["可直接用", "边界清楚", "有失效记录"], "acceptance": "3 张提示词卡：每条四要素齐全、可直接复制使用、各写了适用边界与至少 1 条已知失效情况"}, "practice": {"steps": ["从本周做过的事里挑 3 类高频活（同一类做一次以上才算）", "每类写一条四要素提示词，直接能复制粘贴使用", "每条标注适用边界：什么情况下这条不管用", "每条标注已知失效情况：跑过之后发现它哪里会出错"], "exemplar": "【提示词卡 1】会议纪要整理\n■ 场景：部门例会、项目周会，有录音或速记稿，需要给没参会的人看\n■ 提示词：\n　你是我的会议记录助手。请基于我贴的会议记录，为没参会的同事整理一份纪要，\n　格式：① 结论 3 条以内，每条一句话；② 待办清单，每行「事项 / 责任人 / 截止时间」三列；\n　③ 存疑项单列，只写哪句话没听清或没定，不要替我判断。\n　记录里没写责任人或时间的，责任人填「待确认」，时间填「待定」，不要推断。\n■ 适用边界：只适合有文字记录或已转写的会议。纯口头、没录音的会不要用这条，\n　因为它会把你的回忆和事实混在一起。\n■ 已知失效：跑过三次，两次把「提到名字的人」当成负责人。现在我会在跑之前先把\n　人名圈出来，跑完逐个核。另一次把「下周三」算成了具体日期，已加「时间待定」约束。\n\n【提示词卡 2】把长文压成三条要点\n■ 场景：拿到一份 10 页以上的行业报告或政策文件，要在 30 分钟内知道跟自己有没有关系\n■ 提示词：\n　你是我的资料筛选助手。请基于我贴的文档，为我这个岗位（市场部新人）提炼 3 条\n　与我工作直接相关的要点。每条格式：一句话结论 + 原文依据（照抄 20 字内）+ 页码。\n　与我岗位无关的内容不要写。文档里没有明确说的，不要推断。\n■ 适用边界：适合结构化文档（报告、政策、说明书）。聊天记录、邮件串不适合，\n　因为上下文断裂，断章取义的风险很高。\n■ 已知失效：有一次它把附录里的假设数据当成了结论。现在我会要求它标页码，\n　拿到要点后翻回原页看一眼。\n\n【提示词卡 3】把杂乱名单整理成表格\n■ 场景：拿到一份格式混乱的联系人名单（来自不同人填的表格），要统一成三列\n■ 提示词：\n　你是表格整理助手。请把我贴的名单统一成「公司 / 联系人 / 职位」三列，输出 markdown 表格。\n　原表里没有的字段留空，不要猜。同一个公司出现多次的，合并成一行，联系人用顿号分隔。\n　原表里的手机号、邮箱一律不要输出。\n■ 适用边界：只适合已经脱敏（去掉手机号邮箱）的表。含手机号的原始表不要用这条，\n　也不要用任何外部工具，只能在公司内部工具里处理。\n■ 已知失效：跑过一次把两个同名不同公司的人合并了。现在我会在合并前先看一眼\n　公司名是否完全一致。\n\n■ 我的使用习惯\n　· 三条都存在备忘录里，命名格式「场景-用途」，比如「会议纪要-给未参会同事」\n　· 每次用完如果发现新问题，当天补进「已知失效」，不攒着\n　· 一个月回看一次，把不再用的删掉，只留真的在用的"}, "task": "产出《个人提示词卡（3 条）》：从本周做过的事里挑 3 类高频活（同一类做一次以上才算）；每类写一条四要素提示词，直接能复制粘贴使用；每条标注适用边界：什么情况下这条不管用；每条标注已知失效情况：跑过之后发现它哪里会出错", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M1 写出第一句好用的提示词」模块，你要交付的是《个人提示词卡（3 条）》。\n【场景】业务侧这周的诉求是：提示词不是一次性对话，能被复用十次的那条才有价值。参考做法：一位新人一周内攒下的 3 张提示词卡。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提示词卡模板（场景 / 提示词原文 / 适用边界 / 已知失效情况）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《个人提示词卡（3 条）》填写模板】\n\n■ 1. 从本周做过的事里挑 3 类高频活（同一类做一次以上才算）\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 每类写一条四要素提示词，直接能复制粘贴使用\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 每条标注适用边界：什么情况下这条不管用\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 每条标注已知失效情况：跑过之后发现它哪里会出错\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【提示词卡 1】会议纪要整理\n■ 场景：部门例会、项目周会，有录音或速记稿，需要给没参会的人看\n■ 提示词：\n　你是我的会议记录助手。请基于我贴的会议记录，为没参会的同事整理一份纪要，\n　格式：① 结论 3 条以内，每条一句话；② 待办清单，每行「事项 / 责任人 / 截止时间」三列；\n　③ 存疑项单列，只写哪句话没听清或没定，不要替我判断。\n　记录里没写责任人或时间的，责任人填「待确认」，时间填「待定」，不要推断。\n■ 适用边界：只适合有文字记录或已转写的会议。纯口头、没录音的会不要用这条，\n　因为它会把你的回忆和事实混在一起。\n■ 已知失效：跑过三次，两次把「提到名字的人」当成负责人。现在我会在跑之前先把\n　人名圈出来，跑完逐个核。另一次把「下周三」算成了具体日期，已加「时间待定」约束。\n\n【提示词卡 2】把长文压成三条要点\n■ 场景：拿到一份 10 页以上的行业报告或政策文件，要在 30 分钟内知道跟自己有没有关系\n■ 提示词：\n　你是我的资料筛选助手。请基于我贴的文档，为我这个岗位（市场部新人）提炼 3 条\n　与我工作直接相关的要点。每条格式：一句话结论 + 原文依据（照抄 20 字内）+ 页码。\n　与我岗位无关的内容不要写。文档里没有明确说的，不要推断。\n■ 适用边界：适合结构化文档（报告、政策、说明书）。聊天记录、邮件串不适合，\n　因为上下文断裂，断章取义的风险很高。\n■ 已知失效：有一次它把附录里的假设数据当成了结论。现在我会要求它标页码，\n　拿到要点后翻回原页看一眼。\n\n【提示词卡 3】把杂乱名单整理成表格\n■ 场景：拿到一份格式混乱的联系人名单（来自不同人填的表格），要统一成三列\n■ 提示词：\n　你是表格整理助手。请把我贴的名单统一成「公司 / 联系人 / 职位」三列，输出 markdown 表格。\n　原表里没有的字段留空，不要猜。同一个公司出现多次的，合并成一行，联系人用顿号分隔。\n　原表里的手机号、邮箱一律不要输出。\n■ 适用边界：只适合已经脱敏（去掉手机号邮箱）的表。含手机号的原始表不要用这条，\n　也不要用任何外部工具，只能在公司内部工具里处理。\n■ 已知失效：跑过一次把两个同名不同公司的人合并了。现在我会在合并前先看一眼\n　公司名是否完全一致。\n\n■ 我的使用习惯\n　· 三条都存在备忘录里，命名格式「场景-用途」，比如「会议纪要-给未参会同事」\n　· 每次用完如果发现新问题，当天补进「已知失效」，不攒着\n　· 一个月回看一次，把不再用的删掉，只留真的在用的", "rubric": ["3 条提示词都能直接复制粘贴使用，不需要再补背景信息", "每条都写了「什么情况下不管用」，不是只写「适用于周报」", "每条至少记了 1 条真实跑过之后的失效情况（不是猜的）", "提示词按「场景」命名，不看内容也知道什么时候该用它"]}, {"id": "M1U4", "tier": "basic", "step": "spar", "title": "同事说「你的提示词太啰嗦」", "video": {"dur": "3.3min", "script": ["啰嗦和必要只差一件事：这条约束有没有挡住过具体的错", "约束价值论证法（每条约束 → 它挡住的具体错误）", "删掉「不要推断责任人」之后，纪要里多出三个错的责任人"]}, "ppt": {"method": "约束价值论证法（每条约束 → 它挡住的具体错误）", "case": "删掉「不要推断责任人」之后，纪要里多出三个错的责任人", "demo": "陪练说明：他会要求你当场删掉约束再跑"}, "objective": "能在同事质疑「提示词太啰嗦」时，用一次对比跑的结果说明每条约束挡住了什么", "transfer": "把这次被质疑的那条提示词删掉一半再跑一遍，用结果对比说服对方或说服自己", "vslides": [{"t": "陪练说明：他要的是效率，不是完美", "n": "这一关的对手是同组同事，他的立场很实在：提示词写那么长，每次都要复制一大段，太麻烦。他不是在挑刺，他代表了很多人的真实想法。所以你不能用「规范就是这样」来回答，那只会让他更烦。你要给的是一句一句的账：这句挡过什么错，那句挡过什么错。有账，他服；没账，你说什么都没用。准备的时候把提示词拆成句子，每句后面标一个「它挡过的错」，最好带一次真实对比。没有对比也没关系，说清「如果不加这句，它会怎么跑偏」也行，但要说具体动作，不能说「效果变差」。准备时可以做个动作：把提示词按句子拆开，一行一句，逐行标它挡过什么错。标不出来的行，就是可以删的行。这个动作五分钟能做完，做完你对自己的提示词会有全新认识。这一步做完再改提示词，改一次到位。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">回答框架</tspan></text><g data-k=\"这句挡了什么错\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">这句挡了什么错</tspan></text></g><g data-k=\"有对比吗\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">有对比吗</tspan></text></g><g data-k=\"什么场景可以短\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">什么场景可以短</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 76.34}, {"t": "怎么论证：一条约束对一个错", "n": "论证的句式是「删掉这句 → 会发生这个具体的错」。比如「不要推断责任人」删掉，它会把被点名汇报的人排成负责人；「结论不超过三条」删掉，它给你七条，会上讲不完；「时间含糊写待定」删掉，它把「下周三」算成一个具体日期。三条账摆出来，同事一般就不争了，因为他也是要交东西的人，知道这些错有多烦。反过来，如果你说不出某句挡过什么，那句就该删——这才是对「啰嗦」最诚实的回应。提示词不是越长越好，是每一句都有账。如果有人指出某句确实没用，立刻删掉并说声谢谢——这种反馈比夸你写得好值钱得多。很多人做不到这一点，因为把提示词当成自己的作品；其实它是工具，工具只讲好不好用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"删掉「不要推断责任人」→ 三个错的责任人\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">删掉「不要推断责任人」→ 三个错的责任人</tspan></text></g><g data-k=\"删掉「结论不超三条」→ 七条结论讲不完\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">删掉「结论不超三条」→ 七条结论讲不完</tspan></text></g><g data-k=\"删掉「时间写待定」→ 通知错日期\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">删掉「时间写待定」→ 通知错日期</tspan></text></g></svg>", "d": 64.49}, {"t": "最后给个短版本，别硬扛", "n": "他最后一定会问「那你能不能给个短版本」。这时候别硬扛说「短的不好用」，给一个：整理成纪要，结论三条，待办三列，缺信息的写待确认。两行，够他自己看。然后补一句：这份短的适合你自己过一遍，发给别人的时候再加两句。这样你既守住了质量线，也给了他台阶。沟通里最没必要的胜利，是让对方承认你全对。真正有用的是让他下次愿意用你的版本，哪怕先用短的那版。记住一个原则：说服人靠结果，不靠道理。一次对比跑，胜过十分钟解释。如果对方还是不认，就让他用自己的短版本跑一次，结果会说话。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">给台阶</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">把人推走</tspan></text><g data-k=\"短的自己看，长的发给别人\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">短的自己看，长的发给别</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">人</tspan></text></g><g data-k=\"一律要求用长的\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">一律要求用长的</tspan></text></g></svg>", "d": 58.37}], "deliverable": {"type": "skill", "name": "四要素提示词卡", "rubric": ["约束有依据", "对比可复现", "能给短版"], "acceptance": "三个维度都答得上：每条约束对应一类具体错误、有对比结果、能给一个按场景区分的短版本"}, "spar": {"role": "同组同事", "persona": "追求效率、觉得长提示词是浪费时间，会要求你当场删掉几句再跑一遍对比", "mustAsk": ["你这条提示词写这么长，直接说「整理成纪要」不就行了？", "你说这几句有用，凭什么？有对比吗？", "如果删掉「不要推断责任人」，最坏会怎样？", "那你能不能给个短版本，我也好照着用？"]}, "exemplar": "（同事问：你这条提示词写这么长，AI 又不会看不懂，直接说「整理成纪要」不就行了）\n\n结论：可以简化，但有三句我不删，因为它们各挡过一类具体的错。\n依据：上周我删过一次「责任人不要推断」再跑，同一份记录，AI 把会上提到的三个人全排成了负责人，其中两个只是被点名汇报进度。另两句是「结论不超过三条」和「时间含糊写待定」——前者挡的是它给我七条结论、会上讲不完；后者挡的是它把「下周三」算成具体日期，害我通知错时间。\n边界：如果你只是自己看、不发给别人，确实可以简化到一句话，错了你自己知道。但只要这份纪要要发给别人，这三句就得留着，因为读的人不会知道你省略了什么。要不要简化，取决于这份东西给谁看，不取决于提示词长短。", "task": "把《四要素提示词卡》拿到「同组同事」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《四要素提示词卡》。现在要让它通过「同组同事」这一关。\n【对手的立场】追求效率、觉得长提示词是浪费时间，会要求你当场删掉几句再跑一遍对比。\n【他一定会追问】「你这条提示词写这么长，直接说「整理成纪要」不就行了？」 / 「你说这几句有用，凭什么？有对比吗？」 / 「如果删掉「不要推断责任人」，最坏会怎样？」\n【场景】你说「同事说「你的提示词太啰嗦」」，对方立刻回一句：你这条提示词写这么长，直接说「整理成纪要」不就行了？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能指出提示词里哪几句是「必要约束」，并说明每句各挡住什么错", "有可复现的对比（删掉某句后同一份材料跑出什么差异），不是「我觉得有用」", "承认可以简化，并说清简化后的适用场景（自己看 vs 发给别人）", "能给一个不超过两行的短版本，且说明它在什么情况下够用"]}, {"id": "M1U5", "tier": "adv", "step": "understand", "title": "三类约束：让它每次都交出同一个形状", "video": {"dur": "3.3min", "script": ["四要素解决「它知不知道」，约束解决「它稳不稳定」", "三类约束清单（few-shot 示例 / 固定输出格式 / 显式禁止项）", "同一条需求，加与不加示例，产出结构稳定性差三倍"]}, "ppt": {"method": "三类约束清单（few-shot 示例 / 固定输出格式 / 显式禁止项）", "case": "同一条需求，加与不加示例，产出结构稳定性差三倍", "demo": "约束叠加对照卡（同一需求三种写法）"}, "objective": "能用「示例 + 输出格式 + 禁止项」三类约束，把一条提示词的可用率从偶发提到稳定", "transfer": "把一条已在用的提示词补上示例、格式、禁止项，同一材料跑三次看结构是否稳定，结果发带教导师", "vslides": [{"t": "四要素之上，还差一层稳定性", "n": "四要素能让 AI 知道你要什么，但它不保证每次都给你同样的东西。同一句提示词，今天给你三段，明天给你五段；今天老实说不知道，明天编一个数字。这种不稳定在一次性使用时无所谓，但你要把它变成日常工具，就必须让它稳。稳的办法是三样东西：给例子、定格式、写禁止项。这三样不是让提示词更长，是让它更确定。判断标准很简单：同一份材料跑三次，产出结构是否一致。不一致，就是缺约束。顺带说一句：稳定不等于僵化，约束是为了让它在同类任务上稳定，遇到新任务还是要重新写。判断标准是：换一类任务之后跑三次是否还稳；不稳就说明这套约束不适用。跑通三次再进库，别急着往里放。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类约束</tspan></text><g data-k=\"给例子\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">给例子</tspan></text></g><g data-k=\"定格式\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">定格式</tspan></text></g><g data-k=\"写禁止项\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">写禁止项</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 69.77}, {"t": "示例要有输入和输出，成对给", "n": "示例最容易被写错的地方是只给一个「好答案长什么样」。这只告诉它终点，没告诉它起点到终点的映射。正确写法是成对给：给一小段输入，再给对应的输出，说「像这样处理」。给两对，它就能抓住规律。比如整理会议记录，你给一段原始口语记录，再给整理后的三条结论，它立刻明白「结论」是压缩到什么程度。只给输出，它可能把你的示例当成模板，把别的内容硬套进去。这一条很多人不知道，导致加了一堆例子反而更僵。还有个更省事的做法：把你自己改过的一版和 AI 原始那版一起给它，说「改成这个样子」，比讲十条规则管用。这叫「给样子不如给差别」，差别里有你真正在意的那些细节。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">示例的正确给法</tspan></text><g data-k=\"输入：一段原始材料（20–50 字）\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一段原始材料（20–50 字）</tspan></text></g><g data-k=\"输出：对应的整理结果\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输出：对应的整理结果</tspan></text></g><g data-k=\"说明：像这样处理，不要照抄内容\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">说明：像这样处理，不要照抄内容</tspan></text></g></svg>", "d": 64.03}, {"t": "格式与禁止项：一个管形状，一个管越界", "n": "格式约束管的是形状：几段、几列、多少字、要不要表格。写清楚形状，你拿到的东西就能直接用，不用二次加工。禁止项管的是越界：不要补数字、不要推断责任人、不要评价、不要写「已通过审核」。这两类要分开写，混在一起它就只记住一半。还有一个技巧：禁止项要用「不要 + 具体动作」，不要用「要准确」「要客观」这种形容词。形容词它没法执行，具体动作它能执行。写完之后跑三次，如果三次结构一致、没有越界补充，这条提示词就算稳定了，可以进你的提示词库。最后提醒：约束不是越多越好，超过六条它就开始丢，按重要性排，最要紧的三条放前面。写完之后数一下条数，超过六条就合并同类项，别让它记不住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"格式：说清几段几列多少字\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">格式：说清几段几列多少字</tspan></text></g><g data-k=\"禁止：不要 + 具体动作\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">禁止：不要 + 具体动作</tspan></text></g><g data-k=\"跑三次结构一致才算稳\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">跑三次结构一致才算稳</tspan></text></g></svg>", "d": 65.45}], "deliverable": {"type": "skill", "name": "约束型提示词", "rubric": ["三类约束齐全", "对症说明", "可复用"], "acceptance": "能给同一条提示词分别加示例、格式、禁止项，并说明每类约束解决的是哪一类不稳定"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三类约束清单（few-shot 示例 / 固定输出格式 / 显式禁止项）\n【为什么重要】四要素解决「它知不知道」，约束解决「它稳不稳定」\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三类约束各给出一个具体写法，不是只说「加个例子」", "能说清每类约束各治哪种不稳定（跑偏内容 / 结构散 / 越界补充）", "示例给的是「输入→输出」成对样本，不是只给一个输出样子", "禁止项写的是具体行为（不要补数字），不是抽象要求（要准确）"]}, {"id": "M1U6", "tier": "adv", "step": "demo", "title": "让输出直接变成表格", "video": {"dur": "3.4min", "script": ["能直接粘进表格的输出，才算真的省了时间；否则你只是换了个地方打字", "结构化输出三件套（固定列名 / 缺项留空 / 禁止合并推断）", "把 8 条零散的会议待办跑成一张能直接跟进的三列表"]}, "ppt": {"method": "结构化输出三件套（固定列名 / 缺项留空 / 禁止合并推断）", "case": "把 8 条零散的会议待办跑成一张能直接跟进的三列表", "demo": "WorkBuddy 内跑一遍结构化输出，对照可直接用与需返工两种结果"}, "objective": "能用「固定列 + 禁止推断 + 缺项留空」把一段散材料跑成可直接粘进表格的结构化结果", "transfer": "把手上一份散材料按同样三约束跑一次，产出直接粘进你的工作表格，不再手工敲", "vslides": [{"t": "演示准备：为什么要求只要表格", "n": "这次的目标很实际：把会议记录里散落的待办，变成一张能直接粘进跟进表的表格。很多人做到这一步就停了——AI 给了一段带解释的文字，他复制粘贴，然后手工删掉解释、手工对齐列，又花二十分钟。所以这次提示词里明确写了：只输出表格，前后不要解释。这一条看着小，实际省的正是最后那二十分钟。另外列名要固定，四列、顺序不变。列名不固定，你每次都得重排；固定了，下次跑完直接覆盖粘贴，格式一模一样。还有个小细节：列名用你跟进表里的原名，别用「任务」「负责人」这种近义词，否则粘进去还要改列名。列名统一这件事看着小，但它决定了你能不能「一次粘好」。跑完把表格存成固定的模板文件。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">结构化输出四要求</tspan></text><g data-k=\"固定四列\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">固定四列</tspan></text></g><g data-k=\"缺项留空\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">缺项留空</tspan></text></g><g data-k=\"禁止推断\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">禁止推断</tspan></text></g><g data-k=\"只输出表格\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">只输出表</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">格</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.09}, {"t": "跑一遍：三个约束各自挡住什么", "n": "第一个约束「缺项填待确认」挡住编造。不加它，责任人和时间会被填满，而且填得很像回事。第二个「同一事项合并」挡住重复。会议里一件事常被提三次，不合并你就得到三行一样的待办，跟进时不知道以哪行为准。第三个「人名不等于责任人」挡住最隐蔽的错：会上有人汇报进度，被提到名字，AI 就把他当负责人。这一条不加，你的表看起来完整，实际上是错的。跑完你对照三列看：责任人那列如果几乎全是待确认，说明它守规矩了；如果几乎填满，说明它在猜。核的时候有个笨办法但很有效：把依据列逐行念出来，念着不像人话的，多半是它拼的。念得出来的是真话，念不出来的多是拼接。核一遍再交，交出去就代表你的判断。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：会议记录（含口语与打断）\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：会议记录（含口语与打断）</tspan></text></g><g data-k=\"约束：四列固定 / 缺项留空 / 人名≠责任人\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：四列固定 / 缺项留空 / 人名≠责任人</tspan></text></g><g data-k=\"产出：可直接粘进跟进表的表格\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：可直接粘进跟进表的表格</tspan></text></g></svg>", "d": 68.98}, {"t": "人工收口：拿这张表去问，而不是去改", "n": "表格跑出来，责任人大量是「待确认」。这时候正确的动作不是自己填，是拿着表去问会议主持人或当事同事：这五项里哪几项你能认领。十分钟能问清，比你猜半小时准。这就是结构化输出的真正价值：它把「编」的空间压到零，逼出真实的信息缺口，让你知道该去问谁。还有一个小动作：把这张表存成模板，下次同一类会议直接跑，列名和规则都不用再写。三五次之后，你会发现会议结束到待办上表的时间，从一小时压到十分钟。存模板时顺手写一行注释：这份是哪次会议跑出来的、改过哪几处。三个月后你会感谢自己。下次别人问「这模板哪来的」，你一句话就能说清。模板名带上会议类型，方便下次找。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"责任人靠问、不靠猜\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任人靠问、不靠猜</tspan></text></g><g data-k=\"依据列逐行核一遍\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">依据列逐行核一遍</tspan></text></g><g data-k=\"存成模板下次复用\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">存成模板下次复用</tspan></text></g></svg>", "d": 65.45}], "deliverable": {"type": "skill", "name": "结构化输出提示词", "rubric": ["列名固定", "禁推断", "真能用"], "acceptance": "能产出《结构化输出提示词》并通过本单元评分要点"}, "demo": {"ref": "| 事项 | 责任人 | 截止时间 | 依据（原文一句话） |\n|---|---|---|---|\n| 出组合装详情页初稿 | 待确认 | 11/05 | 「组合装详情页这周五之前要出来」 |\n| 客服话术培训 | 待确认 | 11/04 | 「话术培训放在周四，别拖」 |\n| 预热素材终审 | 待确认 | 11/03 | 「素材下周一终审，之后就锁了」 |\n| 补齐预算金额 | 待确认 | 待定 | 「预算就按上次的来」 |\n| 与平台确认坑位 | 小李 | 待定 | 「坑位这块小李去问一下」 |\n\n（说明：只有最后一行有明确指派，其余四行原文均未指定责任人，按要求填「待确认」。）", "fix": ["把 AI 从「人物出现次数」推出来的责任人全部改成待确认——它把「谁提到」和「谁负责」混为一谈。", "保留了「依据」列并强制用它核一遍：每行都能指回一句原话，指不回去的就是它编的。", "删掉表格上方那段「本次会议共梳理五项待办，整体推进有序」的总结——要求里写了只要表格。", "把「预算按上次的来」单独列成一行而不是并进详情页事项，因为它是独立待确认项，合并会漏掉。"], "judge": "判断依据：责任人有没有被推断；同一事项有没有重复成多行；表格外有没有多余段落；每行是否有可指回的原话", "sheet": {"situ": "11 月 2 日（周一）的部门例会开完了，你手上是 6 条零散的速记片段。你要把它们整理成一张能直接粘进跟进表的待办表，四列固定：事项 / 责任人 / 截止时间 / 依据。规则是：没写责任人的填「待确认」，没写时间的填「待定」，不许推断。", "ask": "① 逐条判断它该归到哪件事、责任人怎么填、时间怎么填；② 判断这条到底能不能变成待办；③ 交之前逐行核一遍：每行的依据能不能指回原话。", "gen": "请基于以上整理表：① 输出一张四列表格（事项/责任人/截止时间/依据）；② 缺责任人的填「待确认」，缺时间的填「待定」，不要推断；③ 表格前后不要加解释段落；④ 逐行给出可指回原话的依据。\n记录里出现的人名不等于责任人，只有明确说「谁来做」才算。", "mats": [{"id": "E01", "src": "速记 · 第 2 段", "text": "组合装详情页这周五之前要出来，不然预热赶不上。"}, {"id": "E02", "src": "速记 · 第 3 段", "text": "话术培训放在周四，别拖到最后一刻。"}, {"id": "E03", "src": "速记 · 第 5 段", "text": "素材下周一终审，之后就锁了，改不了。"}, {"id": "E04", "src": "速记 · 第 6 段", "text": "预算就按上次的来，别再讨论了。"}, {"id": "E05", "src": "速记 · 第 8 段", "text": "坑位这块小李去问一下平台那边。"}, {"id": "E06", "src": "速记 · 第 10 段", "text": "行，那今天就到这儿，大家辛苦了，散会。"}], "cols": [{"k": "item", "name": "归到哪件事", "hint": "不是每段都能变成待办", "type": "chips", "w": 3, "tags": ["详情页初稿", "话术培训", "素材终审", "预算金额", "平台坑位", "不产出待办"]}, {"k": "owner", "name": "责任人怎么填", "hint": "原文没指派就不要猜", "type": "chips", "w": 2, "tags": ["待确认", "小李", "我"]}, {"k": "due", "name": "截止时间怎么填", "hint": "按会议日 11/02 周一推算", "type": "chips", "w": 2, "tags": ["11/06（周五）", "11/05（周四）", "11/09（下周一）", "待定", "不适用"]}, {"k": "flag", "name": "这条能不能直接执行", "hint": "看它缺不缺责任人或时间", "type": "chips", "w": 3, "tags": ["可直接执行", "需先确认责任人", "需先确认时间", "需先确认责任人和时间", "不是待办"]}], "key": {"E01": {"item": "详情页初稿", "owner": "待确认", "due": "11/06（周五）", "flag": "需先确认责任人"}, "E02": {"item": "话术培训", "owner": "待确认", "due": "11/05（周四）", "flag": "需先确认责任人"}, "E03": {"item": "素材终审", "owner": "待确认", "due": "11/09（下周一）", "flag": "需先确认责任人"}, "E04": {"item": "预算金额", "owner": "待确认", "due": "待定", "flag": "需先确认责任人和时间"}, "E05": {"item": "平台坑位", "owner": "小李", "due": "待定", "flag": "需先确认时间"}, "E06": {"item": "不产出待办", "owner": "待确认", "due": "不适用", "flag": "不是待办"}}, "notes": {"E04·flag": "责任人和时间都缺 → 两项都要确认。只标一项会漏掉另一半", "E04·due": "「按上次的来」不是时间信息 → 待定。填成具体日期属于推断", "E05·owner": "只有这条是明确指派（「小李去问」），其余五条都不能推断", "E05·due": "「问一下」没给时间 → 待定。有人会顺手填成「本周内」，那是加的", "E06·item": "散会寒暄不是待办 → 不产出待办。这条最容易被硬凑成一行", "E03·due": "会议是 11/02 周一，「下周一」= 11/09。容易算成 11/03"}, "delta": [{"op": "改", "frm": "模型把 E01 的责任人填成了「小周」（因为速记里提过她汇报详情页）", "to": "改成「待确认」", "why": "汇报进度 ≠ 负责交付。填错责任人，三天后一定有人来找你对齐", "kw": ["待确认", "汇报", "不至于", "负责人"]}, {"op": "删", "frm": "模型把 E06 整理成一行「会议结束，各方确认无异议，责任人：全体」", "to": "整行删除，标记为「不产出待办」", "why": "寒暄不是待办；硬凑一行会让跟进表出现一条永远无法关闭的假任务", "kw": ["不产出待办", "散会", "寒暄", "假任务"]}, {"op": "补", "frm": "模型漏掉了 E04 的预算事项", "to": "补一行「补齐预算金额 / 待确认 / 待定」", "why": "「按上次的来」是待确认项，不补就会在付款时卡住", "kw": ["预算", "补齐", "待确认", "付款"]}, {"op": "改", "frm": "模型把 E03 的时间写成 11/03", "to": "改成 11/09（会议是 11/02 周一，「下周一」是 11/09）", "why": "日期算错比不填更糟：不填别人会问，填错了别人直接照做", "kw": ["11/09", "下周一", "11/02", "算错"]}], "refsheet": "E01｜详情页初稿｜待确认｜11/06（周五）｜需先确认责任人\nE02｜话术培训｜待确认｜11/05（周四）｜需先确认责任人\nE03｜素材终审｜待确认｜11/09（下周一）｜需先确认责任人\nE04｜预算金额｜待确认｜待定｜需先确认责任人和时间\nE05｜平台坑位｜小李｜待定｜需先确认时间\nE06｜不产出待办｜待确认｜不适用｜不是待办\n\n四条最容易判错的：\n· 只有 E05 有明确指派（「小李去问」），其余五条一律待确认，包括提过名字的 E01。\n· E04 两项都缺，flag 要写「责任人和时间」两项，只写一项算漏。\n· E06 是寒暄，不是待办——硬凑一行会留下永远关不掉的假任务。\n· E03 的「下周一」以 11/02 周一为基准是 11/09，不是 11/03。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的待办整理助手。请基于我贴的会议记录，整理成一张待办表，输出 markdown 表格。\n列名固定为四列，顺序不变：事项 | 责任人 | 截止时间 | 依据（原文一句话）\n规则：① 记录里没写责任人的填「待确认」，没写时间的填「待定」，不要推断；\n② 同一件事被多次提到的，合并成一行，依据列保留最早那次的原话；\n③ 只输出表格，表格前后不要加解释段落；\n④ 记录里出现的人名不等于责任人，只有明确说「谁来做」才算。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】结构化输出三件套（固定列名 / 缺项留空 / 禁止合并推断）\n【参考案例】把 8 条零散的会议待办跑成一张能直接跟进的三列表\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的待办整理助手。请基于我贴的会议记录，整理成一张待办表，输出 markdown 表格。\n列名固定为四列，顺序不变：事项 | 责任人 | 截止时间 | 依据（原文一句话）\n规则：① 记录里没写责任人的填「待确认」，没写时间的填「待定」，不要推断；\n② 同一件事被多次提到的，合并成一行，依据列保留最早那次的原话；\n③ 只输出表格，表格前后不要加解释段落；\n④ 记录里出现的人名不等于责任人，只有明确说「谁来做」才算。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M1U7", "tier": "adv", "step": "todo", "title": "把你的提示词变成团队资产", "video": {"dur": "3.2min", "script": ["在你电脑里的叫习惯，写进共享文档的才叫资产", "提示词库模板（编号 / 版本 / 场景 / 原文 / 失效记录 / 谁维护）", "一位新人用 5 条提示词替换了组里口口相传的「怎么写纪要」"]}, "ppt": {"method": "提示词库模板（编号 / 版本 / 场景 / 原文 / 失效记录 / 谁维护）", "case": "一位新人用 5 条提示词替换了组里口口相传的「怎么写纪要」", "demo": "提示词库填写与版本管理示例"}, "objective": "能建一份 5 条的团队级提示词库，每条带版本、适用场景、失效记录与交接说明", "transfer": "把提示词库整理成共享文档，发到组内群里并请组长置顶，让同事能直接取用", "vslides": [{"t": "为什么要做成团队资产", "n": "你电脑里那 5 条提示词，只有你一个人能用；写进共享文档，全组都能用，而且别人踩的坑会补进来。这是提示词从「个人习惯」变成「团队资产」的分界。判断标准很朴素：同事遇到同类活，会不会来问你要。会，说明它在产生价值；不会，说明它只在你脑子里。做这件事还有个隐性收益：你会被迫把每条提示词想清楚，因为要给别人用，含糊的地方藏不住。很多人是在写共享文档的过程中，才发现自己那条提示词其实有三处没想明白。还有个门槛要过：你得接受别人改你的提示词。改得对不对另说，愿意改说明真的在用。愿意改的人，往往也是最后真的在用的人。改的时候顺手在群里说一句。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三个台阶</tspan></text><g data-k=\"个人习惯\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">个人习惯</tspan></text></g><g data-k=\"共享文档\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">共享文档</tspan></text></g><g data-k=\"团队资产\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">团队资产</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 67.18}, {"t": "版本与失效记录：让改动可追", "n": "共享文档最大的问题是「谁改了什么没人知道」。解决办法是两条：版本号与失效记录。版本号不用复杂，v1.0、v1.1 就够，改一次升一位。失效记录写清「哪一版因为什么错改成了什么」，比如 v1.0 把提到名字的人当负责人，v1.1 加了「人名不等于责任人」。这两栏加起来，一份提示词就有了历史。新人拿到它，能看到别人踩过的坑，不用重踩。这比写一份完美提示词有用得多——完美不存在，可追才存在。版本号还有个小用处：同事说「我用的 v1.0 跑不出来」，你立刻知道是他没更新，不用查半天。版本号还能帮你判断：这条提示词是不是已经半年没人动过了。版本号写在文件名里更醒目。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每条的五栏</tspan></text><g data-k=\"编号 P-01 / 版本 v1.2\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">编号 P-01 / 版本 v1.2</tspan></text></g><g data-k=\"什么时候用（一句判断）\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">什么时候用（一句判断）</tspan></text></g><g data-k=\"提示词原文（可直接复制）\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">提示词原文（可直接复制）</tspan></text></g><g data-k=\"失效记录（哪版因什么改）\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">失效记录（哪版因什么改）</tspan></text></g></svg>", "d": 62.18}, {"t": "维护节奏：不定节奏的文档一定會烂", "n": "最后一步是定维护节奏，不定节奏的共享文档三个月后一定烂掉：版本停在 v1.0、失效记录没人补、里面的提示词早就不能用了。最简单可行的节奏是每月最后一个周五，维护人花二十分钟做三件事：把失效记录里重复的并进约束句、删掉没人用的条目、把版本号统一升一位。三个人以内的小组，这个节奏完全够。再补一条社交规则：谁改谁在群里说一句。这一句能省掉后面无数次「你用的是哪版」的扯皮。维护那天最好拉个人一起看，两个人二十分钟能发现一个人看不见的漏洞；一个人维护的文档，容易变成自说自话。两个人看还有个好处：一个人漏掉的场景，另一个人刚好踩过。维护记录也留一行在文档末尾。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每月固定一天维护\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每月固定一天维护</tspan></text></g><g data-k=\"改完群里说一句\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">改完群里说一句</tspan></text></g><g data-k=\"删掉没人用的条目\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">删掉没人用的条目</tspan></text></g></svg>", "d": 61.27}], "deliverable": {"type": "skill", "name": "团队提示词库（5 条）", "rubric": ["可直接取用", "版本可追", "有人维护"], "acceptance": "一份共享文档：5 条提示词齐全、每条有版本与场景说明、失效记录真实、写明了维护人与更新节奏"}, "practice": {"steps": ["挑 5 条你自己已经在用、跑过 3 次以上的提示词", "每条按模板补齐：编号、版本号、适用场景、原文、已知失效", "给每条写一句「谁在什么情况下该用它」，让人不用问就知道什么时候取", "整理成一份共享文档，发到组内群并说明「有坑请直接改」", "指定一个维护动作：每月最后一个周五，把失效记录并进约束句"], "exemplar": "【组内提示词库 v1.0】维护人：小林　更新节奏：每月最后一个周五\n\n────────────────────────────\nP-01 会议纪要整理（v1.2 · 2026-11-05）\n■ 什么时候用：部门例会、项目周会，有录音或速记稿，要发给没参会的人\n■ 提示词：\n　你是我的会议记录助手。请基于我贴的会议记录，为没参会的同事整理纪要，格式：\n　① 结论 3 条以内，每条一句话；② 待办清单，四列「事项 / 责任人 / 截止时间 / 依据」；\n　③ 存疑项单列，只写哪句话没听清或没定。\n　记录里没写责任人的填「待确认」，没写时间的填「待定」，不要推断；人名不等于责任人。\n■ 失效记录：\n　v1.0 把「提到名字的人」当负责人 → v1.1 加「人名不等于责任人」\n　v1.1 把「下周三」算成具体日期 → v1.2 加「时间写待定」\n■ 谁维护：小林（改完在群里说一声，别人好知道版本变了）\n\n────────────────────────────\nP-02 长文提炼三条（v1.0 · 2026-11-03）\n■ 什么时候用：拿到 10 页以上的报告或政策文件，要先判断跟自己有没有关系\n■ 提示词：\n　你是我的资料筛选助手。请基于我贴的文档，为我这个岗位（市场部新人）提炼 3 条\n　与工作直接相关的要点。每条：一句话结论 + 原文依据（照抄 20 字内）+ 页码。\n　与岗位无关的不写；文档没明说的不推断。\n■ 失效记录：v1.0 把附录里的假设数据当成结论 → 已加「标页码」要求，取用前翻回原页\n■ 谁维护：小林\n\n────────────────────────────\nP-03 名单统一成三列（v1.1 · 2026-11-02）\n■ 什么时候用：收到不同人填的杂乱名单，要合并成一张表\n■ 提示词：\n　请把我贴的名单统一成「公司 / 联系人 / 职位」三列，输出 markdown 表格。\n　原表没有的字段留空，不要猜。同一公司合并成一行，联系人用顿号分隔。\n　手机号、邮箱一律不输出。\n■ 失效记录：v1.0 把两个同名不同公司的人合并了 → v1.1 加「公司名须完全一致才合并」\n■ 红线：含手机号的原始表不要用这条，也不要用任何外部工具，只能在内部工具处理\n■ 谁维护：小林\n\n────────────────────────────\nP-04 把口语稿改成书面通知（v1.0 · 2026-11-04）\n■ 什么时候用：领导口述一段话，要变成一条能发群里的正式通知\n■ 提示词：\n　请把我贴的口述内容改成一条内部通知，格式：一句话事由 + 三条要点 + 一个行动项（谁做什么、什么时候）。\n　保留原意，不要新增承诺；涉及时间、金额、人员的，原话没说的写「待确认」。\n■ 失效记录：v1.0 自己加了「请各位务必执行」这种强硬措辞 → 已加「保留原意，不加语气」\n■ 谁维护：小林\n\n────────────────────────────\nP-05 周报三段式（v1.0 · 2026-11-06）\n■ 什么时候用：每周五下午写周报，给直属主管看\n■ 提示词：\n　请基于我贴的五条工作记录，写成周报三段：进展 / 问题 / 下周计划。\n　每段不超过四行；进展要有可核对的结果，问题要写清卡在哪，下周计划要写具体动作。\n　记录里没有的数字不要补；不确定的写「待核实」。\n■ 失效记录：v1.0 把「跟进了三个客户」改写成「成功推进多个客户」→ 已加「不要拔高措辞」\n■ 谁维护：小林\n\n────────────────────────────\n■ 使用规则（贴在文档最上面）\n　1. 取用前先看「什么时候用」，不符合就别用，容易出反效果\n　2. 用完发现新问题，当天在「失效记录」里补一行，不要只在自己电脑上改\n　3. 改提示词要升版本号并在群里说一句，避免大家用着不同版本对不上\n　4. 每月最后一个周五，维护人把失效记录并进约束句，清掉重复项"}, "task": "产出《团队提示词库（5 条）》：挑 5 条你自己已经在用、跑过 3 次以上的提示词；每条按模板补齐：编号、版本号、适用场景、原文、已知失效；给每条写一句「谁在什么情况下该用它」，让人不用问就知道什么时候取；整理成一份共享文档，发到组内群并说明「有坑请直接改」；指定一个维护动作：每月最后一个周五，把失效记录并进约束句", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M1 写出第一句好用的提示词」模块，你要交付的是《团队提示词库（5 条）》。\n【场景】业务侧这周的诉求是：在你电脑里的叫习惯，写进共享文档的才叫资产。参考做法：一位新人用 5 条提示词替换了组里口口相传的「怎么写纪要」。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提示词库模板（编号 / 版本 / 场景 / 原文 / 失效记录 / 谁维护）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《团队提示词库（5 条）》填写模板】\n\n■ 1. 挑 5 条你自己已经在用、跑过 3 次以上的提示词\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 每条按模板补齐：编号、版本号、适用场景、原文、已知失效\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 给每条写一句「谁在什么情况下该用它」，让人不用问就知道什么时候取\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 整理成一份共享文档，发到组内群并说明「有坑请直接改」\n   ‣ 提示：按「结论 → 依据 → 行动」三段写。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 指定一个维护动作：每月最后一个周五，把失效记录并进约束句\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【组内提示词库 v1.0】维护人：小林　更新节奏：每月最后一个周五\n\n────────────────────────────\nP-01 会议纪要整理（v1.2 · 2026-11-05）\n■ 什么时候用：部门例会、项目周会，有录音或速记稿，要发给没参会的人\n■ 提示词：\n　你是我的会议记录助手。请基于我贴的会议记录，为没参会的同事整理纪要，格式：\n　① 结论 3 条以内，每条一句话；② 待办清单，四列「事项 / 责任人 / 截止时间 / 依据」；\n　③ 存疑项单列，只写哪句话没听清或没定。\n　记录里没写责任人的填「待确认」，没写时间的填「待定」，不要推断；人名不等于责任人。\n■ 失效记录：\n　v1.0 把「提到名字的人」当负责人 → v1.1 加「人名不等于责任人」\n　v1.1 把「下周三」算成具体日期 → v1.2 加「时间写待定」\n■ 谁维护：小林（改完在群里说一声，别人好知道版本变了）\n\n────────────────────────────\nP-02 长文提炼三条（v1.0 · 2026-11-03）\n■ 什么时候用：拿到 10 页以上的报告或政策文件，要先判断跟自己有没有关系\n■ 提示词：\n　你是我的资料筛选助手。请基于我贴的文档，为我这个岗位（市场部新人）提炼 3 条\n　与工作直接相关的要点。每条：一句话结论 + 原文依据（照抄 20 字内）+ 页码。\n　与岗位无关的不写；文档没明说的不推断。\n■ 失效记录：v1.0 把附录里的假设数据当成结论 → 已加「标页码」要求，取用前翻回原页\n■ 谁维护：小林\n\n────────────────────────────\nP-03 名单统一成三列（v1.1 · 2026-11-02）\n■ 什么时候用：收到不同人填的杂乱名单，要合并成一张表\n■ 提示词：\n　请把我贴的名单统一成「公司 / 联系人 / 职位」三列，输出 markdown 表格。\n　原表没有的字段留空，不要猜。同一公司合并成一行，联系人用顿号分隔。\n　手机号、邮箱一律不输出。\n■ 失效记录：v1.0 把两个同名不同公司的人合并了 → v1.1 加「公司名须完全一致才合并」\n■ 红线：含手机号的原始表不要用这条，也不要用任何外部工具，只能在内部工具处理\n■ 谁维护：小林\n\n────────────────────────────\nP-04 把口语稿改成书面通知（v1.0 · 2026-11-04）\n■ 什么时候用：领导口述一段话，要变成一条能发群里的正式通知\n■ 提示词：\n　请把我贴的口述内容改成一条内部通知，格式：一句话事由 + 三条要点 + 一个行动项（谁做什么、什么时候）。\n　保留原意，不要新增承诺；涉及时间、金额、人员的，原话没说的写「待确认」。\n■ 失效记录：v1.0 自己加了「请各位务必执行」这种强硬措辞 → 已加「保留原意，不加语气」\n■ 谁维护：小林\n\n────────────────────────────\nP-05 周报三段式（v1.0 · 2026-11-06）\n■ 什么时候用：每周五下午写周报，给直属主管看\n■ 提示词：\n　请基于我贴的五条工作记录，写成周报三段：进展 / 问题 / 下周计划。\n　每段不超过四行；进展要有可核对的结果，问题要写清卡在哪，下周计划要写具体动作。\n　记录里没有的数字不要补；不确定的写「待核实」。\n■ 失效记录：v1.0 把「跟进了三个客户」改写成「成功推进多个客户」→ 已加「不要拔高措辞」\n■ 谁维护：小林\n\n────────────────────────────\n■ 使用规则（贴在文档最上面）\n　1. 取用前先看「什么时候用」，不符合就别用，容易出反效果\n　2. 用完发现新问题，当天在「失效记录」里补一行，不要只在自己电脑上改\n　3. 改提示词要升版本号并在群里说一句，避免大家用着不同版本对不上\n　4. 每月最后一个周五，维护人把失效记录并进约束句，清掉重复项", "rubric": ["5 条都是真跑过 3 次以上的，不是从网上抄的（失效记录能证明）", "每条有编号与版本号，改动能追到「哪次因为什么改的」", "每条写了「谁在什么情况下该用它」，新人不用问就能判断要不要取", "明确写了维护人与更新节奏，不是发完就扔在群里"]}, {"id": "M1U8", "tier": "adv", "step": "spar", "title": "导师问「这凭什么是团队资产」", "video": {"dur": "3.2min", "script": ["资产的标准不是写得好，是别人在用、且离了它会更慢", "资产论证三件套（被谁用过 / 挡住了什么 / 接手要多久）", "「我写了 5 条提示词」与「5 条被 4 个人用过 37 次、挡住 6 类错」的差别"]}, "ppt": {"method": "资产论证三件套（被谁用过 / 挡住了什么 / 接手要多久）", "case": "「我写了 5 条提示词」与「5 条被 4 个人用过 37 次、挡住 6 类错」的差别", "demo": "陪练说明：他会要求你给出可核对的使用数据"}, "objective": "能在导师质疑「这东西凭什么是团队资产」时，用使用次数、失效记录与接手成本证明价值", "transfer": "把提示词库的使用记录拉一张表，下次组会用它说明「省了多少次重复劳动」", "vslides": [{"t": "陪练说明：他不信「沉淀」这个词", "n": "这一关的对手是带教导师。他见过太多新人写完文档就说「我做了沉淀」，结果三个月后没人打开。所以他会追三件事：谁在用、用了多少次、离了你还能不能用。这三问答不上来，「资产」两个字就是空的。准备的时候去拉真实数据——群里问过几次、文档访问记录、同事复制的次数。拿不出精确数字也没关系，说清「怎么统计的」比数字漂亮更重要。他真正想确认的是：你有没有把它当工具在用，而不是当作业在交。准备时还有个动作：把使用记录截个图存着，不是为了汇报好看，是为了被质疑时能当场拿出来。截图要带日期，光有截图说不清是什么时候的。截图按月份归档，找起来快，也省得临时到处翻找。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">他会追的三件事</tspan></text><g data-k=\"谁在用\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">谁在用</tspan></text></g><g data-k=\"用了多少次\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">用了多少次</tspan></text></g><g data-k=\"离了你能不能转\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">离了你能不能转</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 63.12}, {"t": "怎么答「凭什么」：给三条硬证据", "n": "第一条，使用数据。哪个组、几个人、多少次，最好能说出最高频的那条用了多少次。第二条，挡住的错。列出失效记录里具体的几类，比如「把提到名字的人当负责人」这种，一说他就懂，因为他也被这事烦过。第三条，接手成本。说清别人接手要看哪几部分、大概多久、最容易接手错的是哪一栏——通常是失效记录，因为新人不看。三条摆完，「资产」这个说法就站住了。站不住的通常只有第一条：没数据，全靠感觉。第三条最容易答虚，接手成本要说得具体：接手的人第一步看什么、第二步改什么、哪一栏最容易看漏。说得越细，越像真的。如果答不出第一步看什么，说明文档结构有问题，得先改结构。答不清就先回去补文档再谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"使用数据：谁、几次、怎么统计\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">使用数据：谁、几次、怎么统计</tspan></text></g><g data-k=\"挡住的错：列 3 类具体的\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">挡住的错：列 3 类具体的</tspan></text></g><g data-k=\"接手成本：看什么、多久\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">接手成本：看什么、多久</tspan></text></g></svg>", "d": 68.11}, {"t": "最加分的一问：哪几条其实没人用", "n": "最后一问往往是这样：「这里面哪几条其实没什么人用？」很多人会硬撑说「都挺有用的」，这一撑就露了。正确答法是主动指出：名单整理那条只有我在用，另外两条使用次数个位数，我标了「观察中」，下个月还没人用就删。敢做减法的人，导师才信你说的加法。因为这说明你不是在堆文档，是在维护一个真的有人在用的东西。这一关过了，你后续要资源、要时间做工具，他都会更愿意给。顺便说一句：被问「哪条没人用」时别慌，这不是在挑你的错，是在看你会不会诚实评估自己的东西。能自己说出哪条不行的人，通常也是能把事做成的人。这一条答好了，后面要人要时间都好谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">可信</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">露馅</tspan></text><g data-k=\"主动指出低使用条目并给处理决定\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">主动指出低使用条目并给</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">处理决定</tspan></text></g><g data-k=\"五条都很有用\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">五条都很有用</tspan></text></g></svg>", "d": 60.58}], "deliverable": {"type": "skill", "name": "团队提示词库", "rubric": ["数据可核", "价值具体", "敢做减法"], "acceptance": "四个问题都答得出：使用人数与次数（可核对）、挡住的错的具体类型、接手需要多久、对低使用条目的处理决定"}, "spar": {"role": "带教导师", "persona": "见过太多「写了个文档就说是沉淀」的人，只认使用数据与实际接手成本", "mustAsk": ["你写这五条提示词，凭什么算团队资产？我自己也能写", "有多少人真的在用？用了多少次？你怎么统计的？", "如果明天你请假一周，别人能接手维护吗？", "这里面哪几条其实没什么人用？你打算怎么处理？"]}, "exemplar": "（导师问：你写这五条提示词，凭什么算团队资产？我自己也能写）\n\n结论：因为它已经在被四个人用，而且离了它我们会退回手工。这不是我写的文档，是组里在用的工具。\n依据：五条里有三条被同组四个人用过，两周累计 37 次，其中会议纪要用得最多，19 次。失效记录里记了 6 类真实的错，比如把提到名字的人当负责人、把「下周三」算成具体日期，这些错以前每次都要返工一次。\n边界：它现在的价值集中在纪要和名单整理两类，其他三类的使用次数还很少，达不到「资产」的标准，我标了「观察中」。要不要继续投入维护，取决于下个月这三类有没有人用；没人用我就删掉，不占地方。维护成本我算过，每月二十分钟。", "task": "把《团队提示词库》拿到「带教导师」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《团队提示词库》。现在要让它通过「带教导师」这一关。\n【对手的立场】见过太多「写了个文档就说是沉淀」的人，只认使用数据与实际接手成本。\n【他一定会追问】「你写这五条提示词，凭什么算团队资产？我自己也能写」 / 「有多少人真的在用？用了多少次？你怎么统计的？」 / 「如果明天你请假一周，别人能接手维护吗？」\n【场景】你说「导师问「这凭什么是团队资产」」，对方立刻回一句：你写这五条提示词，凭什么算团队资产？我自己也能写 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能给出一组可核对的使用数据（谁用、多少次、怎么统计的），不是「大家都在用」", "能说出至少 3 类被挡住的具体错误，不是「提高效率」", "说清接手成本（需要看什么、大概多久能上手），并指出文档里哪部分最容易接手错", "主动指出使用率低的条目并说明处理决定（删掉或观察），不硬撑「五条都很有用」"]}]}, {"id": "M2", "title": "M2 用 AI 收集与整理信息", "dims": ["data", "prompt", "security"], "units": [{"id": "M2U1", "tier": "basic", "step": "understand", "title": "先分三级：能查什么、不能查什么", "video": {"dur": "3.4min", "script": ["收集信息的第一步不是搜，是判断哪一条线不能碰", "信息来源三级分类（公开来源 / 内部材料 / 禁外传）", "新人把客户名单丢进搜索框「查一下这家公司」，结果把内部信息带了出去"]}, "ppt": {"method": "信息来源三级分类（公开来源 / 内部材料 / 禁外传）", "case": "新人把客户名单丢进搜索框「查一下这家公司」，结果把内部信息带了出去", "demo": "三级分类卡：拿 6 类常见材料各归一级"}, "objective": "能把手上材料按「可公开 / 需脱敏 / 不可外传」三级分类，并为每级说出一个具体字段例子", "transfer": "把本周要查的资料清单按三级标一遍，把「不可外传」那几项先划掉再开工", "vslides": [{"t": "开场：搜之前先问一句「这条线在哪」", "n": "新人接到「你去查一下这个行业」这类任务，第一反应是打开搜索框。但真正决定成败的动作发生在搜之前：先把手上的材料分三级。第一级是公开来源，行业报告、政策原文、公开报道、竞品官网，这些随便查。第二级是内部材料，公司自己的销售数据、成本、组织架构，这些可以看，但不能整段贴进外部工具。第三级是禁外传，客户名单、合同原文、未发布的经营数据、员工个人信息，这些连「问一句」都不行。三级分清楚，后面所有动作都有了边界。分不清的人不是不谨慎，是从来没意识到自己手上的东西属于哪一级，于是把第三级当成第一级用了。判断顺序建议从第三级倒着划：先把绝对不能碰的划出来，再看哪些需要脱敏，最后才是可以放心查的。从最严的一端开始划，你不会漏；从最松的一端开始放，你一定会漏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">信息来源三级</tspan></text><g data-k=\"公开来源\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">公开来源</tspan></text></g><g data-k=\"内部材料\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">内部材料</tspan></text></g><g data-k=\"禁外传\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">禁外传</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 74.11}, {"t": "第二级的操作要点：脱敏到字段，不是脱敏到感觉", "n": "第二级最容易被含糊处理。很多人说「我知道要脱敏」，但你问他脱什么，他答「把敏感的都去掉」。这句话没法执行。正确的做法是列字段：手机号、邮箱、身份证号、详细地址、订单号、支付流水、成本价、供应商名称。逐个问一句「这一列能不能出这个门」，能就留，不能就删或替换成区间。脱敏之后还要做一件事：留一份对照记录，写清删了哪些列、什么时候删的。这不是为了应付检查，是为了万一有人问「你给 AI 的那份数据里有没有客户信息」，你能当场答得出来。凭感觉脱敏的人，通常在被问的时候才发现自己漏了一列。还有一个常被忽略的点：脱敏后的表要能和原表对上号，做法是留一个只在自己手里保留的流水号对照，比如把客户名换成 C001，回填时才不会错行。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 列字段，不凭感觉\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列字段，不凭感觉</tspan></text></g><g data-k=\"② 逐列问「能不能出门」\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 逐列问「能不能出门」</tspan></text></g><g data-k=\"③ 留一份脱敏对照记录\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 留一份脱敏对照记录</tspan></text></g></svg>", "d": 66.36}, {"t": "第三级的判断标准：看的是后果，不是敏感度", "n": "第三级怎么判？不要用「敏感不敏感」这种模糊感觉，用后果。三条问句：第一，这份东西泄露出去，客户会不会受影响？第二，会不会违反我们签过的合同条款？第三，会不会让我在合规上说不清？三条里有一条是「会」，就进第三级。注意第三级不只是「不能贴进 AI」，还包括不能发到个人邮箱、不能传到个人网盘、不能在公开群里问。很多人以为只要不贴进 AI 就行，结果在公开群里发了张截图，同样出事。分级的价值在于：它让你在每一个「顺手」的动作前停半秒，而那半秒往往就是事故与没事的分界。一句话记住这套分级：能查不等于该查，该查不等于能贴给外部工具。分级的目的是让你问对问题，不是让你不敢干活。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"客户会不会受影响\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">客户会不会受影响</tspan></text></g><g data-k=\"是否违反合同条款\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">是否违反合同条款</tspan></text></g><g data-k=\"合规上能否说清\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">合规上能否说清</tspan></text></g></svg>", "d": 66.14}], "deliverable": {"type": "skill", "name": "信息来源分级卡", "rubric": ["分级准确", "字段具体", "边界清楚"], "acceptance": "能对 6 类常见材料各判一级，并说出「需脱敏」那一级具体去掉哪些字段"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】信息来源三级分类（公开来源 / 内部材料 / 禁外传）\n【为什么重要】收集信息的第一步不是搜，是判断哪一条线不能碰\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三级各有至少 2 个自己岗位的真实材料例子，不是复述课程", "「需脱敏」那一级能说出具体去掉哪几个字段（手机号、订单号、地址等）", "「不可外传」那一级能说出为什么不能外传（合同义务 / 未公开 / 个人信息）", "自检题全对；收获写成一句能马上执行的话"]}, {"id": "M2U2", "tier": "basic", "step": "demo", "title": "把「搜一圈」变成一份简报", "video": {"dur": "3.6min", "script": ["没有来源的结论，在会上撑不过一个追问", "情报简报四栏（结论 / 依据 / 来源 / 可信度）", "同一条行业消息，带来源与不带来源在周会上被追问的差别"]}, "ppt": {"method": "情报简报四栏（结论 / 依据 / 来源 / 可信度）", "case": "同一条行业消息，带来源与不带来源在周会上被追问的差别", "demo": "WorkBuddy 内跑一遍简报骨架生成，对照 AI 原稿与人改稿"}, "objective": "能把 6 条零散资料整理成一份带来源与可信度的简报骨架，并标出哪三条不能直接用", "transfer": "拿手上正在查的一个主题，按同样框架整理一遍，把「来源」列空着的条目补上链接", "vslides": [{"t": "演示准备：为什么简报必须有「来源」这一栏", "n": "这次演示的任务是「查一下社区团购最近有什么变化」。如果只交一段话，你在周会上会被问一句「这数据哪来的」，然后卡住。所以简报的格式里必须有一栏来源，而且来源要能指回具体材料编号。加这一栏还有个副作用：它逼着你在整理时就想清楚每条结论出自哪份材料，想不清楚的那条，通常就是你自己脑补的。四栏的顺序也有讲究：结论在前，因为读的人只关心结论；依据在后，用来支撑；来源第三，用来追溯；可信度最后，用来判断这条能不能拿去用。顺序错了，读的人会在细节里迷路。还有一种情况：有人把结论写得像结论，其实只是把材料里一句话换个说法，那不算结论，算转述。区分方法很简单：转述能在那份材料里逐字找到，结论则需要对两三份材料做一次比较或者一次取舍，两者的价值差一个量级。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">简报四栏</tspan></text><g data-k=\"结论\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">结论</tspan></text></g><g data-k=\"依据\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">依据</tspan></text></g><g data-k=\"来源\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">来源</tspan></text></g><g data-k=\"可信度\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">可信度</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 76.34}, {"t": "跑一遍：三个约束挡住三类错", "n": "提示词里我写了三个约束。第一，来源只填我给的编号，不许补充。不加这句，它会给你一堆看着像真的链接，点开是 404。第二，没写的数字写待核实。不加这句，它会为了完整编一个「约 12%」。第三，同主题多条合并。不加这句，同一件事会出现三条结论，读的人以为有三件事。跑完你会看到「待核实」和「低可信度」出现好几次，这不是简报做得差，这是它诚实。一份全是高可信度的简报，反而要警惕——通常意味着它把不确定的东西也说得很确定。判断方法很直接：如果一条结论被推翻，整份简报还剩几条能用？剩得少，说明它靠猜。第二个判断方法：把所有「高可信度」的条目抽出来，逐条问「这条如果错了，最坏后果是什么」，答不上来的就该降级。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：3 份公开材料（编号 M01–M03）\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：3 份公开材料（编号 M01–M03）</tspan></text></g><g
