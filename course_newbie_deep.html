带了对比基准（环比、同比或目标），不孤立给数", "归因有证据支撑，不是「可能是」「大概因为」", "动作写到能执行：谁、在什么时候、做什么", "能识别出哪几条只是数字、哪几条是猜测，并说明区别"]}, {"id": "M4U6", "tier": "adv", "step": "demo", "title": "从一张表到一条可执行建议", "video": {"dur": "3.1min", "script": ["不是所有发现都配得上一条建议", "发现分级（数字 / 现象 / 猜测 / 洞察）", "六条发现里只有两条经得起「所以呢」三连问"]}, "ppt": {"method": "发现分级（数字 / 现象 / 猜测 / 洞察）", "case": "六条发现里只有两条经得起「所以呢」三连问", "demo": "WorkBuddy 内跑一遍发现分级，对照 AI 原稿与人改稿"}, "objective": "能把 6 条「发现」判成洞察或噪音，并只把有证据的那几条写进建议", "transfer": "拿手上最近一份分析里所有带百分比的句子，逐条判一次，把「只是数字」的挪到背景区", "vslides": [{"t": "演示准备：先给发现分级，再谈建议", "n": "这次手上是六条从表里得到的发现。新人通常的做法是把六条全写上，然后加一句「建议加大投入」。问题不在建议写得糙，在于六条发现的分量完全不同：有的是数字，有的是现象，有的是猜测，只有少数是真正的洞察。混在一起写，读的人分不清哪条能信，最后一条都不信。所以我先做分级，四类：数字（有变化没基准）、现象（看到了什么但没解释）、猜测（有解释但没证据）、洞察（有基准、有归因、能落到动作）。分完你会发现，六条里真正能撑起建议的通常只有一两条。这不是材料变薄了，是材料变硬了。一条经得起三连问的洞察，比六条漂亮数字有用得多。分级还有个副作用：你会开始对自己写的每一句带数字的话产生怀疑，这是好事。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">发现四级</tspan></text><g data-k=\"数字\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">数字</tspan></text></g><g data-k=\"现象\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">现象</tspan></text></g><g data-k=\"猜测\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">猜测</tspan></text></g><g data-k=\"洞察\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">洞察</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.45}, {"t": "跑一遍：为什么猜测类必须清出建议", "n": "提示词里最狠的一条是「猜测类不得进入建议」。为什么这么严？因为猜测一旦进了建议，它就从「一个说法」变成了「一个决策依据」，而决策是要花钱的。比如「因为竞品缺货所以我们涨了」，如果据此建议「加大备货」，万一真实原因是补贴，钱就花错了地方。还有一层：猜测和建议混在一起，会影响整份材料的可信度——读的人只要发现一条没证据，就会怀疑其余全部。分级这一步还有个副产品：它把「待证清单」自然产出来了。所有猜测类都进待证，每条写清要拿到什么证据才能升级成洞察，这就成了你下一周的工作清单。所以别把待证清单当成负担，它是你唯一能证明自己在往前推的东西。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：6 条从表里得到的发现\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：6 条从表里得到的发现</tspan></text></g><g data-k=\"约束：无基准判数字 / 无证据判猜测 / 猜测不进建议 / ≤2 条建议\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：无基准判数字 / 无证据判猜测 / 猜测不进建议 / ≤2 条建</tspan><tspan x=\"52.0\" dy=\"15.4\">议</tspan></text></g><g data-k=\"产出：分级表 + 2 条建议\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：分级表 + 2 条建议</tspan></text></g></svg>", "d": 60.74}, {"t": "人工收口：建议和归因必须对得上", "n": "跑完你会发现最容易出问题的地方是「建议和归因对不上」。AI 给的建议往往很正确，也很通用，比如「加大投放」「提升效率」，但它跟你前面那条洞察没关系。判断方法很简单：把建议和它声称的支撑洞察并排放，问一句「如果这条洞察不成立，这个建议还成立吗」。如果还成立，说明建议不是从洞察推出来的，是你本来就有的想法。第二个动作是给建议补验收：谁、多少、什么时候看什么指标。没有验收的建议，做完也没人知道有没有效。最后砍条数：两条足够，三条以上通常意味着你自己也没想清哪个最重要。两条建议，每条都能被验收，比五条都不知道有没有效的建议强得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"建议与洞察并排验一次\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">建议与洞察并排验一次</tspan></text></g><g data-k=\"每条建议补验收指标\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条建议补验收指标</tspan></text></g><g data-k=\"砍到两条以内\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">砍到两条以内</tspan></text></g></svg>", "d": 62.57}], "deliverable": {"type": "skill", "name": "发现分级表 + 一条建议", "rubric": ["分级准确", "证据到位", "建议对得上"], "acceptance": "六条发现都判了级，猜测类全部标为待证，最终建议只由洞察类支撑"}, "demo": {"ref": "■ 一、分级表\n| 发现 | 类型 | 缺什么 | 是否进建议 |\n|---|---|---|---|\n| 本月订单 12.4 万单，环比 +9% | 数字 | 缺基准（目标/行业/去年同期） | 否，作背景 |\n| 增量七成来自华东三城 | 洞察 | 不缺 | 是 |\n| 因为竞品缺货所以我们涨了 | 猜测 | 缺归因证据 | 否，转待证 |\n| 华东三城客单价低于均值 12%，复购率高 20 个百分点 | 洞察 | 不缺 | 是 |\n| 用户可能更喜欢便宜的东西 | 猜测 | 缺归因证据，且与第 4 条矛盾 | 否，删除 |\n| 履约时效从 28 小时降到 24 小时 | 现象 | 缺与订单增长的关联证据 | 否，作背景 |\n\n■ 二、建议（仅 2 条）\n1. 在华东三城试点「高频复购客单提升」：由区域运营在 11 月对复购 3 次以上的客户发定向券，\n 预算 3 万元，12 月初看这部分客单是否提升 8%。—— 支撑：第 4 条洞察。\n2. 把华东三城的补货周期从 7 天压到 4 天：由供应链在 11 月完成，12 月初看缺货率是否降到 3% 以下。\n —— 支撑：第 2 条洞察（增量集中在华东）+ 第 3 条待证方向。\n\n■ 待证清单\n· 竞品缺货是否为增长主因：查三个竞品在 10 月的缺货投诉量，若能拿到公开数据则一周内可判。\n· 履约提速与订单增长是否相关：取 9 月提速前后的分城市订单做对照。", "fix": ["把「因为竞品缺货所以我们涨了」从建议依据里摘出去——它没有任何证据，只是时间上碰巧；进了建议就等于用猜的做决策。", "给第一条发现补了基准：环比 9% 到底是高于还是低于目标，不补基准，这个数字在会上会被当成废话。", "删掉「用户可能更喜欢便宜的东西」——它和第 4 条洞察（复购高但客单低）方向相反，留着会自相矛盾。", "把建议从 4 条砍到 2 条，每条都补了「谁 / 多少 / 何时验收」；原来的「加大华东投入」没有主体也没有验收。"], "judge": "判断依据：是否给数字补了基准；猜测是否被清出建议；建议是否只由洞察支撑；每条建议是否有主体、数量、验收时间", "sheet": {"situ": "你从 10 月订单表里整理出 6 条发现，准备写成一份带建议的分析。但这 6 条分量完全不同：有的是数字，有的是现象，有的是猜测。你要先判定每条的级别、能不能进建议、还缺什么。", "ask": "① 逐条判定：它属于哪一级、该不该进建议、缺什么证据；② 让模型出「分级表 + 建议」，建议不超过 2 条且只由洞察支撑；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请基于以上分级出「分级表 + 建议」，严格按两块输出：\n一、分级表：发现 | 类型 | 缺什么 | 是否进建议\n二、建议：仅用洞察支撑，每条写清「谁 / 做什么 / 多少 / 何时验收」，不超过 2 条\n规则：① 没基准的一律判数字；② 没归因证据的一律判猜测；③ 猜测不得进建议；④ 建议不超过 2 条。", "mats": [{"id": "F01", "src": "周报口径 · 自己算的", "text": "本月订单 12.4 万单，环比增长 9%。\n没有写目标值，也没有跟去年同期比。"}, {"id": "F02", "src": "分区域拆解 · 自己算的", "text": "增量七成来自华东三城；其余区域合计只增 2%。\n三城的增量从 10/08 起跳，与竞品缺货投诉高峰时间吻合。"}, {"id": "F03", "src": "会上听来的解释", "text": "因为竞品缺货，所以我们涨了。\n没有人给出竞品缺货量的数据。"}, {"id": "F04", "src": "分客群拆解 · 自己算的", "text": "华东三城客单价 68 元，低于全国均值 77 元；复购率 43%，全国 23%。\n复购 3 次以上客户贡献 71% 的订单，小包装占比 62%。"}, {"id": "F05", "src": "推测 · 无数据支撑", "text": "用户可能更喜欢便宜的东西，所以客单价低。\n与 F04 的「复购高」方向相反，没有做过验证。"}, {"id": "F06", "src": "履约看板 · 自己查的", "text": "履约时效从 28 小时降到 24 小时。\n没有做与订单增长的关联分析，不知道有没有关系。"}], "cols": [{"k": "is", "name": "属于哪一级", "hint": "数字 / 现象 / 猜测 / 洞察", "type": "chips", "w": 2, "tags": ["数字", "现象", "猜测", "洞察"]}, {"k": "act", "name": "该不该进建议", "hint": "只有洞察能支撑建议", "type": "chips", "w": 2, "tags": ["写进建议", "只作背景", "删掉", "补证据后再写"]}, {"k": "miss", "name": "还缺什么", "hint": "缺基准 / 缺归因 / 缺关联", "type": "chips", "w": 3, "tags": ["缺对比基准", "缺归因证据", "缺与结果的关联", "不缺，可直接用", "缺执行主体"]}], "key": {"F01": {"is": "数字", "act": "只作背景", "miss": "缺对比基准"}, "F02": {"is": "洞察", "act": "写进建议", "miss": "不缺，可直接用"}, "F03": {"is": "猜测", "act": "补证据后再写", "miss": "缺归因证据"}, "F04": {"is": "洞察", "act": "写进建议", "miss": "不缺，可直接用"}, "F05": {"is": "猜测", "act": "删掉", "miss": "缺归因证据"}, "F06": {"is": "现象", "act": "只作背景", "miss": "缺与结果的关联"}}, "notes": {"F01·is": "有变化没基准，只能算数字；不跟目标或去年比，9% 说明不了任何事", "F02·is": "有基准（七成集中）、有归因（时间吻合、补贴未加投可排除），属于洞察", "F03·act": "它是猜测但不能删：方向可能对，值得去查缺货数据；直接删掉会漏掉一条线索", "F05·act": "同样是猜测，但它与 F04 方向相反且无验证，留着会让材料自相矛盾，应当删", "F06·is": "看到了变化但没解释，属于现象；要和订单增长挂钩才够洞察的门槛"}, "delta": [{"op": "删", "frm": "模型的建议依据里引用了 F03「因为竞品缺货所以我们涨了」", "to": "把 F03 从建议依据中摘出，转入待证清单", "why": "猜测一旦进了建议就变成决策依据，万一真实原因是补贴，钱就花错了地方", "kw": ["猜测", "依据", "待证", "缺货"]}, {"op": "补", "frm": "模型对 F01 直接写成「增长 9%，表现良好」", "to": "改成「环比 +9%，华东三城 +21%，其余区域 +2%，去年同期 +11%」", "why": "不补基准，9% 是废话；补上四个数才能看出「增长集中、整体弱于去年」", "kw": ["基准", "去年同期", "华东三城", "2%"]}, {"op": "改", "frm": "模型给的建议是「加大华东三城投入」", "to": "改成「对复购 3 次以上客户发 8 元券，预算 3 万，12/05 看客单价是否到 73 元」", "why": "原建议没有主体、数量与验收标准，无法执行，也无法判断做对没有", "kw": ["预算", "复购", "验收", "客单价"]}, {"op": "删", "frm": "模型把「用户可能更喜欢便宜的东西」当成第 3 条洞察", "to": "整条删除", "why": "它没有证据，而且与 F04「复购率高」方向相反，留着会让材料自相矛盾", "kw": ["猜测", "矛盾", "删", "证据"]}], "refsheet": "F01｜数字｜只作背景｜缺对比基准\nF02｜洞察｜写进建议｜不缺，可直接用\nF03｜猜测｜补证据后再写｜缺归因证据\nF04｜洞察｜写进建议｜不缺，可直接用\nF05｜猜测｜删掉｜缺归因证据\nF06｜现象｜只作背景｜缺与结果的关联\n\n四条最容易判错的：\n· F03 和 F05 都是猜测，但处理不同：一个值得查、一个该删——区别在于是否与已有洞察矛盾。\n· F06 有时效、有变化，看着很像洞察，但它没解释「所以订单为什么涨」，只能算现象。\n· F01 有百分比不代表有洞察：没有基准的百分比是废话。\n· 只有 2 条进建议，不是材料薄，是材料硬——建议只由洞察支撑。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的分析助手。我会贴 6 条从表里得到的发现。请先分级，再给建议，严格按两块输出：\n一、分级表：发现 | 类型（数字/现象/猜测/洞察）| 缺什么 | 是否进建议\n二、建议：只允许用「洞察」类支撑，每条建议写清「谁 / 做什么 / 多少 / 何时验收」\n规则：① 没有对比基准的一律判为「数字」；② 没有归因证据的一律判为「猜测」；③ 猜测类不得进入建议；④ 建议条数不超过 2 条。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】发现分级（数字 / 现象 / 猜测 / 洞察）\n【参考案例】六条发现里只有两条经得起「所以呢」三连问\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的分析助手。我会贴 6 条从表里得到的发现。请先分级，再给建议，严格按两块输出：\n一、分级表：发现 | 类型（数字/现象/猜测/洞察）| 缺什么 | 是否进建议\n二、建议：只允许用「洞察」类支撑，每条建议写清「谁 / 做什么 / 多少 / 何时验收」\n规则：① 没有对比基准的一律判为「数字」；② 没有归因证据的一律判为「猜测」；③ 猜测类不得进入建议；④ 建议条数不超过 2 条。", "rubric": ["每条发现都判了级（数字 / 现象 / 猜测 / 洞察），没有模糊处理", "标为「猜测」的条目全部转入待证清单，没有混进建议", "最终建议的每句话都能指回一条洞察，没有凭空出现的主张", "能说出哪条发现最容易被误当成洞察，以及为什么"]}, {"id": "M4U7", "tier": "adv", "step": "todo", "title": "交一份带建议的数据分析", "video": {"dur": "3.1min", "script": ["分析的终点不是图表，是一个能被执行的建议", "分析五段（结论 / 洞察 / 证据 / 建议 / 待证）", "同一份数据，加了两条验收标准后从「参考」变成了「可执行」"]}, "ppt": {"method": "分析五段（结论 / 洞察 / 证据 / 建议 / 待证）", "case": "同一份数据，加了两条验收标准后从「参考」变成了「可执行」", "demo": "带建议的分析模板与填写示例"}, "objective": "能产出一份含 2 条建议的数据分析，每条建议都指得回一条洞察且带验收标准", "transfer": "把分析里「待证清单」的第一条本周就去查，查完在报告里把它的级别从猜测改成洞察或删掉", "vslides": [{"t": "第一步：先把「要对方决定什么」写在最前面", "n": "带建议的分析和普通分析的区别，就在第一段。普通分析开头是「本次分析如下」，带建议的分析开头是一句话：需要你决定什么。这句话写不出来，说明你还没想清这份分析要干嘛，那就先别写正文。写出来之后，后面每一段都要回答「这对那个决定有什么用」，答不上来的段落就删。新人常犯的错是把分析写成过程记录：我先做了什么、又做了什么、最后发现了什么。读的人不关心过程，他关心结论和建议。过程放在附录，需要时再翻。还有个检验方法：把结论念给一个不在项目里的同事听，问他「你觉得我要你做什么」，答得出来才算立住。写不出来就回去把那一句结论再想清楚，别用「综合分析」四个字顶着。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 需要你决定什么\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 需要你决定什么</tspan></text></g><g data-k=\"② 每段服务于这个决定\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 每段服务于这个决定</tspan></text></g><g data-k=\"③ 过程放附录\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 过程放附录</tspan></text></g></svg>", "d": 64.51}, {"t": "第二步：洞察要带基准，建议要带验收", "n": "洞察部分最容易缺的是基准。「华东涨了 21%」孤零零一个数字没有意义，要写成「整体 +9%，华东 +21%，其余 +2%，去年同期 +11%」。有这四个数，读的人立刻知道两件事：增长是集中的，而且整体其实比去年弱。建议部分最容易缺的是验收。「加大投放」不是建议，「给复购 3 次以上客户发 8 元券，预算 3 万，12/05 看客单价是否到 73 元」才是建议。有主体、有数量、有验收指标、有时间，四样齐了，别人才能执行，也才能判断你有没有做对。这一步做扎实，你的材料就从「参考」变成「可批」。这一步其实是在替读的人省事：他不用再问「要花多少」「谁来干」「怎么知道有没有效」，答案都在建议里。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"洞察四数对照\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">洞察四数对照</tspan></text></g><g data-k=\"建议四样齐全\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">建议四样齐全</tspan></text></g><g data-k=\"验收有指标和时间\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">验收有指标和时间</tspan></text></g></svg>", "d": 63.6}, {"t": "第三步：待证清单和「明确不做的」", "n": "待证清单要写清两件事：现在缺什么、拿到什么就能升级。只写「待确认」没有用，因为没人知道该怎么确认。写成「需拿到三个竞品 10 月缺货投诉量走势，若能拿到官方公告可升级为确认」，这就是一个可执行的任务。还有一节很多人不写但特别加分：「明确不做的」。写清你考虑过但决定不做的事，以及为什么不做。这一节的作用是告诉读的人你的判断边界——你不是没想到，是想过了。它还能保护你：以后有人问「为什么不做全国投放」，答案已经在材料里了。这一节写三到五条就够，写太多会显得你在给自己留后路。挑那些大概率会被问到的写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">收口三段</tspan></text><g data-k=\"缺什么\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">缺什么</tspan></text></g><g data-k=\"拿到什么能升级\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">拿到什么能升级</tspan></text></g><g data-k=\"明确不做什么 + 为什么\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">明确不做什么 + 为什么</tspan></text></g></svg>", "d": 60.74}], "deliverable": {"type": "skill", "name": "带建议的数据分析", "rubric": ["结论明确", "洞察有据", "建议可验"], "acceptance": "一份分析：结论一句话、洞察带基准与归因、建议 ≤2 条且带验收、有待证清单"}, "practice": {"steps": ["先写结论：一句话说清这份分析要对方做什么决定", "列 2–4 条洞察，每条带基准与归因证据", "把证据接在洞察后面：数据来源、口径、时间范围", "给 1–2 条建议，每条写清谁 / 做什么 / 多少 / 何时验收", "单列待证清单：哪些还是猜测、拿什么证据能升级"], "exemplar": "【10 月订单增长归因分析 · 附建议】\n分析人：小林　日期：2026-11-08　数据范围：2026-10-01 ~ 10-31 全量订单（已按 M4U1 四查清洗）\n读者：区域运营负责人　需要你决定：11 月是否在华东三城追加试点预算\n\n■ 一、结论\n10 月订单环比 +9%，增量七成来自华东三城；建议在华东三城做两项小额试点（合计 5.5 万元），\n12 月初按两个指标验收，不建议做全国性投放。\n\n■ 二、洞察（2 条）\n洞察 1：增量高度集中。\n　基准：整体环比 +9%，华东三城环比 +21%，其余区域合计 +2%（去年同期为 +11%）。\n　归因证据：三城的增量从 10/08 起跳，与竞品在当地的缺货投诉高峰（10/07 起）时间吻合；\n　　　　　　同期三城的补贴投放金额与 9 月持平，可排除「我们加投」这一解释。\n洞察 2：华东三城是「高频低客单」结构。\n　基准：三城客单价 68 元，全国均值 77 元（低 12%）；复购率 43%，全国 23%（高 20 个百分点）。\n　归因证据：分客群拆开看，复购 3 次以上的客户贡献了 71% 的订单，客单低是因为小包装占比高（62%）。\n\n■ 三、建议（2 条，均带验收）\n建议 1：对华东三城复购 3 次以上客户发定向券。\n　执行：区域运营，11/10 起，预算 3 万元，券面 8 元、门槛 60 元。\n　验收：12/05 看这部分客户客单价是否从 68 元提升到 73 元以上（+8%）。\n建议 2：华东三城补货周期从 7 天压到 4 天。\n　执行：供应链，11 月内完成，不额外增加预算。\n　验收：12/05 看三城缺货率是否从 6.2% 降到 3% 以下，缺货投诉是否同步下降。\n\n■ 四、证据与口径\n· 数据来源：交易中台 order_202610（清洗后 12,469 行）、履约看板。\n· 客单价口径：GMV / 有效订单数，不含运费与退款。\n· 复购口径：同一客户在 90 天内下单 ≥3 次。\n· 竞品缺货数据：来自公开投诉平台的抓取，仅作时间对照，未作为定量依据。\n\n■ 五、待证清单\n1. 竞品缺货是否为主因 —— 需拿到三个竞品 10 月的缺货投诉量走势，若能拿到官方公告可升级为确认。\n2. 补货周期与缺货率的因果关系 —— 需取 9 月局部试点城市做对照（当时压到 5 天的两个城市缺货率降至 4.1%）。\n3. 定向券是否会导致「薅券不复购」 —— 需在试点后看 30 天内的二次购买率。\n\n■ 六、明确不做的\n· 不做全国性投放：其余区域环比仅 +2%，与去年同期 +11% 相比是下滑，原因未查清前不宜加投。\n· 不引用行业增速：两份公开报道统计周期不一致，口径未统一前不作基准。"}, "task": "产出《带建议的数据分析》：先写结论：一句话说清这份分析要对方做什么决定；列 2–4 条洞察，每条带基准与归因证据；把证据接在洞察后面：数据来源、口径、时间范围；给 1–2 条建议，每条写清谁 / 做什么 / 多少 / 何时验收；单列待证清单：哪些还是猜测、拿什么证据能升级", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M4 用 AI 处理数据与表格」模块，你要交付的是《带建议的数据分析》。\n【场景】业务侧这周的诉求是：分析的终点不是图表，是一个能被执行的建议。参考做法：同一份数据，加了两条验收标准后从「参考」变成了「可执行」。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（分析五段（结论 / 洞察 / 证据 / 建议 / 待证）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《带建议的数据分析》填写模板】\n\n■ 1. 先写结论：一句话说清这份分析要对方做什么决定\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 列 2–4 条洞察，每条带基准与归因证据\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 把证据接在洞察后面：数据来源、口径、时间范围\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 给 1–2 条建议，每条写清谁 / 做什么 / 多少 / 何时验收\n   ‣ 提示：写成「前置条件 + 操作步骤 + 预期结果」，可被第三方照着测。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 单列待证清单：哪些还是猜测、拿什么证据能升级\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【10 月订单增长归因分析 · 附建议】\n分析人：小林　日期：2026-11-08　数据范围：2026-10-01 ~ 10-31 全量订单（已按 M4U1 四查清洗）\n读者：区域运营负责人　需要你决定：11 月是否在华东三城追加试点预算\n\n■ 一、结论\n10 月订单环比 +9%，增量七成来自华东三城；建议在华东三城做两项小额试点（合计 5.5 万元），\n12 月初按两个指标验收，不建议做全国性投放。\n\n■ 二、洞察（2 条）\n洞察 1：增量高度集中。\n　基准：整体环比 +9%，华东三城环比 +21%，其余区域合计 +2%（去年同期为 +11%）。\n　归因证据：三城的增量从 10/08 起跳，与竞品在当地的缺货投诉高峰（10/07 起）时间吻合；\n　　　　　　同期三城的补贴投放金额与 9 月持平，可排除「我们加投」这一解释。\n洞察 2：华东三城是「高频低客单」结构。\n　基准：三城客单价 68 元，全国均值 77 元（低 12%）；复购率 43%，全国 23%（高 20 个百分点）。\n　归因证据：分客群拆开看，复购 3 次以上的客户贡献了 71% 的订单，客单低是因为小包装占比高（62%）。\n\n■ 三、建议（2 条，均带验收）\n建议 1：对华东三城复购 3 次以上客户发定向券。\n　执行：区域运营，11/10 起，预算 3 万元，券面 8 元、门槛 60 元。\n　验收：12/05 看这部分客户客单价是否从 68 元提升到 73 元以上（+8%）。\n建议 2：华东三城补货周期从 7 天压到 4 天。\n　执行：供应链，11 月内完成，不额外增加预算。\n　验收：12/05 看三城缺货率是否从 6.2% 降到 3% 以下，缺货投诉是否同步下降。\n\n■ 四、证据与口径\n· 数据来源：交易中台 order_202610（清洗后 12,469 行）、履约看板。\n· 客单价口径：GMV / 有效订单数，不含运费与退款。\n· 复购口径：同一客户在 90 天内下单 ≥3 次。\n· 竞品缺货数据：来自公开投诉平台的抓取，仅作时间对照，未作为定量依据。\n\n■ 五、待证清单\n1. 竞品缺货是否为主因 —— 需拿到三个竞品 10 月的缺货投诉量走势，若能拿到官方公告可升级为确认。\n2. 补货周期与缺货率的因果关系 —— 需取 9 月局部试点城市做对照（当时压到 5 天的两个城市缺货率降至 4.1%）。\n3. 定向券是否会导致「薅券不复购」 —— 需在试点后看 30 天内的二次购买率。\n\n■ 六、明确不做的\n· 不做全国性投放：其余区域环比仅 +2%，与去年同期 +11% 相比是下滑，原因未查清前不宜加投。\n· 不引用行业增速：两份公开报道统计周期不一致，口径未统一前不作基准。", "rubric": ["开头一句话就说清了要对方做什么决定，不是「本次分析如下」", "每条洞察都带对比基准与归因证据，没有孤立数字", "建议 ≤2 条，每条有主体、数量、验收指标与时间", "待证清单写清了「拿什么证据能升级为洞察」，不是只写「待确认」"]}, {"id": "M4U8", "tier": "adv", "step": "spar", "title": "主管问「那我们该怎么办」", "video": {"dur": "3.2min", "script": ["主管要的不是分析，是一个能批的动作", "建议应答四句（做什么 / 花多少 / 谁做 / 怎么验）", "「建议加大投入」与「3 万预算、区域运营执行、12/05 看客单到 73 元」的差别"]}, "ppt": {"method": "建议应答四句（做什么 / 花多少 / 谁做 / 怎么验）", "case": "「建议加大投入」与「3 万预算、区域运营执行、12/05 看客单到 73 元」的差别", "demo": "陪练说明：他会先问怎么办，再问凭什么不all in"}, "objective": "能在主管追问下把建议讲成「花多少、谁做、怎么验」，并守住不做全国投放的判断", "transfer": "把这次被追问的两处补进分析：一处补验收指标，一处补「为什么不扩大范围」", "vslides": [{"t": "陪练说明：他要的是能批的一句话", "n": "这一关的对手是区域运营负责人。他刚才听完了你的分析，现在只想知道一件事：那我该怎么办。这时候最忌讳的是复述分析过程——你把刚才讲的再讲一遍，他会打断你。正确做法是四句话：做什么、花多少、谁做、怎么验。四句话说完，他要么批，要么问细节，两种都是好结果。准备方法：把建议压缩成一句话写在纸上，念一遍，如果超过三十秒，说明还没压到位。还有一层心理准备：他问「怎么办」的时候，其实已经默认你的分析成立了，他要的是执行方案，不是再听一遍论证。这时候还在讲论证，等于不信任他的判断力。四句话的顺序也有讲究：先说做什么，再说花多少——因为钱是最容易被否的一项，早说早结束。这是对他时间的尊重。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">建议四句</tspan></text><g data-k=\"做什么\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">做什么</tspan></text></g><g data-k=\"花多少\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">花多少</tspan></text></g><g data-k=\"谁做\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">谁做</tspan></text></g><g data-k=\"怎么验\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">怎么验</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 64.97}, {"t": "第二问：为什么不 all in", "n": "「既然华东涨得这么好，为什么不全国铺开」这个问题几乎一定会被问。答不好，你的建议会被当成保守；答得好，它会变成你专业性的证明。答法必须用数据，不能用态度。「稳妥起见」是态度，「其余区域环比只有 +2%，去年同期是 +11%，下滑原因还没查清」是数据。前者听起来像不敢担责，后者听起来像做过功课。再补一句边界：「在原因查清之前扩大，等于把一个没搞懂的现象复制到更多地方。」这句话会让他觉得你考虑的是整体，不是自己那一块。这一问还有个进阶答法：说清「什么条件下我会建议扩大」，比如两个指标都达标、且下滑原因已查清。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"不给态度，给数字\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不给态度，给数字</tspan></text></g><g data-k=\"说清扩大前提是什么\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">说清扩大前提是什么</tspan></text></g><g data-k=\"把风险讲成条件句\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">把风险讲成条件句</tspan></text></g></svg>", "d": 63.86}, {"t": "第四问：做砸了怎么办", "n": "最后一问通常是「如果投了没效果，你打算怎么办」。这一问考的是你有没有想过失败。答法给三层：判断标准（12/05 客单没到 73 元就算没效果）、归因方向（是券设计问题还是需求不存在）、止损动作（停投而不是加投）。三层说完，他会觉得这事可控。反过来，如果你说「应该会有效果」，他会觉得你在赌。新人最容易在这一问上失分，因为他把「有信心」和「有预案」混为一谈。有信心是对结果的态度，有预案是对风险的准备，两者不能互相替代。给出止损线，你才拿到继续试的许可。顺便说一句，能主动给止损线的人，通常拿到的预算比不敢给的人多，因为批钱的人最怕没有退出机制。给不了止损线，就别怪他一直不批。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">敢批</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">不敢批</tspan></text><g data-k=\"给判断标准与止损线\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">给判断标准与止损线</tspan></text></g><g data-k=\"保证一定有效果\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">保证一定有效果</tspan></text></g></svg>", "d": 64.99}], "deliverable": {"type": "skill", "name": "带建议的数据分析", "rubric": ["动作具体", "数字清楚", "留了止损"], "acceptance": "四问都答得出：两条具体动作与预算、执行主体与验收时间、不扩大的量化理由、失败后的止损方案"}, "spar": {"role": "区域运营负责人", "persona": "只要动作与数字，不要过程；会先问怎么办，再问凭什么不 all in，最后问做砸了怎么办", "mustAsk": ["说了这么多，那我们到底该怎么办？", "要花多少钱、谁来干、什么时候能看到结果？", "既然华东涨得这么好，为什么不干脆全国铺开？", "如果投了没效果，你打算怎么办？"]}, "exemplar": "（主管问：说了这么多，那我们到底该怎么办）\n\n结论：两步小额试点，合计 5.5 万元，12 月初按两个指标验收；不建议全国投放。\n依据：增量七成在华东三城，且三城的增量从 10/08 起跳、与竞品缺货高峰时间吻合，同期我们的补贴投放与 9 月持平——所以这波是外部机会窗口，不是我们投放带来的。三城复购率 43%、全国 23%，客单低 12%，结构上是高频低客单，适合用券提客单而不是用补贴拉新。\n边界：如果 12/05 客单没到 73 元，我会认为券的设计有问题，而不是需求不存在，届时建议停投而不是加投。另外其余区域环比只有 +2%、去年是 +11%，下滑原因我还没查清，所以在查清之前我不会建议扩到全国——这一点我写进了「明确不做的」。", "task": "把《带建议的数据分析》拿到「区域运营负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《带建议的数据分析》。现在要让它通过「区域运营负责人」这一关。\n【对手的立场】只要动作与数字，不要过程；会先问怎么办，再问凭什么不 all in，最后问做砸了怎么办。\n【他一定会追问】「说了这么多，那我们到底该怎么办？」 / 「要花多少钱、谁来干、什么时候能看到结果？」 / 「既然华东涨得这么好，为什么不干脆全国铺开？」\n【场景】你说「主管问「那我们该怎么办」」，对方立刻回一句：说了这么多，那我们到底该怎么办？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["回答直接给动作与预算，不复述分析过程", "说清执行主体与验收时间点，不是「后续跟进」", "用数据解释为什么不扩大（其余区域 +2%、去年 +11%），不是「稳妥起见」", "给出失败后的判断与止损方案，不承诺「一定有效」"]}]}, {"id": "M5", "title": "M5 用 AI 开会、记纪要、跟任务", "dims": ["workflow", "content", "tools"], "units": [{"id": "M5U1", "tier": "basic", "step": "understand", "title": "纪要不是记录，是行动清单", "video": {"dur": "3.5min", "script": ["会议的价值不在说了什么，在散会后谁去做什么", "纪要四块（结论 / 决议 / 待办 / 待定）", "一份三千字实录 vs 一页四块纪要，后者被转发了三次"]}, "ppt": {"method": "纪要四块（结论 / 决议 / 待办 / 待定）", "case": "一份三千字实录 vs 一页四块纪要，后者被转发了三次", "demo": "四块卡：拿六段发言各归一块"}, "objective": "能把一段会议发言整理成「结论 / 决议 / 待办 / 待定」四块，每块只写该块的内容", "transfer": "把手上最近一次会的记录按四块重排一遍，把「待定」里没人认领的挑出来单独问", "vslides": [{"t": "为什么不写成实录", "n": "新人记纪要最常见的做法，是把会上说的话按顺序记下来。三千字，很完整，然后没有人看第二遍。原因很简单：读纪要的人不想知道谁说了什么，他只想知道自己要做什么。所以纪要的结构不该按时间排，该按用途排。用途只有四种：这次会议得出什么结论、定了什么、谁要做什么、什么还没定。按这四块写，一页就够，而且每一块都能单独被人拿去用。按时间写，读的人得自己从三千字里刨出这四件事，刨的过程就是他不看的理由。还有一层：写实录的人容易产生一种错觉，觉得记得越全越负责。实际上记得越全，越没人看，因为看它的成本已经超过重新问你一遍。所以判断纪要写得好不好，有个简单标准：散会后有没有人能只看待办那一块就开始干活。能，就是好纪要。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">纪要四块</tspan></text><g data-k=\"结论\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">结论</tspan></text></g><g data-k=\"决议\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">决议</tspan></text></g><g data-k=\"待办\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">待办</tspan></text></g><g data-k=\"待定\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">待定</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.33}, {"t": "四块各写什么", "n": "第一块结论：这次会开完，最重要的判断是什么。通常一到两句，写在最前面。第二块决议：明确定下来的事，要写成陈述句，「定 A 方案，不做 B」。注意决议里不要写讨论过程，「经过讨论大家认为」这种话一律删掉。第三块待办：谁在什么时候做什么，一条一行。这一块是纪要的灵魂，占全文一半以上的价值。第四块待定：讨论了但没有结论的，写清卡在谁那里、需要什么才能定。这一块最容易被省略，也是最容易出事的地方——会上没定的事，散会后就会被当成定了，等到执行时才发现各方理解不同。四块的顺序不要变，用久了别人打开就知道去哪找东西。四块里只有第三块会被反复翻，其余三块看一遍就够；所以把七成力气花在待办上，不亏。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 结论：最重要的判断\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 结论：最重要的判断</tspan></text></g><g data-k=\"② 决议：定了什么\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 决议：定了什么</tspan></text></g><g data-k=\"③ 待办：谁·何时·做什么\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 待办：谁·何时·做什么</tspan></text></g><g data-k=\"④ 待定：卡在谁那\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 待定：卡在谁那</tspan></text></g></svg>", "d": 69.46}, {"t": "三条硬标准：到人、到时、可验", "n": "待办这一块有三条硬标准，缺一条就会烂尾。第一，到人：写名字，不写「相关同事」。写部门也不够，一个部门五个人，谁做？第二，到时：写具体日期，不写「本周内」。「本周内」在周三说出来和在周五说出来，含义完全不同。第三，可验：做完能拿出一个东西，一份文档、一个数、一次确认都行。做不到这三条，这条待办就等于没有。还有一条经验：一条待办只写一个动作。「整理数据并同步给运营」是两个动作，应该拆成两条，因为它们的责任人可能不同，完成时间也不同。拆开之后你会发现，原本一条看着很顺的待办，其实藏着两件没人认领的事。三条都做不到的待办，正确做法是退回去问清楚，而不是先写进纪要占个位置——占位置等于埋雷。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"到人：写名字不写部门\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">到人：写名字不写部门</tspan></text></g><g data-k=\"到时：写日期不写「本周内」\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">到时：写日期不写「本周内」</tspan></text></g><g data-k=\"可验：做完能拿出东西\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">可验：做完能拿出东西</tspan></text></g></svg>", "d": 69.65}], "deliverable": {"type": "skill", "name": "四块纪要", "rubric": ["四块分明", "待办到人", "待定不藏"], "acceptance": "能把六段发言归入四块，待办每一条都有责任人与时间，待定每条写明卡在谁那里"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】纪要四块（结论 / 决议 / 待办 / 待定）\n【为什么重要】会议的价值不在说了什么，在散会后谁去做什么\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["四块各司其职，没有把讨论过程写进「决议」", "待办每条都有责任人与截止时间，没有「相关人员跟进」", "待定项单列并写清卡在谁那里，不是含糊带过", "全文控制在一页内，能删掉不影响行动的内容都删了"]}, {"id": "M5U2", "tier": "basic", "step": "demo", "title": "让 AI 出一份结构化纪要", "video": {"dur": "3.5min", "script": ["要摘要它给你一段话，要结构它才给你可执行的条目", "转写稿进、四块纪要出（结论 / 决议 / 待办 / 待定）", "同一段转写稿，出「摘要」和出「四块纪要」在使用上差一个量级"]}, "ppt": {"method": "转写稿进、四块纪要出（结论 / 决议 / 待办 / 待定）", "case": "同一段转写稿，出「摘要」和出「四块纪要」在使用上差一个量级", "demo": "WorkBuddy 内跑一遍纪要生成，对照 AI 原稿与人改稿"}, "objective": "能把会议转写稿交给 AI 出一份四块纪要，并把所有含糊的待办改到人到时", "transfer": "用这份纪要模板把本周开过的会各整理一份，发给主持人确认后再发群里", "vslides": [{"t": "演示准备：要结构，不要摘要", "n": "这次手上是一段四十分钟的会议转写稿。新人通常会说「帮我总结一下」，拿到的是一段三百字的摘要，读起来挺顺，但没人能照着它干活。因为摘要回答的是「这会讲了什么」，纪要要回答的是「我要做什么」。所以提示词里我不说总结，我直接给四块结构，让它往结构里填。结构给对了，输出才有用。还有一件事提前说：转写稿一定有错字、有口语、有听不清的地方。这些地方最容易出事——模型会顺手把它补成一个通顺的句子，看上去合理，实际是编的。所以提示词里必须写「没听清的写未听清待确认」，宁可留个洞，也不要它填一个好听的。还有个小技巧：贴转写稿之前，先把明显的错字和重复的语气词删掉，输出质量会明显好一截。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这一步在做什么</tspan></text><g data-k=\"转写稿\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">转写稿</tspan></text></g><g data-k=\"四块结构\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">四块结构</tspan></text></g><g data-k=\"可执行纪要\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可执行纪要</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 68.81}, {"t": "跑一遍：三个约束防三类错", "n": "提示词里三个约束，各防一类错。第一，「只写转写稿里出现过的内容」——防编造。模型有个很强的倾向：看到「预算待定」就补一个「预计 3 万元」，看到「效果不错」就补一个「提升 15%」。这些数字进了纪要，就成了后续所有讨论的基础，而它根本不存在。第二，「待办必须有人名和日期」——防烂尾。不给这个约束，它会写「相关团队跟进」，看着完整，实际没人动。第三，「不写经过讨论」——防注水。过程描述会让纪要从一页变成三页，而信息量没增加。跑完你会看到「待确认」出现好几次，这不是纪要差，这是它诚实。一份全是确定表述的纪要，反而要警惕。这三类错里，编造数字的危害最大，因为它看起来最具体，也最容易被当成依据往下传。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：40 分钟会议转写稿（含错字与口语）\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：40 分钟会议转写稿（含错字与口语）</tspan></text></g><g data-k=\"约束：只写稿里有的 / 待办到人到时 / 不写过程\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：只写稿里有的 / 待办到人到时 / 不写过程</tspan></text></g><g data-k=\"产出：四块纪要约一页\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：四块纪要约一页</tspan></text></g></svg>", "d": 71.42}, {"t": "人工收口：待定和待办不能混", "n": "跑完最要紧的一件事，是把「待定」和「待办」分开。这两块最容易混，也最容易出事。待办是「已经定了，谁去做」；待定是「还没定，卡在谁那里」。把待定放进待办，散会后就会有人按自己理解去执行，然后各方做得不一样，返工一轮。判断方法很简单：这条有没有一个明确的动作和交付物？有，是待办；没有，只是在讨论，就是待定。第二个动作是给待定挂人：卡在谁那里、需要什么才能定。不挂人，待定会一直待定。最后把纪要发给主持人确认一句「这样记对吗」，再发群。这一步三十秒，能挡掉后面所有扯皮。主持人确认这一步不要省，也别只发一句「纪要见附件」，要把待办那几条单独列给他看。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"待办有动作与交付物\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">待办有动作与交付物</tspan></text></g><g data-k=\"待定挂人挂条件\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">待定挂人挂条件</tspan></text></g><g data-k=\"发群前先给主持人确认\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">发群前先给主持人确认</tspan></text></g></svg>", "d": 71.33}], "deliverable": {"type": "skill", "name": "四块会议纪要", "rubric": ["四块齐全", "待办到人", "不编内容"], "acceptance": "四块齐全、待办每条有责任人与日期、待定写清卡在谁那、没有会上没出现的内容"}, "demo": {"ref": "■ 一、结论\n本月重点从「拉新」转向「复购」，资源向华东三城倾斜；拉新预算暂不追加。\n\n■ 二、决议\n1. 定：11 月华东三城试点复购券，预算 3 万元。\n2. 定：全国拉新预算维持 10 月水平，不再追加。\n3. 不做的：暂不进入生鲜类目（等 12 月再看）。\n\n■ 三、待办\n| 谁 | 做什么 | 什么时候 | 交付什么 |\n|---|---|---|---|\n| 张颖 | 出复购券方案（面额/门槛/发放规则） | 11/10 | 一页方案 |\n| 王磊 | 拉华东三城复购客群名单 | 11/11 | 名单文件（含口径说明） |\n| 李鹏 | 确认券的成本计入哪个科目 | 11/12 | 财务口径一句话确认 |\n| 我 | 汇总三方结果，出试点执行单 | 11/13 | 执行单 |\n| 待确认 | 券是否可叠加平台活动 | 待确认 | 需问平台运营 |\n\n■ 四、待定\n1. 券能否叠加平台活动 —— 卡在平台运营（未在会上确认联系人），需要一份平台规则说明才能定。\n2. 生鲜类目是否 12 月启动 —— 卡在采购，需要供应商报价才能定。\n\n■ 说明\n· 会上未明确「券的核销数据谁来看」，已列入待办最后一行待确认。", "fix": ["把「相关同事尽快跟进复购券方案」改成「张颖 11/10 出一页方案」——原来那条没有到人，散会后没人认领。", "删掉「经过讨论，大家普遍认为复购更重要」这类过程描述，只留决议本身；过程不进纪要。", "把 AI 自己补的「预计复购率可提升 15%」删掉——会上没人说过这个数，纪要里出现编的数最伤信任。", "把「券是否可叠加平台活动」从待办挪到待定：会上根本没结论，放在待办里会被当成已定的事去执行。"], "judge": "判断依据：待办是否都到人到位；有没有编造会上没说的数字；待定项是否被误放进待办；有没有过程描述残留", "sheet": {"situ": "你刚记完一场 40 分钟的项目会，转写稿里有错字、有口语、有几处没听清。你要把 6 段关键发言逐条判定：它该进纪要哪一块、该怎么写、能不能直接进。", "ask": "① 逐条判定：归到哪一块、写成什么形式、要不要进纪要；② 让模型出四块纪要（结论/决议/待办/待定），待办必须到人到时；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请基于以上判定出一份四块纪要，严格按四块输出：结论 / 决议 / 待办（表格）/ 待定。\n规则：① 只写转写稿里出现过的内容，没听清的写「未听清，待确认」；② 待办必须有人名和日期，没有就写「待确认」并单列；③ 不写「经过讨论」这类过程描述；④ 全文不超过一页。", "mats": [{"id": "R01", "src": "转写 00:12 主持人", "text": "那这个月我们就不追拉新了，重点转复购，资源往华东三城放。\n这句话是结论，会上没有人反对。"}, {"id": "R02", "src": "转写 00:18 张颖", "text": "复购券这个我可以出一版方案，面额和门槛我想想，周一给你。\n说的是她来做，时间是周一。"}, {"id": "R03", "src": "转写 00:23 王磊", "text": "名单这块我可以看一下，但要看数据组给不给权限。\n没有明确说要出，也没有说时间。"}, {"id": "R04", "src": "转写 00:31 众人讨论", "text": "（多人交替发言约 6 分钟）讨论券能不能叠加平台活动，各说各的看法。\n没有形成结论，也没定谁去问。"}, {"id": "R05", "src": "转写 00:38 李鹏", "text": "生鲜那个先不动，十二月再看。\n这是明确的「不做」决定。"}, {"id": "R06", "src": "转写 00:41 赵敏", "text": "效果应该会不错，我看同行做了大概能提升 15% 左右。\n这是她的估计，没有任何数据来源。"}], "cols": [{"k": "blk", "name": "归到哪一块", "hint": "结论 / 决议 / 待办 / 待定 / 不进纪要", "type": "chips", "w": 2, "tags": ["结论", "决议", "待办", "待定", "不进纪要"]}, {"k": "form", "name": "写成什么形式", "hint": "陈述句、四有表格、还是挂人挂条件", "type": "chips", "w": 3, "tags": ["一句陈述", "四有表格", "挂人挂条件", "删掉不写", "标待确认"]}, {"k": "risk", "name": "直接写进去会出什么事", "hint": "选后果", "type": "chips", "w": 2, "tags": ["散会后没人认领", "被当成已定的事执行", "编出一个数当依据", "责任错配", "纪要变长没人看", "被当成结论转发"]}, {"k": "fix", "name": "你该怎么处理", "hint": "选一个具体动作", "type": "chips", "w": 2, "tags": ["原文照录", "补人名与日期", "补条件或转待确认", "只写「讨论了未定」", "整句删除", "标「个人估计，未核实」"]}], "key": {"R01": {"blk": "结论", "form": "一句陈述", "risk": "纪要变长没人看", "fix": "原文照录"}, "R02": {"blk": "待办", "form": "四有表格", "risk": "散会后没人认领", "fix": "补人名与日期"}, "R03": {"blk": "待办", "form": "标待确认", "risk": "责任错配", "fix": "补条件或转待确认"}, "R04": {"blk": "待定", "form": "挂人挂条件", "risk": "被当成已定的事执行", "fix": "只写「讨论了未定」"}, "R05": {"blk": "决议", "form": "一句陈述", "risk": "被当成结论转发", "fix": "原文照录"}, "R06": {"blk": "不进纪要", "form": "删掉不写", "risk": "编出一个数当依据", "fix": "整句删除"}}, "notes": {"R03·fix": "原话带条件（要看数据组给不给权限），直接写成「王磊出名单」会造成责任错配", "R04·blk": "讨论了但没结论的，必须进待定；塞进待办就会被当成已定的事去执行", "R05·blk": "「不做」也是决议，而且要写进去——不写，下个月还会有人提一次生鲜", "R06·blk": "个人估计没有数据来源，写进纪要会被当成结论转发；要留就标「个人估计，未核实」"}, "delta": [{"op": "删", "frm": "模型把「效果大概能提升 15%」写进了结论", "to": "整句删除，纪要里不出现任何会上没给依据的数字", "why": "个人估计进了结论就变成依据，后面所有测算都建在这个 15% 上", "kw": ["15%", "估计", "删", "依据"]}, {"op": "改", "frm": "模型写「王磊出名单」", "to": "改成「王磊：确认数据组能否给名单权限，11/11 前回复；名单由谁出待确认」", "why": "原话带条件，压掉条件等于让他无条件承担", "kw": ["权限", "条件", "待确认", "王磊"]}, {"op": "补", "frm": "模型漏了「生鲜暂不进入」这条", "to": "补进决议：「不做：暂不进入生鲜类目，12 月再议」", "why": "「不做」也是决议；不写，下次会还会有人重新提一遍", "kw": ["生鲜", "不做", "决议", "12 月"]}, {"op": "改", "frm": "模型把「券能否叠加平台活动」放进待办", "to": "挪到待定，写明卡在平台运营、需要一份规则说明", "why": "会上没定，放待办会被当成已定的事执行，最后各方做得不一样", "kw": ["待定", "平台", "规则", "没定"]}], "refsheet": "R01｜结论｜一句陈述｜纪要变长没人看｜原文照录\nR02｜待办｜四有表格｜散会后没人认领｜补人名与日期\nR03｜待办｜标待确认｜责任错配｜补条件或转待确认\nR04｜待定｜挂人挂条件｜被当成已定的事执行｜只写「讨论了未定」\nR05｜决议｜一句陈述｜被当成结论转发｜原文照录\nR06｜不进纪要｜删掉不写｜编出一个数当依据｜整句删除\n\n四条最容易判错的：\n· R03 看着像待办，但原话带条件，只能标待确认——压掉条件就是责任错配。\n· R05 是「不做」，也是决议；「不做」不写进纪要，下次会还会重提。\n· R04 讨论了六分钟但没结论，进待定而不进待办。\n· R06 不是「可以留着参考」，它没有数据来源，进纪要就会被当成结论。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的会议纪要助手。我会贴一段会议转写稿（可能有错字和口语）。请输出四块，不要写成摘要：\n一、结论（1–2 句）　二、决议（陈述句，定了什么/不做什么）　三、待办（表格：谁 | 做什么 | 什么时候 | 交付什么）　四、待定（卡在谁那 | 需要什么才能定）\n规则：① 只写转写稿里出现过的内容，没听清的写「未听清，待确认」；② 待办必须有人名和日期，转写稿没说就写「待确认」并单独列出；③ 不要写「经过讨论」「大家认为」这类过程描述；④ 全文不超过一页。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】转写稿进、四块纪要出（结论 / 决议 / 待办 / 待定）\n【参考案例】同一段转写稿，出「摘要」和出「四块纪要」在使用上差一个量级\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的会议纪要助手。我会贴一段会议转写稿（可能有错字和口语）。请输出四块，不要写成摘要：\n一、结论（1–2 句）　二、决议（陈述句，定了什么/不做什么）　三、待办（表格：谁 | 做什么 | 什么时候 | 交付什么）　四、待定（卡在谁那 | 需要什么才能定）\n规则：① 只写转写稿里出现过的内容，没听清的写「未听清，待确认」；② 待办必须有人名和日期，转写稿没说就写「待确认」并单独列出；③ 不要写「经过讨论」「大家认为」这类过程描述；④ 全文不超过一页。", "rubric": ["四块齐全且各司其职，没有把讨论过程塞进决议", "每条待办都有具体人名与日期，「相关同事」「尽快」一律改掉", "待定项单列，写清卡在谁那里、需要什么才能定", "没有编造会上没说的内容——没听清的地方标「未听清，待确认」"]}, {"id": "M5U3", "tier": "basic", "step": "todo", "title": "交一份能落地的会议纪要", "video": {"dur": "3.3min", "script": ["纪要发出去没人回，通常是因为里面没有他要做的事", "一页四块纪要模板", "同一次会两份纪要，一份被转发三次，一份没人回"]}, "ppt": {"method": "一页四块纪要模板", "case": "同一次会两份纪要，一份被转发三次，一份没人回", "demo": "纪要模板与填写示例"}, "objective": "能产出一份一页的四块纪要，待办全部到人到时且有交付物", "transfer": "把这份纪要发给主持人确认后，自己留一份，下次会前先翻一遍看上次的待办完成没有", "vslides": [{"t": "第一步：会前把模板填好一半", "n": "纪要做好不好，一半取决于会前。会前十分钟把议程贴进模板，把上次的待办原样粘到「开场核对」那一节，会上直接往里填。这样做有两个好处：一是你不用在会上边听边想结构；二是你能在会上顺手问一句「上次那三条做完了吗」，这一问会让所有人知道待办是真的会被查的。会中只记三类东西：定了什么、谁说了要做什么、什么没定。其他的讨论、插话、玩笑，一律不记。记这三类，你的笔记会非常短，短到散会后半小时就能出稿。很多人记纪要的痛苦，不是写不出来，是记了太多没用的，整理时得分拣。会前还有一个动作值得做：把这次会的目标写成一句话，如果写不出来，这个会本身就有问题。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 会前贴议程与上次待办\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 会前贴议程与上次待办</tspan></text></g><g data-k=\"② 会中只记三类\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 会中只记三类</tspan></text></g><g data-k=\"③ 散会后半小时出稿\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 散会后半小时出稿</tspan></text></g></svg>", "d": 63.1}, {"t": "第二步：把每条待办改成「四有」", "n": "待办这一块是全篇最值钱的地方，也是最容易糊的地方。「王磊跟进名单」这句话不合格，要改成「王磊 11/11 前产出华东三城复购 3 次以上客群名单，附口径说明」。四有：有人、有日期、有交付物、有口径。第三条交付物决定了这件事能不能被验收，第四条口径决定了别人拿到手能不能直接用。四有齐了，这条待办才算真正派出去。还有个技巧：待办编号。编了号之后，下次会开场可以直接说「第 2 条做完了，第 3 条延到 11/14」，不用再复述一遍内容。编号这件事成本极低，收益极高。四有里最容易被漏的是口径。「名单」这个词太宽，含哪些字段、什么时间范围、去不去重，都得说清。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"有人：写名字\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有人：写名字</tspan></text></g><g data-k=\"有日期：写具体日\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有日期：写具体日</tspan></text></g><g data-k=\"有交付物：能验收\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有交付物：能验收</tspan></text></g><g data-k=\"有口径：能直接用\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有口径：能直接用</tspan></text></g></svg>", "d": 67.27}, {"t": "第三步：当天发出，发前先给主持人确认", "n": "纪要的价值随时间衰减得极快。散会后两小时内发出，大家还记得上下文，有异议当场就能改；第二天发，很多人已经按自己的理解开工了，这时候改纪要等于让人返工。所以标准动作是：散会后半小时出稿，先发给主持人确认一句「这样记对吗」，确认后立刻发群。为什么要先给主持人？因为纪要是对会议的解释权，这个解释权在主持人手上，不在记录人手上。你觉得他说的意思是 A，他可能想的是 B，先对一遍，能避免后面所有扯皮。这一步只花三十秒，但它是「纪要有人认」和「纪要被质疑」的分界线。发群时正文只放四块，完整版放附件；正文太长没人看，太短又显得敷衍，四块刚好。一页纸的纪要被读完的概率，是五页纸的十倍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">发出节奏</tspan></text><g data-k=\"散会后 30 分钟出稿\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">散会后 30 分钟出稿</tspan></text></g><g data-k=\"先给主持人确认\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">先给主持人确认</tspan></text></g><g data-k=\"确认后立刻发群\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">确认后立刻发群</tspan></text></g></svg>", "d": 69.65}], "deliverable": {"type": "skill", "name": "会议纪要（一页）", "rubric": ["四块齐全", "待办可执行", "当天发出"], "acceptance": "一页四块：结论、决议、待办（到人到时到交付物）、待定（挂人挂条件）"}, "practice": {"steps": ["会前十分钟把议程和上次待办贴进模板，会上直接往里填", "会中只记三类：定了什么、谁说了要做什么、什么没定", "散会后半小时内出稿，超过两小时记忆就开始变形", "待办逐条改成「谁 + 做什么 + 什么时候 + 交付什么」，缺的标待确认", "发给主持人确认一句「这样记对吗」，确认后再发群"], "exemplar": "【华东复购试点 · 会议纪要】\n时间：2026-11-09 14:00–14:40　地点：3 号会议室　主持：李鹏　记录：小林\n参会：李鹏、张颖、王磊、赵敏、小林\n\n■ 一、结论\n本月重点从拉新转向复购，资源向华东三城倾斜；全国拉新预算不追加。\n\n■ 二、决议\n1. 定：11 月在华东三城做复购券试点，预算 3 万元，按「复购 3 次以上客户」定向发放。\n2. 定：全国拉新预算维持 10 月水平（18 万元），不再追加。\n3. 不做：暂不进入生鲜类目，12 月再议。\n4. 定：试点验收时间 12/05，只看两个指标——客单价、30 天二次购买率。\n\n■ 三、待办\n| # | 谁 | 做什么 | 什么时候 | 交付什么 |\n|---|---|---|---|---|\n| 1 | 张颖 | 出复购券方案（面额、门槛、发放与核销规则） | 11/10 | 一页方案 |\n| 2 | 王磊 | 拉华东三城复购 3 次以上客群名单 | 11/11 | 名单文件 + 口径说明 |\n| 3 | 李鹏 | 确认券成本计入哪个科目 | 11/12 | 财务口径一句话确认 |\n| 4 | 赵敏 | 确认券能否叠加平台活动 | 11/12 | 平台规则说明或对接人 |\n| 5 | 小林 | 汇总 1–4，出试点执行单并发群 | 11/13 | 执行单 |\n\n■ 四、待定\n1. 券的核销数据由谁出周报 —— 卡在数据组，需要会后确认对接人才能定。\n2. 生鲜类目是否 12 月启动 —— 卡在采购，需要供应商报价才能定。\n3. 试点失败后的止损动作 —— 会上未讨论，12/05 验收前需补一次讨论。\n\n■ 五、下次会议\n时间：11/16 14:00　议题：试点执行单确认 + 券方案过一遍\n需提前准备：张颖的券方案、王磊的名单口径说明\n\n■ 备注\n· 本纪要已于 11/09 17:20 经主持人李鹏确认后发群。\n· 会上未讨论「券是否会对拉新有挤出效应」，已记入待定第 3 条范围。"}, "task": "产出《会议纪要（一页）》：会前十分钟把议程和上次待办贴进模板，会上直接往里填；会中只记三类：定了什么、谁说了要做什么、什么没定；散会后半小时内出稿，超过两小时记忆就开始变形；待办逐条改成「谁 + 做什么 + 什么时候 + 交付什么」，缺的标待确认；发给主持人确认一句「这样记对吗」，确认后再发群", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M5 用 AI 开会、记纪要、跟任务」模块，你要交付的是《会议纪要（一页）》。\n【场景】业务侧这周的诉求是：纪要发出去没人回，通常是因为里面没有他要做的事。参考做法：同一次会两份纪要，一份被转发三次，一份没人回。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（一页四块纪要模板），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《会议纪要（一页）》填写模板】\n\n■ 1. 会前十分钟把议程和上次待办贴进模板，会上直接往里填\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 会中只记三类：定了什么、谁说了要做什么、什么没定\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 散会后半小时内出稿，超过两小时记忆就开始变形\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 待办逐条改成「谁 + 做什么 + 什么时候 + 交付什么」，缺的标待确认\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 发给主持人确认一句「这样记对吗」，确认后再发群\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【华东复购试点 · 会议纪要】\n时间：2026-11-09 14:00–14:40　地点：3 号会议室　主持：李鹏　记录：小林\n参会：李鹏、张颖、王磊、赵敏、小林\n\n■ 一、结论\n本月重点从拉新转向复购，资源向华东三城倾斜；全国拉新预算不追加。\n\n■ 二、决议\n1. 定：11 月在华东三城做复购券试点，预算 3 万元，按「复购 3 次以上客户」定向发放。\n2. 定：全国拉新预算维持 10 月水平（18 万元），不再追加。\n3. 不做：暂不进入生鲜类目，12 月再议。\n4. 定：试点验收时间 12/05，只看两个指标——客单价、30 天二次购买率。\n\n■ 三、待办\n| # | 谁 | 做什么 | 什么时候 | 交付什么 |\n|---|---|---|---|---|\n| 1 | 张颖 | 出复购券方案（面额、门槛、发放与核销规则） | 11/10 | 一页方案 |\n| 2 | 王磊 | 拉华东三城复购 3 次以上客群名单 | 11/11 | 名单文件 + 口径说明 |\n| 3 | 李鹏 | 确认券成本计入哪个科目 | 11/12 | 财务口径一句话确认 |\n| 4 | 赵敏 | 确认券能否叠加平台活动 | 11/12 | 平台规则说明或对接人 |\n| 5 | 小林 | 汇总 1–4，出试点执行单并发群 | 11/13 | 执行单 |\n\n■ 四、待定\n1. 券的核销数据由谁出周报 —— 卡在数据组，需要会后确认对接人才能定。\n2. 生鲜类目是否 12 月启动 —— 卡在采购，需要供应商报价才能定。\n3. 试点失败后的止损动作 —— 会上未讨论，12/05 验收前需补一次讨论。\n\n■ 五、下次会议\n时间：11/16 14:00　议题：试点执行单确认 + 券方案过一遍\n需提前准备：张颖的券方案、王磊的名单口径说明\n\n■ 备注\n· 本纪要已于 11/09 17:20 经主持人李鹏确认后发群。\n· 会上未讨论「券是否会对拉新有挤出效应」，已记入待定第 3 条范围。", "rubric": ["四块齐全，全文一页以内，删掉了不影响行动的内容", "每条待办都有名字、日期、交付物，没有「相关人员」「尽快」", "待定项写清卡在谁那里、需要什么才能定", "散会后当天发出，且发群前经过主持人确认"]}, {"id": "M5U4", "tier": "basic", "step": "spar", "title": "会后有人不认账怎么办", "video": {"dur": "3.3min", "script": ["争的不是谁记错了，是这件事现在归谁", "三步应对（复述原话 / 补上下文 / 落回现在定什么）", "「我没说过」与「您当时说的是 X，我记在第 3 条」的差别"]}, "ppt": {"method": "三步应对（复述原话 / 补上下文 / 落回现在定什么）", "case": "「我没说过」与「您当时说的是 X，我记在第 3 条」的差别", "demo": "陪练说明：他会否认自己认领的那条待办"}, "objective": "能在会上有人否认时，拿出当时的原话与上下文，把争议落回「那现在定什么」", "transfer": "把这次争议的原话和结论补进纪要的第二版，并在下次会开场时主动核对一遍", "vslides": [{"t": "陪练说明：他要否认，你要落回现在", "n": "这一关的场景很常见：纪要发出去，有人回一句「这条不是我做的」。新人第一反应是辩解，「你当时就是这么说的」。这一辩解基本必输，原因有两个：一是你手上只有纪要，没有录音；二是就算你赢了，那个人以后会防着你，你失去的比得到的多。正确的目标不是证明他对，而是让这条待办有个着落。所以三步：复述原话、补上下文、落回现在定什么。复述原话是为了让他想起来，不是为了让他在群里丢脸——所以措辞要中性，用「我记的是这样，您看是不是」，不用「你明明说了」。这一关真正的考点是情绪管理：你能不能不把它变成一场对错之争。这一关还有个隐藏考点：你能不能在群里一句话就把事情收住，而不是来回七八条消息。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三步应对</tspan></text><g data-k=\"复述原话\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">复述原话</tspan></text></g><g data-k=\"补上下文\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">补上下文</tspan></text></g><g data-k=\"现在怎么定\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">现在怎么定</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 66.43}, {"t": "第二步：找出你压缩过头的地方", "n": "多数「不认账」的争议，根子在记录人压缩过头。会上他说的是「名单这块我可以看一下，但要看数据组给不给权限」，你记成「王磊出名单」。你删掉了条件，也删掉了他的余地。所以他否认的不是这件事，是「无条件承担」这件事。这时候最好的答法是主动认下来：「是我压缩过头了，原话里带着条件。」这句话一出口，气氛立刻变，因为你把对立变成了共同纠错。而且这句话是真的——纪要要求简洁，简洁就必然丢信息，丢的如果是条件，就会变成责任错配。承认这一点不损伤你的专业性，反而证明你懂得纪要的边界在哪。压缩过头这件事，几乎每个记录人都犯过，它不是能力问题，是纪要要求简洁的必然代价。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"原话带条件 → 不能删条件\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">原话带条件 → 不能删条件</tspan></text></g><g data-k=\"删了条件 = 责任错配\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">删了条件 = 责任错配</tspan></text></g><g data-k=\"主动认压缩，气氛就变\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">主动认压缩，气氛就变</tspan></text></g></svg>", "d": 64.99}, {"t": "第三步：给两个方案，让他选", "n": "最后一步是把争议变成一个选择题。不要问「那你说怎么办」，那是把球踢回去，他会更烦。给两个具体方案：「一是您先去问数据组权限，11/11 前给我能不能出；二是我把这条挂到数据组，您只做口径确认。」两个方案都合理，都有时间，他选哪个都行。给方案的好处是把「要不要做」变成「怎么做」，前者是立场之争，后者是执行讨论。最后一定要说修订版什么时候发：「我按您说的改，今天下班前发第二版。」有时间点，这件事就闭环了；没有时间点，它会一直悬着。记住：你要的是一条能落地的待办，不是一次辩论的胜利。最后那句「今天下班前发第二版」很重要，它给了对方明确的预期，也给了自己一个截止时间。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">当天闭环</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">一直悬着</tspan></text><g data-k=\"给两个方案让他选\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">给两个方案让他选</tspan></text></g><g data-k=\"问「那你说怎么办」\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">问「那你说怎么办」</tspan></text></g></svg>", "d": 66.19}], "deliverable": {"type": "skill", "name": "会议纪要（修订版）", "rubric": ["复述原话", "承认压缩", "给方案"], "acceptance": "四问都答得出：原话是什么、上下文条件是什么、承认自己压缩过头、给出两个可选的修订方案"}, "spar": {"role": "与会同事", "persona": "不记得自己说过什么，第一反应是「我没答应」；会反问「你记的是我说的吗」", "mustAsk": ["这条不是我做的，我当时没答应", "你记的是我原话吗？我怎么说的？", "就算我说了，那也是要看数据组给不给权限", "现在这条你打算怎么改？"]}, "exemplar": "（同事说：这条不是我做的，我当时没答应）\n\n结论：这条我先按「待确认」处理，不写死是谁的责任。\n依据：会上原话是「名单这块我可以看一下，但要看数据组给不给权限」，我记的时候写成了「王磊出名单」，是我压缩过头了——原话里带着条件。\n边界：所以现在有两个选择：一是您先去问数据组权限，11/11 前给我能不能出；二是我把这条挂到数据组，您这边只做口径确认。您看哪个合适？我按您说的改纪要，今天下班前发第二版。", "task": "把《会议纪要（修订版）》拿到「与会同事」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《会议纪要（修订版）》。现在要让它通过「与会同事」这一关。\n【对手的立场】不记得自己说过什么，第一反应是「我没答应」；会反问「你记的是我说的吗」。\n【他一定会追问】「这条不是我做的，我当时没答应」 / 「你记的是我原话吗？我怎么说的？」 / 「就算我说了，那也是要看数据组给不给权限」\n【场景】你说「会后有人不认账怎么办」，对方立刻回一句：这条不是我做的，我当时没答应 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能复述对方原话，而不是坚持「你就是这么说的」", "能指出原话里的条件（「要看数据组给不给权限」），说明自己压缩过头", "不纠缠谁记错，直接把问题落到「现在这条怎么定」", "给出两个可选方案让对方选，并承诺修订版的时间"]}, {"id": "M5U5", "tier": "adv", "step": "understand", "title": "把纪要变成能跟踪的任务", "video": {"dur": "3.4min", "script": ["待办发出去只是开始，跟踪才是让它完成的那一半", "任务四态（未开始 / 进行中 / 卡住 / 已完成）+ 固定节奏", "同一批待办，有状态跟踪的两周清零，没跟踪的三周还在「进行中」"]}, "ppt": {"method": "任务四态（未开始 / 进行中 / 卡住 / 已完成）+ 固定节奏", "case": "同一批待办，有状态跟踪的两周清零，没跟踪的三周还在「进行中」", "demo": "任务表四态卡：拿 6 条待办各判一态"}, "objective": "能把纪要里的待办转成带状态、跟进人、卡点的任务，并定出固定的跟进节奏", "transfer": "把手上所有待办按四态重判一遍，把连续两周没动的全部改成「卡住」并写升级动作", "vslides": [{"t": "待办和任务的区别：有没有状态", "n": "待办是纪要里的一行字，任务是带状态的东西。一行字发出去，你不知道它现在怎么样了；带状态的任务，你一眼能看出哪条要催、哪条要帮。状态只要四个：未开始、进行中、卡住、已完成。四态里最重要的是「卡住」，因为它是唯一能让你采取行动的——卡住说明有人或有事挡住了，你要么去解，要么去换路径。很多人的任务表只有「进行中」和「已完成」两态，结果所有没做的都在「进行中」，看起来都在推进，实际上一条都没动。把「卡住」单独拎出来，你的任务表才真正有信息量：它告诉你今天该找谁。这一栏还有个用法：每周过表时把「卡住」的全部挑出来看一遍，你会发现很多卡点其实是同一个原因。挑出来之后你会发现，真正要解的往往只有两三个。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">任务四态</tspan></text><g data-k=\"未开始\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">未开始</tspan></text></g><g data-k=\"进行中\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">进行中</tspan></text></g><g data-k=\"卡住\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">卡住</tspan></text></g><g data-k=\"已完成\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">已完成</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 74.16}, {"t": "卡点要写到「找谁能解」", "n": "「卡住」这一栏不能只写「等对方回复」，要写到「找谁能解」。「等数据组回复」不够，要写「等数据组王工给名单口径，11/12 未回则找其主管」。前半句是现状，后半句是动作。只有现状没有动作，这条任务会一直卡着，因为它没有下一步。还有一个技巧：给卡住设一个「触发时间」。比如「11/12 还没回就升级」，这个时间点让你不需要每天惦记它，到点自然会想起来。任务跟踪最耗神的不是做事，是记着哪些事还没做。把触发时间写下来，这件事就交给了日历，不用再占脑子。很多人任务表越做越乱，就是因为把「记着」这件事交给了脑子。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"等谁：写具体人\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">等谁：写具体人</tspan></text></g><g data-k=\"等什么：写具体物\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">等什么：写具体物</tspan></text></g><g data-k=\"到点没回：写升级动作\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">到点没回：写升级动作</tspan></text></g></svg>", "d": 57.24}, {"t": "节奏比工具重要", "n": "很多人以为跟踪要靠工具，其实靠节奏。固定一个节奏：每周一上午花二十分钟，把上周所有任务过一遍，改状态、写卡点、定这周的三个重点。就这一件事，坚持一个月，你会发现漏的事少了一大半。节奏的关键是「固定」——固定在周几、固定时长、固定动作。不固定的话，你会想起来才跟，而想起来的时候通常是出事的时候。还有一个配套动作：每周一过完，把「卡住」的那几条单独发给相关人，只发这几条，不发全文。发全文没人看，发三条他会回。跟进这件事，量少才有效。节奏定下来之后用什么工具都不重要，一个表格、一个待办应用都行，关键是那二十分钟真的坐下来过一遍。把二十分钟写进日历，这件事就从「该做」变成了「会做」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"固定周几与时长\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">固定周几与时长</tspan></text></g><g data-k=\"只跟卡住的那几条\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只跟卡住的那几条</tspan></text></g><g data-k=\"每周定三个重点\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每周定三个重点</tspan></text></g></svg>", "d": 71.57}], "deliverable": {"type": "skill", "name": "任务跟踪表", "rubric": ["状态清楚", "卡点具体", "节奏固定"], "acceptance": "能把 6 条待办各判一态并写清卡点，且能说出自己打算用哪种固定节奏跟"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】任务四态（未开始 / 进行中 / 卡住 / 已完成）+ 固定节奏\n【为什么重要】待办发出去只是开始，跟踪才是让它完成的那一半\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["每条任务都判了四态之一，没有「进行中」挂两周不动的情况", "卡住的条目写清了卡在谁那里、需要什么才能解开", "定了一个固定节奏（周几、用什么形式、跟谁），不是「随时跟进」", "能说出哪类任务最容易长期卡在「进行中」，以及怎么识别"]}, {"id": "M5U6", "tier": "adv", "step": "demo", "title": "用 AI 把纪要转成任务表", "video": {"dur": "3.1min", "script": ["不是每条待办都能直接变成任务，缺条件的要先退回", "待办转任务（补状态 / 补卡点 / 补触发时间）", "六条待办转完只剩四条能执行，另外两条得退回重定"]}, "ppt": {"method": "待办转任务（补状态 / 补卡点 / 补触发时间）", "case": "六条待办转完只剩四条能执行，另外两条得退回重定", "demo": "WorkBuddy 内跑一遍转换，对照 AI 原稿与人改稿"}, "objective": "能把纪要里的待办批量转成任务表，补齐状态、卡点与触发时间，并识别哪些还不能当任务", "transfer": "拿手上最近一份纪要的待办，全部转成四态任务表，把「还不能当任务」的挑出来退回", "vslides": [{"t": "演示准备：先分「能转」和「不能转」", "n": "这次手上是七条会议待办，任务是把它们转成能跟踪的任务表。关键动作不是转，是分：哪几条具备条件，哪几条还不具备。具备的条件有三个：有人、有时间、有交付物。三条齐了，转成任务，补上状态和卡点就行；缺任何一条，退回去，写清缺什么。为什么必须退？因为一条缺条件的待办转成任务后，它会长期挂在「进行中」，每天都出现在你的清单上，每次你都想不起来该做什么，最后你开始忽略清单——这才是任务跟踪失败的真实原因，不是工具不好用。宁可清单短一点，也不要它掺假。退回时要给出补法，比如「跟进试点效果」补成「12/05 出复盘，看客单价与二次购买率」，这样下一版就能转。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">能不能转的三条件</tspan></text><g data-k=\"有人\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">有人</tspan></text></g><g data-k=\"有时间\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">有时间</tspan></text></g><g data-k=\"有交付物\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">有交付物</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 63.74}, {"t": "跑一遍：为什么要它「到点怎么办」", "n": "提示词里我要求卡点写成「等谁 · 等什么 · 到点怎么办」三段。第三段最容易被省，也最有用。省掉它，这条任务会一直卡着，因为卡住之后没有任何下一步——你只是在等，而对方并不知道你在等。写了「11/12 未回则找其主管」，情况就不同了：到点你没收到回复，动作是明确的，不需要再决策。还有一条约束是「不要新增清单里没有的任务」。模型很喜欢做好人，会顺手补一条「同步给市场部」「顺便优化一下流程」，听着都对，但它把责任扩散了——多出来的任务没人认领，最后成了你的锅。所以要它老实，先要约束得住。还有一点：模型会把「等回复」判成「进行中」，其实那就是卡住，因为你在等别人而不是在推。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：7 条会议待办\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：7 条会议待办</tspan></text></g><g data-k=\"约束：缺条件退回 / 卡点到人 / 触发时间写日期 / 不新增\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：缺条件退回 / 卡点到人 / 触发时间写日期 / 不新增</tspan></text></g><g data-k=\"产出：5 条任务 + 2 条退回\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：5 条任务 + 2 条退回</tspan></text></g></svg>", "d": 62.11}, {"t": "人工收口：退回也是一种交付", "n": "跑完你要接受一件事：退回两条不是没完成，是完成了判断。很多新人不敢退回，觉得退回等于告诉别人「这会没开好」。其实恰恰相反——你把「跟进试点效果」这种空话退回去，换来的是「12/05 出复盘，看两个数」，下一次会就会开得更好。退的时候要带补法，不要只说「这条不行」，要说「补成什么样就可行」。带补法的退回是帮忙，不带补法的退回是挑刺。最后一步：把任务表按触发时间排一遍，看最近一周有几条要动。如果超过五条，说明你在同一周压了太多事，该往后挪一挪。最后按触发时间给任务表排个序，你就知道这周真正要动的是哪几条，其余的不必天天看。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"退回要带补法\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">退回要带补法</tspan></text></g><g data-k=\"任务表按触发时间排\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">任务表按触发时间排</tspan></text></g><g data-k=\"一周内不超五条\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">一周内不超五条</tspan></text></g></svg>", "d": 61.03}], "deliverable": {"type": "skill", "name": "任务表 + 退回清单", "rubric": ["四态齐全", "卡点可解", "敢退回"], "acceptance": "六条待办都转了或退回了、任务表带四态与触发时间、退回的写清缺什么"}, "demo": {"ref": "■ 一、任务表\n| 任务 | 谁 | 状态 | 卡点（等谁·等什么·到点怎么办） | 触发时间 |\n|---|---|---|---|---|\n| 出复购券方案 | 张颖 | 进行中 | 无 | 11/10 |\n| 拉复购客群名单 | 王磊 | 卡住 | 等数据组王工给名单权限；11/12 未回则找其主管 | 11/12 |\n| 确认券成本科目 | 李鹏 | 未开始 | 无 | 11/12 |\n| 汇总出执行单 | 我 | 未开始 | 等前三条完成 | 11/13 |\n| 确认券能否叠加活动 | 赵敏 | 卡住 | 等平台运营给规则说明；联系人未定，11/11 前先要联系人 | 11/11 |\n\n■ 二、退回清单\n| 条目 | 缺什么 | 建议怎么补 |\n|---|---|---|\n| 「跟进试点效果」 | 缺时间、缺交付物、缺验收指标 | 补成「12/05 出试点复盘，含客单价与 30 天二次购买率两个数」 |\n| 「和采购聊聊生鲜」 | 缺人、缺时间、会上只是待定不是决议 | 退回成待定项，等采购给报价后再定 |\n\n■ 说明\n· 共 7 条：5 条转成任务，2 条退回。退回不是否决，是条件不够，补上就能转。\n· 所有触发时间均为具体日期。", "fix": ["把「跟进试点效果」退回，而不是硬塞进任务表——它没有时间也没有验收指标，塞进去只会变成一条永远「进行中」的假任务。", "给「拉名单」那条补了触发时间与升级动作：11/12 未回则找其主管，否则它会在「卡住」状态待一个月。", "把 AI 写的「卡点：等数据组回复」改成「等数据组王工给名单权限」——不写到人，你连催谁都不知道。", "删掉 AI 自己新增的「同步给市场部」——清单里没有这条，凭空加任务会让责任扩散，最后谁都不认。"], "judge": "判断依据：缺条件的条目是否被退回；卡点是否写到人；触发时间是否具体；有没有凭空新增任务", "sheet": {"situ": "纪要发出去了，现在要把里面的 6 条待办转成能跟踪的任务表。但不是每条都具备条件，你要判断哪几条能转、哪几条得退回，以及缺什么。", "ask": "① 逐条判定：能不能转成任务、缺什么条件、该给什么状态与触发时间；② 让模型出「任务表 + 退回清单」；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请基于以上判定出「任务表 + 退回清单」，严格按两块输出：\n一、任务表：任务 | 谁 | 状态 | 卡点（等谁·等什么·到点怎么办）| 触发时间\n二、退回清单：条目 | 缺什么 | 建议怎么补\n规则：① 缺人、缺时间、缺交付物的一律退回，不要自己补；② 触发时间写具体日期；③ 卡点写到「找谁能解」；④ 不新增清单里没有的任务。", "mats": [{"id": "T01", "src": "纪要待办第 1 条", "text": "张颖：出复购券方案，11/10 前一页方案。\n人、时间、交付物都齐。"}, {"id": "T02", "src": "纪要待办第 2 条", "text": "王磊：拉复购客群名单，11/11；但名单权限还要数据组给。\n有一条外部依赖没解决。"}, {"id": "T03", "src": "纪要待办第 3 条", "text": "跟进试点效果。\n没有写谁、没有时间、没有验收指标。"}, {"id": "T04", "src": "纪要待办第 4 条", "text": "李鹏：11/12 前确认券的成本计入哪个科目，给一句话确认。\n条件齐，但离截止还有三天。"}, {"id": "T05", "src": "纪要待办第 5 条", "text": "和采购聊聊生鲜类目。\n会上这条是待定，不是决议，也没定谁去聊。"}, {"id": "T06", "src": "纪要待办第 6 条", "text": "赵敏：确认券能否叠加平台活动，11/12 前给规则说明。\n但平台对接人还没定。"}], "cols": [{"k": "ok", "name": "能不能转成任务", "hint": "三条齐才转：有人、有时间、有交付物", "type": "chips", "w": 2, "tags": ["能转", "退回"]}, {"k": "st", "name": "该给什么状态", "hint": "未开始 / 进行中 / 卡住 / 不适用", "type": "chips", "w": 2, "tags": ["未开始", "进行中", "卡住", "不适用"]}, {"k": "miss", "name": "缺什么 / 卡在哪", "hint": "缺人、缺时间、缺交付物，或等某个人", "type": "chips", "w": 3, "tags": ["不缺", "缺交付物与验收指标", "缺人，且只是待定不是决议", "等数据组给权限", "等平台对接人确定"]}, {"k": "act", "name": "你该怎么处理", "hint": "直接转、补卡点、还是退回重定", "type": "chips", "w": 2, "tags": ["直接转，触发时间 11/10", "转成卡住，写升级动作", "退回，要求补成「12/05 出复盘」", "退回成待定项", "转成卡住，先要对接人"]}], "key": {"T01": {"ok": "能转", "st": "进行中", "miss": "不缺", "act": "直接转，触发时间 11/10"}, "T02": {"ok": "能转", "st": "卡住", "miss": "等数据组给权限", "act": "转成卡住，写升级动作"}, "T03": {"ok": "退回", "st": "不适用", "miss": "缺交付物与验收指标", "act": "退回，要求补成「12/05 出复盘」"}, "T04": {"ok": "能转", "st": "未开始", "miss": "不缺", "act": "直接转，触发时间 11/10"}, "T05": {"ok": "退回", "st": "不适用", "miss": "缺人，且只是待定不是决议", "act": "退回成待定项"}, "T06": {"ok": "能转", "st": "卡住", "miss": "等平台对接人确定", "act": "转成卡住，先要对接人"}}, "notes": {"T03·ok": "没有验收指标的任务会永远挂在「进行中」，看起来在推，实际没动", "T05·ok": "会上是待定不是决议，也没有人认领，硬转成任务等于凭空派活", "T02·st": "外部依赖没解决就是卡住，不是进行中——判成进行中会让你以为它在推进", "T04·act": "触发时间写 11/10 而不是 11/12：留两天缓冲，到点没动还来得及催"}, "delta": [{"op": "改", "frm": "模型把「跟进试点效果」转成了任务，状态「进行中」", "to": "退回，要求补成「12/05 出试点复盘，含客单价与 30 天二次购买率」", "why": "缺验收指标的任务转进去只会变成假任务，占着清单却永远推不动", "kw": ["退回", "验收指标", "复盘", "假任务"]}, {"op": "改", "frm": "模型把「拉名单」判成「进行中」", "to": "改成「卡住」，并写升级动作：「11/12 未回则找数据组主管」", "why": "在等别人不是在进行，判错状态会让你以为它在推进，实际一周没动", "kw": ["卡住", "进行中", "升级", "等权限"]}, {"op": "删", "frm": "模型自己新增了一条「同步试点进展给市场部」", "to": "整条删除", "why": "清单里没有这条，凭空加任务会把责任扩散，最后谁都不认", "kw": ["新增", "责任扩散", "删"]}, {"op": "补", "frm": "模型给「和采购聊生鲜」转了任务，但没写谁去", "to": "退回成待定项，写清「等采购给报价后再定」", "why": "会上只是待定，没人认领；转成任务等于替别人派活", "kw": ["待定", "没人认领", "退回", "采购"]}], "refsheet": "T01｜能转｜进行中｜不缺｜直接转，触发时间 11/10\nT02｜能转｜卡住｜等数据组给权限｜转成卡住，写升级动作\nT03｜退回｜不适用｜缺交付物与验收指标｜退回，要求补成「12/05 出复盘」\nT04｜能转｜未开始｜不缺｜直接转，触发时间 11/10\nT05｜退回｜不适用｜缺人，且只是待定不是决议｜退回成待定项\nT06｜能转｜卡住｜等平台对接人确定｜转成卡住，先要对接人\n\n四条最容易判错的：\n· T02 和 T06 条件看着齐，但都有外部依赖，状态是「卡住」不是「进行中」。\n· T03 和 T05 都要退回，理由不同：一个缺验收指标，一个只是待定没人认领。\n· T04 的触发时间提前两天，不是抄截止日期——留缓冲才有催的余地。\n· 退回不是否决：带上补法，下一条就能转成任务。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的任务整理助手。我会贴一段会议的待办清单。请做两件事：\n一、任务表：任务 | 谁 | 状态（未开始/进行中/卡住/已完成）| 卡点（等谁·等什么·到点怎么办）| 触发时间\n二、退回清单：还不能当任务的条目 | 缺什么 | 建议怎么补\n规则：① 缺人、缺时间、缺交付物的，一律退回，不要自己补；② 触发时间必须写具体日期；③ 卡点要写到「找谁能解」，不能只写「等回复」；④ 不要新增清单里没有的任务。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】待办转任务（补状态 / 补卡点 / 补触发时间）\n【参考案例】六条待办转完只剩四条能执行，另外两条得退回重定\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的任务整理助手。我会贴一段会议的待办清单。请做两件事：\n一、任务表：任务 | 谁 | 状态（未开始/进行中/卡住/已完成）| 卡点（等谁·等什么·到点怎么办）| 触发时间\n二、退回清单：还不能当任务的条目 | 缺什么 | 建议怎么补\n规则：① 缺人、缺时间、缺交付物的，一律退回，不要自己补；② 触发时间必须写具体日期；③ 卡点要写到「找谁能解」，不能只写「等回复」；④ 不要新增清单里没有的任务。", "rubric": ["每条待办要么转成任务（带状态、卡点、触发时间），要么明确退回", "退回的条目写清缺什么条件（没人、没时间、没交付物）", "没有把缺条件的待办硬塞进任务表凑数", "触发时间都是具体日期，不是「下周」「尽快」"]}, {"id": "M5U7", "tier": "adv", "step": "todo", "title": "建立你的周跟进节奏", "video": {"dur": "3.4min", "script": ["跟踪不靠记性，靠一个固定到不需要决定的时间点", "周跟进三步（过表 / 发卡点 / 定重点）", "同一个人，加了周一 20 分钟过表后，漏事从每周三件降到零"]}, "ppt": {"method": "周跟进三步（过表 / 发卡点 / 定重点）", "case": "同一个人，加了周一 20 分钟过表后，漏事从每周三件降到零", "demo": "周跟进节奏表与执行记录"}, "objective": "能建起一套每周固定运行的跟进节奏，含过表、发卡点、定重点三个动作", "transfer": "从下周一开始执行这个节奏，连做四周，第四周回头看漏了几件事", "vslides": [{"t": "第一步：把时间钉死，别靠打算", "n": "所有「我打算每周跟一次」最后都会变成「想起来才跟」。原因不是懒，是这件事需要每次做决定：现在跟吗？跟哪些？想一遍就累了，累了就往后拖。解决办法是把它变成一个不需要决定的事：固定周几、固定时间、固定时长，写进日历设提醒。到了就做，跟刷牙一样。时长也很关键，20 分钟。定成一小时你会有心理负担，一到周一就想着「还有那件麻烦事」，于是拖着不做；定成 20 分钟，你会觉得「就二十分钟，做完算了」。还有一条纪律：这 20 分钟不接活、不开会、不看群。一被打断，这个节奏就废了。还有一个反常识的点：节奏越简单越能坚持。三个动作已经够，再加自评、加打分、加周报，两周就断了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 固定周几与时间\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 固定周几与时间</tspan></text></g><g data-k=\"② 20 分钟，不长\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 20 分钟，不长</tspan></text></g><g data-k=\"③ 不被任何事打断\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 不被任何事打断</tspan></text></g></svg>", "d": 68.16}, {"t": "第二步：只发两三条卡点，别群发全文", "n": "跟进最容易犯的错是「把所有任务群发一遍，请大家更新进度」。这一招几乎永远无效，因为每个人都要从一堆不属于自己的条目里找出自己那几条，成本太高，索性不回。正确做法是只挑 2–3 条卡住的，单独发给对应的人，一条一句话，带具体问题和具体日期：「王工，名单权限那条我 11/12 要用，现在能确认吗？」这句话有对象、有事、有时间，对方回一个字就能推进。量少才有效，这是跟进的第一原则。如果三条里有两条没回，下一周把它们升级——找其主管或者换个路径，而不是再发一遍。发卡点的时候不要带情绪，也不要说「已经催过很多次了」，只描述事实和需要，对方才愿意回。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"只发 2–3 条\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只发 2–3 条</tspan></text></g><g data-k=\"单独发不群发\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">单独发不群发</tspan></text></g><g data-k=\"带具体日期\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">带具体日期</tspan></text></g><g data-k=\"没回就升级不重发\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">没回就升级不重发</tspan></text></g></svg>", "d": 66.86}, {"t": "第三步：每周只定三个重点", "n": "过表之后任务可能有十几条，如果你打算全部推进，结果是一条都推不动。所以第三步是选三个：从本周要动的里面挑三条，写在便签上贴屏幕边，其余明确排后面。「明确排后面」这个动作很重要，它不是放弃，是给自己一个交代——不然那些没动的任务会一直在你脑子里占位置，消耗注意力。最后留一行给「漏了什么」：这周漏了哪件事、为什么漏。写四周你就会发现自己的漏事模式，有人是漏临时任务，有人是漏等别人反馈的，有人是漏自己答应过的。找到模式，改一个动作就能补上。四周之后回头看那份「漏了什么」的记录，你会发现漏的事有固定模式，改一个动作就能补上。节奏的价值不在聪明，在它重复得够久。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">周一 20 分钟四步</tspan></text><g data-k=\"过表：改状态、写卡点\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">过表：改状态、写卡
