\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 这东西是谁的</tspan></text></g><g data-k=\"③ 能否识别到具体人\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 能否识别到具体人</tspan></text></g></svg>", "d": 67.61}, {"t": "分不清的时候：停、问、换", "n": "一定会有分不清的时候，这时候的标准动作是三步：停、问、换。停，指先别贴进去，也别先做一版再说；问，指找对人问——不是问同事「这个能用吗」，而是问这条数据的负责人或者带你的导师，问的时候带上具体字段，不要笼统问「咱们数据能不能给 AI 用」；换，指多数情况下你有替代路径：删掉几个字段、换成公开来源、用公司已采购的内部工具、或者只贴结构不贴数据。三步里最容易被跳过的是「换」，因为它要动脑子；但它是唯一能让你继续推进的办法。只会说「这个不能用」的人，最后会被绕过去；能给出替代路径的人，才会被信任。三步做完，你既没有越过权限，也没有卡住工作，这才是既安全又有效的做法。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"停：先别贴\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">停：先别贴</tspan></text></g><g data-k=\"问：问对的人，带具体字段\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">问：问对的人，带具体字段</tspan></text></g><g data-k=\"换：找替代路径\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">换：找替代路径</tspan></text></g></svg>", "d": 64.73}], "deliverable": {"type": "skill", "name": "材料分级单", "rubric": ["标级准确", "知道问谁", "给得出替代"], "acceptance": "能对六类材料各标一级，并为敏感与禁出两级说出该问谁、替代做法是什么"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】数据四级（公开 / 内部 / 敏感 / 禁出）\n【为什么重要】分级不是为了让你判合规，是为了让你知道这一条该问谁\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["四级各有至少两条自己岗位的真实材料例子", "敏感与禁出两级都写了「该问谁」，不是「按公司规定」", "能为至少两条禁出材料给出替代做法（换字段、换公开来源、换内部工具）", "明确写出「分不清级别时先停下来问」这一条动作"]}, {"id": "M7U2", "tier": "basic", "step": "demo", "title": "脱敏三步：删除、替换、最小化", "video": {"dur": "3.5min", "script": ["脱敏不是打码，是让数据还能用但认不出人", "脱敏三步（删除标识 / 替换为区间或代号 / 最小化到只留必需字段）", "同一张表，删三列、换两列、只留五列后，AI 依然能给出同样有用的结论"]}, "ppt": {"method": "脱敏三步（删除标识 / 替换为区间或代号 / 最小化到只留必需字段）", "case": "同一张表，删三列、换两列、只留五列后，AI 依然能给出同样有用的结论", "demo": "WorkBuddy 内跑一遍三步脱敏，对照 AI 原稿与人改稿"}, "objective": "能用「删除 / 替换 / 最小化」三步把一份敏感材料处理到可交给外部工具", "transfer": "拿手上最常用的一份表，按三步处理出一份可外发的版本，并留一份对照记录", "vslides": [{"t": "演示准备：脱敏的目标是「认不出人，但还能用」", "n": "很多人对脱敏的理解是「打码」，把手机号变成一串星号，把姓名变成某某。这确实认不出人了，但数据也不能用了——星号之后的号码没法按号段分析，某某在分组时全归成一类。真正的脱敏要同时满足两个条件：认不出具体人，但数据还能分组、能比较、能算趋势。做法是三步：删除、替换、最小化。删除针对那些没有分析价值、只有识别价值的列，比如姓名、身份证；替换针对那些有分析价值但带识别信息的列，比如手机号换成号段、地址降到区、订单号换成流水号；最小化是针对整张表——只留这次分析真正需要的列，其余不交。三步做完，你会发现交付的表小了一半，但该有的结论一个不少。还有一条容易忽略的：脱敏之后自己再扫一遍，看能不能用剩下的字段拼出一个人。地区、日期加金额，往往就够了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">脱敏三步</tspan></text><g data-k=\"删除\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">删除</tspan></text></g><g data-k=\"替换\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">替换</tspan></text></g><g data-k=\"最小化\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">最小化</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 77.98}, {"t": "跑一遍：为什么禁止随机打码", "n": "提示词里我写「替换必须保持数据可用，不要随机打码」。这一条是整段的核心。随机打码看着安全，实际把数据废了：打码后的手机号不能按号段分层，打码后的订单号不能排序，打码后的金额如果连量级都没了，趋势分析就无从谈起。替换的正确做法是「保留结构，去掉标识」：手机号留前三位（号段）和后两位，地址降到「城市 + 区」，订单号换成流水号，极端金额改成区间。这样每一列都还能用，但拼不出一个人。还有一条约束是「不许保留完整手机号」，这条没有例外——只要有一个完整号码在表里，整张表就等于没脱敏。所以替换的目标是「保留结构、去掉标识」：换完之后应该还能按城市分组、按月份看趋势，但指不出任何一个具体的人。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：一张含 8 列的订单表\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一张含 8 列的订单表</tspan></text></g><g data-k=\"约束：不清空可用性 / 不留完整号码 / 每列必给结论\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：不清空可用性 / 不留完整号码 / 每列必给结论</tspan></text></g><g data-k=\"产出：脱敏表 + 对照记录\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：脱敏表 + 对照记录</tspan></text></g></svg>", "d": 72.98}, {"t": "人工收口：留一份对照记录", "n": "跑完最后一步是留记录：删了哪几列、换了什么规则、什么时候做的、给谁用。这份记录有三个用处。第一，别人问「你的数和我不一样」，你能翻出来解释。第二，下次做同类分析，你能直接复用规则，不用重新想一遍。第三，万一以后需要回查，你知道去哪找原表。没有记录的人，每次都得从头做一遍脱敏，而且每次规则还不一样，最后自己都不知道哪版是对的。记录不用长，一张表三列就够：列名、处理方式、规则。写它只要五分钟，省的是以后每次五分钟。记录还有一个作用：它让你知道这张表能不能给别人用——记录写不全，说明你自己都没搞清楚动了什么。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"删了哪几列\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">删了哪几列</tspan></text></g><g data-k=\"换了什么规则\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">换了什么规则</tspan></text></g><g data-k=\"什么时候给谁用\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">什么时候给谁用</tspan></text></g></svg>", "d": 58.39}], "deliverable": {"type": "skill", "name": "脱敏后的材料 + 对照记录", "rubric": ["标识清干净", "数据还能用", "有对照记录"], "acceptance": "标识类字段全部删除或替换、只保留分析必需字段、有一份可查的对照记录"}, "demo": {"ref": "■ 一、标识列清单\n| 列名 | 是否可直接识别到人 | 理由 |\n|---|---|---|\n| 客户姓名 | 是 | 全名 + 地区可定位到具体人 |\n| 手机号 | 是 | 完整 11 位可直接联系 |\n| 身份证号 | 是 | 唯一标识 |\n| 详细地址 | 是 | 门牌级可定位 |\n| 订单号 | 是（间接） | 可反查下单人 |\n| 团长编号 | 否（内部代号） | 但需确认是否可对外映射 |\n\n■ 二、脱敏方案\n| 列名 | 处理 | 规则 |\n|---|---|---|\n| 客户姓名 | 删除 | 整列删除 |\n| 手机号 | 替换 | 只留前 3 位 + 后 2 位，如 138****89；不保留完整号 |\n| 身份证号 | 删除 | 整列删除 |\n| 详细地址 | 替换 | 降级到「城市 + 区」，去掉门牌 |\n| 订单号 | 替换 | 换成流水号 O0001、O0002…，原号另存不进此表 |\n| 团长编号 | 保留 | 内部代号，不含个人信息 |\n| 金额 | 替换 | 保留数值，但把 98 万那一单改为「≥10 万」区间 |\n\n■ 三、最小化建议\n分析目的为「区域销量趋势」，以下列不需要：客户姓名、身份证号、详细地址、支付方式。\n保留：城市、区、下单日期（只到日）、金额、商品类目、团长编号。\n\n■ 说明\n· 替换后仍可做分组与趋势比较，数据可用性未受影响。\n· 本表不含任何完整手机号、身份证号、门牌地址。\n· 删除与替换规则已记入《脱敏对照记录 v1》。", "fix": ["把「手机号打码成 ****」改成「保留前 3 位后 2 位」——全打码之后按地区分层就没法用手机号段校验了。", "删掉了「订单号」这一列而不是打码：订单号可反查下单人，属于可识别信息，留着就是风险。", "把 98 万那一单改成「≥10 万」区间，而不是原值保留——单笔极端值配合地区和日期，很容易被反推到具体客户。", "补了《脱敏对照记录》：AI 原来只管删，没留记录，两周后没人知道这张表和原表差在哪。"], "judge": "判断依据：标识列是否清干净；替换是否保持可用；是否做了字段最小化；有没有对照记录", "sheet": {"situ": "你手上有一张 8 列的订单表要交给外部工具做趋势分析。这张表里有姓名、手机号、身份证、详细地址等信息。你要逐列判断：删还是换、换成什么、保留什么。", "ask": "① 逐列判定：该删还是该换、换成什么规则、为什么；② 让模型出「标识列清单 + 脱敏方案 + 最小化建议」；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请基于以上判定出三样：标识列清单、脱敏方案（逐列写删/换/保留与规则）、最小化建议（为「区域销量趋势」这个目的哪些列不需要）。\n规则：① 替换必须保持数据可用，不要随机打码；② 不保留任何完整手机号、身份证、门牌地址；③ 每列都要给结论，不许留空。", "mats": [{"id": "C01", "src": "表结构 · 第 1 列", "text": "客户姓名：全名，如「张某某」。\n有地区配合可定位到具体人。"}, {"id": "C02", "src": "表结构 · 第 2 列", "text": "手机号：完整 11 位，如 138xxxxxx89。\n能直接联系到人。"}, {"id": "C03", "src": "表结构 · 第 3 列", "text": "身份证号：18 位完整号码。\n唯一标识，最敏感的一类。"}, {"id": "C04", "src": "表结构 · 第 4 列", "text": "详细地址：到门牌号，如「某路 88 号 3 单元 502」。\n门牌级可定位。"}, {"id": "C05", "src": "表结构 · 第 5 列", "text": "订单号：如 SO20261015001。\n本身不含个人信息，但可反查下单人。"}, {"id": "C06", "src": "表结构 · 第 7 列", "text": "金额：其中一行 980,000 元，其余均 ≤200 元。\n单笔极端值配合地区与日期容易被反推。"}], "cols": [{"k": "lv", "name": "属于哪一类", "hint": "可直接识别 / 可间接识别 / 非标识", "type": "chips", "w": 2, "tags": ["可直接识别", "可间接识别", "非标识但需处理"]}, {"k": "act", "name": "删还是换", "hint": "删 / 换 / 保留", "type": "chips", "w": 2, "tags": ["删除", "替换", "保留"]}, {"k": "rule", "name": "规则是什么", "hint": "写清换成什么，不要写「打码」", "type": "chips", "w": 3, "tags": ["整列删除", "只留前 3 位与后 2 位", "降级到「城市 + 区」", "换成流水号 O0001…", "改为区间「≥10 万」", "原值保留"]}, {"k": "why", "name": "为什么这么处理", "hint": "选最贴近的一条", "type": "chips", "w": 3, "tags": ["没有分析价值，只有识别价值", "保留号段仍可分层，全打码就没法用", "唯一标识，风险最高", "门牌信息对趋势分析无用", "可反查下单人，属间接标识", "单笔极端值配合地区可反推"]}], "key": {"C01": {"lv": "可直接识别", "act": "删除", "rule": "整列删除", "why": "没有分析价值，只有识别价值"}, "C02": {"lv": "可直接识别", "act": "替换", "rule": "只留前 3 位与后 2 位", "why": "保留号段仍可分层，全打码就没法用"}, "C03": {"lv": "可直接识别", "act": "删除", "rule": "整列删除", "why": "唯一标识，风险最高"}, "C04": {"lv": "可直接识别", "act": "替换", "rule": "降级到「城市 + 区」", "why": "门牌信息对趋势分析无用"}, "C05": {"lv": "可间接识别", "act": "替换", "rule": "换成流水号 O0001…", "why": "可反查下单人，属间接标识"}, "C06": {"lv": "非标识但需处理", "act": "替换", "rule": "改为区间「≥10 万」", "why": "单笔极端值配合地区可反推"}}, "notes": {"C02·rule": "全打码（138****）之后按号段分层就做不了了；留前 3 后 2 既能用又认不出人", "C05·lv": "订单号本身不含个人信息，所以不是「可直接识别」，但它能反查下单人，属间接标识", "C06·lv": "金额不是标识字段，但单笔极端值配合地区和日期能反推到具体客户，所以要处理", "C03·act": "身份证号没有分析价值，只有识别价值，删除比替换更彻底"}, "delta": [{"op": "改", "frm": "模型把手机号处理成「打码，显示 138****」", "to": "改成「只留前 3 位与后 2 位，如 138****89，用于号段分层」", "why": "全打码之后连号段都看不出，数据就废了；脱敏的目标是认不出人但还能用", "kw": ["号段", "可用", "打码", "分层"]}, {"op": "删", "frm": "模型保留了订单号原值，理由「订单号不含个人信息」", "to": "改成流水号 O0001、O0002…，原号另存不进此表", "why": "订单号能反查下单人，属于间接标识；不留原值是最省事的做法", "kw": ["反查", "间接标识", "流水号"]}, {"op": "改", "frm": "模型保留 98 万那一单的原值", "to": "改成区间「≥10 万」", "why": "单笔极端值配合地区和日期，很容易被反推到具体客户", "kw": ["极端值", "区间", "反推", "10 万"]}, {"op": "补", "frm": "模型没有做字段最小化，整表 8 列都保留", "to": "补一节：分析区域销量趋势只需 5 列（城市、区、日期、金额、类目），其余不交", "why": "最小化是最有效的脱敏——不交的字段永远不会泄露", "kw": ["最小化", "5 列", "不交", "必需"]}], "refsheet": "C01｜可直接识别｜删除｜整列删除｜没有分析价值，只有识别价值\nC02｜可直接识别｜替换｜只留前 3 位与后 2 位｜保留号段仍可分层，全打码就没法用\nC03｜可直接识别｜删除｜整列删除｜唯一标识，风险最高\nC04｜可直接识别｜替换｜降级到「城市 + 区」｜门牌信息对趋势分析无用\nC05｜可间接识别｜替换｜换成流水号 O0001…｜可反查下单人，属间接标识\nC06｜非标识但需处理｜替换｜改为区间「≥10 万」｜单笔极端值配合地区可反推\n\n四条最容易判错的：\n· C05 不是「可直接识别」，它不含个人信息，但能反查——所以是间接标识，要换不能留。\n· C06 不是标识字段，却也要处理：极端值 + 地区 + 日期，三个一拼就能定位到人。\n· C02 的处理不是「打码」，是保留号段；全打码等于把数据废掉。\n· 最小化是最有效的脱敏：不交的字段，永远不会泄露。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的脱敏助手。我会贴一张表的结构和几行样例。请给我三样东西，不要给分析结论：\n一、标识列清单：哪几列可以直接识别到具体人，为什么\n二、脱敏方案：逐列写「删除 / 替换成什么 / 保留」，替换要写清规则（区间、代号、掩码）\n三、最小化建议：为「分析区域销量趋势」这个目的，哪些列其实不需要\n规则：① 替换必须保持数据可用（能分组、能比较），不要随机打码；② 不要保留任何完整手机号、身份证、住址；③ 每列都要给处理结论，不许留空。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】脱敏三步（删除标识 / 替换为区间或代号 / 最小化到只留必需字段）\n【参考案例】同一张表，删三列、换两列、只留五列后，AI 依然能给出同样有用的结论\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的脱敏助手。我会贴一张表的结构和几行样例。请给我三样东西，不要给分析结论：\n一、标识列清单：哪几列可以直接识别到具体人，为什么\n二、脱敏方案：逐列写「删除 / 替换成什么 / 保留」，替换要写清规则（区间、代号、掩码）\n三、最小化建议：为「分析区域销量趋势」这个目的，哪些列其实不需要\n规则：① 替换必须保持数据可用（能分组、能比较），不要随机打码；② 不要保留任何完整手机号、身份证、住址；③ 每列都要给处理结论，不许留空。", "rubric": ["能识别出哪几列是标识类（姓名、手机号、身份证、住址、订单号）并全部处理", "替换用的是区间或代号，不是随机打码（打码后数据就没法分析了）", "字段做了最小化：只留分析必需的列，不是整表交付", "留了一份对照记录，写清删了哪几列、换成什么规则"]}, {"id": "M7U3", "tier": "basic", "step": "todo", "title": "写一份你岗位的《AI 使用红线》", "video": {"dur": "3.4min", "script": ["红线要写成动作，写不成动作的红线等于没有", "红线五条（每条 = 场景 + 禁止动作 + 替代做法）", "「注意信息安全」与「客户手机号不打码不进任何外部工具」的差别"]}, "ppt": {"method": "红线五条（每条 = 场景 + 禁止动作 + 替代做法）", "case": "「注意信息安全」与「客户手机号不打码不进任何外部工具」的差别", "demo": "红线模板与填写示例"}, "objective": "能写出一份 5 条以内的《AI 使用红线》，每条都是可执行动作而非口号", "transfer": "把这份红线贴在工位或存进常用文档首页，第一次用 AI 处理新材料前先扫一眼", "vslides": [{"t": "第一步：从真实动作出发，不从道理出发", "n": "写红线最容易写成「注意信息安全」「遵守公司规定」这种话。这类话没有用，因为它不告诉你具体该怎么做。有效的红线从真实动作出发：你这一周实际做了哪些事、哪些动作里把材料交给了 AI。列出来之后你会发现场景其实很少，通常就五六个：整理名单、总结合同、写分析、做图、改文案、处理别人给的数据。场景定了，红线就有落点。写的时候每条三段：什么场景下、禁止做什么动作、替代做法是什么。三段里第三段最重要，也是最容易被跳过的——只有「不许」的红线会让人卡住，有替代做法的红线才让人能继续往前走。还有一个更实际的角度：红线是写给你自己在着急的时候看的。着急的时候人不会翻制度，只会凭印象处理，而红线就是那个印象。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 从这一周的真实动作出发\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 从这一周的真实动作出发</tspan></text></g><g data-k=\"② 场景 → 禁止动作 → 替代做法\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 场景 → 禁止动作 → 替代做法</tspan></text></g><g data-k=\"③ 没有替代做法的红线会被绕过\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 没有替代做法的红线会被绕过</tspan></text></g></svg>", "d": 69.48}, {"t": "第二步：砍到五条，只留真会发生的", "n": "红线不是越多越好。写到十五条，你自己都记不住，等于没有。砍到五条，标准是「这件事真会发生」。比如「不要用 AI 生成违法内容」这条，虽然对，但你不会去做，写进来只是凑数。而「客户手机号不打码不进外部工具」这条，你每周都要处理名单，真会发生，必须写。砍的过程也是排序的过程：写十条然后挑五条，你自然知道哪几条最要紧。还有一条建议：每条后面写「找谁」。因为红线不可能覆盖所有情况，一定会遇到卡住的时刻，这时候你需要知道往哪走。写清找人路径，红线才不是一个死规定，而是一套能用的流程。砍的时候有个技巧：想一想最近三个月有没有哪一次真的让你犹豫过，犹豫过的那几次就是你的红线，其他都可以先不写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"五条以内\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">五条以内</tspan></text></g><g data-k=\"只写真会发生的\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只写真会发生的</tspan></text></g><g data-k=\"每条写清找谁\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条写清找谁</tspan></text></g></svg>", "d": 67.58}, {"t": "第三步：一个月后复盘，把踩到的坑补进去", "n": "红线写完不是终点。一个月后回头看：这五条里哪几条真的用上了、哪几条从来没遇到、有没有踩到一条红线没覆盖到的坑。用上的保留，没遇到的换掉，新踩的坑补进去。这样迭代两三轮，你的红线会变得非常贴合自己——因为它来自你自己的真实经历，不是抄来的模板。这份东西的价值不在于它多完整，而在于它每一条你都真的执行过。还有一点要说清：红线的作用不是让你不敢用 AI，恰恰相反，是把边界划清楚之后，你可以放心地在边界内快跑。边界模糊的人才不敢动。复盘不用很正式，十分钟就够。翻一遍这一个月里所有让你停下来的时刻，那些时刻就是红线该覆盖的地方。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">一个月复盘的三个动作</tspan></text><g data-k=\"用上的：保留\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">用上的：保留</tspan></text></g><g data-k=\"没遇到的：换掉\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">没遇到的：换掉</tspan></text></g><g data-k=\"新踩的坑：补进去\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">新踩的坑：补进去</tspan></text></g></svg>", "d": 64.51}], "deliverable": {"type": "skill", "name": "个人 AI 使用红线（≤5 条）", "rubric": ["是动作不是口号", "有替代做法", "知道找谁"], "acceptance": "5 条以内：每条都有场景、禁止动作、替代做法与「找谁」，没有一条是口号"}, "practice": {"steps": ["翻自己一周的实际动作，列出所有把材料交给 AI 的场景", "每个场景问一句：这里最坏能出什么事", "把最坏的几条写成「场景 + 禁止动作 + 替代做法」三段式", "砍到 5 条以内，只留真会发生的，不写通用大道理", "每条后面写「卡住时找谁」，让人知道不确定的时候往哪走"], "exemplar": "【小林 · 个人 AI 使用红线 v1】\n岗位：市场部 · 运营支持　日期：2026-11-16　适用范围：我自己的日常工作\n\n■ 红线 1：客户与用户信息\n场景：做客户分层、名单整理、投诉分析时。\n禁止：把含姓名、手机号、身份证、详细地址、完整订单号的表，贴进任何非公司采购的工具。\n替代：先按《脱敏三步》处理——删标识列、手机号只留号段、地址降到区、订单号换流水号；处理后仍不够就只贴表结构。\n找谁：数据组 王工（口径与字段）；带教导师（工具是否可用）。\n\n■ 红线 2：合同与未公开经营数据\n场景：整理合同要点、准备报价、写经营分析时。\n禁止：把合同原文、报价单、未发布的财务数据贴进任何外部工具，包括以「帮我总结一下」的方式。\n替代：只贴自己写的摘要（不含当事人名称、金额明细、条款编号），或改用手写要点后让 AI 只做结构整理。\n找谁：法务对接人（能不能给）；我的主管（要不要做这件事）。\n\n■ 红线 3：对外发布内容\n场景：公众号、朋友圈、对外物料、客户可见的文档。\n禁止：AI 生成的图与文，未经三道检查直接发布（事实核查 / 授权与水印 / 口径与承诺）。\n替代：先用内部素材或公司已采购平台生成；发布前自己按三道检查过一遍；涉数字的句子逐条找出处。\n找谁：内容负责人（能不能发）；我做不了判断时，一律不发。\n\n■ 红线 4：把 AI 输出当事实\n场景：写行业分析、竞品对比、数据结论时。\n禁止：把 AI 给的数字、政策原文、案例直接写进材料。\n替代：只把 AI 输出当「线索」，每个数字回到原始来源核一遍；核不到就写「待核实」，不写估值。\n找谁：不做判断，自己核；核不动就找对应系统的负责人要口径。\n\n■ 红线 5：权限边界\n场景：有人让我用 AI 处理别人的数据、或者处理我没权限看的东西。\n禁止：因为「别人让的」就去做。\n替代：先确认三件事——我有没有权限看、这份数据归谁、出问题谁承担；三件有一件说不清就不做。\n找谁：我的主管（授权）；数据归属人。\n\n■ 自检：这五条都是我真会遇到的场景，每条都有替代做法和找人路径。\n■ 版本：v1，一个月后复盘一次，把真踩到的坑补进去。"}, "task": "产出《个人 AI 使用红线（≤5 条）》：翻自己一周的实际动作，列出所有把材料交给 AI 的场景；每个场景问一句：这里最坏能出什么事；把最坏的几条写成「场景 + 禁止动作 + 替代做法」三段式；砍到 5 条以内，只留真会发生的，不写通用大道理；每条后面写「卡住时找谁」，让人知道不确定的时候往哪走", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M7 红线、合规与综合实战」模块，你要交付的是《个人 AI 使用红线（≤5 条）》。\n【场景】业务侧这周的诉求是：红线要写成动作，写不成动作的红线等于没有。参考做法：「注意信息安全」与「客户手机号不打码不进任何外部工具」的差别。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（红线五条（每条 = 场景 + 禁止动作 + 替代做法）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《个人 AI 使用红线（≤5 条）》填写模板】\n\n■ 1. 翻自己一周的实际动作，列出所有把材料交给 AI 的场景\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 每个场景问一句：这里最坏能出什么事\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 把最坏的几条写成「场景 + 禁止动作 + 替代做法」三段式\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 砍到 5 条以内，只留真会发生的，不写通用大道理\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 每条后面写「卡住时找谁」，让人知道不确定的时候往哪走\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【小林 · 个人 AI 使用红线 v1】\n岗位：市场部 · 运营支持　日期：2026-11-16　适用范围：我自己的日常工作\n\n■ 红线 1：客户与用户信息\n场景：做客户分层、名单整理、投诉分析时。\n禁止：把含姓名、手机号、身份证、详细地址、完整订单号的表，贴进任何非公司采购的工具。\n替代：先按《脱敏三步》处理——删标识列、手机号只留号段、地址降到区、订单号换流水号；处理后仍不够就只贴表结构。\n找谁：数据组 王工（口径与字段）；带教导师（工具是否可用）。\n\n■ 红线 2：合同与未公开经营数据\n场景：整理合同要点、准备报价、写经营分析时。\n禁止：把合同原文、报价单、未发布的财务数据贴进任何外部工具，包括以「帮我总结一下」的方式。\n替代：只贴自己写的摘要（不含当事人名称、金额明细、条款编号），或改用手写要点后让 AI 只做结构整理。\n找谁：法务对接人（能不能给）；我的主管（要不要做这件事）。\n\n■ 红线 3：对外发布内容\n场景：公众号、朋友圈、对外物料、客户可见的文档。\n禁止：AI 生成的图与文，未经三道检查直接发布（事实核查 / 授权与水印 / 口径与承诺）。\n替代：先用内部素材或公司已采购平台生成；发布前自己按三道检查过一遍；涉数字的句子逐条找出处。\n找谁：内容负责人（能不能发）；我做不了判断时，一律不发。\n\n■ 红线 4：把 AI 输出当事实\n场景：写行业分析、竞品对比、数据结论时。\n禁止：把 AI 给的数字、政策原文、案例直接写进材料。\n替代：只把 AI 输出当「线索」，每个数字回到原始来源核一遍；核不到就写「待核实」，不写估值。\n找谁：不做判断，自己核；核不动就找对应系统的负责人要口径。\n\n■ 红线 5：权限边界\n场景：有人让我用 AI 处理别人的数据、或者处理我没权限看的东西。\n禁止：因为「别人让的」就去做。\n替代：先确认三件事——我有没有权限看、这份数据归谁、出问题谁承担；三件有一件说不清就不做。\n找谁：我的主管（授权）；数据归属人。\n\n■ 自检：这五条都是我真会遇到的场景，每条都有替代做法和找人路径。\n■ 版本：v1，一个月后复盘一次，把真踩到的坑补进去。", "rubric": ["每条都写清具体场景（做什么事的时候），不是「使用 AI 时」", "每条都有可执行的替代做法，不是只有「不许」", "每条都写了卡住时找谁，不是「按公司规定」", "总数不超过 5 条，且都是自己真会遇到的场景"]}, {"id": "M7U4", "tier": "basic", "step": "spar", "title": "合规同事抽查你的红线清单", "video": {"dur": "3.2min", "script": ["说不出依据的红线，执行时一定会打折扣", "三答（依据 / 替代 / 不确定时怎么办）", "「按规定不能传」与「这类带手机号的表我不进外部工具，改用脱敏后的版本」的差别"]}, "ppt": {"method": "三答（依据 / 替代 / 不确定时怎么办）", "case": "「按规定不能传」与「这类带手机号的表我不进外部工具，改用脱敏后的版本」的差别", "demo": "陪练说明：他会抽一条问「为什么是这条」"}, "objective": "能在合规同事抽查时，逐条说清红线的依据、替代做法与不确定时的处理，不替法务定性", "transfer": "把抽查中被问住的那一条补上替代做法，并把「找谁」改成一个具体的人", "vslides": [{"t": "陪练说明：他要看的是「你怎么动」，不是「你多懂」", "n": "这一关的对手是合规同事。他抽查的目的不是考你法规，是看你的红线能不能被执行。所以他问的都是动作层面的事：依据是什么、替代是什么、不确定的时候怎么办。新人最容易在这里犯一个错：为了显得专业，开始下合规结论，说「这个肯定不行」「这个应该可以」。这句话一出口就失分了，因为定性不是你的职责范围。正确姿态是：我标级别、我说我的做法、我说我卡住时找谁，但我不给合规结论。这个分寸感，比背一堆规定更让人放心。这一关还要注意语气：不要说「我觉得应该没问题」，也不要为了让他放心而说得比实际更严格——说得更严格，执行成本最后会转嫁到自己身上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">抽查三答</tspan></text><g data-k=\"依据：来自我的动作\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">依据：来自我的</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">动作</tspan></text></g><g data-k=\"替代：不贴也能干活\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">替代：不贴也能</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">干活</tspan></text></g><g data-k=\"不确定：找谁\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">不确定：找谁</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 64.8}, {"t": "第二问：业务非要你贴，你怎么办", "n": "「业务非要你贴进去，你怎么办」这一问，考的是你会不会两个极端：硬顶或者照做。硬顶的结果是被人绕过去，照做的结果是出了事你担。正确答法是给替代路径加升级路径：「我可以先出一版脱敏的，三十秒就能给你；如果你确实需要原始数据，我请我主管和法务一起确认一下，确认了我立刻做。」这句话里有两个关键：替代方案要够快（三十秒，不是三天），升级路径要具体（找谁、一起确认）。给不出快替代的人，最后都会被迫照做。给替代方案时要顺带说清成本：脱敏版三十秒能出，走确认要半天。把成本讲清楚，业务自己会选，多数时候他会选快的那条。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"先给快替代：30 秒能出\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">先给快替代：30 秒能出</tspan></text></g><g data-k=\"再给升级路径：找谁确认\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">再给升级路径：找谁确认</tspan></text></g><g data-k=\"不硬顶也不照做\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不硬顶也不照做</tspan></text></g></svg>", "d": 57.43}, {"t": "第三、四问：哪条是你自己判的，哪条是凑数的", "n": "倒数第二问通常是「这五条里哪一条其实是你自己判的合规结论」。这一问很尖锐，因为大多数人写完红线都会不知不觉越界。诚实答法是主动指出来：「第 2 条我写了『合同原文属于禁出』，这其实是我自己定的，我更应该写『我不确定这类属于哪一级，所以我不贴，我去问法务』。」承认越界并改成「标疑点 + 找人」，是这一关最高分的动作。最后一问是「有没有凑数的一条」，答「第 5 条我从来没遇到过」也没关系，把它换掉就行。红线不是越多越安全，凑数的条款会稀释真正重要的那几条。这一关最高分不是答得滴水不漏，而是让他觉得你以后遇到不确定的事会主动来问，而不是自己悄悄处理掉。让他放心的不是你懂多少，而是你知道自己不懂哪一部分、并且会来问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">分寸对</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">越界了</tspan></text><g data-k=\"标疑点 + 找人\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">标疑点 + 找人</tspan></text></g><g data-k=\"自己下合规结论\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">自己下合规结论</tspan></text></g></svg>", "d": 69.0}], "deliverable": {"type": "skill", "name": "个人 AI 使用红线（修订版）", "rubric": ["不替法务定性", "有替代做法", "敢认凑数"], "acceptance": "四问都答得出：红线来源（自己的动作而非法务定性）、替代做法、不确定时的处理路径、诚实指出凑数的那条"}, "spar": {"role": "合规同事", "persona": "不看态度看动作；会问「依据」「替代」「不确定怎么办」，听到「按规定」会继续追", "mustAsk": ["你这条红线，依据是什么？", "如果业务非要你贴进去，你怎么办？", "你这五条里，哪一条其实是你自己判的合规结论？", "有没有一条是你从来不会遇到的？"]}, "exemplar": "（合规同事问：你这条「合同原文不进外部工具」，依据是什么）\n\n结论：这条是我自己根据实际动作定的，不是我判的合规结论。\n依据：我每周要整理三四份合同要点，原来习惯整份贴进去让模型摘要。后来发现合同里有当事人名称、金额和条款结构，一旦外传就没法收回。所以我把它定成红线，做法是只贴我自己写的不含名称和金额的摘要。\n边界：至于这类内容具体属于哪一级、能不能用哪个工具，我没有判断的资格，所以我写了「找法务对接人和我主管」。如果公司有明确的工具清单，我按清单执行，不按我自己的理解执行。", "task": "把《个人 AI 使用红线（修订版）》拿到「合规同事」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《个人 AI 使用红线（修订版）》。现在要让它通过「合规同事」这一关。\n【对手的立场】不看态度看动作；会问「依据」「替代」「不确定怎么办」，听到「按规定」会继续追。\n【他一定会追问】「你这条红线，依据是什么？」 / 「如果业务非要你贴进去，你怎么办？」 / 「你这五条里，哪一条其实是你自己判的合规结论？」\n【场景】你说「合规同事抽查你的红线清单」，对方立刻回一句：你这条红线，依据是什么？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["明确说清这条红线来自自己的实际动作，不是自己下的合规结论", "被问「业务非要你贴」时，给出替代路径与升级路径，不是硬顶也不是照做", "主动指出哪一条其实是自己越界做的定性，愿意改成「标疑点 + 找人」", "诚实承认有一条是凑数的，愿意换掉"]}, {"id": "M7U5", "tier": "adv", "step": "understand", "title": "AI 输出的版权与引用边界", "video": {"dur": "3.2min", "script": ["AI 写的东西看着像事实，但它只是像", "输出四类（可直接用 / 需改写 / 需核实 / 不可用）", "把 AI 生成的行业数据当事实写进报告，被一句「哪来的」问住"]}, "ppt": {"method": "输出四类（可直接用 / 需改写 / 需核实 / 不可用）", "case": "把 AI 生成的行业数据当事实写进报告，被一句「哪来的」问住", "demo": "输出分级卡：拿 4 类内容各判一次"}, "objective": "能把 AI 输出分成可直接用 / 需改写 / 需核实 / 不可用四类，并守住引用边界", "transfer": "拿手上材料里所有 AI 给的数字，逐条标「查得到 / 查不到」，查不到的先标待核实", "vslides": [{"t": "先把输出分四类，再决定怎么用", "n": "AI 输出的东西不是「能用」和「不能用」两类，是四类。第一类可直接用：改写、润色、换格式、把长文压成要点——这类活的结果你能一眼判断对错，因为原文就在你手里。第二类需改写：结构、提纲、思路——方向也许对，但具体表述要换成你自己的话，否则读起来不像人写的。第三类需核实：任何带数字、带政策、带案例、带引用的内容。这类必须回到原始来源核一遍，核不到就不能写。第四类不可用：涉及具体人、具体合同条款、具体合规定性的内容——这些不是 AI 该回答的领域。四类分清，你就不会犯「把第三类当第一类用」的错。四类里最容易搞混的是第一类和第三类。判断方法很简单：结果对不对，你能不能自己一眼验出来。能验的是第一类，不能验的就是第三类。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">AI 输出四类</tspan></text><g data-k=\"可直接用\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">可直接用</tspan></text></g><g data-k=\"需改写\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">需改写</tspan></text></g><g data-k=\"需核实\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">需核实</tspan></text></g><g data-k=\"不可用\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">不可用</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 73.32}, {"t": "为什么「看起来对」不能作为判断依据", "n": "判断一类输出能不能用，标准只有一条：有没有可核的来源。看起来对没有用，因为模型最擅长的就是写出看起来对的东西——它会给你一个格式完美、语气笃定的段落，里面每个数字都是编的。而且它编得有分寸：不会给你一个明显离谱的数，会给你一个「差不多合理」的数，这种数最难被发现。所以判断动作不能是「读一遍觉得没问题」，必须是「找来源」。找得到来源，这条能用；找不到，就写待核实。这一条判断标准，能挡掉九成的事故。所以判断动作要变成一个固定流程：看到数字，先问「这个数我能去哪查」，答得出来才往下写，答不出来就先标住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"不读一遍就信\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不读一遍就信</tspan></text></g><g data-k=\"只问一句：来源在哪\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">只问一句：来源在哪</tspan></text></g><g data-k=\"找不到就写待核实\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">找不到就写待核实</tspan></text></g></svg>", "d": 58.58}, {"t": "引用边界：不冒充实证，也不冒充原创", "n": "引用 AI 输出有两条边界。第一条，不冒充实证：AI 说的不能写成「据研究」「数据显示」，除非你真的找到了那个研究。第二条，不冒充原创：如果一段结构、一个框架是 AI 给的，你在内部用没问题，但对外声称是自己的方法论就要谨慎——不是法律问题，是职业信誉问题。实操上有个简单做法：在材料里把「我查到的」「我推的」「AI 给我的初稿我改的」分开写。分开写不丢人，反而是专业的标志；混在一起写，一旦有一条被推翻，整份材料都没人信。分开写还有个实际好处：别人问你某个数时，你能立刻说清它是查到的还是推的，不用重新回忆当时的思路。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"不写「据研究」除非真有\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不写「据研究」除非真有</tspan></text></g><g data-k=\"不把框架冒充原创\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不把框架冒充原创</tspan></text></g><g data-k=\"三类来源分开写\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三类来源分开写</tspan></text></g></svg>", "d": 59.81}], "deliverable": {"type": "skill", "name": "AI 输出使用判断表", "rubric": ["分级准确", "引用有标", "不冒充实证"], "acceptance": "能对四类 AI 输出各给一个使用结论，并说清引用时该怎么标"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】输出四类（可直接用 / 需改写 / 需核实 / 不可用）\n【为什么重要】AI 写的东西看着像事实，但它只是像\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["四类输出各有例子，且判断理由落到「有没有可核来源」而不是「看起来对不对」", "需核实的输出写清了「核什么、去哪核」，不是只写「要核实」", "能说出引用 AI 输出时该怎么标注，不把它当成自己的原创发现", "明确写出「AI 给的数字不写进对外材料」这一条硬约束"]}, {"id": "M7U6", "tier": "adv", "step": "demo", "title": "对外内容发布前的三道检查", "video": {"dur": "3.3min", "script": ["对内能将就的地方，对外一处都不能将就", "发布三查（事实核查 / 授权与水印 / 口径与承诺）", "一张图、一个数字、一句承诺，三处各卡住一次"]}, "ppt": {"method": "发布三查（事实核查 / 授权与水印 / 口径与承诺）", "case": "一张图、一个数字、一句承诺，三处各卡住一次", "demo": "WorkBuddy 内跑一遍三查，对照 AI 原稿与人改稿"}, "objective": "能在对外发布前跑完「事实 / 授权 / 口径」三道检查，并逐条给出可发或不可发的结论", "transfer": "把手上准备发布的一份内容按三道检查过一遍，把卡住的条目写成待办再去发", "vslides": [{"t": "演示准备：对内能将就的，对外一处都不能将就", "n": "这次要发的是一篇对外内容。对内材料里可以含糊的地方，对外一处都不能含糊，原因很简单：对内发错了，同事会问你一句；对外发错了，客户会截图，然后一直存在。所以发布前必须过三道检查。第一道事实核查：每个数字、每个论断都要有出处。第二道授权与素材：每张图、每段引用都要说清来源和授权。第三道口径与承诺：每句带时间、效果、范围的话，都要有依据。三道都过的，才可以发。有一道没过，就先别发——不是改一改再发，是先把那一条拿掉或标住。三道检查的顺序也有讲究：先查事实，事实不过后面都白搭；再查授权；最后查承诺，因为承诺最需要人来判断分寸。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">发布三查</tspan></text><g data-k=\"事实核查\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">事实核查</tspan></text></g><g data-k=\"授权与素材\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">授权与素材</tspan></text></g><g data-k=\"口径与承诺\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">口径与承诺</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.33}, {"t": "跑一遍：为什么「不可发」比「改一下」更常出现", "n": "跑完你会发现很多条被标成「不可发」。这不是工具太严，是因为真实的材料里本来就有很多没出处的东西。提示词里我写了「找不到出处的数字一律标不可发，不要替我估算」，这一条很关键。不写，模型会帮你把「行业增速约 12%」改成「约 10%–15%」，看着更稳妥，实际是造了一个区间。造区间比造单点更危险，因为它看起来更专业。还有一条约束是「授权状态不明的一律标不可发」，这一条挡的是最常见的坑：图好看、来源忘了、发出去被要求下架。记住一句话：授权这件事没有「应该可以」。还有一个常被漏掉的项：引用别人的话。转述一段政策、引用一句专家观点，给不出原文就不要引，改成讲自己的做法。这一类最容易出事，因为转述看着比引用安全，实际更容易变形。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：一篇准备对外发布的内容\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一篇准备对外发布的内容</tspan></text></g><g data-k=\"约束：无出处标不可发 / 授权不明标不可发 / 不定性 / 不改原文\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：无出处标不可发 / 授权不明标不可发 / 不定性 / 不改原</tspan><tspan x=\"52.0\" dy=\"15.4\">文</tspan></text></g><g data-k=\"产出：三查表 + 待确认\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：三查表 + 待确认</tspan></text></g></svg>", "d": 67.56}, {"t": "人工收口：把承诺改成可验证的说法", "n": "跑完最值得改的是承诺类表述。这类表述的共性是「听起来很好，但无法验证」：「效率提升 3 倍」「大幅降低成本」「覆盖全部区域」。三句都很好听，三句都没法查。改法是把它们换成可验证的说法：「单份处理时间从 40 分钟降到 15 分钟」「预计降低单均成本 0.8 元」「覆盖 12 个城市」。换完之后气势是弱了一点，但可信度上来了——而对外内容最缺的不是气势，是可信。最后一个动作：把所有「不可发」的条目汇成一张待办，写清问谁、什么时候能确认。这张待办没过完，内容就不发。改完再读一遍，如果气势弱了很多，反而说明改对了——原来那几句气势，是靠模糊换来的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"把模糊承诺换成可验证数\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">把模糊承诺换成可验证数</tspan></text></g><g data-k=\"不可发的汇成待办\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不可发的汇成待办</tspan></text></g><g data-k=\"待办没过完就不发\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">待办没过完就不发</tspan></text></g></svg>", "d": 60.07}], "deliverable": {"type": "skill", "name": "发布前三查表", "rubric": ["事实有源", "授权清楚", "承诺不越界"], "acceptance": "每一项都给了「可发 / 不可发 / 改后可发」的结论，且不可发的写清了改法"}, "demo": {"ref": "■ 一、事实核查\n| 内容 | 出处 | 结论 |\n|---|---|---|\n| 「行业增速约 12%」 | 某通稿，未写统计周期 | 不可发（口径不明，改区间或删） |\n| 「我方履约 24 小时」 | 内部看板 10 月全量 | 可发（需注明统计月份） |\n| 「复购率 43%」 | 内部看板，口径为 90 天内 ≥3 次 | 可发（需在脚注写口径） |\n| 「服务超过 500 家门店」 | 未找到出处 | 不可发 |\n\n■ 二、授权与素材\n| 素材 | 来源 | 授权/水印 | 结论 |\n|---|---|---|---|\n| 封面图 | 公司已采购平台生成 | 内部授权，无水印 | 可发 |\n| 内文插图 1 | 个人免费工具生成 | 带水印，商用条款未确认 | 不可发（换图） |\n| 内文引用一段政策表述 | 转述，未见原文 | 无 | 不可发（改为不引原文，只讲做法） |\n\n■ 三、口径与承诺\n| 表述 | 依据 | 风险 | 建议 |\n|---|---|---|---|\n| 「本月内上线」 | 排期表 11/28 | 低 | 可发，改为「11 月 28 日上线」 |\n| 「效率提升 3 倍」 | 无 | 高 | 改「单份处理时间从 40 分钟降到 15 分钟」 |\n| 「覆盖全部区域」 | 实际 12 个城市 | 高 | 改「覆盖 12 个城市」 |\n| 「大幅降低成本」 | 无 | 中 | 改为「预计降低单均成本 0.8 元」，并注明为测算 |\n\n■ 待确认（问谁）\n· 「500 家门店」口径 —— 问运营数据中心。\n· 内文插图 1 的商用授权 —— 问采购，未确认前不发布。", "fix": ["把「效率提升 3 倍」改成「单份处理时间从 40 分钟降到 15 分钟」——倍数无法验证，具体时长有记录可查。", "把「覆盖全部区域」改成「覆盖 12 个城市」——「全部」是承诺，12 个城市是事实，差一个词性质就变了。", "把带水印的那张图换成公司已采购平台生成的图——带水印的图对外发出，等于把「用了免费工具」写在脸上。", "给两个口径不明的数字标了「不可发」并写了问谁，而不是自己估一个区间填上去。"], "judge": "判断依据：数字是否都有出处；授权不明的素材是否被拦下；承诺是否从模糊改成可验证；有没有自己估数", "sheet": {"situ": "一篇对外内容准备发布。里面有 6 处需要检查：数字、素材、承诺混在一起。你要逐条判断：能不能发、卡在哪一道检查、该怎么改。", "ask": "① 逐条判定：可发 / 不可发 / 改后可发，卡在哪一道检查；② 让模型按「事实 / 授权 / 承诺」三道检查逐项过；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请按三道检查逐项过这份内容，四列固定：检查项 | 内容 | 结论（可发/不可发/改后可发）| 改法。\n规则：① 找不到出处的数字一律标不可发，不要替我估算；② 授权状态不明一律标不可发；③ 不下合规定性结论，只标疑点并写「问谁」；④ 不改写原文，只给结论。", "mats": [{"id": "B01", "src": "正文第 2 段", "text": "「行业整体增速约 12%。」\n引用自一份通稿，通稿未写统计周期。"}, {"id": "B02", "src": "正文第 3 段", "text": "「我方平均履约 24 小时。」\n来自内部看板，10 月全量数据。"}, {"id": "B03", "src": "正文第 5 段", "text": "「服务超过 500 家门店。」\n找不到任何内部或公开出处。"}, {"id": "B04", "src": "内文插图 1", "text": "用个人免费工具生成，画面带明显水印，商用条款未确认。\n图本身内容没问题。"}, {"id": "B05", "src": "正文第 8 段", "text": "「效率提升 3 倍，大幅降低成本。」\n没有任何测算过程。"}, {"id": "B06", "src": "正文第 9 段", "text": "「本月内上线，覆盖全部区域。」\n排期 11/28，实际覆盖 12 个城市。"}], "cols": [{"k": "gate", "name": "卡在哪一道", "hint": "事实 / 授权 / 承诺 / 都能过", "type": "chips", "w": 2, "tags": ["事实核查", "授权与素材", "口径与承诺", "都能过"]}, {"k": "ok", "name": "能不能发", "hint": "可发 / 不可发 / 改后可发", "type": "chips", "w": 2, "tags": ["可发", "不可发", "改后可发"]}, {"k": "fix", "name": "怎么改", "hint": "给具体动作，不要写「再核实一下」", "type": "chips", "w": 3, "tags": ["删掉数字，或改为区间并注明口径", "补一句统计月份", "删掉这句，换成有出处的数", "换图，用已采购平台生成", "改成可验证的具体数", "把「全部」改成「12 个城市」"]}], "key": {"B01": {"gate": "事实核查", "ok": "改后可发", "fix": "删掉数字，或改为区间并注明口径"}, "B02": {"gate": "事实核查", "ok": "改后可发", "fix": "补一句统计月份"}, "B03": {"gate": "事实核查", "ok": "不可发", "fix": "删掉这句，换成有出处的数"}, "B04": {"gate": "授权与素材", "ok": "不可发", "fix": "换图，用已采购平台生成"}, "B05": {"gate": "口径与承诺", "ok": "改后可发", "fix": "改成可验证的具体数"}, "B06": {"gate": "口径与承诺", "ok": "改后可发", "fix": "把「全部」改成「12 个城市」"}}, "notes": {"B01·ok": "口径不明的数字不能直接发，但也别自己估区间——要么删，要么注明来自哪份通稿及其口径", "B03·ok": "完全找不到出处的，只能删；这类句子是内容里最危险的部分，因为它听起来最有说服力", "B04·ok": "带水印的图对外发出，等于把「用了免费工具」写在脸上；授权未确认一律不发", "B06·gate": "「全部区域」是范围承诺，「12 个城市」是事实；差一个词，性质就变了"}, "delta": [{"op": "改", "frm": "模型把「效率提升 3 倍」改成「效率提升 2–3 倍」", "to": "改成「单份处理时间从 40 分钟降到 15 分钟」", "why": "改倍数区间还是在编；换成可查的具体时长，既有说服力又能被验证", "kw": ["3 倍", "具体时长", "可验证", "40 分钟"]}, {"op": "改", "frm": "模型保留了「覆盖全部区域」", "to": "改成「覆盖 12 个城市」", "why": "「全部」是承诺，12 个城市是事实；写成承诺，兑现不了就是失信", "kw": ["全部", "12 个城市", "承诺", "事实"]}, {"op": "删", "frm": "模型给「500 家门店」补了一句「据内部统计」", "to": "整句删除", "why": "没有出处的数字不能靠加一句「据内部统计」洗白，那只是把问题藏起来", "kw": ["500 家", "无出处", "删", "据内部统计"]}, {"op": "补", "frm": "模型没有处理带水印的插图", "to": "补一条：内文插图 1 不可发，换成公司已采购平台生成的图", "why": "水印是可见的授权状态；对外物料用带水印的图，等于自证用了免费工具", "kw": ["水印", "换图", "不可发", "已采购"]}], "refsheet": "B01｜事实核查｜改后可发｜删掉数字，或改为区间并注明口径\nB02｜事实核查｜改后可发｜补一句统计月份\nB03｜事实核查｜不可发｜删掉这句，换成有出处的数\nB04｜授权与素材｜不可发｜换图，用已采购平台生成\nB05｜口径与承诺｜改后可发｜改成可验证的具体数\nB06｜口径与承诺｜改后可发｜把「全部」改成「12 个城市」\n\n四条最容易判错的：\n· B01 是「改后可发」而不是「不可发」：注明口径后仍然可用，不必整句删。\n· B03 加一句「据内部统计」不算补出处，出处要能指到具体文件和日期。\n· B04 内容没问题、图也没问题，卡的是授权与水印——这两项不过就是不能发。\n· B06 的错不在数字，在「全部」这个词：范围承诺最容易失信。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的发布前检查助手。我会贴一份准备对外发布的内容。请按三道检查逐项过，不要改写内容：\n一、事实核查：每个数字、每个论断 | 出处 | 可发/不可发\n二、授权与素材：每张图、每段引用 | 来源 | 授权状态 | 有无水印 | 可发/不可发\n三、口径与承诺：每句含时间、效果、范围的表述 | 依据 | 风险 | 建议改法\n规则：① 找不到出处的数字一律标「不可发」，不要替我估算；② 授权状态不明的一律标「不可发」；③ 不要下合规定性结论，只标疑点并写「问谁」；④ 不要改写原文，只给结论。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】发布三查（事实核查 / 授权与水印 / 口径与承诺）\n【参考案例】一张图、一个数字、一句承诺，三处各卡住一次\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的发布前检查助手。我会贴一份准备对外发布的内容。请按三道检查逐项过，不要改写内容：\n一、事实核查：每个数字、每个论断 | 出处 | 可发/不可发\n二、授权与素材：每张图、每段引用 | 来源 | 授权状态 | 有无水印 | 可发/不可发\n三、口径与承诺：每句含时间、效果、范围的表述 | 依据 | 风险 | 建议改法\n规则：① 找不到出处的数字一律标「不可发」，不要替我估算；② 授权状态不明的一律标「不可发」；③ 不要下合规定性结论，只标疑点并写「问谁」；④ 不要改写原文，只给结论。", "rubric": ["每个数字都能指出出处，指不出的标为不可发或改为区间", "图片与素材的授权状态、水印情况逐项写清，不含糊", "所有承诺类表述（时间、效果、范围）都有依据，没有「预计」「大幅」这类模糊承诺", "没有替法务或业务下定性结论，遇到不确定的标疑点并写清问谁"]}, {"id": "M7U7", "tier": "adv", "step": "todo", "title": "交付你的《个人 AI 使用手册》", "video": {"dur": "3.3min", "script": ["学完记不住的，写成清单才留得下", "手册三段（我的清单 / 我的模板 / 我的红线）", "八周课程最后留下三页纸，比留下一堆笔记有用得多"]}, "ppt": {"method": "手册三段（我的清单 / 我的模板 / 我的红线）", "case": "八周课程最后留下三页纸，比留下一堆笔记有用得多", "demo": "手册模板与填写示例"}, "objective": "能把七门课的方法收敛成一份可执行的《个人 AI 使用手册》，含清单、模板与红线", "transfer": "把手册打印一页贴在工位，下周一按手册里的第一条动作做一次", "vslides": [{"t": "第一步：把八周的东西收敛成六到八条", "n": "八周学完，你会有一堆笔记。笔记留着回忆可以，但它不能帮你干活，因为它太散。手册的第一步是收敛：把你岗位上真正会用到 AI 的事列出来，六到八条，按频率排序。排频率这一步很关键，因为它决定了你该把哪三件事做成模板——最高的那三件值得做模板，最低的那两件不做也损失不大。写清单时还要加一节「不交给 AI 的三件事」，这一节比清单本身更重要，它划的是你的边界。收敛的过程其实就是取舍：你不可能同时用好八件事，能稳定用好三件，就已经超过大多数人了。收敛时有个取舍标准：这件事你是不是每周都要做一次以上。是，就进清单；一个月才做一次，先别放，放进来只会让手册变厚。写清单的时候不要追求全面，追求的是「明天就能照着做」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 6–8 条，按频率排\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 6–8 条，按频率排</tspan></text></g><g data-k=\"② 最高频三件做成模板\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 最高频三件做成模板</tspan></text></g><g data-k=\"③ 写下不交给 AI 的三件事\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 写下不交给 AI 的三件事</tspan></text></g></svg>", "d": 69.24}, {"t": "第二步：模板要能填空，不能是文章", "n": "三个模板是手册的核心。判断一个模板能不能用的标准很简单：拿到手，三十秒内能填出一版。做不到，说明它还是文章，不是模板。做法是把每段写成带〔〕的骨架，〔〕里说明该填什么粒度，比如〔谁 + 做什么 + 什么时候 + 交付什么〕。模板不要太长，三个就够；超过三个，你会因为找不到而放弃使用。模板还有一个隐藏好处：它把「想结构」这件事固定下来了，你每次只花时间在内容上，而内容才是真正需要你判断的部分。模板写完要真的用一次，用的时候一定会卡住。卡住的地方就是模板要改的那一处，改完再存，这份模板才算你的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"三十秒能填一版\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三十秒能填一版</tspan></text></g><g data-k=\"〔〕里写清粒度\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">〔〕里写清粒度</tspan></text></g><g data-k=\"三个就够\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三个就够</tspan></text></g></svg>", "d": 58.42}, {"t": "第三步：节奏和「留给一个月后的我」", "n": "手册最容易死在「写完就不看」。防这个的办法是写节奏：每周固定做哪一件跟 AI 有关的动作，写清周几、几点、做什么，并且把第一次执行的时间写进去。有具体时间，它才会真的发生。最后一节建议写「留给一个月后的我」——三个问题：哪些事真的用上了、模板改过哪一处、红线有没有打折过。这一节的作用是给未来的自己留一个复盘入口。一个月后你打开手册，看到这三个问题，会立刻知道自己这一个月是真用还是假用。手册最好放在每天都能看到的地方：工位贴一页，或者设成常用文档的首页。存在网盘深处的手册，等于没写。手册的价值不在写得多完整，在于你真的照着做过几次。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">手册的节奏</tspan></text><g data-k=\"每周一 20 分钟过表\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">每周一 20 分钟过表</tspan></text></g><g data-k=\"每月复盘一次红线\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">每月复盘一次红线</tspan></text></g><g data-k=\"每季度更新清单与模板\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">每季度更新清单与模板</tspan></text></g></svg>", "d": 70.68}], "deliverable": {"type": "skill", "name": "个人 AI 使用手册（≤3 页）", "rubric": ["能照着做", "不超三页", "有节奏"], "acceptance": "三页以内：6–8 条清单、3 个模板、5 条红线、1 个固定节奏，全部能照着做"}, "practice": {"steps": ["写我的清单：我岗位上真正会用到 AI 的 6–8 件事，按频率排序", "写我的模板：把最高频的 3 件事的提示词/纪要/体检表存成模板", "写我的红线：5 条以内的红线，带替代做法与找人路径", "写我的节奏：每周固定做哪一件跟 AI 有关的复盘动作", "压到 3 页以内，删掉所有解释性文字，只留能照着做的东西"], "exemplar": "【小林 · 个人 AI 使用手册 v1】\n岗位：市场部 · 运营支持　建立：2026-11-18　页数：3 页\n\n═══ 第一页：我的清单（6 件事，按频率排）═══\n1. 会议纪要与待办拆分　　每周 3–4 次　用 M5 四块模板\n2. 客户名单清洗与分层　　每周 2 次　　用 M4 四查 + 脱敏三步\n3. 周报与进度汇报　　　　每周 1 次　　用 M3 四段骨架\n4. 行业简报与信息核对　　每周 1 次　　用 M2 四栏 + 可信度\n5. 内部培训配图　　　　　每月 2 次　　用 M6 风格锚\n6. 对外内容发布前检查　　每月 1–2 次　用 M7 三查\n\n不交给 AI 的三件事：\n· 判断某份材料属于哪一级、能不能用 → 标疑点，问法务/主管\n· 决定资源怎么分配 → 我给数据，决定权不在我\n· 评价同事表现 → 我不做这件事\n\n═══ 第二页：我的三个模板 ═══\n模板 1｜纪要四块（M5U3）\n　结论：〔1–2 句〕\n　决议：定〔什么〕；不做〔什么〕\n　待办：〔谁〕〔做什么〕〔什么时候〕〔交付什么〕\n　待定：〔卡在谁那〕〔需要什么才能定〕\n\n模板 2｜体检报告五段（M4U3）\n　表概况：〔行/列/时间范围/来源系统〕\n　四查：缺失〔数〕重复〔数〕口径〔几条〕异常〔几条〕\n　清洗记录：〔做什么/影响行数/为什么〕\n　待确认：〔问谁/何时〕\n　影响占比：〔X%〕，>10% 报上游\n\n模板 3｜发布前三查（M7U6）\n　事实：每个数字 → 出处 → 可发/不可发\n　授权：每张图 → 来源 → 授权/水印 → 可发/不可发\n　承诺：每句时间/效果/范围 → 依据 → 改法\n\n═══ 第三页：我的红线与节奏 ═══\n红线（5 条，详见 M7U3 全文）\n1. 客户信息：不打码不进外部工具 → 脱敏三步 → 问数据组\n2. 合同与未公开经营数据：不贴原文 → 只贴自写摘要 → 问法务\n3. 对外内容：必须过三查 → 过不了就不发 → 问内容负责人\n4. AI 输出：数字一律核来源 → 核不到写待核实\n5. 权限边界：别人让做也要先确认权限 → 说不清就不做 → 问主管\n\n我的节奏\n· 每周一 09:30–09:50：过一遍任务表，发 2–3 条卡点（M5U7）\n· 每月最后一个周五：复盘五条红线，补一条真踩到的坑\n· 每季度：更新清单与模板，删掉用不上的\n\n第一次执行：2026-11-23（周一）09:30，已写进日历。\n\n═══ 留给一个月后的我 ═══\n· 这 6 件事里，哪几件真的用上了？没用上的删掉。\n· 三个模板改过几次？改的哪一处？那是你真正学到的地方。\n· 红线的第 4 条（核来源）有没有打折过？打折扣的那一次，出了什么事？"}, "task": "产出《个人 AI 使用手册（≤3 页）》：写我的清单：我岗位上真正会用到 AI 的 6–8 件事，按频率排序；写我的模板：把最高频的 3 件事的提示词/纪要/体检表存成模板；写我的红线：5 条以内的红线，带替代做法与找人路径；写我的节奏：每周固定做哪一件跟 AI 有关的复盘动作；压到 3 页以内，删掉所有解释性文字，只留能照着做的东西", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M7 红线、合规与综合实战」模块，你要交付的是《个人 AI 使用手册（≤3 页）》。\n【场景】业务侧这周的诉求是：学完记不住的，写成清单才留得下。参考做法：八周课程最后留下三页纸，比留下一堆笔记有用得多。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（手册三段（我的清单 / 我的模板 / 我的红线）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《个人 AI 使用手册（≤3 页）》填写模板】\n\n■ 1. 写我的清单：我岗位上真正会用到 AI 的 6–8 件事，按频率排序\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写我的模板：把最高频的 3 件事的提示词/纪要/体检表存成模板\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写我的红线：5 条以内的红线，带替代做法与找人路径\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 写我的节奏：每周固定做哪一件跟 AI 有关的复盘动作\n   ‣ 提示：每条改进项都要带责任人与时限，否则不算通过。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 压到 3 页以内，删掉所有解释性文字，只留能照着做的东西\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【小林 · 个人 AI 使用手册 v1】\n岗位：市场部 · 运营支持　建立：2026-11-18　页数：3 页\n\n═══ 第一页：我的清单（6 件事，按频率排）═══\n1. 会议纪要与待办拆分　　每周 3–4 次　用 M5 四块模板\n2. 客户名单清洗与分层　　每周 2 次　　用 M4 四查 + 脱敏三步\n3. 周报与进度汇报　　　　每周 1 次　　用 M3 四段骨架\n4. 行业简报与信息核对　　每周 1 次　　用 M2 四栏 + 可信度\n5. 内部培训配图　　　　　每月 2 次　　用 M6 风格锚\n6. 对外内容发布前检查　　每月 1–2 次　用 M7 三查\n\n不交给 AI 的三件事：\n· 判断某份材料属于哪一级、能不能用 → 标疑点，问法务/主管\n· 决定资源怎么分配 → 我给数据，决定权不在我\n· 评价同事表现 → 我不做这件事\n\n═══ 第二页：我的三个模板 ═══\n模板 1｜纪要四块（M5U3）\n　结论：〔1–2 句〕\n　决议：定〔什么〕；不做〔什么〕\n　待办：〔谁〕〔做什么〕〔什么时候〕〔交付什么〕\n　待定：〔卡在谁那〕〔需要什么才能定〕\n\n模板 2｜体检报告五段（M4U3）\n　表概况：〔行/列/时间范围/来源系统〕\n　四查：缺失〔数〕重复〔数〕口径〔几条〕异常〔几条〕\n　清洗记录：〔做什么/影响行数/为什么〕\n　待确认：〔问谁/何时〕\n　影响占比：〔X%〕，>10% 报上游\n\n模板 3｜发布前三查（M7U6）\n　事实：每个数字 → 出处 → 可发/不可发\n　授权：每张图 → 来源 → 授权/水印 → 可发/不可发\n　承诺：每句时间/效果/范围 → 依据 → 改法\n\n═══ 第三页：我的红线与节奏 ═══\n红线（5 条，详见 M7U3 全文）\n1. 客户信息：不打码不进外部工具 → 脱敏三步 → 问数据组\n2. 合同与未公开经营数据：不贴原文 → 只贴自写摘要 → 问法务\n3. 对外内容：必须过三查 → 过不了就不发 → 问内容负责人\n4. AI 输出：数字一律核来源 → 核不到写待核实\n5. 权限边界：别人让做也要先确认权限 → 说不清就不做 → 问主管\n\n我的节奏\n· 每周一 09:30–09:50：过一遍任务表，发 2–3 条卡点（M5U7）\n· 每月最后一个周五：复盘五条红线，补一条真踩到的坑\n· 每季度：更新清单与模板，删掉用不上的\n\n第一次执行：2026-11-23（周一）09:30，已写进日历。\n\n═══ 留给一个月后的我 ═══\n· 这 6 件事里，哪几件真的用上了？没用上的删掉。\n· 三个模板改过几次？改的哪一处？那是你真正学到的地方。\n· 红线的第 4 条（核来源）有没有打折过？打折扣的那一次，出了什么事？", "rubric": ["清单里的每件事都是自己岗位上真会做的，按频率排了序", "3 个模板都是能直接填空的骨架，不是文章", "5 条红线带替代做法与找人路径，不是口号", "有一个固定节奏（周几做什么），并写了第一次执行的时间"]}, {"id": "M7U8", "tier": "adv", "step": "spar", "title": "结业答辩：一个月后你怎么用 AI", "video": {"dur": "3.4min", "script": ["说不成动作的决心，一个月后一定忘", "答辩三段（三件事 / 一条边界 / 一个验收）", "「我会多用 AI」与「每周三件事、边界一条、一个月后看三个数」的差别"]}, "ppt": {"method": "答辩三段（三件事 / 一条边界 / 一个验收）", "case": "「我会多用 AI」与「每周三件事、边界一条、一个月后看三个数」的差别", "demo": "陪练说明：他会追问到具体动作能落地为止"}, "objective": "能在结业答辩中讲清「一个月后我怎么用 AI」，给出可核验的三件事与一条边界", "transfer": "把答辩里的三件事写进手册第一页，并在一个月后的复盘日逐条对一遍", "vslides": [{"t": "陪练说明：他要听动作，不听决心", "n": "这是结业答辩。评委不会问你记住了什么，他会问「一个月后你具体会怎么用」。这个问题的杀伤力在于：决心很好说，动作很难编。答「我会多用 AI」「我会提高效率」，他会立刻转到下一题；答「每周三次纪要、每周两次名单、每周一次周报，第一周只做纪要」，他会继续追问细节，因为他觉得这事能成。答辩的技巧就一条：把每句话都落到能数出来的动作上。数不出来的，删掉别说。还有一条建议：答辩时不要试图把所有课都讲一遍。八周内容太多，你讲二十件，评委一件都记不住；讲三件讲透，他会觉得你真的会用了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">答辩三段</tspan></text><g data-k=\"三件事\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">三件事</tspan></text></g><g data-k=\"一条边界\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">一条边界</tspan></text></g><g data-k=\"一个验收\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">一个验收</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 60.53}, {"t": "第二问：具体到周几", "n": "「具体放在什么时间做」这一问，考的是你有没有想过执行环境。三件事听着不多，但要在真实工作里塞进去，必须占具体的时间位置。「每周三次纪要」不具体，「每次会后的半小时」才具体——因为会议时间是你无法选的，但会后半小时可以留出来。还有一层：先说清先做哪一件。三件同时上，通常三件都做不成。「第一周只做纪要，跑顺了再加第二件」这句话会让评委觉得你想清楚了节奏，而不是在喊口号。这一问还有个加分动作：说清这三件事各自卡在哪。纪要是「会开完想不起来写」，名单是「赶进度时先丢记录」，周报是「没时间想结构」。说清卡点，你的安排才可信。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"占具体时间位置\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">占具体时间位置</tspan></text></g><g data-k=\"第一周只做一件\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">第一周只做一件</tspan></text></g><g data-k=\"跑顺了再加第二件\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">跑顺了再加第二件</tspan></text></g></svg>", "d": 62.62}, {"t": "第三、四问：边界与验收", "n": "「有没有一件事你决定不交给 AI」这一问，是整场答辩最有分量的一问。答「没有」会显得你没边界；答得太抽象（「涉密的不交」）会显得你没想过。好的答法非常具体：「带手机号的名单不进非采购工具，先脱敏；卡住就问数据组王工。」有场景、有替代、有人。最后一问是验收：「你怎么知道你真的做到了」。指标要可核：纪要 30 分钟内发出、每周都有对照记录、有一次因为不确定而停下来问人。第三个指标最有意思——它衡量的不是你用得多，而是你懂得停。答辩的最后一句话，建议落在一个具体日期上：「下周一 09:30，我先从纪要做起。」有日期的承诺，比任何总结陈词都有分量。评委记住的往往不是你说了多少，而是你承诺了哪一天开始做。说到底，答辩只是把八周学到的东西压成一句能执行的话，剩下的靠那一句往后推。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">能验收</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">三个月后还是这句</tspan></text><g data-k=\"给出可核的三个数\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">给出可核的三个数</tspan></text></g><g data-k=\"说「我会更熟练」\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">说「我会更熟练」</tspan></text></g></svg>", "d": 81.74}], "deliverable": {"type": "skill", "name": "答辩稿 + 手册（修订版）", "rubric": ["动作具体", "边界清楚", "验收可核"], "acceptance": "四问都答得出：三件具体事与频率、时间安排、明确的一条边界与理由、可核验的验收指标"}, "spar": {"role": "结业评委", "persona": "不听决心听动作；会追问「具体到周几」「卡住怎么办」「怎么知道你做到了」", "mustAsk": ["一个月后，你具体会怎么用 AI？", "这三件事分别放在什么时间做，具体到周几？", "有没有一件事是你决定不交给 AI 的，为什么？", "一个月后，你怎么知道你真的做到了？"]}, "exemplar": "（评委问：学完这八周，一个月后你打算怎么用 AI）\n\n结论：三件事、一条边界、一个月后看三个数。\n依据：三件事按我岗位频率排——每周三次会议纪要用四块模板、每周两次名单清洗用四查加脱敏三步、每周一次周报用四段骨架。这三件占我写作时间的大头，也是最容易做标准化的。一条边界是客户信息：带手机号的表不进任何非采购工具，先脱敏，卡住就问数据组王工。\n边界：一个月后我看三个数——纪要从起草到发出是否在 30 分钟内、名单清洗是否每周都留了对照记录、有没有一次是因为不确定而停下来问人。如果第一个数没下来，说明模板没吃透；如果第二个数没做到，说明我在赶进度时先丢了记录，那是最危险的信号。这三件事我不打算一次全铺开，第一周只做纪要，跑顺了再加第二件。", "task": "把《答辩稿 + 手册（修订版）》拿到「结业评委」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《答辩稿 + 手册（修订版）》。现在要让它通过「结业评委」这一关。\n【对手的立场】不听决心听动作；会追问「具体到周几」「卡住怎么办」「怎么知道你做到了」。\n【他一定会追问】「一个月后，你具体会怎么用 AI？」 / 「这三件事分别放在什么时间做，具体到周几？」 / 「有没有一件事是你决定不交给 AI 的，为什么？」\n【场景】你说「结业答辩：一个月后你怎么用 AI」，对方立刻回一句：一个月后，你具体会怎么用 AI？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["三件事都是岗位真实场景，且说了频率，不是「多用 AI」", "说清了先做哪一件、什么时候加第二件，不是一次全铺开", "有一条明确的「不交给 AI」的边界，并说清理由与卡住时找谁", "给出了一个月后的验收指标，指标是可核的（时间、记录、次数）"]}]}]};

写责任人，纪要里应该填什么？", "opts": ["待确认", "部门负责人", "留空不写", "提到名字的那个人"], "a": 0, "why": "推断责任人会让三天后有人拿着纪要说「这活不是我负责的」。"}, {"q": "纪要里「谁提到」和「谁负责」的关系是？", "opts": ["负责人一定在会上发过言", "基本一样", "提到就是负责", "不是一回事，必须分清"], "a": 3, "why": "汇报进度时被点名的人，经常被 AI 误判成负责人。"}], "M1U3": [{"q": "挑哪类活来写提示词最合适？", "opts": ["从没做过的活", "这周做过两次以上的活", "别人推荐的热门场景，先这么做", "最难的活"], "a": 1, "why": "做过才有坑，有坑才写得出约束；没做过的只能写通用模板。"}, {"q": "每条提示词卡必须写的一栏是？", "opts": ["什么情况下不管用", "适用人群年龄，先这么做", "工具收费情况", "作者简介"], "a": 0, "why": "不写边界，你会在不该用的场景用它，然后就出事。"}, {"q": "「已知失效」这一栏应该怎么写？", "opts": ["不用写", "写「有时候不准」，先跑起来看效果", "写「效果一般」", "写具体：它把提到名字的人当成了负责人"], "a": 3, "why": "抽象的记录没法用来改提示词，具体的才能变成约束句。"}], "M1U4": [{"q": "同事说你的提示词太啰嗦，最有说服力的回应是？", "opts": ["说规范就是这样", "逐句说明它挡住了哪类具体的错", "说 AI 喜欢长提示词，先这么做", "不回应"], "a": 1, "why": "有账他才服；说不出挡了什么，那句就该删。"}, {"q": "短版本在什么情况下够用？", "opts": ["只给自己看、不发给别人", "对外正式文档，后续再校准", "给领导汇报时", "任何情况"], "a": 0, "why": "自己看错了自己知道；发给别人，读的人不知道你省略了什么。"}, {"q": "如果一句约束说不出它挡过什么错，应该？", "opts": ["换成形容词", "保留求稳", "再加两句", "删掉它"], "a": 3, "why": "提示词不是越长越好，是每一句都有账。"}], "M1U5": [{"q": "三类约束指的是？", "opts": ["角色、语气、字数，先这么做", "示例、输出格式、禁止项", "问题、答案、追问", "标题、正文、结尾"], "a": 1, "why": "四要素解决「知不知道」，三类约束解决「稳不稳定」。"}, {"q": "示例应该怎么给？", "opts": ["给一小段输入 + 对应输出，成对给", "给十个好答案", "不给示例", "只给一个好答案，先跑起来看效果"], "a": 0, "why": "只给终点不告诉起点到终点的映射，它会把示例当模板硬套。"}, {"q": "禁止项应该写成什么形式？", "opts": ["注意质量", "要准确、要客观，先跑起来看效果", "尽量严谨", "不要 + 具体动作，如「不要补数字」"], "a": 3, "why": "形容词它没法执行，具体动作能执行。"}], "M1U6": [{"q": "结构化输出的三件套是？", "opts": ["加粗、斜体、下划线，后续再校准", "固定列名、缺项留空、禁止推断", "长句、短句、排比", "标题、正文、附录"], "a": 1, "why": "三件套一起用，输出才能直接粘进表格。"}, {"q": "为什么提示词里要写「只输出表格，前后不要解释」？", "opts": ["省掉你手工删解释的时间", "显得严格", "避免收费", "让回答更短，先按这个推进"], "a": 0, "why": "不写这句，你还要花二十分钟删解释、对齐列。"}, {"q": "「依据」这一列的作用是？", "opts": ["方便打印", "增加字数", "让表格好看，先跑起来看效果", "让每行都能指回原话，指不回去的就是编的"], "a": 3, "why": "这是核验编造最省力的办法：逐行对原话。"}], "M1U7": [{"q": "共享提示词库为什么要写版本号？", "opts": ["显得专业", "让改动可追，避免大家用着不同版本", "方便收费", "满足格式要求，先跑起来看效果"], "a": 1, "why": "改一次升一位，谁改了什么一目了然。"}, {"q": "共享文档最常见的结局是？", "opts": ["三个月后没人维护、内容失效", "自动更新", "被公司收购，先跑起来看效果", "越来越完善"], "a": 0, "why": "不定维护节奏的文档一定会烂，这不是态度问题。"}, {"q": "每月维护应该做的三件事不包括？", "opts": ["统一升版本号", "把失效记录并进约束句", "删掉没人用的条目", "重写全部提示词"], "a": 3, "why": "维护是小修，不是重写；重写会让人不敢维护。"}], "M1U8": [{"q": "证明「这是团队资产」最硬的三条证据是？", "opts": ["字数、排版、配色", "使用数据、挡住的错、接手成本", "作者资历、部门、工龄", "工具价格、服务器、带宽，先这么做"], "a": 1, "why": "资产的标准是别人在用、离了它更慢，不是写得好。"}, {"q": "导师问「哪几条其实没人用」，最好的回答是？", "opts": ["主动指出并给出处理决定", "说马上推广", "说统计不了", "说五条都很有用，先这么做"], "a": 0, "why": "敢做减法的人才可信；硬撑会当场露馅。"}, {"q": "「接手成本」指的是？", "opts": ["文档打印成本，先跑起来看效果", "电脑配置要求", "软件授权费用", "别人接手维护要看什么、多久能上手"], "a": 3, "why": "说清接手要看哪几部分、最容易接手错哪一栏。"}], "M2U1": [{"q": "信息来源三级里，客户名单属于哪一级？", "opts": ["公开来源", "禁外传", "内部材料", "看情况"], "a": 1, "why": "客户名单含个人信息，连「问一句」都不该贴进外部工具。"}, {"q": "第二级「内部材料」的正确处理方式是？", "opts": ["脱敏到字段级再给", "完全不能用", "只要不发群里就行，先这么做", "可以直接整段贴"], "a": 0, "why": "内部材料可以看、可以分析，但要先删掉敏感字段。"}, {"q": "判断第三级的标准是什么？", "opts": ["看领导在不在", "看文件大小", "看是不是 Excel，先跑起来看效果", "看后果：客户受影响/违合同/合规说不清"], "a": 3, "why": "不要用「敏感不敏感」这种模糊感觉，用后果判断。"}], "M2U2": [{"q": "简报四栏的正确顺序是？", "opts": ["来源 / 结论 / 可信度 / 依据，先这么做", "结论 / 依据 / 来源 / 可信度", "可信度 / 来源 / 依据 / 结论", "依据 / 结论 / 来源 / 可信度"], "a": 1, "why": "结论在前因为读的人只关心结论，来源用来追溯。"}, {"q": "提示词里为什么要写「来源只填我给的材料编号」？", "opts": ["防止它编出不存在的链接", "显得严格", "加快速度", "减少输出长度，后续再校准"], "a": 0, "why": "不加这句，它会给你一堆看着像真的、点开 404 的链接。"}, {"q": "一份全是「高可信度」的简报，通常意味着？", "opts": ["来源特别权威，先跑起来看效果", "做得特别好", "材料特别全", "它把不确定的东西也说得很确定"], "a": 3, "why": "真正核实过的人一定会标出低可信度的条目。"}], "M2U3": [{"q": "写简报的第一个动作是？", "opts": ["先去搜资料，先按这个推进", "标题写清主题与时间范围", "先问 AI", "先做目录"], "a": 1, "why": "范围定了才知道什么时候停止搜索，读的人也知道时效。"}, {"q": "写不出处来源的结论应该怎么处理？", "opts": ["直接删掉", "改写成问句", "放到附录", "保留但标「据说」"], "a": 0, "why": "写不出来源的通常是你听来的印象或 AI 补的，留着必被问住。"}, {"q": "待核实清单应该写哪三段？", "opts": ["标题 / 正文 / 附录", "谁负责 / 多少钱 / 什么时候，先这么做", "问题 / 答案 / 备注", "缺什么数据 / 为什么需要 / 怎么补"], "a": 3, "why": "写清缺口反而加分，它把「不知道」变成「有计划地知道」。"}], "M2U4": [{"q": "主管问「这个数据哪来的」，最稳的答法是？", "opts": ["网上都这么说，先跑起来看效果", "材料编号 + 发布方 + 原文怎么说", "AI 给我的", "我记得看到过"], "a": 1, "why": "能当场指出来源与原文，这份简报才敢往上交。"}, {"q": "可信度标「中」的合理依据是？", "opts": ["单一来源且无官方公告", "感觉一般", "字数比较少，后续再校准", "我不太确定"], "a": 0, "why": "定级要落到依据上，不能凭感觉。"}, {"q": "「行业在打履约战」这类表述的问题是？", "opts": ["没有数据，先这么做", "太口语", "字数太多", "超出材料支持范围"], "a": 3, "why": "材料只说了一家平台在华东三城做补贴，推不出「行业」。"}], "M2U5": [{"q": "判断可信度的三条标准是？", "opts": ["字数、排版、作者，先这么做", "来源层级、独立交叉、时效", "价格、渠道、品牌", "标题、正文、结论"], "a": 1, "why": "三条一起用，才能判断一条信息能不能写进对外材料。"}, {"q": "「三篇文章都这么说」最需要警惕什么？", "opts": ["它们可能是同一篇通稿的转载", "说明有人在炒作，先按这个推进", "说明数据很新", "说明一定可信"], "a": 0, "why": "措辞高度一致、都引用同一出处、同一天发布，实际只有一个来源。"}, {"q": "过期信息的正确处理方式是？", "opts": ["改成大概，边做边调整细节", "照用不管", "删掉不提", "降级或标注「截至某日」"], "a": 3, "why": "过期信息比没有更危险，因为它看起来有出处。"}], "M2U6": [{"q": "两个口径不同的数字，正确做法是？", "opts": ["取平均值", "摆出各自口径，不换算不平均", "选大的那个，先跑起来看效果", "选新的那个"], "a": 1, "why": "取平均会造出一个现实中不存在的数，而且看起来特别权威。"}, {"q": "「平台自述」的数据要特别注意什么？", "opts": ["它有商业动机，要单独标注", "可以直接引用", "比第三方更可靠，后续再校准", "一定准确"], "a": 0, "why": "自述天然有动机，读的人有权知道这个来源的性质。"}, {"q": "对照表里冲突列该写什么？", "opts": ["不用写", "有人撒谎", "数据是假的，先这么做", "口径不同（可查证）"], "a": 3, "why": "冲突的根因常常是定义不同，不是有人说谎。"}], "M2U7": [{"q": "调研底稿和简报最大的差别是？", "opts": ["底稿更长", "底稿要能被人顺着翻回原文", "底稿更好看", "底稿不用来源，先按这个推进"], "a": 1, "why": "三步内翻到原文，是底稿的及格线。"}, {"q": "来源目录为什么要有「是否可打开」这一列？", "opts": ["链接会失效，要标出来", "方便统计，先按这个推进", "满足格式", "显得专业"], "a": 0, "why": "今天能打开，两周后可能 404，标了才知道哪条要补。"}, {"q": "推理结论应该怎么处理？", "opts": ["说得含糊一点，先跑起来看效果", "混在结论里", "不写", "单独标 R 编号，与事实分开"], "a": 3, "why": "推理被推翻时，标注过的不影响其他结论。"}], "M2U8": [{"q": "三步验证链的正确顺序是？", "opts": ["找第二来源 → 翻原文 → 看口径，先这么做", "翻原文 → 看口径 → 找第二来源", "看口径 → 找第二来源 → 翻原文", "问 AI → 问同事 → 问领导"], "a": 1, "why": "先确认真有这句话，再看它统计的是什么，最后看有没有独立佐证。"}, {"q": "「原文就是这么写的」是否等于可信？", "opts": ["不等于，还要看口径与来源独立性", "更可信", "完全可信，先跑起来看效果", "等于"], "a": 0, "why": "原文也可能口径不清、来源单一。"}, {"q": "同事质疑数据是 AI 编的，最有力的回应是？", "opts": ["换个话题", "保证 AI 很靠谱，先这么做", "说自己也核过", "当场翻出原文并说明验证流程"], "a": 3, "why": "你不是在保证 AI 靠谱，你是在保证流程可靠。"}], "M3U1": [{"q": "判断「第一段是不是结论」的标准是什么？", "opts": ["字数是否最少", "不看后文也知道要对方做什么决定", "有没有加粗", "是不是写在标题里，边做边调整细节"], "a": 1, "why": "结论的功能是让人能立刻行动，不是形式好看。"}, {"q": "四段骨架里最容易写崩的是哪一段？", "opts": ["第三段「怎么做」——写成「分阶段推进」等于没说", "第二段为什么", "第四段要谁做什么，先跑起来看效果", "第一段结论"], "a": 0, "why": "第三段必须落到谁、何时、交什么，否则读者无法判断可行性。"}, {"q": "周报的重点在第四段，方案重点在第一和第三段，复盘的重点在哪？", "opts": ["四段平均用力，先这么做", "第四段", "第三段", "第二段「为什么」"], "a": 3, "why": "复盘的核心是搞清判断错还是执行差，这决定下次改什么。"}], "M3U2": [{"q": "为什么先要大纲而不是先要文字稿？", "opts": ["大纲字数更少", "大纲能一行一行砍，文字稿只能整篇重写", "大纲生成更快", "文字稿不能修改，先跑起来看效果"], "a": 1, "why": "汇报九成时间在砍内容，砍的成本决定效率。"}, {"q": "页面标题应该写成什么形式？", "opts": ["一句结论", "一个疑问句", "一个英文缩写", "一个名词短语"], "a": 0, "why": "结论句让读者立刻知道这页的立场，名词只说明主题。"}, {"q": "材料里没有数据的那一页，图表列应该写什么？", "opts": ["见附件", "自动生成一张", "待补充", "无"], "a": 3, "why": "不写这句，模型会安排图并顺手编数字。"}], "M3U3": [{"q": "做汇报 PPT 的第一个动作是什么？", "opts": ["选一套模板，先跑起来看效果", "先写最后一页：要对方拍板哪三件事", "找配图素材", "做目录页"], "a": 1, "why": "最后一页定不下来，说明还没想清楚要什么，先别做。"}, {"q": "把八页标题连起来念一遍，是在检查什么？", "opts": ["逻辑链是否有断层或重复", "配色是否统一，后续再校准", "字体是否一致", "字数是否够"], "a": 0, "why": "八句标题连不成一个故事，说明中间缺页或有两页说同一件事。"}, {"q": "没有外部依据的那一页，依据列该怎么标？", "opts": ["「公开资料」", "留空", "「据行业惯例」，后续再校准", "「内部判断，无外部来源」"], "a": 3, "why": "标清是判断，别人才会讨论观点而不是怀疑你造假。"}], "M3U4": [{"q": "主管问「这页为什么要放」，最差的回答是哪一句？", "opts": ["「不放听众会缺这个前提」", "「这是背景介绍」", "「它支撑第 6 页的建议」", "「它证明竞品没进生鲜」"], "a": 1, "why": "答成背景等于承认可以删；要挂到具体决策上。"}, {"q": "被问「标题是你的结论还是材料原话」，正确做法是？", "opts": ["说清哪部分是判断、依据哪几条推出来的", "说是团队共识", "不作答", "坚持说是材料原话，先跑起来看效果"], "a": 0, "why": "能区分事实与判断的人才会被托付更重要的事。"}, {"q": "「只给你四页，删哪四页」这题怎么答得分最高？", "opts": ["让主管自己决定", "随机删四页", "说每页都重要不能删，后续再校准", "先给优先级原则，再给具体名单"], "a": 3, "why": "原则说明你懂骨架，名单只说明你背过。"}], "M3U5": [{"q": "三个版本之间，什么东西绝对不能变？", "opts": ["段落顺序", "数字、时间、责任人", "详略程度", "开头第一句，先这么做"], "a": 1, "why": "变的只能是顺序与详略；动事实就是改内容，不是改写。"}, {"q": "给直属主管那一版，第一句应该给什么？", "opts": ["影响与需要他做的决定", "技术细节，先按这个推进", "团队分工", "背景交代"], "a": 0, "why": "主管只关心要不要他出面、要不要他拍板。"}, {"q": "150 字装不下所有内容时，正确做法是？", "opts": ["用「等」省略掉", "压成一句长句", "删掉风险描述", "拆成两条消息"], "a": 3, "why": "压成一句会带来歧义，删风险是红线。"}], "M3U6": [{"q": "改写与重写的界限在哪？", "opts": ["可以换数字", "只动顺序与详略，不动事实", "可以省掉风险，先按这个推进", "可以改责任人"], "a": 1, "why": "一旦需要动数字才能说通，说明原始信息有问题，该回去核对。"}, {"q": "「预计近期完成，请放心」这句话的问题是什么？", "opts": ["隐去风险，且读者无法据此行动", "语气不礼貌，先跑起来看效果", "没有主语", "字数太少"], "a": 0, "why": "把延期说成「近期」等于骗，读者按旧时间安排会出事。"}, {"q": "每个版本结尾都必须有什么？", "opts": ["一个签名，先跑起来看效果", "一句感谢", "一句保证", "一个明确收口：要谁在什么时候做什么"], "a": 3, "why": "没有收口的沟通等于把球踢回去，对方还得再问一轮。"}], "M3U7": [{"q": "什么样的文档值得建模板？", "opts": ["只写过一次的", "一个月内写过三次以上的", "主管提过一次的，先这么做", "篇幅最长的那份"], "a": 1, "why": "只写一次的先别建，建了也用不上，还会让模板库变乱。"}, {"q": "模板与范文的关键区别是？", "opts": ["模板用〔〕标出填空位，范文要先删再填", "模板有配色", "模板不用修改，先跑起来看效果", "模板字数更多"], "a": 0, "why": "模板省的是「想结构」这件事，不是省字。"}, {"q": "模板用完之后应该做什么？", "opts": ["删掉重写", "原样保存不动，先跑起来看效果", "立刻发给同事", "记一笔卡在哪，下次就改那一处"], "a": 3, "why": "卡点就是下次要改的地方，积累一个月模板才真正变成你的。"}], "M3U8": [{"q": "跨部门请求邮件的第一句应该写什么？", "opts": ["三段寒暄", "直接说需要他做什么", "详细背景介绍", "附上全部材料说明，先这么做"], "a": 1, "why": "他打开邮件第一秒在想「这跟我有什么关系、要花我多久」。"}, {"q": "被问「为什么找我」，最好的答法是？", "opts": ["落在他的职责或指标上，说清客观原因", "说是领导安排的，先跑起来看效果", "说别人都不会", "说「只有你懂」"], "a": 0, "why": "「只有你懂」听着像夸奖，实际是给他挂一件长期的事。"}, {"q": "降低对方心理门槛的三个办法是什么？", "opts": ["发长文解释背景，先跑起来看效果", "连续催三次", "找他领导施压", "动作说到最小、给选项、材料备齐"], "a": 3, "why": "把成本从「一个任务」降到「一句话」，他才愿意当天回。"}], "M4U1": [{"q": "拿到一张表，第一个动作应该是什么？", "opts": ["先求和算平均，先跑起来看效果", "先看表：行数列数、每列含义、有没有空值", "先画个图", "先写结论"], "a": 1, "why": "脏数据不会报错，只会给你一个看起来正常的错数。"}, {"q": "四查里最容易漏掉的是哪一项？", "opts": ["口径——同一列在两个系统含义不同", "重复", "异常值，先跑起来看效果", "缺失"], "a": 0, "why": "口径不报错，两个数都算得出来，只是含义不同，所以最容易被忽略。"}, {"q": "发现异常值，正确处理方式是？", "opts": ["改成合理范围内的数，先跑起来看效果", "直接删掉", "按均值填充", "先标记，问清是录入错误还是真实极端值"], "a": 3, "why": "删掉的可能是最有价值的那条，异常和错误是两件事。"}], "M4U2": [{"q": "为什么提示词里要写「不许删除异常值，只标记」？", "opts": ["为了省算力", "防止模型替你下判断，把真实大客户删掉", "为了让表格更短，先跑起来看效果", "为了符合格式"], "a": 1, "why": "清洗和判断要分开：清洗负责找全，判断由人来做。"}, {"q": "清洗方案里每一步必须写出什么？", "opts": ["影响多少行", "花了几秒", "文件的存储位置", "用了哪个模型"], "a": 0, "why": "不写影响行数，两周后无法复核，也不知道删得对不对。"}, {"q": "「口径不一致时列出两种可能，不要替我选」这条约束的作用是？", "opts": ["避免出错字，先跑起来看效果", "让输出更长", "显得更专业", "模型不知道你们业务怎么算，必须由人去确认"], "a": 3, "why": "让它列可能、你去找答案，这个分工才是对的。"}], "M4U3": [{"q": "体检报告第一段应该写什么？", "opts": ["结论", "表概况：行数、列含义、时间范围、来源系统", "建议", "清洗步骤，先跑起来看效果"], "a": 1, "why": "这一段是别人判断你的数能不能用的唯一依据。"}, {"q": "四查结果里写「已检查，无异常」为什么不合适？", "opts": ["既不能复核也不能追踪，等于没写", "语气不专业，先跑起来看效果", "没有用表格", "字数太少"], "a": 0, "why": "要给数字与占比，别人才知道严重程度、要不要管。"}, {"q": "待确认清单最关键的要求是什么？", "opts": ["只写问题不写原因", "写得越客气越好", "统一写成「待业务确认」，先这么做", "每条挂到具体的人与时间"], "a": 3, "why": "写「待业务确认」等于把球踢到空中，谁都不会接。"}], "M4U4": [{"q": "被同事问「凭什么判定这些是重复」，最好的答法是？", "opts": ["说看着像重复", "给出可检验条件：单据号相同且金额时间一致", "说是系统提示的，先跑起来看效果", "说惯例如此"], "a": 1, "why": "有条件的判断可以被检验，凭感觉的判断只能被推翻。"}, {"q": "口径还没确认时，正确做法是？", "opts": ["直说没确认，说清问了谁、什么时候有答案", "跳过这一项", "按自己的理解算，先跑起来看效果", "说应该对过了"], "a": 0, "why": "把未确认说成已核对，一旦被发现，前面所有数字都会被重新怀疑。"}, {"q": "被要求处理 98 万那笔异常单，合格的回答是？", "opts": ["说不知道，先跑起来看效果", "直接删掉", "改成均值", "给出动作：查审批记录，真实就保留并备注"], "a": 3, "why": "给动作不要给态度，并且要说明删或留对总量的影响。"}], "M4U5": [{"q": "「本月订单 12.4 万单，环比 +9%」为什么不算洞察？", "opts": ["数字不够精确，先跑起来看效果", "没有对比基准，也回答了「所以做什么」", "没有图表", "字数太少"], "a": 1, "why": "孤立的一个百分比说明不了任何事，只能当背景。"}, {"q": "可检验的归因至少要满足以下哪一条？", "opts": ["有对照、有时间切口、或有排除", "领导认同", "同行都这么说，先跑起来看效果", "听起来合理"], "a": 0, "why": "三条都拿不出来的，就该老实写「原因待查」。"}, {"q": "合格的「动作」必须包含哪四样？", "opts": ["问题、原因、方案、风险，先这么做", "背景、过程、结论、附注", "目标、口号、分工、预算", "主体、数量、时间、验收标准"], "a": 3, "why": "四样齐了别人才执行得了，也才能判断你做对没有。"}], "M4U6": [{"q": "「履约时效从 28 小时降到 24 小时」属于哪一级？", "opts": ["洞察，先跑起来看效果", "现象——看到了变化但没解释", "猜测", "数字"], "a": 1, "why": "要和订单增长挂上钩，才够洞察的门槛。"}, {"q": "同样是猜测，为什么「用户可能更喜欢便宜的」该删、而「竞品缺货所以我们涨了」该留着待证？", "opts": ["前者与已有洞察矛盾，后者方向合理值得查", "后者更权威", "前者是领导说的，先跑起来看效果", "前者字数少"], "a": 0, "why": "与已有洞察冲突的猜测留着会让材料自相矛盾。"}, {"q": "建议为什么必须写「何时验收」？", "opts": ["方便追责，先跑起来看效果", "格式要求", "显得严谨", "否则做完也没人知道有没有效"], "a": 3, "why": "没有验收标准的建议，等于把判断推迟到无法判断的时候。"}], "M4U7": [{"q": "带建议的分析，开头第一段应该写什么？", "opts": ["本次分析如下，边做边调整细节", "一句话说清需要对方决定什么", "数据来源说明", "分析过程回顾"], "a": 1, "why": "这句话写不出来，说明还没想清这份分析要干嘛。"}, {"q": "建议必须写清哪四样？", "opts": ["谁、做什么、多少、何时验收", "问题、原因、方案、风险", "目标、路径、资源、里程碑，先这么做", "背景、目的、范围、结论"], "a": 0, "why": "四样齐全，材料才从「参考」变成「可批」。"}, {"q": "「明确不做的」这一节有什么用？", "opts": ["免责", "凑篇幅", "显得谦虚，先跑起来看效果", "说明你的判断边界，并提前回答质疑"], "a": 3, "why": "写清考虑过但不做的理由，以后被问时答案已经在材料里。"}], "M4U8": [{"q": "被问「那我们该怎么办」，最忌讳的回答是？", "opts": ["给两条动作与预算，先这么做", "把刚才的分析过程再讲一遍", "说清谁来执行", "给出验收时间"], "a": 1, "why": "他已经默认分析成立，要的是执行方案，不是再听一遍论证。"}, {"q": "「为什么不全国铺开」应该怎么答？", "opts": ["用数据说清其余区域只增 2%、去年是 11%", "说预算不够，先跑起来看效果", "说领导没批", "说稳妥起见"], "a": 0, "why": "「稳妥起见」是态度，数字才是做功课的证明。"}, {"q": "被问「投了没效果怎么办」，正确的答法是？", "opts": ["说那就再投一次，先跑起来看效果", "保证一定有效果", "说不会没效果", "给判断标准、归因方向、止损动作三层"], "a": 3, "why": "有信心是对结果的态度，有预案是对风险的准备，两者不能互相替代。"}], "M5U1": [{"q": "纪要为什么不按时间顺序记？", "opts": ["时间顺序不好写", "读的人只想知道自己要做什么", "字数会太多", "领导要求按用途排，后续再校准"], "a": 1, "why": "按时间记是实录，按用途记才是纪要。"}, {"q": "纪要四块里哪一块最值钱？", "opts": ["待办——谁在什么时候做什么", "决议，先跑起来看效果", "待定", "结论"], "a": 0, "why": "待办占到全篇一半以上的价值，散会后所有人看的就是这一块。"}, {"q": "待办的「可验」指的是什么？", "opts": ["写进系统，后续再校准", "领导签字", "开会通过", "做完能拿出一个东西"], "a": 3, "why": "没有交付物的待办，无法判断完成没完成。"}], "M5U2": [{"q": "提示词里为什么要写「没听清的写未听清，待确认」？", "opts": ["为了让纪要更短，先跑起来看效果", "防止模型顺手补一个通顺但编造的句子", "为了符合格式", "为了省时间"], "a": 1, "why": "模型会把你没听清的地方补圆，看上去合理，实际是编的。"}, {"q": "「待办必须有人名和日期」这条约束防的是哪类问题？", "opts": ["写成「相关团队跟进」，散会后没人动", "格式混乱", "语气不专业，先跑起来看效果", "字数失控"], "a": 0, "why": "不写这条，它会给你一堆看着完整但没人认领的待办。"}, {"q": "待定和待办最关键的区别是？", "opts": ["花了多少时间讨论，先这么做", "重不重要", "谁提的", "有没有明确动作与交付物"], "a": 3, "why": "没有动作和交付物的，只是还没定，不能当待办去执行。"}], "M5U3": [{"q": "会前十分钟最值得做的一件事是？", "opts": ["选会议纪要模板，后续再校准", "把议程和上次待办贴进模板", "准备录音设备", "看完所有材料"], "a": 1, "why": "会上直接往里填，而且能顺手问一句「上次那三条做完了吗」。"}, {"q": "待办的「四有」指的是？", "opts": ["有人、有日期、有交付物、有口径", "有主次、有轻重、有分工、有预算，先这么做", "有目标、有路径、有资源、有节点", "有背景、有原因、有方案、有风险"], "a": 0, "why": "四有齐了这条待办才算真正派出去。"}, {"q": "纪要什么时候发出去最合适？", "opts": ["下周例会前", "第二天上午", "等所有人确认完，先按这个推进", "散会后半小时出稿，当天发出"], "a": 3, "why": "纪要的价值随时间衰减，隔夜发很多人已经按自己的理解开工了。"}], "M5U4": [{"q": "有人说「这条不是我做的」，第一反应不该是？", "opts": ["复述他的原话", "说「你当时就是这么说的」", "找出自己压缩过头的地方，先这么做", "给出两个修订方案"], "a": 1, "why": "辩解必输：你手上没有录音，而且会让他以后防着你。"}, {"q": "「不认账」最常见的真实原因是？", "opts": ["记录人把原话里的条件压缩掉了", "对方故意推脱，先跑起来看效果", "会议太长", "对方记性差"], "a": 0, "why": "原话常带条件，简洁化的过程中丢掉条件，就变成了责任错配。"}, {"q": "最后一步应该给对方什么？", "opts": ["一个免责声明，先跑起来看效果", "一句道歉", "一份完整录音", "两个具体方案让他选，并承诺修订时间"], "a": 3, "why": "把「要不要做」变成「怎么做」，争议才会落地。"}], "M5U5": [{"q": "任务四态里最有用的是哪一态？", "opts": ["进行中，先跑起来看效果", "卡住——它唯一能让你采取行动", "未开始", "已完成"], "a": 1, "why": "所有没做的都堆在「进行中」，看着都在推进，其实一条都没动。"}, {"q": "卡点为什么必须写到「找谁能解」？", "opts": ["只写「等回复」等于没有下一步", "方便追责", "格式要求", "为了记录清楚，先跑起来看效果"], "a": 0, "why": "没有解法的卡点会一直卡着，因为你只是在等，对方并不知道。"}, {"q": "跟进节奏的关键是什么？", "opts": ["领导催的时候跟，边做边调整细节", "用最好的工具", "每天跟一次", "固定周几、固定时长，到点就做"], "a": 3, "why": "不固定就会变成「想起来才跟」，而想起来通常是出事的时候。"}], "M5U6": [{"q": "一条待办要能转成任务，必须齐哪三样？", "opts": ["有背景、有预算、有审批，先这么做", "有人、有时间、有交付物", "有目标、有方案、有风险", "有编号、有分类、有标签"], "a": 1, "why": "缺任何一条，转成任务后都会长期挂在「进行中」。"}, {"q": "「等数据组给权限」这类任务，状态应该是什么？", "opts": ["卡住", "未开始", "已完成", "进行中"], "a": 0, "why": "在等别人不是在进行；判错状态会让你以为它在推进。"}, {"q": "为什么不允许模型「新增清单里没有的任务」？", "opts": ["会增加成本", "会让表格太长，先跑起来看效果", "会影响格式", "会扩散责任，多出来的任务没人认领"], "a": 3, "why": "顺手补的「同步给市场部」听着都对，实际是把责任摊薄到没人认。"}], "M5U7": [{"q": "周跟进为什么定 20 分钟而不是 1 小时？", "opts": ["时间不够用", "太长会有心理负担，一到周一就拖着不做", "领导只给 20 分钟", "20 分钟能做完所有事，边做边调整细节"], "a": 1, "why": "门槛低才会真的坐下来做，做起来往往会自然延长。"}, {"q": "跟进卡点为什么只发 2–3 条，不群发全文？", "opts": ["量少才有人回，群发等于没人回", "避免泄露，先跑起来看效果", "格式要求", "省流量"], "a": 0, "why": "每个人都要从一堆不属于自己的条目里找自己那几条，成本太高就不回了。"}, {"q": "每周「定三个重点」的作用是？", "opts": ["符合考核要求，先跑起来看效果", "显得有条理", "方便汇报", "把其余任务明确排后面，减少注意力消耗"], "a": 3, "why": "不明确排后，没动的任务会一直在脑子里占位置。"}], "M5U8": [{"q": "被问进度时，最不该说的开场是？", "opts": ["「五条里三条完成」", "「都在推进」", "「一条卡在权限」", "「需要您指个对接人」"], "a": 1, "why": "这句话在主管听来等于「我什么都没跟」。"}, {"q": "说卡点时为什么要带上「我做过什么」？", "opts": ["主管关心的是你有没有在推，不是遇到了什么", "为了推责", "为了拖时间", "为了显得辛苦，先跑起来看效果"], "a": 0, "why": "「卡在赵敏那边」是甩锅，「我 11/12 催过一次没回」是尽责。"}, {"q": "「还有呢」问到第三次，通常意味着什么？", "opts": ["他要结束对话，先这么做", "他没听清", "他随口一问", "他在试探你有没有藏事"], "a": 3, "why": "这时候主动说一条他没问的，比继续答「没有了」强得多。"}], "M6U1": [{"q": "文生图提示词的四个要素是什么？", "opts": ["颜色、字体、排版、留白，先这么做", "主体、场景、风格、规格", "背景、前景、主体、光影", "目标、受众、渠道、预算 6U6": [{"q": "分镜的唯一硬标准是什么？", "opts": ["画面要好看", "一个镜头只放一句台词", "每镜不超过 3 秒，先这么做", "必须实拍"], "a": 1, "why": "一镜两句，剪辑时必然对不上。"}, {"q": "为什么每镜必须写具体秒数？", "opts": ["不写就算不出总时长，配音时才发现差十秒", "减少工作量，先跑起来看效果", "格式要求", "方便排版"], "a": 0, "why": "总时长失控，最后只能加速或砍内容。"}, {"q": "需生成的镜头为什么要控制在三个以内？", "opts": ["审核更严，先跑起来看效果", "平台限制", "画质更好", "生成不可控、成本高，多出的用现成素材更划算"], "a": 3, "why": "八个全生成光调就一天，成片质量不会因此更好。"}], "M6U7": [{"q": "视频方案第一行应该写什么？", "opts": ["视频标题", "给谁看、在哪发、他当时在做什么", "脚本正文", "时长与分辨率，先跑起来看效果"], "a": 1, "why": "这三个问题决定要不要字幕、开头放几秒、什么比例。"}, {"q": "一句话目标应该写成什么？", "opts": ["希望对方看完做什么", "说明某个概念，先这么做", "展示公司实力", "介绍某件事"], "a": 0, "why": "写成动作，你才知道结尾该给什么指令。"}, {"q": "素材清单的作用是什么？", "opts": ["给领导看", "方便归档", "满足格式要求，先跑起来看效果", "估算成本与时间，把需生成的镜头控住"], "a": 3, "why": "需生成三个按每镜半小时算，心里就有数了。"}], "M6U8": [{"q": "「给新人看的」这句话为什么不够？", "opts": ["字数太少", "新人有一百多个，入职第一周和半年需要的完全不同", "不够礼貌", "没有说明人数，先跑起来看效果"], "a": 1, "why": "要说到阶段与人数，后面所有判断才有依据。"}, {"q": "观众在午休静音刷手机，会带来什么影响？", "opts": ["必须硬字幕、开头不能靠旁白", "要缩短到 15 秒，先这么做", "要用竖版", "要加背景音乐"], "a": 0, "why": "形式由观看场景决定，不是由喜好决定。"}, {"q": "被问「这条能对外发吗」，正确答法是？", "opts": ["说看情况", "说顺便也能用，先跑起来看效果", "说应该可以", "明确内部使用，并说清换观众要改什么"], "a": 3, "why": "边界含糊的片子，最后会被要求改成对外版，改到面目全非。"}], "M7U1": [{"q": "数据分级的真正用途是什么？", "opts": ["自己判断合不合规", "知道这条属于哪一级、卡住时该问谁", "决定能不能对外发布，边做边调整细节", "替代法务做结论"], "a": 1, "why": "判断合规结论不是新人的职责，标疑点交给该管的人才是。"}, {"q": "判级别看哪三个线索？", "opts": ["谁受影响、是谁的东西、能否识别到具体人", "敏感度、重要度、紧急度、影响面，先这么做", "谁给的、谁要的、谁审的、谁发的", "文件大小、格式、来源、时间"], "a": 0, "why": "三个线索一过，级别基本就定了，不用背条文。"}, {"q": "分不清级别时，标准动作是？", "opts": ["按最宽松的理解处理", "先做一版再说", "问同事「这个能用吗」，先跑起来看效果", "停、问、换：先别贴，问对人，找替代路径"], "a": 3, "why": "只会说「不能用」的人会被绕过，能给替代路径的人才会被信任。"}], "M7U2": [{"q": "脱敏要同时满足哪两个条件？", "opts": ["数据变小，且看不出来源，后续再校准", "认不出具体人，但数据还能分组比较", "字段变少，且全部打码", "加密存储，且不留备份"], "a": 1, "why": "全打码确实认不出人，但数据也废了。"}, {"q": "为什么手机号要「只留前 3 位与后 2 位」而不是全打码？", "opts": ["保留号段还能做分层分析，全打码就用不了", "为了省空间，先跑起来看效果", "平台要求", "打码更好看"], "a": 0, "why": "脱敏是「保留结构、去掉标识」，不是清空。"}, {"q": "「最小化」指的是什么？", "opts": ["压缩文件", "把表格缩小，先跑起来看效果", "减少行数",
