点</tspan></text></g><g data-k=\"发卡点：2–3 条，单独发\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">发卡点：2–3 条，单独发</tspan></text></g><g data-k=\"定重点：3 条，其余排后\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">定重点：3 条，其余排后</tspan></text></g><g data-k=\"记一行：漏了什么\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">记一行：漏了什么</tspan></text></g></svg>", "d": 66.17}], "deliverable": {"type": "skill", "name": "个人周跟进节奏表", "rubric": ["时间固定", "动作明确", "有执行记录"], "acceptance": "一份节奏表：固定时间与时长、三个动作写清、有连续四周的执行记录"}, "practice": {"steps": ["定时间：固定每周一上午，20 分钟，写进日历并设提醒", "过表：把所有任务改一遍状态，卡住的补卡点，完成的归档", "发卡点：只把卡住的 2–3 条单独发给相关人，不发全文", "定重点：从本周要动的任务里挑 3 条作为本周重点，其余排后面", "记一笔：这周漏了什么、为什么漏，写一行，下周改"], "exemplar": "【小林 · 周跟进节奏表 v1】\n建立日期：2026-11-10　执行起点：11/11（周一）\n\n■ 一、固定时间\n每周一 09:30–09:50（20 分钟），日历已建重复日程，提前 10 分钟提醒。\n地点：工位，不约会议。原则：这 20 分钟不接活、不开会、不看群。\n\n■ 二、三个动作（按顺序做，各占时间）\n动作 1｜过表（8 分钟）\n　把所有任务改一遍状态：未开始 / 进行中 / 卡住 / 已完成。\n　规则：连续两周「进行中」但没动过的，一律改成「卡住」，并写清卡在哪。\n动作 2｜发卡点（7 分钟）\n　只挑 2–3 条卡住的，单独发给对应的人，一条一句话：\n　「王工，名单权限那条我 11/12 要用，现在能确认吗？」\n　不发全文、不群发、不带情绪。\n动作 3｜定重点（5 分钟）\n　从本周要动的任务里挑 3 条作为本周重点，写在便签上贴屏幕边。\n　其余任务排后面，本周不主动推进。\n\n■ 三、执行记录\n第 1 周（11/11）\n　过表：12 条任务，改状态 5 条；把「跟进试点效果」从进行中改成卡住（缺验收指标）。\n　发卡点：发了 2 条（名单权限、平台规则），当天回了 1 条。\n　定重点：券方案、名单、执行单。\n　漏了什么：忘了看上周五新增的一条临时任务。\n　下周改：过表前先翻一遍上周所有群消息里的 @我。\n\n第 2 周（11/18）\n　过表：14 条，改状态 6 条；归档 4 条。\n　发卡点：发了 3 条，回了 2 条，1 条升级到主管。\n　定重点：试点执行、复盘口径、12 月计划初稿。\n　漏了什么：没漏。\n　下周改：把「升级到主管」这一动作也写进卡点模板。\n\n第 3 周（11/25）\n　过表：11 条，改状态 4 条；有一条连续三周进行中，改成卡住并退回。\n　发卡点：发了 2 条。\n　定重点：试点数据回收、复盘初稿、12 月计划。\n　漏了什么：忘了给张颖的券方案反馈。\n　下周改：定重点时顺手看一遍「等别人给我反馈」的条目。\n\n第 4 周（12/02）\n　过表：9 条，能动的 5 条，其余排期。\n　发卡点：发了 2 条。\n　定重点：复盘、12 月计划、试点是否扩围。\n　漏了什么：无。\n　结论：四周里漏事从 1 件降到 0 件；「连续两周进行中」的任务从 4 条降到 0 条。\n\n■ 四、这个节奏为什么有效\n· 固定时间让它不需要决定，不需要决定就不会拖。\n· 只发 2–3 条卡点，别人愿意回；发全文没人看。\n· 每周只定 3 个重点，剩下的明确排后面，减少心理负担。"}, "task": "产出《个人周跟进节奏表》：定时间：固定每周一上午，20 分钟，写进日历并设提醒；过表：把所有任务改一遍状态，卡住的补卡点，完成的归档；发卡点：只把卡住的 2–3 条单独发给相关人，不发全文；定重点：从本周要动的任务里挑 3 条作为本周重点，其余排后面；记一笔：这周漏了什么、为什么漏，写一行，下周改", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M5 用 AI 开会、记纪要、跟任务」模块，你要交付的是《个人周跟进节奏表》。\n【场景】业务侧这周的诉求是：跟踪不靠记性，靠一个固定到不需要决定的时间点。参考做法：同一个人，加了周一 20 分钟过表后，漏事从每周三件降到零。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（周跟进三步（过表 / 发卡点 / 定重点）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《个人周跟进节奏表》填写模板】\n\n■ 1. 定时间：固定每周一上午，20 分钟，写进日历并设提醒\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 过表：把所有任务改一遍状态，卡住的补卡点，完成的归档\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 发卡点：只把卡住的 2–3 条单独发给相关人，不发全文\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 定重点：从本周要动的任务里挑 3 条作为本周重点，其余排后面\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 记一笔：这周漏了什么、为什么漏，写一行，下周改\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【小林 · 周跟进节奏表 v1】\n建立日期：2026-11-10　执行起点：11/11（周一）\n\n■ 一、固定时间\n每周一 09:30–09:50（20 分钟），日历已建重复日程，提前 10 分钟提醒。\n地点：工位，不约会议。原则：这 20 分钟不接活、不开会、不看群。\n\n■ 二、三个动作（按顺序做，各占时间）\n动作 1｜过表（8 分钟）\n　把所有任务改一遍状态：未开始 / 进行中 / 卡住 / 已完成。\n　规则：连续两周「进行中」但没动过的，一律改成「卡住」，并写清卡在哪。\n动作 2｜发卡点（7 分钟）\n　只挑 2–3 条卡住的，单独发给对应的人，一条一句话：\n　「王工，名单权限那条我 11/12 要用，现在能确认吗？」\n　不发全文、不群发、不带情绪。\n动作 3｜定重点（5 分钟）\n　从本周要动的任务里挑 3 条作为本周重点，写在便签上贴屏幕边。\n　其余任务排后面，本周不主动推进。\n\n■ 三、执行记录\n第 1 周（11/11）\n　过表：12 条任务，改状态 5 条；把「跟进试点效果」从进行中改成卡住（缺验收指标）。\n　发卡点：发了 2 条（名单权限、平台规则），当天回了 1 条。\n　定重点：券方案、名单、执行单。\n　漏了什么：忘了看上周五新增的一条临时任务。\n　下周改：过表前先翻一遍上周所有群消息里的 @我。\n\n第 2 周（11/18）\n　过表：14 条，改状态 6 条；归档 4 条。\n　发卡点：发了 3 条，回了 2 条，1 条升级到主管。\n　定重点：试点执行、复盘口径、12 月计划初稿。\n　漏了什么：没漏。\n　下周改：把「升级到主管」这一动作也写进卡点模板。\n\n第 3 周（11/25）\n　过表：11 条，改状态 4 条；有一条连续三周进行中，改成卡住并退回。\n　发卡点：发了 2 条。\n　定重点：试点数据回收、复盘初稿、12 月计划。\n　漏了什么：忘了给张颖的券方案反馈。\n　下周改：定重点时顺手看一遍「等别人给我反馈」的条目。\n\n第 4 周（12/02）\n　过表：9 条，能动的 5 条，其余排期。\n　发卡点：发了 2 条。\n　定重点：复盘、12 月计划、试点是否扩围。\n　漏了什么：无。\n　结论：四周里漏事从 1 件降到 0 件；「连续两周进行中」的任务从 4 条降到 0 条。\n\n■ 四、这个节奏为什么有效\n· 固定时间让它不需要决定，不需要决定就不会拖。\n· 只发 2–3 条卡点，别人愿意回；发全文没人看。\n· 每周只定 3 个重点，剩下的明确排后面，减少心理负担。", "rubric": ["时间写进了日历且有提醒，不是「打算每周跟一次」", "三个动作（过表 / 发卡点 / 定重点）各有具体做法与耗时", "卡点只发 2–3 条，不是把所有任务群发一遍", "有连续四周的执行记录，且写了每周漏了什么、怎么改"]}, {"id": "M5U8", "tier": "adv", "step": "spar", "title": "主管问进度：你跟得怎么样", "video": {"dur": "3.3min", "script": ["主管问进度，其实是在问「有没有需要我出面的事」", "进度三段（已完成 / 卡住与原因 / 下一步与需要你做的）", "「都在推进」与「三条完成、一条卡在权限、需要您打个招呼」的差别"]}, "ppt": {"method": "进度三段（已完成 / 卡住与原因 / 下一步与需要你做的）", "case": "「都在推进」与「三条完成、一条卡在权限、需要您打个招呼」的差别", "demo": "陪练说明：他会连问三次「还有呢」"}, "objective": "能在主管问进度时，用「已完成 / 卡住 / 下一步」三段答完，并给出需要他做的事", "transfer": "下周汇报前先用三段式写一遍自己的进度，把「需要您决定」那一条标出来", "vslides": [{"t": "陪练说明：他要的是卡点，不是过程", "n": "这一关的对手是直属主管，他会连问三次「还有呢」。这不是刁难，是他在确认你有没有藏事。新人最常犯的错是答「都在推进」，这句话在他听来等于「我什么都没跟」。正确答法是三段：第一段给数字——五条里三条完成、一条卡住、一条按计划下周动；第二段给卡点——卡在哪条、卡在谁那里、你催过没有；第三段给请求——需要他做什么。三段答完，通常三十秒。三十秒能说完，是因为你真的跟过；说不完，是因为你在回忆。这一个区别，他听得出来。还有一条纪律：不要在他问的时候现查数据。现查意味着你之前没跟，他会立刻察觉，后面的回答都会被怀疑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">进度三段</tspan></text><g data-k=\"完成几条\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">完成几条</tspan></text></g><g data-k=\"卡在哪条\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">卡在哪条</tspan></text></g><g data-k=\"需要你做什么\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">需要你做什么</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.14}, {"t": "第二段：卡点要说「我做过什么」", "n": "说卡点的时候有个细节很关键：一定要带你已经做过的动作。「卡在赵敏那边」是甩锅，「我 11/12 催过一次，没回」是尽责。同样的现状，两种说法得到完全不同的评价。因为主管关心的不是你遇到了什么，是你有没有在推。还有一个加分动作：说清这条卡住会连带影响什么。「它卡着，券的叠加规则就没法确认，执行单里那一栏只能空着」——这句话让他知道严重程度，也让他知道该多急。不说连带影响，他会以为只是一条待办慢了两天。这一段的顺序也别乱：先说卡在谁那，再说你做过什么，最后说连带影响。反过来讲，听起来像在解释。顺序对了，他听的是进度；顺序错了，他听的是借口。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"卡在谁：写名字\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">卡在谁：写名字</tspan></text></g><g data-k=\"我做过什么：催过几次\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">我做过什么：催过几次</tspan></text></g><g data-k=\"连带影响什么：说清后果\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">连带影响什么：说清后果</tspan></text></g></svg>", "d": 66.19}, {"t": "第三段：敢开口要支持", "n": "最后一段最容易被跳过：「需要您做什么」。很多人不敢开口，觉得找主管帮忙显得自己无能。恰恰相反，主管最怕的是下属什么都不说，最后事情烂在他不知道的地方。开口要支持的正确方式有三样：具体要什么（指一个对接人）、为什么需要他（我催过没用）、不给会怎样（那条会一直卡着）。三样说完，他一般会当场处理，因为成本很低。还有一问要主动答：「还有呢」——他没问但该知道的风险，你自己说出来。主动交代的风险是可控的，被问出来的风险是不受控的，这两者在他心里的分量完全不同。「还有呢」问到第三次，通常就是他在试探你有没有藏事。这时候主动说一条他没问的，比继续答「没有了」强得多。三段答完就停，不要主动补充过程，他要问自然会问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">可控</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">不受控</tspan></text><g data-k=\"主动交代风险\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">主动交代风险</tspan></text></g><g data-k=\"等他问出来\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">等他问出来</tspan></text></g></svg>", "d": 67.1}], "deliverable": {"type": "skill", "name": "进度汇报（三段）", "rubric": ["有数字", "卡点清楚", "敢要支持"], "acceptance": "四问都答得出：完成与未完成的清单、卡点与已做的动作、明确需要主管做的事、主动交代未上报的风险"}, "spar": {"role": "直属主管", "persona": "只问结果和卡点，会连问「还有呢」直到你说不出；听到「都在推进」会明显不耐烦", "mustAsk": ["上周那几条，跟得怎么样？", "卡住的是哪条，卡在谁那里，你催过没有？", "需要我做什么？", "还有呢？除了这几条，还有没有我不知道的事？"]}, "exemplar": "（主管问：上周那几条，跟得怎么样）\n\n结论：五条里三条完成、一条卡住、一条按计划下周动。\n依据：券方案 11/10 出了，名单 11/11 到了但只有两个城市，执行单 11/13 发群了；卡住的是平台规则那条，赵敏说对接人一直没定，我 11/12 催过一次没回。\n边界：需要您做一件事——帮我在平台那边指一个对接人，不然这条会一直卡着，而它卡着，券的叠加规则就没法确认，试点执行单里那一栏只能空着。其余两条我自己能推，下周同一时间我再报一次。", "task": "把《进度汇报（三段）》拿到「直属主管」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《进度汇报（三段）》。现在要让它通过「直属主管」这一关。\n【对手的立场】只问结果和卡点，会连问「还有呢」直到你说不出；听到「都在推进」会明显不耐烦。\n【他一定会追问】「上周那几条，跟得怎么样？」 / 「卡住的是哪条，卡在谁那里，你催过没有？」 / 「需要我做什么？」\n【场景】你说「主管问进度：你跟得怎么样」，对方立刻回一句：上周那几条，跟得怎么样？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["开头就给完成数（三条完成、一条卡住），不说「都在推进」", "卡点写到人和已做的动作（催过一次没回），不是只说「在等」", "明确说出需要主管做的一件事，并说明不做会怎样", "主动交代他没问但该知道的风险，不等他追问"]}]}, {"id": "M6", "title": "M6 用 AI 做图与做视频", "dims": ["content", "tools", "prompt"], "units": [{"id": "M6U1", "tier": "basic", "step": "understand", "title": "文生图提示词四要素", "video": {"dur": "3.5min", "script": ["图不对，九成不是模型不行，是提示词少了一半信息", "四要素（主体 / 场景 / 风格 / 规格）", "「来一张科技感的图」与四要素齐全的提示词，出图差别有多大"]}, "ppt": {"method": "四要素（主体 / 场景 / 风格 / 规格）", "case": "「来一张科技感的图」与四要素齐全的提示词，出图差别有多大", "demo": "四要素卡：拿 6 条常见提示词各补缺项"}, "objective": "能用「主体 / 场景 / 风格 / 规格」四要素写出一条文生图提示词，并说清每一条缺了会怎样", "transfer": "把手上要用的三张配图各写一条四要素提示词，先不生成，拿去请做设计的同事挑毛病", "vslides": [{"t": "图不对，通常是缺了一半信息", "n": "新人写文生图提示词，最常写的是「来一张科技感的配图」。出来的图往往不能怪模型，因为这句话里只有风格，没有主体、没有场景、没有规格。模型只能自己编，编出来的东西当然不对。四要素是：主体（画面里是谁、在做什么）、场景（在哪、周围有什么）、风格（写实还是插画、什么质感）、规格（多大比例、留白在哪、要不要留文字区）。四样里最容易被漏的是规格，而它恰恰最影响能不能用——你要的是横版封面，它给你一张方图，构图再美也得重做。还有个常见错误是「要素堆太多」：把十个形容词塞进去，模型只能随机挑几个，每次出来的都不一样。所以拿到一个出图需求，先别写提示词，先把这四样在纸上列一遍，列不全就先别生成。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">文生图四要素</tspan></text><g data-k=\"主体\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">主体</tspan></text></g><g data-k=\"场景\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">场景</tspan></text></g><g data-k=\"风格\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">风格</tspan></text></g><g data-k=\"规格\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">规格</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 66.19}, {"t": "四要素具体怎么写", "n": "主体要写成动作，不写名词。「一个职场人」不好，「一个年轻人在工位前看屏幕，手里拿着笔在记」就好。场景给一到两个环境线索就够，「开放式办公室，背景有白板和绿植」。风格要写到可复用：写实照片感、扁平插画、3D 渲染、水彩，再补质感与光，比如「柔和自然光，低饱和」。规格最容易漏：横版 16:9 还是竖版 3:4、主体偏左还是居中、右上角要不要留白放标题。写清这几项，出图可用率会明显上升。还有一条技巧：先定风格，再换主体。同一组图要看起来是一套，靠的是风格那一段一字不改，只换主体和场景。很多人做一组图做出来像六个来源，就是因为每次都在重写风格。还有一条经验：主体越具体，模型越不需要猜。它猜得越少，你返工越少。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 主体写成动作\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 主体写成动作</tspan></text></g><g data-k=\"② 场景给一两个线索\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 场景给一两个线索</tspan></text></g><g data-k=\"③ 风格写到可复用\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 风格写到可复用</tspan></text></g><g data-k=\"④ 规格写比例与留白\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 规格写比例与留白</tspan></text></g></svg>", "d": 71.06}, {"t": "三条红线：肖像、标识、版权", "n": "做图之前先记三条红线。第一，不生成真人肖像，尤其是名人、客户、同事的脸；「像某某明星」这种提示词一律不写，生成出来也不能用。第二，不生成带真实公司标识的画面，包括 logo、商标、产品外观；要示意就用抽象图形代替。第三，不把客户照片、未公开物料上传到外部工具，这一条和 M2 的信息分级是同一条线。还有两条实操提醒：免费版导出常带水印，对外物料不能用带水印的图；平台条款里对商用授权写得很细，做对外物料前先看一眼，别等发布后被要求下架。这三条不写在提示词里，是写在你的工作习惯里。这三条不出事的时候感觉不到，出事的时候就没有补救机会，所以只能提前守住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"不生成真人肖像\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不生成真人肖像</tspan></text></g><g data-k=\"不出现真实标识\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不出现真实标识</tspan></text></g><g data-k=\"不传客户素材\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不传客户素材</tspan></text></g><g data-k=\"商用先看授权\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">商用先看授权</tspan></text></g></svg>", "d": 71.86}], "deliverable": {"type": "skill", "name": "四要素提示词（3 条）", "rubric": ["四要素齐", "规格明确", "风格可复用"], "acceptance": "三条提示词四要素齐全，且能说出每条里哪一项是决定「能不能用」的关键"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】四要素（主体 / 场景 / 风格 / 规格）\n【为什么重要】图不对，九成不是模型不行，是提示词少了一半信息\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["每条都写清了主体做什么，不是只写一个名词", "规格（比例、留白位置、要不要留文字区）明确，不靠后期硬裁", "风格描述具体到可复用（质感、光、色系），不是「高级感」", "能说出四要素里哪一条最影响「能不能用」，并举例"]}, {"id": "M6U2", "tier": "basic", "step": "demo", "title": "生成一组风格统一的岗位配图", "video": {"dur": "3.3min", "script": ["一组图的价值在统一，不在单张好看", "风格锚 + 只换主体（一组六张）", "六张图看起来像六个来源，与一组六张像同一套的差别"]}, "ppt": {"method": "风格锚 + 只换主体（一组六张）", "case": "六张图看起来像六个来源，与一组六张像同一套的差别", "demo": "WorkBuddy 内跑一遍出图，对照 AI 原稿与人改稿"}, "objective": "能用一段固定的风格锚生成 6 张风格统一的岗位配图，并逐张判断能不能上线", "transfer": "把这套提示词存成模板，下次做配图只改主体那一段，风格锚一字不动", "vslides": [{"t": "演示准备：统一靠的是「锚」，不是运气", "n": "这次的活是给六个岗位场景各做一张配图，要求看起来是一套。新人的做法是一张一张写提示词，写完六条发现风格各不相同，因为每条都顺手改了风格词。正确做法是先写一段风格锚，六个字概括就是「一字不改」：颜色、风格、光、留白位置、比例，这五项定下来，六条提示词里原样复制。变的只有主体和场景。这样出来的图，即使某一张构图稍弱，放在一起仍然是一套。还有一条：先说清用途。这组图是放内部培训材料，还是对外物料？前者宽松，后者要过授权与水印检查。用途不同，规格与红线都不同，这一步不先问清，做完很可能全部推翻。顺序上还有个小技巧：先只生成一张，确认风格对了再批量出剩下的五张。这一步一分钟，省不得。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这一步的顺序</tspan></text><g data-k=\"定用途\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">定用途</tspan></text></g><g data-k=\"写风格锚\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">写风格锚</tspan></text></g><g data-k=\"只换主体\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">只换主体</tspan></text></g><g data-k=\"逐张判可用\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">逐张判可</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">用</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 69.24}, {"t": "跑一遍：哪一类图最危险", "n": "提示词里我加了一条「不要出现真实公司标识与可辨认人脸」，这条防的是最麻烦的两类问题。第一类是肖像：AI 生成的脸看着是虚构的，但如果长得像某个真人，用出去就是侵权风险。第二类是标识：它会把「科技感」画成某个熟悉的界面或者产品外形，看着挺像，实际是在用别人的东西。跑完你会看到另一类更隐蔽的问题：图里出现了「像数据的数据」。比如屏幕上有一串像账号的字符、柱状图上标着具体百分比。这些数字是模型随手画的，但对读者来说它看起来就是真实数据。一张图带一个假数字，比一段文字带假数字更糟，因为图会被截图转发，脱离了上下文。所以出图后第一件事是放大看图里的文字和数字，凡是能读出内容的地方都要检查。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：6 个岗位场景 + 一段风格锚\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：6 个岗位场景 + 一段风格锚</tspan></text></g><g data-k=\"约束：锚一字不改 / 无可辨认人脸 / 无真实标识 / 留白 1/4\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：锚一字不改 / 无可辨认人脸 / 无真实标识 / 留白 1/4</tspan></text></g><g data-k=\"产出：6 条提示词 + 可用性判断\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：6 条提示词 + 可用性判断</tspan></text></g></svg>", "d": 70.39}, {"t": "人工收口：逐张判「能用 / 改哪里能用」", "n": "跑完最重要的一步不是生成，是判断。逐张过，每张给一个结论：能用、不能用、或者改哪里能用。判断标准有四条：留白够不够放标题、有没有像数据的数据、有没有可辨认人脸与标识、画的东西跟要讲的那句话对不对得上。第四条最容易忽略：一张很漂亮的图，如果和这一页要讲的内容没关系，它只是占位。最后做一次统一性检查：把六张缩略图并排放，退后三步看，如果它们看起来像一套，这组图就成立了；如果有一张跳出来，重出那一张，不要重出六张。统一性检查只花一分钟，却能省掉整组图重做的半天，这一步千万不要省。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"留白够放标题\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">留白够放标题</tspan></text></g><g data-k=\"没有假数据\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">没有假数据</tspan></text></g><g data-k=\"无人脸无标识\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">无人脸无标识</tspan></text></g><g data-k=\"图文对得上\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">图文对得上</tspan></text></g></svg>", "d": 56.78}], "deliverable": {"type": "skill", "name": "一组六张岗位配图", "rubric": ["风格统一", "规格可用", "红线不碰"], "acceptance": "六张图风格一致、规格一致、无肖像与标识、无水印，且逐张写了可用性判断"}, "demo": {"ref": "| # | 主体与场景 | 风格锚 | 右上留白 | 备注 |\n|---|---|---|---|---|\n| 1 | 一只手在笔记本上勾选清单，旁边一杯水 | 完全一致的风格锚 | 约 1/4 | 无人物正脸 |\n| 2 | 一只手把折线图贴在白板上，桌上有便签 | 同上 | 约 1/4 | 无人物正脸 |\n| 3 | 桌面上摊开的三页文档，旁边一支笔 | 同上 | 约 1/4 | 无人物正脸 |\n| 4 | 白板上贴着三张分工便签，箭头指向 | 同上 | 约 1/4 | 无文字内容 |\n| 5 | 一只手在两列数字之间比对，屏幕光 | 同上 | 约 1/4 | 数字不可辨认 |\n| 6 | 一个人背影站在投屏前（仅背影） | 同上 | 约 1/4 | 只有背影，无面部 |\n\n■ 可用性判断\n· 第 1、3、4 张可用：构图干净，右上留白够，无文字错误。\n· 第 2 张需重出：折线图画得太具体，像某个真实产品的界面，容易引起误解。\n· 第 5 张需重出：屏幕上的数字被画成了类似账号的字符，看起来像真实数据，必须避开。\n· 第 6 张可用但慎用：背影容易让人以为是某位同事，对外物料建议换掉。\n\n■ 统一性检查\n六条的风格锚一字未改，比例统一 16:9，右上留白均约 1/4，可直接套同一套模板。", "fix": ["把第 2 张重出：折线图太具体，看着像某个真实产品的界面，对外容易被误读成竞品截图。", "把第 5 张重出：屏幕上出现的字符像真实账号或数字，AI 图里出现「像数据的数据」是最危险的一类。", "六条里的风格锚一字未改，只换了主体；AI 原稿每条都悄悄改了风格词，六张图出来像六个来源。", "给每条补了「右上留白约 1/4」，原来没写，出图后标题压在人脸上，六张全得重做。"], "judge": "判断依据：风格锚是否一致；比例与留白是否统一；有没有「像数据的数据」；有没有可辨认人脸与真实标识", "sheet": {"situ": "你要给新人培训课件做 6 张岗位配图，要求看起来是一套。手上是 6 条提示词草稿，每条都有问题。你要逐条判断：缺哪一要素、会导致什么后果、该怎么补。", "ask": "① 逐条判定：缺哪一要素（主体/场景/风格/规格/红线）、会出什么问题、怎么补；② 让模型按一段风格锚重写 6 条提示词，风格锚一字不改；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请基于以上判定重写 6 条提示词：\n【风格锚（六条共用，一字不改）】扁平插画风格，蓝白为主色，浅灰背景，柔和侧光，大面积留白，无人物正脸，画面右上角留空用于放标题，横版 16:9。\n每条只改主体与场景，主体写成动作；不得出现指向真人的描述与真实公司标识。", "mats": [{"id": "G01", "src": "提示词草稿 1", "text": "来一张科技感的配图。\n没有主体、没有场景、没有规格，只有风格。"}, {"id": "G02", "src": "提示词草稿 2", "text": "一个职场人。\n只给了名词，没有动作、场景与规格。"}, {"id": "G03", "src": "提示词草稿 3", "text": "扁平插画，蓝白配色，横版 16:9，一个人坐在工位前看屏幕。\n四要素基本齐，但没写留白位置。"}, {"id": "G04", "src": "提示词草稿 4", "text": "画一个像某知名主持人的年轻人，在会议室讲话。\n出现了指向真人的描述。"}, {"id": "G05", "src": "提示词草稿 5", "text": "一张 PPT 封面的图，用在公众号头图。\n只说了用途，没说比例，头图是 2.35:1。"}, {"id": "G06", "src": "提示词草稿 6", "text": "科技感、未来感、高级感、简约、质感、商务、年轻、活力、专业、大气、有设计感。\n十个形容词堆在一起。"}], "cols": [{"k": "miss", "name": "缺哪一要素", "hint": "主体 / 场景 / 风格 / 规格 / 红线 / 堆太多", "type": "chips", "w": 2, "tags": ["缺主体与场景", "主体没写成动作", "缺规格（留白）", "碰红线（指向真人）", "缺规格（比例）", "要素堆太多"]}, {"k": "bad", "name": "会出什么问题", "hint": "选后果", "type": "chips", "w": 3, "tags": ["每次出图都不一样", "图里没人也没事在做", "标题压在主体上", "生成类似真人肖像，不能用", "比例不对，裁完构图全乱", "模型随机挑几个形容词"]}, {"k": "fix", "name": "怎么补", "hint": "补具体的那一项，不要重写整句", "type": "chips", "w": 3, "tags": ["补主体动作+场景+规格", "改成动作描述，加环境线索", "补「右上角留空约 1/4」", "整条重写，去掉指向真人的描述", "补「横版 2.35:1，上方留白」", "砍到 3–4 个可执行形容词"]}], "key": {"G01": {"miss": "缺主体与场景", "bad": "每次出图都不一样", "fix": "补主体动作+场景+规格"}, "G02": {"miss": "主体没写成动作", "bad": "图里没人也没事在做", "fix": "改成动作描述，加环境线索"}, "G03": {"miss": "缺规格（留白）", "bad": "标题压在主体上", "fix": "补「右上角留空约 1/4」"}, "G04": {"miss": "碰红线（指向真人）", "bad": "生成类似真人肖像，不能用", "fix": "整条重写，去掉指向真人的描述"}, "G05": {"miss": "缺规格（比例）", "bad": "比例不对，裁完构图全乱", "fix": "补「横版 2.35:1，上方留白」"}, "G06": {"miss": "要素堆太多", "bad": "模型随机挑几个形容词", "fix": "砍到 3–4 个可执行形容词"}}, "notes": {"G01·fix": "这一条不能只补一句，必须把主体、场景、规格三样都补上，否则出来还是随机的", "G04·fix": "指向真人的描述不能靠「改成卡通风格」绕过去，整条重写最安全", "G05·miss": "用途不是规格；说了「公众号头图」还得说清 2.35:1 和留白位置", "G06·bad": "形容词越多，模型越只能随机挑几个，同一句提示词两次出图可能完全不同"}, "delta": [{"op": "改", "frm": "模型把 6 条都重写成「科技感、扁平插画、蓝白配色」开头", "to": "只保留一段固定风格锚，6 条里原样复制，其余只改主体与场景", "why": "每条都重写风格词，六张图出来会是六个来源，整组就散了", "kw": ["风格锚", "一字不改", "统一", "只换主体"]}, {"op": "删", "frm": "模型保留了「画一个像某知名主持人的年轻人」", "to": "整条重写为「一位年轻人在会议室白板前讲解，仅背面或侧影」", "why": "指向真人的描述会生成类似肖像，用了就是侵权风险，而且无法通过后期补救", "kw": ["真人", "肖像", "风险", "重写"]}, {"op": "补", "frm": "模型给 6 条都没写留白位置", "to": "每条补「画面右上角留空约 1/4」", "why": "不写留白，标题只能压在主体上，六张图都得重做", "kw": ["留白", "1/4", "标题", "重做"]}, {"op": "改", "frm": "模型把「公众号头图」理解成 16:9", "to": "改成「横版 2.35:1，上方留白用于放标题」", "why": "用途不等于规格；比例错了，裁图之后构图全乱，等于白做", "kw": ["2.35:1", "比例", "头图", "裁图"]}], "refsheet": "G01｜缺主体与场景｜每次出图都不一样｜补主体动作+场景+规格\nG02｜主体没写成动作｜图里没人也没事在做｜改成动作描述，加环境线索\nG03｜缺规格（留白）｜标题压在主体上｜补「右上角留空约 1/4」\nG04｜碰红线（指向真人）｜生成类似真人肖像，不能用｜整条重写，去掉指向真人的描述\nG05｜缺规格（比例）｜比例不对，裁完构图全乱｜补「横版 2.35:1，上方留白」\nG06｜要素堆太多｜模型随机挑几个形容词｜砍到 3–4 个可执行形容词\n\n四条最容易判错的：\n· G05 说了用途（公众号头图）不等于说了规格：用途要翻译成比例和留白。\n· G04 不能靠「改成插画风格」绕过去，只要还指向真人就整条重写。\n· G03 四要素看着齐，唯独漏了留白这一项，而它决定了标题能不能放。\n· G06 不是「写得不够专业」，恰恰是写太多——形容词越多，可控性越差。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的配图助手。请按下面这段风格锚，为主体列表里的每一项各写一条提示词，不要直接生成图：\n【风格锚（一字不改）】扁平插画风格，蓝白为主色，浅灰背景，柔和侧光，大面积留白，无人物正脸，画面右上角留空用于放标题，横版 16:9。\n【主体列表】① 整理会议纪要 ② 做数据看板 ③ 写方案 ④ 做会议纪要分工 ⑤ 核对数据 ⑥ 做汇报\n规则：① 每条只改主体与场景，风格锚原样复制；② 主体写成动作，不写名词；③ 每条标注「右上留白占比」；④ 不要出现任何真实公司标识与可辨认人脸。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】风格锚 + 只换主体（一组六张）\n【参考案例】六张图看起来像六个来源，与一组六张像同一套的差别\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的配图助手。请按下面这段风格锚，为主体列表里的每一项各写一条提示词，不要直接生成图：\n【风格锚（一字不改）】扁平插画风格，蓝白为主色，浅灰背景，柔和侧光，大面积留白，无人物正脸，画面右上角留空用于放标题，横版 16:9。\n【主体列表】① 整理会议纪要 ② 做数据看板 ③ 写方案 ④ 做会议纪要分工 ⑤ 核对数据 ⑥ 做汇报\n规则：① 每条只改主体与场景，风格锚原样复制；② 主体写成动作，不写名词；③ 每条标注「右上留白占比」；④ 不要出现任何真实公司标识与可辨认人脸。", "rubric": ["六张图的风格锚完全一致，只有主体与场景在变", "比例与留白一致，能直接放进同一套模板，不用逐张裁", "没有出现真人肖像、真实标识与水印", "能逐张说出「能用 / 不能用 / 改哪里能用」，不是笼统说「都不错」"]}, {"id": "M6U3", "tier": "basic", "step": "todo", "title": "产出你的第一组岗位配图", "video": {"dur": "3.4min", "script": ["配图是一次投入、长期复用的东西，别每次从零做", "配图清单六列（用途 / 主体 / 规格 / 提示词 / 可用性 / 备注）", "一组图用了一学期，每次做材料只换标题，省下的时间以小时计"]}, "ppt": {"method": "配图清单六列（用途 / 主体 / 规格 / 提示词 / 可用性 / 备注）", "case": "一组图用了一学期，每次做材料只换标题，省下的时间以小时计", "demo": "配图清单模板与填写示例"}, "objective": "能产出一组 6 张风格统一的岗位配图，每张有用途说明与可用性判断", "transfer": "把这六张图和提示词模板存进自己的素材库，下次做材料先翻一眼能不能复用", "vslides": [{"t": "第一步：先问用途，再动手", "n": "做配图前第一个问题不是「要什么图」，是「给谁看、放哪里」。内部培训材料和对外的宣传物料，红线完全不同：前者只要不涉及客户信息基本可以用，后者要过授权、水印、肖像三道检查。用途还决定规格：放 PPT 里是 16:9，放公众号头图是 2.35:1，放小红书是 3:4。先把这些定下来，后面才不会返工。还有一个习惯值得养成：把用途写进文件名。半年后你翻素材库，看到「内部培训_P03_骨架」就知道能不能直接用，看到「配图1」只能打开看一遍。用途还决定要不要留白：PPT 里可以铺满，公众号头图必须留出标题位置。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 给谁看：内部还是对外\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 给谁看：内部还是对外</tspan></text></g><g data-k=\"② 放哪里：决定比例\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 放哪里：决定比例</tspan></text></g><g data-k=\"③ 文件名带用途\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 文件名带用途</tspan></text></g></svg>", "d": 60.55}, {"t": "第二步：风格锚六个场景共用", "n": "风格锚是一段固定文本，包含五项：风格（扁平插画/写实照片感）、主色、光（柔和侧光/顶光）、留白位置、比例。这五项定下来，六个场景的提示词里原样复制，一个字都不改。为什么强调「一个字都不改」？因为模型对措辞很敏感，你把「柔和侧光」写成「柔光」，出来的调子就可能变。六张图里只要有一张调子不一样，整组就散了。还有一个实操建议：风格锚先单独试两三张，确认出来的效果你能接受，再批量做六张。先试后批，比做完六张再推翻省时间。批量做之前还有一个动作：把六张缩略图拼成一张联系表，一眼就能看出调子齐不齐。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"五项：风格/主色/光/留白/比例\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">五项：风格/主色/光/留白/比例</tspan></text></g><g data-k=\"一字不改地复制\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">一字不改地复制</tspan></text></g><g data-k=\"先试两张再批量\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">先试两张再批量</tspan></text></g></svg>", "d": 63.34}, {"t": "第三步：逐张判可用性，四项标准", "n": "判断一张配图能不能用，看四项。第一，留白够不够放标题——这一项最实用，留白不够，标题只能压在画面上。第二，有没有「像数据的数据」——图上的百分比、账号、金额，看着真实但全是编的，必须避开。第三，有没有可辨认人脸与真实标识——这两样是侵权风险。第四，画的跟要讲的那句话对不对得上——对不上就是占位图。四项过完，每张给一个结论：能用、改哪里能用、不能用。最后一件事：把提示词和图一起归档。只存图，下次想改主体还得重写提示词；存了提示词，下次三十秒就能出一张新的。这四项查完，你会发现自己看图的眼光变了：不再先看美不美，而是先看能不能用。素材库建起来之后，做材料的时间会明显下降，因为你不再从空白画布开始。这一点在做第三份材料时最明显，所以第一组图值得多花半天。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">可用性四项</tspan></text><g data-k=\"留白够放标题\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">留白够放标题</tspan></text></g><g data-k=\"没有假数据\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">没有假数据</tspan></text></g><g data-k=\"无人脸无标识\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">无人脸无标识</tspan></text></g><g data-k=\"图文对得上\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">图文对得上</tspan></text></g></svg>", "d": 80.5}], "deliverable": {"type": "skill", "name": "配图清单 + 六张图", "rubric": ["锚一致", "可复用", "判断具体"], "acceptance": "一份清单：六张图各有用途、提示词、可用性结论，且提示词里的风格锚完全一致"}, "practice": {"steps": ["先确定用途：内部材料还是对外物料，两者红线不同", "写一段风格锚（风格/主色/光/留白/比例），六个场景共用", "把六个主体写成动作，逐条生成提示词，风格锚原样复制", "逐张判可用性：留白、假数据、人脸标识、图文匹配四项", "归档：文件名带用途前缀，把提示词一起存进素材库"], "exemplar": "【岗位配图清单 · 内部培训材料用】\n制作人：小林　日期：2026-11-12　用途：新人培训课件（内部，不上外网）\n\n■ 一、风格锚（六张共用，一字不改）\n扁平插画风格，蓝白为主色，浅灰背景，柔和侧光，大面积留白，无人物正脸，\n画面右上角留空用于放标题，横版 16:9。\n\n■ 二、六张清单\n| # | 用途（放哪页 / 讲哪句） | 主体与场景 | 规格 | 可用性 | 备注 |\n|---|---|---|---|---|---|\n| 1 | P3 讲「先搭骨架」 | 一只手在笔记本上勾选清单 | 16:9，右上留白 1/4 | 可用 | — |\n| 2 | P5 讲「数据先洗再算」 | 一只手把折线图贴到白板 | 同上 | 改后用 | 原图折线太像真实产品界面，已换成抽象线条 |\n| 3 | P7 讲「先大纲后文字稿」 | 桌面摊开三页文档 | 同上 | 可用 | — |\n| 4 | P9 讲「纪要是行动清单」 | 白板贴三张分工便签 | 同上 | 可用 | 便签上无文字 |\n| 5 | P11 讲「换版本先换顺序」 | 一只手在两列内容间比对 | 同上 | 改后用 | 原图屏幕有像账号的字符，已重出 |\n| 6 | P13 讲「回工位第一件事」 | 一个人背影站在投屏前 | 同上 | 慎用 | 仅背影；若对外发布则换掉 |\n\n■ 三、提示词（以第 1 张为例，其余只换主体段）\n扁平插画风格，蓝白为主色，浅灰背景，柔和侧光，大面积留白，无人物正脸，\n画面右上角留空用于放标题，横版 16:9。主体：一只手在笔记本上勾选清单，\n旁边有一杯水，桌面上有少量便签，纸张边缘清晰。\n\n■ 四、统一性自检\n· 六张缩略图并排退后三步看：风格一致，无跳出的那一张。\n· 比例全部 16:9，右上留白均约 1/4，可直接套同一套标题模板。\n· 无人脸、无真实标识、无像数据的数据、无水印。\n\n■ 五、授权与留存\n· 生成平台：公司已采购的 XX 平台（个人免费工具不用于对外物料）。\n· 商用授权：内部培训无需额外授权；若改为对外发布，需按平台条款另行确认。\n· 文件命名：`内部培训_P03_骨架_16x9.png`，提示词同目录存 `.txt`。\n· 原图与提示词一起归档，便于下次只改主体复用。"}, "task": "产出《配图清单 + 六张图》：先确定用途：内部材料还是对外物料，两者红线不同；写一段风格锚（风格/主色/光/留白/比例），六个场景共用；把六个主体写成动作，逐条生成提示词，风格锚原样复制；逐张判可用性：留白、假数据、人脸标识、图文匹配四项；归档：文件名带用途前缀，把提示词一起存进素材库", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M6 用 AI 做图与做视频」模块，你要交付的是《配图清单 + 六张图》。\n【场景】业务侧这周的诉求是：配图是一次投入、长期复用的东西，别每次从零做。参考做法：一组图用了一学期，每次做材料只换标题，省下的时间以小时计。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（配图清单六列（用途 / 主体 / 规格 / 提示词 / 可用性 / 备注）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《配图清单 + 六张图》填写模板】\n\n■ 1. 先确定用途：内部材料还是对外物料，两者红线不同\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写一段风格锚（风格/主色/光/留白/比例），六个场景共用\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 把六个主体写成动作，逐条生成提示词，风格锚原样复制\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 逐张判可用性：留白、假数据、人脸标识、图文匹配四项\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 归档：文件名带用途前缀，把提示词一起存进素材库\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【岗位配图清单 · 内部培训材料用】\n制作人：小林　日期：2026-11-12　用途：新人培训课件（内部，不上外网）\n\n■ 一、风格锚（六张共用，一字不改）\n扁平插画风格，蓝白为主色，浅灰背景，柔和侧光，大面积留白，无人物正脸，\n画面右上角留空用于放标题，横版 16:9。\n\n■ 二、六张清单\n| # | 用途（放哪页 / 讲哪句） | 主体与场景 | 规格 | 可用性 | 备注 |\n|---|---|---|---|---|---|\n| 1 | P3 讲「先搭骨架」 | 一只手在笔记本上勾选清单 | 16:9，右上留白 1/4 | 可用 | — |\n| 2 | P5 讲「数据先洗再算」 | 一只手把折线图贴到白板 | 同上 | 改后用 | 原图折线太像真实产品界面，已换成抽象线条 |\n| 3 | P7 讲「先大纲后文字稿」 | 桌面摊开三页文档 | 同上 | 可用 | — |\n| 4 | P9 讲「纪要是行动清单」 | 白板贴三张分工便签 | 同上 | 可用 | 便签上无文字 |\n| 5 | P11 讲「换版本先换顺序」 | 一只手在两列内容间比对 | 同上 | 改后用 | 原图屏幕有像账号的字符，已重出 |\n| 6 | P13 讲「回工位第一件事」 | 一个人背影站在投屏前 | 同上 | 慎用 | 仅背影；若对外发布则换掉 |\n\n■ 三、提示词（以第 1 张为例，其余只换主体段）\n扁平插画风格，蓝白为主色，浅灰背景，柔和侧光，大面积留白，无人物正脸，\n画面右上角留空用于放标题，横版 16:9。主体：一只手在笔记本上勾选清单，\n旁边有一杯水，桌面上有少量便签，纸张边缘清晰。\n\n■ 四、统一性自检\n· 六张缩略图并排退后三步看：风格一致，无跳出的那一张。\n· 比例全部 16:9，右上留白均约 1/4，可直接套同一套标题模板。\n· 无人脸、无真实标识、无像数据的数据、无水印。\n\n■ 五、授权与留存\n· 生成平台：公司已采购的 XX 平台（个人免费工具不用于对外物料）。\n· 商用授权：内部培训无需额外授权；若改为对外发布，需按平台条款另行确认。\n· 文件命名：`内部培训_P03_骨架_16x9.png`，提示词同目录存 `.txt`。\n· 原图与提示词一起归档，便于下次只改主体复用。", "rubric": ["六条提示词里的风格锚一字不改，只有主体与场景不同", "每张都写了用途（放哪一页、讲哪句话），不是「备用」", "可用性结论具体到「能用 / 改哪里能用」，不是「挺好的」", "文件与提示词一起归档，下次能直接复用"]}, {"id": "M6U4", "tier": "basic", "step": "spar", "title": "同事说这张图不能用", "video": {"dur": "3.2min", "script": ["「不能用」是结论，你要问出的是原因", "四问定位（留白 / 假数据 / 授权 / 图文不符）", "「这图不行」与「是留白不够还是怕那个数字被当成真数据」的差别"]}, "ppt": {"method": "四问定位（留白 / 假数据 / 授权 / 图文不符）", "case": "「这图不行」与「是留白不够还是怕那个数字被当成真数据」的差别", "demo": "陪练说明：他只说不能用，不说为什么"}, "objective": "能在同事否掉一张图时，先问清否定的是哪一项，再给出重出或改用的方案", "transfer": "把被否掉的那张图连同原因记进素材库的备注，下次写提示词先避开同一个坑", "vslides": [{"t": "陪练说明：他只给结论，原因要你问", "n": "这一关的对手是协作同事。他说「这张图不能用」，然后就没了。新人这时候通常有两种反应：一种是委屈，觉得挺好看为什么不能用；一种是直接重做，重做完还是不能用，因为不知道问题在哪。正确做法是把「不能用」拆成四个可能：留白不够、图里有假数据、授权有问题、图文不符。你把这四项摆出来问他，他一般会指一个。这一步的关键是：你先给出选项，而不是让他从零解释。人面对选择题比面对问答题有耐心得多。还有一个前提：不要在他面前重新论证这张图多好看，那不是他的问题，他要的是能用的图。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">不能用，通常是这四项之一</tspan></text><g data-k=\"留白不够\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">留白不够</tspan></text></g><g data-k=\"有假数据\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">有假数据</tspan></text></g><g data-k=\"授权问题\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">授权问题</tspan></text></g><g data-k=\"图文不符\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">图文不符</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 55.85}, {"t": "第二问：你自己看出什么了", "n": "他第二句通常是「你没觉得这张图有什么问题吗」。这一问是在看你的判断力，不是在挑刺。答「我觉得挺好的」最糟，因为那等于说你的标准比他还低。正确答法是主动说出你已经察觉的疑点：「屏幕上那串字符我看着也不放心，虽然是我编的，但截图出去就说不清了。」能主动指出自己作品的问题，是这一关最关键的一次加分——它证明你不是在交作业，是在对结果负责。如果你确实没看出来，就老实说「我只检查了留白和比例，没往数据真实性上想」，然后问他「您看的是这一项吗」。诚实比硬猜有用。这一问还有个变体：「你觉得这图有什么风险」，答法一样——先说自己看到的，再问他看到的是不是同一个。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"先说自己看到的疑点\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">先说自己看到的疑点</tspan></text></g><g data-k=\"没看出来就说没看出来\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">没看出来就说没看出来</tspan></text></g><g data-k=\"别答「我觉得挺好」\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">别答「我觉得挺好」</tspan></text></g></svg>", "d": 64.06}, {"t": "第三、四问：来源授权与改法", "n": "「这图哪来的，能对外用吗」这一问必须答得干脆：哪个平台生成的、是公司已采购的还是个人免费工具、有没有水印、商用条款怎么写的。答不清，这张图就算画得再好也不能用。最后给改法，要具体到动作：「如果是留白问题，我把主体往左压；如果是数字问题，我把屏幕换成纯色块，不出现任何字符。两种今天都能出。」给两个方向让他选，比问「您说要怎么改」有效得多。最后补一句时间点，这条沟通就闭环了。如果你答「不知道能不能对外」，那这张图基本就不能用；授权这件事没有「大概可以」。他如果还是不明确说，就按最严的那一项处理：先改数据那类问题，因为它的风险最高，也最难靠后期补救。改完再拿去问一句「这样行吗」，通常就过了。不要把「不能用」当成否定你这个人。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">当天闭环</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">来回三轮</tspan></text><g data-k=\"给两个改法让他选\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">给两个改法让他选</tspan></text></g><g data-k=\"问「您说要怎么改」\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">问「您说要怎么改」</tspan></text></g></svg>", "d": 69.17}], "deliverable": {"type": "skill", "name": "配图清单（修订版）", "rubric": ["问得出原因", "自己先看出问题", "改法具体"], "acceptance": "四问都答得出：主动定位问题项、说清自己看出的问题、交代来源与授权、给出两条具体改法"}, "spar": {"role": "协作同事", "persona": "只说「不能用」，不说为什么；你问得含糊他就说「你自己看」", "mustAsk": ["这张图不能用，换一张", "你没觉得这张图有什么问题吗？", "这图哪来的？能对外用吗？", "重出的话你打算怎么改？"]}, "exemplar": "（同事说：这张图不能用，换一张）\n\n结论：我先确认一下是哪一项的问题，是留白不够放标题，还是图里那些数字的问题？\n依据：这张是第 5 张，画面是两只手在两列数字之间比对。如果您担心的是屏幕上那串字符——我也觉得有问题，它看起来像真实账号，虽然是我编的，但截出去就说不清了。\n边界：如果是留白问题，我重出一张把主体往左压；如果是数字问题，我把屏幕内容换成纯色块，不出现任何字符。两种我都今天能出，您说哪个方向，或者两个都要我就各出一张给您挑。如果是授权问题（比如这张的来源），那我直接换平台重做，不在这张上改。", "task": "把《配图清单（修订版）》拿到「协作同事」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《配图清单（修订版）》。现在要让它通过「协作同事」这一关。\n【对手的立场】只说「不能用」，不说为什么；你问得含糊他就说「你自己看」。\n【他一定会追问】「这张图不能用，换一张」 / 「你没觉得这张图有什么问题吗？」 / 「这图哪来的？能对外用吗？」\n【场景】你说「同事说这张图不能用」，对方立刻回一句：这张图不能用，换一张 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["不辩解、不追问「哪里不行」了事，而是给出四个可能项让他选", "能主动指出自己也觉得有问题的地方（如像数据的字符）", "能说清图的来源与授权状态，不含糊", "给出两条具体改法并提供时间，不是「我再做一版」"]}, {"id": "M6U5", "tier": "adv", "step": "understand", "title": "生视频：先脚本，后画面", "video": {"dur": "3.2min", "script": ["视频里最贵的不是画面，是没人看完", "脚本三段（钩子 / 三个要点 / 一个动作）", "直接让 AI 出视频 vs 先写脚本再出画面，返工次数差三倍"]}, "ppt": {"method": "脚本三段（钩子 / 三个要点 / 一个动作）", "case": "直接让 AI 出视频 vs 先写脚本再出画面，返工次数差三倍", "demo": "脚本三段卡：拿 4 条素材各排一次"}, "objective": "能用「目标一句 / 三段结构 / 每段一句台词」写出 30 秒脚本并排出分镜", "transfer": "拿手上想做的视频主题先只写脚本与分镜，脚本念一遍控制在 30 秒内再动手做画面", "vslides": [{"t": "为什么必须先写脚本", "n": "做视频最容易犯的错是先做画面，再想说什么。结果画面很漂亮，配上台词发现讲不完，只能删画面或者加快语速，两种都难看。正确顺序是反的：先写脚本，再排分镜，最后出画面。脚本只需要三段：钩子、三个要点、一个动作。钩子是一句话，三秒内让人知道「这跟我有关」；三个要点各一句，每句不超过八秒；最后一个动作，告诉对方看完做什么。三十秒的视频，脚本全文大约一百二十字，写起来不费劲，但它决定了后面所有画面的取舍。没有脚本的人，会在生成画面时被「好看」牵着走，最后做出来一条没有观点的片子。脚本还有一条隐藏作用：它是你和需求方对齐的工具。脚本二十秒就能读完，画面要两小时。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">30 秒脚本三段</tspan></text><g data-k=\"钩子\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">钩子</tspan></text></g><g data-k=\"三个要点\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三个要点</tspan></text></g><g data-k=\"一个动作\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">一个动作</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 65.9}, {"t": "钩子怎么写，要点怎么排", "n": "钩子不要写「大家好，今天给大家介绍」，那是自我介绍，不是钩子。钩子要直接给结论或者给痛处：「你上周那份纪要，可能没人看第二遍」——这句话让人想听下去，因为它说中了一件真事。三个要点按「是什么—为什么—怎么做」排，或者按「问题—原因—解法」排，两种都行，关键是三条之间要有推进，不能是三个并列的碎点。每一条只留一句台词，写完自己念一遍，超过八秒就砍。念不顺的地方一定要改，因为观众听到的就是你念出来的效果，书面语在口播里会显得很硬。三个要点如果写不出推进关系，说明你还没想清楚要讲什么，先别急着配画面。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"钩子：说中一件真事\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">钩子：说中一件真事</tspan></text></g><g data-k=\"要点：三条要推进\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">要点：三条要推进</tspan></text></g><g data-k=\"台词：念一遍，超八秒就砍\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">台词：念一遍，超八秒就砍</tspan></text></g></svg>", "d": 56.26}, {"t": "分镜：每个画面只服务一句话", "n": "分镜不是配图，是把台词翻译成画面。一句台词配一个画面，画面里要能看见那句话的关键词。「你上周那份纪要可能没人看第二遍」这句，画面应该是「一份纪要被人划过去」，而不是「一个人在办公室微笑」。判断分镜对不对，用一句测试：把声音关掉，只看画面，能不能猜出这句话大概在说什么。猜不出来，说明画面在凑数。还有一条实操建议：能用现成素材就用现成素材，不必每句都生成新画面。三十秒视频有六到八个镜头就够，镜头太多反而碎。分镜做完可以做一个静音测试：关掉声音从头看一遍，能看懂七成，这条片子就成立。脚本写不好，画面越精致越显得空。先写清楚，再画漂亮；这个顺序反过来，返工就来了。所以别急着打开生成工具。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"一句台词一个画面\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">一句台词一个画面</tspan></text></g><g data-k=\"静音能猜出大意\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">静音能猜出大意</tspan></text></g><g data-k=\"六到八个镜头就够\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">六到八个镜头就够</tspan></text></g></svg>", "d": 70.85}], "deliverable": {"type": "skill", "name": "30 秒脚本 + 分镜表", "rubric": ["目标一句", "三段清楚", "台词能念"], "acceptance": "能写出一份 30 秒脚本（一句话目标、三段结构、每段一句台词），并排出对应分镜"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】脚本三段（钩子 / 三个要点 / 一个动作）\n【为什么重要】视频里最贵的不是画面，是没人看完\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["开头有一个能在 3 秒内抓住人的钩子，不是「大家好，今天我讲」", "三段结构清楚：讲什么、凭什么、要对方做什么", "每段只有一句台词，念出来不超过 8 秒，不是一段长文", "分镜能对上台词，每个画面都在说那句话，不是随便配图"]}, {"id": "M6U6", "tier": "adv", "step": "demo", "title": "做一条 30 秒口播视频", "video": {"dur": "3.3min", "script": ["分镜拆到「每镜一句台词」，拍摄与生成才有依据", "分镜表五列（镜号 / 画面 / 台词 / 时长 / 素材来源）", "同一份脚本，分镜拆得细的成片不用返工"]}, "ppt": {"method": "分镜表五列（镜号 / 画面 / 台词 / 时长 / 素材来源）", "case": "同一份脚本，分镜拆得细的成片不用返工", "demo": "WorkBuddy 内跑一遍分镜，对照 AI 原稿与人改稿"}, "objective": "能把一段 120 字脚本拆成 8 个分镜，每镜写清画面、台词、时长与素材来源", "transfer": "拿自己的脚本按这个分镜表排一遍，把「需要新生成」的镜头控制在三个以内", "vslides": [{"t": "演示准备：分镜的唯一标准是「一镜一句」", "n": "这次手上是一段一百二十字的口播脚本。要做的是把它拆成分镜表。拆的标准只有一条：一个镜头一句台词。违反这一条，剪辑时就会出问题——一句台词说到一半画面换了，或者画面换了两句还没说完，最后只能靠延长画面凑，节奏变拖。新人常犯的错是「按画面想」：先想六个好看的画面，再把台词往画面里塞，塞不进去就删台词。这个顺序会让视频丢掉观点，只剩画面。正确的顺序是「按台词排」：每句话配一个能看见它的画面，画面不好看可以换，台词不能动。还有一个前置动作：先把脚本念一遍并计时，念完如果超过三十秒，脚本本身就得砍。先念一遍，比什么都准。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">拆分镜的顺序</tspan></text><g data-k=\"脚本 120 字\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">脚本 120</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">字</tspan></text></g><g data-k=\"一镜一句\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">一镜一句</tspan></text></g><g data-k=\"算总时长\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">算总时长</tspan></text></g><g data-k=\"定素材来源\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">定素材来</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">源</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.18}, {"t": "跑一遍：为什么要它算总时长", "n": "提示词里我要求「总时长控制在 28–32 秒，每镜时长相加要等于总数」。这条看着琐碎，实际是分镜能不能用的分水岭。不要求，它会给你八镜各标「约 3–5 秒」，看着差不多，加起来可能是二十四秒，也可能是四十秒。到了配音那一步你才发现差十秒，要么加快语速，要么砍内容，两种都难看。要求了之后，你必须给每镜一个具体秒数，加起来一算就知道够不够。还有一条约束是「需生成的镜头不超过三个」：生成画面成本高、不可控，六个镜头全生成，光调就调一天。用现成素材和纯文字卡替代，成片质量不会差，时间省一大半。还有一条经验：总时长宁短勿长。三十秒的视频做成二十八秒没人抱怨，做成三十六秒会被划走。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：120 字口播脚本\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：120 字口播脚本</tspan></text></g><g data-k=\"约束：一镜一句 / 总时长 28–32 秒 / 生成镜头 ≤3 / 不加台词\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：一镜一句 / 总时长 28–32 秒 / 生成镜头 ≤3 / 不加台词</tspan></text></g><g data-k=\"产出：8 镜分镜表\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：8 镜分镜表</tspan></text></g></svg>", "d": 68.33}, {"t": "人工收口：开头三秒要能独立成立", "n": "跑完先检查开头。第一镜的画面要能在静音状态下抓住人——很多人开头是一张标题卡加旁白，观众看到标题卡就划走了。有效的开头是一个具体场景：一份纪要被人划过去、一个表格被填到一半、一只手把纸揉掉。具体场景能让人立刻知道「这说的是我」；抽象的标题卡不能。第二个检查项是节奏：把每镜时长念一遍，超过六秒的镜头要拆，因为一个画面停六秒会显得卡。最后一个动作：把分镜表和脚本并排放，逐句核对有没有漏台词、有没有多台词。多出来的台词最麻烦，它往往来自「顺手补一句」，而这一句会把整条视频的节奏撑破。开头三秒如果做不好，后面的内容再好也没用，因为观众根本到不了那里。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"开头三秒静音能抓住人\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">开头三秒静音能抓住人</tspan></text></g><g data-k=\"超六秒的镜头要拆\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">超六秒的镜头要拆</tspan></text></g><g data-k=\"逐句核对漏与多\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">逐句核对漏与多</tspan></text></g></svg>", "d": 66.38}], "deliverable": {"type": "skill", "name": "分镜表 + 脚本", "rubric": ["一镜一句", "时长可算", "素材够用"], "acceptance": "8 个镜头以内、每镜一句台词、总时长 28–32 秒、素材来源标注清楚"}, "demo": {"ref": "| 镜号 | 画面 | 台词 | 时长 | 素材来源 |\n|---|---|---|---|---|\n| 1 | 一份纪要被人用手划过去，画面偏暗 | 你上周那份纪要，可能没人看第二遍。 | 4 | 需实拍（手机拍即可） |\n| 2 | 白板上写着「结论 / 决议 / 待办 / 待定」四个词 | 问题不在文字，在结构。 | 3 | 需生成 |\n| 3 | 手指点在「待办」那一栏 | 大家只看第三块：谁要做什么。 | 4 | 需实拍 |\n| 4 | 一页纸的纪要 vs 五页纸的纪要并排 | 一页能读完的纪要，才会被读完。 | 4 | 需生成 |\n| 5 | 表格里「谁 / 做什么 / 什么时候 / 交付什么」被逐格填上 | 每条待办写清四样，它才真的派出去。 | 5 | 需生成 |\n| 6 | 一份纪要发到群里，有人回「收到」 | 发群之前，先给主持人确认一句。 | 4 | 现成素材 |\n| 7 | 日历上「周一 09:30 过表」被圈出来 | 每周二十分钟过一遍，漏的事会少一大半。 | 5 | 现成素材 |\n| 8 | 纯文字卡：「今天就能做的一件事：把上次纪要按四块重排」 | 今天就能做的一件事：把上次的纪要按四块重排。 | 3 | 纯文字卡 |\n\n■ 合计时长：4+3+4+4+5+4+5+3 = 32 秒\n■ 需生成镜头：3 个（2、4、5）；需实拍：2 个；现成/文字卡：3 个", "fix": ["把第 2 镜拆成两镜：原来一个画面要同时说「问题不在文字」和「在结构」，一镜塞两句，剪的时候必然对不上。", "给每镜补了时长并把总数算到 32 秒：AI 原来只标「约 3–5 秒」，加起来不知道多长，配音时会发现差十秒。", "把需生成的镜头从 6 个压到 3 个：其余改用现成素材和纯文字卡，生成六个画面的成本远高于收益。", "删掉 AI 自己加的「点个关注」结尾台词——脚本里没有这句，加进去会把 32 秒撑到 36 秒，节奏全乱。"], "judge": "判断依据：是否一镜一句；时长相加是否等于总数；需生成镜头是否控制住；有没有擅自加台词", "sheet": {"situ": "你写好了一段 30 秒口播脚本，现在要拆成分镜。手上是 6 个分镜草稿，每条都有问题。你要逐条判断：要不要留、缺什么、该怎么改。", "ask": "① 逐条判定：这条分镜能不能用、问题在哪、怎么改；② 让模型按「镜号/画面/台词/时长/素材来源」重排分镜表；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请基于以上判定重排分镜表，五列固定：镜号｜画面｜台词（原文照搬）｜时长（秒）｜素材来源（现成/需生成/需实拍/纯文字卡）。\n规则：① 一镜一句台词；② 总时长 28–32 秒，每镜时长相加等于总数；③ 需生成镜头不超过 3 个；④ 不新增脚本里没有的台词。", "mats": [{"id": "S01", "src": "分镜草稿 1", "text": "画面：办公室全景。台词：你上周那份纪要可能没人看第二遍。\n画面很空，台词很具体，两者对不上。"}, {"id": "S02", "src": "分镜草稿 2", "text": "画面：白板上写着四个词。台词：问题不在文字，在结构；大家只看第三块。\n一镜塞了两句台词。"}, {"id": "S03", "src": "分镜草稿 3", "text": "时长标注：约 3–5 秒。\n没有具体秒数，总时长算不出来。"}, {"id": "S04", "src": "分镜草稿 4", "text": "画面：一个人对着镜头微笑。台词：（无）。\n占了 4 秒，但没承担任何信息。"}, {"id": "S05", "src": "分镜草稿 5", "text": "最后一句台词：点个关注，我们下期见。\n脚本里没有这句，加进去会把 32 秒撑到 36 秒。"}, {"id": "S06", "src": "分镜草稿 6", "text": "画面：精致的三维动画，需要生成。全片 8 个镜头都要生成。\n生成成本过高，不可控。"}], "cols": [{"k": "keep", "name": "这条要不要留", "hint": "留 / 改后用 / 删", "type": "chips", "w": 2, "tags": ["留", "改后用", "删"]}, {"k": "issue", "name": "问题在哪", "hint": "选最贴近的一项", "type": "chips", "w": 3, "tags": ["画面与台词对不上", "一镜塞了两句台词", "时长没写具体秒数", "画面不承担信息", "擅自加台词", "生成镜头过多"]}, {"k": "fix", "name": "怎么改", "hint": "给出具体动作", "type": "chips", "w": 3, "tags": ["换成「纪要被人划过去」的特写", "拆成两镜，各放一句", "每镜写具体秒数并相加", "删掉，或换成纯文字卡", "整句删除，不加", "压到 3 个以内，其余用现成素材"]}], "key": {"S01": {"keep": "改后用", "issue": "画面与台词对不上", "fix": "换成「纪要被人划过去」的特写"}, "S02": {"keep": "改后用", "issue": "一镜塞了两句台词", "fix": "拆成两镜，各放一句"}, "S03": {"keep": "改后用", "issue": "时长没写具体秒数", "fix": "每镜写具体秒数并相加"}, "S04": {"keep": "删", "issue": "画面不承担信息", "fix": "删掉，或换成纯文字卡"}, "S05": {"keep": "删", "issue": "擅自加台词", "fix": "整句删除，不加"}, "S06": {"keep": "改后用", "issue": "生成镜头过多", "fix": "压到 3 个以内，其余用现成素材"}}, "notes": {"S01·issue": "办公室全景是万能背景，放在任何台词下面都成立，也就等于不承担信息", "S02·fix": "一镜两句，剪辑时必然对不上；拆开之后每镜单独算时长，节奏才可控", "S04·keep": "没有台词的画面只有两种理由：转场或情绪停顿。4 秒的空白都要删", "S05·fix": "加台词会把总时长撑破，节奏一乱，前面所有设计都白费"}, "delta": [{"op": "改", "frm": "模型把 8 个镜头都标成「需生成」", "to": "压到 3 个需生成，其余用现成素材与纯文字卡", "why": "生成画面不可控，八个全生成光调就一天；成片质量不会因此变好", "kw": ["需生成", "3 个", "现成素材", "成本"]}, {"op": "改", "frm": "模型给出的时长是「约 3–5 秒」", "to": "每镜给具体秒数，并相加得出总时长 32 秒", "why": "不写具体秒数，到了配音才发现差十秒，要么加速要么砍内容", "kw": ["具体秒数", "32 秒", "总时长", "配音"]}, {"op": "删", "frm": "模型补了一句「点个关注，我们下期见」", "to": "整句删除", "why": "脚本里没有这句；加进去会把 32 秒撑到 36 秒，节奏全乱", "kw": ["加台词", "36 秒", "节奏", "删"]}, {"op": "改", "frm": "模型第 2 镜一个画面配两句台词", "to": "拆成两镜：一镜讲「问题不在文字」，一镜讲「只看第三块」", "why": "一镜两句在剪辑时必然对不上，只能靠延长画面凑", "kw": ["一镜一句", "拆镜", "对不上"]}], "refsheet": "S01｜改后用｜画面与台词对不上｜换成「纪要被人划过去」的特写\nS02｜改后用｜一镜塞了两句台词｜拆成两镜，各放一句\nS03｜改后用｜时长没写具体秒数｜每镜写具体秒数并相加\nS04｜删｜画面不承担信息｜删掉，或换成纯文字卡\nS05｜删｜擅自加台词｜整句删除，不加\nS06｜改后用｜生成镜头过多｜压到 3 个以内，其余用现成素材\n\n四条最容易判错的：\n· S01 不是「画面不好看」，是画面太万能——万能画面等于不承担信息。\n· S04 时长不短、画面不丑，但 4 秒没台词也没信息，删。\n· S05 看着礼貌，实际是擅自改脚本，会撑破总时长。\n· S06 不是「技术做不到」，是成本不划算；三个生成镜头是经验上限。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的视频分镜助手。我会贴一段 120 字左右的口播脚本。请拆成分镜表，五列固定：\n镜号 | 画面（一句话描述） | 台词（原文照搬，不改写） | 时长（秒） | 素材来源（现成/需生成/需实拍）\n规则：① 一个镜头只放一句台词；② 总时长控制在 28–32 秒，每镜时长相加要等于总数；③ 需要生成的镜头不超过 3 个，其余用现成素材或纯文字卡；④ 不要新增脚本里没有的台词。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】分镜表五列（镜号 / 画面 / 台词 / 时长 / 素材来源）\n【参考案例】同一份脚本，分镜拆得细的成片不用返工\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的视频分镜助手。我会贴一段 120 字左右的口播脚本。请拆成分镜表，五列固定：\n镜号 | 画面（一句话描述） | 台词（原文照搬，不改写） | 时长（秒） | 素材来源（现成/需生成/需实拍）\n规则：① 一个镜头只放一句台词；② 总时长控制在 28–32 秒，每镜时长相加要等于总数；③ 需要生成的镜头不超过 3 个，其余用现成素材或纯文字卡；④ 不要新增脚本里没有的台词。", "rubric": ["每个镜头只对应一句台词，没有一镜塞两句", "总时长能算出来且在 28–32 秒之间，不是「大约半分钟」", "素材来源分三类标注：现成素材 / 需生成 / 需实拍，需生成的不超过三个", "开头三秒内的画面能独立抓住注意力，不依赖旁白"]}, {"id": "M6U7", "tier": "adv", "step": "todo", "title": "交一份视频脚本与分镜", "video": {"dur": "3.2min", "script": ["视频不是做给自己看的，观众错了，做得再好也没人看", "视频方案五段（观众 / 目标 / 脚本 / 分镜 / 素材清单）", "同一份脚本，先确认观众后重写了开头，完播率差一倍"]}, "ppt": {"method": "视频方案五段（观众 / 目标 / 脚本 / 分镜 / 素材清单）", "case": "同一份脚本，先确认观众后重写了开头，完播率差一倍", "demo": "视频方案模板与填写示例"}, "objective": "能产出一份含脚本与分镜的完整视频方案，含目标观众、发布位置与素材清单", "transfer": "把这份方案发给要发布的人确认一次观众与位置，确认后再动手做画面", "vslides": [{"t": "第一步：先写观众和位置", "n": "做视频的第一个动作不是写脚本，是回答三个问题：给谁看、在哪发、他看的时候在干什么。第三个问题最容易被忽略，但它决定形式。午休刷手机的人，多数是静音看，所以你的视频必须有硬字幕，开头三秒不能靠旁白——他听不到。如果是在会议室投屏看，那就相反，画面可以慢、字幕可以少。同样一条内容，这两种场景需要两种做法。先写清这三个问题，后面所有决定都有依据：要不要字幕、开头放几秒、需不需要背景音乐。不写，你就会按自己的习惯做，而你的习惯通常不是观众的习惯。这三个问题的答案要写进方案第一行，不是心里知道就行——写下来，别人才好判断你有没有想清楚。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 给谁看\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 给谁看</tspan></text></g><g data-k=\"② 在哪发\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 在哪发</tspan></text></g><g data-k=\"③ 他当时在做什么\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 他当时在做什么</tspan></text></g></svg>", "d": 59.14}, {"t": "第二步：一句话目标 + 120 字脚本", "n": "目标要写成「希望对方做什么」，不是「介绍某件事」。「介绍纪要的四块结构」是内容，不是目标；「希望对方把手上那份纪要重排一遍」才是目标。写成动作，你才知道结尾该给什么指令。脚本控制在一百二十字，是因为三十秒口播大约就这么多。写超了，你会在配音时被迫加速，听起来像赶时间。结构照旧三段：钩子、三个要点、一个动作。钩子那句建议最后写——先把三个要点写顺，再回头找一句能让人停下来的开头。先写钩子的人，往往写出一句很用力但没信息的话。一百二十字不是死规定，但它是个很好的检验：写到一百八十字，你一定会发现有一个要点是多余的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"目标写成动作\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">目标写成动作</tspan></text></g><g data-k=\"脚本 ≤120 字\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">脚本 ≤120 字</tspan></text></g><g data-k=\"钩子最后写\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">钩子最后写</tspan></text></g></svg>", "d": 63.89}, {"t": "第三步：分镜与素材清单，把成本控住", "n": "分镜表的作用不只是拍摄依据，它还是成本预估。把每镜标上「现成 / 需生成 / 需实拍」，你一眼就知道这件事要花多久。经验值是：需生成的镜头控制在三个以内，因为生成画面不可控，调一张可能半小时。剩下的用现成素材和纯文字卡，成片质量不会差。素材清单要单独列，别混在分镜里，因为它是你要去准备的东西，不是已经有的东西。最后做红线检查：有没有人脸、有没有客户信息、有没有真实标识、生成的图有没有水印。四项过完再动手做，比做完再改省事得多。素材清单做完先估一下时间：需生成三个镜头按每个半小时算，需实拍两个按一小时算，心里就有数了。时间估算出来之后，如果超过一天，就该砍镜头而不是加班。砍镜头永远比赶工有效。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">素材四类，成本可控</tspan></text><g data-k=\"现成素材\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">现成素材</tspan></text></g><g data-k=\"需生成（≤3）\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">需生成（≤3）</tspan></text></g><g data-k=\"需实拍\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">需实拍</tspan></text></g><g data-k=\"纯文字卡\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">纯文字卡</tspan></text></g></svg>", "d": 69.48}], "deliverable": {"type": "skill", "name": "视频方案（脚本 + 分镜）", "rubric": ["观众明确", "时长能算", "素材可控"], "acceptance": "一份方案：观众与位置明确、目标一句话、脚本 120 字内、分镜 ≤8 镜且时长 28–32 秒"}, "practice": {"steps": ["先写观众与位置：给谁看、在哪发、看的人当时在做什么", "写一句话目标：这条视频看完，希望对方做什么", "写 120 字脚本：钩子、三个要点、一个动作", "拆 8 镜分镜：一镜一句台词，算总时长，标素材来源", "列素材清单：现成素材 / 需生成 / 需实拍各几个，需生成不超三个"], "exemplar": "【新人培训 · 30 秒口播视频方案】\n方案人：小林　日期：2026-11-14　版本：v2\n\n■ 一、观众与位置\n给谁看：入职 1–3 个月的新人（约 40 人）\n在哪发：内部学习群，配合 M5 课程推送\n看的人当时在做什么：午休后刷手机，通常静音看，三秒决定要不要点开\n结论对开头的影响：必须静音可读、必须有字幕、前三秒不能靠旁白\n\n■ 二、一句话目标\n看完这条视频，希望对方把手上最近一份纪要按「四块」重排一遍。\n\n■ 三、脚本（118 字）\n你上周那份纪要，可能没人看第二遍。（钩子）\n问题不在文字，在结构。大家只看第三块：谁要做什么。\n一条待办写清四样——谁、做什么、什么时候、交什么——它才真的派出去。\n发群之前，先给主持人确认一句。\n每周二十分钟过一遍，漏的事会少一大半。\n今天就能做的一件事：把上次的纪要按四块重排。\n\n■ 四、分镜（8 镜，合计 32 秒）\n| 镜号 | 画面 | 台词 | 时长 | 素材来源 |\n|---|---|---|---|---|\n| 1 | 一份纪要被人用手划过去 | 你上周那份纪要，可能没人看第二遍。 | 4 | 需实拍 |\n| 2 | 白板写「结论/决议/待办/待定」 | 问题不在文字，在结构。 | 3 | 需生成 |\n| 3 | 手指点在「待办」栏 | 大家只看第三块：谁要做什么。 | 4 | 需实拍 |\n| 4 | 一页 vs 五页并排 | 一页能读完的纪要，才会被读完。 | 4 | 需生成 |\n| 5 | 表格四格被逐格填上 | 每条待办写清四样，它才真的派出去。 | 5 | 需生成 |\n| 6 | 纪要发到群里，有人回「收到」 | 发群之前，先给主持人确认一句。 | 4 | 现成 |\n| 7 | 日历「周一 09:30」被圈出 | 每周二十分钟过一遍，漏的事会少一大半。 | 5 | 现成 |\n| 8 | 纯文字卡 + 字幕 | 今天就能做的一件事：把上次的纪要按四块重排。 | 3 | 纯文字卡 |\n\n■ 五、素材清单\n· 现成素材：2 个（第 6、7 镜，取自已发布课程片段，无客户信息）\n· 需生成：3 个（第 2、4、5 镜，扁平插画风格，已按 M6U2 风格锚）\n· 需实拍：2 个（第 1、3 镜，手机拍桌面即可，不出现人脸与工牌）\n· 纯文字卡：1 个（第 8 镜）\n· 字幕：全片硬字幕（观众多为静音观看）\n\n■ 六、红线检查\n· 无真人肖像、无客户信息、无真实公司标识。\n· 生成素材来自公司已采购平台，无水印。\n· 内部群发布，不用于对外投放；若对外需重新确认授权。\n\n■ 七、待确认\n· 第 6 镜素材是否可截用课程片段 —— 问课程负责人（11/15 前）。"}, "task": "产出《视频方案（脚本 + 分镜）》：先写观众与位置：给谁看、在哪发、看的人当时在做什么；写一句话目标：这条视频看完，希望对方做什么；写 120 字脚本：钩子、三个要点、一个动作；拆 8 镜分镜：一镜一句台词，算总时长，标素材来源；列素材清单：现成素材 / 需生成 / 需实拍各几个，需生成不超三个", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M6 用 AI 做图与做视频」模块，你要交付的是《视频方案（脚本 + 分镜）》。\n【场景】业务侧这周的诉求是：视频不是做给自己看的，观众错了，做得再好也没人看。参考做法：同一份脚本，先确认观众后重写了开头，完播率差一倍。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（视频方案五段（观众 / 目标 / 脚本 / 分镜 / 素材清单）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《视频方案（脚本 + 分镜）》填写模板】\n\n■ 1. 先写观众与位置：给谁看、在哪发、看的人当时在做什么\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 写一句话目标：这条视频看完，希望对方做什么\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写 120 字脚本：钩子、三个要点、一个动作\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 拆 8 镜分镜：一镜一句台词，算总时长，标素材来源\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 列素材清单：现成素材 / 需生成 / 需实拍各几个，需生成不超三个\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【新人培训 · 30 秒口播视频方案】\n方案人：小林　日期：2026-11-14　版本：v2\n\n■ 一、观众与位置\n给谁看：入职 1–3 个月的新人（约 40 人）\n在哪发：内部学习群，配合 M5 课程推送\n看的人当时在做什么：午休后刷手机，通常静音看，三秒决定要不要点开\n结论对开头的影响：必须静音可读、必须有字幕、前三秒不能靠旁白\n\n■ 二、一句话目标\n看完这条视频，希望对方把手上最近一份纪要按「四块」重排一遍。\n\n■ 三、脚本（118 字）\n你上周那份纪要，可能没人看第二遍。（钩子）\n问题不在文字，在结构。大家只看第三块：谁要做什么。\n一条待办写清四样——谁、做什么、什么时候、交什么——它才真的派出去。\n发群之前，先给主持人确认一句。\n每周二十分钟过一遍，漏的事会少一大半。\n今天就能做的一件事：把上次的纪要按四块重排。\n\n■ 四、分镜（8 镜，合计 32 秒）\n| 镜号 | 画面 | 台词 | 时长 | 素材来源 |\n|---|---|---|---|---|\n| 1 | 一份纪要被人用手划过去 | 你上周那份纪要，可能没人看第二遍。 | 4 | 需实拍 |\n| 2 | 白板写「结论/决议/待办/待定」 | 问题不在文字，在结构。 | 3 | 需生成 |\n| 3 | 手指点在「待办」栏 | 大家只看第三块：谁要做什么。 | 4 | 需实拍 |\n| 4 | 一页 vs 五页并排 | 一页能读完的纪要，才会被读完。 | 4 | 需生成 |\n| 5 | 表格四格被逐格填上 | 每条待办写清四样，它才真的派出去。 | 5 | 需生成 |\n| 6 | 纪要发到群里，有人回「收到」 | 发群之前，先给主持人确认一句。 | 4 | 现成 |\n| 7 | 日历「周一 09:30」被圈出 | 每周二十分钟过一遍，漏的事会少一大半。 | 5 | 现成 |\n| 8 | 纯文字卡 + 字幕 | 今天就能做的一件事：把上次的纪要按四块重排。 | 3 | 纯文字卡 |\n\n■ 五、素材清单\n· 现成素材：2 个（第 6、7 镜，取自已发布课程片段，无客户信息）\n· 需生成：3 个（第 2、4、5 镜，扁平插画风格，已按 M6U2 风格锚）\n· 需实拍：2 个（第 1、3 镜，手机拍桌面即可，不出现人脸与工牌）\n· 纯文字卡：1 个（第 8 镜）\n· 字幕：全片硬字幕（观众多为静音观看）\n\n■ 六、红线检查\n· 无真人肖像、无客户信息、无真实公司标识。\n· 生成素材来自公司已采购平台，无水印。\n· 内部群发布，不用于对外投放；若对外需重新确认授权。\n\n■ 七、待确认\n· 第 6 镜素材是否可截用课程片段 —— 问课程负责人（11/15 前）。", "rubric": ["写清了给谁看、在哪发、看的人当时在什么状态", "一句话目标写的是「希望对方做什么」，不是「介绍某件事」", "脚本 120 字内，钩子在开头三秒，结尾有一个明确动作", "分镜 ≤8 镜、总时长 28–32 秒、需生成镜头 ≤3 个"]}, {"id": "M6U8", "tier": "adv", "step": "spar", "title": "同事问这条视频给谁看", "video": {"dur": "3.2min", "script": ["说不清给谁看的内容，通常谁都不会看", "观众三答（是谁 / 在哪看 / 看完做什么）", "「给新人看的」与「给入职 1–3 个月、午休静音刷手机的新人看的」的差别"]}, "ppt": {"method": "观众三答（是谁 / 在哪看 / 看完做什么）", "case": "「给新人看的」与「给入职 1–3 个月、午休静音刷手机的新人看的」的差别", "demo": "陪练说明：他会一路追问到「所以到底改变了什么」"}, "objective": "能在被问「这条视频给谁看」时，说清观众状态、发布位置与目标动作，并守住红线", "transfer": "下次做任何内容前，先在方案第一行写下观众与位置，写完再动手", "vslides": [{"t": "陪练说明：他会一路追问到「到底改变了什么」", "n": "这一关的对手是内容负责人。他会从「给谁看」开始，一路问到「看完改变什么」。新人通常第一问就答得含糊：「给新人看的」。这句话在他那里等于没答，因为新人有一百多个，入职第一周和入职半年需要的东西完全不同。正确答法要说到阶段和人数：「入职一到三个月的内部新人，大约四十人」。有了这个范围，后面所有判断才有依据。这一关真正的考点是：你能不能把「做一个内容」和「改变一个行为」连起来。他还会顺手问一句「这批人现在最大的问题是什么」，答不出具体问题，说明你没看过他们的东西。说到底，观众这一问答不清，后面所有问题都会变成猜。你先写清给谁看、在哪看、看完做什么，脚本、分镜、字幕这些决定才有依据；写不清，你做的每个选择都只能靠感觉，而感觉通常来自你自己的习惯，不是观众的习惯。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">观众三答</tspan></text><g data-k=\"是谁（阶段+人数）\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">是谁（阶段+人</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">数）</tspan></text></g><g data-k=\"在哪看（场景）\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">在哪看（场景）</tspan></text></g><g data-k=\"看完做什么（动作）\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">看完做什么（动</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">作）</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 74.38}, {"t": "第二问：他们在什么状态", "n": "「他们看的时候在什么状态」这一问，考的是你有没有想过形式。答案要具体：午休后刷手机、多数静音、三秒决定要不要点开。这三个细节直接决定了三件事：要有硬字幕、开头不能靠旁白、第一镜必须是画面能自解释的场景。反过来，如果你答「在电脑前认真看」，那说明你没观察过真实场景，只是在想象。这一问答得好，对方会立刻觉得你想清楚了；答得空，前面说的观众画像也会被打折。这一问还有个进阶答法：说清「所以我在形式上做了哪些妥协」，比如为了静音观看把关键信息做成字卡。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"静音 → 必须硬字幕\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">静音 → 必须硬字幕</tspan></text></g><g data-k=\"三秒决定 → 开头要抓人\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">三秒决定 → 开头要抓人</tspan></text></g><g data-k=\"手机 → 竖版或大字\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">手机 → 竖版或大字</tspan></text></g></svg>", "d": 53.69}, {"t": "第三、四问：看完做什么，能不能对外", "n": "「希望他们做什么」要答成一个可检验的动作：「把最近一份纪要按四块重排」。答「提升对纪要的重视」不算，因为它无法检验。最后一个问题最关键：这条片子能不能对外。答法要给出判断和边界：「这是内部培训片，不做对外；如果要给客户看，观众换了，开头结尾都得重写，不能只换封面。」把边界说清，对方才敢让你去做。边界含糊的片子，最后往往被要求「顺便改成对外版」，改到面目全非。边界说清之后，你反而更容易拿到资源，因为对方知道这件事的终点在哪，不会无限扩需求。所以这条视频我建议先花十分钟把方案第一行写死，再动手。这十分钟是整条片子里最值钱、也最能省返工的时间。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">能用</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">改到崩</tspan></text><g data-k=\"内部就内部，边界说清\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">内部就内部，边界说清</tspan></text></g><g data-k=\"「顺便也能对外用」\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">「顺便也能对外用」</tspan></text></g></svg>", "d": 66.65}], "deliverable": {"type": "skill", "name": "视频方案（修订版）", "rubric": ["观众具体", "场景说清", "边界分明"], "acceptance": "四问都答得出：观众画像（人数与阶段）、观看场景与状态、明确的目标动作、能不能对外的判断与理由"}, "spar": {"role": "内容负责人", "persona": "只关心两件事：观众是谁、看完改变什么；会一路追问到你说不出为止", "mustAsk": ["这条视频到底是给谁看的？", "他们看的时候在什么状态？在哪看？", "看完之后，你希望他们做什么？", "这条片子能对外发吗？"]}, "exemplar": "（同事问：这条视频到底是给谁看的）\n\n结论：给入职一到三个月的内部新人看，发在学习群，配合 M5 那门课推。\n依据：这批人现在最常出的问题是纪要写成实录，写了两千字没人看第二遍。他们看视频的场景是午休后刷手机，多数静音，所以全片做了硬字幕，开头三秒不靠旁白——第一镜是一份纪要被人划过去，静音也能看懂。\n边界：所以这条片子不做对外投放，也不放进对外宣传。如果之后要给客户看，观众换了，开头和结尾都得重写，不能直接改封面。另外第 6 镜截用了已发布课程片段，还需要课程负责人确认，我 11/15 前问。", "task": "把《视频方案（修订版）》拿到「内容负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《视频方案（修订版）》。现在要让它通过「内容负责人」这一关。\n【对手的立场】只关心两件事：观众是谁、看完改变什么；会一路追问到你说不出为止。\n【他一定会追问】「这条视频到底是给谁看的？」 / 「他们看的时候在什么状态？在哪看？」 / 「看完之后，你希望他们做什么？」\n【场景】你说「同事问这条视频给谁看」，对方立刻回一句：这条视频到底是给谁看的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["观众说到阶段与人数，不是「新人」「大家」", "说清观看场景与状态（静音、午休、手机），并说明它怎么影响了形式", "目标动作具体到「把最近一份纪要按四块重排」，不是「提升意识」", "能明确回答能不能对外，并说清换观众要改什么"]}]}, {"id": "M7", "title": "M7 红线、合规与综合实战", "dims": ["security", "strategy", "workflow"], "units": [{"id": "M7U1", "tier": "basic", "step": "understand", "title": "公司数据分级：什么能进 AI", "video": {"dur": "3.3min", "script": ["分级不是为了让你判合规，是为了让你知道这一条该问谁", "数据四级（公开 / 内部 / 敏感 / 禁出）", "一份带手机号的名单被贴进免费工具，第二天接到推销电话"]}, "ppt": {"method": "数据四级（公开 / 内部 / 敏感 / 禁出）", "case": "一份带手机号的名单被贴进免费工具，第二天接到推销电话", "demo": "四级卡：拿 6 类常见材料各标一级"}, "objective": "能给手上的材料标出公开 / 内部 / 敏感 / 禁出四级，并说出每一级该问谁确认", "transfer": "把本周要用的材料列成一张单子，逐条标级，把「敏感」与「禁出」两级的先标红", "vslides": [{"t": "分级不是让你判合规，是让你知道该问谁", "n": "很多新人以为数据分级是为了「自己判断能不能用」，于是不敢用，或者凭感觉用。这两种都不对。分级真正的用途是：给每条材料贴一个级别，级别决定下一步动作——公开级直接用；内部级可以用但不外传；敏感级要脱敏后再用，而且要问一句负责人；禁出级不能用，连问都不用问，直接换路径。所以分级的产物不是「能不能用」这四个字，是「该问谁、该怎么改」。你不需要成为合规专家，你只需要知道自己手上这条属于哪一级、以及卡住时找谁。这条认识很重要：判断合规结论不是你的职责，把疑点标出来交给该管的人是。这条分寸感是你在岗位上的一道护城河，比会用多少工具重要得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">数据四级</tspan></text><g data-k=\"公开\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">公开</tspan></text></g><g data-k=\"内部\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">内部</tspan></text></g><g data-k=\"敏感\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">敏感</tspan></text></g><g data-k=\"禁出\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">禁出</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 66.7}, {"t": "四级怎么判：看三个线索", "n": "判级别看三个线索，不用背条文。第一，这份东西泄露出去，谁会受影响——只有你，还是客户，还是公司整体。第二，这份东西是谁的——公开渠道拿到的、公司内部产出的、还是客户的。第三，有没有可识别到具体人的信息——姓名、手机号、身份证、住址、订单号。三个线索一过，级别基本就定了：公开渠道 + 无个人信息 = 公开级；公司内部产出 + 无个人信息 = 内部级；带个人信息或未公开经营数据 = 敏感级；带完整客户标识、合同原文、未发布财务数据 = 禁出级。注意「内部级」最容易误判：很多人以为公司内部的东西就能随便贴，其实内部级只是不外传，不等于可以给外部工具。三个线索里第三条最容易被忽略——很多人觉得「就一个订单号谁会去查」，但订单号能反查下单人。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 泄露了谁受影响\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 泄露了谁受影响</tspan></text></g><g data-k=\"② 这东西是谁的\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=
