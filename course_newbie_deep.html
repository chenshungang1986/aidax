data-k=\"约束：来源只用给定编号 / 不估算 / 同题合并\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：来源只用给定编号 / 不估算 / 同题合并</tspan></text></g><g data-k=\"产出：四栏骨架 + 待核实清单\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：四栏骨架 + 待核实清单</tspan></text></g></svg>", "d": 71.93}, {"t": "人工收口：可信度这一栏你来定", "n": "跑完最关键的一步是给可信度定级，而这件事 AI 做不好，因为它不知道你们行业的信源权重。判断标准大概是：官方发布 > 主流媒体 > 行业自媒体 > 社交平台传言。同一件事有两个以上独立来源，可信度可以往上调；只有一个来源且无法交叉验证，最多标中。标完之后你会自然得出一个结论：这份简报里真正能拿去决策的只有一两条，其余都是「知道有这事」。这个认识本身就很有价值，它会让你在周会上的表述更稳——说「已知有这事，具体力度待核实」比说「行业在补贴」安全得多。周会上最稳的表述是「已知有这事，力度待核实」，既交代事实，也交代边界。最后补一句：简报发出去之前，把「待核实」那几条单独抄成一张便签贴在屏幕上，它们才是你接下来真正要去查的东西。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"官方 &gt; 媒体 &gt; 自媒体\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">官方 &gt; 媒体 &gt; 自媒体</tspan></text></g><g data-k=\"两个独立来源才上调\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">两个独立来源才上调</tspan></text></g><g data-k=\"单一来源最多标中\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">单一来源最多标中</tspan></text></g></svg>", "d": 68.69}], "deliverable": {"type": "skill", "name": "带来源的情报简报", "rubric": ["来源齐全", "可信度标注", "真能用"], "acceptance": "提交后每条结论都能指回材料编号，且标了可信度与依据；待核实项单列"}, "demo": {"ref": "| 结论 | 依据 | 来源 | 可信度 |\n|---|---|---|---|\n| 某平台在华东三城做履约时效补贴 | 11/01 起生效，主打次日达 | M01 | 中（单一媒体报道，无官方公告） |\n| 某平台上新自有品牌，覆盖粮油与日化 | 全国铺开，未披露销量 | M02 | 中（同上） |\n| 行业整体增速缺乏公开口径 | 两份报道统计周期不一致 | M01、M02 | 低（口径冲突） |\n| 政策侧出现价格行为提示 | 某地市场监管部门发文 | M03 | 高（官方发布） |\n\n■ 需要补充才能下的判断\n· 「补贴力度是否超过我们」——缺具体金额与覆盖单量，待核实。\n· 「自有品牌是否冲击我们的类目」——缺铺货门店数与价格带，待核实。\n\n⚠ 以上未使用任何内部数据；所有结论可指回 M01–M03 三份材料。", "fix": ["把 AI 自己补的两个「行业平均增速」删掉了——它编了一个百分比，而两份材料的统计周期根本不一致。", "给每条都补了可信度，并写明依据（单一媒体 / 官方发布 / 口径冲突）。不标可信度，读的人会以为四条一样硬。", "把「行业增速」那条从结论改成「缺乏公开口径」——这本身就是一条有价值的结论，比硬凑一个数字强。", "删掉 AI 加的「建议我们跟进补贴」——那是经营判断，不在简报范围内，也不该由新人下。"], "judge": "判断依据：有没有出现材料里没有的数字；每条是否有来源编号；可信度是否给了依据；有没有越权给经营建议", "sheet": {"situ": "师傅让你「查一下社区团购最近有什么变化」，你搜回来 6 条材料，来源杂、说法不一。你要把它们整理成简报骨架：每条归到一条结论、标出来源编号、给一个可信度，并判断它能不能直接进简报。", "ask": "① 逐条判断它对应哪条结论、出自哪份材料；② 给一个可信度（高/中/低）；③ 判断它是能直接进简报、需补口径，还是根本不该进。", "gen": "请基于以上整理表：① 按「结论 / 依据 / 来源 / 可信度」四栏出一份简报骨架；② 来源只填 M01–M06 的编号，不要补充我没给的来源；③ 材料里没写的数字写「待核实」，不要估算。\n不要给经营建议，不要对「我们该不该跟进」下结论。", "mats": [{"id": "M01", "src": "XX 财经 · 11/01", "text": "某社区团购平台在华东 3 城推出履约时效补贴，主打到次日达，11 月 1 日起生效。报道未披露补贴金额与覆盖单量。"}, {"id": "M02", "src": "XX 商业 · 10/30", "text": "某平台上新自有品牌，覆盖粮油与日化两个类目，全国铺开。报道未披露销量与铺货门店数。"}, {"id": "M03", "src": "某地市场监管局官网 · 10/28", "text": "发布社区团购价格行为提示，要求明码标价、促销规则清晰，主要涉及团长端的价格展示。"}, {"id": "M04", "src": "行业观察公众号 · 10/25", "text": "有观点认为团长正在向「多平台同时经营」迁移，文章举了两个案例，但未给出任何统计数据。"}, {"id": "M05", "src": "平台官网招商页 · 09/30", "text": "平台自述「月活用户 3000 万，覆盖 200 个城市」，未说明统计口径与是否去重。"}, {"id": "M06", "src": "某论坛帖 · 10/29 · 匿名", "text": "有人说某平台要退出华南市场，帖子无来源、无证据，跟帖里有自称员工的人否认。"}], "cols": [{"k": "concl", "name": "对应哪条结论", "hint": "一条材料对应一条结论", "type": "chips", "w": 3, "tags": ["华东履约补贴", "自有品牌上新", "价格行为提示", "团长迁移", "平台月活", "退出传闻"]}, {"k": "src", "name": "来源编号", "hint": "就是素材编号", "type": "chips", "w": 2, "tags": ["M01", "M02", "M03", "M04", "M05", "M06"]}, {"k": "cred", "name": "可信度", "hint": "官方 > 媒体 > 自媒体 > 论坛", "type": "chips", "w": 2, "tags": ["高", "中", "低"]}, {"k": "flag", "name": "能不能进简报", "hint": "看它缺不缺口径、有没有来源", "type": "chips", "w": 3, "tags": ["可直接用", "需补口径", "不入简报"]}], "key": {"M01": {"concl": "华东履约补贴", "src": "M01", "cred": "中", "flag": "需补口径"}, "M02": {"concl": "自有品牌上新", "src": "M02", "cred": "中", "flag": "需补口径"}, "M03": {"concl": "价格行为提示", "src": "M03", "cred": "高", "flag": "可直接用"}, "M04": {"concl": "团长迁移", "src": "M04", "cred": "低", "flag": "不入简报"}, "M05": {"concl": "平台月活", "src": "M05", "cred": "低", "flag": "需补口径"}, "M06": {"concl": "退出传闻", "src": "M06", "cred": "低", "flag": "不入简报"}}, "notes": {"M01·cred": "主流媒体但单一来源、无官方公告 → 中。标高的前提是有官方或第二独立来源", "M04·flag": "观点类、无数据 → 不入简报。硬写进去会被问「哪来的统计」", "M05·cred": "平台自述、口径未说明 → 低。自述天然有商业动机，不能与第三方等同", "M05·flag": "不是完全不能用，但必须补口径（是否去重、含不含小程序）才能引用", "M06·flag": "匿名帖、无证据、已被否认 → 不入简报。写进去等于替谣言背书", "M03·cred": "官方发布 → 高。这是六条里唯一可以标高的"}, "delta": [{"op": "改", "frm": "模型把 M05「月活 3000 万」写成结论并标「高」", "to": "改成「平台自述月活 3000 万，口径未说明」，可信度降为中/低", "why": "自述不是第三方数据，直接标高会误导决策", "kw": ["自述", "口径", "降低", "第三方"]}, {"op": "删", "frm": "模型把 M06「退出华南」也写进了结论，标注「据传」", "to": "整条删除，改为「已排除：匿名帖且被否认」", "why": "「据传」不是免责，写进简报就等于替它背书", "kw": ["删除", "匿名", "否认", "据传"]}, {"op": "补", "frm": "模型漏掉了 M04 的低可信度说明", "to": "补一句「观点类内容，无统计数据，仅供参考」并标低", "why": "观点不是事实，不标清楚会被当成行业趋势引用", "kw": ["观点", "无数据", "参考", "趋势"]}, {"op": "改", "frm": "模型给 M01、M02 都标了「高」", "to": "改为「中」，并注明「单一媒体报道，无官方公告、无第二来源」", "why": "全标高是新手最典型的错，读过原文的人一眼能看出来", "kw": ["单一来源", "中", "第二来源", "官方"]}], "refsheet": "M01｜华东履约补贴｜M01｜中｜需补口径\nM02｜自有品牌上新｜M02｜中｜需补口径\nM03｜价格行为提示｜M03｜高｜可直接用\nM04｜团长迁移｜M04｜低｜不入简报\nM05｜平台月活｜M05｜低｜需补口径\nM06｜退出传闻｜M06｜低｜不入简报\n\n四条最容易判错的：\n· M03 是六条里唯一能标高可信度的：官方发布、内容明确。\n· M05 不是「不能用」，是「补口径后能用」——自述数据本身有价值，但不能当第三方数据引。\n· M04 是观点不是事实，且无数据 → 不入简报；写进去会被追问统计口径。\n· M06 匿名且被否认 → 直接排除，不要用「据传」这种模糊写法。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的资料整理助手。请基于我贴的材料，整理成一份简报骨架，四栏固定：结论 | 依据 | 来源（材料编号）| 可信度（高/中/低）。\n规则：① 每条结论最多一句话；② 来源只填我给你的材料编号，不要补充我没给的来源；③ 材料里没写的数字不要估算，写「待核实」；④ 同一主题的多条信息合并成一条结论，来源列全部列出。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】情报简报四栏（结论 / 依据 / 来源 / 可信度）\n【参考案例】同一条行业消息，带来源与不带来源在周会上被追问的差别\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的资料整理助手。请基于我贴的材料，整理成一份简报骨架，四栏固定：结论 | 依据 | 来源（材料编号）| 可信度（高/中/低）。\n规则：① 每条结论最多一句话；② 来源只填我给你的材料编号，不要补充我没给的来源；③ 材料里没写的数字不要估算，写「待核实」；④ 同一主题的多条信息合并成一条结论，来源列全部列出。", "rubric": ["每条结论都标了来源编号，编号能对上前面的材料清单", "可信度不是全标一种，且能说出依据（单一来源/官方/口径冲突）", "低可信度或观点类材料被明确标注，未混进结论", "待核实项写清缺什么、怎么补，而不是只写「待核实」"]}, {"id": "M2U3", "tier": "basic", "step": "todo", "title": "做一份能给主管看的行业简报", "video": {"dur": "3.5min", "script": ["简报的价值不在信息多，在于每条信息都能被追溯", "简报模板（结论 / 依据 / 来源 / 可信度 / 待核实）", "一位新人第一次交简报被退回，第二次按四栏重做后一次通过"]}, "ppt": {"method": "简报模板（结论 / 依据 / 来源 / 可信度 / 待核实）", "case": "一位新人第一次交简报被退回，第二次按四栏重做后一次通过", "demo": "简报模板与填写示例"}, "objective": "能产出一份 6–8 条的行业简报，每条带来源与可信度，并列出 3 条待核实项", "transfer": "把简报发给主管前，自己先按「来源能不能点开」逐条点一遍，点不开的删掉或降级", "vslides": [{"t": "第一步：先把主题和时间范围钉死", "n": "写简报第一个动作不是搜，是写标题。标题要含主题和时间范围，比如「社区团购 · 近 30 天动态」。写清范围有两个好处：一是你搜的时候知道什么时候该停，二是读的人知道这份东西的时效。很多新人交上来的简报被退回，原因不是内容差，是「不知道覆盖了多长时间」，读的人没法判断还能不能用。范围定了，材料就好筛：超出范围的、来源不明的，直接不进。还有一个动作建议做：先建一个材料清单表，边搜边编号 M01、M02，搜完再写结论。顺序反过来，你会为了凑结论去找材料，那就本末倒置了。材料清单还可以加一列「为什么选它」，写清它跟主题的关系，后面写结论时省很多力气。编号这件事看起来机械，实际是整个流程里最省时间的一步：编号之后正文里只写 M03，读者自己就能翻到，你不用在括号里塞一长串链接。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 标题写清主题 + 时间范围\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 标题写清主题 + 时间范围</tspan></text></g><g data-k=\"② 先建材料清单再搜\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 先建材料清单再搜</tspan></text></g><g data-k=\"③ 边搜边编号 M01…\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 边搜边编号 M01…</tspan></text></g></svg>", "d": 77.23}, {"t": "第二步：每条结论都要能指回一份材料", "n": "写结论时有个硬规则：写不出来源的那条，删掉。这条规则听着粗暴，但极其有效。你可以试一下：随手写五条结论，然后逐条问「这出自哪份材料」，通常会有两三条答不上来——那些就是你从别处听来的印象，或者 AI 顺口补的。它们看着很对，但在会上被追问一句就塌。留下来的三到五条，才是你真正查到的东西。会不会显得太少？不会。一份六条但每条都能追溯的简报，比一份二十条但一半查不到出处的东西有用得多。主管要的是能拿去说的东西，不是信息量。如果你担心条数太少，可以把全部材料清单放进附件，正文只留能追溯的那几条。另外一个细节是结论的写法：一条结论只讲一件事，不要用「此外」「同时」把两件事塞进一句，塞进去之后来源就对不上了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"写不出来源的结论直接删\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写不出来源的结论直接删</tspan></text></g><g data-k=\"每条能指回材料编号\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条能指回材料编号</tspan></text></g><g data-k=\"六条比二十条有用\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">六条比二十条有用</tspan></text></g></svg>", "d": 68.33}, {"t": "第三步：待核实清单比结论更重要", "n": "最后一步是写待核实，很多人会跳过这一节，觉得「没查到就别写」。恰恰相反，这一节最能体现你的判断力：它说明你知道自己不知道什么。写法是三段：缺什么数据、为什么需要它、打算怎么补。比如「缺补贴金额，因为要判断力度是否超过我们，打算查平台招商政策或问服务商」。这样写，主管看完不仅知道你知道边界，还可能直接告诉你「这个我问过，是 X」。跳过这一节的人，通常会在会上被问住，然后被认定「查得不够」。写清缺口反而是加分项，因为它把「不知道」变成了「有计划地知道」。写得越具体，主管越容易接话；写得越笼统，越像没查。还有一条：交付前自己念一遍这六到八条，念的时候如果有一句你自己都要停下来想「这是从哪来的」，那句就该删。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">待核实三段式</tspan></text><g data-k=\"缺什么数据\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">缺什么数据</tspan></text></g><g data-k=\"为什么需要它\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">为什么需要它</tspan></text></g><g data-k=\"打算怎么补\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">打算怎么补</tspan></text></g></svg>", "d": 65.45}], "deliverable": {"type": "skill", "name": "行业简报（6–8 条）", "rubric": ["来源可追", "可信度有据", "待核实清楚"], "acceptance": "一份 6–8 条的简报：每条有来源编号与可信度、有独立的待核实清单、所有链接可打开、无内部数据"}, "practice": {"steps": ["确定主题与时间范围（比如「近 30 天社区团购」），写在标题下", "收集 5–8 份公开材料，按 M01、M02 编号", "每条结论一句话，配依据、来源编号、可信度", "单列「待核实」一节，写清缺什么、打算怎么补", "交之前逐条点一遍来源链接，点不开的删掉或降级"], "exemplar": "【社区团购 · 近 30 天动态简报】\n整理人：小林　时间范围：2026-10-01 ~ 2026-11-01　用途：部门周会 5 分钟同步\n\n■ 一、结论（6 条）\n\n1. 头部平台在华东三城推履约时效补贴，主打到次日达。\n　依据：11/01 起生效，覆盖华东 3 城，未披露补贴金额\n　来源：M01　可信度：中（单一媒体报道，未见官方公告）\n\n2. 有平台上新自有品牌，覆盖粮油与日化两个类目。\n　依据：全国铺开，未披露销量与铺货门店数\n　来源：M02　可信度：中（同上，无第二来源）\n\n3. 行业整体增速目前缺乏统一口径。\n　依据：M01 与 M02 引用的统计周期不一致（一个季度、一个自然月）\n　来源：M01、M02　可信度：低（口径冲突，不宜引用具体数字）\n\n4. 某地市场监管部门发布价格行为提示，指向社区团购团长端。\n　依据：官方发文，要点为明码标价与促销规则\n　来源：M03　可信度：高（官方发布）\n\n5. 团长端出现向「多平台同时经营」迁移的讨论。\n　依据：两篇行业观察提到同一现象，但均未给数据\n　来源：M04、M05　可信度：低（观点类，非事实）\n\n6. 履约成本成为本周期竞争焦点，而非单纯价格战。\n　依据：结合第 1 条（补贴集中在时效）与第 4 条（价格行为被提示）\n　来源：M01、M03　可信度：中（推理结论，非直接事实）\n\n■ 二、待核实（3 条）\n\n1. 补贴的具体力度：缺补贴金额与覆盖单量。\n　补法：找平台侧公开的招商政策，或问合作的服务商。\n2. 自有品牌的铺货范围：缺门店数与价格带。\n　补法：看两个平台的 App 按城市抽查，记录有货城市。\n3. 本地是否有同类提示：只看到外地发文。\n　补法：查本地市场监管部门官网的公告栏，按关键词检索。\n\n■ 三、材料清单\n\nM01　《某平台华东履约补贴》　来源：XX 财经　日期：11/01　链接：可打开\nM02　《某平台上新自有品牌》　来源：XX 商业　日期：10/30　链接：可打开\nM03　《社区团购价格行为提示》　来源：某地市场监管局官网　日期：10/28　链接：可打开\nM04　《团长迁移观察》　来源：XX 行业观察　日期：10/25　链接：可打开\nM05　《社区团购履约成本讨论》　来源：XX 公众号　日期：10/22　链接：可打开\n\n■ 四、这份简报没有用到的东西\n· 未使用任何内部销售数据、成本数据与客户名单\n· 未引用任何无法打开链接的材料\n· 未对「我们该不该跟进」下结论（这属于经营判断，留给周会讨论）"}, "task": "产出《行业简报（6–8 条）》：确定主题与时间范围（比如「近 30 天社区团购」），写在标题下；收集 5–8 份公开材料，按 M01、M02 编号；每条结论一句话，配依据、来源编号、可信度；单列「待核实」一节，写清缺什么、打算怎么补；交之前逐条点一遍来源链接，点不开的删掉或降级", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M2 用 AI 收集与整理信息」模块，你要交付的是《行业简报（6–8 条）》。\n【场景】业务侧这周的诉求是：简报的价值不在信息多，在于每条信息都能被追溯。参考做法：一位新人第一次交简报被退回，第二次按四栏重做后一次通过。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（简报模板（结论 / 依据 / 来源 / 可信度 / 待核实）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《行业简报（6–8 条）》填写模板】\n\n■ 1. 确定主题与时间范围（比如「近 30 天社区团购」），写在标题下\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 收集 5–8 份公开材料，按 M01、M02 编号\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 每条结论一句话，配依据、来源编号、可信度\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 单列「待核实」一节，写清缺什么、打算怎么补\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 交之前逐条点一遍来源链接，点不开的删掉或降级\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【社区团购 · 近 30 天动态简报】\n整理人：小林　时间范围：2026-10-01 ~ 2026-11-01　用途：部门周会 5 分钟同步\n\n■ 一、结论（6 条）\n\n1. 头部平台在华东三城推履约时效补贴，主打到次日达。\n　依据：11/01 起生效，覆盖华东 3 城，未披露补贴金额\n　来源：M01　可信度：中（单一媒体报道，未见官方公告）\n\n2. 有平台上新自有品牌，覆盖粮油与日化两个类目。\n　依据：全国铺开，未披露销量与铺货门店数\n　来源：M02　可信度：中（同上，无第二来源）\n\n3. 行业整体增速目前缺乏统一口径。\n　依据：M01 与 M02 引用的统计周期不一致（一个季度、一个自然月）\n　来源：M01、M02　可信度：低（口径冲突，不宜引用具体数字）\n\n4. 某地市场监管部门发布价格行为提示，指向社区团购团长端。\n　依据：官方发文，要点为明码标价与促销规则\n　来源：M03　可信度：高（官方发布）\n\n5. 团长端出现向「多平台同时经营」迁移的讨论。\n　依据：两篇行业观察提到同一现象，但均未给数据\n　来源：M04、M05　可信度：低（观点类，非事实）\n\n6. 履约成本成为本周期竞争焦点，而非单纯价格战。\n　依据：结合第 1 条（补贴集中在时效）与第 4 条（价格行为被提示）\n　来源：M01、M03　可信度：中（推理结论，非直接事实）\n\n■ 二、待核实（3 条）\n\n1. 补贴的具体力度：缺补贴金额与覆盖单量。\n　补法：找平台侧公开的招商政策，或问合作的服务商。\n2. 自有品牌的铺货范围：缺门店数与价格带。\n　补法：看两个平台的 App 按城市抽查，记录有货城市。\n3. 本地是否有同类提示：只看到外地发文。\n　补法：查本地市场监管部门官网的公告栏，按关键词检索。\n\n■ 三、材料清单\n\nM01　《某平台华东履约补贴》　来源：XX 财经　日期：11/01　链接：可打开\nM02　《某平台上新自有品牌》　来源：XX 商业　日期：10/30　链接：可打开\nM03　《社区团购价格行为提示》　来源：某地市场监管局官网　日期：10/28　链接：可打开\nM04　《团长迁移观察》　来源：XX 行业观察　日期：10/25　链接：可打开\nM05　《社区团购履约成本讨论》　来源：XX 公众号　日期：10/22　链接：可打开\n\n■ 四、这份简报没有用到的东西\n· 未使用任何内部销售数据、成本数据与客户名单\n· 未引用任何无法打开链接的材料\n· 未对「我们该不该跟进」下结论（这属于经营判断，留给周会讨论）", "rubric": ["每条结论都有来源编号，且编号能对上前面的材料清单", "可信度标注有依据（官方/媒体/口径冲突），不是全标高", "有独立的待核实清单，写清缺什么数据、怎么补", "所有来源链接能打开；打不开的已删或降级说明"]}, {"id": "M2U4", "tier": "basic", "step": "spar", "title": "主管追问「这些数据哪来的」", "video": {"dur": "3.7min", "script": ["来源说不清的结论，等于没做这份简报", "来源应答三段式（哪份材料 → 哪句话 → 可信度多少）", "「我看网上都这么说」与「M03 官方发文第 2 条」的差别"]}, "ppt": {"method": "来源应答三段式（哪份材料 → 哪句话 → 可信度多少）", "case": "「我看网上都这么说」与「M03 官方发文第 2 条」的差别", "demo": "陪练说明：他会随机抽一条让你当场指出来源"}, "objective": "能在主管连续追问下，为简报里每条结论给出可点开的来源，并承认哪些是推理不是事实", "transfer": "把这次被问住的那条来源补进材料清单，下次交简报前自己先按主管的问法过一遍", "vslides": [{"t": "陪练说明：他会随机抽一条", "n": "这一关的对手是直属主管。他不会从头听到尾，而是随机挑一条问「这个哪来的」。所以你准备的时候不能只准备自己最得意的那条，要每条都能答。准备方法很笨但有效：把材料清单摊开，逐条念一遍结论，然后指来源。指不出来的那条，就是会被问住的。还有一层心理准备：他问来源不是不信你，是在确认这份东西能不能往上交。你答得越具体，他越敢用。答「我看网上都这么说」，这份简报就废了，不是内容废了，是可信度废了。还有一种常见失分：把「我在某个群里看到」当成来源，这种回答等于承认没有来源。回答的顺序也有讲究：先说来源类型，再说材料编号，最后说可信度。「这条来自某地市场监管部门官网，编号 M03，官方发布，可信度高」，一句话三件事交代完。反过来先说结论再补来源，对方会觉得你在为结论找理由。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">来源应答三段式</tspan></text><g data-k=\"哪份材料\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">哪份材料</tspan></text></g><g data-k=\"原文怎么说\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">原文怎么说</tspan></text></g><g data-k=\"可信度为什么是这个\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可信度为什么是</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">这个</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 77.47}, {"t": "怎么答「凭什么标中不标高」", "n": "可信度定级这一问最容易答虚。答法要落到依据上：单一媒体、没有官方公告、没有第二来源，所以标中。反过来，如果标了高，就要说得出为什么——官方发布、或两个以上独立来源交叉验证。这一问还有个隐藏考点：他想知道你会不会为了好看把所有东西都标高。全标高的简报，他一眼就能看出是新手做的。标了几条「低」反而是加分，说明你真的看过材料，知道哪条靠不住。定级还要看内容本身：同一条官方发文，政策原文比解读文章高一档。被追问时还有一招：把材料和结论的关系说成「哪条支撑哪条」，而不是「我觉得」。前者可以验，后者只能争。如果对方追问的是数字本身，最稳的一句是「这个数字我没有核到原始出处，先按待核实处理」，承认缺口比硬撑一个解释安全得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"官方发布 → 可标高\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">官方发布 → 可标高</tspan></text></g><g data-k=\"单一来源 → 最多中\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">单一来源 → 最多中</tspan></text></g><g data-k=\"口径冲突 → 标低并说明\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">口径冲突 → 标低并说明</tspan></text></g></svg>", "d": 71.4}, {"t": "最要紧的一问：哪些是你推的", "n": "最后一问通常是「这里面哪几条其实是你自己推的」。这一问答不好，前面全白答。正确答法是主动指出：第 6 条是我拼两条材料推的，标了中；第 5 条是两个行业观察都提到但没数据，标了低。把推理和事实分开，是这份简报最专业的地方。很多人怕承认推理，觉得显得不严谨，其实相反——能把「我查到什么」和「我据此判断什么」分开的人，才是可以被信任的人。混在一起的人，一旦有一条被推翻，整份东西都没人信了。把推理标出来还有个好处：它给了你一个可以讨论的入口，而不是一个必须守住的结论。最后提醒一点：被追问不丢人，被追问之后改口才丢人。凡是当场没把握的一律记下来会后补，并在下一次沟通时主动把补到的结果带回去，这一动作会让对方对你的底稿产生长期信任。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">可信</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">一崩全崩</tspan></text><g data-k=\"事实标事实，推理标推理\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">事实标事实，推理标推理</tspan></text></g><g data-k=\"全部说成查到的\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">全部说成查到的</tspan></text></g></svg>", "d": 71.62}], "deliverable": {"type": "skill", "name": "行业简报", "rubric": ["来源具体", "定级有据", "敢认推理"], "acceptance": "四个问题都答得出：具体材料与原文、发布时间与可打开性、可信度定级依据、主动区分事实与推理"}, "spar": {"role": "直属主管", "persona": "不看结论看来源，会随机抽一条让你当场指出来源与原文，含糊就往下追", "mustAsk": ["你说行业在打履约战，这个结论哪来的？", "这条报道是哪家发的？什么时候？链接能打开吗？", "你标了「中」，凭什么不是「高」？", "这里面哪几条其实是你自己推的，不是查到的？"]}, "exemplar": "（主管问：你说行业在打履约战，这个结论哪来的）\n\n结论：这个结论我只敢说到「有平台在做履约补贴」，不敢说「行业在打履约战」。\n依据：来自 M01，11/01 那篇报道，原文写「在华东 3 城推出履约时效补贴，主打次日达」，没写补贴金额，也没写其他平台跟进。所以「行业」这个词我用不了，现在简报里写的是「头部平台在华东三城」。\n边界：另外第 6 条「履约成本成为竞争焦点」是我自己的推理，基于 M01 和 M03 两条拼起来的，我标了「中，推理结论」。这不算事实，如果会上有人质疑，我会说清这是我的判断，依据是这两条，不是查到谁这么说过。", "task": "把《行业简报》拿到「直属主管」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《行业简报》。现在要让它通过「直属主管」这一关。\n【对手的立场】不看结论看来源，会随机抽一条让你当场指出来源与原文，含糊就往下追。\n【他一定会追问】「你说行业在打履约战，这个结论哪来的？」 / 「这条报道是哪家发的？什么时候？链接能打开吗？」 / 「你标了「中」，凭什么不是「高」？」\n【场景】你说「主管追问「这些数据哪来的」」，对方立刻回一句：你说行业在打履约战，这个结论哪来的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能当场说出材料编号、发布方、日期，并说明原文怎么写的", "能解释可信度为什么是「中」而不是「高」（单一来源、无官方公告）", "主动指出哪几条是推理结论，不与事实混在一起", "被指出某条来源打不开时，承认并说明替代方案，不狡辩"]}, {"id": "M2U5", "tier": "adv", "step": "understand", "title": "三条标准：判断一条信息能不能用", "video": {"dur": "3.8min", "script": ["看起来有多个来源，往往只是同一句话被转了三遍", "可信度三标准（来源层级 / 独立交叉 / 时效有效性）", "同一组数字，三个来源互相引用，实际只有一个原始出处"]}, "ppt": {"method": "可信度三标准（来源层级 / 独立交叉 / 时效有效性）", "case": "同一组数字，三个来源互相引用，实际只有一个原始出处", "demo": "可信度打分卡（拿 4 条信息各打一次分）"}, "objective": "能用「来源层级 + 交叉验证 + 时效」三条标准，判断一条信息能不能写进对外材料", "transfer": "拿手上 3 条待用信息各打一次可信度分，把「同源转载」的那几条标出来告诉带教导师", "vslides": [{"t": "第一条标准：来源层级，先看是谁说的", "n": "判断一条信息可不可信，第一个动作是看谁说的，不是看说了什么。层级大概是这样：官方发布（政府部门、监管机构、上市公司公告）最高；主流媒体其次；行业媒体与垂类自媒体再次；社交平台与匿名爆料最低。同一件事，层级越高越可信。但要注意一个陷阱：层级高不等于内容对，官方发文也可能被媒体误读，所以还要看原文。新人常犯的错是把「某大媒体报道」当成终点，其实媒体也会转述错。正确做法是顺着报道找到原始出处，能翻到原文的，以原文为准。如果原文打不开，那这条就只能算二手，可信度自动降一档。三条标准里最容易被跳过的是第三条，因为核对来源要花时间，而人一着急就会用「反正大家都这么说」替代核对。省下的那几分钟，通常会在会上被追问时连本带利还回去。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">来源层级</tspan></text><g data-k=\"官方发布\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">官方发布</tspan></text></g><g data-k=\"主流媒体\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">主流媒体</tspan></text></g><g data-k=\"行业媒体\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">行业媒体</tspan></text></g><g data-k=\"社交爆料\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">社交爆料</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 74.16}, {"t": "第二条标准：独立交叉，警惕「同源转载」", "n": "看到三篇文章都这么说，别急着相信。先查一件事：它们是不是同一篇通稿的转载。判断方法很简单：看措辞是否高度一致、看是否都引用同一个「据某某报道」、看发布时间是否集中在同一天。三条都符合，说明实际只有一个来源，可信度不该因为「三篇」而上调。真正有价值的交叉验证是：两个完全独立的来源，各自用不同方法得出同一结论。比如官方公告说覆盖三城，同时有本地媒体实地走访也提到三城，这才叫交叉。新人最容易在这里被误导，因为「多来源」看起来很像「已被证实」。最省力的交叉验证是找两个不同立场的信息源，它们都说同一件事，才真的可信。第二条标准还包含一层：来源的发布时间。同一条消息，先发的通常是原始信息，晚发的多半是转述，转述在传播中会被加上自己的解读和情绪。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"查措辞是否一致\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">查措辞是否一致</tspan></text></g><g data-k=\"查是否都引用同一出处\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">查是否都引用同一出处</tspan></text></g><g data-k=\"查发布时间是否集中\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">查发布时间是否集中</tspan></text></g></svg>", "d": 76.15}, {"t": "第三条标准：时效，过期信息比没有更危险", "n": "第三条是时效。信息都有保质期，尤其是政策、价格、组织变动这类。判断方法是看发布时间，再看有没有更新。超期的处理有三种：一是降级，把高改成中并注明时间；二是标注「截至某日」，让读的人知道边界；三是不用，如果这条已经明显过时。最危险的做法是拿一条两年前的数据当现状，因为它看起来有出处、有数字，特别像真的。还有一个隐蔽的时效问题：同一政策可能有修订版，你引用的是旧版。查的时候多一步——搜一下这个文件名加「修订」，看看有没有新版。这一步花的三十秒，能避免会上被人当场指出用错版本。时效还有个坑：有些数据一年只发一次，你以为过期了，其实要查发布节奏。三条标准合起来用，效果是你能快速把一堆材料分成「能用」「要核」「别用」三堆，而不是全部先信一遍再去想。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"看发布时间\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">看发布时间</tspan></text></g><g data-k=\"查有没有修订版\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">查有没有修订版</tspan></text></g><g data-k=\"超期就降级或标注\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">超期就降级或标注</tspan></text></g></svg>", "d": 75.12}], "deliverable": {"type": "skill", "name": "信源可信度评分表", "rubric": ["层级清楚", "能识别同源", "时效把关"], "acceptance": "能给 4 条信息各打一次分，并指出哪些「多来源」其实是同源转载"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】可信度三标准（来源层级 / 独立交叉 / 时效有效性）\n【为什么重要】看起来有多个来源，往往只是同一句话被转了三遍\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["能说清三条标准各自的判断方法，不是只报名字", "能识别「三个来源其实是同一篇通稿」这种情况，并说明怎么查", "对超期信息能给出处理方式（降级 / 标注时间 / 不用）", "自检题全对；收获写成一句能马上用的判断句"]}, {"id": "M2U6", "tier": "adv", "step": "demo", "title": "同一个说法，三个版本：怎么定谁对", "video": {"dur": "3.6min", "script": ["冲突不是麻烦，冲突恰恰是判断的入口", "三方对照法（说法 / 来源 / 时间 / 冲突点）", "同一组市场数据，通稿、行业分析、平台自述给出三个口径"]}, "ppt": {"method": "三方对照法（说法 / 来源 / 时间 / 冲突点）", "case": "同一组市场数据，通稿、行业分析、平台自述给出三个口径", "demo": "WorkBuddy 内跑一遍对照表，对照 AI 原稿与人改稿"}, "objective": "能把 6 条来源不一的说法整理成对照表，标出冲突点与可采信的那一条", "transfer": "拿手上一个有争议的信息，按同样方法做一次三方对照，把结论写进简报的待核实项", "vslides": [{"t": "演示准备：冲突不是麻烦，是入口", "n": "这次手上是 6 条关于同一个市场的材料，数字彼此对不上：1200 亿和 900 亿、3000 万和 1800 万、28 小时和 41 小时。新人的本能是找一个「最可信的」写进去，或者取个平均。这两种做法都错。正确做法是先做对照表，把每条的说法、来源、时间、口径摆在一起。摆完你通常会发现问题不在数字，在定义：一个说全年，一个说前九个月；一个含小程序，一个不含。口径还原之后，冲突往往自然消解，或者变成一个清晰的「无法比较」。这个过程本身就是最有价值的产出。还有一条经验：冲突越多的话题越值得深挖，说明这里没有共识，先搞清楚的人有优势。处理口径冲突有个固定动作：先把两边的定义抄下来并排放在一张纸上，通常一看就发现差在统计范围或者统计周期，而不是谁在造假。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">对照表四要素</tspan></text><g data-k=\"说法\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">说法</tspan></text></g><g data-k=\"来源\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">来源</tspan></text></g><g data-k=\"时间\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">时间</tspan></text></g><g data-k=\"口径\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">口径</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 78.46}, {"t": "跑一遍：为什么禁止它取平均", "n": "提示词里明确写了：数字保留原文写法，不要换算或取平均。这一条是硬约束，因为模型非常喜欢「帮你算一下」。两个不同口径的数字一平均，会造出一个现实中不存在的数，而且它看起来特别权威——有小数点、有单位。这种数字一旦进了汇报材料，后面所有决策都建在沙子上。跑完你会看到对照表里冲突列写的是「口径不同」而不是「矛盾」，这个措辞差别很重要：前者指向可查证的定义问题，后者暗示有人撒谎。我们不知道谁撒谎，我们只知道定义不同。措辞上这点差别，决定了读的人是去查定义，还是去怀疑有人造假。还有一个细节：如果两个数字都对，那就不要合并成一个，而是在正文里并排列出两种口径，让读的人自己选。合并意味着你替业务做了取舍，而新人没有这个授权。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：6 条材料（通稿/分析/自述/调研）\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：6 条材料（通稿/分析/自述/调研）</tspan></text></g><g data-k=\"约束：不换算不平均 / 口径未说明就写未说明\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：不换算不平均 / 口径未说明就写未说明</tspan></text></g><g data-k=\"产出：对照表 + 无法判断清单\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：对照表 + 无法判断清单</tspan></text></g></svg>", "d": 68.69}, {"t": "人工收口：把「无法判断」写清楚，比硬下结论专业", "n": "跑完最后一步是写「尚无法判断的点」。这一节要写清三件事：冲突在哪、可能的解释是什么、要判断需要什么。比如「1200 亿 vs 900 亿：统计周期不同，需统一到同一周期才能比较」。这样写，读的人拿到的不是一个模糊的印象，而是一个明确的下一步。反过来，如果你硬下结论说「以第三方为准」，一旦有人问「凭什么」，你答不上来，整份材料的分量就没了。承认判断不了，是专业的一部分，不是能力不足。真正不专业的是用平均、用「综合来看」这类话把冲突糊过去。如果对方一定要一个数，你可以给区间并注明两种口径，而不是给一个精确的假数。最后一个动作：把这次口径冲突记进你的底稿，下次别人再问同一个数字，你三十秒就能答完，这就是底稿比记忆值钱的地方。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"写清冲突在哪\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写清冲突在哪</tspan></text></g><g data-k=\"给出可能解释\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给出可能解释</tspan></text></g><g data-k=\"写明需要什么才能判断\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明需要什么才能判断</tspan></text></g></svg>", "d": 66.84}], "deliverable": {"type": "skill", "name": "信息对照表", "rubric": ["冲突识别", "口径还原", "结论克制"], "acceptance": "每组冲突都能说出差异来源（口径/样本/来源性质），且没有取平均或下「谁对」的结论"}, "demo": {"ref": "| 说法 | 来源 | 时间 | 口径/定义 | 是否冲突 |\n|---|---|---|---|---|\n| 市场规模约 1200 亿 | 行业通稿（转载 3 家） | 10/28 | 未说明（疑为全年 GMV） | 与 M04 冲突 |\n| 市场规模约 900 亿 | 行业分析报告 | 10/15 | 明确为「前 9 个月累计」 | 与 M01 冲突（口径不同） |\n| 月活用户 3000 万 | 平台自述（招商页） | 09/30 | 未说明统计方式 | 无直接冲突 |\n| 月活用户 1800 万 | 第三方监测 | 10/20 | 去重活跃，不含小程序 | 与 M03 冲突（口径不同） |\n| 履约时效平均 28 小时 | 平台自述 | 09/30 | 未说明是否含偏远地区 | 无对照 |\n| 履约时效平均 41 小时 | 用户调研 | 10/22 | 样本 500，含三线城市 | 与 M05 冲突（样本不同） |\n\n■ 尚无法判断的点\n· 1200 亿 vs 900 亿：统计周期不同（全年 vs 前 9 个月），不能直接比较，需统一到同一周期。\n· 3000 万 vs 1800 万：一个未说明统计方式，一个明确去重不含小程序，差距可能来自口径而非事实。\n· 28 小时 vs 41 小时：平台自述与用户调研样本不同，两者都可能对，取决于问的是谁。\n\n⚠ 未做任何换算与平均；三组冲突均未下「谁对」的结论。", "fix": ["把 AI 算出来的「平均约 1050 亿」删掉了——两个口径不同期，取平均没有任何意义，只会造出一个不存在的数。", "给每组冲突补了「口径不同」的说明，而不是简单标「矛盾」。冲突的根因常常是定义不同，不是有人说谎。", "把「平台自述」和「第三方监测」区别标注，而不是都写成「来源」。自述天然有动机，这一点必须让读的人知道。", "删掉 AI 的结论「应以第三方数据为准」——它没有依据这么判，正确做法是标出无法判断，交给需要的人去定。"], "judge": "判断依据：有没有做无意义的换算或平均；冲突是否归因到口径；是否区分自述与第三方；有没有越权下「谁对」的结论", "sheet": {"situ": "你要判断这个市场的真实规模，手上有 6 条数字，彼此对不上：1200 亿和 900 亿、3000 万和 1800 万、28 小时和 41 小时。师傅说：「别急着选一个，先给我看清楚它们分别在说什么。」你要把它们整理成对照表，标出差异原因，并判断怎么处理。", "ask": "① 逐条判断它属于哪组对照、原文数值是多少；② 判断差异的真实原因（是口径不同，还是样本不同）；③ 给出处理方式：能不能直接比、要不要补来源。", "gen": "请基于以上对照表：① 输出五列（说法/来源/时间/口径/是否冲突）；② 冲突只描述差异，不要判断谁对；③ 数字保留原文写法，不要换算或取平均；④ 最后单列「尚无法判断的点」。\n不要下「应以某方为准」的结论。", "mats": [{"id": "V01", "src": "行业通稿 · 10/28（3 家转载）", "text": "「社区团购市场规模约 1200 亿元。」未说明统计周期与口径。"}, {"id": "V02", "src": "行业分析报告 · 10/15", "text": "「2026 年前 9 个月累计市场规模约 900 亿元。」明确写统计周期。"}, {"id": "V03", "src": "平台官网招商页 · 09/30", "text": "平台自述「月活用户 3000 万」，未说明统计方式与是否去重。"}, {"id": "V04", "src": "第三方监测 · 10/20", "text": "「去重月活 1800 万，统计范围为 App 端，不含小程序。」"}, {"id": "V05", "src": "平台官网服务说明 · 09/30", "text": "自述「平均履约时效 28 小时」，未说明是否含偏远地区与预售单。"}, {"id": "V06", "src": "用户调研 · 10/22", "text": "样本 500，覆盖一二三线城市，测得平均履约时效 41 小时。"}], "cols": [{"k": "group", "name": "属于哪组对照", "hint": "三组数字各两个", "type": "chips", "w": 2, "tags": ["市场规模", "月活用户", "履约时效"]}, {"k": "val", "name": "原文数值", "hint": "照抄，不要换算", "type": "chips", "w": 2, "tags": ["1200 亿", "900 亿", "3000 万", "1800 万", "28 小时", "41 小时"]}, {"k": "why", "name": "差异的真实原因", "hint": "看它统计的是什么", "type": "chips", "w": 3, "tags": ["统计周期不同", "含不含小程序", "自述 vs 第三方", "样本不同", "地区覆盖不同", "无法判断"]}, {"k": "deal", "name": "该怎么处理", "hint": "能不能直接比", "type": "chips", "w": 3, "tags": ["标口径后可用", "不能直接比", "需第二来源", "暂不采信"]}], "key": {"V01": {"group": "市场规模", "val": "1200 亿", "why": "统计周期不同", "deal": "不能直接比"}, "V02": {"group": "市场规模", "val": "900 亿", "why": "统计周期不同", "deal": "标口径后可用"}, "V03": {"group": "月活用户", "val": "3000 万", "why": "自述 vs 第三方", "deal": "需第二来源"}, "V04": {"group": "月活用户", "val": "1800 万", "why": "含不含小程序", "deal": "标口径后可用"}, "V05": {"group": "履约时效", "val": "28 小时", "why": "自述 vs 第三方", "deal": "需第二来源"}, "V06": {"group": "履约时效", "val": "41 小时", "why": "样本不同", "deal": "标口径后可用"}}, "notes": {"V01·why": "通稿只说「约 1200 亿」，未说明周期；另一条明确是「前 9 个月」。周期不同 → 统计周期不同", "V02·deal": "明确写了周期，本身可用，但引用时必须带「前 9 个月」这个限定，否则会被当成全年", "V03·deal": "自述数据不能直接用，需要找第三方监测做第二来源", "V04·why": "差异来自「含不含小程序」，不是事实冲突；这类差异还原口径后往往能消解", "V05·why": "平台自述与用户调研不是同一类来源，不能并列比较", "V06·why": "样本 500 且覆盖三线城市，与平台自述的样本结构不同 → 样本不同"}, "delta": [{"op": "删", "frm": "模型算出「平均约 1050 亿」并写进结论", "to": "整句删除，改为「两个口径不同期，不能直接比较」", "why": "不同周期的数字取平均，会造出一个现实中不存在的数", "kw": ["平均", "1050", "不能比较", "周期"]}, {"op": "改", "frm": "模型把三组都标成「矛盾」，并暗示有一方数据有误", "to": "改成「口径不同」，并写出各自定义", "why": "冲突的根因是定义不同，扣「有人说谎」的帽子既不专业也站不住", "kw": ["口径不同", "定义", "矛盾", "有误"]}, {"op": "补", "frm": "模型没有区分自述与第三方", "to": "给 V03、V05 标注「平台自述，有商业动机」", "why": "读的人有权知道来源性质，否则会把自述当独立数据", "kw": ["自述", "商业动机", "第三方", "标注"]}, {"op": "改", "frm": "模型结论写「应以第三方数据为准」", "to": "改成「暂不采信单一数字，需两独立来源交叉」", "why": "「以第三方为准」没有依据，第三方监测也会错；正确做法是要求交叉验证", "kw": ["暂不采信", "交叉", "两个来源", "第三方"]}], "refsheet": "V01｜市场规模｜1200 亿｜统计周期不同｜不能直接比\nV02｜市场规模｜900 亿｜统计周期不同｜标口径后可用\nV03｜月活用户｜3000 万｜自述 vs 第三方｜需第二来源\nV04｜月活用户｜1800 万｜含不含小程序｜标口径后可用\nV05｜履约时效｜28 小时｜自述 vs 第三方｜需第二来源\nV06｜履约时效｜41 小时｜样本不同｜标口径后可用\n\n四条最容易判错的：\n· V01 的「1200 亿」原文没写周期，不能假设是全年，只能标「未说明」。\n· V02 本身可用，但引用时必须带「前 9 个月」，去掉限定就变成误导。\n· 自述 vs 第三方不是「谁更准」，是「性质不同」，所以处理方式是「需第二来源」而不是「不可用」。\n· 三组都不是「有人说谎」，全部是口径或样本差异——别把差异当矛盾。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的信息核对助手。请基于我贴的 6 条材料，整理成一张对照表，五列固定：说法 | 来源 | 时间 | 口径/定义 | 与其他材料是否冲突。\n规则：① 冲突处只描述差异，不要替我判断谁对；② 材料里没写口径的，口径列填「未说明」；③ 数字保留原文写法，不要换算或取平均；④ 最后单列一节「尚无法判断的点」。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三方对照法（说法 / 来源 / 时间 / 冲突点）\n【参考案例】同一组市场数据，通稿、行业分析、平台自述给出三个口径\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的信息核对助手。请基于我贴的 6 条材料，整理成一张对照表，五列固定：说法 | 来源 | 时间 | 口径/定义 | 与其他材料是否冲突。\n规则：① 冲突处只描述差异，不要替我判断谁对；② 材料里没写口径的，口径列填「未说明」；③ 数字保留原文写法，不要换算或取平均；④ 最后单列一节「尚无法判断的点」。", "rubric": ["每组数字都标了口径或「未说明」，没有默认它是某个周期", "差异归因到口径/样本/来源性质，而不是「有一方错了」", "没有做换算、取平均或选一个「最可信」的写法", "单列「尚无法判断的点」，写清要判断还需要什么"]}, {"id": "M2U7", "tier": "adv", "step": "todo", "title": "做一份经得起翻的调研底稿", "video": {"dur": "3.7min", "script": ["底稿和简报的区别是：底稿要能被人顺着翻回去", "底稿四件套（结论 / 证据 / 来源目录 / 版本记录）", "同一份调研，被追问三次后仍能当场翻出原文的底稿长什么样"]}, "ppt": {"method": "底稿四件套（结论 / 证据 / 来源目录 / 版本记录）", "case": "同一份调研，被追问三次后仍能当场翻出原文的底稿长什么样", "demo": "底稿模板与来源目录写法"}, "objective": "能产出一份带完整来源链的调研底稿，任一结论都能在三步内翻到原始出处", "transfer": "把底稿的来源目录发给同组同事，请他不看你的结论、只按目录找一条，看能不能三步内找到", "vslides": [{"t": "第一步：先列问题，再去查", "n": "底稿和简报最大的差别是顺序：简报从材料出发，底稿从问题出发。所以第一步是列 8 到 12 个待查问题，按重要性排。列问题的好处是它给你一个停止条件——问题答完就停，不会漫无目的地搜一下午。列的时候要具体：「补贴力度有多大」比「了解一下补贴」好答，「是否覆盖深圳」比「覆盖范围」好验证。每个问题后面留三格：结论、证据编号、状态（已解答 / 部分解答 / 未解答）。状态这一格很关键，它让底稿变成一份「进度表」，而不是一堆材料。别人一看就知道哪些还得追。问题也不宜太多，超过十二个你会失去焦点，最后每个都答一半。底稿的结构建议固定成三块：材料清单、核心结论、未解问题。三块的位置不要变，用久了别人打开就知道去哪找东西，这比写得多漂亮都有用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 列 8–12 个具体问题\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列 8–12 个具体问题</tspan></text></g><g data-k=\"② 按重要性排序\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 按重要性排序</tspan></text></g><g data-k=\"③ 每题留结论/证据/状态\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 每题留结论/证据/状态</tspan></text></g></svg>", "d": 72.55}, {"t": "第二步：来源目录要能被人顺着翻回去", "n": "来源目录是底稿的骨架，六列不能少：编号、标题、发布方、日期、链接、是否可打开。为什么要有「是否可打开」这一列？因为链接会失效。你今天能打开，两周后可能 404，所以要标。为什么要有发布方？因为自述和第三方分量不同。目录的作用是让别人不用问你，自己顺着翻：看到结论后面的 E03，翻到目录找到链接，点开就是原文。这个过程要在三步内完成，超过三步说明目录设计有问题。测试方法很简单：找个同事，让他不看你的结论、只按目录找一条，看他要多久。目录还可以加一句「这份材料适合回答哪类问题」，方便别人复用。命名也要统一，建议「主题_来源_日期_编号」，例如「社区团购_某媒体_20261101_M03」。名字里带日期和编号，半年后你自己也能一眼认出来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">来源目录六列</tspan></text><g data-k=\"编号 E01…\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">编号 E01…</tspan></text></g><g data-k=\"标题 / 发布方 / 日期\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">标题 / 发布方 / 日期</tspan></text></g><g data-k=\"链接 / 是否可打开\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">链接 / 是否可打开</tspan></text></g><g data-k=\"（自述还是第三方）\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">（自述还是第三方）</tspan></text></g></svg>", "d": 80.02}, {"t": "第三步：版本记录与推理标注", "n": "最后两件事最容易被省，但最能体现专业。版本记录写三样：这一版改了什么、为什么改、谁提的意见。比如「v1.2 把『行业在打履约战』改成『头部平台在华东三城做时效补贴』，因为原表述超出材料支持范围」。这一行记录的价值在于：三个月后有人问「当初为什么这么写」，你翻一下就知道。推理标注是把「查到的」和「推的」分开，标 R1、R2。不标的人，一旦推理被推翻，整份底稿都会被怀疑；标了的人，推翻一条推理不影响其他结论。这两件事加起来花不到十分钟，但它决定了这份东西能不能被别人接着用。版本记录不用写长，三行就够：改了什么、为什么改、谁提的。底稿的最后一步是归档：放在团队共享区而不是个人电脑，文件名和目录跟别人保持一致，否则你休假的时候这份底稿就等于不存在。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"改了什么 / 为什么 / 谁提的\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">改了什么 / 为什么 / 谁提的</tspan></text></g><g data-k=\"推理单独标 R 编号\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">推理单独标 R 编号</tspan></text></g><g data-k=\"三个月后还翻得回去\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三个月后还翻得回去</tspan></text></g></svg>", "d": 70.13}], "deliverable": {"type": "skill", "name": "调研底稿", "rubric": ["可追溯", "目录完整", "版本可查"], "acceptance": "一份底稿：8 条以上问题、每条有证据编号、有独立来源目录、所有链接可打开、有版本记录"}, "practice": {"steps": ["先列 8–12 个待查问题，按重要性排序", "每个问题配 1–3 份材料，统一编号并写清出处与日期", "每条结论后标「证据编号」，能三步翻到原文", "建一份来源目录：编号 / 标题 / 发布方 / 日期 / 链接 / 是否可打开", "写版本记录：这一版改了什么、为什么改、谁提的意见"], "exemplar": "【社区团购履约专题 · 调研底稿 v1.2】\n整理人：小林　最后更新：2026-11-06　用途：为周会简报提供底稿，供后续追问\n\n■ 一、待查问题与结论（按重要性）\n\nQ1 头部平台的履约补贴力度有多大？\n　结论：已知有补贴且集中在时效，力度无法量化。\n　证据：E01（原文写「推出履约时效补贴」，未提金额）\n　状态：部分解答 → 待核实项 T1\n\nQ2 补贴是否覆盖深圳？\n　结论：未覆盖。报道明确为华东 3 城。\n　证据：E01、E02\n　状态：已解答\n\nQ3 自有品牌是否进入我们的主力类目？\n　结论：进入粮油与日化，未进入服饰。\n　证据：E03\n　状态：已解答\n\nQ4 竞品的履约时效实际是多少？\n　结论：自述 28 小时，用户调研 41 小时，口径不同，暂不采信单一数字。\n　证据：E04（平台自述）、E05（调研样本 500）\n　状态：冲突未解 → 待核实项 T2\n\nQ5 本地是否有价格行为提示？\n　结论：只见外地发文，本地未查到。\n　证据：E06（外地官方发文）\n　状态：未解答 → 待核实项 T3\n\n（Q6–Q8 为同类问题，此处略，见底稿附表）\n\n■ 二、来源目录\n\n| 编号 | 标题 | 发布方 | 日期 | 链接 | 可打开 |\n|---|---|---|---|---|---|\n| E01 | 某平台华东履约补贴 | XX 财经 | 11/01 | 有 | 是 |\n| E02 | 华东三城时效观察 | XX 商业 | 11/02 | 有 | 是 |\n| E03 | 某平台上新自有品牌 | XX 商业 | 10/30 | 有 | 是 |\n| E04 | 平台招商页（时效说明） | 平台官网 | 09/30 | 有 | 是 |\n| E05 | 用户履约调研 | XX 研究院 | 10/22 | 有 | 是 |\n| E06 | 社区团购价格行为提示 | 某地市监局 | 10/28 | 有 | 是 |\n\n■ 三、待核实\n\nT1 补贴金额与覆盖单量 → 查平台招商政策，或问合作服务商\nT2 履约时效的真实水平 → 找第三方连续三个月的数据，不采信单点\nT3 本地是否有同类提示 → 每周查一次本地市监局公告栏\n\n■ 四、推理标注（不是查到的事实）\n\nR1「履约成本成为竞争焦点」：由 E01（补贴集中在时效）+ E06（价格行为被提示）推出。\n　这是我的判断，非原始材料结论。若被追问，依据是这两条。\n\n■ 五、版本记录\n\nv1.0　11/03　初稿，6 个问题，来源 4 份\nv1.1　11/05　按主管意见补 E02 与 E05，新增 Q4 冲突说明\nv1.2　11/06　把「行业在打履约战」改为「头部平台在华东三城做时效补贴」，\n　　　　　　　原因：原表述超出材料支持范围（主管指出）\n\n■ 六、这份底稿的边界\n· 未使用任何内部数据\n· 所有链接均已点开验证；E04 为平台自述，有商业动机，已单独标注\n· 结论与推理已分开标注，未混写"}, "task": "产出《调研底稿》：先列 8–12 个待查问题，按重要性排序；每个问题配 1–3 份材料，统一编号并写清出处与日期；每条结论后标「证据编号」，能三步翻到原文；建一份来源目录：编号 / 标题 / 发布方 / 日期 / 链接 / 是否可打开；写版本记录：这一版改了什么、为什么改、谁提的意见", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M2 用 AI 收集与整理信息」模块，你要交付的是《调研底稿》。\n【场景】业务侧这周的诉求是：底稿和简报的区别是：底稿要能被人顺着翻回去。参考做法：同一份调研，被追问三次后仍能当场翻出原文的底稿长什么样。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（底稿四件套（结论 / 证据 / 来源目录 / 版本记录）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《调研底稿》填写模板】\n\n■ 1. 先列 8–12 个待查问题，按重要性排序\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 每个问题配 1–3 份材料，统一编号并写清出处与日期\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 每条结论后标「证据编号」，能三步翻到原文\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 建一份来源目录：编号 / 标题 / 发布方 / 日期 / 链接 / 是否可打开\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 写版本记录：这一版改了什么、为什么改、谁提的意见\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【社区团购履约专题 · 调研底稿 v1.2】\n整理人：小林　最后更新：2026-11-06　用途：为周会简报提供底稿，供后续追问\n\n■ 一、待查问题与结论（按重要性）\n\nQ1 头部平台的履约补贴力度有多大？\n　结论：已知有补贴且集中在时效，力度无法量化。\n　证据：E01（原文写「推出履约时效补贴」，未提金额）\n　状态：部分解答 → 待核实项 T1\n\nQ2 补贴是否覆盖深圳？\n　结论：未覆盖。报道明确为华东 3 城。\n　证据：E01、E02\n　状态：已解答\n\nQ3 自有品牌是否进入我们的主力类目？\n　结论：进入粮油与日化，未进入服饰。\n　证据：E03\n　状态：已解答\n\nQ4 竞品的履约时效实际是多少？\n　结论：自述 28 小时，用户调研 41 小时，口径不同，暂不采信单一数字。\n　证据：E04（平台自述）、E05（调研样本 500）\n　状态：冲突未解 → 待核实项 T2\n\nQ5 本地是否有价格行为提示？\n　结论：只见外地发文，本地未查到。\n　证据：E06（外地官方发文）\n　状态：未解答 → 待核实项 T3\n\n（Q6–Q8 为同类问题，此处略，见底稿附表）\n\n■ 二、来源目录\n\n| 编号 | 标题 | 发布方 | 日期 | 链接 | 可打开 |\n|---|---|---|---|---|---|\n| E01 | 某平台华东履约补贴 | XX 财经 | 11/01 | 有 | 是 |\n| E02 | 华东三城时效观察 | XX 商业 | 11/02 | 有 | 是 |\n| E03 | 某平台上新自有品牌 | XX 商业 | 10/30 | 有 | 是 |\n| E04 | 平台招商页（时效说明） | 平台官网 | 09/30 | 有 | 是 |\n| E05 | 用户履约调研 | XX 研究院 | 10/22 | 有 | 是 |\n| E06 | 社区团购价格行为提示 | 某地市监局 | 10/28 | 有 | 是 |\n\n■ 三、待核实\n\nT1 补贴金额与覆盖单量 → 查平台招商政策，或问合作服务商\nT2 履约时效的真实水平 → 找第三方连续三个月的数据，不采信单点\nT3 本地是否有同类提示 → 每周查一次本地市监局公告栏\n\n■ 四、推理标注（不是查到的事实）\n\nR1「履约成本成为竞争焦点」：由 E01（补贴集中在时效）+ E06（价格行为被提示）推出。\n　这是我的判断，非原始材料结论。若被追问，依据是这两条。\n\n■ 五、版本记录\n\nv1.0　11/03　初稿，6 个问题，来源 4 份\nv1.1　11/05　按主管意见补 E02 与 E05，新增 Q4 冲突说明\nv1.2　11/06　把「行业在打履约战」改为「头部平台在华东三城做时效补贴」，\n　　　　　　　原因：原表述超出材料支持范围（主管指出）\n\n■ 六、这份底稿的边界\n· 未使用任何内部数据\n· 所有链接均已点开验证；E04 为平台自述，有商业动机，已单独标注\n· 结论与推理已分开标注，未混写", "rubric": ["任一结论能在三步内翻到原文（结论 → 证据编号 → 来源目录 → 原文）", "来源目录六列齐全，且标了「是否可打开」，打不开的已剔除或注明", "有版本记录，写明这一版相比上一版改了什么、因为谁的意见", "底稿里区分了「查到的」与「推的」，推理结论单独标注"]}, {"id": "M2U8", "tier": "adv", "step": "spar", "title": "被质疑「AI 编的数据也敢用」", "video": {"dur": "3.8min", "script": ["防编造靠的不是不相信 AI，是每一步都能翻回去", "三步验证链（原文 → 口径 → 交叉）", "「AI 说是 1200 亿」与「M01 原文写 1200 亿、但口径是全年、且无第二来源」的差别"]}, "ppt": {"method": "三步验证链（原文 → 口径 → 交叉）", "case": "「AI 说是 1200 亿」与「M01 原文写 1200 亿、但口径是全年、且无第二来源」的差别", "demo": "陪练说明：他会挑一条最像编的让你当场验证"}, "objective": "能在被质疑「AI 编的数据也敢用」时，用三步验证链证明每条数据都能翻到原文", "transfer": "把底稿里最没底的那条数据按三步验证链重查一遍，结果补进来源目录的备注列", "vslides": [{"t": "陪练说明：他的警惕是对的", "n": "这一关的对手是同组同事，他的警惕完全合理——AI 确实最会编数字，而且编得很像。所以你不能辩解「AI 没那么不靠谱」，那是在替他辩护，不是在替自己辩护。你要做的是证明流程：每个数字都经过原文核对，核不到的不进结论。这一关的关键不是口才，是你手上真有东西可翻。如果底稿做得扎实，你会很轻松——他一问，你一翻，三十秒结束。如果底稿是拼凑的，这一关会非常难，因为你一边答一边在心里找补。最怕的是被问住之后开始找理由，那会让对方确认你没核过。最稳的回答结构是三步：先认下这条是什么级别，再说我核到了什么，最后说还差什么。比如「这条我标的是中，只有一个媒体报道，我在等官方口径，明天给您」。三步说完对方的追问基本就停了，因为你已经把他要的确定性和不确定性都交代清楚了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三步验证链</tspan></text><g data-k=\"翻原文\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">翻原文</tspan></text></g><g data-k=\"看口径\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">看口径</tspan></text></g><g data-k=\"找第二来源\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">找第二来源</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 76.08}, {"t": "三步验证：原文、口径、交叉", "n": "第一步，翻原文。不是翻二手报道，是翻它引用的那份原始材料；翻不到原文的，只能算二手。第二步，看口径。原文写了数字，但没写它统计的是什么范围、什么周期、含不含某些项，这个数字就不能直接用。第三步，找第二来源。两个独立来源指向同一结论，才敢标高可信度。三步走完，你会得到三种结果：能用、能用但要标注口径、不能用。这三种结果分别对应底稿里的三种状态，而不是「信」或「不信」两种。这也是回答同事质疑最有力的方式：你不是在保证 AI 靠谱，你是在保证流程可靠。还可以补一句：我把 AI 给的数字单独列了个清单，逐条核，核不到的全删了。这里有个反直觉的地方：删掉自己查过的内容，比加上查到的内容更能建立信任。因为对方一旦发现有一条是你核过的，他会推断其余的也核过；反过来发现一条是编的，他会推断全部都是编的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 翻原文（不是二手报道）\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 翻原文（不是二手报道）</tspan></text></g><g data-k=\"② 看口径（范围/周期/含不含）\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 看口径（范围/周期/含不含）</tspan></text></g><g data-k=\"③ 找第二独立来源\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 找第二独立来源</tspan></text></g></svg>", "d": 80.78}, {"t": "最要紧的一问：有没有你核不了的", "n": "最后一问通常是「有没有哪一条你也核不了」。很多人会硬撑说「都核过了」，一撑就假。正确答法是主动指出：E05 那个调研样本 500、没给抽样方法，我只能标「样本有限」，不敢当结论。承认核不了，反而让人信你其他的都核过了。这一关考的不是你查得多全，是你对自己东西的边界清不清楚。边界清楚的人，同事会愿意用你的底稿；边界含糊的人，哪怕数据都对，别人也不敢引用，因为不知道哪条会突然塌。边界清楚的人，别人引用你的东西时会更放心，也更愿意把自己的底稿给你看。长期看，这件事会变成你的个人资产：同一批新人里，谁能被人放心地把材料托付过来，谁就先拿到真正重要的活。核实的习惯不是合规要求，它是新人最快的信用积累方式。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">可信</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">一戳就破</tspan></text><g data-k=\"指出核不了的，放进待核实\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">指出核不了的，放进待核</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">实</tspan></text></g><g data-k=\"都说核过了\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">都说核过了</tspan></text></g></svg>", "d": 71.06}], "deliverable": {"type": "skill", "name": "调研底稿", "rubric": ["可翻原文", "口径说清", "敢认核不了"], "acceptance": "四个问题都答得出：逐条可翻原文、口径问题说清、承认核不了的部分、说明怎么处理 AI 给的数字"}, "spar": {"role": "同组同事", "persona": "对 AI 产出天然警惕，会挑最像编造的数字让你当场验证，验证不了就要求删除", "mustAsk": ["你这些数字不会是 AI 编的吧？", "这条 1200 亿，原文到底怎么写的？你能翻给我看吗？", "如果原文就是这么写的，那它就可信了吗？", "有没有哪一条你其实也核不了？"]}, "exemplar": "（同事问：你这些数字不会是 AI 编的吧，它最会编数字了）\n\n结论：底稿里每个数字都能翻到原文，翻不到的我全标了待核实。\n依据：比如 1200 亿这条，出自 E01，是 XX 财经 10/28 的报道，我点开原文核过，原文就是这么写的。但它口径没说明，我怀疑是全年 GMV，所以在底稿里标了「口径未说明」，可信度给的中，没敢当结论用。另外 900 亿那条来自 E07，明确写「前 9 个月累计」，两条不能直接比。\n边界：确实有一条我暂时核不了——E05 那个 41 小时的调研，样本只有 500 且没给抽样方法，我只能标「样本有限」，不能确认它代表性够不够。这条我没写进结论，放在待核实里。AI 给的所有数字我都没直接采信，凡是它给的、我找不到出处的，一律删掉。", "task": "把《调研底稿》拿到「同组同事」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《调研底稿》。现在要让它通过「同组同事」这一关。\n【对手的立场】对 AI 产出天然警惕，会挑最像编造的数字让你当场验证，验证不了就要求删除。\n【他一定会追问】「你这些数字不会是 AI 编的吧？」 / 「这条 1200 亿，原文到底怎么写的？你能翻给我看吗？」 / 「如果原文就是这么写的，那它就可信了吗？」\n【场景】你说「被质疑「AI 编的数据也敢用」」，对方立刻回一句：你这些数字不会是 AI 编的吧？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能当场指出某条数字出自哪份材料、哪句话，并能打开原文", "能说清「原文这么写」不等于「可信」，还要看口径与来源独立性", "主动承认至少一条自己核不了的，并说明放在哪个状态里", "说清对 AI 给的数据的处理规则（找不到出处就删），不是「我都很小心」"]}]}, {"id": "M3", "title": "M3 用 AI 写文档与做 PPT", "dims": ["content", "prompt", "workflow"], "units": [{"id": "M3U1", "tier": "basic", "step": "understand", "title": "先搭骨架，再填肉：文档的结构逻辑", "video": {"dur": "3.4min", "script": ["读你文档的人只有三分钟，前三行决定他要不要往下看", "文档四段骨架（结论 / 为什么 / 怎么做 / 要谁做什么）", "新人写了两千字没结论，主管只看前三行就退回来重写"]}, "ppt": {"method": "文档四段骨架（结论 / 为什么 / 怎么做 / 要谁做什么）", "case": "新人写了两千字没结论，主管只看前三行就退回来重写", "demo": "四段骨架卡：拿周报、方案、复盘三类文档各配一套骨架"}, "objective": "能为一篇工作文档先落出「结论—为什么—怎么做—要谁做什么」四段骨架，再动笔填内容", "transfer": "把手上正在写的一份文档先只写四段小标题发给自己，第二天再往里填内容", "vslides": [{"t": "为什么结论必须写在第一行", "n": "新人写文档最常见的错，是把过程写进去：今天查了什么、问了谁、改了几版，写了两千字，结论一句话没有。读的人是谁？是主管，他一天要看七八份东西，每份只给你三分钟。前三行看不到结论，他就往下翻，或者直接回你两个字「所以呢」。所以第一段必须是结论：一句话说清这份东西是要他做什么决定、还是要他知道什么结果。有个测试方法很灵：把第一段念给一个不了解背景的同事听，他能不能一句话复述回来。复述不出来，说明你写的不是结论，是背景。背景不是不能写，但它要放在结论后面当支撑，而不是挡在结论前面。很多人以为写得详细显得认真，其实在主管眼里，详细但没结论等于把活推回给他——他得自己从两千字里找重点。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">文档四段骨架</tspan></text><g data-k=\"结论\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">结论</tspan></text></g><g data-k=\"为什么\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">为什么</tspan></text></g><g data-k=\"怎么做\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">怎么做</tspan></text></g><g data-k=\"要谁做什么\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">要谁做什</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">么</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 69.72}, {"t": "四段骨架：每段只干一件事", "n": "骨架一共四段，每段只干一件事。第一段结论，说清要对方做什么。第二段为什么，用两三句交代背景和影响，不超过三行。第三段怎么做，这一步最容易写崩：新人喜欢写「计划分三个阶段推进」，这种话等于没说。要写成能被检验的动作——谁、什么时候、交付什么东西。第四段要谁做什么，把需要对方配合的事单独列出来写在最后，因为那才是他真正要动手的部分。四段写齐，一篇文档的骨架就有了，剩下的填内容只是体力活。反过来，很多人先有一堆材料再想办法串起来，串到最后自己也不知道结论是什么。顺序上还有个技巧：先写第四段，再写第一段，最后补第二、三段，因为「要谁做什么」想清楚了，结论自然就浮出来了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 结论：要你做什么\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 结论：要你做什么</tspan></text></g><g data-k=\"② 为什么：三条以内\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 为什么：三条以内</tspan></text></g><g data-k=\"③ 怎么做：谁·何时·交什么\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 怎么做：谁·何时·交什么</tspan></text></g><g data-k=\"④ 要谁做什么：单独列\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 要谁做什么：单独列</tspan></text></g></svg>", "d": 67.8}, {"t": "三类文档的骨架差异", "n": "三类文档的骨架长得不一样。周报的重点在第四段：本周做了什么、下周要做什么、需要谁支持，结论段可以只有一句。方案的重点在第一段和第三段：结论是要批准什么，怎么做要写到能被质疑的程度——预算多少、周期多长、谁来干。复盘的重点在第二段：为什么会出现这个结果，而且要写清是判断错了还是执行不到位，这两者的改法完全不同。分不清类型是新人常犯的错：拿写周报的方式写方案，方案会显得没有主张；拿写方案的方式写周报，周报会显得啰嗦。写之前先问一句「这份东西要对方做什么」，答案会告诉你该用哪套骨架。还有个偷懒但有效的办法：把过去半年被表扬过的三份文档找出来，看它们的骨架长什么样，比自己硬想快得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"周报重第四段\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">周报重第四段</tspan></text></g><g data-k=\"方案重第一与第三段\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">方案重第一与第三段</tspan></text></g><g data-k=\"复盘重第二段\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">复盘重第二段</tspan></text></g></svg>", "d": 68.26}], "deliverable": {"type": "skill", "name": "文档四段骨架", "rubric": ["结论前置", "四段完整", "场景对得上"], "acceptance": "能对周报、方案、复盘三类文档各写出四段骨架，且第一段就是结论而不是背景"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】文档四段骨架（结论 / 为什么 / 怎么做 / 要谁做什么）\n【为什么重要】读你文档的人只有三分钟，前三行决定他要不要往下看\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["第一段是结论，能用一句话说清「要我做什么决定 / 知道什么结果」", "四段各只干一件事，没有把「为什么」和「怎么做」混在一段里", "第三段的动作可检验：写了谁、什么时候、交什么，不是「分阶段推进」", "能说出三类文档里哪一段是重点，以及为什么不同"]}, {"id": "M3U2", "tier": "basic", "step": "demo", "title": "让 AI 出一份可编辑的 PPT 大纲", "video": {"dur": "3.7min", "script": ["大纲是可改的，文字稿只能重写", "大纲五栏表（页序 / 标题 / 一句话要点 / 图表素材 / 材料依据）", "同一堆材料，出「文字稿」和出「大纲表」在改稿时差出的时间"]}, "ppt": {"method": "大纲五栏表（页序 / 标题 / 一句话要点 / 图表素材 / 材料依据）", "case": "同一堆材料，出「文字稿」和出「大纲表」在改稿时差出的时间", "demo": "WorkBuddy 内跑一遍大纲生成，对照 AI 原稿与人改稿"}, "objective": "能把一堆材料用一条提示词变成 8 页以内的 PPT 大纲，且每页都能指回材料编号", "transfer": "拿下周要汇报的一个主题，先出一版大纲发给自己，把「图表」列空着的页先删掉", "vslides": [{"t": "演示准备：为什么要大纲而不是文字稿", "n": "这次的任务是把一堆零散材料变成一份能上讲台的 PPT。新人的做法是让 AI 直接写文字稿，结果拿到二十页密密麻麻的字，一改就全乱。正确做法是先要大纲，而且大纲必须是表格：页序、标题、这一页只说的一件事、需要的图表、材料依据。表格的好处是每一格都能单独判断，你能一眼看出哪页在凑数、哪页没依据。还有一层更实际的原因：汇报材料九成的时间花在砍内容上，不是写内容上。先有大纲，砍的时候是删一行；先有文字稿，砍的时候是重写一遍。这就是为什么这一步值得花十分钟。大纲定下来之后再让 AI 逐页展开，你的返工量会少一大半。记住一句话：大纲是给改的，文字稿是给哭的。所以哪怕时间紧，也先花十分钟要表格，不要一上来就要全文。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这张表的用处</tspan></text><g data-k=\"材料\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">材料</tspan></text></g><g data-k=\"大纲表\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">大纲表</tspan></text></g><g data-k=\"逐页展开\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">逐页展开</tspan></text></g><g data-k=\"上台\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">上台</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 76.78}, {"t": "跑一遍：四个约束挡住三类毛病", "n": "提示词里我压了四个约束。第一，八页以内。不写这句，它会给你十二页，因为它觉得每件事都值得一页。第二，标题写成结论句。这句最值钱：名词标题只能告诉你这页讲什么，结论句标题能告诉你这页要证明什么。第三，没数据的图表写「无」。不写这句，它会很热心地给你安排一张柱状图，然后在图上编数字。第四，每页能指回编号。这条让整份材料可追溯，被问「数据哪来的」时不至于卡住。跑完你会发现 AI 的版本有两类典型毛病：一类是自作主张补数字，一类是把两件事塞进一页。这两类都不是它笨，是它默认「完整比准确重要」。所以人要做的事很明确：删它编的数，拆它合并的页。改完再让它按页展开，一页一页来，改起来才有把手。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：3 份公开材料 + 一份内部结论（脱敏）\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：3 份公开材料 + 一份内部结论（脱敏）</tspan></text></g><g data-k=\"约束：≤8 页 / 结论句标题 / 无数据写无 / 可指回编号\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：≤8 页 / 结论句标题 / 无数据写无 / 可指回编号</tspan></text></g><g data-k=\"产出：可编辑的大纲表\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：可编辑的大纲表</tspan></text></g></svg>", "d": 70.39}, {"t": "人工收口：标题改一遍，页数砍一遍", "n": "跑完有两件事必须人工做，AI 替代不了。第一件是把标题逐条改成结论句。「我们的应对建议」这种标题，读的人不知道你的建议是什么，得听你讲完才知道，等于浪费一页。改成「建议先跟履约时效，不跟补贴」，他一眼就知道你要说什么，后面的讲只是补理由。第二件是砍页数。八页是上限不是目标，真正讲的时候一页大概一分半，八页就是十二分钟，够一个部门周会用了。砍页数的原则是：凡是「知道了也不会改变任何人动作」的内容，全部挪到备注。还有一个自查动作：把八页标题连起来念一遍，如果这八句话本身就是一个完整的故事，这份大纲就成立了；如果念到一半你觉得「这两页说的是同一件事」，那就还没砍到位。砍到能讲完为止，别砍到只剩结论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"标题逐条改成结论句\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">标题逐条改成结论句</tspan></text></g><g data-k=\"八页是上限不是目标\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">八页是上限不是目标</tspan></text></g><g data-k=\"八页标题连起来能成故事\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">八页标题连起来能成故事</tspan></text></g></svg>", "d": 72.34}], "deliverable": {"type": "skill", "name": "PPT 大纲表", "rubric": ["页数克制", "标题是结论", "依据可追"], "acceptance": "8 页以内、每页标题是结论句、图表列有依据或无、每页都能指回材料编号"}, "demo": {"ref": "| 页序 | 页面标题 | 只说一件事 | 图表/素材 | 依据 |\n|---|---|---|---|---|\n| 1 | 华东三城补贴力度低于我们，但履约时效领先 | 竞争态势 | 无 | M01 |\n| 2 | 补贴金额未披露，按行业惯例约为单均 1.5 元 | 补贴力度测算 | 柱状图（单均补贴对比） | M01 |\n| 3 | 自有品牌已覆盖粮油日化两类目 | 类目扩张 | 表格（类目对照） | M02 |\n| 4 | 行业增速说法不一，暂不引用具体数字 | 口径问题 | 无 | M01、M02 |\n| 5 | 政策侧出现价格行为提示 | 合规风险 | 无 | M03 |\n| 6 | 我们的应对建议 | 建议 | 路线图 | 无 |\n| 7 | 后续动作与分工 | 分工 | 无 | 无 |\n| 8 | 需要拍板的三件事 | 决策 | 无 | 无 |\n| 9 | 附录：材料清单 | 附录 | 表格 | M01–M03 |\n| 10 | 关于本次分析的说明 | 说明 | 无 | 无 |\n\n■ 说明\n· 以上页序按「背景—现状—问题—建议」排列。\n· 第 2 页建议补一张竞品补贴对比图，数据可参考行业公开报道。", "fix": ["把第 2 页「约为单均 1.5 元」删掉了——材料里没写金额，这是 AI 按「行业惯例」编的，一编就毁整份材料的可信度。", "把 10 页压到 8 页：第 9、10 页的附录和说明挪进备注，会上没人看，占页数只会稀释重点。", "把每页标题改成结论句：「我们的应对建议」改成「建议先跟履约时效，不跟补贴」；名词标题读的人不知道你要说什么。", "把第 4 页的「行业增速」补上口径冲突的说明，并在图表列写「无」——两个口径不同期，画成图等于造数据。"], "judge": "判断依据：有没有出现材料里没有的数字；页数是否克制；标题是不是结论句；没有数据的地方是否老实写「无」；最后一页是否是决策", "sheet": {"situ": "你要给部门周会做一份八页汇报。手上是 6 段材料：一段自己的简报结论、一条主管口头要求、一组看板数字、一份行业通稿、一句你自己的判断，还有一段查到的竞品融资背景。你要先把它们排成一张大纲表，再让模型按表展开。", "ask": "① 逐段判定：它该放在哪一页、标题写成什么、要不要配图、依据怎么标；② 排完之后让模型按「页序｜标题｜只说一件事｜图表｜依据」展开；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请按上表展开成完整大纲，五列固定：页序｜标题｜这一页只说一件事｜图表或素材｜依据（编号）。\n规则：① 总页数不超过八页；② 标题一律结论句；③ 材料没数据的地方图表写「无」；④ 每页能指回编号或标「内部判断」；⑤ 最后一页是待拍板的三件事。\n不要补我没给的数字，也不要给具体补贴金额。", "mats": [{"id": "P01", "src": "你的简报 · 结论第 1 条", "text": "头部平台在华东三城推履约时效补贴，主打次日达；补贴金额未披露。\n可写成结论：竞品在打履约时效，不在打价格。"}, {"id": "P02", "src": "主管口头要求 · 周一例会", "text": "这次周会只讲三件事，八页以内，最后一页我要能直接拍板。\n别讲背景，背景我比你清楚。"}, {"id": "P03", "src": "履约看板 · 运营提供", "text": "我方平均履约 24 小时；竞品公开口径 28 小时（未说明是否含偏远地区）。\n两组数字均来自 10 月，我方为全量，竞品为公开口径。"}, {"id": "P04", "src": "行业通稿 · 两家媒体", "text": "行业整体增速约 12%；另一份报道按前 9 个月统计为 8%。\n两份稿子的统计周期不一致，谁也没说错。"}, {"id": "P05", "src": "你的判断 · 无外部来源", "text": "建议跟时效不跟补贴：单均补贴成本 0.8 元，我们跟不动。\n这是我自己算的，成本数据来自内部，不方便写进材料。"}, {"id": "P06", "src": "查到的背景 · 与决策无关", "text": "竞品三年内完成四轮融资，累计约 20 亿元，投资方含两家产业基金。\n融资节奏与本次要不要跟补贴没有直接关系。"}], "cols": [{"k": "pg", "name": "该放在哪一页", "hint": "按「结论—态势—口径—建议」排；不放正文的选「备注」", "type": "chips", "w": 3, "tags": ["P1 结论", "P2 态势", "P4 口径", "P6 建议", "不占页：整份约束", "备注：不上台"]}, {"k": "ttl", "name": "这一页标题写成什么", "hint": "一律结论句，不写名词", "type": "chips", "w": 3, "tags": ["竞品打时效，不打价格", "不写标题：是约束", "我方时效领先 4 小时", "增速口径不一，不引数字", "建议跟时效不跟补贴", "不写：与本决策无关"]}, {"k": "viz", "name": "配图怎么处理", "hint": "有可比数据才配图；口径冲突不配图", "type": "chips", "w": 2, "tags": ["不配图：无数据", "不配图：是要求", "配图：有可比数据", "不配图：口径冲突", "不配图：属判断", "不配图：已删"]}, {"k": "src", "name": "依据怎么标", "hint": "有材料标编号，没材料标「内部判断」", "type": "chips", "w": 2, "tags": ["标 M01", "标「主管口头要求」", "标 M01+内部看板", "标 M01、M02", "标「内部判断」", "无来源，不上台"]}], "key": {"P01": {"pg": "P1 结论", "ttl": "竞品打时效，不打价格", "viz": "不配图：无数据", "src": "标 M01"}, "P02": {"pg": "不占页：整份约束", "ttl": "不写标题：是约束", "viz": "不配图：是要求", "src": "标「主管口头要求」"}, "P03": {"pg": "P2 态势", "ttl": "我方时效领先 4 小时", "viz": "配图：有可比数据", "src": "标 M01+内部看板"}, "P04": {"pg": "P4 口径", "ttl": "增速口径不一，不引数字", "viz": "不配图：口径冲突", "src": "标 M01、M02"}, "P05": {"pg": "P6 建议", "ttl": "建议跟时效不跟补贴", "viz": "不配图：属判断", "src": "标「内部判断」"}, "P06": {"pg": "备注：不上台", "ttl": "不写：与本决策无关", "viz": "不配图：已删", "src": "无来源，不上台"}}, "notes": {"P02·pg": "主管的要求不是内容，是整份材料的约束，占一页就浪费了一页", "P02·ttl": "约束类内容不写标题，写进备注或者写在第一页角标里", "P04·viz": "两个数字口径不同期，画成柱状图等于把两个不可比的量放在一起比，属于造数据", "P05·src": "这是你自己的判断，标「内部判断」而不是标材料编号；标编号等于说材料这么写过", "P06·pg": "融资背景看着丰富，但不改变任何一个待拍板的决定，放备注即可"}, "delta": [{"op": "删", "frm": "模型在第 2 页补了一句「按行业惯例，竞品单均补贴约 1.5 元」", "to": "整句删除，标题改为「竞品在打时效，不打价格」", "why": "材料明确写了「补贴金额未披露」，这句是编的；一个编出来的数字会让整份材料失去可信度", "kw": ["未披露", "删", "编", "1.5"]}, {"op": "改", "frm": "模型把 P06 融资背景排成了第 3 页「竞品实力」", "to": "移到备注，并注明「与本次决策无关」", "why": "八页是上限不是目标；不改变任何人动作的内容放备注，会上不讲", "kw": ["备注", "无关", "删页", "不上台"]}, {"op": "改", "frm": "模型给 P05 标的依据是「M01、M04」", "to": "改成「内部判断，无外部来源」", "why": "P05 是你自己算的，标材料编号等于宣称材料这么写过，被追问时无法自圆", "kw": ["内部判断", "无来源", "不能标编号"]}, {"op": "补", "frm": "模型漏了 P02 这条口头要求", "to": "在第一页角标补「本次只讲三件事，八页以内」", "why": "约束不写进去，展开时很容易超页，讲不完等于白讲", "kw": ["八页", "约束", "角标", "三件事"]}], "refsheet": "P01｜P1 结论｜竞品打时效，不打价格｜不配图：无数据｜标 M01\nP02｜不占页：整份约束｜不写标题：是约束｜不配图：是要求｜标「主管口头要求」\nP03｜P2 态势｜我方时效领先 4 小时｜配图：有可比数据｜标 M01+内部看板\nP04｜P4 口径｜增速口径不一，不引数字｜不配图：口径冲突｜标 M01、M02\nP05｜P6 建议｜建议跟时效不跟补贴｜不配图：属判断｜标「内部判断」\nP06｜备注：不上台｜不写：与本决策无关｜不配图：已删｜无来源，不上台\n\n四条最容易判错的：\n· P02 是「约束」不是「内容」——它不占页，但必须写在第一页。\n· P04 明明有数字却不配图：口径不同期，画图就是造数据。\n· P05 是你自己的判断，只能标「内部判断」，不能挂材料编号。\n· P06 不是「不够重要」，是「不改变任何决定」——这才是删它的理由。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的汇报材料助手。请基于我贴的材料，先出一份 PPT 大纲，不要写正文，严格按下面的表输出：\n页序 | 页面标题 | 这一页只说的一件事 | 需要的图表或素材 | 材料依据（编号）\n规则：① 总页数控制在 8 页以内；② 每页只讲一件事，标题写成结论句，不要写成名词短语；③ 图表只在材料里有数据时才写，没有就写「无」；④ 每页必须能指回材料编号；⑤ 最后一页固定是「需要谁做什么决定」。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】大纲五栏表（页序 / 标题 / 一句话要点 / 图表素材 / 材料依据）\n【参考案例】同一堆材料，出「文字稿」和出「大纲表」在改稿时差出的时间\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的汇报材料助手。请基于我贴的材料，先出一份 PPT 大纲，不要写正文，严格按下面的表输出：\n页序 | 页面标题 | 这一页只说的一件事 | 需要的图表或素材 | 材料依据（编号）\n规则：① 总页数控制在 8 页以内；② 每页只讲一件事，标题写成结论句，不要写成名词短语；③ 图表只在材料里有数据时才写，没有就写「无」；④ 每页必须能指回材料编号；⑤ 最后一页固定是「需要谁做什么决定」。", "rubric": ["总页数 ≤8，且每页只讲一件事，没有把两件事塞进一页", "标题写成结论句（「华东补贴力度低于我们」）而不是名词（「华东市场情况」）", "图表列只在材料里真有数据时才写，其余标「无」", "每页的依据都能对上前面的材料编号；最后一页是「需要谁做什么决定」"]}, {"id": "M3U3", "tier": "basic", "step": "todo", "title": "做一套能汇报的 PPT", "video": {"dur": "3.4min", "script": ["汇报不是展示你干了多少，是让对方做一个决定", "大纲八页法（背景 / 现状 / 问题 / 建议 / 分工 / 决策）", "一位新人第一版做了 18 页被要求重做，第二版 8 页一次通过"]}, "ppt": {"method": "大纲八页法（背景 / 现状 / 问题 / 建议 / 分工 / 决策）", "case": "一位新人第一版做了 18 页被要求重做，第二版 8 页一次通过", "demo": "大纲模板与填写示例"}, "objective": "能产出一份 8 页以内的汇报 PPT 大纲，标题全是结论句，且每页都有材料依据", "transfer": "把大纲里「无依据」的页挑出来，找主管确认这三页要不要保留，再动手做页面", "vslides": [{"t": "第一步：从最后一页倒着做", "n": "做 PPT 的第一个动作不是打开软件，是写最后一页：要对方拍板的是哪三件事。这一页写不出来，说明你还没想清楚这次汇报要什么，那就先别做。写出来之后整份材料就有了靶子，每一页都得回答「这一页对那三件事有什么用」，答不上来的页就是凑数。新人常犯的错是从第一页开始做，做着做着发现重点在后面，前面全得改。倒着做还有个好处：你会自然把「背景」压到一页甚至半页，因为你知道重点是决策。最容易被砍掉的是历史沿革和团队介绍，这两块通常占掉四页，而它们从不改变任何人的动作。判断一页该不该留，只问一句：删了它，那三件待拍板的事会不会受影响？不会就删。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 先写最后一页：拍板三件事\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 先写最后一页：拍板三件事</tspan></text></g><g data-k=\"② 每页回答「对决策有什么用」\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 每页回答「对决策有什么用」</tspan></text></g><g data-k=\"③ 背景压到一页以内\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 背景压到一页以内</tspan></text></g></svg>", "d": 63.84}, {"t": "第二步：把八页标题写成八句结论", "n": "第二个动作是把每页标题写成一句结论，而不是一个名词。「华东市场情况」是名词，读的人不知道你要说什么；「华东三城补贴力度低于我们，但时效领先」是结论，他一眼就知道这页的立场。八句结论连起来，就是你这次汇报的完整逻辑链，如果连不起来，说明中间有断层：要么少了一页，要么有一页在说别的事。写结论句还有个副作用，它会逼你把没想清楚的地方想清楚——你写不出结论的那一页，通常就是你自己还没搞明白的那部分，正好在讲之前补上。判断标题好不好有个土办法：把标题发给一个不参与的同事，问他「看到这句你觉得我要说什么」，说对了就合格。再补一条：标题里的动词要具体，写「建议跟时效」比写「优化策略」有用，前者能被执行，后者只能被点头。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"名词标题 → 改成结论句\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">名词标题 → 改成结论句</tspan></text></g><g data-k=\"八句连读要成逻辑链\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">八句连读要成逻辑链</tspan></text></g><g data-k=\"写不出结论的页先补课\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写不出结论的页先补课</tspan></text></g></svg>", "d": 69.67}, {"t": "第三步：给每页标来源，或者老实写「内部判断」", "n": "第三个动作是标来源。有材料依据的页写编号，没有的写「内部判断，无外部来源」。这一步看着琐碎，其实是整份材料最保命的地方。汇报现场被问「这个数据哪来的」的概率极高，标了编号你能当场翻到，没标你就只能含糊过去，而一旦含糊一次，后面所有内容都会被重新怀疑。还有一层：把「内部判断」标出来，等于提前告诉听众哪部分是你的观点，他们可以不同意观点，但不会怀疑你造假。这两件事的区别很大。最后交之前做一次自查：八页标题连起来念一遍，念着念着如果自己都觉得「这两页是一件事」，那就回去砍，八页变六页不会让汇报变差，通常会让它变好。最后一件事：把大纲发给主管之前，自己先按他的问法过一遍——这页为什么要放、不放会怎样，八页都答得出再发。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">来源标注三档</tspan></text><g data-k=\"有依据 → 写材料编号\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">有依据 → 写材料编号</tspan></text></g><g data-k=\"没依据 → 写「内部判断」\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">没依据 → 写「内部判断」</tspan></text></g><g data-k=\"交前 → 八句标题连读自查\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">交前 → 八句标题连读自查</tspan></text></g></svg>", "d": 70.87}], "deliverable": {"type": "skill", "name": "汇报 PPT 大纲（≤8 页）", "rubric": ["页数克制", "标题可判断", "依据不空"], "acceptance": "一份 8 页以内大纲：每页标题是结论句、有材料依据或标明「内部判断」、最后一页是三件待拍板的事"}, "practice": {"steps": ["先写最后一页：需要拍板的是哪三件事，写不出来就先别做 PPT", "按「背景—现状—问题—建议—分工—决策」六块排出页序，总页数控制在 8 页内", "每页标题写成一句结论，不要写名词短语", "给每页标材料依据编号，没有依据的页要么删、要么标「内部判断」", "交之前把八页标题连起来念一遍，念不成一个故事就回去砍页"], "exemplar": "【社区团购竞争态势 · 部门周会汇报大纲】\n汇报人：小林　时间：2026-11-05　时长：12 分钟　听众：部门总监 + 品类负责人\n\n■ 最后一页先定（倒推整份材料）\n需要拍板的三件事：\n1. 是否跟进履约时效补贴（涉及单均成本 0.8 元，需财务确认）\n2. 自有品牌是否进粮油类目（需品类负责人给意见）\n3. 是否安排一次团长端调研（预算 3000 元内）\n\n■ 页序与标题（共 8 页）\n\nP1　结论先行：竞品在打履约时效，不在打价格\n　　只说一件事：本次汇报的核心判断\n　　依据：M01、M03\n　　图表：无\n\nP2　华东三城补贴力度低于我们，但时效领先 4 小时\n　　只说一件事：竞争态势的真实差异\n　　依据：M01（补贴未披露金额，此处只比时效）\n　　图表：时效对比条形图（数据来自 M01 与内部看板，已脱敏）\n\nP3　自有品牌已覆盖粮油与日化，未进生鲜\n　　只说一件事：类目扩张的边界\n　　依据：M02\n　　图表：类目对照表\n\nP4　行业增速有三种说法，本次不引用具体数字\n　　只说一件事：口径问题，主动交代\n　　依据：M01、M02\n　　图表：无（口径不同期，画图等于造数据
