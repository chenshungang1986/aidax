）\n\nP5　价格行为提示已出现在外地，本地尚未跟进\n　　只说一件事：合规侧的观察\n　　依据：M03\n　　图表：无\n\nP6　建议：跟时效，不跟补贴\n　　只说一件事：我的建议与理由\n　　依据：由 P2、P4 推出，属内部判断，无外部来源\n　　图表：无\n\nP7　分工与时间：两周内三个动作\n　　只说一件事：谁在什么时候交什么\n\nP8　需要拍板的三件事\n　　只说一件事：请总监逐条给意见\n\n■ 砍掉的内容（放进备注，会上不讲）\n· 团长端迁移讨论：只有观点无数据，讲了会被追问\n· 六份材料的详细摘要：放附录，需要时再翻\n· 竞品历史沿革：与本次决策无关\n\n■ 自查\n八页标题连读：「竞品打时效不打价格 → 补贴低但时效领先 → 自有品牌未进生鲜 →\n增速无统一口径 → 合规提示在外地 → 建议跟时效 → 两周三个动作 → 请拍板」——是一个完整故事。"}, "task": "产出《汇报 PPT 大纲（≤8 页）》：先写最后一页：需要拍板的是哪三件事，写不出来就先别做 PPT；按「背景—现状—问题—建议—分工—决策」六块排出页序，总页数控制在 8 页内；每页标题写成一句结论，不要写名词短语；给每页标材料依据编号，没有依据的页要么删、要么标「内部判断」；交之前把八页标题连起来念一遍，念不成一个故事就回去砍页", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M3 用 AI 写文档与做 PPT」模块，你要交付的是《汇报 PPT 大纲（≤8 页）》。\n【场景】业务侧这周的诉求是：汇报不是展示你干了多少，是让对方做一个决定。参考做法：一位新人第一版做了 18 页被要求重做，第二版 8 页一次通过。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（大纲八页法（背景 / 现状 / 问题 / 建议 / 分工 / 决策）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《汇报 PPT 大纲（≤8 页）》填写模板】\n\n■ 1. 先写最后一页：需要拍板的是哪三件事，写不出来就先别做 PPT\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 按「背景—现状—问题—建议—分工—决策」六块排出页序，总页数控制在 8 页内\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 每页标题写成一句结论，不要写名词短语\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 给每页标材料依据编号，没有依据的页要么删、要么标「内部判断」\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 交之前把八页标题连起来念一遍，念不成一个故事就回去砍页\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【社区团购竞争态势 · 部门周会汇报大纲】\n汇报人：小林　时间：2026-11-05　时长：12 分钟　听众：部门总监 + 品类负责人\n\n■ 最后一页先定（倒推整份材料）\n需要拍板的三件事：\n1. 是否跟进履约时效补贴（涉及单均成本 0.8 元，需财务确认）\n2. 自有品牌是否进粮油类目（需品类负责人给意见）\n3. 是否安排一次团长端调研（预算 3000 元内）\n\n■ 页序与标题（共 8 页）\n\nP1　结论先行：竞品在打履约时效，不在打价格\n　　只说一件事：本次汇报的核心判断\n　　依据：M01、M03\n　　图表：无\n\nP2　华东三城补贴力度低于我们，但时效领先 4 小时\n　　只说一件事：竞争态势的真实差异\n　　依据：M01（补贴未披露金额，此处只比时效）\n　　图表：时效对比条形图（数据来自 M01 与内部看板，已脱敏）\n\nP3　自有品牌已覆盖粮油与日化，未进生鲜\n　　只说一件事：类目扩张的边界\n　　依据：M02\n　　图表：类目对照表\n\nP4　行业增速有三种说法，本次不引用具体数字\n　　只说一件事：口径问题，主动交代\n　　依据：M01、M02\n　　图表：无（口径不同期，画图等于造数据）\n\nP5　价格行为提示已出现在外地，本地尚未跟进\n　　只说一件事：合规侧的观察\n　　依据：M03\n　　图表：无\n\nP6　建议：跟时效，不跟补贴\n　　只说一件事：我的建议与理由\n　　依据：由 P2、P4 推出，属内部判断，无外部来源\n　　图表：无\n\nP7　分工与时间：两周内三个动作\n　　只说一件事：谁在什么时候交什么\n\nP8　需要拍板的三件事\n　　只说一件事：请总监逐条给意见\n\n■ 砍掉的内容（放进备注，会上不讲）\n· 团长端迁移讨论：只有观点无数据，讲了会被追问\n· 六份材料的详细摘要：放附录，需要时再翻\n· 竞品历史沿革：与本次决策无关\n\n■ 自查\n八页标题连读：「竞品打时效不打价格 → 补贴低但时效领先 → 自有品牌未进生鲜 →\n增速无统一口径 → 合规提示在外地 → 建议跟时效 → 两周三个动作 → 请拍板」——是一个完整故事。", "rubric": ["总页数 ≤8，且没有两页在说同一件事", "每页标题都是结论句，读标题就能知道这页要证明什么", "每页都有依据：材料编号，或明确写「内部判断，无外部来源」", "最后一页是可拍板的三件事，不是「谢谢聆听」"]}, {"id": "M3U4", "tier": "basic", "step": "spar", "title": "主管挑你的 PPT", "video": {"dur": "3.3min", "script": ["每一页都要能回答「不放会怎样」，答不上来就该删", "逐页应答四句（这页要证明什么 / 依据是什么 / 删了什么 / 要不要保留）", "「这页为什么要放」与「这页不放会怎样」两种回答的差别"]}, "ppt": {"method": "逐页应答四句（这页要证明什么 / 依据是什么 / 删了什么 / 要不要保留）", "case": "「这页为什么要放」与「这页不放会怎样」两种回答的差别", "demo": "陪练说明：他会跳过内容，直接问每页存在的理由"}, "objective": "能在主管逐页追问下，说清每页的依据与取舍，并承认哪几页是自己判断不是查到的", "transfer": "把主管问住的那两页记下来，下次做大纲时先在标题旁边标「判断」还是「事实」", "vslides": [{"t": "陪练说明：他问的不是内容，是这页存在的理由", "n": "这一关的对手是直属主管。他不逐字听你讲，而是逐页问一句「这页为什么要放」。这个问题的杀伤力在于：大多数页其实答不上来。答「这是背景」等于承认可以删。正确答法是把它挂到决策上：这页要证明什么、证明了之后会影响哪一件事。如果一页既证明不了什么、也不影响任何决定，那它确实该删。准备方法很简单：把八页摊开，逐页写一句话「不放这页，听众会缺什么」。写得出来的留下，写不出来的删掉。这个过程通常能砍掉两页，而且砍完你自己会觉得材料更有劲。还有一层心理准备：他问这个不是挑刺，是在帮你把材料压到能讲完的长度。你答得越干脆，他越放心让你上台。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每页三问</tspan></text><g data-k=\"这页证明什么\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">这页证明什么</tspan></text></g><g data-k=\"影响哪个决定\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">影响哪个决定</tspan></text></g><g data-k=\"不放会缺什么\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">不放会缺什么</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 64.99}, {"t": "第二问：标题是你的结论还是材料原话", "n": "第二问通常是「这个标题是你说的还是材料说的」。这一问在查你有没有把转述当结论。材料原话可以直接引用，但要标出来源；你自己的结论要说明是怎么推的，依据哪几条。两者混在一起最危险：一旦材料被推翻，你的结论也跟着塌，而且没人分得清哪部分是你想的。答法很直接：「这句是我的判断，依据 M01 和 M03 两条推出来的，材料里没有直接这么说。」这句话一出口，主管对你的信任会明显上升，因为你显示了区分能力。反过来，把材料原话当成自己的判断，被追问「哪份材料这么写的」时，你会去找，找的过程本身就是失分。还有一个细节：引用材料原话时最好念出原句，而不是概括，概括容易被认为你在加工。这一问还有个变体：他会问「这句是材料里的原话吗，你念一下」，念不出来就说明你在加工。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"材料原话 → 标编号引用\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">材料原话 → 标编号引用</tspan></text></g><g data-k=\"自己结论 → 说清怎么推的\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">自己结论 → 说清怎么推的</tspan></text></g><g data-k=\"两者不混 → 塌一半不会全塌\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">两者不混 → 塌一半不会全塌</tspan></text></g></svg>", "d": 68.62}, {"t": "最狠一问：只给四页你删哪四页", "n": "最后一问通常是「如果只给你四页，你删哪四页」。这问题考的是优先级，不是记忆力。答法要给出原则再给名单：先保决策页，再保结论页，再保唯一有数据的页，最后保合规风险页；删的是背景、沿革、附录、以及重复表达同一件事的页。给出原则比给名单重要，因为原则说明你懂这份材料的骨架，名单只说明你背过。很多人这一问答崩，是因为他舍不得，觉得每页都重要。但汇报的现实是：讲不完等于白讲。八页讲十二分钟，四页讲六分钟，后者往往效果更好，因为听众能记住。答完可以补一句：「如果您觉得四页太少，我建议保留六页，砍掉 P3 和 P7。」给方案而不是给态度。顺便说一句，能给出删减方案的人，通常也会被允许保留更多页。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">能压缩</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">讲不完</tspan></text><g data-k=\"先保决策页，再保结论页\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">先保决策页，再保结论页</tspan></text></g><g data-k=\"每页都重要，都别删\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">每页都重要，都别删</tspan></text></g></svg>", "d": 66.19}], "deliverable": {"type": "skill", "name": "汇报 PPT 大纲", "rubric": ["答得出用处", "敢认判断", "删减有据"], "acceptance": "四问都答得出：这页对决策的作用、标题是判断还是转述、主动区分判断与事实、能给出有依据的删减方案"}, "spar": {"role": "直属主管", "persona": "不逐字看内容，逐页问「这页为什么要放」，答不上来就让你删；会顺手抽一页问数据来源", "mustAsk": ["这页为什么要放？不放会怎样？", "这一页的标题是你的结论还是材料的原话？", "八页里哪几页其实是你自己的判断，不是查到的？", "如果只给你四页，你删哪四页？"]}, "exemplar": "（主管问：第三页这个自有品牌，跟我们要拍板的事有什么关系）\n\n结论：这页要证明的是「竞品扩张没进生鲜」，所以短期不冲击我们的主力类目。\n依据：M02 那篇报道里列了铺开的类目，只有粮油和日化，没有生鲜；我又去两个平台的 App 按城市抽查了五个城市，有货类目一致。\n边界：这页我原来写了「预计明年会进生鲜」，那句是我推的，没有依据，已经删了。如果您觉得这页信息量不够，我可以把它和第四页合并，因为两页都在讲「暂时没有直接冲击」。", "task": "把《汇报 PPT 大纲》拿到「直属主管」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《汇报 PPT 大纲》。现在要让它通过「直属主管」这一关。\n【对手的立场】不逐字看内容，逐页问「这页为什么要放」，答不上来就让你删；会顺手抽一页问数据来源。\n【他一定会追问】「这页为什么要放？不放会怎样？」 / 「这一页的标题是你的结论还是材料的原话？」 / 「八页里哪几页其实是你自己的判断，不是查到的？」\n【场景】你说「主管挑你的 PPT」，对方立刻回一句：这页为什么要放？不放会怎样？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能说出这页对「拍板三件事」的具体作用，而不是「背景介绍」", "能说清标题是自己的结论还是材料原话，不混为一谈", "主动指出哪几页是内部判断，并说明依据是哪几条推出来的", "被要求删页时，能给出保留优先级并说明理由，不是随便删"]}, {"id": "M3U5", "tier": "adv", "step": "understand", "title": "同一件事，写给三个不同的人看", "video": {"dur": "3.4min", "script": ["内容不变，读者变了，写法就必须变", "读者三问（身份 / 关心点 / 要做的决定）", "同一条延期通知，发给主管、同事、客户后的三种不同反应"]}, "ppt": {"method": "读者三问（身份 / 关心点 / 要做的决定）", "case": "同一条延期通知，发给主管、同事、客户后的三种不同反应", "demo": "读者三问卡：拿一条信息填三张卡"}, "objective": "能用「他是谁 / 他关心什么 / 他要做什么决定」三问，把同一件事改写成三种读者版本", "transfer": "把手上一条要同步的信息，分别写给主管、协作同事、客户各一版，各不超过 150 字", "vslides": [{"t": "读者三问：先想清楚写给谁", "n": "同一条信息，发给三个人要用三种写法，这不是圆滑，是效率。写之前先填三问：他是谁、他关心什么、他要做什么决定。主管关心的是风险和资源，所以第一句要给结论和影响；协作同事关心的是自己那部分要改什么，所以第一句要给他动作和时间；客户关心的是自己的利益有没有受损，所以第一句要给保障方案。三问填完，写法基本就定了。新人常犯的错是「一份通用稿发给所有人」，结果主管觉得没重点、同事觉得不知道要干嘛、客户觉得你在推责。通用稿的成本不是写得差，是每个人都要再问你一遍，你还得再解释三次。花五分钟分三版，省的是后面半小时的来回。还有一层：分版本不是分立场，事实只有一套，只是把对方最关心的那部分挪到前面。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">读者三问</tspan></text><g data-k=\"他是谁\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">他是谁</tspan></text></g><g data-k=\"他关心什么\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">他关心什么</tspan></text></g><g data-k=\"他要做什么决定\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">他要做什么决定</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 67.37}, {"t": "事实不变，重点可变", "n": "改写不等于改事实。三个版本里的数字、时间、责任必须完全一致，变的只是顺序和详略。给主管的版本先讲影响再讲原因；给同事的版本先讲动作再讲影响；给客户的版本先讲保障再讲原因。顺序变了，读者接收到的第一信息就变了，这已经足够。有一条红线：不能为了某一方舒服就隐去风险。比如交付延期，给客户那版可以说「我们增加了两个人手，交付时间从 15 号调整到 20 号」，但不能说「预计 15 号完成」——那就成了骗。改写的技巧在于把同一件事放到读者最关心的位置上，而不在于删掉他不想听的部分。删掉的部分，他迟早会从别处知道，那时你失去的是信任，不是一次沟通。换句话说，改写是在做排序，不是在做取舍——取舍意味着有人被瞒，排序意味着有人被优先。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"数字时间责任三版一致\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数字时间责任三版一致</tspan></text></g><g data-k=\"变的只是顺序与详略\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">变的只是顺序与详略</tspan></text></g><g data-k=\"不能为讨好而隐去风险\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不能为讨好而隐去风险</tspan></text></g></svg>", "d": 73.97}, {"t": "一个自查：哪一版最容易被误读", "n": "写完三版，做一次自查：哪一版最容易被误读，为什么。通常是给同事那版，因为你默认他知道背景，省掉了一些前提，而实际他可能刚接手。也可能是给客户那版，因为你为了显得稳，用了「基本」「大概率」这类模糊词，客户会理解成「还没定」。自查的方法是把每一版给一个不知情的人读，问他「你觉得我要你做什么」，答对了就过关。这个方法很土，但比你自己反复看有效得多，因为你知道背景，看不出歧义。还有一条经验：字数越少，误读概率越高，所以压缩到 150 字以内时，宁可少说一件事，也不要把一件事说得含糊。如果 150 字装不下，正确做法是拆成两条消息，而不是把两件事压成一句。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 找不知情的人读一遍\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 找不知情的人读一遍</tspan></text></g><g data-k=\"② 问他「我要你做什么」\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 问他「我要你做什么」</tspan></text></g><g data-k=\"③ 答不对就改，不是他理解差\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 答不对就改，不是他理解差</tspan></text></g></svg>", "d": 63.05}], "deliverable": {"type": "skill", "name": "三版改写对照", "rubric": ["读者对齐", "事实一致", "长度克制"], "acceptance": "能对同一条信息写出三个版本，每版开头就对上该读者的关心点，且事实没有增减"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】读者三问（身份 / 关心点 / 要做的决定）\n【为什么重要】内容不变，读者变了，写法就必须变\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三个版本的开头分别对上三类读者的关心点，不是同一段话换个称呼", "三版事实完全一致，没有为了讨好某一方而改数字或隐去风险", "每版控制在 150 字内，没有把给同事的细节塞给客户", "能说出哪一版最容易被误读，以及为什么"]}, {"id": "M3U6", "tier": "adv", "step": "demo", "title": "一份内容改写三个版本", "video": {"dur": "3.3min", "script": ["改写的功夫在删，不在写", "三版改写表（读者 / 第一句给什么 / 保留什么 / 删掉什么）", "同一份延期说明，三种写法导致的三种不同追问"]}, "ppt": {"method": "三版改写表（读者 / 第一句给什么 / 保留什么 / 删掉什么）", "case": "同一份延期说明，三种写法导致的三种不同追问", "demo": "WorkBuddy 内跑一遍三版改写，对照 AI 原稿与人改稿"}, "objective": "能把一份长材料改写成主管版、同事版、客户版三个短版本，事实一致且各对上关心点", "transfer": "把这三个版本存进自己的文档模板库，下一次同步信息直接套用，不再从零写", "vslides": [{"t": "演示准备：三版改写，改的是顺序不是事实", "n": "这次手上是一份交付延期的说明。我先自己写了一版通用稿，然后让它改三版。为什么不用一版通用稿？因为通用稿的隐含假设是「所有人都关心同一件事」，这个假设永远是错的。主管想知道影响和要不要他出面，同事想知道自己要改什么、什么时候改，客户想知道自己的时间会不会被耽误。三件事都在同一份材料里，只是排序不同。所以改写的动作是重排加删减，不是重写。重写会让事实漂移，重排不会。这条原则要记住：改写时只动顺序和详略，不动数字、时间、责任人。一旦发现某一版需要动数字才能说得通，那说明原始信息本身有问题，该回去核对，而不是在措辞上想办法。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">改写的边界</tspan></text><g data-k=\"同一份事实\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">同一份事实</tspan></text></g><g data-k=\"三种排序\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三种排序</tspan></text></g><g data-k=\"三个版本\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">三个版本</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.42}, {"t": "跑一遍：三个约束里最狠的是「不许模糊」", "n": "提示词里三个约束，最狠的是「不许用基本、大概率、尽快」。这类词看着稳妥，实际是把判断推给读者：读者看到一个「尽快」，不知道是今天还是下周，只能再来问你一次，沟通成本翻倍。换成具体日期和具体动作，虽然显得没那么圆滑，但读者能直接行动。第二个约束是「不许为照顾某一方隐去风险」。模型有个倾向：给客户的版本会自动乐观化，把「延期 5 天」写成「预计近期完成」。这在合规上是红线，在职业上也是。第三个约束是「删掉的写明理由」，这条是给自己看的，它会逼你想清楚每一段为什么能删——理由必须是「他不做这个决策」，而不是「他看不懂」。这两者的区别，决定了你是在尊重读者还是在轻视读者。跑完你会发现三版的字数差不多，但读起来完全是三封不同的信。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：一份延期说明（含技术细节与内部责任）\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一份延期说明（含技术细节与内部责任）</tspan></text></g><g data-k=\"约束：事实锁定 / 不许模糊词 / 不许隐去风险\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：事实锁定 / 不许模糊词 / 不许隐去风险</tspan></text></g><g data-k=\"产出：三版 + 删除清单\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：三版 + 删除清单</tspan></text></g></svg>", "d": 70.42}, {"t": "人工收口：把决定权交回去", "n": "跑完最容易被忽略的一处是：给主管那版有没有把决定权交回去。AI 写汇报有个通病，只汇报不请示——它会把事实讲清楚，但不会问你「要不要通知客户」。而主管看汇报，最想知道的恰恰是「你要我做什么」。所以每版结尾都要有一个明确的收口：给主管的是「需要您确认 X」，给同事的是「请在 X 前完成 Y」，给客户的是「我们将在 X 提供 Y」。没有收口的沟通，等于把球踢回去，对方还得再问一轮。最后做一次一致性自查：把三版的日期、天数、人数并排列出来，确认没有一版不一样。这一步三十秒，能挡住最尴尬的一类事故——客户和主管对不上时间，然后一起找你。这一步做完，这封邮件才算真的能发出去。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"主管版要请示，不是只汇报\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">主管版要请示，不是只汇报</tspan></text></g><g data-k=\"同事版要落到时间与动作\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">同事版要落到时间与动作</tspan></text></g><g data-k=\"三版数字并排比对\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">三版数字并排比对</tspan></text></g></svg>", "d": 62.9}], "deliverable": {"type": "skill", "name": "三版改写对照表", "rubric": ["读者对齐", "事实锁定", "删得下去"], "acceptance": "三版事实一致、开头各对上关心点、每版 150 字内，且能说出每版删了什么、为什么能删"}, "demo": {"ref": "| 读者 | 第一句给什么 | 正文 | 删掉了什么 | 理由 |\n|---|---|---|---|---|\n| 直属主管 | 影响与需要他做的决定 | 交付将延至 11/20，比原计划晚 5 天，主因是接口联调发现两处数据不一致。已加派 2 人，风险可控。需要您确认是否同步通知客户。 | 技术细节、复现步骤 | 他不做技术决策 |\n| 协作同事 | 他要改什么、什么时候 | 交付改到 11/20。你负责的字段映射需在 11/14 前按新口径重出一版，我 11/15 合并。原定 11/12 的联调取消。 | 对客户的沟通安排 | 不涉及他的动作 |\n| 外部客户 | 保障方案与新的时间 | 交付时间由 11/15 调整为 11/20。原因是数据校验发现两处不一致，我们已完成修正并增加 2 人复核。11/18 提供验收版本，11/20 正式交付。 | 内部责任划分、加人成本 | 属内部信息 |\n\n■ 一致性自查\n· 三版交付日期均为 11/20，延期天数均为 5 天，加派人数均为 2 人。\n· 三版均说明了「数据不一致」这一原因，未在任何一版中隐去。", "fix": ["把客户那版的「预计 15 号可以完成」改掉了——AI 为了让客户安心把日期写回去了，这是隐去风险，属于红线。", "把三版的「尽快」「基本没问题」全删了，换成具体日期与具体动作；模糊词会让读者无法行动，只能再来问一遍。", "给同事那版补了「原定 11/12 的联调取消」，AI 漏了这条，而这条恰恰是同事最需要知道的变化。", "给主管那版补了「需要您确认是否同步通知客户」，把决定权交回去；AI 那版只汇报不请示，主管还得再问一句。"], "judge": "判断依据：三版事实是否一致；有没有为安抚而改日期或隐去风险；模糊词是否清干净；每版是否给出了可执行的动作或决定", "sheet": {"situ": "交付延期了，你要写一份说明，同时发给直属主管、协作同事和外部客户。手上是 6 段原始信息，其中有些只能给内部看，有些必须三版都写清楚。你要逐段判断：放进哪一版、怎么处理、不改会出什么事。", "ask": "① 逐段判定放进哪个版本、怎么处理、不改的风险；② 让模型按「读者｜第一句给什么｜正文｜删掉了什么｜理由」改三版；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请把上面六段改写成三个版本，严格按表输出：读者｜第一句给什么｜正文（≤150 字）｜删掉了什么｜理由。\n读者分别是：直属主管、协作同事、外部客户。\n规则：① 三版事实、数字、时间必须完全一致；② 不许用「基本」「大概率」「尽快」；③ 不许为照顾某一方而隐去风险；④ 删掉的每条都写明理由。", "mats": [{"id": "D01", "src": "技术说明 · 内部", "text": "接口联调发现 user_id 与 order_no 两处字段映射不一致，已定位并修正。\n同事需要按新口径重出字段映射。"}, {"id": "D02", "src": "交付计划 · 已确认", "text": "交付时间由 11 月 15 日调整至 11 月 20 日，延期 5 天。\n三版都必须写清这个日期，不能含糊。"}, {"id": "D03", "src": "内部复盘 · 责任认定", "text": "本次延期责任在张三，他未及时同步映射变更。\n属于内部管理事项，不对外。"}, {"id": "D04", "src": "资源投入 · 内部", "text": "已加派 2 人参与复核，增加成本约 3 万元。\n成本只对主管说，客户只需要知道加了人。"}, {"id": "D05", "src": "初稿措辞 · 待改", "text": "预计尽快完成，基本没问题，请放心。\n这类话看着稳妥，实际没法执行。"}, {"id": "D06", "src": "验收安排 · 已排期", "text": "11 月 18 日提供验收版本，11 月 20 日正式交付。\n客户最关心的就是这个节点。"}], "cols": [{"k": "ver", "name": "放进哪些版本", "hint": "主管 / 同事 / 客户三选或全选", "type": "chips", "w": 2, "tags": ["三版都要", "只主管版", "只同事版", "只客户版", "三版都删"]}, {"k": "act", "name": "怎么处理", "hint": "删、改、补、换位置，选最贴近的一个动作", "type": "chips", "w": 3, "tags": ["改成具体日期", "写成他要做的动作", "删掉，属内部信息", "删掉模糊词", "保留但简写", "换成保障方案"]}, {"k": "risk", "name": "不改会出什么事", "hint": "选后果，不选态度", "type": "chips", "w": 3, "tags": ["引发技术追问", "客户以为还能 15 号交", "内部责任外泄", "成本不该给客户", "读者无法行动", "客户不知道验收节点", "被追问为什么加人", "延期天数算错"]}], "key": {"D01": {"ver": "只同事版", "act": "写成他要做的动作", "risk": "引发技术追问"}, "D02": {"ver": "三版都要", "act": "改成具体日期", "risk": "客户以为还能 15 号交"}, "D03": {"ver": "三版都删", "act": "删掉，属内部信息", "risk": "内部责任外泄"}, "D04": {"ver": "只主管版", "act": "保留但简写", "risk": "成本不该给客户"}, "D05": {"ver": "三版都删", "act": "删掉模糊词", "risk": "读者无法行动"}, "D06": {"ver": "三版都要", "act": "换成保障方案", "risk": "客户不知道验收节点"}}, "notes": {"D01·ver": "字段映射是同事要动手改的东西，主管和客户都不需要知道字段名", "D03·ver": "责任认定属内部管理，写进任何对外版本都是给自己找麻烦，也会伤到同事", "D04·risk": "成本写进客户版，客户会拿它去谈价；写进同事版，同事会觉得被算账", "D05·act": "「基本没问题」不是处理，是删掉换具体日期——模糊词只会引发第二轮追问", "D06·act": "客户版要把验收节点写成他能抓住的东西：哪天给什么、哪天算完成"}, "delta": [{"op": "改", "frm": "模型给客户版写「预计近期完成，请放心」", "to": "改成「交付时间由 11 月 15 日调整为 11 月 20 日，11 月 18 日提供验收版本」", "why": "把延期说成「近期完成」属于隐去风险，客户之后按 15 号安排会直接炸", "kw": ["11 月 20", "延期", "隐去", "风险"]}, {"op": "删", "frm": "模型在客户版里写了「本次延期责任在张三」", "to": "整句删除，客户版只写原因与保障", "why": "内部责任不对外，写出去既不合规也不体面，且会让客户怀疑团队稳定性", "kw": ["责任", "张三", "不对外", "删"]}, {"op": "补", "frm": "模型给同事版漏了「原定 11 月 12 日的联调取消」", "to": "补一句「原 11/12 联调取消，改为 11/14 前重出字段映射」", "why": "这条恰恰是同事最需要知道的变化，漏了他会按旧计划白跑一趟", "kw": ["联调", "取消", "11/14", "字段映射"]}, {"op": "补", "frm": "模型给主管版只汇报了事实，没请示", "to": "结尾补「需要您确认是否同步通知客户」", "why": "主管看汇报最想知道的是「你要我做什么」，不给收口他还要再问一轮", "kw": ["请示", "确认", "通知客户", "收口"]}], "refsheet": "D01｜只同事版｜写成他要做的动作｜引发技术追问\nD02｜三版都要｜改成具体日期｜客户以为还能 15 号交\nD03｜三版都删｜删掉，属内部信息｜内部责任外泄\nD04｜只主管版｜保留但简写｜成本不该给客户\nD05｜三版都删｜删掉模糊词｜读者无法行动\nD06｜三版都要｜换成保障方案｜客户不知道验收节点\n\n四条最容易判错的：\n· D02 和 D06 都是「三版都要」——日期和节点对三类读者都关键，一个都不能省。\n· D04 不是「删掉」，是「只给主管 + 简写」：成本是决策信息，不是禁语。\n· D05 的处理是「删掉模糊词」，不是「删整段」——要换成具体日期，不是不写时间。\n· D03 删的理由是「属内部信息」，不是「他看不懂」——这两者的区别决定你是在守边界还是在轻视读者。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的沟通改写助手。我给你一段原始说明，请改写成三个版本，严格按表输出：\n读者 | 第一句给什么 | 正文（≤150 字）| 删掉了什么 | 删的理由\n读者分别是：直属主管、协作同事、外部客户。\n规则：① 三版的事实、数字、时间、责任人必须完全一致；② 不许用「基本」「大概率」「尽快」这类模糊词；③ 不许为了照顾某一方而隐去风险；④ 删掉的每一条都要写明理由。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三版改写表（读者 / 第一句给什么 / 保留什么 / 删掉什么）\n【参考案例】同一份延期说明，三种写法导致的三种不同追问\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的沟通改写助手。我给你一段原始说明，请改写成三个版本，严格按表输出：\n读者 | 第一句给什么 | 正文（≤150 字）| 删掉了什么 | 删的理由\n读者分别是：直属主管、协作同事、外部客户。\n规则：① 三版的事实、数字、时间、责任人必须完全一致；② 不许用「基本」「大概率」「尽快」这类模糊词；③ 不许为了照顾某一方而隐去风险；④ 删掉的每一条都要写明理由。", "rubric": ["三版的数字、时间、责任人完全一致，没有一版偷偷改了量级", "每版第一句就落在该读者的关心点上，不是先交代背景", "每版都写清了「删掉了什么」，删的理由是「他不做这个决定」而不是「他看不懂」", "没有出现「基本」「大概率」「尽快」这类让读者无法行动的模糊词"]}, {"id": "M3U7", "tier": "adv", "step": "todo", "title": "建立你的文档模板库", "video": {"dur": "3.4min", "script": ["模板不是让你偷懒，是让你每次都从第三稿开始", "模板四件套（场景 / 骨架 / 填空位 / 一段范例）", "同一个人写周报从 40 分钟降到 12 分钟，差别只在于有没有模板"]}, "ppt": {"method": "模板四件套（场景 / 骨架 / 填空位 / 一段范例）", "case": "同一个人写周报从 40 分钟降到 12 分钟，差别只在于有没有模板", "demo": "模板库结构与五个必备模板"}, "objective": "能建起一个含 5 个模板的个人文档库，每个模板带使用场景说明与一段可填空的骨架", "transfer": "把模板库链接发到自己的工位便签上，下一份文档先用模板再改，不要从空白页开始", "vslides": [{"t": "第一步：先找出你真的重复写的东西", "n": "建模板库的第一个动作不是写模板，是翻记录。把过去一个月发出去的文档翻一遍，看哪几类反复出现。多数人会发现不超过五类：周报、方案、复盘、跨部门请求、对外说明。这五类占掉你八成的写作时间，剩下的都是偶发。模板只做这五类，别贪多——建了二十个模板的人，通常一个都不用，因为找不到。写模板的顺序建议从周报开始，因为它频率最高、结构最固定、也最容易被主管挑毛病。做完一个真的用一次，比做五个摆着看有用。还有一条：模板不是越详细越好，骨架超过四段就没人愿意填，宁可少一段也不要用不上。判断一个模板该不该建，标准很简单：同一类文档你一个月内写过三次以上，就值得建；只写过一次，先别急着建。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 翻一个月记录，找重复类型\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 翻一个月记录，找重复类型</tspan></text></g><g data-k=\"② 只做五类，别贪多\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 只做五类，别贪多</tspan></text></g><g data-k=\"③ 先做周报，用一次\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 先做周报，用一次</tspan></text></g></svg>", "d": 69.24}, {"t": "第二步：填空位要用〔〕标出来，不要写成范文", "n": "模板和范文的区别在于有没有填空位。写成范文，用的人得先删再填，反而更慢；用〔〕标出填空位，拿到手直接往里塞，几秒就能出一版。填空位还要带提示，比如〔具体人〕需要〔具体事〕，最晚〔时间〕，提示会告诉你这一格该填什么粒度。新人建模板最容易犯的错是把模板写成一篇好文章，然后自己每次都在改文章，等于没建。还有个细节：模板里要保留「这一段不能空」的警示。比如方案模板的第四段风险兜底，空着交上去一定会被问，与其被问，不如在模板里就写着提醒自己。模板的价值不是省字，是省「想结构」这件事。这一步做完，你下次写文档的第一分钟就有事可做，而不是对着空白页发呆；发呆那几分钟，是效率最大的漏点。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"范文让人删，模板让人填\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">范文让人删，模板让人填</tspan></text></g><g data-k=\"填空位带粒度提示\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">填空位带粒度提示</tspan></text></g><g data-k=\"关键段标注「不能空」\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">关键段标注「不能空」</tspan></text></g></svg>", "d": 64.99}, {"t": "第三步：每用一次记一笔卡住的地方", "n": "模板用起来之后，每用一次记一笔：哪里卡住了。卡住的地方就是下次要改的地方，这比一次做完再反复打磨有效得多。常见的卡点有三类：某一段永远空着（说明这段对你没用，删掉或合并）、某一格永远填不出来（说明粒度不对，改提示）、某一版总被退回（说明骨架缺了一段）。记录不用长，三行就够：哪天用的、卡在哪、下次怎么改。积累一个月，你的模板会从「通用骨架」变成「你的骨架」，那时候它的价值才真正出来——因为它带着你对这份工作的理解，别人抄不走。最后一个提醒：模板库要放在你能三秒打开的位置，存在文件夹深处等于没有。做到这一步模板库就算建起来了，剩下的只是每季度翻一次，把用不上的删掉——留着的模板太多，和没有模板一样麻烦。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">模板迭代的三个信号</tspan></text><g data-k=\"卡在哪一段\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">卡在哪一段</tspan></text></g><g data-k=\"哪一格填不出\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">哪一格填不出</tspan></text></g><g data-k=\"哪一版被退回\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">哪一版被退回</tspan></text></g></svg>", "d": 67.56}], "deliverable": {"type": "skill", "name": "个人文档模板库（5 个模板）", "rubric": ["场景清楚", "骨架可填", "用过一次"], "acceptance": "5 个模板：各有场景说明、可填空骨架、一段范例，且至少 2 个已经在真实工作里用过一次"}, "practice": {"steps": ["列出你一个月内重复写过 3 次以上的文档类型，通常不超过 5 类", "每类写一个模板：场景说明 + 四段骨架 + 用〔〕标出的填空位", "每个模板配一段 200 字左右的真实范例，范例要能直接改成自己的内容", "把模板存成同一目录下的独立文件，文件名带场景前缀，方便搜", "每用一次记一笔：哪里卡住了，卡住的地方就是下次要改的地方"], "exemplar": "【我的文档模板库 · v1】\n建立人：小林　日期：2026-11-06　存放位置：个人网盘/模板库/\n\n■ 模板 01：周报（每周五用，最重要）\n场景：每周五 17:00 前发给直属主管，抄送同组。读的人只有三分钟。\n骨架：\n　一、本周结论（一句）：〔本周最重要的一件事 + 结果〕\n　二、做了什么（三到五条）：〔动作〕→〔产出物〕→〔影响〕\n　三、下周要做什么（三条以内）：〔事项〕·〔时间〕·〔交付物〕\n　四、需要谁支持：〔具体人〕需要〔具体事〕，最晚〔时间〕\n填空位提示：第四条最容易空着，空着主管会以为你不需要帮助。\n\n■ 模板 02：方案（有决策要申请时用）\n场景：要申请资源、要批准方向时用，读者是能拍板的人。\n骨架：\n　一、结论：建议〔做什么〕，需要〔多少钱/多少人/多长时间〕\n　二、为什么：现状〔数据〕，问题〔一句话〕，不做的后果〔一句话〕\n　三、怎么做：分〔N〕步，每步写〔谁·何时·交什么〕\n　四、风险与兜底：最大风险〔X〕，兜底方案〔Y〕，止损线〔Z〕\n填空位提示：第四段不能空，空着会被认为没想过失败。\n\n■ 模板 03：复盘（项目结束或月度用）\n场景：给团队看，重点是「下次怎么不一样」。\n骨架：\n　一、结果：目标〔X〕，实际〔Y〕，差〔Z〕，原因一句话\n　二、判断错在哪：〔当时的假设〕vs〔实际情况〕\n　三、执行差在哪：〔该做没做〕/〔做了没做到位〕\n　四、下次改三条：可检验的动作，不写「加强沟通」\n\n■ 模板 04：跨部门请求（求人办事时用）\n场景：对方跟你没有汇报关系，只有共同目标。\n骨架：\n　一、我需要你做什么（一句话，放最前）\n　二、为什么找你（与他的目标的关系）\n　三、什么时候要（给两个时间：期望 / 最晚）\n　四、我这边已准备好什么（降低他的成本）\n\n■ 模板 05：对外说明（客户/合作方）\n场景：涉及时间、金额、责任的变化时用。\n骨架：\n　一、结论与时间（先说结果）\n　二、原因（一句，不推责）\n　三、我们的动作（已做的 / 将做的）\n　四、保障与联系人\n\n■ 使用记录（每次用完记一笔）\n11/06 周报模板：第四条空着交上去了，主管追问「你要不要人」。\n　　　→ 下次先写第四条再写第二条。\n11/08 跨部门请求模板：对方问「为什么是我」，说明第二条没写清。\n　　　→ 加一句「这件事与你 Q4 的 XX 指标直接相关」。\n\n■ 待补\n· 数据周报模板（含固定图表位）—— 下月建\n· 会议纪要模板 —— 等 M5 学完再建"}, "task": "产出《个人文档模板库（5 个模板）》：列出你一个月内重复写过 3 次以上的文档类型，通常不超过 5 类；每类写一个模板：场景说明 + 四段骨架 + 用〔〕标出的填空位；每个模板配一段 200 字左右的真实范例，范例要能直接改成自己的内容；把模板存成同一目录下的独立文件，文件名带场景前缀，方便搜；每用一次记一笔：哪里卡住了，卡住的地方就是下次要改的地方", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M3 用 AI 写文档与做 PPT」模块，你要交付的是《个人文档模板库（5 个模板）》。\n【场景】业务侧这周的诉求是：模板不是让你偷懒，是让你每次都从第三稿开始。参考做法：同一个人写周报从 40 分钟降到 12 分钟，差别只在于有没有模板。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（模板四件套（场景 / 骨架 / 填空位 / 一段范例）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《个人文档模板库（5 个模板）》填写模板】\n\n■ 1. 列出你一个月内重复写过 3 次以上的文档类型，通常不超过 5 类\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 每类写一个模板：场景说明 + 四段骨架 + 用〔〕标出的填空位\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 每个模板配一段 200 字左右的真实范例，范例要能直接改成自己的内容\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 把模板存成同一目录下的独立文件，文件名带场景前缀，方便搜\n   ‣ 提示：按模板字段逐项填满；确实缺的写「暂缺 + 补齐计划」。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 每用一次记一笔：哪里卡住了，卡住的地方就是下次要改的地方\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【我的文档模板库 · v1】\n建立人：小林　日期：2026-11-06　存放位置：个人网盘/模板库/\n\n■ 模板 01：周报（每周五用，最重要）\n场景：每周五 17:00 前发给直属主管，抄送同组。读的人只有三分钟。\n骨架：\n　一、本周结论（一句）：〔本周最重要的一件事 + 结果〕\n　二、做了什么（三到五条）：〔动作〕→〔产出物〕→〔影响〕\n　三、下周要做什么（三条以内）：〔事项〕·〔时间〕·〔交付物〕\n　四、需要谁支持：〔具体人〕需要〔具体事〕，最晚〔时间〕\n填空位提示：第四条最容易空着，空着主管会以为你不需要帮助。\n\n■ 模板 02：方案（有决策要申请时用）\n场景：要申请资源、要批准方向时用，读者是能拍板的人。\n骨架：\n　一、结论：建议〔做什么〕，需要〔多少钱/多少人/多长时间〕\n　二、为什么：现状〔数据〕，问题〔一句话〕，不做的后果〔一句话〕\n　三、怎么做：分〔N〕步，每步写〔谁·何时·交什么〕\n　四、风险与兜底：最大风险〔X〕，兜底方案〔Y〕，止损线〔Z〕\n填空位提示：第四段不能空，空着会被认为没想过失败。\n\n■ 模板 03：复盘（项目结束或月度用）\n场景：给团队看，重点是「下次怎么不一样」。\n骨架：\n　一、结果：目标〔X〕，实际〔Y〕，差〔Z〕，原因一句话\n　二、判断错在哪：〔当时的假设〕vs〔实际情况〕\n　三、执行差在哪：〔该做没做〕/〔做了没做到位〕\n　四、下次改三条：可检验的动作，不写「加强沟通」\n\n■ 模板 04：跨部门请求（求人办事时用）\n场景：对方跟你没有汇报关系，只有共同目标。\n骨架：\n　一、我需要你做什么（一句话，放最前）\n　二、为什么找你（与他的目标的关系）\n　三、什么时候要（给两个时间：期望 / 最晚）\n　四、我这边已准备好什么（降低他的成本）\n\n■ 模板 05：对外说明（客户/合作方）\n场景：涉及时间、金额、责任的变化时用。\n骨架：\n　一、结论与时间（先说结果）\n　二、原因（一句，不推责）\n　三、我们的动作（已做的 / 将做的）\n　四、保障与联系人\n\n■ 使用记录（每次用完记一笔）\n11/06 周报模板：第四条空着交上去了，主管追问「你要不要人」。\n　　　→ 下次先写第四条再写第二条。\n11/08 跨部门请求模板：对方问「为什么是我」，说明第二条没写清。\n　　　→ 加一句「这件事与你 Q4 的 XX 指标直接相关」。\n\n■ 待补\n· 数据周报模板（含固定图表位）—— 下月建\n· 会议纪要模板 —— 等 M5 学完再建", "rubric": ["5 个模板覆盖你真实重复写过的类型，不是为了凑数编的", "每个模板都有用〔〕标出的填空位，拿到手能直接往里填，不用再想结构", "每个模板配了真实范例，范例长度 ≥200 字且能直接改", "至少 2 个模板在真实工作里用过，并记录了「哪里卡住」"]}, {"id": "M3U8", "tier": "adv", "step": "spar", "title": "跨部门同事挑你的邮件", "video": {"dur": "3.4min", "script": ["对方不回你，通常不是没看到，是没看懂要他干嘛", "请求三件套（要什么 / 为什么是你 / 我已准备好什么）", "同一封请求，加了一句「我已准备好字段清单」后当天就回了"]}, "ppt": {"method": "请求三件套（要什么 / 为什么是你 / 我已准备好什么）", "case": "同一封请求，加了一句「我已准备好字段清单」后当天就回了", "demo": "陪练说明：他会扮演一个没空、也没义务帮你的同事"}, "objective": "能在跨部门同事质疑时，把一封请求邮件改到对方愿意接，并守住时间与责任边界", "transfer": "把最近一封被已读不回的请求邮件找出来，按这次的结构重写一遍再发一次", "vslides": [{"t": "陪练说明：他不欠你，所以第一句必须是请求", "n": "这一关的对手是跨部门同事。他和你的关系是「共同目标，没有汇报关系」，也就是说他不帮你也没人能罚他。所以邮件的写法要先换位：他打开邮件的第一秒在想什么？在想「这跟我有什么关系、要花我多久」。这两个问题在前三行答不上来，他就会关掉，然后忘记。新人常犯的错是先把背景写三段，把请求放在最后，读的人看到第三段还不知道你要干嘛。正确顺序反过来：第一句就是请求，第二句是为什么找他，第三句是他要花多久。背景可以放在后面，作为参考。还有个现实：他不回你，通常不是没看到，是没看懂要他做什么，或者看懂了但觉得麻烦。你要做的是把那两件事都提前解决掉。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">请求邮件前三行</tspan></text><g data-k=\"要你做什么\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">要你做什么</tspan></text></g><g data-k=\"为什么是你\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">为什么是你</tspan></text></g><g data-k=\"要花你多久\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">要花你多久</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 67.39}, {"t": "第二问：为什么是我", "n": "「为什么找我」这个问题背后是「凭什么是我」。答不好，对方会觉得你在推活。答法要落到他的职责或指标上，而不是「只有你懂」——「只有你懂」听着像夸奖，实际是负担，因为你把一件长期的事挂在他身上了。有效的说法是：「这块数据在您那边的系统里是主数据，我这边只能读到汇总值」，这才是客观原因。再加一句与他目标的关系：「这个口径确认了，月底的报表两边就能对上，省得您那边再解释一次。」让他看到这事对他也有好处。如果实在找不到关系，就老实承认：「这事对您那边没有直接收益，但我确实只能找您，我尽量把成本压到最低，只需要您回一句话。」诚实比编关系更管用。把成本说清楚，把理由说明白，多数人是愿意帮的，他们只是不想被拖进一件没边界的事。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"落在职责或指标上\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">落在职责或指标上</tspan></text></g><g data-k=\"不说「只有你懂」\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不说「只有你懂」</tspan></text></g><g data-k=\"找不到关系就诚实说\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">找不到关系就诚实说</tspan></text></g></svg>", "d": 68.23}, {"t": "第三、四问：要花多久，给不了怎么办", "n": "「要花我多长时间」是个门槛问题，答不好他会一直拖。降低门槛有三个办法：把动作说到最小（「回一句『按你说的』就行」）、把选项给他（「A 或 B，您选一个」）、把材料备齐（「字段清单在附件，您只需要看第三列」）。这三招做完，他的心理成本从「一个任务」降到「一句话」。最后一问是「如果我给不了会怎么样」，这一问答得好会加分：「如果 11/14 来不了，请告诉我最晚能给的时间，我按您的时间往后排，不会卡住您。」这句话的作用是告诉他：你有兜底，不会因为他拒绝而崩，所以他不用有压力。人只有在没有压力的时候才愿意帮忙。逼对方当场答应的邮件，通常得到的是已读不回。发出去之后隔一天再跟一次，只跟一句「您看方便吗」，不要重发全文。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">他愿意回</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">他装没看见</tspan></text><g data-k=\"给选项，留退路\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">给选项，留退路</tspan></text></g><g data-k=\"只给死线，逼当场答应\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">只给死线，逼当场答应</tspan></text></g></svg>", "d": 69.55}], "deliverable": {"type": "skill", "name": "跨部门请求邮件", "rubric": ["请求具体", "关系说清", "留了退路"], "acceptance": "四问都答得出：为什么是他（与他的目标的关系）、具体动作与颗粒度、他的时间成本、给不了时的兜底"}, "spar": {"role": "跨部门同事", "persona": "没空、也没义务帮你；会先问「为什么找我」，再问「要花我多久」，最后才看内容", "mustAsk": ["这事为什么找我？我们不是一个组的", "你要我做什么？说具体一点，别让我猜", "这要花我多长时间？我这周排满了", "如果我给不了，你这个事会怎么样？"]}, "exemplar": "（同事问：你这封邮件我看完了，没看出要我做什么，也没看出为什么找我）\n\n结论：需要您在 11/14 前确认三个字段的口径，只要回一句「按你说的」或指出哪条不对。\n依据：这三个字段在您那边的系统里是主数据，我这边只能读到汇总值，对不上明细；上周例会上您提过这块归您管。\n边界：我不需要您导数据，也不需要您改系统，只要口径确认这一句。如果 11/14 来不及，请告诉我最晚能给的时间，我按您的时间往后排。", "task": "把《跨部门请求邮件》拿到「跨部门同事」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《跨部门请求邮件》。现在要让它通过「跨部门同事」这一关。\n【对手的立场】没空、也没义务帮你；会先问「为什么找我」，再问「要花我多久」，最后才看内容。\n【他一定会追问】「这事为什么找我？我们不是一个组的」 / 「你要我做什么？说具体一点，别让我猜」 / 「这要花我多长时间？我这周排满了」\n【场景】你说「跨部门同事挑你的邮件」，对方立刻回一句：这事为什么找我？我们不是一个组的 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["第一句就说清要他做什么，不铺垫、不寒暄三段", "能说出为什么找他：与他的指标或职责的关系，而不是「只有你懂」", "明确给出他的时间成本（大概几分钟 / 回一句话即可），降低心理门槛", "留了退路：给不了时的替代方案或最晚时间，不逼对方当场答应"]}]}, {"id": "M4", "title": "M4 用 AI 处理数据与表格", "dims": ["data", "prompt", "strategy"], "units": [{"id": "M4U1", "tier": "basic", "step": "understand", "title": "先洗干净，再谈分析", "video": {"dur": "3.6min", "script": ["脏数据不会报错，它只会给你一个看起来很正常的错数", "数据四查（缺失 / 重复 / 口径 / 异常值）", "三行重复记录把月销抬高 8%，汇报当场被问住"]}, "ppt": {"method": "数据四查（缺失 / 重复 / 口径 / 异常值）", "case": "三行重复记录把月销抬高 8%，汇报当场被问住", "demo": "四查清单卡：拿一份订单表的六个问题各归一类"}, "objective": "能在动手算之前完成「缺失 / 重复 / 口径 / 异常值」四查，并为每处删改写出一句理由", "transfer": "把手上要用的那张表先做一遍四查，把发现的问题写成五行清单发给带你的人", "vslides": [{"t": "先看表，别看数", "n": "新人拿到一张表，第一反应是求和、算平均、画个图。这个顺序是错的。正确的顺序是先看表：多少行、多少列、每一列是什么、有没有空值。看表五分钟，能省掉后面两小时的重做。为什么？因为脏数据跑出来的结论不会报错，它只会给你一个看起来很正常的数。你拿这个数去汇报，会上被问「这个月为什么涨这么多」，你回去查才发现是三行重复记录把总量抬高了。脏数据最危险的地方不是它错，是它错得看不出来。所以拿到表先做四查：缺失、重复、口径、异常值。四查花不了多少时间，但它决定了后面所有数字可不可信。顺序别搞反：先查干净，再算结果，最后才画图。反过来做，图越漂亮，错得越难发现。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">数据四查</tspan></text><g data-k=\"缺失\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">缺失</tspan></text></g><g data-k=\"重复\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">重复</tspan></text></g><g data-k=\"口径\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">口径</tspan></text></g><g data-k=\"异常值\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">异常值</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.11}, {"t": "四查具体查什么", "n": "缺失查什么：每列有多少空值，空值是「没有这件事」还是「有但没记录」，这两者处理方式完全不同。重复查什么：按主键或单据号去重，看重复多少行，重复往往集中在某几天或某个人，那说明流程有问题。口径查什么：同一列在两个系统里含义是否一致，比如「订单量」在 A 表含取消单、在 B 表不含。异常值查什么：明显离群的数字先别删，先问它是录入错误还是真实大单。四查里最容易漏的是口径，因为它不报错，两个数都能算出来，只是含义不同。最容易被粗暴处理的是异常值，很多人直接删，删掉的可能是最有价值的那条。记住一个原则：异常值先标记、后判断，不要一上来就删。删之前先写一句「为什么判断它是错的」，写不出来就先别删。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 缺失：分清「没有」与「没记」\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 缺失：分清「没有」与「没记」</tspan></text></g><g data-k=\"② 重复：按单据号看集中度\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 重复：按单据号看集中度</tspan></text></g><g data-k=\"③ 口径：两表含义是否一致\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 口径：两表含义是否一致</tspan></text></g><g data-k=\"④ 异常：先标记不删\"><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 异常：先标记不删</tspan></text></g></svg>", "d": 67.3}, {"t": "洗干净的标准：每处删改都说得出理由", "n": "洗干净的标准不是「没有空值」，是「每一处删改都能说出理由」。做法是留一份清洗记录：删了哪几行、为什么删、改了哪几列、改成什么。这份记录不是给检查看的，是给自己用的——两周后你自己也记不清为什么把这十七行删了。记录还有个好处：它让你的结论可以被复核。同事问「为什么你的总量和我不一样」，你能翻出记录说「我删了十七行重复单」，一句话就解释完。没有记录的人只能重跑一遍，跑出来还是不一样。清洗的天花板是「可复现」：换一个人按你的记录做一遍，能得到同一个数。达不到这个标准，说明你做的不是清洗，是修数。修数是数据分析里最忌讳的事，因为它没有边界，改到满意为止，那就不是分析了。记住：清洗让数据更真，修数让数据更好看。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每处删改有理由\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每处删改有理由</tspan></text></g><g data-k=\"留清洗记录可复核\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">留清洗记录可复核</tspan></text></g><g data-k=\"换人按记录能复现\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">换人按记录能复现</tspan></text></g></svg>", "d": 75.79}], "deliverable": {"type": "skill", "name": "数据体检清单", "rubric": ["四查齐全", "理由可查", "不擅自删"], "acceptance": "能对一份表列出四查结果，每处删改都有理由，且能说出哪一查最容易被漏掉"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】数据四查（缺失 / 重复 / 口径 / 异常值）\n【为什么重要】脏数据不会报错，它只会给你一个看起来很正常的错数\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["缺失、重复、口径、异常值四类各至少写出一条真实发现", "每处删除或修改都写了理由，不是「看着不对就删」", "异常值只标记未删除，并写清需要向谁确认", "能说出四查里哪一项最容易被漏掉，以及漏了会怎样"]}, {"id": "M4U2", "tier": "basic", "step": "demo", "title": "让 AI 清洗并推荐图表", "video": {"dur": "3.3min", "script": ["让 AI 做清洗，不要让它做判断", "体检表 + 清洗方案双输出（不许直接给结论）", "AI 把 98 万的大单当异常值删掉，导致月度客单价被低估"]}, "ppt": {"method": "体检表 + 清洗方案双输出（不许直接给结论）", "case": "AI 把 98 万的大单当异常值删掉，导致月度客单价被低估", "demo": "WorkBuddy 内跑一遍清洗，对照 AI 原稿与人改稿"}, "objective": "能让 AI 先出体检表与清洗方案，再自己定处理方式，全程不删异常值", "transfer": "拿手上那张表按同样提示词跑一遍，把它标的「口径疑点」逐条去问业务确认", "vslides": [{"t": "演示准备：清洗和判断要分开", "n": "这次的任务是处理一张订单表。我先说清一件事：清洗和判断是两件事，不该由同一个动作完成。清洗是把明显不对的东西找出来、标出来、写清影响范围；判断是决定这个数能不能用、说明了什么。让 AI 一次做完两件事，它就会用判断去覆盖清洗——最典型的表现是它看到 98 万那个单子，直接判定为异常并删掉，因为它觉得「这不正常」。而真实情况可能是一个大客户。所以提示词里我写了「不许删异常值，只标记」，这不是防它偷懒，是防它替你下判断。你要的东西是一张带着疑问的干净表，而不是一张看起来很顺的表。记住这个分工：模型负责把问题找全，你负责决定每个问题怎么处理。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">两步分开做</tspan></text><g data-k=\"体检表\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">体检表</tspan></text></g><g data-k=\"清洗方案\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">清洗方案</tspan></text></g><g data-k=\"人来判断\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">人来判断</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 63.86}, {"t": "跑一遍：为什么每步都要写「影响行数」", "n": "提示词里最容易被忽略的一条是「每一步都必须写出影响行数」。这条看着机械，实际是整个方案能不能复核的关键。「已清理重复数据」这句话没有任何信息量——你不知道删了几行，也不知道删掉的是不是该删的。写成「按单据号去重，影响 3 行」，两个星期后你还能复查。还有一条约束是「口径不一致时列出两种可能，不要替我选」。模型天然喜欢给答案，它会直接告诉你「以含取消单的口径为准」，但它根本不知道你们业务怎么算。让它列可能，你去找人要答案，这个分工才是对的。跑完你会发现体检表里「口径疑点」这一栏最满，而这恰恰是最有价值的部分——它列的每一条，都是你接下来要去问人的问题。问的时候带着具体字段去问，别问「咱们数据准不准」，要问「订单量含不含取消单」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">这次演示的输入与约束</tspan></text><g data-k=\"输入：表结构 + 前 20 行\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：表结构 + 前 20 行</tspan></text></g><g data-k=\"约束：不删异常 / 列口径可能 / 写影响行数 / 不出结论\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：不删异常 / 列口径可能 / 写影响行数 / 不出结论</tspan></text></g><g data-k=\"产出：体检表 + 清洗方案\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">产出：体检表 + 清洗方案</tspan></text></g></svg>", "d": 73.94}, {"t": "人工收口：把「要问谁」写进备注", "n": "跑完之后你要做一件事：给每一条待确认打上「问谁」。手机号空值问业务，口径差异问另一系统的负责人，98 万那单查审批记录。不写「问谁」，这份体检表就只是一张问题清单，交了也没人动。还有个动作很值得做：把清洗方案里的影响行数加起来，看占全表多少比例。如果超过 10%，说明这张表的源头就有问题，你该往上游反馈，而不是在下游反复修。最后一条：清洗完的表另存一份，永远不要在原表上改。原表是你唯一的证据，改掉了，别人质疑你的数时你连回退的余地都没有。这三件事做完，这张表才轮到你开始分析。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每条待确认写明问谁\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每条待确认写明问谁</tspan></text></g><g data-k=\"影响行数占比超 10% 要报上游\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">影响行数占比超 10% 要报上游</tspan></text></g><g data-k=\"原表另存不改\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">原表另存不改</tspan></text></g></svg>", "d": 60.05}], "deliverable": {"type": "skill", "name": "体检表与清洗方案", "rubric": ["不擅自删", "口径留疑", "影响行数"], "acceptance": "体检表四查齐全、清洗方案每步写了影响行数与理由、异常值全部只标记、没有给出任何结论"}, "demo": {"ref": "■ 一、体检表\n| 列名 | 空值数 | 是否有重复 | 口径疑点 | 异常值（例） |\n|---|---|---|---|---|\n| 单据号 | 0 | 有，3 个单号各重复 1 次 | 无 | 无 |\n| 客户手机号 | 214 | 无 | 「空」可能是无手机号，也可能是没录 | 无 |\n| 下单时间 | 12 | 无 | 12 条为 1900-01-01，疑为占位值 | 1900-01-01 |\n| 金额 | 0 | 无 | 是否含运费、是否含税未说明 | 98 万（其余 ≤200 元） |\n| 地区 | 0 | 无 | 「华东 / 华东区 / 华东大区」三种写法 | 无 |\n| 是否取消 | 0 | 无 | 与另一系统的「订单量」口径是否一致未确认 | 无 |\n\n■ 二、清洗方案\n1. 按单据号去重，保留首次出现记录 —— 影响 3 行 —— 三条记录金额相同，判定为导出重复。\n2. 手机号空值单独标一列「无手机号」，不填充、不删除 —— 影响 214 行 —— 需要业务确认是线下录入还是漏录。\n3. 下单时间 1900-01-01 置为空值并标记 —— 影响 12 行 —— 该日期是系统占位值，不是真实时间。\n4. 地区列归一为「华东」等标准写法，原值保留在新列 —— 影响约 300 行 —— 归一后分组才不会碎成三块。\n5. 金额 98 万那一单只标记，不删除 —— 影响 1 行 —— 需查该单审批记录确认是否为真实大客户。\n6. 暂不处理「订单量」口径 —— 影响待定 —— 需先拿到另一系统的取数说明。\n\n■ 说明\n· 本轮共影响约 530 行，未删除任何异常值。\n· 以上不含任何分析结论。", "fix": ["把「金额 98 万判定为异常并删除」改成「只标记」——它可能是真实大客户，删掉会让客单价整体低估。", "给每一步补上「影响多少行」：AI 原来只写「已清理重复数据」，没写删了几行，事后无法复核。", "把口径疑点单独列一栏，而不是塞进异常值里：口径不一致不是数据错，是两个表定义不同，处理方式也不同。", "删掉 AI 结尾自己加的「本月销售额环比增长约 9%」——那是结论，不在清洗范围内，而且是在脏数据上算的。"], "judge": "判断依据：异常值是否被删；每一步是否写了影响行数；口径问题是否单列；有没有越界给结论", "sheet": {"situ": "你从交易中台导出了 10 月订单表，准备先清洗再分析。表里已经有 6 个已知问题，你要先判断每个问题属于四查里的哪一类、怎么处理、直接处理会出什么事，再让模型出体检表与清洗方案。", "ask": "① 逐条判定：属于哪一查、怎么处理、直接处理的风险、需要什么证据；② 让模型出「体检表 + 清洗方案」，每一步必须带影响行数；③ 拿回后自己改，改了哪几处要写清楚。", "gen": "请基于以上判定出一份「体检表 + 清洗方案」，严格按两块输出：\n一、体检表：列名 | 空值数 | 是否有重复 | 口径疑点 | 异常值（举 2 例）\n二、清洗方案：做什么 / 影响多少行 / 为什么\n规则：① 异常值只标记不删；② 口径不一致列出两种可能，不要替我选；③ 每步必须写影响行数；④ 不要给任何分析结论。", "mats": [{"id": "E01", "src": "导出说明 · 交易中台", "text": "客户手机号列有 214 行为空，占比 1.7%。\n可能是线下录入的单据本来就没有手机号，也可能是漏录。"}, {"id": "E02", "src": "比对结果 · 自己跑出来的", "text": "同一单据号出现 3 次，金额、时间、团长编号完全相同。\n三行合计金额接近均值的三倍。"}, {"id": "E03", "src": "两份取数说明 · 冲突", "text": "A 表的「订单量」含取消单；B 表的「订单量」不含取消单。\n两边算出来的月销差 8%，都对，只是定义不同。"}, {"id": "E04", "src": "金额分布 · 自己跑出来的", "text": "单笔金额 98 万，其余 12,485 行都在 200 元以内。\n该行审批记录未查，无法判断是真实大客户还是录入错误。"}, {"id": "E05", "src": "时间列检查 · 自己跑出来的", "text": "下单时间有 12 行为 1900-01-01 00:00:00。\n这是系统的占位值，不是真实下单时间。"}, {"id": "E06", "src": "维度检查 · 自己跑出来的", "text": "地区列同时存在「华东」「华东区」「华东大区」三种写法。\n不归一，按地区分组会碎成三块，每块都不完整。"}], "cols": [{"k": "chk", "name": "属于哪一查", "hint": "缺失 / 重复 / 口径 / 异常值", "type": "chips", "w": 2, "tags": ["缺失", "重复", "口径", "异常值"]}, {"k": "act", "name": "怎么处理", "hint": "标记、去重、归一、置空、还是等确认", "type": "chips", "w": 3, "tags": ["标记，不删", "按单据号去重", "归一后保留原值", "置空并标记", "列出两种口径待确认", "按均值填充"]}, {"k": "risk", "name": "直接处理会出什么事", "hint": "选后果，不选态度", "type": "chips", "w": 2, "tags": ["销量虚高 8%", "客户数少算", "两边永远对不上", "漏掉真实大客户", "污染时间趋势", "分组碎成三块", "看不出问题"]}, {"k": "ev", "name": "需要什么证据", "hint": "挂到具体的人或系统", "type": "chips", "w": 2, "tags": ["查该单审批记录", "查重复集中在哪天", "找两份取数说明", "问业务是否线下录入", "查系统导出日志", "查地区编码表", "不用查"]}], "key": {"E01": {"chk": "缺失", "act": "标记，不删", "risk": "客户数少算", "ev": "问业务是否线下录入"}, "E02": {"chk": "重复", "act": "按单据号去重", "risk": "销量虚高 8%", "ev": "查重复集中在哪天"}, "E03": {"chk": "口径", "act": "列出两种口径待确认", "risk": "两边永远对不上", "ev": "找两份取数说明"}, "E04": {"chk": "异常值", "act": "标记，不删", "risk": "漏掉真实大客户", "ev": "查该单审批记录"}, "E05": {"chk": "缺失", "act": "置空并标记", "risk": "污染时间趋势", "ev": "查系统导出日志"}, "E06": {"chk": "口径", "act": "归一后保留原值", "risk": "分组碎成三块", "ev": "查地区编码表"}}, "notes": {"E01·risk": "空值直接删行，客户数会少算 214 单的对应客户；空值是「没有」还是「没记」，处理方式完全不同", "E03·chk": "这不是数据错，是两个系统定义不同，属于口径问题；填成「异常值」会永远修不好", "E04·act": "98 万可能是真实大客户，删除会让客单价均值整体低估，属于典型的「洗干净了但洗错了」", "E05·act": "1900-01-01 是占位值，置空并标记即可；填成「按均值填充」会把假时间造得更像真的", "E06·act": "归一后必须保留原值列，否则以后想查原始写法就没依据了"}, "delta": [{"op": "删", "frm": "模型把金额 98 万那行判定为异常并删除，理由「超出正常区间」", "to": "改为只标记，原行保留", "why": "超出区间不等于错误；删除会让客单价均值被低估，而且真实大客户会被漏掉", "kw": ["98 万", "删除", "大客户", "标记"]}, {"op": "改", "frm": "模型写「已完成重复数据清理」", "to": "改成「按单据号去重保留首次记录，影响 3 行，三行金额相同判定为导出重复」", "why": "不写影响行数与判定依据，两周后无法复核，也没人知道删得对不对", "kw": ["影响 3 行", "单据号", "判定依据"]}, {"op": "补", "frm": "模型漏了地区列三种写法的问题", "to": "补一步：「地区归一为华东等标准写法，影响约 287 行，原值保留在新列」", "why": "不归一，按地区分组会碎成三块，后面所有的地区对比都失真", "kw": ["归一", "地区", "287", "原值"]}, {"op": "删", "frm": "模型结尾自己加了「本月销售额环比增长约 9%」", "to": "整句删除", "why": "那是结论，而且是在脏数据上算的；清洗阶段出结论既越界又不准", "kw": ["结论", "越界", "脏数据", "删"]}], "refsheet": "E01｜缺失｜标记，不删｜客户数少算｜问业务是否线下录入\nE02｜重复｜按单据号去重｜销量虚高 8%｜查重复集中在哪天\nE03｜口径｜列出两种口径待确认｜两边永远对不上｜找两份取数说明\nE04｜异常值｜标记，不删｜漏掉真实大客户｜查该单审批记录\nE05｜缺失｜置空并标记｜污染时间趋势｜查系统导出日志\nE06｜口径｜归一后保留原值｜分组碎成三块｜查地区编码表\n\n四条最容易判错的：\n· E03、E06 都不是「数据错」，是定义不统一，属于口径问题——修数是修不好的，只能去对齐定义。\n· E04 明明是异常值，却不能删：异常和错误是两件事。\n· E01、E05 同属缺失，但处理不同：一个是「可能没有」，一个是「确定是占位值」。\n· 每一步都要能说出影响行数，否则这份清洗方案不可复核。", "forbid": "", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是我的数据清洗助手。我会贴一张表的结构和前 20 行。请出两份东西，不要给任何分析结论：\n一、体检表：列名 | 空值数 | 是否有重复 | 口径疑点 | 异常值（举 2 例）\n二、清洗方案：每一步写「做什么 / 影响多少行 / 为什么」\n规则：① 不许删除异常值，只标记；② 口径不一致时列出两种可能，不要替我选；③ 每一步都必须写出「影响行数」；④ 不要给结论，结论我自己下。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】体检表 + 清洗方案双输出（不许直接给结论）\n【参考案例】AI 把 98 万的大单当异常值删掉，导致月度客单价被低估\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是我的数据清洗助手。我会贴一张表的结构和前 20 行。请出两份东西，不要给任何分析结论：\n一、体检表：列名 | 空值数 | 是否有重复 | 口径疑点 | 异常值（举 2 例）\n二、清洗方案：每一步写「做什么 / 影响多少行 / 为什么」\n规则：① 不许删除异常值，只标记；② 口径不一致时列出两种可能，不要替我选；③ 每一步都必须写出「影响行数」；④ 不要给结论，结论我自己下。", "rubric": ["体检表覆盖四查，且口径疑点单列一栏，没有混在异常值里", "清洗方案每一步都写了「影响多少行」，没有只写「已清理」", "异常值一条都没删，只标记并写明向谁确认", "输出里没有任何分析结论——结论由人来下"]}, {"id": "M4U3", "tier": "basic", "step": "todo", "title": "交一份干净的数据作业", "video": {"dur": "3.5min", "script": ["能复现的清洗，才叫清洗", "体检报告五段（表概况 / 四查结果 / 清洗记录 / 待确认 / 影响评估）", "同一张表两个人算出两个数，差别全在清洗记录里"]}, "ppt": {"method": "体检报告五段（表概况 / 四查结果 / 清洗记录 / 待确认 / 影响评估）", "case": "同一张表两个人算出两个数，差别全在清洗记录里", "demo": "体检报告模板与填写示例"}, "objective": "能产出一份含四查结果与清洗记录的数据体检报告，换人照做能得到同一个数", "transfer": "把体检报告里「待确认」的三条发给对应的人，把回复补进报告的第二版", "vslides": [{"t": "第一步：先把表的底细写清楚", "n": "体检报告的第一段不是结论，是底细：多少行、多少列、每列什么意思、数据覆盖哪段时间、从哪个系统导的。这一段看着像废话，其实是别人判断你的数能不能用的唯一依据。少了时间范围，读的人不知道这份数据过期没有；少了来源系统，出了问题没人能回去核。新人常漏的是「导出时间」——同一张表周一导和周五导，行数可能不一样，因为数据在补录。还有一个细节：列含义别照抄系统的英文字段名，用业务语言写一遍，你自己写的过程中就会发现哪几列你其实没搞懂。那几列就是接下来要问人的地方。写业务含义这件事还有个隐藏好处：它会逼你发现哪两列其实在说同一件事。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"① 行数·列数·时间范围\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 行数·列数·时间范围</tspan></text></g><g data-k=\"② 每列的业务含义\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 每列的业务含义</tspan></text></g><g data-k=\"③ 来源系统与导出时间\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 来源系统与导出时间</tspan></text></g></svg>", "d": 66.1}, {"t": "第二步：四查结果要写数字，不写「检查过」", "n": "四查结果最常见的问题是写「已检查，无异常」。这句话等于没写，因为它既不能复核也不能追踪。正确写法是给数字：手机号空 214 行占 1.7%、3 个单据号重复、口径疑点 3 条、异常值 2 条。有数字，别人才知道严重程度；有占比，才知道要不要管。写口径疑点的时候要具体到「哪个字段、跟哪个系统、差在哪」，不要写「口径可能有问题」——那种写法没人能帮你。异常值这里要注意：写清「几条、分别是什么」，但不要写「已删除」。异常值是标记，不是清理对象。这一段的读者通常是带你的人，他看这一段就是在判断：这个人有没有真的把表翻过一遍。所以这一段不要修饰，就按四查顺序一条一条写数字。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每项都给数字与占比\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项都给数字与占比</tspan></text></g><g data-k=\"口径疑点写到字段级\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">口径疑点写到字段级</tspan></text></g><g data-k=\"异常值只标记不删\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">异常值只标记不删</tspan></text></g></svg>", "d": 68.11}, {"t": "第三、四步：清洗记录要能被照做，待确认要挂到人", "n": "清洗记录的标准是「别人照做能得到同一个数」。所以每步必须写三样：做什么、影响多少行、为什么。「已清理重复数据」不合格，「按单据号去重保留首次记录，影响 3 行，因为三行金额完全相同」才合格。待确认清单最容易崩在「挂人」这一步：写「待业务确认」等于把球踢到空中，谁都不会接。要写具体的人和具体的时间：手机号空值问区域运营张姐，11/09 前。最后算一个影响占比：被处理的行数占全表多少。低于 10%，说明是正常脏数据；高于 10%，说明源头就坏了，你该往上游反馈，而不是每次都在下游修一遍。这个占比是你从「会做表」到「懂数据」的分界线。迈过这条线，你写的报告才会被当成材料，而不是作业。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三段收口</tspan></text><g data-k=\"做什么 / 影响多少行 / 为什么\"><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">做什么 / 影响多少行 / 为什么</tspan></text></g><g data-k=\"待确认：谁 + 什么时候\"><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">待确认：谁 + 什么时候</tspan></text></g><g data-k=\"影响占比 &gt;10% 报上游\"><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">影响占比 &gt;10% 报上游</tspan></text></g></svg>", "d": 76.25}], "deliverable": {"type": "skill", "name": "数据体检报告", "rubric": ["四查有据", "步骤可复现", "待确认到人"], "acceptance": "一份报告：四查各有结果、清洗步骤都带影响行数、待确认都挂到人、有影响占比"}, "practice": {"steps": ["写表概况：多少行多少列、每列含义、数据时间范围、取自哪个系统", "按四查逐项写结果：缺失多少、重复多少、口径疑点几条、异常值几条", "写清洗记录：每一步做什么、影响多少行、为什么这么做", "写待确认清单：每条挂一个具体的人，不写「待业务确认」", "算影响占比：被处理的行数占全表多少，超过 10% 要往上游反馈"], "exemplar": "【订单表数据体检报告】\n体检人：小林　日期：2026-11-07　表名：order_202610（10 月全量订单）\n\n■ 一、表概况\n行数：12,486 行　列数：9 列　时间范围：2026-10-01 ~ 2026-10-31\n来源系统：交易中台导出（导出时间 11/06 09:20）\n列含义：单据号 / 客户手机号 / 下单时间 / 金额 / 地区 / 商品类目 / 是否取消 / 履约时长 / 团长编号\n\n■ 二、四查结果\n1. 缺失：客户手机号空 214 行（1.7%）；履约时长空 46 行（0.4%）。\n2. 重复：3 个单据号各出现 2 次，合计重复 3 行（0.02%），金额完全相同。\n3. 口径疑点：3 条\n　　· 金额是否含运费、是否含税，导出说明未写。\n　　· 是否取消列与另一系统「订单量」口径是否一致，未确认。\n　　· 履约时长起算点是下单还是出库，未说明。\n4. 异常值：2 条\n　　· 金额 980,000 元 1 行（其余 ≤200 元）。\n　　· 下单时间 1900-01-01 共 12 行，疑为系统占位值。\n\n■ 三、清洗记录\n| 步骤 | 做什么 | 影响行数 | 为什么 |\n|---|---|---|---|\n| 1 | 按单据号去重，保留首次记录 | 3 | 三行金额完全相同，判定为导出重复 |\n| 2 | 下单时间 1900-01-01 置空并标记 | 12 | 系统占位值，不是真实时间 |\n| 3 | 手机号空值新增「无手机号」标记列 | 214 | 不填充不删除，等业务确认为线下录入还是漏录 |\n| 4 | 地区列归一（华东/华东区/华东大区 → 华东） | 287 | 不归一分组会碎成三块 |\n| 5 | 金额 98 万那单只标记 | 1 | 需查审批记录，可能是真实大客户 |\n\n合计影响：517 行，占全表 4.1%（低于 10%，暂不反馈上游）\n\n■ 四、待确认（每条挂人）\n1. 手机号空值的 214 行是否为线下录入 —— 问：区域运营 张姐 —— 11/09 前\n2. 「订单量」口径是否含取消单 —— 问：数据组 王工 —— 11/09 前\n3. 金额 98 万那单是否为真实大客户 —— 查：交易中台审批记录 —— 我自己查，11/08\n4. 履约时长起算点 —— 问：履约组 李工 —— 11/10 前\n\n■ 五、影响评估\n· 去重后总量较导出原值减少 3 行，约 0.02%，对本月的趋势判断无实质影响。\n· 但若不做第 1 步，月销会被抬高约 8%（三行金额接近均值的三倍），这是本次最大风险点。\n· 口径问题未确认前，本表数字只用于内部参考，不对外引用。"}, "task": "产出《数据体检报告》：写表概况：多少行多少列、每列含义、数据时间范围、取自哪个系统；按四查逐项写结果：缺失多少、重复多少、口径疑点几条、异常值几条；写清洗记录：每一步做什么、影响多少行、为什么这么做；写待确认清单：每条挂一个具体的人，不写「待业务确认」；算影响占比：被处理的行数占全表多少，超过 10% 要往上游反馈", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M4 用 AI 处理数据与表格」模块，你要交付的是《数据体检报告》。\n【场景】业务侧这周的诉求是：能复现的清洗，才叫清洗。参考做法：同一张表两个人算出两个数，差别全在清洗记录里。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（体检报告五段（表概况 / 四查结果 / 清洗记录 / 待确认 / 影响评估）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《数据体检报告》填写模板】\n\n■ 1. 写表概况：多少行多少列、每列含义、数据时间范围、取自哪个系统\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 按四查逐项写结果：缺失多少、重复多少、口径疑点几条、异常值几条\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 写清洗记录：每一步做什么、影响多少行、为什么这么做\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 写待确认清单：每条挂一个具体的人，不写「待业务确认」\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 5. 算影响占比：被处理的行数占全表多少，超过 10% 要往上游反馈\n   ‣ 提示：写清分子/分母与统计口径，必须出现具体数值。\n   ‣ 我的填写：____________________________________________\n\n■ 6. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   【订单表数据体检报告】\n体检人：小林　日期：2026-11-07　表名：order_202610（10 月全量订单）\n\n■ 一、表概况\n行数：12,486 行　列数：9 列　时间范围：2026-10-01 ~ 2026-10-31\n来源系统：交易中台导出（导出时间 11/06 09:20）\n列含义：单据号 / 客户手机号 / 下单时间 / 金额 / 地区 / 商品类目 / 是否取消 / 履约时长 / 团长编号\n\n■ 二、四查结果\n1. 缺失：客户手机号空 214 行（1.7%）；履约时长空 46 行（0.4%）。\n2. 重复：3 个单据号各出现 2 次，合计重复 3 行（0.02%），金额完全相同。\n3. 口径疑点：3 条\n　　· 金额是否含运费、是否含税，导出说明未写。\n　　· 是否取消列与另一系统「订单量」口径是否一致，未确认。\n　　· 履约时长起算点是下单还是出库，未说明。\n4. 异常值：2 条\n　　· 金额 980,000 元 1 行（其余 ≤200 元）。\n　　· 下单时间 1900-01-01 共 12 行，疑为系统占位值。\n\n■ 三、清洗记录\n| 步骤 | 做什么 | 影响行数 | 为什么 |\n|---|---|---|---|\n| 1 | 按单据号去重，保留首次记录 | 3 | 三行金额完全相同，判定为导出重复 |\n| 2 | 下单时间 1900-01-01 置空并标记 | 12 | 系统占位值，不是真实时间 |\n| 3 | 手机号空值新增「无手机号」标记列 | 214 | 不填充不删除，等业务确认为线下录入还是漏录 |\n| 4 | 地区列归一（华东/华东区/华东大区 → 华东） | 287 | 不归一分组会碎成三块 |\n| 5 | 金额 98 万那单只标记 | 1 | 需查审批记录，可能是真实大客户 |\n\n合计影响：517 行，占全表 4.1%（低于 10%，暂不反馈上游）\n\n■ 四、待确认（每条挂人）\n1. 手机号空值的 214 行是否为线下录入 —— 问：区域运营 张姐 —— 11/09 前\n2. 「订单量」口径是否含取消单 —— 问：数据组 王工 —— 11/09 前\n3. 金额 98 万那单是否为真实大客户 —— 查：交易中台审批记录 —— 我自己查，11/08\n4. 履约时长起算点 —— 问：履约组 李工 —— 11/10 前\n\n■ 五、影响评估\n· 去重后总量较导出原值减少 3 行，约 0.02%，对本月的趋势判断无实质影响。\n· 但若不做第 1 步，月销会被抬高约 8%（三行金额接近均值的三倍），这是本次最大风险点。\n· 口径问题未确认前，本表数字只用于内部参考，不对外引用。", "rubric": ["表概况写清了行数、列含义、时间范围与来源系统", "四查每一项都有数字结果，不是「检查过，无问题」", "清洗记录每步带影响行数，别人照做能得到同一个数", "待确认清单每条都挂了具体的人，不是「待业务确认」"]}, {"id": "M4U4", "tier": "basic", "step": "spar", "title": "同事复核你的数据", "video": {"dur": "3.5min", "script": ["复核不是不信你，是这份数要往外走", "三个必答（删了哪几行 / 影响多少 / 凭什么这么判）", "「你为什么删这 17 行」与「去重影响 17 行，按主键判定」的差别"]}, "ppt": {"method": "三个必答（删了哪几行 / 影响多少 / 凭什么这么判）", "case": "「你为什么删这 17 行」与「去重影响 17 行，按主键判定」的差别", "demo": "陪练说明：他会挑你报告里最含糊的一步追问"}, "objective": "能在同事复核时逐项解释清洗动作，承认未确认的口径，并说清删改的影响范围", "transfer": "把这次被问住的清洗步骤补进报告，并把「影响行数」写在每一步后面", "vslides": [{"t": "陪练说明：他只看依据和影响范围", "n": "这一关的对手是数据复核同事。他不是在挑你的错，是在确认这份数能不能往外走。所以他的问题只有两个方向：你凭什么这么动，以及动了之后影响多大。准备方法很直接：把清洗记录每一步读一遍，问自己「凭什么」和「影响多少行」，答不上来的那一步就是会被追着问的。很多人这一关卡在「凭什么」上，回答「看着像重复」，这句话在他那里等于「我没有依据」。正确答法是把条件摆出来：单据号相同、金额相同、时间相同，三个都相同我判为重复。有条件的判断可以被检验，凭感觉的判断只能被推翻。还有一点：复核时不要在语气上防守。他说「你这个不对」，你答「可能是我漏了，我看一下」比答「不会吧」有用得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">复核三问</tspan></text><g data-k=\"凭什么这么动\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">凭什么这么动</tspan></text></g><g data-k=\"影响多少行\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">影响多少行</tspan></text></g><g data-k=\"结论有没有变\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">结论有没有变</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 66.96}, {"t": "第一问：凭什么判定它是重复 / 异常", "n": "判定重复要给出可检验的条件，通常是主键相同加关键字段一致。判定异常要给出阈值和理由，比如「其余 12,485 行金额都在 200 元以内，这一行 98 万，超出均值三个数量级」。注意这两件事的处理方式不一样：重复可以删，异常只能标记。因为重复是同一件事被记了两次，异常可能是真实发生的极端情况。这一问还有个变体：「你删的这 17 行有没有可能不是重复」，正确答法是「有可能，所以我留了原表和清洗记录，随时可以回退」。承认可回退，比坚称自己没错更让人放心。这一问还有第三个变体：「你留原表了吗」，如果你说没有，前面答得再好都会被打折。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"重复：主键 + 关键字段全同\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">重复：主键 + 关键字段全同</tspan></text></g><g data-k=\"异常：阈值 + 数量级对比\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">异常：阈值 + 数量级对比</tspan></text></g><g data-k=\"都留原表可回退\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">都留原表可回退</tspan></text></g></svg>", "d": 65.98}, {"t": "第三、四问：口径确认了没有，异常值怎么处理", "n": "口径这一问最忌讳含糊。没确认就直说没确认，并说清问了谁、什么时候能有答案。把未确认说成已核对，是复核场景里最严重的失分，因为一旦被发现，你前面所有数字都会被重新怀疑。第四问是异常值的处置：98 万那单你打算怎么办。答法要具体到动作——查交易中台的审批记录，如果是真实大客户就保留并在备注里说明，如果是录入错误就改并说明改了什么。给动作，不要给态度。最后补一句影响判断：「这单只占一行，删或留对总量影响 0.008%，但会影响客单价均值，所以我倾向先查清楚。」有量化，才叫专业。最后记住：复核不是过关，是让你的数获得被引用的资格。他挑出三处，你改完，这份数才真的能上台。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">会被信任</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">一崩全崩</tspan></text><g data-k=\"没确认就说没确认\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">没确认就说没确认</tspan></text></g><g data-k=\"含糊说「应该对过了」\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">含糊说「应该对过了」</tspan></text></g></svg>", "d": 75.7}], "deliverable": {"type": "skill", "name": "数据体检报告", "rubric": ["依据具体", "影响算过", "不藏未确认"], "acceptance": "四问都答得出：判定依据（主键/金额一致）、影响行数与占比、口径确认状态、异常值的处置计划"}, "spar": {"role": "数据复核同事", "persona": "只看两样东西：你删改的每一步有没有依据，影响范围有没有算过；含糊就往下追", "mustAsk": ["你删了这 17 行，凭什么判定它们是重复的？", "删掉之后总量变了多少？占比多少？", "口径这块你确认过了吗，跟哪个系统对的？", "异常值你没删，那 98 万那单你打算怎么处理？"]}, "exemplar": "（同事问：你这个总量跟我算的差了 3 单，差了在哪）\n\n结论：差在去重，我删了 3 行重复单据，你的表里应该还在。\n依据：3 个单据号各出现两次，金额、时间、团长编号完全相同，我判定为导出重复，按单据号保留首次记录。影响的 3 行金额合计约 2,100 元，对总量影响 0.02%，但会让月销虚高约 8%——因为这三行金额接近均值三倍。\n边界：口径这块我还没确认，「订单量」在另一系统是否含取消单，我问了数据组王工，还没回。在这个确认之前，这个数只能内部参考，不建议对外。", "task": "把《数据体检报告》拿到「数据复核同事」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《数据体检报告》。现在要让它通过「数据复核同事」这一关。\n【对手的立场】只看两样东西：你删改的每一步有没有依据，影响范围有没有算过；含糊就往下追。\n【他一定会追问】「你删了这 17 行，凭什么判定它们是重复的？」 / 「删掉之后总量变了多少？占比多少？」 / 「口径这块你确认过了吗，跟哪个系统对的？」\n【场景】你说「同事复核你的数据」，对方立刻回一句：你删了这 17 行，凭什么判定它们是重复的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["能说出判定重复的具体依据（单据号 + 金额时间一致），不是「看着像」", "能给出影响行数与占比，并说明对结论有没有实质影响", "主动说明哪些口径尚未确认，不把它说成已核对", "对未处理的异常值有明确计划（查谁、什么时候查）"]}, {"id": "M4U5", "tier": "adv", "step": "understand", "title": "让 AI 给洞察，而不是只给数字", "video": {"dur": "3.4min", "script": ["数字回答发生了什么，洞察回答该怎么办", "洞察三问（幅度 / 归因 / 动作）", "「订单涨了 9%」与「涨的七成来自华东三城，因为竞品缺货」的差别"]}, "ppt": {"method": "洞察三问（幅度 / 归因 / 动作）", "case": "「订单涨了 9%」与「涨的七成来自华东三城，因为竞品缺货」的差别", "demo": "洞察三问卡：拿 4 条「发现」各判一次"}, "objective": "能用「变化多大 / 为什么变 / 所以做什么」三问，把一堆数字变成一条能落地的洞察", "transfer": "拿本月最常被汇报的三个数字，各按三问写一遍，写不出第三问的标为「待归因」", "vslides": [{"t": "三问：幅度、归因、动作", "n": "「本月订单 12.4 万单，环比增长 9%」这句话是数字，不是洞察。洞察要回答三个问题。第一，变化多大——要有基准，环比 9% 是高还是低，得跟目标比、跟行业比、跟去年同期比，孤立的一个 9% 说明不了任何事。第二，为什么变——这一问最难，也最有价值。没有归因的增长，你不知道下个月该不该继续做同样的事。第三，所以做什么——落到动作上：谁、什么时候、做什么。三问里缺任何一问，这句话就只能当背景，不能当建议。新人最常见的产出是只有第一问：一堆带着百分比的数字。这类材料在会上会被连问三句「所以呢」，然后就没有然后了。所以写任何一句带数字的话之前，先自问一句：另外两问在哪里。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">洞察三问</tspan></text><g data-k=\"变化多大\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">变化多大</tspan></text></g><g data-k=\"为什么变\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">为什么变</tspan></text></g><g data-k=\"所以做什么\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">所以做什么</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 72.77}, {"t": "归因这一步，最容易变成猜", "n": "归因最难的是一句话：你怎么知道是这个原因。多数人的做法是找一个听起来合理的解释，比如「因为我们在华东投了广告」。这句话可能是对的，但它没有证据，只是时间上碰巧。可检验的归因至少要满足一条：有对照（投了广告的城市比没投的涨得多）、有时间切口（投放开始那周起变化）、或者有排除（其他因素这段时间没变）。三条都拿不出来，就该老实写「原因待查」，而不是编一个理由让材料显得完整。写「待查」不丢人，编理由被戳穿才丢人。还有个技巧：把可能的原因列成两三条，各写一句「如果是它，应该还能观察到什么」，这就是下一步要去核的东西。这个方法还有个好处：它把「我觉得」变成了「可以验」，讨论就能往前推。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g data-k=\"有对照：投 vs 没投\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">有对照：投 vs 没投</tspan></text></g><g data-k=\"有时间切口：从哪周起变\"><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">有时间切口：从哪周起变</tspan></text></g><g data-k=\"有排除：其他因素没变\"><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">有排除：其他因素没变</tspan></text></g></svg>", "d": 65.35}, {"t": "动作要写到能执行", "n": "第三问最容易空。写「建议加大投入」不算动作，因为它没说谁做、做多少、什么时候。合格的动作长这样：「建议 11 月在华东三城把投放预算从 5 万提到 8 万，由市场组执行，12 月初看三城的增量是否达到 15%」。有主体、有数量、有时间、有验收标准，四样齐了才算动作。还有一个常被忽略的点：动作要跟归因对得上。如果归因是「竞品缺货带来短期机会」，那动作应该是「在缺货窗口内加快补货」，而不是「长期加大品牌投放」——后者跟归因没关系。很多材料被否，不是因为数字错，是因为建议和原因对不上，读的人一眼就看出你没想清楚。对得上这三个字，是建议能不能被批的分界线。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"有主体\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有主体</tspan></text></g><g data-k=\"有数量\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有数量</tspan></text></g><g data-k=\"有时间与验收\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">有时间与验收</tspan></text></g><g data-k=\"与归因对得上\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">与归因对得上</tspan></text></g></svg>", "d": 67.13}], "deliverable": {"type": "skill", "name": "洞察卡（三问齐全）", "rubric": ["幅度有基准", "归因有证据", "动作能执行"], "acceptance": "能对 4 条发现各判一次是否算洞察，并给非洞察的条目补上缺失的那一问"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】洞察三问（幅度 / 归因 / 动作）\n【为什么重要】数字回答发生了什么，洞察回答该怎么办\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["每条洞察都
