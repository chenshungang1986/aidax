<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 配音走 CDN：提前建连，省掉首段 100–300ms 的 DNS/TLS 时间 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<title>金融 × 产品经理 AI 实战 · 深版课程（M0/M1/M2/M3 · 32 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex:none}
  header h1{font-size:17px;font-weight:700;white-space:nowrap}
  header h1 span{display:none}   /* 课程副标题（样板间/单元数/行业机构产品）默认不显示：学员只需要课程名 */
  /* 顶栏只留三样：课程名、一条进度条、一个设置入口 */
  .hp{flex:1;height:5px;background:#e8eefb;border-radius:99px;overflow:hidden;max-width:560px;min-width:70px}
  .hp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1a5cff,#4f8bff);border-radius:99px;transition:width .35s}
  .gear{margin-left:auto;width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;font-size:15px;line-height:1}
  .gear:hover{border-color:var(--blue);color:var(--blue)}
  .cfg-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .cfg-row label{color:var(--mut);width:40px;flex:none}
  .cfg-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .cfg-sep{border:none;border-top:1px solid var(--line);margin:13px 0}
  .cfg-label{display:flex;align-items:center;gap:8px;text-align:left;font-size:12px;font-weight:700;color:var(--blue-d);margin:14px 0 5px;letter-spacing:.02em}
  .cfg-hint{text-align:left;font-size:11.8px;color:var(--mut);line-height:1.65;margin:3px 0 2px}
  .cfg-row label{width:auto;min-width:66px}
  .cfg-note{font-size:11.5px;color:#8a6d1f;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 9px;line-height:1.6;margin:6px 0}
  .ident-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#eef4ff;border:1px solid #c7d9ff;color:var(--blue-d);border-radius:999px;padding:3px 10px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;flex:1;min-height:0}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  /* 模块头改为两层：标题独占一行（两行截断），进度/短板/测验标签下移一行，
     避免标签把标题挤成「M1 写出第一句好…」这种半句话。 */
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;background:#fbfcff}
  .mod-h .mh-top{display:flex;gap:7px;align-items:flex-start}
  .mod-h .mh-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
  .mod-h .mid{flex-shrink:0}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  /* 模块标题：原来代码里写死 slice(0,12) 会把标题砍成半句（如「M1 写出第一句好用的提」），
     改为最多两行、超出加省略号，标题完整可读且不撑破左栏。 */
  .mod-h .mtitle{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;word-break:break-word}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  /* 单元标题原来写死 slice(0,11)，长标题被切成半句；改为单行省略，完整语义优先 */
  .unit .ut{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vwrap{position:relative}
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  /* 底部留出字幕条的高度：字幕是「占位」而不是「盖住」PPT 最后一行 */
  .vp .stage{position:absolute;inset:0;overflow:hidden;background:#eef2f7;pointer-events:none;--k:1}
  /* ===== v161 吉利式 PPT 版式：1600×900 画布，所有尺寸乘 --k 等比缩放 ===== */
  .slide{position:absolute;inset:0;display:none;flex-direction:column;text-align:left;color:#1a2430;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .slide.on{display:flex}
  /* ---- 内页：白底 + 顶栏色条 + 左上定位 + 大标题 + 画面 + 右下署名 ---- */
  .slide.sl{background:#fff;padding:calc(52px*var(--k)) calc(74px*var(--k)) calc(92px*var(--k))}
  .slide.sl:before{content:'';position:absolute;left:0;top:0;right:0;height:calc(6px*var(--k));
    background:linear-gradient(90deg,#0a3d91,#3b7bff 62%,rgba(59,123,255,0))}
  .sl-kick{flex:none;font-size:calc(19px*var(--k));letter-spacing:.14em;color:#4c6d99;font-weight:600}
  .sl-h{flex:none;margin:calc(14px*var(--k)) 0 0;font-size:calc(42px*var(--k));line-height:1.3;
    font-weight:800;color:#0a3d91;letter-spacing:.01em;max-width:calc(1420px*var(--k))}
  .sl-h b{position:relative;z-index:0;font-weight:800}
  .sl-h b:after{content:'';position:absolute;left:-3px;right:-3px;bottom:calc(4px*var(--k));
    height:calc(12px*var(--k));background:rgba(120,175,235,.40);z-index:-1}
  .sl-band{flex:none;margin-top:calc(18px*var(--k));background:#eef4fb;
    border-left:calc(5px*var(--k)) solid #0a3d91;padding:calc(13px*var(--k)) calc(20px*var(--k));
    font-size:calc(25px*var(--k));font-weight:600;color:#12406f;line-height:1.5;
    border-radius:0 calc(8px*var(--k)) calc(8px*var(--k)) 0;max-width:calc(1452px*var(--k))}
  .sl-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    margin-top:calc(10px*var(--k))}
  .sl-body svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  .sl-tag{position:absolute;right:calc(74px*var(--k));bottom:calc(100px*var(--k));background:#0a3d91;color:#fff;
    font-size:calc(15px*var(--k));letter-spacing:.04em;padding:calc(5px*var(--k)) calc(13px*var(--k));
    border-radius:calc(3px*var(--k))}
  /* ---- 封面 / 结束页：深蓝渐变 + 右下圆环 ---- */
  .slide.cv{background:linear-gradient(122deg,#07182b 0%,#0d2c4e 46%,#1a4b84 100%);color:#fff;overflow:hidden;
    justify-content:flex-start;padding:calc(104px*var(--k)) calc(100px*var(--k)) calc(96px*var(--k))}
  .slide.cv:after{content:'';position:absolute;right:calc(-190px*var(--k));top:calc(150px*var(--k));
    width:calc(780px*var(--k));height:calc(780px*var(--k));border:1px solid rgba(255,255,255,.10);
    border-radius:50%;pointer-events:none}
  .cv-main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;width:100%}
  .cv-kick{flex:none;display:flex;align-items:center;font-size:calc(21px*var(--k));font-weight:600;
    letter-spacing:.06em;color:#9dc4ee}
  .cv-kick i{display:block;width:calc(34px*var(--k));height:calc(2px*var(--k));
    background:rgba(157,196,238,.55);margin:0 calc(16px*var(--k))}
  .cv-h{flex:none;margin:calc(26px*var(--k)) 0 0;font-weight:800;line-height:1.26;letter-spacing:.01em;
    color:#fff;max-width:calc(1300px*var(--k))}
  .cv-h b{font-weight:800;color:#8ec5ff}
  .cv-sub{flex:none;margin:calc(26px*var(--k)) 0 0;font-size:calc(25px*var(--k));
    color:rgba(255,255,255,.74);font-weight:500;line-height:1.6;max-width:calc(1180px*var(--k))}
  .cv-pts{flex:none;margin-top:calc(46px*var(--k));display:grid;grid-template-columns:repeat(3,1fr);
    gap:calc(18px*var(--k));width:100%;max-width:calc(1400px*var(--k))}
  .cv-pt{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
    border-radius:calc(10px*var(--k));padding:calc(20px*var(--k)) calc(22px*var(--k));
    display:flex;gap:calc(14px*var(--k));align-items:flex-start}
  .cv-pt b{font-size:calc(20px*var(--k));font-weight:800;color:#7db8f2;line-height:1.5;flex:0 0 auto}
  .cv-pt span{font-size:calc(21px*var(--k));font-weight:600;color:rgba(255,255,255,.92);line-height:1.5}
  /* 封面左下署名块：补住下半部留白，与吉利封面同位置同信息量 */
  .cv-note{position:absolute;left:calc(100px*var(--k));bottom:calc(150px*var(--k));z-index:1;
    font-size:calc(17px*var(--k));line-height:1.75;color:rgba(255,255,255,.55);letter-spacing:.04em}
  .cv-note i{display:block;font-style:normal;color:rgba(255,255,255,.8);font-weight:600;
    letter-spacing:.12em;margin-bottom:calc(8px*var(--k))}
  .cv-note div{display:flex;gap:calc(16px*var(--k))}
  .cv-note b{font-weight:600;color:rgba(255,255,255,.42);min-width:calc(74px*var(--k))}
  .cv-note span{color:rgba(255,255,255,.7)}
  .cv-foot{position:absolute;left:calc(100px*var(--k));right:calc(100px*var(--k));bottom:calc(70px*var(--k));
    z-index:2;display:flex;align-items:center;justify-content:space-between;
    padding-top:calc(18px*var(--k));border-top:1px solid rgba(255,255,255,.14)}
  .cv-credit{font-size:calc(17px*var(--k));color:rgba(255,255,255,.68);letter-spacing:.06em}
  .cv-no{margin-left:auto;font-size:calc(32px*var(--k));font-weight:800;color:rgba(255,255,255,.9);letter-spacing:.04em}
  .cv-no em{font-size:calc(17px*var(--k));font-style:normal;font-weight:600;
    color:rgba(255,255,255,.45);margin-left:calc(7px*var(--k))}
  /* ---- 结束页 ---- */
  .ce-mark{flex:none;display:flex;align-items:center;font-size:calc(21px*var(--k));
    font-weight:700;letter-spacing:.14em;color:#8ec5ff}
  .ce-mark:before{content:'';width:calc(46px*var(--k));height:calc(2px*var(--k));
    background:#8ec5ff;margin-right:calc(16px*var(--k))}
  .cv-end .cv-h{margin-top:calc(18px*var(--k))}
  .ce-pts{flex:none;margin-top:calc(28px*var(--k));width:calc(940px*var(--k))}
  .ce-lab{font-size:calc(18px*var(--k));font-weight:600;color:rgba(255,255,255,.45);
    letter-spacing:.14em;margin-bottom:calc(10px*var(--k))}
  .ce-pt{display:flex;gap:calc(16px*var(--k));align-items:flex-start;padding:calc(12px*var(--k)) 0;
    border-bottom:1px solid rgba(255,255,255,.09)}
  .ce-pt b{font-size:calc(19px*var(--k));font-weight:800;color:#7db8f2;flex:0 0 auto;line-height:1.6}
  .ce-pt span{font-size:calc(24px*var(--k));font-weight:600;color:rgba(255,255,255,.94);line-height:1.5}
  .ce-nx{flex:none;margin-top:calc(26px*var(--k));display:inline-flex;align-items:center;
    gap:calc(14px*var(--k));max-width:calc(1240px*var(--k))}
  .ce-nx i{font-style:normal;background:rgba(142,197,255,.18);color:#8ec5ff;font-size:calc(17px*var(--k));
    font-weight:700;padding:calc(6px*var(--k)) calc(14px*var(--k));border-radius:calc(4px*var(--k));flex:0 0 auto}
  .ce-nx-t{min-width:0}
  .ce-nx-t b{display:block;font-size:calc(22px*var(--k));color:rgba(255,255,255,.9);font-weight:600;line-height:1.45}
  .ce-wm{position:absolute;right:calc(64px*var(--k));bottom:calc(150px*var(--k));z-index:0;
    font-size:calc(300px*var(--k));font-weight:800;line-height:1;letter-spacing:-.05em;
    color:rgba(255,255,255,.055);pointer-events:none}
  /* ---- 段圆点：加深色胶囊底，深色封面和白底内页上都看得见 ---- */
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  /* 高亮跟讲解走：未讲到的条目压暗，讲到的那一项亮起（.k-on 由播放器逐项切换） */
  .slide.spot [data-k]{opacity:.25;transition:opacity .25s ease}
  .slide.spot [data-k].k-on{opacity:1;filter:drop-shadow(0 0 7px rgba(150,190,255,.9)) brightness(1.06)}
  /* 字幕：永远只有一行，超出省略；不吃掉画面（stage 已为它留了 60px） */
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 70%,rgba(0,0,0,0) 100%);color:#fff;font-size:17px;font-weight:600;line-height:1.35;padding:12px 20px 10px;min-height:0;display:block;text-align:center;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes capin{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
  .cap.swap{animation:capin .16s ease-out}
  @media (max-width:620px){
    .vp .stage{padding:0}
    .cap{font-size:13.5px;padding:8px 10px 6px;letter-spacing:0}
    .vbar{gap:7px}.play{padding:7px 12px;font-size:12.5px}.time{font-size:11.5px}
    /* 答案行在窄屏上改成自然折行：flex 会把「→ 标准答案」整体挤到下一行，读起来断得莫名其妙 */
    .anshd{display:block}
    .anshit{margin-left:0;display:block;margin-top:3px}
    .opb{margin-right:5px}
  }
  /* 窄屏：1600 画布缩到手机上字会糊，这里把字号放大、次要元素让位 */
  @media (max-width:620px){
    .cv-pts,.cv-note,.sl-tag{display:none}
    .cv-kick,.sl-kick{font-size:calc(30px*var(--k))}
    .cv-sub{font-size:calc(34px*var(--k))}
    .cv-h{font-size:calc(104px*var(--k))!important}
    .sl-h{font-size:calc(52px*var(--k))}
    .sl-band{font-size:calc(34px*var(--k));padding:calc(16px*var(--k)) calc(24px*var(--k))}
    .ce-pts{width:100%}
    .ce-pt span{font-size:calc(34px*var(--k))}
    .ce-nx-t b{font-size:calc(32px*var(--k))}
    .ce-wm{font-size:calc(420px*var(--k))}
    .cv-foot{bottom:calc(58px*var(--k))}
    .cv-credit,.cv-no em{font-size:calc(24px*var(--k))}
    .cv-no{font-size:calc(42px*var(--k))}
  }
  .dots{position:absolute;top:calc(11px*var(--k));left:calc(14px*var(--k));display:flex;gap:calc(5px*var(--k));justify-content:flex-start;z-index:5;padding:calc(5px*var(--k)) calc(9px*var(--k));background:rgba(8,16,40,.42);border-radius:99px}
  /* 缓冲反馈：点播放后立刻给「在加载」的确定感，别让人以为按钮坏了。
     配音约 200–350KB，慢网下要 2–18 秒才能出第一声。 */
  .pbuf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:9px;
        background:rgba(8,16,40,.82);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;
        backdrop-filter:blur(6px);z-index:5;pointer-events:none;white-space:nowrap}
  .pbuf.on{display:flex}
  .pbuf i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.28);border-top-color:#fff;
          animation:pbspin .8s linear infinite;flex:none}
  @keyframes pbspin{to{transform:rotate(360deg)}}
  @media (max-width:620px){.pbuf{font-size:12px;padding:8px 13px;gap:7px}}
  .dots i{width:calc(7px*var(--k));height:calc(7px*var(--k));border-radius:50%;background:rgba(255,255,255,.38)}
  .dots i.on{background:#fff}
  .vbar{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}

  .spar-ft{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:#fbfcfe}

  .cp{max-width:680px;margin:0 auto}

  .xp-tag{display:inline-flex;align-items:center;gap:4px;background:#fff7e6;color:#b45309;border:1px solid #fde2a8;border-radius:999px;padding:2px 10px;font-weight:700}
  /* 窄屏兜底必须放在样式表最末：组件规则写在后面会把前面 @media 里的同名属性盖掉 */

  }

<script>
/* ===================== 课程数据（构建时注入） ===================== */
const COURSE = {"id": "fin_pm", "role": "pm", "customization": {"industry": "消费金融", "company": "模拟银行 X", "product": "闪电贷"}, "modules": [{"id": "M0", "title": "M0 导论：金融 PM 的 AI 机会与红线", "dims": ["strategy", "security"], "units": [{"id": "M0U1", "tier": "basic", "step": "understand", "title": "金融 PM 的 6 类 AI 机会与 3 条红线", "video": {"dur": "5.1min", "script": ["金融 PM 同时背放款规模、通过率与不良率三本账，AI 最容易见效，也最容易踩到监管线", "六类机会矩阵 + 红线三原则清单（每张机会卡标「AI 能帮 / 人要把关」）", "某消费金融公司用 AI 把监管简报从 3 天压到半天，评审会当场通过"]}, "ppt": {"method": "六类机会矩阵 + 红线三原则清单（每张机会卡标「AI 能帮 / 人要把关」）", "case": "某消费金融公司用 AI 把监管简报从 3 天压到半天，评审会当场通过", "demo": "红线对照卡：把「贴客户征信原文进公开 AI」标为高危"}, "objective": "能画出自己岗位的 AI 机会—红线对照表，并挑出 3 项本周就能动手的切入点", "transfer": "回工位 48 小时内，从最占时间的一件事里选一个切入点，写清「AI 出初稿、我把关什么」，发给主管", "vslides": [{"t": "本节要讲什么", "n": "这一节先解决一个判断问题：你手里这堆活，哪些该交给 AI，哪些一交就出事。很多金融产品经理用了半年 AI，还是停留在让模型写周报，因为他没分清「苦活」和「担责的活」。这一节讲三件事：为什么落点在你这个岗位、六类机会分别对应哪些日常痛点、以及三条越线就不能上线的红线。看完你要能当场指着自己这周的工作，勾出三个可以试的点。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"落点为何是 PM\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">落点为何是 PM</tspan></text></g><g data-k=\"六类机会对应痛点\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">六类机会对应痛点</tspan></text></g><g data-k=\"三条红线\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三条红线</tspan></text></g></svg>", "d": 37.03}, {"t": "开场：金融 PM 为什么是落点", "n": "在消费金融里，同时背放款规模、通过率和不良率三个指标的岗位，基本就是产品经理。你既听得懂风控的口径，也讲得清客户为什么在第三步放弃申请，所以 AI 在这行落地，最先产生价值的地方往往不在模型团队，而在你每周要交的那些东西上：授信材料、策略说明、竞品对比、监管简报。判断一件事该不该交给 AI，只问一句：它是不是「读一堆材料、出一版初稿、再做几组对比」？是，AI 能替你干掉前面的苦活，你留下判断和签字；不是，比如授信定价、额度上限、拒贷口径，AI 最多帮你整理材料。这一节给你两样东西：一张能对着自己工作勾选的机会地图，和三条越线就不能上线的硬红线。后面七节，都围绕这张图和三条线展开。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">金融 PM 的位置</tspan></text><g data-k=\"懂业务\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">懂业务</tspan></text></g><g data-k=\"懂系统\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">懂系统</tspan></text></g><g data-k=\"懂合规\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">懂合规</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 73.27}, {"t": "六类机会：逐条对应日常痛点", "n": "机会拆成六类，一类对一件具体的事。一，洞察：把近三个月几万条客服录音按诉求聚类，提炼 Top5 拒贷异议，原来读一周，现在两小时出初稿。二，研究：把申请漏斗七步的流失点拼成四到六个客群，替代手工拉表。三，设计：申请页字段顺序、额度试算前置、拒绝原因话术，先出五版再挑。四，分析：通过率下滑的归因，把「放款掉了」拆成「哪个渠道、哪个人群、哪条规则」。五，协同：需求评审纪要、跨部门口径对齐、版本变更影响面清单。六，合规：把广告用语、利率披露、催收话术逐条比对监管要求。这六类通常占掉金融 PM 六成以上时间。先挑占时最多、且错了也不致命的那一类开始，别一上手就碰授信和定价：顺序错了，第一次失败就会让团队得出「AI 不靠谱」的结论。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六类 AI 机会</tspan></text><g data-k=\"洞察\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">洞察</tspan></text></g><g data-k=\"研究\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">研究</tspan></text></g><g data-k=\"设计\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">设计</tspan></text></g><g data-k=\"分析\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">分析</tspan></text></g><g data-k=\"协同\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">协同</tspan></text></g><g data-k=\"合规\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">合规</tspan></text></g></svg>", "d": 74.71}, {"t": "三条红线：越线就别上线", "n": "红线三条，条条硬。第一，数据不出域：身份证号、银行卡号、手机号、交易流水、征信报告原文，任何一项都不许贴进外部模型；要分析就先脱敏到「客群 A、额度区间、逾期天数」这个粒度。第二，不替人决策：授信通过与否、额度定多少、利率给几档、拒贷怎么解释，签字的人必须写进方案，AI 只出依据和建议。第三，可解释可追溯：每个结论能说清来自哪张表、哪次访谈、哪个版本策略；监管或内审来问，能当场回放。这三条不是添麻烦，是让你的产出敢进评审会、敢报给监管。守住，提效可复制；守不住，一次数据外泄就足以叫停全年的 AI 尝试——金融的容错率，比零售和车企都低。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"数据不出域：身份与交易不进外部模型\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数据不出域：身份与交易不进外部模型</tspan></text></g><g data-k=\"不替人决策：签字人写进方案\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替人决策：签字人写进方案</tspan></text></g><g data-k=\"可解释可追溯：结论能指回依据\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">可解释可追溯：结论能指回依据</tspan></text></g></svg>", "d": 69.48}, {"t": "小结与接下来", "n": "小结三句。第一，金融 PM 是落点，因为你同时背规模、通过率和不良率，产出又全是材料活。第二，六类机会里先挑占时最多、错了也不致命的那一类，别一上手就碰授信和定价。第三，红线条条硬：数据不出域、不替人决策、可解释可追溯，越一条就不能上线。接下来做任务：产出《AI 红线自检》，三类风险各写一条，含字段名或决策动作。写完贴进你的提效地图，一页纸就够。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"PM 是落点\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">PM 是落点</tspan></text></g><g data-k=\"先挑不致命的\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">先挑不致命的</tspan></text></g><g data-k=\"红线一条不能越\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">红线一条不能越</tspan></text></g><g data-k=\"任务：红线自检\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：红线自检</tspan></text></g></svg>", "d": 49.44}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["机会识别", "红线判定", "可执行性"], "acceptance": "粘贴任意一份 PM 交付物，能输出三类红线风险清单与修改建议，且不越权下合规结论"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】六类机会矩阵 + 红线三原则清单（每张机会卡标「AI 能帮 / 人要把关」）\n【为什么重要】金融 PM 同时背放款规模、通过率与不良率三本账，AI 最容易见效，也最容易踩到监管线\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["能说清「读材料→出初稿→做对比」这类活为什么能交给 AI，而「定授信、定价格、定拒贷」不能（各举一个本岗位例子）", "六类机会里至少命中三类，每类能对上一件本周真实做过的事，不是复述概念", "三条红线各自能说出一个具体越线场景（含字段名或决策动作），而不是只报红线名字", "自检题全对；收获写成一句能马上动手的话（含时间点或对象），不写「收获很大」"]}, {"id": "M0U2", "tier": "basic", "step": "demo", "title": "同一需求：踩红线 vs 守红线", "video": {"dur": "4.8min", "script": ["绝大多数风险不是 AI 不可靠，而是人顺手把不该外传的字段贴了出去", "踩红线 / 守红线对照演示（同一份贷后回访记录两种处理方式）", "「闪电贷」贷后回访记录（含身份证号、卡号后四位与交易流水号）"]}, "ppt": {"method": "踩红线 / 守红线对照演示（同一份贷后回访记录两种处理方式）", "case": "「闪电贷」贷后回访记录（含身份证号、卡号后四位与交易流水号）", "demo": "WorkBuddy 内跑一遍脱敏后的拒贷异议归纳"}, "objective": "能独立完成一次「脱敏 + 只给结构化字段」的 AI 调用，并说清整段粘贴的 4 个具体风险", "transfer": "把手上含客户信息的贷后材料按「可贴 / 需脱敏 / 禁止贴」分三类，先删第三类再问 AI", "vslides": [{"t": "本节要讲什么", "n": "这一节看两个做法：同一条业务诉求，一种把原始材料整段贴进公开模型，一种只给结构化字段。两种都能拿到洞察，区别在数据有没有出域，以及出事后你能不能自证。这一节讲三个动作：脱敏到字段级、字段最小化、提示词里把边界写死。你会看到一份真跑出来的输出，以及人在它上面改掉哪四处。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"两种做法对照\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">两种做法对照</tspan></text></g><g data-k=\"守线三步\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">守线三步</tspan></text></g><g data-k=\"人改的四处\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">人改的四处</tspan></text></g></svg>", "d": 33.46}, {"t": "演示准备：一份含强标识的贷后材料", "n": "我们开始演示。手上是一份「闪电贷」近 30 天的贷后回访记录：客户姓名、身份证号、银行卡后四位、手机号、交易流水号，还有一条带逾期天数的催记。做任何 AI 操作之前，先看一眼它属于什么级别，这一步是习惯不是形式。金融数据里，身份标识和账户交易是最高敏的两类，只要出现身份证号、卡号、流水号、征信报告原文中的任意一项，这份材料就不能整段往外贴。接下来三分钟你会看到同一条业务诉求的两种做法：一种把原始记录整段贴进公开模型，一种只给结构化字段。两者都能拿到洞察，区别在数据有没有出域。演示里的姓名与号码都是构造值，但字段结构和你手上的真实材料完全一致，所以你在这看到的风险点，可以直接对上自己的工作。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示数据预览</tspan></text><g data-k=\"回访记录 第 1 条\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">回访记录 第 1 条</tspan></text></g><g data-k=\"王某 ｜ 3301**********1234\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">王某 ｜ 3301**********1234</tspan></text></g><g data-k=\"卡号 6222 **** 8891 ｜ 流水 SO2026****\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">卡号 6222 **** 8891 ｜ 流水 SO2026****</tspan></text></g><g data-k=\"逾期 12 天 ｜ 诉求：为什么被拒\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">逾期 12 天 ｜ 诉求：为什么被拒</tspan></text></g></svg>", "d": 68.74}, {"t": "踩红线：整段粘贴到公开大模型", "n": "先模拟最常见的错误操作：把整段回访记录，连同身份证号和流水号，一起粘贴到公开聊天窗口。它会给出很漂亮的洞察，效率看起来很高。代价是这些数据已经离开企业边界，而且通常不可撤回——你删掉对话，不代表对方不留存。按个人信息保护法与征信业管理条例，未脱敏的身份证号、账户流水属于个人敏感信息与征信信息，出事后一般走两条线：监管侧处罚，企业侧问责到人。更现实的是责任链：材料一旦被转发，你无法证明脱敏前后的一致性。便利和风险在这里同步放大，所以这一步不能靠自觉，要靠流程卡住：把「能不能贴」做成一张字段清单，而不是每次凭感觉判断。清单其实只要四行——身份、账户、交易、征信，逐行问一句「这行数据能不能出这个门」，答案立刻清楚。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩红线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">代价</tspan></text><g data-k=\"整段贴入公开模型 答得漂亮、数据出域\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">整段贴入公开模型</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">答得漂亮、数据出域</tspan></text></g><g data-k=\"身份与流水随文本离开企业边界\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">身份与流水随文本离开企</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">业边界</tspan></text></g></svg>", "d": 72.89}, {"t": "守红线：脱敏 + 只给结构化字段", "n": "换个做法。先把姓名换成「客群 A」，身份证号、卡号、流水号整体删除，只保留结构字段：客群标签、拒绝原因、客户原话主题、是否复申。然后用这条提示词请 AI 基于给定字段归纳方向，并要求它标出哪些结论缺内部数据、不能定。同样拿到可用洞察，数据一步都没出域。守红线的手法就是三步：脱敏到字段级、字段最小化、提示词里把边界写死。最后一步最容易被忽略，而它恰恰决定 AI 会不会顺手替你「补」出几个看起来很专业的数字。记住一件事：AI 并不知道自己越界，它只会尽力把你递给它的材料用得更好，所以边界必须在递材料之前由你划好。下面这份实跑样例，就是按这三步跑出来的真实结果和人工修正记录。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">守红线三步</tspan></text><g data-k=\"脱敏到字段\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">脱敏到字段</tspan></text></g><g data-k=\"字段最小化\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">字段最小化</tspan></text></g><g data-k=\"提示词写死边界\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">提示词写死边界</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 68.06}, {"t": "小结与接下来", "n": "小结三句。第一，风险不在模型靠不靠谱，在你有没有把身份、账户、交易、征信四类字段挡在门外。第二，守线就三步：脱敏到字段、字段最小化、提示词写死边界，最后一步最容易被忘。第三，AI 输出的每个数字都要问来源，没有来源的比例一律删掉。接下来做任务：把手上含客户信息的材料按可贴、需脱敏、禁止贴分三类，先删第三类，再用这条提示词跑一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"四类字段挡门外\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">四类字段挡门外</tspan></text></g><g data-k=\"守线三步\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">守线三步</tspan></text></g><g data-k=\"数字必须有来源\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">数字必须有来源</tspan></text></g><g data-k=\"任务：材料分三类\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：材料分三类</tspan></text></g></svg>", "d": 45.02}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["脱敏完整", "边界写死", "人工修正"], "acceptance": "能产出《AI 红线自检》并通过本单元评分要点"}, "demo": {"ref": "■ 三个优先解决的拒贷体验问题（仅基于给定结构化字段，全程未使用身份证号、卡号、流水号）\n\n1. 拒绝原因表述过于笼统\n · 现象：被拒客户的追问集中在「为什么不给我额度」，而页面只给「综合评分不足」。\n · 建议：把拒绝原因归到 4 类可解释话术（收入证明不足 / 负债偏高 / 征信查询过多 / 暂不支持该客群），并给出可改善路径。\n · 依据强度：中（字段完整，但未接投诉工单分类）\n\n2. 额度与预期落差\n · 现象：通过客户中「批的额度比试算少一半」的抱怨占比最高。\n · 建议：试算页面同时给「区间预估 + 影响因素」，并说明最终额度以审批为准。\n · 依据强度：弱（缺试算值与实际额度的对照数据）\n\n3. 复申路径不清\n · 现象：被拒后 90 天内复申的客户，多数不知道隔多久可以再申请。\n · 建议：拒绝页给出「最早可复申时间」与「需要补充的材料清单」。\n · 依据强度：中（可从字段复申间隔直接算）\n\n■ 需要补内部数据才能定的结论\n · 问题 1 的优先级：需要投诉工单里「原因不清」的占比与处理时长。\n · 问题 2 的收益：需要试算曝光到申请的转化差与额度落差分布。\n · 问题 3 是否成立：需要复申率与复申通过率的基线。\n\n⚠ 需人工确认：三个问题的排序依赖业务量级，我无法从给定字段判断哪个体量最大。", "fix": ["把「占比最高」改成「需要工单分类才能排序」，并显式写明此处没有计数——AI 很容易把定性印象说成「提及最多」，这是最典型的编造。", "给每条结论标「依据强度」，把建议和结论分开写——不带强度标注的建议，进评审会会被当成结论追问，一问就塌。", "删掉 AI 顺手补的行业平均值（如「消费金融拒贷投诉率约两成」），这类数字必须来自自家数据，否则就是给方案埋雷。", "没有让 AI 判断是否违反《征信业管理条例》——那是法务与合规的结论，课程里只保留「标记疑点、转人工」的动作。"], "judge": "判断依据：有没有出现没有来源的比例或频次；有没有把建议写成结论；有没有标出「需补内部数据才能定」的部分；有没有越权下合规或征信定性", "sheet": {"situ": "你是「闪电贷」的产品经理。客服把这周被拒客户的回访记录原样发给了你——每条都带着姓名、身份证号、卡号后四位和交易流水号。你要用它出一版拒因体验改进方案，但这些原始记录，一条都不能整段发给模型。", "ask": "① 先把 6 条记录按框架整理成结构化字段，顺手把不该外发的部分去掉；② 用整理好的字段请 AI 给三条改进方向；③ 拿回初稿后自己动手改，改了哪几处写清楚。", "gen": "请基于以上结构化字段，归纳 3 条可落地的拒因体验改进方向。每条按「现象 → 建议 → 依据强度」三段写，依据强度只填 强 / 中 / 弱；再单独列一段「还缺哪些内部数据才能定优先级」。不要给出任何没有来源的频次、比例或行业均值——不确定的地方直接写「需内部数据」。", "mats": [{"id": "F01", "src": "回访记录 · 第 1 条", "text": "王某 ｜ 3301**********1234 ｜ 卡号 6222****8891 ｜ 流水 SO2026-11-0417\n我月薪两万，征信也没逾期过，为什么只给我批三万？页面就写个「综合评分不足」，我不服。"}, {"id": "F02", "src": "回访记录 · 第 2 条", "text": "李某 ｜ 3302**********5518 ｜ 流水 SO2026-11-0422\n试算的时候显示能借八万，点了申请批下来四万，差一半。这算不算诱导？"}, {"id": "F03", "src": "回访记录 · 第 3 条", "text": "匿名客户\n被拒之后我想再申请，页面什么都没说，隔了多久能再试、要不要补材料，全靠打客服电话问。"}, {"id": "F04", "src": "回访记录 · 第 4 条", "text": "张某 ｜ 3305**********9032 ｜ 卡号 6217****4410\n放款倒是快，十分钟到账，这点挺好。就是还款日提醒只发一次，容易忘。"}, {"id": "F05", "src": "回访记录 · 第 5 条", "text": "匿名客户\n你们让我补收入证明，我传了三个月的工资流水，还是被拒。到底要什么样的证明，能不能一次说清楚？"}, {"id": "F06", "src": "回访记录 · 第 6 条", "text": "陈某 ｜ 3306**********2277 ｜ 流水 SO2026-11-0439\n催收电话打到我们公司前台了，我同事都知道了。这个事我要投诉。"}], "cols": [{"k": "topic", "name": "诉求主题", "hint": "这条在说什么问题", "type": "chips", "w": 3, "tags": ["拒绝原因不清", "额度落差", "复申路径", "还款提醒", "材料要求不清", "催收合规"]}, {"k": "sent", "name": "情感", "hint": "负 / 中 / 正", "type": "chips", "w": 2, "tags": ["负", "中", "正"]}, {"k": "pii", "name": "含哪些强标识", "hint": "可多选；没有就选「无」", "type": "multi", "w": 3, "tags": ["无", "身份证号", "银行卡号", "交易流水号", "手机号"]}, {"k": "quote", "name": "可外发的一句原话（照抄，已脱敏）", "hint": "从原文挑连续一段，至少 6 个字，姓名/证件/卡号/流水号一律不出现", "type": "text", "w": 3, "tags": []}], "key": {"F01": {"topic": "拒绝原因不清", "sent": "负", "pii": "身份证号,银行卡号,交易流水号", "quote": "为什么不给我批五万，页面只写综合评分不足"}, "F02": {"topic": "额度落差", "sent": "负", "pii": "身份证号,交易流水号", "quote": "试算显示能借八万，批下来只有四万"}, "F03": {"topic": "复申路径", "sent": "负", "pii": "无", "quote": "被拒之后隔多久能再申请，页面什么都没说"}, "F04": {"topic": "还款提醒", "sent": "正", "pii": "身份证号,银行卡号", "quote": "放款十分钟到账，但还款日只提醒一次"}, "F05": {"topic": "材料要求不清", "sent": "负", "pii": "无", "quote": "传了三个月工资流水还是被拒，能不能一次说清要什么"}, "F06": {"topic": "催收合规", "sent": "负", "pii": "身份证号,交易流水号", "quote": "催收电话打到公司前台，同事都知道了"}}, "notes": {"F04·sent": "这条先夸后提需求，主体的情绪是正面的（认可放款速度），提醒一次是诉求不是差评 → 正。判成负会把满意度口径带偏", "F03·pii": "匿名客户，正文没有任何号码 —— 敏感类型按「出现了哪几类」算，没有就选「无」，不能因为「是客户」就默认有", "F05·pii": "提了「工资流水」但没给任何号码，属于材料类型不是标识 → 无。把「工资流水」当身份证号填是常见误判", "F06·topic": "主问题是催收方式越界（打扰第三方），不是「服务态度」；这一条要单列，因为它可能触发合规上报", "F02·topic": "核心矛盾是试算额度与实批额度的落差，不是「利率高」；归类错了，改进动作会跑偏成调价", "F01·quote": "原话里的姓名、证件号、卡号都要去掉；报价类的具体数字可以保留（是本条诉求的核心），但客户标识一个不能留"}, "delta": [{"op": "改", "frm": "「客户普遍反映拒绝原因不清」（模型把 3 条说成普遍）", "to": "「素材中 F01、F05 提到拒绝原因与材料要求不清，占比需工单分类核对」", "why": "6 条素材里 2 条相关，写「普遍」就是编频次；评审只要问一句「几条」就塌", "kw": ["普遍", "多数", "频次", "占比", "几条", "大量"]}, {"op": "改", "frm": "三条建议只写「建议优化话术」，不给依据强度", "to": "每条后面标「依据强度：强 / 中 / 弱」，弱的那条注明缺什么数据", "why": "建议和结论要分开。不标强度，建议进评审会会被当成结论追问，一问就露", "kw": ["依据强度", "强度", "强", "中", "弱"]}, {"op": "删", "frm": "模型顺手补的行业均值，如「消费金融拒贷投诉率约两成」", "to": "整句删除", "why": "素材里没有这条数据，且这类数字必须来自自家工单。写进方案等于给评审埋雷", "kw": ["行业", "平均", "同业", "约两成", "均值"]}], "refsheet": "F01｜主题：拒绝原因不清｜情感：负｜强标识：身份证号、银行卡号、交易流水号｜原话：为什么不给我批五万，页面只写综合评分不足\nF02｜主题：额度落差｜情感：负｜强标识：身份证号、交易流水号｜原话：试算显示能借八万，批下来只有四万\nF03｜主题：复申路径｜情感：负｜强标识：无｜原话：被拒之后隔多久能再申请，页面什么都没说\nF04｜主题：还款提醒｜情感：正｜强标识：身份证号、银行卡号｜原话：放款十分钟到账，但还款日只提醒一次\nF05｜主题：材料要求不清｜情感：负｜强标识：无｜原话：传了三个月工资流水还是被拒，能不能一次说清要什么\nF06｜主题：催收合规｜情感：负｜强标识：身份证号、交易流水号｜原话：催收电话打到公司前台，同事都知道了", "forbid": "\\d{6}(19|20)\\d{2}[01]\\d[0-3]\\d{4}[0-9Xx]|6222\\*{0,4}\\d{4}|6217\\*{0,4}\\d{4}|SO\\d{4}-\\d{2}-\\d{4}", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「闪电贷」近 30 天被拒客户的回访记录摘要（已脱敏，不含任何身份证号、卡号、手机号与流水号）：\n[粘贴按「客群 / 拒绝原因 / 客户原话主题 / 是否复申」整理后的结构化字段]\n请基于给定字段归纳三个最该优先解决的拒贷体验问题，每条给出可执行动作，并明确标出哪些结论必须补内部数据（通过率、逾期率、复申率）才能定。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】踩红线 / 守红线对照演示（同一份贷后回访记录两种处理方式）\n【参考案例】「闪电贷」贷后回访记录（含身份证号、卡号后四位与交易流水号）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「闪电贷」近 30 天被拒客户的回访记录摘要（已脱敏，不含任何身份证号、卡号、手机号与流水号）：\n[粘贴按「客群 / 拒绝原因 / 客户原话主题 / 是否复申」整理后的结构化字段]\n请基于给定字段归纳三个最该优先解决的拒贷体验问题，每条给出可执行动作，并明确标出哪些结论必须补内部数据（通过率、逾期率、复申率）才能定。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U3", "tier": "basic", "step": "todo", "title": "画一张你的 AI 提效地图", "video": {"dur": "4.6min", "script": ["提效方案失败的第一步，往往是连自己这周到底做了什么都列不全", "提效地图模板（工作项 / AI 切入点 / 数据级别 / 人复核 / 耗时变化）", "「闪电贷」项目组提效地图样例（8 项工作 × 五列，含 1 项标红线未过）"]}, "ppt": {"method": "提效地图模板（工作项 / AI 切入点 / 数据级别 / 人复核 / 耗时变化）", "case": "「闪电贷」项目组提效地图样例（8 项工作 × 五列，含 1 项标红线未过）", "demo": "地图填写操作指引（先列工作，再标 AI 点，最后排序）"}, "objective": "能产出一张不少于 8 个工作项的提效地图，每项标清 AI 切入点、数据级别与签字人", "transfer": "本月从地图里挑 2 个试点跑起来，动手前让主管在「红线」那一列签字确认", "vslides": [{"t": "本节要讲什么", "n": "这一节落一张纸：你的 AI 提效地图。它解决一个很实际的问题——说不清时间花在哪，就申请不到资源。这一节讲三件事：怎么把本周工作列全并标上小时数、四个字段各要写到什么颗粒度、以及按什么顺序挑第一批试点。填完这张表，你手上就有能跟主管对话的数字。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"列全工作并标时长\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">列全工作并标时长</tspan></text></g><g data-k=\"四个字段的颗粒度\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">四个字段的颗粒度</tspan></text></g><g data-k=\"试点怎么排序\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">试点怎么排序</tspan></text></g></svg>", "d": 28.51}, {"t": "先列工作，再谈提效", "n": "提效地图的第一步不是想 AI 能干什么，是把自己这周干了什么列清楚。绝大多数人一上手就写「用 AI 写周报」，写到第三条就卡住，因为根本没数过时间花在哪。做法很土：翻日历和聊天记录，把这周碰过的事写成 8 到 10 条，每条后面标小时数。你会发现两类事：一类是重复的（周报、纪要、对比表、话术整理），一类是要判断的（定规则、定口径、跨部门对齐）。AI 先吃第一类，因为它的产出好坏你能一眼看出；第二类先别碰，它需要你担责，而担责不能外包。这一步还有一个副产品：当你能说出「我这周 28 个小时里 12 个小时在整理材料」，向主管申请工具就不再是「我想试试 AI」，而是「这 12 小时我想省一半」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">先做这三步</tspan></text><g data-k=\"翻日历，列 8–10 条\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">翻日历，列 8–10 条</tspan></text></g><g data-k=\"标小时数\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">标小时数</tspan></text></g><g data-k=\"分「重复」与「要判断」\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">分「重复」与「要判断」</tspan></text></g></svg>", "d": 64.75}, {"t": "三列怎么填才算能落地", "n": "第二列是 AI 切入点，必须写到「读哪份材料、产出什么」的粒度。写「用 AI 提效」等于没写；写成「读 200 条转写录音，输出诉求、频次、客户原话三列」，才叫能派活。第三列是数据级别，只有三个选项：公开、内部、含个人敏感信息。含个人敏感信息的那一行，必须同时写脱敏动作，比如「转写后删姓名、手机号、卡号，只留诉求主题」。第四列是人复核，写名字不写「团队」。第五列是耗时变化，写「5 小时变 1.5 小时」，别写「效率提升 70%」——前者能被验证，后者只能被相信。填完这张表的标志是：任何一条拿给同事看，他知道该喂什么、该删什么、该找谁签字。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四列填写标准</tspan></text><g data-k=\"AI 切入点：读什么·出什么\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">AI 切入点：读什么·出什么</tspan></text></g><g data-k=\"数据级别：三选一\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">数据级别：三选一</tspan></text></g><g data-k=\"人复核：写名字\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">人复核：写名字</tspan></text></g><g data-k=\"耗时：前后对比\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">耗时：前后对比</tspan></text></g></svg>", "d": 64.34}, {"t": "排序、试点，和两个常见坑", "n": "排法只有一个：耗时乘风险。耗时高的先做，风险高的往后放。风险怎么估？看这条工作错了会不会影响客户权益——影响额度、影响拒贷、影响利率的，一律往后。第一个坑是把授信、定价、选品放进第一批试点：这类事错了要复盘到人，第一次尝试失败，团队半年内不会再批第二个项目。第二个坑是选了没有验收口径的试点，跑了一个月说不清到底省了多少，于是下一轮预算批不下来。正确做法是每项试点写清口径，比如「连续两周周报无需返工」「话术定稿客服可直接使用」。两个试点就够，多了盯不住。还有一个动作别省：把这张表打印出来贴在工位旁，每两周更新一次耗时列。数字一变，你就能看出哪一项其实没省下时间——那多半不是工具的问题，是你把判断的活也交给了 AI。跑满一个月，你手上就有一张带数字的地图，那是你申请更大范围试点的唯一筹码。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"耗时优先、风险靠后\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">耗时优先、风险靠后</tspan></text></g><g data-k=\"第一批别碰授信定价\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">第一批别碰授信定价</tspan></text></g><g data-k=\"每项都要有验收口径\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每项都要有验收口径</tspan></text></g></svg>", "d": 80.3}, {"t": "小结与接下来", "n": "小结三句。第一，先列工作再谈提效，列不出 8 条就说明你还没看清自己的时间。第二，AI 切入点要写到读哪份材料、产出什么，写「用 AI 提效」等于没写。第三，排序看耗时乘风险，影响额度、拒贷、利率的一律往后放。接下来做任务：交出不少于 8 项的提效地图，含数据级别、脱敏动作、签字人，并选出 2 项下周试点，各写一条验收口径。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"先列工作再谈提效\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">先列工作再谈提效</tspan></text></g><g data-k=\"切入点写到动作\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">切入点写到动作</tspan></text></g><g data-k=\"风险靠后\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">风险靠后</tspan></text></g><g data-k=\"任务：提效地图\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：提效地图</tspan></text></g></svg>", "d": 41.06}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["覆盖度", "可执行性", "红线标注"], "acceptance": "一张能贴到工位旁的地图：≥8 项工作、每项有耗时与 AI 切入点、≥1 项明确标为红线未通过、选出 2 项下周试点"}, "practice": {"steps": ["列出你本周 8 项主要工作，每项标注耗时（小时）", "对每项填：AI 能帮哪一步 / 用什么工具 / 产出能到什么完成度", "标红线：数据级别（公开/内部/含个人敏感信息）、需不需要人复核、责任写谁", "按「耗时 × 风险」排序，选出下周就要试的 2 项并写验收口径"], "exemplar": "【本周工作 × AI 提效地图】角色：闪电贷 产品经理　周期：11/17–11/21\n\n■ 1. 拒贷原因话术梳理（5h/周）\n　AI 切入：把 200 条客服录音转写后按诉求聚类，输出「诉求 / 频次 / 客户原话」三列初稿\n　完成度：聚类到 80%，话术定稿需我判断　数据级别：含个人敏感信息（录音）\n　脱敏动作：转写后删姓名、手机号、卡号，只留诉求与原话主题　人复核：我\n　耗时预估：5h → 1.5h\n\n■ 2. 竞品额度与利率对比（4h/周）\n　AI 切入：把三家公开产品页整理成「额度区间 / 年化利率 / 期限 / 放款时效」四列\n　完成度：结构 90%，判断我做　数据级别：公开　红线：只用公开页，不买第三方数据\n　人复核：我　耗时预估：4h → 0.8h\n\n■ 3. 风控策略变更影响面清单（3h/次）\n　AI 切入：给一份策略变更说明，输出受影响的字段、页面、下游报表清单\n　完成度：70%，遗漏需研发补　数据级别：内部（不含个人信息）\n　人复核：我 + 研发　耗时预估：3h → 1h\n\n■ 4. 周报与月度复盘（3h/周）\n　AI 切入：把看板导出的通过率、放款额、逾期率三组数按周环比成文\n　完成度：85%　数据级别：内部聚合　红线：只给聚合量，不给客户明细\n　人复核：我　耗时预估：3h → 0.6h\n\n■ 5. 监管新规解读（4h/次）\n　AI 切入：贴公开新规原文，输出「影响条线 / 需改动作 / 时间表」三段式初稿\n　完成度：结构可用，口径必须法务确认　数据级别：公开　红线：不代替法务下合规结论\n　人复核：我 + 法务　耗时预估：4h → 1.2h\n\n■ 6. 需求评审纪要（1.5h/次）\n　AI 切入：录音转写后输出「结论 / 待办 / 责任人 / 截止日」四栏\n　完成度：80%　数据级别：内部　红线：录音不含客户信息才可转写\n　人复核：我　耗时预估：1.5h → 0.3h\n\n■ 7. 授信规则回归测试用例（6h/次）—— ⚠ 红线未通过\n　AI 切入：想用 AI 读规则表生成用例\n　判定：规则表属内部核心资产，含客户分层依据，出域即违规\n　结论：本项不试点，改为内部部署模型，先走信息安全评估\n\n■ 8. 申请页文案 A/B 备选（2h/次）\n　AI 切入：一次出 5 版标题与按钮文案，按「信息量 / 合规 / 长度」三列自评\n　完成度：出稿 100%，选哪版我做　数据级别：公开（不含利率数字）\n　红线：利率与费用表述必须走合规审，不由 AI 定　人复核：我 + 合规\n　耗时预估：2h → 0.4h\n\n■ 下周试点（2 项）\n　① 项目 1 拒因话术：验收口径 = 8 类话术定稿且客服可用；责任人 = 我\n　② 项目 4 周报：验收口径 = 连续两周无需返工；责任人 = 我\n\n■ 合计：本周 28.5h → 预计 7.3h，节省约 74%\n⚠ 第 7 项已按红线剔除，全表不含任何客户级明细数据"}, "task": "产出《个人 AI 提效地图》：列出你本周 8 项主要工作，每项标注耗时（小时）；对每项填：AI 能帮哪一步 / 用什么工具 / 产出能到什么完成度；标红线：数据级别（公开/内部/含个人敏感信息）、需不需要人复核、责任写谁；按「耗时 × 风险」排序，选出下周就要试的 2 项并写验收口径", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的消费金融 AI 产品经理。本单元属于「M0 导论：金融 PM 的 AI 机会与红线」模块，你要交付的是《个人 AI 提效地图》。\n【场景】业务侧这周的诉求是：提效方案失败的第一步，往往是连自己这周到底做了什么都列不全。参考做法：「闪电贷」项目组提效地图样例（8 项工作 × 五列，含 1 项标红线未过）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提效地图模板（工作项 / AI 切入点 / 数据级别 / 人复核 / 耗时变化）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【本周工作 × AI 提效地图】角色：{{}}　周期：{{}}\n\n■ 序号. {{工作项名称}}（{{耗时}}h/周）\n　AI 切入：{{读哪份材料、产出哪几列}}\n　完成度：{{AI 到几成，哪一部分必须我做}}\n　数据级别：{{公开 / 内部 / 含个人敏感信息}}\n　脱敏动作：{{删哪些字段、替换成什么}}（数据级别为内部或公开时写「不涉及」）\n　红线：{{这条越不越线，越过就写「不试点」}}\n　人复核：{{姓名}}\n　耗时预估：{{}}h → {{}}h\n\n■（重复到 ≥8 项，含 1 项标「⚠ 红线未通过」）\n\n■ 下周试点（2 项）\n　① {{工作项}}：验收口径 = {{可判定的标准}}；责任人 = {{姓名}}\n　② {{工作项}}：验收口径 = {{可判定的标准}}；责任人 = {{姓名}}\n\n■ 合计：本周 {{}}h → 预计 {{}}h，节省约 {{}}%", "rubric": ["工作项 ≥8 条，每条都有耗时数字（小时）；只写「跟进需求」这类笼统词的按未填计", "每条都有明确 AI 切入点，写到「读哪份材料、产出什么」这个粒度，「用 AI 提效」不算", "每条都标了数据级别（公开/内部/含个人敏感信息），含个人信息的必须写明脱敏动作", "结尾选出 2 项下周试点，写明试点验收口径与责任人"]}, {"id": "M0U4", "tier": "basic", "step": "spar", "title": "合规官挑战你的提效地图", "video": {"dur": "4.5min", "script": ["合规不是不让你用 AI，是要你能证明每一步都可回溯——说不清的那一步就是风险点", "角色陪练：合规官按「字段 / 来源 / 责任 / 留痕」四层追问", "某银行 PM 提效地图在合规预审被退回，原因是写不出脱敏留痕"]}, "ppt": {"method": "角色陪练：合规官按「字段 / 来源 / 责任 / 留痕」四层追问", "case": "某银行 PM 提效地图在合规预审被退回，原因是写不出脱敏留痕", "demo": "陪练演示：把「公开来源」问到能出示证据为止"}, "objective": "能在合规官四轮追问下说清数据字段、来源证据与责任链，不靠含糊过关", "transfer": "把提效地图里数据级别最高的一项，按「字段—授权—留痕」三段补成一页说明，发给合规", "vslides": [{"t": "本节要讲什么", "n": "这一节是陪练。对面是数据合规官，他不跟你讨论 AI 好不好用，只按四层追问：用了什么字段、来源怎么证明、谁签字、留了什么证据。这一节讲三件事：四问的顺序为什么是这样、合格回答长什么样、以及答不上来时正确的三个动作。练完你要能撑到第四层。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"合规只问四件事\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">合规只问四件事</tspan></text></g><g data-k=\"合格回答长什么样\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">合格回答长什么样</tspan></text></g><g data-k=\"答不上来怎么办\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">答不上来怎么办</tspan></text></g></svg>", "d": 28.06}, {"t": "陪练怎么看：合规官只问四件事", "n": "这个单元是陪练，不是听课。对面坐着一位数据合规官，他不会跟你讨论 AI 好不好用，只问四件事：用了什么字段、来源怎么证明、出了事谁签字、过程留了什么证据。这四问的顺序是固定的：先问字段，因为字段决定敏感级别；再问来源，因为来源决定是否合规；然后问责任链，因为责任链决定事后能不能追；最后要留痕，因为留痕决定你能不能自证。你要练的不是背话术，是在被追问第三层时不慌——大部分人第一问能答，第二问开始含糊，第三层就变成「我们内部有流程」。这句话在合规面前等于零，因为流程要能拿出来看。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合规四问</tspan></text><g data-k=\"用了什么字段\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">用了什么字段</tspan></text></g><g data-k=\"来源怎么证明\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">来源怎么证明</tspan></text></g><g data-k=\"谁签字\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">谁签字</tspan></text></g><g data-k=\"留了什么证据\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">留了什么证据</tspan></text></g></svg>", "d": 57.67}, {"t": "三类必被追问的回答，和它们的合格版本", "n": "第一类，字段。不合格：「用到了一些客户信息」。合格：「第 3 项用手机号与交易金额两列，手机号在进入模型前替换为客群编号」。第二类，来源。不合格：「网上都能查到」。合格：「三家竞品官网产品页，11 月 12 日抓取，截图存在共享盘 /竞品/2026-11 目录，抓取人是我」。第三类，责任。不合格：「这个我们团队一起看」。合格：「授信结论由风控策略负责人签字，我只出建议与依据，评审纪要第 2 条写明」。看出差别了吗？合格的回答都能被核查：有字段名、有位置、有名字。说不清的，就是没做。再补一句容易被忽略的：合规官问「哪几项」，你要能报出编号；问「脱敏到哪层」，你要能说出替换规则，比如手机号换成客群编号、流水号整列删除。这两句说得出，四问就撑得住前三层。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">合格回答的四个特征</tspan></text><g data-k=\"字段：报列名\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">字段：报列名</tspan></text></g><g data-k=\"来源：报位置与人\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">来源：报位置与人</tspan></text></g><g data-k=\"责任：报签字人\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">责任：报签字人</tspan></text></g><g data-k=\"留痕：报模板\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">留痕：报模板</tspan></text></g></svg>", "d": 78.74}, {"t": "答不上来的时候，正确动作是什么", "n": "陪练里一定会出现你答不上来的问题，这很正常。错误的动作是硬编一个答案，正确动作是三步：承认、定位、约时间。承认——「这一项我确实没做脱敏留痕」；定位——「影响的是第 4 项周报，用到了聚合量，风险等级我判断为低」；约时间——「我今天补一版字段清单，明天上午发您」。合规官最怕的不是你没做，是你做了还说不清。另外记住一条边界：你可以判断这项工作需不需要脱敏，不能判断这次使用是否合规——后者是合规官的结论。这条边界守住，你在这家机构里才能长期用 AI；守不住，一次越权定性就会让你所有的提效尝试被整体冻结。练完这一轮，下一节我们把这套判断升级到部门级。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">答不上来的三步</tspan></text><g data-k=\"承认\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">承认</tspan></text></g><g data-k=\"定位影响面\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">定位影响面</tspan></text></g><g data-k=\"约时间补件\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">约时间补件</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 62.93}, {"t": "小结与接下来", "n": "小结三句。第一，合规只认证据：字段要报列名，来源要报位置和人，责任要报签字人。第二，「我们做过脱敏」这句话等于没做，脱敏到哪层、谁做的、留了什么，三样都要有。第三，答不上来别硬编，承认、定位影响面、约时间补件，这三步比任何话术都管用。接下来做任务：挑地图里数据级别最高的一项，按字段、授权、留痕三段补成一页说明，发给合规。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"只认证据\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">只认证据</tspan></text></g><g data-k=\"脱敏要说三层\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">脱敏要说三层</tspan></text></g><g data-k=\"别硬编\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">别硬编</tspan></text></g><g data-k=\"任务：一页说明\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：一页说明</tspan></text></g></svg>", "d": 41.45}], "deliverable": {"type": "skill", "name": "AI 红线自检", "rubric": ["字段识别", "证据链", "边界表述"], "acceptance": "四轮追问下不出现「大概」「应该」这类含糊表述，且每项数据能说出字段名与授权来源"}, "spar": {"role": "数据合规官", "persona": "严谨、只认制度与证据，先问字段再问授权，回答含糊就往下追一层，不接受「应该没问题」", "mustAsk": ["这张地图里，哪几项用到了身份证号、卡号、交易流水或征信原文？逐项说出来，脱敏到哪一层？", "你说「只用公开来源」，怎么证明是公开的？谁把证据留下了，存在哪个目录？", "AI 给的建议导致一批客户被误拒，责任链怎么走？谁签字，谁复核，谁对外解释？", "监管来查，你能拿出哪份记录证明这 8 项工作每次分析前都做过脱敏？拿出模板我看看"]}, "exemplar": "合格回答的三个特征（对照自查）：\n1. 报字段不报类别：「第 3 项用到的是手机号与交易金额两列」比「用到客户信息」可审得多。\n2. 给出证据位置：「公开来源指三家官网产品页，链接收在共享盘 /竞品/2026-11 目录」。\n3. 主动交代责任：「授信结论由风控策略负责人张 X 签字，我只出建议与依据」。\n反面例子：「我们做过脱敏处理」——脱敏到哪一层、谁做的、留了什么记录，一句都答不上，等于没做。", "task": "把《AI 红线自检》拿到「数据合规官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《AI 红线自检》。现在要让它通过「数据合规官」这一关。\n【对手的立场】严谨、只认制度与证据，先问字段再问授权，回答含糊就往下追一层，不接受「应该没问题」。\n【他一定会追问】「这张地图里，哪几项用到了身份证号、卡号、交易流水或征信原文？逐项说出来，脱敏到哪一层？」 / 「你说「只用公开来源」，怎么证明是公开的？谁把证据留下了，存在哪个目录？」 / 「AI 给的建议导致一批客户被误拒，责任链怎么走？谁签字，谁复核，谁对外解释？」\n【场景】你说「合规官挑战你的提效地图」，对方立刻回一句：这张地图里，哪几项用到了身份证号、卡号、交易流水或征信原文？逐项说出来，脱敏到哪一层？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M0U5", "tier": "adv", "step": "understand", "title": "组织级 AI 落地路线与治理", "video": {"dur": "4.7min", "script": ["组织级失败很少是技术不行，多是试点永远停在试点，没人敢说停", "三段路线图（试点 / 固化 / 治理）+ 每段准入与退出条件清单", "某城商行零售条线：11 个 AI 试点，只有 3 个进到固化，原因是没写退出条件"]}, "ppt": {"method": "三段路线图（试点 / 固化 / 治理）+ 每段准入与退出条件清单", "case": "某城商行零售条线：11 个 AI 试点，只有 3 个进到固化，原因是没写退出条件", "demo": "把一张「我们要全面 AI 化」的口号，拆成三段带条件的路线图"}, "objective": "能把部门 AI 规划拆成「试点—固化—治理」三段，并为每段写出准入与退出条件", "transfer": "本周把部门在做的 AI 事项按三段归类，标出哪一段缺退出条件，发到部门群请主管确认", "vslides": [{"t": "本节要讲什么", "n": "这一节从个人往上走一层：部门级怎么把 AI 落地，才不会永远停在试点。很多团队不缺试点，缺的是敢说停的人，于是十几个项目一直在优化，没有一个能固化。这一节讲三件事：试点为什么永远停在试点、三段各要什么准入与退出条件、以及治理真正要留的三样东西。看完你要能判断自己部门最缺哪一段。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"试点为何停不下来\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">试点为何停不下来</tspan></text></g><g data-k=\"三段的准入与退出\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三段的准入与退出</tspan></text></g><g data-k=\"治理要留三样\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">治理要留三样</tspan></text></g></svg>", "d": 32.98}, {"t": "为什么试点永远停在试点", "n": "组织级 AI 落地最常见的结局不是失败，是悬着：11 个试点里 3 个能重复用，剩下 8 个一直在「优化」。原因几乎一样——立项时只写了目标，没写退出条件。试点天生有豁免权：数据可以特批、口径可以手工补、效果可以口头评估。一旦要固化，特批要转成常态授权、手工要转成系统、口头要转成指标，这三关谁都过不去，于是大家心照不宣地继续试点。破解办法不是加强考核，是在立项时就把三段写清楚：这一段跑到什么算完，完不成谁来按停。金融的监管环境决定了，一个说不清退出条件的项目，最终一定由风控或合规替你按停，那时候代价比主动停大得多。还有一个更隐蔽的问题：试点期间的数据往往是特批的，口径是手工补的，效果是口头评的。这三样只要有一项没在固化前转成常态，项目就会在扩面第三周突然停摆——不是模型不好用，是权限到期了。所以每段都要写清「这一段靠什么活着」，写不出，就说明它还没准备好进下一段。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三段路线</tspan></text><g data-k=\"试点：跑通一次\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">试点：跑通一次</tspan></text></g><g data-k=\"固化：能重复\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">固化：能重复</tspan></text></g><g data-k=\"治理：谁按停\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">治理：谁按停</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 83.11}, {"t": "三段各自的准入与退出条件", "n": "试点段的准入是：有明确的使用者、有可拿到的材料、有一个人愿意为结果负责。退出条件是：四周内跑通一次真实业务、产出被采用至少一次；否则停。固化段的准入是：口径稳定、数据授权常态、有模板可复用。退出条件是：连续两个月不依赖原班人马也能跑，且错误率低于人工基线；达不到就退回试点，不许硬推。治理段的准入是：有资产清单、有留痕、有异常处置流程。退出条件是：出现一次数据越界或一次无法回放的结论，立即冻结并复盘。三段之间是门槛关系，不是时间关系——很多团队按季度推进，结果第二季度就在推固化，而试点其实一次都没跑通。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三段的退出条件</tspan></text><g data-k=\"试点：4 周跑通一次\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">试点：4 周跑通一次</tspan></text></g><g data-k=\"固化：2 个月不靠原班人\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">固化：2 个月不靠原班人</tspan></text></g><g data-k=\"治理：越界即冻结\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">治理：越界即冻结</tspan></text></g></svg>", "d": 65.45}, {"t": "治理不是加审批，是留三样东西", "n": "很多人把治理理解成多加两道审批，结果把效率杀死了。治理真正要留的是三样：资产、留痕、责任。资产指提示词、模板、字段口径，出了事能拿出来看，换人也能接着跑。留痕指每次分析的输入是什么、脱敏做到哪层、谁复核，不用很重，一页表格就够。责任指每类产出有唯一签字人，拒贷话术由谁定、额度试算口径由谁定，写在资产清单上。这三样齐了，审批可以很轻；三样缺一样，审批再重也拦不住事故。这也是为什么本单元的产出物是一个 agent 而不是一份文档：它要能替你回答「这条规则谁定的、依据哪份文件、上次改是什么时候」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"资产：提示词与口径可交接\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">资产：提示词与口径可交接</tspan></text></g><g data-k=\"留痕：输入与复核可回放\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">留痕：输入与复核可回放</tspan></text></g><g data-k=\"责任：每类产出一个签字人\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">责任：每类产出一个签字人</tspan></text></g></svg>", "d": 57.26}, {"t": "小结与接下来", "n": "小结三句。第一，试点悬着的原因是立项时只写了目标，没写退出条件，于是永远有豁免权。第二，三段各有门槛：试点四周跑通一次、固化两个月不靠原班人、治理越界即冻结。第三，治理不是加审批，是留资产、留痕、责任三样，齐了审批可以很轻。接下来做任务：把部门在做的 AI 事项按三段归类，标出哪一段缺退出条件，发到部门群请主管确认。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"缺的是敢说停\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">缺的是敢说停</tspan></text></g><g data-k=\"三段有门槛\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">三段有门槛</tspan></text></g><g data-k=\"治理留三样\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">治理留三样</tspan></text></g><g data-k=\"任务：按三段归类\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：按三段归类</tspan></text></g></svg>", "d": 41.69}], "deliverable": {"type": "agent", "name": "部门 AI 治理官", "rubric": ["分段合理", "条件可判", "责任到人"], "acceptance": "对任一 AI 事项，能指出它属于哪一段、准入条件是否满足、退出条件是什么、谁有权按停"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三段路线图（试点 / 固化 / 治理）+ 每段准入与退出条件清单\n【为什么重要】组织级失败很少是技术不行，多是试点永远停在试点，没人敢说停\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["三段的分界写得清：试点看「有没有跑通一次」，固化看「能不能重复」，治理看「出了事谁按停」", "每段至少一条准入条件与一条退出条件，且都是可判定的（含数字或明确动作），不写「效果良好」", "能指出本部门当前最缺的那一段，并说明缺了会怎样（举一个已经发生的例子）", "写明谁有权按停、按停后资产（提示词、模板、数据口径）归谁，不写「由团队共同决定」"]}, {"id": "M0U6", "tier": "adv", "step": "demo", "title": "模拟银行 PM 团队提效方案", "video": {"dur": "4.4min", "script": ["提效方案最容易死在「省了多少」说不清，而说不清的原因是一开始就没定义基线", "三段路线图 + 资产清单 + 风险台账，一次跑完三份材料", "「模拟银行 X」零售条线 PM 团队 8 人，提效目标 30%，被要求两周内出方案"]}, "ppt": {"method": "三段路线图 + 资产清单 + 风险台账，一次跑完三份材料", "case": "「模拟银行 X」零售条线 PM 团队 8 人，提效目标 30%，被要求两周内出方案", "demo": "WorkBuddy 内跑一遍：从「团队要提效 30%」到可评审的三份材料"}, "objective": "能把一份「团队要提效」的诉求，跑成三段路线图 + 资产清单 + 风险台账三份可评审材料", "transfer": "拿本部门最想做的一个 AI 事项，用这套提示词跑一遍，把三份材料发给主管预审", "vslides": [{"t": "本节要讲什么", "n": "这一节跑一个真实任务：8 个人的团队，三个月把四类材料耗时压三成，不许加人，客户明细不许出域。这种任务最容易写成口号。这一节讲三件事：怎么把任务书读成约束条件、三份材料各要什么硬要求、以及 AI 输出里必须人改的四处。看完你会看到一份能直接进评审会的方案。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"把任务书读成约束\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">把任务书读成约束</tspan></text></g><g data-k=\"三份材料的硬要求\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三份材料的硬要求</tspan></text></g><g data-k=\"必须人改的四处\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">必须人改的四处</tspan></text></g></svg>", "d": 30.41}, {"t": "任务书：三个月压 30%，不许加人", "n": "先看任务书。部门给的条件很硬：8 个人，负责申请、额度、贷后三条线；周报、纪要、竞品对比、话术整理四类材料占每人每周约 12 小时；三个月内把这四类耗时压 30%，且不新增编制。还有一条不能破的约束：客户级明细不得出域。这种任务最容易被写成一份漂亮的口号——全面引入 AI、打造智能中台、提效 30% 以上——然后在第一次评审会上被问死：省下的时间去哪了？返工呢？数据怎么保证不出门？所以这次我们不写口号，直接跑三份材料：带条件的路线图、资产清单、风险台账。三份齐了，这个方案才敢往上报。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">任务书要点</tspan></text><g data-k=\"8 人 · 三线并行\"><text x=\"52.0\" y=\"95.9\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">8 人 · 三线并行</tspan></text></g><g data-k=\"四类材料约 12h/人周\"><text x=\"52.0\" y=\"111.3\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">四类材料约 12h/人周</tspan></text></g><g data-k=\"目标：压 30% 不加人\"><text x=\"52.0\" y=\"126.7\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：压 30% 不加人</tspan></text></g><g data-k=\"约束：客户明细不出域\"><text x=\"52.0\" y=\"142.1\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">约束：客户明细不出域</tspan></text></g></svg>", "d": 58.34}, {"t": "跑三份材料：路线图、资产、风险", "n": "提示词里我把三件事写死了：三段路线图要给准入与退出条件、资产清单要写维护人、风险台账要含触发信号与按停权，并且所有比例必须标明计算方式、缺数据的地方写「需补测」。为什么要这么写？因为不写死，AI 一定给你一份「试点—推广—优化」的漂亮流程，看着完整，一条都执行不了。跑出来的结果里，最值钱的是试点段那句「不达标即停，不延期」——它把项目从「无限续命」变成「有截止的验证」。第二值钱的是资产清单里的维护人，它回答了「换人还能不能跑」。风险台账里我特意要求五类风险：数据、口径、返工、依赖、对外，这五类覆盖了金融 PM 团队用 AI 的实际翻车面。顺带说清一处细节：提示词里我要求「比例必须标计算方式」，AI 就不得不把「节省 30%」写成「按工时记录折算」，一句话把可核性拉回来了——这类约束要写进提示词，而不是等它写完再改。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三份材料的硬要求</tspan></text><g data-k=\"路线图：准入+退出\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">路线图：准入+退出</tspan></text></g><g data-k=\"资产清单：带维护人\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">资产清单：带维护人</tspan></text></g><g data-k=\"风险台账：五类覆盖\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">风险台账：五类覆盖</tspan></text></g><g data-k=\"比例：标计算方式\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">比例：标计算方式</tspan></text></g></svg>", "d": 79.8}, {"t": "人改的四处，和为什么必须改", "n": "这份输出直接交上去会被退回，因为四处硬伤。第一处，它把「压 30%」当成结果写，却没定义基线，我改成用返工率与工时记录来判定。第二处，原来只写里程碑不写退出条件，我补了「不达标即停」，这是让方案可信的唯一一句话。第三处，风险台账只有处置动作没有按停权，我补了每条的按停人，否则出事后就是集体负责等于没人负责。第四处，AI 顺手加了「同业平均提效 40%」的对标，无法核实，直接删。这四处有个共同点：都是「看起来更专业」的加法，而真正让方案过关的是减法——把说不清的删掉，把能验证的写上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四处必改</tspan></text><g data-k=\"补基线口径\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">补基线口径</tspan></text></g><g data-k=\"补退出条件\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">补退出条件</tspan></text></g><g data-k=\"补按停权\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">补按停权</tspan></text></g><g data-k=\"删无源对标\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">删无源对标</tspan></text></g></svg>", "d": 58.82}, {"t": "小结与接下来", "n": "小结三句。第一，方案死在说不清省了多少，根子是一开始没定义基线。第二，三份材料的要求要写死在提示词里：路线图给退出条件、资产清单给维护人、台账给按停权。第三，AI 的加法要删、减法要补——删无法核实的对标，补基线与按停权。接下来做任务：拿本部门最想做的一个事项，用同一套提示词跑三份材料，发
