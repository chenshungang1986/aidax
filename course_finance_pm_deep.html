    return null;
  }
  function mods(){ try{ return (typeof COURSE!=='undefined'&&COURSE&&COURSE.modules)||[]; }catch(e){ return []; } }
  function pg(){ try{ return (typeof prog!=='undefined'&&prog)||{units:{}}; }catch(e){ return {units:{}}; } }
  function stOf(u){ var p=pg(); return (p.units&&p.units[u.id])||{}; }
  function stat(){
    var ms=mods(),total=0,done=0,sc=0,scn=0;
    ms.forEach(function(m){ (m.units||[]).forEach(function(u){
      total++; var st=stOf(u);
      if(st.done) done++;
      if(typeof st.score==='number'){ sc+=st.score; scn++; }
    }); });
    return {total:total,done:done,pct:total?Math.round(done/total*100):0,avg:scn?Math.round(sc/scn):null};
  }
  function mins(u){ var d=(u&&u.video&&u.video.dur)||''; var m=String(d).match(/([\d.]+)/); return m?parseFloat(m[1]):0; }
  function plan(n){
    var out=[]; mods().forEach(function(m){ (m.units||[]).forEach(function(u){
      if(out.length>=n) return; if(!stOf(u).done) out.push({m:m,u:u});
    }); }); return out;
  }
  function pctBar(p){ return '<div class="lc-bar"><i style="width:'+Math.min(100,Math.max(0,p))+'%"></i></div>'; }

  function render(){
    var s=sess(), nm=(s.name||s.user||''), co=s.company||'', emp=myEmp(s), st=stat();
    var logged=!!(s&&(s.user||s.name));
    var roleTxt=(emp&&ROLE[emp.role])||'', indTxt=(emp&&IND[emp.industry])||'';
    var isGuest=(s&&s.loginType==='guest');
    var who=logged?(isGuest?(s.company||nm||'游客'):(nm||'已登录')):'未登录';
    var sub=!logged?'未登录 · 记录只存这台设备'
      :(isGuest?'游客身份 · 记录只存这台设备'
      :([co,roleTxt&&indTxt?(roleTxt+' × '+indTxt):(roleTxt||indTxt)].filter(Boolean).join(' · ')||'记录只存这台设备'));
    var h='<div class="lc-top"><div class="lc-av'+(logged?'':' guest')+'">'+(logged?esc(who).slice(0,1):'游')+'</div>'
      +'<div style="min-width:0"><div class="lc-hn">'+esc(who)+'</div><div class="lc-hm">'+esc(sub)+'</div></div>'
      +'<button class="lc-x" onclick="lcClose()" aria-label="关闭">✕</button></div><div class="lc-bd">';

    /* ① 最近测评 */
    var emTxt=(!logged?'本机记录':'')+((emp&&emp.date)?((logged?'':' · ')+esc(emp.date)):'');
    h+='<div class="lc-sec"><div class="lc-st">我的测评<em>'+emTxt+'</em></div>';
    if(emp){
      var qs=Array.isArray(emp.quizScores)?emp.quizScores:[];
      var base=(emp._baseResult&&typeof emp._baseResult.pct==='number')?emp._baseResult.pct:null;
      var skills=SKILL[emp.role]||[];
      var avg=qs.length?Math.round(qs.reduce(function(a,b){return a+(+b||0);},0)/qs.length*10)/10:null;
      h+='<div class="lc-grid">'
        +'<div class="lc-num"><b>'+(base!=null?base+'<small>%</small>':'—')+'</b><span>基础素养</span></div>'
        +'<div class="lc-num"><b>'+(avg!=null?avg+'<small>/4</small>':'—')+'</b><span>岗位能力均值</span></div>'
        +'<div class="lc-num"><b>'+(typeof emp.finalScore==='number'?emp.finalScore:'—')+'</b><span>结课测验</span></div></div>';
      var weak=[];
      qs.forEach(function(v,i){ if(typeof v==='number' && v<=1 && skills[i]) weak.push(skills[i]); });
      if(weak.length) h+='<div style="margin-top:9px">'+weak.slice(0,4).map(function(w){ return '<span class="lc-weak">短板 · '+esc(w)+'</span>'; }).join('')+'</div>';
      h+='<div class="lc-line" style="margin-top:8px">测评用于定学习起点；短板项对应的课程在等你的学习地图里已前置。</div>';
    } else {
      h+='<div class="lc-empty">还没有测评记录。先花 8 分钟测一次，课程会按你的短板排顺序，而不是从头刷到尾。<a href="app.html" style="color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap">去测一测 →</a></div>';
    }
    h+='</div>';

    /* ② 本课进度 */
    h+='<div class="lc-sec"><div class="lc-st">本课进度<em>'+(st.total||'—')+' 单元</em></div>'
      +pctBar(st.pct)
      +'<div class="lc-line"><b>'+st.pct+'%</b> · 已完成 <b>'+st.done+'</b> / '+st.total+' 单元'
      +(st.avg!=null?' · 练习均分 <b>'+st.avg+'</b>':'')+'</div></div>';

    /* ③ 接下来学什么 */
    var nx=plan(3), sum=0; nx.forEach(function(x){ sum+=mins(x.u); });
    h+='<div class="lc-sec"><div class="lc-st">接下来学什么<em>'+(nx.length?'约 '+Math.max(1,Math.round(sum))+' 分钟':'')+'</em></div>';
    if(nx.length){
      nx.forEach(function(x,i){
        h+='<div class="lc-item" onclick="lcGo(\''+x.u.id+'\')">'
          +'<span class="u'+(i===0?' next':'')+'">'+(i===0?'下一步':x.u.id)+'</span>'
          +'<span class="t">'+esc(x.u.title)+'</span>'
          +'<span class="d">'+(mins(x.u)?Math.round(mins(x.u))+' 分':'')+'</span></div>';
      });
    } else {
      h+='<div class="lc-empty">这门课的单元都过了。可以回学习地图看下一门，或重看任意一节的演示。</div>';
    }
    h+='</div></div>';

    /* 底部出口 */
    h+='<div class="lc-foot"><a class="lc-btn" href="app.html">学习地图 / 我的记录</a>'
      +'<button class="lc-btn pri" onclick="lcNext()">继续学习</button>'
      +(logged?'<button class="lc-btn danger" onclick="lcLogout()" title="退出登录">退出</button>':'')+'</div>';
    return h;
  }

  window.lcOpen=function(){
    if(typeof _axWatch==='function'&&_axWatch()) return;   // v162：换人了，等重载完再说
    document.getElementById('lc-body').innerHTML=render();
    document.getElementById('lc-mask').classList.add('on');
    document.getElementById('lc-drawer').classList.add('on');
  };
  window.lcClose=function(){
    document.getElementById('lc-mask').classList.remove('on');
    document.getElementById('lc-drawer').classList.remove('on');
  };
  window.lcGo=function(uid){
    lcClose();
    try{ if(typeof openUnit==='function'){ openUnit(uid); return; } }catch(e){}
    try{ prog.cur=uid; openUnit(uid); }catch(e){}
  };
  window.lcNext=function(){
    var nx=plan(1);
    if(nx.length){ lcGo(nx[0].u.id); }
    else { lcClose(); try{ if(typeof toast==='function') toast('这门课的单元都完成了'); }catch(e){} }
  };
  window.lcLogout=function(){
    if(!confirm('退出后学习进度仍留在这台设备上，但下次要重新登录。确定退出？')) return;
    try{ localStorage.removeItem('ai_training_session'); }catch(e){}
    location.href='app.html';
  };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') lcClose(); });

  /* 顶栏账号 chip 随登录态刷新（切号回来不用刷新页面） */
  function paint(){
    var s=sess(), nm=s.name||s.user||'';
    var av=document.getElementById('lc-av'), tx=document.getElementById('lc-nm');
    if(!av) return;
    if(nm){ av.textContent=nm.slice(0,1); av.classList.remove('guest'); tx.textContent=nm.length>6?nm.slice(0,6)+'…':nm; }
    else { av.textContent='游'; av.classList.add('guest'); tx.textContent='我的学习'; }
  }
  paint();
  window.addEventListener('storage',function(e){ if(e.key==='ai_training_session') paint(); });
  try{ new MutationObserver(paint).observe(document.body,{childList:true,subtree:false}); }catch(e){}
})();
</script>
<!--LC:END-->
</body>
