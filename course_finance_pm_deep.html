vg>", "d": 35.33}], "deliverable": {"type": "skill", "name": "PRD 生成师", "rubric": ["结构齐全", "取舍明确", "可评审"], "acceptance": "一页内八段齐全：目标带指标口径基线、功能 ≤6 条、异常分支 ≥3、风控为待确认项、验收可判定"}, "practice": {"steps": ["写背景与目标：目标必须带指标、口径、基线，缺一样就标「需补数据」", "写用户与场景 + 功能清单：功能不超过 6 条，每条一句可建单的描述", "写流程与状态 + 风控与合规：异常分支至少 3 个，风控只列待确认不写规则", "写指标埋点 + 边界不做 + 验收口径：验收每条都能判定，标评估窗口"], "exemplar": "【《最小 PRD》· 被拒客户复申引导】提出人：运营　版本：v0.1\n\n■ 1. 背景与目标\n　现状：拒绝后 90 天可复申，近三个月复申率 6%（口径：被拒客户中 90 天内再次提交的比例）\n　目标：30 天复申率从 6% 提升到 12%（口径同上；基线待核：6% 是否含系统拦截客户）\n　⚠ 取舍：与「控制不良率」冲突，需业务明确优先级，我倾向先小范围灰度\n\n■ 2. 用户与场景\n　用户：近 90 天被拒未复申客户，约 3,480 人（占申请人 29%），场景为被拒后想知道还能不能借\n\n■ 3. 功能清单（6 条）\n　1. 拒绝页展示最早可复申时间与需补材料清单\n　2. 拒绝页提供改善路径三条（补收入证明 / 降负债 / 等查询记录冷却）\n　3. 材料支持预上传并在提交前校验完整性\n　4. 到期前推送一次「条件已更新」提醒\n　5. App 首页「我的额度」保留复申入口\n　6. 客服知识库同步复申口径\n\n■ 4. 流程与状态\n　主流程：拒绝 → 展示条件 → 补材料（可选）→ 冷却期 → 提醒 → 复申 → 审批\n　异常分支：冷却期未满提前提交 / 材料校验不通过 / 复申再次被拒（二次冷却）\n\n■ 5. 风控与合规（待确认）\n　风控：缩短至 30 天是否触发反欺诈规则；二次被拒冷却期是否延长；查询频次是否触及征信限制\n　合规：材料预上传的影像留存要求；拒绝原因表述的合规审核\n\n■ 6. 指标与埋点\n　指标：复申率、复申通过率、拒绝页停留时长、预上传率\n　埋点：拒绝页曝光、改善路径点击、预上传开始/成功、提醒送达/点击、复申提交\n\n■ 7. 边界与不做\n　不做：不降低准入标准；不做「包过」承诺；不主动外呼营销；不改额度模型\n　合规红线：拒绝原因不得出现「保证通过」类表述\n\n■ 8. 验收口径\n　① 拒绝页 100% 展示复申时间与材料清单　② 提醒送达率 ≥95%\n　③ 异常分支均有明确提示且可回退　④ 30 天复申率 ≥12%\n　评估窗口：上线后 4 周"}, "task": "产出《PRD 生成师》：写背景与目标：目标必须带指标、口径、基线，缺一样就标「需补数据」；写用户与场景 + 功能清单：功能不超过 6 条，每条一句可建单的描述；写流程与状态 + 风控与合规：异常分支至少 3 个，风控只列待确认不写规则；写指标埋点 + 边界不做 + 验收口径：验收每条都能判定，标评估窗口", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的消费金融 AI 产品经理。本单元属于「M3 AI 辅助 PRD 与产品定义」模块，你要交付的是《PRD 生成师》。\n【场景】业务侧这周的诉求是：PRD 写不完，多半是想一次写全；最小版只要求每段给结论，反而更容易过会。参考做法：某团队用一页最小 PRD 替代十页文档，评审时长从 90 分钟降到 30 分钟。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（最小 PRD 模板（八段，每段限字，逼你说清）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《最小 PRD》填写模板】需求名：{{}}　提出人：{{}}　版本：v0.1\n\n■ 1. 背景与目标\n　现状：{{一句现状 + 一个数字，注明口径}}\n　目标：{{指标 + 从多少到多少 + 口径 + 基线来源}}\n　⚠ 取舍与冲突：{{这个目标和哪个目标冲突，需谁拍板}}\n\n■ 2. 用户与场景\n　用户：{{哪一层客群，多少人}}　场景：{{什么时候、在哪、想做什么}}\n\n■ 3. 功能清单（≤6 条，每条可建单）\n　1. {{改哪个页面 / 加什么字段 / 给什么提示}}\n　2. {{}}\n\n■ 4. 流程与状态\n　主流程：{{}}\n　异常分支：{{至少 3 个}}\n\n■ 5. 风控与合规（只列待确认，不写规则）\n　待风控确认：{{}}\n　待合规确认：{{}}\n\n■ 6. 指标与埋点\n　指标：{{}}　埋点：{{}}\n\n■ 7. 边界与不做\n　不做：{{}}　合规红线：{{}}\n\n■ 8. 验收口径\n　① {{可判定}}　② {{}}　③ {{}}\n　评估窗口：{{上线后几周}}", "rubric": ["目标段有指标、口径、基线三样，缺的标注「需补数据」并写补法", "功能清单 ≤6 条，每条写到可建单（改哪个页面、加什么字段）", "流程段含至少 3 个异常分支；风控段只列待确认项，不出现自定规则", "边界与不做至少两条（含合规红线），验收口径每条可判定并给评估窗口"]}, {"id": "M3U4", "tier": "basic", "step": "spar", "title": "评审挑 3 个尖锐问题", "video": {"dur": "4.6min", "script": ["评审不是挑刺，是替你把上线后会被追责的地方提前问一遍", "角色陪练：研发与风控混合评审，专挑口径、异常与责任", "某 PRD 因「异常分支没写」被退回，返工后发现真实分支比原稿多五个"]}, "ppt": {"method": "角色陪练：研发与风控混合评审，专挑口径、异常与责任", "case": "某 PRD 因「异常分支没写」被退回，返工后发现真实分支比原稿多五个", "demo": "陪练演示：把「大概能提升」追到基线与口径"}, "objective": "能在评审四轮追问下守住 PRD 的取舍与验收口径，不靠「后面再细化」过关", "transfer": "评审前把最可能被问的四个问题写下来，各准备一句带数字、带出处的回答", "vslides": [{"t": "本节要讲什么", "n": "这一节是评审陪练。研发与风控一起问，问题集中在四类：目标凭什么定、规则谁同意、异常怎么拦、后续怎么收。这一节讲三件事：四类问题的合格答法、回答的四个要素、以及被问住时的正确姿势。练完你要能撑住四轮。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"四类问题\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">四类问题</tspan></text></g><g data-k=\"回答四要素\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">回答四要素</tspan></text></g><g data-k=\"被问住怎么办\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">被问住怎么办</tspan></text></g></svg>", "d": 26.86}, {"t": "评审问的四类问题", "n": "评审会上，问题基本落在四类：目标凭什么这么定、规则谁同意了、异常怎么拦、后续怎么收。这四类不是为难你，是替你把上线后会被追责的地方提前过一遍。第一类查的是你有没有数；第二类查的是你有没有越权；第三类查的是你有没有穷举；第四类查的是你有没有想过最坏情况。你要练的是每一类都能给出可判定的回答：数字带口径，规则带签字人，异常带拦截层，收尾带处理路径。给不出，就会被要求补件；补件的代价不是多写两页，是排期整体往后推一周。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四类问题</tspan></text><g data-k=\"目标凭什么\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">目标凭什么</tspan></text></g><g data-k=\"规则谁同意\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">规则谁同意</tspan></text></g><g data-k=\"异常怎么拦\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">异常怎么拦</tspan></text></g><g data-k=\"后续怎么收\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">后续怎么收</tspan></text></g></svg>", "d": 57.94}, {"t": "三类必被追问的合格答法", "n": "第一类，目标。不合格：「大概能提升一倍」。合格：「基线 6% 是近 90 天口径，同类公开案例在 8% 到 15%，我取 12%，灰度先跑 10% 流量」。第二类，规则。不合格：「风控那边应该没问题」。合格：「这一条列在待确认第一项，风控负责人周三会上给结论，未确认前不上线」。第三类，异常。不合格：「前端会提示」。合格：「接口层校验冷却期，提前提交返回明确错误码，前端提示只是辅助」。看出共同点了吗？合格的回答都具体到层、到人、到时间。评审不需要你什么都会，需要你知道自己哪里不会、打算怎么补。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">回答四要素</tspan></text><g data-k=\"数字带口径\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">数字带口径</tspan></text></g><g data-k=\"规则带签字人\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">规则带签字人</tspan></text></g><g data-k=\"异常带拦截层\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">异常带拦截层</tspan></text></g><g data-k=\"收尾带路径\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">收尾带路径</tspan></text></g></svg>", "d": 64.97}, {"t": "被问住时的正确姿势", "n": "被问住很正常，尤其是异常分支和风控规则这两块。正确姿势三步：承认、定位、给时间。承认——「这一条我没考虑到」；定位——「影响的是冷却期内提前提交这个分支，风险等级我判断为中」；给时间——「我今天补一版分支说明，明天中午前发群里」。最差的三种反应：一是硬编一个答案，二是说「后面细化」，三是把责任推给风控或研发。这三种在评审眼里都是同一个信号：这个人不打算为这份 PRD 负责。反过来，敢于说「这条我不知道，我明天给你」的人，往往更容易拿到通过，因为评审要的是可控，不是完美。再补一点：被问住后补上的内容，要在下一轮评审开头主动复述一遍，让对方知道他的问题被记住了，这比任何解释都有用。同样地，补件交得太快也不好，说明你只是在应付；留出半天想一遍再交，质量差别很大。补件质量的标准只有一个：对方看完不需要再问第二遍。做到这点通常意味着你补的是分支与口径，不是措辞。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">被问住三步</tspan></text><g data-k=\"承认没考虑到\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">承认没考虑到</tspan></text></g><g data-k=\"定位影响面\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">定位影响面</tspan></text></g><g data-k=\"给补件时间\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">给补件时间</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 84.72}, {"t": "小结与接下来", "n": "小结三句。第一，合格的回答都具体到层、到人、到时间，例如接口层校验、风控负责人周三给结论。第二，别硬编、别说后面细化、别把责任推给别人，这三种在评审眼里是同一个信号。第三，敢于说「这条我明天给你」的人更容易过，因为评审要可控不要完美。接下来做任务：评审前把最可能被问的四个问题写下来，各准备一句带数字的回答。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"回答要到层到人\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">回答要到层到人</tspan></text></g><g data-k=\"三种失分反应\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">三种失分反应</tspan></text></g><g data-k=\"给补件时间\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">给补件时间</tspan></text></g><g data-k=\"任务：预写四问\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：预写四问</tspan></text></g></svg>", "d": 41.23}], "deliverable": {"type": "agent", "name": "PRD 生成师", "rubric": ["口径清楚", "异常周全", "责任明确"], "acceptance": "四轮追问下每次都能给出数字、分支或签字人，不用「后面细化」拖延"}, "spar": {"role": "评审会主持人（研发 + 风控混合）", "persona": "只问可判定的事：口径、异常分支、谁签字；对「应该」「后续细化」零容忍", "mustAsk": ["你这个 12% 是怎么定出来的？基线 6% 的口径里含不含系统拦截的客户？", "冷却期从 90 天缩到 30 天，风控同意了吗？谁签的字？", "用户在冷却期内通过接口绕过前端提交，你怎么拦？", "复申又被拒的那批人怎么处理？会不会反复推送骚扰？"]}, "exemplar": "四问的合格答法（对照自查）：\n1. 目标凭什么定 12% → 「基线 6% 是近 90 天口径，同类项目行业公开案例在 8%–15%，我取中位偏保守；灰度先跑 10% 流量。」\n2. 冷却期缩短，风控同意了吗 → 「没有，这一条列在待确认第一项，风控负责人周三评审会说结论；未确认前不上线。」\n3. 用户绕过冷却期提交怎么办 → 「接口层校验冷却期，前端提示只是辅助；提前提交返回明确错误码并引导查看条件。」\n4. 复申又被拒怎么处理 → 「进二次冷却 90 天，页面提示原因与下次时间，同时不重复推送提醒，避免骚扰。」\n反面：「这些细节后面再细化」「风控那边应该没问题」——两句都会让评审当场要求补件。", "task": "把《PRD 生成师》拿到「评审会主持人（研发 + 风控混合）」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《PRD 生成师》。现在要让它通过「评审会主持人（研发 + 风控混合）」这一关。\n【对手的立场】只问可判定的事：口径、异常分支、谁签字；对「应该」「后续细化」零容忍。\n【他一定会追问】「你这个 12% 是怎么定出来的？基线 6% 的口径里含不含系统拦截的客户？」 / 「冷却期从 90 天缩到 30 天，风控同意了吗？谁签的字？」 / 「用户在冷却期内通过接口绕过前端提交，你怎么拦？」\n【场景】你说「评审挑 3 个尖锐问题」，对方立刻回一句：你这个 12% 是怎么定出来的？基线 6% 的口径里含不含系统拦截的客户？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M3U5", "tier": "adv", "step": "understand", "title": "多角色 PRD 与风控/验收口径", "video": {"dur": "4.8min", "script": ["一份 PRD 有四个读者，写给一个人看，另外三个人就会在评审会上替你提问题", "四视角检查表（风控 / 研发 / 合规 / 运营）+ 验收口径三件套", "某 PRD 因验收口径写「体验流畅」被风控退回，补成三个可测指标后一次通过"]}, "ppt": {"method": "四视角检查表（风控 / 研发 / 合规 / 运营）+ 验收口径三件套", "case": "某 PRD 因验收口径写「体验流畅」被风控退回，补成三个可测指标后一次通过", "demo": ""}, "objective": "能把一份 PRD 拆成风控、研发、合规、运营四个视角各要看的那一节，并补齐验收口径", "transfer": "本周把在做的 PRD 按四个视角标一遍，把缺的那一节补齐之后再发出去", "vslides": [{"t": "本节要讲什么", "n": "这一节讲 PRD 的四个读者：风控、研发、合规、运营。同一份文档四个人看四节，你缺一节，就有一个人会在会上替你问问题。这一节讲三件事：四个读者各看什么、验收口径怎么写才判得了、以及产品与风控的三处天然冲突怎么摆到桌面上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"四个读者看什么\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">四个读者看什么</tspan></text></g><g data-k=\"验收三件套\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">验收三件套</tspan></text></g><g data-k=\"冲突摆上桌\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">冲突摆上桌</tspan></text></g></svg>", "d": 28.08}, {"t": "四个读者，四套关注点", "n": "PRD 在金融业务里有四个读者。风控看两件事：准入条件变没变、会不会抬高不良率；研发看三件：状态机全不全、异常分支有没有漏、接口和字段清不清楚；合规看两件：对客表述有没有承诺收益或保证通过、数据采集有没有超范围；运营看两件：话术怎么改、什么时候能上。同一份文档四个人看四节，你只要缺一节，对应那个人就会在会上替你问问题。所以写完之后做一次「四视角走查」：假装自己是风控，从头翻一遍找准入；假装自己是研发，找状态与异常；假装合规，找对客表述；假装运营，找上线时间与话术。十分钟能走完，能省掉一轮评审。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四个读者</tspan></text><g data-k=\"风控：准入与不良\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">风控：准入与不良</tspan></text></g><g data-k=\"研发：状态与异常\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">研发：状态与异常</tspan></text></g><g data-k=\"合规：表述与采集\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">合规：表述与采集</tspan></text></g><g data-k=\"运营：话术与时间\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">运营：话术与时间</tspan></text></g></svg>", "d": 66.22}, {"t": "验收口径三件套：指标、门槛、测法", "n": "验收口径最常被写成形容词：体验流畅、风险可控、效率提升。这类写法必然被退回，因为它无法判定项目是否完成。合格写法有三件套：指标、门槛值、测量方式。指标要落到能取到的数据，比如「拒绝页复申时间展示率」；门槛值要具体，比如「100% 展示」；测量方式要写清谁在什么时候取数，比如「上线后每周由数据 PM 从埋点表取，连续两周达标」。三件套齐了，项目才有结项条件；缺一件，就会陷入「感觉差不多了」的拉扯。风控尤其在意这一条，因为他们要评估的是「这个改动会不会悄悄放宽准入」，如果你连指标都没定义，他们只能默认最坏情况。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">验收三件套</tspan></text><g data-k=\"指标：能取到\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">指标：能取到</tspan></text></g><g data-k=\"门槛：具体值\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">门槛：具体值</tspan></text></g><g data-k=\"测法：谁何时取\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">测法：谁何时取</tspan></text></g><g data-k=\"责任：谁签字\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">责任：谁签字</tspan></text></g></svg>", "d": 61.85}, {"t": "冲突要摆到桌面上", "n": "产品与风控有三处天然冲突：通过率与不良率、时效与审核强度、体验与材料要求。这三处不可能同时最优，必须有人拍板。PRD 里应该有一节专门写这个：本方案在哪一处做了让步、让给谁、代价是什么。比如「为提升 30 天复申率，接受不良率上升 0.2 个百分点以内的风险，超过则回滚」。这句话写进 PRD，评审时就不用争；不写，风控一定会在会上问，而那时你没有准备，只能答应最保守的方案。还有一个细节：写明谁签字。风控签字的不只是规则，还有「这个让步我认了」。没有签字人的让步，等于把风险留给未来某个背锅的人。补一句：这三处冲突不要试图一次谈完，一次谈一处，谈完写进纪要，第二次会上先复述上一处的结论再谈下一处，效率反而高。还有一个技巧：每次都带一个可量化的止损值上会，比如不良率上升不超过 0.2 个百分点，谈判就有了锚。止损值要提前和数据同事对过，不能会上现算。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"冲突要写明让给谁\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">冲突要写明让给谁</tspan></text></g><g data-k=\"让步要有量化上限\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">让步要有量化上限</tspan></text></g><g data-k=\"让步要有人签字\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">让步要有人签字</tspan></text></g></svg>", "d": 87.43}, {"t": "小结与接下来", "n": "小结三句。第一，风控看准入与不良、研发看状态与异常、合规看表述与采集、运营看话术与时间。第二，验收口径要三件套：指标能取到、门槛是具体值、测法写清谁何时取。第三，产品与风控在通过率、时效、材料三处天然冲突，让步要量化上限并写明谁签字。接下来做任务：把在做的 PRD 按四视角标一遍，缺的那一节补上再发出去。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"四个读者\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">四个读者</tspan></text></g><g data-k=\"验收三件套\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">验收三件套</tspan></text></g><g data-k=\"冲突量化\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">冲突量化</tspan></text></g><g data-k=\"任务：四视角走查\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：四视角走查</tspan></text></g></svg>", "d": 42.67}], "deliverable": {"type": "skill", "name": "风控 PRD 生成", "rubric": ["视角齐全", "口径可测", "边界清楚"], "acceptance": "能指出 PRD 里四个角色各自要看的那一节，并把验收口径写成可测指标与门槛"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】四视角检查表（风控 / 研发 / 合规 / 运营）+ 验收口径三件套\n【为什么重要】一份 PRD 有四个读者，写给一个人看，另外三个人就会在评审会上替你提问题\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["四个视角各说出「他要看哪一节、看不到会问什么」，不只写「要考虑各方诉求」", "验收口径至少三条可测指标，每条有门槛值与测量方式，不出现「流畅」「稳定」这类词", "能指出风控与产品在哪些点上天然冲突（通过率 / 不良率 / 时效），并给出处理方式", "写明谁对哪条口径负责，不写「团队共同确认」"]}, {"id": "M3U6", "tier": "adv", "step": "demo", "title": "含风控策略 + 埋点的完整 PRD", "video": {"dur": "4.6min", "script": ["自助提额这类需求，风险不在功能，在于「谁能提、提多少、什么情况下不给」没写清", "风控段专项 + 状态机穷举 + 埋点四层（曝光/点击/提交/结果）", "「闪电贷」提额申请：把额度调整做成用户可自助申请（原为人工评估）"]}, "ppt": {"method": "风控段专项 + 状态机穷举 + 埋点四层（曝光/点击/提交/结果）", "case": "「闪电贷」提额申请：把额度调整做成用户可自助申请（原为人工评估）", "demo": "WorkBuddy 内跑一遍：完整 PRD → 人改三处 → 标出风控签字点"}, "objective": "能跑出一份含风控策略、状态机与埋点的完整 PRD，并说清哪三处必须风控签字", "transfer": "用这套提示词跑一个含风控的需求，拿着三处签字点去找风控预沟通", "vslides": [{"t": "本节要讲什么", "n": "这一节跑一个含风控的完整需求：把人工提额改成用户自助申请。这类需求的风险不在功能，在五个判定点有没有写清。这一节讲三件事：判定点怎么只列不定、状态机的异常怎么穷举、以及埋点为什么要分四层。看完你会看到一份风控愿意接的 PRD。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"判定点只列不定\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">判定点只列不定</tspan></text></g><g data-k=\"异常要穷举\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">异常要穷举</tspan></text></g><g data-k=\"埋点分四层\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">埋点分四层</tspan></text></g></svg>", "d": 29.5}, {"t": "这类需求的风险不在功能，在判定点", "n": "自助提额看起来是个前端功能，实际上是把一个风控决策搬到了用户面前。功能本身一小时能画完，真正要写清的是五个判定点：谁有资格提、能提多少、多久能提一次、什么情况转人工、拒绝后怎么解释。这五点一个没写清，上线后就会出现两类事故：一类是该拒的通过了，一类是客户反复提交。所以这份 PRD 的重心不在功能清单，而在风控策略段。写这一段的正确姿势是「列点不定值」：你把要判定的点全列出来，把阈值留给风控填。这样既显示你懂业务，又不越权。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五个判定点</tspan></text><g data-k=\"谁有资格\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">谁有资格</tspan></text></g><g data-k=\"能提多少\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">能提多少</tspan></text></g><g data-k=\"多久提一次\"><rect x=\"18.0\" y=\"96.7\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">多久提一次</tspan></text></g><g data-k=\"什么情况转人工\"><rect x=\"209.0\" y=\"96.7\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">什么情况转人工</tspan></text></g><g data-k=\"拒绝怎么解释\"><rect x=\"18.0\" y=\"149.3\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">拒绝怎么解释</tspan></text></g></svg>", "d": 52.1}, {"t": "状态机与埋点：AI 最容易漏的地方", "n": "状态机是 AI 最容易写漂亮也最容易漏的地方。它会给一条完美主路径：提交、校验、通过、生效。但真实系统里，超时、服务不可用、额度生效失败这三种情况天天发生，没写就会在现场变成工单。所以我在提示词里要求「穷举所有状态与迁移条件，含异常与超时分支」，跑出来补上了三个异常。埋点同理，AI 喜欢一次性列三十个字段，但没说清每个字段怎么取值。我要求按四层给：曝光、点击、提交、结果，每层标字段与上报时机。四层的用处是能算漏斗：曝光多少人、点进来多少、提交多少、结果分布如何。没有分层，你只有一堆点，算不出任何比例。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"异常分支必穷举\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">异常分支必穷举</tspan></text></g><g data-k=\"超时要转人工\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">超时要转人工</tspan></text></g><g data-k=\"埋点分四层\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">埋点分四层</tspan></text></g><g data-k=\"字段要能取值\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">字段要能取值</tspan></text></g></svg>", "d": 59.28}, {"t": "三处必须风控签字", "n": "这份 PRD 有三处必须风控签字：准入条件、额度上限、频次与冷却。为什么必须签？因为这三处任何一处放宽，损失都是钱，而且是持续性损失。我在文末专门列了一行「需风控签字」，把四处判定点写在一起，方便风控一次性看完。这一行的作用在评审会上很明显：当你把签字点主动列出来，风控的反应通常是「我们一起过一遍」，而不是「你凭什么定这个」。同一个内容，主动列出与被动追问，得到的合作态度完全不同。另外对客表述要过合规，尤其是拒绝原因那一句，别写「综合评分不足」这种既模糊又容易引发投诉的说法。最后提醒一个时间点：这份 PRD 最好在评审前两周就把风控段单独发过去，让对方有时间算敞口；当场才给，通常只能得到一个保守结论。提前沟通还有一个隐形收益：你会提前知道哪一条会被否，从而在 PRD 里就把它写成待确认，而不是写死了再改。这一条在跨部门合作里尤其省事，改一处文字比改一段逻辑便宜得多。这也是把不确定提前说出来的实际好处：成本差别是周与小时的区别。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">签字流程</tspan></text><g data-k=\"列判定点\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">列判定点</tspan></text></g><g data-k=\"标待确认\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">标待确认</tspan></text></g><g data-k=\"一次性请签\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">一次性请</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">签</tspan></text></g><g data-k=\"合规审表述\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">合规审表</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">述</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 94.25}, {"t": "小结与接下来", "n": "小结三句。第一，风控段只列判定点、阈值写待确认，替风控定阈值会让对方立刻防御。第二，状态机的价值全在异常分支：超时、降级、生效失败，这三条不写，上线第一周就堆工单。第三，埋点按曝光、点击、提交、结果四层给，才能拉出漏斗，否则只有一堆点算不出比例。接下来做任务：用这套提示词跑一个含风控的需求，拿着三处签字点去找风控预沟通。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"只列不定\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">只列不定</tspan></text></g><g data-k=\"异常穷举\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">异常穷举</tspan></text></g><g data-k=\"四层埋点\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">四层埋点</tspan></text></g><g data-k=\"任务：预沟通\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：预沟通</tspan></text></g></svg>", "d": 43.58}], "deliverable": {"type": "skill", "name": "风控 PRD 生成", "rubric": ["风控可审", "状态穷举", "埋点可算"], "acceptance": "能产出《风控 PRD 生成》并通过本单元评分要点"}, "demo": {"ref": "■ 一、目标与现状\n 现状：提额申请 4,200 笔/90 天，人工通过率 38%，平均处理 3.2 个工作日\n 目标：自助提额占比 ≥60%，处理时长中位数 ≤10 分钟，通过率不低于人工基线 38%（-3pt 容差）\n\n■ 二、风控策略段（全部待确认，不自行设阈值）\n 1. 准入：需满足的账户与还款条件 —— 待风控确认（建议项：近 6 期无逾期、当前无在贷逾期）\n 2. 额度上限：单次提额与累计提额的封顶规则 —— 待风控确认\n 3. 频次：30 天内可申请次数、被拒后冷却期 —— 待风控确认\n 4. 触发转人工的情形：命中反欺诈规则、额度请求超过模型区间上限 —— 待风控确认\n 5. 拒绝后的展示口径：可解释原因分类 —— 待风控与合规共同确认\n\n■ 三、状态机\n 待申请 → 已提交 → 校验中 → 自动通过（额度即时生效）\n → 转人工（进入人工队列，SLA 1 个工作日）\n → 自动拒绝（展示原因与下次可申请时间）\n 异常分支：提交中断（草稿保留 24 小时）、校验超时（30 分钟未返回 → 转人工）、\n 风控服务不可用（降级为转人工并提示）、额度生效失败（回滚并告警）\n\n■ 四、埋点（四层）\n\n■ 五、边界与不做\n 不做：不主动向未达标客户推送提额邀请；不做「提额成功」的营销外呼；不改动既有额度模型\n 合规：所有对客表述不得出现「保证提额」「必过」；提额结果须给出可解释原因\n\n■ 六、验收口径\n ① 自助渠道占比 ≥60%（口径：自助提交 ÷ 总提额申请，上线后 4 周）\n ② 处理时长中位数 ≤10 分钟（口径：提交到结果，剔除转人工）\n ③ 通过率 ≥35%（人工基线 38% 减 3pt 容差）\n ④ 五个异常分支均有提示且可回退（逐项走查，含超时与降级）\n\n⚠ 需风控签字：准入条件、额度上限、频次与冷却、转人工触发；需合规审核：对客表述与原因分类。", "fix": ["把 AI 写的「由模型综合评估决定是否提额」整段删掉——这句话在风控眼里等于把责任推给模型，评审必退。", "风控段从「给阈值」改成「列判定点 + 待确认」，并加了五个具体判定项，风控拿到就能直接拍。", "状态机补了三个异常分支：校验超时、风控服务不可用、额度生效失败——AI 只给了正常路径和拒绝。", "验收口径补了口径与观察窗口（上线后 4 周、剔除转人工），否则中位数 10 分钟这个数无法判定。"], "judge": "判断依据：风控段是否只列待确认而不自定阈值；状态机是否穷举异常与超时；埋点是否分四层且字段可取值；验收是否带口径与窗口", "sheet": {"situ": "你是「闪电贷」的产品经理，正在把人工提额改成自助申请。助理整理出 6 条 PRD 片段，你要逐条判断：属于哪一块、有没有把责任写清、能不能给风控签字。", "ask": "① 判断这段属于哪一块（判定点 / 状态机 / 埋点 / 验收）；② 指出主要问题；③ 判定风控能否签字；④ 写一句改法。", "gen": "请基于以上判定，输出：① 两条判定点的替换版本（待确认表述）；② 状态机四个异常分支的完整写法；③ 四条可判定的验收口径（含责任角色）。", "mats": [{"id": "R01", "src": "PRD 段 1", "text": "准入条件：近 6 期无逾期、当前无在贷逾期，满足即可自助提额。"}, {"id": "R02", "src": "PRD 段 2", "text": "单次提额上限 5 万元，累计不超过授信额度 1.5 倍。"}, {"id": "R03", "src": "PRD 段 3", "text": "状态：待申请 → 已提交 → 校验中 → 自动通过 → 额度生效。"}, {"id": "R04", "src": "PRD 段 4", "text": "校验超过 30 分钟未返回结果时，系统按超时处理，具体动作待补充。"}, {"id": "R05", "src": "PRD 段 5", "text": "埋点：入口曝光、申请点击、提交成功、自动通过（含客群标签与时间戳）。"}, {"id": "R06", "src": "PRD 段 6", "text": "验收：自助占比达到 60% 以上，处理时长明显缩短，客户体验提升。"}], "cols": [{"k": "part", "name": "属于哪一块", "hint": "判定点 / 状态机 / 埋点 / 验收", "type": "chips", "w": 3, "tags": ["风控判定点", "状态机", "埋点", "验收口径"]}, {"k": "issue", "name": "主要问题", "hint": "这段最该改的一处", "type": "chips", "w": 3, "tags": ["代为定阈值", "异常未收口", "埋点缺层", "验收不可判", "无问题"]}, {"k": "sign", "name": "风控能否签", "hint": "能签 / 需补 / 不能签", "type": "chips", "w": 2, "tags": ["能签", "需补", "不能签"]}, {"k": "fix", "name": "改法（一句）", "hint": "写成可直接替换的表述", "type": "text", "w": 3, "tags": []}], "key": {"R01": {"part": "风控判定点", "issue": "代为定阈值", "pass": "", "sign": "不能签", "fix": "改成「准入条件待风控确认」，列账户状态/还款表现/逾期三项判定点"}, "R02": {"part": "风控判定点", "issue": "代为定阈值", "sign": "不能签", "fix": "改为「单次与累计上限待风控确认」，不在 PRD 里给数"}, "R03": {"part": "状态机", "issue": "异常未收口", "sign": "需补", "fix": "补超时、降级、生效失败、二次拒绝四个异常分支"}, "R04": {"part": "状态机", "issue": "异常未收口", "sign": "需补", "fix": "写明超时 30 分钟即转人工，并给用户提示与预计时间"}, "R05": {"part": "埋点", "issue": "埋点缺层", "sign": "需补", "fix": "补齐曝光/点击/提交/结果四层，每层标字段取值"}, "R06": {"part": "验收口径", "issue": "验收不可判", "sign": "不能再签", "fix": "改为四条带门槛、口径、窗口、责任人的验收"}}, "notes": {"R01·issue": "产品替风控定了准入阈值，风控会认为你没算敞口；正确做法是列判定点让对方拍", "R02·issue": "额度上限属风控定价范畴，产品直接给数等于越权，评审必退", "R04·issue": "「具体动作待补充」是最危险的一句话，等于把异常留给上线后的工单", "R05·issue": "只有四层中的两层，算不出漏斗：曝光到通过之间的转化无法评估", "R06·issue": "「明显缩短、体验提升」不可判定，这份 PRD 永远结不了项", "R03·issue": "主路径写全了，但异常分支一个没有；真实系统里超时与失败每天都有"}, "delta": [{"op": "改", "frm": "接受 R01 的准入条件，认为「写得挺具体」", "to": "判「不能签」：改成待风控确认的判定点", "why": "具体不等于越权。准入阈值是风控的判断权，产品写死了，签字责任就错位了", "kw": ["越权", "待确认", "签字", "阈值"]}, {"op": "改", "frm": "把 R04 的「待补充」留到开发阶段再定", "to": "当期写清：30 分钟超时转人工 + 提示 + 预计时间", "why": "异常留白必然变成线上工单，且上线后改动要走完整发布流程，成本是当期改的五倍", "kw": ["超时", "转人工", "留白", "工单"]}, {"op": "删", "frm": "在 R06 后面加一句「参考同业，自助率普遍 70% 以上」", "to": "整句删除", "why": "无来源对标会引出「哪家、什么口径」的追问，答不上来整段验收就失去可信度", "kw": ["同业", "对标", "口径", "70%"]}], "refsheet": "R01｜风控判定点｜代为定阈值｜不能签｜改为待风控确认的判定点\\nR02｜风控判定点｜代为定阈值｜不能签｜上限待风控确认\\nR03｜状态机｜异常未收口｜需补｜补四个异常分支\\nR04｜状态机｜异常未收口｜需补｜写明转人工与提示\\nR05｜埋点｜埋点缺层｜需补｜补齐四层\\nR06｜验收口径｜验收不可判｜不能再签｜四条带门槛口径窗口责任人", "forbid": "1[3-9]\\d{9}|\\d{6}(19|20)\\d{2}[01]\\d[0-3]\\d{4}[0-9Xx]", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "需求：闪电贷 支持用户自助申请提额（原为人工评估，平均 3 个工作日）。\n背景：近 90 天提额申请 4,200 笔，人工通过率 38%，平均时长 3.2 天；客诉集中在「等太久、不知道结果」。\n请输出完整 PRD，重点三块：\n① 风控策略段：列出必须由风控确认的判定点（准入、额度上限、频次、拒绝后冷却），不要替我定具体阈值；\n② 状态机：穷举所有状态与迁移条件，含异常与超时分支；\n③ 埋点：按曝光 / 点击 / 提交 / 结果四层给出字段清单，标明每个字段的取值与上报时机。\n规则：不得出现「由模型智能判断」这类表述；所有阈值写「待风控确认」；涉及对客承诺的表述一律标注需合规审核。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】风控段专项 + 状态机穷举 + 埋点四层（曝光/点击/提交/结果）\n【参考案例】「闪电贷」提额申请：把额度调整做成用户可自助申请（原为人工评估）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n需求：闪电贷 支持用户自助申请提额（原为人工评估，平均 3 个工作日）。\n背景：近 90 天提额申请 4,200 笔，人工通过率 38%，平均时长 3.2 天；客诉集中在「等太久、不知道结果」。\n请输出完整 PRD，重点三块：\n① 风控策略段：列出必须由风控确认的判定点（准入、额度上限、频次、拒绝后冷却），不要替我定具体阈值；\n② 状态机：穷举所有状态与迁移条件，含异常与超时分支；\n③ 埋点：按曝光 / 点击 / 提交 / 结果四层给出字段清单，标明每个字段的取值与上报时机。\n规则：不得出现「由模型智能判断」这类表述；所有阈值写「待风控确认」；涉及对客承诺的表述一律标注需合规审核。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M3U7", "tier": "adv", "step": "todo", "title": "产出含风控与指标的完整 PRD", "video": {"dur": "4.3min", "script": ["风控不是拦你的人，是替你把「放宽之后谁担」这件事问清楚的人", "完整 PRD 模板（八段 + 风控签字点 + 四层埋点 + 验收门槛）", "某团队用这份模板把提额需求的风控评审从两轮压到一轮"]}, "ppt": {"method": "完整 PRD 模板（八段 + 风控签字点 + 四层埋点 + 验收门槛）", "case": "某团队用这份模板把提额需求的风控评审从两轮压到一轮", "demo": "完整 PRD 填写指引：先写判定点，再画状态，最后给埋点与验收"}, "objective": "能产出一份含风控段、状态机、四层埋点与验收口径的完整 PRD，并标清签字点", "transfer": "本周把这份 PRD 的签字点单独抄成一页，先约风控 20 分钟预沟通再上评审", "vslides": [{"t": "本节要讲什么", "n": "这一节落一份完整 PRD：八段齐全、风控段五个判定点、状态机五个异常、埋点四层、验收四条。这一节讲三件事：第一段为什么只写三个数字、风控段怎么写才建立信任、以及验收口径的四要素。看完你就能出一份三方都能签的 PRD。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"第一段三个数\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">第一段三个数</tspan></text></g><g data-k=\"风控段建信任\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">风控段建信任</tspan></text></g><g data-k=\"验收四要素\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">验收四要素</tspan></text></g></svg>", "d": 26.86}, {"t": "先三个数字，再谈功能", "n": "完整 PRD 和最小 PRD 的差别，不在于段落多少，在于每个结论都要有数字与口径。第一段就写三个数字：申请量、通过率、处理时长，每个都带口径和统计窗口。为什么这么强调？因为这份 PRD 会被风控拿去评估影响：他不知道你现在通过率多少，就没法判断自助化之后风险会怎么变。接下来写功能，六到八条即可，每条一句可建单的话。功能写多了反而稀释重点，因为这类需求真正决定成败的是判定点，不是页面。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">第一段三组数</tspan></text><g data-k=\"申请量 + 口径\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">申请量 + 口径</tspan></text></g><g data-k=\"通过率 + 口径\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">通过率 + 口径</tspan></text></g><g data-k=\"时长 + 窗口\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">时长 + 窗口</tspan></text></g><g data-k=\"目标 + 容差\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">目标 + 容差</tspan></text></g></svg>", "d": 45.22}, {"t": "风控段只列判定点，阈值留给风控", "n": "风控段最容易写坏，也最容易建立信任。写坏的典型是替风控给阈值：「近 6 期无逾期即可提额」。这句话一出，风控会立刻进入防御状态，因为他不知道你有没有考虑反欺诈、有没有算过额度敞口。正确的写法是列判定点、标待确认：「判定点 1 准入，含账户状态、还款表现、当前逾期，待风控确认」。五个判定点列完，风控拿到就能逐条拍。你会发现这个过程其实更快：他拍五条比读你一段规则快得多，而且拍完就是他签字，责任清晰。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五个判定点</tspan></text><g data-k=\"1 准入\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">1 准入</tspan></text></g><g data-k=\"2 额度上限\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">2 额度上限</tspan></text></g><g data-k=\"3 频次与冷却\"><rect x=\"18.0\" y=\"96.7\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">3 频次与冷却</tspan></text></g><g data-k=\"4 转人工触发\"><rect x=\"209.0\" y=\"96.7\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">4 转人工触发</tspan></text></g><g data-k=\"5 拒绝口径\"><rect x=\"18.0\" y=\"149.3\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">5 拒绝口径</tspan></text></g></svg>", "d": 48.46}, {"t": "状态机、埋点、验收：三块收尾", "n": "状态机要写到「异常发生时用户看到什么」：校验超时转人工、服务不可用降级、额度生效失败回滚并通知客服。这三条不写，上线第一周就会堆工单。埋点按四层给，每层标字段与取值方式，这样才拉得出漏斗：曝光多少、点进来多少、提交多少、结果分布。最后验收口径四条，每条四要素：门槛、口径、窗口、责任人。少一个都判不了，尤其责任人——不写名字，到期没人管。这份 PRD 交出去的时候，你应该能指着签字点那一行说：风控签这四条、合规签一条、我签验收。三方都签了，这个需求才真正可以开工。再补一件常被漏的事：把「上线后谁盯数据」写进 PRD。不写就会出现上线三天没人看指标、两周后发现问题却已无法回滚的局面。盯数据的人要写名字，不能写「数据组」，还要写清看哪三个数、看多久、越线了做什么。这三件事写清，上线才算真正闭环。还有一条容易忘：把回滚动作写成步骤，别写「必要时回滚」，必要时是谁判断、回滚要多久，都要写清。回滚标准最好只写一条最容易判的，比如自动通过率低于基线三个百分点。这一条写下来，出事时就不必开会决定要不要停。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"异常要有提示\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">异常要有提示</tspan></text></g><g data-k=\"埋点分四层\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">埋点分四层</tspan></text></g><g data-k=\"验收四要素\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">验收四要素</tspan></text></g><g data-k=\"签字点到人\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">签字点到人</tspan></text></g></svg>", "d": 103.32}, {"t": "小结与接下来", "n": "小结三句。第一，第一段只写三个数字：申请量、通过率、处理时长，各带口径与窗口。第二，风控段列判定点、标待确认，让风控逐条拍，比你去猜阈值快得多。第三，验收每条要门槛、口径、窗口、责任人，四样缺一样就判不了。接下来做任务：把签字点抄成一页，先约风控 20 分钟预沟通再上评审。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"三个数字\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三个数字</tspan></text></g><g data-k=\"列点待确认\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">列点待确认</tspan></text></g><g data-k=\"验收四要素\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">验收四要素</tspan></text></g><g data-k=\"任务：预沟通一页\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：预沟通一页</tspan></text></g></svg>", "d": 34.42}], "deliverable": {"type": "skill", "name": "风控 PRD 生成", "rubric": ["风控可审", "状态穷举", "验收可判"], "acceptance": "八段齐全：风控段无自定阈值且列 ≥5 判定点、状态机异常 ≥4、埋点四层、验收 ≥3 条带门槛与窗口"}, "practice": {"steps": ["写目标与现状：三个数字（申请量、通过率、时长），各带口径与窗口", "写风控段：列判定点（准入/上限/频次/转人工/拒绝口径），阈值全部写待确认", "画状态机：主路径 + 至少 4 个异常分支（超时、降级、失败、二次拒绝）", "写四层埋点与验收口径：每层字段可取值，验收每条带门槛、口径、观察窗口、责任人"], "exemplar": "【《完整 PRD》· 自助提额】版本 v1.0　风控对接人：风控策略组 张工\n\n■ 1. 目标与现状\n　现状：提额申请 4,200 笔 / 90 天｜口径：全渠道提交去重｜窗口：2026-08-15 至 11-12\n　现状：人工通过率 38%｜平均处理 3.2 个工作日\n　目标：自助占比 ≥60%、中位时长 ≤10 分钟、通过率 ≥35%\n　口径：自助渠道提交 ÷ 总提额申请；时长剔除转人工；观察窗口：上线后 4 周\n\n■ 2. 用户与场景\n　已在贷且还款正常的客户，遇到临时资金需求想提额；现在只能打客服或等人工评估，多数人不知道进度。\n\n■ 3. 功能清单\n　1. 额度页新增「申请提额」入口与规则说明\n　2. 校验通过后即时反馈可提额度区间\n　3. 提交后展示处理状态与预计时间\n　4. 拒绝时展示原因分类与下次可申请时间\n　5. 转人工时展示排队信息与预计完成时间\n　6. 客服知识库同步自助提额口径\n\n■ 4. 风控策略段\n　判定点 1 准入（账户状态、近 6 期还款、当前无逾期）—— 待风控确认\n　判定点 2 单次与累计提额上限 —— 待风控确认\n　判定点 3 30 天申请频次与被拒冷却期 —— 待风控确认\n　判定点 4 转人工触发（反欺诈命中、超模型区间）—— 待风控确认\n　判定点 5 拒绝原因分类与展示口径 —— 待风控与合规确认\n\n■ 5. 状态机\n　主路径：待申请 → 已提交 → 校验中 → 自动通过 → 额度生效\n　异常：校验超时 30 分钟 → 转人工｜风控服务不可用 → 降级转人工并提示｜\n　　　　额度生效失败 → 回滚 + 告警 + 通知客服｜复申二次被拒 → 冷却 90 天｜提交中断 → 草稿保留 24 小时\n\n■ 6. 埋点\n　曝光层：入口曝光、规则说明曝光、结果页曝光（客群标签、来源、时间戳）\n　点击层：申请点击、说明展开、客服入口点击（按钮 ID、停留时长）\n　提交层：提交、材料上传开始/成功/失败（材料类型、失败码）\n　结果层：自动通过、转人工、自动拒绝、超时转人工（决策耗时、额度变化、原因码）\n\n■ 7. 边界与不做\n　不做：不向未达标客户主动推送提额邀请；不做提额营销外呼；不改动既有额度模型\n　合规红线：对客表述不得出现「保证提额」「必过」，拒绝原因必须可解释\n\n■ 8. 验收口径\n　① 自助占比 ≥60%｜口径：自助提交 ÷ 总申请｜窗口：上线后 4 周｜责任人：数据 PM\n　② 中位处理时长 ≤10 分钟｜口径：提交到结果，剔除转人工｜窗口：上线后 4 周｜责任人：数据 PM\n　③ 通过率 ≥35%｜口径：自动通过 ÷ 自动决策｜窗口：上线后 8 周｜责任人：风控策略组\n　④ 5 个异常分支均有明确提示且可回退｜逐项走查｜上线前｜责任人：测试负责人\n\n■ 签字点：风控（判定点 1–4）｜合规（判定点 5 与对客表述）｜产品（验收口径与上线）"}, "task": "产出《风控 PRD 生成》：写目标与现状：三个数字（申请量、通过率、时长），各带口径与窗口；写风控段：列判定点（准入/上限/频次/转人工/拒绝口径），阈值全部写待确认；画状态机：主路径 + 至少 4 个异常分支（超时、降级、失败、二次拒绝）；写四层埋点与验收口径：每层字段可取值，验收每条带门槛、口径、观察窗口、责任人", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的消费金融 AI 产品经理。本单元属于「M3 AI 辅助 PRD 与产品定义」模块，你要交付的是《风控 PRD 生成》。\n【场景】业务侧这周的诉求是：风控不是拦你的人，是替你把「放宽之后谁担」这件事问清楚的人。参考做法：某团队用这份模板把提额需求的风控评审从两轮压到一轮。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（完整 PRD 模板（八段 + 风控签字点 + 四层埋点 + 验收门槛）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《完整 PRD》填写模板】需求：{{}}　版本：{{}}　风控对接人：{{}}\n\n■ 1. 目标与现状（三个数字，各带口径与窗口）\n　现状：{{}}　口径：{{}}　窗口：{{}}\n　目标：{{}}　口径：{{}}　观察窗口：{{}}\n\n■ 2. 用户与场景\n　{{谁、什么时候、想做什么、现在怎么做}}\n\n■ 3. 功能清单（≤8 条，每条可建单）\n　1. {{}}　2. {{}}\n\n■ 4. 风控策略段（只列判定点，阈值写待确认）\n　判定点 1 {{准入}} —— 待风控确认\n　判定点 2 {{额度上限}} —— 待风控确认\n　判定点 3 {{频次与冷却}} —— 待风控确认\n　判定点 4 {{转人工触发}} —— 待风控确认\n　判定点 5 {{拒绝展示口径}} —— 待风控与合规确认\n\n■ 5. 状态机（主路径 + 异常分支）\n　主路径：{{}}\n　异常：{{超时}} / {{降级}} / {{生效失败}} / {{二次拒绝}} / {{提交中断}}\n\n■ 6. 埋点（四层，字段可取值）\n　曝光层：{{}}　点击层：{{}}　提交层：{{}}　结果层：{{}}\n\n■ 7. 边界与不做\n　不做：{{}}　合规红线：{{}}\n\n■ 8. 验收口径（门槛 + 口径 + 窗口 + 责任人）\n　① {{}}｜门槛 {{}}｜口径 {{}}｜窗口 {{}}｜责任人 {{}}\n　② {{}}\n　③ {{}}\n\n■ 签字点：风控 {{姓名/角色}}｜合规 {{}}｜产品 {{}}", "rubric": ["风控段列 ≥5 个判定点，全部标「待风控确认」，不出现具体阈值或「模型智能判断」", "状态机含主路径与 ≥4 个异常分支（超时 / 降级 / 生效失败 / 二次拒绝）", "埋点分曝光、点击、提交、结果四层，每层给字段与取值方式", "验收 ≥3 条，每条含门槛值、计算口径、观察窗口与责任人"]}, {"id": "M3U8", "tier": "adv", "step": "spar", "title": "风控+研发+合规三方会审", "video": {"dur": "4.5min", "script": ["三方会审不是表决，是把各自的底线摆到一张桌上，看你有没有提前算过代价", "三角色陪练：风控要兜底、研发要工期、合规要表述", "某提额需求因合规指出「保证提额」表述被要求重做，耽误一个迭代"]}, "ppt": {"method": "三角色陪练：风控要兜底、研发要工期、合规要表述", "case": "某提额需求因合规指出「保证提额」表述被要求重做，耽误一个迭代", "demo": "陪练演示：把「体验优先」追成「代价多少、谁认」"}, "objective": "能在风控、研发、合规三方会审里守住口径与让步边界，明确谁签什么、代价多少", "transfer": "会审前把三个让步写成「让多少、代价多少、谁认」三行，会上只围绕这三行谈", "vslides": [{"t": "本节要讲什么", "n": "这一节是三方会审陪练。风控要兜底、研发要工期、合规要表述，三方底线都不会让。这一节讲三件事：为什么要把让步写成三行、三类必被追问的合格答法、以及会后纪要写什么。练完你要能说清每个让步的代价与按停权。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"让步写三行\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">让步写三行</tspan></text></g><g data-k=\"三类回答\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三类回答</tspan></text></g><g data-k=\"纪要写四件\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">纪要写四件</tspan></text></g></svg>", "d": 26.4}, {"t": "会审不是表决，是亮底线", "n": "三方会审最常见的误解是「投票」：好像三方各让一步就能过。实际上三方各有硬底线：风控的底线是不出现无法兜底的敞口，研发的底线是工期与优先级明确，合规的底线是对客表述不留承诺。这三条底线都不是让出来的，是你必须提前算清代价再谈。所以会前要做一件事：把三个让步写成「让多少、代价多少、谁认」三行。比如「让步一：冷却期 90 天缩到 30 天，代价是不良率上限 0.2pt，风控认」。带着这三行上会，讨论就从「要不要让」变成「这个代价能不能接受」，效率完全不同。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三个让步三行</tspan></text><g data-k=\"让多少\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">让多少</tspan></text></g><g data-k=\"代价多少\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">代价多少</tspan></text></g><g data-k=\"谁认\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">谁认</tspan></text></g><g data-k=\"越线怎么回滚\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">越线怎么回滚</tspan></text></g></svg>", "d": 58.22}, {"t": "三类必被追问，和合格答法", "n": "风控必问止损点：合格答法是给数并给按停权——「自动通过率与不良率任一越线即回滚，产品按停、风控一票否决，回滚 15 分钟内可执行」。研发必问工期：合格答法是给优先级——「五个分支里三个是提示层可后置，超时与降级本期必做」。合规必问表述：合格答法是当场改——「『更容易通过』构成承诺，改成『条件更新后可再次申请』，并给四类可解释原因」。三类回答的共同点是不含糊、不推后、不承诺。含糊的代价是当场被要求补件，补件意味着排期后推；承诺的代价更大，一句话可能变成投诉和处罚依据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类回答</tspan></text><g data-k=\"止损点给数\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">止损点给数</tspan></text></g><g data-k=\"工期给优先级\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">工期给优先级</tspan></text></g><g data-k=\"表述当场改\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">表述当场改</tspan></text></g><g data-k=\"按停权点名\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">按停权点名</tspan></text></g></svg>", "d": 61.66}, {"t": "会审之后写什么", "n": "会审结束不是就完了，你要在当天出一份三百字的纪要，写清四件事：三方各确认了什么、哪几条还是待确认、下一次什么时候对、谁负责推进。这份纪要的价值在两周后体现：当有人问「当时风控是不是同意了」，你有据可查。特别提醒：把「待确认」单独列一节，不要混在结论里。混在一起，未来一定有人以为已经确认过了。最后一句要写清按停与回滚：谁有权停、什么条件停、停了之后怎么恢复。这三件事写在纪要末尾，看起来像形式，其实是你这个项目最重要的一层保护。最后一句：纪要发出后请三方各回一句「确认」，微信上回一个字也算，这个截图在半年后能救你一次。如果某一方迟迟不回，就在群里@一次并写明「按周四未反馈视为同意」，把默认值说清，比反复私聊有效。这一个小动作，能省掉后面半个月的扯皮。尤其是跨部门，把默认值写清比礼貌重要。写清之后，你会发现讨论反而更容易推进。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">会后纪要四件事</tspan></text><g data-k=\"三方共识\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">三方共识</tspan></text></g><g data-k=\"待确认单列\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">待确认单</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">列</tspan></text></g><g data-k=\"下次时点\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">下次时点</tspan></text></g><g data-k=\"按停与回滚\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">按停与回</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">滚</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 81.43}, {"t": "小结与接下来", "n": "小结三句。第一，会审不是表决，是亮底线，带着「让多少、代价多少、谁认」三行去谈。第二，回答要具体：止损点给数、工期给优先级、表述当场改，含糊和承诺代价最大。第三，当天出纪要，待确认单列，末尾写清按停与回滚，这三件是你的保护。接下来做任务：会审前把三个让步写成三行，会上只围绕这三行谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"三行让步\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三行让步</tspan></text></g><g data-k=\"回答要具体\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">回答要具体</tspan></text></g><g data-k=\"按停写末尾\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">按停写末尾</tspan></text></g><g data-k=\"任务：三行让步\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：三行让步</tspan></text></g></svg>", "d": 40.49}], "deliverable": {"type": "skill", "name": "风控 PRD 生成", "rubric": ["底线清楚", "代价可算", "表述合规"], "acceptance": "四轮追问下能说清三方的底线、自己的让步上限与代价，且不出现对客承诺性表述"}, "spar": {"role": "三方会审主持人（风控 + 研发 + 合规）", "persona": "三方各守底线：风控要兜底方案、研发要工期与优先级、合规要对客表述逐句核；对「后面再看」零容忍", "mustAsk": ["自助化之后，通过率与不良率同时上升，你准备在哪个数上止损？谁有权按停？", "状态机五个异常分支都要做，工期加两周，你砍哪个？砍掉的后果谁承担？", "拒绝页那句「下次申请更容易通过」是不是承诺？合规不同意，你改还是不改？", "如果模型给出的额度明显高于人工评估，以哪个为准？这条写进 PRD 了吗？"]}, "exemplar": "三方会审的合格答法（对照自查）：\n1. 风控问「放宽到 30 天，不良率上升谁担」→ 「我按 0.2pt 以内设上限，超过自动回滚到 90 天；这条写进 PRD 第 8 段，风控签字确认容差。」\n2. 研发问「异常分支这么多，工期要加两周」→ 「五个分支里三个是提示层，可以先上；超时与降级两个必须本期做，其余排下期，我把优先级标在 PRD 里。」\n3. 合规问「拒绝页能不能写『下次申请更容易通过』」→ 「不能，这句构成承诺；改成『条件更新后可再次申请』，并把原因分四类可解释表述。」\n4. 三方问「上线后出问题谁按停」→ 「产品按停，风控有一票否决；回滚标准是自动通过率与不良率任一越线，回滚动作 15 分钟内可执行。」\n反面：「体验优先，风险我们后面再看」「这些细节工程上都能解决」——两句都会让三方同时收紧。", "task": "把《风控 PRD 生成》拿到「三方会审主持人（风控 + 研发 + 合规）」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《风控 PRD 生成》。现在要让它通过「三方会审主持人（风控 + 研发 + 合规）」这一关。\n【对手的立场】三方各守底线：风控要兜底方案、研发要工期与优先级、合规要对客表述逐句核；对「后面再看」零容忍。\n【他一定会追问】「自助化之后，通过率与不良率同时上升，你准备在哪个数上止损？谁有权按停？」 / 「状态机五个异常分支都要做，工期加两周，你砍哪个？砍掉的后果谁承担？」 / 「拒绝页那句「下次申请更容易通过」是不是承诺？合规不同意，你改还是不改？」\n【场景】你说「风控+研发+合规三方会审」，对方立刻回一句：自助化之后，通过率与不良率同时上升，你准备在哪个数上止损？谁有权按停？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界     if(!_axHasMyRecords(own)) return;

/* v164：本机老桶（ent:<公司> 或 v163 的 ent:<公司>:姓名）在账号首次打开时接管到 ent:acct:<登录账号>，
   否则换成分桶规则后进度会「归零」。一台设备每个账号只结算一次。 */
function _axMergeBucket(nk, ov){
  try{
    var nv=localStorage.getItem(nk); if(nv==null){ localStorage.setItem(nk, ov); return; }
    var a=JSON.parse(nv), b=JSON.parse(ov);
    if(!a||!b||typeof a!=='object'||typeof b!=='object'||a instanceof Array) return;
    for(var k in b){ if(!Object.prototype.hasOwnProperty.call(b,k)) continue;
      if(a[k]===undefined){ a[k]=b[k]; continue; }
      if(a[k]&&b[k]&&typeof a[k]==='object'&&typeof b[k]==='object'&&!(a[k] instanceof Array)){
        for(var k2 in b[k]){ if(Object.prototype.hasOwnProperty.call(b[k],k2)&&a[k][k2]===undefined) a[k][k2]=b[k][k2]; }
      }
    }
    localStorage.setItem(nk, JSON.stringify(a));
  }catch(e){}
}
function _axMigrate(){
  var s=_axSession()||{};
  if(s.role!=='ent'||!s.loginId) return;
  var mark='aidax_ent_migr_kv:'+s.loginId;
  try{ if(localStorage.getItem(mark)) return; }catch(e){ return; }
  var target='ent:acct:'+s.loginId, pref='ent:'+(s.companyId||s.company||'');
  try{
    var keys=[];
    for(var i=0;i<localStorage.length;i++){ var kk=localStorage.key(i); if(kk) keys.push(kk); }
    for(var j=0;j<keys.length;j++){
      var k=keys[j], idx=k.lastIndexOf('::'); if(idx<0) continue;
      var own=k.slice(idx+2);
      if(own!==pref && own.indexOf(pref+':')!==0) continue;
      var nk=k.slice(0,idx+2)+target, ov=localStorage.getItem(k)||'';
      if(localStorage.getItem(nk)==null){ localStorage.setItem(nk, ov); }
      else { _axMergeBucket(nk, ov); }
      localStorage.removeItem(k);
    }
    localStorage.setItem(mark,'1');
  }catch(e){}
}
function _axKey(base){ var own=_axOwnerKey(); if(own){ _axMigrate(); _axClaim(base); } return own? base+'::'+own : base; }
/* v162：换账号必须整页换账本。STORE / prog 都是加载时按当时的账号算好的，
   在别的标签页切号后只重画顶栏，进度仍读写上一个账号 —— 看起来就是「还是同一个人的记录」。 */
var _axBound=_axOwnerKey();
var _axReloading=false;
function _axWatch(){
  var now=_axOwnerKey();
  if(now===_axBound||_axReloading) return false;
  _axReloading=true;
  _axBound=now;
  location.reload();                 // 按新账号整页重载，避免半新半旧
  return true;
}

// 把学习进度回写主站（localStorage 同源共享），主站监听 storage 事件实时刷新。
// A6：不再只写「模块全通关」一个布尔值——逐单元写 done/watched/score，并给模块完成度 pct 与均分，
// 主站学习地图才能显示「做了几单元、得了多少分」，而不是要么 0% 要么 100%。
function syncMapProgress(){
  try{
    const key=_axKey('ai_training_progress');
    let cp={}; try{ cp=JSON.parse(localStorage.getItem(key))||{}; }catch(_){}
    const xp=totalXP();
    COURSE.modules.forEach((m,mi)=>{
      // cid 用模块编号（M3→m3），不用数组下标：样板间/子集课程里下标会错位（M3 变 m1），
      // 主站学习地图按 retail_pm_m3 取进度，对不上就永远显示 0%。
      const cid='fin_pm_m'+String(m.id||('M'+mi)).replace(/^M/,'');
      const units={}; let doneCnt=0, scoreSum=0, scoreCnt=0, taskCnt=0;
      m.units.forEach(u=>{
        const st=prog.units[u.id]||{};
        if(st.done) doneCnt++;
        if(st.taskDone) taskCnt++;
        if(typeof st.score==='number'){ scoreSum+=st.score; scoreCnt++; }
        units[u.id]={done:!!st.done, watched:!!st.watched,
                     score:(typeof st.score==='number')?st.score:null};
      });
      const allDone=(doneCnt===m.units.length);
      const prev=cp[cid]||{};
      cp[cid]=Object.assign({},prev,{
        done:allDone, pct:Math.round(doneCnt/m.units.length*100),
        doneCount:doneCnt, unitCount:m.units.length,
        units:(Object.keys(units).length?units:prev.units||null),
        avgScore:(scoreCnt?Math.round(scoreSum/scoreCnt):null),
        xp:xp, updatedAt:Date.now()
      });
      if(allDone && !prev.completedAt) cp[cid].completedAt=Date.now();
    });
    localStorage.setItem(key, JSON.stringify(cp));
  }catch(_){}
}

    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),6000);
    let r;
    try{ r=await fetch((base?base.replace(/\/$/,''):'')+'/ping',{cache:'no-store',signal:ctl.signal}); }
    finally{ clearTimeout(t); }
    if(!r.ok) return false;
    const j=await r.json().catch(()=>null);
    return !!(j && j.ok===true && j.service==='aidax-llm-proxy');
  }catch(e){ return false; }
}
async function llmChat(messages, opts){
  if(LLM.state==='off') throw new Error('陪练服务未连接');
  let msgs=(messages||[]).slice();
  if(!msgs.length || msgs[0].role!=='system') msgs.unshift({role:'system',content:WORKER_FALLBACK_SYS});
  const body=Object.assign({model:'deepseek-flash',messages:msgs,temperature:0.6,max_tokens:700},opts||{});
  delete body.stream;
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch(chatOrigin()+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok){
      let m='HTTP '+r.status, code='';
      try{ const j=await r.json(); if(j&&j.error){ code=j.error.code||''; m=j.error.message||m; } }catch(e){}
      throw new Error((code?'['+code+'] ':'')+m);
    }
    const j=await r.json();
    const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!c) throw new Error('模型返回空回复');
    return String(c).trim();
  } finally { clearTimeout(tm); }
}
async function llmProbe(silent){
  const ordered=[];
  if(LLM.base) ordered.push(LLM.base);
  CHAT_CANDIDATES.forEach(x=>{ if(!ordered.includes(x)) ordered.push(x); });
  const res=await Promise.all(ordered.map(pingAt));
  const i=res.indexOf(true);
  LLM.state = i>=0 ? 'proxy' : 'off';
  if(i>=0){ LLM.base=ordered[i]; saveLlm(); }
  paintLlm();
  if(!silent && LLM.state==='off') openLlm();
  return LLM.state;
}

function paintLlm(){
  const b=document.getElementById('llm-badge');
  const t=document.getElementById('llm-text');
  const h=document.getElementById('llm-hint');
  if(b){
    b.classList.remove('on','off');
    if(LLM.state==='proxy') b.classList.add('on');
    else if(LLM.state==='off') b.classList.add('off');
  }
  if(t){
    if(LLM.state==='proxy') t.textContent='AI 陪练已就绪';
    else if(LLM.state==='off') t.textContent='AI 未连接 · 点此处理';
    else t.textContent='AI 能力检测中';
  }
  if(h){
    if(LLM.state==='proxy') h.innerHTML='已连接课程自带的 AI 陪练服务，回答由真实大模型生成；<b>判分与进度不受影响</b>。';
    else if(LLM.state==='off') h.innerHTML='AI 陪练服务暂未接通，已自动回退到本地规则引擎：照样能提问、能按规则点评，<b>判分与进度不受影响</b>，只是回答不如真模型灵活。可点上方状态查看说明。';
  }
  /* 状态条在「设置」面板里动态生成，页面加载时往往还不在 DOM 里。
     旧实现遇到元素缺失直接 return，导致学员打开设置也看不到真实状态；
     这里挂一次性观察器，元素出现后补画一次即断开。 */
  if(!b && !_llmUiObs && typeof MutationObserver!=='undefined'){
    _llmUiObs=new MutationObserver(()=>{
      if(document.getElementById('llm-badge')){ _llmUiObs.disconnect(); _llmUiObs=null; paintLlm(); }
    });
    try{ _llmUiObs.observe(document.documentElement,{childList:true,subtree:true}); }catch(e){ _llmUiObs=null; }
  }
}

function curModIndex(){
  const i=COURSE.modules.findIndex(m=>m.units.some(x=>x.id===prog.cur));
  return i<0?0:i;
}
function renderSidebar(){
  const sb=document.getElementById('sidebar'); sb.innerHTML='';
  const openIdx=curModIndex();
  /* 短板标记的分寸：原先只要模块沾到任一弱维就打「📌 短板」，学员 8 维全弱时整栏 8 个模块全红，
     等于没给优先级。现在弱维 ≤4 时照常全标；超过 4 个只标命中数最多的前 3 个模块。 */
  const hitCnt = COURSE.modules.map(m=>((m.dims||[]).filter(d=>WEAK.includes(d)).length));
  const markAll = WEAK.length <= 4;
  const topIdx = new Set(hitCnt.map((n,i)=>({n:n,i:i})).filter(x=>x.n>0)
    .sort((a,b)=>b.n-a.n).slice(0,3).map(x=>x.i));
  /* v157 weak-reorder：按弱维命中数把模块重排到前面（测评「建议必修」），
     但全套模块照常全部渲染，不 filter、不锁 —— 必修/选修只是建议。
     展开态改用模块 id 判断：排序后遍历序号已不是原始模块序号，用 mi 会错位。 */
  const openModId = (COURSE.modules[openIdx]||{}).id;
  const DISPLAY = COURSE.modules.map((m,i)=>({m:m, i:i, hit:hitCnt[i]||0}))
    .map(function(e){
      /* 教学约束：M0 导论（边界预期）恒定第一、M7 合规与结业恒定最后，
         只重排中间 M1–M6 —— 没建立「什么不能交」就先学提示词有数据外泄风险。 */
      const L=COURSE.modules.length-1;
      e.rank = e.i===0 ? -1 : (e.i===L ? 2 : (e.hit>0 ? 0 : 1));
      return e;
    })
    .sort((a,b)=> a.rank-b.rank || a.i-b.i);
  DISPLAY.forEach(function(entry){
    const m=entry.m, mi=entry.i;
    const mod=document.createElement('div'); mod.className='mod'+(m.id===openModId?' open':'');
    const done=m.units.filter(u=>prog.units[u.id]&&prog.units[u.id].done).length;
    const allDone=done===m.units.length;
    const passed=!!prog.quizzes[m.id];
    const weakHit = m.dims && m.dims.some(d=>WEAK.includes(d)) && (markAll || topIdx.has(mi));
    if(weakHit) mod.className+=' weak';
    const hd=document.createElement('div'); hd.className='mod-h';
    /* 模块标题在数据里可能自带「M1 」前缀（应届生深版就是），侧栏已单独渲染代号，
       不剥掉就会显示成「M1 M1 写出第一句好用的提示词」。 */
    const mTitle=modTitle(m);
    hd.innerHTML='<div class="mh-top"><span class="mid">'+m.id+'</span><span class="mtitle">'+esc(mTitle)+'</span></div>'
      +'<div class="mh-meta">'
      +(allDone?'<span class="mdone">'+done+'/8 已通关</span>':'<span class="mdone" style="color:var(--mut);font-weight:500">'+done+'/8</span>')
      +(weakHit?'<span class="mweak" style="font-size:11px;color:#dc2626;border:1px solid #fecaca;background:#fef2f2;border-radius:6px;padding:0 5px;cursor:default;white-space:nowrap">📌 短板</span>':'')
      +'<span class="mquiz" style="'+(passed?'color:#166534;border-color:#86efac;background:#ecfdf5':'')+'">'+(passed?'\u2713 测验':'\uD83D\uDCDD 测验')+'</span>'
      +'</div>';
    const body=document.createElement('div'); body.className='mod-b';
    m.units.forEach(u=>{
      const el=document.createElement('div');
      el.className='unit'+(prog.cur===u.id?' active':'')+((prog.units[u.id]&&prog.units[u.id].done)?' done':'');
      el.innerHTML='<span class="ut">'+esc(u.title)+'</span><span class="st">'+STEP_LABEL[u.step]+'</span>';
      el.onclick=()=>openUnit(u.id);
      body.appendChild(el);
    });
    mod.appendChild(hd); mod.appendChild(body);
    hd.onclick=()=>mod.classList.toggle('open');
    hd.querySelector('.mquiz').onclick=ev=>{ ev.stopPropagation(); openQuiz(m.id); };
    sb.appendChild(mod);
  });
  const ft=document.createElement('div'); ft.className='sb-foot';
  ft.innerHTML='<button class="sb-cap" onclick="openScore(\'capstone\')">\uD83C\uDFC1 结业产出物评审</button>';
  sb.appendChild(ft);
  const act=sb.querySelector('.unit.active');
  if(act && act.scrollIntoView) act.scrollIntoView({block:'nearest'});
}

let CUR=null;   /* 当前单元播放器句柄，切换单元时先 stop */
let CHECK=null; /* 多邻国式分步通关状态：{uid, idx, steps} */
/* 配音预取：手机上点播放到出声要等一段下载，很像「点了没反应」。
   ⚠️ 用媒体元素预取，别用 fetch：audio 发的是 Range 请求，fetch 下来的整包缓存
   满足不了 Range，等于白下（这个坑踩过）。媒体元素之间共享媒体缓存，所以有效。
   预取只下载不播放，muted 保证不会有声。 */
let _pf={}, _pfOrder=[];
function prefetchAud(u){
  const url=audUrl(u);
  if(!url) return Promise.resolve();
  if(_pf[url]) return Promise.resolve();
  return new Promise(function(res){
    try{
      const a=new Audio(); a.preload='auto'; a.muted=true; a.src=url;
      _pf[url]=a; _pfOrder.push(url);
      /* 只留最近 12 段，别让长逛的用户攒一堆实例吃内存 */
      while(_pfOrder.length>12){ const old=_pfOrder.shift(); try{ _pf[old].src=''; }catch(e){} delete _pf[old]; }
      let done=false;
      const fin=function(){ if(done) return; done=true; res(); };
      a.addEventListener('canplaythrough',fin,{once:true});
      a.addEventListener('error',fin,{once:true});
      setTimeout(fin, 25000);
      try{ a.load(); }catch(e){}
    }catch(e){ res(); }
  });
}
/* 整单元顺序预取：第一段立刻拉，后面两段等前一段落地再排队，
   避免三段并发抢同一条慢链路，把第一段拖得更久。 */
function prefetchUnit(list){
  const q=(list||[]).slice();
  (function step(){
    const one=q.shift();
    if(!one) return;
    prefetchAud(one).then(function(){ setTimeout(step, 60); });
  })();
}

function findUnit(uid){ for(const m of COURSE.modules){ const u=m.units.find(x=>x.id===uid); if(u) return {m,u}; } return null; }
function flatUnits(){ const a=[]; COURSE.modules.forEach(m=>m.units.forEach(u=>a.push(u))); return a; }
function nextUnit(uid){ const a=flatUnits(), i=a.findIndex(x=>x.id===uid); return i>=0&&i+1<a.length?a[i+1]:null; }
function prevUnit(uid){ const a=flatUnits(), i=a.findIndex(x=>x.id===uid); return i>0?a[i-1]:null; }

function buildSteps(u){

     点进去是一个没有靶子的空壳陪练——学员练两次就不信陪练了。
     现在：理解/演示环节做完自检与记录直接结算；产出与陪练只在「我要做 / 陪练」环节里。 */
  return [{key:'watch',icon:'\uD83D\uDCFA',title:'看视频'},

function jumpStep(i){ if(!CHECK) return; if(i>=CHECK.idx) return; CHECK.idx=i; renderCheckpoint(); }
function advCheck(){ if(!CHECK) return; if(CHECK.idx<CHECK.steps.length-1){ CHECK.idx++; renderCheckpoint(); } else { renderCheckpoint(); } }
function prevCheck(){ if(!CHECK) return; if(CHECK.idx>0){ CHECK.idx--; renderCheckpoint(); } }

function setDelivSeen(uid){ const st=prog.units[uid]||{}; prog.units[uid]=Object.assign({},st,{delivSeen:true}); saveProg(); advCheck(); }
function totalXP(){ let s=0; for(const k in prog.units){ const u=prog.units[k]; if(u&&u.done) s+=(u.score||0); } return s; }

/* 徽标文字一律中文；CSS class 仍用英文 key 走配色。
   历史问题：map 的值就是 key 本身，页面上直接显示「skill / agent」英文，学员看不懂。 */
var DELIV_TXT={skill:'技能',agent:'智能体',workflow:'工作流',kb:'知识库'};
function delivTxt(t){ return DELIV_TXT[t]||'技能'; }
function delivBadge(t){
  const k=DELIV_TXT[t]?t:'skill';
  return '<span class="badge '+k+'">'+esc(delivTxt(t))+'</span>';
}
/* 可测学习目标 / 行为转化提示：老课程没有这两个字段，函数返回空串即不渲染，向后兼容。 */
function objBox(u){

  return '<div class="objbox"><span class="ob-t">\uD83C\uDFAF 学完你能做到</span>'+esc(sub(u.objective))+'</div>';

}
/* A2：模板 / 范例的统一取值口。
   历史上这里取的是 d.templateText / d.exemplarText，而构建器从未写过这两个字段
   （模板在 u.template，范例在 u.practice.exemplar），结果「查看范例」按钮压根不渲染、
   陪练提示词恒为「（暂无范例）」。现在统一从单元对象取，两处旧字段仅作历史兼容。 */
function artTexts(u){
  var d=(u&&u.deliverable)||null;
  // 优先级：交付物上内联的正文（金融课由 build_full_course.py 内联完整模板/范例）
  //        → 单元级 template / practice.exemplar / exemplar（course_kit 生成的课）
  var tpl=(d&&d.templateText)||(u&&u.template)||'';
  var ex=(d&&d.exemplarText)||(u&&u.practice&&u.practice.exemplar)||(u&&u.exemplar)||'';
  return {tpl:tpl, ex:ex};
}
/* 模板里常自带一整套「参考样式」（8 项工作 + 耗时 + 红线 + 责任人，够得上一份完整答案）。
   把它当模板摆出来，学员就会整段贴回输入框。这里把它拆出来单列为范例：
   骨架负责「照着填」，范例负责「照着看颗粒度」，两件事不混在一屏。 */
function splitTplSample(tpl){
  const s=sub(tpl||'');
  const m=s.match(/^[ \t]*(?:■[ \t]*)?(参考样式|参考范例|参考答案|示例|样例|范例)[ \t]*[（(:：]/m);
  if(!m || m.index<0) return {skel:s, sample:''};
  return {skel:s.slice(0,m.index).trim(), sample:s.slice(m.index).trim()};
}
/* 交付物摘要条：只回答「交什么、按什么验收、评审看哪三条」。
   独立「交付物与陪练」步骤取消后，这三行信息并进「做任务」页顶部，不再单独占一屏。 */
function delivStrip(u){
  const d=u&&u.deliverable;
  if(!d||typeof d!=='object'||!d.name) return '';
  const rub=(d.rubric&&d.rubric.length)? d.rubric.join(' \u00B7 ') : '';
  const bcls=(d.type==='agent')?'agent':(d.type==='workflow')?'workflow':(d.type==='kb')?'kb':'skill';
  return '<div class="dstrip">'
    +'<div class="ds-h"><b>交这个：'+esc(d.name)+'</b>'+(d.type?('<span class="badge '+bcls+'">'+esc(delivTxt(d.type))+'</span>'):'')+'</div>'
    +(d.acceptance?('<div class="ds-a">验收：'+esc(d.acceptance)+'</div>'):'')
    +(rub?('<div class="ds-r">评审看：'+esc(rub)+'</div>'):'')
    +'</div>';
}

function buildSparPrompt(u,m,d){

  L.push('5. 通关：达标后总结这份产出可直接带回工作用的要点。');
  L.push('');
  L.push('# 评分标准（rubric）');
  L.push(rub);
  L.push('');
  L.push('# 验收标准');
  L.push(acc);
  L.push('');

  L.push(tpl);

function buildScorePrompt(d, learnerText, u){

  const A=artTexts(u);

  const ex=A.ex||(d&&d.exemplarText)||'（暂无范例）';
  const L=[];
  L.push('# 角色');

  L.push('- 合规：是否触碰本课程红线（'+META.redlines.map(function(x){return x.replace(/。$/,'');}).join('；')+'）；如有必须明确指出。');
  L.push('');
  L.push('# 评分标准');
  L.push(rub);
  L.push('');
  L.push('# 验收标准');
  L.push(acc);
  L.push('');
  L.push('# 期望模板（评审时对照结构）');
  L.push(tpl);
  L.push('');
  L.push('# 合格范例（仅作结构对照，不要要求学员照抄）');
  L.push(ex);
  L.push('');
  L.push('# 学员提交的产出物');
  L.push('```');
  L.push(learnerText);
  L.push('```');
  L.push('');
  L.push('# 输出格式（必须照此返回）');
  L.push('1. 三维子分：完整性 X / 可用性 Y / 合规 Z（各 0–100）');

  return L.join('\n');
}

function genScore(){

function saveScore(){
  const inp=document.getElementById('score-back');

  const v=parseInt((inp&&inp.value)||'',10);
  if(isNaN(v)||v<0||v>100){ toast('请填 0–100 的整数'); return; }
  prog.scores=prog.scores||{};
  prog.scores[ctx.key]=v;
  saveProg(); refreshProg();
  const el=document.getElementById('score-saved');
  if(el) el.innerHTML='\u2705 已记录 '+v+' 分（'+(ctx.name||'产出物')+'），可在学习档案查看。';

function copyText(t){
  if(!t) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('已复制到剪贴板'),()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}
let _toastT=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.2s'; document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(_toastT); _toastT=setTimeout(()=>el.style.opacity='0',1600);
}

function navBar(pv,nx,uid){
