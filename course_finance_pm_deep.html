复述确认\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">复述确认</tspan></text></g><g data-k=\"任务：写便签自查\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：写便签自查</tspan></text></g></svg>", "d": 38.45}], "deliverable": {"type": "skill", "name": "访谈洞察提取", "rubric": ["追问到位", "不引导", "不代言"], "acceptance": "四轮内能问出至少一个具体时刻、一个具体动作、一个替代方案，且不把自己的方案塞给客户"}, "spar": {"role": "被拒的客户", "persona": "说话客气、答案表层，先给社交化版本；被追问具体时刻才会说出真实顾虑（怕影响征信、怕被同事知道）", "mustAsk": ["我就觉得你们这个流程太麻烦，具体哪里麻烦我也说不上来，你们自己看看呗？", "被拒之后我也没太在意，就是有点不舒服，这算不算问题啊？", "额度给少点我理解，可为什么试算的时候给那么多，是不是故意的？", "你们要是让我填这么多信息，我总担心不安全，这个你们怎么保证？"]}, "exemplar": "追问的三层（对照自查）：\n1. 问做法，不问评价。「您上次申请是在什么时候、用的手机还是电脑、卡在哪一步？」——比「您觉得流程怎么样」有用十倍。\n2. 问上一次的具体时刻。「您说慢，是从点提交到看到结果这段时间吗？大概等了多久，当时在做什么？」\n3. 问如果改了会怎样。「如果拒绝页直接告诉您最早什么时候能再申请，您下一步会做什么？」\n反面例子：「您是不是觉得额度太低？」——这是把结论塞给客户，他会顺着你说「对」，然后你拿到一个自己造的答案。", "task": "把《访谈洞察提取》拿到「被拒的客户」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《访谈洞察提取》。现在要让它通过「被拒的客户」这一关。\n【对手的立场】说话客气、答案表层，先给社交化版本；被追问具体时刻才会说出真实顾虑（怕影响征信、怕被同事知道）。\n【他一定会追问】「我就觉得你们这个流程太麻烦，具体哪里麻烦我也说不上来，你们自己看看呗？」 / 「被拒之后我也没太在意，就是有点不舒服，这算不算问题啊？」 / 「额度给少点我理解，可为什么试算的时候给那么多，是不是故意的？」\n【场景】你说「用户深挖需求」，对方立刻回一句：我就觉得你们这个流程太麻烦，具体哪里麻烦我也说不上来，你们自己看看呗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M2U5", "tier": "adv", "step": "understand", "title": "定量+定性混合与分层", "video": {"dur": "4.5min", "script": ["分层做不下去，很少是模型不够准，是名字没人看得懂、没人愿意照着做", "三变量分层（行为 / 价值 / 卡点）+ 访谈原话校验表", "某团队分层从六层压到四层，客群策略执行率从 4 成升到 8 成"]}, "ppt": {"method": "三变量分层（行为 / 价值 / 卡点）+ 访谈原话校验表", "case": "某团队分层从六层压到四层，客群策略执行率从 4 成升到 8 成", "demo": ""}, "objective": "能把定量分层与定性访谈对起来，说清每个分层「凭什么叫这个名字」", "transfer": "本周拉一份近三个月申请数据，按三个变量先分四层，再用访谈原话给每层命名", "vslides": [{"t": "本节要讲什么", "n": "这一节讲分层：为什么很多团队分出六层却没人用。原因不在模型，在名字没人看得懂、人数对不上、策略又都一样。这一节讲三件事：分层为什么别超过四层、定量与定性怎么分工、以及每层必须写的「不做什么」。看完你要能把自家客群分出四层并各给一句策略。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"为何不超四层\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">为何不超四层</tspan></text></g><g data-k=\"定量定性分工\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">定量定性分工</tspan></text></g><g data-k=\"每层写不做什么\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">每层写不做什么</tspan></text></g></svg>", "d": 28.99}, {"t": "分层为什么常做成六层没人用", "n": "分层最常见的失败是做成六到八层，每层名字很专业，然后没人用。原因有三。第一，名字不可解释：叫「高潜低活」，业务听完不知道这些人具体长什么样，于是照旧按老办法做。第二，人数不可核：每层占比加起来不等于一，或者口径没写清，一审计就崩。第三，策略不可执行：每层都写「加强触达」，等于没写。有效的分层一般不超过四层，每层能用一句日常话讲清——「刚工作两年、急着用钱、怕被拒的年轻人」这种描述，业务一听就知道是谁。分层的目标不是把人群切细，是让不同的人拿到不同的处理方式。切得再细，如果处理方式一样，等于没分层。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">分层四条</tspan></text><g data-k=\"≤4 层\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">≤4 层</tspan></text></g><g data-k=\"名字要日常\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">名字要日常</tspan></text></g><g data-k=\"人数要可核\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">人数要可核</tspan></text></g><g data-k=\"策略要不同\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">策略要不同</tspan></text></g></svg>", "d": 62.4}, {"t": "定量给边界，定性给名字", "n": "定量和定性在这里分工很清楚。定量做两件事：划边界、算人数。用三个变量通常就够——行为（申请频率与完成度）、价值（批核额度与用信率）、卡点（在哪一步流失）。三个变量交叉，能切出四层且互不重叠。定性做一件事：给名字。拿每一层的抽样客户去访谈，找出他们说话的共同点，用他们自己的词命名。为什么必须用他们的词？因为业务和运营要拿这个名字去写话术、排活动，名字越像客户自己说的话，执行越不容易走偏。举个反例：把一层叫「价格敏感型」，运营会直接给利率优惠；但如果访谈发现他们真正在意的是「怕被拒的尴尬」，那优惠根本没用，该改的是申请流程的私密性。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">分工 A</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">分工 B</tspan></text><g data-k=\"定量：切边界、算人数\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">定量：切边界、算人数</tspan></text></g><g data-k=\"定性：起名字、找真约束\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">定性：起名字、找真约束</tspan></text></g></svg>", "d": 65.74}, {"t": "每层一句策略，还要写清不做什么", "n": "分层方案里最容易被忽略的一行是「不做什么」。因为资源有限，给某一层的资源必然从另一层挪出来。比如把「首申未过」这一层的复申引导做重，就意味着「高频小额」那层这个季度不追加权益。写清不做什么，有两个好处：一是让决策层知道取舍，避免会上被问「为什么这层没有」；二是让执行团队不用再猜。策略要写到动作：改哪个页面、发什么内容、由谁触达、什么时候。最后提醒一句：分层不是越细越好，四层是多数团队的执行上限。第五层开始，你在会上讲得越细，落地时越没人记得住。另外建议每层配一个「典型人物」一句话，比如「32 岁、装修差三万、晚上十点填完申请」。有这一句，运营写文案时脑子里有人，而不是对着人群标签写。这一句也是给决策层看的，他记不住六个层名，但记得住一个人。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每层四行</tspan></text><g data-k=\"这层是谁\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">这层是谁</tspan></text></g><g data-k=\"人数与指标\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">人数与指标</tspan></text></g><g data-k=\"给什么策略\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">给什么策略</tspan></text></g><g data-k=\"不做什么\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不做什么</tspan></text></g></svg>", "d": 77.23}, {"t": "小结与接下来", "n": "小结三句。第一，分层不超过四层，名字要用日常语言，业务听完知道是谁。第二，定量切边界算人数，定性起名字找真约束，两边缺一不可。第三，每层要写不做什么，资源从别的层挪过来这件事必须摆到桌面上。接下来做任务：拉近三个月申请数据，按三个变量分四层，再用访谈原话给每层命名。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"四层够了\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">四层够了</tspan></text></g><g data-k=\"定量加定性\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">定量加定性</tspan></text></g><g data-k=\"写不做什么\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">写不做什么</tspan></text></g><g data-k=\"任务：分四层\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：分四层</tspan></text></g></svg>", "d": 35.33}], "deliverable": {"type": "agent", "name": "用户分层师", "rubric": ["分层可解释", "人数可核", "策略可执行"], "acceptance": "能给出四层以内、每层有一句可执行策略、且每层至少一条访谈原话支撑的分层方案"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三变量分层（行为 / 价值 / 卡点）+ 访谈原话校验表\n【为什么重要】分层做不下去，很少是模型不够准，是名字没人看得懂、没人愿意照着做\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["分层数不超过四层，每层有一句「这层人是谁」的日常语言描述", "每层给出人数占比与关键指标（如通过率、复申率、客单），并注明数据口径与统计周期", "每层至少一条访谈原话支撑，且原话与该层特征一致，不是硬凑", "每层有对应策略（改什么、给什么、不做什么），写清优先级不为最高层服务"]}, {"id": "M2U6", "tier": "adv", "step": "demo", "title": "千人画像聚类 → 分层", "video": {"dur": "4.4min", "script": ["AI 天生爱多分层、爱起专业名，这两点恰好是分层落地失败的主因", "三变量交叉 + 提示词约束（层数上限、命名规则、禁编人数）", "「闪电贷」近 90 天 1.2 万申请人行为与结果数据（已聚合脱敏）"]}, "ppt": {"method": "三变量交叉 + 提示词约束（层数上限、命名规则、禁编人数）", "case": "「闪电贷」近 90 天 1.2 万申请人行为与结果数据（已聚合脱敏）", "demo": "WorkBuddy 内跑一遍：贴聚合表 → 四层方案 → 人改三处"}, "objective": "能把一份千人画像表跑成四层分层方案，并指出 AI 分层的三处不合理", "transfer": "用这套提示词跑一次自家申请数据，把 AI 给的层名换成访谈原话再发业务确认", "vslides": [{"t": "本节要讲什么", "n": "这一节跑一次真实分层：1.2 万申请人的聚合数据，三个变量切四层。你会看到 AI 第一版给了六层，还起了「沉默价值客群」这种名字。这一节讲三件事：三个变量为什么够、提示词要卡哪两条、以及层名怎么换成客户原话。看完你会得到一份业务愿意照着做的分层。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"三个变量够用\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三个变量够用</tspan></text></g><g data-k=\"提示词卡两条\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">提示词卡两条</tspan></text></g><g data-k=\"层名换原话\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">层名换原话</tspan></text></g></svg>", "d": 28.51}, {"t": "先看表：三个变量就够切四层", "n": "这份数据是近 90 天 1.2 万申请人的聚合分布，没有任何客户明细。切层的变量我选三个：申请完成度（行为）、批核额度与用信率（价值）、流失环节（卡点）。三个变量交叉，天然能分出四层且互不重叠。为什么不加更多变量？因为每加一个，层数就翻倍，而在金融业务里，超过四层的策略根本执行不下去——运营记不住，系统也配不过来。另外提醒一个易错点：被风控系统直接拦截的申请要单独剔除，否则你会把「规则拦掉的人」算成「产品流失的人」，后续改再多的页面也没用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三变量</tspan></text><g data-k=\"完成度：行为\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">完成度：行为</tspan></text></g><g data-k=\"额度与用信：价值\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">额度与用信：价值</tspan></text></g><g data-k=\"流失环节：卡点\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">流失环节：卡点</tspan></text></g><g data-k=\"层数上限：4\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">层数上限：4</tspan></text></g></svg>", "d": 54.65}, {"t": "跑一遍：让 AI 别起专业名", "n": "提示词里我写了两条硬规则：不许出现「高潜」「低活」「价值客群」这类词，层数不许超过四层，人数占比合计必须是 100%。第一条最容易被忽略，但它决定方案能不能用——名字解释不了，业务就不照做。跑出来的第一版给了六层，还有一层叫「沉默价值客群」，我直接按业务动作合并：凡是策略相同的层就并掉，因为分层的目的不是分类，是分处理方式。合并后四层，每层的策略都不一样：改字段、给提额、补复申、保时效。这时候分层才有意义。另外它给的百分比没写计算方式，我要求补上去重口径，否则审计对不上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"禁专业名词\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">禁专业名词</tspan></text></g><g data-k=\"层数≤4\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">层数≤4</tspan></text></g><g data-k=\"占比合计100%\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">占比合计100%</tspan></text></g><g data-k=\"策略必须不同\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">策略必须不同</tspan></text></g></svg>", "d": 54.91}, {"t": "人改三处，命名换成客户原话", "n": "改完的版本里，第 1 层叫「刚上班、急着用钱、第一次借」，这个名字是从访谈原话里抓的：「我哪懂这些，就怕被拒了丢人」。换成客户自己的说法，运营写话术时就有语感，不会写成「尊贵的客户您好」。第二处改动是第 4 层的策略：AI 建议「加大权益投放」，可这层用信率已经 92%，再投权益纯属浪费，改成「保证到账时效与额度稳定」。第三处是补限制说明，写清未含风控拦截。这三处改动的共同点是：AI 给的是分类，人给的是动作。分类可以自动生成，动作必须有人负责。再补一个常被忽略的限制：分层方案要写明数据窗口和去重口径，比如「近 90 天、按申请人去重、不含被系统拦截」。这三项不写，别人拿同一份数据算出的占比会和你不一样，会上就会变成争论数字而不是讨论策略。把这三个参数当成方案的抬头，比放在附录里有效。抬头写清，讨论就不会再回到「你到底怎么算的」这种问题上。这也是评审时最该先确认的一行，比逐层讨论策略都靠前。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">从分类到动作</tspan></text><g data-k=\"AI 分类\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">AI 分类</tspan></text></g><g data-k=\"合并同策略层\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">合并同策</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">略层</tspan></text></g><g data-k=\"换客户原话命名\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">换客户原</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">话命名</tspan></text></g><g data-k=\"写动作与不做\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">写动作与</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">不做</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 86.16}, {"t": "小结与接下来", "n": "小结三句。第一，完成度、额度与用信、流失环节三个变量交叉，就能切出互不重叠的四层。第二，提示词里要卡死层数上限与命名规则，否则 AI 一定给你六层和一堆术语。第三，层名换成客户自己的说法，运营写话术才有语感，执行才不走偏。接下来做任务：用这套提示词跑一次自家数据，把层名换成访谈原话后发业务确认。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"三变量\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三变量</tspan></text></g><g data-k=\"卡层数与命名\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">卡层数与命名</tspan></text></g><g data-k=\"换原话\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">换原话</tspan></text></g><g data-k=\"任务：跑自家数据\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：跑自家数据</tspan></text></g></svg>", "d": 37.13}], "deliverable": {"type": "agent", "name": "用户分层师", "rubric": ["层数合理", "命名可用", "人数可核"], "acceptance": "能产出《用户分层师》并通过本单元评分要点"}, "demo": {"ref": "■ 分层方案（4 层，合计 100%）\n\n第 1 层｜刚上班、急着用钱、第一次借（占比 34%）\n 描述：工作两三年，遇到装修、换手机、看病这类一次性支出，第一次用消费贷，最怕被拒。\n 人数与计算：90 天申请 4,080 人 ÷ 12,000 = 34%（口径：按申请人去重）\n 关键指标：完成度 41%（第二步资料填写处流失最多）｜复申率 12%｜用信率 63%\n 策略：申请页字段后移、增加「先看能借多少再看要填什么」；拒绝页给复申时间与补件清单\n 不做：本期不追加利率优惠，这层对价格不敏感，对不确定感敏感\n\n第 2 层｜借过几次、按时还、额度不够用（占比 27%）\n 描述：过去一年借过 2–4 次，都按时还，觉得额度不够，会同时比较两三家。\n 人数与计算：3,240 ÷ 12,000 = 27%\n 关键指标：完成度 72%｜复申率 48%｜用信率 81%\n 策略：额度成长可视化（还满几期可提额）、给提额券；比较场景补充「同客群额度对比」\n 不做：不再重复触达首借优惠，这层早已转化\n\n第 3 层｜试过一次没过、后来没再来（占比 29%）\n 描述：申请过但被拒，之后没有复申，多数人不知道隔多久能再申请。\n 人数与计算：3,480 ÷ 12,000 = 29%\n 关键指标：完成度 55%｜复申率 6%｜用信率 0%\n 策略：拒绝页加复申时间与补件清单；30 天后推送一次「条件已更新」提醒\n 不做：不做降价挽留，这层根本没到定价环节\n\n第 4 层｜频繁小额、周转型（占比 10%）\n 描述：一年借 6 次以上、单笔金额小，借了还、还了又借，对到账速度最敏感。\n 人数与计算：1,200 ÷ 12,000 = 10%\n 关键指标：完成度 88%｜复申率 76%｜用信率 92%\n 策略：保证到账时效与额度稳定，减少规则变动打扰\n 不做：不新增权益，这层已高度活跃，投入产出比低\n\n■ 口径与限制\n 占比按申请人数去重计算，合计 100%；数据窗口 90 天，未含被系统直接拦截的申请。\n 本方案未使用任何客户级明细，全部基于聚合分布。", "fix": ["把 AI 最初给的 6 层压到 4 层，并删掉「高潜低活」这类名字——名字解释不了，业务就不会照做。", "给每层补了计算方式与去重口径，AI 原本直接给百分比，没写怎么算的，审计一问就崩。", "把第 4 层的策略从「加大权益投放」改成「保证时效与稳定」——这层已经 92% 用信，再投权益是浪费。", "补了限制说明：未含被系统直接拦截的申请，避免把风控拦截算成产品流失。"], "judge": "判断依据：层数是否 ≤4；层名是否用日常语言；每层人数是否给出计算方式与口径；是否写了「不做什么」；有没有把风控拦截混进产品流失", "sheet": {"situ": "你是「模拟银行 X」的产品经理，同事拿了一版六层分层方案来评审。你要逐条判断这段有什么问题、该合并还是保留、怎么改。", "ask": "① 判断这段属于哪一类问题；② 判定该保留还是合并/改写；③ 写出一句可执行的改法。", "gen": "请基于以上判定，输出：① 合并后的四层方案（每层一句话描述 + 策略 + 不做什么）；② 哪两层的策略最该先动，理由用数据说明；③ 还需要补哪两项数据才能让方案闭合。", "mats": [{"id": "L01", "src": "方案 段 1", "text": "第 1 层：高潜低活客群，占比 18%，策略为加强触达、提升活跃。"}, {"id": "L02", "src": "方案 段 2", "text": "第 2 层：沉默价值客群，占比 15%，策略为加强触达、提升活跃。"}, {"id": "L03", "src": "方案 段 3", "text": "第 3 层：价格敏感型，占比 22%，策略为发放利率优惠券。"}, {"id": "L04", "src": "方案 段 4", "text": "第 4 层：高频小额客群，占比 10%，已 92% 用信，策略为加大权益投放。"}, {"id": "L05", "src": "方案 段 5", "text": "第 5 层：被拒未复申客群，占比 20%，未写人数计算方式。"}, {"id": "L06", "src": "方案 段 6", "text": "六层占比合计 95%，剩余 5% 为其他客群，未做说明。"}], "cols": [{"k": "issue", "name": "主要问题", "hint": "这段最该改的一处", "type": "chips", "w": 3, "tags": ["层名不可解释", "策略雷同", "策略与数据矛盾", "人数不可核", "占比不闭合", "无问题"]}, {"k": "keep", "name": "怎么处理", "hint": "保留 / 合并 / 改写", "type": "chips", "w": 2, "tags": ["保留", "合并", "改写", "删除"]}, {"k": "fix", "name": "改法（一句）", "hint": "写出具体改法，别写「优化命名」", "type": "text", "w": 4, "tags": []}], "key": {"L01": {"issue": "层名不可解释", "keep": "改写", "fix": "改成日常描述如「工作两三年、第一次借、怕被拒」，策略写具体动作"}, "L02": {"issue": "策略雷同", "keep": "合并", "fix": "与第 1 层策略相同，按业务动作合并为一层，层数从 6 降到 4"}, "L03": {"issue": "无问题", "keep": "保留", "fix": "层名可解释，但优惠策略需补「为什么不改流程」的判断依据"}, "L04": {"issue": "策略与数据矛盾", "keep": "改写", "fix": "用信已 92%，改成「保时效与额度稳定」，不再投权益"}, "L05": {"issue": "人数不可核", "keep": "改写", "fix": "补人数与去重口径（如 90 天申请人去重），并写明数据来源"}, "L06": {"issue": "占比不闭合", "keep": "改写", "fix": "把剩余 5% 并入最接近的一层或单列说明，合计必须为 100%"}}, "notes": {"L02·issue": "两层策略完全一样（都是加强触达），说明它们对业务没有不同处理方式，应合并而不是细分", "L04·issue": "数据自己打了策略的脸：用信率 92% 说明不需要再刺激，投权益是浪费预算", "L06·issue": "占比合计不等于 100% 是审计红线，评审时第一眼就会被指出来", "L05·issue": "只有百分比没有人数与口径，等于不可核；这一条最容易被追问「你怎么算的」", "L03·keep": "价格敏感型可以保留，但要能证明这层真的对价格敏感，而不是凭印象命名", "L01·issue": "「高潜低活」业务听完不知道是谁，也不知道该做什么，这是分层落地失败的头号原因"}, "delta": [{"op": "改", "frm": "把 L02 判为「保留」，理由是客群不同", "to": "判「合并」：策略相同即合并，分层目的是分处理方式不是分类", "why": "只按人群特征分类会越分越多，最终没人执行；判据应是策略是否不同", "kw": ["合并", "策略相同", "处理方式", "层数"]}, {"op": "改", "frm": "接受 L04 的「加大权益投放」", "to": "按数据改成「保时效与额度稳定」，并把权益预算挪到低用信层", "why": "策略必须由数据支持。92% 用信率的层再加权益，是把预算投在已经饱和的地方", "kw": ["用信率", "饱和", "预算", "时效"]}, {"op": "删", "frm": "把 L06 的「其余 5% 忽略不计」", "to": "补齐到 100% 或单列说明来源", "why": "占比不闭合在审计里是硬伤，也说明数据口径没对齐，整个方案可信度下降", "kw": ["100%", "闭合", "口径", "审计"]}], "refsheet": "L01｜层名不可解释｜改写｜换成日常描述 + 具体策略\\nL02｜策略雷同｜合并｜与第 1 层合并，层数降到 4\\nL03｜无问题｜保留｜补「为何用优惠而非改流程」的依据\\nL04｜策略与数据矛盾｜改写｜改为保时效与额度稳定\\nL05｜人数不可核｜改写｜补人数与去重口径\\nL06｜占比不闭合｜改写｜补齐至 100% 或单列说明", "forbid": "1[3-9]\\d{9}|\\d{6}(19|20)\\d{2}[01]\\d[0-3]\\d{4}[0-9Xx]", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是「闪电贷」近 90 天申请人聚合数据（仅聚合量，无客户明细）：\n[粘贴：分层变量分布表，含申请频次、完成度、批核额度区间、用信率、流失环节]\n请输出不超过 4 层的分层方案，每层包含：\n① 一句日常语言描述（这层人是谁，不用行业术语）；\n② 人数与占比（必须能用给定数据算出，写清计算方式；算不出就写「需补数据」）；\n③ 关键指标（通过率 / 复申率 / 用信率中至少两个）；\n④ 对应策略与「不做什么」。\n规则：禁止出现「高潜」「低活」「价值客群」这类无法解释的词；层数不得超过 4；人数占比合计必须为 100%。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三变量交叉 + 提示词约束（层数上限、命名规则、禁编人数）\n【参考案例】「闪电贷」近 90 天 1.2 万申请人行为与结果数据（已聚合脱敏）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是「闪电贷」近 90 天申请人聚合数据（仅聚合量，无客户明细）：\n[粘贴：分层变量分布表，含申请频次、完成度、批核额度区间、用信率、流失环节]\n请输出不超过 4 层的分层方案，每层包含：\n① 一句日常语言描述（这层人是谁，不用行业术语）；\n② 人数与占比（必须能用给定数据算出，写清计算方式；算不出就写「需补数据」）；\n③ 关键指标（通过率 / 复申率 / 用信率中至少两个）；\n④ 对应策略与「不做什么」。\n规则：禁止出现「高潜」「低活」「价值客群」这类无法解释的词；层数不得超过 4；人数占比合计必须为 100%。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M2U7", "tier": "adv", "step": "todo", "title": "建用户分层 + 旅程地图", "video": {"dur": "4.6min", "script": ["分层告诉你「谁」，旅程告诉你「在哪」，两样合起来才是能派活的方案", "四层分层 + 五站旅程（看到 / 申请 / 审批 / 用信 / 还款）+ 断点标注", "某产品用旅程图发现「审批中无反馈」是最大断点，加进度提示后投诉降三成"]}, "ppt": {"method": "四层分层 + 五站旅程（看到 / 申请 / 审批 / 用信 / 还款）+ 断点标注", "case": "某产品用旅程图发现「审批中无反馈」是最大断点，加进度提示后投诉降三成", "demo": "旅程图填写指引：先走完五站，再标断点，最后挂层"}, "objective": "能产出一份四层分层 + 一张主旅程地图，标出每层的断点与该改的位置", "transfer": "本月把分层与旅程图合成一页，发给业务与运营各一份，请他们各自认领一层的动作", "vslides": [{"t": "本节要讲什么", "n": "这一节把分层和旅程合起来：分层说谁，旅程说在哪。两层信息交叉出来的那个点，就是断点。这一节讲三件事：五站旅程怎么画、断点的固定句式、以及为什么排序必须按影响人数。看完你能拿出一页能派活的方案。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"五站旅程\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">五站旅程</tspan></text></g><g data-k=\"断点句式\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">断点句式</tspan></text></g><g data-k=\"按人数排序\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">按人数排序</tspan></text></g></svg>", "d": 25.9}, {"t": "分层管谁，旅程管在哪", "n": "分层和旅程是两件事，缺一件方案就派不出去。分层回答「这些人是谁、要什么」，旅程回答「他在这条路上哪一步卡住」。只有分层，你会得到四句人群描述，但没人知道改哪里；只有旅程，你会得到一条流程，但不知道该优先修哪一段。合起来的用法是：把四层挂到五站上，看哪一层在哪一站流失最多，那个交叉点就是断点。五站分别是看到广告、进入申请、审批等待、用信、还款。每站都要写两行：用户做了什么、系统做了什么。只写用户侧，你会得出「用户没耐心」这种结论；写了系统侧，你才发现是系统没告诉他还要等多久。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五站旅程</tspan></text><g data-k=\"看到广告\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">看到广告</tspan></text></g><g data-k=\"进入申请\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">进入申请</tspan></text></g><g data-k=\"审批等待\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">审批等待</tspan></text></g><g data-k=\"用信\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">用信</tspan></text></g><g data-k=\"还款\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">还款</tspan></text></g></svg>", "d": 58.61}, {"t": "断点怎么写才具体", "n": "断点的定义很明确：用户此刻不知道发生了什么，或者他被迫做了多余的动作。写法有一个固定句式：位置 + 他不知道什么 + 影响哪层 + 影响多少人。比如「审批等待站，用户不知道还要等多久，影响第 1 与第 3 层，约 7,560 人」。这个句式的好处是可排期：位置决定改哪个页面，人数决定优先级，影响层决定改给谁看。不合格写法是「审批环节体验不佳」——不佳在哪、影响谁、多少人，一个都没有。另外提醒：断点不要写超过六个，写多了等于没有优先级，最后谁都不动。四个到六个是能真正推动的区间。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">断点四要素</tspan></text><g data-k=\"位置：哪一站\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">位置：哪一站</tspan></text></g><g data-k=\"他不知道什么\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">他不知道什么</tspan></text></g><g data-k=\"影响哪层\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">影响哪层</tspan></text></g><g data-k=\"影响多少人\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">影响多少人</tspan></text></g></svg>", "d": 61.97}, {"t": "排序按人数，不按感觉", "n": "最后一步是排序，并且必须按影响人数排，不能按主观重要性。理由很实际：会上讨论时，每个人都会说自己负责的那段最疼，唯一能让大家闭嘴的是数字。按人数排完，通常会出现一个反直觉的结论——最该改的不是你认为最难的那段，而是最平淡但人最多的那段，比如「审批中没进度提示」。这一条改动成本极低，却能覆盖七成以上的人。这就是旅程图的价值：它把注意力从「复杂问题」拉回「多数人的问题」。排完之后只选两个，写清理由（人数加成本），剩下的明确排到下季度，这样既不贪，也不糊。最后补一句：旅程图不要画成流程图。流程图讲系统怎么走，旅程图讲用户在第几站开始怀疑这件事靠不靠谱——两者的区别就体现在断点那一列，没有断点的旅程图等于流程文档。断点也不必写得漂亮，写清「用户此刻在猜什么」就够了。判断标准很简单：这条路线上用户有没有一次想问「现在到底怎么了」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"按人数排序\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">按人数排序</tspan></text></g><g data-k=\"只选两个开工\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只选两个开工</tspan></text></g><g data-k=\"其余明确排期\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">其余明确排期</tspan></text></g></svg>", "d": 87.41}, {"t": "小结与接下来", "n": "小结三句。第一，五站每站写两行：用户做什么、系统做什么，只写用户侧容易得出错误结论。第二，断点四要素：位置、他不知道什么、影响哪层、影响多少人，缺一个就排不了期。第三，排序按人数不按感觉，最该改的往往是平淡但人最多的那一段。接下来做任务：把分层与旅程合成一页，发业务与运营，请他们各自认领一层的动作。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"五站两行\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">五站两行</tspan></text></g><g data-k=\"断点四要素\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">断点四要素</tspan></text></g><g data-k=\"按人数排\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">按人数排</tspan></text></g><g data-k=\"任务：合成一页\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：合成一页</tspan></text></g></svg>", "d": 40.03}], "deliverable": {"type": "skill", "name": "用户分层师", "rubric": ["旅程完整", "断点具体", "改动可派"], "acceptance": "一页分层 + 一页旅程：旅程含五站、断点 ≥4 个、每个断点挂层与改动、按影响人数排序"}, "practice": {"steps": ["画五站旅程：看到广告 / 进入申请 / 审批等待 / 用信 / 还款，每站写用户动作与系统动作", "标断点：每站找「用户不知道发生了什么」或「要做多余动作」的地方，至少标四个", "把四层挂到断点上：哪一层在哪一站流失最多，用数据说话", "给每个断点写一个改动与责任角色，按影响人数排序"], "exemplar": "【《分层 + 旅程》· 闪电贷】数据窗口：近 90 天　编制：产品组\n\n■ 一、四层\n　第 1 层 刚上班第一次借：工作两三年、怕被拒｜34%｜策略：字段后移、拒绝页给复申路径\n　第 2 层 借过按时还：额度不够用、会比价｜27%｜策略：额度成长可视化、提额券\n　第 3 层 被拒没再来：不知道隔多久能再申｜29%｜策略：复申时间 + 补件清单 + 30 天提醒\n　第 4 层 频繁小额：对到账速度敏感｜10%｜策略：保时效与额度稳定，不加权益\n\n■ 二、五站旅程\n　1. 看到广告：用户在信息流看到「最高 20 万」｜系统按人群定向投放\n　2. 进入申请：用户点进去先看到额度试算｜系统要求授权征信查询\n　3. 审批等待：用户等结果，无进度提示｜系统后台跑规则与模型\n　4. 用信：用户提款到银行卡｜系统放款并推送账单日\n　5. 还款：用户主动还款或自动扣款｜系统发送一次提醒\n\n■ 三、断点清单（按影响人数排序）\n　B1｜位置：审批等待｜用户此刻不知道：还要等多久、会不会被拒｜影响层：第 1、3 层｜影响人数：约 7,560 人\n　　改动：审批页加进度条与「预计 X 分钟内出结果」｜责任：产品 + 后端\n　B2｜位置：进入申请｜用户此刻不知道：试算额度和最终额度是什么关系｜影响层：第 1、2 层｜影响人数：约 7,320 人\n　　改动：试算结果旁加一行口径说明｜责任：产品\n　B3｜位置：审批后被拒｜用户此刻不知道：为什么被拒、什么时候能再申｜影响层：第 3 层｜影响人数：约 3,480 人\n　　改动：拒绝页四类原因 + 复申时间 + 补件清单｜责任：产品 + 合规\n　B4｜位置：还款｜用户此刻不知道：扣款失败会怎样｜影响层：第 4 层｜影响人数：约 1,200 人\n　　改动：扣款前 3 天与失败当日各一次提示｜责任：运营\n\n■ 四、本季度做哪两个\n　B1 与 B3：影响人数最大（7,560 与 3,480），且都在纯前端与前端口径范围内，改动成本低；B2 需与风控对齐口径，排下季度。"}, "task": "产出《用户分层师》：画五站旅程：看到广告 / 进入申请 / 审批等待 / 用信 / 还款，每站写用户动作与系统动作；标断点：每站找「用户不知道发生了什么」或「要做多余动作」的地方，至少标四个；把四层挂到断点上：哪一层在哪一站流失最多，用数据说话；给每个断点写一个改动与责任角色，按影响人数排序", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的消费金融 AI 产品经理。本单元属于「M2 AI 辅助需求与用户研究」模块，你要交付的是《用户分层师》。\n【场景】业务侧这周的诉求是：分层告诉你「谁」，旅程告诉你「在哪」，两样合起来才是能派活的方案。参考做法：某产品用旅程图发现「审批中无反馈」是最大断点，加进度提示后投诉降三成。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（四层分层 + 五站旅程（看到 / 申请 / 审批 / 用信 / 还款）+ 断点标注），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《分层 + 旅程》填写模板】产品：{{}}　数据窗口：{{}}　编制：{{}}\n\n■ 一、四层（每层一句日常描述 + 策略）\n　第 1 层 {{名字}}：{{描述}}｜占比 {{}}%｜策略：{{}}\n　第 2 层 {{名字}}：{{描述}}｜占比 {{}}%｜策略：{{}}\n　第 3 层 {{名字}}：{{描述}}｜占比 {{}}%｜策略：{{}}\n　第 4 层 {{名字}}：{{描述}}｜占比 {{}}%｜策略：{{}}\n\n■ 二、五站旅程（用户动作 / 系统动作）\n　1. 看到广告：用户 {{}}｜系统 {{}}\n　2. 进入申请：用户 {{}}｜系统 {{}}\n　3. 审批等待：用户 {{}}｜系统 {{}}\n　4. 用信：用户 {{}}｜系统 {{}}\n　5. 还款：用户 {{}}｜系统 {{}}\n\n■ 三、断点清单（≥4 个，按影响人数排序）\n　B1｜位置：{{哪一站}}｜用户此刻不知道：{{}}｜主要影响层：{{第几层}}｜影响人数：{{}}\n　　改动：{{}}｜责任：{{角色}}\n　B2｜{{}}\n　B3｜{{}}\n　B4｜{{}}\n\n■ 四、本季度做哪两个\n　{{断点编号}} 与 {{断点编号}}，理由：{{影响人数 + 改动成本}}", "rubric": ["旅程五站齐全，每站都写了用户动作与系统动作两行，不只写用户侧", "断点 ≥4 个，每个断点写明「用户此刻不知道什么」或「多余动作是什么」", "每个断点标注影响最大的层与人数，人数来源写清（数据或估算）", "每个断点配一个改动与责任角色，并给出影响人数排序，不按主观重要性排"]}, {"id": "M2U8", "tier": "adv", "step": "spar", "title": "焦点小组", "video": {"dur": "4.2min", "script": ["焦点小组的风险是沉默者被代表、声音大的人定义结论", "角色陪练：六人小组，一人沉默、一人主导、一人质疑，练控场与取证", "某团队焦点小组开成吐槽会，两小时只得到一句「体验不好」，回去无从下手"]}, "ppt": {"method": "角色陪练：六人小组，一人沉默、一人主导、一人质疑，练控场与取证", "case": "某团队焦点小组开成吐槽会，两小时只得到一句「体验不好」，回去无从下手", "demo": "陪练演示：把「大家都觉得慢」拆成三个人三个不同环节"}, "objective": "能在焦点小组里控住场面，从七嘴八舌里取出三条可验证结论，并说清样本局限", "transfer": "下次焦点小组前，把三个待验证假设写成一页，会上只围绕假设收证据", "vslides": [{"t": "本节要讲什么", "n": "这一节是焦点小组陪练。六个人里有人主导、有人沉默、有人质疑，你稍不留神就得到一句「都被同意」的空结论。这一节讲三件事：怎么把评价拉回事实、沉默者与主导者分别怎么处理、以及结论与样本局限怎么写。练完你要能带回三条可验证的假设。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"评价拉回事实\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">评价拉回事实</tspan></text></g><g data-k=\"两类人两类处理\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">两类人两类处理</tspan></text></g><g data-k=\"结论与局限\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">结论与局限</tspan></text></g></svg>", "d": 29.93}, {"t": "焦点小组最容易得到「全都同意」", "n": "焦点小组最大的陷阱是所有人都同意。因为群体场合有社交压力，一旦有人说了「慢」，其他人点头的成本最低、反对的成本最高，于是全场迅速达成一个正确但没用的共识：体验不好。你回去还是不知道该改哪。破解办法是把话题从评价拉到事实：不问「觉得怎么样」，问「上次是几点申请的、用什么设备、卡在第几步」。事实有唯一答案，评价没有；事实能拼出断点，评价只能拼出情绪。还有一条纪律：全组讨论跑偏时，你要敢于打断并切回假设，主持人的职责不是让大家聊得开心，是拿到可验证的证据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">陷阱</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">目标</tspan></text><g data-k=\"「体验不好」 全场同意 · 无法改\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">「体验不好」</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">全场同意 · 无法改</tspan></text></g><g data-k=\"「第二步填单位电话时退了」 一人一说 · 可改\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"87.0\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">「第二步填单位电话时退</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">了」</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">一人一说 · 可改</tspan></text></g></svg>", "d": 54.19}, {"t": "沉默者与主导者，两种人两种处理", "n": "六个人里通常有两类极端：一类主导发言，一类全程沉默。主导者会不断给结论，你要做的是把他的结论一次次拉回事实，比如「您说的贵，是和哪家比、差多少」。沉默者往往不是没意见，而是插不上话，或者觉得自己的情况「不典型」。给他一个低门槛入口——不需要评价，只需要回忆：「您上次是几点申请的，手机还是电脑」。这类问题没有对错，回答压力小，往往能问出最有价值的细节。记住：如果散会时你有三个人没说过一句具体经历，这场小组的信息量只等于一个人。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">两类人</tspan></text><g data-k=\"主导者：结论拉回事实\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">主导者：结论拉回事实</tspan></text></g><g data-k=\"沉默者：问回忆不问评价\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">沉默者：问回忆不问评价</tspan></text></g><g data-k=\"每人至少一段具体经历\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">每人至少一段具体经历</tspan></text></g></svg>", "d": 47.33}, {"t": "结论怎么写，样本局限怎么交代", "n": "散会后你手上应该有三样东西：三个不同参与者的具体经历、一张断点清单、一段样本局限说明。结论按人数标：几个人支持、谁反对、谁没表态。别写「普遍反映」，写「6 人中 3 人提到第二步流失，2 人提到到账慢，1 人未表态」。样本局限必须交代：六人小组不能代表客群，只能用于形成假设，验证要靠数据或更大样本。这一句看起来削弱结论，其实保护你：将来假设被数据推翻，你不会被追责；假设被验证，你的判断力反而被认可。焦点小组是用来产生假设的，不是用来证明结论的，这条界线要守住。再补一个实操细节：散会前留五分钟做一轮「一句话确认」，让每位参与者说一句「今天最想让你们改的一件事」。这一轮往往能收出前面两小时没说的东西，因为一对一式的表态压力最小，而且它天然给了沉默者一次发言机会。这一轮还能顺手筛出下一位深访对象：说得最具体的那个人，值得单独约一次。把这一句话原样记下来，往往比你自己总结的三条结论更有说服力。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"结论按人数标\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论按人数标</tspan></text></g><g data-k=\"写明谁没表态\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写明谁没表态</tspan></text></g><g data-k=\"交代样本局限\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">交代样本局限</tspan></text></g><g data-k=\"只用于形成假设\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">只用于形成假设</tspan></text></g></svg>", "d": 83.14}, {"t": "小结与接下来", "n": "小结三句。第一，别问「觉得怎么样」，问「上次几点、用什么设备、卡在第几步」。第二，沉默者问回忆不问评价，主导者的结论要一次次拉回具体比较。第三，结论按人数标并交代样本局限，焦点小组只用来形成假设，不用来证明结论。接下来做任务：下次开会前把三个待验证假设写成一页，会上只围绕假设收证据。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"问事实不问评价\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">问事实不问评价</tspan></text></g><g data-k=\"两类人\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">两类人</tspan></text></g><g data-k=\"只出假设\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">只出假设</tspan></text></g><g data-k=\"任务：三个假设\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：三个假设</tspan></text></g></svg>", "d": 35.14}], "deliverable": {"type": "agent", "name": "用户分层师", "rubric": ["控场", "取证", "不越界"], "acceptance": "四轮内能拿到三个不同参与者的具体经历，并标明谁没发言、哪条结论只有一人支持"}, "spar": {"role": "焦点小组主持人助理（六人小组现场）", "persona": "现场声音分散：一位主导发言、两位附和、一位沉默、一位持续质疑「你们是不是就想让我们多借钱」", "mustAsk": ["主持人不小心问了「大家是不是都觉得慢」，全场点头，这时你怎么把话题拉回具体事实？", "有位参与者一直没说话，你怎么请他开口而不让他觉得被针对？", "两位参与者对「慢」的理解不一样，一个说填资料、一个说到账，你要不要统一口径？", "有人质疑「你们就是想让我们多借钱」，现场气氛变紧，你怎么回应又不失立场？"]}, "exemplar": "控场三招（对照自查）：\n1. 点名不点意见：「张先生，您刚才提到试算额度，您上次看到的是多少？」——点名要具体到事实，不点到观点。\n2. 拆分歧不压分歧：「您两位说的慢，一个在填资料、一个在等到账，我们分开说」——分歧往往指向不同断点，压掉就丢了信息。\n3. 给沉默者一个低门槛入口：「不用评价，就说您上次是几点申请的、用手机还是电脑」。\n反面例子：「大家是不是都觉得流程太长？」——全场点头，你拿到一个所有人都同意却什么都改不了的结论。", "task": "把《用户分层师》拿到「焦点小组主持人助理（六人小组现场）」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《用户分层师》。现在要让它通过「焦点小组主持人助理（六人小组现场）」这一关。\n【对手的立场】现场声音分散：一位主导发言、两位附和、一位沉默、一位持续质疑「你们是不是就想让我们多借钱」。\n【他一定会追问】「主持人不小心问了「大家是不是都觉得慢」，全场点头，这时你怎么把话题拉回具体事实？」 / 「有位参与者一直没说话，你怎么请他开口而不让他觉得被针对？」 / 「两位参与者对「慢」的理解不一样，一个说填资料、一个说到账，你要不要统一口径？」\n【场景】你说「焦点小组」，对方立刻回一句：主持人不小心问了「大家是不是都觉得慢」，全场点头，这时你怎么把话题拉回具体事实？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M3", "title": "M3 AI 辅助 PRD 与产品定义", "dims": ["content", "tools", "dev"], "units": [{"id": "M3U1", "tier": "basic", "step": "understand", "title": "PRD 是什么，AI 能/不能写什么", "video": {"dur": "4.6min", "script": ["PRD 的风险不在写得慢，在于把「必须由人拍的取舍」交给模型顺手填了", "PRD 八段结构 + 分工表（AI 起稿 / 人定稿 / 绝不外包）", "某团队用 AI 起草 PRD，把风控规则段写成了「由模型智能判断」，评审当场退回"]}, "ppt": {"method": "PRD 八段结构 + 分工表（AI 起稿 / 人定稿 / 绝不外包）", "case": "某团队用 AI 起草 PRD，把风控规则段写成了「由模型智能判断」，评审当场退回", "demo": "同一句需求：AI 版 PRD 与人改版 PRD 的差异对照"}, "objective": "能说清 PRD 里哪五段可以交给 AI 起稿、哪三段必须自己写，并各举一个本域例子", "transfer": "把手上在写的一份 PRD 按「AI 起稿 / 我定稿」标一遍，标完发给研发负责人看一眼", "vslides": [{"t": "本节要讲什么", "n": "这一节讲 PRD 的分工：哪几段可以交给 AI 起稿，哪几段必须你自己写。分工搞错，PRD 会看起来完整、实际每一段都在等别人替你拍板。这一节讲三件事：PRD 八段分别是什么、哪五段能交给 AI、以及哪三段不能。看完你要能对着一份 PRD 指出哪几段是别人替你写的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"PRD 八段\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">PRD 八段</tspan></text></g><g data-k=\"哪五段能交给 AI\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">哪五段能交给 AI</tspan></text></g><g data-k=\"哪三段必须自己写\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">哪三段必须自己写</tspan></text></g></svg>", "d": 29.88}, {"t": "PRD 的八段，和它的真实用途", "n": "PRD 不只是给研发看的文档，它在金融业务里同时是四样东西：给研发的施工图、给风控的规则说明、给合规的检查依据、给运营的话术来源。所以我要求八段齐全：背景与目标、用户与场景、功能清单、流程与状态、风控与合规、指标与埋点、边界与不做、验收口径。多数人写 PRD 只写前三段和第五段的一半，漏掉的偏偏是后面四段，而后面四段正是评审时被追问的地方。一个简单的自检办法：把 PRD 给三个不同角色看——研发、风控、运营，如果三方看完都还有问题要问，说明你的 PRD 至少缺两段。好的 PRD 不是写得长，是每个角色都能在里面找到自己那一节。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">PRD 八段</tspan></text><g data-k=\"背景目标\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"62.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">背景目标</tspan></text></g><g data-k=\"用户场景\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"62.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">用户场景</tspan></text></g><g data-k=\"功能清单\"><rect x=\"18.0\" y=\"83.5\" width=\"173.0\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"101.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">功能清单</tspan></text></g><g data-k=\"流程状态\"><rect x=\"209.0\" y=\"83.5\" width=\"173.0\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"101.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">流程状态</tspan></text></g><g data-k=\"风控合规\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"141.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">风控合规</tspan></text></g><g data-k=\"指标埋点\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"141.2\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">指标埋点</tspan></text></g><g data-k=\"边界不做\"><rect x=\"18.0\" y=\"162.5\" width=\"173.0\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"180.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">边界不做</tspan></text></g><g data-k=\"验收口径\"><rect x=\"209.0\" y=\"162.5\" width=\"173.0\" height=\"29.5\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"180.7\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">验收口径</tspan></text></g></svg>", "d": 63.55}, {"t": "哪五段可以交给 AI 起稿", "n": "可以交给 AI 起稿的是五段：背景与目标的素材整理、用户与场景的描述、功能清单的展开、流程与状态的穷举、指标与埋点的候选清单。这五段的共同点是「有据可依、可以穷举」。比如流程与状态，人容易漏分支，AI 可以把「申请中、审批中、待补件、已通过、已拒绝、已放款、已结清」全列出来，再让你删。功能清单也一样，它能一次给你二十条，虽然一半不合用，但你删比你想快得多。用法上有一个诀窍：让它先给多，再让你砍。人的毛病是想起步就想周全，结果卡在第一条上半小时；不如让 AI 铺满，你按业务约束砍到五条。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">AI 可起稿的五段</tspan></text><g data-k=\"背景与素材\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">背景与素材</tspan></text></g><g data-k=\"用户与场景\"><g><circle cx=\"42\" cy=\"79.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"83.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"83.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">用户与场景</tspan></text></g><g data-k=\"功能清单展开\"><g><circle cx=\"42\" cy=\"106.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">功能清单展开</tspan></text></g><g data-k=\"流程与状态穷举\"><g><circle cx=\"42\" cy=\"133.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"138.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"138.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">流程与状态穷举</tspan></text></g><g data-k=\"指标与埋点候选\"><g><circle cx=\"42\" cy=\"160.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"165.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"165.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">指标与埋点候选</tspan></text></g></svg>", "d": 58.58}, {"t": "哪三段必须自己写，为什么", "n": "必须自己写的是三段。第一段目标取舍：这次到底优化通过率还是优化不良率，两者在金融里天然冲突，选哪个是业务决策，AI 给的永远是「两者兼顾」。第二段风控规则：哪些人准入、额度怎么定、什么情况转人工，这些涉及资金风险和责任，写成「由模型智能判断」等于没写，评审必然退回。第三段验收口径：什么算做完了、达到多少算达标，这条决定项目能不能结项，也只有你能定。这三段的共同点是不能穷举、必须有人担责。记住一句话：AI 可以帮你把话写清楚，但不能替你决定「要什么、不要什么」。越过这条线，PRD 看起来完整，实际上每一段都在等别人替你拍板。最后补一个自检动作：定稿前把这三段各读一遍，问自己「这句话如果出错了，是我担还是别人担」。答案不是你，就说明这段还该重写。还有一个好用的问题：「这段如果被监管看到，我能不能解释」。答不出，也同样该重写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"目标取舍：我定\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">目标取舍：我定</tspan></text></g><g data-k=\"风控规则：我定\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风控规则：我定</tspan></text></g><g data-k=\"验收口径：我定\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">验收口径：我定</tspan></text></g></svg>", "d": 78.67}, {"t": "小结与接下来", "n": "小结三句。第一，PRD 在金融里同时是施工图、规则说明、检查依据和话术来源，八段缺一段就会被追问。第二，背景、场景、功能、流程、埋点这五段可以 AI 起稿，因为能穷举。第三，目标取舍、风控规则、验收口径必须自己写，这三段要有人担责。接下来做任务：把手上在写的一份 PRD 按「AI 起稿 / 我定稿」标一遍，标完发研发负责人看一眼。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"八段齐全\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">八段齐全</tspan></text></g><g data-k=\"五段可起稿\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">五段可起稿</tspan></text></g><g data-k=\"三段自己写\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三段自己写</tspan></text></g><g data-k=\"任务：标一遍\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：标一遍</tspan></text></g></svg>", "d": 42.7}], "deliverable": {"type": "agent", "name": "PRD 生成师", "rubric": ["分工清楚", "边界守住", "结构完整"], "acceptance": "能对一份 PRD 指出哪几段是 AI 起稿、哪几段必须人写，并说明不自己写会出什么问题"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】PRD 八段结构 + 分工表（AI 起稿 / 人定稿 / 绝不外包）\n【为什么重要】PRD 的风险不在写得慢，在于把「必须由人拍的取舍」交给模型顺手填了\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["八段结构齐全：背景与目标、用户与场景、功能清单、流程与状态、风控与合规、指标与埋点、边界与不做、验收口径", "能指出三段必须人写（目标取舍、风控规则、验收口径），并说明理由不是「比较重要」", "能举一个 AI 起稿写坏的具体例子（如把规则写成「智能判断」），并说明改法", "能说清 AI 起稿后自己要改哪几处，不写「整体润色一下」"]}, {"id": "M3U2", "tier": "basic", "step": "demo", "title": "一句话需求 → 结构化 PRD", "video": {"dur": "4.6min", "script": ["一句话需求背后藏着三个没说的取舍，AI 会替你选一个，通常是错的", "一句话需求 + 八段提示词，一次跑出可评审初稿", "「闪电贷」运营提的需求：「让被拒的客户能马上再申请一次」（原话）"]}, "ppt": {"method": "一句话需求 + 八段提示词，一次跑出可评审初稿", "case": "「闪电贷」运营提的需求：「让被拒的客户能马上再申请一次」（原话）", "demo": "WorkBuddy 内跑一遍：一句话 → 八段 PRD → 人改三处"}, "objective": "能把一句话需求跑成八段 PRD，并指出 AI 稿里三处必须自己重写的地方", "transfer": "用这套提示词把手上最急的一条需求跑一遍，改完目标与验收两段再发评审", "vslides": [{"t": "本节要讲什么", "n": "这一节跑一句真实的运营原话：「让被拒的客户能马上再申请，别等三个月」。这句话里藏着三个没说的取舍。这一节讲三件事：怎么把隐含取舍先标出来、八段提示词怎么写、以及 AI 稿里哪三处必须自己重写。看完你会得到一份能进评审的初稿。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"先标隐含取舍\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">先标隐含取舍</tspan></text></g><g data-k=\"八段提示词\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">八段提示词</tspan></text></g><g data-k=\"三处必须重写\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三处必须重写</tspan></text></g></svg>", "d": 28.56}, {"t": "一句话需求里藏着三个取舍", "n": "运营的原话是「让被拒的客户能马上再申请一次，别等三个月」。这句话里其实有三个没说的取舍：一是「马上」到底是当天还是 30 天；二是缩短冷却期会不会推高不良率，谁承担；三是复申的客户是否要重新做完整风控。这三个取舍运营不会说，因为他不管这块；AI 也不会问，因为它默认选一个最顺的答案。所以第一步不是让它写 PRD，而是先把这三个取舍标出来，写成「待确认」。这一步做不做，决定了你交出去的 PRD 是被评审追问，还是被评审通过。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">需求原话</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">隐含取舍</tspan></text><g data-k=\"运营说的：别再等三个月\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">运营说的：别再等三个月</tspan></text></g><g data-k=\"没说的：多快、风险谁担、要不要重做风控\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">没说的：多快、风险谁担</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">、要不要重做风控</tspan></text></g></svg>", "d": 50.9}, {"t": "跑一遍：八段是怎么铺开的", "n": "提示词里我把八段逐条写死，并且加了两条规则：涉及准入、额度、定价的判断一律写「待风控确认」；目标里的比例必须写口径与基线。第一条拦住了 AI 越权，第二条逼它把话说实。跑出来的稿子前四段基本可用：用户与场景写清了「被拒后想知道还能不能借」，功能清单给了六条且都能建单，流程穷举了四个异常分支，这正是 AI 的强项。第五段它擅自写了「建议将冷却期缩短至 30 天以提升复申率」，我整段删掉换成四个待确认点。第六段埋点给得不错，但要砍掉两个采集不到的。七八段基本是我重写的，因为边界和验收是判断，不是生成。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"前四段可用\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">前四段可用</tspan></text></g><g data-k=\"风控段只留待确认\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风控段只留待确认</tspan></text></g><g data-k=\"边界与验收自己写\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">边界与验收自己写</tspan></text></g></svg>", "d": 63.58}, {"t": "人改三处，PRD 才算能评审", "n": "第一处，目标从「提升体验」改成「30 天复申率 6% 到 12%」，并标注口径和「需核对是否含系统拦截」。第二处，把 AI 替风控写的规则整段删掉，改成四个待确认点，写明由谁确认。第三处，补「边界与不做」，其中「不做包过承诺」是合规红线，AI 想不到，但检查一定会看。另外把验收口径写成四条可判定项，加了「上线后 4 周评估」的窗口。改完这四处，这份 PRD 才能进评审：研发知道做什么，风控知道要确认什么，合规知道边界在哪，业务知道怎么算成功。一句话总结：AI 把结构铺开，人把责任填满。再补一句经验：初稿写完别急着发，先放两小时再读一遍，你会更容易看出哪一段是 AI 替你做决定的——那种段落读起来格外顺，因为它没有取舍。顺手把那种段落里最好看的形容词删掉，PRD 里形容词越多，越说明有人没做判断。把形容词换成数字或范围，是最省力的改写方式。改完再读一遍，句子通常更短，也更像工作语言。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四处必改</tspan></text><g data-k=\"目标带指标\"><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">目标带指</tspan><tspan x=\"58.2\" dy=\"16.900000000000002\">标</tspan></text></g><g data-k=\"风控只留待确认\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">风控只留</tspan><tspan x=\"152.8\" dy=\"16.900000000000002\">待确认</tspan></text></g><g data-k=\"补边界与不做\"><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">补边界与</tspan><tspan x=\"247.2\" dy=\"16.900000000000002\">不做</tspan></text></g><g data-k=\"验收给窗口\"><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">验收给窗</tspan><tspan x=\"341.8\" dy=\"16.900000000000002\">口</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 91.8}, {"t": "小结与接下来", "n": "小结三句。第一，一句话需求里通常藏着「多快」「风险谁担」「要不要重做风控」三个取舍。第二，提示词要写死两条：涉及风控的一律写待确认，目标必须带口径与基线。第三，AI 会擅自替你定风控规则，这一段必须整段删掉换成待确认项。接下来做任务：用这套提示词跑手上最急的一条需求，改完目标与验收两段再发评审。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"先标取舍\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">先标取舍</tspan></text></g><g data-k=\"两条硬规则\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">两条硬规则</tspan></text></g><g data-k=\"风控段要删\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">风控段要删</tspan></text></g><g data-k=\"任务：跑一条需求\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：跑一条需求</tspan></text></g></svg>", "d": 40.32}], "deliverable": {"type": "agent", "name": "PRD 生成师", "rubric": ["结构完整", "取舍明确", "口径可验"], "acceptance": "能产出《PRD 生成师》并通过本单元评分要点"}, "demo": {"ref": "■ 一、背景与目标\n 现状：拒绝后 90 天可复申，近三个月复申率 6%（口径：被拒客户中 90 天内再次提交申请的比例）。\n 目标：把「被拒客户 30 天内复申率」从 6% 提升到 12%（需补基线核对：现有 6% 是否含系统拦截）。\n ⚠ 取舍待确认：本目标与「控制不良率」存在冲突，需业务明确优先级。\n\n■ 二、用户与场景\n 被拒客户（近 90 天被拒未复申，占比约 29%），场景为「被拒后想知道还能不能借、什么时候能借」。\n\n■ 三、功能清单（6 条）\n 1. 拒绝页展示最早可复申时间与需补材料清单\n 2. 拒绝页提供「改善路径」三条（补收入证明 / 降低负债 / 等待查询记录冷却）\n 3. 支持材料预上传，审批前先校验完整性\n 4. 30 天到期前推送一次「条件已更新」提醒\n 5. 复申入口在 App 首页「我的额度」处保留\n 6. 客服知识库同步复申口径\n\n■ 四、流程与状态\n 拒绝 → 展示复申条件 → 用户补材料（可选）→ 等待冷却期 → 到期提醒 → 复申提交 → 审批\n 异常分支：冷却期未满提前提交、材料校验不通过、复申再次被拒（进入二次冷却）\n\n■ 五、风控与合规（不替风控定规则）\n 待风控确认：缩短至 30 天是否触发反欺诈规则；预上传材料是否需留存影像；\n 二次被拒后的冷却期是否延长；查询记录频次是否触及征信查询限制。\n\n■ 六、指标与埋点\n 复申率、复申通过率、拒绝页停留时长、材料预上传率、到期提醒点击率；\n 埋点：拒绝页曝光、改善路径点击、预上传开始/成功、提醒送达/点击、复申提交。\n\n■ 七、边界与不做\n 不做：不降低准入标准；不做「包过」承诺；不主动外呼营销；不改动既有额度模型。\n\n■ 八、验收口径\n ① 拒绝页 100% 展示复申时间与材料清单；② 冷却期到期提醒送达率 ≥95%；\n ③ 复申流程可完整走通，异常分支有明确提示；④ 30 天复申率 ≥12%（上线后 4 周评估）。\n\n⚠ 需补数据：现有 6% 复申率是否剔除系统拦截客户；材料预上传对通过率的影响需 A/B 验证。", "fix": ["把目标里「提升用户体验」改成「30 天复申率从 6% 到 12%」，并补上口径与「需核对是否含系统拦截」——没有口径的目标无法验收。", "在「风控与合规」段把 AI 写的规则整段删掉，只保留四个待确认点——准入与冷却期不是产品能定的，写成建议就是越权。", "补了「边界与不做」，尤其「不做包过承诺」，这条是金融营销的合规红线，AI 不会主动想到。", "把验收口径写成四条可判定项，并给出评估窗口（上线后 4 周），否则这条 PRD 永远结不了项。"], "judge": "判断依据：目标是否带指标与口径；是否替风控定了规则；是否写了边界与不做；验收口径是否可判定且有评估窗口", "sheet": {"situ": "你是「闪电贷」的产品经理，同事按八段写了一版 PRD 草稿，你要在评审前逐段体检：这段属于哪一段、有什么问题、能不能过评审、怎么改。", "ask": "① 判断这段属于八段中的哪一段；② 指出最主要的问题；③ 判定能否过评审；④ 写一句可执行的改法。", "gen": "请基于以上判定，输出：① 两段「不可过」的替换版本（可直接粘贴）；② 两段「需补」要补哪些具体内容；③ 整份 PRD 还缺哪一段。", "mats": [{"id": "P01", "src": "草稿 段 1", "text": "本需求的背景是提升用户体验，目标是让被拒客户能更快再次申请，预期显著提升满意度。"}, {"id": "P02", "src": "草稿 段 2", "text": "功能点：1. 拒绝页展示复申时间；2. 提供改善建议；3. 到期提醒；4. 客服口径同步。"}, {"id": "P03", "src": "草稿 段 3", "text": "风控策略：由模型根据客户资质智能判断是否允许提前复申，一般建议 30 天。"}, {"id": "P04", "src": "草稿 段 4", "text": "流程：被拒 → 展示条件 → 复申 → 审批。"}, {"id": "P05", "src": "草稿 段 5", "text": "指标：复申率提升、满意度提升；埋点：页面曝光、按钮点击。"}, {"id": "P06", "src": "草稿 段 6", "text": "验收口径：上线后体验流畅、风险可控，客户反馈良好即视为达标。"}], "cols": [{"k": "seg", "name": "属于哪一段", "hint": "八段中的哪一段", "type": "chips", "w": 3, "tags": ["背景与目标", "功能清单", "风控与合规", "流程与状态", "指标与埋点", "验收口径"]}, {"k": "issue", "name": "主要问题", "hint": "这段最该改的一处", "type": "chips", "w": 3, "tags": ["目标无指标", "风控越权", "异常缺失", "埋点不可算", "验收不可判", "无问题"]}, {"k": "pass", "name": "能否过评审", "hint": "可过 / 需补 / 不可过", "type": "chips", "w": 2, "tags": ["可过", "需补", "不可过"]}, {"k": "fix", "name": "改法（一句）", "hint": "写成可直接替换的表述", "type": "text", "w": 3, "tags": []}], "key": {"P01": {"seg": "背景与目标", "issue": "目标无指标", "pass": "需补", "fix": "目标改为「30 天复申率 6% 到 12%」，注明口径与基线"}, "P02": {"seg": "功能清单", "issue": "无问题", "pass": "可过", "fix": "四条均可建单，建议补一条「预上传材料校验」"}, "P03": {"seg": "风控与合规", "issue": "风控越权", "pass": "不可过", "fix": "删「模型智能判断」，改为四条待风控确认的判定点"}, "P04": {"seg": "流程与状态", "issue": "异常缺失", "pass": "需补", "fix": "补冷却期未满、材料不通过、二次被拒三个异常分支"}, "P05": {"seg": "指标与埋点", "issue": "埋点不可算", "pass": "需补", "fix": "埋点分曝光/点击/提交/结果四层，指标给计算口径"}, "P06": {"seg": "验收口径", "issue": "验收不可判", "pass": "不可过", "fix": "改成四条带门槛、口径、窗口、责任人；删「体验流畅」"}}, "notes": {"P01·issue": "「显著提升满意度」不是目标，是愿望。目标必须有指标、口径、基线三样", "P03·issue": "「由模型智能判断」= 把责任推给模型，风控一定退回；应列判定点并标待确认", "P06·issue": "「体验流畅、风险可控」无法判定，项目永远结不了项；必须换成可测指标", "P04·issue": "只写主路径是 PRD 最常见的漏项，真实系统里三个异常分支天天发生", "P05·issue": "只有两个埋点算不出漏斗，指标也没给口径，评审会问「复申率怎么算」", "P02·pass": "四条功能都能建单，是这份草稿里唯一可以过评审的一段"}, "delta": [{"op": "改", "frm": "把 P03 判为「需补」（觉得补个阈值就行）", "to": "判「不可过」：整段是越权表述，必须换成待确认判定点", "why": "让模型判断准入，等于把资金风险的决定权交给一段代码，这是风控的硬红线", "kw": ["越权", "不可过", "待风控确认", "模型"]}, {"op": "改", "frm": "接受 P06 的「风险可控」作为验收", "to": "换成四条：展示率 100%、提醒送达 ≥95%、异常可回退、30 天复申率 ≥12%", "why": "验收口径决定项目能否结项；形容词式验收会让项目无限延期", "kw": ["验收", "可判", "门槛", "结项"]}, {"op": "删", "frm": "在 P01 后补一句「同业同类改造平均提升 40%」", "to": "整句删除", "why": "无来源对标写进 PRD，评审第一句就问来源；给不出，整份文档可信度下降", "kw": ["同业", "平均", "对标", "40%"]}], "refsheet": "P01｜背景与目标｜目标无指标｜需补｜改为 6% 到 12%，注明口径基线\\nP02｜功能清单｜无问题｜可过｜可补一条材料校验\\nP03｜风控与合规｜风控越权｜不可过｜换成四条待确认判定点\\nP04｜流程与状态｜异常缺失｜需补｜补三个异常分支\\nP05｜指标与埋点｜埋点不可算｜需补｜四层埋点 + 指标口径\\nP06｜验收口径｜验收不可判｜不可过｜四条带门槛口径窗口责任人", "forbid": "1[3-9]\\d{9}|\\d{6}(19|20)\\d{2}[01]\\d[0-3]\\d{4}[0-9Xx]", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "一句话需求（运营原话）：「让被拒的客户能马上再申请一次，别等三个月。」\n背景：模拟银行 X 闪电贷，当前规则为拒绝后 90 天可复申；近三个月复申率 6%。\n请按八段输出 PRD：\n① 背景与目标（目标必须给指标，不要写「提升体验」）；② 用户与场景；③ 功能清单（≤6 条）；④ 流程与状态（含异常分支）；⑤ 风控与合规（列出必须由风控确认的点，不要替我定规则）；⑥ 指标与埋点；⑦ 边界与不做；⑧ 验收口径（可判定）。\n规则：凡涉及准入、额度、定价的判断，一律写「待风控确认」，不得自行给规则；\n目标里的比例必须写明口径与基线；不确定的地方写「需补数据」。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】一句话需求 + 八段提示词，一次跑出可评审初稿\n【参考案例】「闪电贷」运营提的需求：「让被拒的客户能马上再申请一次」（原话）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n一句话需求（运营原话）：「让被拒的客户能马上再申请一次，别等三个月。」\n背景：模拟银行 X 闪电贷，当前规则为拒绝后 90 天可复申；近三个月复申率 6%。\n请按八段输出 PRD：\n① 背景与目标（目标必须给指标，不要写「提升体验」）；② 用户与场景；③ 功能清单（≤6 条）；④ 流程与状态（含异常分支）；⑤ 风控与合规（列出必须由风控确认的点，不要替我定规则）；⑥ 指标与埋点；⑦ 边界与不做；⑧ 验收口径（可判定）。\n规则：凡涉及准入、额度、定价的判断，一律写「待风控确认」，不得自行给规则；\n目标里的比例必须写明口径与基线；不确定的地方写「需补数据」。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M3U3", "tier": "basic", "step": "todo", "title": "产出你的「最小 PRD」", "video": {"dur": "4.4min", "script": ["PRD 写不完，多半是想一次写全；最小版只要求每段给结论，反而更容易过会", "最小 PRD 模板（八段，每段限字，逼你说清）", "某团队用一页最小 PRD 替代十页文档，评审时长从 90 分钟降到 30 分钟"]}, "ppt": {"method": "最小 PRD 模板（八段，每段限字，逼你说清）", "case": "某团队用一页最小 PRD 替代十页文档，评审时长从 90 分钟降到 30 分钟", "demo": "最小 PRD 填写指引：每段先写结论，再写依据"}, "objective": "能产出一份可评审的最小 PRD，八段齐全且目标、风控、验收三段由自己写", "transfer": "本周把这份最小 PRD 发给研发与风控各一份，请他们各标出三处需要补充的信息", "vslides": [{"t": "本节要讲什么", "n": "这一节落一页最小 PRD。很多人写 PRD 卡住，是想一次写全；最小版的思路相反，每段只要求一句结论。这一节讲三件事：为什么一页反而更好过会、八段里哪些能抄哪些不能、以及交付前自查哪三件事。看完你就能出一份能评审的最小 PRD。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"一页更好过会\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">一页更好过会</tspan></text></g><g data-k=\"哪些能抄\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">哪些能抄</tspan></text></g><g data-k=\"自查三件事\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">自查三件事</tspan></text></g></svg>", "d": 29.23}, {"t": "最小 PRD 只要求每段一句结论", "n": "很多人写 PRD 卡住，是想一次写全。最小 PRD 的思路相反：每段只要求一句结论，再附依据。八段写完通常一页就够。为什么一页反而更容易过会？因为评审会上没人读文档，大家看的是你讲的那几页。一页纸逼你只留决策需要的信息：目标是什么、给谁用、做什么、有哪些异常、风控要确认什么、怎么算成功、不做什么。这七件事说清，评审三十钟就能结束。十页文档的问题是，重要信息被埋在中间，评审要花时间找，找的过程里就开始挑毛病。写得少，不是不严谨，是把精力放在必须说清的地方。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">最小 PRD 的写法</tspan></text><g data-k=\"每段一句结论\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">每段一句结论</tspan></text></g><g data-k=\"再附依据\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">再附依据</tspan></text></g><g data-k=\"一页为限\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">一页为限</tspan></text></g></svg>", "d": 60.29}, {"t": "八段哪些能抄，哪些必须自己写", "n": "八段里，背景、用户场景、功能清单、流程与状态、指标埋点这五段可以先用 AI 铺，你再砍。目标取舍、风控待确认项、边界与不做、验收口径这四段必须自己写，一笔都不能让。这几段的共同点是「要有人担责」：目标取舍决定资源投哪，风控待确认决定风险谁签字，边界决定万一出事你的立场，验收决定项目什么时候能结。写这四段有个技巧：先写验收，再写目标。因为验收是目标的落地版本，你先想清「怎么算做到」，目标就很难写成空话。很多人反过来，先写一堆目标，最后验收写不出来，项目就永远结不了项。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">AI 可起稿</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">必须自己写</tspan></text><g data-k=\"背景/场景/功能/流程/埋点\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">背景/场景/功能/流程/</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">埋点</tspan></text></g><g data-k=\"目标/风控/边界/验收\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">目标/风控/边界/验收</tspan></text></g></svg>", "d": 58.2}, {"t": "写完先自查三件事", "n": "交付前自查三件事。第一，目标里有没有数字、口径、基线三样，缺一样就写「需补数据」并注明补法。第二，风控段有没有出现你自己定的规则，出现了就删成待确认，并写清找谁确认。第三，验收口径能不能判定——凡是写「体验流畅」「风险可控」的，都不算验收。这三件事查完，PRD 基本能过。还有一个加分动作：把「这个需求和哪个已有目标冲突」写进第一段，主动暴露冲突比被人问出来强得多。评审最看重的不是你写得多完整，而是你知不知道自己这份东西的软肋在哪。补一个落地细节：把「需补数据」的条目单独列成清单附在文末，标上谁补、什么时候补，评审时这几条往往比正文更被关注。这几条写清之后，评审通常不会再问「为什么现在不能做」，而是直接讨论怎么补数据。这也是为什么我建议最小 PRD 一页为限，页数越多，需要解释的地方越多。一页纸还有个副作用：你自己也能一眼看出哪一段没想清。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"目标三要素齐\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">目标三要素齐</tspan></text></g><g data-k=\"风控只留待确认\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风控只留待确认</tspan></text></g><g data-k=\"验收可判定\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">验收可判定</tspan></text></g></svg>", "d": 80.35}, {"t": "小结与接下来", "n": "小结三句。第一，最小 PRD 每段一句结论，评审只看得进这几句，写多了反而被埋。第二，目标取舍、风控待确认、边界、验收这四段不能抄，抄了就没人担责。第三，先写验收再写目标，验收写不出来说明目标本身是空话。接下来做任务：写完发研发与风控各一份，请他们各标出三处需要补充的信息。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"一页一句\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">一页一句</tspan></text></g><g data-k=\"四段不能抄\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">四段不能抄</tspan></text></g><g data-k=\"先验收后目标\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">先验收后目标</tspan></text></g><g data-k=\"任务：最小 PRD\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：最小 PRD</tspan></text></g></s
