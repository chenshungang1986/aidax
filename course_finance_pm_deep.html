给主管预审。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"先定义基线\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">先定义基线</tspan></text></g><g data-k=\"提示词写死要求\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">提示词写死要求</tspan></text></g><g data-k=\"删加法补减法\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">删加法补减法</tspan></text></g><g data-k=\"任务：跑三份材料\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：跑三份材料</tspan></text></g></svg>", "d": 36.74}], "deliverable": {"type": "agent", "name": "部门 AI 治理官", "rubric": ["基线可核", "分段可执行", "风险可兜"], "acceptance": "能产出《部门 AI 治理官》并通过本单元评分要点"}, "demo": {"ref": "■ 一、三段路线图\n\n试点（W1–W4）｜负责人：产品负责人\n 准入：四类材料各选 1 个真实样本；2 名志愿使用者；信息安全预审通过\n 动作：只试周报与纪要（风险最低），客户级明细不进模型\n 退出：四周内两类各完成 4 次、返工率 ≤30%；不达标即停，不延期\n\n固化（W5–W8）｜负责人：产品负责人 + 交付经理\n 准入：两类均达标；提示词与模板定稿；授权由特批转常态\n 动作：扩到 4 人，新增竞品对比；建模板库与口径表\n 退出：连续两个月不靠原班人也能跑、返工率 ≤20%；达不到退回试点\n\n治理（W9–W12）｜负责人：部门负责人 + 合规联络人\n 准入：资产清单与留痕表齐备；处置流程经合规确认\n 动作：纳入季度评审，每季抽 5 份产出回放\n 退出：一次客户级出域，或一次无法回放的结论 → 冻结全部门使用\n\n\n■ 三、风险台账\n R1 客户级明细误入外部模型｜信号：提示词出现完整卡号或流水号｜处置：产出作废、当次上报｜按停：合规联络人\n R2 口径漂移致周报与看板不一致｜信号：连续两周差异 >2%｜处置：回滚模板重算｜按停：数据 PM\n R3 返工率长期高于 30%｜信号：连续两周 >30%｜处置：停止扩面，回试点重写提示词｜按停：产品负责人\n R4 换人就跑不动｜信号：原班人休假即断产出｜处置：补模板与口径说明｜按停：交付经理\n R5 把 AI 建议当结论对外｜信号：对外材料出现无来源比例｜处置：撤回并补来源｜按停：部门负责人\n\n■ 需补测（不编数）\n 现状 12 小时/周的拆分比例需两周工时记录；返工率基线需先跑 4 次试点", "fix": ["把「预计节省 30%」改成「压 30% 的判定口径是返工率与工时记录」，并写明基线要补测——没有基线的百分比在评审会上第一句就被问倒。", "给每段加了「退出条件」而不是只写里程碑：试点段写了「不达标即停，不延期」，这是让方案可信的关键一句。", "风险台账里补了「按停权归属」，原来只写处置动作——没有按停权，出事后会变成集体决策，等于没人负责。", "删掉 AI 主动补的行业对标（如「同业同类项目平均提效 40%」），这类数字无法核实，写进方案就是给自己挖坑。"], "judge": "判断依据：有没有给基线口径；有没有写退出条件与按停权；风险台账是否覆盖数据、口径、返工、依赖、对外五类；有没有出现无法核实的对标数字", "sheet": {"situ": "你是「模拟银行 X」零售条线的产品负责人，要向分管行长交一份三个月提效方案。团队手里有 6 条从草稿里挑出来的表述，你要逐条判断它属于哪份材料、缺什么要件、能不能进评审。", "ask": "① 逐条判断这段表述属于路线图 / 资产清单 / 风险台账哪一份；② 指出它缺哪个要件（准入、退出、维护人、按停权、基线口径）；③ 判定能不能进评审，并写出要补的动作。", "gen": "请基于以上判定，输出三份材料的补齐清单：① 路线图还缺哪些准入/退出条件；② 资产清单每份模板的维护人建议；③ 风险台账的触发信号与按停权归属。每条给一句可直接写进方案的表述，不要写「完善」「加强」这类词。", "mats": [{"id": "S01", "src": "草稿 段 1", "text": "试点阶段（第 1–4 周）：在周报与纪要两类材料上试运行，力争取得明显成效。"}, {"id": "S02", "src": "草稿 段 2", "text": "固化阶段：连续两个月不依赖原班人马也能跑通，人工返工率不高于 20%；达不到就退回试点，不硬推。"}, {"id": "S03", "src": "草稿 段 3", "text": "周报模板、纪要四栏模板、竞品对比四列表、拒因话术八类模板 —— 这些都会沉淀下来复用。"}, {"id": "S04", "src": "草稿 段 4", "text": "风险：客户级明细可能误入外部模型。处置：加强培训，提高合规意识。"}, {"id": "S05", "src": "草稿 段 5", "text": "目标：三个月内把四类材料耗时压 30%，团队效率明显提升，节省大量人力。"}, {"id": "S06", "src": "草稿 段 6", "text": "治理阶段：每季度抽 5 份产出做回放检查；出现一次客户级数据出域，立即冻结全部门使用，按停权在合规联络人。"}], "cols": [{"k": "part", "name": "属于哪份材料", "hint": "路线图 / 资产清单 / 风险台账", "type": "chips", "w": 3, "tags": ["路线图", "资产清单", "风险台账"]}, {"k": "gap", "name": "缺哪个要件", "hint": "主要缺的那一个", "type": "chips", "w": 3, "tags": ["不缺", "准入条件", "退出条件", "维护人", "按停权", "基线口径"]}, {"k": "pass", "name": "能否进评审", "hint": "可进 / 需补 / 不可进", "type": "chips", "w": 2, "tags": ["可进", "需补", "不可进"]}, {"k": "fix", "name": "要补的动作（一句）", "hint": "写成一个能落地的动作，别写「完善一下」", "type": "text", "w": 3, "tags": []}], "key": {"S01": {"part": "路线图", "gap": "退出条件", "pass": "需补", "fix": "补「四周内两类各跑 4 次、返工率不高于 30%，不达标即停」"}, "S02": {"part": "路线图", "gap": "不缺", "pass": "可进", "fix": "无需补件，可直接进评审"}, "S03": {"part": "资产清单", "gap": "维护人", "pass": "需补", "fix": "每份模板后写维护人姓名，如周报模板由数据 PM 维护"}, "S04": {"part": "风险台账", "gap": "按停权", "pass": "需补", "fix": "补触发信号与按停人：出现完整卡号即作废并上报合规联络人"}, "S05": {"part": "路线图", "gap": "基线口径", "pass": "需补", "fix": "补基线 12.0 小时/人周与采集方式（两周工时记录、数据 PM）"}, "S06": {"part": "风险台账", "gap": "不缺", "pass": "可进", "fix": "无需补件，可直接进评审"}}, "notes": {"S01·gap": "「力争取得明显成效」不是退出条件。退出条件必须可判：跑几次、返工率多少、不达标怎么办", "S04·gap": "「加强培训」是态度不是处置。台账缺的是触发信号与按停人——没有按停权，出事就是集体负责", "S05·gap": "它写了目标却没写基线。「压 30%」在没有基线时无法判定，评审会第一句就问现在多少小时", "S03·gap": "模板清单本身没错，缺的是维护人。没有维护人，三个月后就没人知道该用哪个版本", "S02·pass": "这是全篇唯一一条写全了退出条件的表述：有数字、有退路、有「不硬推」的态度 → 可进", "S06·pass": "它同时具备动作（季度抽检）、触发条件（一次出域）与按停权归属 → 可进，可作为台账范例"}, "delta": [{"op": "改", "frm": "把 S01 判成「可进」（觉得「力争取得明显成效」也算目标）", "to": "判「需补」：退出条件缺失，必须补可判定的数字与停损动作", "why": "评审会不认形容词。判「可进」等于替这份方案背书，后面被退回时第一个签字的是你", "kw": ["退出条件", "可判", "数字", "不达标", "停"]}, {"op": "改", "frm": "把 S04 的「加强培训」当成处置动作", "to": "补触发信号（出现完整卡号/流水号）与按停人（合规联络人）", "why": "培训是预防不是处置。事故发生时需要的是「谁按停、停到哪一步」，不是「以后多培训」", "kw": ["触发", "信号", "按停", "谁停"]}, {"op": "删", "frm": "在 S05 后面顺手补一句「同业平均提效 40%，我们有信心超过」", "to": "整句删除", "why": "无法核实的对标数字，写进方案只会被追问来源；给不出源，整页规划的可信度一起被拖下水", "kw": ["同业", "平均", "对标", "40%"]}], "refsheet": "S01｜路线图｜缺退出条件｜需补｜补「4 周内两类各跑 4 次、返工率≤30%，不达标即停」\nS02｜路线图｜不缺｜可进｜无需补件\nS03｜资产清单｜缺维护人｜需补｜每份模板后写维护人姓名\nS04｜风险台账｜缺按停权｜需补｜补触发信号与按停人\nS05｜路线图｜缺基线口径｜需补｜补 12.0h/人周与采集方式\nS06｜风险台账｜不缺｜可进｜可直接作台账范例", "forbid": "\\d{6}(19|20)\\d{2}[01]\\d[0-3]\\d{4}[0-9Xx]|6222\\*{0,4}\\d{4}", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "背景：模拟银行 X 零售条线产品团队 8 人，负责 闪电贷 的申请、额度、贷后三条线。\n现状：周报、纪要、竞品对比、话术整理四类材料约占每人每周 12 小时；团队从未系统用过 AI；信息安全要求：客户级明细不得出域。\n目标：三个月内把上述四类材料的耗时压 30%，且不新增编制。\n请输出三份材料：\n① 三段路线图（试点/固化/治理），每段给准入条件、退出条件、负责人角色；\n② 资产清单（要沉淀哪些提示词与模板、归谁维护）；\n③ 风险台账（至少 5 条，含触发信号、处置动作、按停权归属）。\n要求：所有比例必须标明计算方式；凡缺数据的地方写「需补测」，不要编数。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】三段路线图 + 资产清单 + 风险台账，一次跑完三份材料\n【参考案例】「模拟银行 X」零售条线 PM 团队 8 人，提效目标 30%，被要求两周内出方案\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n背景：模拟银行 X 零售条线产品团队 8 人，负责 闪电贷 的申请、额度、贷后三条线。\n现状：周报、纪要、竞品对比、话术整理四类材料约占每人每周 12 小时；团队从未系统用过 AI；信息安全要求：客户级明细不得出域。\n目标：三个月内把上述四类材料的耗时压 30%，且不新增编制。\n请输出三份材料：\n① 三段路线图（试点/固化/治理），每段给准入条件、退出条件、负责人角色；\n② 资产清单（要沉淀哪些提示词与模板、归谁维护）；\n③ 风险台账（至少 5 条，含触发信号、处置动作、按停权归属）。\n要求：所有比例必须标明计算方式；凡缺数据的地方写「需补测」，不要编数。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U7", "tier": "adv", "step": "todo", "title": "写一页部门 AI 规划", "video": {"dur": "4.6min", "script": ["一页纸能过会，靠的不是排版，是每个数字都能被追问三层还站得住", "一页纸规划模板（现状 / 三段 / 指标 / 风险 / 责任）", "某股份行条线用一页纸规划争取到季度预算，关键是把指标写成可核的"]}, "ppt": {"method": "一页纸规划模板（现状 / 三段 / 指标 / 风险 / 责任）", "case": "某股份行条线用一页纸规划争取到季度预算，关键是把指标写成可核的", "demo": "一页纸填写指引：先写现状数字，再写三段，最后写指标与风险"}, "objective": "能写出一页部门 AI 规划，含三段路线、三个指标、两项风险与一个负责人矩阵", "transfer": "本周把这一页规划发给部门负责人，请他在指标与按停权两处当面给意见", "vslides": [{"t": "本节要讲什么", "n": "这一节落一页纸：部门 AI 规划。它的用处不是好看，是能过会。一页 A4 里要有现状数字、三段路线、三个可核指标、两条风险与一个负责人矩阵。这一节讲三件事：四个格子分别放什么、指标怎么写才算可核、以及哪一句必须写进去。看完你就能动手写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"一页纸的四个格子\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">一页纸的四个格子</tspan></text></g><g data-k=\"指标怎么算可核\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">指标怎么算可核</tspan></text></g><g data-k=\"必须写的那一句\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">必须写的那一句</tspan></text></g></svg>", "d": 30.38}, {"t": "一页纸的四个格子", "n": "一页纸规划不是浓缩版 PPT，它有自己的结构：左上现状、中间三段、右下指标、底部风险。现状段只放数字，不放形容词。三段每段一句目标、一条准入、一条退出——句子要短到能念出来。指标段是本页的核心，每个指标必须有四样：基线、目标、采集方式、采集人，缺一样就过不了评审，因为评委会问「这个数你怎么统计的」。底部风险两条就够，但每条要有触发信号、处置动作和按停权归属。为什么强调「谁有权按停」？因为金融的项目只要没写按停权，出事时一定是集体决策，而集体决策在监管眼里等于无人负责。这四个格子填满，一页 A4 就够，多一个字都是浪费。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四个格子</tspan></text><g data-k=\"现状：只放数字\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">现状：只放数字</tspan></text></g><g data-k=\"三段：目标+准入+退出\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">三段：目标+准入+退出</tspan></text></g><g data-k=\"指标：基线+目标+采集\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">指标：基线+目标+采集</tspan></text></g><g data-k=\"风险：信号+处置+按停\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">风险：信号+处置+按停</tspan></text></g></svg>", "d": 66.17}, {"t": "指标怎么写才算可核", "n": "拿「省 30%」举例。不合格写法：三个月内提效 30%。合格写法：四类材料耗时从 12.0 小时/人周降到 8.4 小时/人周，采集方式是两周工时记录，采集人是数据 PM。差别在哪？后者能被验证，前者只能被相信。返工率也一样，要写清口径：主管退回算一次返工，还是客户投诉算？口径不同，数字差一倍。采用率最容易被忽略，但它才是判断「有没有真用起来」的指标——写得再漂亮，一周用两次和一周用二十次是两个项目。另外提醒一句：如果基线拿不到，就写「需补测」并给出补测方法，千万别估一个数写上去。金融的评审会里，一个编出来的基线，足以让整页规划作废。最后一个提醒：指标别超过三个。三个以上，评审记不住，你自己月底也复盘不动；宁可少一个，也要每个都能说清怎么采。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">一个指标的四个要素</tspan></text><g data-k=\"基线：现在的数\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">基线：现在的数</tspan></text></g><g data-k=\"目标：要到的数\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">目标：要到的数</tspan></text></g><g data-k=\"采集：怎么统计\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">采集：怎么统计</tspan></text></g><g data-k=\"采集人：谁负责\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">采集人：谁负责</tspan></text></g></svg>", "d": 76.25}, {"t": "两条风险，和一句必须写的话", "n": "风险写两条就够，但要写对。第一条一定是数据：客户级明细误入外部模型。触发信号要具体到能监测——提示词里出现完整卡号或流水号；处置要具体到动作——当次产出作废、当次上报；按停权要落到人——合规联络人。第二条一般写口径或依赖：口径漂移会让周报和看板对不上，连续两周差异超过 2% 就该回滚；依赖个人则表现为「原班人休假就断产出」。最后有一句必须写进规划：本规划所有产出不含客户级明细，全部使用聚合量或字段级脱敏数据。这句话不是表态，是给合规看的承诺，也是给未来自己的护身符。下一页我们就把这一页纸拿去答辩，让高管来追问 ROI 和风险。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"风险一：数据出域，按停权给合规\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风险一：数据出域，按停权给合规</tspan></text></g><g data-k=\"风险二：口径漂移或依赖个人\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风险二：口径漂移或依赖个人</tspan></text></g><g data-k=\"必写：产出不含客户级明细\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">必写：产出不含客户级明细</tspan></text></g></svg>", "d": 67.58}, {"t": "小结与接下来", "n": "小结三句。第一，现状只放数字，不放形容词；拿不到就写需补测，别估数。第二，一个指标要有四样：基线、目标、采集方式、采集人，缺一样就过不了评审。第三，风险写两条就够，但每条都要有按停权，否则出事就是集体负责等于没人负责。接下来做任务：写完这一页，本周发给部门负责人，请他在指标和按停权两处当面给意见。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"现状只放数字\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">现状只放数字</tspan></text></g><g data-k=\"指标四要素\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">指标四要素</tspan></text></g><g data-k=\"风险要给按停权\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">风险要给按停权</tspan></text></g><g data-k=\"任务：一页规划\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：一页规划</tspan></text></g></svg>", "d": 37.7}], "deliverable": {"type": "skill", "name": "部门 AI 治理官", "rubric": ["数字可核", "结构完整", "责任清晰"], "acceptance": "一页 A4 内写完：三段各有准入与退出、三个指标含基线与采集方式、两条风险含按停权、末尾有负责人矩阵"}, "practice": {"steps": ["左侧写现状：三类材料耗时、人数、当前返工率（没有就写需补测）", "中间写三段：每段一句目标 + 一条准入 + 一条退出", "右下写指标：三个可核指标（工时、返工率、采用率），各给基线、目标、采集方式", "底部写风险与按停权：两条最大的风险，各写触发信号、处置、谁有权停"], "exemplar": "【零售条线 AI 落地 · 一页规划】部门：零售产品　周期：2026 Q4　编制：8 人\n\n■ 一、现状（数字来自 11/10–11/21 两周工时记录）\n　· 四类材料耗时：周报 3.0h、纪要 1.5h、竞品对比 4.0h、话术整理 3.5h，合计 12.0h/人周\n　· 返工率基线：周报 1 次返工/周（口径：主管退回视为返工）\n　· 采用率基线：0（此前未系统使用）\n　· 数据约束：客户级明细（身份证号/卡号/流水号/征信原文）不得出域\n\n■ 二、三段路线\n　试点（W1–W4）｜目标：周报与纪要两类各跑 4 次\n　　准入：两类各选 1 个真实样本、2 名志愿使用者、信息安全预审通过\n　　退出：返工率 ≤30% 且采用 ≥6 次；不达标即停，不延期\n　固化（W5–W8）｜目标：扩到 4 人，新增竞品对比\n　　准入：试点两类达标、模板与口径表定稿、授权转常态\n　　退出：连续两个月不靠原班人也能跑；达不到退回试点\n　治理（W9–W12）｜目标：纳入季度评审，季度抽检 5 份\n　　准入：资产清单、留痕表、异常处置流程经合规确认\n　　退出：出现一次客户级出域或一次无法回放的结论 → 冻结全部门使用\n\n■ 三、三个可核指标\n　1. 四类材料耗时：基线 12.0h/人周 → 目标 8.4h（-30%）｜采集：两周工时记录，采集人：数据 PM\n　2. 返工率：基线 1 次/周 → 目标 ≤0.7 次/周｜采集：主管退回记录，采集人：交付经理\n　3. 采用率：基线 0 → 目标 4 人每周各 ≥2 次｜采集：留痕表统计，采集人：合规联络人\n\n■ 四、两条风险\n　R1 客户级明细误入外部模型｜信号：提示词出现完整卡号或流水号｜处置：产出作废、当次上报｜按停权：合规联络人\n　R2 口径漂移致周报与看板不一致｜信号：连续两周差异 >2%｜处置：回滚模板重算｜按停权：数据 PM\n\n■ 五、负责人矩阵\n　路线与节奏：产品负责人｜资产与模板：交付经理｜口径与数据：数据 PM｜脱敏与留痕：合规联络人\n\n■ 附：需补测项\n　· 四类材料耗时拆分目前只有两周样本，需补四周；否则 -30% 目标的置信度不足"}, "task": "产出《部门 AI 治理官》：左侧写现状：三类材料耗时、人数、当前返工率（没有就写需补测）；中间写三段：每段一句目标 + 一条准入 + 一条退出；右下写指标：三个可核指标（工时、返工率、采用率），各给基线、目标、采集方式；底部写风险与按停权：两条最大的风险，各写触发信号、处置、谁有权停", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的消费金融 AI 产品经理。本单元属于「M0 导论：金融 PM 的 AI 机会与红线」模块，你要交付的是《部门 AI 治理官》。\n【场景】业务侧这周的诉求是：一页纸能过会，靠的不是排版，是每个数字都能被追问三层还站得住。参考做法：某股份行条线用一页纸规划争取到季度预算，关键是把指标写成可核的。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（一页纸规划模板（现状 / 三段 / 指标 / 风险 / 责任）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【{{部门}} AI 落地 · 一页规划】部门：{{}}　周期：{{}}　编制：{{}} 人\n\n■ 一、现状（数字来自 {{数据来源与时间范围}}）\n　· 四类材料耗时：{{各类}}，合计 {{}}h/人周\n　· 返工率基线：{{}}（口径：{{什么算一次返工}}）\n　· 采用率基线：{{}}\n　· 数据约束：{{哪些字段不得出域}}\n\n■ 二、三段路线\n　试点（{{周次}}）｜目标：{{}}\n　　准入：{{}}\n　　退出：{{含数字与停损动作}}\n　固化（{{周次}}）｜目标：{{}}\n　　准入：{{}}\n　　退出：{{}}\n　治理（{{周次}}）｜目标：{{}}\n　　准入：{{}}\n　　退出：{{一次什么事件即冻结}}\n\n■ 三、三个可核指标（各含基线 / 目标 / 采集方式 / 采集人）\n　1. {{指标}}：基线 {{}} → 目标 {{}}｜采集：{{}}，采集人：{{}}\n　2. {{指标}}：基线 {{}} → 目标 {{}}｜采集：{{}}，采集人：{{}}\n　3. {{指标}}：基线 {{}} → 目标 {{}}｜采集：{{}}，采集人：{{}}\n\n■ 四、两条风险\n　R1 {{风险}}｜信号：{{}}｜处置：{{}}｜按停权：{{}}\n　R2 {{风险}}｜信号：{{}}｜处置：{{}}｜按停权：{{}}\n\n■ 五、负责人矩阵\n　路线与节奏：{{}}｜资产与模板：{{}}｜口径与数据：{{}}｜脱敏与留痕：{{}}\n\n■ 附：需补测项\n　· {{缺什么数据、怎么补、什么时候补}}", "rubric": ["现状段至少三个数字（耗时、人数、返工率），缺的写「需补测」并注明补测方法，不空着也不编", "三段各有一句目标、一条准入条件、一条退出条件，条件可判定（含数字或明确动作）", "三个指标都写了基线、目标、采集方式与采集人；只有目标没有采集方式的按未填计", "风险段写了两条，各含触发信号、处置动作、按停权归属；负责人矩阵覆盖路线、资产、数据三类"]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "高管答辩：追问 ROI 与风险", "video": {"dur": "4.5min", "script": ["高管不缺想法，缺的是能拿去跟财务和风险对齐的数字——给不出采集方式，就等于没数", "角色陪练：高管按「省多少 / 怎么证明 / 出事怎么办 / 不做会怎样」四层追问", "某条线 AI 规划答辩被追问三轮 ROI 口径，最后因无法给出采集方式被暂缓"]}, "ppt": {"method": "角色陪练：高管按「省多少 / 怎么证明 / 出事怎么办 / 不做会怎样」四层追问", "case": "某条线 AI 规划答辩被追问三轮 ROI 口径，最后因无法给出采集方式被暂缓", "demo": "陪练演示：把「提效 30%」追到工时记录与采集人"}, "objective": "能在高管四轮追问下讲清 ROI 口径、风险兜底与不做会怎样，不靠形容词过关", "transfer": "把一页规划里的 ROI 口径单独抽成一页测算说明，下周答辩前先让财务同事过一遍", "vslides": [{"t": "本节要讲什么", "n": "这一节是答辩陪练。对面是分管行长，他只问四句：省多少、怎么证明、出事怎么办、不做会怎样。这一节讲三件事：四问为什么是这个顺序、30% 怎么拆成能被核查的四段、以及答辩里两种失分方式——答不上来和越界。练完你要能撑住三层追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"高管只问四句\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">高管只问四句</tspan></text></g><g data-k=\"30% 怎么拆\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">30% 怎么拆</tspan></text></g><g data-k=\"两种失分方式\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">两种失分方式</tspan></text></g></svg>", "d": 30.91}, {"t": "高管只问四句", "n": "答辩现场，高管不会听你讲六类机会和三条红线，他只问四句：省多少、怎么证明、出事怎么办、不做会怎样。这四句的顺序也不是随意的：先问收益，因为预算有限；再问验证，因为他被\"效果很好\"坑过；然后问风险，因为金融出事要担责；最后问取舍，因为不做也是一种选择，他要判断哪个代价小。你要练的是：每一句都能给出数字、位置和名字。给不出数字的收益是愿望，给不出采集方式的数字是猜测，给不出签字人的风险是空话。这一节的陪练会连续追同一个数三层，撑住三轮，你的方案就基本能过会。再提醒一句：高管问「省多少」时，先给口径再给数，顺序反了，他会一直怀疑这个数是怎么来的。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">高管四问</tspan></text><g data-k=\"省多少\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">省多少</tspan></text></g><g data-k=\"怎么证明\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">怎么证明</tspan></text></g><g data-k=\"出事怎么办\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">出事怎么办</tspan></text></g><g data-k=\"不做会怎样\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不做会怎样</tspan></text></g></svg>", "d": 68.02}, {"t": "把 30% 拆到能被核查", "n": "「提效 30%」这句话在答辩现场等于没说。要拆成四段：基线是四类材料 12 小时/人周，来自两周工时记录；目标是 8.4 小时；采集方式是每月 5 号由数据 PM 出表；折算口径是人均成本 180 元/小时，8 个人一个月约省 460 小时、约 8.3 万元。拆到这一步，高管才能拿去跟财务对齐。紧接着他一定问第二层：省下的时间去哪了？这里最忌回答「大家会更有空」——正确答法是三选一：减人、接新需求、或明确填回哪类工作。第三层会问风险：那就把两条按停线拿出来，说清谁按停、停了之后资产归谁。答完这三层，第四层「不做会怎样」才有分量：不降这 12 小时，Q1 就得砍一个需求，砍哪个我已经想好了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">30% 的四段拆法</tspan></text><g data-k=\"基线：12.0h/人周\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">基线：12.0h/人周</tspan></text></g><g data-k=\"目标：8.4h（-30%）\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">目标：8.4h（-30%）</tspan></text></g><g data-k=\"采集：每月 5 号出表\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">采集：每月 5 号出表</tspan></text></g><g data-k=\"折算：460h ≈ 8.3 万元/月\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">折算：460h ≈ 8.3 万元/月</tspan></text></g></svg>", "d": 69.67}, {"t": "答不上来与越界，两种失分", "n": "答辩有两种失分方式。第一种是答不上来：被问到采集方式就含糊，被问到签字人就说「团队一起」。补救动作和上一节一样——承认、定位、约时间，但答辩场合还要多一句「这一项我按保守口径重算，明天中午前发您」。第二种更致命，是越界：为了让方案显得完整，替风控下结论（「这个策略不会提高不良率」）、替合规下判断（「这个用法肯定合规」）。这两句话一出口，方案立刻从「可讨论」变成「不可信」。记住一条线：你可以说清你的收益口径和风险处置，不能替风控和合规下专业结论；你可以承诺按停，不能承诺不出事。守住这条线，哪怕这轮没过，下一轮还会找你；越了这条线，后面半年都不会再让你主导这类项目。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">守线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">越界</tspan></text><g data-k=\"说清口径与处置 不替风控合规下结论\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">说清口径与处置</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">不替风控合规下结论</tspan></text></g><g data-k=\"替人下专业结论 一次就失去主导权\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">替人下专业结论</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">一次就失去主导权</tspan></text></g></svg>", "d": 63.34}, {"t": "小结与接下来", "n": "小结三句。第一，给不出采集方式的数字是猜测，给不出签字人的风险是空话。第二，30% 要拆成基线、目标、采集人、折算口径四段，高管才能拿去跟财务对齐。第三，可以说清口径与处置，不能替风控合规下结论；越这条线，半年内不会再让你主导。接下来做任务：把 ROI 口径单独抽成一页测算说明，答辩前先请财务同事过一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"四问的顺序\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">四问的顺序</tspan></text></g><g data-k=\"30% 拆四段\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">30% 拆四段</tspan></text></g><g data-k=\"别替人下结论\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">别替人下结论</tspan></text></g><g data-k=\"任务：一页测算\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：一页测算</tspan></text></g></svg>", "d": 39.55}], "deliverable": {"type": "agent", "name": "部门 AI 治理官", "rubric": ["口径清楚", "风险有兜底", "取舍有依据"], "acceptance": "四轮追问下能给出基线、目标、采集方式与采集人，并能说清按停权与不做会怎样"}, "spar": {"role": "分管零售的副行长", "persona": "只关心三件事：省多少、怎么验证、出问题谁负责；对形容词零容忍，会连续追问同一个数的来源", "mustAsk": ["你说提效 30%，这 30% 是按什么算的？基线多少、目标多少、谁统计的？", "省下来的 460 小时去哪了？是减人、接新需求，还是又填回别的材料里？", "如果模型给了错误的拒贷话术，客户投诉到监管，这条链上谁签字、谁对外解释？", "这三个月的投入（人、时间、可能的采购）是多少？不做这件事，代价是什么？"]}, "exemplar": "答辩四问的合格答法（对照自查）：\n1. 省多少 → 「四类材料 12.0 小时/人周降到 8.4，8 个人一个月约省 460 小时；折算按人均成本 180 元/小时，约 8.3 万元/月。」\n2. 怎么证明 → 「两周工时记录，采集人是数据 PM，每月 5 号出表；返工率由主管退回记录统计。」\n3. 出事怎么办 → 「两条按停线：客户级明细出域当次作废并上报合规；连续两周口径差异超 2% 回滚模板。按停权分别在合规联络人和数据 PM。」\n4. 不做会怎样 → 「这四类材料占 12 小时/人周，不降就只能加人；按现有人力，Q1 的三个需求要砍一个，砍的是额度试算改版。」\n反面：「大概能省三成」「效果很明显」「同业都在做」——三句话里没有一个能被追问第二层。", "task": "把《部门 AI 治理官》拿到「分管零售的副行长」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《部门 AI 治理官》。现在要让它通过「分管零售的副行长」这一关。\n【对手的立场】只关心三件事：省多少、怎么验证、出问题谁负责；对形容词零容忍，会连续追问同一个数的来源。\n【他一定会追问】「你说提效 30%，这 30% 是按什么算的？基线多少、目标多少、谁统计的？」 / 「省下来的 460 小时去哪了？是减人、接新需求，还是又填回别的材料里？」 / 「如果模型给了错误的拒贷话术，客户投诉到监管，这条链上谁签字、谁对外解释？」\n【场景】你说「高管答辩：追问 ROI 与风险」，对方立刻回一句：你说提效 30%，这 30% 是按什么算的？基线多少、目标多少、谁统计的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M1", "title": "M1 用 AI 做金融业务与监管洞察", "dims": ["prompt", "data"], "units": [{"id": "M1U1", "tier": "basic", "step": "understand", "title": "金融监管信息源与 AI 解读边界", "video": {"dur": "4.7min", "script": ["监管文本的风险不在读不懂，在于把「征求意见稿」当成「已生效」——方向错了，跑得越快越远", "五类信息源清单 + 四段式简报（原文依据 / 影响对象 / 需改动作 / 时间表）", "某消金公司把征求意见稿当正式稿下发，上线口径连改两次，返工两周"]}, "ppt": {"method": "五类信息源清单 + 四段式简报（原文依据 / 影响对象 / 需改动作 / 时间表）", "case": "某消金公司把征求意见稿当正式稿下发，上线口径连改两次，返工两周", "demo": "把一条新规原文拆成四段可执行的简报"}, "objective": "能列出五类可信监管信息源，并为一条新规写出「可做 / 不可做」的解读边界", "transfer": "48 小时内选本月一条新规，按四段式写一页简报，发给合规同事请他标出越界处", "vslides": [{"t": "本节要讲什么", "n": "这一节解决一个很实际的问题：监管文本那么多，哪些必须马上动，哪些可以先看。很多产品经理吃亏不在看不懂，而在把征求意见稿当成了生效稿，排期全落空。这一节讲三件事：五类信息源分别管什么、四段式简报怎么写、以及三条不能越的解读边界。看完你要能对一条新规当场说出文种和生效日。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"五类源各管什么\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">五类源各管什么</tspan></text></g><g data-k=\"四段式怎么写\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">四段式怎么写</tspan></text></g><g data-k=\"三条解读边界\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三条解读边界</tspan></text></g></svg>", "d": 32.98}, {"t": "监管解读为什么会落到 PM 头上", "n": "在金融机构里，监管文本落到系统上这件事，最后总是产品经理在做。法务看合规性，风险看敞口，只有你要回答「具体改哪个页面、哪份材料、什么时候上」。所以解读能力不是加分项，是基本功。信息源分五类：一是央行与外汇局，管支付、征信、反洗钱；二是金融监管总局及其派出机构，管信贷、保险、消保；三是证监会与交易所，管资管与代销；四是地方金融管理局，管小贷、担保、区域机构；五是行业协会与自律组织，管话术、催收、信息披露的细则。这五类里，前四类具备强制力，第五类通常不罚款但会被检查引用。搞清这个层级，你就知道哪条可以先等、哪条必须马上动。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">五类信息源</tspan></text><g data-k=\"央行/外汇局：支付征信\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">央行/外汇局：支付征信</tspan></text></g><g data-k=\"金监总局：信贷消保\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">金监总局：信贷消保</tspan></text></g><g data-k=\"证监会：资管代销\"><rect x=\"18.0\" y=\"96.7\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">证监会：资管代销</tspan></text></g><g data-k=\"地方金融局：小贷担保\"><rect x=\"209.0\" y=\"96.7\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">地方金融局：小贷担保</tspan></text></g><g data-k=\"行业协会：话术细则\"><rect x=\"18.0\" y=\"149.3\" width=\"173.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">行业协会：话术细则</tspan></text></g></svg>", "d": 69.43}, {"t": "四段式：把一段法规变成一张工单", "n": "简报只写四段，多一个字都是浪费。第一段原文依据：贴条文号与发布时间，一句原文关键句照抄，不改写。第二段影响对象：写清影响哪条产品线、哪个页面、哪份对客材料，落到你系统里的具体位置。第三段需改动作：写成工单语气——「申请页利率披露文案增加年化综合成本区间」「贷后催收话术删除联系第三人的表述」。第四段时间表：生效日、内部截止日、谁验收。这四段的好处是可核查：合规看第二段判断有没有漏项，研发看第三段直接排期，你老板看第四段判断要不要加人。最常出错的是第二段——写成「影响消费贷业务」这种笼统话，等于没写，因为没人知道该改哪个页面。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四段式简报</tspan></text><g data-k=\"原文依据：条文号\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">原文依据：条文号</tspan></text></g><g data-k=\"影响对象：哪条线哪个页面\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">影响对象：哪条线哪个页面</tspan></text></g><g data-k=\"需改动作：工单语气\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">需改动作：工单语气</tspan></text></g><g data-k=\"时间表：生效日与验收人\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">时间表：生效日与验收人</tspan></text></g></svg>", "d": 59.81}, {"t": "三条边界：你可以解读，不能定性", "n": "边界三条。第一，不做法定定性：这条业务到底合不合规、要不要报批，是法务和合规的结论，你只能标疑点。第二，不解释罚则：罚多少、按哪条罚，别猜，猜错的代价远大于你不说。第三，不把征求意见稿当生效稿：征求意见稿通常有反馈期，正式稿可能改口径，把它写进排期表是最常见的翻车点——某消金公司就因为把征求意见稿当正式稿下发，上线口径连改两次，返工两周。正确做法是在简报里加一行「文种与状态」，写清是征求意见稿还是正式稿、生效日是哪天、有没有过渡期。这一行只有十来个字，但它决定了后面所有排期是否成立。再补一个实操细节：把「反馈意见渠道」也记下来。很多时候改变口径的机会就在反馈期里，你不提，别人提了，正式稿就按别人的理解定。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"不做合规定性，只标疑点\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不做合规定性，只标疑点</tspan></text></g><g data-k=\"不猜罚则与罚额\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不猜罚则与罚额</tspan></text></g><g data-k=\"征求意见稿不等于生效稿\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">征求意见稿不等于生效稿</tspan></text></g></svg>", "d": 76.73}, {"t": "小结与接下来", "n": "小结三句。第一，五类源分层：前四类有强制力，协会规则会被检查引用，但别当成法条。第二，简报四段：原文依据、影响对象、需改动作、时间表，影响对象必须落到页面与材料。第三，三条边界：不定性、不解释罚则、不把征求意见稿当生效稿。接下来做任务：选本月与你产品最相关的一条新规，按四段式写一页简报，发给合规同事，请他标出越界的地方。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"五类源分层\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">五类源分层</tspan></text></g><g data-k=\"四段式\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">四段式</tspan></text></g><g data-k=\"三条边界\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三条边界</tspan></text></g><g data-k=\"任务：一页简报\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：一页简报</tspan></text></g></svg>", "d": 42.86}], "deliverable": {"type": "skill", "name": "监管简报生成", "rubric": ["源可信", "文种识别", "边界守得住"], "acceptance": "对任意一条新规，能指出文种与生效日、影响到的功能与材料、必须改的动作与截止时间"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】五类信息源清单 + 四段式简报（原文依据 / 影响对象 / 需改动作 / 时间表）\n【为什么重要】监管文本的风险不在读不懂，在于把「征求意见稿」当成「已生效」——方向错了，跑得越快越远\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["五类信息源能各举一个具体渠道（含官网栏目或发布主体），不只写「监管网站」", "能给出一条新规的文种（征求意见稿 / 正式稿 / 答记者问）与生效日，并说明文种不同意味着什么", "四段至少三段有原文条文号或发布日支撑，动作写到「改哪个页面、补哪份材料」", "明确写出两条自己不下的结论（合法性定性、罚则解释），并说明该找谁"]}, {"id": "M1U2", "tier": "basic", "step": "demo", "title": "新规 → 结构化简报", "video": {"dur": "4.5min", "script": ["AI 很会把「可能」「拟」改写成「必须」，一字之差就是排期事故", "原文 + 四段式提示词，一次跑出可预审的简报", "「闪电贷」费率披露新规（公开征求意见稿），涉及申请页与合同页"]}, "ppt": {"method": "原文 + 四段式提示词，一次跑出可预审的简报", "case": "「闪电贷」费率披露新规（公开征求意见稿），涉及申请页与合同页", "demo": "WorkBuddy 内跑一遍：贴新规原文 → 出四段简报 → 人工改三处"}, "objective": "能把一条新规原文跑成四段式简报，并指出 AI 稿里三处需要人改的地方", "transfer": "用这套提示词把本月与你产品最相关的一条新规跑一遍，改完发合规预审", "vslides": [{"t": "本节要讲什么", "n": "这一节跑一条真实新规：从贴原文到出四段简报，再到人工改三处。这一节讲三件事：为什么第一行必须写文种与状态、四段分别要写到什么粒度、以及 AI 稿里哪三处必须人改。看完你会发现，AI 在结构化上很强，在日期和义务强度上很弱。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"第一行为何写文种\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">第一行为何写文种</tspan></text></g><g data-k=\"四段的粒度\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">四段的粒度</tspan></text></g><g data-k=\"哪三处必须人改\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">哪三处必须人改</tspan></text></g></svg>", "d": 29.23}, {"t": "先看文种：这不是生效稿", "n": "演示材料是一条费率披露新规的公开征求意见稿，反馈截止 12 月 5 日，正式稿还没发。这个前提必须写在简报第一行，因为它决定了后面所有时间节点怎么排。我先让 AI 只做一件事：读原文，输出四段，并把文种与状态单列一行。为什么不直接让它写方案？因为方案一旦混入不存在的生效日期，后面所有排期都是空的。另外我在提示词里写死了一条：不得把「拟」「可以」改写成「必须」。这句约束不是形式，监管文本的语气差异直接对应义务强度，AI 天生倾向于把话说得更确定，你不约束，它一定替你加码。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">本次材料</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">真正要排期</tspan></text><g data-k=\"征求意见稿 反馈期 · 口径可能变\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">征求意见稿</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">反馈期 · 口径可能变</tspan></text></g><g data-k=\"正式稿 生效日明确 · 必须改\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">正式稿</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">生效日明确 · 必须改</tspan></text></g></svg>", "d": 61.44}, {"t": "跑一遍：四段是怎么长出来的", "n": "提示词里我把四段的要求逐条写清：原文依据要条文号加关键句，照抄不改写；影响对象要落到页面和材料；需改动作用工单语气，一条一个动作；时间表分生效日、过渡期、内部截止日、验收人。跑出来的结果里，最有用的是第二段——它把「影响消费贷业务」拆成了申请页、合同页、7 条短信模板、账单页四处，这才是能派活的粒度。第三段也基本可用，五条动作都能直接建单。第四段需要人改，因为它把反馈截止日当成了改造截止日。你看，AI 在「结构化」上很强，在「日期与义务强度」上很弱，这正是人必须接手的位置。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四段怎么长出来</tspan></text><g data-k=\"原文依据：照抄\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">原文依据：照抄</tspan></text></g><g data-k=\"影响对象：到页面\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">影响对象：到页面</tspan></text></g><g data-k=\"动作：工单语气\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">动作：工单语气</tspan></text></g><g data-k=\"时间表：四个日期\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">时间表：四个日期</tspan></text></g></svg>", "d": 61.94}, {"t": "人改三处，最后一行写边界", "n": "第一处，日期混淆：AI 把 12 月 5 日反馈截止当成改造截止，我改成内部截止 12 月 10 日、正式稿后 5 个工作日复核。第二处，口径假设：AI 默认「年化综合成本」含担保费与提前还款费，我不确定，改成「需法务确认」。第三处，越界解释：AI 补了一句罚则，我整句删掉——罚则不是我们能解释的。最后加一行边界提示，写清哪些结论需要法务确认。这一行看起来像免责声明，其实是专业度：它告诉评审的人，你知道自己知识的边界在哪。简报能进预审的标准不是写得多全，而是每个结论都能指回依据，每个不确定都标了责任人。最后说一句纠正习惯：如果 AI 在简报里写出「根据监管要求，必须在某日前完成」这种句式，先别信，回去找原文那一句。这种句式八成是它把解释当成了条款。另外把「谁写的、什么时候核过」记在简报末尾，一份没有署名的简报，没人会为它签字。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"日期：反馈截止≠改造截止\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">日期：反馈截止≠改造截止</tspan></text></g><g data-k=\"口径假设要标待确认\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">口径假设要标待确认</tspan></text></g><g data-k=\"不解释罚则\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不解释罚则</tspan></text></g><g data-k=\"边界行必写\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">边界行必写</tspan></text></g></svg>", "d": 76.56}, {"t": "小结与接下来", "n": "小结三句。第一，文种与状态写第一行，它决定所有日期是否成立。第二，影响对象要落到页面、条款、话术条数、埋点指标，写业务线等于没写。第三，AI 会把反馈截止日当改造截止日、会替你假设口径、会顺手补罚则，这三处必须人改。接下来做任务：用这条提示词把本月最相关的新规跑一遍，改完发合规预审。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"文种写第一行\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">文种写第一行</tspan></text></g><g data-k=\"影响对象到页面\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">影响对象到页面</tspan></text></g><g data-k=\"三处必须人改\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三处必须人改</tspan></text></g><g data-k=\"任务：跑一条新规\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：跑一条新规</tspan></text></g></svg>", "d": 39.58}], "deliverable": {"type": "skill", "name": "监管简报生成", "rubric": ["文种识别", "动作可执行", "边界清楚"], "acceptance": "能产出《监管简报生成》并通过本单元评分要点"}, "demo": {"ref": "■ 文种与状态\n 公开征求意见稿，反馈截止 2026-12-05；正式稿未发布，生效日待定\n\n■ 一、原文依据\n 第 X 条：「金融机构应当在借款合同订立前，以醒目方式披露年化综合成本区间及计算示例。」\n 第 Y 条：「不得仅以日利率、月利率等单一口径展示借贷成本。」\n\n■ 二、影响对象\n · 闪电贷 申请页「借款成本」模块（现仅展示日利率 0.03%）\n · 合同签署页费用条款区\n · 对客短信与 App 推送里的利率表述模板（共 7 条）\n · 贷后账单页的费用说明\n\n■ 三、需改动作（工单语气）\n 1. 申请页新增「年化综合成本区间 + 计算示例」，明示是否含服务费\n 2. 全部对客材料删除单一日利率口径，改为年化综合成本区间\n 3. 合同页费用条款按新表述重写，法务出定稿后替换\n 4. 短信与推送 7 条模板逐条改口径，客服知识库同步\n 5. 埋点补「成本披露曝光」，用于事后自查\n\n■ 四、时间表\n 内部截止：2026-12-10 完成文案与页面改版｜12-20 完成客服培训\n 验收人：合规（口径）/ 产品（页面）/ 客服主管（话术）\n 正式稿发布后 5 个工作日内复核一次\n\n⚠ 需法务确认：第 X 条「年化综合成本」是否包含担保费与提前还款费；本稿按不含处理。", "fix": ["把 AI 写的「必须于 12 月 5 日前完成改造」改掉——12-05 是征求意见反馈截止日，不是改造截止日，AI 把两个日期混成了一个。", "在「文种与状态」里补了「正式稿未发布，生效日待定」，并把内部截止日与生效日分开写，避免排期表落空。", "给「年化综合成本」加了一条待确认项（是否含担保费与提前还款费），AI 直接按包含处理了，这在评审会上会被问住。", "删掉 AI 补的「违反将被处以 50 万元以上罚款」——罚则不是我们能解释的，写进简报就是越界。"], "judge": "判断依据：有没有区分征求意见稿与正式稿；有没有把「拟/可以」写成「必须」；影响对象是否落到页面与材料；有没有擅自解释罚则或下合规结论", "sheet": {"situ": "你是「闪电贷」的产品经理，刚拿到一条费率披露新规的公开征求意见稿。同事先写了一版简报草稿，你要逐段判断它属于四段式的哪一段、缺哪个要件、能不能进合规预审。", "ask": "① 判断这段稿子属于哪一段；② 指出它缺的要件（文种 / 条文号 / 落地位置 / 日期口径 / 待确认标注）；③ 判定能否预审，并写出一句可执行的补法。", "gen": "请基于以上判定，输出三件事：① 不可进的两段怎么改写成可预审版本；② 需补的两段要补哪几个具体位置；③ 整份简报还缺哪个必须有的段落。不要写「完善」「加强」这类词，每条给一句可直接粘贴的表述。", "mats": [{"id": "N01", "src": "草稿 段 1", "text": "根据最新监管要求，我司须在 12 月 5 日前完成费率披露改造。"}, {"id": "N02", "src": "草稿 段 2", "text": "第 X 条：「金融机构应当在借款合同订立前，以醒目方式披露年化综合成本区间及计算示例。」"}, {"id": "N03", "src": "草稿 段 3", "text": "本新规对我司消费贷业务产生影响，需尽快整改。"}, {"id": "N04", "src": "草稿 段 4", "text": "改造内容包括：申请页增加年化综合成本展示、合同页费用条款重写、短信模板调整。"}, {"id": "N05", "src": "草稿 段 5", "text": "年化综合成本按含担保费与提前还款费处理，正式稿发布后如口径不同再调整。"}, {"id": "N06", "src": "草稿 段 6", "text": "本稿依据公开征求意见稿整理，罚则将按新规执行，预计处罚金额 50 万元以上。"}], "cols": [{"k": "seg", "name": "属于哪一段", "hint": "四段式中的哪一段", "type": "chips", "w": 3, "tags": ["文种与状态", "原文依据", "影响对象", "需改动作", "时间表", "边界"]}, {"k": "gap", "name": "缺哪个要件", "hint": "主要缺的那一个", "type": "chips", "w": 3, "tags": ["不缺", "文种未标", "条文号", "落地位置", "日期口径", "待法务确认"]}, {"k": "pass", "name": "能否预审", "hint": "可进 / 需补 / 不可进", "type": "chips", "w": 2, "tags": ["可进", "需补", "不可进"]}, {"k": "fix", "name": "补法（一句）", "hint": "写成能落地的动作，别写「完善一下」", "type": "text", "w": 3, "tags": []}], "key": {"N01": {"seg": "时间表", "gap": "文种未标", "pass": "不可进", "fix": "标明是征求意见稿，12-05 是反馈截止非改造截止，补内部截止日"}, "N02": {"seg": "原文依据", "gap": "不缺", "pass": "可进", "fix": "无需补件，条号与原文照抄齐全"}, "N03": {"seg": "影响对象", "gap": "落地位置", "pass": "需补", "fix": "落到申请页成本模块、合同费用条款、短信 4 条、账单页四处"}, "N04": {"seg": "需改动作", "gap": "落地位置", "pass": "需补", "fix": "每条补负责角色与具体页面/模板编号"}, "N05": {"seg": "边界", "gap": "待法务确认", "pass": "不可进", "fix": "改为「需法务确认是否含担保费与提前还款费」，不得自行假设"}, "N06": {"seg": "边界", "gap": "不缺", "pass": "不可进", "fix": "删掉罚则推测整句；边界段只写不下哪些结论，不写处罚金额"}}, "notes": {"N01·gap": "它把反馈截止日当成了改造截止日，且没写文种。这一条是整份简报最危险的地方，因为排期都建在它上面", "N03·gap": "「影响消费贷业务」不是影响对象，是业务线名称。影响对象要落到页面、条款、模板条数", "N05·gap": "「按含担保费处理，以后再调」是替法务做假设。假设写进方案，后面所有测算都建在沙子上", "N06·pass": "边界段出现处罚金额推测 = 越界解释罚则，属合规明令禁止的表述，直接不可进", "N04·gap": "动作方向是对的（三处改造），但没写负责角色与编号，研发无法直接建单", "N02·pass": "这是全篇唯一可进的一段：条号、原文照抄、无改写，符合「原文依据」的唯一要求"}, "delta": [{"op": "改", "frm": "把 N01 判成「需补」（觉得补个日期就行）", "to": "判「不可进」：文种未标 + 把反馈截止当改造截止，两处都错", "why": "这不是缺个日期的问题，是整条时间线建错了基准。判「需补」等于默认这条可用", "kw": ["文种", "征求意见", "反馈截止", "不可进"]}, {"op": "改", "frm": "把 N05 的「以后再调整」当成风险可控", "to": "判「不可进」：口径假设必须标注需法务确认，不能带病进预审", "why": "预审的价值就是在低成本阶段拦住假设。假设放进方案，后面改的是排期和预算", "kw": ["法务", "确认", "假设", "口径"]}, {"op": "删", "frm": "在 N06 后面补一句「同业类似处罚案例已有先例」", "to": "整句删除", "why": "罚则与处罚先例不是产品经理能解释的范围，写进简报等于越界定性", "kw": ["罚则", "处罚", "先例", "金额"]}], "refsheet": "N01｜时间表｜缺文种｜不可进｜标明征求意见稿，反馈截止≠改造截止\nN02｜原文依据｜不缺｜可进｜无需补件\nN03｜影响对象｜缺落地位置｜需补｜落到页面/条款/模板条数\nN04｜需改动作｜缺落地位置｜需补｜每条补负责角色与编号\nN05｜边界｜缺待法务确认｜不可进｜改为需法务确认，不得自行假设\nN06｜边界｜不缺｜不可进｜删罚则推测整句", "forbid": "\\d{6}(19|20)\\d{2}[01]\\d[0-3]\\d{4}[0-9Xx]|6222\\*{0,4}\\d{4}", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是监管机构发布的原文（公开渠道获取，未含任何客户信息）：\n[粘贴新规原文相关条款]\n请按四段输出简报：\n① 原文依据：条文号 + 关键句照抄（不改写）；\n② 影响对象：落到具体产品线、页面、对客材料；\n③ 需改动作：工单语气，一条一个动作，可排期；\n④ 时间表：生效日 / 过渡期 / 内部截止日 / 验收人角色。\n另外单独列一行「文种与状态」（征求意见稿 / 正式稿 / 生效日）。\n要求：不得把「拟」「可以」改写为「必须」；不确定的地方写「需法务确认」，不要下合规定性。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】原文 + 四段式提示词，一次跑出可预审的简报\n【参考案例】「闪电贷」费率披露新规（公开征求意见稿），涉及申请页与合同页\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是监管机构发布的原文（公开渠道获取，未含任何客户信息）：\n[粘贴新规原文相关条款]\n请按四段输出简报：\n① 原文依据：条文号 + 关键句照抄（不改写）；\n② 影响对象：落到具体产品线、页面、对客材料；\n③ 需改动作：工单语气，一条一个动作，可排期；\n④ 时间表：生效日 / 过渡期 / 内部截止日 / 验收人角色。\n另外单独列一行「文种与状态」（征求意见稿 / 正式稿 / 生效日）。\n要求：不得把「拟」「可以」改写为「必须」；不确定的地方写「需法务确认」，不要下合规定性。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M1U3", "tier": "basic", "step": "todo", "title": "生成你行业的政策简报", "video": {"dur": "4.6min", "script": ["简报的价值不在解读得多深，在于能不能直接变成研发的排期表", "四段式简报模板 + 影响清单（页面 / 材料 / 话术 / 埋点）", "某城商行用一页简报把新规拆成 11 张工单，两周内改完"]}, "ppt": {"method": "四段式简报模板 + 影响清单（页面 / 材料 / 话术 / 埋点）", "case": "某城商行用一页简报把新规拆成 11 张工单，两周内改完", "demo": "简报填写指引：先定文种，再落页面，最后排期"}, "objective": "能针对本行业一条新规，产出一页四段式简报并附影响清单与排期", "transfer": "本周把简报发给合规与研发各一份，请合规标越界处、请研发估工时", "vslides": [{"t": "本节要讲什么", "n": "这一节落一页纸：给本行业一条新规写简报。它的用处不是存档，是能直接变成研发排期表。这一节讲三件事：为什么先定文种再读全文、影响清单怎么按四类写到具体位置、以及排期为什么要留缓冲并写一行边界。看完你就能动手写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"先定文种再读全文\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">先定文种再读全文</tspan></text></g><g data-k=\"影响清单四类\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">影响清单四类</tspan></text></g><g data-k=\"排期留缓冲\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">排期留缓冲</tspan></text></g></svg>", "d": 31.32}, {"t": "先定文种，再谈其他", "n": "写简报的第一步不是读全文，是先确定三件事：谁发的、什么文种、什么时候生效。这三件事决定了后面所有动作的紧迫度。征求意见稿可以等，正式稿必须动，答记者问通常只是解释口径不变。很多人跳过这一步直接摘条文，结果排期表建在一个不存在的生效日上。做法很简单：去发布页找「发布日期」和「施行日期」两个字段，找不到施行日期就写「待定」，不要猜。另外看一眼有没有过渡期——金融的很多新规给三到六个月过渡，这段时间怎么用，直接决定你是排两周还是排两个月。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">先定三件事</tspan></text><g data-k=\"谁发的\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">谁发的</tspan></text></g><g data-k=\"什么文种\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">什么文种</tspan></text></g><g data-k=\"何时生效\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">何时生效</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 54.65}, {"t": "影响清单要落到四类位置", "n": "影响清单是简报的骨架，分四类写：页面、合同与材料、对客话术、埋点与数据。页面写到模块，比如「申请页借款成本模块」；合同写到条款，比如「费用条款第 3 条」；话术写到条数，比如「短信 4 条、推送 3 条、知识库 1 节」；埋点写清补什么指标。四类都写的好处是：产品能直接建单，法务能直接圈条款，客服能直接改话术，数据能直接排埋点。反过来，只写「影响消费贷业务」，这四条线谁都不知道自己要做什么。写清单时还有个技巧：先按用户旅程走一遍——看到广告、进申请页、签合同、看账单、接催收——每站停一下问「这里有没有这句话」，漏项基本就出来了。还有一类容易漏的：非对客材料。内部培训手册、客服知识库、催收话术脚本，这些不进页面但同样会引用利率口径，检查时一样会被翻出来。清单写完后按影响面排序：先改对客可见的，再改内部引用的，最后改培训材料。如果时间只够改一类，改对客可见的那一类，因为投诉和检查都从那里来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">影响清单四类</tspan></text><g data-k=\"页面：到模块\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">页面：到模块</tspan></text></g><g data-k=\"合同：到条款\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">合同：到条款</tspan></text></g><g data-k=\"话术：到条数\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">话术：到条数</tspan></text></g><g data-k=\"埋点：到指标\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">埋点：到指标</tspan></text></g></svg>", "d": 95.09}, {"t": "排期与那一行边界", "n": "排期写三个日期加一个角色：内部截止、培训与上线、复核时点，验收人写角色不写名字。为什么要内部截止早于生效日？因为改完还要测试、还要培训，留不出缓冲就一定踩线。最后必须写一行边界，两句话：哪些口径需法务确认，哪些结论我不下。这一行不是免责，是让评审的人知道你的判断止于哪里。金融的评审会最怕两种人：一种什么都敢下结论，一种什么都要等法务。前者危险，后者无效。写清边界的人，既敢推进又不越界，这种人做的简报才有人敢签。下一节我们把这套简报拿到合规官面前，让他挑漏洞。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">排期四件</tspan></text><g data-k=\"内部截止\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">内部截止</tspan></text></g><g data-k=\"培训与上线\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">培训与上线</tspan></text></g><g data-k=\"正式稿后复核\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">正式稿后复核</tspan></text></g><g data-k=\"边界一行\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">边界一行</tspan></text></g></svg>", "d": 60.1}, {"t": "小结与接下来", "n": "小结三句。第一，先看谁发的、什么文种、何时生效，这三件事决定紧迫度。第二，影响清单按页面、合同材料、话术、埋点四类写，每类落到具体位置。第三，排期要有内部截止和复核时点，并写一行边界，标出需法务确认的项。接下来做任务：写完这一页，合规与研发各发一份，请合规标越界、请研发估工时。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"先定文种\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">先定文种</tspan></text></g><g data-k=\"清单四类\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">清单四类</tspan></text></g><g data-k=\"排期留缓冲\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">排期留缓冲</tspan></text></g><g data-k=\"任务：一页简报\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：一页简报</tspan></text></g></svg>", "d": 35.83}], "deliverable": {"type": "skill", "name": "监管简报生成", "rubric": ["文种准确", "影响不漏项", "排期可执行"], "acceptance": "一页内写完：文种与状态明确、四段齐全、影响清单覆盖四类、至少一条待法务确认项"}, "practice": {"steps": ["定文种与状态：征求意见稿 / 正式稿 / 生效日 / 过渡期，写不出就先去查发布页", "贴原文依据：条文号 + 关键句照抄，一条法规最多摘三条，多了没人看", "列影响清单：页面 / 合同与材料 / 对客话术 / 埋点，四类逐条写，落到具体位置", "排期与验收：生效日、内部截止、验收人角色，标出必须法务确认的项"], "exemplar": "【《监管简报》· 消费金融费率披露新规】发布主体：金融监管总局　发布日期：2026-11-20\n\n■ 0. 文种与状态\n　文种：公开征求意见稿｜反馈截止：2026-12-05｜正式稿：未发布｜生效日：待定\n\n■ 1. 原文依据\n　第 X 条：「金融机构应当在借款合同订立前，以醒目方式披露年化综合成本区间及计算示例。」\n　第 Y 条：「不得仅以日利率、月利率等单一口径展示借贷成本。」\n\n■ 2. 影响清单\n　· 页面：闪电贷 申请页「借款成本」模块、合同签署页费用条款区、贷后账单页\n　· 合同与材料：借款合同费用条款、产品说明页、贷后服务协议附件\n　· 对客话术：短信 4 条、App 推送 3 条、客服知识库「利率说明」一节\n　· 埋点与数据：新增「成本披露曝光」「示例展开率」，用于事后自查\n\n■ 3. 需改动作\n　1. 申请页新增年化综合成本区间与计算示例（含是否含服务费的明示）　负责：产品\n　2. 全部对客材料删除单一日利率口径　负责：产品 + 客服主管\n　3. 合同费用条款按法务定稿重写并替换　负责：法务 + 产品\n　4. 7 条短信/推送模板改口径，知识库同步　负责：客服主管\n　5. 埋点补齐并接入周报　负责：数据 PM\n\n■ 4. 排期与验收\n　内部截止：2026-12-10｜客服培训：12-20｜验收：合规（口径）/ 产品（页面）/ 客服主管（话术）\n　正式稿发布后 5 个工作日内复核一次\n\n■ 5. 边界\n　需法务确认：年化综合成本是否含担保费与提前还款费；过渡期是否存在\n　我不下的结论：本条是否构成违规、罚则如何适用\n\n■ 备注：本简报依据公开征求意见稿整理，正式稿发布后须整体复核，不得直接作为上线依据。"}, "task": "产出《监管简报生成》：定文种与状态：征求意见稿 / 正式稿 / 生效日 / 过渡期，写不出就先去查发布页；贴原文依据：条文号 + 关键句照抄，一条法规最多摘三条，多了没人看；列影响清单：页面 / 合同与材料 / 对客话术 / 埋点，四类逐条写，落到具体位置；排期与验收：生效日、内部截止、验收人角色，标出必须法务确认的项", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的消费金融 AI 产品经理。本单元属于「M1 用 AI 做金融业务与监管洞察」模块，你要交付的是《监管简报生成》。\n【场景】业务侧这周的诉求是：简报的价值不在解读得多深，在于能不能直接变成研发的排期表。参考做法：某城商行用一页简报把新规拆成 11 张工单，两周内改完。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（四段式简报模板 + 影响清单（页面 / 材料 / 话术 / 埋点）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《监管简报》填写模板】新规名称：{{}}　发布主体：{{}}　发布日期：{{}}\n\n■ 0. 文种与状态（必填第一行）\n　文种：{{征求意见稿 / 正式稿 / 答记者问 / 自律规则}}\n　生效日：{{YYYY-MM-DD 或「待定」}}　过渡期：{{}}　反馈截止：{{}}\n\n■ 1. 原文依据（照抄，不改写）\n　第 {{}} 条：「{{关键句照抄}}」\n　第 {{}} 条：「{{}}」\n\n■ 2. 影响清单（四类逐条，落到具体位置）\n　· 页面：{{哪个页面哪个模块}}\n　· 合同与材料：{{哪份文本哪个条款}}\n　· 对客话术：{{哪几条模板、知识库哪一节}}\n　· 埋点与数据：{{补什么曝光/统计}}\n\n■ 3. 需改动作（工单语气，一条一个动作）\n　1. {{动作}}　负责：{{角色}}\n　2. {{动作}}　负责：{{角色}}\n　3. {{动作}}　负责：{{角色}}\n\n■ 4. 排期与验收\n　内部截止：{{}}｜培训与上线：{{}}｜验收人：{{合规 / 产品 / 客服主管}}\n　正式稿发布后复核：{{几个工作日内}}\n\n■ 5. 边界（必写）\n　需法务确认：{{哪些口径不能自行决定}}\n　我不下的结论：{{合规定性 / 罚则解释}}", "rubric": ["文种与状态写清（含生效日或「待定」），没有把征求意见稿当生效稿", "原文依据至少给出条文号与一句照抄原文，不是转述", "影响清单四类（页面 / 合同材料 / 话术 / 埋点）都有内容，每类落到具体位置", "排期含内部截止日与验收人角色，并单列「需法务确认」项"]}, {"id": "M1U4", "tier": "basic", "step": "spar", "title": "合规官挑简报漏洞", "video": {"dur": "4.5min", "script": ["简报被退回，多半不是理解错，是把不确定写成了确定", "角色陪练：合规官按「文种 / 条文 / 动作 / 边界」四层挑漏洞", "某机构简报把「拟」写成「必须」，被合规退回并要求重排期"]}, "ppt": {"method": "角色陪练：合规官按「文种 / 条文 / 动作 / 边界」四层挑漏洞", "case": "某机构简报把「拟」写成「必须」，被合规退回并要求重排期", "demo": "陪练演示：把「必须」追问到原文出处"}, "objective": "能在合规官四轮追问下说清文种、条文依据与动作来源，不被问出硬伤", "transfer": "把简报里最不确定的一条口径，主动写成待确认项并发给合规，而不是等被问", "vslides": [{"t": "本节要讲什么", "n": "这一节是陪练。合规官不挑错字，只查义务强度：你把多少「可以」写成了「必须」，又漏了多少「应当」。这一节讲三件事：四个词的强度差别、三类必被追问的合格答法、以及被问出硬伤时怎么收场。练完你要能报出每一条动作的条文出处。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"四个词的强度\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">四个词的强度</tspan></text></g><g data-k=\"三类必被追问\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三类必被追问</tspan></text></g><g data-k=\"硬伤怎么收场\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">硬伤怎么收场</tspan></text></g></svg>", "d": 27.29}, {"t": "合规官挑的不是错字，是义务强度", "n": "这个单元是陪练。对面是合规官，他不关心你写得好不好看，只查一件事：你把多少「可以」写成了「必须」，又把多少「必须」漏成了「建议」。监管文本的义务强度藏在几个词里：应当、不得、可以、鼓励。应当和不得是强制，可以是可选，鼓励基本等于没有强制力。AI 最容易在这四个词上做等量替换，因为它读起来通顺就行。你要练的是：每写一条动作，都能说出它来自哪一条、原文用的是哪个词。说得出，这条动作就站得住；说不出，删掉或者标待确认。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四个词的强度</tspan></text><g data-k=\"应当 = 强制\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">应当 = 强制</tspan></text></g><g data-k=\"不得 = 禁止\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">不得 = 禁止</tspan></text></g><g data-k=\"可以 = 可选\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">可以 = 可选</tspan></text></g><g data-k=\"鼓励 = 无强制\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">鼓励 = 无强制</tspan></text></g></svg>", "d": 52.99}, {"t": "三类必被追问，和合格答法", "n": "第一类，文种与生效日。不合格：「新规要求我们尽快改」。合格：「公开征求意见稿，反馈截止 12-05，正式稿未发，生效日待定，我按内部 12-10 排的缓冲」。第二类，条文出处。不合格：「行业都这么理解」。合格：「第 Y 条原文『不得仅以日利率展示』，我摘的是原句，附件第 3 页」。第三类，影响面。不合格：「影响消费贷」。合格：「影响申请页、合同页、7 条话术、账单页；代销渠道因为不展示利率，本轮不涉及」。合格答法的共同点是可核查：有日期、有页码、有范围划定依据。再教一个应对话术：被追问时先报出处，再报结论。比如「第 Y 条原文是不得仅以日利率展示，所以我把它排进必改项」。顺序反了，对方会先怀疑你的结论，再怀疑你的依据。还有一条：不要在两轮追问之间改变口径。第一次说影响四条话术，第二次说七条，对方会认为你没数清。稳定口径的另一个好处是，你下次再讲同一件事，听起来像同一个人在做判断。这一条在跨部门场合尤其重要，因为别人记住的不是你的分析，而是你有没有前后一致。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四层追问</tspan></text><g data-k=\"文种：哪一种\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">文种：哪一种</tspan></text></g><g data-k=\"条文：第几条\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">条文：第几条</tspan></text></g><g data-k=\"影响面：按什么划\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">影响面：按什么划</tspan></text></g><g data-k=\"待确认：哪几项\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">待确认：哪几项</tspan></text></g></svg>", "d": 94.18}, {"t": "被问出硬伤时怎么收场", "n": "陪练里你一定会被问出一处硬伤，比如某条动作其实来自答记者问而不是条文。正确动作三步：第一，承认且说清性质——「这条来自答记者问的解释，不是条文本身，义务强度我搞错了」；第二，给出修正——「我把它从必改项移到建议项，排期不动」；第三，约定复核——「正式稿发布后我再核一遍」。最差的反应是硬撑，硬撑一次，后面每一条都会被追问。合规官其实是你的盟友：他挑出的每一处，都是将来检查时不会被追责的地方。练完这一轮，下一节我们换个方向，用 AI 去盯竞品。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">被问住的三步</tspan></text><g data-k=\"承认性质\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">承认性质</tspan></text></g><g data-k=\"当场修正\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">当场修正</tspan></text></g><g data-k=\"约定复核\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">约定复核</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 54.17}, {"t": "小结与接下来", "n": "小结三句。第一，应当与不得是强制，可以是可选，鼓励没有强制力，这四个词决定排期松紧。第二，合格答法都可核查：有文种、有页码、有影响范围划定依据。第三，被问住别硬撑，承认性质、当场修正、约定复核，三步走完你依旧可信。接下来做任务：把简报里最不确定的一条口径主动写成待确认项发给合规，别等被问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"四词定强度\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">四词定强度</tspan></text></g><g data-k=\"答法要可核查\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">答法要可核查</tspan></text></g><g data-k=\"硬伤三步收场\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">硬伤三步收场</tspan></text></g><g data-k=\"任务：主动标待确认\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：主动标待确认</tspan></text></g></svg>", "d": 41.28}], "deliverable": {"type": "skill", "name": "监管简报生成", "rubric": ["依据可查", "表述克制", "边界清楚"], "acceptance": "四轮追问下每次都能给出条文号或标注「待确认」，不出现无依据的「必须」"}, "spar": {"role": "合规官", "persona": "只认原文与文种，逐条核对方是否把「拟」「可以」写成「必须」，问不出出处就退回", "mustAsk": ["你这份简报依据的是征求意见稿还是正式稿？生效日从哪来的？", "「必须新增计算示例」这句话，原文第几条？原文用的是「应当」还是「可以」？", "影响清单里为什么没有代销渠道的对客材料？你按什么范围划的影响面？", "年化综合成本的口径你直接按含服务费处理，依据在哪？如果不含，你的动作要改几条？"]}, "exemplar": "合格回答的三个特征（对照自查）：\n1. 报条文不报印象：「这条来自第 X 条原文『应当以醒目方式披露』，我摘的是原句」。\n2. 分清义务强度：「原文是『应当』，属强制；另一条写『可以』，是可选，我没把它排进必改项」。\n3. 主动承认不确定：「年化综合成本是否含担保费，原文没写清，我标了需法务确认，没有自行假设」。\n反面例子：「新规要求我们必须下周上线」——问哪条、哪个文种、哪个日期，一个都答不上来。", "task": "把《监管简报生成》拿到「合规官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《监管简报生成》。现在要让它通过「合规官」这一关。\n【对手的立场】只认原文与文种，逐条核对方是否把「拟」「可以」写成「必须」，问不出出处就退回。\n【他一定会追问】「你这份简报依据的是征求意见稿还是正式稿？生效日从哪来的？」 / 「「必须新增计算示例」这句话，原文第几条？原文用的是「应当」还是「可以」？」 / 「影响清单里为什么没有代销渠道的对客材料？你按什么范围划的影响面？」\n【场景】你说「合规官挑简报漏洞」，对方立刻回一句：你这份简报依据的是征求意见稿还是正式稿？生效日从哪来的？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M1U5", "tier": "adv", "step": "understand", "title": "竞品监控与市场扫描框架", "video": {"dur": "4.4min", "script": ["竞品监控失效的原因不是看不全，是看来的东西无法证明是什么时候看到的", "六维监控表（额度 / 定价 / 时效 / 权益 / 体验 / 披露）+ 取证来源清单", "某消金团队每月花 3 人日做竞品表，8 成数据无法追溯到取证时点"]}, "ppt": {"method": "六维监控表（额度 / 定价 / 时效 / 权益 / 体验 / 披露）+ 取证来源清单", "case": "某消金团队每月花 3 人日做竞品表，8 成数据无法追溯到取证时点", "demo": "把「盯竞品」这句口号拆成六个可取证维度"}, "objective": "能搭一套六维竞品监控框架，并为每个维度写出可取证的信息来源与更新频率", "transfer": "本周把六维框架落到一张表上，先填三家竞品的公开信息，标出哪三格取不到证", "vslides": [{"t": "本节要讲什么", "n": "这一节换个方向：用 AI 盯竞品。很多团队的竞品表越做越没人看，不是因为数据少，是因为没法追溯、口径混乱。这一节讲三件事：六维监控分别记什么、每个维度怎么取证与存档、以及更新频率为什么必须分档。看完你要能搭出一张能连续用半年的表。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"六维各记什么\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">六维各记什么</tspan></text></g><g data-k=\"怎么取证存档\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">怎么取证存档</tspan></text></g><g data-k=\"更新频率分档\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">更新频率分档</tspan></text></g></svg>", "d": 27.74}, {"t": "为什么竞品表越做越没人看", "n": "几乎每个团队都有竞品表，但很多人不看。原因不是数据少，是三个毛病。第一，无法追溯：写着「A 家额度最高 20 万」，问什么时候看到的、哪个页面，答不上来，半年后这句话可能已经失效。第二，口径混：把「最高额度」和「平均批核额度」放一列比较，结论必然反。第三，只记数字不记体验：记了利率，没记申请要填几屏、要不要人脸、多久出结果，而这三项才是转化的关键。改法很直接：每个维度都要有一个能取证的来源和一个存档位置，取不到的就标「未验证」，别猜。竞品分析的价值不在全面，在于你引用的每一条都能被复核。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"无来源的结论不写\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">无来源的结论不写</tspan></text></g><g data-k=\"口径要统一\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">口径要统一</tspan></text></g><g data-k=\"体验与数字一起记\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">体验与数字一起记</tspan></text></g></svg>", "d": 57.96}, {"t": "六维：从额度到披露", "n": "六维分别是：额度区间、定价口径、放款时效、新客权益、申请体验、信息披露。额度区间记最高与常见批核区间，两个都记；定价口径统一折算成年化综合成本，注明是否含服务费；放款时效分「宣传时效」与「实测时效」，后者只能自己申请一次才知道；新客权益记首借优惠、免息券、提额券的领取条件；申请体验记屏数、必填项、人脸次数、从提交到出结果的时间；信息披露记利率展示方式、费用说明清楚程度、合同可下载性。后两项看起来软，但它们既是体验差异，也是合规差异——披露做得好的竞品，往往在投诉率上也更好看。六维填满，你的月报才有讨论价值。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">六维监控</tspan></text><g data-k=\"额度区间\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">额度区间</tspan></text></g><g data-k=\"定价口径\"><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">定价口径</tspan></text></g><g data-k=\"放款时效\"><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">放款时效</tspan></text></g><g data-k=\"新客权益\"><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">新客权益</tspan></text></g><g data-k=\"申请体验\"><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">申请体验</tspan></text></g><g data-k=\"信息披露\"><rect x=\"272.7\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">信息披露</tspan></text></g></svg>", "d": 70.25}, {"t": "取证、存档、更新频率", "n": "取证有三种方式：截图公开页、实测走一遍流程、查公开披露与公告。截图要带时间，实测要记下账号类型与设备，公告要存原文链接。存档建议放共享盘一个目录，按月分文件夹，文件名带日期，这样任何人问「这条哪来的」你三十秒能翻出来。更新频率按变动速度分档：价格类周更，因为竞品调价最快；权益类双周；体验类季更，因为改版周期长；披露类跟着监管节奏走。分档的好处是不会因为「每周全查一遍」而放弃——真实情况是，全查一遍没人做得到，于是整张表停更。最后留一格「未验证」，专门放那些你确实取不到的信息，这一格是这张表的诚实度。最后一条经验：别一个人做完六个维度。价格与权益让运营盯，体验与披露你自己走流程，效率高且不容易漏——一个人全包的结果通常是价格记得很细，体验全是印象。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">取证到更新</tspan></text><g data-k=\"截图/实测/公告\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">截图/实测/公告</tspan></text></g><g data-k=\"按月存档\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-
