weight=\"700\"><tspan x=\"200.0\">按月存档</tspan></text></g><g data-k=\"按变动速度分档更新\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">按变动速度分档</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">更新</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 71.59}, {"t": "小结与接下来", "n": "小结三句。第一，没有来源与抓取日期的结论不写，写了也没人敢用。第二，六维里额度与定价要统一口径，时效要分宣传与实测，体验与披露是差异化的地方。第三，更新按变动速度分档，全查一遍没人做得到，分档才能持续。接下来做任务：把六维框架落成一张表，先填三家公开信息，标出哪三格取不到证。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"无源不写\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">无源不写</tspan></text></g><g data-k=\"六维记什么\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">六维记什么</tspan></text></g><g data-k=\"频率要分档\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">频率要分档</tspan></text></g><g data-k=\"任务：落一张表\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：落一张表</tspan></text></g></svg>", "d": 38.18}], "deliverable": {"type": "workflow", "name": "竞品 AI 能力监控", "rubric": ["维度完整", "来源可证", "更新可续"], "acceptance": "六维各有一条取证来源、一个更新频率、一个存档位置；对任一结论能说出抓取时间与页面快照"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】六维监控表（额度 / 定价 / 时效 / 权益 / 体验 / 披露）+ 取证来源清单\n【为什么重要】竞品监控失效的原因不是看不全，是看来的东西无法证明是什么时候看到的\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["六个维度全部落地：额度区间、定价口径、放款时效、新客权益、申请体验、信息披露", "每个维度写明取证来源（哪个页面 / 哪个渠道 / 是否需要实测）与快照存档位置", "更新频率分档：价格类周更、权益类双周、体验类季更，并说明为什么这样分", "能指出至少两格取不到证（如真实放款时效），并给出替代口径或标注「未验证」"]}, {"id": "M1U6", "tier": "adv", "step": "demo", "title": "监控 3 家竞品动向", "video": {"dur": "4.3min", "script": ["AI 会把三家缺的格子用「行业惯例」补齐，这类补齐在评审会上是致命的", "六维表 + 提示词：只允许基于给定快照归纳，禁补行业均值", "「模拟银行 X」对标三家同类产品（A/B/C），公开页信息整理成可比表"]}, "ppt": {"method": "六维表 + 提示词：只允许基于给定快照归纳，禁补行业均值", "case": "「模拟银行 X」对标三家同类产品（A/B/C），公开页信息整理成可比表", "demo": "WorkBuddy 内跑一遍：贴三份快照 → 六维对比表 → 人改四处"}, "objective": "能在一小时内完成三家竞品的六维扫描，并输出每个结论都带取证时点的对比表", "transfer": "把本月三家竞品扫描表放进共享盘，标注三格未验证，附上取不到的替代口径", "vslides": [{"t": "本节要讲什么", "n": "这一节跑一次真实扫描：三家竞品、六维、一小时。你会看到三家的口径根本不一样，直接并列一定得出错误结论。这一节讲三件事：为什么先统一口径再填表、提示词里必须写死哪四条规则、以及 AI 会在哪里偷偷补齐而你必须拦住。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"先统一口径\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">先统一口径</tspan></text></g><g data-k=\"四条硬规则\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">四条硬规则</tspan></text></g><g data-k=\"拦住偷偷补齐\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">拦住偷偷补齐</tspan></text></g></svg>", "d": 28.75}, {"t": "先看快照：三家口径根本不一样", "n": "三份快照摆在一起，第一眼就发现问题：A 家报年化区间，B 家报「起」并注明含服务费，C 家只报日利率。三种口径直接并列，得出的结论一定是错的——C 家看起来最便宜，其实只是没说服务费。所以第一步不是填表，是统一口径：日利率乘 365 折算年化，再标注是否含费、信息是否完整。这一步必须人工决定，因为折算涉及「按 365 还是 360」「是否含担保费」这些业务判断，交给 AI 它只会给你一个看起来很专业的数字。统一完口径，表才有可比性；否则你做的不是对比表，是三份广告词并排。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">可比的两家</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">需折算的一家</tspan></text><g data-k=\"A：年化 7.2%–24% B：8.5% 起 含费\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">A：年化 7.2%–24%</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">B：8.5% 起 含费</tspan></text></g><g data-k=\"C：日利率 0.02% （未给年化、未说含费）\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">C：日利率 0.02%</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">（未给年化、未说含费）</tspan></text></g></svg>", "d": 55.58}, {"t": "跑一遍：让 AI 只做归纳，不做补齐", "n": "提示词里我写了四条规则：每格标来源与日期、不得用行业均值补齐、口径不一致先统一、最后单列「无法判断的三件事」。最后一条是关键——大部分竞品表都缺这一节，于是读者会把「未获取」当成「没有」，把「没写」当成「没有」。跑出来的表里，AI 有一格偷偷按惯例填了「结果时间约 60 秒」，我把这格改回「未获取」，并注明依据是用户反馈而不是实测。另外它还想补一行行业平均年化，我直接删了：三家样本推不出行业均值，这种数字进月报只会被战略问一句「哪来的」。归纳可以做，补齐不行，这条线在提示词里就要说清。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四条硬规则</tspan></text><g data-k=\"每格：来源+日期\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">每格：来源+日期</tspan></text></g><g data-k=\"不用均值补空格\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">不用均值补空格</tspan></text></g><g data-k=\"先统一口径\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">先统一口径</tspan></text></g><g data-k=\"单列「无法判断」\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">单列「无法判断」</tspan></text></g></svg>", "d": 53.69}, {"t": "人改四处，然后留下未验证", "n": "第一处，给 C 家加「未含服务费、不完全可比」；第二处，每格补抓取日期，不只表头一个日期；第三处，把「据用户反馈」的证据强度写明，把未获取的留空；第四处，删掉凭空补的行业均值。改完这张表的最大价值不是信息多，而是每一格都能被复核：谁问「这条哪来的」，你能说出页面和日期。最后建议在表尾留三行「未验证」，写清取不到的原因和补法，比如「真实时效需内部账号各申请一笔」。这三个字看起来像认输，其实是这张表唯一可持续的地方——它让你下个月还能接着更新，而不是整张表推倒重做。还有一个常被忽略的动作：把本月的表另存一份带月份的快照。三个月后回看，你才能说清某个竞品是在持续降价，还是某个月做了活动——这个判断直接影响要不要跟价。顺手把「上月值」也留在表里一列，异动才有对照，否则每月都在重新认识对手。这一列很小，但它是「持续观察」和「每次重来」的分界线。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"口径注可比性\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">口径注可比性</tspan></text></g><g data-k=\"每格带日期\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每格带日期</tspan></text></g><g data-k=\"未获取就留空\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">未获取就留空</tspan></text></g><g data-k=\"未验证写补法\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">未验证写补法</tspan></text></g></svg>", "d": 83.57}, {"t": "小结与接下来", "n": "小结三句。第一，日利率、年化、含不含费三种口径并列比较，结论必错，先折算再比。第二，每格要带来源与日期，取不到就写未获取，别让读者把没写当成没有。第三，AI 会按行业惯例补空格、会补行业均值，这两类补齐一律删。接下来做任务：把本月三家扫描表放进共享盘，标注未验证，附上补法。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"先统一口径\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">先统一口径</tspan></text></g><g data-k=\"每格带来源\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">每格带来源</tspan></text></g><g data-k=\"删掉补齐\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">删掉补齐</tspan></text></g><g data-k=\"任务：三家扫描\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：三家扫描</tspan></text></g></svg>", "d": 37.97}], "deliverable": {"type": "workflow", "name": "竞品 AI 能力监控", "rubric": ["可比性", "有据可查", "不编造"], "acceptance": "能产出《竞品 AI 能力监控》并通过本单元评分要点"}, "demo": {"ref": "■ 六维对比表（抓取日期：2026-11-15，均为公开页面快照）\n\n| 维度 | A 家 | B 家 | C 家 |\n|---|---|---|---|\n| 额度区间 | 最高 20 万（来源：产品页，11-15） | 最高 30 万（来源：产品页，11-15） | 未获取（仅 App 内展示） |\n| 定价口径 | 年化 7.2%–24%，页面未明示含费口径（11-15） | 年化 8.5% 起，注明含服务费（11-15） | 日利率 0.02% 起，未给年化（11-15） |\n| 放款时效 | 宣传 1 分钟，实测未做 | 宣传 3 分钟，实测未做 | 宣传 5 分钟，实测未做 |\n| 新客权益 | 首借 30 天免息（需邀请码） | 首借 15 天免息 + 提额券（限新户） | 首借 7 天免息（限受邀） |\n| 申请体验 | 4 屏、人脸 1 次、结果约 60 秒（据用户反馈） | 5 屏、人脸 1 次、结果时间未获取 | 3 屏、人脸 2 次、结果约 30 秒（据用户反馈） |\n| 信息披露 | 有利率示例，费用条目 4 项 | 有利率示例与年化综合成本说明 | 无示例，仅日利率 |\n\n■ 口径统一说明\n C 家的日利率按 0.02% × 365 折算约 7.3%，但未含服务费信息，与 A/B 不完全可比，已在表内标注。\n\n■ 无法从公开信息判断的三件事\n 1. 三家真实批核额度分布 —— 需实测申请或第三方数据，公开页只有上限。\n 2. 真实放款时效 —— 需各申请一笔并计时，且会受时段与资质影响。\n 3. 服务费与担保费的实际收取方式 —— 公开页表述不完整，需看合同样本。\n\n⚠ 建议：本周内各实测 1 笔（内部测试账号），把「实测时效」这一列补上；未补前该列一律标「未验证」。", "fix": ["把 AI 表里 C 家的「年化约 7.3%」加了「未含服务费，不完全可比」的注——直接与其他两家并列比较，会得出错误结论。", "给每一格补上抓取日期，原来只有表头一个日期；一旦跨月更新，没有格子日期的表就无法判断哪条过期。", "把「据用户反馈」的证据强度标明，并把「结果时间未获取」如实留空——AI 原本按行业惯例填了「约 60 秒」。", "删掉 AI 补的一行「行业平均年化约 12%」，三家样本里根本推不出这个数，写进月报会被战略当场质疑。"], "judge": "判断依据：每格是否有来源与日期；有没有用行业惯例补空格；口径不一致是否先统一再比较；是否单列「无法判断的三件事」", "sheet": {"situ": "你是「模拟银行 X」的产品经理，助理把三家竞品这个月的公开快照整理成 6 条记录发给你。你要判断每条属于哪个维度、口径能不能直接比、证据到哪一级，以及要补什么。", "ask": "① 判断这条属于哪个维度；② 判定可比性（可比 / 需折算 / 不可比）；③ 判证据级别（一级常驻 / 二级活动 / 三级线索 / 未验证），并写出补法。", "gen": "请基于以上判定，输出：① 这 6 条里哪些可以直接进本月对比表、哪些必须留空；② 本月还缺哪两格最该补实测，怎么补；③ 用一句话说明本月最值得注意的变化。所有结论必须能指回上面的来源与日期。", "mats": [{"id": "K01", "src": "A 家 · 产品页", "text": "最高可借 20 万元，年化利率 7.2% 起，页面未说明是否含服务费（抓取 11-15，连续三周未见变化）"}, {"id": "K02", "src": "B 家 · 产品页", "text": "最高 30 万，年化综合成本 8.5% 起（含服务费），额度以审批为准（抓取 11-15）"}, {"id": "K03", "src": "C 家 · 活动页", "text": "新客首借 7 天免息，限本月 11-01 至 11-30，页面有倒计时（抓取 11-15）"}, {"id": "K04", "src": "C 家 · 申请流程实测", "text": "3 屏填写、人脸 2 次、提交后约 30 秒出结果（测试账号 11-15 实测）"}, {"id": "K05", "src": "用户社区帖", "text": "有用户说 A 家放款「基本当天到」，也有人说过了两天才到（11-13 帖）"}, {"id": "K06", "src": "C 家 · App 内页", "text": "额度区间仅在实名登录后展示，未登录看不到（抓取 11-15）"}], "cols": [{"k": "dim", "name": "属于哪个维度", "hint": "六维之一", "type": "chips", "w": 3, "tags": ["额度区间", "定价口径", "放款时效", "新客权益", "申请体验", "信息披露"]}, {"k": "cmp", "name": "可比性", "hint": "能不能直接与别家比", "type": "chips", "w": 2, "tags": ["可比", "需折算", "不可比"]}, {"k": "evid", "name": "证据级别", "hint": "一级/二级/三级/未验证", "type": "chips", "w": 2, "tags": ["一级", "二级", "三级", "未验证"]}, {"k": "fix", "name": "补法（一句）", "hint": "要补什么、怎么补", "type": "text", "w": 3, "tags": []}], "key": {"K01": {"dim": "定价口径", "cmp": "需折算", "evid": "一级", "fix": "需确认是否含服务费，未确认前不与其他两家并列比较"}, "K02": {"dim": "定价口径", "cmp": "可比", "evid": "一级", "fix": "可直接使用，作为口径基准（含费已明示）"}, "K03": {"dim": "新客权益", "cmp": "不可比", "evid": "二级", "fix": "标注活动截止 11-30，跨月后须复核是否延续"}, "K04": {"dim": "申请体验", "cmp": "可比", "evid": "一级", "fix": "记录测试账号类型与设备，作为实测基线"}, "K05": {"dim": "放款时效", "cmp": "不可比", "evid": "三级", "fix": "仅作线索，需内部账号实测后替代"}, "K06": {"dim": "额度区间", "cmp": "不可比", "evid": "未验证", "fix": "用内部测试账号走完申请流程取值，未取到前标未验证"}}, "notes": {"K05·evid": "社区帖属三级线索：样本不明、无计时口径。可以直接当线索，不能写进对比表当结论", "K03·evid": "活动页有倒计时与起止日期 → 二级限时动作，不能当长期定价结论", "K01·cmp": "未明示是否含服务费，与其他两家并列只能得出错误结论，必须先确认再比", "K06·evid": "未登录看不到 → 未验证。这一格的价值就在于如实标注，而不是拿行业惯例补一个数", "K04·evid": "实测记录要写清账号类型与设备，否则下个月无法判断变化是不是因为换了测试口径", "K02·cmp": "含费已明示 + 常驻页多期不变 → 既能直接比，也可作为口径基准"}, "delta": [{"op": "改", "frm": "把 K05 社区帖的「当天到」写进对比表时效一列", "to": "时效列写「未验证」，社区帖仅作线索备注", "why": "把线索当结论，评审一问「哪来的、几个人、怎么计时」就塌；时效是实测项，不是听闻项", "kw": ["未验证", "线索", "实测", "传闻"]}, {"op": "改", "frm": "把 K03 的首借免息当成长期权益写进月报", "to": "标「限 11-01 至 11-30，跨月复核」", "why": "活动权益与常驻权益混写，会让决策层误判对手成本结构，进而做错跟不跟的判断", "kw": ["活动", "限时", "截止", "复核"]}, {"op": "删", "frm": "在表尾补一句「行业平均年化约 12%，三家均低于均值」", "to": "整句删除", "why": "三家样本推不出行业均值，这类数字无法核实，写进月报会被战略当场问来源", "kw": ["行业", "平均", "均值", "12%"]}], "refsheet": "K01｜定价口径｜需折算｜一级｜需确认是否含服务费，未确认前不并列\nK02｜定价口径｜可比｜一级｜可直接用，作口径基准\nK03｜新客权益｜不可比｜二级｜标活动截止 11-30，跨月复核\nK04｜申请体验｜可比｜一级｜记录账号类型与设备\nK05｜放款时效｜不可比｜三级｜仅作线索，需实测替代\nK06｜额度区间｜不可比｜未验证｜用测试账号取值，未取到标未验证", "forbid": "\\d{6}(19|20)\\d{2}[01]\\d[0-3]\\d{4}[0-9Xx]|6222\\*{0,4}\\d{4}", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是三家竞品公开页面与公告的快照摘要（均为公开信息，抓取日期已标注）：\n[A 家快照 / B 家快照 / C 家快照]\n请按六维输出对比表：额度区间、定价口径（统一折算年化综合成本，注明是否含服务费）、放款时效（分宣传与实测）、新客权益、申请体验（屏数/人脸/出结果时间）、信息披露。\n规则：\n① 每格必须标「来源 + 抓取日期」，缺来源的格子写「未获取」；\n② 不得用行业均值或惯例补齐任何一格；\n③ 三家口径不一致时，先统一口径再比较，统一方式写在表下注释；\n④ 最后单独列「无法从公开信息判断的三件事」。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】六维表 + 提示词：只允许基于给定快照归纳，禁补行业均值\n【参考案例】「模拟银行 X」对标三家同类产品（A/B/C），公开页信息整理成可比表\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是三家竞品公开页面与公告的快照摘要（均为公开信息，抓取日期已标注）：\n[A 家快照 / B 家快照 / C 家快照]\n请按六维输出对比表：额度区间、定价口径（统一折算年化综合成本，注明是否含服务费）、放款时效（分宣传与实测）、新客权益、申请体验（屏数/人脸/出结果时间）、信息披露。\n规则：\n① 每格必须标「来源 + 抓取日期」，缺来源的格子写「未获取」；\n② 不得用行业均值或惯例补齐任何一格；\n③ 三家口径不一致时，先统一口径再比较，统一方式写在表下注释；\n④ 最后单独列「无法从公开信息判断的三件事」。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M1U7", "tier": "adv", "step": "todo", "title": "产出竞品监控月报模板", "video": {"dur": "4.4min", "script": ["月报不是信息堆，是「这个月有什么变了、我要不要动」的判断材料", "月报模板（六维表 / 异动三条 / 未验证清单 / 下月实测计划）", "某团队月报从 12 页压到 2 页，决策层阅读率从 3 成升到 8 成"]}, "ppt": {"method": "月报模板（六维表 / 异动三条 / 未验证清单 / 下月实测计划）", "case": "某团队月报从 12 页压到 2 页，决策层阅读率从 3 成升到 8 成", "demo": "月报填写指引：先填六维，再写异动，最后写实测计划"}, "objective": "能做出一份能连续用 6 个月的竞品月报模板，含六维表、异动说明与未验证清单", "transfer": "本月用模板出第一期月报，发给战略负责人并请他指出哪一格最该补实测", "vslides": [{"t": "本节要讲什么", "n": "这一节落一份月报模板：六维表打底、异动三条为主、未验证清单兜底、一句判断收尾。这一节讲三件事：月报到底回答什么问题、异动怎么写才可判、以及实测计划为什么每月最多两项。看完你就能出第一期。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"月报回答一个问题\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">月报回答一个问题</tspan></text></g><g data-k=\"异动怎么写\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">异动怎么写</tspan></text></g><g data-k=\"实测限两项\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">实测限两项</tspan></text></g></svg>", "d": 23.09}, {"t": "月报只回答一个问题", "n": "月报唯一要回答的问题是：这个月有什么变了，我要不要动。所以它的结构不是「六维全填满」，而是「六维为底、异动三条为主、判断一句收尾」。六维表是底稿，每格带来源与日期，方便任何人复核；异动只有三条，只写变化项，没变的不写；最后一句判断给决策层，写清要不要动。为什么强调只写三条？因为你写十条，读者一条都不记；写三条，他能记住其中一条。还有一个常被忽略的部分：未验证清单。把取不到的格子如实列出来，比用行业惯例补齐更有价值——前者让人知道边界，后者让人相信了错的东西。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">月报四块</tspan></text><g data-k=\"六维表：带来源日期\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">六维表：带来源日期</tspan></text></g><g data-k=\"异动：只写变化，恰好三条\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">异动：只写变化，恰好三条</tspan></text></g><g data-k=\"未验证：写清补法\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">未验证：写清补法</tspan></text></g><g data-k=\"判断：要不要动\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">判断：要不要动</tspan></text></g></svg>", "d": 57.7}, {"t": "异动怎么写成可判的一条", "n": "异动的写法有固定句式：哪家、哪个维度、从什么变成什么、来源在哪、可能影响什么。比如「B 家定价从 9.8% 起调整为 8.5% 起，并新增含服务费说明，来源是 11-15 与 10-18 两次快照对比，可能影响新客比价劣势」。这一句里五个要素齐全，任何人接手都能复核。不合格写法是「B 家降价了，竞争加剧」——降了多少、什么时候、来源都没有，而且「竞争加剧」是判断不是事实。另外提醒：异动要基于你自己存档的历史快照，这也是上一节强调按月存档的原因——没有上月快照，你根本说不出「变了什么」。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">异动的五个要素</tspan></text><g data-k=\"哪家\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">哪家</tspan></text></g><g data-k=\"哪个维度\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">哪个维度</tspan></text></g><g data-k=\"从什么变成什么\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">从什么变成什么</tspan></text></g><g data-k=\"来源与时点\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">来源与时点</tspan></text></g></svg>", "d": 57.91}, {"t": "实测计划：每月最多两项", "n": "为什么限制两项？因为实测意味着真走一遍流程，要内部账号、要人盯、要记录时间，做多了必然糊弄。两项的原则是：先测最影响决策的。额度和时效通常比权益更影响决策，因为前者决定客户能不能拿到钱、多快拿到。每项写清三件事：测什么、谁测、什么时候出结论。写不出结论时间的实测，基本不会做。最后那句判断要谨慎：只写一件事，写清要不要动。判断写多了，等于没有判断；写得太满，下个月打脸。留一点余地，比如「暂不跟价，但需补披露」，这种表述既是判断，也是给自己留的下一步。再补一条纪律：月报里不要出现「我们认为」「感觉上」这类词。要判断就写成可验证的句子，比如「若 B 家价格维持两个月以上，我们新客成本将上升约 8%」——这种句子能被检验，也才能在两个月后被证明你对或错。判断后面附一句「我的验证方式」，比如看下月新客成本是否超过阈值，这让判断可被追踪。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"每月最多两项实测\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每月最多两项实测</tspan></text></g><g data-k=\"先测最影响决策的\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">先测最影响决策的</tspan></text></g><g data-k=\"判断只写一件事\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">判断只写一件事</tspan></text></g></svg>", "d": 86.93}, {"t": "小结与接下来", "n": "小结三句。第一，月报只回答「这个月什么变了、我要不要动」，不是信息堆。第二，异动只用三条，每条写清从什么变成什么、来源在哪、可能影响什么。第三，未验证清单比补齐更有价值，它让人知道边界在哪。接下来做任务：用模板出第一期月报，发给战略负责人，请他指哪一格最该补实测。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"只答一个问题\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">只答一个问题</tspan></text></g><g data-k=\"异动三条\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">异动三条</tspan></text></g><g data-k=\"未验证是诚实\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">未验证是诚实</tspan></text></g><g data-k=\"任务：第一期月报\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：第一期月报</tspan></text></g></svg>", "d": 35.78}], "deliverable": {"type": "skill", "name": "竞品 AI 能力监控", "rubric": ["可比性", "异动可判", "可持续"], "acceptance": "两页内：六维表每格带来源与日期、异动恰好三条且都是变化项、未验证清单含补法、实测计划不超 2 项"}, "practice": {"steps": ["填六维表：每格写「数值 + 来源 + 抓取日期」，取不到写「未获取」", "写异动三条：只写本月与上月相比变了什么，没变的不写", "列未验证清单：哪些格取不到、为什么、下月怎么补", "排下月实测计划：最多 2 项，写清测什么、谁测、什么时候出结论"], "exemplar": "【《竞品监控月报》· 2026 年 11 月】范围：A/B/C 三家　编制：产品组\n\n■ 一、六维对比表（摘要，每格均带来源与日期）\n　额度区间：A 最高 20 万（产品页 11-15）｜B 最高 30 万（产品页 11-15）｜C 未获取（仅 App 展示）\n　定价口径：A 年化 7.2%–24%，未明示含费（11-15）｜B 8.5% 起，注明含服务费（11-15）｜C 日利率 0.02%，未给年化（11-15）\n　放款时效：三家均只有宣传口径（1/3/5 分钟），实测列全部未验证\n　新客权益：A 首借 30 天免息（需邀请码）｜B 首借 15 天免息 + 提额券｜C 首借 7 天免息（限受邀）\n　申请体验：A 4 屏 1 次人脸｜B 5 屏 1 次人脸｜C 3 屏 2 次人脸（据用户反馈）\n　信息披露：A 有利率示例 4 项费用｜B 有年化综合成本说明｜C 仅日利率，无示例\n　口径说明：C 家日利率折算约 7.3%，但未含服务费，与 A/B 不完全可比。\n\n■ 二、本月异动（三条）\n　1. B 家定价从「9.8% 起」调整为「8.5% 起」，并新增含服务费说明（来源：产品页 11-15 对比 10-18 快照）→ 可能影响：新客比价时我们处于劣势，需评估是否给新客券。\n　2. A 家申请屏数从 5 屏降到 4 屏（来源：11-15 实测截图）→ 可能影响：转化率差距可能扩大。\n　3. C 家新客免息从 14 天缩到 7 天（来源：活动页 11-15）→ 可能影响：其新客成本压力上升，短期不构成威胁。\n\n■ 三、未验证清单\n　· C 家额度区间｜原因：仅 App 内展示，需实名才可见｜下月补法：用内部测试账号走一遍申请流程\n　· 三家真实放款时效｜原因：需实际申请并计时｜下月补法：各 1 笔内部测试，记录提交到到账时间\n\n■ 四、下月实测计划（2 项）\n　· 测什么：三家真实放款时效｜谁测：产品助理小王｜结论时间：12-10\n　· 测什么：C 家额度与费用结构｜谁测：产品助理小王｜结论时间：12-15\n\n■ 五、一句判断\n　B 家降价并明确含费口径，是在用透明度换转化。我们暂不跟价，但需在申请页补「年化综合成本 + 示例」，用披露优势对冲价格劣势。"}, "task": "产出《竞品 AI 能力监控》：填六维表：每格写「数值 + 来源 + 抓取日期」，取不到写「未获取」；写异动三条：只写本月与上月相比变了什么，没变的不写；列未验证清单：哪些格取不到、为什么、下月怎么补；排下月实测计划：最多 2 项，写清测什么、谁测、什么时候出结论", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的消费金融 AI 产品经理。本单元属于「M1 用 AI 做金融业务与监管洞察」模块，你要交付的是《竞品 AI 能力监控》。\n【场景】业务侧这周的诉求是：月报不是信息堆，是「这个月有什么变了、我要不要动」的判断材料。参考做法：某团队月报从 12 页压到 2 页，决策层阅读率从 3 成升到 8 成。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（月报模板（六维表 / 异动三条 / 未验证清单 / 下月实测计划）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《竞品监控月报》填写模板】月份：{{YYYY-MM}}　范围：{{A/B/C 三家}}　编制：{{}}\n\n■ 一、六维对比表（每格：数值 + 来源 + 抓取日期）\n　额度区间｜定价口径｜放款时效（宣传 / 实测）｜新客权益｜申请体验｜信息披露\n　口径说明：{{统一折算方式；哪家不可比，为什么}}\n\n■ 二、本月异动（恰好三条，只写变化项）\n　1. {{哪家 / 哪个维度}}：从 {{上月}} 变成 {{本月}}　来源：{{}}　可能影响：{{}}\n　2. {{}}\n　3. {{}}\n\n■ 三、未验证清单（取不到的都放这里）\n　· {{哪一格}}｜原因：{{}}｜下月补法：{{}}\n　· {{}}\n\n■ 四、下月实测计划（不超 2 项）\n　· 测什么：{{}}｜谁测：{{}}｜结论时间：{{}}\n　· {{}}\n\n■ 五、一句判断（给决策层）\n　{{这个月最值得关注的一件事，以及我们要不要动}}", "rubric": ["六维表每格都有来源与抓取日期；空格写「未获取」并列入未验证清单", "异动只写变化项，恰好三条，每条写清「从什么变成什么」与可能影响", "未验证清单至少两条，含取不到的原因与下月补法，不只写「待补」", "实测计划不超 2 项，每项写明测什么、谁测、出结论时间"]}, {"id": "M1U8", "tier": "adv", "step": "spar", "title": "战略负责人复盘", "video": {"dur": "4.9min", "script": ["战略不关心竞品做了什么，关心我们跟不跟、跟的代价是什么、什么时候动", "角色陪练：按「可信度 / 影响面 / 代价 / 时机」四层追问", "某团队月报被追问「B 家降价你怎么知道是长期还是活动」，当场无法回答"]}, "ppt": {"method": "角色陪练：按「可信度 / 影响面 / 代价 / 时机」四层追问", "case": "某团队月报被追问「B 家降价你怎么知道是长期还是活动」，当场无法回答", "demo": "陪练演示：把「B 家降价」追到是长期调价还是限时活动"}, "objective": "能在战略负责人追问下说清竞品变化的可信度、我们该不该动、动的话代价多少", "transfer": "把月报里那句判断单独抽出来，写成一页「跟或不跟」的取舍说明，先给直属上级过一遍", "vslides": [{"t": "本节要讲什么", "n": "这一节是复盘陪练。战略负责人只问四句：变化可信吗、影响多少、代价多少、为什么现在。这一节讲三件事：证据怎么分级、影响怎么量化才不假精确、以及跟价与不跟价的代价为什么必须一起给。练完你要能在一句话里同时给出两个数。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"证据分三级\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">证据分三级</tspan></text></g><g data-k=\"量化别假精确\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">量化别假精确</tspan></text></g><g data-k=\"两个代价一起给\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">两个代价一起给</tspan></text></g></svg>", "d": 28.75}, {"t": "战略只问四件事", "n": "复盘会上，战略负责人不会听你复述竞品做了什么，他只问四件事：这个变化可信吗、影响我们多少、跟的代价多少、为什么现在动。四问的顺序有讲究：先验证据，因为竞品信息最容易失真；再量化影响，因为「有影响」不是决策依据；然后算代价，因为任何应对都有成本；最后定时机，因为早动和晚动的代价不一样。这一节练的就是这四层：证据分级、影响量化、代价测算、时机判断。四层都答得出，你的月报才有决策价值；答不出，它只是一份信息汇总。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">战略四问</tspan></text><g data-k=\"变化可信吗\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">变化可信吗</tspan></text></g><g data-k=\"影响多少\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">影响多少</tspan></text></g><g data-k=\"代价多少\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">代价多少</tspan></text></g><g data-k=\"为什么现在\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">为什么现在</tspan></text></g></svg>", "d": 53.95}, {"t": "证据分级与影响量化", "n": "证据分三级：一级是常驻页面连续多期不变，属定价调整；二级是活动页、有倒计时或门槛，属限时动作；三级是用户反馈与第三方说法，只能当线索。分级的用处是决定反应速度：一级要评估跟不跟，二级观察即可，三级先取证再说话。影响量化要给口径：同客群对比差几个百分点、按上月新客量测算流失区间、样本多大。这里最忌讳给一个精确到小数点的数字却没有口径——战略一听就知道是猜的。宁可给区间加口径，也别给假精确。比如「预计流失 3% 到 5%，按上月 1.2 万新客与同客群比价行为测算」，这种表述才经得起追问。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">证据分级</tspan></text><g data-k=\"一级：常驻页多期不变\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">一级：常驻页多期不变</tspan></text></g><g data-k=\"二级：活动页有倒计时\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">二级：活动页有倒计时</tspan></text></g><g data-k=\"三级：用户反馈当线索\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三级：用户反馈当线索</tspan></text></g><g data-k=\"量化要给口径与区间\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">量化要给口径与区间</tspan></text></g></svg>", "d": 63.36}, {"t": "代价与时机：两个数一起给", "n": "跟价的代价和不跟的代价必须一起给。跟价：按新客月放款规模测算收入减少多少；不跟：预计少放多少、份额丢多少。两个数放在一起，决策才成立——只说跟价损失，听起来像反对；只说份额流失，听起来像鼓吹。时机的判断有个实用原则：先动成本低、可逆的动作。披露改进通常两周能上线，且可逆；价格一旦下调很难收回，属于不可逆动作。所以常见的最优解是「先补披露，价格等预算窗口」。这个思路在金融尤其适用，因为价格战在这个行业里几乎没有赢家，而透明度和体验是可以长期积累的差异。最后提醒一个常见误区：把跟价当成立即执行。价格调整要走定价委员会、要过合规、要改系统，最快也是两周；披露改进往往一周能上线。这个时间差本身就是策略资源，谁先动一步，谁就先拿到数据。把这条时间差写进决策建议，比只报价格差有用得多——决策层要知道的是「现在能做什么」。最后留一句诚实的话：这两个月的数据还不足以判断对手是战术降价还是战略转向，下月再看。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">代价 A</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">代价 B</tspan></text><g data-k=\"跟价：收入少 720 万 不可逆\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">跟价：收入少 720 万</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">不可逆</tspan></text></g><g data-k=\"不跟：少放 2400 万 可观察\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">不跟：少放 2400 万</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">可观察</tspan></text></g></svg>", "d": 107.9}, {"t": "小结与接下来", "n": "小结三句。第一，证据分级决定反应速度：常驻页多期不变要评估，活动页观察，用户反馈先取证。第二，量化宁可给区间加口径，别给假精确的小数点，战略一听就知道是猜的。第三，跟价与不跟价的代价一起给，先动可逆的动作，价格这种不可逆的最后动。接下来做任务：把月报那句判断抽成一页取舍说明，先请直属上级过一遍。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"证据分级\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">证据分级</tspan></text></g><g data-k=\"区间加口径\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">区间加口径</tspan></text></g><g data-k=\"两代价并列\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">两代价并列</tspan></text></g><g data-k=\"任务：一页取舍\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：一页取舍</tspan></text></g></svg>", "d": 40.06}], "deliverable": {"type": "workflow", "name": "竞品 AI 能力监控", "rubric": ["证据分级", "取舍清楚", "代价可算"], "acceptance": "四轮追问下能给出证据级别、影响量化口径、跟价代价与时机判断，不出现「感觉」「应该」"}, "spar": {"role": "战略负责人", "persona": "只关心跟不跟、代价多少、什么时候动；对「感觉」「趋势」零容忍，会追问证据级别与量化口径", "mustAsk": ["B 家 8.5% 起是长期调价还是限时活动？你怎么确认的，证据是什么？", "这个价格差对我们新客转化影响多少？按什么口径算的，样本多大？", "如果跟价，收入少多少？如果不跟，放款少多少？两个数都给我", "为什么是现在动，而不是 Q1？披露这块能不能先补，用披露对冲价格？"]}, "exemplar": "四问的合格答法（对照自查）：\n1. 可信度 → 「B 家 8.5% 起是产品页常驻表述，连续三周未变，属定价调整；对比 10 月快照，不是限时活动页，页面无活动倒计时。」\n2. 影响面 → 「同客群对比：我们新客首借年化 9.6%，高 1.1 个百分点；按上月新客 1.2 万人测算，比价环节预计流失 3%–5%。」\n3. 代价 → 「跟到 8.5% 起，按新客月放款 8000 万测算，年化收入减少约 720 万；不跟则预计少放 2400 万。」\n4. 时机 → 「先补披露（两周可上线），价格等 Q1 预算窗口再定；理由是披露是我们的强项，价格战一旦开打很难收回。」\n反面：「B 家降价了，我们也得降」——降多少、为什么现在降、不降的损失是多少，一个都说不出。", "task": "把《竞品 AI 能力监控》拿到「战略负责人」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《竞品 AI 能力监控》。现在要让它通过「战略负责人」这一关。\n【对手的立场】只关心跟不跟、代价多少、什么时候动；对「感觉」「趋势」零容忍，会追问证据级别与量化口径。\n【他一定会追问】「B 家 8.5% 起是长期调价还是限时活动？你怎么确认的，证据是什么？」 / 「这个价格差对我们新客转化影响多少？按什么口径算的，样本多大？」 / 「如果跟价，收入少多少？如果不跟，放款少多少？两个数都给我」\n【场景】你说「战略负责人复盘」，对方立刻回一句：B 家 8.5% 起是长期调价还是限时活动？你怎么确认的，证据是什么？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M2", "title": "M2 AI 辅助需求与用户研究", "dims": ["prompt", "tools", "data"], "units": [{"id": "M2U1", "tier": "basic", "step": "understand", "title": "访谈→洞察方法与 AI 角色", "video": {"dur": "4.5min", "script": ["访谈最大的浪费不是没人看，是看完只留下一句「用户觉得慢」，落不到任何改动", "三段编码法（原话摘录 / 归因 / 需求转化）+ AI 分工边界表", "某消金团队用 AI 把 12 段访谈整理从 3 天压到 5 小时，抽检发现 2 处错误归因"]}, "ppt": {"method": "三段编码法（原话摘录 / 归因 / 需求转化）+ AI 分工边界表", "case": "某消金团队用 AI 把 12 段访谈整理从 3 天压到 5 小时，抽检发现 2 处错误归因", "demo": "同一段访谈：AI 归纳 vs 人工编码的差异对照"}, "objective": "能用三段编码法把一段访谈整理成画像与需求点，并说清 AI 该做哪一步、不该做哪一步", "transfer": "从本周已有录音里挑 1 段，按三段法整理成画像与需求点，发给用研同事请他核对标签", "vslides": [{"t": "本节要讲什么", "n": "这一节讲访谈怎么变成可执行的需求。很多团队的访谈产出只是几页笔记，看完还是不知道该改哪里。这一节讲三件事：三段编码法怎么走、AI 在三段里各能帮到哪一步、以及为什么必须留原文摘录。看完你要能对一段录音当场说出三件可改的事。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"三段编码法\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三段编码法</tspan></text></g><g data-k=\"AI 各段能帮什么\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">AI 各段能帮什么</tspan></text></g><g data-k=\"为何留原文\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">为何留原文</tspan></text></g></svg>", "d": 29.5}, {"t": "访谈没用好，是因为缺一道转化", "n": "访谈这件事在金融产品里很常见，但多数访谈的产出只是「记了几页笔记」。问题不在记录，在转化：从原话到需求点中间缺一道稳定的工序。我把这道工序拆成三段。第一段原话摘录：只抄用户真说过的话，不加工，一句一行，标上编号与说话人。第二段归因：这句话背后的约束是什么——是流程太长、是他不知道有这个功能、还是他不敢借。第三段需求转化：把归因写成可改的东西，比如「申请页在第二步就要求填单位电话，导致流失」。三段的好处是每一层都能被核查：原话能回放，归因能被质疑，需求能落到页面上。跳过任何一段，得出的结论都会飘。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三段编码</tspan></text><g data-k=\"原话摘录\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">原话摘录</tspan></text></g><g data-k=\"归因\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">归因</tspan></text></g><g data-k=\"需求转化\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">需求转化</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 64.99}, {"t": "AI 在哪一段最强，哪一段最弱", "n": "三段里，AI 在第一段最强：把录音转写按主题切块、给每块打标签，几十分钟能处理完十几段。第二段中等：它能给出几种可能归因，但往往把「用户说慢」直接归到「页面加载慢」，而真实原因可能是「承诺时间太模糊，用户心里没底」。第三段最弱：需求转化涉及取舍，它只会给你一个四平八稳的清单，十条里八条是「优化体验」。所以正确的分工是：AI 做切块与初标，你做归因的排他性判断，需求转化由你定，AI 只负责把定稿写成规范句子。这里有一条边界要守住：AI 不能替你判断用户说的是否属实，也不能替用户代言需求——这两件事只有你能做，也必须由你负责。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">AI 做</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">你做</tspan></text><g data-k=\"切块、打标、成文\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">切块、打标、成文</tspan></text></g><g data-k=\"归因取舍、真实性判断\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">归因取舍、真实性判断</tspan></text></g></svg>", "d": 61.73}, {"t": "为什么必须留原文摘录", "n": "很多人嫌原文摘录麻烦，直接要 AI 给结论。这样做的后果在评审会上会暴露：有人问「这条需求依据是什么」，你只能回答「访谈里感觉到的」。留下原文摘录的作用有三个。第一，可核查：任何人可以回看原话，判断你的归纳有没有过度。第二，可复用：半年后同样的需求再来一轮，你能找到当初的原话对照，发现是需求变了还是你没做到。第三，可防编造：AI 最容易把「一个人说过」写成「普遍反映」，有原文在，这种加码一眼就能看出来。我见过最实用的一份访谈产出，只有两页：一页画像，一页需求池，每条需求后面挂着三句原话。这两页比二十页纪要更能推动改动。补一句操作建议：整理完先自己过一遍，把所有「用户觉得」「体验不好」这类词圈出来，一个一个换成原话或删掉。圈出来还改不掉的，说明那段访谈其实没问出来，该补访。这一步很土，但它能把一份「看起来很丰富」的纪要变成三件能立项的事。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"一条需求挂 2–3 句原话\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">一条需求挂 2–3 句原话</tspan></text></g><g data-k=\"归因写约束不写情绪\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">归因写约束不写情绪</tspan></text></g><g data-k=\"结论区分「说的」与「推断的」\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">结论区分「说的」与「推断的」</tspan></text></g></svg>", "d": 75.6}, {"t": "小结与接下来", "n": "小结三句。第一，访谈要过三段：原话摘录、归因、需求转化，跳一段结论就飘。第二，AI 强在切块打标，弱在归因排他性与需求取舍，那两步必须你来。第三，原文摘录是防编造的护栏，一条需求挂两三句原话，评审会上才站得住。接下来做任务：从本周录音里挑一段，按三段法整理成画像与需求点，发用研同事核对标签。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"三段编码\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三段编码</tspan></text></g><g data-k=\"AI 强在哪弱在哪\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">AI 强在哪弱在哪</tspan></text></g><g data-k=\"留原文\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">留原文</tspan></text></g><g data-k=\"任务：一段录音\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：一段录音</tspan></text></g></svg>", "d": 37.46}], "deliverable": {"type": "skill", "name": "访谈洞察提取", "rubric": ["标签准确", "依据可追", "边界清楚"], "acceptance": "对一段访谈能产出画像要素、需求点与原文依据三样，且每个需求点能指回具体原话"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】三段编码法（原话摘录 / 归因 / 需求转化）+ AI 分工边界表\n【为什么重要】访谈最大的浪费不是没人看，是看完只留下一句「用户觉得慢」，落不到任何改动\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["每个需求点后面都带一句原文摘录（可核对），不只写归纳结论", "能区分「用户说的」与「我推断的」，推断处标注依据强弱或写「需验证」", "能指出 AI 在访谈整理里不该做的两件事（如判断真实性、替代用户代言需求）", "画像至少含四个维度：客群特征、使用场景、当前做法、卡点情绪"]}, {"id": "M2U2", "tier": "basic", "step": "demo", "title": "1 段访谈 → 画像 + 需求点", "video": {"dur": "4.4min", "script": ["AI 会把一个人的说法写成「普遍反映」，这类加码在评审会上是致命的", "转写 + 三段编码提示词，一次跑出可用画像", "「闪电贷」一位被拒客户的 18 分钟回访录音（已脱敏）"]}, "ppt": {"method": "转写 + 三段编码提示词，一次跑出可用画像", "case": "「闪电贷」一位被拒客户的 18 分钟回访录音（已脱敏）", "demo": "WorkBuddy 内跑一遍：贴转写 → 画像与需求池 → 人工改三处"}, "objective": "能把一段访谈音频跑成画像 + 需求点，并指出 AI 稿里三处过度归纳", "transfer": "用这套提示词跑一段自己的访谈录音，把三处过度归纳改掉后发用研复核", "vslides": [{"t": "本节要讲什么", "n": "这一节跑一段真实访谈：18 分钟回访录音，脱敏后交给 AI，出画像与需求点，再人工改三处。这一节讲三件事：为什么先切块再要结论、归因为什么必须写两个、以及单一样本怎么表述才不越界。看完你会看到一份能进评审的访谈产出长什么样。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"先切块再要结论\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">先切块再要结论</tspan></text></g><g data-k=\"归因写两个\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">归因写两个</tspan></text></g><g data-k=\"单样本怎么表述\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">单样本怎么表述</tspan></text></g></svg>", "d": 29.21}, {"t": "先转写，再分层：别一上来要结论", "n": "这段材料是 18 分钟的回访录音，已经脱敏：没有姓名、手机号、证件号、订单号，只留诉求与场景。第一步不是让 AI 出结论，而是先转写、再按主题切块。切块的标准是「一件事一块」，比如额度落差是一块，拒绝原因是一块，复申路径是一块。切完你会发现，客户真正反复说的是三件事，而不是他第一句抱怨的那件。这个差别很重要：第一句抱怨往往是最表层的不满，反复出现的那几句才是真约束。切块这一步 AI 做得又快又稳，因为它只需要按语义分组，不需要判断重要性。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四步流程</tspan></text><g data-k=\"转写\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">转写</tspan></text></g><g data-k=\"按一件事一块切\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">按一件事一块切</tspan></text></g><g data-k=\"标编号\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">标编号</tspan></text></g><g data-k=\"再进归因\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">再进归因</tspan></text></g></svg>", "d": 51.26}, {"t": "归因要写两个：主因与替代解释", "n": "归因是整段流程里最容易出错的地方。AI 看到「页面只写综合评分不足，我不服」，会直接归到「拒绝原因不清晰」；但还有另一种可能——客户真正想要的不是更详细的理由，而是「我还能做什么」。这两个归因对应两种完全不同的改动：前者改文案，后者加行动指引。所以我在提示词里要求每个归因必须给至少一个替代解释。这样做的好处不是让你犹豫，是让你在评审时能说出「我考虑过另一种解释，为什么排除了它」。能给替代解释的人，结论才可信；只给单一归因的人，一问就露。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">归因 A</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">归因 B</tspan></text><g data-k=\"主因：拒绝原因太粗\"><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">主因：拒绝原因太粗</tspan></text></g><g data-k=\"替代：客户要的是下一步动作\"><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">替代：客户要的是下一步</tspan><tspan x=\"295.0\" dy=\"15.600000000000001\">动作</tspan></text></g></svg>", "d": 53.18}, {"t": "人改三处，最后写清不能回答什么", "n": "这份输出我改了三处。第一处，把「客户普遍对额度不满」改成「该客户存在预期落差」——一个样本说成普遍，是最容易被戳穿的加码。第二处，补了替代解释，让后续改动的方向有得选。第三处，把需求点从「优化体验」拆成四条能建单的动作，每条挂上原话编号。最后加了一节「这段访谈不能回答的三个问题」：普遍程度、原因分布、改动效果。这一节看起来是自曝其短，其实是最专业的部分——它提前回答了评审最可能追问的三件事。访谈产出的价值，从来不在于结论多漂亮，而在于每个结论都知道自己的边界。最后说一个数字：18 分钟录音转写大约 4,000 字，切块后能落到 6 到 8 个主题，产出 3 到 5 条需求。如果你整理出来有十几条需求，基本可以断定是没做归因合并——需求条数不是越多越好，能被排期的才有价值。还有一个反直觉的经验：访谈里最容易被忽略的是客户随口说的「我后来就放弃了」，这半句往往指向最大的流失点，比任何评价都值钱。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"单样本不外推\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">单样本不外推</tspan></text></g><g data-k=\"归因给两个\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">归因给两个</tspan></text></g><g data-k=\"需求点可建单\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">需求点可建单</tspan></text></g><g data-k=\"写清回答不了的\"><g><circle cx=\"30\" cy=\"154\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">写清回答不了的</tspan></text></g></svg>", "d": 86.52}, {"t": "小结与接下来", "n": "小结三句。第一，一上来要结论，拿到的都是概括词；先按一件事一块切，才能看出反复出现的那几句。第二，归因要给主因加替代解释，两个方向对应两种改法，评审时你才解释得清为什么选了这条。第三，单一样本只能写「该用户」，并且要主动写出这段材料回答不了的问题。接下来做任务：用这条提示词跑一段自己的录音，改掉三处过度归纳后发用研复核。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"先切块\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">先切块</tspan></text></g><g data-k=\"归因两个\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">归因两个</tspan></text></g><g data-k=\"不越界表述\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">不越界表述</tspan></text></g><g data-k=\"任务：跑一段录音\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：跑一段录音</tspan></text></g></svg>", "d": 45.46}], "deliverable": {"type": "skill", "name": "访谈洞察提取", "rubric": ["原话可追", "归因准确", "不加码"], "acceptance": "能产出《访谈洞察提取》并通过本单元评分要点"}, "demo": {"ref": "■ 一、原话摘录\n Q1「我月薪两万，也没逾期过，为什么只批三万？」\n Q2「页面就写综合评分不足，我不服。」\n Q3「我试算的时候显示八万，点进去批四万，这不骗人吗？」\n Q4「被拒以后能不能再申请、隔多久，页面啥都没说，我得打电话问。」\n\n■ 二、归因（含替代解释）\n Q1 → 主因猜测：额度预期与实际审批差异大；替代解释：客户对「批核额度」与「试算额度」的区别不了解，属认知问题而非额度问题。\n Q2 → 主因猜测：拒绝原因表述过粗，无法指导下一步；替代解释：客户需要的是「还能做什么」，而非更详细的拒绝理由。\n Q3 → 主因猜测：试算与实批口径不一致，构成预期落差；替代解释：试算页可能已标注「以审批为准」，但提示不醒目。\n Q4 → 主因猜测：复申路径缺失；替代解释：客户其实知道要等，只是不知道等多久。\n\n■ 三、需求点（可改动作）\n 1. 申请页在额度试算结果旁加一行「试算基于XX，最终以审批为准，差异常见原因有三」——挂 Q3\n 2. 拒绝页把「综合评分不足」拆成 4 类可解释原因，每类给一句改善路径——挂 Q2\n 3. 拒绝页增加「最早可复申时间」与「需补材料清单」——挂 Q4\n 4. 审批结果页说明批核额度与试算额度的关系——挂 Q1、Q3\n\n■ 四、这段访谈不能回答的三个问题\n 1. 该问题在客群中的普遍程度 —— 单一样本，需结合工单分类与申请漏斗数据。\n 2. 四类拒绝原因的覆盖面 —— 需拉取本月拒绝原因分布。\n 3. 改动后能否提升复申率 —— 需 A/B 或前后对比。\n\n⚠ 本文仅基于 1 位客户的口述，所有结论按「该用户」表述，不外推至客群。", "fix": ["把 AI 写的「客户普遍对额度不满」改成「该客户对额度存在预期落差」——单一样本说成普遍，是访谈整理里最常见也最容易被戳穿的加码。", "在归因处补了「替代解释」：客户可能只是不知道试算与实批的区别，这一点决定后面是改提示还是改额度逻辑，方向完全不同。", "把需求点从「优化额度体验」改成四条可建单的动作，每条挂原话编号，研发能直接排期。", "保留了「这段访谈不能回答的三个问题」——评审最容易问「这个结论有多少人支持」，先自己写出来，比被问住强。"], "judge": "判断依据：有没有把单一样本外推到客群；归因是否给了替代解释；需求点能否直接建单并挂上原话编号；有没有写出这段材料回答不了的问题", "sheet": {"situ": "你是「闪电贷」的产品经理，拿到一段 18 分钟客户回访录音的转写（已删姓名、手机号、证件号、订单号）。你要按三段编码法把 6 句原话整理成归因与需求点，判断哪些是「客户说的」、哪些是「你推断的」。", "ask": "① 给每句归到主题块；② 写出这句话背后的约束类型；③ 标明它是原话还是推断（推断要写需验证）；④ 写出一条可建单的需求动作。", "gen": "请基于以上编码，输出三件事：① 把 6 条归并成不超过 4 条需求，每条挂原话编号；② 指出哪一条是推断、需怎么验证；③ 这份材料回答不了哪三个问题。禁止使用「普遍」「大多数」这类词。", "mats": [{"id": "T01", "src": "转写 · 00:02", "text": "我月薪两万，也没逾期过，为什么只批三万？"}, {"id": "T02", "src": "转写 · 00:05", "text": "页面就写综合评分不足，我不服，也看不懂。"}, {"id": "T03", "src": "转写 · 00:08", "text": "我试算的时候显示八万，点进去批四万，这不骗人吗？"}, {"id": "T04", "src": "转写 · 00:11", "text": "被拒以后能不能再申请、隔多久，页面啥都没说，我得打电话问。"}, {"id": "T05", "src": "转写 · 00:14", "text": "我最担心的是别把我这个查询记录留档，以后买房贷款受影响。"}, {"id": "T06", "src": "转写 · 00:16", "text": "客服第一次说三个月，第二次说半年，我也不知道听谁的。"}], "cols": [{"k": "topic", "name": "主题块", "hint": "这句在说哪件事", "type": "chips", "w": 3, "tags": ["额度落差", "拒绝原因", "试算口径", "复申路径", "征信顾虑", "客服口径"]}, {"k": "cause", "name": "约束类型", "hint": "这句话背后卡在哪", "type": "chips", "w": 2, "tags": ["流程", "认知", "心理", "成本"]}, {"k": "kind", "name": "原话还是推断", "hint": "客户说出来的，还是你推出来的", "type": "chips", "w": 2, "tags": ["原话", "推断", "需验证"]}, {"k": "act", "name": "需求动作（一句）", "hint": "改哪个页面、补哪句说明", "type": "text", "w": 3, "tags": []}], "key": {"T01": {"topic": "额度落差", "cause": "认知", "kind": "原话", "fix": ""}, "T02": {"topic": "拒绝原因", "cause": "流程", "kind": "原话", "fix": ""}, "T03": {"topic": "试算口径", "cause": "认知", "kind": "原话", "fix": ""}, "T04": {"topic": "复申路径", "cause": "流程", "kind": "原话", "fix": ""}, "T05": {"topic": "征信顾虑", "cause": "心理", "kind": "推断", "fix": ""}, "T06": {"topic": "客服口径", "cause": "流程", "kind": "原话", "fix": ""}}, "notes": {"T05·kind": "客户没直说「我怕影响房贷」，只说「担心查询记录留档」——「怕影响房贷」是推断，必须标推断并写需验证", "T01·cause": "不是流程问题也不是成本问题，是客户不理解批核额度与试算额度的区别 → 认知。归成「额度太低」会导向调额，方向就错了", "T03·cause": "同 T01：核心是口径认知差，不是系统算错。判成流程问题会去查代码，白费两周", "T06·cause": "两次说法不一致属流程与口径管理问题（知识库未统一），不是客服态度", "T02·cause": "拒绝原因表述过粗，属流程与文案，可直接改", "T04·cause": "页面缺信息 → 流程；同时带一点心理（不想打电话），但主约束是流程"}, "delta": [{"op": "改", "frm": "把 T05 的「怕影响房贷」写成客户原话", "to": "标为推断，并写「需验证：是否所有客群都有此顾虑」", "why": "把推断当原话，是访谈整理最典型的一类失真；评审只要回放录音就能戳破", "kw": ["推断", "需验证", "原话", "录音"]}, {"op": "改", "frm": "把 T01、T03 都归为「额度太低」", "to": "归为「试算与批核口径的认知差」，动作改成加口径说明而不是调额", "why": "归因错了，改动方向就全错：调额涉及风控，成本极高且未必解决问题", "kw": ["口径", "认知", "调额", "说明"]}, {"op": "删", "frm": "在结论里补一句「客户普遍对额度不满」", "to": "改为「该客户对额度存在预期落差（单一样本）」", "why": "一个样本说成普遍，是加码；这类表述在评审会上会被当场要求出示样本量", "kw": ["普遍", "大多数", "单一样本", "样本量"]}], "refsheet": "T01｜额度落差｜认知｜原话｜申请页试算结果旁加口径说明\\nT02｜拒绝原因｜流程｜原话｜拒绝页拆四类原因并给改善路径\\nT03｜试算口径｜认知｜原话｜结果页说明批核与试算的关系\\nT04｜复申路径｜流程｜原话｜拒绝页加最早复申时间与补件清单\\nT05｜征信顾虑｜心理｜推断｜需验证：是否普遍，补访 3 位\\nT06｜客服口径｜流程｜原话｜统一知识库话术，明确复申间隔\\n", "forbid": "1[3-9]\\d{9}|\\d{6}(19|20)\\d{2}[01]\\d[0-3]\\d{4}[0-9Xx]", "nfrac": ""}}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是一段客户回访录音的转写（已删除姓名、手机号、证件号与订单号，仅保留诉求与场景）：\n[粘贴转写全文]\n请按三段输出：\n① 原话摘录：按主题分块，每块 2–3 句原文照抄，标编号；\n② 归因：每块写出这句话背后的约束（流程 / 认知 / 心理 / 成本），并给出至少一个替代解释；\n③ 需求点：写成可改的动作（改哪个页面、补哪句说明），每条挂对应原话编号。\n规则：\n不得使用「普遍」「大多数」「用户都」这类词；单一样本只能写「该用户」；\n无法从转写判断的，写「需验证」并说明怎么验证；\n最后单列「这段访谈不能回答的三个问题」。"}, "task": "按框架把 6 份素材整理成结构化字段 → 交给模型跑一遍 → 自己改出终稿。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】转写 + 三段编码提示词，一次跑出可用画像\n【参考案例】「闪电贷」一位被拒客户的 18 分钟回访录音（已脱敏）\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是一段客户回访录音的转写（已删除姓名、手机号、证件号与订单号，仅保留诉求与场景）：\n[粘贴转写全文]\n请按三段输出：\n① 原话摘录：按主题分块，每块 2–3 句原文照抄，标编号；\n② 归因：每块写出这句话背后的约束（流程 / 认知 / 心理 / 成本），并给出至少一个替代解释；\n③ 需求点：写成可改的动作（改哪个页面、补哪句说明），每条挂对应原话编号。\n规则：\n不得使用「普遍」「大多数」「用户都」这类词；单一样本只能写「该用户」；\n无法从转写判断的，写「需验证」并说明怎么验证；\n最后单列「这段访谈不能回答的三个问题」。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M2U3", "tier": "basic", "step": "todo", "title": "3 段访谈 → 画像 + 需求池", "video": {"dur": "4.6min", "script": ["单段访谈出观点，多段访谈才能出优先级——差别在于「几个人说过」", "三段访谈交叉编码 + 需求池（原话 / 归因 / 动作 / 优先级依据）", "某团队用三段访谈发现「等待焦虑」比「利率高」更影响复申"]}, "ppt": {"method": "三段访谈交叉编码 + 需求池（原话 / 归因 / 动作 / 优先级依据）", "case": "某团队用三段访谈发现「等待焦虑」比「利率高」更影响复申", "demo": "需求池填写指引：先编码，再合并同类，最后排序"}, "objective": "能把三段访谈整理成一份画像与需求池，每条需求带原话依据与优先级依据", "transfer": "本周约 2 位客户各聊 20 分钟，凑够三段后按此法整理，发用研与产品各一份", "vslides": [{"t": "本节要讲什么", "n": "这一节把一段变成三段：三段访谈、一页画像、一页需求池。差别在于，一段只出观点，三段才能出优先级，凭据是「几个人说过」。这一节讲三件事：怎么交叉编码、需求池的四列怎么写、以及单一样本为什么必须自己标出来。看完你就能出这一页纸。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"交叉编码\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">交叉编码</tspan></text></g><g data-k=\"需求池四列\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">需求池四列</tspan></text></g><g data-k=\"单一样本要标\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">单一样本要标</tspan></text></g></svg>", "d": 29.18}, {"t": "三段访谈的价值在「几个人说过」", "n": "一段访谈只能给你观点，三段才能给你优先级。原因很直接：一个人说的话可能是个人偏好，三个人说同一件事，那才是结构性约束。所以整理方法要变：第一段照常编码，第二段开始做交叉——同样的意思用不同说法出现时，合并成一条需求并记下人数。人数不是精确统计，但它是你现在唯一能拿到的排序依据。三段样本还有个好处：能看出「说法差异」。比如三个人都说慢，但一个说审核慢、一个说到账慢、一个说客服回复慢，这三件事对应三个完全不同的改动。合并同类的前提是分得清差异，分不清就合并，等于白做。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">样本与结论</tspan></text><g data-k=\"1 段：出观点\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">1 段：出观点</tspan></text></g><g data-k=\"2 段：看差异\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">2 段：看差异</tspan></text></g><g data-k=\"3 段：出优先级\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">3 段：出优先级</tspan></text></g><g data-k=\"人数=排序依据\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">人数=排序依据</tspan></text></g></svg>", "d": 56.57}, {"t": "需求池的四列，和一条筐禁令", "n": "需求池只保留四列：需求一句话、提及人数与原话编号、可改动作、优先级依据。这四列缺一列，需求池就会变成意见箱。特别说第三列：可改动作必须写到页面或话术层面，比如「拒绝页新增最早复申时间模块」。禁止写「优化体验」「提升透明度」这类筐——筐装得下一切，也就什么都不能推动。第四列优先级依据，要求写三者中至少两项：提及人数、影响环节、改动成本。为什么不用打分模型？因为三段样本撑不起精细打分，硬打分反而给人假精确的印象。用「三人全提 + 成本低」这种朴素依据，评审更容易接受，也更难被质疑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四列</tspan></text><g data-k=\"需求一句话\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">需求一句话</tspan></text></g><g data-k=\"人数 + 原话编号\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">人数 + 原话编号</tspan></text></g><g data-k=\"可改动作\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">可改动作</tspan></text></g><g data-k=\"优先级依据\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">优先级依据</tspan></text></g></svg>", "d": 61.7}, {"t": "单一样本要自己标出来", "n": "需求池最容易出事的地方，是把一个人说的当成共识。所以模板里强制有一节：单一样本与待验证。只有一人提到的需求，必须写明「单一样本」，并给补访或拉数据的方案。这一节的作用在两个场合体现：评审会上，有人问「这条多少人提过」，你直接指到那一行；一个月后要做取舍，你能分清哪条是真需求、哪条是个人偏好。三段访谈的产出，最好的一页纸是这样的：六条需求，三条三人全提、两条两人提到、一条单一样本，每条都挂着原话编号。这一页拿出去，没人会问「依据呢」，因为依据就在旁边。还有一个细节容易被忽略：访谈记录要标访谈时间与访谈人。三个月后回头核对，你会需要知道这句话是谁在什么背景下说的，缺了这个信息，原话的价值会掉一半。另外建议原话按编号存在同一张表里，需求池只引编号不复制正文，改起来才不会两处不同步。顺带说一句：别在记录里写「客户情绪激动」这类评价，写他具体说了什么、停顿了多久。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g data-k=\"一人提到要标单一样本\"><g><circle cx=\"30\" cy=\"52\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">一人提到要标单一样本</tspan></text></g><g data-k=\"给补访或拉数据方案\"><g><circle cx=\"30\" cy=\"86\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">给补访或拉数据方案</tspan></text></g><g data-k=\"原话编号挂在每条后面\"><g><circle cx=\"30\" cy=\"120\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">原话编号挂在每条后面</tspan></text></g></svg>", "d": 85.97}, {"t": "小结与接下来", "n": "小结三句。第一，三段访谈要做的第一件事是合并同类，同时分清说法差异，差异往往指向不同改动。第二，需求池四列缺一不可：需求、人数与原话编号、可改动作、优先级依据。第三，禁止写「优化体验」这类筐，筐装得下一切也就推不动任何事。接下来做任务：本周约两位客户各聊 20 分钟，凑够三段，按此法整理后发用研与产品各一份。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"三段出优先级\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三段出优先级</tspan></text></g><g data-k=\"四列缺一不可\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">四列缺一不可</tspan></text></g><g data-k=\"禁写筐词\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">禁写筐词</tspan></text></g><g data-k=\"任务：三段访谈\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">任务：三段访谈</tspan></text></g></svg>", "d": 43.13}], "deliverable": {"type": "skill", "name": "访谈洞察提取", "rubric": ["合并得当", "依据可追", "优先级有据"], "acceptance": "一页画像 + 一页需求池：画像含四维、需求池 ≥6 条且每条带原话编号与提及人数"}, "practice": {"steps": ["逐段编码：每段摘 6–8 句原话，标编号（如 A-03 表示 A 客户第 3 句）", "合并同类：把不同客户说的同一件事合并成一条需求，记录提到的人数与原话编号", "写动作与依据：每条需求写可改动作、影响人群、以及为什么排这个优先级", "标不确定项：哪些需求只有一人提到、哪些需要数据验证，单独列出"], "exemplar": "【《访谈画像与需求池》】样本：A/B/C 三位被拒客户　时间：2026-11-14～11-16\n\n■ 一、画像\n　· 客群特征：28–35 岁，月收入 1.5–2.5 万，多为首次使用消费贷，无逾期记录｜原话 A-01「我月薪两万，也没逾期过」\n　· 使用场景：多为临时周转（装修、家电、医疗），手机端操作，晚上 9 点后申请居多｜原话 C-02「白天上班没法弄，晚上躺床上弄的」\n　· 当前做法：被拒后先问客服，问不到就放弃，少数会去社区搜经验｜原话 B-04「我打了两次客服，说法还不一样」\n　· 卡点情绪：不是愤怒，是「不服气 + 不知道该做什么」｜原话 A-02「页面就写综合评分不足，我不服」\n\n■ 二、需求池\n　1. 拒绝原因拆成 4 类可解释表述 + 每类一句改善路径｜提及 3 人｜原话 A-02, B-01, C-03｜动作：拒绝页文案与结构改造\n　　优先级依据：三人全提 + 直接影响复申意愿 + 改动成本低（纯文案与前端）\n　2. 拒绝页给「最早可复申时间」与需补材料清单｜提及 3 人｜原话 A-04, B-05, C-04｜动作：拒绝页新增模块\n　　优先级依据：三人全提 + 客服工单占比高 + 改动成本低\n　3. 审批结果页说明批核额度与试算额度的关系｜提及 2 人｜原话 A-03, C-01｜动作：结果页加一段说明\n　　优先级依据：两人提到 + 涉及信任感 + 需产品与风控对齐口径\n　4. 客服话术统一：拒绝原因口径一致｜提及 2 人｜原话 B-04, C-05｜动作：知识库与话术模板改版\n　　优先级依据：两人提到 + 影响投诉率 + 成本在客服侧\n　5. 申请中期不要求填单位电话｜提及 1 人（单一样本）｜原话 C-06｜动作：字段后移或改为选填\n　　优先级依据：单一样本，需结合漏斗数据再定\n　6. 提供「申请前自查」小工具｜提及 1 人（单一样本）｜原话 B-06｜动作：新功能，成本较高\n　　优先级依据：单一样本 + 开发成本高，暂缓\n\n■ 三、单一样本与待验证\n　· 只有 1 人提到：需求 5、需求 6｜需验证：再访 3 位或看第二步流失率\n　· 需数据验证：「原因不清导致不复申」｜验证口径：拒绝页停留时长 + 复申率对比\n\n■ 四、一句话结论\n　三位客户指向同一个约束：不是额度或利率，而是被拒之后「不知道为什么、也不知道下一步做什么」。"}, "task": "产出《访谈洞察提取》：逐段编码：每段摘 6–8 句原话，标编号（如 A-03 表示 A 客户第 3 句）；合并同类：把不同客户说的同一件事合并成一条需求，记录提到的人数与原话编号；写动作与依据：每条需求写可改动作、影响人群、以及为什么排这个优先级；标不确定项：哪些需求只有一人提到、哪些需要数据验证，单独列出", "brief": "【你的角色】你是「模拟银行 X」负责「闪电贷」的消费金融 AI 产品经理。本单元属于「M2 AI 辅助需求与用户研究」模块，你要交付的是《访谈洞察提取》。\n【场景】业务侧这周的诉求是：单段访谈出观点，多段访谈才能出优先级——差别在于「几个人说过」。参考做法：某团队用三段访谈发现「等待焦虑」比「利率高」更影响复申。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（三段访谈交叉编码 + 需求池（原话 / 归因 / 动作 / 优先级依据）），以及上面场景中描述的业务信息。\n【硬约束】数据不出域（身份证号、卡号、手机号、交易流水不进外部模型）· 不替人决策（授信、定价、拒贷结论不由产品拍板）· 可解释可追溯（每个结论能指回依据与口径）。", "template": "【《访谈画像与需求池》填写模板】样本：{{A/B/C 三位客户}}　时间：{{}}　访谈人：{{}}\n\n■ 一、画像（四个维度，每维一句原话支撑）\n　· 客群特征：{{年龄/收入/职业/借贷经历}}　原话：{{编号 + 摘录}}\n　· 使用场景：{{什么时候用、和谁一起、用什么设备}}\n　· 当前做法：{{现在怎么解决（找客服/问朋友/放弃）}}\n　· 卡点情绪：{{最强烈的情绪是什么，由哪句原话体现}}\n\n■ 二、需求池（≥6 条，按优先级排）\n　1. {{需求一句话}}｜提及：{{N 人}}｜原话：{{A-03, B-05}}｜动作：{{改哪个页面/补哪句}}\n　　优先级依据：{{提及人数 / 影响环节 / 改动成本}}\n　2. {{}}\n　3. {{}}\n　4. {{}}\n　5. {{}}\n　6. {{}}\n\n■ 三、单一样本与待验证（必写）\n　· 只有 1 人提到：{{需求}}｜需验证方式：{{补访 / 拉数据}}\n　· 需数据验证：{{假设}}｜验证口径：{{}}\n\n■ 四、一句话结论\n　{{三段访谈指向的同一个约束是什么}}", "rubric": ["画像四个维度齐全：客群特征、使用场景、当前做法、卡点情绪，每维至少一句原话支撑", "需求池 ≥6 条，每条标提及人数与至少一个原话编号，单人提到的必须标注「单一样本」", "每条需求有可改动作（改哪个页面/补哪句说明），不写「优化体验」这类筐", "优先级排序给出依据（提及人数、影响环节、改动成本三者至少两项）"]}, {"id": "M2U4", "tier": "basic", "step": "spar", "title": "用户深挖需求", "video": {"dur": "4.4min", "script": ["客户给的第一版答案几乎都是社交化的礼貌版本，真实约束藏在具体动作里", "角色陪练：扮演被拒客户，按「做法 / 上一次 / 如果改了」三层追问", "某 PM 访谈中连问三次「为什么」，客户最终说出真实原因是怕影响征信"]}, "ppt": {"method": "角色陪练：扮演被拒客户，按「做法 / 上一次 / 如果改了」三层追问", "case": "某 PM 访谈中连问三次「为什么」，客户最终说出真实原因是怕影响征信", "demo": "陪练演示：把「太慢了」追到具体环节与具体时刻"}, "objective": "能在客户四轮追问下问出真实约束，不被表面答案带走，也不替客户代言需求", "transfer": "下次访谈前把「追问三步」写在便签上：问做法、问上一次、问如果改了会怎样", "vslides": [{"t": "本节要讲什么", "n": "这一节是访谈陪练。对面是被拒客户，他客气、配合，但第一版答案一定是社交化的。这一节讲三件事：怎么把「说不上来」拆成动作与时刻、三类反问怎么答、以及问出真实约束后别做错的两件事。练完你手上应该有三样：一个时刻、一个动作、一个可验证的假设。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三件事</tspan></text><g data-k=\"拆成动作与时刻\"><rect x=\"18.0\" y=\"44.0\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"68.8\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">拆成动作与时刻</tspan></text></g><g data-k=\"三类反问\"><rect x=\"18.0\" y=\"96.7\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"121.4\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">三类反问</tspan></text></g><g data-k=\"别急着承诺\"><rect x=\"18.0\" y=\"149.3\" width=\"364.0\" height=\"42.7\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"174.1\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">别急着承诺</tspan></text></g></svg>", "d": 29.45}, {"t": "第一版答案都是礼貌版本", "n": "这个单元是陪练，你对面坐着一位被拒客户。他很有礼貌，也很配合，但他给你的第一版答案几乎一定是社交化的：麻烦、不太满意、说不上来。这不是他藏着不说，而是大多数人没被问过具体问题，只能给概括印象。你的任务不是接受这个答案，而是把它拆成可核查的事实。拆法只有一条：问动作、问时刻、问替代方案。问动作——上次申请是什么时候、用什么设备、卡在哪一步；问时刻——等了多久、当时在做什么；问替代——如果这里改了，你下一步会做什么。三层问完，你拿到的不是评价，而是一段可以复现的经历。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">追问三层</tspan></text><g data-k=\"问动作\"><g><circle cx=\"42\" cy=\"52.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"56.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">问动作</tspan></text></g><g data-k=\"问时刻\"><g><circle cx=\"42\" cy=\"84.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"88.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"88.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">问时刻</tspan></text></g><g data-k=\"问替代方案\"><g><circle cx=\"42\" cy=\"116.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"120.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"120.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">问替代方案</tspan></text></g><g data-k=\"再问情绪\"><g><circle cx=\"42\" cy=\"148.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"152.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"152.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">再问情绪</tspan></text></g></svg>", "d": 57.24}, {"t": "三类必被追问，和合格答法", "n": "客户也会反问你，这三类最常见。第一类，「你们自己看看呗」——合格答法是给具体选项：「我列三个环节，您帮我挑最难受的一个：一是填资料太多，二是等待没反馈，三是被拒没解释」。第二类，「这算不算问题啊」——合格答法是承认主观性再落地：「对您可能不算，我想确认的是当时您有没有想过去别家试试」。第三类，「你们是不是故意的」——合格答法是先承认感受，再澄清机制，不辩解：「试算和审批用的是两套口径，这个落差确实容易让人误会，我记下来」。注意：任何时候都不要替客户总结需求，比如「所以您希望额度更高对吧」，这句话一出，后面所有回答都会顺着你的假设走。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三类反问</tspan></text><g data-k=\"给选项不让客户自己想\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">给选项不让客户自己想</tspan></text></g><g data-k=\"承认主观再落地\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">承认主观再落地</tspan></text></g><g data-k=\"澄清机制不辩解\"><rect x=\"18.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">澄清机制不辩解</tspan></text></g><g data-k=\"不替客户总结需求\"><rect x=\"209.0\" y=\"123.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">不替客户总结需求</tspan></text></g></svg>", "d": 63.41}, {"t": "问出真实约束后怎么办", "n": "当你问出真实约束，比如客户其实是怕影响征信、怕被同事知道，接下来两件事别做错。第一，别急着承诺改。你只能说「我记下来，回去评估」，因为你不知道改动成本，也不知道合规允不允许。第二，别把它当成一个人的特殊顾虑，先标「单一样本」，回头验证有没有第二个人这么说。正确的收尾是复述确认：把他说的话用自己的话复述一遍，「我理解是——您不是嫌额度低，是怕这次查询记录影响以后房贷，对吗」。他点头，你才算拿到一条可用的洞察。访谈结束时你手上应该有三样东西：一个具体时刻、一个具体动作、一个可验证的假设。这三样，比十句「用户觉得体验不好」有用得多。这也是判断一次访谈成不成功最直接的标准：有没有拿到具体时刻。拿到了，一个人也能撑起一条改动；拿不到，十个人也只是在附和你的假设。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">收尾三步</tspan></text><g data-k=\"复述确认\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">复述确认</tspan></text></g><g data-k=\"标单一样本\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">标单一样本</tspan></text></g><g data-k=\"给出可验证假设\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">给出可验证假设</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>", "d": 77.66}, {"t": "小结与接下来", "n": "小结三句。第一，问动作、问时刻、问替代方案，三层问完才有可复现的经历。第二，别替客户总结需求，一个「您是不是希望额度更高」就能把访谈带偏。第三，问出真实顾虑后先复述确认、标单一样本，不要当场承诺改动。接下来做任务：下次访谈前把追问三步写在便签上，访谈后对照自查有没有犯替客户总结的错。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">三句小结 · 接下来的任务</tspan></text><g data-k=\"三层追问\"><rect x=\"18.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"104.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"104.5\">三层追问</tspan></text></g><g data-k=\"别替客户总结\"><rect x=\"209.0\" y=\"44.0\" width=\"173.0\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"295.5\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.5\">别替客户总结</tspan></text></g><g data-k=\"
