<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新人小白 × 应届生 · AI 职场基础（M0–M7 · 64 单元）</title>
<style>
  :root{--blue:#1a5cff;--blue-d:#0e3aa8;--blue-bg:#eff4ff;--line:#e3e9f5;--card:#fff;--txt:#16213f;--mut:#6b7891;--bg:#f6f8fd;--green:#16a34a;--green-bg:#ecfdf5;--amber:#d97706;--red:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7}
  header{padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:700}
  header h1 span{font-size:12px;font-weight:500;color:var(--mut);margin-left:8px}
  .scn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .scn input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:112px}
  .scn button{padding:5px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px}
  .llm{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff;user-select:none}
  .llm:hover{border-color:var(--blue)}
  .llm i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
  .admin-toggle{margin-left:10px;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .admin-toggle:hover{background:#eef3ff}
  .admin-banner{background:linear-gradient(90deg,#eef3ff,#e7f0ff);color:var(--blue-d);font-size:13px;padding:10px 18px;border-bottom:1px solid #cfe0ff}
  .llm.on i{background:var(--green);box-shadow:0 0 0 3px #dcfce7}
  .llm.off i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
  .prog{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .prog b{color:var(--blue-d);font-size:14px}
  .layout{display:flex;height:calc(100vh - 62px)}
  .sidebar{width:288px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .mod{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .mod-h{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center;background:#fbfcff}
  .mod-h .mid{font-size:10.5px;background:var(--blue-bg);color:var(--blue-d);border-radius:5px;padding:1px 6px}
  .mod-h .mdone{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .mod-h .mquiz{font-size:11px;color:var(--amber);border:1px solid #ffd9a8;background:#fffbeb;border-radius:6px;padding:0 5px;cursor:pointer;white-space:nowrap}
  .mod-b{display:none;padding:2px 6px 6px}
  .mod.open .mod-b{display:block}
  .mod.weak{border-color:#fca5a5;box-shadow:0 0 0 1px #fecaca}
  .mod.weak>.mod-h{background:#fff5f5}
  .unit{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.8px;display:flex;align-items:center;gap:7px}
  .unit:hover{background:var(--blue-bg)}
  .unit.active{background:var(--blue);color:#fff}
  .unit.done:after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
  .unit.active.done:after{color:#d8ffe8}
  .unit .st{font-size:10px;padding:1px 6px;border-radius:5px;background:#f1f4fa;color:var(--mut)}
  .unit.active .st{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;overflow-y:auto;padding:20px 26px 70px;max-width:980px;margin:0 auto;width:100%}
  .crumb{font-size:12px;color:var(--mut)}
  .utitle{font-size:21px;font-weight:700;margin:2px 0 4px}
  .umeta{font-size:12.5px;color:var(--mut);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;background:var(--blue-bg);color:var(--blue-d);padding:2px 9px;border-radius:20px;font-size:12px}
  .chip.g{background:var(--green-bg);color:#166534}
  .chip.a{background:#fff6ec;color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:11px 0;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .card h3{font-size:14.5px;margin-bottom:8px;color:var(--blue-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3 .bd{font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:6px}
  ul.li{list-style:none}
  ul.li li{padding:4px 0 4px 18px;position:relative;font-size:13.4px}
  ul.li li:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .kv{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.2px;margin:6px 0}
  .kv b{color:var(--blue-d)}
  /* 视频播放器 */
  .vp{position:relative;background:#0c1430;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  .vp .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#eaf0ff}
  .slide.on{display:flex}
  .slide h4{font-size:16px;margin:0 0 6px;color:#fff;flex:none}
  .slide svg{width:100%;height:100%;max-width:100%;max-height:100%;min-height:0}
  @keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 11px #ffd84d)}}
  .pulse{animation:pulse .78s ease-in-out 3 both}
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.72) 55%,rgba(0,0,0,0) 100%);color:#fff;font-size:19px;font-weight:500;line-height:1.5;padding:20px 28px 16px;min-height:70px;display:block;text-align:center;letter-spacing:.4px;text-shadow:0 2px 6px rgba(0,0,0,.95)}
  .dots{position:absolute;top:11px;left:0;right:0;display:flex;gap:6px;justify-content:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
  .dots i.on{background:#fff}
  .vbar{display:flex;align-items:center;gap:12px;margin-top:9px}
  .play{background:var(--blue);color:#fff;border:none;padding:8px 17px;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600;white-space:nowrap}
  .seek{flex:1;height:8px;border-radius:6px;background:#e4eaf7;position:relative;cursor:pointer}
  .seek .fill{height:100%;background:var(--blue);border-radius:6px;width:0}
  .seek .knob{position:absolute;top:-4px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-left:-7px;left:0}
  .time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .aud-note{font-size:12px;color:var(--mut);margin-top:5px}
  textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;background:#fcfdff}
  input.tin{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fcfdff}
  .btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:13.2px;margin:6px 6px 0 0}
  .btn.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
  .btn.ok{background:var(--green)}
  .btn[disabled]{background:#c9d3e6;cursor:not-allowed;border-color:#c9d3e6;color:#fff}
  .wb{background:#0e1530;color:#dce6ff;border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;line-height:1.7}
  .wb .me{color:#ffd98a}.wb .ai{color:#9be8b0}.wb .hl-line{color:#fff;font-weight:600}
  .chat{display:flex;flex-direction:column;gap:9px;margin:6px 0}
  .bub{max-width:82%;padding:9px 12px;border-radius:11px;font-size:13.3px;white-space:pre-wrap}
  .bub.ai{background:#eef4ff;color:var(--blue-d);align-self:flex-start}
  .bub.me{background:var(--blue);color:#fff;align-self:flex-end}
  .bub.sys{background:#f1f4fa;color:var(--mut);align-self:center;font-size:12px;max-width:100%}
  .qs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .qbtn{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.4px;cursor:pointer}
  .qbtn:hover{border-color:var(--blue);color:var(--blue)}
  .done-card{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:18px;text-align:center}
  .done-card h3{font-size:19px;color:#166534;margin-bottom:4px}
  .cp-score{font-size:30px;font-weight:800;color:#16a34a;margin:6px 0}
  .tag-done{display:inline-block;background:var(--green);color:#fff;font-size:12px;padding:1px 9px;border-radius:20px;margin-left:6px}
  /* 题干 / 模板 / 评分 */
  .ip{border-left:4px solid var(--blue)}
  .ip-task{font-size:14.5px;font-weight:700;margin:2px 0 8px;color:var(--txt)}
  .brief{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.1px;white-space:pre-wrap;line-height:1.78;color:#28345a}
  .tpl{background:#0e1530;color:#d7e3ff;border-radius:11px;padding:13px 15px;font-size:12.6px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  details>summary{cursor:pointer;font-size:13.3px;color:var(--blue-d);font-weight:600;margin:10px 0 6px;list-style:none;display:flex;align-items:center;gap:6px}
  details>summary::-webkit-details-marker{display:none}
  details>summary:before{content:"\25B8";transition:transform .15s;display:inline-block}
  details[open]>summary:before{transform:rotate(90deg)}
  .rub{list-style:none;font-size:13px;color:var(--mut);margin:4px 0}
  .rub li{padding:2px 0 2px 20px;position:relative}
  .rub li:before{content:"\25CB";position:absolute;left:2px;color:#c3ccdf}
  .rub li.ok{color:#166534}
  .rub li.ok:before{content:"\25CF";color:var(--green)}
  .rub li span.hint{color:#b4682a;font-size:12px}
  .bar{height:9px;background:#e4eaf7;border-radius:6px;overflow:hidden;margin:7px 0 3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1a5cff,#4d8bff);transition:width .3s}
  /* 测验 */
  .qz-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:9px 0;background:#fff}
  .qz-item .q{font-size:13.8px;font-weight:600;margin-bottom:7px}
  .qz-item .op{padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13.2px;border:1px solid transparent}
  .qz-item .op:hover{background:#f5f8ff}
  .qz-item .op.right{background:var(--green-bg);color:#166534;border-color:#86efac}
  .qz-item .op.wrong{background:#fff1f2;color:#be123c;border-color:#fecdd3}
  .qz-item .tip{font-size:12.5px;color:var(--mut);display:none;margin-top:6px}
  .modal{position:fixed;inset:0;background:rgba(8,16,40,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:16px;padding:24px 26px;max-width:520px;width:100%;text-align:center;max-height:86vh;overflow-y:auto;position:relative}
  .modal .box h3{font-size:19px;margin-bottom:4px;color:var(--txt)}
  .modal .box p{font-size:13.4px;color:var(--mut);margin:6px 0 14px}
  .modal .box .acts{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .modal .box.wide{max-width:800px;text-align:left}
  .art-body{white-space:pre-wrap;font-size:12.4px;line-height:1.62;background:#f6f8fc;border:1px solid #e2e8f5;border-radius:10px;padding:14px 16px;max-height:58vh;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .deliv{border:1px solid #e2e8f5;border-left:4px solid #2f6bff;background:#fbfcff;border-radius:12px;padding:14px 16px;margin-top:12px}
  .deliv .dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .deliv .dname{font-weight:700;font-size:15px}
  .badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
  .badge.skill{background:#2f6bff}.badge.agent{background:#7c3aed}.badge.workflow{background:#0e9f6e}.badge.kb{background:#d97706}
  .deliv .dacc{font-size:12.8px;color:var(--mut);margin:6px 0 10px;line-height:1.55}
  .deliv .rub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .deliv .rub .chip2{font-size:11.5px;background:#eef2fb;color:#274690;padding:2px 9px;border-radius:999px}
  .score-ta{width:100%;min-height:160px;box-sizing:border-box;margin-top:10px;padding:12px 14px;border:1px solid #d7e0f2;border-radius:10px;font-size:13px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;background:#fff;color:#1a2233}
  .score-ta:focus{outline:none;border-color:#2f6bff;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
  .score-inp{width:110px;padding:8px 10px;border:1px solid #d7e0f2;border-radius:8px;font-size:14px}
  .cap-entry{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:5px 12px;border:1px solid #2f6bff;color:#2f6bff;background:#f3f7ff;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
  .cap-entry:hover{background:#e6efff}
  .deliv .dacts{display:flex;gap:8px;flex-wrap:wrap}
  .mclose{position:absolute;top:10px;right:14px;font-size:18px;color:var(--mut);cursor:pointer}
  .fm{text-align:left;font-size:13px}
  .fm label{display:block;font-size:12.6px;color:var(--mut);margin:10px 0 4px}
  .fm .note{font-size:12.2px;color:var(--mut);background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;line-height:1.7}
  .fm code{background:#eef2fb;border-radius:4px;padding:1px 5px;font-size:12px}
  /* ===== 学习指引 ===== */
  .guide{border:1px solid #cfe0ff;background:linear-gradient(135deg,#f3f8ff,#eef4ff);border-radius:13px;padding:13px 16px;margin:4px 0 12px;box-shadow:0 1px 3px rgba(20,40,90,.04)}
  .guide h3{font-size:14px;color:var(--blue-d);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .guide .g-ctx{font-size:12.4px;color:var(--mut);margin-bottom:8px}
  .g-steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .g-step{display:inline-flex;align-items:center;gap:5px;font-size:12.2px;padding:4px 10px;border-radius:999px;border:1px solid #d7e3ff;background:#fff;color:var(--mut)}
  .g-step.cur{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:700}
  .g-step.done{background:#eafaf0;border-color:#9fe0bd;color:#166534}
  .g-path{list-style:none;margin:8px 0 2px;padding:0}
  .g-path li{font-size:13px;line-height:1.85;color:#28345a;padding-left:22px;position:relative}
  .g-path li:before{content:"▢";position:absolute;left:4px;color:var(--blue)}
  .g-path li.lead:before{content:"▶";color:var(--blue-d);font-weight:700}
  .g-next{font-size:12.7px;color:var(--blue-d);background:#fff;border:1px dashed #b9d0ff;border-radius:9px;padding:9px 11px;margin-top:8px;line-height:1.7}
  .g-next b{color:var(--blue-d)}
  /* ===== 反馈气泡 + 弹窗（参考测评设计） ===== */
  #lf-fab{position:fixed;right:18px;bottom:18px;z-index:150;display:flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(26,92,255,.35)}
  #lf-fab:hover{background:var(--blue-d)}
  #lf-modal .box{max-width:560px;text-align:left}
  .lf-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .lf-head h3{font-size:17px;margin:0}
  .lf-close{margin-left:auto;font-size:22px;color:var(--mut);background:none;border:none;cursor:pointer;line-height:1}
  .lf-meta{font-size:12.3px;color:var(--mut);background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;line-height:1.6;margin-bottom:10px}
  .lf-label{font-size:12.8px;color:var(--blue-d);font-weight:600;margin:12px 0 6px}
  .lf-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .lf-type{padding:9px 4px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;text-align:center;transition:.15s}
  .lf-type .ti{font-size:18px;display:block;margin-bottom:3px}
  .lf-type.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
  .lf-cat-row,.lf-sev-row{display:flex;gap:7px;flex-wrap:wrap}
  .lf-cat,.lf-sev{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12.6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .lf-cat.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
  .lf-sev.on{background:var(--amber);color:#fff;border-color:var(--amber)}
  .lf-media-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .lf-media-row button{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12.8px;cursor:pointer}
  .lf-media-row button:hover{border-color:var(--blue);color:var(--blue-d)}
  .lf-preview{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .lf-thumb-wrap{position:relative;display:inline-block}
  .lf-preview img{max-width:130px;max-height:110px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
  .lf-preview .lf-file{font-size:12px;background:#f1f4fa;border-radius:8px;padding:4px 9px;color:var(--mut)}
  .lf-drop{border:1.5px dashed var(--line);border-radius:10px;padding:10px;text-align:center;font-size:12.3px;color:var(--mut);margin-top:8px}
  .lf-drop.over{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
  /* 图片放大灯箱 */
  .lb-mask{position:fixed;inset:0;background:rgba(8,12,24,.82);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:24px}
  .lb-mask img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .lb-close{position:absolute;top:16px;right:22px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer;line-height:1}
  /* 内嵌 AI 陪练抽屉 */
  .spar-modal .box{width:min(560px,94vw);height:min(76vh,720px);display:flex;flex-direction:column;padding:0;overflow:hidden}
  .spar-hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#f8faff}
  .spar-hd h3{font-size:15px;margin:0}
  .spar-hd .sub{font-size:11.8px;color:var(--mut);margin-top:2px}
  .spar-hd .x{margin-left:auto;font-size:22px;color:var(--mut);background:none;border:none;cursor:pointer;line-height:1}
  .spar-body{flex:1;overflow:auto;padding:12px 14px;background:#fff}
  .spar-msg{margin-bottom:10px;display:flex}
  .spar-msg.me{justify-content:flex-end}
  .spar-msg .b{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.4px;line-height:1.65;white-space:pre-wrap}
  .spar-msg.ai .b{background:#f1f4fa;color:#1a2233;border-top-left-radius:3px}
  .spar-msg.me .b{background:var(--blue);color:#fff;border-top-right-radius:3px}
  .spar-msg.sys .b{background:#fff8e6;color:#8a5a00;font-size:12.4px;border:1px solid #f0dca8;max-width:100%}
  .spar-typing{font-size:12.4px;color:var(--mut);padding:4px 2px}
  .spar-ft{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:#fbfcfe}
  .spar-ft textarea{flex:1;min-height:52px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.4px;font-family:inherit}
  .spar-ft button{padding:9px 14px;border-radius:9px;border:none;background:var(--blue);color:#fff;font-size:13.4px;cursor:pointer;white-space:nowrap}
  .spar-ft button:disabled{opacity:.55;cursor:default}
  .spar-status{font-size:11.8px;color:var(--mut);padding:0 12px 8px;background:#fbfcfe}
  .spar-status .on{color:#166534;font-weight:600}
  .spar-status .off{color:#be123c;font-weight:600}
  .lf-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lf-note{font-size:11.8px;color:var(--mut);margin-top:10px;line-height:1.6}
  .lf-report{white-space:pre-wrap;font-size:12.4px;background:#0e1530;color:#d7e3ff;border-radius:10px;padding:12px 14px;max-height:230px;overflow:auto;margin-top:10px;font-family:ui-monospace,Consolas,monospace;line-height:1.6}
  @media(max-width:560px){.lf-type-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:860px){.layout{flex-direction:column}.sidebar{width:100%;max-height:36vh;border-right:none;border-bottom:1px solid var(--line)}}
  /* ===== 多邻国式分步通关 ===== */
  .stepper{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .stepper .st{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-weight:600;white-space:nowrap}
  .stepper .st .si{font-size:15px}
  .stepper .st.cur{border-color:var(--blue);background:var(--blue);color:#fff}
  .stepper .st.done{background:#eafaf0;border-color:#9fe0bd;color:#166534}
  .stepper .st .ck{font-size:10px;opacity:.8}
  .stepper .sbar{flex:1;height:6px;background:#e4eaf7;border-radius:6px;overflow:hidden;min-width:44px}
  .stepper .sbar i{display:block;height:100%;background:var(--green);transition:width .3s}
  .cp{max-width:680px;margin:0 auto}
  .cp-head{margin:2px 0 10px}
  .cp-title{font-size:19px;font-weight:800}
  .cp-sub{font-size:12.6px;color:var(--mut);margin-top:2px;line-height:1.6}
  .cp-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .cp-notes{margin:10px 0}
  .cp.centered{text-align:center}
  .settle{background:linear-gradient(135deg,#ecfdf5,#f3fbf6);border:1.9px solid #86efac;border-radius:14px;padding:26px 20px}
  .settle .cp-score{font-size:34px;font-weight:800;color:#16a34a;margin:8px 0}
  .settle .cp-actions{justify-content:center}
  .xp-tag{display:inline-flex;align-items:center;gap:4px;background:#fff7e6;color:#b45309;border:1px solid #fde2a8;border-radius:999px;padding:2px 10px;font-weight:700}
</style>

<script>
/* ===================== 课程数据（构建时注入） ===================== */
const COURSE = {"id": "newbie_grad", "role": "graduate", "customization": {"industry": "通用职场", "company": "你所在的团队", "product": "日常工作"}, "modules": [{"id": "M0", "title": "M0 入职第一周：AI 能做什么、不能做什么", "units": [{"id": "M0U1", "tier": "basic", "step": "understand", "title": "AI 是什么：一句话讲清能做什么", "video": {"dur": "8min", "script": ["第一周最重要的事，是建立对 AI 能力的正确预期——既别神化，也别低估", "能力边界图（擅长：检索归纳 / 写草稿 / 整理 / 生成 / 改格式）", "新人把 AI 当搜索引擎或枪手，结果产出空泛或踩红线"]}, "ppt": {"method": "能力边界图（擅长：检索归纳 / 写草稿 / 整理 / 生成 / 改格式）", "case": "新人把 AI 当搜索引擎或枪手，结果产出空泛或踩红线", "demo": "边界对照卡（这件事交给 AI / 留给自己）"}, "vslides": [{"t": "开场：先别急着用，先搞清它是什么", "n": "先把一件事说清楚：AI 不是搜索引擎，也不是会替你干活的同事。它擅长的是模式类工作——读一段文字、归纳要点、写个初稿、整理成表格、把格式改统一。你给它一份材料，它能很快变成另一份更像样的材料。但它不会替你判断对错，也不会替你承担责任。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">AI 擅长的四类事</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">读材料</tspan></text></g><g><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">归纳要点</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">写初稿</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">整理格式</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "它不擅长什么", "n": "有三件事它做不了。第一，它不知道你公司的真实情况，问它内部数据只会得到编造的答案。第二，它不保证事实正确，会一本正经地给出错的日期和不存在的文件。第三，它不能替你做判断和承担责任，尤其是涉及人、钱、合规的决定。这三件事，本来就该由你来做。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不知道你公司的真实情况</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不保证事实正确（会幻觉）</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不替你判断与担责</tspan></text></svg>"}, {"t": "新人最常见的一个误区", "n": "新人最容易犯的错，是把 AI 当成枪手：让它写一整份报告，交上去。结果要么内容空泛被退回，要么数据编造出了问题。正确的姿势是：让 AI 帮你打草稿，你来补事实、做判断、把最后一道关。这一条记住了，你就已经超过大多数新手。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">正确姿势</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">常见误区</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"94.8\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI 打草稿 → 我补事实、</tspan><tspan x=\"105.0\" dy=\"15.600000000000001\">做判断</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">AI 写完 → 我直接交</tspan></text></g></svg>"}], "deliverable": {"type": "skill", "name": "AI 能力边界卡", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能用自己的话讲清 AI 擅长的 5 类事与不擅长的 3 类事，并给出 1 个自己岗位的例子"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】能力边界图（擅长：检索归纳 / 写草稿 / 整理 / 生成 / 改格式）\n【为什么重要】第一周最重要的事，是建立对 AI 能力的正确预期——既别神化，也别低估\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M0U2", "tier": "basic", "step": "demo", "title": "配齐你的第一套 AI 工具箱", "video": {"dur": "8min", "script": ["工具不在多，在于每类有一个你能随手用起来的", "四类工具矩阵（对话 / 文生图 / 生视频 / 表格数据）", "新人囤了一堆工具却一个都没用熟"]}, "ppt": {"method": "四类工具矩阵（对话 / 文生图 / 生视频 / 表格数据）", "case": "新人囤了一堆工具却一个都没用熟", "demo": "WorkBuddy 里跑一遍工具选型提示词"}, "vslides": [{"t": "演示准备：为什么要分四类", "n": "很多人一上来就问「哪个 AI 最好用」，这个问题没有答案。更实用的问法是：我这周要做的事，分别属于哪一类。写作和问答是一类，配图是一类，做视频是一类，处理表格又是一类。四类各挑一个用熟，比囤二十个工具强得多。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">四类工具</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">对话写作</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">文生图</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">生视频</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">表格数据</tspan></text></g></svg>"}, {"t": "跑提示词：每类一个，带避坑点", "n": "把提示词贴进 WorkBuddy 跑一遍。要求它每类只推荐一个，并说明最适合新人的用法、一个避坑点、以及不适合交给它做的一件事。第三项最关键——知道「别用它做什么」，比知道「它能做什么」更能帮你少踩坑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一句选型需求</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">要求：每类 1 个 + 用法 + 避坑 + 不适用场景</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：一张工具箱表</tspan></text></g></svg>"}, {"t": "人工收口：先用一个跑通", "n": "跑完之后别急着全部注册。挑其中一类，今天就拿一件真实的小事跑通一遍——比如用它把一段会议记录整理成要点。跑通一次，你对工具的理解会超过看十篇测评。用熟一个再换下一个，这是新人最快的上手路径。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">今天就跑通一件真实小事</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">记录下用的提示词</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">记下哪一步必须自己改</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "个人 AI 工具箱", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《个人 AI 工具箱》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "我是职场新人，请按「对话写作 / 文生图 / 生视频 / 表格数据」四类，每类推荐 1 个国内常用、免费或低门槛的 AI 工具，并说明：最适合新人的 1 个用法、1 个避坑点、以及不适合交给它做的 1 件事。用表格输出。"}, "task": "在 WorkBuddy 里把「四类工具矩阵（对话 / 文生图 / 生视频 / 表格数据）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】四类工具矩阵（对话 / 文生图 / 生视频 / 表格数据）\n【参考案例】新人囤了一堆工具却一个都没用熟\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n我是职场新人，请按「对话写作 / 文生图 / 生视频 / 表格数据」四类，每类推荐 1 个国内常用、免费或低门槛的 AI 工具，并说明：最适合新人的 1 个用法、1 个避坑点、以及不适合交给它做的 1 件事。用表格输出。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U3", "tier": "basic", "step": "todo", "title": "画出你的第一张 AI 提效地图", "video": {"dur": "8min", "script": ["提效方案失败的第一步，往往是连自己一周做了什么都列不全", "提效地图模板（工作项 / AI 能帮哪一步 / 不交给它什么）", "一份新人周工作提效地图样例（8 项 × 三列）"]}, "ppt": {"method": "提效地图模板（工作项 / AI 能帮哪一步 / 不交给它什么）", "case": "一份新人周工作提效地图样例（8 项 × 三列）", "demo": "填写指引（先列事实再判断）"}, "vslides": [{"t": "第一步：先把事实列全", "n": "打开一个空白文档，把你这一周做过的所有事列出来，尽量列到八项。包括看起来琐碎的部分：整理表格、回复消息、找资料、写周报。别急着判断哪个能用 AI，先把事实列全。列不全，后面的地图就是空谈。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 列出本周 8 项工作</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 标注 AI 能帮哪一步</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 标注不交给它的部分</tspan></text></svg>"}, {"t": "第二步：每一项填两列", "n": "每一行填两列。第一列，AI 能帮哪一步——要具体到动作，比如「把录音转成要点初稿」，而不是「帮忙整理」。第二列，哪一步绝对不交给它，比如「判断谁负责哪件事」。第二列最容易被跳过，却最能防止你出事。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">每行填两列</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">工作项</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">AI 能帮哪一步</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">不交给它的部分</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "第三步：发给主管看一眼", "n": "把地图整理成一页，发给你的直属主管。目的不是邀功，而是让主管知道你在用什么方法提效、也知道你清楚哪些地方不能交给 AI。一份标注了「不交给它」的地图，通常比一份全是绿灯的更让人放心。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">至少 8 项工作</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每行两列都填了</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">至少 3 项写了「不交给它」</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《个人 AI 提效地图》并通过本单元评分要点"}, "practice": {"steps": ["列出你本周 8 项主要工作", "每项标注：AI 能帮哪一步", "每项标注：哪一步绝对不交给 AI"], "exemplar": "工作项：整理会议纪要｜AI 能帮：把录音转成要点初稿｜不交给它：判断谁负责哪件事 工作项：写周报｜AI 能帮：搭结构、润色｜不交给它：填具体数据与结论"}, "task": "产出《个人 AI 提效地图》：列出你本周 8 项主要工作；每项标注：AI 能帮哪一步；每项标注：哪一步绝对不交给 AI", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M0 入职第一周：AI 能做什么、不能做什么」模块，你要交付的是《个人 AI 提效地图》。\n【场景】业务侧这周的诉求是：提效方案失败的第一步，往往是连自己一周做了什么都列不全。参考做法：一份新人周工作提效地图样例（8 项 × 三列）。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（提效地图模板（工作项 / AI 能帮哪一步 / 不交给它什么）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《个人 AI 提效地图》填写模板】\n\n■ 1. 列出你本周 8 项主要工作\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 每项标注：AI 能帮哪一步\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 每项标注：哪一步绝对不交给 AI\n   ‣ 提示：先说结论，再说依据（数据 / 来源 / 口径），最后说取舍或风险；至少 3 行。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   工作项：整理会议纪要｜AI 能帮：把录音转成要点初稿｜不交给它：判断谁负责哪件事 工作项：写周报｜AI 能帮：搭结构、润色｜不交给它：填具体数据与结论", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M0U4", "tier": "basic", "step": "spar", "title": "面试官问「你怎么看 AI」", "video": {"dur": "8min", "script": ["这一题几乎必考，答得好与差只差一个结构", "回答三段式（结论 → 依据 → 边界）", "高分回答 vs 低分回答对照"]}, "ppt": {"method": "回答三段式（结论 → 依据 → 边界）", "case": "高分回答 vs 低分回答对照", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：他要的是例子", "n": "进入陪练，对手是面试官。他不会满足于「AI 很好用」这种回答，他一定会追问具体例子。所以上场前准备一个你真的跑通过的例子：用了什么工具、做了什么事、省了多少时间。有例子，这一题就稳了。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">回答三段式</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">结论</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">依据（具体例子</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">）</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">边界</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：AI 会取代你吗", "n": "第一个必问是「AI 会不会取代你」。两种极端回答都扣分：说「肯定会」显得没自信，说「跟我没关系」显得不了解。稳妥的答法是：AI 替代的是任务不是人，用得好的人会淘汰用不好的人，所以我选择把它用起来。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">高分</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">低分</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI 替代任务，不替代人</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">肯定会取代 / 跟我没关系</tspan></text></g></svg>"}, {"t": "最后一问：它给错了怎么办", "n": "最难的一问是：如果 AI 给你的信息是错的，你怎么办。答法是给出你的核验动作：关键数字回查原始来源、涉及对外的内容找同事复核、不确定就在文档里标注「待核实」。有核验习惯的人，面试官会放心。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">关键数字回查原始来源</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">对外内容找人复核</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不确定处标注「待核实」</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "个人 AI 提效地图", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《个人 AI 提效地图》并通过本单元评分要点"}, "spar": {"role": "模拟面试官", "persona": "会追问具体例子，不喜欢空泛表态", "mustAsk": ["你觉得 AI 会取代你这个岗位吗？", "你平时怎么用 AI 提效？举个具体例子", "如果 AI 给你的信息是错的，你怎么办？"]}, "task": "把《个人 AI 提效地图》拿到「模拟面试官」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《个人 AI 提效地图》。现在要让它通过「模拟面试官」这一关。\n【对手的立场】会追问具体例子，不喜欢空泛表态。\n【他一定会追问】「你觉得 AI 会取代你这个岗位吗？」 / 「你平时怎么用 AI 提效？举个具体例子」 / 「如果 AI 给你的信息是错的，你怎么办？」\n【场景】你说「面试官问「你怎么看 AI」」，对方立刻回一句：你觉得 AI 会取代你这个岗位吗？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}, {"id": "M0U5", "tier": "adv", "step": "understand", "title": "新人用 AI 的三条红线", "video": {"dur": "8min", "script": ["红线不是束缚，是让你能长期用下去的前提", "红线三原则（数据不出域 / 不替人决策 / 结论可追溯）", "把含同事手机号的名单贴进公开 AI 的后果"]}, "ppt": {"method": "红线三原则（数据不出域 / 不替人决策 / 结论可追溯）", "case": "把含同事手机号的名单贴进公开 AI 的后果", "demo": "红线自查卡"}, "vslides": [{"t": "第一条：数据不出域", "n": "第一条红线是数据不出域。客户名单、同事手机号、未发布的财务数据、合同原文，这些只要进了公开的 AI 服务，就等于离开了公司。免费版不行，付费版也不行。判断标准很简单：这份材料如果发给外部人员会不会有问题？会，就不要贴进去。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">客户与同事个人信息</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">未发布的财务与合同</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">内部制度与源码</tspan></text></svg>"}, {"t": "第二条：不替人决策", "n": "第二条是不替人决策。涉及录用、定价、授信、对外承诺这类决定，AI 可以给参考，但拍板必须是你或你的主管。原因是 AI 不知道全部背景，也不承担后果。让 AI 写一段「建议辞退某员工」的文字然后照发，是新人最容易出的严重事故。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">正确</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">危险</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">AI 给参考，人拍板</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">AI 说怎么做就怎么做</tspan></text></g></svg>"}, {"t": "第三条：结论可追溯", "n": "第三条是结论可追溯。凡是要交给别人的内容，你要能说清每个数字和结论来自哪里。AI 编造的数据一旦进了报告，追责时你说不清来源。养成一个习惯：AI 给的内容，关键处标注来源；标不出来的，就当成未确认。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">可追溯三步</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">关键数字标注来</tspan><tspan x=\"74.0\" dy=\"16.900000000000002\">源</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">标不出的当未确</tspan><tspan x=\"200.0\" dy=\"16.900000000000002\">认</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">对外前人工过一</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">遍</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "新人 AI 红线卡", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能说出三条红线，并为每条举出 1 个自己岗位的具体场景与规避动作"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】红线三原则（数据不出域 / 不替人决策 / 结论可追溯）\n【为什么重要】红线不是束缚，是让你能长期用下去的前提\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M0U6", "tier": "adv", "step": "demo", "title": "同一份材料：踩红线 vs 守红线", "video": {"dur": "8min", "script": ["绝大多数风险不是 AI 不可靠，而是人随手把不该外传的东西贴了出去", "对照演示（同一份含个人信息的材料两种处理方式）", "一份带手机号的客户反馈表"]}, "ppt": {"method": "对照演示（同一份含个人信息的材料两种处理方式）", "case": "一份带手机号的客户反馈表", "demo": "WorkBuddy 里跑一遍脱敏后的分析"}, "vslides": [{"t": "演示准备：一份带手机号的反馈表", "n": "演示素材是一份客户反馈表，里面有客户姓名、手机号和一段反馈原文。在做任何 AI 操作之前，先看一眼它属于什么级别的数据。这一步是习惯，不是形式。很多事故不是技术原因，就是有人随手一贴。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示数据预览</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">原始材料</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">客户姓名：李某某  手机：138****</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">反馈原文：产品开机慢</tspan></text></g></svg>"}, {"t": "踩红线：整段粘贴", "n": "先模拟最常见的错误：把整张表连姓名和手机号一起贴进公开的聊天窗口。它会给出很漂亮的分析，效率看起来很高。但代价是这些信息已经离开公司边界。个人信息一旦出域，通常对应的是公司处罚而不是口头提醒。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">踩红线</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">风险</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">整段贴入公开模型</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">姓名与手机号一起出域</tspan></text></g></svg>"}, {"t": "守红线：脱敏后只给结构化字段", "n": "换个做法。把姓名换成「样本 A」，手机号整列删除，只保留产品型号、反馈类型、满意度、反馈要点四个字段。再用提示词明确要求它不得索取个人信息。同样的分析结论，数据一步都没出域。这三步——脱敏、最小化、显式约束——就是守红线的完整手法。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">守红线三步</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">脱敏</tspan></text></g><g class=\"hl\"><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">只留必需字段</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">提示词显式约束</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "新人 AI 红线卡", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《新人 AI 红线卡》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "以下是客户反馈表的结构化字段（已脱敏，不含姓名、手机号与联系方式）：\n[粘贴字段：产品型号 / 反馈类型 / 满意度 / 反馈要点]\n请归纳高频问题 Top3 并给出建议。不要索取任何个人信息，也不要对未提供的字段做推测。"}, "task": "在 WorkBuddy 里把「对照演示（同一份含个人信息的材料两种处理方式）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】对照演示（同一份含个人信息的材料两种处理方式）\n【参考案例】一份带手机号的客户反馈表\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n以下是客户反馈表的结构化字段（已脱敏，不含姓名、手机号与联系方式）：\n[粘贴字段：产品型号 / 反馈类型 / 满意度 / 反馈要点]\n请归纳高频问题 Top3 并给出建议。不要索取任何个人信息，也不要对未提供的字段做推测。", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M0U7", "tier": "adv", "step": "todo", "title": "写出你岗位的 AI 红线清单", "video": {"dur": "8min", "script": ["通用的红线记不住，落到你自己岗位的具体动作才拦得住", "红线清单模板（场景 / 风险 / 规避动作）", "一份行政岗与一份销售岗的红线清单对照"]}, "ppt": {"method": "红线清单模板（场景 / 风险 / 规避动作）", "case": "一份行政岗与一份销售岗的红线清单对照", "demo": "填写指引（先场景后动作）"}, "vslides": [{"t": "第一步：列五个高频场景", "n": "先列出你自己岗位最常用的五个 AI 场景，要写你真的在做的事，不要抄通用清单。整理客户名单、写对外回复、做汇报材料、查资料、写会议纪要——场景越具体，后面的红线才写得准。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 场景一</tspan></text><g><circle cx=\"42\" cy=\"71.2\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"75.7\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"75.7\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 场景二</tspan></text><g><circle cx=\"42\" cy=\"100.4\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"104.9\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"104.9\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 场景三</tspan></text><g><circle cx=\"42\" cy=\"129.6\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"134.1\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"134.1\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 场景四</tspan></text><g><circle cx=\"42\" cy=\"158.8\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"163.3\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">⑤</text></g><text x=\"70.0\" y=\"163.3\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">⑤ 场景五</tspan></text></svg>"}, {"t": "第二步：逐场景写风险", "n": "每个场景写它可能触的红线。整理客户名单的风险是含手机号与身份证号；写对外回复的风险是 AI 编造承诺；做汇报的风险是数字没有来源。风险要写到具体的数据项，写「有泄露风险」这种话等于没写。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">每个场景至少一条风险</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">风险写到具体数据项</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不写笼统表述</tspan></text></svg>"}, {"t": "第三步：每条配一个动作", "n": "最后为每个场景配一条能真的执行的动作。比如「导出前先删除身份字段，只保留地区与意向」「涉及价格与交付期一律由主管确认后再发」。动作写到怎么做为止，写「加强意识」不算。五条写完，这张清单就能贴在工位上。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">清单三列</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">场景</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">风险</tspan></text></g><g class=\"hl\"><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"86.4\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">可执行的规避动</tspan><tspan x=\"326.0\" dy=\"16.900000000000002\">作</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}], "deliverable": {"type": "skill", "name": "岗位 AI 红线清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《岗位 AI 红线清单》并通过本单元评分要点"}, "practice": {"steps": ["列出你岗位 5 个高频 AI 使用场景", "为每个场景写出可能触的红线", "为每个场景写一条可执行的规避动作"], "exemplar": "场景：用 AI 整理客户名单｜风险：含手机号与身份证号｜动作：导出前先删除身份字段，只保留地区与意向 场景：用 AI 写对外回复｜风险：AI 编造承诺｜动作：涉及价格与交付期一律由主管确认后再发"}, "task": "产出《岗位 AI 红线清单》：列出你岗位 5 个高频 AI 使用场景；为每个场景写出可能触的红线；为每个场景写一条可执行的规避动作", "brief": "【你的角色】你是「你所在的团队」负责「日常工作」的职场新人。本单元属于「M0 入职第一周：AI 能做什么、不能做什么」模块，你要交付的是《岗位 AI 红线清单》。\n【场景】业务侧这周的诉求是：通用的红线记不住，落到你自己岗位的具体动作才拦得住。参考做法：一份行政岗与一份销售岗的红线清单对照。注意——这不是写一段感想，而是要交出一份能直接进评审会的材料。\n【输入】你已经拿到本单元视频与课件里的方法（红线清单模板（场景 / 风险 / 规避动作）），以及上面场景中描述的业务信息。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【《岗位 AI 红线清单》填写模板】\n\n■ 1. 列出你岗位 5 个高频 AI 使用场景\n   ‣ 提示：逐条列出，一行一条；同类项先别合并，后面再归并。\n   ‣ 我的填写：____________________________________________\n\n■ 2. 为每个场景写出可能触的红线\n   ‣ 提示：标出哪一步可能触线，并写明你的规避动作。\n   ‣ 我的填写：____________________________________________\n\n■ 3. 为每个场景写一条可执行的规避动作\n   ‣ 提示：区分「用户说的」与「用户做的」，两者不一致时以做的为准。\n   ‣ 我的填写：____________________________________________\n\n■ 4. 收尾自检\n   (1) 每个字段都填了内容吗？（空着要写「暂缺 + 补齐计划」）\n   (2) 至少出现 2 个具体数字、来源或制度条款吗？\n   (3) 有没有指出一处风险 / 红线，并给出规避动作？\n   (4) 写清责任人与时间节点了吗？\n\n参考样式（照着这个颗粒度写）：\n   场景：用 AI 整理客户名单｜风险：含手机号与身份证号｜动作：导出前先删除身份字段，只保留地区与意向 场景：用 AI 写对外回复｜风险：AI 编造承诺｜动作：涉及价格与交付期一律由主管确认后再发", "rubric": ["结构完整：模板每个小节都有内容（缺一节扣 8 分）", "有据可依：出现 ≥2 个具体数字 / 来源 / 口径", "红线意识：指出 ≥1 处风险并给出规避动作", "可执行：写明责任人或时间节点"]}, {"id": "M0U8", "tier": "adv", "step": "spar", "title": "主管抽查你的红线清单", "video": {"dur": "8min", "script": ["主管不看你写了什么，只看你能不能说出依据", "抽查清单（数据 / 决策 / 可追溯）", "被问倒的清单 vs 站得住的清单"]}, "ppt": {"method": "抽查清单（数据 / 决策 / 可追溯）", "case": "被问倒的清单 vs 站得住的清单", "demo": "陪练对话说明"}, "vslides": [{"t": "陪练说明：他怕出事", "n": "对手是你的直属主管，他最怕的是出事。三个必问：这条数据属于什么级别、对外的东西复核过吗、万一 AI 编了数字谁负责。上场前把每条红线的判断依据写在一旁，随问随答。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">主管三问</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"74.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"74.0\">数据级别</tspan></text></g><g><rect x=\"144.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">对外复核</tspan></text></g><g><rect x=\"270.0\" y=\"52.0\" width=\"112.0\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"326.0\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"326.0\">责任归属</tspan></text></g><path d=\"M132.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M258.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "高频追问：凭什么这么判断", "n": "第一个追问是判断依据。你说这份材料是内部级，凭什么？是公司制度里写了，还是你自己觉得。答得出依据来源才算过关；答不出的，正确做法是承认并说明你会去查哪份制度，而不是硬撑。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">引公司制度条款</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">说明判断理由</tspan></text><g class=\"hl\"><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">无依据时说明去哪里查</tspan></text></svg>"}, {"t": "最后一问：谁负责", "n": "最后一问是责任归属。答案只有一个：你。AI 不是责任主体，用它的人才是。所以正确的答法是说清你的复核动作：哪些内容我亲自核过、哪些需要主管再看一眼。主动划清责任边界的人，主管才敢把事交给你。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">说清自己核过哪些</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">标出需主管复核的部分</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">不把责任推给工具</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "岗位 AI 红线清单", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《岗位 AI 红线清单》并通过本单元评分要点"}, "spar": {"role": "直属主管", "persona": "务实、怕出事，追问你凭什么这么判断", "mustAsk": ["这条数据属于什么级别，你凭什么这么判断？", "如果这个内容是对外发的，你复核过吗？", "万一 AI 编了数字，谁负责？"]}, "task": "把《岗位 AI 红线清单》拿到「直属主管」面前过一遍，直到他放行。", "brief": "【陪练背景】你已经产出了《岗位 AI 红线清单》。现在要让它通过「直属主管」这一关。\n【对手的立场】务实、怕出事，追问你凭什么这么判断。\n【他一定会追问】「这条数据属于什么级别，你凭什么这么判断？」 / 「如果这个内容是对外发的，你复核过吗？」 / 「万一 AI 编了数字，谁负责？」\n【场景】你说「主管抽查你的红线清单」，对方立刻回一句：这条数据属于什么级别，你凭什么这么判断？ 这不是走过场——他每轮都会挑你上一条回答里最虚的一处，直到你给出可追溯的依据为止。\n【通关标准】每轮都给得出依据（数据 / 原文条款 / 口径），承认不确定并说明如何补证，责任边界写清楚——只表态、只说「我觉得」不会通过。", "template": "【回答结构模板】对着陪练的每一次追问，都按这三段回答：\n\n■ 1. 结论（一句话）\n   ‣ 我的填写：____________________________________________\n\n■ 2. 依据（可追溯）\n   ‣ 数据 / 原文条款 / 口径：____________________________________________\n   ‣ 来自哪里（文件第几条、哪个看板、哪次访谈）：____________________\n\n■ 3. 取舍与边界（哪部分我不下结论，留给谁）\n   ‣ 我的填写：____________________________________________\n\n■ 4. 如果依据不成立\n   ‣ 我会怎么补证 / 怎么降级结论：__________________________", "rubric": ["每次回答都给出依据，而不是只代表态或复述问题", "依据可追溯（能指回具体文件条款 / 数据 / 访谈编号）", "主动划出责任边界：哪些结论留给人判断"]}]}, {"id": "M1", "title": "M1 写出第一句好用的提示词", "units": [{"id": "M1U1", "tier": "basic", "step": "understand", "title": "提示词的四要素：角色·背景·任务·格式", "video": {"dur": "8min", "script": ["同样一个模型，提示词写得好不好，产出质量能差好几倍", "四要素公式（角色 + 背景 + 任务 + 输出格式）", "「帮我写周报」与一段完整提示词的产出对比"]}, "ppt": {"method": "四要素公式（角色 + 背景 + 任务 + 输出格式）", "case": "「帮我写周报」与一段完整提示词的产出对比", "demo": "四要素对照卡"}, "vslides": [{"t": "为什么「帮我写周报」没用", "n": "先说最常见的失败：打开对话框，敲一句「帮我写周报」。模型不知道你是谁、这周做了什么、写给谁看、要多少字，只能给一份放之四海皆准的模板。你看着没用，就得出结论说 AI 不行。其实问题出在提示词太短。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"105.0\" y=\"36.0\" font-size=\"12\" fill=\"#ff9bb0\" text-anchor=\"middle\"><tspan x=\"105.0\">太短</tspan></text><text x=\"295.0\" y=\"36.0\" font-size=\"12\" fill=\"#9be8b0\" text-anchor=\"middle\"><tspan x=\"295.0\">四要素</tspan></text><g><rect x=\"30.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#3a1a0c\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"105.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"105.0\">帮我写周报</tspan></text></g><g><rect x=\"220.0\" y=\"46.0\" width=\"150.0\" height=\"106.0\" rx=\"10\" fill=\"#0f3d24\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"295.0\" y=\"102.6\" font-size=\"12.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"295.0\">角色+背景+任务+格式</tspan></text></g></svg>"}, {"t": "四要素：角色", "n": "第一要素是角色，也就是让 AI 扮演谁。不要说「你是 AI」，要说「你是一位有五年经验的运营助理」。角色会显著影响它的语气和关注点。给它一个具体身份，是提示词里性价比最高的一句话。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"hl\"><circle cx=\"42\" cy=\"42.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"46.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">①</text></g><text x=\"70.0\" y=\"46.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">① 角色：你是谁</tspan></text><g><circle cx=\"42\" cy=\"74.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"78.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">②</text></g><text x=\"70.0\" y=\"78.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">② 背景：给谁用、什么场景</tspan></text><g><circle cx=\"42\" cy=\"106.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"110.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">③</text></g><text x=\"70.0\" y=\"110.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">③ 任务：具体要做什么</tspan></text><g><circle cx=\"42\" cy=\"138.0\" r=\"12\" fill=\"#1a5cff\"/><text x=\"42\" y=\"142.5\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">④</text></g><text x=\"70.0\" y=\"142.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"70.0\">④ 格式：要什么形式</tspan></text></svg>"}, {"t": "四要素：背景、任务、格式", "n": "第二是背景，说清这份东西给谁看、用在哪。第三是任务，说清具体动作，要具体到「按成果/进展/下周计划三栏写」。第四是格式，说清要表格还是清单、多少字。四要素齐全，你第一次就能拿到能用的东西。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">角色：具体身份</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">背景：给谁用、什么场景</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">任务：具体到动作</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"154.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 154.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"158.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">格式：表格/清单/字数</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "提示词四要素卡", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能把任意一个模糊需求改写成含角色/背景/任务/格式的完整提示词"}, "task": "看完讲解后，回答自检题并写下一句你自己的收获。", "brief": "【本单元要点】四要素公式（角色 + 背景 + 任务 + 输出格式）\n【为什么重要】同样一个模型，提示词写得好不好，产出质量能差好几倍\n【自检】看完视频与课件后，回答下面的问题，确认你真的带走了要点——这题的四个选项里没有「差不多」，只有一个是对的。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【一句话收获模板】\n\n■ 1. 本单元我记住的一个结论\n   ‣ ____________________________________________\n\n■ 2. 它可以马上用在我手头的哪件事上\n   ‣ ____________________________________________\n\n■ 3. 哪一点我还不确定，需要再查\n   ‣ ____________________________________________", "rubric": ["自检题答对（答错可重选，不扣分但不算完成）", "写下一句可落到具体工作上的收获"]}, {"id": "M1U2", "tier": "basic", "step": "demo", "title": "一句模糊需求 → 一段完整提示词", "video": {"dur": "8min", "script": ["看一遍改写前后的产出差距，比听十遍方法论有用", "改写演示（模糊 → 四要素 → 对比产出）", "把「帮我写周报」改写成完整提示词"]}, "ppt": {"method": "改写演示（模糊 → 四要素 → 对比产出）", "case": "把「帮我写周报」改写成完整提示词", "demo": "WorkBuddy 里跑一遍改写前后的对比"}, "vslides": [{"t": "演示准备：一句模糊需求", "n": "演示起点是「帮我写周报」这六个字。我们要做的是把它改写成一段完整提示词，然后对比两次产出。差距通常非常明显——第一次是套话，第二次基本能直接用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"24\" y=\"44\" width=\"352\" height=\"122\" rx=\"12\" fill=\"#0e1530\" stroke=\"#1a5cff\"/><g fill=\"#ff5f57\"><circle cx=\"42\" cy=\"62\" r=\"5\"/><circle cx=\"60\" cy=\"62\" r=\"5\"/><circle cx=\"78\" cy=\"62\" r=\"5\"/></g><text x=\"200.0\" y=\"36.0\" font-size=\"12\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">演示素材</tspan></text><g><text x=\"52.0\" y=\"103.6\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">输入：一句模糊需求</tspan></text></g><g><text x=\"52.0\" y=\"119.0\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">「帮我写周报」</tspan></text></g><g><text x=\"52.0\" y=\"134.4\" font-size=\"11.5\" fill=\"#cfe0ff\" text-anchor=\"start\"><tspan x=\"52.0\">目标：四要素完整提示词</tspan></text></g></svg>"}, {"t": "跑提示词：改写前后对比", "n": "把改写后的提示词贴进 WorkBuddy 跑一遍。你会看到它给出了角色、背景、任务、格式四段。关键在背景那一句「主管最关心本周进展与下周风险」——这一句让产出从通用模板变成了针对你的版本。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">改写后四段</tspan></text><g><rect x=\"18.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"58.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"58.2\">角色</tspan></text></g><g class=\"hl\"><rect x=\"112.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"152.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"152.8\">背景</tspan></text></g><g><rect x=\"207.0\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"247.2\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"247.2\">任务</tspan></text></g><g><rect x=\"301.5\" y=\"52.0\" width=\"80.5\" height=\"78.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"341.8\" y=\"94.9\" font-size=\"13.0\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"341.8\">格式</tspan></text></g><path d=\"M100.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M195.0 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><path d=\"M289.5 91.0 l8 0\" stroke=\"#3b7bff\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><defs><marker id=\"arr\" orient=\"auto\" markerWidth=\"8\" markerHeight=\"8\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b7bff\"/></marker></defs></svg>"}, {"t": "人工收口：补上只有你知道的事实", "n": "AI 再会写，也不知道你这周到底做了什么。所以最后一步是把你的工作流水填进去，并逐条核对数字。这一步做完，这份周报才真的能发。演示的意义就在这：AI 负责结构与措辞，事实永远由你提供。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">工作流水已填入</tspan></text><g class=\"hl\"><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">数字逐条核对过</tspan></text><g><circle cx=\"30\" cy=\"120.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 120.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"124.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">语气符合你的风格</tspan></text></svg>"}], "deliverable": {"type": "skill", "name": "提示词四要素卡", "rubric": ["完整性", "可用性", "红线合规"], "acceptance": "能产出《提示词四要素卡》并通过本单元评分要点"}, "demoScript": {"steps": ["按提示词跑一遍"], "prompt": "你是一位有五年经验的运营助理。我在一家 ToB 软件公司做销售运营，每周五要给主管发周报，主管最关心本周进展与下周风险。\n请根据下面的工作流水，按「本周成果 / 进行中 / 下周计划 / 需要支持」四栏写周报，每栏不超过 3 条，每条一句话，语气平实不夸张：\n[粘贴工作流水]"}, "task": "在 WorkBuddy 里把「改写演示（模糊 → 四要素 → 对比产出）」完整跑一遍，得到可复用的提示词。", "brief": "【演示任务】本单元不讲新概念，只要求你把方法跑通一遍。\n【要做的事】改写演示（模糊 → 四要素 → 对比产出）\n【参考案例】把「帮我写周报」改写成完整提示词\n【验收】跑完后你手上要有一个能重复使用的提示词（不是一次性的对话），并且知道它哪一步必须人来接手。\n【硬约束】公司数据不出域（敏感信息不进公开 AI）· 不替人决策（判断与责任归人）· 结论可追溯（每个数字说得出来源）。", "template": "【演示记录模板】跑完一遍后，把它记下来（这就是你后续能复用的资产）：\n\n■ 1. 我用的提示词（原样粘贴）\n   ‣ ____________________________________________\n\n■ 2. AI 给回来的结果哪里可用、哪里不能直接用\n   ‣ 可用：______________________  不可用：______________________\n\n■ 3. 我做了哪些人工修正（这就是「人把关」的位置）\n   ‣ ____________________________________________\n\n■ 4. 下次复用的固定句式\n   ‣ ____________________________________________\n\n【本单元给的提示词起点】\n你是一位有五年经验的运营助理。我在一家 ToB 软件公司做销售运营，每周五要给主管发周报，主管最关心本周进展与下周风险。\n请根据下面的工作流水，按「本周成果 / 进行中 / 下周计划 / 需要支持」四栏写周报，每栏不超过 3 条，每条一句话，语气平实不夸张：\n[粘贴工作流水]", "rubric": ["完整跑通一遍并记录了实际使用的提示词", "指出了 AI 输出中不能直接采信的部分", "给出了可复用的固定句式（而不是一次性的对话）"]}, {"id": "M1U3", "tier": "basic", "step": "todo", "title": "写出你的 5 条可复用提示词", "video": {"dur": "8min", "script": ["把提示词存下来，下次就能直接用，这是最快的复利", "提示词模板（场景 / 角色 / 背景 / 任务 / 格式）", "新人最常用的 5 个场景提示词样例"]}, "ppt": {"method": "提示词模板（场景 / 角色 / 背景 / 任务 / 格式）", "case": "新人最常用的 5 个场景提示词样例", "demo": "填写指引（先场景后四要素）"}, "vslides": [{"t": "第一步：列五个场景", "n": "先列出你最常用的五个场景。新人通常是这五类：写周报、整理会议纪要、写邮件、查资料做摘要、处理表格。列你自己的，别抄别人的——不常用的提示词存了也不会用。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">新人五类高频场景</tspan></text><g class=\"hl\"><rect x=\"18.0\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">写周报</tspan></text></g><g><rect x=\"145.3\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">会议纪要</tspan></text></g><g><rect x=\"272.7\" y=\"44.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"327.3\" y=\"82.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"327.3\">写邮件</tspan></text></g><g><rect x=\"18.0\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"72.7\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"72.7\">资料摘要</tspan></text></g><g><rect x=\"145.3\" y=\"123.0\" width=\"109.3\" height=\"69.0\" rx=\"10\" fill=\"#16204a\" stroke=\"#3b7bff\" stroke-width=\"2\"/><text x=\"200.0\" y=\"161.0\" font-size=\"11.5\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"200.0\">处理表格</tspan></text></g></svg>"}, {"t": "第二步：按四要素逐条写", "n": "每个场景按四要素写一条。角色给它一个具体身份，背景说清给谁看、用在哪，任务具体到动作，格式说清清单还是表格、多少条。五条写完你会发现，它们的骨架其实一样，只是背景和任务不同。", "s": "<svg viewBox=\"0 0 400 200\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"200.0\" y=\"26.0\" font-size=\"13\" fill=\"#7aa2ff\" text-anchor=\"middle\"><tspan x=\"200.0\">要点</tspan></text><g><circle cx=\"30\" cy=\"52.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 52.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"56.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anchor=\"start\"><tspan x=\"54.0\">角色具体</tspan></text><g><circle cx=\"30\" cy=\"86.0\" r=\"10.5\" fill=\"none\" stroke=\"#3b7bff\" stroke-width=\"2\"/><path d=\"M25.5 86.0 l3.6 3.6 l6.4 -7.4\" stroke=\"#16a34a\" stroke-width=\"2.4\" fill=\"none\"/></g><text x=\"54.0\" y=\"90.5\" font-size=\"12.5\" fill=\"#eaf0ff\" text-anch
