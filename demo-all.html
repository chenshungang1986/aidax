<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能制造 × 产品经理 — AI能力测评与实战课程</title>
<style>
:root {
  --blue: #2563eb; --blue2: #1d4ed8; --cyan: #0891b2; --amber: #d97706;
  --green: #059669; --red: #dc2626; --purple: #7c3aed;
  --bg: #f0f4f8; --card: #fff; --text: #1e293b; --text2: #64748b;
  --border: #e2e8f0; --shadow: 0 2px 12px rgba(0,0,0,.06);
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
.app { max-width:900px; margin:0 auto; padding:20px; }
.card { background: var(--card); border-radius: var(--radius); padding:24px; box-shadow: var(--shadow); margin-bottom:16px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:8px; border:none; font-size:15px; font-weight:600; cursor:pointer; transition: all .2s; }
.btn-primary { background: var(--blue); color:#fff; }
.btn-primary:hover { background: var(--blue2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,.3); }
.btn-outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--blue); color: var(--blue); }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }
.tag { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
.tag-blue { background: #eff6ff; color: var(--blue); }
.tag-green { background: #ecfdf5; color: var(--green); }
.tag-amber { background: #fffbeb; color: var(--amber); }
.tag-purple { background: #f5f3ff; color: var(--purple); }
.header { text-align:center; padding:24px 0 12px; }
.header h1 { font-size:26px; margin-bottom:6px; }
.header p { color: var(--text2); font-size:14px; }
.industry-card, .role-card { cursor:pointer; border:2px solid var(--border); border-radius:12px; padding:16px; transition: all .2s; text-align:center; }
.industry-card:hover, .role-card:hover { border-color: var(--blue); box-shadow: 0 4px 16px rgba(37,99,235,.12); transform: translateY(-2px); }
.industry-card.selected, .role-card.selected { border-color: var(--blue); background: #eff6ff; }
.industry-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.role-grid { display:flex; gap:10px; flex-wrap:wrap; }
.role-card { flex:1; min-width:100px; }
.quiz-option { display:block; width:100%; text-align:left; padding:14px 16px; border:2px solid var(--border); border-radius:10px; background:#fff; cursor:pointer; font-size:14px; line-height:1.6; margin-bottom:8px; transition: all .15s; }
.quiz-option:hover { border-color: var(--blue); background: #f8faff; }
.quiz-option.selected { border-color: var(--blue); background: #eff6ff; font-weight:600; }
.quiz-dots { display:flex; gap:6px; justify-content:center; margin-bottom:20px; }
.quiz-dot { width:28px; height:4px; border-radius:2px; background: var(--border); transition: all .3s; }
.quiz-dot.done { background: var(--green); }
.quiz-dot.current { background: var(--blue); width:40px; }
.flex-between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.mt-2 { margin-top:8px; } .mt-3 { margin-top:12px; } .mt-4 { margin-top:16px; } .mt-6 { margin-top:24px; }
.mb-2 { margin-bottom:8px; } .mb-3 { margin-bottom:12px; } .mb-4 { margin-bottom:16px; }
.text-center { text-align:center; }
.slide-up { animation: slideUp .4s ease-out; }
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.gauge { position:relative; width:140px; height:140px; margin:0 auto; }
.gauge svg { transform:rotate(-90deg); }
.gauge-value { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:32px; font-weight:700; }
/* Radar chart */
.radar-container { width:100%; max-width:400px; margin:0 auto; }
/* Mastery cards */
.mastery-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
@media (max-width:640px) { .mastery-grid { grid-template-columns:repeat(2,1fr); } }
.mastery-card { background: #fff; border-radius:10px; padding:14px; text-align:center; border:1px solid var(--border); }
.mastery-card .score { font-size:24px; font-weight:700; }
/* Gap bars */
.gap-bar { height:8px; border-radius:4px; background: var(--border); overflow:hidden; margin-top:4px; }
.gap-fill { height:100%; border-radius:4px; transition: width .6s; }
/* Course player */
.course-hero { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #0891b2 100%); color:#fff; border-radius: var(--radius); padding:40px 32px; text-align:center; position:relative; overflow:hidden; }
.course-hero::before { content:''; position:absolute; top:-50%; right:-20%; width:300px; height:300px; background: rgba(255,255,255,.05); border-radius:50%; }
.course-hero h2 { font-size:28px; margin-bottom:8px; }
.course-hero .sub { opacity:.85; font-size:15px; margin-bottom:20px; }
.course-hero .meta { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; font-size:13px; opacity:.8; }
.course-hero .meta span { background: rgba(255,255,255,.15); padding:4px 12px; border-radius:20px; }
/* Slide viewer */
.slide-container { position:relative; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; min-height:460px; }
.slide { padding:40px; min-height:460px; display:none; animation: fadeSlide .4s; }
.slide.active { display:block; }
@keyframes fadeSlide { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
.slide h3 { font-size:22px; margin-bottom:16px; color: var(--text); }
.slide p, .slide li { font-size:15px; line-height:1.8; color: var(--text2); }
.slide ul { padding-left:20px; }
.slide ul li { margin-bottom:6px; }
.slide .highlight { background: linear-gradient(120deg, #eff6ff 0%, #f5f3ff 100%); border-left:4px solid var(--blue); padding:12px 16px; border-radius:0 8px 8px 0; margin:12px 0; }
.slide .step-num { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background: var(--blue); color:#fff; font-size:13px; font-weight:700; margin-right:8px; }
/* Player controls */
.player-bar { display:flex; align-items:center; gap:12px; padding:14px 20px; background: #fff; border-top:1px solid var(--border); border-radius:0 0 var(--radius) var(--radius); }
.player-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid var(--border); background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition: all .15s; }
.player-btn:hover { border-color: var(--blue); color: var(--blue); }
.player-btn.playing { background: var(--blue); color:#fff; border-color: var(--blue); }
.progress-track { flex:1; height:6px; border-radius:3px; background: var(--border); cursor:pointer; position:relative; }
.progress-fill { height:100%; border-radius:3px; background: var(--blue); transition: width .3s; }
.slide-counter { font-size:13px; color: var(--text2); min-width:60px; text-align:center; }
.speaking-indicator { display:flex; align-items:center; gap:4px; }
.speaking-dot { width:6px; height:6px; border-radius:50%; background: var(--border); animation: none; }
.speaking-dot.active { background: var(--green); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.voice-select { padding:6px 10px; border-radius:6px; border:1px solid var(--border); font-size:13px; background:#fff; }
</style>
</head>

<script>
// ==================== STATE ====================

prompt: [{level:0,difficulty:"初阶",scenario:"场景：你负责智能风控产品，需要让AI分析信贷审批数据来发现新的风控规则。你手上有最近6个月的审批数据（含拒绝原因）。",q:"如何用提示词让AI成为风控分析专家？",opts:["A. 先设定角色——「你是银行风控专家」，喂入字段说明（申请金额/收入/征信分/审批结果/拒绝原因），要求分析：拒绝率趋势、高风险特征组合、建议新增风控规则","B. 把数据丢给AI让它自己判断","C. 让AI写代码分析","D. 问AI「风控怎么做」","E. 直接让AI做审批决策"],scores:[4,0,1,0,0],best:0,explain:"金融PM的Prompt关键：角色设定+字段解释+分析框架。风控场景必须说明每个字段的业务含义。"},{level:1,difficulty:"中阶",scenario:"场景：你要让AI对比本行和3家竞品的信用卡审批策略差异。数据来源：竞品官网、行业报告、监管披露。",q:"最佳Prompt设计是？",opts:["A. 三步法：(1)设定「信用卡产品对比分析师」角色 (2)按维度结构化输入（额度策略/利率策略/风控门槛/权益设计）(3)要求输出对比矩阵+差异化机会+本行优化建议","B. 给AI四个链接让它读","C. 让AI总结每家策略","D. 问AI谁家最好","E. 只关注利率对比"],scores:[4,0,1,0,1],best:0,explain:"竞品分析Prompt=角色+结构化维度+可执行输出。金融竞品对比必须覆盖完整产品维度。"},{level:2,difficulty:"高阶",scenario:"场景：你要设计一个「AI辅助反洗钱(AML)交易监控」产品的PRD。涉及：交易规则引擎、异常检测模型、case管理流程、监管报告生成。",q:"如何用多轮Prompt链完成这个复杂任务？",opts:["A. 5轮Prompt链：(1)AML法规翻译官→解析最新监管要求 (2)交易场景分析师→枚举可疑交易模式 (3)产品架构师→设计模块架构 (4)PRD撰写助手→逐章节生成 (5)合规审查员→逐条核对监管对齐度。每轮输出作为下一轮输入","B. 一次性让AI写完整PRD","C. 先写PRD再查法规","D. 让风控部门写需求，AI润色","E. 参考其他银行的文档改一改"],scores:[4,0,0,1,2],best:0,explain:"复杂金融产品PRD=Prompt链。AML这种强监管产品必须法规先行，逐层构建，确保每个环节合规。"}],
tools: [{level:0,difficulty:"初阶",scenario:"场景：你是银行信贷产品经理，需要分析一份100页的《消费金融行业监管新规》PDF，提取对你们产品的影响。",q:"最佳工具体验是什么？",opts:["A. 上传PDF到Claude/GPT → 设定「消费金融产品合规专家」角色 → 要求：(1)提取影响现有产品线的条款 (2)按影响等级分类 (3)给每项列出整改建议和截止时间","B. 手动读PDF然后自己总结","C. 用搜索引擎搜索摘要","D. 让法务部门读然后告诉你","E. 用OCR工具转文字再看"],scores:[4,0,0,1,1],best:0,explain:"AI分析长文档=上传+角色+结构化输出。金融合规文档的分析效率从3天→30分钟。"},{level:1,difficulty:"中阶",scenario:"场景：你需要评估「接入新版征信API」的技术方案。方案涉及数据加密传输、接口鉴权、异常重试、数据映射。",q:"如何用AI辅助技术评估？",opts:["A. 上传API文档→设定「金融系统架构师」角色→要求：(1)评估接口设计合理性 (2)标注安全合规要点(加密/签名/鉴权) (3)给出现有系统的对接改动量评估 (4)列出潜在风险和降级方案","B. 让研发自己评估不用AI","C. 问AI「这个API好不好」","D. 只关注接口响应速度","E. 找供应商要方案"],scores:[4,0,0,0,1],best:0,explain:"金融API评估：AI擅长架构审查+合规检查+风险评估。但最终技术决策必须结合内部系统现状。"},{level:2,difficulty:"高阶",scenario:"场景：你要搭建一个「AI辅助信贷决策」的实验环境。需要脱敏的审批数据、模型评估框架、AB测试方案、合规审查流程。",q:"如何用AI工具组合搭建这个环境？",opts:["A. 工具链组合：(1)Claude做数据脱敏方案设计+模型评估指标定义 (2)Cursor辅助写AB测试框架代码 (3)NotebookLM做合规要求深度研究 (4)Perplexity搜索行业最佳实践，四者协同","B. 只用Claude做所有事情","C. 找一个开源的直接用","D. 外包给数据公司","E. 先用Excel做分析"],scores:[4,0,0,1,0],best:0,explain:"复杂场景=多工具协同。金融实验环境涉及数据+模型+测试+合规，单一工具无法覆盖全链。"}],
data: [{level:0,difficulty:"初阶",scenario:"场景：你拿到一份消费贷产品的用户行为数据：10万条记录，含申请金额、审批额度、使用率、逾期情况、提前还款。",q:"如何用AI做初步分析发现产品优化方向？",opts:["A. 上传CSV→描述每个字段的业务含义→要求：(1)用户分层(按额度使用率+信用等级) (2)识别高逾期特征群体 (3)发现「额度未充分使用」的用户群→提出提额或降额的产品建议","B. 直接用Excel做透视表","C. 让AI预测谁会逾期","D. 只关注逾期率一个指标","E. 等数据部门出报告"],scores:[4,1,0,0,0],best:0,explain:"金融数据分析=业务字段解释+分层分析+可执行建议。AI的优势在于多维交叉分析的速度。"},{level:1,difficulty:"中阶",scenario:"场景：信用卡产品的激活率从65%降到52%。你有用户画像、渠道来源、卡片权益偏好、竞品权益数据。",q:"如何用AI找出激活率下降的根因并提出产品优化？",opts:["A. 四步分析：(1)AI对比激活vs未激活用户画像差异 (2)按渠道来源分析激活率变化 (3)提取权益偏好与竞品差异 (4)输出：根因假设Top3+对应的产品优化方案（如调整新户权益组合、优化激活流程）","B. 做用户调研问卷","C. 看竞品怎么做的照抄","D. 增加推广预算","E. 降低办卡门槛"],scores:[4,1,0,0,0],best:0,explain:"金融产品的激活率=用户画像+渠道+权益。AI能快速交叉分析找出最可能的根因组合。"},{level:2,difficulty:"高阶",scenario:"场景：你要构建一个「理财产品的智能推荐」模型。数据源：用户风险偏好问卷、历史交易行为、持仓数据、市场行情。合规要求：适当性管理、风险揭示。",q:"如何设计AI辅助的产品策略方案？",opts:["A. 六维度方案：(1)数据层-多源用户画像融合 (2)模型层-协同过滤+知识图谱 (3)合规层-适当性规则引擎前置 (4)解释层-AI生成推荐理由 (5)实验层-AB测试框架 (6)监控层-推荐效果+合规指标，AI辅助每层设计","B. 直接用协同过滤算法推荐","C. 按收益率排序推荐","D. 让理财经理手动推荐","E. 只推荐低风险产品"],scores:[4,0,0,0,0],best:0,explain:"金融智能推荐≠电商推荐。合规是第一优先级：推荐之前必须有适当性校验，推荐之后必须有风险揭示。"}],
content: [{level:0,difficulty:"初阶",scenario:"场景：你要写一份面向C端用户的「智能存款」产品介绍页面。目标是让用户理解产品优势，同时满足监管的「充分信息披露」要求。",q:"如何用AI高效完成？",opts:["A. 先喂AI监管要求（存款保险、利率说明、风险提示的披露规范）→再给产品参数（利率/期限/起存金额/提前支取规则）→要求生成3个版本（简洁版/详细版/合规版）→选择并人工优化","B. 让AI自由发挥创意","C. 参考竞品页面改写","D. 只写产品优势不提风险","E. 用法务模板填充"],scores:[4,0,1,0,0],best:0,explain:"金融产品文案=监管要求+产品参数+多版本输出。合规不是限制创意，是创意的边界。"},{level:1,difficulty:"中阶",scenario:"场景：你要输出一份面向合作渠道方的「联合贷产品合作方案书」，包含产品设计、分润模型、风险共担机制、技术对接方案。",q:"如何用AI确保方案专业且全面？",opts:["A. 结构化生成：(1)定义方案书章节结构 (2)每章先输入业务约束（监管比例、行内风控要求） (3)AI生成初稿→人工审核关键数字→AI统一润色格式 (4)最后用AI做「挑刺」：找出逻辑漏洞和遗漏","B. 参考历史方案模板填充","C. 让商务团队写好AI美化","D. 每个章节单独找一个AI写","E. 先签了再说细节"],scores:[4,1,0,0,0],best:0,explain:"合作方案书=结构+约束+迭代+审查。让AI先写再让AI挑刺，效果出奇好。"},{level:2,difficulty:"高阶",scenario:"场景：你要代表公司在行业论坛上发表「AI重塑零售银行」的主题演讲。需要兼顾专业性、前瞻性和行业影响力。",q:"如何用AI打造有深度的行业演讲稿？",opts:["A. 五步打造：(1)AI研究最新行业报告和趋势 (2)AI提炼3-5个核心观点+数据支撑 (3)用AI做「魔鬼代言人」挑战每个观点 (4)AI生成叙事框架（问题→洞察→案例→展望） (5)AI优化语言节奏和修辞，最终人工注入个人风格","B. 让AI写一篇然后照着念","C. 讲公司产品介绍的PPT","D. 找公关公司代写","E. 讲通用的AI趋势"],scores:[4,0,0,1,0],best:0,explain:"行业演讲=研究+观点+挑战+叙事+润色。AI负责信息密度，你负责思想深度。"}],
dev: [{level:0,difficulty:"初阶",scenario:"场景：研发团队说「我们可以用大模型做智能客服」，你是PM需要快速评估技术可行性和产品价值。",q:"如何用AI辅助技术评估？",opts:["A. 用AI三步评估：(1)让AI列出金融智能客服的技术方案对比(规则引擎vs大模型vs混合) (2)让AI分析每方案的优缺点、成本和风险 (3)结合你的产品判断输出「是否值得投入」的决策矩阵","B. 直接相信研发的判断","C. 问AI「大模型好不好」","D. 找外部技术顾问","E. 先做一个MVP看看"],scores:[4,0,0,1,2],best:0,explain:"PM评估技术方案=AI提供信息+你做决策。AI帮你快速建立技术认知，但产品价值的判断需要行业经验。"},{level:1,difficulty:"中阶",scenario:"场景：你要为「智能风控引擎」产品写技术需求。涉及：实时计算（<50ms响应）、规则热更新、模型可解释性、监管审计轨迹。",q:"如何用AI写出研发看得懂的技术需求？",opts:["A. 四步法：(1)AI解释每个技术概念的基础知识 (2)描述业务场景→AI转化为技术约束 (3)AI按「功能需求+非功能需求+接口规范」模板生成初稿 (4)用AI模拟研发评审找出表述不清的地方","B. 写成普通PRD希望研发理解","C. 把所有技术细节都写进需求","D. 只写功能描述不管技术约束","E. 让研发自己写技术需求"],scores:[4,0,0,0,0],best:0,explain:"金融技术需求=业务→技术转译+非功能需求。金融系统最大的非功能需求是：实时性、可解释性、可审计性。"}],
workflow: [{level:0,difficulty:"初阶",scenario:"场景：你每天需要花2小时整理各业务线的数据日报：存款、贷款、理财、信用卡四个板块的昨日数据。",q:"如何用AI自动化这个重复劳动？",opts:["A. 建立AI日报工作流：(1)用AI设计标准化日报模板（每板块3-5个核心指标） (2)设定数据源→AI自动提取和计算 (3)AI生成日报初稿含异常标注 (4)你花10分钟审核加评语→一键发送","B. 继续手工做日报","C. 让每个业务线自己报数据","D. 只关注一个板块","E. 雇一个助理做"],scores:[4,0,0,0,1],best:0,explain:"日报自动化=模板化+AI提取+人工审核。从2小时→10分钟，而且AI善于发现异常数据。"},{level:1,difficulty:"中阶",scenario:"场景：你要推动团队建立「AI嵌入产品评审」的流程。当前评审会的痛点：需求文档质量参差、评审讨论发散、结论难以追踪。",q:"如何设计AI协同的产品评审？",opts:["A. 三阶段AI嵌入：(1)评审前-AI预审PRD，标注逻辑漏洞/数据缺失/边界遗漏 (2)评审中-AI实时记录讨论要点并结构化 (3)评审后-AI生成会议纪要和待办事项，追踪闭环","B. 让AI替你做决策","C. 只在写PRD时用AI","D. 每次评审会都用AI录屏","E. 取消评审会改成文档异步评审"],scores:[4,0,0,0,1],best:0,explain:"AI嵌入评审=前中后全流程。关键不是替代人评审，而是让人的讨论更高效、更有记录。"},{level:2,difficulty:"高阶",scenario:"场景：你是金融产品总监，要建立团队级的「AI辅助产品管理」工作体系。5个PM，每人负责不同产品线。",q:"如何设计可落地的AI工作体系？",opts:["A. 四层体系：(1)工具层-每人配置AI工具矩阵（分析/写作/研究） (2)流程层-在PRD评审/竞品分析/数据分析节点嵌入AI (3)知识层-建立团队共享的Prompt库和最佳实践 (4)度量层-追踪AI使用带来的效率和质量提升指标，季度复盘迭代","B. 每人自己摸索怎么用AI","C. 购买一套AI产品管理系统","D. 设一个AI专员的岗位","E. 出一个AI使用手册发给大家"],scores:[4,1,0,0,0],best:0,explain:"团队级AI工作体系=工具+流程+知识+度量。个人用AI靠自觉，团队用AI靠体系。"}],
security: [{level:0,difficulty:"初阶",scenario:"场景：你打算用公共AI分析一份包含「客户姓名+身份证号」的信贷审批数据。",q:"正确的做法是？",opts:["A. 先用AI生成脱敏脚本→对姓名/身份证号/手机号/银行卡号做脱敏处理→确认脱敏完整→再将脱敏后数据上传企业版AI分析","B. 直接上传分析，AI公司有保密协议","C. 把数据打印出来手动分析","D. 只删除姓名就上传","E. 用Excel代替AI分析"],scores:[4,0,0,0,0],best:0,explain:"金融数据使用AI的铁律：先脱敏后上传，且必须用企业版AI。客户隐私不是技术问题，是法律红线。"},{level:1,difficulty:"中阶",scenario:"场景：你要推动公司在AI使用上建立规范。涉及数据分级、工具白名单、员工培训。作为PM，需要推动产品部门率先合规。",q:"最佳推动策略？",opts:["A. 三线并行：(1)联合合规/法务制定数据分级标准（公开/内部/敏感/绝密） (2)牵头建立AI工具评估矩阵（安全等级×适用场景） (3)用真实案例组织全员安全意识培训（某银行因数据泄露被罚的案例）","B. 等合规部门制定规范再执行","C. 只限制敏感数据不限制工具","D. 禁止所有人用AI","E. 只关注自己的合规"],scores:[4,0,1,0,0],best:0,explain:"金融AI合规=数据分级+工具评估+人员培训。PM不只是遵守者，应该是推动者。"},{level:2,difficulty:"高阶",scenario:"场景：你要设计一个面向B端客户的「AI辅助授信」产品的安全架构。产品需要调用外部AI能力，同时确保客户数据安全。",q:"最佳安全架构设计？",opts:["A. 三隔离架构：(1)数据隔离-客户数据不出私有云，只传脱敏后的特征向量 (2)模型隔离-AI模型部署在企业私有环境，不做公网调用 (3)审计隔离-每次AI调用记录完整的审计日志（谁/什么时候/什么数据/什么结果），满足监管可追溯要求","B. 直接调用公有云AI接口","C. 自己做一个小模型","D. 让客户自己处理数据安全","E. 签NDA后使用公共AI"],scores:[4,0,0,0,0],best:0,explain:"金融AI产品的安全=数据+模型+审计三重隔离。监管看的就是每一步都可追溯。"}],
strategy: [{level:0,difficulty:"初阶",scenario:"场景：CEO问：AI对金融产品最大的影响是什么？",q:"作为PM的最佳回答是？",opts:["A. AI让「普惠金融」真正可行：(1)智能风控降低服务成本→覆盖长尾客户 (2)个性化推荐实现千人千面的财富管理 (3)智能客服7×24服务→从「产品为中心」到「客户为中心」的范式转移","B. AI能替代所有金融产品经理","C. AI让交易更快","D. AI主要影响科技部门","E. AI是未来的事现在不用急"],scores:[4,0,0,0,0],best:0,explain:"金融PM的战略视角：AI改变的不仅是效率，而是让「服务更多人」成为可能。普惠金融是最大的战略机会。"},{level:1,difficulty:"中阶",scenario:"场景：竞品App推出了「AI理财顾问」功能，用户可以对话式咨询投资建议。CEO问你「我们要不要跟进」？",q:"你的战略级回答是？",opts:["A. 不盲目跟进，三步分析：(1)AI拆解竞品功能：是真正的AI还是规则引擎包装？用户真实使用率？ (2)评估我们的差异化：客户信任度/理财经理团队/线下网点是优势 (3)提出「AI增强理财经理」策略（AI辅助经理做方案，不是替代），同时小范围灰度测试纯AI顾问","B. 马上做一个一样的","C. 不做，我们有理财经理","D. 外包给AI公司做","E. 等市场验证后再决定"],scores:[4,0,0,0,1],best:0,explain:"金融产品跟进决策=竞品拆解+差异化评估+渐进策略。金融行业的信任是壁垒，善用而非放弃。"},{level:2,difficulty:"高阶",scenario:"场景：董事会要求你提出「未来3年AI驱动的零售银行产品战略」。",q:"最能说服董事会的方案？",opts:["A. 「AI三级火箭」：(1)Year1-效率革命：AI嵌入客服/风控/营销，ROI可量化 (2)Year2-体验升级：AI个性化理财/智能投顾/智能存款推荐 (3)Year3-生态重构：开放AI能力API构建金融科技生态，从「卖产品」到「卖智能服务」，每阶段配KPIs和投资回报预估","B. 大量投资AI基础设施","C. 收购一家AI公司","D. 与互联网大厂合作","E. 在每个产品里加AI功能"],scores:[4,0,1,0,0],best:0,explain:"董事会要的是：清晰的路线图+可量化的ROI+渐进的投资节奏。三级火箭展示从效率→体验→生态的递进逻辑。"}]

prompt: [{level:0,difficulty:"初阶",scenario:"场景：你是智能座舱PM，想用AI分析用户在车载语音助手的对话日志，发现高频需求和痛点。日志含10万条脱敏对话。",q:"如何设计Prompt让AI高效分析？",opts:["A. 设定「车载语音体验分析师」角色→描述日志格式（时间/功能域/用户意图/是否成功/对话轮次）→要求：(1)高频意图TOP10 (2)失败率最高的功能域 (3)用户情绪变化模式 (4)提出3个产品优化建议","B. 把日志丢给AI说「分析一下」","C. 让AI只统计意图次数","D. 找实习生手动看1000条","E. 只看成功率最高的功能"],scores:[4,0,0,1,0],best:0,explain:"车载语音分析=格式解释+多维度输出。AI的关键价值是发现人工难以察觉的模式。"},{level:1,difficulty:"中阶",scenario:"场景：你要对比特斯拉、小鹏、理想的智能驾驶产品策略，数据来源：官网、评测视频、用户社区。",q:"Prompt最佳设计？",opts:["A. 分解为4个子任务：(1)产品功能矩阵提取（感知/决策/控制/交互） (2)定价策略对比（标配vs选装vs订阅） (3)用户口碑情感分析 (4)技术路线差异（纯视觉vs激光雷达vs融合），最后汇总为战略建议","B. 给AI三个链接让它总结","C. 用AI翻译竞品英文官网","D. 问AI谁家技术最强","E. 只对比硬件配置"],scores:[4,0,0,0,1],best:0,explain:"智驾竞品分析=功能+定价+口碑+技术路线四维分解。汽车产品对比的维度远超手机。"},{level:2,difficulty:"高阶",scenario:"场景：你要用Prompt链设计「智能座舱场景库」。从用户Journey出发，定义100+个车内场景。",q:"最佳Prompt链方案？",opts:["A. 5轮Prompt链：(1)用户旅程专家→定义上下班/接送孩子/长途自驾等场景分类 (2)场景设计师→每类展开为具体用例 (3)交互设计师→设计最佳交互方式(语音/触控/手势) (4)体验评估师→标注风险点 (5)优先级排序师→按频率×体验影响排序","B. 让AI枚举所有可能场景","C. 脑暴会然后AI记录","D. 参考竞品场景库改编","E. 按功能列表逐一设计"],scores:[4,0,1,2,1],best:0,explain:"场景库设计=用户体验×AI辅助。人定义场景分类和原则，AI负责大规模展开和交叉检查。"}],
tools: [{level:0,difficulty:"初阶",scenario:"场景：你是智能驾驶PM，需要分析一份英文的Euro NCAP 2026自动驾驶安全评估标准（80页PDF）。",q:"最佳工具用法？",opts:["A. 上传PDF到Claude→设定「汽车安全标准分析师」角色→要求：(1)提取所有评分维度和权重 (2)对比2025版变化点 (3)标注影响我方产品设计的关键条款 (4)输出待办事项按优先级排列","B. 用翻译软件逐段翻译","C. 找海外同事帮忙解读","D. 只看摘要和结论","E. 等官方中文版"],scores:[4,0,0,0,0],best:0,explain:"安全标准分析=AI高价值场景。80页英文PDF→30分钟读透，且不易遗漏关键条款。"},{level:1,difficulty:"中阶",scenario:"场景：你要评估「把大模型部署到车端」的技术可行性。考虑：算力限制（<50TOPS）、实时性（<500ms）、离线可用、OTA更新。",q:"如何用AI组合工具评估？",opts:["A. 多工具协同：(1)Perplexity搜索最新车端大模型方案 (2)Claude分析技术白皮书→评估各方案可行性 (3)Cursor辅助写技术评估文档→画架构对比图 (4)用AI模拟推理延时估算","B. 等芯片厂商出方案","C. 让研发团队独立评估","D. 先在云端跑通再说","E. 看论文了解技术前沿"],scores:[4,0,0,1,0],best:0,explain:"车端AI评估=搜索+分析+文档+估算四件套。车端部署的约束比云端严苛10倍。"}],
data: [{level:0,difficulty:"初阶",scenario:"场景：你拿到1000位车主的OTA升级行为数据：车型、升级类型（功能/安全/体验）、下载时间、安装时间、成功率、回滚率。",q:"如何用AI分析OTA升级体验？",opts:["A. 上传CSV→说明字段含义→AI分析：(1)各车型升级成功率对比 (2)下载/安装耗时分布 (3)回滚原因分类 (4)输出「OTA体验优化」的产品建议","B. 只看成功率一个指标","C. 用Excel画趋势图","D. 发问卷调研用户感受","E. 让售后团队反馈"],scores:[4,0,0,2,0],best:0,explain:"OTA数据分析=成功率+耗时+回滚原因三维度。AI能同时跑多个分析维度。"},{level:1,difficulty:"中阶",scenario:"场景：智能驾驶功能的用户使用数据分析：各功能的开启率、使用时长、接管率、用户反馈。",q:"如何找出「哪些智驾功能用户最爱用vs最不敢用」？",opts:["A. 四维交叉分析：(1)功能使用率×用户画像（新手vs老司机） (2)接管率×场景（拥堵/高速/泊车） (3)使用频次×使用时长 (4)用户反馈情感分析→输出：核心功能强化清单+体验优化优先级","B. 按使用率排个序","C. 只关注接管率","D. 看App Store评分","E. 问销售顾问用户反馈"],scores:[4,0,0,0,0],best:0,explain:"智驾数据分析=使用率+接管率+场景+用户画像四维交叉。「不敢用」比「不好用」更需要PM关注。"},{level:2,difficulty:"高阶",scenario:"场景：你要基于100万辆车的行驶数据（脱敏），设计「UBI车险」产品。涉及：风险评分模型、定价策略、隐私保护。",q:"产品设计中的数据策略？",opts:["A. 五步策略：(1)AI定义驾驶风险特征（急加速/急刹车/夜间行驶/高速占比） (2)AI辅助设计可解释风险评分模型 (3)AI分析不同用户群体的价格敏感度 (4)AI生成驾驶行为改善建议→将保险升级为安全服务 (5)隐私保护：数据不出车，只上传评分","B. 按里程定价","C. 学国外UBI模式照搬","D. 交给精算部门设计","E. 让用户自己选择保险套餐"],scores:[4,0,0,1,0],best:0,explain:"UBI=风险评分+定价+隐私+增值服务四合一。AI让保险从「统一定价」走向「千人千价」。"}],
content: [{level:0,difficulty:"初阶",scenario:"场景：你要为OTA新版本写更新说明。更新包含：新增自动泊车2.0、修复CarPlay断连Bug、优化冬季续航算法。",q:"如何让用户愿意主动更新？",opts:["A. 三层输出：(1)给AI功能描述+技术要点→生成「一句话亮点」如「停车从此不用手」 (2)AI生成详细版更新说明 (3)AI生成不同版本供App推送/车内弹窗/官网详情页使用","B. 写「修复了若干问题」","C. 把研发的commit log给用户看","D. 只宣传新功能不提修复","E. 抄竞品的更新说明"],scores:[4,0,0,0,1],best:0,explain:"OTA更新说明=有吸引力的文案。让用户主动更新比强制更新效果好100倍。"}],

data: [{level:0,difficulty:"初阶",scenario:"场景：生产环境出现了API响应延迟飙升（P99从200ms升到2s）。你拿到了Nginx日志、应用日志和数据库慢查询日志。",q:"如何用AI快速定位问题？",opts:["A. 上传三类日志→描述系统架构（Nginx→Node.js→PostgreSQL）→要求：(1)按时间线关联分析 (2)找出延迟突变的精确时间点 (3)分析该时间点前后各层的异常模式 (4)输出根因假设Top3","B. 肉眼逐条看日志","C. 只查数据库慢查询","D. 重启服务试试","E. 逐个下线服务节点排查"],scores:[4,0,1,0,0],best:0,explain:"故障定位=多源日志+架构描述+时间线关联。AI擅长在海量日志中找出异常模式。"},{level:1,difficulty:"中阶",scenario:"场景：你要为系统建立性能基线和告警阈值。历史数据：6个月的CPU/内存/QPS/延迟/错误率时序数据。",q:"AI辅助方案？",opts:["A. 上传时序数据→AI分析：(1)识别周期性模式(按天/周) (2)计算各时段的正常波动范围 (3)基于3-sigma或IQR建议告警阈值 (4)标注历史异常点和根因→生成告警规则配置","B. 凭经验设置固定阈值","C. 只监控CPU和内存","D. 等出了事故再加监控","E. 用云厂商默认规则"],scores:[4,0,0,0,1],best:0,explain:"性能基线=时序分析+周期识别+异常检测。AI让阈值设定从「拍脑袋」到「数据驱动」。"}],
content: [{level:0,difficulty:"初阶",scenario:"场景：你要为一个内部微服务写API文档。接口15个，需要包含：路径、参数、返回值、错误码、调用示例。",q:"AI辅助生成方案？",opts:["A. 把Controller代码喂给AI→AI提取所有接口→生成OpenAPI 3.0规范→同时输出Markdown文档+示例curl命令→人工补充业务说明","B. 手工写每个接口的文档","C. 只写主要接口的文档","D. 用Swagger自动生成裸文档","E. 让调用方自己看代码理解"],scores:[4,0,0,2,0],best:0,explain:"API文档生成=代码→OpenAPI→多格式输出。从代码自动提取保证文档与实现一致。"},{level:1,difficulty:"中阶",scenario:"场景：你要写一份技术方案评审文档（ADR-Architecture Decision Record），决策点：选用消息队列RabbitMQ vs Kafka。",q:"AI辅助ADR的方式？",opts:["A. 四步生成：(1)AI对比两个方案在吞吐量/延迟/消息持久化/运维复杂度/生态集成 (2)结合业务场景(订单处理10K TPS/事件溯源需求)做适配分析 (3)AI按ADR模板生成文档 (4)用AI模拟技术评审挑漏洞","B. 选大家都在用的那个","C. 直接写结论不给分析过程","D. 让架构师决定不用文档","E. 两个都用"],scores:[4,0,0,0,0],best:0,explain:"ADR=方案对比+场景适配+模板生成+评审挑战。好的技术决策值得好的文档来记录。"}],
dev: [{level:0,difficulty:"初阶",scenario:"场景：Code Review时发现一段复杂的业务逻辑，需要确认是否覆盖了所有边界条件（空值/并发/超时/异常）。",q:"AI辅助Code Review的方式？",opts:["A. 把代码和业务规则描述一起给AI→要求：(1)逐行分析逻辑正确性 (2)枚举未覆盖的边界条件 (3)标注潜在的并发问题 (4)生成对应的单元测试用例","B. 肉眼仔细看代码","C. 让写代码的人自己检查","D. 只看明显的语法错误","E. 跑一下看有没有Bug"],scores:[4,0,0,0,1],best:0,explain:"AI Code Review=代码+业务规则→逻辑分析+边界枚举+测试生成。AI不会疲劳，能把所有边界条件枚举出来。"},{level:1,difficulty:"中阶",scenario:"场景：团队要引入一个新的微服务框架。作为Tech Lead需要评估：学习曲线、性能基准、社区活跃度、与现有技术栈的兼容性。",q:"AI辅助技术选型方案？",opts:["A. 多维评估：(1)AI收集各框架的GitHub数据(star/issue/PR频率)→活跃度评分 (2)AI搜索技术博客→提取生产环境经验 (3)AI对比性能基准 (4)AI生成评估报告含推荐方案和迁移路径","B. 用团队最熟悉的框架","C. 看哪个框架Star最多","D. 每个都做POC","E. 让每个组员投票"],scores:[4,0,0,1,0],best:0,explain:"技术选型=社区数据+生产经验+性能基准+迁移评估。AI帮你从感性投票变成数据驱动决策。"}],
workflow: [{level:0,difficulty:"初阶",scenario:"场景：每天站会后需要整理：昨日完成/今日计划/阻塞项。目前手动整理耗时30分钟。",q:"如何用AI优化每日工作流？",opts:["A. 搭建AI日报管线：(1)Git Commit自动提取昨日变更摘要 (2)Jira/TAPD自动拉取任务状态 (3)AI合并生成日报草稿 (4)你审核修改→一键发送","B. 继续手工整理","C. 让每个人自己发日报然后汇总","D. 减少日报频率","E. 只记录完成的任务"],scores:[4,0,0,0,1],best:0,explain:"日报自动化=工具集成+AI汇总+人工审核。从30分钟→3分钟。"},{level:1,difficulty:"中阶",scenario:"场景：你们团队在做Sprint Planning，需要评估5个用户故事的开发工作量。故事描述模糊，跨多个模块。",q:"AI辅助工作量评估的方式？",opts:["A. 四步评估：(1)AI分析每个故事→拆解为技术子任务 (2)AI预估每个子任务复杂度(基于历史数据) (3)AI标注技术风险和依赖 (4)输出结构化评估→人工调整并确认","B. 让每个人凭经验估算","C. 按故事点数拍脑袋","D. 先做再说不用估","E. 只估简单的故事"],scores:[4,0,0,0,0],best:0,explain:"AI辅助估点=任务拆解+历史参照+风险标注。AI让估点从玄学变得有据可依。"}],
security: [{level:0,difficulty:"初阶",scenario:"场景：你发现团队成员习惯把公司代码贴到公共ChatGPT中调试。",q:"正确的做法是？",opts:["A. 立即制止+三步行动：(1)组织团队安全培训，用真实数据泄露案例说明风险 (2)推动配置企业版AI工具（数据不用于训练）(3)建立代码分享规范：敏感逻辑脱敏/使用私有化部署的AI","B. 没什么大不了的","C. 禁止所有AI工具的使用","D. 口头提醒一下就好","E. 只限制核心代码"],scores:[4,0,0,1,0],best:0,explain:"代码安全=培训+工具+规范。禁止AI是因噎废食，配置企业版AI才是正道。"},{level:1,difficulty:"中阶",scenario:"场景：你要为团队建立AI辅助开发的安全规范。涉及：代码分享边界、第三方依赖审查、AI生成代码的安全审查。",q:"安全规范的核心要点？",opts:["A. 三层防护：(1)代码层-AI生成代码必须经过安全扫描和不信任原则审查 (2)依赖层-AI推荐的第三方库必须验证来源/许可证/已知漏洞 (3)数据层-禁止在公共AI中输入密钥/Token/客户数据、生产数据必须脱敏","B. 信任AI生成的代码","C. 只要不用公共AI就行","D. 只靠Code Review保证安全","E. 依赖安全扫描工具就够了"],scores:[4,0,0,0,0],best:0,explain:"AI开发安全=代码+依赖+数据三层防护。AI生成的代码可能包含不安全的模式，必须审查。"}],
strategy: [{level:0,difficulty:"初阶",scenario:"场景：CTO问：AI对研发工程师的工作方式最大的改变是什么？",q:"最佳回答？",opts:["A. AI让研发从「写代码」升级为「设计系统」：(1)重复代码由AI生成→工程师聚焦架构设计 (2)Code Review从人工到AI+人工 (3)调试从看日志到AI辅助根因分析 (4)文档从负担到自动生成→工程师的核心竞争力从「写得快」变为「想得深」","B. AI能替代初级程序员","C. AI让写代码更快","D. AI主要影响前端开发","E. 变化不大还是要写代码"],scores:[4,0,0,0,0],best:0,explain:"研发的战略转变：AI承担重复劳动，人的价值转移到架构设计和系统思维。核心能力从「执行力」到「判断力」。"},{level:1,difficulty:"中阶",scenario:"场景：公司要制定「AI Native研发体系」的建设路线图。你作为Tech Lead提出方案。",q:"最佳路线图？",opts:["A. 三阶段：(1)工具普及期-全员配置Cursor/Copilot，建立Prompt最佳实践 (2)流程嵌入期-AI嵌入Code Review/测试生成/文档编写流程 (3)能力升级期-AI辅助架构设计/性能优化/安全审查→建立团队AI能力度量体系","B. 一次性全面引入AI","C. 先观望等AI技术更成熟","D. 只给高级工程师用AI","E. 买最好的AI工具就行了"],scores:[4,0,0,0,0],best:0,explain:"AI Native研发体系=工具→流程→能力渐进升级。关键是建立度量体系，知道AI到底提升了什么。"}]

prompt: [{level:0,difficulty:"初阶",scenario:"场景：你负责App的「用户促活」运营。手上有近3个月未活跃的50万用户画像数据，需要设计精准召回策略。",q:"如何用Prompt让AI设计召回方案？",opts:["A. 设定「用户运营专家」角色→描述数据字段（最后活跃时间/历史行为/付费等级/渠道来源）→要求：(1)用户分层策略 (2)每层的召回钩子设计 (3)触达渠道和时间建议 (4)预期召回率和ROI预估","B. 给所有沉默用户发Push","C. 让AI生成一条通用短信群发","D. 参考竞品怎么做","E. 做满减活动吸引回来"],scores:[4,0,0,1,1],best:0,explain:"用户召回Prompt=角色+数据+分层+多渠道。精准召回比广撒网效果好10倍。"},{level:1,difficulty:"中阶",scenario:"场景：你要策划618大促活动。需要AI辅助完成：活动主题→玩法设计→用户分层策略→触达节奏→效果预估。",q:"Prompt链设计？",opts:["A. 5轮Prompt链：(1)「电商运营专家」→分析历史大促数据提炼成功要素 (2)「活动策划师」→生成5个活动创意 (3)「用户分层分析师」→定义不同用户群的激励策略 (4)「效果预估师」→基于历史数据预估GMV/ROI (5)「风控专家」→标注可能的刷单和羊毛党风险","B. 让AI直接生成活动方案","C. 参考去年的方案改一改","D. 做一个全场满减活动","E. 看竞品怎么搞然后跟进"],scores:[4,0,2,0,0],best:0,explain:"大促策划=历史分析+创意+分层+预估+风控五步。AI让活动从拍脑袋变成有数据支撑的系统工程。"},{level:2,difficulty:"高阶",scenario:"场景：你要设计一个「AI驱动的自动化运营体系」：基于用户实时行为自动触发个性化运营动作。",q:"Prompt策略？",opts:["A. 四层Prompt：(1)「用户行为分析师」→定义关键行为事件和用户意图映射 (2)「策略引擎设计师」→设计触发规则和自动化流程（if-this-then-that） (3)「内容生成器」→为每个触发场景自动生成个性化文案 (4)「效果优化师」→建立AB测试框架持续优化转化率","B. 用固定规则发Push和短信","C. 让运营手动判断什么时候发什么","D. 所有用户同一时间发同样的内容","E. 外包给第三方营销公司"],scores:[4,0,0,0,0],best:0,explain:"自动化运营体系=行为识别+规则引擎+内容生成+持续优化。AI让运营从手动操作变成自动驾驶。"}],
tools: [{level:0,difficulty:"初阶",scenario:"场景：你要做竞品分析：分析3个竞品App最近3个月的功能迭代和用户口碑变化。数据来源：App Store评论/社媒/竞品更新日志。",q:"AI工具组合方案？",opts:["A. 三工具协同：(1)AI抓取和分析App Store评论→提取高频关键词和情感趋势 (2)AI分析社媒讨论→识别用户对竞品新功能的真实反应 (3)汇总→输出竞品动态地图+我们的应对策略","B. 手动翻App Store评论","C. 只看竞品的版本更新日志","D. 买一份市场分析报告","E. 下载竞品App体验一下"],scores:[4,0,1,0,0],best:0,explain:"竞品分析=多渠道数据+AI分析+策略输出。多渠道交叉分析能发现单一渠道看不到的竞争信号。"}],
data: [{level:0,difficulty:"初阶",scenario:"场景：上周的DAU突然下降15%。你有最近30天的日活数据、各渠道来源、功能使用数据、用户反馈。",q:"AI分析方案？",opts:["A. 上传数据→描述下降的时间点→AI分析：(1)按渠道拆解DAU变化→定位下降来源 (2)分析下降前后功能使用的变化 (3)交叉用户反馈时间线 (4)输出：根因假设+紧急修复建议+止损方案","B. 再观察一周看看","C. 加大投放预算拉新补","D. 发问卷调研用户为什么离开","E. 做促销活动拉回用户"],scores:[4,0,0,1,0],best:0,explain:"DAU下降分析=渠道拆解+行为变化+反馈交叉。AI能在10分钟内跑完所有维度，而人工可能需要2天。"},{level:1,difficulty:"中阶",scenario:"场景：你在做AB测试：两个版本的App首页设计。A版（原版）和B版（个性化推荐），需要分析哪个版本的转化率更高。",q:"AI辅助AB测试分析？",opts:["A. 上传AB测试数据→AI分析：(1)整体转化率对比+统计显著性检验 (2)按用户分层分析(新老用户/付费/免费) (3)分析各功能模块的点击变化 (4)输出：哪个版本赢+在哪些人群赢+为什么赢","B. 看哪个版本的转化率高就选哪个","C. 两个版本都上线","D. 让设计师决定","E. 做用户调研不跑AB测试"],scores:[4,0,0,0,0],best:0,explain:"AB测试分析=统计检验+分层分析+行为解释。AI让你知道「谁赢了」，更知道「为什么赢」。"}],
content: [{level:0,difficulty:"初阶",scenario:"场景：你要为App的新功能「AI智能推荐」写推送文案。需要3个版本：弹窗版(30字)、Push版(50字)、App内横幅版(80字)。",q:"AI协作方式？",opts:["A. 给AI功能描述+用户价值+品牌调性→AI生成3版×3格式共9条文案→AI自我评分排序→你选最佳的微调","B. 自己写一版然后改长度","C. 只写一条通用的","D. 让设计师顺手写","E. 用竞品的文案改一改"],scores:[4,0,0,0,0],best:0,explain:"多版本文案=AI量产+评分筛选+人工定稿。运营最大的痛苦不是没创意，是没时间量产。"}],

// Merge extra questions into Format B pools
function buildQuizWithPools(baseQuiz, extraQuiz) {
  if (!extraQuiz) return baseQuiz; // no extras, use as-is (Format A)
  const result = {};
  for (const dim of Object.keys(baseQuiz)) {
    const base = baseQuiz[dim]; // Format A: [q0, q1, q2]
    const extras = extraQuiz[dim] || []; // extra questions
    // Group extras by level
    const extraByLevel = {};
    for (const q of extras) { (extraByLevel[q.level] = extraByLevel[q.level]||[]).push(q); }
    // Build pools: [[q0,q0extra?], [q1,q1extra?], [q2]]
    result[dim] = base.map((q, idx) => {
      const pool = [q, ...(extraByLevel[q.level]||[])];
      return pool;
    });
  }
  return result;
}

// ==================== ADAPTIVE QUIZ ENGINE ====================
const DIM_ORDER = ['prompt','tools','data','content','dev','workflow','security','strategy'];

function startAdaptiveQuiz() {
  S._quizWeights = getWeights();
  const dimOrder = DIM_ORDER;
  // Randomize dimension order for "every quiz is different"
  S._quizDims = [...dimOrder].sort(() => Math.random() - 0.5);
  // Build per-dim question arrays with random selection from each level pool
  const rawQuizData = getQuizData();
  const resolved = {};
  for (const dim of dimOrder) {
    const dimData = rawQuizData[dim];
    if (!dimData) { resolved[dim] = []; continue; }
    // Support two formats:
    // Format A (legacy): [q_lvl0, q_lvl1, q_lvl2]  — plain array of question objects
    // Format B (pool):   [[q_lvl0a, q_lvl0b], [q_lvl1a, q_lvl1b], [q_lvl2a]]  — array of pools
    if (Array.isArray(dimData[0])) {
      // Format B: pick one random question from each level pool
      resolved[dim] = dimData.map(pool => pool[Math.floor(Math.random() * pool.length)]);
    } else {
      // Format A: use as-is
      resolved[dim] = dimData;
    }
  }
  S._quizByDim = resolved;
  S._quizCurrentLevel = {};
  dimOrder.forEach(d => { S._quizCurrentLevel[d] = 0; });
  S.quizIdx = 0;
  S.quizAnswers = {};
  S._quizSelected = {};
  S._quizResult = null;
}

function getCurrentQuestion() {
  if (!S._quizDims || S.quizIdx >= S._quizDims.length) return null;
  const dimKey = S._quizDims[S.quizIdx];
  if (!S._quizByDim || !S._quizByDim[dimKey]) return null;
  const hasAnswered = S.quizAnswers[dimKey] !== undefined;
  let level = 0;
  if (hasAnswered) {
    // On revisit, show adapted level
    level = S._quizCurrentLevel[dimKey] || 0;
  }
  const questions = S._quizByDim[dimKey];
  // Ensure we have a question at this level
  if (level >= questions.length) level = questions.length - 1;
  return questions[level];
}

function answerCurrentQuestion(answerIdx) {
  if (!S._quizDims) return;
  const dimKey = S._quizDims[S.quizIdx];
  S._quizSelected = S._quizSelected || {};
  S._quizSelected[dimKey] = answerIdx;
  const q = getCurrentQuestion();
  if (q) {
    const score = q.scores ? q.scores[answerIdx] : answerIdx;
    S.quizAnswers[dimKey] = score;
  }
  render();
}

function adaptLevelForCurrentDim() {
  if (!S._quizDims) return;
  const dimKey = S._quizDims[S.quizIdx];
  if (!dimKey) return;
  const rawScore = S.quizAnswers[dimKey];
  if (rawScore === undefined) return;
  const normScore = rawScore / 4;
  const currentLevel = S._quizCurrentLevel[dimKey] || 0;
  if (normScore >= 0.75 && currentLevel < 2) {
    S._quizCurrentLevel[dimKey] = currentLevel + 1;
  } else if (normScore <= 0.25 && currentLevel > 0) {
    S._quizCurrentLevel[dimKey] = currentLevel - 1;
  }
}

function finishAdaptiveQuiz() {
  const result = calculateAdaptiveScores();
  S._quizResult = result;
  S.view = 'results';
  render();
  setTimeout(initRadarChart, 150);
}

function calculateAdaptiveScores() {
  const weights = S._quizWeights || getWeights();
  const answers = S.quizAnswers || {};
  let dimScores = {};
  let weightedTotal = 0, totalWeight = 0;
  for (const [dimKey, weight] of Object.entries(weights)) {
    if (weight <= 0) continue;
    const rawScore = answers[dimKey];
    const score = (rawScore !== undefined) ? rawScore : 0;
    dimScores[dimKey] = score;
    weightedTotal += score / 4 * weight;
    totalWeight += weight;
  }
  const overall = totalWeight > 0 ? Math.round(weightedTotal / totalWeight * 100) : 0;
  return { dimScores, overall, weights };
}

// ==================== VOICE ENGINE ====================
let voiceUtterance = null;
let voicePaused = false;

function getBestChineseVoice() {
  if (!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices();
  // Prefer premium Chinese voices
  const preferred = ['Tingting', 'Yating', 'Meijia', 'Zhiwei', 'Sin-ji', 'Google 普通话'];
  for (const pref of preferred) {
    const v = voices.find(v => v.name.includes(pref) && v.lang.startsWith('zh'));
    if (v) return v;
  }
  // Fallback to any Chinese voice
  return voices.find(v => v.lang.startsWith('zh')) || voices[0];
}

function speakSlide(idx) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  if (idx < 0 || idx >= getSlides().length) return;
  const slide = getSlides()[idx];
  if (!slide.narration) return;

  voiceUtterance = new SpeechSynthesisUtterance(slide.narration);
  const voice = getBestChineseVoice();
  if (voice) voiceUtterance.voice = voice;
  voiceUtterance.rate = 0.95;
  voiceUtterance.pitch = 1.0;
  voiceUtterance.volume = 1.0;
  voiceUtterance.lang = 'zh-CN';

  voiceUtterance.onstart = () => { S.isSpeaking = true; renderPlayerBar(); };
  voiceUtterance.onend = () => {
    S.isSpeaking = false;
    S.isPlaying = false;
    renderPlayerBar();
    // Auto-advance to next slide
    if (S.courseSlide < getSlides().length - 1) {
      setTimeout(() => {
        S.courseSlide++;
        renderSlide();
        speakSlide(S.courseSlide);
        S.isPlaying = true;
        renderPlayerBar();
      }, 800);
    }
  };
  voiceUtterance.onerror = () => { S.isSpeaking = false; S.isPlaying = false; renderPlayerBar(); };

  speechSynthesis.speak(voiceUtterance);
}

function togglePlay() {
  if (!window.speechSynthesis) return;
  if (voicePaused) {
    speechSynthesis.resume();
    voicePaused = false;
    S.isPlaying = true;
    S.isSpeaking = true;
  } else if (S.isSpeaking) {
    speechSynthesis.pause();
    voicePaused = true;
    S.isPlaying = false;
    S.isSpeaking = false;
  } else {
    S.isPlaying = true;
    speakSlide(S.courseSlide);
  }
  renderPlayerBar();
}

function stopVoice() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  S.isPlaying = false;
  S.isSpeaking = false;
  voicePaused = false;
}

    const map = { mfg: MFG_PM_QUIZ, finance: FIN_PM_QUIZ, auto: AUTO_PM_QUIZ, cpg: CPG_PM_QUIZ };
    const base = map[S.industry] || MFG_PM_QUIZ;
    // Only MFG PM has extra bank for now; others use Format A (compatible with engine)
    const extra = S.industry === 'mfg' ? MFG_PM_EXTRA : null;
    return buildQuizWithPools(base, extra);
  }
  const roleMap = { dev: DEV_QUIZ, ops: OPS_QUIZ, sales: SALES_QUIZ, hr: HR_QUIZ };
  const base = roleMap[S.role] || MFG_PM_QUIZ;
  const extraMap = { dev: DEV_QUIZ_EXTRA, ops: OPS_QUIZ_EXTRA, sales: SALES_QUIZ_EXTRA, hr: HR_QUIZ_EXTRA };
  const extra = extraMap[S.role] || null;
  return buildQuizWithPools(base, extra);
}

function getWeights() {
  // Role-specific 8-dimension weights
  const weightsMap = {
    pm: {prompt:18, tools:12, data:24, content:14, dev:5, workflow:13, security:6, strategy:8},
    dev: {prompt:14, tools:18, data:12, content:6, dev:24, workflow:10, security:8, strategy:8},
    ops: {prompt:16, tools:12, data:24, content:16, dev:4, workflow:14, security:6, strategy:8},
    sales: {prompt:14, tools:12, data:18, content:14, dev:4, workflow:14, security:10, strategy:14},
    hr: {prompt:14, tools:12, data:14, content:14, dev:4, workflow:14, security:16, strategy:12},
  };
  const base = weightsMap[S.role] || weightsMap.pm;
  // Apply industry modifiers for PM
  if (S.role === 'pm') {
    const mods = {
      mfg: {data:30, workflow:16},
      finance: {security:18, data:22, strategy:12},
      auto: {data:26, dev:10, security:8},
      cpg: {content:20, data:22, strategy:10},
    };
    const mod = mods[S.industry] || {};
    let result = {};
    for (let k of Object.keys(base)) result[k] = mod[k] || base[k];
    let total = Object.values(result).reduce((a,b)=>a+b,0);
    for (let k of Object.keys(result)) result[k] = Math.round(result[k]/total*100);
    return result;
  }
  // For non-PM roles, just normalize base weights
  let total = Object.values(base).reduce((a,b)=>a+b,0);
  let result = {};
  for (let k of Object.keys(base)) result[k] = Math.round(base[k]/total*100);
  return result;
}

function renderQuiz() {
  if (!S._quizDims) { startAdaptiveQuiz(); }
  const dimKey = S._quizDims[S.quizIdx];
  const dimInfo = DIMS[dimKey];
  const q = getCurrentQuestion();
  if (!q) return '<div class="card">加载中...</div>';

  const hasAnswered = S.quizAnswers[dimKey] !== undefined;
  const displayLevel = hasAnswered ? (S._quizCurrentLevel[dimKey] || 0) : 0;
  const levelNames = ['初阶','中阶','高阶'];
  const totalDims = S._quizDims.length;
  const dimIdx = S.quizIdx;
  const sel = S._quizSelected ? S._quizSelected[dimKey] : undefined;
  const hasSelected = sel !== undefined;

  // Progress dots
  let dots = '';
  for (let i=0; i<totalDims; i++) {
    let cls = i < dimIdx ? 'done' : (i === dimIdx ? 'current' : '');
    dots += `<div class="quiz-dot ${cls}"></div>`;
  }

  // Title with navigation
  let h = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;cursor:pointer;" onclick="stopVoice(); S.view='industry'; S._quizDims=null; render();">
    <span style="font-size:13px;color:var(--text2);">← 返回重选</span>
    <span style="font-size:12px;color:var(--text2);">${dimIdx+1}/${totalDims}</span>
  </div>`;

  h += `<div class="quiz-dots">${dots}</div>`;
  h += `<div class="card slide-up">`;
  h += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
    <span style="font-size:22px;">${dimInfo.icon}</span>
    <span style="font-size:18px;font-weight:700;">${dimInfo.name}</span>
    <span class="tag tag-blue">${levelNames[displayLevel]}</span>
    ${hasAnswered ? '<span class="tag tag-amber">已调整难度</span>' : ''}
  </div>`;
  h += `<p style="font-size:13px;color:var(--text2);margin-bottom:16px;">${q.scenario}</p>`;

  // Question
  h += `<p style="font-weight:600;margin-bottom:10px;">${q.q}</p>`;

  // Options
  q.opts.forEach((o, i) => {
    let cls = 'quiz-option';
    if (sel !== undefined && sel === i) cls += ' selected';
    h += `<button class="${cls}" onclick="answerCurrentQuestion(${i})">${o}</button>`;
  });

  // Explanation (only show if answered)
  if (hasSelected && q.explain) {
    h += `<div class="highlight" style="margin-top:12px;">
      <div style="font-weight:600;color:var(--green);margin-bottom:4px;">💡 解析</div>
      <div style="font-size:13px;color:var(--text2);">${q.explain}</div>
    </div>`;
  }

  // Navigation
  h += `<div class="flex-between mt-4">
    <button class="btn btn-outline" ${dimIdx===0?'disabled':''} onclick="if(S.quizIdx>0){S.quizIdx--;render();}">← 上一维度</button>
    <span style="font-size:13px;color:${hasSelected?'var(--text2)':'var(--red)'};">${Object.keys(S.quizAnswers).length}/${totalDims} 已完成${hasSelected?'':'（请选择）'}</span>`;
  if (dimIdx >= totalDims - 1) {
    h += `<button class="btn btn-primary" ${hasSelected?'':'disabled'} onclick="adaptLevelForCurrentDim(); finishAdaptiveQuiz();">📊 查看结果</button>`;
  } else {
    h += `<button class="btn btn-primary" ${hasSelected?'':'disabled'} onclick="adaptLevelForCurrentDim(); S.quizIdx++; render();">下一维度 →</button>`;
  }
  h += `</div></div>`;
  return h;
}

function renderSlideHTML(idx) {
  const slide = getSlides()[idx];
  let cls = idx === S.courseSlide ? 'active' : '';
  let h = `<div class="slide ${cls}" id="slide-${idx}">`;

  switch (slide.type) {
    case 'cover':
      h += `<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:380px;text-align:center;">
        <div style="font-size:48px;margin-bottom:16px;">${(IND_INFO[S.industry]||{}).icon||'🎓'}</div>
        <h3 style="font-size:24px;text-align:center;">${slide.title}</h3>
        ${slide.subtitle ? `<p style="font-size:16px;color:var(--blue);margin-top:8px;">${slide.subtitle}</p>` : ''}
      </div>`;
      break;

    case 'content':
      h += `<h3>${slide.title}</h3>`;
      h += `<ul>`;
      for (const item of slide.content) {
        h += `<li style="${item.hl ? 'color:var(--blue);font-weight:600;' : ''}">${item.txt}</li>`;
      }
      h += `</ul>`;
      break;

    case 'tools':
      h += `<h3>${slide.title}</h3>`;
      h += `<div style="display:grid;gap:12px;">`;
      for (const item of slide.content) {
        h += `<div class="highlight"><strong>${item.tool}</strong><br><span style="font-size:13px;color:var(--text2);">${item.use}</span></div>`;
      }
      h += `</div>`;
      break;

    case 'case':
      h += `<h3>${slide.title}</h3>`;
      if (slide.subtitle) h += `<p style="color:var(--blue);font-weight:600;margin-bottom:8px;">${slide.subtitle}</p>`;
      for (const item of slide.content) {
        h += `<div style="margin-bottom:10px;"><span class="tag tag-blue">${item.label}</span><p style="margin-top:4px;font-size:14px;color:var(--text);">${item.txt}</p></div>`;
      }
      break;

    case 'code':
      h += `<h3>${slide.title}</h3>`;
      if (slide.subtitle) h += `<p style="color:var(--blue);font-weight:600;margin-bottom:8px;">${slide.subtitle}</p>`;
      h += `<pre style="background:#1e293b;color:#e2e8f0;padding:16px;border-radius:8px;font-size:12px;line-height:1.6;overflow-x:auto;max-height:300px;overflow-y:auto;">${slide.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`;
      break;

    case 'roadmap':
      h += `<h3>${slide.title}</h3>`;
      h += `<div style="display:grid;gap:16px;">`;
      for (const item of slide.content) {
        h += `<div class="highlight"><strong>${item.phase}</strong><br><span style="font-size:13px;color:var(--text2);">${item.tasks}</span></div>`;
      }
      h += `</div>`;
      break;

    case 'summary':
      h += `<h3>${slide.title}</h3>`;
      h += `<ul>`;
      for (const txt of slide.content) {
        h += `<li>${txt}</li>`;
      }
      h += `</ul>`;
      break;
  }

  h += `</div>`;
  return h;
}

function renderSlide() {
  const viewer = document.getElementById('slideViewer');
  if (!viewer) return;
  const slides = viewer.querySelectorAll('.slide');
  slides.forEach((s, i) => {
    s.className = 'slide' + (i === S.courseSlide ? ' active' : '');
    if (i === S.courseSlide) {
      s.style.animation = 'none';
      s.offsetHeight; // trigger reflow
      s.style.animation = 'fadeSlide .4s';
    }
  });
}

    </div>
    <select class="voice-select" onchange="changeVoice(this.value)" title="切换语音">
      <option value="">语音选择</option>
    </select>
  `;
}

function renderPlayerBar() {
  const bar = document.getElementById('playerBar');
  if (bar) bar.innerHTML = renderPlayerBarHTML();
}

function bindSlideEvents() {
  // Initialize voice list
  if (window.speechSynthesis) {
    // Load voices (async on some browsers)
    speechSynthesis.onvoiceschanged = () => {
      const select = document.querySelector('.voice-select');
      if (select) {
        const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('zh'));
        select.innerHTML = '<option value="">语音选择</option>';
        voices.forEach(v => {
          select.innerHTML += `<option value="${v.name}" ${v.default?'selected':''}>${v.name} (${v.lang})</option>`;
        });
      }
    };
  }
}

function prevSlide() {
  if (S.courseSlide > 0) {
    stopVoice();
    S.courseSlide--;
    S.isPlaying = false;
    renderSlide();
    renderPlayerBar();
  }
}

function nextSlide() {
  if (S.courseSlide < getSlides().length - 1) {
    stopVoice();
    S.courseSlide++;
    S.isPlaying = false;
    renderSlide();
    renderPlayerBar();
  }
}

function seekSlide(event) {
  const track = event.currentTarget;
  const rect = track.getBoundingClientRect();
  const pct = (event.clientX - rect.left) / rect.width;
  const newIdx = Math.round(pct * (getSlides().length - 1));
  if (newIdx !== S.courseSlide) {
    stopVoice();
    S.courseSlide = newIdx;
    S.isPlaying = false;
    renderSlide();
    renderPlayerBar();
  }
}

function changeVoice(name) {
  // Just store preference
  localStorage.setItem('aidax_pref_voice', name);
}

// ==================== RADAR CHART ====================
function initRadarChart() {
  const canvas = document.getElementById('radarChart');
  if (!canvas || !S._quizResult) return;
  const ctx = canvas.getContext('2d');
  const r = S._quizResult;
  const dims = DIM_ORDER;
  const n = dims.length;
  const cx = 180, cy = 180, radius = 140;

  ctx.clearRect(0, 0, 360, 360);

  // Draw grid circles
  for (let lvl = 1; lvl <= 4; lvl++) {
    const r2 = radius * lvl / 4;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const angle = Math.PI * 2 * i / n - Math.PI / 2;
      const x = cx + r2 * Math.cos(angle);
      const y = cy + r2 * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Draw axis lines
  const points = [];
  for (let i = 0; i < n; i++) {
    const angle = Math.PI * 2 * i / n - Math.PI / 2;
    const x = cx + radius * Math.cos(angle);
    const y = cy + radius * Math.sin(angle);
    points.push({x, y, angle});
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Label
    const lx = cx + (radius + 18) * Math.cos(angle);
    const ly = cy + (radius + 18) * Math.sin(angle);
    ctx.fillStyle = '#64748b';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(DIMS[dims[i]].short, lx, ly);
  }

  // Draw data polygon
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const score = (r.dimScores[dims[i]] || 0) / 4;
    const x = cx + radius * score * Math.cos(points[i].angle);
    const y = cy + radius * score * Math.sin(points[i].angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(37, 99, 235, 0.15)';
  ctx.fill();
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw data points
  for (let i = 0; i < n; i++) {
    const score = (r.dimScores[dims[i]] || 0) / 4;
    const x = cx + radius * score * Math.cos(points[i].angle);
    const y = cy + radius * score * Math.sin(points[i].angle);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    const pct = Math.round(score * 100);
    ctx.fillStyle = pct >= 75 ? '#059669' : pct >= 40 ? '#d97706' : '#dc2626';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Score label
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText(pct + '%', x + 12, y - 6);
  }
}

S.industry = 'mfg';
S.role = 'pm';

// Load voices early

render();
